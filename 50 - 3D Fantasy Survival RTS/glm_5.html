<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crystal Realms - Fantasy Survival RTS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @font-face {
            font-family: 'GameFont';
            src: local('Segoe UI'), local('Arial');
        }
        
        body {
            overflow: hidden;
            background: #0a0a12;
            font-family: 'GameFont', sans-serif;
            user-select: none;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        canvas { display: block; }
        
        /* UI Base Styles */
        .ui-panel {
            position: absolute;
            background: linear-gradient(135deg, rgba(20,18,28,0.95) 0%, rgba(35,30,45,0.92) 100%);
            border: 1px solid rgba(180,160,120,0.4);
            border-radius: 8px;
            color: #e8e0d0;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        /* Top Resources Bar */
        #top-bar {
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            display: flex;
            gap: 28px;
            align-items: center;
            z-index: 100;
        }
        
        .resource-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .resource-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        
        .icon-gold { background: linear-gradient(135deg, #ffd700, #b8860b); }
        .icon-wood { background: linear-gradient(135deg, #8b5a2b, #654321); }
        .icon-food { background: linear-gradient(135deg, #90EE90, #228B22); }
        .icon-crystal { background: linear-gradient(135deg, #00ced1, #006994); }
        .icon-pop { background: linear-gradient(135deg, #dda0dd, #8b008b); }
        
        /* Bottom Build Panel */
        #build-panel {
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
            max-width: 90vw;
            overflow-x: auto;
        }
        
        .build-btn {
            min-width: 72px;
            padding: 10px 14px;
            background: linear-gradient(145deg, rgba(60,55,75,0.9), rgba(40,38,52,0.95));
            border: 1px solid rgba(150,140,110,0.35);
            border-radius: 6px;
            color: #d0c8b8;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .build-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, rgba(80,75,100,0.95), rgba(55,52,70,0.98));
            border-color: rgba(200,180,130,0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .build-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .build-btn.selected {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255,215,0,0.3);
        }
        
        .btn-icon { font-size: 22px; line-height: 1; }
        .btn-name { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }
        .btn-cost { font-size: 9px; color: #a09888; }
        
        /* Side Info Panel */
        #info-panel {
            top: 70px;
            right: 16px;
            width: 220px;
            padding: 14px;
            z-index: 100;
        }
        
        .panel-title {
            font-size: 13px;
            font-weight: 700;
            color: #c9a84c;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(200,170,100,0.25);
            padding-bottom: 6px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 12px;
        }
        
        .stat-label { color: #a09888; }
        .stat-value { color: #e8e0d0; font-weight: 600; }
        
        /* Minimap */
        #minimap {
            bottom: 90px;
            right: 16px;
            width: 160px;
            height: 160px;
            z-index: 100;
            overflow: hidden;
            border-radius: 8px;
            padding: 4px;
        }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: #1a1820;
        }
        
        /* Time Display */
        #time-display {
            position: absolute;
            top: 12px;
            left: 16px;
            padding: 8px 16px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .day-indicator {
            font-size: 11px;
            color: #a09888;
        }
        
        .time-bar {
            width: 100px;
            height: 6px;
            background: rgba(0,0,0,0.4);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .time-fill {
            height: 100%;
            background: linear-gradient(90deg, #f39c12, #f1c40f);
            transition: width 0.5s ease;
            border-radius: 3px;
        }
        
        .time-fill.night {
            background: linear-gradient(90deg, #3498db, #2980b9);
        }
        
        /* Unit Selection Panel */
        #selection-panel {
            bottom: 90px;
            left: 16px;
            width: 240px;
            padding: 12px;
            z-index: 100;
            display: none;
        }
        
        #selection-panel.visible { display: block; }
        
        .unit-info {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        .unit-portrait {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, rgba(80,75,100,0.8), rgba(50,47,62,0.9));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .unit-details { flex: 1; }
        
        .unit-name { font-size: 13px; font-weight: 700; color: #c9a84c; }
        .unit-type { font-size: 11px; color: #888; }
        
        .health-bar {
            height: 8px;
            background: rgba(0,0,0,0.4);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 6px;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            transition: width 0.2s ease;
        }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .action-btn {
            padding: 6px 12px;
            background: linear-gradient(145deg, rgba(70,65,85,0.9), rgba(45,42,58,0.95));
            border: 1px solid rgba(150,140,110,0.3);
            border-radius: 4px;
            color: #d0c8b8;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        
        .action-btn:hover {
            background: linear-gradient(145deg, rgba(90,85,110,0.95), rgba(60,57,75,0.98));
            border-color: rgba(200,180,130,0.5);
        }
        
        /* Alert System */
        #alert-container {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        
        .alert {
            padding: 10px 20px;
            background: linear-gradient(135deg, rgba(180,60,60,0.95), rgba(140,40,40,0.98));
            border: 1px solid rgba(255,100,100,0.4);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            animation: alertIn 0.3s ease, alertOut 0.3s ease 2.7s forwards;
            white-space: nowrap;
        }
        
        .alert.info {
            background: linear-gradient(135deg, rgba(60,100,180,0.95), rgba(40,70,140,0.98));
            border-color: rgba(100,150,255,0.4);
        }
        
        .alert.success {
            background: linear-gradient(135deg, rgba(60,150,80,0.95), rgba(40,120,60,0.98));
            border-color: rgba(100,200,120,0.4);
        }
        
        @keyframes alertIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes alertOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        
        /* Victory / Defeat Screen */
        #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10,10,20,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 500;
        }
        
        #end-screen.visible { display: flex; }
        
        .end-title {
            font-size: 56px;
            font-weight: 900;
            margin-bottom: 16px;
            text-shadow: 0 4px 20px currentColor;
        }
        
        .end-title.victory { color: #ffd700; }
        .end-title.defeat { color: #c0392b; }
        
        .end-stats {
            font-size: 16px;
            color: #a09888;
            margin-bottom: 32px;
            text-align: center;
            line-height: 1.8;
        }
        
        .restart-btn {
            padding: 14px 36px;
            background: linear-gradient(145deg, #c9a84c, #a07830);
            border: none;
            border-radius: 8px;
            color: #1a1520;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .restart-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 25px rgba(201,168,76,0.4);
        }
        
        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0d0b14 0%, #1a1525 50%, #12101a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 500;
        }
        
        #start-screen.hidden { display: none; }
        
        .game-logo {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        
        .game-subtitle {
            font-size: 16px;
            color: #807060;
            margin-bottom: 48px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .difficulty-select {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .diff-btn {
            padding: 12px 24px;
            background: linear-gradient(145deg, rgba(50,45,65,0.9), rgba(35,32,48,0.95));
            border: 1px solid rgba(150,140,110,0.3);
            border-radius: 6px;
            color: #c0b8a8;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .diff-btn:hover, .diff-btn.selected {
            background: linear-gradient(145deg, rgba(80,75,105,0.95), rgba(55,52,72,0.98));
            border-color: #c9a84c;
            color: #fff;
        }
        
        .start-btn {
            padding: 16px 48px;
            background: linear-gradient(145deg, #e67e22, #d35400);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
        }
        
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(230,126,34,0.4);
        }
        
        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #c9a84c;
            font-size: 18px;
            z-index: 400;
        }
        
        /* Tooltip */
        .tooltip {
            position: absolute;
            background: rgba(20,18,28,0.97);
            border: 1px solid rgba(180,160,120,0.5);
            border-radius: 6px;
            padding: 10px 14px;
            color: #e8e0d0;
            font-size: 12px;
            max-width: 220px;
            pointer-events: none;
            z-index: 300;
            display: none;
            line-height: 1.5;
        }
        
        /* Wave indicator */
        #wave-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            font-weight: 900;
            color: #e74c3c;
            text-shadow: 0 4px 20px rgba(231,76,60,0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 250;
            letter-spacing: 4px;
        }

        /* Hero ability bar */
        #ability-bar {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 10px 16px;
            z-index: 100;
            display: none;
        }

        #ability-bar.visible { display: flex; }

        .ability-slot {
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, rgba(50,45,65,0.9), rgba(30,28,40,0.95));
            border: 2px solid rgba(150,140,110,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .ability-slot:hover:not(.cooldown) {
            border-color: #9b59b6;
            transform: translateY(-3px);
        }

        .ability-slot.cooldown {
            opacity: 0.5;
        }

        .ability-cooldown {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 10px;
            color: #fff;
            background: rgba(0,0,0,0.7);
            padding: 1px 4px;
            border-radius: 3px;
        }

        .ability-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <!-- Start Screen -->
    <div id="start-screen">
        <div class="game-logo">Crystal Realms</div>
        <div class="game-subtitle">Fantasy Survival RTS</div>
        <div class="difficulty-select">
            <button class="diff-btn selected" data-diff="easy">Easy</button>
            <button class="diff-btn" data-diff="normal">Normal</button>
            <button class="diff-btn" data-diff="hard">Hard</button>
        </div>
        <button class="start-btn" id="start-game">Begin Conquest</button>
    </div>
    
    <!-- Loading -->
    <div id="loading">Forging the Realm...</div>
    
    <!-- End Screen -->
    <div id="end-screen">
        <div class="end-title"></div>
        <div class="end-stats"></div>
        <button class="restart-btn" id="restart-btn">Battle Again</button>
    </div>
    
    <!-- UI Panels -->
    <div id="time-display" class="ui-panel">
        <span class="day-indicator">Day <span id="day-num">1</span></span>
        <div class="time-bar"><div class="time-fill" id="time-fill"></div></div>
    </div>
    
    <div id="top-bar" class="ui-panel">
        <div class="resource-item">
            <div class="resource-icon icon-gold">&#9679;</div>
            <span id="res-gold">100</span>
        </div>
        <div class="resource-item">
            <div class="resource-icon icon-wood">&#9632;</div>
            <span id="res-wood">80</span>
        </div>
        <div class="resource-item">
            <div class="resource-icon icon-food">&#9832;</div>
            <span id="res-food">50</span>
        </div>
        <div class="resource-item">
            <div class="resource-icon icon-crystal">&#9670;</div>
            <span id="res-crystal">0</span>
        </div>
        <div class="resource-item">
            <div class="resource-icon icon-pop">&#9787;</div>
            <span><span id="cur-pop">3</span>/<span id="max-pop">10</span></span>
        </div>
    </div>
    
    <div id="build-panel" class="ui-panel"></div>
    
    <div id="info-panel" class="ui-panel">
        <div class="panel-title">Kingdom Status</div>
        <div class="stat-row">
            <span class="stat-label">Wave</span>
            <span class="stat-value" id="wave-num">0/10</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Next Attack</span>
            <span class="stat-value" id="next-wave">Preparing...</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Units</span>
            <span class="stat-value" id="unit-count">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Buildings</span>
            <span class="stat-value" id="building-count">1</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Kills</span>
            <span class="stat-value" id="kill-count">0</span>
        </div>
    </div>
    
    <div id="minimap" class="ui-panel">
        <canvas id="minimap-canvas"></canvas>
    </div>
    
    <div id="selection-panel" class="ui-panel">
        <div class="panel-title">Selected</div>
        <div class="unit-info">
            <div class="unit-portrait" id="sel-portrait">&#9876;</div>
            <div class="unit-details">
                <div class="unit-name" id="sel-name">Unit</div>
                <div class="unit-type" id="sel-type">Type</div>
                <div class="health-bar">
                    <div class="health-fill" id="sel-health" style="width:100%"></div>
                </div>
                <div style="font-size:10px;color:#888;margin-top:2px;" id="sel-hp-text">100/100 HP</div>
            </div>
        </div>
        <div class="action-buttons" id="action-buttons"></div>
    </div>
    
    <div id="alert-container"></div>
    <div id="wave-indicator"></div>
    
    <div id="ability-bar" class="ui-panel"></div>
    
    <div class="tooltip" id="tooltip"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

            ENEMIES: {

        // ============ TERRAIN GENERATION ============
        let heightMap = [];
        
        function generateTerrain() {
            // Create heightmap using simple noise
            const size = CONFIG.GRID_SIZE;
            heightMap = [];
            
            for (let x = 0; x < size; x++) {
                heightMap[x] = [];
                for (let z = 0; z < size; z++) {
                    let h = 0;
                    h += Math.sin(x * 0.15) * Math.cos(z * 0.15) * 2;
                    h += Math.sin(x * 0.08 + 1) * Math.cos(z * 0.1) * 3;
                    h += ((Math.random() - 0.5) * 0.5);
                    
                    // Flatten center area for base
                    const cx = size/2, cz = size/2;
                    const distFromCenter = Math.sqrt((x-cx)**2 + (z-cz)**2);
                    if (distFromCenter < 8) h *= distFromCenter / 8;
                    
                    heightMap[x][z] = h;
                }
            }

            // Create ground mesh
            const geometry = new THREE.PlaneGeometry(CONFIG.MAP_SIZE, CONFIG.MAP_SIZE, size-1, size-1);
            geometry.rotateX(-Math.PI / 2);
            
            const positions = geometry.attributes.position.array;
            const colors = new Float32Array(positions.length);
            
            for (let i = 0; i < positions.length; i += 3) {
                const x = Math.round((positions[i] + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                const z = Math.round((positions[i+2] + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                
                if (x >= 0 && x < size && z >= 0 && z < size) {
                    positions[i+1] = heightMap[x][z];
                    
                    // Vertex coloring based on height
                    const h = heightMap[x][z];
                    let r, g, b;
                    if (h < -1) {
                        // Water/shore
                        r = 0.2 + (h + 3) * 0.1;
                        g = 0.4 + (h + 3) * 0.1;
                        b = 0.25;
                    } else if (h < 1) {
                        // Grass
                        const v = Math.random();
                        r = 0.25 + v * 0.08;
                        g = 0.45 + v * 0.1;
                        b = 0.2 + v * 0.05;
                    } else if (h < 2.5) {
                        // High grass/light
                        r = 0.35;
                        g = 0.55;
                        b = 0.25;
                    } else {
                        // Rock
                        r = 0.45 + Math.random() * 0.1;
                        g = 0.42 + Math.random() * 0.1;
                        b = 0.4 + Math.random() * 0.1;
                    }
                    
                    colors[i] = r;
                    colors[i+1] = g;
                    colors[i+2] = b;
                }
            }
            
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.85,
                metalness: 0.05,
                flatShading: false
            });
            
            groundMesh = new THREE.Mesh(geometry, material);
            groundMesh.receiveShadow = true;
            groundMesh.userData.isGround = true;
            scene.add(groundMesh);

            // Add decorative elements
            addTerrainDetails(size);
            addWater();
            addSky();
        }

        function addTerrainDetails(size) {
            // Trees
            for (let i = 0; i < 80; i++) {
                const x = (Math.random() - 0.5) * (CONFIG.MAP_SIZE - 15);
                const z = (Math.random() - 0.5) * (CONFIG.MAP_SIZE - 15);
                
                // Avoid center area
                if (Math.abs(x) < 12 && Math.abs(z) < 12) continue;
                
                const gx = Math.round((x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                const gz = Math.round((z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                
                if (gx >= 0 && gx < size && gz >= 0 && gz < size && heightMap[gx][gz] > -0.5) {
                    createTree(x, heightMap[gx][gz], z);
                }
            }
            
            // Rocks
            for (let i = 0; i < 40; i++) {
                const x = (Math.random() - 0.5) * CONFIG.MAP_SIZE;
                const z = (Math.random() - 0.5) * CONFIG.MAP_SIZE;
                const gx = Math.round((x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                const gz = Math.round((z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                
                if (gx >= 0 && gx < size && gz >= 0 && gz < size && heightMap[gx][gz] > 1) {
                    createRock(x, heightMap[gx][gz], z, 0.5 + Math.random());
                }
            }
            
            // Crystal deposits
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + Math.random() * 0.5;
                const dist = 20 + Math.random() * 12;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                createCrystalDeposit(x, 0, z);
            }
        }

        function createTree(x, y, z) {
            const group = new THREE.Group();
            
            // Trunk
            const trunkGeo = new THREE.CylinderGeometry(0.15, 0.25, 1.5, 6);
            const trunkMat = new THREE.MeshStandardMaterial({ 
                color: 0x6B4423, roughness: 0.9 
            });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 0.75;
            trunk.castShadow = true;
            group.add(trunk);
            
            // Foliage layers
            const foliageMat = new THREE.MeshStandardMaterial({ 
                color: new THREE.Color().setHSL(0.28 + Math.random() * 0.06, 0.65, 0.32),
                roughness: 0.8
            });
            
            const sizes = [1.2, 0.9, 0.6];
            sizes.forEach((size, i) => {
                const foliageGeo = new THREE.ConeGeometry(size, 1.3, 7);
                const foliage = new THREE.Mesh(foliageGeo, foliageMat);
                foliage.position.y = 1.8 + i * 0.7;
                foliage.rotation.y = Math.random() * Math.PI;
                foliage.castShadow = true;
                group.add(foliage);
            });
            
            group.position.set(x, y, z);
            group.scale.setScalar(0.8 + Math.random() * 0.4);
            group.userData.isTree = true;
            scene.add(group);
        }

        function createRock(x, y, z, scale) {
            const geo = new THREE.DodecahedronGeometry(scale, 1);
            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(0, 0, 0.4 + Math.random() * 0.15),
                roughness: 0.9,
                metalness: 0.1
            });
            const rock = new THREE.Mesh(geo, mat);
            rock.position.set(x, y + scale * 0.4, z);
            rock.rotation.set(Math.random(), Math.random(), Math.random());
            rock.castShadow = true;
            rock.receiveShadow = true;
            rock.userData.isObstacle = true;
            scene.add(rock);
        }

        function createCrystalDeposit(x, y, z) {
            const group = new THREE.Group();
            const count = 3 + Math.floor(Math.random() * 4);
            
            for (let i = 0; i < count; i++) {
                const h = 0.6 + Math.random() * 1.2;
                const geo = new THREE.ConeGeometry(0.2 + Math.random() * 0.2, h, 5);
                const mat = new THREE.MeshStandardMaterial({
                    color: PALETTE.crystal,
                    emissive: 0x00aabb,
                    emissiveIntensity: 0.3,
                    transparent: true,
                    opacity: 0.85
                });
                const crystal = new THREE.Mesh(geo, mat);
                crystal.position.set(
                    (Math.random() - 0.5) * 1.5,
                    h / 2,
                    (Math.random() - 0.5) * 1.5
                );
                crystal.rotation.z = (Math.random() - 0.5) * 0.4;
                group.add(crystal);
            }
            
            group.position.set(x, y, z);
            group.userData.isResourceNode = true;
            group.userData.resourceType = 'crystal';
            scene.add(group);
        }

        function addWater() {
            const waterGeo = new THREE.PlaneGeometry(CONFIG.MAP_SIZE * 1.5, CONFIG.MAP_SIZE * 1.5);

            // Sun/Moon sphere
            const sunGeo = new THREE.SphereGeometry(3, 16, 16);

            });

        // ============ BUILDING SYSTEM ============
        function createBuilding(type, x, z, isPlayer = true) {
            const config = CONFIG.BUILDINGS[type];
            const group = new THREE.Group();
            
            group.userData = {
                type: type,
                config: config,
                hp: config.hp,
                maxHp: config.hp,
                isPlayer: isPlayer,
                lastActionTime: 0
            };
            
            switch(type) {
                case 'townhall':
                    createTownHall(group);
                    break;
                case 'farm':
                    createFarm(group);
                    break;
                case 'lumbermill':
                    createLumberMill(group);
                    break;
                case 'goldmine':
                    createGoldMine(group);
                    break;
                case 'tower':
                    createTower(group, isPlayer ? PALETTE.playerBlue : PALETTE.enemyRed);
                    break;
                case 'barracks':
                    createBarracks(group);
                    break;
                case 'archery':
                    createArcheryRange(group);
                    break;
                case 'magetower':
                    createMageTower(group);
                    break;
                case 'wall':
                    createWall(group, isPlayer);
                    break;
                case 'house':
                    createHouse(group);
                    break;
                case 'shrine':
                    createShrine(group);
                    break;
            }
            
            // Get height at position
            const gx = Math.round((x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const gz = Math.round((z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const y = (gx >= 0 && gx < CONFIG.GRID_SIZE && gz >= 0 && gz < CONFIG.GRID_SIZE) 
                ? heightMap[gx][gz] : 0;
            
            group.position.set(x, y, z);
            scene.add(group);
            
            return group;
        }

        // ============ UNIT SYSTEM ============
        function createUnit(type, x, z, isPlayer = true) {
            const config = CONFIG.UNITS[type];
            if (!config) return null;
            
            const group = new THREE.Group();
            group.userData = {
                type: type,
                config: config,
                hp: config.hp,
                maxHp: config.hp,
                isPlayer: isPlayer,
                targetPos: new THREE.Vector3(x, 0, z),
                state: 'idle',
                attackTarget: null,
                lastAttackTime: 0,
                formationOffset: new THREE.Vector3()
            };
            
            createUnitModel(group, type, isPlayer);
            
            // Get terrain height
            const gx = Math.round((x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const gz = Math.round((z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const y = (gx >= 0 && gx < CONFIG.GRID_SIZE && gz >= 0 && gz < CONFIG.GRID_SIZE) 
                ? heightMap[gx][gz] : 0;
            
            group.position.set(x, y, z);
            scene.add(group);
            
            return group;
        }

        function createEnemy(type, x, z) {
            const config = CONFIG.ENEMIES[type];
            const diffMod = CONFIG.DIFFICULTY[gameState.difficulty];
            
            const group = new THREE.Group();
            group.userData = {
                isEnemy: true,
                type: type,
                config: config,
                hp: Math.floor(config.hp * diffMod.enemyHP),
                maxHp: Math.floor(config.hp * diffMod.enemyHP),
                targetPos: new THREE.Vector3(0, 0, 0), // Move toward center/base
                state: 'move_to_base',
                attackTarget: null,
                lastAttackTime: 0,
                pathIndex: 0
            };
            
            createEnemyModel(group, type);
            
            const gx = Math.round((x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const gz = Math.round((z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
            const y = (gx >= 0 && gx < CONFIG.GRID_SIZE && gz >= 0 && gz < CONFIG.GRID_SIZE) 
                ? heightMap[gx][gz] : 0;
            
            group.position.set(x, y, z);
            scene.add(group);
            
            gameState.enemyUnits.push(group);
            return group;
        }

        // ============ PARTICLE SYSTEM ============
        function createParticle(pos, type, options = {}) {
            let particle;
            const life = options.life || 1;
            
            switch(type) {
                case 'hit': {
                    const geo = new THREE.SphereGeometry(0.15, 8, 8);
                    const mat = new THREE.MeshBasicMaterial({ 
                        color: options.color || 0xffcc00,
                        transparent: true
                    });
                    particle = new THREE.Mesh(geo, mat);
                    particle.position.copy(pos);
                    particle.userData = { 
                        velocity: new THREE.Vector3(
                            (Math.random()-0.5)*3,
                            Math.random()*4,
                            (Math.random()-0.5)*3
                        ),
                        life: life,
                        maxLife: life,
                        type: 'spark'
                    };
                    break;
                }
                case 'death': {
                    const group = new THREE.Group();
                    group.position.copy(pos);
                    for (let i = 0; i < 8; i++) {
                        const p = new THREE.Mesh(
                            new THREE.BoxGeometry(0.1, 0.1, 0.1),
                            new THREE.MeshBasicMaterial({ 
                                color: options.color || 0x880000,
                                transparent: true
                            })
                        );
                        p.userData.velocity = new THREE.Vector3(
                            (Math.random()-0.5)*5,
                            Math.random()*4+2,
                            (Math.random()-0.5)*5
                        );
                        p.userData.life = life;
                        p.userData.maxLife = life;
                        group.add(p);
                    }
                    particle = group;
                    particle.userData = { life: life, maxLife: life, type: 'death_pile' };
                    break;
                }
                case 'build': {
                    const geo = new THREE.RingGeometry(0.1, 0.5, 16);
                    const mat = new THREE.MeshBasicMaterial({ 
                        color: 0x44ff44,
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                    particle = new THREE.Mesh(geo, mat);
                    particle.position.copy(pos);
                    particle.position.y += 0.5;
                    particle.userData = { life: 1.5, maxLife: 1.5, type: 'ring' };
                    break;
                }
                case 'heal': {
                    const geo = new THREE.OctahedronGeometry(0.2);
                    const mat = new THREE.MeshBasicMaterial({ 
                        color: 0x44ff88,
                        transparent: true,
                        opacity: 0.8
                    });
                    particle = new THREE.Mesh(geo, mat);
                    particle.position.copy(pos);
                    particle.position.y += 1.5;
                    particle.userData = { 
                        life: 1, 
                        maxLife: 1, 
                        type: 'float_up',
                        baseY: pos.y + 1.5
                    };
                    break;
                }
                case 'fire': {
                    const geo = new THREE.ConeGeometry(0.3, 0.6, 6);
                    const mat = new THREE.MeshBasicMaterial({ 
                        color: 0xff6600,
                        transparent: true
                    });
                    particle = new THREE.Mesh(geo, mat);
                    particle.position.copy(pos);
                    particle.position.y += 0.8;
                    particle.userData = { life: 0.8, maxLife: 0.8, type: 'flame' };
                    break;
                }
                default: return;
            }
            
            scene.add(particle);
            gameState.particles.push(particle);
        }

        function updateParticles(dt) {
            for (let i = gameState.particles.length - 1; i >= 0; i--) {
                const p = gameState.particles[i];
                p.userData.life -= dt;
                
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    gameState.particles.splice(i, 1);
                    continue;
                }
                
                const ratio = p.userData.life / p.userData.maxLife;
                
                switch(p.userData.type) {
                    case 'spark':
                        p.position.addScaledVector(p.userData.velocity, dt);
                        p.userData.velocity.y -= 15 * dt;
                        p.scale.setScalar(ratio);
                        if (p.material) p.material.opacity = ratio;
                        break;
                    case 'death_pile':
                        p.children.forEach(child => {
                            child.position.addScaledVector(child.userData.velocity, dt);
                            child.userData.velocity.y -= 10 * dt;
                            child.scale.setScalar(ratio);
                            if (child.material) child.material.opacity = ratio;
                        });
                        break;
                    case 'ring':
                        p.scale.setScalar(1 + (1-ratio) * 3);
                        p.material.opacity = ratio;
                        p.rotation.z += dt * 5;
                        break;
                    case 'float_up':
                        p.position.y = p.userData.baseY + (1 - ratio) * 2;
                        p.rotation.y += dt * 3;
                        p.material.opacity = ratio;
                        p.scale.setScalar(ratio * 1.5);
                        break;
                    case 'flame':
                        p.scale.setScalar(ratio + Math.sin(Date.now() * 0.02) * 0.2);
                        p.material.opacity = ratio;
                        break;
                }
            }
        }

        // ============ PROJECTILES ============
        function fireProjectile(from, to, damage, owner, type = 'arrow') {
            let projectile;
            
            switch(type) {
                case 'arrow': {
                    const arrow = new THREE.Group();
                    const shaft = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.02, 0.01, 0.5, 6),
                        new THREE.MeshStandardMaterial({ color: 0x8B4513 })
                    );
                    shaft.rotation.z = Math.PI / 2;
                    arrow.add(shaft);
                    
                    const head = new THREE.Mesh(
                        new THREE.ConeGeometry(0.04, 0.15, 5),
                        new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.6 })
                    );
                    head.position.x = 0.3;
                    head.rotation.z = -Math.PI / 2;
                    arrow.add(head);
                    
                    const fletching = new THREE.Mesh(
                        new THREE.BoxGeometry(0.1, 0.08, 0.01),
                        new THREE.MeshStandardMaterial({ color: 0xcc3333 })
                    );
                    fletching.position.x = -0.22);
                    arrow.add(fletching);
                    
                    projectile = arrow;
                    break;
                }
                case 'magic': {
                    projectile = new THREE.Mesh(
                        new THREE.SphereGeometry(0.15, 12, 12),
                        new THREE.MeshBasicMaterial({ 
                            color: 0xaa44ff,
                            transparent: true,
                            opacity: 0.9
                        })
                    );
                    // Add trail
                    const trail = new THREE.PointLight(0xaa44ff, 0.5, 3);
                    projectile.add(trail);
                    break;
                }
                case 'tower': {
                    projectile = new THREE.Mesh(
                        new THREE.SphereGeometry(0.12, 8, 8),
                        new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                    );
                    break;
                }
                default: return;
            }
            
            projectile.position.copy(from);
            projectile.position.y += 1.2;
            
            projectile.userData = {
                target: to.clone(),
                speed: type === 'magic' ? 25 : 35,
                damage: damage,
                owner: owner,
                type: type,
                startTime: Date.now()
            };
            
            scene.add(projectile);
            gameState.projectiles.push(projectile);
        }

        function updateProjectiles(dt) {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const proj = gameState.projectiles[i];
                const ud = proj.userData;
                
                const direction = ud.target.clone().sub(proj.position).normalize();
                proj.position.addScaledVector(direction, ud.speed * dt);
                
                // Look at target
                if (ud.type === 'arrow') {
                    proj.lookAt(ud.target);
                }
                
                // Check if reached target
                const dist = proj.position.distanceTo(ud.target);
                if (dist < 0.5) {
                    // Hit!
                    if (ud.owner === 'player') {
                        // Find nearest enemy at target location
                        let hitEnemy = null;
                        let closestDist = 2;
                        gameState.enemyUnits.forEach(eu => {
                            const d = eu.position.distanceTo(proj.position);
                            if (d < closestDist) {
                                closestDist = d;
                                hitEnemy = eu;
                            }
                        });
                        
                        if (hitEnemy) {
                            dealDamage(hitEnemy, ud.damage);
                            createParticle(hitEnemy.position.clone(), 'hit', { color: 0xff4400 });
                        }
                    } else if (ud.owner === 'enemy') {
                        // Find nearest player unit/building
                        let hitTarget = null;
                        let closestDist = 2;
                        
                        gameState.playerUnits.forEach(pu => {
                            const d = pu.position.distanceTo(proj.position);
                            if (d < closestDist) {
                                closestDist = d;
                                hitTarget = pu;
                            }
                        });
                        
                        if (!hitTarget) {
                            gameState.buildings.forEach(b => {
                                if (b.userData.isPlayer) {
                                    const d = b.position.distanceTo(proj.position);
                                    if (d < closestDist + 1) {
                                        closestDist = d;
                                        hitTarget = b;
                                    }
                                }
                            });
                        }
                        
                        if (hitTarget) {
                            dealDamage(hitTarget, ud.damage);
                            createParticle(hitTarget.position.clone(), 'hit');
                        }
                    }
                    
                    scene.remove(proj);
                    gameState.projectiles.splice(i, 1);
                }
                
                // Timeout after distance
                if (proj.position.length() > 100) {
                    scene.remove(proj);
                    gameState.projectiles.splice(i, 1);
                }
            }
        }

        // ============ COMBAT & DAMAGE ============
        function dealDamage(target, amount) {
            if (!target || !target.userData) return;
            
            target.userData.hp -= amount;
            
            // Update health bar
            target.children.forEach(child => {
                if (child.userData && child.userData.isHealthBar) {
                    const pct = Math.max(0, target.userData.hp / target.userData.maxHp);
                    child.scale.x = Math.max(0.01, pct);
                    child.position.x = -(1 - pct) * 0.39;
                    
                    // Color based on HP level
                    if (pct < 0.3) {
                        child.material.color.setHex(0xcc0000);
                    } else if (pct < 0.6) {
                        child.material.color.setHex(0xccaa00);
                    }
                }
            });
            
            // Death check
            if (target.userData.hp <= 0) {
                killEntity(target);
            }
        }

        function killEntity(entity) {
            const isEnemy = entity.userData.isEnemy;
            const pos = entity.position.clone();
            
            createParticle(pos, 'death', { 
                color: isEnemy ? 0x550000 : 0x224488 
            });
            
            if (isEnemy) {
                const idx = gameState.enemyUnits.indexOf(entity);
                if (idx > -1) gameState.enemyUnits.splice(idx, 1);
                
                // Reward
                const config = entity.userData.config;
                if (config.reward) {
                    Object.entries(config.reward).forEach(([res, amt]) => {
                        if (gameState.resources[res] !== undefined) {
                            gameState.resources[res] += amt;
                        }
                    });
                    gameState.kills++;
                }
            } else if (entity.userData.type) {
                // Player unit or building death
                if (entity.userData.config && entity.userData.config.popCost) {
                    gameState.population.current -= entity.userData.config.popCost;
                }
                
                const idx = gameState.playerUnits.indexOf(entity);
                if (idx > -1) gameState.playerUnits.splice(idx, 1);
                
                const bIdx = gameState.buildings.indexOf(entity);
                if (bIdx > -1) {
                    gameState.buildings.splice(bIdx, 1);
                    
                    // Check if town hall destroyed
                    if (entity.userData.type === 'townhall') {
                        endGame(false);
                    }
                }
                
                // Deselect if selected
                const selIdx = gameState.selectedUnits.indexOf(entity);
                if (selIdx > -1) gameState.selectedUnits.splice(selIdx, 1);
            }
            
            scene.remove(entity);
            updateUI();
        }

        // ============ UNIT AI & MOVEMENT ============
        function updateUnits(dt) {
            const now = Date.now();
            
            // Player units
            gameState.playerUnits.forEach(unit => {
                const ud = unit.userData;
                if (!ud.config) return;
                
                // Health bars face camera
                unit.children.forEach(child => {
                    if (child.material && !child.geometry.type.includes('Box') && 
                        !child.geometry.type.includes('Capsule') &&
                        !child.geometry.type.includes('Sphere') &&
                        !child.geometry.type.includes('Cone') &&
                        !child.geometry.type.includes('Cylinder')) {
                        child.lookAt(camera.position);
                    }
                    if (child.userData && child.userData.isHealthBar) {
                        child.lookAt(camera.position);
                    }
                });
                
                // Animate rotating elements
                unit.traverse(obj => {
                    if (obj.userData && obj.userData.rotating) {
                        obj.rotation.y += dt * 8;
                    }
                });
                
                // Find nearest enemy as default target
                let nearestEnemy = null;
                let nearestDist = Infinity;
                
                gameState.enemyUnits.forEach(enemy => {
                    const d = unit.position.distanceTo(enemy.position);
                    if (d < nearestDist && d < 20) {
                        nearestDist = d;
                        nearestEnemy = enemy;
                    }
                });
                
                if (nearestEnemy && nearestDist <= (ud.config.range || 5)) {
                    // In range - attack
                    ud.state = 'attacking';
                    ud.attackTarget = nearestEnemy;
                    
                    // Face target
                    unit.lookAt(nearestEnemy.position.x, unit.position.y, nearestEnemy.position.z);
                    
                    if (now - ud.lastAttackTime > 1000) { // 1 second cooldown
                        if (ud.role === 'ranged' || ud.role === 'mage') {
                            fireProjectile(unit.position, nearestEnemy.position, ud.config.damage, 'player', 
                                ud.role === 'mage' ? 'magic' : 'arrow');
                        } else {
                            dealDamage(nearestEnemy, ud.config.damage);
                            createParticle(nearestEnemy.position.clone(), 'hit');
                        }
                        ud.lastAttackTime = now;
                    }
                } else if (ud.targetPos) {
                    // Move toward target
                    ud.state = 'moving';
                    const moveTarget = nearestEnemy && nearestDist < 15 ? nearestEnemy.position : ud.targetPos;
                    
                    const dir = new THREE.Vector3(
                        moveTarget.x - unit.position.x,
                        0,
                        moveTarget.z - unit.position.z
                    ).normalize();
                    
                    const speed = ud.config.speed * dt;
                    unit.position.addScaledVector(dir, speed);
                    
                    // Update Y to terrain
                    const gx = Math.round((unit.position.x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                    const gz = Math.round((unit.position.z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                    if (gx >= 0 && gx < CONFIG.GRID_SIZE && gz >= 0 && gz < CONFIG.GRID_SIZE) {
                        unit.position.y = heightMap[gx][gz];
                    }
                    
                    // Face movement direction
                    if (dir.length() > 0.01) {
                        unit.rotation.y = Math.atan2(dir.x, dir.z);
                    }
                } else {
                    ud.state = 'idle';
                }
                
                // Shrine healing
                if (ud.hp < ud.maxHp) {
                    gameState.buildings.forEach(building => {
                        if (building.userData.type === 'shrine' && building.userData.isPlayer) {
                            const dist = unit.position.distanceTo(building.position);
                            if (dist < building.userData.config.healRadius) {
                                ud.hp = Math.min(ud.maxHp, ud.hp + dt * 5);
                                if (Math.random() < 0.05) {
                                    createParticle(unit.position.clone(), 'heal');
                                }
                            }
                        }
                    });
                }
            });
            
            // Enemy units
            gameState.enemyUnits.forEach(enemy => {
                const ed = enemy.userData;
                
                // Health bar camera facing
                enemy.children.forEach(child => {
                    if (child.userData && child.userData.isHealthBar) {
                        child.lookAt(camera.position);
                    }
                });
                
                // Orbiting orbs animation
                enemy.children.forEach(child => {
                    if (child.userData && child.userData.orbitIndex !== undefined) {
                        const angle = Date.now() * 0.002 * child.userData.orbitSpeed + child.userData.orbitIndex * Math.PI * 2 / 3;
                        child.position.x = Math.cos(angle) * 0.5;
                        child.position.y = 1 + Math.sin(angle * 2) * 0.2;
                        child.position.z = Math.sin(angle) * 0.5;
                    }
                });
                
                // Find target (nearest player unit or building)
                let target = null;
                let targetDist = Infinity;
                
                // Prioritize units
                gameState.playerUnits.forEach(unit => {
                    const d = enemy.position.distanceTo(unit.position);
                    if (d < targetDist) {
                        targetDist = d;
                        target = unit;
                    }
                });
                
                // Check buildings too
                gameState.buildings.forEach(building => {
                    if (building.userData.isPlayer) {
                        const d = enemy.position.distanceTo(building.position);
                        if (d < targetDist) {
                            targetDist = d;
                            target = building;
                        }
                    }
                });
                
                if (target) {
                    ed.attackTarget = target;
                    
                    const range = ed.config.range || 1.5;
                    if (targetDist <= range) {
                        // Attack
                        enemy.lookAt(target.position.x, enemy.position.y, target.position.z);
                        
                        if (now - ed.lastAttackTime > 1500) {
                            if (ed.type === 'archer' || ed.type === 'mage') {
                                fireProjectile(enemy.position, target.position, ed.config.damage, 'enemy',
                                    ed.type === 'mage' ? 'magic' : 'arrow');
                            } else {
                                dealDamage(target, ed.config.damage);
                                createParticle(target.position.clone(), 'hit', { color: 0xff2200 });
                            }
                            ed.lastAttackTime = now;
                        }
                    } else {
                        // Move toward target
                        const dir = new THREE.Vector3(
                            target.position.x - enemy.position.x,
                            0,
                            target.position.z - enemy.position.z
                        ).normalize();
                        
                        enemy.position.addScaledVector(dir, ed.config.speed * dt);
                        
                        // Terrain height
                        const gx = Math.round((enemy.position.x + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                        const gz = Math.round((enemy.position.z + CONFIG.MAP_SIZE/2) / CONFIG.TILE_SIZE);
                        if (gx >= 0 && gx < CONFIG.GRID_SIZE && gz >= 0 && gz < CONFIG.GRID_SIZE) {
                            enemy.position.y = heightMap[gx][gz];
                        }
                        
                        // Face target
                        enemy.rotation.y = Math.atan2(dir.x, dir.z);
                    }
                }
            });
            
            // Tower defense
            gameState.buildings.forEach(building => {
                if (building.userData.type === 'tower' && building.userData.isPlayer) {
                    const bd = building.userData;
                    
                    let nearestEnemy = null;
                    let nearestDist = bd.config.range || 12;
                    
                    gameState.enemyUnits.forEach(enemy => {
                        const d = building.position.distanceTo(enemy.position);
                        if (d < nearestDist) {
                            nearestDist = d;
                            nearestEnemy = enemy;
                        }
                    });
                    
                    if (nearestEnemy && now - bd.lastActionTime > 800) {
                        fireProjectile(building.position, nearestEnemy.position, bd.config.damage, 'player', 'tower');
                        bd.lastActionTime = now;
                    }
                }
            });
        }

        // ============ WAVE SYSTEM ============
        function getWaveConfig(waveNum) {
            const diffMod = CONFIG.DIFFICULTY[gameState.difficulty];
            const baseWave = {
                1: { types: { grunt: 5 }, delay: 20 },
                2: { types: { grunt: 6, runner: 3 }, delay: 18 },
                3: { types: { grunt: 8, runner: 4, archer: 2 }, delay: 16 },
                4: { types: { grunt: 6, archer: 5, brute: 1 }, delay: 15 },
                5: { types: { grunt: 8, archer: 6, brute: 2, runner: 3 }, delay: 14 },
                6: { types: { brute: 4, archer: 8, mage: 2, grunt: 5 }, delay: 13 },
                7: { types: { brute: 5, mage: 4, archer: 6, grunt: 4 }, delay: 12 },
                8: { types: { brute: 6, mage: 5, archer: 8, elite: 1 }, delay: 11 },
                9: { types: { elite: 3, brute: 6, mage: 6, archer: 5 }, delay: 10 },
                10: { types: { boss: 1, elite: 5, brute: 8, mage: 4 }, delay: 15 },
                11: { types: { boss: 1, elite: 6, brute: 6, mage: 6 }, delay: 12 },
                12: { types: { boss: 2, elite: 8, brute: 8, mage: 8 }, delay: 12 }
            };
            
            const wave = baseWave[Math.min(waveNum, 12)] || baseWave[12];
            
            // Scale by difficulty
            const scaledTypes = {};
            Object.entries(wave.types).forEach(([type, count]) => {
                scaledTypes[type] = Math.ceil(count * diffMod.spawnMultiplier);
            });
            
            return { types: scaledTypes, delay: wave.delay };
        }

        function startWave(waveNum) {
            if (waveNum > gameState.waves.maxWaves) {
                endGame(true);
                return;
            }
            
            gameState.waves.current = waveNum;
            gameState.waves.attackInProgress = true;
            
            showWaveIndicator(`Wave ${waveNum}`);
            showAlert(`Wave ${waveNum} incoming!`, 'danger');
            
            const waveConfig = getWaveConfig(waveNum);
            const totalEnemies = Object.values(waveConfig.types).reduce((a, b) => a + b, 0);
            let spawned = 0;
            
            const spawnInterval = setInterval(() => {
                if (spawned >= totalEnemies) {
                    clearInterval(spawnInterval);
                    return;
                }
                
                // Find enemy type for this spawn
                let remainingSpawn = spawned;
                let spawnType = 'grunt';
                
                Object.entries(waveConfig.types).forEach(([type, count]) => {
                    remainingSpawn -= count;
                    if (remainingSpawn < 0) {
                        spawnType = type;
                    }
                });
                
                // Spawn at random edge
                const edge = Math.floor(Math.random() * 4);
                let ex, ez;
                
                switch(edge) {
                    case 0: ex = (Math.random() - 0.5) * CONFIG.MAP_SIZE * 0.9; ez = CONFIG.MAP_SIZE * 0.45; break;
                    case 1: ex = (Math.random() - 0.5) * CONFIG.MAP_SIZE * 0.9; ez = -CONFIG.MAP_SIZE * 0.45; break;
                    case 2: ex = CONFIG.MAP_SIZE * 0.45; ez = (Math.random() - 0.5) * CONFIG.MAP_SIZE * 0.9; break;
                    case 3: ex = -CONFIG.MAP_SIZE * 0.45; ez = (Math.random() - 0.5) * CONFIG.MAP_SIZE * 0.9; break;
                }
                
                createEnemy(spawnType, ex, ez);
                spawned++;
            }, 400);
        }

            el.style.opacity = '1';
            el.style.transform = 'translate(-50%, -50%) scale(1.2)';

                el.style.transform = 'translate(-50%, -50%) scale(0.8)';
            }, 500);
            
            setTimeout(() => {
                el.style.transition = '';
            }, 1000);
        }

        // ============ RESOURCE SYSTEM ============
        function updateResources(dt) {
            // Passive income from buildings
            gameState.buildings.forEach(building => {
                const bc = building.userData.config;
                if (!bc) return;
                
                if (bc.foodRate) gameState.resources.food += bc.foodRate * dt * 0.2;
                if (bc.woodRate) gameState.resources.wood += bc.woodRate * dt * 0.2;
                if (bc.goldRate) gameState.resources.gold += bc.goldRate * dt * 0.2;
                if (bc.popBonus) gameState.population.max = Math.min(50, gameState.population.max);
            });
            
            // Cap resources
            Object.keys(gameState.resources).forEach(res => {
                gameState.resources[res] = Math.min(gameState.resources[res], 9999);
            });
        }

        // ============ DAY/NIGHT CYCLE ============
        function updateDayNightCycle(dt) {
            gameState.time.progress += dt * 0.02; // Speed of day cycle
            
            if (gameState.time.progress >= 1) {
                gameState.time.progress = 0;
                gameState.time.day++;
                gameState.time.isNight = false;
                
                // Start wave during day
                if (!gameState.waves.attackInProgress) {
                    gameState.waves.current++;
                    startWave(gameState.waves.current);
                }
            }
            
            // Night phase
            gameState.time.isNight = gameState.time.progress > 0.6;
            
            // Update visuals
            const sunLight = scene.getObjectByName('sunLight');
            const sunObj = scene.getObjectByName('sunObject');
            
            if (sunLight && sunObj) {
                const angle = gameState.time.progress * Math.PI * 2;
                const sunHeight = Math.sin(angle);
                const sunDist = 60;
                
                sunObj.position.set(
                    Math.cos(angle) * sunDist,
                    Math.max(10, sunHeight * 60),
                    Math.sin(angle) * sunDist * 0.5 - 20
                );
                
                // Light intensity based on sun position
                const intensity = Math.max(0.15, sunHeight * 1.2);
                sunLight.intensity = intensity;
                
                // Color temperature
                if (sunHeight < 0.2) {
                    sunLight.color.setHex(0xff8844); // Sunset/sunrise orange
                } else {
                    sunLight.color.setHex(0xfff5e0); // Daylight
                }
                
                // Scene atmosphere
                const fogDensity = 0.012 + (1 - sunHeight) * 0.01;
                scene.fog.density = Math.max(0.012, Math.min(0.03, fogDensity));
                
                if (gameState.time.isNight) {
                    scene.fog.color.setHex(0x151525);
                    scene.background.lerp(new THREE.Color(0x0a0a1a), 0.02);
                } else {
                    scene.fog.color.lerp(new THREE.Color(0xa8d5ba), 0.02);
                    scene.background.lerp(new THREE.Color(0x87ceeb), 0.02);
                }
            }
            
            // Cloud movement
            skyObjects.forEach(obj => {
                if (obj.userData.speed) {
                    obj.position.x += obj.userData.speed * dt * 0.5;
                    if (obj.position.x > 80) obj.position.x = -80;
                }
            });
            
            // Water shimmer
            if (waterMesh) {
                waterMesh.position.y = -2.5 + Math.sin(Date.now() * 0.001) * 0.1;
            }
        }

        // ============ MINIMAP ============
        function initMinimap() {
            minimapCanvas = document.getElementById('minimap-canvas');
            minimapCtx = minimapCanvas.getContext('2d');
            minimapCanvas.width = 152;
            minimapCanvas.height = 152;
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            
            const ctx = minimapCtx;
            const w = minimapCanvas.width;
            const h = minimapCanvas.height;
            const mapScale = w / CONFIG.MAP_SIZE;
            
            // Clear
            ctx.fillStyle = '#1a1820';
            ctx.fillRect(0, 0, w, h);
            
            // Terrain hints
            ctx.fillStyle = '#2a3a25';
            ctx.fillRect(4, 4, w - 8, h - 8);
            
            // Buildings
            gameState.buildings.forEach(b => {
                const mx = (b.position.x + CONFIG.MAP_SIZE/2) * mapScale;
                const my = (b.position.z + CONFIG.MAP_SIZE/2) * mapScale;
                ctx.fillStyle = b.userData.isPlayer ? '#3498db' : '#c0392b';
                ctx.fillRect(mx - 3, my - 3, 6, 6);
            });
            
            // Player units
            ctx.fillStyle = '#5dade2';
            gameState.playerUnits.forEach(u => {
                const mx = (u.position.x + CONFIG.MAP_SIZE/2) * mapScale;
                const my = (u.position.z + CONFIG.MAP_SIZE/2) * mapScale;
                ctx.beginPath();
                ctx.arc(mx, my, 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Enemies
            ctx.fillStyle = '#e74c3c';
            gameState.enemyUnits.forEach(e => {
                const mx = (e.position.x + CONFIG.MAP_SIZE/2) * mapScale;
                const my = (e.position.z + CONFIG.MAP_SIZE/2) * mapScale;
                ctx.beginPath();
                ctx.arc(mx, my, e.userData.type === 'boss' ? 4 : 2, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Camera viewport
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.strokeRect(
                (camera.position.x + CONFIG.MAP_SIZE/2) * mapScale - 8,
                (camera.position.z + CONFIG.MAP_SIZE/2) * mapScale - 8,
                16, 16
            );
        }

                gameState.selectedBuildMode = null;
            } else {
                gameState.selectedBuildMode = type;
            }
            
            document.querySelectorAll('.build-btn').forEach(btn => {
                btn.classList.toggle('selected', btn.dataset.buildType === gameState.selectedBuildMode);
            });

        function updateBuildButtons() {
            document.querySelectorAll('.build-btn[data-build-type]').forEach(btn => {
                const type = btn.dataset.buildType;

                let canAfford = true;
                
                Object.entries(config.cost).forEach(([res, amount]) => {

                panel.classList.remove('visible');
                document.getElementById('ability-bar').classList.remove('visible');

                    'archery': [{ type: 'archer', label: 'Train Archer' }],
                    'magetower': [{ type: 'mage', label: 'Train Mage' }]
                };

                        const btn = document.createElement('button');

                        btn.textContent = opt.label;

                        const canAfford = Object.entries(unitConfig.cost).every(
                            ([r, v]) => (gameState.resources[r] || 0) >= v

        function updateAbilityBar() {
            const bar = document.getElementById('ability-bar');
            bar.innerHTML = '';
            
            const abilities = [
                { key: 'Q', name: 'Rally', icon: '&#9873;', id: 'rally', cooldown: 15 },
                { key: 'W', name: 'Heal', icon: '&#10010;', id: 'heal', cooldown: 20 },
                { key: 'E', name: 'Blaze', icon: '&#9832;', id: 'blaze', cooldown: 25 }
            ];
            
            abilities.forEach(ab => {
                const slot = document.createElement('div');
                slot.className = `ability-slot${gameState.heroAbilities[ab.id] > 0 ? ' cooldown' : ''}`;
                slot.innerHTML = `
                    <span class="ability-key">${ab.key}</span>

        function useHeroAbility(abilityId) {
            if (gameState.selectedUnits.length === 0) return;
            const commander = gameState.selectedUnits.find(u => u.userData.type === 'commander');
            if (!commander) return;
            
            if (gameState.heroAbilities[abilityId] > 0) return;
            
            switch(abilityId) {
                case 'rally':
                    // Boost nearby allies
                    gameState.playerUnits.forEach(u => {
                        if (u.position.distanceTo(commander.position) < 10) {
                            u.userData.hp = Math.min(u.userData.maxHp, u.userData.hp + 20);
                            createParticle(u.position.clone(), 'heal');
                        }
                    });
                    showAlert('Rally! Allies bolstered!', 'success');
                    break;
                    
                case 'heal':
                    // Heal commander fully
                    commander.userData.hp = commander.userData.maxHp;
                    createParticle(commander.position.clone(), 'heal');
                    showAlert('Healing pulse activated!', 'success');
                    break;
                    
                case 'blaze':
                    // Damage nearby enemies
                    gameState.enemyUnits.forEach(e => {
                        if (e.position.distanceTo(commander.position) < 8) {
                            dealDamage(e, 50);
                            createParticle(e.position.clone(), 'fire');
                        }
                    });
                    showAlert('Blazing Strike!', 'danger');
                    break;
            }
            
            gameState.heroAbilities[abilityId] = 
                abilityId === 'rally' ? 15 : abilityId === 'heal' ? 20 : 25;
        }

        function trainUnit(type, pos) {
            const config = CONFIG.UNITS[type];
            
            // Deduct cost
            Object.entries(config.cost).forEach(([res, amt]) => {
                gameState.resources[res] -= amt;
            });
            gameState.population.current += config.popCost;
            
            // Spawn near building
            const offsetX = (Math.random() - 0.5) * 3;
            const offsetZ = (Math.random() - 0.5) * 3;
            const unit = createUnit(type, pos.x + offsetX, pos.z + offsetZ, true);
            
            if (unit) {
                gameState.playerUnits.push(unit);
                createParticle(unit.position.clone(), 'build');
                showAlert(`${config.name} trained!`, 'success');
            }
            
            updateUI();
        }

        // ============ INPUT HANDLING ============
        function onCanvasClick(event) {
            if (!gameState.running) return;
            
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            // Check for build mode
            if (gameState.selectedBuildMode) {
                const intersects = raycaster.intersectObject(groundMesh);
                if (intersects.length > 0) {
                    placeBuilding(gameState.selectedBuildMode, intersects[0].point);
                }
                return;
            }
            
            // Check for unit/entity selection
            const allSelectables = [...gameState.playerUnits, ...gameState.buildings.filter(b => b.userData.isPlayer)];
            const entityIntersects = raycaster.intersectObjects(allSelectables, true);
            
            if (entityIntersects.length > 0) {
                // Find parent group
                let clicked = entityIntersects[0].object;
                while (clicked.parent && !clicked.userData.type && !clicked.userData.isGround) {
                    clicked = clicked.parent;
                }
                
                if (clicked !== groundMesh && clicked.userData) {
                    gameState.selectedUnits = [clicked];
                    updateSelectionPanel();
                    return;
                }
            }
            
            // Ground click - move selected units
            if (gameState.selectedUnits.length > 0) {
                const groundIntersects = raycaster.intersectObject(groundMesh);
                if (groundIntersects.length > 0) {
                    const targetPoint = groundIntersects[0].point;
                    
                    // Formation movement
                    gameState.selectedUnits.forEach((unit, index) => {
                        const offset = new THREE.Vector3(
                            ((index % 3) - 1) * 1.5,
                            0,
                            (Math.floor(index / 3) - 1) * 1.5
                        );
                        
                        unit.userData.targetPos = targetPoint.clone().add(offset);
                    });
                    
                    // Visual feedback - spawn marker
                    createParticle(targetPoint, 'build');
                }
            } else {
                gameState.selectedUnits = [];
                updateSelectionPanel();
            }
        }

        function onCanvasMove(event) {
            // Hover effects could go here
        }

        function placeBuilding(type, point) {
            const config = CONFIG.BUILDINGS[type];
            
            // Check cost
            for (const [res, amount] of Object.entries(config.cost)) {
                if ((gameState.resources[res] || 0) < amount) {
                    showAlert(`Not enough ${res}!`, 'danger');
                    return;
                }
            }
            
            // Check bounds
            if (Math.abs(point.x) > CONFIG.MAP_SIZE/2 - 5 || Math.abs(point.z) > CONFIG.MAP_SIZE/2 - 5) {
                showAlert('Cannot build here!', 'danger');
                return;
            }
            
            // Deduct cost
            Object.entries(config.cost).forEach(([res, amt]) => {
                gameState.resources[res] -= amt;
            });
            
            // Place building
            const building = createBuilding(type, point.x, point.z, true);
            gameState.buildings.push(building);
            
            // Pop bonus
            if (config.popBonus) {
                gameState.population.max += config.popBonus;
            }
            
            // Initial workers for town hall
            if (type === 'townhall') {
                for (let i = 0; i < 3; i++) {
                    const px = point.x + (Math.random() - 0.5) * 4;
                    const pz = point.z + (Math.random() - 0.5) * 4;
                    const peasant = createUnit('peasant', px, pz, true);
                    if (peasant) gameState.playerUnits.push(peasant);
                }
            }
            
            createParticle(point, 'build');
            showAlert(`${config.name} constructed!`, 'success');
            
            // Exit build mode
            selectBuildMode(null);
            updateUI();
        }

        // Keyboard input
        document.addEventListener('keydown', (event) => {
            if (!gameState.running) return;
            
            // Ability hotkeys
            const keyMap = { 'q': 'rally', 'w': 'heal', 'e': 'blaze' };
            if (keyMap[event.key.toLowerCase()]) {
