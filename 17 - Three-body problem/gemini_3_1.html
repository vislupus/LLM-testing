<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Gravitational System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
        }
        canvas {
            border: 1px solid #333;
            box-shadow: 0 0 20px rgba(0, 100, 255, 0.2);
        }
    </style>
</head>
<body>

<script>
let bodies = [];
let spacecraft;
let G = 1; // Gravitational constant (scaled for p5)
let launched = false;
let launchTimer = 0;

function setup() {
    createCanvas(900, 900);
    noStroke();

    // Masses (scaled for visibility)
    const SUN_MASS = 10000;
    const EARTH_MASS = 50;
    const JUPITER_MASS = 500;

    // Initial positions (centered)
    const cx = width / 2;
    const cy = height / 2;

    // Create bodies with exaggerated velocities for chaotic but bounded orbits
    bodies.push({
        x: cx,
        y: cy,
        vx: 0,
        vy: 0,
        mass: SUN_MASS,
        radius: 15,
        color: color(255, 200, 0),
        trail: []
    });

    bodies.push({
        x: cx - 150,
        y: cy,
        vx: 0,
        vy: -3.5, // Higher than stable orbit
        mass: EARTH_MASS,
        radius: 6,
        color: color(0, 120, 255),
        trail: []
    });

    bodies.push({
        x: cx + 250,
        y: cy,
        vx: 0,
        vy: 2.0, // Chaotic velocity
        mass: JUPITER_MASS,
        radius: 12,
        color: color(220, 140, 50),
        trail: []
    });
}

function draw() {
    // Fade background to leave trails
    background(220, 1);

    // Apply gravity between all bodies
    for (let i = 0; i < bodies.length; i++) {
        let b1 = bodies[i];
        b1.vx += accelerationX(b1) * 0.05;
        b1.vy += accelerationY(b1) * 0.05;
        b1.x += b1.vx;
        b1.y += b1.vy;

        // Update trail
        b1.trail.push({x: b1.x, y: b1.y});
        if (b1.trail.length > 500) b1.trail.shift(); // Limit trail length

        // Draw orbital trail
        if (i === 0) continue; // Skip Sun's trail
        push();
        stroke(red(b1.color), green(b1.color), blue(b1.color), 80);
        strokeWeight(1.5);
        noFill();
        beginShape();
        for (let pt of b1.trail) {
            vertex(pt.x, pt.y);
        }
        endShape();
        pop();
    }

    // Draw bodies
    for (let b of bodies) {
        fill(b.color);
        circle(b.x, b.y, b.radius * 2);
    }

    // Handle spacecraft
    if (!launched && launchTimer++ > 120) { // Wait 2 seconds
        launchSpacecraft();
        launched = true;
    }

    if (spacecraft) {
        updateSpacecraft();
        drawSpacecraft();
    }
}

// Calculate total gravitational acceleration on body 'b'
function accelerationX(b) {
    let ax = 0;
    for (let other of bodies) {
        if (other === b) continue;
        let dx = other.x - b.x;
        let dy = other.y - b.y;
        let distSq = dx*dx + dy*dy;
        if (distSq < 1) distSq = 1; // Avoid divide-by-zero
        let dist = sqrt(distSq);
        let force = G * other.mass / distSq;
        ax += force * dx / dist;
    }
    return ax;
}

function accelerationY(b) {
    let ay = 0;
    for (let other of bodies) {
        if (other === b) continue;
        let dx = other.x - b.x;
        let dy = other.y - b.y;
        let distSq = dx*dx + dy*dy;
        if (distSq < 1) distSq = 1;
        let dist = sqrt(distSq);
        let force = G * other.mass / distSq;
        ay += force * dy / dist;
    }
    return ay;
}

// Spacecraft logic
function launchSpacecraft() {
    const earth = bodies[1];
    spacecraft = {
        x: earth.x,
        y: earth.y,
        vx: earth.vx - 5, // Boost away from Earth
        vy: earth.vy - 2,
        radius: 3,
        color: color(255, 0, 255),
        trail: [],
        phase: 'departure' // departure, solar_loop, jupiter_bound
    };
}

function updateSpacecraft() {
    // Apply gravity from all bodies
    let accX = 0, accY = 0;
    for (let b of bodies) {
        let dx = b.x - spacecraft.x;
        let dy = b.y - spacecraft.y;
        let distSq = dx*dx + dy*dy;
        if (distSq < 1) distSq = 1;
        let dist = sqrt(distSq);
        let force = G * b.mass / distSq;
        accX += force * dx / dist;
        accY += force * dy / dist;
    }

    spacecraft.vx += accX * 0.05;
    spacecraft.vy += accY * 0.05;
    spacecraft.x += spacecraft.vx;
    spacecraft.y += spacecraft.vy;

    // Update trail
    spacecraft.trail.push({x: spacecraft.x, y: spacecraft.y});
    if (spacecraft.trail.length > 400) spacecraft.trail.shift();
}

function drawSpacecraft() {
    // Draw trail
    stroke(255, 0, 255, 100);
    strokeWeight(1.2);
    noFill();
    beginShape();
    for (let pt of spacecraft.trail) {
        vertex(pt.x, pt.y);
    }
    endShape();

    // Draw spacecraft
    fill(spacecraft.color);
    circle(spacecraft.x, spacecraft.y, spacecraft.radius * 2);
}

// Optional: Click to reset
function mousePressed() {
    setup();
    launched = false;
    launchTimer = 0;
    spacecraft = null;
}
</script>

</body>
</html>
