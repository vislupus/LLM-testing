<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Multi-Body Gravitational System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #220;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        
        #canvas-container {
            position: relative;
        }
        
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(34, 34, 34, 0.95);
            border: 2px solid #666;
            border-radius: 12px;
            padding: 15px;
            color: #ddd;
            font-size: 12px;
            z-index: 100;
            min-width: 200px;
        }
        
        #controls h3 {
            color: #ffa500;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .control-row {
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }
        
        .control-row span {
            color: #aaa;
        }
        
        .control-row .value {
            color: #4ecdc4;
        }
        
        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background: linear-gradient(135deg, #555, #333);
            border: 1px solid #666;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #666, #444);
            transform: translateY(-1px);
        }
        
        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(34, 34, 34, 0.95);
            border: 2px solid #666;
            border-radius: 12px;
            padding: 15px;
            color: #ddd;
            font-size: 11px;
            z-index: 100;
        }
        
        #info h4 {
            color: #ffa500;
            margin-bottom: 8px;
        }
        
        .legend {
            display: flex;
            align-items: center;
            margin: 4px 0;
        }
        
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        #mission-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(34, 34, 34, 0.95);
            border: 2px solid #666;
            border-radius: 12px;
            padding: 15px;
            color: #ddd;
            font-size: 12px;
            z-index: 100;
            min-width: 180px;
        }
        
        #mission-status h3 {
            color: #4ecdc4;
            margin-bottom: 10px;
        }
        
        .phase {
            padding: 5px 10px;
            margin: 4px 0;
            border-radius: 4px;
            background: #333;
            transition: all 0.3s;
        }
        
        .phase.active {
            background: #4ecdc4;
            color: #000;
        }
        
        .phase.complete {
            background: #2d5;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="controls">
        <h3>⚙️ Simulation Controls</h3>
        <div class="control-row">
            <span>Time Scale:</span>
            <span class="value" id="timeValue">1.0x</span>
        </div>
        <input type="range" id="timeSlider" min="0.1" max="3" step="0.1" value="1" style="width: 100%;">
        
        <div class="control-row">
            <span>Trail Length:</span>
            <span class="value" id="trailValue">500</span>
        </div>
        <input type="range" id="trailSlider" min="100" max="2000" step="100" value="500" style="width: 100%;">
        
        <button onclick="resetSimulation()">🔄 Reset Simulation</button>
        <button onclick="launchSpacecraft()">🚀 Launch Spacecraft</button>
    </div>
    
    <div id="info">
        <h4>🌟 Celestial Bodies</h4>
        <div class="legend">
            <div class="legend-color" style="background: #ffcc00;"></div>
            <span>Sun (Mass: 1000)</span>
        </div>
        <div class="legend">
            <div class="legend-color" style="background: #4488ff;"></div>
            <span>Earth (Mass: 1)</span>
        </div>
        <div class="legend">
            <div class="legend-color" style="background: #ff8844;"></div>
            <span>Jupiter (Mass: 10)</span>
        </div>
        <div class="legend">
            <div class="legend-color" style="background: #00ff88;"></div>
            <span>Spacecraft</span>
        </div>
    </div>
    
    <div id="mission-status">
        <h3>🛸 Mission Status</h3>
        <div class="phase" id="phase1">1. Earth Departure</div>
        <div class="phase" id="phase2">2. Solar Loop</div>
        <div class="phase" id="phase3">3. Jupiter Transfer</div>
        <div class="phase" id="phase4">4. Jupiter Arrival</div>
        <div style="margin-top: 10px; color: #888;">
            Distance to Target: <span id="distance" style="color: #4ecdc4;">--</span>
        </div>
    </div>

    <script>
        // ============================================
        // SIMULATION PARAMETERS
        // ============================================
        const CANVAS_SIZE = 800;
        const G = 0.5;  // Gravitational constant (scaled for visualization)
        const SOFTENING = 5;  // Prevents division by zero at close distances
        const DT_BASE = 0.016;  // Base time step
        
        let timeScale = 1.0;
        let trailLength = 500;
        
        // ============================================
        // CELESTIAL BODIES
        // ============================================
        let sun, earth, jupiter;
        let spacecraft = null;
        let bodies = [];
        
        // Trail storage
        let sunTrail = [];
        let earthTrail = [];
        let jupiterTrail = [];
        let spacecraftTrail = [];
        
        // Mission phases
        let missionPhase = 0;  // 0: waiting, 1: departure, 2: solar loop, 3: jupiter transfer, 4: arrived
        let missionStarted = false;
        
        // ============================================
        // BODY CLASS
        // ============================================
        class CelestialBody {
            constructor(name, mass, x, y, vx, vy, radius, color) {
                this.name = name;
                this.mass = mass;
                this.pos = createVector(x, y);
                this.vel = createVector(vx, vy);
                this.acc = createVector(0, 0);
                this.radius = radius;
                this.color = color;
                this.trail = [];
            }
            
            applyForce(force) {
                let f = p5.Vector.div(force, this.mass);
                this.acc.add(f);
            }
            
            update(dt) {
                // Velocity Verlet integration
                this.vel.add(p5.Vector.mult(this.acc, dt * 0.5));
                this.pos.add(p5.Vector.mult(this.vel, dt));
                
                // Store trail point
                this.trail.push(this.pos.copy());
                if (this.trail.length > trailLength) {
                    this.trail.shift();
                }
            }
            
            updateAcceleration() {
                this.acc.mult(0);  // Reset acceleration
            }
            
            display() {
                noStroke();
                
                // Draw trail
                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        let alpha = map(i, 0, this.trail.length, 0, 150);
                        let c = color(red(this.color), green(this.color), blue(this.color), alpha);
                        fill(c);
                        let size = map(i, 0, this.trail.length, 1, 3);
                        ellipse(this.trail[i].x, this.trail[i].y, size);
                    }
                }
                
                // Draw body
                fill(this.color);
                ellipse(this.pos.x, this.pos.y, this.radius * 2);
                
                // Glow effect for sun
                if (this.name === 'Sun') {
                    for (let i = 5; i > 0; i--) {
                        let alpha = map(i, 0, 5, 100, 0);
                        fill(255, 200, 50, alpha);
                        ellipse(this.pos.x, this.pos.y, this.radius * 2 + i * 8);
                    }
                }
            }
        }
        
        // ============================================
        // SPACECRAFT CLASS
        // ============================================
        class Spacecraft {
            constructor(x, y, vx, vy) {
                this.pos = createVector(x, y);
                this.vel = createVector(vx, vy);
                this.acc = createVector(0, 0);
                this.mass = 0.001;  // Very small mass
                this.trail = [];
                this.phase = 1;
                this.thrustPower = 0.05;
                this.targetPhase = 1;
            }
            
            applyForce(force) {
                let f = p5.Vector.div(force, this.mass);
                this.acc.add(f);
            }
            
            update(dt) {
                // Apply mission-specific thrust
                this.applyMissionThrust();
                
                // Update position
                this.vel.add(p5.Vector.mult(this.acc, dt * 0.5));
                this.pos.add(p5.Vector.mult(this.vel, dt));
                
                // Store trail
                this.trail.push(this.pos.copy());
                if (this.trail.length > trailLength * 2) {
                    this.trail.shift();
                }
            }
            
            updateAcceleration() {
                this.acc.mult(0);
            }
            
            applyMissionThrust() {
                // Phase-based thrust for trajectory control
                if (this.phase === 1) {
                    // Departure from Earth - boost velocity outward
                    let toSun = p5.Vector.sub(sun.pos, this.pos);
                    let tangent = createVector(-toSun.y, toSun.x).normalize();
                    
                    // Add thrust perpendicular to sun direction
                    let thrust = p5.Vector.mult(tangent, this.thrustPower * 0.3);
                    this.vel.add(thrust);
                    
                    // Check if moved away from Earth
                    if (p5.Vector.dist(this.pos, earth.pos) > 50) {
                        this.phase = 2;
                        updateMissionStatus(2);
                    }
                } else if (this.phase === 2) {
                    // Solar loop - adjust trajectory for sun flyby
                    let distToSun = p5.Vector.dist(this.pos, sun.pos);
                    
                    if (distToSun < 80) {
                        // Close to sun, prepare for Jupiter transfer
                        let toJupiter = p5.Vector.sub(jupiter.pos, this.pos).normalize();
                        let thrust = p5.Vector.mult(toJupiter, this.thrustPower * 0.5);
                        this.vel.add(thrust);
                        this.phase = 3;
                        updateMissionStatus(3);
                    } else {
                        // Guide toward sun
                        let toSun = p5.Vector.sub(sun.pos, this.pos).normalize();
                        let thrust = p5.Vector.mult(toSun, this.thrustPower * 0.1);
                        this.vel.add(thrust);
                    }
                } else if (this.phase === 3) {
                    // Jupiter transfer - course corrections
                    let toJupiter = p5.Vector.sub(jupiter.pos, this.pos);
                    let distToJupiter = toJupiter.mag();
                    
                    // Update distance display
                    document.getElementById('distance').textContent = distToJupiter.toFixed(1) + ' units';
                    
                    if (distToJupiter < 30) {
                        // Arrived at Jupiter
                        this.phase = 4;
                        updateMissionStatus(4);
                        // Match Jupiter's velocity for rendezvous
                        this.vel.lerp(jupiter.vel, 0.1);
                    } else {
                        // Course correction toward Jupiter
                        let correction = toJupiter.normalize().mult(this.thrustPower * 0.15);
                        this.vel.add(correction);
                    }
                } else if (this.phase === 4) {
                    // Orbiting with Jupiter
                    this.vel.lerp(jupiter.vel, 0.05);
                }
            }
            
            display() {
                noStroke();
                
                // Draw trail with green color
                if (this.trail.length > 1) {
                    for (let i = 1; i < this.trail.length; i++) {
                        let alpha = map(i, 0, this.trail.length, 0, 200);
                        fill(0, 255, 136, alpha);
                        let size = map(i, 0, this.trail.length, 1, 2);
                        ellipse(this.trail[i].x, this.trail[i].y, size);
                    }
                }
                
                // Draw spacecraft
                fill(0, 255, 136);
                push();
                translate(this.pos.x, this.pos.y);
                let angle = this.vel.heading();
                rotate(angle);
                
                // Spacecraft shape
                beginShape();
                vertex(8, 0);
                vertex(-5, -4);
                vertex(-3, 0);
                vertex(-5, 4);
                endShape(CLOSE);
                
                // Engine glow
                if (this.phase < 4) {
                    fill(255, 200, 100, 150);
                    ellipse(-6, 0, 8, 4);
                }
                pop();
            }
        }
        
        // ============================================
        // PHYSICS FUNCTIONS
        // ============================================
        function calculateGravitationalForce(body1, body2) {
            let direction = p5.Vector.sub(body2.pos, body1.pos);
            let distance = direction.mag();
            
            // Apply softening to prevent extreme forces at close distances
            let forceMag = (G * body1.mass * body2.mass) / (distance * distance + SOFTENING * SOFTENING);
            
            // Limit maximum force to prevent instability
            forceMag = min(forceMag, 10);
            
            direction.normalize();
            return direction.mult(forceMag);
        }
        
        function updatePhysics(dt) {
            // Calculate all gravitational forces
            let forces = [];
            
            for (let i = 0; i < bodies.length; i++) {
                forces[i] = createVector(0, 0);
                for (let j = 0; j < bodies.length; j++) {
                    if (i !== j) {
                        let f = calculateGravitationalForce(bodies[i], bodies[j]);
                        forces[i].add(f);
                    }
                }
            }
            
            // Apply forces to bodies
            for (let i = 0; i < bodies.length; i++) {
                bodies[i].applyForce(forces[i]);
            }
            
            // Spacecraft gravity (if exists)
            if (spacecraft) {
                let scForce = createVector(0, 0);
                for (let body of bodies) {
                    let f = calculateGravitationalForce(spacecraft, body);
                    scForce.add(f);
                }
                spacecraft.applyForce(scForce);
            }
            
            // Update all bodies
            for (let body of bodies) {
                body.update(dt);
                body.updateAcceleration();
            }
            
            // Update spacecraft
            if (spacecraft) {
                spacecraft.update(dt);
                spacecraft.updateAcceleration();
            }
            
            // Boundary enforcement - keep bodies bounded
            enforceBoundaries();
        }
        
        function enforceBoundaries() {
            let boundary = CANVAS_SIZE * 0.45;
            let damping = 0.8;
            
            for (let body of bodies) {
                // Soft boundary - gradually slow down and redirect
                let distFromCenter = body.pos.mag();
                
                if (distFromCenter > boundary) {
                    // Apply corrective force toward center
                    let correction = body.pos.copy().normalize().mult(-0.5);
                    body.vel.add(correction);
                    
                    // Dampen velocity
                    body.vel.mult(damping);
                }
            }
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        function setup() {
            let canvas = createCanvas(CANVAS_SIZE, CANVAS_SIZE);
            canvas.parent('canvas-container');
            
            initializeBodies();
            
            // Setup control listeners
            document.getElementById('timeSlider').addEventListener('input', function() {
                timeScale = parseFloat(this.value);
                document.getElementById('timeValue').textContent = timeScale.toFixed(1) + 'x';
            });
            
            document.getElementById('trailSlider').addEventListener('input', function() {
                trailLength = parseInt(this.value);
                document.getElementById('trailValue').textContent = trailLength;
            });
        }
        
        function initializeBodies() {
            bodies = [];
            sunTrail = [];
            earthTrail = [];
            jupiterTrail = [];
            spacecraftTrail = [];
            spacecraft = null;
            missionPhase = 0;
            missionStarted = false;
            
            // Reset mission status display
            updateMissionStatus(0);
            
            // Initialize with chaotic but bounded orbits
            // Sun at center (with small initial velocity for interesting dynamics)
            sun = new CelestialBody('Sun', 1000, 0, 0, 0.1, 0.1, 20, color(255, 204, 0));
            
            // Earth in an elliptical, unstable orbit
            // Positioned closer and with velocity that won't be stable
            earth = new CelestialBody('Earth', 1, 100, 0, 0, 2.5, 6, color(68, 136, 255));
            
            // Jupiter in a different orbital plane (for 3D-ish chaos)
            // Larger orbit, different phase
            jupiter = new CelestialBody('Jupiter', 10, -150, 50, 0.5, -1.5, 12, color(255, 136, 68));
            
            bodies.push(sun, earth, jupiter);
        }
        
        function launchSpacecraft() {
            if (spacecraft !== null) return;
            
            // Launch from Earth's position with Earth's velocity plus escape boost
            let launchPos = earth.pos.copy();
            let launchVel = earth.vel.copy();
            
            // Add escape velocity tangent to Earth's orbit
            let escapeDir = earth.vel.copy().normalize();
            launchVel.add(escapeDir.mult(1.5));
            
            // Offset slightly from Earth
            launchPos.add(escapeDir.mult(10));
            
            spacecraft = new Spacecraft(launchPos.x, launchPos.y, launchVel.x, launchVel.y);
            missionStarted = true;
            updateMissionStatus(1);
        }
        
        function updateMissionStatus(phase) {
            missionPhase = phase;
            
            // Update UI
            document.getElementById('phase1').className = phase >= 1 ? (phase > 1 ? 'phase complete' : 'phase active') : 'phase';
            document.getElementById('phase2').className = phase >= 2 ? (phase > 2 ? 'phase complete' : 'phase active') : 'phase';
            document.getElementById('phase3').className = phase >= 3 ? (phase > 3 ? 'phase complete' : 'phase active') : 'phase';
            document.getElementById('phase4').className = phase >= 4 ? 'phase complete' : 'phase';
        }
        
        function resetSimulation() {
            initializeBodies();
            document.getElementById('distance').textContent = '--';
        }
        
        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            background(220);  // As specified
            
            // Translate to center
            translate(CANVAS_SIZE / 2, CANVAS_SIZE / 2);
            
            noStroke();
            
            // Draw background stars (static)
            drawStars();
            
            // Physics update (multiple sub-steps for stability)
            let subSteps = 4;
            let dt = DT_BASE * timeScale / subSteps;
            
            for (let i = 0; i < subSteps; i++) {
                updatePhysics(dt);
            }
            
            // Display all bodies
            for (let body of bodies) {
                body.display();
            }
            
            // Display spacecraft
            if (spacecraft) {
                spacecraft.display();
            }
            
            // Draw labels
            drawLabels();
            
            // Draw orbit indicators
            drawOrbitIndicators();
        }
        
        function drawStars() {
            // Static star field
            randomSeed(42);
            fill(150);
            for (let i = 0; i < 100; i++) {
                let x = random(-CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                let y = random(-CANVAS_SIZE / 2, CANVAS_SIZE / 2);
                let size = random(1, 2);
                ellipse(x, y, size);
            }
            randomSeed(millis());
        }
        
        function drawLabels() {
            // Sun label
            fill(200, 150, 0);
            textSize(10);
            textAlign(CENTER);
            text('Sun', sun.pos.x, sun.pos.y - sun.radius - 8);
            
            // Earth label
            fill(100, 150, 255);
            text('Earth', earth.pos.x, earth.pos.y - earth.radius - 8);
            
            // Jupiter label
            fill(255, 150, 100);
            text('Jupiter', jupiter.pos.x, jupiter.pos.y - jupiter.radius - 8);
            
            // Spacecraft label
            if (spacecraft) {
                fill(0, 255, 136);
                text('Spacecraft', spacecraft.pos.x, spacecraft.pos.y - 15);
            }
        }
        
        function drawOrbitIndicators() {
            // Draw approximate orbital paths (faint circles)
            noFill();
            stroke(180);
            strokeWeight(0.5);
            
            // Earth approximate orbit
            let earthDist = p5.Vector.dist(earth.pos, sun.pos);
            ellipse(sun.pos.x, sun.pos.y, earthDist * 2);
            
            // Jupiter approximate orbit
            let jupiterDist = p5.Vector.dist(jupiter.pos, sun.pos);
            ellipse(sun.pos.x, sun.pos.y, jupiterDist * 2);
            
            noStroke();
        }
        
        // ============================================
        // INTERACTION
        // ============================================
        function keyPressed() {
            if (key === 'r' || key === 'R') {
                resetSimulation();
            }
            if (key === 'l' || key === 'L') {
                launchSpacecraft();
            }
            if (key === ' ') {
                launchSpacecraft();
            }
        }
        
        function mousePressed() {
            // Click to add perturbation to nearest body
            let mousePos = createVector(mouseX - CANVAS_SIZE / 2, mouseY - CANVAS_SIZE / 2);
            
            let closestBody = null;
            let closestDist = Infinity;
            
            for (let body of bodies) {
                let d = p5.Vector.dist(mousePos, body.pos);
                if (d < closestDist) {
                    closestDist = d;
                    closestBody = body;
                }
            }
            
            if (closestBody && closestDist < 100) {
                // Apply impulse toward click
                let impulse = p5.Vector.sub(mousePos, closestBody.pos).normalize().mult(0.5);
                closestBody.vel.add(impulse);
            }
        }
    </script>
</body>
</html>
