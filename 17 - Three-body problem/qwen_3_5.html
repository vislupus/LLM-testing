<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Gravitational System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }
        canvas {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 4px;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            user-select: none;
        }
        h1 { margin: 0 0 10px 0; font-size: 16px; }
        p { margin: 5px 0; font-size: 12px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>Gravitational Dynamics</h1>
        <div class="legend-item"><div class="dot" style="background:#FDB813"></div>Sun (Central)</div>
        <div class="legend-item"><div class="dot" style="background:#4F86F7"></div>Earth (Inner)</div>
        <div class="legend-item"><div class="dot" style="background:#D65A31"></div>Jupiter (Outer)</div>
        <div class="legend-item"><div class="dot" style="background:#00FF00"></div>Spacecraft</div>
        <p style="margin-top:10px; font-style:italic;">
            System is gravitationally bound but dynamically unstable.<br>
            Spacecraft performs a Hohmann-like transfer.
        </p>
    </div>

    <script>
        let bodies = [];
        let spacecraft;
        const G = 0.5; // Gravitational constant scaled for simulation
        const TRAIL_LENGTH = 400; // How many frames of history to keep

        // Simulation Constants
        // We scale masses and distances to fit the screen while maintaining relative physics
        const SUN_MASS = 2000;
        const JUPITER_MASS = 400; // Massive enough to perturb Earth significantly
        const EARTH_MASS = 50;
        const SC_MASS = 0.1;

        // Initial Distances (scaled)
        const EARTH_DIST = 150;
        const JUPITER_DIST = 320;

        function setup() {
            createCanvas(800, 600);
            
            // 1. Initialize Sun (at center, initially stationary)
            let sun = new Body(0, 0, 0, 0, SUN_MASS, 25, color(253, 184, 19));
            bodies.push(sun);

            // 2. Initialize Earth
            // For a circular orbit: v = sqrt(G * M_sun / r)
            // We add a slight perturbation to make it "chaotic/non-stable" visually
            let earthV = sqrt(G * SUN_MASS / EARTH_DIST);
            let earth = new Body(EARTH_DIST, 0, 0, earthV * 1.05, EARTH_MASS, 8, color(79, 134, 247));
            bodies.push(earth);

            // 3. Initialize Jupiter
            // To make the system wobble (barycenter not at Sun), we give Sun a slight counter-velocity later,
            // or just let the physics handle the momentum conservation if we set initial velocities correctly.
            // For visual chaos, let's put Jupiter in an elliptical orbit.
            let jupiterV = sqrt(G * SUN_MASS / JUPITER_DIST);
            let jupiter = new Body(-JUPITER_DIST, 0, 0, -jupiterV * 0.9, JUPITER_MASS, 18, color(214, 90, 49));
            bodies.push(jupiter);

            // 4. Initialize Spacecraft
            // Starts at Earth's position.
            // Needs to go to Jupiter. This requires a Transfer Orbit.
            // Semi-major axis of transfer orbit: a = (r1 + r2) / 2
            let r1 = EARTH_DIST;
            let r2 = JUPITER_DIST;
            let a_transfer = (r1 + r2) / 2;
            
            // Velocity needed at perihelion (Earth's orbit) for transfer:
            // v_transfer = sqrt( G * M_sun * (2/r1 - 1/a) )
            let v_transfer = sqrt(G * SUN_MASS * (2/r1 - 1/a_transfer));
            
            // Spacecraft inherits Earth's velocity + Delta V in the direction of motion
            // Earth is at (EARTH_DIST, 0) moving +Y. So Delta V is +Y.
            let scVx = 0;
            let scVy = earthV * 1.05 + (v_transfer - earthV * 1.05); // Add the difference
            
            spacecraft = new Body(EARTH_DIST, 0, scVx, scVy, SC_MASS, 4, color(0, 255, 0));
            spacecraft.isSpacecraft = true;

            // 5. Center the System (Conservation of Momentum)
            // Calculate total momentum and adjust Sun's velocity so total P = 0
            // This keeps the system centered on screen instead of drifting.
            let totalPX = 0;
            let totalPY = 0;
            let totalMass = 0;

            for (let b of bodies) {
                totalPX += b.vx * b.mass;
                totalPY += b.vy * b.mass;
                totalMass += b.mass;
            }
            // Add spacecraft momentum
            totalPX += spacecraft.vx * spacecraft.mass;
            totalPY += spacecraft.vy * spacecraft.mass;
            totalMass += spacecraft.mass;

            // Set Sun velocity to counteract total momentum
            // P_sun = - (P_others) => V_sun = -P_others / M_sun
            // Actually, simpler: V_cm = P_total / M_total. Set all V = V - V_cm.
            let VcmX = totalPX / totalMass;
            let VcmY = totalPY / totalMass;

            for (let b of bodies) {
                b.vx -= VcmX;
                b.vy -= VcmY;
            }
            spacecraft.vx -= VcmX;
            spacecraft.vy -= VcmY;
        }

        function draw() {
            background(220);
            translate(width / 2, height / 2);

            // Physics Sub-stepping for stability
            // Using 4 sub-steps per frame makes the orbits much smoother and energy-conserving
            let dt = 0.2; 
            for (let step = 0; step < 4; step++) {
                updatePhysics(dt);
            }

            // Draw Trails and Bodies
            for (let b of bodies) {
                b.drawTrail();
                b.display();
            }
            spacecraft.drawTrail();
            spacecraft.display();
        }

        function updatePhysics(dt) {
            let allObjects = [...bodies, spacecraft];

            // Calculate Forces
            for (let i = 0; i < allObjects.length; i++) {
                for (let j = i + 1; j < allObjects.length; j++) {
                    let bodyA = allObjects[i];
                    let bodyB = allObjects[j];

                    let dx = bodyB.x - bodyA.x;
                    let dy = bodyB.y - bodyA.y;
                    let distSq = dx*dx + dy*dy;
                    let dist = sqrt(distSq);

                    // Softening parameter to prevent extreme forces at collision
                    if (dist < 10) dist = 10; 

                    let forceMag = (G * bodyA.mass * bodyB.mass) / (dist * dist);
                    
                    let fx = forceMag * (dx / dist);
                    let fy = forceMag * (dy / dist);

                    bodyA.applyForce(fx, fy);
                    bodyB.applyForce(-fx, -fy);
                }
            }

            // Update Positions
            for (let obj of allObjects) {
                obj.update(dt);
            }
        }

        class Body {
            constructor(x, y, vx, vy, mass, radius, col) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.col = col;
                this.history = [];
                this.isSpacecraft = false;
            }

            applyForce(fx, fy) {
                this.vx += (fx / this.mass);
                this.vy += (fy / this.mass);
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Record history for trails (only every few frames to save memory)
                if (frameCount % 3 === 0) {
                    this.history.push({x: this.x, y: this.y});
                    if (this.history.length > TRAIL_LENGTH) {
                        this.history.shift();
                    }
                }
            }

            display() {
                noStroke();
                fill(this.col);
                ellipse(this.x, this.y, this.radius * 2);
            }

            drawTrail() {
                noFill();
                strokeWeight(this.isSpacecraft ? 2 : 1);
                
                // Draw trail with fading opacity
                for (let i = 0; i < this.history.length - 1; i++) {
                    let pos1 = this.history[i];
                    let pos2 = this.history[i+1];
                    
                    // Alpha based on index (older = more transparent)
                    let alpha = map(i, 0, this.history.length, 0, 150);
                    stroke(red(this.col), green(this.col), blue(this.col), alpha);
                    
                    line(pos1.x, pos1.y, pos2.x, pos2.y);
                }
            }
        }
    </script>
</body>
</html>
