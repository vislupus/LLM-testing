<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravitational Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(20,20,40,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 28px;
  color:#fff;font-size:14px;font-weight:700;letter-spacing:.6px;text-align:center}
#hud small{font-weight:400;font-size:10px;color:rgba(255,255,255,.35);display:block;margin-top:2px}
#pan{position:fixed;top:70px;right:14px;z-index:10;
  background:rgba(20,20,40,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px;width:230px;
  color:rgba(255,255,255,.75);font-size:11px}
#pan h3{font-size:12px;font-weight:700;margin-bottom:10px;color:#9ab;text-align:center;letter-spacing:1px}
.sg{margin-bottom:9px}
.sg label{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:3px}
.sg b{color:#5ce;font-weight:700;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
  background:rgba(255,255,255,.1);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:14px;height:14px;border-radius:50%;background:#5ce;cursor:pointer;
  box-shadow:0 0 5px rgba(92,238,238,.35)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#5ce;cursor:pointer;border:none}
.br{display:flex;gap:6px;margin:8px 0}
.bt{flex:1;background:rgba(92,238,238,.1);color:#5ce;border:1px solid rgba(92,238,238,.22);
  border-radius:6px;padding:5px;font-size:10.5px;cursor:pointer;transition:all .2s;text-align:center}
.bt:hover{background:rgba(92,238,238,.25)}
.bt.on{background:rgba(92,238,238,.32);border-color:#5ce}
#st{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);
  line-height:1.9;font-size:10.5px}
#st i{color:#5ce;font-style:normal;font-weight:700}
#tl{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);
  font-size:10px;line-height:1.7;color:rgba(255,255,255,.4)}
#ft{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  color:rgba(255,255,255,.2);font-size:9.5px;pointer-events:none;z-index:10;text-align:center}
</style>
</head>
<body>
<div id="hud">🌍 Multi-Body Gravitational Simulation<small>Newtonian gravity · Sun · Earth · Jupiter · Spacecraft</small></div>
<div id="pan">
  <h3>⚙ CONTROLS</h3>
  <div class="sg"><label><span>Zoom</span><b id="vz">0.80</b></label>
    <input type="range" id="sz" min="1" max="200" value="22"></div>
  <div class="sg"><label><span>Trail Length</span><b id="vt">700</b></label>
    <input type="range" id="stl" min="80" max="3000" step="20" value="700"></div>
  <div class="sg"><label><span>Speed</span><b id="vs">1.0×</b></label>
    <input type="range" id="ssp" min="1" max="5" step="0.5" value="1"></div>
  <div class="br"><button class="bt" id="brst">↻ Reset</button><button class="bt on" id="btr">Trails</button></div>
  <div class="br"><button class="bt on" id="baz">Auto-Zoom</button></div>
  <div id="st">
    ⏱ Frame <i id="sf">0</i> &nbsp;·&nbsp; T+<i id="sT">0.0</i>s<br>
    🚀 Phase: <i id="sph">Docked on Earth</i><br>
    📐 Zoom: <i id="szo">auto</i>
  </div>
  <div id="tl">
    🖱 Scroll = zoom<br>
    🖱 Drag = pan<br>
    Auto-zoom keeps all bodies visible
  </div>
</div>
<div id="ft">Scroll to zoom · Drag to pan · Bodies remain bounded</div>

<script>
/* ═══════════════════════════════════════════════
   p5.js SKETCH
   ═══════════════════════════════════════════════ */
var sketch=function(p){

/* ── Constants ── */
var G      = 1;
var SUB    = 50;          // physics substeps per draw frame
var DT     = 1.0/60/SUB;  // timestep per substep
var SF     = 20;          // softening (prevents singularities)
var SQSF   = SF*SF;

/* ── Configuration ── */
var IC=[
  {m:10000, px:0,    py:0,    vx:0,     vy:0,    label:'Sun',    col:[255,195,45],  r:35},
  {m:10,    px:230,  py:0,    vx:0,     vy:4.47, label:'Earth',  col:[55,130,235],  r:5},
  {m:500,   px:-50,  py:380,  vx:3.2,   vy:0.42, label:'Jupiter',col:[215,155,75], r:16}
];

/* ── State ── */
var B, SC, trails;
var frame=0, showTrails=true, autoZ=true, spd=1, tLen=700;
var cam={sc:0.8, ox:0, oy:0, tSc:0.8, tOx:0, tOy:0};
var drag=false, dp={x:0,y:0};

/* ── Initialise ── */
function init(){
  B=IC.map(function(c){return{m:c.m,x:c.px,y:c.py,vx:c.vx,vy:c.vy,label:c.label,col:c.col,r:c.r};});
  SC={x:0,y:0,vx:0,vy:0,phase:0,t0:0,r0:0,vr0:0,trail:[]};
  trails=B.map(function(){return[];});
  frame=0;
  updStatus();
}

/* ── Setup ── */
p.setup=function(){
  p.createCanvas(p.windowWidth,p.windowHeight);
  p.noStroke();
  init();

  var zl=document.getElementById('sz');
  zl.oninput=function(){cam.tSc=Math.pow(10,(this.value-1)/33-1);
    document.getElementById('vz').textContent=cam.tSc.toFixed(2);autoZ=false;
    document.getElementById('baz').classList.remove('on');document.getElementById('szo').textContent=cam.tSc.toFixed(2);};

  document.getElementById('stl').oninput=function(){tLen=+this.value;document.getElementById('vt').textContent=tLen;};
  document.getElementById('ssp').oninput=function(){spd=+this.value;document.getElementById('vs').textContent=spd+'×';};
  document.getElementById('brst').onclick=function(){init();};
  document.getElementById('btr').onclick=function(){showTrails=!showTrails;this.classList.toggle('on',showTrails);};
  document.getElementById('baz').onclick=function(){autoZ=!autoZ;this.classList.toggle('on',autoZ);
    document.getElementById('szo').textContent=autoZ?'auto':cam.sc.toFixed(2);};
};

/* ── Window resize ── */
p.windowResized=function(){p.resizeCanvas(p.windowWidth,p.windowHeight);};

/* ══════════════════════════════════════
   PHYSICS
   ══════════════════════════════════════ */

/* gravitational acceleration on body i */
function accel(i){
  var ax=0,ay=0,bi=B[i];
  for(var j=0;j<B.length;j++){
    if(j===i) continue;
    var bj=B[j], dx=bj.x-bi.x, dy=bj.y-bi.y;
    var d2=dx*dx+dy*dy+SQSF;
    var inv=1/Math.sqrt(d2);      // 1/d  (softened)
    var inv3=inv*inv*inv;          // 1/d³
    var f=G*bj.m*inv3;
    ax+=f*dx; ay+=f*dy;
  }
  return[ax,ay];
}

/* spacecraft acceleration (from planets only) */
function scAccel(){
  var ax=0,ay=0;
  for(var j=0;j<B.length;j++){
    var bj=B[j], dx=bj.x-SC.x, dy=bj.y-SC.y;
    var d2=dx*dx+dy*dy+SQSF;
    var inv=1/Math.sqrt(d2);
    var f=G*bj.m*inv*inv*inv;
    ax+=f*dx; ay+=f*dy;
  }
  return[ax,ay];
}

/* one integration step (semi-implicit Euler / symplectic) */
function step(){
  // planets
  var accels=[];
  for(var i=0;i<B.length;i++) accels.push(accel(i));
  for(var i=0;i<B.length;i++){
    var a=accels[i], b=B[i];
    b.vx+=a[0]*DT; b.vy+=a[1]*DT;
    b.x +=b.vx*DT; b.y +=b.vy*DT;
  }

  // spacecraft (phases 1 & 2 only)
  if(SC.phase>=1 && SC.phase<=2){
    var sa=scAccel();
    SC.vx+=sa[0]*DT; SC.vy+=sa[1]*DT;
    SC.x +=SC.vx*DT; SC.y +=SC.vy*DT;
  }
}

/* full update: many substeps + trail + mission logic */
function update(){
  for(var s=0;s<SUB*spd;s++) step();

  // store trails
  for(var i=0;i<B.length;i++) trails[i].push([B[i].x,B[i].y]);
  for(var i=0;i<B.length;i++){
    while(trails[i].length>tLen) trails[i].shift();
  }

  // spacecraft trail
  if(SC.phase>=1){
    SC.trail.push([SC.x,SC.y]);
    while(SC.trail.length>tLen) SC.trail.shift();
  }

  // mission logic
  updateSC();
  frame++;

  if(frame%8===0) updStatus();
}

/* ══════════════════════════════════════
   SPACECRAFT MISSION
   ══════════════════════════════════════ */
function updateSC(){
  var e=B[1]; // Earth

  /* Phase 0 — docked on Earth */
  if(SC.phase===0){
    SC.x=e.x; SC.y=e.y;
    if(frame===500){  // ~8.3 s
      SC.phase=1;
      SC.t0=frame;
      SC.x=e.x; SC.y=e.y;
      SC.vx=e.vx; SC.vy=e.vy;
      // prograde boost to create a clear orbital arc
      var spd2=Math.sqrt(e.vx*e.vx+e.vy*e.vy);
      if(spd2>0.001){
        SC.vx+=e.vx/spd2*0.5;
        SC.vy+=e.vy/spd2*0.5;
      }
      SC.r0=Math.sqrt(e.x*e.x+e.y*e.y);
      SC.vr0=Math.sqrt(SC.vx*SC.vx+SC.vy*SC.vy);
      SC.trail=[[SC.x,SC.y]];
    }
  }

  /* Phase 1 — heliocentric arc (loop around the Sun) */
  if(SC.phase===1){
    // approach: |v| decreasing toward apoapsis
    var nowSpd=Math.sqrt(SC.vx*SC.vx+SC.vy*SC.vy);
    var pastApoapsis=nowSpd>SC.vr0*0.92 && frame>SC.t0+400;
    // time-based fallback
    var timeOK=frame>SC.t0+900;

    if(pastApoapsis || timeOK){
      SC.phase=2;
    }
  }

  /* Phase 2 — redirect toward Jupiter */
  if(SC.phase===2){
    var j=B[2]; // Jupiter
    var dx=j.x-SC.x, dy=j.y-SC.y;
    var dist=Math.sqrt(dx*dx+dy*dy);
    var speed=Math.sqrt(SC.vx*SC.vx+SC.vy*SC.vy);

    if(dist>0.01 && speed>0.001){
      // blend velocity direction toward Jupiter
      var desiredVx=j.vx+dx/dist*speed*0.45;
      var desiredVy=j.vy+dy/dist*speed*0.45;
      var blend=Math.min(1,0.012);
      SC.vx+=(desiredVx-SC.vx)*blend;
      SC.vy+=(desiredVy-SC.vy)*blend;
    }
  }
}

/* ══════════════════════════════════════
   COORDINATE TRANSFORM
   ══════════════════════════════════════ */
function tx(x){return p.width/2+(x-cam.ox)*cam.sc;}
function ty(y){return p.height/2+(y-cam.oy)*cam.sc;}

/* ══════════════════════════════════════
   DRAWING
   ══════════════════════════════════════ */
p.draw=function(){
  p.background(220);

  if(autoZ) autoZoom();
  cam.sc+=(cam.tSc-cam.sc)*0.065;
  cam.ox+=(cam.tOx-cam.ox)*0.065;
  cam.oy+=(cam.tOy-cam.oy)*0.065;

  update();
  drawTrails();
  drawBodies();
  drawSC();
  drawLabels();
  drawInfo();
};

/* ── Orbital trails ── */
function drawTrails(){
  if(!showTrails) return;

  for(var i=0;i<B.length;i++){
    var tr=trails[i], n=tr.length;
    if(n<2) continue;
    var c=B[i].col;
    p.beginShape();
    for(var j=0;j<n;j++){
      var al=p.map(j,0,n,0,190);
      p.stroke(c[0],c[1],c[2],al);
      p.strokeWeight(p.map(j,0,n,0.4,2.4));
      p.vertex(tx(tr[j][0]),ty(tr[j][1]));
    }
    p.endShape();
  }
  p.noStroke();

  // spacecraft trail
  var str=SC.trail, sn=str.length;
  if(sn>=2 && SC.phase>=1){
    p.beginShape();
    for(var j=0;j<sn;j++){
      var al=p.map(j,0,sn,0,220);
      p.stroke(255,220,50,al);
      p.strokeWeight(p.map(j,0,sn,0.5,2.8));
      p.vertex(tx(str[j][0]),ty(str[j][1]));
    }
    p.endShape();
    p.noStroke();
  }
}

/* ── Bodies ── */
function drawBodies(){
  // Sun glow
  var s=B[0], sx=tx(s.x), sy=ty(s.y), sr=Math.max(s.r*cam.sc,6);
  for(var g=4;g>=0;g--){
    var gr=sr*(1+g*1.3);
    p.fill(255,210,55,p.map(g,4,0,6,55));
    p.ellipse(sx,sy,gr*2,gr*2);
  }
  p.fill(255,230,90); p.ellipse(sx,sy,sr*2,sr*2);
  p.fill(255,245,175); p.ellipse(sx-sr*0.18,sy-sr*0.18,sr*1.05,sr*1.05);

  // Earth
  var e=B[1], ex=tx(e.x), ey=ty(e.y), er=Math.max(e.r*cam.sc,4);
  p.fill(55,130,235); p.ellipse(ex,ey,er*2,er*2);
  p.fill(70,165,110,180);
  p.ellipse(ex+er*0.25,ey-er*0.15,er*0.9,er*0.6);
  p.ellipse(ex-er*0.3,ey+er*0.25,er*0.55,er*0.45);
  p.fill(255,255,255,50);
  p.ellipse(ex-er*0.1,ey-er*0.3,er*0.7,er*0.35);

  // Jupiter
  var j=B[2], jx=tx(j.x), jy=ty(j.y), jr=Math.max(j.r*cam.sc,5);
  p.fill(215,155,75); p.ellipse(jx,jy,jr*2,jr*2);
  p.fill(195,120,50,160);
  p.ellipse(jx,jy-jr*0.28,jr*1.7,jr*0.28);
  p.ellipse(jx,jy+jr*0.12,jr*1.35,jr*0.2);
  p.fill(240,195,130,120);
  p.ellipse(jx+jr*0.1,jy-jr*0.48,jr*0.45,jr*0.14);
  p.fill(255,255,255,28);
  p.ellipse(jx-jr*0.25,jy-jr*0.3,jr*0.6,jr*0.3);
}

/* ── Spacecraft ── */
function drawSC(){
  if(SC.phase<1) return;
  var sx=tx(SC.x), sy=ty(SC.y);

  // engine glow
  p.fill(255,200,50,30);
  p.ellipse(sx,sy,22,22);
  p.fill(255,230,100,55);
  p.ellipse(sx,sy,12,12);

  // body
  p.fill(255,235,70);
  p.ellipse(sx,sy,7,7);

  // direction arrow
  var spd=Math.sqrt(SC.vx*SC.vx+SC.vy*SC.vy);
  if(spd>0.05){
    var ax=SC.vx/spd*14, ay=SC.vy/spd*14;
    p.stroke(255,235,70,190);
    p.strokeWeight(1.6);
    p.line(sx,sy,sx+ax,sy+ay);
    var aa=Math.atan2(ay,ax);
    p.line(sx+ax,sy+ay,sx+ax-5*Math.cos(aa-0.45),sy+ay-5*Math.sin(aa-0.45));
    p.line(sx+ax,sy+ay,sx+ax-5*Math.cos(aa+0.45),sy+ay-5*Math.sin(aa+0.45));
    p.noStroke();
  }
}

/* ── Labels ── */
function drawLabels(){
  p.textAlign(p.CENTER,p.BOTTOM);
  p.textSize(11);

  // planet labels
  for(var i=0;i<B.length;i++){
    var b=B[i];
    var bx=tx(b.x), by=ty(b.y);
    var br=Math.max(b.r*cam.sc,4);
    p.fill(0,0,0,130);
    p.text(b.label,bx+0.5,by-br-7.5);
    p.fill(b.col[0],b.col[1],b.col[2]);
    p.text(b.label,bx,by-br-8);
  }

  // spacecraft label
  if(SC.phase>=1){
    var scx=tx(SC.x), scy=ty(SC.y);
    var names=['','🛰️ Transfer','🛰️ → Jupiter',''];
    p.fill(0,0,0,130);
    p.text(names[SC.phase]||'🚀 Spacecraft',scx+0.5,scy-17.5);
    p.fill(255,220,50);
    p.text(names[SC.phase]||'🚀 Spacecraft',scx,scy-18);
  }
}

/* ── HUD ── */
function drawInfo(){
  // energy display (top-left)
  p.textAlign(p.LEFT,p.TOP);
  p.textSize(10);
  p.fill(0,0,0,50);

  var ke=0;
  for(var i=0;i<B.length;i++) ke+=0.5*B[i].m*(B[i].vx*B[i].vx+B[i].vy*B[i].vy);

  var pe=0;
  for(var i=0;i<B.length;i++) for(var j=i+1;j<B.length;j++){
    var dx=B[i].x-B[j].x, dy=B[i].y-B[j].y;
    pe-=G*B[i].m*B[j].m/Math.sqrt(dx*dx+dy*dy);
  }
  p.fill(0,0,0,70);
  p.text('E = '+(ke+pe).toFixed(0)+'  |  KE = '+ke.toFixed(0)+'  |  PE = '+pe.toFixed(0),12,p.height-28);
}

/* ══════════════════════════════════════
   AUTO-ZOOM
   ══════════════════════════════════════ */
function autoZoom(){
  var cX=0,cY=0,tM=0;
  for(var i=0;i<B.length;i++){cX+=B[i].x*B[i].m;cY+=B[i].y*B[i].m;tM+=B[i].m;}
  if(SC.phase>=1){cX+=SC.x*0.01;cY+=SC.y*0.01;tM+=0.01;}
  cX/=tM; cY/=tM;

  var maxD=0;
  for(var i=0;i<B.length;i++){
    var d=Math.sqrt((B[i].x-cX)*(B[i].x-cX)+(B[i].y-cY)*(B[i].y-cY))+B[i].r;
    if(d>maxD) maxD=d;
  }
  if(SC.phase>=1){
    var sd=Math.sqrt((SC.x-cX)*(SC.x-cX)+(SC.y-cY)*(SC.y-cY));
    if(sd+5>maxD) maxD=sd+5;
  }

  if(maxD<1) maxD=1;
  cam.tSc=Math.min(2.8, p.width/(maxD*2.3));
  cam.tSc=Math.max(cam.tSc,0.006);
  cam.tOx=cX; cam.tOy=cY;
}

/* ══════════════════════════════════════
   INPUT
   ══════════════════════════════════════ */
p.mouseWheel=function(e){
  var mx=(p.mouseX-p.width/2)/cam.sc+cam.ox;
  var my=(p.mouseY-p.height/2)/cam.sc+cam.oy;
  cam.tSc*=e.delta>0?0.92:1.08;
  cam.tSc=Math.max(0.006,Math.min(5,cam.tSc));
  cam.tOx=mx-(p.mouseX-p.width/2)/cam.tSc;
  cam.tOy=my-(p.mouseY-p.height/2)/cam.tSc;
  autoZ=false;
  document.getElementById('baz').classList.remove('on');
  document.getElementById('szo').textContent=cam.tSc.toFixed(2);
  return false;
};

p.mousePressed=function(){
  if(p.mouseX<p.width-248||p.mouseY>52) return;
  drag=true; dp.x=p.mouseX; dp.y=p.mouseY;
};

p.mouseReleased=function(){drag=false;};

p.mouseDragged=function(){
  if(!drag) return;
  cam.tOx-=(p.mouseX-dp.x)/cam.sc;
  cam.tOy-=(p.mouseY-dp.y)/cam.sc;
  cam.ox=cam.tOx; cam.oy=cam.tOy; // instant for drag feel
  dp.x=p.mouseX; dp.y=p.mouseY;
  autoZ=false;
  document.getElementById('baz').classList.remove('on');
  document.getElementById('szo').textContent=cam.sc.toFixed(2);
};

/* ══════════════════════════════════════
   STATUS TEXT
   ══════════════════════════════════════ */
function updStatus(){
  document.getElementById('sf').textContent=frame;
  document.getElementById('sT').textContent=(frame/60).toFixed(1);
  var ph=['Docked on Earth','Heliocentric arc (loop)','Redirecting → Jupiter','Arrived'];
  document.getElementById('sph').textContent=ph[SC.phase]||'—';
}

}; // end sketch
new p5(sketch);
</script>
</body>
</html>
