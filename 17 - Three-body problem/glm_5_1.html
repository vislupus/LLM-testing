<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Gravitational Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<script>
// Gravitational constant (arbitrary units for visual scale)
const G = 1.0;
const dt = 0.2;
const SOFTENING = 8.0; // Prevents infinite forces at very close distances

let sun, earth, jupiter, spacecraft;
let bodies = [];
let trailBuffer;

// Spacecraft mission state
let scState = 0; 
let scTimer = 0;

function setup() {
    createCanvas(800, 800);
    background(220);
    
    // Create off-screen graphics buffer for persistent orbital trails
    trailBuffer = createGraphics(800, 800);
    trailBuffer.background(220);
    trailBuffer.noStroke();

    // Masses configured for chaotic but bounded interactions (Jupiter is 1/4 Sun's mass)
    let mSun = 800;
    let mJupiter = 200;
    let mEarth = 10;

    // Initial positions (Center of Mass adjusted to origin)
    // Raw positions: Sun(0,0), Jup(0, -150), Ear(0, -80)
    let totalMass = mSun + mJupiter + mEarth;
    let comY = (mJupiter * -150 + mEarth * -80) / totalMass;

    let pSun = createVector(0, -comY);
    let pJup = createVector(0, -150 - comY);
    let pEar = createVector(0, -80 - comY);

    // Initial velocities (roughly circular, COM velocity = 0)
    let vCircJup = sqrt(G * mSun / 150) * 1.05; // Slightly faster for chaotic elliptical perturbation
    let vCircEar = sqrt(G * mSun / 80) * 0.95;  // Slightly slower for eccentricity

    let vSun = createVector(0, 0);
    let vJup = createVector(vCircJup, 0);
    let vEar = createVector(vCircEar, 0);

    // Adjust Sun velocity so total system momentum is zero
    vSun.y = -(mJupiter * vJup.x + mEarth * vEar.x) / mSun;

    sun = new Body(pSun, vSun, mSun, color(255, 204, 0), 18);
    jupiter = new Body(pJup, vJup, mJupiter, color(255, 100, 50), 12);
    earth = new Body(pEar, vEar, mEarth, color(50, 150, 255), 7);

    bodies = [sun, jupiter, earth];

    // Spacecraft setup
    // Starts at Earth with Earth's velocity
    let scPos = pEar.copy();
    let scVel = vEar.copy();
    spacecraft = new Body(scPos, scVel, 0.001, color(0, 255, 100), 4); // Negligible mass
    bodies.push(spacecraft);
}

function draw() {
    // Draw background
    background(220);
    
    // Update physics
    computeGravity();
    updatePositions();
    
    // Spacecraft mission logic
    updateSpacecraftMission();

    // Draw trails on the buffer
    trailBuffer.noStroke();
    for (let b of bodies) {
        if (b === spacecraft) {
            trailBuffer.fill(0, 255, 100, 150);
        } else {
            trailBuffer.fill(red(b.col), green(b.col), blue(b.col), 100);
        }
        // Map sim coords to canvas coords (centered)
        let px = width / 2 + b.pos.x;
        let py = height / 2 + b.pos.y;
        trailBuffer.ellipse(px, py, b.r * 0.5, b.r * 0.5);
    }

    // Render trail buffer
    image(trailBuffer, 0, 0);

    // Render bodies on main canvas
    push();
    translate(width / 2, height / 2);
    noStroke();
    for (let b of bodies) {
        fill(b.col);
        ellipse(b.pos.x, b.pos.y, b.r, b.r);
        
        // Add a subtle glow to the sun
        if (b === sun) {
            fill(255, 204, 0, 50);
            ellipse(b.pos.x, b.pos.y, b.r * 2, b.r * 2);
        }
    }
    pop();
    
    // UI Text
    fill(0);
    noStroke();
    textSize(14);
    textAlign(LEFT, TOP);
    text("Spacecraft State: " + getSCStateText(), 10, 10);
}

function getSCStateText() {
    if (scState === 0) return "Awaiting Launch from Earth";
    if (scState === 1) return "Departing Earth -> Sun";
    if (scState === 2) return "Looping the Sun";
    if (scState === 3) return "Transfer to Jupiter";
    if (scState === 4) return "Jupiter Orbit Achieved";
    return "Unknown";
}

function updateSpacecraftMission() {
    scTimer++;
    let distToSun = p5.Vector.dist(spacecraft.pos, sun.pos);
    let distToJup = p5.Vector.dist(spacecraft.pos, jupiter.pos);
    let distToEar = p5.Vector.dist(spacecraft.pos, earth.pos);

    if (scState === 0 && scTimer > 100) {
        // Phase 1: Burn retrograde to drop perihelion towards the Sun
        let dir = spacecraft.vel.copy().normalize();
        spacecraft.vel.sub(dir.mult(3.2)); // Strong retrograde burn
        scState = 1;
    } 
    else if (scState === 1 && distToSun < 100) {
        // Phase 2: Falling towards sun, wait for close approach
        scState = 2;
    }
    else if (scState === 2 && distToSun < 35) {
        // Phase 3: At perihelion (close to Sun), burn prograde to raise aphelion to Jupiter
        let dir = spacecraft.vel.copy().normalize();
        spacecraft.vel.add(dir.mult(5.5)); // Strong prograde burn (Oberth effect)
        scState = 3;
    }
    else if (scState === 3 && distToJup < 40) {
        // Phase 4: Arrived near Jupiter, burn to match velocity roughly (capture)
        let dir = spacecraft.vel.copy().normalize();
        // Simple capture burn (reduce relative velocity)
        if (spacecraft.vel.mag() > jupiter.vel.mag() * 1.2) {
             spacecraft.vel.mult(0.95); // Continuous gentle braking
        } else {
            scState = 4;
        }
    }
}

function computeGravity() {
    // Reset accelerations
    for (let b of bodies) {
        b.acc.set(0, 0);
    }

    // Calculate pairwise gravitational forces
    for (let i = 0; i < bodies.length; i++) {
        for (let j = i + 1; j < bodies.length; j++) {
            let bodyA = bodies[i];
            let bodyB = bodies[j];

            let force = p5.Vector.sub(bodyB.pos, bodyA.pos);
            let distanceSq = force.magSq();
            
            // Apply softening to prevent numerical explosions on close encounters
            distanceSq = constrain(distanceSq, SOFTENING * SOFTENING, Infinity);
            
            let strength = (G * bodyA.mass * bodyB.mass) / distanceSq;
            force.setMag(strength);

            let accA = p5.Vector.div(force, bodyA.mass);
            let accB = p5.Vector.div(force, bodyB.mass);

            bodyA.acc.add(accA);
            bodyB.acc.sub(accB); // Newton's third law
        }
    }
}

function updatePositions() {
    // Symplectic Euler integration (updates velocity first, then position for better energy conservation)
    for (let b of bodies) {
        b.vel.add(p5.Vector.mult(b.acc, dt));
        b.pos.add(p5.Vector.mult(b.vel, dt));
    }
}

class Body {
    constructor(pos, vel, mass, col, r) {
        this.pos = pos.copy();
        this.vel = vel.copy();
        this.acc = createVector(0, 0);
        this.mass = mass;
        this.col = col;
        this.r = r;
    }
}

// Interaction: Press 'R' to reset simulation
function keyPressed() {
    if (key === 'r' || key === 'R') {
        setup();
    }
}
</script>
</body>
</html>
