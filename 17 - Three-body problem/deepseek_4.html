<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Body Gravitational System – Sun, Earth, Jupiter & Spacecraft</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 160, 40, 0.25), 0 0 120px rgba(255, 100, 30, 0.12);
        }
        canvas {
            display: block;
        }
        #info-panel {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 22px;
            padding: 10px 20px;
            color: #ddd;
            font-size: 12px;
            letter-spacing: 0.04em;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
        }
        #info-panel span {
            font-weight: 700;
            color: #ffb74d;
        }
        @media (max-width: 700px) {
            #info-panel {
                font-size: 9px;
                padding: 6px 12px;
                border-radius: 14px;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        🌌 <span>Sun</span> · <span style="color:#64b5f6;">Earth</span> · <span style="color:#ef8a4a;">Jupiter</span> · <span style="color:#fff;">✦ Spacecraft</span> &nbsp;|&nbsp; 🖱️ Drag to pan &nbsp;|&nbsp; Scroll to zoom
    </div>

    <script>
        // ────────────────────────────────────────────
        // p5.js Sketch – Multi-Body Gravitational System
        // ────────────────────────────────────────────
        new p5((p) => {
            // ── Physics constants ──────────────────
            const G = 0.4; // Gravitational constant (scaled for visual appeal)
            const SOFTENING = 4.5; // Softening length to prevent singularities
            const SUBSTEPS = 5; // Physics substeps per frame for accuracy
            const TRAIL_LENGTH = 380; // Number of trail positions stored per body

            // ── Bodies ────────────────────────────
            let sun, earth, jupiter, spacecraft;

            // ── Spacecraft mission state ──────────
            let spacecraftAttached = true;
            let departureFrame = 195; // Frame when spacecraft leaves Earth
            let boost1Applied = false;
            let boost2Applied = false;
            let periapsisReached = false;
            let missionComplete = false;
            let missionMessage = '';

            // ── Camera / view ─────────────────────
            let viewOffsetX = 0;
            let viewOffsetY = 0;
            let viewScale = 1.0;
            let targetScale = 1.0;
            let targetOffsetX = 0;
            let targetOffsetY = 0;
            let isDragging = false;
            let dragStartX = 0;
            let dragStartY = 0;
            let dragStartOffX = 0;
            let dragStartOffY = 0;

            // ────────────────────────────────────────
            // BODY CLASS
            // ────────────────────────────────────────
            class Body {
                constructor(name, x, y, vx, vy, mass, color, glowColor, visualRadius) {
                    this.name = name;
                    this.pos = p.createVector(x, y);
                    this.vel = p.createVector(vx, vy);
                    this.acc = p.createVector(0, 0);
                    this.mass = mass;
                    this.color = color;
                    this.glowColor = glowColor;
                    this.visualRadius = visualRadius;
                    this.trail = []; // Array of {x, y} for trail positions
                }

                // Store current position in trail
                recordTrail() {
                    this.trail.push({ x: this.pos.x, y: this.pos.y });
                    while (this.trail.length > TRAIL_LENGTH) {
                        this.trail.shift();
                    }
                }

                // Apply gravitational force from another body
                applyGravityFrom(other) {
                    const dx = other.pos.x - this.pos.x;
                    const dy = other.pos.y - this.pos.y;
                    const distSq = dx * dx + dy * dy + SOFTENING * SOFTENING;
                    const dist = p.sqrt(distSq);
                    const forceMag = G * this.mass * other.mass / distSq;
                    const fx = forceMag * dx / dist;
                    const fy = forceMag * dy / dist;
                    this.acc.x += fx / this.mass;
                    this.acc.y += fy / this.mass;
                }

                // Update position using accumulated acceleration (Euler integration)
                update(dt) {
                    this.vel.x += this.acc.x * dt;
                    this.vel.y += this.acc.y * dt;
                    this.pos.x += this.vel.x * dt;
                    this.pos.y += this.vel.y * dt;
                    this.acc.set(0, 0);
                }

                // Draw the body
                draw() {
                    // Glow
                    if (this.glowColor) {
                        for (let g = 3; g >= 1; g--) {
                            const alpha = p.map(g, 1, 3, 18, 55);
                            const rad = this.visualRadius + g * (this.visualRadius * 0.7);
                            p.fill(p.red(this.glowColor), p.green(this.glowColor), p.blue(this.glowColor), alpha);
                            p.noStroke();
                            p.ellipse(this.pos.x, this.pos.y, rad * 2, rad * 2);
                        }
                    }
                    // Main body
                    p.fill(this.color);
                    p.noStroke();
                    p.ellipse(this.pos.x, this.pos.y, this.visualRadius * 2, this.visualRadius * 2);
                }

                // Draw trail as dotted line of small filled circles
                drawTrail() {
                    if (this.trail.length < 2) return;
                    const step = p.max(1, p.floor(this.trail.length / 140));
                    for (let i = 0; i < this.trail.length - 1; i += step) {
                        const t = this.trail[i];
                        const alpha = p.map(i, 0, this.trail.length - 1, 15, 75);
                        const sz = p.map(i, 0, this.trail.length - 1, 0.6, 2.2);
                        p.fill(p.red(this.color), p.green(this.color), p.blue(this.color), alpha);
                        p.noStroke();
                        p.ellipse(t.x, t.y, sz, sz);
                    }
                }
            }

            // ────────────────────────────────────────
            // SETUP
            // ────────────────────────────────────────
            p.setup = function() {
                const canvas = p.createCanvas(900, 900);
                canvas.parent('canvas-container');
                p.frameRate(60);
                p.textFont('monospace');

                // Initialize bodies
                // Sun: massive, near center with slight initial drift
                sun = new Body(
                    'Sun',
                    450, 450, // position (center of canvas)
                    0.03, -0.02, // slight drift velocity
                    22000, // mass (dominant)
                    p.color(255, 185, 60), // warm orange-yellow
                    p.color(255, 150, 30), // glow color
                    24 // visual radius
                );

                // Earth: orbits Sun at ~170 pixels
                earth = new Body(
                    'Earth',
                    450, 280, // start above Sun at distance ~170
                    7.65, 0.08, // slightly above circular for chaotic orbit
                    6, // mass
                    p.color(70, 160, 240), // blue
                    p.color(50, 130, 220),
                    6
                );

                // Jupiter: orbits further out, more eccentric
                jupiter = new Body(
                    'Jupiter',
                    450, 638, // start below Sun at distance ~188
                    -5.15, 0.25, // retrograde-ish, below circular for interaction
                    160, // mass (significant for chaos)
                    p.color(225, 140, 65), // orange-brown
                    p.color(200, 110, 45),
                    11
                );

                // Spacecraft: starts attached to Earth
                spacecraft = new Body(
                    'Spacecraft',
                    earth.pos.x, earth.pos.y,
                    earth.vel.x, earth.vel.y,
                    0.15, // tiny mass
                    p.color(255, 255, 240), // bright white
                    p.color(255, 240, 200),
                    3
                );
                spacecraftAttached = true;
                boost1Applied = false;
                boost2Applied = false;
                periapsisReached = false;
                missionComplete = false;
                missionMessage = '';

                // Initialize trails with current positions
                for (let i = 0; i < 30; i++) {
                    sun.recordTrail();
                    earth.recordTrail();
                    jupiter.recordTrail();
                    spacecraft.recordTrail();
                }
            };

            // ────────────────────────────────────────
            // DRAW
            // ────────────────────────────────────────
            p.draw = function() {
                // ── Smooth camera transitions ──────
                viewScale += (targetScale - viewScale) * 0.08;
                viewOffsetX += (targetOffsetX - viewOffsetX) * 0.08;
                viewOffsetY += (targetOffsetY - viewOffsetY) * 0.08;

                p.background(220);

                // Apply view transform
                p.push();
                p.translate(p.width / 2 + viewOffsetX, p.height / 2 + viewOffsetY);
                p.scale(viewScale);
                p.translate(-p.width / 2, -p.height / 2);

                // ── Physics substeps ───────────────
                const dt = 1.0 / (60.0 * SUBSTEPS);
                for (let s = 0; s < SUBSTEPS; s++) {
                    // Reset accelerations
                    sun.acc.set(0, 0);
                    earth.acc.set(0, 0);
                    jupiter.acc.set(0, 0);
                    spacecraft.acc.set(0, 0);

                    // Calculate all gravitational interactions
                    // Sun <-> Earth
                    sun.applyGravityFrom(earth);
                    earth.applyGravityFrom(sun);
                    // Sun <-> Jupiter
                    sun.applyGravityFrom(jupiter);
                    jupiter.applyGravityFrom(sun);
                    // Earth <-> Jupiter
                    earth.applyGravityFrom(jupiter);
                    jupiter.applyGravityFrom(earth);
                    // Spacecraft affected by all three (but doesn't affect them significantly)
                    if (!spacecraftAttached) {
                        spacecraft.applyGravityFrom(sun);
                        spacecraft.applyGravityFrom(earth);
                        spacecraft.applyGravityFrom(jupiter);
                    }
                    // Sun, Earth, Jupiter also feel spacecraft (negligible but included for completeness)
                    sun.applyGravityFrom(spacecraft);
                    earth.applyGravityFrom(spacecraft);
                    jupiter.applyGravityFrom(spacecraft);

                    // Update positions
                    sun.update(dt);
                    earth.update(dt);
                    jupiter.update(dt);
                    if (!spacecraftAttached) {
                        spacecraft.update(dt);
                    }
                }

                // ── Spacecraft mission logic ───────
                const currentFrame = p.frameCount;

                if (spacecraftAttached && currentFrame >= departureFrame) {
                    // Departure: detach from Earth and apply retrograde boost
                    spacecraftAttached = false;
                    spacecraft.pos.set(earth.pos.x, earth.pos.y);
                    spacecraft.vel.set(earth.vel.x, earth.vel.y);
                    // Retrograde boost: slow down to fall toward Sun
                    const earthSpeed = earth.vel.mag();
                    const retroDir = earth.vel.copy().normalize().mult(-1);
                    spacecraft.vel.add(retroDir.mult(3.6)); // dv ≈ -3.6
                    boost1Applied = true;
                    missionMessage = '🚀 Departing Earth!';
                }

                if (spacecraftAttached) {
                    // Keep spacecraft exactly on Earth
                    spacecraft.pos.set(earth.pos.x, earth.pos.y);
                    spacecraft.vel.set(earth.vel.x, earth.vel.y);
                }

                // Detect periapsis (closest approach to Sun) for second boost
                if (!spacecraftAttached && boost1Applied && !boost2Applied && !periapsisReached) {
                    const distToSun = p.dist(spacecraft.pos.x, spacecraft.pos.y, sun.pos.x, sun.pos.y);
                    // Track when distance to Sun stops decreasing
                    if (spacecraft._prevDistToSun !== undefined && spacecraft._prevDistToSun < distToSun &&
                        distToSun < 70 && spacecraft._prevDistToSun < 70) {
                        // We've passed periapsis – apply prograde boost
                        periapsisReached = true;
                        const velDir = spacecraft.vel.copy().normalize();
                        spacecraft.vel.add(velDir.mult(0.45)); // small prograde boost
                        boost2Applied = true;
                        missionMessage = '🔥 Sun flyby! Heading to Jupiter!';
                    }
                    spacecraft._prevDistToSun = distToSun;
                }

                // Check if spacecraft reached Jupiter
                if (!missionComplete && boost2Applied) {
                    const distToJupiter = p.dist(spacecraft.pos.x, spacecraft.pos.y, jupiter.pos.x, jupiter.pos.y);
                    if (distToJupiter < jupiter.visualRadius + 8) {
                        missionComplete = true;
                        missionMessage = '✨ Arrived at Jupiter! Mission complete!';
                        // Gently attach to Jupiter
                        spacecraft.vel.set(jupiter.vel.x, jupiter.vel.y);
                    }
                }
                if (missionComplete) {
                    // Keep spacecraft near Jupiter
                    const toJupiter = p.createVector(
                        jupiter.pos.x - spacecraft.pos.x,
                        jupiter.pos.y - spacecraft.pos.y
                    );
                    const d = toJupiter.mag();
                    if (d > jupiter.visualRadius + 6 && d > 0.01) {
                        toJupiter.normalize().mult(1.5);
                        spacecraft.vel.add(toJupiter);
                        spacecraft.vel.mult(0.92);
                    }
                    spacecraft.pos.x += (jupiter.pos.x - spacecraft.pos.x) * 0.06;
                    spacecraft.pos.y += (jupiter.pos.y - spacecraft.pos.y) * 0.06;
                }

                // ── Record trails ──────────────────
                sun.recordTrail();
                earth.recordTrail();
                jupiter.recordTrail();
                spacecraft.recordTrail();

                // ── Keep bodies within canvas ──────
                // Gentle boundary confinement
                const bounds = { minX: 50, maxX: 850, minY: 50, maxY: 850 };
                [sun, earth, jupiter, spacecraft].forEach(body => {
                    const bx = p.constrain(body.pos.x, bounds.minX, bounds.maxX);
                    const by = p.constrain(body.pos.y, bounds.minY, bounds.maxY);
                    if (body.pos.x < bounds.minX || body.pos.x > bounds.maxX) {
                        body.vel.x *= -0.5;
                        body.pos.x = bx;
                    }
                    if (body.pos.y < bounds.minY || body.pos.y > bounds.maxY) {
                        body.vel.y *= -0.5;
                        body.pos.y = by;
                    }
                });

                // ── Render trails ──────────────────
                sun.drawTrail();
                earth.drawTrail();
                jupiter.drawTrail();
                spacecraft.drawTrail();

                // ── Render bodies ──────────────────
                sun.draw();
                earth.draw();
                jupiter.draw();
                spacecraft.draw();

                // ── Mission status label ───────────
                if (missionMessage && p.frameCount - departureFrame < 600) {
                    const alpha = p.map(p.frameCount - departureFrame, 0, 400, 240, 0);
                    if (alpha > 0 && spacecraft.pos) {
                        p.fill(255, 255, 255, p.constrain(alpha, 0, 240));
                        p.noStroke();
                        p.textSize(11);
                        p.textAlign(p.CENTER);
                        p.text(missionMessage, spacecraft.pos.x, spacecraft.pos.y - 18);
                    }
                }

                p.pop();

                // ── Draw HUD info ──────────────────
                p.fill(40, 40, 55, 180);
                p.noStroke();
                p.rect(8, 8, 210, 62, 8);
                p.fill(255);
                p.textSize(10);
                p.textAlign(p.LEFT);
                p.text('☀ Sun  ·  🌍 Earth  ·  ♃ Jupiter', 18, 28);
                p.text('✦ Spacecraft: ' + (spacecraftAttached ? 'Docked at Earth' :
                    missionComplete ? 'Arrived at Jupiter ✓' :
                    boost2Applied ? 'En route to Jupiter ↑' :
                    boost1Applied ? 'Falling toward Sun ↓' : 'Preparing...'), 18, 48);
                p.text('🖱 Drag to pan | Scroll to zoom | R = reset view', 18, 64);
            };

            // ────────────────────────────────────────
            // MOUSE INTERACTION (pan & zoom)
            // ────────────────────────────────────────
            p.mousePressed = function() {
                if (p.mouseButton === p.LEFT) {
                    isDragging = true;
                    dragStartX = p.mouseX;
                    dragStartY = p.mouseY;
                    dragStartOffX = targetOffsetX;
                    dragStartOffY = targetOffsetY;
                }
            };

            p.mouseReleased = function() {
                isDragging = false;
            };

            p.mouseDragged = function() {
                if (isDragging) {
                    targetOffsetX = dragStartOffX + (p.mouseX - dragStartX);
                    targetOffsetY = dragStartOffY + (p.mouseY - dragStartY);
                }
            };

            p.mouseWheel = function(event) {
                const zoomAmount = event.delta > 0 ? 0.92 : 1.08;
                targetScale *= zoomAmount;
                targetScale = p.constrain(targetScale, 0.35, 3.5);
                return false;
            };

            p.keyPressed = function() {
                if (p.key === 'r' || p.key === 'R') {
                    // Reset view
                    targetScale = 1.0;
                    targetOffsetX = 0;
                    targetOffsetY = 0;
                }
            };

            // ────────────────────────────────────────
            // HANDLE WINDOW RESIZE
            // ────────────────────────────────────────
            p.windowResized = function() {
                // Keep canvas at 900x900 for consistent physics
                p.resizeCanvas(900, 900);
            };
        });
    </script>
</body>
</html>
