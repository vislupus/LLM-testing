<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Gravitational System</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
</head>
<body>
    <script>

    // --- Simulation Constants ---
    // The gravitational constant. This is our main tuning knob.
    // A higher value means stronger gravity. This value is tuned for this specific scenario.
    const G = 6;

    // An array to hold all celestial bodies for easy interaction.
    let bodies = [];
    let spacecraft;

    // The Body class represents a celestial object like a planet or sun.
    class Body {
        constructor(x, y, vx, vy, mass, radius, clr) {
            this.pos = createVector(x, y);
            this.vel = createVector(vx, vy);
            this.acc = createVector(0, 0);
            this.mass = mass;
            this.radius = radius;
            this.color = clr;
        }

        // Applies a force vector to the body, calculating acceleration (F=ma).
        applyForce(force) {
            let f = p5.Vector.div(force, this.mass);
            this.acc.add(f);
        }

        // Calculates the gravitational attraction force from another body.
        attract(other) {
            let force = p5.Vector.sub(this.pos, other.pos);
            let distanceSq = constrain(force.magSq(), 100, 10000); // Constrain to prevent extreme forces
            let strength = (G * (this.mass * other.mass)) / distanceSq;
            force.setMag(strength);
            return force;
        }

        // Updates the body's position and velocity based on acceleration.
        update() {
            this.vel.add(this.acc);
            this.pos.add(this.vel);
            this.acc.mult(0); // Reset acceleration for the next frame
        }

        // Draws the body on the canvas.
        draw() {
            fill(this.color);
            ellipse(this.pos.x, this.pos.y, this.radius * 2);
        }
    }
    
    // The Spacecraft class extends Body and adds mission logic.
    class Spacecraft extends Body {
        constructor(earth) {
            // Start attached to Earth
            super(earth.pos.x, earth.pos.y, earth.vel.x, earth.vel.y, 0.01, 3, color(100, 100, 100));
            this.missionState = 'ON_EARTH';
            this.departureTimer = 180; // Wait 3 seconds (60fps * 3) before launch
            this.sunLoopTimer = 600; // Time for the sun loop phase
        }

        // Override the update method to include mission logic
        update() {
            // --- State Machine for Mission Profile ---
            switch (this.missionState) {
                case 'ON_EARTH':
                    // Stick to Earth until launch
                    this.pos.set(bodies[1].pos);
                    this.vel.set(bodies[1].vel);
                    this.departureTimer--;
                    if (this.departureTimer <= 0) {
                        this.missionState = 'DEPARTING_SUN_LOOP';
                        // Give it a "kick" to leave Earth's orbit
                        let kick = p5.Vector.random2D().mult(1.5);
                        this.vel.add(kick);
                    }
                    break;
                    
                case 'DEPARTING_SUN_LOOP':
                    this.sunLoopTimer--;
                    // Simply let gravity guide it for a while.
                    // The initial conditions will create a sun loop.
                    if (this.sunLoopTimer <= 0) {
                        this.missionState = 'EN_ROUTE_JUPITER';
                    }
                    break;
                    
                case 'EN_ROUTE_JUPITER':
                    // Add a small, constant thrust towards Jupiter to ensure it gets there.
                    // This supplements the gravitational trajectory.
                    let jupiter = bodies[2];
                    let thrust = p5.Vector.sub(jupiter.pos, this.pos);
                    thrust.normalize();
                    thrust.mult(0.005); // A very gentle push
                    this.applyForce(thrust);
                    
                    if (this.pos.dist(jupiter.pos) < jupiter.radius + 20) {
                        this.missionState = 'ARRIVED';
                    }
                    break;
                    
                case 'ARRIVED':
                    // Mission complete. No more special logic, just let gravity do the work.
                    // It will now orbit or crash into Jupiter.
                    break;
            }

            // Standard physics update (from parent Body class)
            super.update();
        }
    }


    function setup() {
        createCanvas(windowWidth, windowHeight);
        background(220); // Persistent background for trails
        noStroke();

        // --- Initialize Celestial Bodies ---
        // These initial positions, velocities, and masses are carefully chosen
        // to create a chaotic but bounded system that remains on screen.
        let sun, earth, jupiter;

        // Sun (Massive, stationary center)
        sun = new Body(width / 2, height / 2, 0, 0, 1200, 20, color(255, 165, 0));
        
        // Earth (Lighter, starts with a velocity to create an initial orbit)
        earth = new Body(width / 2 + 200, height / 2, 0, -3.8, 10, 8, color(0, 100, 255));

        // Jupiter (Heavier, positioned to perturb Earth's orbit and create chaos)
        jupiter = new Body(width / 2 - 350, height / 2, 0, 1.5, 90, 15, color(200, 150, 100));

        bodies.push(sun, earth, jupiter);
        
        // Initialize the spacecraft, linking it to Earth initially.
        spacecraft = new Spacecraft(earth);
        bodies.push(spacecraft); // Add spacecraft to the list for gravity calculations
    }

    function draw() {
        // --- Physics Calculations ---
        // Every body attracts every other body.
        for (let i = 0; i < bodies.length; i++) {
            for (let j = 0; j < bodies.length; j++) {
                if (i !== j) {
                    let force = bodies[j].attract(bodies[i]);
                    bodies[i].applyForce(force);
                }
            }
        }

        // --- Update and Draw ---
        // Update and draw each body. The background is not cleared,
        // so the previous positions create a trail.
        for (const body of bodies) {
            body.update();
            body.draw();
        }
    }
    
    // Make the canvas responsive to window size changes.
    function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
        // Resetting the simulation on resize to avoid objects being off-screen
        background(220);
        bodies = []; // Clear the array
        setup();
    }

    </script>
</body>
</html>
