<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Multi-Body Gravitational System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ddd;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #333;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">
        Chaotic Gravitational System<br>
        Yellow: Sun | Blue: Earth | Orange: Jupiter | White: Spacecraft<br>
        Spacecraft Mission: Earth → Solar Loop → Jupiter
    </div>
    
    <script>
        class CelestialBody {
            constructor(x, y, vx, vy, mass, color, name, size) {
                this.pos = createVector(x, y);
                this.vel = createVector(vx, vy);
                this.acc = createVector(0, 0);
                this.mass = mass;
                this.color = color;
                this.name = name;
                this.size = size;
                this.trail = [];
                this.maxTrailLength = 800;
            }
            
            applyForce(force) {
                let f = p5.Vector.div(force, this.mass);
                this.acc.add(f);
            }
            
            update(dt) {
                // Verlet integration for better stability
                this.vel.add(p5.Vector.mult(this.acc, dt));
                this.pos.add(p5.Vector.mult(this.vel, dt));
                this.acc.mult(0);
                
                // Add to trail
                if (frameCount % 2 === 0) {
                    this.trail.push(createVector(this.pos.x, this.pos.y));
                    if (this.trail.length > this.maxTrailLength) {
                        this.trail.shift();
                    }
                }
            }
            
            display() {
                // Draw trail
                noFill();
                for (let i = 0; i < this.trail.length - 1; i++) {
                    let alpha = map(i, 0, this.trail.length, 0, 100);
                    stroke(red(this.color), green(this.color), blue(this.color), alpha);
                    strokeWeight(1);
                    line(this.trail[i].x, this.trail[i].y, this.trail[i + 1].x, this.trail[i + 1].y);
                }
                
                // Draw body
                noStroke();
                fill(this.color);
                ellipse(this.pos.x, this.pos.y, this.size);
            }
        }
        
        class Spacecraft {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.mass = 0.00001;
                this.trail = [];
                this.maxTrailLength = 1000;
                this.missionPhase = 0; // 0: on Earth, 1: solar loop, 2: to Jupiter
                this.launchTimer = 0;
                this.thrustPower = 0.0002;
            }
            
            applyForce(force) {
                let f = p5.Vector.div(force, this.mass);
                this.acc.add(f);
            }
            
            update(dt, earth, sun, jupiter) {
                // Mission control
                if (this.missionPhase === 0) {
                    // Stay with Earth initially
                    this.pos = earth.pos.copy();
                    this.vel = earth.vel.copy();
                    this.launchTimer++;
                    
                    if (this.launchTimer > 180) {
                        // Launch towards sun
                        this.missionPhase = 1;
                        let toSun = p5.Vector.sub(sun.pos, this.pos);
                        toSun.normalize();
                        toSun.mult(2);
                        this.vel.add(toSun);
                    }
                } else if (this.missionPhase === 1) {
                    // Solar loop phase
                    let distToSun = p5.Vector.dist(this.pos, sun.pos);
                    if (distToSun < 100 && this.launchTimer > 300) {
                        // Start heading to Jupiter after getting close to sun
                        this.missionPhase = 2;
                        let toJupiter = p5.Vector.sub(jupiter.pos, this.pos);
                        toJupiter.normalize();
                        toJupiter.mult(1.5);
                        this.vel.add(toJupiter);
                    }
                } else if (this.missionPhase === 2) {
                    // Heading to Jupiter - apply small course corrections
                    if (frameCount % 30 === 0) {
                        let toJupiter = p5.Vector.sub(jupiter.pos, this.pos);
                        if (toJupiter.mag() > 50) {
                            toJupiter.normalize();
                            toJupiter.mult(this.thrustPower);
                            this.applyForce(toJupiter);
                        }
                    }
                }
                
                this.launchTimer++;
                
                // Physics update
                this.vel.add(p5.Vector.mult(this.acc, dt));
                this.pos.add(p5.Vector.mult(this.vel, dt));
                this.acc.mult(0);
                
                // Trail
                if (frameCount % 2 === 0) {
                    this.trail.push(createVector(this.pos.x, this.pos.y));
                    if (this.trail.length > this.maxTrailLength) {
                        this.trail.shift();
                    }
                }
            }
            
            display() {
                // Draw trail
                noFill();
                for (let i = 0; i < this.trail.length - 1; i++) {
                    let alpha = map(i, 0, this.trail.length, 0, 150);
                    stroke(255, 255, 255, alpha);
                    strokeWeight(1);
                    line(this.trail[i].x, this.trail[i].y, this.trail[i + 1].x, this.trail[i + 1].y);
                }
                
                // Draw spacecraft
                noStroke();
                fill(255);
                push();
                translate(this.pos.x, this.pos.y);
                // Triangle shape for spacecraft
                beginShape();
                vertex(0, -4);
                vertex(-3, 4);
                vertex(3, 4);
                endShape(CLOSE);
                pop();
            }
        }
        
        let sun, earth, jupiter, spacecraft;
        let G = 15; // Gravitational constant (scaled for visualization)
        let dt = 0.5; // Time step
        let centerX, centerY;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
            
            // Create celestial bodies with chaotic initial conditions
            // Sun - massive and central
            sun = new CelestialBody(
                centerX, centerY,
                0.1, -0.05, // Small initial velocity for instability
                100,
                color(255, 220, 0),
                "Sun", 30
            );
            
            // Earth - closer orbit with perturbed velocity
            earth = new CelestialBody(
                centerX + 150, centerY - 20,
                0.8, 2.8, // Non-circular initial velocity
                0.8,
                color(100, 150, 255),
                "Earth", 12
            );
            
            // Jupiter - eccentric orbit
            jupiter = new CelestialBody(
                centerX - 280, centerY + 100,
                -1.2, -1.8, // Creates chaotic interaction
                3,
                color(255, 180, 100),
                "Jupiter", 20
            );
            
            // Spacecraft starts on Earth
            spacecraft = new Spacecraft(earth.pos.x, earth.pos.y);
        }
        
        function draw() {
            // Light gray background
            background(220);
            
            // Calculate gravitational forces between all bodies
            let bodies = [sun, earth, jupiter];
            
            for (let i = 0; i < bodies.length; i++) {
                for (let j = i + 1; j < bodies.length; j++) {
                    let force = calculateGravity(bodies[i], bodies[j]);
                    bodies[i].applyForce(force);
                    bodies[j].applyForce(p5.Vector.mult(force, -1));
                }
            }
            
            // Apply gravity to spacecraft from all bodies
            for (let body of bodies) {
                let force = calculateGravity(spacecraft, body);
                spacecraft.applyForce(force);
            }
            
            // Update and display all bodies
            for (let body of bodies) {
                body.update(dt);
                
                // Keep bodies within bounds with soft boundaries
                if (body.pos.x < 50 || body.pos.x > width - 50) {
                    body.vel.x *= -0.8;
                    body.pos.x = constrain(body.pos.x, 50, width - 50);
                }
                if (body.pos.y < 50 || body.pos.y > height - 50) {
                    body.vel.y *= -0.8;
                    body.pos.y = constrain(body.pos.y, 50, height - 50);
                }
                
                body.display();
            }
            
            // Update and display spacecraft
            spacecraft.update(dt, earth, sun, jupiter);
            spacecraft.display();
            
            // Add subtle perturbation to maintain chaos
            if (frameCount % 500 === 0) {
                earth.vel.add(p5.Vector.random2D().mult(0.1));
                jupiter.vel.add(p5.Vector.random2D().mult(0.05));
            }
        }
        
        function calculateGravity(body1, body2) {
            let force = p5.Vector.sub(body2.pos, body1.pos);
            let distance = force.mag();
            distance = constrain(distance, 20, 500); // Prevent singularities
            
            let strength = (G * body1.mass * body2.mass) / (distance * distance);
            force.normalize();
            force.mult(strength);
            return force;
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            centerX = width / 2;
            centerY = height / 2;
        }
        
        // Add some interactivity - click to add perturbation
        function mousePressed() {
            let mousePos = createVector(mouseX, mouseY);
            for (let body of [earth, jupiter]) {
                let toBod = p5.Vector.sub(body.pos, mousePos);
                if (toBod.mag() < 100) {
                    toBod.normalize();
                    toBod.mult(2);
                    body.vel.add(toBod);
                }
            }
        }
    </script>
</body>
</html>
