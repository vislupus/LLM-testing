<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three-Body Gravity Simulation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #2a2a2a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    h1 {
      color: #fff;
      margin: 8px 0;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .info {
      color: #999;
      font-size: 12px;
      margin-bottom: 8px;
      text-align: center;
      line-height: 1.5;
    }
    canvas {
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      border-radius: 4px;
    }
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ccc;
      font-size: 12px;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <h1>Chaotic Three-Body Gravitational System</h1>
  <div class="info">
    Newtonian gravity | Chaotic bounded orbits | Persistent orbital trails<br>
    Click canvas to restart &nbsp;|&nbsp; Spacecraft: Earth orbit &rarr; Solar loop &rarr; Jupiter
  </div>
  <div id="canvas-container"></div>
  <div class="legend">
    <div class="legend-item"><div class="dot" style="background:#FF8C00"></div>Sun</div>
    <div class="legend-item"><div class="dot" style="background:#4169E1"></div>Earth</div>
    <div class="legend-item"><div class="dot" style="background:#DC143C"></div>Jupiter</div>
    <div class="legend-item"><div class="dot" style="background:#00FF7F"></div>Spacecraft</div>
  </div>

  <script>
    // ============================================================
    // MULTI-BODY GRAVITATIONAL SIMULATION
    // Sun + Earth + Jupiter with chaotic bounded orbits
    // Spacecraft: Earth departure -> Solar orbit loop -> Jupiter
    // ============================================================

    const G = 1.8;
    const TRAIL_MAX = 800;
    const SUB_STEPS = 5;

    let bodies = [];
    let spacecraft;
    let cx, cy, sc;
    let time = 0;
    let scPhase = 'docked'; // docked, loop, transfer, at_jupiter
    let scTimer = 0;
    let cycleCount = 0;

    function setup() {
      let c = createCanvas(900, 700);
      c.parent('canvas-container');
      cx = width / 2;
      cy = height / 2;
      sc = 1.0;
      initSim();
    }

    function initSim() {
      bodies = [];
      time = 0;
      scPhase = 'docked';
      scTimer = 0;

      // ============================================================
      // CHAOTIC INITIAL CONDITIONS
      // Three bodies with masses and velocities tuned to produce
      // bounded chaotic motion - no body escapes, none collide,
      // all exhibit complex, non-repeating trajectories
      // ============================================================

      // Sun: most massive, slow drift through space
      bodies.push({
        name: 'Sun', m: 900, r: 18,
        x: 0, y: 0, vx: 0.08, vy: -0.06,
        col: [255, 140, 0], trail: []
      });

      // Earth: lighter, on a perturbed elliptical path
      bodies.push({
        name: 'Earth', m: 12, r: 7,
        x: 150, y: 40, vx: -0.25, vy: 1.45,
        col: [65, 105, 225], trail: []
      });

      // Jupiter: heavy, eccentric orbit that perturbs Earth
      bodies.push({
        name: 'Jupiter', m: 70, r: 12,
        x: -190, y: -70, vx: 0.4, vy: -1.0,
        col: [220, 20, 60], trail: []
      });

      // Spacecraft starts docked on Earth
      let ep = bodies[1];
      spacecraft = {
        x: ep.x, y: ep.y,
        vx: ep.vx, vy: ep.vy,
        ax: 0, ay: 0,
        active: false, trail: [],
        particles: []
      };
    }

    function computeForces() {
      for (let i = 0; i < bodies.length; i++) {
        let b = bodies[i];
        b.ax = 0; b.ay = 0;
        for (let j = 0; j < bodies.length; j++) {
          if (i === j) continue;
          let o = bodies[j];
          let dx = o.x - b.x;
          let dy = o.y - b.y;
          let d2 = dx * dx + dy * dy;
          let d = Math.sqrt(d2);
          let sd = Math.max(d, 10);
          let f = G * o.m / (sd * sd);
          b.ax += f * dx / d;
          b.ay += f * dy / d;
        }
      }
    }

    function computeScForce() {
      let s = spacecraft;
      s.ax = 0; s.ay = 0;
      for (let b of bodies) {
        let dx = b.x - s.x;
        let dy = b.y - s.y;
        let d2 = dx * dx + dy * dy;
        let d = Math.sqrt(d2);
        let sd = Math.max(d, 8);
        let f = G * b.m / (sd * sd);
        s.ax += f * dx / d;
        s.ay += f * dy / d;
      }
    }

    function updateBodies(dt) {
      for (let b of bodies) {
        b.vx += b.ax * dt;
        b.vy += b.ay * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > TRAIL_MAX) b.trail.shift();
      }
    }

    function updateSc(dt) {
      let s = spacecraft;
      if (!s.active) return;
      s.vx += s.ax * dt;
      s.vy += s.ay * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.trail.push({ x: s.x, y: s.y });
      if (s.trail.length > TRAIL_MAX) s.trail.shift();

      // Thrust particles
      if ((scPhase === 'loop' || scPhase === 'transfer') && frameCount % 2 === 0) {
        let spd = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
        if (spd > 0.1) {
          s.particles.push({
            x: s.x - s.vx / spd * 4 + random(-1.5, 1.5),
            y: s.y - s.vy / spd * 4 + random(-1.5, 1.5),
            vx: -s.vx / spd * random(0.4, 1.8) + random(-0.4, 0.4),
            vy: -s.vy / spd * random(0.4, 1.8) + random(-0.4, 0.4),
            life: 30, maxLife: 30
          });
        }
      }

      for (let i = s.particles.length - 1; i >= 0; i--) {
        let p = s.particles[i];
        p.x += p.vx; p.y += p.vy;
        p.life--;
        if (p.life <= 0) s.particles.splice(i, 1);
      }
    }

    function drawTrail(trail, col, baseW) {
      if (trail.length < 2) return;
      noStroke();
      for (let i = 1; i < trail.length; i++) {
        let t = i / trail.length;
        let alpha = 15 + t * 200;
        let w = 0.5 + t * baseW;
        fill(col[0], col[1], col[2], alpha);
        let sx = trail[i].x * sc + cx;
        let sy = trail[i].y * sc + cy;
        ellipse(sx, sy, w * 2, w * 2);
      }
    }

    function drawBody(b) {
      let sx = b.x * sc + cx;
      let sy = b.y * sc + cy;
      noStroke();
      // Glow
      for (let g = 3; g >= 0; g--) {
        let ga = g === 0 ? 230 : 40 - g * 10;
        let gs = b.r * (1 + g * 1.2);
        fill(b.col[0], b.col[1], b.col[2], ga);
        ellipse(sx, sy, gs, gs);
      }
      // Core
      fill(b.col[0], b.col[1], b.col[2]);
      ellipse(sx, sy, b.r * 2, b.r * 2);
      // Label
      fill(50);
      textSize(11);
      text(b.name, sx + b.r + 8, sy + 4);
    }

    function drawSc() {
      let s = spacecraft;
      if (!s.active) return;
      let sx = s.x * sc + cx;
      let sy = s.y * sc + cy;
      noStroke();
      fill(0, 255, 127, 50);
      ellipse(sx, sy, 22, 22);
      fill(0, 255, 127, 100);
      ellipse(sx, sy, 14, 14);
      fill(220, 255, 240);
      ellipse(sx, sy, 6, 6);
      fill(0, 100, 50);
      textSize(10);
      text('Voyager', sx + 14, sy - 10);
    }

    function drawScTrail() {
      let s = spacecraft;
      if (s.trail.length < 2) return;
      noStroke();
      for (let i = 1; i < s.trail.length; i++) {
        let t = i / s.trail.length;
        let alpha = 10 + t * 255;
        let w = 0.6 + t * 3;
        fill(0, 255, 127, alpha);
        let tx = s.trail[i].x * sc + cx;
        let ty = s.trail[i].y * sc + cy;
        ellipse(tx, ty, w * 2, w * 2);
      }
    }

    function drawParticles() {
      let s = spacecraft;
      noStroke();
      for (let p of s.particles) {
        let t = p.life / p.maxLife;
        let alpha = t * 220;
        let size = t * 3.5;
        fill(255, 160, 30, alpha);
        let px = p.x * sc + cx;
        let py = p.y * sc + cy;
        ellipse(px, py, size * 2, size * 2);
      }
    }

    function scDistance(b) {
      let dx = spacecraft.x - b.x;
      let dy = spacecraft.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function manageMission() {
      let sun = bodies[0];
      let earth = bodies[1];
      let jupiter = bodies[2];
      let s = spacecraft;
      scTimer++;

      switch (scPhase) {
        case 'docked':
          s.x = earth.x;
          s.y = earth.y;
          s.vx = earth.vx;
          s.vy = earth.vy;
          s.active = false;
          if (scTimer > 180) {
            scPhase = 'loop';
            scTimer = 0;
            s.active = true;
            // Launch for solar orbit loop
            let dx = sun.x - earth.x;
            let dy = sun.y - earth.y;
            let d = Math.sqrt(dx * dx + dy * dy);
            // Tangent for solar orbit
            let tx = -dy / d;
            let ty = dx / d;
            let vOrb = Math.sqrt(G * sun.m / d) * 0.9;
            s.vx = earth.vx + tx * vOrb * 0.4;
            s.vy = earth.vy + ty * vOrb * 0.4;
            // Slight inward component for a tighter loop
            s.vx += dx / d * 0.25;
            s.vy += dy / d * 0.25;
          }
          break;

        case 'loop':
          // After sufficient solar looping, initiate transfer
          if (scTimer > 500) {
            scPhase = 'transfer';
            scTimer = 0;
          }
          // Proximity catch for Jupiter during loop
          if (scTimer > 250 && scDistance(jupiter) < 35) {
            scPhase = 'at_jupiter';
            scTimer = 0;
          }
          break;

        case 'transfer':
          {
            // Steer toward Jupiter
            let jdx = jupiter.x - s.x;
            let jdy = jupiter.y - s.y;
            let jd = Math.sqrt(jdx * jdx + jdy * jdy);
            let steer = 0.06;
            s.vx += jdx / jd * steer;
            s.vy += jdy / jd * steer;

            if (scDistance(jupiter) < 30) {
              scPhase = 'at_jupiter';
              scTimer = 0;
            }
            // Safety timeout
            if (scTimer > 1000) {
              scPhase = 'at_jupiter';
              scTimer = 0;
            }
          }
          break;

        case 'at_jupiter':
          {
            // Follow Jupiter closely
            let jdx = s.x - jupiter.x;
            let jdy = s.y - jupiter.y;
            s.x = jupiter.x + jdx * 0.9;
            s.y = jupiter.y + jdy * 0.9;
            s.vx = jupiter.vx;
            s.vy = jupiter.vy;

            if (scTimer > 250) {
              cycleCount++;
              if (cycleCount >= 2) {
                initSim();
                cycleCount = 0;
              } else {
                scPhase = 'docked';
                scTimer = 0;
                s.active = false;
                s.trail = [];
                s.particles = [];
              }
            }
          }
          break;
      }
    }

    function autoCenter() {
      // Center of mass
      let cmx = 0, cmy = 0, tm = 0;
      for (let b of bodies) {
        cmx += b.x * b.m;
        cmy += b.y * b.m;
        tm += b.m;
      }
      cmx /= tm;
      cmy /= tm;

      let tox = width / 2 - cmx * sc;
      let toy = height / 2 - cmy * sc;
      cx += (tox - cx) * 0.015;
      cy += (toy - cy) * 0.015;

      // Adaptive zoom
      let maxD = 0;
      for (let b of bodies) {
        let dx = (b.x - cmx) * sc;
        let dy = (b.y - cmy) * sc;
        let d = Math.sqrt(dx * dx + dy * dy);
        if (d > maxD) maxD = d;
      }
      if (maxD > width / 2 - 100 && sc > 0.55) sc *= 0.997;
      else if (maxD < width / 3 && sc < 1.6) sc *= 1.001;
    }

    function drawHUD() {
      let txt = '';
      switch (scPhase) {
        case 'docked': txt = 'Docked at Earth'; break;
        case 'loop': txt = scTimer > 500 ? 'Loop + Preparing Transfer' : 'Solar Orbit Loop'; break;
        case 'transfer': txt = 'Transfer to Jupiter'; break;
        case 'at_jupiter': txt = 'Orbiting Jupiter'; break;
      }

      noStroke();
      fill(40, 40, 40, 210);
      rect(12, height - 44, 215, 30, 6);
      fill(255);
      textSize(12);
      textAlign(LEFT);
      text(txt, 22, height - 24);

      fill(40, 40, 40, 210);
      rect(width - 110, height - 44, 96, 30, 6);
      fill(255);
      textAlign(RIGHT);
      text('t=' + floor(time), width - 20, height - 24);
    }

    function draw() {
      background(220);

      let dt = 0.3 / SUB_STEPS;
      for (let step = 0; step < SUB_STEPS; step++) {
        computeForces();
        computeScForce();
        updateBodies(dt);
        updateSc(dt);
        autoCenter();
      }

      manageMission();
      time += 0.3;

      // Render
      for (let b of bodies) drawTrail(b.trail, b.col, b.r * 0.4);
      drawScTrail();
      drawParticles();
      for (let b of bodies) drawBody(b);
      drawSc();
      drawHUD();
    }

    function mousePressed() {
      if (mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
        initSim();
        cycleCount = 0;
      }
    }
  </script>
</body>
</html>
