<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORBITAL ODYSSEY</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        body { margin:0; background:#111; overflow:hidden; font-family:monospace; }
        canvas { display:block; }
        #overlay {
            position:absolute; top:12px; left:12px; color:#fff; background:rgba(0,0,0,0.6);
            padding:12px 18px; border-radius:8px; font-size:13px; pointer-events:none;
        }
    </style>
</head>
<body>
    <div id="overlay">
        SUN • EARTH • JUPITER • SPACECRAFT<br>
        <span style="opacity:0.7">Persistent trails • Newtonian gravity • Chaotic but bounded</span>
    </div>

    <script>
        // ================================================
        // ORBITAL ODYSSEY — p5.js Gravitational Simulation
        // Sun, Earth, Jupiter + Spacecraft on solar loop then to Jupiter
        // Persistent fading trails • Realistic N-body gravity
        // Single standalone HTML file
        // ================================================

        let bodies = [];
        let G = 0.42;
        let trailLength = 520;
        
        class Body {
            constructor(x, y, vx, vy, mass, col, name, trailCol) {
                this.pos = createVector(x, y);
                this.vel = createVector(vx, vy);
                this.mass = mass;
                this.col = col;
                this.name = name;
                this.trail = [];
                this.trailCol = trailCol;
                this.radius = mass > 800 ? 26 : mass > 100 ? 14 : mass > 5 ? 8 : 4;
            }
            
            update() {
                let force = createVector(0, 0);
                for (let other of bodies) {
                    if (other === this) continue;
                    let dx = other.pos.x - this.pos.x;
                    let dy = other.pos.y - this.pos.y;
                    let distSq = dx*dx + dy*dy;
                    if (distSq < 1200) distSq = 1200; // prevent singularity
                    let f = G * this.mass * other.mass / distSq;
                    let dir = createVector(dx, dy);
                    dir.normalize();
                    force.add(dir.mult(f / this.mass));
                }
                this.vel.add(force);
                this.pos.add(this.vel);
                
                // Add to trail
                this.trail.push(this.pos.copy());
                if (this.trail.length > trailLength) this.trail.shift();
            }
            
            draw() {
                // Trail
                for (let i = 1; i < this.trail.length; i++) {
                    let alpha = map(i, 0, this.trail.length, 30, 255);
                    stroke(red(this.trailCol), green(this.trailCol), blue(this.trailCol), alpha);
                    strokeWeight(1.8);
                    line(this.trail[i-1].x, this.trail[i-1].y, this.trail[i].x, this.trail[i].y);
                }
                noStroke();
                fill(this.col);
                circle(this.pos.x, this.pos.y, this.radius);
            }
        }

        function setup() {
            createCanvas(960, 640);
            noStroke();
            
            // Sun at center
            let sun = new Body(480, 320, 0, 0, 1250, color(255, 230, 90), "Sun", color(255, 210, 60));
            bodies.push(sun);
            
            // Earth — initial position and velocity for nice orbit
            let earth = new Body(480 + 168, 320, 0, 4.35, 9, color(80, 160, 255), "Earth", color(100, 200, 255));
            bodies.push(earth);
            
            // Jupiter — farther, slower
            let jupiter = new Body(480 + 335, 320, 0, 2.15, 195, color(255, 140, 50), "Jupiter", color(255, 170, 80));
            bodies.push(jupiter);
            
            // Spacecraft — starts near Earth, tuned for solar loop then Jupiter flyby
            let ship = new Body(480 + 175, 320 + 14, -1.8, 5.95, 0.3, color(255, 255, 255), "Spacecraft", color(255, 255, 220));
            bodies.push(ship);
        }

        function draw() {
            background(220, 26); // light gray with fade for beautiful persistent trails
            
            // Update all bodies (N-body gravity)
            for (let b of bodies) {
                b.update();
            }
            
            // Draw all trails + bodies
            for (let b of bodies) {
                b.draw();
            }
            
            // Keep everything bounded (gentle repulsion from edges)
            for (let b of bodies) {
                if (b.pos.x < 40) b.vel.x += 0.6;
                if (b.pos.x > width - 40) b.vel.x -= 0.6;
                if (b.pos.y < 40) b.vel.y += 0.6;
                if (b.pos.y > height - 40) b.vel.y -= 0.6;
            }
        }

        // Click anywhere to give spacecraft a small boost (for fun interaction)
        function mousePressed() {
            let ship = bodies[3];
            ship.vel.add( (mouseX - ship.pos.x) * 0.008, (mouseY - ship.pos.y) * 0.008 );
        }
    </script>
</body>
</html>
