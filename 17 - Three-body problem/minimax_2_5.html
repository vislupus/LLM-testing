<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaotic Gravitational System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #dcdcdc;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script>
        // ============================================
        // CHAOTIC GRAVITATIONAL SIMULATION
        // Sun, Earth, Jupiter + Spacecraft
        // ============================================

        // Gravitational constant (scaled for visual appeal)
        const G = 0.8;

        // Softening parameter to prevent singularities
        const SOFTENING = 50;

        // Simulation bodies
        let sun, earth, jupiter, spacecraft;

        // Mission state
        let missionPhase = 0;
        let phaseStartTime = 0;
        let missionComplete = false;

        // Trail settings
        const TRAIL_LENGTH = 300;

        // View offset for centering
        let viewX = 0, viewY = 0;
        let zoom = 1;

        function setup() {
            createCanvas(windowWidth, windowHeight);

            // Initialize celestial bodies with chaotic initial conditions
            // Sun - heavy, near center
            sun = new CelestialBody(0, 0, 800, color(253, 184, 19), "Sun");
            sun.vx = 0.15;
            sun.vy = 0.1;

            // Jupiter - medium mass, elliptical orbit
            jupiter = new CelestialBody(280, 50, 180, color(192, 57, 43), "Jupiter");
            jupiter.vx = -0.25;
            jupiter.vy = 0.4;

            // Earth - smaller mass, perturbed orbit
            earth = new CelestialBody(-140, 180, 45, color(46, 134, 193), "Earth");
            earth.vx = 0.5;
            earth.vy = -0.35;

            // Spacecraft - starts on Earth
            spacecraft = new Spacecraft(earth.x + 15, earth.y + 15, 8, color(30, 30, 30), "Spacecraft");
            spacecraft.vx = earth.vx + 1.8;
            spacecraft.vy = earth.vy + 1.2;

            phaseStartTime = millis();
        }

        function draw() {
            // Background as specified
            background(220);
            noStroke();

            // Physics substeps for stability
            const substeps = 3;
            for (let i = 0; i < substeps; i++) {
                updatePhysics(1 / substeps);
            }

            // Update mission AI
            updateMission();

            // Calculate center of mass for camera
            updateCamera();

            // Apply view transform
            push();
            translate(width / 2 - viewX, height / 2 - viewY);
            scale(zoom);

            // Draw all trails first (behind bodies)
            sun.drawTrail();
            earth.drawTrail();
            jupiter.drawTrail();
            spacecraft.drawTrail();

            // Draw all bodies
            sun.draw();
            jupiter.draw();
            earth.draw();
            spacecraft.draw();

            pop();

            // Draw UI overlay
            drawUI();
        }

        function updatePhysics(dt) {
            const bodies = [sun, earth, jupiter, spacecraft];

            // Calculate gravitational forces
            for (let i = 0; i < bodies.length; i++) {
                for (let j = 0; j < bodies.length; j++) {
                    if (i !== j) {
                        bodies[i].applyGravity(bodies[j], dt);
                    }
                }
            }

            // Update positions
            for (let body of bodies) {
                body.update(dt);
            }
        }

        function updateMission() {
            const elapsed = millis() - phaseStartTime;

            if (missionPhase === 0) {
                // Phase 0: Depart Earth
                // Apply thrust away from Earth
                if (elapsed < 2000) {
                    spacecraft.applyThrust(0.08, 0.06);
                }
                // Transition to Sun loop when far enough from Earth
                if (elapsed > 3000 && dist(spacecraft.x, spacecraft.y, earth.x, earth.y) > 100) {
                    missionPhase = 1;
                    phaseStartTime = millis();
                }
            } else if (missionPhase === 1) {
                // Phase 1: Loop around the Sun
                // Guide towards Sun for gravity assist
                const sunDist = dist(spacecraft.x, spacecraft.y, sun.x, sun.y);

                // Apply thrust to curve around Sun
                if (sunDist > 60 && sunDist < 200) {
                    // Tangential thrust for orbital insertion
                    const toSun = createVector(sun.x - spacecraft.x, sun.y - spacecraft.y);
                    const perpendicular = createVector(-toSun.y, toSun.x).normalize();
                    spacecraft.applyThrust(perpendicular.x * 0.03, perpendicular.y * 0.03);
                }

                // Transition when we've completed a loop (crossing positive X axis after being in negative)
                if (elapsed > 8000 && spacecraft.x > 0 && spacecraft.y < sun.y + 50 && spacecraft.y > sun.y - 50) {
                    missionPhase = 2;
                    phaseStartTime = millis();
                }
            } else if (missionPhase === 2) {
                // Phase 3: Transfer to Jupiter
                const toJupiter = createVector(jupiter.x - spacecraft.x, jupiter.y - spacecraft.y);
                const distToJup = toJupiter.mag();

                // Apply thrust towards Jupiter intercept point
                if (distToJup > 30) {
                    toJupiter.normalize();
                    spacecraft.applyThrust(toJupiter.x * 0.04, toJupiter.y * 0.04);
                }

                // Check for arrival
                if (distToJup < 40) {
                    missionComplete = true;
                }
            }
        }

        function updateCamera() {
            // Calculate center of mass
            const totalMass = sun.mass + earth.mass + jupiter.mass + spacecraft.mass;
            const comX = (sun.x * sun.mass + earth.x * earth.mass + jupiter.x * jupiter.mass + spacecraft.x * spacecraft.mass) / totalMass;
            const comY = (sun.y * sun.mass + earth.y * earth.mass + jupiter.y * jupiter.mass + spacecraft.y * spacecraft.mass) / totalMass;

            // Smooth camera follow
            viewX = lerp(viewX, comX, 0.05);
            viewY = lerp(viewY, comY, 0.05);

            // Dynamic zoom based on system spread
            const maxDist = Math.max(
                dist(sun.x, sun.y, earth.x, earth.y),
                dist(sun.x, sun.y, jupiter.x, jupiter.y),
                dist(earth.x, earth.y, jupiter.x, jupiter.y)
            );
            const targetZoom = constrain(500 / (maxDist + 200), 0.4, 1.5);
            zoom = lerp(zoom, targetZoom, 0.02);
        }

        function drawUI() {
            // Mission status
            fill(40);
            noStroke();
            rect(15, 15, 220, 90, 8);

            fill(255);
            textSize(14);
            textStyle(BOLD);
            text("MISSION STATUS", 30, 38);

            textStyle(NORMAL);
            textSize(12);

            let status = "";
            if (missionPhase === 0) status = "1. Departing Earth...";
            else if (missionPhase === 1) status = "2. Orbiting Sun...";
            else if (missionPhase === 2) status = "3. Transfer to Jupiter...";
            else if (missionComplete) status = "ARRIVED AT JUPITER!";

            fill(missionComplete ? 100 : 200, missionComplete ? 255 : 150, 100);
            text(status, 30, 60);

            fill(180);
            text("Green: Spacecraft", 30, 80);
            text("Yellow: Sun | Red: Jupiter | Blue: Earth", 30, 96);
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }

        // ============================================
        // CELESTIAL BODY CLASS
        // ============================================
        class CelestialBody {
            constructor(x, y, mass, col, name) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.ax = 0;
                this.ay = 0;
                this.mass = mass;
                this.col = col;
                this.name = name;
                this.trail = [];
            }

            applyGravity(other, dt) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const distSq = dx * dx + dy * dy + SOFTENING;
                const dist = Math.sqrt(distSq);

                // F = G * m1 * m2 / r^2
                // a = F / m1 = G * m2 / r^2
                const forceMag = G * other.mass / distSq;

                const fx = forceMag * dx / dist;
                const fy = forceMag * dy / dist;

                this.ax += fx;
                this.ay += fy;
            }

            update(dt) {
                this.vx += this.ax * dt;
                this.vy += this.ay * dt;
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Reset acceleration
                this.ax = 0;
                this.ay = 0;

                // Store trail position
                if (frameCount % 2 === 0) {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > TRAIL_LENGTH) {
                        this.trail.shift();
                    }
                }
            }

            drawTrail() {
                if (this.trail.length < 2) return;

                // Semi-transparent trail
                const trailCol = color(red(this.col), green(this.col), blue(this.col), 60);
                fill(trailCol);

                for (let i = 1; i < this.trail.length; i++) {
                    const alpha = map(i, 0, this.trail.length, 0, 150);
                    const size = map(i, 0, this.trail.length, 1, this.getRadius() * 0.8);

                    fill(red(this.col), green(this.col), blue(this.col), alpha);
                    ellipse(this.trail[i].x, this.trail[i].y, size, size);
                }
            }

            draw() {
                // Glow effect
                const glowSize = this.getRadius() * 3;
                const glowCol = color(red(this.col), green(this.col), blue(this.col), 30);
                fill(glowCol);
                ellipse(this.x, this.y, glowSize, glowSize);

                // Main body
                fill(this.col);
                ellipse(this.x, this.y, this.getRadius() * 2, this.getRadius() * 2);

                // Highlight
                fill(255, 255, 255, 80);
                ellipse(this.x - this.getRadius() * 0.3, this.y - this.getRadius() * 0.3,
                        this.getRadius() * 0.6, this.getRadius() * 0.6);
            }

            getRadius() {
                return Math.sqrt(this.mass) * 0.6;
            }
        }

        // ============================================
        // SPACECRAFT CLASS
        // ============================================
        class Spacecraft extends CelestialBody {
            constructor(x, y, mass, col, name) {
                super(x, y, mass, col, name);
                this.thrustPower = 0;
            }

            applyThrust(tx, ty) {
                this.ax += tx;
                this.ay += ty;
            }

            drawTrail() {
                if (this.trail.length < 2) return;

                // Greenish trail for spacecraft
                for (let i = 1; i < this.trail.length; i++) {
                    const alpha = map(i, 0, this.trail.length, 0, 200);
                    const size = map(i, 0, this.trail.length, 0.5, 4);

                    fill(50, 180, 80, alpha);
                    ellipse(this.trail[i].x, this.trail[i].y, size, size);
                }
            }

            draw() {
                // Engine glow when thrusting
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);

                // Direction indicator (velocity)
                const dirX = this.vx / (speed + 0.01);
                const dirY = this.vy / (speed + 0.01);

                // Thrust flame
                if (missionPhase < 3 || !missionComplete) {
                    fill(255, 150, 50, 150);
                    ellipse(this.x - dirX * 6, this.y - dirY * 6, 8, 8);
                    fill(255, 200, 100, 200);
                    ellipse(this.x - dirX * 4, this.y - dirY * 4, 5, 5);
                }

                // Main spacecraft body
                fill(this.col);
                ellipse(this.x, this.y, 8, 8);

                // White highlight
                fill(255);
                ellipse(this.x - 1.5, this.y - 1.5, 3, 3);
            }

            getRadius() {
                return 4;
            }
        }

        type: "iframe-element-click",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 监听来自父窗口的消息
  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
