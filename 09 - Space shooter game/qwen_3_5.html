<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Void: Space Shooter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
            font-size: 24px;
            font-weight: bold;
        }

        .hud-bottom {
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
            font-size: 18px;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border: 2px solid #0ff;
            border-radius: 10px;
            box-shadow: 0 0 20px #0ff;
            pointer-events: auto;
            z-index: 10;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 5px;
            background: linear-gradient(to right, #0ff, #f0f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 20px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 10px #0ff;
        }

        button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .hidden {
            display: none !important;
        }

        .controls-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div id="wave-display">WAVE: 1</div>
        </div>
        <div class="hud-bottom">
            <div id="health-display">SHIELD: 100%</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>Neon Void</h1>
        <p>Pilot your ship through the asteroid field.</p>
        <p>Destroy invaders. Survive.</p>
        <button onclick="startGame()">Initialize</button>
        <div class="controls-hint">WASD / Arrows to Move • Mouse to Aim • Click to Shoot</div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>System Failure</h1>
        <p id="final-score">Score: 0</p>
        <button onclick="resetGame()">Reboot</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let gameRunning = false;
        let score = 0;
        let wave = 1;
        let frames = 0;
        let screenShake = 0;

        // Input
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        const mouse = { x: 0, y: 0, down: false };

        // Entities
        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let asteroids = [];
        let stars = [];

        // Resize Handling
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Input Listeners
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
        window.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        // --- Classes ---

        class Star {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speed = Math.random() * 0.5 + 0.1;
                this.brightness = Math.random();
            }
            update() {
                this.y += this.speed + (wave * 0.5); // Stars move faster as waves progress
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.brightness})`;
                ctx.fillRect(this.x, this.y, this.size, this.size);
            }
        }

        class Particle {
            constructor(x, y, color, speed) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * speed;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.01;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, angle) {
                this.x = x;
                this.y = y;
                this.vx = Math.cos(angle) * 15;
                this.vy = Math.sin(angle) * 15;
                this.radius = 3;
                this.markedForDeletion = false;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.markedForDeletion = true;
                }
                // Trail effect
                if (frames % 2 === 0) {
                    particles.push(new Particle(this.x, this.y, '#0ff', 0.5));
                }
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0ff';
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Asteroid {
            constructor() {
                this.radius = Math.random() * 30 + 20;
                this.x = Math.random() * canvas.width;
                this.y = -this.radius;
                this.speed = Math.random() * 2 + 1 + (wave * 0.2);
                this.angle = 0;
                this.spin = (Math.random() - 0.5) * 0.1;
                this.vertices = [];
                const numVerts = Math.floor(Math.random() * 5) + 7;
                for (let i = 0; i < numVerts; i++) {
                    const angle = (i / numVerts) * Math.PI * 2;
                    const r = this.radius * (0.8 + Math.random() * 0.4);
                    this.vertices.push({
                        x: Math.cos(angle) * r,
                        y: Math.sin(angle) * r
                    });
                }
                this.markedForDeletion = false;
                this.hp = Math.floor(this.radius / 10);
            }
            update() {
                this.y += this.speed;
                this.angle += this.spin;
                if (this.y > canvas.height + this.radius) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#555';
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                ctx.stroke();
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type) {
                this.type = type; // 'chaser' or 'shooter'
                this.radius = 20;
                this.x = Math.random() * (canvas.width - 100) + 50;
                this.y = -50;
                this.markedForDeletion = false;
                this.hp = type === 'shooter' ? 3 : 1;
                this.color = type === 'shooter' ? '#f0f' : '#f50';
                
                // Movement
                this.angle = 0;
                this.vx = 0;
                this.vy = type === 'chaser' ? 3 + wave * 0.5 : 1 + wave * 0.2;
            }
            update() {
                this.y += this.vy;
                
                if (this.type === 'chaser') {
                    // Move towards player X
                    const dx = player.x - this.x;
                    this.x += dx * 0.02;
                } else {
                    // Shooter moves in sine wave
                    this.x += Math.sin(this.y * 0.05) * 2;
                }

                if (this.y > canvas.height + 50) this.markedForDeletion = true;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                
                if (this.type === 'chaser') {
                    // Bug shape
                    ctx.beginPath();
                    ctx.moveTo(0, 20);
                    ctx.lineTo(15, -10);
                    ctx.lineTo(0, -5);
                    ctx.lineTo(-15, -10);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Diamond shape
                    ctx.beginPath();
                    ctx.moveTo(0, 20);
                    ctx.lineTo(15, 0);
                    ctx.lineTo(0, -20);
                    ctx.lineTo(-15, 0);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.radius = 20;
                this.speed = 6;
                this.angle = -Math.PI / 2;
                this.hp = 100;
                this.lastShot = 0;
                this.shootDelay = 150; // ms
            }

            update() {
                // Movement
                if (keys.w || keys.ArrowUp) this.y -= this.speed;
                if (keys.s || keys.ArrowDown) this.y += this.speed;
                if (keys.a || keys.ArrowLeft) this.x -= this.speed;
                if (keys.d || keys.ArrowRight) this.x += this.speed;

                // Boundaries
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // Rotation (Face Mouse)
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                this.angle = Math.atan2(dy, dx);

                // Shooting
                if (mouse.down && Date.now() - this.lastShot > this.shootDelay) {
                    projectiles.push(new Projectile(this.x, this.y, this.angle));
                    this.lastShot = Date.now();
                    // Recoil
                    this.x -= Math.cos(this.angle) * 2;
                    this.y -= Math.sin(this.angle) * 2;
                }

                // Thruster Particles
                if (keys.w || keys.ArrowUp || keys.a || keys.ArrowLeft || keys.s || keys.ArrowDown || keys.d || keys.ArrowRight) {
                    const thrustAngle = this.angle + Math.PI; // Opposite to facing
                    const spread = 0.5;
                    const px = this.x + Math.cos(thrustAngle + (Math.random()-0.5)*spread) * 20;
                    const py = this.y + Math.sin(thrustAngle + (Math.random()-0.5)*spread) * 20;
                    particles.push(new Particle(px, py, '#0af', 2));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#0ff';
                ctx.fillStyle = '#fff';
                
                // Ship Body
                ctx.beginPath();
                ctx.moveTo(20, 0);
                ctx.lineTo(-15, 15);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-15, -15);
                ctx.closePath();
                ctx.fill();

                // Cockpit
                ctx.fillStyle = '#0ff';
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI*2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- Game Logic ---

        function init() {
            player = new Player();
            projectiles = [];
            enemies = [];
            particles = [];
            asteroids = [];
            stars = [];
            score = 0;
            wave = 1;
            frames = 0;
            
            // Create Starfield
            for(let i=0; i<100; i++) stars.push(new Star());
            
            updateUI();
        }

        function spawnEnemies() {
            if (frames % (100 - Math.min(50, wave * 5)) === 0) {
                const type = Math.random() > 0.7 ? 'shooter' : 'chaser';
                enemies.push(new Enemy(type));
            }
        }

        function spawnAsteroids() {
            if (frames % 150 === 0) {
                asteroids.push(new Asteroid());
            }
        }

        function checkCollisions() {
            // Projectiles vs Enemies
            projectiles.forEach((proj, pIndex) => {
                enemies.forEach((enemy, eIndex) => {
                    const dist = Math.hypot(proj.x - enemy.x, proj.y - enemy.y);
                    if (dist < proj.radius + enemy.radius) {
                        // Hit
                        createExplosion(enemy.x, enemy.y, enemy.color, 5);
                        enemy.hp--;
                        proj.markedForDeletion = true;
                        if (enemy.hp <= 0) {
                            enemy.markedForDeletion = true;
                            score += enemy.type === 'shooter' ? 200 : 100;
                            createExplosion(enemy.x, enemy.y, enemy.color, 15);
                            screenShake = 5;
                        }
                    }
                });

                // Projectiles vs Asteroids
                asteroids.forEach((asteroid, aIndex) => {
                    const dist = Math.hypot(proj.x - asteroid.x, proj.y - asteroid.y);
                    if (dist < proj.radius + asteroid.radius) {
                        proj.markedForDeletion = true;
                        asteroid.hp--;
                        createExplosion(asteroid.x, asteroid.y, '#888', 3);
                        if (asteroid.hp <= 0) {
                            asteroid.markedForDeletion = true;
                            score += 50;
                            createExplosion(asteroid.x, asteroid.y, '#aaa', 10);
                            // Split asteroid logic could go here
                        }
                    }
                });
            });

            // Player vs Enemies/Asteroids
            const hazards = [...enemies, ...asteroids];
            hazards.forEach(obj => {
                const dist = Math.hypot(player.x - obj.x, player.y - obj.y);
                if (dist < player.radius + obj.radius) {
                    player.hp -= 20;
                    obj.markedForDeletion = true;
                    createExplosion(player.x, player.y, '#f00', 20);
                    screenShake = 10;
                    if (player.hp <= 0) gameOver();
                }
            });
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 5));
            }
        }

        function updateUI() {
            document.getElementById('score-display').innerText = `SCORE: ${score}`;
            document.getElementById('wave-display').innerText = `WAVE: ${wave}`;
            document.getElementById('health-display').innerText = `SHIELD: ${Math.max(0, player.hp)}%`;
            
            const healthEl = document.getElementById('health-display');
            if (player.hp > 50) healthEl.style.color = '#0f0';
            else if (player.hp > 20) healthEl.style.color = '#ff0';
            else healthEl.style.color = '#f00';
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            init();
            gameRunning = true;
            animate();
        }

        function resetGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            init();
            gameRunning = true;
            animate();
        }

        function animate() {
            if (!gameRunning) return;

            // Clear Canvas with trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Screen Shake
            if (screenShake > 0) {
                ctx.save();
                const dx = Math.random() * screenShake - screenShake / 2;
                const dy = Math.random() * screenShake - screenShake / 2;
                ctx.translate(dx, dy);
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }

            // Background
            stars.forEach(star => { star.update(); star.draw(); });

            // Player
            player.update();
            player.draw();

            // Projectiles
            projectiles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.markedForDeletion) projectiles.splice(index, 1);
            });

            // Enemies
            spawnEnemies();
            enemies.forEach((e, index) => {
                e.update();
                e.draw();
                if (e.markedForDeletion) enemies.splice(index, 1);
            });

            // Asteroids
            spawnAsteroids();
            asteroids.forEach((a, index) => {
                a.update();
                a.draw();
                if (a.markedForDeletion) asteroids.splice(index, 1);
            });

            // Particles
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.life <= 0) particles.splice(index, 1);
            });

            checkCollisions();
            
            // Wave Progression
            frames++;
            if (frames % 1000 === 0) {
                wave++;
                // Heal player slightly on wave complete
                player.hp = Math.min(100, player.hp + 20);
            }

            updateUI();

            if (screenShake > 0) ctx.restore();

            requestAnimationFrame(animate);
        }

        // Initialize Stars for background before game starts
        resize();
        for(let i=0; i<100; i++) stars.push(new Star());
        function attractLoop() {
            if(gameRunning) return;
            ctx.fillStyle = 'rgba(5, 5, 5, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => { star.update(); star.draw(); });
            requestAnimationFrame(attractLoop);
        }
        attractLoop();

    </script>
</body>
</html>
