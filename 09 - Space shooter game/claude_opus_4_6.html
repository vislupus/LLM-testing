<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID FURY — Space Shooter</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Chakra Petch',sans-serif}
canvas{display:block;position:absolute;top:0;left:0}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#hud{position:absolute;top:0;left:0;width:100%;padding:12px 20px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:20}
.hud-left,.hud-right,.hud-center{display:flex;flex-direction:column;gap:4px}
.hud-center{align-items:center;position:absolute;left:50%;transform:translateX(-50%);top:12px}
.hud-right{align-items:flex-end}
.hud-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(120,180,255,0.5);font-family:'Orbitron',sans-serif}
.hud-value{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700;color:#e0eeff;text-shadow:0 0 10px rgba(100,180,255,0.4)}
.hud-value.score{font-size:22px;color:#ffd475;text-shadow:0 0 12px rgba(255,200,80,0.4)}
.health-bar{width:180px;height:6px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;margin-top:2px}
.health-fill{height:100%;background:linear-gradient(90deg,#ff4466,#ff6b8a,#44ffaa);border-radius:3px;transition:width 0.3s;box-shadow:0 0 8px rgba(68,255,170,0.3)}
.shield-bar{width:180px;height:4px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;margin-top:2px}
.shield-fill{height:100%;background:linear-gradient(90deg,#44aaff,#88ccff);border-radius:2px;transition:width 0.3s;box-shadow:0 0 6px rgba(68,170,255,0.3)}
.wave-announce{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;color:#fff;text-shadow:0 0 20px rgba(100,180,255,0.6);opacity:0;transition:opacity 0.5s}
.wave-announce.show{opacity:1}
.wave-sub{font-size:12px;color:rgba(200,220,255,0.6);letter-spacing:4px;margin-top:4px}
.powerup-indicators{display:flex;gap:8px;margin-top:4px}
.powerup-ind{width:24px;height:24px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:12px;opacity:0.2;transition:opacity 0.3s}
.powerup-ind.active{opacity:1;border-color:rgba(255,255,255,0.4);box-shadow:0 0 8px rgba(255,255,255,0.1)}

/* Screens */
.screen-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;pointer-events:all;transition:opacity 0.5s}
.screen-overlay.hidden{opacity:0;pointer-events:none}
#start-screen{background:radial-gradient(ellipse at 50% 40%,rgba(10,20,60,0.95),rgba(0,0,0,0.98))}
#gameover-screen{background:rgba(0,0,0,0.85);backdrop-filter:blur(4px)}
.game-title{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;letter-spacing:8px;background:linear-gradient(135deg,#ff4466,#ff8844,#ffcc44,#44ffaa,#44aaff,#8866ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 20px rgba(255,100,100,0.3))}
.game-sub{font-size:14px;letter-spacing:6px;color:rgba(180,200,255,0.5);margin-top:8px;text-transform:uppercase}
.start-btn{margin-top:40px;padding:14px 48px;background:transparent;border:2px solid rgba(100,180,255,0.4);border-radius:8px;color:#c0ddff;font-family:'Orbitron',sans-serif;font-size:14px;font-weight:600;letter-spacing:4px;cursor:pointer;pointer-events:all;transition:all 0.2s;text-transform:uppercase}
.start-btn:hover{border-color:rgba(100,180,255,0.8);color:#fff;box-shadow:0 0 30px rgba(100,180,255,0.2);transform:translateY(-2px)}
.controls-hint{margin-top:24px;font-size:11px;color:rgba(150,170,200,0.4);letter-spacing:1px;text-align:center;line-height:1.8}
.go-title{font-family:'Orbitron',sans-serif;font-size:36px;font-weight:800;color:#ff4466;letter-spacing:4px;text-shadow:0 0 20px rgba(255,68,102,0.4)}
.go-score{font-family:'Orbitron',sans-serif;font-size:18px;color:#ffd475;margin-top:12px}
.go-wave{font-size:13px;color:rgba(200,220,255,0.5);margin-top:6px}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui">
  <div id="hud">
    <div class="hud-left">
      <div class="hud-label">Hull</div>
      <div class="health-bar"><div class="health-fill" id="healthFill" style="width:100%"></div></div>
      <div class="hud-label" style="margin-top:4px">Shield</div>
      <div class="shield-bar"><div class="shield-fill" id="shieldFill" style="width:0%"></div></div>
      <div class="powerup-indicators">
        <div class="powerup-ind" id="pu-rapid" title="Rapid Fire">⚡</div>
        <div class="powerup-ind" id="pu-spread" title="Spread Shot">✦</div>
        <div class="powerup-ind" id="pu-shield" title="Shield">🛡</div>
      </div>
    </div>
    <div class="hud-center">
      <div class="wave-announce" id="waveAnnounce">WAVE 1</div>
      <div class="wave-sub" id="waveSub"></div>
    </div>
    <div class="hud-right">
      <div class="hud-label">Score</div>
      <div class="hud-value score" id="scoreDisplay">0</div>
      <div class="hud-label" style="margin-top:6px">Wave</div>
      <div class="hud-value" id="waveDisplay">1</div>
    </div>
  </div>
</div>

<div class="screen-overlay" id="start-screen">
  <div class="game-title">VOID FURY</div>
  <div class="game-sub">Space Shooter</div>
  <button class="start-btn" onclick="startGame()">Launch</button>
  <div class="controls-hint">
    WASD or Arrow Keys to move · Mouse to aim · Click or Space to fire<br>
    Destroy aliens · Dodge asteroids · Collect power-ups · Survive
  </div>
</div>

<div class="screen-overlay hidden" id="gameover-screen">
  <div class="go-title">SIGNAL LOST</div>
  <div class="go-score" id="goScore">Score: 0</div>
  <div class="go-wave" id="goWave">Reached Wave 1</div>
  <button class="start-btn" onclick="startGame()" style="margin-top:30px">Relaunch</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// VOID FURY — Space Shooter Engine
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Utility ──
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
const TAU = Math.PI * 2;

// ═══════════════════════════════════════════════════════════════
// AUDIO ENGINE — Procedural sound effects via Web Audio API
// ═══════════════════════════════════════════════════════════════
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  const g = audioCtx.createGain();
  const o = audioCtx.createOscillator();
  g.connect(audioCtx.destination);
  o.connect(g);

  switch(type) {
    case 'shoot':
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(880, now);
      o.frequency.exponentialRampToValueAtTime(220, now + 0.08);
      g.gain.setValueAtTime(0.06, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      o.start(now); o.stop(now + 0.08);
      break;
    case 'explode':
      // Noise burst via many detuned oscillators
      for (let i = 0; i < 3; i++) {
        const o2 = audioCtx.createOscillator();
        const g2 = audioCtx.createGain();
        g2.connect(audioCtx.destination);
        o2.connect(g2);
        o2.type = 'sawtooth';
        o2.frequency.setValueAtTime(rand(60, 200), now);
        o2.frequency.exponentialRampToValueAtTime(20, now + 0.4);
        g2.gain.setValueAtTime(0.07, now);
        g2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        o2.start(now); o2.stop(now + 0.4);
      }
      return;
    case 'hit':
      o.type = 'square';
      o.frequency.setValueAtTime(200, now);
      o.frequency.exponentialRampToValueAtTime(80, now + 0.1);
      g.gain.setValueAtTime(0.05, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      o.start(now); o.stop(now + 0.1);
      break;
    case 'powerup':
      o.type = 'sine';
      o.frequency.setValueAtTime(400, now);
      o.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
      g.gain.setValueAtTime(0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      o.start(now); o.stop(now + 0.25);
      break;
    case 'shield':
      o.type = 'sine';
      o.frequency.setValueAtTime(300, now);
      o.frequency.linearRampToValueAtTime(600, now + 0.15);
      g.gain.setValueAtTime(0.04, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
      o.start(now); o.stop(now + 0.15);
      break;
    default:
      o.start(now); o.stop(now + 0.01);
  }
}

// ═══════════════════════════════════════════════════════════════
// SCREEN SHAKE
// ═══════════════════════════════════════════════════════════════
let shakeX = 0, shakeY = 0, shakeMag = 0, shakeDecay = 0.92;
function addShake(mag) { shakeMag = Math.min(shakeMag + mag, 20); }
function updateShake() {
  if (shakeMag > 0.5) {
    shakeX = rand(-shakeMag, shakeMag);
    shakeY = rand(-shakeMag, shakeMag);
    shakeMag *= shakeDecay;
  } else {
    shakeX = shakeY = shakeMag = 0;
  }
}

// ═══════════════════════════════════════════════════════════════
// STARFIELD — Multi-layer parallax scrolling stars
// ═══════════════════════════════════════════════════════════════
const STAR_LAYERS = 4;
const STARS_PER_LAYER = [120, 80, 50, 20];
const STAR_SPEEDS = [0.15, 0.4, 0.8, 1.5];
const STAR_SIZES = [0.5, 1, 1.5, 2.5];
const STAR_ALPHA = [0.2, 0.35, 0.5, 0.8];
let stars = [];

function initStars() {
  stars = [];
  for (let l = 0; l < STAR_LAYERS; l++) {
    for (let i = 0; i < STARS_PER_LAYER[l]; i++) {
      stars.push({
        x: rand(0, W),
        y: rand(0, H),
        layer: l,
        twinkle: rand(0, TAU),
        twinkleSpeed: rand(1, 4),
      });
    }
  }
}

function updateStars(dt) {
  for (const s of stars) {
    s.y += STAR_SPEEDS[s.layer] * 60 * dt;
    s.twinkle += s.twinkleSpeed * dt;
    if (s.y > H + 5) { s.y = -5; s.x = rand(0, W); }
  }
}

function drawStars() {
  for (const s of stars) {
    const alpha = STAR_ALPHA[s.layer] * (0.5 + 0.5 * Math.sin(s.twinkle));
    const sz = STAR_SIZES[s.layer];
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#c8e0ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, sz, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// NEBULA — Soft colored background clouds
// ═══════════════════════════════════════════════════════════════
let nebulaCanvas;
function generateNebula() {
  nebulaCanvas = document.createElement('canvas');
  nebulaCanvas.width = W;
  nebulaCanvas.height = H;
  const nc = nebulaCanvas.getContext('2d');
  nc.fillStyle = '#030510';
  nc.fillRect(0, 0, W, H);

  const clouds = [
    { x: W * 0.2, y: H * 0.3, r: 300, c: 'rgba(40,20,80,0.12)' },
    { x: W * 0.7, y: H * 0.6, r: 350, c: 'rgba(20,40,80,0.10)' },
    { x: W * 0.5, y: H * 0.8, r: 250, c: 'rgba(60,20,40,0.08)' },
    { x: W * 0.8, y: H * 0.2, r: 200, c: 'rgba(20,50,60,0.10)' },
  ];
  for (const cl of clouds) {
    const grad = nc.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
    grad.addColorStop(0, cl.c);
    grad.addColorStop(1, 'transparent');
    nc.fillStyle = grad;
    nc.fillRect(0, 0, W, H);
  }
}

// ═══════════════════════════════════════════════════════════════
// PARTICLE ENGINE
// ═══════════════════════════════════════════════════════════════
let particles = [];

function spawnParticles(x, y, count, config) {
  for (let i = 0; i < count; i++) {
    const angle = config.angle !== undefined ? config.angle + rand(-config.spread, config.spread) : rand(0, TAU);
    const speed = rand(config.speedMin || 40, config.speedMax || 200);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(config.lifeMin || 0.2, config.lifeMax || 0.8),
      maxLife: 0,
      size: rand(config.sizeMin || 1, config.sizeMax || 3),
      color: config.colors[randInt(0, config.colors.length - 1)],
      drag: config.drag || 0.98,
      glow: config.glow || false,
    });
    particles[particles.length - 1].maxLife = particles[particles.length - 1].life;
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= p.drag;
    p.vy *= p.drag;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = clamp(p.life / p.maxLife, 0, 1);
    const sz = p.size * alpha;
    if (p.glow) {
      ctx.globalAlpha = alpha * 0.3;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, sz * 3, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, sz, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// Explosion presets
function explode(x, y, size, colors) {
  spawnParticles(x, y, 15 + size * 3, {
    spread: Math.PI,
    angle: rand(0, TAU),
    speedMin: 30, speedMax: 150 + size * 20,
    lifeMin: 0.3, lifeMax: 0.9,
    sizeMin: 1, sizeMax: 3 + size * 0.5,
    colors: colors || ['#ff6644','#ff9944','#ffcc44','#ffffff'],
    drag: 0.96, glow: true,
  });
  // Debris chunks
  spawnParticles(x, y, 5 + size, {
    spread: Math.PI,
    angle: rand(0, TAU),
    speedMin: 60, speedMax: 200,
    lifeMin: 0.4, lifeMax: 1.2,
    sizeMin: 2, sizeMax: 5,
    colors: ['#666','#888','#aaa','#554433'],
    drag: 0.97,
  });
}

// Thruster exhaust
function thrusterParticles(x, y, angle) {
  spawnParticles(x, y, 1, {
    angle: angle + Math.PI,
    spread: 0.3,
    speedMin: 80, speedMax: 160,
    lifeMin: 0.1, lifeMax: 0.25,
    sizeMin: 1, sizeMax: 2.5,
    colors: ['#44aaff','#88ccff','#aaddff','#ffffff'],
    drag: 0.94, glow: true,
  });
}

// ═══════════════════════════════════════════════════════════════
// PLAYER SHIP
// ═══════════════════════════════════════════════════════════════
let player;

function createPlayer() {
  return {
    x: W / 2, y: H * 0.75,
    vx: 0, vy: 0,
    angle: -Math.PI / 2,
    speed: 320,
    health: 100,
    maxHealth: 100,
    shield: 0,
    maxShield: 50,
    alive: true,
    fireCooldown: 0,
    fireRate: 0.14,
    spreadShot: false,
    rapidFire: false,
    rapidTimer: 0,
    spreadTimer: 0,
    shieldTimer: 0,
    invulnTimer: 0,
    radius: 14,
    thrustAngle: 0,
    isThrusting: false,
  };
}

function drawShip(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle + Math.PI / 2);

  // Engine glow
  if (p.isThrusting) {
    const eg = ctx.createRadialGradient(0, 14, 0, 0, 14, 18);
    eg.addColorStop(0, 'rgba(80,180,255,0.5)');
    eg.addColorStop(0.5, 'rgba(80,180,255,0.15)');
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(0, 14, 18, 0, TAU);
    ctx.fill();
  }

  // Main body
  ctx.fillStyle = '#b8cce0';
  ctx.strokeStyle = '#6090b8';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(-12, 10);
  ctx.lineTo(-8, 14);
  ctx.lineTo(0, 10);
  ctx.lineTo(8, 14);
  ctx.lineTo(12, 10);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Cockpit
  const cg = ctx.createLinearGradient(0, -14, 0, -2);
  cg.addColorStop(0, '#44ccff');
  cg.addColorStop(1, '#2266aa');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(-5, -2);
  ctx.lineTo(5, -2);
  ctx.closePath();
  ctx.fill();

  // Wing accents
  ctx.fillStyle = '#ff6644';
  ctx.fillRect(-12, 6, 3, 6);
  ctx.fillRect(9, 6, 3, 6);

  // Shield effect
  if (p.shield > 0) {
    ctx.strokeStyle = `rgba(68,170,255,${0.3 + 0.2 * Math.sin(Date.now() * 0.008)})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 22, 0, TAU);
    ctx.stroke();
  }

  // Invulnerability flash
  if (p.invulnTimer > 0 && Math.floor(p.invulnTimer * 10) % 2 === 0) {
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(0, 0, 16, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function updatePlayer(dt) {
  if (!player.alive) return;

  // Movement input
  let mx = 0, my = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  mx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) mx += 1;
  if (keys['KeyW'] || keys['ArrowUp'])    my -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  my += 1;

  const moving = mx !== 0 || my !== 0;
  player.isThrusting = moving;

  if (moving) {
    const moveAngle = Math.atan2(my, mx);
    player.thrustAngle = moveAngle;
    player.vx = Math.cos(moveAngle) * player.speed;
    player.vy = Math.sin(moveAngle) * player.speed;
  } else {
    player.vx *= 0.9;
    player.vy *= 0.9;
  }

  player.x += player.vx * dt;
  player.y += player.vy * dt;

  // Clamp to screen
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, 20, H - 20);

  // Aim at mouse
  const dx = mouseX - player.x;
  const dy = mouseY - player.y;
  player.angle = Math.atan2(dy, dx);

  // Timers
  player.fireCooldown -= dt;
  if (player.rapidTimer > 0) { player.rapidTimer -= dt; if (player.rapidTimer <= 0) player.rapidFire = false; }
  if (player.spreadTimer > 0) { player.spreadTimer -= dt; if (player.spreadTimer <= 0) player.spreadShot = false; }
  if (player.shieldTimer > 0) {
    player.shieldTimer -= dt;
    if (player.shieldTimer <= 0) player.shield = 0;
  }
  if (player.invulnTimer > 0) player.invulnTimer -= dt;

  // Firing
  const rate = player.rapidFire ? player.fireRate * 0.4 : player.fireRate;
  if ((mouseDown || keys['Space']) && player.fireCooldown <= 0) {
    firePlayerBullet();
    player.fireCooldown = rate;
  }

  // Thruster particles
  if (moving && Math.random() < 0.6) {
    const bx = player.x - Math.cos(player.angle) * 12;
    const by = player.y - Math.sin(player.angle) * 12;
    thrusterParticles(bx, by, player.angle);
  }

  updateHUD();
}

// ═══════════════════════════════════════════════════════════════
// BULLETS
// ═══════════════════════════════════════════════════════════════
let playerBullets = [];
let enemyBullets = [];

function firePlayerBullet() {
  playSound('shoot');
  const a = player.angle;
  const bx = player.x + Math.cos(a) * 20;
  const by = player.y + Math.sin(a) * 20;
  const speed = 700;

  if (player.spreadShot) {
    for (let i = -2; i <= 2; i++) {
      const sa = a + i * 0.1;
      playerBullets.push({ x: bx, y: by, vx: Math.cos(sa) * speed, vy: Math.sin(sa) * speed, life: 1.5, dmg: 12 });
    }
  } else {
    playerBullets.push({ x: bx, y: by, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life: 1.5, dmg: 20 });
  }
}

function updateBullets(arr, dt) {
  for (let i = arr.length - 1; i >= 0; i--) {
    const b = arr[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      arr.splice(i, 1);
    }
  }
}

function drawPlayerBullets() {
  for (const b of playerBullets) {
    const a = Math.atan2(b.vy, b.vx);
    const len = 12;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(a);

    // Glow
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#44ccff';
    ctx.beginPath();
    ctx.ellipse(0, 0, len + 4, 5, 0, 0, TAU);
    ctx.fill();

    // Core
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#aaeeff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-len / 2, 0);
    ctx.lineTo(len / 2, 0);
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-len / 2 + 2, 0);
    ctx.lineTo(len / 2 - 1, 0);
    ctx.stroke();

    ctx.restore();
  }
}

function drawEnemyBullets() {
  for (const b of enemyBullets) {
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#ff4444';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 6, 0, TAU);
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.fillStyle = '#ff8866';
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// ASTEROIDS
// ═══════════════════════════════════════════════════════════════
let asteroids = [];

function spawnAsteroid(x, y, size) {
  const verts = [];
  const numV = randInt(7, 12);
  for (let i = 0; i < numV; i++) {
    const a = (i / numV) * TAU;
    const r = size * rand(0.7, 1.1);
    verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  asteroids.push({
    x: x !== undefined ? x : rand(0, W),
    y: y !== undefined ? y : -40,
    vx: rand(-30, 30),
    vy: rand(30, 100),
    rotation: rand(0, TAU),
    rotSpeed: rand(-2, 2),
    size,
    radius: size,
    health: size * 2,
    verts,
    color: `hsl(${randInt(20, 50)}, ${randInt(10, 30)}%, ${randInt(30, 50)}%)`,
  });
}

function updateAsteroids(dt) {
  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rotation += a.rotSpeed * dt;
    if (a.y > H + 60 || a.x < -60 || a.x > W + 60) {
      asteroids.splice(i, 1);
    }
  }
}

function drawAsteroids() {
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rotation);

    ctx.fillStyle = a.color;
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(a.verts[0].x, a.verts[0].y);
    for (let i = 1; i < a.verts.length; i++) {
      ctx.lineTo(a.verts[i].x, a.verts[i].y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Highlight edge
    ctx.strokeStyle = 'rgba(255,255,200,0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, a.size * 0.5, -0.5, 0.5);
    ctx.stroke();

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// ALIEN ENEMIES
// ═══════════════════════════════════════════════════════════════
let enemies = [];

// Enemy types with distinct shapes and behaviors
const ENEMY_TYPES = {
  scout: {
    health: 30, speed: 120, radius: 12, score: 100,
    color: '#44ff88', accent: '#22aa55',
    fireCooldown: 2.0, bulletSpeed: 250,
    draw(e) {
      // Small fast triangle ship
      ctx.fillStyle = e.type.color;
      ctx.strokeStyle = e.type.accent;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -12);
      ctx.lineTo(-10, 8);
      ctx.lineTo(0, 4);
      ctx.lineTo(10, 8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, -2, 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(0, -2, 1.5, 0, TAU);
      ctx.fill();
    }
  },
  cruiser: {
    health: 80, speed: 60, radius: 20, score: 250,
    color: '#ff6644', accent: '#cc4422',
    fireCooldown: 1.2, bulletSpeed: 200,
    draw(e) {
      // Larger hexagonal ship
      ctx.fillStyle = e.type.color;
      ctx.strokeStyle = e.type.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * TAU - Math.PI / 2;
        const r = 18;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // Inner detail
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, TAU);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#ffff00';
      ctx.beginPath();
      ctx.arc(-5, -2, 3, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, -2, 3, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-5, -1, 1.5, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(5, -1, 1.5, 0, TAU);
      ctx.fill();
    }
  },
  mothership: {
    health: 200, speed: 35, radius: 32, score: 500,
    color: '#aa44ff', accent: '#7722cc',
    fireCooldown: 0.8, bulletSpeed: 180,
    draw(e) {
      // Large saucer
      ctx.fillStyle = e.type.color;
      ctx.strokeStyle = e.type.accent;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, 30, 14, 0, 0, TAU);
      ctx.fill();
      ctx.stroke();
      // Dome
      const dg = ctx.createRadialGradient(0, -4, 0, 0, -4, 14);
      dg.addColorStop(0, '#cc88ff');
      dg.addColorStop(1, e.type.color);
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.ellipse(0, -4, 14, 12, 0, Math.PI, 0);
      ctx.fill();
      // Lights
      for (let i = 0; i < 5; i++) {
        const lx = -16 + i * 8;
        ctx.fillStyle = i % 2 === 0 ? '#ffff66' : '#66ffff';
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() * 0.005 + i);
        ctx.beginPath();
        ctx.arc(lx, 4, 2, 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // Big eye
      ctx.fillStyle = '#ff0044';
      ctx.beginPath();
      ctx.arc(0, -6, 5, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(1, -7, 2, 0, TAU);
      ctx.fill();
    }
  },
};

function spawnEnemy(type, x, y) {
  const t = ENEMY_TYPES[type];
  enemies.push({
    x: x !== undefined ? x : rand(40, W - 40),
    y: y !== undefined ? y : -30,
    vx: rand(-20, 20),
    vy: t.speed,
    type: t,
    typeName: type,
    health: t.health,
    maxHealth: t.health,
    radius: t.radius,
    fireCooldown: rand(0.5, t.fireCooldown),
    fireRate: t.fireCooldown,
    alive: true,
    time: 0,
    wobble: rand(0, TAU),
    wobbleSpeed: rand(1.5, 3),
    wobbleAmp: rand(30, 80),
  });
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.time += dt;
    e.wobble += e.wobbleSpeed * dt;

    // Move downward with wobble
    e.x += Math.sin(e.wobble) * e.wobbleAmp * dt;
    e.y += e.vy * dt * 0.5;

    // Slow down when on screen
    if (e.y > 60 && e.vy > 20) e.vy *= 0.995;

    // Clamp x
    e.x = clamp(e.x, e.radius, W - e.radius);

    // Fire at player
    e.fireCooldown -= dt;
    if (e.fireCooldown <= 0 && player.alive && e.y > 0 && e.y < H - 50) {
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const a = Math.atan2(dy, dx);
      enemyBullets.push({
        x: e.x, y: e.y,
        vx: Math.cos(a) * e.type.bulletSpeed,
        vy: Math.sin(a) * e.type.bulletSpeed,
        life: 3, dmg: 10,
      });
      e.fireCooldown = e.fireRate * rand(0.8, 1.2);
    }

    // Off-screen removal
    if (e.y > H + 60) enemies.splice(i, 1);
  }
}

function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);

    // Damage flash
    if (e.health < e.maxHealth * 0.5) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = '#ff4444';
      ctx.beginPath();
      ctx.arc(0, 0, e.radius + 4, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    e.type.draw(e);

    // Health bar (only if damaged)
    if (e.health < e.maxHealth) {
      const bw = e.radius * 2;
      const bh = 3;
      const by = e.radius + 6;
      ctx.fillStyle = 'rgba(255,0,0,0.4)';
      ctx.fillRect(-bw / 2, by, bw, bh);
      ctx.fillStyle = '#44ff88';
      ctx.fillRect(-bw / 2, by, bw * (e.health / e.maxHealth), bh);
    }

    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// POWER-UPS
// ═══════════════════════════════════════════════════════════════
let powerups = [];
const PU_TYPES = ['rapid', 'spread', 'shield', 'heal'];
const PU_COLORS = { rapid: '#ffaa00', spread: '#44aaff', shield: '#44ffaa', heal: '#ff4488' };
const PU_SYMBOLS = { rapid: '⚡', spread: '✦', shield: '◇', heal: '+' };

function spawnPowerup(x, y) {
  const type = PU_TYPES[randInt(0, PU_TYPES.length - 1)];
  powerups.push({ x, y, vy: 40, type, radius: 12, time: 0 });
}

function updatePowerups(dt) {
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.vy * dt;
    p.time += dt;
    if (p.y > H + 20) { powerups.splice(i, 1); continue; }

    // Collect
    if (player.alive && dist(p.x, p.y, player.x, player.y) < player.radius + p.radius) {
      applyPowerup(p.type);
      playSound('powerup');
      spawnParticles(p.x, p.y, 12, {
        spread: Math.PI, angle: rand(0, TAU),
        speedMin: 40, speedMax: 120,
        lifeMin: 0.2, lifeMax: 0.5,
        sizeMin: 1, sizeMax: 3,
        colors: [PU_COLORS[p.type], '#ffffff'],
        drag: 0.96, glow: true,
      });
      powerups.splice(i, 1);
    }
  }
}

function applyPowerup(type) {
  switch (type) {
    case 'rapid':
      player.rapidFire = true;
      player.rapidTimer = 8;
      break;
    case 'spread':
      player.spreadShot = true;
      player.spreadTimer = 8;
      break;
    case 'shield':
      player.shield = player.maxShield;
      player.shieldTimer = 10;
      break;
    case 'heal':
      player.health = Math.min(player.health + 30, player.maxHealth);
      break;
  }
}

function drawPowerups() {
  for (const p of powerups) {
    const pulse = 1 + 0.1 * Math.sin(p.time * 5);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(pulse, pulse);

    // Glow
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = PU_COLORS[p.type];
    ctx.beginPath();
    ctx.arc(0, 0, 18, 0, TAU);
    ctx.fill();

    // Border
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = PU_COLORS[p.type];
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, 12, 0, TAU);
    ctx.stroke();

    // Symbol
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PU_SYMBOLS[p.type], 0, 0);

    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════════
// COLLISION DETECTION
// ═══════════════════════════════════════════════════════════════
function checkCollisions() {
  if (!player.alive) return;

  // Player bullets → enemies
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
      const e = enemies[ei];
      if (dist(b.x, b.y, e.x, e.y) < e.radius + 4) {
        e.health -= b.dmg;
        playerBullets.splice(bi, 1);
        playSound('hit');

        // Small hit particles
        spawnParticles(b.x, b.y, 4, {
          spread: 0.5, angle: Math.atan2(b.vy, b.vx) + Math.PI,
          speedMin: 30, speedMax: 80,
          lifeMin: 0.1, lifeMax: 0.3,
          sizeMin: 1, sizeMax: 2,
          colors: [e.type.color, '#ffffff'],
          drag: 0.95,
        });

        if (e.health <= 0) {
          destroyEnemy(ei);
        }
        break;
      }
    }
  }

  // Player bullets → asteroids
  for (let bi = playerBullets.length - 1; bi >= 0; bi--) {
    const b = playerBullets[bi];
    for (let ai = asteroids.length - 1; ai >= 0; ai--) {
      const a = asteroids[ai];
      if (dist(b.x, b.y, a.x, a.y) < a.radius + 3) {
        a.health -= b.dmg;
        playerBullets.splice(bi, 1);
        if (a.health <= 0) {
          explode(a.x, a.y, a.size / 8, ['#886644','#aa8866','#ccaa88','#ffddaa']);
          playSound('explode');
          addShake(a.size / 5);
          score += 25;
          // Split large asteroids
          if (a.size > 15) {
            spawnAsteroid(a.x - 10, a.y, a.size * 0.55);
            spawnAsteroid(a.x + 10, a.y, a.size * 0.55);
          }
          asteroids.splice(ai, 1);
        }
        break;
      }
    }
  }

  // Enemy bullets → player
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (dist(b.x, b.y, player.x, player.y) < player.radius + 4) {
      damagePlayer(b.dmg);
      enemyBullets.splice(i, 1);
    }
  }

  // Enemies → player (collision)
  for (const e of enemies) {
    if (dist(e.x, e.y, player.x, player.y) < player.radius + e.radius - 4) {
      damagePlayer(20);
      e.health -= 50;
    }
  }

  // Asteroids → player
  for (const a of asteroids) {
    if (dist(a.x, a.y, player.x, player.y) < player.radius + a.radius - 4) {
      damagePlayer(25);
      a.health -= 999; // Destroy asteroid on contact
    }
  }
}

function damagePlayer(dmg) {
  if (player.invulnTimer > 0) return;

  if (player.shield > 0) {
    const absorbed = Math.min(dmg, player.shield);
    player.shield -= absorbed;
    dmg -= absorbed;
    playSound('shield');
  }
  if (dmg > 0) {
    player.health -= dmg;
    playSound('hit');
  }

  addShake(5);
  player.invulnTimer = 0.3;

  if (player.health <= 0) {
    killPlayer();
  }
}

function killPlayer() {
  player.alive = false;
  explode(player.x, player.y, 8, ['#44aaff','#88ccff','#ffffff','#ff6644']);
  playSound('explode');
  addShake(15);
  setTimeout(gameOver, 1500);
}

function destroyEnemy(idx) {
  const e = enemies[idx];
  explode(e.x, e.y, e.typeName === 'mothership' ? 10 : 5, [e.type.color, e.type.accent, '#ffffff', '#ffcc44']);
  playSound('explode');
  addShake(e.typeName === 'mothership' ? 10 : 4);
  score += e.type.score;
  enemiesKilledThisWave++;

  // Drop powerup chance
  if (Math.random() < (e.typeName === 'mothership' ? 0.8 : 0.2)) {
    spawnPowerup(e.x, e.y);
  }

  enemies.splice(idx, 1);
}

// ═══════════════════════════════════════════════════════════════
// WAVE SYSTEM
// ═══════════════════════════════════════════════════════════════
let wave = 1;
let waveTimer = 0;
let waveSpawnTimer = 0;
let enemiesToSpawn = 0;
let enemiesKilledThisWave = 0;
let totalEnemiesThisWave = 0;
let waveActive = false;
let waveCooldown = 0;
let asteroidTimer = 0;

function startWave(num) {
  wave = num;
  waveTimer = 0;
  waveActive = true;
  enemiesKilledThisWave = 0;

  // Scale difficulty with wave
  const baseEnemies = 4 + wave * 2;
  totalEnemiesThisWave = Math.min(baseEnemies, 30);
  enemiesToSpawn = totalEnemiesThisWave;
  waveSpawnTimer = 0;

  // Announce
  const el = document.getElementById('waveAnnounce');
  el.textContent = `WAVE ${wave}`;
  el.classList.add('show');
  document.getElementById('waveSub').textContent = `${totalEnemiesThisWave} hostiles incoming`;
  setTimeout(() => {
    el.classList.remove('show');
    document.getElementById('waveSub').textContent = '';
  }, 2500);

  document.getElementById('waveDisplay').textContent = wave;
}

function updateWaveSystem(dt) {
  waveTimer += dt;

  // Spawn asteroids periodically
  asteroidTimer -= dt;
  if (asteroidTimer <= 0) {
    const size = rand(10, 35);
    spawnAsteroid(rand(40, W - 40), -50, size);
    asteroidTimer = rand(1.5, 4) / Math.min(wave * 0.3 + 0.7, 2);
  }

  if (!waveActive) {
    waveCooldown -= dt;
    if (waveCooldown <= 0) {
      startWave(wave + 1);
    }
    return;
  }

  // Spawn enemies gradually
  if (enemiesToSpawn > 0) {
    waveSpawnTimer -= dt;
    if (waveSpawnTimer <= 0) {
      // Choose enemy type based on wave
      let type = 'scout';
      const roll = Math.random();
      if (wave >= 3 && roll < 0.15) type = 'mothership';
      else if (wave >= 2 && roll < 0.4) type = 'cruiser';

      spawnEnemy(type);
      enemiesToSpawn--;
      waveSpawnTimer = rand(0.5, 1.5) / Math.min(wave * 0.2 + 0.8, 2);
    }
  }

  // Check wave complete
  if (enemiesToSpawn <= 0 && enemies.length === 0) {
    waveActive = false;
    waveCooldown = 3;
  }
}

// ═══════════════════════════════════════════════════════════════
// HUD UPDATES
// ═══════════════════════════════════════════════════════════════
let score = 0;

function updateHUD() {
  document.getElementById('healthFill').style.width = `${(player.health / player.maxHealth) * 100}%`;
  document.getElementById('shieldFill').style.width = `${(player.shield / player.maxShield) * 100}%`;
  document.getElementById('scoreDisplay').textContent = score.toLocaleString();
  document.getElementById('pu-rapid').classList.toggle('active', player.rapidFire);
  document.getElementById('pu-spread').classList.toggle('active', player.spreadShot);
  document.getElementById('pu-shield').classList.toggle('active', player.shield > 0);
}

let keys = {};

document.addEventListener('keydown', e => { keys[e.code] = true; });
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => { mouseDown = true; });
canvas.addEventListener('mouseup', e => { mouseDown = false; });

// ═══════════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════════
let gameRunning = false;
let lastTime = 0;

function gameLoop(now) {
  if (!gameRunning) return;
  requestAnimationFrame(gameLoop);

  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  // ── UPDATE ──
  updateStars(dt);
  updateShake();
  updatePlayer(dt);
  updateBullets(playerBullets, dt);
  updateBullets(enemyBullets, dt);
  updateAsteroids(dt);
  updateEnemies(dt);
  updatePowerups(dt);
  updateParticles(dt);
  checkCollisions();
  updateWaveSystem(dt);

  // ── DRAW ──
  ctx.save();
  ctx.translate(shakeX, shakeY);

  // Background
  if (nebulaCanvas) ctx.drawImage(nebulaCanvas, 0, 0);
  else { ctx.fillStyle = '#030510'; ctx.fillRect(0, 0, W, H); }

  drawStars();
  drawAsteroids();
  drawPowerups();
  drawEnemyBullets();
  drawEnemies();
  drawPlayerBullets();
  if (player.alive) drawShip(player);
  drawParticles();

  ctx.restore();

  // Vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.85);
  vg.addColorStop(0, 'transparent');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

// ═══════════════════════════════════════════════════════════════
// GAME LIFECYCLE
// ═══════════════════════════════════════════════════════════════
function startGame() {
  initAudio();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');

  // Reset everything
  player = createPlayer();
  playerBullets = [];
  enemyBullets = [];
  asteroids = [];
  enemies = [];
  particles = [];
  powerups = [];
  score = 0;
  wave = 0;
  waveActive = false;
  waveCooldown = 1.5;
  asteroidTimer = 2;
  mouseX = W / 2;
  mouseY = H / 2;

  initStars();
  generateNebula();
  updateHUD();

  gameRunning = true;
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function gameOver() {
  gameRunning = false;
  document.getElementById('goScore').textContent = `Score: ${score.toLocaleString()}`;
  document.getElementById('goWave').textContent = `Reached Wave ${wave}`;
  document.getElementById('gameover-screen').classList.remove('hidden');
}

// ── Background animation for title screen ──
function titleLoop() {
  if (gameRunning) { requestAnimationFrame(titleLoop); return; }
  requestAnimationFrame(titleLoop);

  if (!stars.length) { initStars(); generateNebula(); }
  const dt = 0.016;
  updateStars(dt);

  if (nebulaCanvas) ctx.drawImage(nebulaCanvas, 0, 0);
  else { ctx.fillStyle = '#030510'; ctx.fillRect(0, 0, W, H); }
  drawStars();
}
requestAnimationFrame(titleLoop);
</script>
</body>
</html>
