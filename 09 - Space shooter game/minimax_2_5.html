<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Strike - Space Shooter</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #game-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Styles */
        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .score-display {
            color: #00f3ff;
            font-size: 24px;
            text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
        }

        .score-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .health-bar-container {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #333;
        }

        .health-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ffaa);
            transition: width 0.3s ease, background 0.3s ease;
            box-shadow: 0 0 10px #00ff88;
        }

        .health-bar.warning {
            background: linear-gradient(90deg, #ffaa00, #ff8800);
            box-shadow: 0 0 10px #ff8800;
        }

        .health-bar.danger {
            background: linear-gradient(90deg, #ff0044, #ff0066);
            box-shadow: 0 0 10px #ff0066;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Start Screen */
        #start-screen, #game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .game-title {
            font-size: 64px;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 20px #00f3ff, 0 0 40px #00f3ff, 0 0 60px #0066ff;
            margin-bottom: 20px;
            letter-spacing: 8px;
        }

        .game-subtitle {
            font-size: 18px;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-bottom: 40px;
            letter-spacing: 4px;
        }

        .instructions {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            text-align: center;
            line-height: 2;
        }

        .instructions span {
            color: #00f3ff;
            font-weight: 700;
        }

        .start-btn {
            padding: 20px 60px;
            font-size: 24px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            background: linear-gradient(180deg, #00f3ff, #0066ff);
            border: none;
            border-radius: 50px;
            color: #000;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 20px #00f3ff, 0 0 40px rgba(0, 243, 255, 0.3);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px #00f3ff, 0 0 60px rgba(0, 243, 255, 0.5);
        }

        .final-score {
            font-size: 48px;
            color: #ff0055;
            text-shadow: 0 0 20px #ff0055;
            margin: 20px 0;
        }

        .hidden {
            display: none !important;
        }

        /* Wave indicator */
        .wave-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            color: #fff;
            text-shadow: 0 0 30px #fff;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .wave-indicator.show {
            opacity: 1;
            animation: wavePulse 1s ease-out;
        }

        @keyframes wavePulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-svg"></div>
    </div>

    <!-- HUD -->
    <div class="hud" id="hud">
        <div class="score-display">
            <div class="score-label">SCORE</div>
            <div id="score">0</div>
        </div>
        <div>
            <div class="score-label" style="text-align: right;">SHIELDS</div>
            <div class="health-bar-container">
                <div class="health-bar" id="health-bar"></div>
            </div>
        </div>
    </div>

    <!-- Wave Indicator -->
    <div class="wave-indicator" id="wave-indicator">WAVE 1</div>

    <!-- Start Screen -->
    <div id="start-screen">
        <div class="game-title">NEBULA STRIKE</div>
        <div class="game-subtitle">VOID DEFENDER</div>
        <div class="instructions">
            <span>WASD</span> or <span>ARROW KEYS</span> to move<br>
            <span>SPACE</span> or <span>CLICK</span> to fire<br>
            <span>SHIFT</span> to boost speed
        </div>
        <button class="start-btn" onclick="startGame()">LAUNCH</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
        <div class="game-title" style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">GAME OVER</div>
        <div class="final-score" id="final-score">0</div>
        <div class="instructions">
            You defended the nebula bravely!
        </div>
        <button class="start-btn" onclick="restartGame()">RETRY</button>
    </div>

    <script>
        // ============================================
        // NEBULA STRIKE - SPACE SHOOTER GAME
        // Built with SVG.js
        // ============================================

        // Game Configuration
        const CONFIG = {
            width: window.innerWidth,
            height: window.innerHeight,
            playerSpeed: 8,
            boostMultiplier: 1.8,
            bulletSpeed: 15,
            fireRate: 150,
            asteroidSpeed: 3,
            enemySpeed: 4,
            maxHealth: 100,
            startingHealth: 100
        };

        // Game State
        let game = {
            running: false,
            score: 0,
            health: CONFIG.startingHealth,
            wave: 1,
            lastFire: 0,
            keys: {},
            player: null,
            bullets: [],
            enemies: [],
            asteroids: [],
            particles: [],
            stars: [],
            screenShake: 0,
            enemySpawnTimer: 0,
            asteroidSpawnTimer: 0,
            difficulty: 1
        };

        // SVG Containers
        let draw;
        let gameGroup, starsGroup, entitiesGroup, particlesGroup, uiGroup;

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            // Create SVG canvas
            draw = SVG().addTo('#game-svg').size('100%', '100%');

            // Create groups for layering
            starsGroup = draw.group();
            entitiesGroup = draw.group();
            particlesGroup = draw.group();
            gameGroup = draw.group();

            // Generate starfield
            generateStarfield();

            // Handle window resize
            window.addEventListener('resize', handleResize);
            window.addEventListener('keydown', (e) => game.keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => game.keys[e.key.toLowerCase()] = false);
            window.addEventListener('mousedown', () => game.keys['mouse'] = true);
            window.addEventListener('mouseup', () => game.keys['mouse'] = false);
        }

        function handleResize() {
            CONFIG.width = window.innerWidth;
            CONFIG.height = window.innerHeight;
        }

        // ============================================
        // STARFIELD
        // ============================================

        function generateStarfield() {
            starsGroup.clear();
            game.stars = [];

            for (let i = 0; i < 200; i++) {
                const star = {
                    x: Math.random() * CONFIG.width,
                    y: Math.random() * CONFIG.height,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    brightness: Math.random() * 0.5 + 0.3
                };

                const circle = starsGroup.circle(star.size * 2)
                    .fill(`rgba(255, 255, 255, ${star.brightness})`)
                    .center(star.x, star.y);

                star.element = circle;
                game.stars.push(star);
            }
        }

        function updateStars() {
            game.stars.forEach(star => {
                star.y += star.speed;
                if (star.y > CONFIG.height) {
                    star.y = 0;
                    star.x = Math.random() * CONFIG.width;
                }
                star.element.center(star.x, star.y);
            });
        }

        // ============================================
        // PLAYER SHIP
        // ============================================

        function createPlayer() {
            const playerGroup = entitiesGroup.group();
            const x = CONFIG.width / 2;
            const y = CONFIG.height - 100;

            // Ship body - main hull
            playerGroup.polygon('0,-30 20,25 0,15 -20,25')
                .fill('#00f3ff')
                .stroke({ color: '#0066ff', width: 2 });

            // Cockpit
            playerGroup.ellipse(16, 20)
                .fill('#003366')
                .center(0, -5);

            // Engine glow
            const engineGlow = playerGroup.ellipse(20, 30)
                .fill('#00f3ff')
                .opacity(0.5)
                .center(0, 25);

            // Engine core
            playerGroup.circle(8)
                .fill('#fff')
                .center(0, 22);

            // Wing details
            playerGroup.line(-15, 10, -25, 20).stroke({ color: '#00f3ff', width: 2 });
            playerGroup.line(15, 10, 25, 20).stroke({ color: '#00f3ff', width: 2 });

            playerGroup.transform({ translateX: x, translateY: y });

            game.player = {
                x: x,
                y: y,
                element: playerGroup,
                engineGlow: engineGlow,
                width: 40,
                height: 55
            };
        }

        function updatePlayer() {
            if (!game.player) return;

            const p = game.player;
            const speed = game.keys['shift'] ? CONFIG.playerSpeed * CONFIG.boostMultiplier : CONFIG.playerSpeed;

            // Movement
            if (game.keys['w'] || game.keys['arrowup']) p.y -= speed;
            if (game.keys['s'] || game.keys['arrowdown']) p.y += speed;
            if (game.keys['a'] || game.keys['arrowleft']) p.x -= speed;
            if (game.keys['d'] || game.keys['arrowright']) p.x += speed;

            // Clamp to screen
            p.x = Math.max(30, Math.min(CONFIG.width - 30, p.x));
            p.y = Math.max(50, Math.min(CONFIG.height - 50, p.y));

            // Update position
            p.element.transform({ translateX: p.x, translateY: p.y });

            // Engine pulse
            const pulse = Math.sin(Date.now() / 50) * 0.2 + 0.5;
            p.engineGlow.opacity(pulse);

            // Spawn engine particles
            if (Math.random() < 0.3) {
                spawnEngineParticle(p.x, p.y + 25);
            }

            // Auto-fire
            if (game.keys[' '] || game.keys['mouse']) {
                const now = Date.now();
                if (now - game.lastFire > CONFIG.fireRate) {
                    fireBullet();
                    game.lastFire = now;
                }
            }
        }

        // ============================================
        // BULLETS
        // ============================================

        function fireBullet() {
            if (!game.player) return;

            const bulletGroup = entitiesGroup.group();
            const x = game.player.x;
            const y = game.player.y - 30;

            // Bullet trail
            bulletGroup.rect(4, 20)
                .fill('#ffff00')
                .center(0, 0);

            // Bullet glow
            bulletGroup.rect(8, 24)
                .fill('rgba(255, 255, 0, 0.3)')
                .center(0, 0);

            bulletGroup.transform({ translateX: x, translateY: y });

            game.bullets.push({
                x: x,
                y: y,
                element: bulletGroup,
                width: 8,
                height: 24
            });
        }

        function updateBullets() {
            game.bullets = game.bullets.filter(bullet => {
                bullet.y -= CONFIG.bulletSpeed;
                bullet.element.transform({ translateX: bullet.x, translateY: bullet.y });

                // Remove if off screen
                if (bullet.y < -50) {
                    bullet.element.remove();
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // ASTEROIDS
        // ============================================

        function spawnAsteroid() {
            const asteroidGroup = entitiesGroup.group();
            const x = Math.random() * (CONFIG.width - 100) + 50;
            const y = -50;
            const size = Math.random() * 40 + 30;

            // Irregular asteroid shape
            const points = [];
            const numPoints = 8;
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const radius = size * (0.7 + Math.random() * 0.3);
                points.push(`${Math.cos(angle) * radius},${Math.sin(angle) * radius}`);
            }

            asteroidGroup.polygon(points.join(' '))
                .fill('#64748b')
                .stroke({ color: '#475569', width: 2 });

            // Crater detail
            asteroidGroup.circle(size * 0.3)
                .fill('#475569')
                .center(-size * 0.2, -size * 0.2)
                .opacity(0.5);

            asteroidGroup.transform({ translateX: x, translateY: y });

            game.asteroids.push({
                x: x,
                y: y,
                size: size,
                speed: CONFIG.asteroidSpeed * (0.8 + Math.random() * 0.4),
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 4,
                element: asteroidGroup
            });
        }

        function updateAsteroids() {
            game.asteroids = game.asteroids.filter(asteroid => {
                asteroid.y += asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
                asteroid.element.transform({
                    translateX: asteroid.x,
                    translateY: asteroid.y,
                    rotate: asteroid.rotation
                });

                // Remove if off screen
                if (asteroid.y > CONFIG.height + 100) {
                    asteroid.element.remove();
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // ENEMIES
        // ============================================

        function spawnEnemy() {
            const enemyGroup = entitiesGroup.group();
            const x = Math.random() * (CONFIG.width - 100) + 50;
            const y = -40;
            const type = Math.random() < 0.3 ? 'shooter' : 'kamikaze';

            if (type === 'kamikaze') {
                // Kamikaze ship - spiky
                enemyGroup.polygon('0,25 -15,-15 -5,-5 0,-20 5,-5 15,-15')
                    .fill('#ff0055')
                    .stroke({ color: '#aa0033', width: 2 });

                // Engine
                enemyGroup.polygon('-8,20 0,35 8,20')
                    .fill('#ff4400')
                    .opacity(0.8);
            } else {
                // Shooter ship - wider
                enemyGroup.polygon('0,-20 -20,15 -10,20 0,10 10,20 20,15')
                    .fill('#39ff14')
                    .stroke({ color: '#228800', width: 2 });

                // Guns
                enemyGroup.circle(5).fill('#ffff00').center(-8, 5);
                enemyGroup.circle(5).fill('#ffff00').center(8, 5);
            }

            enemyGroup.transform({ translateX: x, translateY: y });

            game.enemies.push({
                x: x,
                y: y,
                type: type,
                health: type === 'kamikaze' ? 1 : 2,
                speed: CONFIG.enemySpeed * (0.7 + Math.random() * 0.6),
                element: enemyGroup,
                width: 40,
                height: 45,
                shootTimer: 0
            });
        }

        function updateEnemies() {
            game.enemies = game.enemies.filter(enemy => {
                if (enemy.type === 'kamikaze') {
                    // Move toward player
                    const dx = game.player ? (game.player.x - enemy.x) * 0.01 : 0;
                    enemy.x += dx;
                    enemy.y += enemy.speed;
                } else {
                    // Hover and shoot
                    enemy.y += enemy.speed * 0.3;
                    enemy.x += Math.sin(Date.now() / 500 + enemy.y * 0.01) * 2;

                    enemy.shootTimer++;
                    if (enemy.shootTimer > 120) {
                        enemy.shootTimer = 0;
                        fireEnemyBullet(enemy.x, enemy.y + 20);
                    }
                }

                enemy.element.transform({ translateX: enemy.x, translateY: enemy.y });

                // Remove if off screen
                if (enemy.y > CONFIG.height + 100) {
                    enemy.element.remove();
                    return false;
                }
                return true;
            });
        }

        function fireEnemyBullet(x, y) {
            if (!game.player) return;

            const bulletGroup = entitiesGroup.group();
            const angle = Math.atan2(game.player.y - y, game.player.x - x);
            const speed = 8;

            bulletGroup.circle(10)
                .fill('#ff8800')
                .center(0, 0);

            bulletGroup.transform({ translateX: x, translateY: y, rotate: angle * 180 / Math.PI });

            game.enemyBullets = game.enemyBullets || [];
            game.enemyBullets.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                element: bulletGroup,
                width: 10,
                height: 10
            });
        }

        function updateEnemyBullets() {
            if (!game.enemyBullets) return;

            game.enemyBullets = game.enemyBullets.filter(bullet => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.element.transform({ translateX: bullet.x, translateY: bullet.y });

                if (bullet.x < 0 || bullet.x > CONFIG.width ||
                    bullet.y < 0 || bullet.y > CONFIG.height) {
                    bullet.element.remove();
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // PARTICLES
        // ============================================

        function spawnEngineParticle(x, y) {
            const particle = particlesGroup.circle(Math.random() * 6 + 3)
                .fill(`rgba(0, 243, 255, ${Math.random() * 0.5 + 0.3})`)
                .center(x, y);

            game.particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 2,
                vy: Math.random() * 3 + 2,
                size: Math.random() * 4 + 2,
                life: 1,
                decay: 0.03,
                element: particle,
                type: 'engine'
            });
        }

        function spawnExplosion(x, y, color = '#ff5500', count = 30) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 2;
                const size = Math.random() * 8 + 4;

                const particle = particlesGroup.circle(size)
                    .fill(color)
                    .center(x, y);

                game.particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    size: size,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    element: particle,
                    type: 'explosion'
                });
            }
        }

        function updateParticles() {
            game.particles = game.particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= particle.decay;

                if (particle.type === 'explosion') {
                    particle.vy += 0.1; // Gravity for explosions
                }

                const opacity = Math.max(0, particle.life);
                const scale = particle.life;

                particle.element
                    .center(particle.x, particle.y)
                    .opacity(opacity)
                    .transform({ scale: scale });

                if (particle.life <= 0) {
                    particle.element.remove();
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // COLLISION DETECTION
        // ============================================

        function checkCollisions() {
            // Bullets vs Enemies
            game.bullets.forEach(bullet => {
                game.enemies.forEach(enemy => {
                    if (checkCircleCollision(bullet.x, bullet.y, 10, enemy.x, enemy.y, enemy.width / 2)) {
                        enemy.health--;
                        bullet.element.remove();
                        bullet.y = -100; // Mark for removal

                        spawnExplosion(bullet.x, bullet.y, '#ffff00', 10);

                        if (enemy.health <= 0) {
                            enemy.element.remove();
                            spawnExplosion(enemy.x, enemy.y, '#ff0055', 25);
                            game.score += enemy.type === 'kamikaze' ? 100 : 150;
                            updateScore();
                            enemy.y = CONFIG.height + 100; // Mark for removal
                        }
                    }
                });

                // Bullets vs Asteroids
                game.asteroids.forEach(asteroid => {
                    if (checkCircleCollision(bullet.x, bullet.y, 10, asteroid.x, asteroid.y, asteroid.size / 2)) {
                        bullet.element.remove();
                        bullet.y = -100;
                        spawnExplosion(bullet.x, bullet.y, '#888888', 15);
                    }
                });
            });

            // Player vs Enemies
            if (game.player) {
                game.enemies.forEach(enemy => {
                    if (checkCircleCollision(game.player.x, game.player.y, 25, enemy.x, enemy.y, enemy.width / 2)) {
                        enemy.element.remove();
                        spawnExplosion(enemy.x, enemy.y, '#ff0055', 20);
                        takeDamage(25);
                        enemy.y = CONFIG.height + 100;
                    }
                });

                // Player vs Asteroids
                game.asteroids.forEach(asteroid => {
                    if (checkCircleCollision(game.player.x, game.player.y, 25, asteroid.x, asteroid.y, asteroid.size / 2)) {
                        asteroid.element.remove();
                        spawnExplosion(asteroid.x, asteroid.y, '#888888', 20);
                        takeDamage(15);
                        asteroid.y = CONFIG.height + 100;
                    }
                });

                // Player vs Enemy Bullets
                if (game.enemyBullets) {
                    game.enemyBullets.forEach(bullet => {
                        if (checkCircleCollision(game.player.x, game.player.y, 25, bullet.x, bullet.y, 8)) {
                            bullet.element.remove();
                            spawnExplosion(bullet.x, bullet.y, '#ff8800', 10);
                            takeDamage(10);
                            bullet.x = -100;
                        }
                    });
                }
            }
        }

        function checkCircleCollision(x1, y1, r1, x2, y2, r2) {
            const dx = x1 - x2;
            const dy = y1 - y2;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < r1 + r2;
        }

        // ============================================
        // GAME LOGIC
        // ============================================

        function takeDamage(amount) {
            game.health -= amount;
            game.screenShake = 15;
            updateHealth();

            if (game.health <= 0) {
                gameOver();
            }
        }

        function updateHealth() {
            const bar = document.getElementById('health-bar');
            const percent = Math.max(0, (game.health / CONFIG.maxHealth) * 100);
            bar.style.width = percent + '%';

            bar.classList.remove('warning', 'danger');
            if (percent < 30) {
                bar.classList.add('danger');
            } else if (percent < 60) {
                bar.classList.add('warning');
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = game.score;
        }

        function showWaveIndicator(wave) {
            const indicator = document.getElementById('wave-indicator');
            indicator.textContent = `WAVE ${wave}`;
            indicator.classList.add('show');
            setTimeout(() => indicator.classList.remove('show'), 2000);
        }

        function gameOver() {
            game.running = false;
            document.getElementById('final-score').textContent = game.score;
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        }

        // ============================================
        // GAME LOOP
        // ============================================

        function gameLoop() {
            if (!game.running) return;

            // Update stars
            updateStars();

            // Update player
            updatePlayer();

            // Update bullets
            updateBullets();

            // Update enemies
