<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Defender - Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
        }

        canvas {
            display: block;
            background: linear-gradient(180deg, #000428 0%, #004e92 100%);
        }

        .ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .score, .health, .wave {
            color: #fff;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            font-weight: bold;
        }

        .health {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
            z-index: 1000;
        }

        .game-over.active {
            display: block;
        }

        .game-over h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(45deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.5);
        }

        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(0, 212, 255, 0.7);
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            text-align: center;
            font-size: 14px;
            opacity: 0.7;
        }

        .powerup-indicator {
            position: fixed;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffff00;
            font-size: 18px;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            display: none;
        }

        .powerup-indicator.active {
            display: block;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="score">SCORE: <span id="score">0</span></div>
        <div class="wave">WAVE: <span id="wave">1</span></div>
        <div class="health">SHIELD: <span id="health">100</span>%</div>
    </div>

    <div class="powerup-indicator" id="powerupIndicator">RAPID FIRE ACTIVE!</div>

    <div class="game-over" id="gameOver">
        <h1>GAME OVER</h1>
        <p style="font-size: 24px; margin-bottom: 10px;">Final Score: <span id="finalScore">0</span></p>
        <p style="font-size: 18px; margin-bottom: 30px;">Waves Survived: <span id="finalWave">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <div class="controls">
        <p>⬆️⬇️⬅️➡️ or WASD: Move | SPACE: Fire | SHIFT: Boost</p>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Game state
        let gameActive = true;
        let score = 0;
        let wave = 1;
        let waveEnemyCount = 5;
        let powerupActive = false;
        let powerupTimer = 0;

        // Player ship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 50,
            height: 50,
            speed: 5,
            health: 100,
            maxHealth: 100,
            fireRate: 5,
            fireCounter: 0,
            boosting: false
        };

        // Input handling
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key === ' ') e.preventDefault();
        });
        
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // Game objects arrays
        const lasers = [];
        const enemies = [];
        const asteroids = [];
        const particles = [];
        const stars = [];
        const powerups = [];
        const enemyLasers = [];

        // Initialize stars for background
        for (let i = 0; i < 200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 0.5,
                opacity: Math.random() * 0.8 + 0.2
            });
        }

        // Particle class for explosions
        class Particle {
            constructor(x, y, color, velocity, size = 3) {
                this.x = x;
                this.y = y;
                this.vx = velocity.x + (Math.random() - 0.5) * 4;
                this.vy = velocity.y + (Math.random() - 0.5) * 4;
                this.color = color;
                this.alpha = 1;
                this.decay = 0.015;
                this.size = size;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                this.vx *= 0.98;
                this.vy *= 0.98;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // Create explosion effect
        function createExplosion(x, y, color = '#ff6600', particleCount = 30) {
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = {
                    x: Math.cos(angle) * (Math.random() * 6 + 2),
                    y: Math.sin(angle) * (Math.random() * 6 + 2)
                };
                particles.push(new Particle(x, y, color, velocity, Math.random() * 4 + 2));
            }

            // Add some bright center particles
            for (let i = 0; i < 10; i++) {
                particles.push(new Particle(x, y, '#ffffff', {
                    x: (Math.random() - 0.5) * 3,
                    y: (Math.random() - 0.5) * 3
                }, Math.random() * 2 + 1));
            }
        }

        // Create smaller hit effect
        function createHitEffect(x, y, color = '#00ff00') {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const velocity = {
                    x: Math.cos(angle) * Math.random() * 3,
                    y: Math.sin(angle) * Math.random() * 3
                };
                particles.push(new Particle(x, y, color, velocity, 2));
            }
        }

        // Draw player ship
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Ship body - triangle
            ctx.fillStyle = '#00d4ff';
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ffff';
            
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(-20, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(20, 20);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Cockpit
            ctx.fillStyle = '#003366';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();

            // Engine thrust
            if (player.boosting) {
                ctx.fillStyle = '#ff6600';
                ctx.shadowColor = '#ff6600';
                ctx.beginPath();
                ctx.moveTo(-10, 20);
                ctx.lineTo(-5, 20 + Math.random() * 20 + 10);
                ctx.lineTo(0, 25);
                ctx.lineTo(5, 20 + Math.random() * 20 + 10);
                ctx.lineTo(10, 20);
                ctx.closePath();
                ctx.fill();
            }

            // Shield effect when damaged
            if (player.health < player.maxHealth) {
                ctx.strokeStyle = `rgba(255, 0, 0, ${0.5 * (player.health / player.maxHealth)})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 35, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // Create laser
        function fireLaser() {
            if (player.fireCounter <= 0) {
                lasers.push({
                    x: player.x,
                    y: player.y - 20,
                    width: 4,
                    height: 20,
                    speed: 15,
                    damage: 25
                });
                
                player.fireCounter = powerupActive ? 2 : player.fireRate;
                
                // Muzzle flash effect
                createHitEffect(player.x, player.y - 20, '#00ffff');
            }
        }

        // Create enemy
        function spawnEnemy() {
            const types = ['basic', 'fighter', 'bomber'];
            const type = types[Math.floor(Math.random() * Math.min(types.length, wave))];
            
            let enemy = {
                x: Math.random() * (canvas.width - 50) + 25,
                y: -50,
                width: 40,
                height: 40,
                speed: 2 + Math.random() * 2,
                health: 50,
                type: type,
                shootTimer: 0,
                movePattern: Math.random() > 0.5 ? 'straight' : 'zigzag',
                zigzagTimer: 0
            };

            // Adjust properties based on type
            switch(type) {
                case 'fighter':
                    enemy.speed = 4;
                    enemy.health = 75;
                    enemy.width = 35;
                    break;
                case 'bomber':
                    enemy.speed = 1.5;
                    enemy.health = 150;
                    enemy.width = 50;
                    enemy.height = 50;
                    break;
            }

            enemies.push(enemy);
        }

        // Create asteroid
        function spawnAsteroid() {
            asteroids.push({
                x: Math.random() * canvas.width,
                y: -50,
                size: Math.random() * 30 + 20,
                speed: Math.random() * 3 + 1,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1,
                health: 100
            });
        }

        // Create powerup
        function spawnPowerup(x, y) {
            if (Math.random() < 0.3) { // 30% chance to spawn powerup
                powerups.push({
                    x: x,
                    y: y,
                    type: 'rapidfire',
                    size: 20,
                    speed: 2
                });
            }
        }

        // Draw enemies
        function drawEnemies() {
            enemies.forEach(enemy => {
                ctx.save();
                ctx.translate(enemy.x, enemy.y);

                // Different enemy designs based on type
                switch(enemy.type) {
                    case 'basic':
                        ctx.fillStyle = '#ff3366';
                        ctx.strokeStyle = '#ff6666';
                        ctx.beginPath();
                        ctx.moveTo(0, 15);
                        ctx.lineTo(-15, -10);
                        ctx.lineTo(0, -5);
                        ctx.lineTo(15, -10);
                        ctx.closePath();
                        break;
                    case 'fighter':
                        ctx.fillStyle = '#ff9933';
                        ctx.strokeStyle = '#ffcc66';
                        ctx.beginPath();
                        ctx.moveTo(0, 20);
                        ctx.lineTo(-20, -15);
                        ctx.lineTo(0, 0);
                        ctx.lineTo(20, -15);
                        ctx.closePath();
                        break;
                    case 'bomber':
                        ctx.fillStyle = '#cc33ff';
                        ctx.strokeStyle = '#ff66ff';
                        ctx.beginPath();
                        ctx.arc(0, 0, 25, 0, Math.PI * 2);
                        break;
                }

                ctx.lineWidth = 2;
                ctx.shadowBlur = 15;
                ctx.shadowColor = ctx.strokeStyle;
                ctx.fill();
                ctx.stroke();

                // Health bar for tougher enemies
                if (enemy.health < enemy.type === 'basic' ? 50 : (enemy.type === 'fighter' ? 75 : 150)) {
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(-20, -35, 40 * (enemy.health / (enemy.type === 'basic' ? 50 : (enemy.type === 'fighter' ? 75 : 150))), 3);
                }

                ctx.restore();
            });
        }

        // Draw asteroids
        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.rotation);
                
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, asteroid.size);
                gradient.addColorStop(0, '#8b7355');
                gradient.addColorStop(0.5, '#6b5d4f');
                gradient.addColorStop(1, '#4a4035');
                
                ctx.fillStyle = gradient;
                ctx.strokeStyle = '#3a3025';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#000000';
                
                // Irregular asteroid shape
                ctx.beginPath();
                for (let i = 0; i < 8; i++) {
                    const angle = (Math.PI * 2 * i) / 8;
                    const radius = asteroid.size + Math.sin(i * 1.5) * 5;
                    if (i === 0) {
                        ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                    } else {
                        ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
                    }
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                
                ctx.restore();
            });
        }

        // Draw lasers
        function drawLasers() {
            // Player lasers
            lasers.forEach(laser => {
                const gradient = ctx.createLinearGradient(laser.x, laser.y, laser.x, laser.y + laser.height);
                gradient.addColorStop(0, '#00ffff');
                gradient.addColorStop(0.5, '#00d4ff');
                gradient.addColorStop(1, '#0099ff');
                
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.fillRect(laser.x - laser.width/2, laser.y, laser.width, laser.height);
            });

            // Enemy lasers
            enemyLasers.forEach(laser => {
                const gradient = ctx.createLinearGradient(laser.x, laser.y, laser.x, laser.y + laser.height);
                gradient.addColorStop(0, '#ff0000');
                gradient.addColorStop(0.5, '#ff3366');
                gradient.addColorStop(1, '#ff6666');
                
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff0000';
                ctx.fillRect(laser.x - laser.width/2, laser.y, laser.width, laser.height);
            });
        }

        // Draw powerups
        function drawPowerups() {
            powerups.forEach(powerup => {
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                ctx.rotate(Date.now() * 0.003);
                
                // Glowing powerup
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, powerup.size);
                gradient.addColorStop(0, '#ffff00');
                gradient.addColorStop(0.5, '#ffcc00');
                gradient.addColorStop(1, 'rgba(255, 204, 0, 0.3)');
                
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#ffff00';
                
                // Star shape
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                    const innerAngle = angle + Math.PI / 5;
                    const outerRadius = powerup.size;
                    const innerRadius = powerup.size * 0.5;
                    
                    if (i === 0) {
                        ctx.moveTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
                    } else {
                        ctx.lineTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
                    }
                    ctx.lineTo(Math.cos(innerAngle) * innerRadius, Math.sin(innerAngle) * innerRadius);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            });
        }

        // Update game objects
        function update() {
            if (!gameActive) return;

            // Update stars
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });

            // Player movement
            const speed = keys['shift'] ? player.speed * 1.5 : player.speed;
            player.boosting = keys['shift'];
            
            if ((keys['arrowleft'] || keys['a']) && player.x > 25) {
                player.x -= speed;
            }
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 25) {
                player.x += speed;
            }
            if ((keys['arrowup'] || keys['w']) && player.y > 50) {
                player.y -= speed;
            }
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 50) {
                player.y += speed;
            }

            // Firing
            if (keys[' ']) {
                fireLaser();
            }
            player.fireCounter--;

            // Update powerup timer
            if (powerupActive) {
                powerupTimer--;
                if (powerupTimer <= 0) {
                    powerupActive = false;
                    document.getElementById('powerupIndicator').classList.remove('active');
                }
            }

            // Update lasers
            lasers.forEach((laser, index) => {
                laser.y -= laser.speed;
                if (laser.y < 0) {
                    lasers.splice(index, 1);
                }
            });

            // Update enemy lasers
            enemyLasers.forEach((laser, index) => {
                laser.y += laser.speed;
                if (laser.y > canvas.height) {
                    enemyLasers.splice(index, 1);
                }
            });

            // Update enemies
            enemies.forEach((enemy, enemyIndex) => {
                // Movement patterns
                if (enemy.movePattern === 'zigzag') {
                    enemy.zigzagTimer += 0.1;
                    enemy.x += Math.sin(enemy.zigzagTimer) * 2;
                }
                
                enemy.y += enemy.speed;

                // Enemy shooting
                enemy.shootTimer++;
                if (enemy.shootTimer > 60 && enemy.y > 0) {
                    enemy.shootTimer = 0;
                    if (Math.random() < 0.3) {
                        enemyLasers.push({
                            x: enemy.x,
                            y: enemy.y + 20,
                            width: 3,
                            height: 15,
                            speed: 5
                        });
                    }
                }

                // Remove off-screen enemies
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(enemyIndex, 1);
                }

                // Check collision with player
                if (Math.abs(enemy.x - player.x) < 30 && Math.abs(enemy.y - player.y) < 30) {
                    player.health -= 20;
                    createExplosion(enemy.x, enemy.y, '#ff3366');
                    enemies.splice(enemyIndex, 1);
                    updateHealth();
                }
            });

            // Update asteroids
            asteroids.forEach((asteroid, index) => {
                asteroid.y += asteroid.speed;
                asteroid.rotation += asteroid.rotationSpeed;
                
                if (asteroid.y > canvas.height + asteroid.size) {
                    asteroids.splice(index, 1);
                }

                // Check collision with player
                const dist = Math.hypot(asteroid.x - player.x, asteroid.y - player.y);
                if (dist < asteroid.size + 20) {
                    player.health -= 10;
                    createExplosion(asteroid.x, asteroid.y, '#8b7355');
                    asteroids.splice(index, 1);
                    updateHealth();
                }
            });

            // Update powerups
            powerups.forEach((powerup, index) => {
                powerup.y += powerup.speed;
                
                if (powerup.y > canvas.height) {
                    powerups.splice(index, 1);
                }

                // Check collection
                const dist = Math.hypot(powerup.x - player.x, powerup.y - player.y);
                if (dist < powerup.size + 20) {
                    powerupActive = true;
                    powerupTimer = 300; // 5 seconds at 60fps
                    document.getElementById('powerupIndicator').classList.add('active');
                    createHitEffect(powerup.x, powerup.y, '#ffff00');
                    powerups.splice(index, 1);
                }
            });

            // Check collisions
            lasers.forEach((laser, laserIndex) => {
                // Laser vs enemies
                enemies.forEach((enemy, enemyIndex) => {
                    if (Math.abs(laser.x - enemy.x) < enemy.width/2 && 
                        Math.abs(laser.y - enemy.y) < enemy.height/2) {
                        enemy.health -= laser.damage;
                        createHitEffect(laser.x, laser.y);
                        lasers.splice(laserIndex, 1);
                        
                        if (enemy.health <= 0) {
                            createExplosion(enemy.x, enemy.y, '#ff6600');
                            score += enemy.type === 'bomber' ? 150 : (enemy.type === 'fighter' ? 100 : 50);
                            updateScore();
                            spawnPowerup(enemy.x, enemy.y);
                            enemies.splice(enemyIndex, 1);
                        }
                    }
                });

                // Laser vs asteroids
                asteroids.forEach((asteroid, asteroidIndex) => {
                    const dist = Math.hypot(laser.x - asteroid.x, laser.y - asteroid.y);
                    if (dist < asteroid.size) {
                        asteroid.health -= laser.damage;
                        createHitEffect(laser.x, laser.y);
                        lasers.splice(laserIndex, 1);
                        
                        if (asteroid.health <= 0) {
                            createExplosion(asteroid.x, asteroid.y, '#8b7355');
                            score += 25;
                            updateScore();
                            asteroids.splice(asteroidIndex, 1);
                        }
                    }
                });
            });

            // Enemy laser vs player
            enemyLasers.forEach((laser, index) => {
                if (Math.abs(laser.x - player.x) < 25 && 
                    Math.abs(laser.y - player.y) < 25) {
                    player.health -= 10;
                    createHitEffect(player.x, player.y, '#ff0000');
                    enemyLasers.splice(index, 1);
                    updateHealth();
                }
            });

            // Update particles
            particles.forEach((particle, index) => {
                particle.update();
                if (particle.alpha <= 0 || particle.size <= 0.1) {
                    particles.splice(index, 1);
                }
            });

            // Spawn new enemies
            if (Math.random() < 0.02 + wave * 0.005) {
                spawnEnemy();
            }

            // Spawn asteroids
            if (Math.random() < 0.01) {
                spawnAsteroid();
            }

            // Check wave completion
            if (enemies.length === 0 && wave % 5 === 0) {
                wave++;
                waveEnemyCount += 2;
                document.getElementById('wave').textContent = wave;
                
                // Spawn wave enemies
                for (let i = 0; i < waveEnemyCount; i++) {
                    setTimeout(() => spawnEnemy(), i * 500);
                }
            }

            // Check game over
            if (player.health <= 0) {
                gameOver();
            }
        }

        // Draw everything
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(0, 4, 40, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw stars
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // Draw all game objects
            drawPowerups();
            drawAsteroids();
            drawEnemies();
            drawLasers();
            drawPlayer();

            // Draw particles on top
            particles.forEach(particle => {
                particle.draw();
            });
        }

        // Game loop
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Update UI
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        function updateHealth() {
            const healthPercent = Math.max(0, player.health);
            document.getElementById('health').textContent = healthPercent;
            
            if (player.health <= 30) {
                document.querySelector('.health').style.color = '#ff0000';
                document.querySelector('.health').style.textShadow = '0 0 20px rgba(255, 0, 0, 0.8)';
            }
        }

        // Game over
        function gameOver() {
            gameActive = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalWave').textContent = wave;
            document.getElementById('gameOver').classList.add('active');
            
            // Create massive explosion
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    createExplosion(
                        player.x + (Math.random() - 0.5) * 50,
                        player.y + (Math.random() - 0.5) * 50,
                        ['#ff0000', '#ff6600', '#ffff00'][i % 3],
                        50
                    );
                }, i * 100);
            }
        }

        // Restart game
        function restartGame() {
            gameActive = true;
            score = 0;
            wave = 1;
            player.health = player.maxHealth;
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            
            // Clear arrays
            lasers.length = 0;
            enemies.length = 0;
            asteroids.length = 0;
            particles.length = 0;
            powerups.length = 0;
            enemyLasers.length = 0;
            
            // Reset UI
            updateScore();
            updateHealth();
            document.getElementById('wave').textContent = wave;
            document.getElementById('gameOver').classList.remove('active');
            document.querySelector('.health').style.color = '#ff3333';
            
            // Spawn initial enemies
            for (let i = 0; i < waveEnemyCount; i++) {
                setTimeout(() => spawnEnemy(), i * 500);
            }
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start game
        updateScore();
        updateHealth();

        // Spawn initial enemies
        for (let i = 0; i < waveEnemyCount; i++) {
            setTimeout(() => spawnEnemy(), i * 500);
        }

        gameLoop();
    </script>
</body>
</html>
