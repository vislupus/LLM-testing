<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA RAIDERS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; background:#000; overflow:hidden; font-family:'Press Start 2P', system-ui; color:#0ff; }
        canvas { display:block; margin:0 auto; image-rendering:pixelated; }
        #ui {
            position:absolute; top:20px; left:0; right:0; text-align:center; pointer-events:none;
            text-shadow:0 0 10px #0ff;
        }
        #gameOver, #startScreen {
            position:absolute; inset:0; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center; flex-direction:column; color:#0ff;
        }
        button {
            background:#0ff; color:#000; border:none; padding:15px 40px; margin-top:30px; font-family:inherit; font-size:18px; cursor:pointer;
            box-shadow:0 0 20px #0ff;
        }
    </style>
</head>
<body>
    <canvas id="c" width="800" height="600"></canvas>
    
    <div id="ui">
        <div style="font-size:22px;letter-spacing:4px;">SCORE <span id="score">000000</span></div>
        <div style="position:absolute;right:40px;top:20px;font-size:18px;">LIVES <span id="lives">❤️❤️❤️</span></div>
    </div>

    <div id="startScreen">
        <div style="font-size:52px;margin-bottom:20px;color:#0f0;text-shadow:0 0 30px #0f0;">NEBULA RAIDERS</div>
        <div style="font-size:18px;margin-bottom:40px;">Pilot your starfighter through asteroid storms and destroy the Xorathian fleet!</div>
        <button onclick="startGame()">LAUNCH MISSION</button>
        <div style="margin-top:60px;font-size:14px;">← → MOVE&nbsp;&nbsp;&nbsp;SPACE FIRE</div>
    </div>

    <div id="gameOver" class="hidden">
        <div style="font-size:42px;margin-bottom:10px;color:#f33;">MISSION FAILED</div>
        <div id="finalScore" style="font-size:24px;margin-bottom:40px;"></div>
        <button onclick="restartGame()">RESTART MISSION</button>
    </div>

    <script>
        // ================================================
        // NEBULA RAIDERS - Standalone Space Shooter
        // Pure Canvas 2D • Procedural visuals • Particle explosions
        // Public domain style - no external files needed
        // ================================================

        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        
        let player = { x: 400, y: 520, w: 38, h: 48, speed: 7 };
        let bullets = [];
        let asteroids = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let keys = {};
        let lastShot = 0;
        let shake = 0;
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Create background stars
        function createStars() {
            stars = [];
            for (let i = 0; i < 280; i++) {
                stars.push({
                    x: Math.random() * 800,
                    y: Math.random() * 600,
                    size: Math.random() * 2.5 + 0.8,
                    speed: Math.random() * 1.8 + 0.6
                });
            }
        }

        // Particle explosion
        function createExplosion(x, y, intensity = 1, color = '#ff0') {
            shake = 8;
            for (let i = 0; i < 55 * intensity; i++) {
                const angle = Math.random() * Math.PI * 2;
                const vel = Math.random() * 7 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * vel,
                    vy: Math.sin(angle) * vel,
                    life: 38 + Math.random() * 22,
                    maxLife: 38 + Math.random() * 22,
                    size: Math.random() * 5 + 2,
                    color: color
                });
            }
            // Debris chunks
            for (let i = 0; i < 12; i++) {
                const angle = Math.random() * Math.PI * 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * (Math.random() * 4 + 3),
                    vy: Math.sin(angle) * (Math.random() * 4 + 3),
                    life: 55,
                    maxLife: 55,
                    size: Math.random() * 7 + 4,
                    color: '#ccc'
                });
            }
            playSound(80, 0.4, 'sawtooth'); // boom
        }

        // Simple laser sound
        function playLaser() {
            playSound(1200, 0.08, 'sine');
        }

        function playSound(freq, duration, type = 'square') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.value = 0.25;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            setTimeout(() => {
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.02);
                osc.stop(audioCtx.currentTime + 0.05);
            }, duration * 1000);
        }

        function spawnAsteroid() {
            const size = Math.random() * 38 + 24;
            asteroids.push({
                x: Math.random() * 800,
                y: -50,
                vx: (Math.random() - 0.5) * 2.2,
                vy: Math.random() * 3.5 + 2.5,
                size: size,
                angle: 0,
                rot: (Math.random() - 0.5) * 0.08,
                points: []
            });
            // Generate irregular shape
            const ast = asteroids[asteroids.length - 1];
            for (let i = 0; i < 9; i++) {
                const a = i * Math.PI * 2 / 9;
                const r = size * (0.75 + Math.random() * 0.5);
                ast.points.push({x: Math.cos(a) * r, y: Math.sin(a) * r});
            }
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * 700 + 50,
                y: -60,
                vx: (Math.random() - 0.5) * 1.8,
                vy: 2.8,
                w: 52,
                h: 38,
                pulse: 0
            });
        }

        function update() {
            if (!gameRunning) return;

            // Player movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['w'] || keys['W']) player.y -= player.speed * 0.7;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) player.y += player.speed * 0.7;

            player.x = Math.max(30, Math.min(770, player.x));
            player.y = Math.max(80, Math.min(550, player.y));

            // Shooting
            if (keys[' '] && Date.now() - lastShot > 180) {
                bullets.push({ x: player.x, y: player.y - 20, vy: -14 });
                playLaser();
                lastShot = Date.now();
            }

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y += bullets[i].vy;
                if (bullets[i].y < -20) bullets.splice(i, 1);
            }

            // Update asteroids
            for (let i = asteroids.length - 1; i >= 0; i--) {
                const a = asteroids[i];
                a.x += a.vx;
                a.y += a.vy;
                a.angle += a.rot;
                if (a.y > 650) asteroids.splice(i, 1);
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                e.x += e.vx;
                e.y += e.vy;
                e.pulse = Math.sin(Date.now() / 120) * 3;
                if (e.y > 620) enemies.splice(i, 1);
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                p.vx *= 0.98;
                p.vy *= 0.98;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Spawn
            if (Math.random() < 0.028) spawnAsteroid();
            if (Math.random() < 0.016) spawnEnemy();

            // Collisions
            // Bullets vs asteroids
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = asteroids.length - 1; j >= 0; j--) {
                    const a = asteroids[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    if (dx*dx + dy*dy < a.size * a.size) {
                        createExplosion(a.x, a.y, 0.7, '#ffaa00');
                        score += 120;
                        asteroids.splice(j, 1);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Bullets vs enemies
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (b.x > e.x - 30 && b.x < e.x + 30 && b.y > e.y - 25 && b.y < e.y + 25) {
                        createExplosion(e.x, e.y, 1.4, '#0ff');
                        score += 380;
                        enemies.splice(j, 1);
                        bullets.splice(i, 1);
                        break;
                    }
                }
            }

            // Player vs asteroids / enemies
            for (let a of asteroids) {
                const dx = player.x - a.x;
                const dy = player.y - a.y;
                if (dx*dx + dy*dy < (a.size + 22) ** 2) {
                    hitPlayer();
                    return;
                }
            }
            for (let e of enemies) {
                if (Math.abs(player.x - e.x) < 38 && Math.abs(player.y - e.y) < 38) {
                    hitPlayer();
                    return;
                }
            }

            // Update HUD
            document.getElementById('score').textContent = score.toString().padStart(6, '0');
            document.getElementById('lives').textContent = '❤️'.repeat(lives);
        }

        function hitPlayer() {
            createExplosion(player.x, player.y, 2.2, '#f33');
            lives--;
            if (lives <= 0) {
                gameRunning = false;
                document.getElementById('gameOver').classList.remove('hidden');
                document.getElementById('finalScore').innerHTML = `FINAL SCORE<br><span style="font-size:42px;color:#ff0">${score}</span>`;
            } else {
                player.x = 400;
                player.y = 520;
                shake = 12;
            }
        }

        function draw() {
            ctx.fillStyle = '#05020f';
            ctx.fillRect(0, 0, 800, 600);

            // Stars
            ctx.fillStyle = '#fff';
            for (let s of stars) {
                ctx.globalAlpha = s.speed / 3;
                ctx.fillRect(s.x, s.y, s.size, s.size);
                s.y += s.speed;
                if (s.y > 600) s.y = 0;
            }
            ctx.globalAlpha = 1;

            // Asteroids
            ctx.shadowBlur = 12;
            ctx.shadowColor = '#aaa';
            for (let a of asteroids) {
                ctx.save();
                ctx.translate(a.x, a.y);
                ctx.rotate(a.angle);
                ctx.fillStyle = '#777';
                ctx.strokeStyle = '#bbb';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.moveTo(a.points[0].x, a.points[0].y);
                for (let i = 1; i < a.points.length; i++) {
                    ctx.lineTo(a.points[i].x, a.points[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
            ctx.shadowBlur = 0;

            // Enemies (Xorathian saucers)
            for (let e of enemies) {
                ctx.shadowBlur = 25;
                ctx.shadowColor = '#f0f';
                ctx.fillStyle = '#c026d3';
                ctx.beginPath();
                ctx.ellipse(e.x, e.y + e.pulse, 32, 14, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#67e8f9';
                ctx.beginPath();
                ctx.ellipse(e.x, e.y - 6, 18, 9, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Bullets (neon lasers)
            ctx.shadowBlur = 30;
            ctx.shadowColor = '#0ff';
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 5;
            for (let b of bullets) {
                ctx.beginPath();
                ctx.moveTo(b.x - 2, b.y);
                ctx.lineTo(b.x + 2, b.y - 22);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            // Player ship
            ctx.shadowBlur = 25;
            ctx.shadowColor = '#0ff';
            ctx.fillStyle = '#22d3ee';
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 26);
            ctx.lineTo(player.x - 19, player.y + 18);
            ctx.lineTo(player.x + 19, player.y + 18);
            ctx.closePath();
            ctx.fill();
            
            // Cockpit
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(player.x, player.y - 8, 9, 0, Math.PI*2);
            ctx.fill();
            
            // Thruster
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 40;
            ctx.beginPath();
            ctx.moveTo(player.x - 11, player.y + 16);
            ctx.lineTo(player.x + 11, player.y + 16);
            ctx.lineTo(player.x, player.y + 38 + Math.random() * 9);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Particles
            for (let p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha * 0.95;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // Screen shake
            if (shake > 0) {
                canvas.style.transform = `translate(${Math.random()*shake- shake/2}px, ${Math.random()*shake - shake/2}px)`;
                shake *= 0.82;
            } else {
                canvas.style.transform = 'none';
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            gameRunning = true;
            score = 0;
            lives = 3;
            bullets = [];
            asteroids = [];
            enemies = [];
            particles = [];
            player.x = 400;
            player.y = 520;
            document.getElementById('score').textContent = '000000';
            document.getElementById('lives').textContent = '❤️❤️❤️';
        }

        function restartGame() {
            document.getElementById('gameOver').classList.add('hidden');
            startGame();
        }

        // Input
        window.addEventListener('keydown', e => { keys[e.key] = true; });
        window.addEventListener('keyup', e => { keys[e.key] = false; });

        // Init
        function init() {
            createStars();
            gameLoop();
            
            // Spawn initial wave
            for (let i = 0; i < 8; i++) spawnAsteroid();
            setTimeout(() => { if (gameRunning) spawnEnemy(); }, 1200);
        }

        window.onload = init;
    </script>
</body>
</html>
