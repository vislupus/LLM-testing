<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML5 Space Shooter</title>
<style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;}
    canvas{display:block;margin:0 auto;background:#000;}
    #hud{
        position:fixed;top:10px;left:50%;transform:translateX(-50%);
        font-family:Consolas,monospace;font-size:18px;color:#0f0;
        text-shadow:0 0 5px #0f0;
        pointer-events:none;user-select:none;
    }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score 0 | Lives 3</div>

<script>
/*-----------------------------------------------------------
  Simple HTML5 Canvas SPACE SHOOTER
  Controls:  W/A/S/D or arrow keys – move  |  Space – shoot
-----------------------------------------------------------*/
(() => {
"use strict";

const cv   = document.getElementById("game"),
      ctx  = cv.getContext("2d"),
      hud  = document.getElementById("hud"),
      TAU  = Math.PI*2;

let   width = window.innerWidth,
      height= window.innerHeight,
      keys  = {},
      score = 0,
      lives = 3,
      entities = [],
      particles= [],
      lastShot = 0,
      level  = 1,
      spawnTimer = 0,
      running = true;

cv.width  = width;
cv.height = height;

/* ---------- Utility ---------- */
function rand(min,max){ return Math.random()*(max-min)+min }
function angle(x1,y1,x2,y2){ return Math.atan2(y2-y1,x2-x1) }

/* ---------- Classes ---------- */
class Entity{
    constructor(x,y,r,vx=0,vy=0){this.x=x;this.y=y;this.r=r;this.vx=vx;this.vy=vy; this.dead=false;}
    update(dt){ this.x+=this.vx*dt; this.y+=this.vy*dt;
        if(this.x<-this.r) this.x=width+this.r;
        if(this.x>width+this.r) this.x=-this.r;
        if(this.y<-this.r) this.y=height+this.r;
        if(this.y>height+this.r) this.y=-this.r;
    }
    draw(){}
}

class Ship extends Entity{
    constructor(){ super(width/2,height*0.8,14); }
    update(dt){
        const speed=260;
        if(keys["ArrowLeft"]||keys["a"]) this.vx=-speed;
        else if(keys["ArrowRight"]||keys["d"]) this.vx=speed;
        else this.vx=0;
        if(keys["ArrowUp"]||keys["w"]) this.vy=-speed;
        else if(keys["ArrowDown"]||keys["s"]) this.vy=speed;
        else this.vy=0;
        super.update(dt);
        if((keys[" "]||keys["Space"]) && performance.now()-lastShot>250){
            entities.push(new Bullet(this.x,this.y-this.r*1.2));
            lastShot=performance.now();
        }
    }
    draw(){
        ctx.save();
        ctx.translate(this.x,this.y);
        ctx.beginPath();
        ctx.moveTo(0,-this.r);
        ctx.lineTo(this.r*0.8,this.r);
        ctx.lineTo(-this.r*0.8,this.r);
        ctx.closePath();
        ctx.strokeStyle="#0ff";
        ctx.lineWidth=2;
        ctx.stroke();
        ctx.restore();
    }
}

class Bullet extends Entity{
    constructor(x,y){ super(x,y,4,0,-600); }
    update(dt){ super.update(dt); if(this.y<-this.r) this.dead=true; }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,TAU);
        ctx.fillStyle="#ff0";
        ctx.fill();
    }
}

class Asteroid extends Entity{
    constructor(){ 
        const edge = Math.random()<0.5 ? rand(0,width) : (Math.random()<0.5?-20:width+20);
        const top  = edge<width? -20 : rand(0,height);
        const angleToCenter = angle(edge,top,width/2,height/2);
        const speed = rand(40,120);
        super(edge,top,rand(18,40),Math.cos(angleToCenter)*speed,Math.sin(angleToCenter)*speed);
        this.angle = 0; this.spin = rand(-1,1);
        this.sides = ~~rand(7,12);
        this.offsets = Array.from({length:this.sides},()=>rand(0.6,1));
    }
    update(dt){ super.update(dt); this.angle+=this.spin*dt*0.001; }
    draw(){
        ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.angle);
        ctx.beginPath();
        for(let i=0;i<this.sides;i++){
            const a = TAU*i/this.sides;
            const r = this.r*this.offsets[i];
            ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
        }
        ctx.closePath();
        ctx.strokeStyle="#888";
        ctx.stroke(); ctx.restore();
    }
}

class Alien extends Entity{
    constructor(){
        const x = rand(40,width-40);
        const y = -30;
        super(x,y,16,rand(-30,30),rand(60,90));
        this.fireTimer = rand(1,3);
    }
    update(dt){
        super.update(dt);
        this.fireTimer-=dt;
        if(this.fireTimer<=0){
            const b = new EnemyBullet(this.x,this.y+this.r*1.2);
            entities.push(b);
            this.fireTimer=rand(1.2,2.5);
        }
    }
    draw(){
        ctx.save(); ctx.translate(this.x,this.y);
        ctx.beginPath();
        ctx.rect(-this.r,-this.r,this.r*2,this.r*2);
        ctx.strokeStyle="#f0f";
        ctx.stroke();
        ctx.restore();
    }
}

class EnemyBullet extends Entity{
    constructor(x,y){ super(x,y,4,0,280); }
    update(dt){ super.update(dt); if(this.y>height+this.r) this.dead=true; }
    draw(){
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.r,0,TAU);
        ctx.fillStyle="#f88";
        ctx.fill();
    }
}

class Particle{
    constructor(x,y,col,count){
        this.p=Array.from({length:count},()=>({
            x,y,
            vx:rand(-120,120),
            vy:rand(-120,120),
            life:rand(0.6,1)
        }));
        this.col=col;
    }
    update(dt){
        this.p.forEach(o=>{
            o.x+=o.vx*dt;
            o.y+=o.vy*dt;
            o.life-=dt*0.001;
        });
        this.p=this.p.filter(o=>o.life>0);
    }
    draw(){
        ctx.fillStyle=this.col;
        this.p.forEach(o=>{
            ctx.globalAlpha=o.life;
            ctx.fillRect(o.x,o.y,2,2);
        });
        ctx.globalAlpha=1;
    }
    get dead(){return this.p.length===0;}
}

/* ---------- Game Setup ---------- */
const player = new Ship();
entities.push(player);

/* ---------- Collision ---------- */
function collide(a,b){
    const dx=a.x-b.x, dy=a.y-b.y;
    return dx*dx+dy*dy < (a.r+b.r)*(a.r+b.r);
}

/* ---------- Main Loop ---------- */
let last = performance.now();
function loop(now){
    if(!running) return;
    const dt = now-last; last=now;

    ctx.clearRect(0,0,width,height);

    /* Spawn enemies / asteroids */
    spawnTimer -= dt*0.001;
    if(spawnTimer<=0){
        entities.push(new Asteroid());
        if(score>level*300){ entities.push(new Alien()); level++; }
        spawnTimer = 0.5;
    }

    /* Update & draw entities */
    entities.forEach(e=>e.update(dt));
    entities.forEach(e=>e.draw());

    /* Update & draw particles */
    particles.forEach(p=>p.update(dt));
    particles.forEach(p=>p.draw());

    /* Handle collisions */
    for(let i=0;i<entities.length;i++){
        const a=entities[i];
        if(a instanceof Bullet){
            for(let j=0;j<entities.length;j++){
                const b=entities[j];
                if((b instanceof Asteroid||b instanceof Alien) && collide(a,b)){
                    a.dead=b.dead=true;
                    score+= b instanceof Alien ? 150 : 50;
                    particles.push(new Particle(b.x,b.y,"#ff0",30));
                }
            }
        }
        else if(a instanceof Ship){
            for(let j=0;j<entities.length;j++){
                const b=entities[j];
                if(b!==a && !(b instanceof Bullet) && !(b instanceof EnemyBullet) && collide(a,b)){
                    b.dead=true;
                    explodeShip();
                }
                if(b instanceof EnemyBullet && collide(a,b)){
                    b.dead=true;
                    explodeShip();
                }
            }
        }
    }

    /* Remove dead */
    entities = entities.filter(e=>!e.dead);
    particles= particles.filter(p=>!p.dead);

    /* HUD */
    hud.textContent = `Score ${score} | Lives ${lives}`;

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Events ---------- */
window.addEventListener("keydown",e=>{keys[e.key]=true});
window.addEventListener("keyup",e=>{keys[e.key]=false});
window.addEventListener("resize",()=>{
    width = window.innerWidth; height = window.innerHeight;
    cv.width=width; cv.height=height;
});

/* ---------- Helpers ---------- */
function explodeShip(){
    lives--;
    particles.push(new Particle(player.x,player.y,"#0ff",60));
    if(lives<=0){
        running=false;
        hud.textContent = `GAME OVER — Final Score ${score}`;
    }else{
        player.x=width/2; player.y=height*0.8;
    }
}
})();
</script>
</body>
</html>
