<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 Stellar Assault — Space Shooter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',system-ui,sans-serif}
canvas{display:block;cursor:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#hud{position:absolute;top:12px;left:16px;color:#fff;font-size:14px;line-height:1.9;text-shadow:0 0 8px rgba(100,180,255,.6)}
#hud .label{color:#88bbff;font-weight:700}
#hud .val{color:#fff}
#hud .hp{letter-spacing:2px}
#hud .hp-full{color:#4cff4c}
#hud .hp-mid{color:#ffaa00}
#hud .hp-low{color:#ff3333}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,10,.88);z-index:10;transition:opacity .5s}
#menu.hidden{opacity:0;pointer-events:none}
#menu h1{font-size:52px;color:#fff;text-shadow:0 0 30px rgba(100,160,255,.7),0 0 60px rgba(80,120,255,.3);margin-bottom:4px;letter-spacing:3px}
#menu .sub{color:#8899cc;font-size:16px;margin-bottom:30px}
#menu .controls{color:#667799;font-size:13px;line-height:2;margin-bottom:28px;text-align:center}
#menu .controls kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 8px;color:#aabbdd}
#menu button{background:linear-gradient(135deg,#1a5276,#2980b9);color:#fff;border:2px solid rgba(100,180,255,.4);padding:14px 52px;font-size:18px;font-weight:700;border-radius:30px;cursor:pointer;pointer-events:all;letter-spacing:1px;transition:all .2s;box-shadow:0 4px 20px rgba(41,128,185,.4)}
#menu button:hover{transform:scale(1.06);box-shadow:0 6px 30px rgba(41,128,185,.6);background:linear-gradient(135deg,#1a6e8e,#3498db)}
#gameover{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,0,0,.9);z-index:10}
#gameover.show{display:flex}
#gameover h2{font-size:46px;color:#ff4444;text-shadow:0 0 20px rgba(255,0,0,.5);margin-bottom:12px}
#gameover .fs{color:#ffcc00;font-size:22px;margin-bottom:6px}
#gameover .hs{color:#888;font-size:15px;margin-bottom:24px}
#gameover button{background:linear-gradient(135deg,#922,#c44);color:#fff;border:2px solid rgba(255,100,100,.4);padding:12px 46px;font-size:16px;font-weight:700;border-radius:28px;cursor:pointer;pointer-events:all;transition:all .2s}
#gameover button:hover{transform:scale(1.06);box-shadow:0 0 20px rgba(200,50,50,.4)}
#wave-msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:36px;font-weight:700;text-shadow:0 0 20px rgba(100,180,255,.8);opacity:0;transition:opacity .4s;pointer-events:none}
#wave-msg.show{opacity:1}
#minimap{position:absolute;bottom:12px;right:12px;pointer-events:none}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui">
  <div id="hud">
    <div><span class="label">SCORE</span> <span class="val" id="score">0</span></div>
    <div><span class="label">WAVE</span> <span class="val" id="wave">1</span></div>
    <div><span class="label">HULL</span> <span class="val hp" id="hp"></span></div>
    <div><span class="label">COMBO</span> <span class="val" id="combo">×1</span></div>
    <div><span class="label">HIGH</span> <span class="val" id="hiscore">0</span></div>
  </div>
  <div id="wave-msg"></div>
</div>

<div id="menu">
  <h1>🚀 STELLAR ASSAULT</h1>
  <div class="sub">Survive the asteroid fields • Destroy alien invaders</div>
  <div class="controls">
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> — Move<br>
    <kbd>Mouse</kbd> — Aim &nbsp;|&nbsp; <kbd>Left Click</kbd> or <kbd>Space</kbd> — Fire<br>
    <kbd>Shift</kbd> — Boost &nbsp;|&nbsp; <kbd>P</kbd> — Pause
  </div>
  <button onclick="startGame()">BEGIN MISSION</button>
</div>

<div id="gameover">
  <h2>💥 MISSION FAILED</h2>
  <div class="fs">Score: <span id="final-score">0</span></div>
  <div class="hs">High Score: <span id="final-hi">0</span></div>
  <button onclick="restartGame()">RETRY MISSION</button>
</div>

<script>
// ═══════════════════════════════════════════════════
//  STELLAR ASSAULT — Complete Space Shooter
// ═══════════════════════════════════════════════════

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const W = canvas.width  = window.innerWidth;
const H = canvas.height = window.innerHeight;

// ── Game Constants ──
const SHIP_SIZE      = 22;
const BULLET_SPEED   = 12;
const BULLET_LIFE    = 80;
const FIRE_RATE      = 6;       // frames between shots
const MAX_PARTICLES  = 600;
const ASTEROID_MIN   = 16;
const ASTEROID_MAX   = 52;
const ALIEN_SIZE     = 18;
const STARS_COUNT    = 300;

// ── State Variables ──
let player, bullets, asteroids, aliens, particles, stars;
let score, wave, combo, comboTimer, hiScore, paused, gameOver, gameStarted;
let keys, mouseX, mouseY, mouseDown, fireTimer, waveTimer, waveMsgTimer;
let frameCount;

// Load high score
hiScore = parseInt(localStorage.getItem('stellarHi') || '0');

// ── Input ──
keys = {};
mouseX = W / 2; mouseY = H / 2; mouseDown = false;

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'p' || e.key === 'P') if (gameStarted && !gameOver) paused = !paused;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
canvas.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
canvas.addEventListener('mousedown', e => { if (e.button === 0) mouseDown = true; });
canvas.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ═══════════════════════════════════════════════════
//  UTILITY FUNCTIONS
// ═══════════════════════════════════════════════════

function rand(a, b) { return a + Math.random() * (b - a); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function hsl(h, s, l, a = 1) {
  return a < 1 ? `hsla(${h},${s}%,${l}%,${a})` : `hsl(${h},${s}%,${l}%)`;
}

// ═══════════════════════════════════════════════════
//  STARFIELD (parallax background)
// ═══════════════════════════════════════════════════

function initStars() {
  stars = [];
  for (let i = 0; i < STARS_COUNT; i++) {
    stars.push({
      x: rand(0, W), y: rand(0, H),
      size: rand(0.4, 2.2),
      speed: rand(0.15, 1.2),
      brightness: rand(0.3, 1),
      twinkleSpeed: rand(0.01, 0.04),
      twinkleOffset: rand(0, Math.PI * 2)
    });
  }
}

function updateStars() {
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > H + 4) { s.y = -4; s.x = rand(0, W); }
  });
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = 0.5 + 0.5 * Math.sin(frameCount * s.twinkleSpeed + s.twinkleOffset);
    const alpha = s.brightness * twinkle;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200,220,255,${alpha})`;
    ctx.fill();
  });
}

// ═══════════════════════════════════════════════════
//  NEBULA BACKGROUND
// ═══════════════════════════════════════════════════

let nebulae = [];
function initNebulae() {
  nebulae = [];
  const colors = [
    [220, 80, 60], [260, 70, 50], [180, 60, 40], [300, 50, 45], [200, 80, 55]
  ];
  for (let i = 0; i < 4; i++) {
    const c = colors[Math.floor(Math.random() * colors.length)];
    nebulae.push({
      x: rand(0, W), y: rand(0, H),
      radius: rand(150, 400),
      h: c[0], s: c[1], l: c[2],
      drift: rand(-0.05, 0.05)
    });
  }
}

function drawNebulae() {
  nebulae.forEach(n => {
    n.y += 0.08;
    if (n.y > H + n.radius) n.y = -n.radius;
    const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
    g.addColorStop(0, hsl(n.h, n.s, n.l, 0.04));
    g.addColorStop(0.5, hsl(n.h, n.s, n.l, 0.015));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

// ═══════════════════════════════════════════════════
//  PARTICLE SYSTEM
// ═══════════════════════════════════════════════════

function spawnExplosion(x, y, count, hue, speedMult = 1, sizeMult = 1) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    const angle = rand(0, Math.PI * 2);
    const speed = rand(0.5, 5) * speedMult;
    const life = rand(20, 70);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed + rand(-0.5, 0.5),
      vy: Math.sin(angle) * speed + rand(-0.5, 0.5),
      life, maxLife: life,
      size: rand(1, 4) * sizeMult,
      hue: hue + rand(-20, 20),
      type: 'spark'
    });
  }
}

function spawnDebris(x, y, count, hue) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    const angle = rand(0, Math.PI * 2);
    const speed = rand(1, 4);
    const life = rand(30, 90);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed + rand(-0.3, 0.3),
      life, maxLife: life,
      size: rand(2, 7),
      hue: hue + rand(-10, 10),
      rot: rand(0, Math.PI * 2),
      rotSpeed: rand(-0.15, 0.15),
      type: 'debris'
    });
  }
}

function spawnTrail(x, y) {
  if (particles.length >= MAX_PARTICLES) particles.shift();
  particles.push({
    x: x + rand(-3, 3), y: y + rand(-2, 2),
    vx: rand(-0.3, 0.3), vy: rand(0.5, 1.5),
    life: rand(10, 25), maxLife: 25,
    size: rand(1.5, 3.5),
    hue: rand(180, 220),
    type: 'trail'
  });
}

function spawnHitSpark(x, y) {
  for (let i = 0; i < 8; i++) {
    if (particles.length >= MAX_PARTICLES) particles.shift();
    const angle = rand(0, Math.PI * 2);
    const speed = rand(1, 6);
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rand(8, 20), maxLife: 20,
      size: rand(1, 3),
      hue: rand(40, 60),
      type: 'spark'
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life--;
    if (p.rot !== undefined) p.rot += p.rotSpeed;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    const alpha = p.life / p.maxLife;
    if (p.type === 'debris') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillStyle = hsl(p.hue, 50, 55, alpha);
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      const lightness = p.type === 'trail' ? 70 : 60;
      ctx.fillStyle = hsl(p.hue, 80, lightness, alpha * 0.9);
      ctx.fill();
      // Glow
      if (p.type === 'spark') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha * 2.5, 0, Math.PI * 2);
        ctx.fillStyle = hsl(p.hue, 90, 70, alpha * 0.15);
        ctx.fill();
      }
    }
  });
}

// ═══════════════════════════════════════════════════
//  PLAYER SHIP
// ═══════════════════════════════════════════════════

function initPlayer() {
  player = {
    x: W / 2, y: H * 0.75,
    vx: 0, vy: 0,
    angle: -Math.PI / 2,
    hp: 10, maxHp: 10,
    invincible: 0,       // frames of invincibility after hit
    thrust: false,
    speed: 5.5
  };
}

function updatePlayer() {
  const p = player;
  const boosting = keys['shift'];
  const spd = boosting ? p.speed * 1.7 : p.speed;
  const accel = 0.6;
  const friction = 0.88;

  // Movement
  let ax = 0, ay = 0;
  if (keys['w'] || keys['arrowup'])    ay = -accel;
  if (keys['s'] || keys['arrowdown'])  ay =  accel;
  if (keys['a'] || keys['arrowleft'])  ax = -accel;
  if (keys['d'] || keys['arrowright']) ax =  accel;

  p.vx += ax; p.vy += ay;
  // Clamp speed
  const spd2 = Math.hypot(p.vx, p.vy);
  if (spd2 > spd) { p.vx *= spd / spd2; p.vy *= spd / spd2; }
  p.vx *= friction; p.vy *= friction;
  p.x += p.vx; p.y += p.vy;

  // Keep in bounds
  p.x = clamp(p.x, SHIP_SIZE, W - SHIP_SIZE);
  p.y = clamp(p.y, SHIP_SIZE, H - SHIP_SIZE);

  // Aim at mouse
  p.angle = Math.atan2(mouseY - p.y, mouseX - p.x);

  // Invincibility timer
  if (p.invincible > 0) p.invincible--;

  // Thrust trail
  p.thrust = Math.abs(ax) > 0 || Math.abs(ay) > 0;
  if (p.thrust && frameCount % 2 === 0) {
    const backAngle = p.angle + Math.PI;
    const bx = p.x + Math.cos(backAngle) * SHIP_SIZE;
    const by = p.y + Math.sin(backAngle) * SHIP_SIZE;
    spawnTrail(bx, by);
    if (boosting) spawnTrail(bx, by); // extra trail when boosting
  }

  // Firing
  fireTimer++;
  if ((mouseDown || keys[' ']) && fireTimer >= FIRE_RATE) {
    fireTimer = 0;
    const bx = p.x + Math.cos(p.angle) * SHIP_SIZE;
    const by = p.y + Math.sin(p.angle) * SHIP_SIZE;
    bullets.push({
      x: bx, y: by,
      vx: Math.cos(p.angle) * BULLET_SPEED,
      vy: Math.sin(p.angle) * BULLET_SPEED,
      life: BULLET_LIFE,
      fromPlayer: true
    });
    // Muzzle flash
    spawnExplosion(bx, by, 3, 200, 0.6, 0.4);
  }
}

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(p.invincible / 3) % 2 === 0) return;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle + Math.PI / 2);

  // Engine glow
  if (p.thrust) {
    const glowR = 14 + Math.sin(frameCount * 0.3) * 4;
    const eg = ctx.createRadialGradient(0, SHIP_SIZE * 0.5, 0, 0, SHIP_SIZE * 0.5, glowR);
    eg.addColorStop(0, 'rgba(100,180,255,0.6)');
    eg.addColorStop(0.4, 'rgba(60,120,255,0.25)');
    eg.addColorStop(1, 'transparent');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.arc(0, SHIP_SIZE * 0.5, glowR, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ship body
  ctx.beginPath();
  ctx.moveTo(0, -SHIP_SIZE);               // nose
  ctx.lineTo(-SHIP_SIZE * 0.55, SHIP_SIZE * 0.6);  // left wing
  ctx.lineTo(-SHIP_SIZE * 0.15, SHIP_SIZE * 0.35); // left indent
  ctx.lineTo(SHIP_SIZE * 0.15, SHIP_SIZE * 0.35);  // right indent
  ctx.lineTo(SHIP_SIZE * 0.55, SHIP_SIZE * 0.6);   // right wing
  ctx.closePath();

  // Gradient fill
  const sg = ctx.createLinearGradient(-SHIP_SIZE, 0, SHIP_SIZE, 0);
  sg.addColorStop(0, '#1a4a7a');
  sg.addColorStop(0.5, '#2980b9');
  sg.addColorStop(1, '#1a4a7a');
  ctx.fillStyle = sg;
  ctx.fill();
  ctx.strokeStyle = '#5dade2';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Cockpit
  ctx.beginPath();
  ctx.ellipse(0, -SHIP_SIZE * 0.25, SHIP_SIZE * 0.18, SHIP_SIZE * 0.28, 0, 0, Math.PI * 2);
  const cg = ctx.createRadialGradient(-2, -SHIP_SIZE * 0.3, 0, 0, -SHIP_SIZE * 0.25, SHIP_SIZE * 0.28);
  cg.addColorStop(0, '#aed6f1');
  cg.addColorStop(1, '#2471a3');
  ctx.fillStyle = cg;
  ctx.fill();

  // Wing stripes
  ctx.strokeStyle = '#85c1e9';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-SHIP_SIZE * 0.1, -SHIP_SIZE * 0.15);
  ctx.lineTo(-SHIP_SIZE * 0.4, SHIP_SIZE * 0.4);
  ctx.moveTo(SHIP_SIZE * 0.1, -SHIP_SIZE * 0.15);
  ctx.lineTo(SHIP_SIZE * 0.4, SHIP_SIZE * 0.4);
  ctx.stroke();

  ctx.restore();

  // Shield indicator
  if (p.invincible > 0) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, SHIP_SIZE + 8, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(100,200,255,${0.3 + 0.2 * Math.sin(frameCount * 0.2)})`;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ═══════════════════════════════════════════════════
//  BULLETS
// ═══════════════════════════════════════════════════

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life--;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) {
      bullets.splice(i, 1);
    }
  }
}

function drawBullets() {
  bullets.forEach(b => {
    const alpha = Math.min(1, b.life / 15);
    // Core
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = b.fromPlayer
      ? `rgba(100,200,255,${alpha})`
      : `rgba(255,80,80,${alpha})`;
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = b.fromPlayer
      ? `rgba(100,200,255,${alpha * 0.2})`
      : `rgba(255,80,80,${alpha * 0.2})`;
    ctx.fill();
    // Trail line
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
    ctx.strokeStyle = b.fromPlayer
      ? `rgba(100,200,255,${alpha * 0.4})`
      : `rgba(255,80,80,${alpha * 0.4})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  });
}

// ═══════════════════════════════════════════════════
//  ASTEROIDS
// ═══════════════════════════════════════════════════

function spawnAsteroid() {
  const size = rand(ASTEROID_MIN, ASTEROID_MAX);
  const edge = Math.floor(Math.random() * 4);
  let x, y, vx, vy;
  const speed = rand(0.8, 2.5);

  if (edge === 0)      { x = rand(0, W); y = -size; vx = rand(-1, 1); vy = speed; }
  else if (edge === 1) { x = W + size; y = rand(0, H); vx = -speed; vy = rand(-1, 1); }
  else if (edge === 2) { x = rand(0, W); y = H + size; vx = rand(-1, 1); vy = -speed; }
  else                 { x = -size; y = rand(0, H); vx = speed; vy = rand(-1, 1); }

  // Generate jagged vertex offsets for irregular shape
  const verts = [];
  const numVerts = Math.floor(rand(7, 12));
  for (let i = 0; i < numVerts; i++) {
    const angle = (i / numVerts) * Math.PI * 2;
    const r = size * rand(0.7, 1.0);
    verts.push({ angle, r });
  }

  asteroids.push({
    x, y, vx, vy, size,
    rot: rand(0, Math.PI * 2),
    rotSpeed: rand(-0.03, 0.03),
    hp: Math.ceil(size / 15),
    verts,
    hue: rand(25, 45)
  });
}

function updateAsteroids() {
  // Spawn rate increases with wave
  const spawnRate = Math.max(15, 80 - wave * 5);
  if (frameCount % spawnRate === 0) spawnAsteroid();

  for (let i = asteroids.length - 1; i >= 0; i--) {
    const a = asteroids[i];
    a.x += a.vx; a.y += a.vy;
    a.rot += a.rotSpeed;

    // Remove if far off screen
    if (a.x < -150 || a.x > W + 150 || a.y < -150 || a.y > H + 150) {
      asteroids.splice(i, 1);
      continue;
    }

    // Collision with player
    if (player.invincible <= 0 && dist(a, player) < a.size + SHIP_SIZE * 0.7) {
      hitPlayer(1);
      spawnExplosion(a.x, a.y, 12, a.hue, 1, 0.8);
      asteroids.splice(i, 1);
    }
  }
}

function drawAsteroids() {
  asteroids.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.rot);

    // Shadow
    ctx.beginPath();
    a.verts.forEach((v, idx) => {
      const x = Math.cos(v.angle) * v.r;
      const y = Math.sin(v.angle) * v.r;
      idx === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fill();

    // Main body
    ctx.translate(2, 2);
    ctx.beginPath();
    a.verts.forEach((v, idx) => {
      const x = Math.cos(v.angle) * v.r;
      const y = Math.sin(v.angle) * v.r;
      idx === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();

    const ag = ctx.createRadialGradient(-a.size * 0.3, -a.size * 0.3, 0, 0, 0, a.size);
    ag.addColorStop(0, hsl(a.hue, 30, 50));
    ag.addColorStop(0.7, hsl(a.hue, 25, 35));
    ag.addColorStop(1, hsl(a.hue, 20, 22));
    ctx.fillStyle = ag;
    ctx.fill();
    ctx.strokeStyle = hsl(a.hue, 20, 55, 0.5);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Craters
    for (let j = 0; j < 3; j++) {
      const cx2 = rand(-a.size * 0.4, a.size * 0.4);
      const cy2 = rand(-a.size * 0.4, a.size * 0.4);
      ctx.beginPath();
      ctx.arc(cx2, cy2, rand(2, a.size * 0.15), 0, Math.PI * 2);
      ctx.fillStyle = hsl(a.hue, 15, 25, 0.4);
      ctx.fill();
    }

    ctx.restore();
  });
}

// ═══════════════════════════════════════════════════
//  ALIEN INVADERS
// ═══════════════════════════════════════════════════

function spawnAlien() {
  const edge = Math.random() < 0.5 ? -30 : W + 30;
  const y = rand(50, H * 0.5);
  const speed = rand(1.2, 2.2) + wave * 0.12;
  const vx = edge < 0 ? speed : -speed;

  aliens.push({
    x: edge, y, vx, vy: 0,
    size: ALIEN_SIZE + rand(-3, 5),
    hp: 1 + Math.floor(wave / 3),
    fireTimer: rand(40, 90),
    fireRate: Math.max(30, 70 - wave * 3),
    sinOffset: rand(0, Math.PI * 2),
    sinAmp: rand(30, 80),
    hue: rand(0, 360),
    pulsePhase: rand(0, Math.PI * 2),
    wingPhase: rand(0, Math.PI * 2)
  });
}

function updateAliens() {
  const spawnRate = Math.max(40, 120 - wave * 8);
  if (frameCount % spawnRate === 0) spawnAlien();

  for (let i = aliens.length - 1; i >= 0; i--) {
    const a = aliens[i];
    a.x += a.vx;
    a.sinOffset += 0.02;
    a.y += Math.sin(a.sinOffset) * 1.5;
    a.pulsePhase += 0.08;
    a.wingPhase += 0.12;

    // Firing at player
    a.fireTimer--;
    if (a.fireTimer <= 0) {
      a.fireTimer = a.fireRate;
      const angle = Math.atan2(player.y - a.y, player.x - a.x);
      bullets.push({
        x: a.x, y: a.y,
        vx: Math.cos(angle) * 5,
        vy: Math.sin(angle) * 5,
        life: 90,
        fromPlayer: false
      });
    }

    // Remove if off screen
    if (a.x < -80 || a.x > W + 80) { aliens.splice(i, 1); continue; }

    // Collision with player
    if (player.invincible <= 0 && dist(a, player) < a.size + SHIP_SIZE * 0.6) {
      hitPlayer(2);
      spawnExplosion(a.x, a.y, 25, a.hue, 1.2, 1);
      aliens.splice(i, 1);
    }
  }
}

function drawAliens() {
  aliens.forEach(a => {
    const pulse = 1 + Math.sin(a.pulsePhase) * 0.08;
    const wing = Math.sin(a.wingPhase) * 0.4;

    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.scale(pulse, pulse);

    // Glow
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, a.size * 2.2);
    gg.addColorStop(0, hsl(a.hue, 80, 60, 0.15));
    gg.addColorStop(1, 'transparent');
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(0, 0, a.size * 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Body (saucer shape)
    ctx.beginPath();
    ctx.ellipse(0, 0, a.size * 1.3, a.size * 0.45, 0, 0, Math.PI * 2);
    const bg = ctx.createRadialGradient(-a.size * 0.3, -a.size * 0.1, 0, 0, 0, a.size * 1.3);
    bg.addColorStop(0, hsl(a.hue, 70, 65));
    bg.addColorStop(0.6, hsl(a.hue, 60, 45));
    bg.addColorStop(1, hsl(a.hue, 50, 30));
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = hsl(a.hue, 80, 70, 0.6);
    ctx.lineWidth = 1;
    ctx.stroke();

    // Dome
    ctx.beginPath();
    ctx.ellipse(0, -a.size * 0.2, a.size * 0.5, a.size * 0.45, 0, Math.PI, 0);
    const dg = ctx.createRadialGradient(-2, -a.size * 0.4, 0, 0, -a.size * 0.2, a.size * 0.5);
    dg.addColorStop(0, hsl(a.hue + 40, 50, 75, 0.9));
    dg.addColorStop(1, hsl(a.hue + 40, 60, 50, 0.5));
    ctx.fillStyle = dg;
    ctx.fill();

    // Eyes
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(side * a.size * 0.28, -a.size * 0.1, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#111';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(side * a.size * 0.28 + side, -a.size * 0.14, 1.2, 0, Math.PI * 2);
      ctx.fillStyle = hsl(a.hue, 80, 80);
      ctx.fill();
    }

    // Wings
    ctx.save();
    ctx.rotate(wing);
    ctx.beginPath();
    ctx.ellipse(-a.size * 1.2, 0, a.size * 0.5, a.size * 0.2, -0.3, 0, Math.PI * 2);
    ctx.fillStyle = hsl(a.hue, 50, 40, 0.6);
    ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.rotate(-wing);
    ctx.beginPath();
    ctx.ellipse(a.size * 1.2, 0, a.size * 0.5, a.size * 0.2, 0.3, 0, Math.PI * 2);
    ctx.fillStyle = hsl(a.hue, 50, 40, 0.6);
    ctx.fill();
    ctx.restore();

    // Lights underneath
    for (let i = 0; i < 3; i++) {
      const lx = (i - 1) * a.size * 0.5;
      ctx.beginPath();
      ctx.arc(lx, a.size * 0.2, 2, 0, Math.PI * 2);
      ctx.fillStyle = hsl((frameCount * 3 + i * 120) % 360, 90, 60, 0.8);
      ctx.fill();
    }

    ctx.restore();

    // HP bar
    if (a.hp > 1) {
      const barW = a.size * 1.6;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(a.x - barW / 2, a.y - a.size - 10, barW, 4);
      ctx.fillStyle = '#ff4444';
      ctx.fillRect(a.x - barW / 2, a.y - a.size - 10, barW * (a.hp / (1 + Math.floor(wave / 3))), 4);
    }
  });
}

// ═══════════════════════════════════════════════════
//  COLLISION DETECTION
// ═══════════════════════════════════════════════════

function checkCollisions() {
  // Player bullets vs asteroids
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b.fromPlayer) continue;

    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (dist(b, a) < a.size) {
        a.hp--;
        spawnHitSpark(b.x, b.y);
        bullets.splice(i, 1);

        if (a.hp <= 0) {
          const pts = Math.floor(a.size * 2) * combo;
          score += pts;
          spawnExplosion(a.x, a.y, 20 + Math.floor(a.size / 3), a.hue, 1.3, a.size / 25);
          spawnDebris(a.x, a.y, 4 + Math.floor(a.size / 12), a.hue);
          asteroids.splice(j, 1);
          incrementCombo();
        }
        break;
      }
    }
  }

  // Player bullets vs aliens
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (!b.fromPlayer) continue;

    for (let j = aliens.length - 1; j >= 0; j--) {
      const a = aliens[j];
      if (dist(b, a) < a.size * 1.2) {
        a.hp--;
        spawnHitSpark(b.x, b.y);
        bullets.splice(i, 1);

        if (a.hp <= 0) {
          const pts = 100 * combo;
          score += pts;
          spawnExplosion(a.x, a.y, 35, a.hue, 1.5, 1.2);
          spawnDebris(a.x, a.y, 6, a.hue);
          // Secondary explosions
          setTimeout(() => spawnExplosion(a.x + rand(-20,20), a.y + rand(-20,20), 15, a.hue + 30, 1, 0.8), 100);
          aliens.splice(j, 1);
          incrementCombo();
        }
        break;
      }
    }
  }

  // Enemy bullets vs player
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    if (b.fromPlayer || player.invincible > 0) continue;
    if (dist(b, player) < SHIP_SIZE * 0.7) {
      hitPlayer(1);
      bullets.splice(i, 1);
    }
  }
}

// ═══════════════════════════════════════════════════
//  PLAYER DAMAGE & COMBO
// ═══════════════════════════════════════════════════

function hitPlayer(dmg) {
  if (player.invincible > 0) return;
  player.hp -= dmg;
  player.invincible = 90; // 1.5 seconds at 60fps
  spawnExplosion(player.x, player.y, 15, 0, 1, 0.8);
  combo = 1; comboTimer = 0;

  if (player.hp <= 0) {
    player.hp = 0;
    endGame();
  }
}

function incrementCombo() {
  combo = Math.min(20, combo + 1);
  comboTimer = 180; // 3 seconds
}

// ═══════════════════════════════════════════════════
//  WAVE SYSTEM
// ═══════════════════════════════════════════════════

function checkWaveProgress() {
  const killsNeeded = 10 + wave * 5;
  // Count kills via score threshold (simplified)
  if (frameCount % 300 === 0 && frameCount > 0) {
    wave++;
    showWaveMessage();
    // Bonus
    score += wave * 50;
    player.hp = Math.min(player.maxHp, player.hp + 2);
  }
}

function showWaveMessage() {
  const el = document.getElementById('wave-msg');
  el.textContent = `⚡ WAVE ${wave} ⚡`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

// ═══════════════════════════════════════════════════
//  HUD UPDATE
// ═══════════════════════════════════════════════════

function updateHUD() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('wave').textContent = wave;

  // HP bar as hearts/blocks
  let hpStr = '';
  const cls = player.hp > 6 ? 'hp-full' : player.hp > 3 ? 'hp-mid' : 'hp-low';
  for (let i = 0; i < player.maxHp; i++) {
    hpStr += i < player.hp ? '█' : '░';
  }
  const hpEl = document.getElementById('hp');
  hpEl.textContent = hpStr;
  hpEl.className = 'val hp ' + cls;

  // Combo
  document.getElementById('combo').textContent = combo > 1 ? `×${combo}` : '×1';
  document.getElementById('hiscore').textContent = hiScore.toLocaleString();
}

// ═══════════════════════════════════════════════════
//  GAME FLOW
// ═══════════════════════════════════════════════════

function startGame() {
  document.getElementById('menu').classList.add('hidden');
  gameStarted = true;
  resetGameState();
}

function resetGameState() {
  initPlayer();
  bullets    = [];
  asteroids  = [];
  aliens     = [];
  particles  = [];
  score = 0;
  wave  = 1;
  combo = 1;
  comboTimer = 0;
  fireTimer  = FIRE_RATE;
  frameCount = 0;
  gameOver   = false;
  paused     = false;
  initStars();
  initNebulae();
}

function endGame() {
  gameOver = true;
  spawnExplosion(player.x, player.y, 60, 200, 2, 1.5);
  spawnDebris(player.x, player.y, 12, 200);
  if (score > hiScore) {
    hiScore = score;
    localStorage.setItem('stellarHi', hiScore);
  }
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('final-hi').textContent = hiScore.toLocaleString();
  setTimeout(() => document.getElementById('gameover').classList.add('show'), 1500);
}

function restartGame() {
  document.getElementById('gameover').classList.remove('show');
  resetGameState();
}

// ═══════════════════════════════════════════════════
//  MAIN GAME LOOP
// ═══════════════════════════════════════════════════

function gameLoop() {
  requestAnimationFrame(gameLoop);

  // Always draw background (even on menu)
  ctx.fillStyle = '#050510';
  ctx.fillRect(0, 0, W, H);
  drawNebulae();
  updateStars();
  drawStars();

  if (!gameStarted || paused) {
    // Draw a subtle pulse on menu
    ctx.fillStyle = `rgba(80,140,255,${0.02 + 0.01 * Math.sin(Date.now() * 0.002)})`;
    ctx.fillRect(0, 0, W, H);
    return;
  }

  frameCount++;

  // Combo decay
  if (comboTimer > 0) comboTimer--;
  else combo = 1;

  if (!gameOver) {
    updatePlayer();
    checkWaveProgress();
  }

  updateBullets();
  updateAsteroids();
  updateAliens();
  updateParticles();
  checkCollisions();

  // Draw everything
  drawAsteroids();
  drawBullets();
  drawParticles();
  drawAliens();
  if (!gameOver) drawPlayer();

  // Combo flash on screen edge
  if (combo > 2) {
    const intensity = Math.min(0.15, combo * 0.015);
    ctx.fillStyle = `rgba(255,200,50,${intensity * (0.5 + 0.5 * Math.sin(frameCount * 0.15))})`;
    ctx.fillRect(0, 0, W, 4);
    ctx.fillRect(0, H - 4, W, 4);
  }

  updateHUD();
}

// ═══════════════════════════════════════════════════
//  INITIALIZE & START LOOP
// ═══════════════════════════════════════════════════

initStars();
initNebulae();
particles  = [];
bullets    = [];
asteroids  = [];
aliens     = [];
gameStarted = false;
gameOver    = false;
paused      = false;
frameCount  = 0;
combo       = 1;
comboTimer  = 0;

gameLoop();
</script>
