<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Starfighter: Asteroid Assault</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --primary: #0ff;
            --danger: #ff0055;
            --bg: #030308;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            overflow: hidden;
            font-family: 'Orbitron', sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* CRT Scanline & Vignette Effect */
        #fx-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #score-display {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            letter-spacing: 2px;
        }

        .health-bar-container {
            width: 250px;
            height: 20px;
            background: rgba(0,0,0,0.5);
            border: 2px solid var(--primary);
            box-shadow: 0 0 10px var(--primary);
            border-radius: 4px;
            overflow: hidden;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            transition: width 0.2s, background-color 0.2s;
        }

        /* Screens */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 8, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            pointer-events: auto;
        }

        h1 {
            font-size: 4rem;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
            text-align: center;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
        }

        button {
            background: transparent;
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 40px;
            border: 2px solid var(--primary);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) inset, 0 0 15px rgba(0, 255, 255, 0.2);
            transition: all 0.2s;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary) inset, 0 0 30px var(--primary);
            transform: scale(1.05);
        }

        #game-over-screen { display: none; }
        #final-score { font-size: 2.5rem; color: #fff; margin-bottom: 30px; text-shadow: 0 0 10px #fff; }

    </style>
</head>
<body>

    <div id="fx-overlay"></div>

    <div id="ui-layer">
        <div class="hud-top">
            <div id="score-display">SCORE: 0</div>
            <div class="health-bar-container">
                <div id="health-bar"></div>
            </div>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <h1>Neon Starfighter</h1>
        <p class="subtitle">Mouse/Touch to Move & Auto-Fire.<br>Dodge asteroids, destroy alien invaders, and survive!</p>
        <button id="start-btn">Initiate Launch</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="screen">
        <h1 style="color: var(--danger); text-shadow: 0 0 20px var(--danger);">Hull Critical</h1>
        <div id="final-score">Final Score: 0</div>
        <button id="restart-btn">Play Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency on base

        // UI Elements
        const scoreDisplay = document.getElementById('score-display');
        const healthBar = document.getElementById('health-bar');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');

        // Game State
        let width, height;
        let animationId;
        let score = 0;
        let frameCount = 0;
        let isPlaying = false;
        let screenShake = 0;

        // Input
        let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, isDown: false };

        // Entity Arrays
        let player;
        let projectiles = [];
        let enemies = [];
        let particles = [];
        let asteroids = [];
        let stars = [];
        let floatingTexts = [];

        // --- MATH & UTILS ---
        const random = (min, max) => Math.random() * (max - min) + min;
        const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
        
        // Colors
        const C_PLAYER = '#00ffff';
        const C_LASER = '#ffffff';
        const C_ALIEN = '#ff00ff';
        const C_ASTEROID = '#ffaa00';
        const C_ENEMY_LASER = '#ff0055';

        // --- CLASSES ---

        class Star {
            constructor() {
                this.x = random(0, width);
                this.y = random(0, height);
                this.z = random(0.1, 2); // Depth for parallax
                this.size = random(0.5, 2);
                this.alpha = random(0.3, 1);
            }
            update() {
                this.y += this.z * (player ? (1 + (height - player.y) * 0.001) : 1);
                if (this.y > height) {
                    this.y = 0;
                    this.x = random(0, width);
                }
                this.draw();
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.health = 100;
                this.maxHealth = 100;
                this.color = C_PLAYER;
                this.vx = 0;
                this.vy = 0;
                this.fireRate = 8;
                this.lastShot = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Tilt based on horizontal velocity
                ctx.rotate(this.vx * 0.05);

                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';

                // Draw sleek fighter shape
                ctx.beginPath();
                ctx.moveTo(0, -20);
                ctx.lineTo(15, 15);
                ctx.lineTo(0, 5);
                ctx.lineTo(-15, 15);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Engine Glow
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#0055ff';
                ctx.fillStyle = '#00aaff';
                ctx.beginPath();
                ctx.moveTo(-8, 12);
                ctx.lineTo(0, 12 + Math.random() * 15 + 10);
                ctx.lineTo(8, 12);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }

            update() {
                // Smooth follow mouse/touch
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                
                this.vx = dx * 0.1;
                this.vy = dy * 0.1;

                this.x += this.vx;
                this.y += this.vy;

                // Clamp to screen
                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));

                // Auto Fire
                if (frameCount - this.lastShot > this.fireRate) {
                    this.shoot();
                    this.lastShot = frameCount;
                }

                // Update UI
                healthBar.style.width = `${Math.max(0, (this.health / this.maxHealth) * 100)}%`;
                if (this.health < 30) {
                    healthBar.style.backgroundColor = 'var(--danger)';
                    healthBar.style.boxShadow = '0 0 15px var(--danger)';
                } else {
                    healthBar.style.backgroundColor = 'var(--primary)';
                    healthBar.style.boxShadow = '0 0 15px var(--primary)';
                }

                this.draw();
            }

            shoot() {
                // Dual lasers
                projectiles.push(new Projectile(this.x - 10, this.y - 10, 0, -15, C_LASER, true));
                projectiles.push(new Projectile(this.x + 10, this.y - 10, 0, -15, C_LASER, true));
                
                // Muzzle flash particle
                particles.push(new Particle(this.x - 10, this.y - 15, 0, random(-1, 1), 2, C_PLAYER, 0.5));
                particles.push(new Particle(this.x + 10, this.y - 15, 0, random(-1, 1), 2, C_PLAYER, 0.5));
            }

            takeDamage(amount) {
                this.health -= amount;
                screenShake = 15;
                createExplosion(this.x, this.y, this.color, 15, 3);
                if (this.health <= 0) {
                    endGame();
                }
            }
        }

        class Projectile {
            constructor(x, y, vx, vy, color, isPlayer) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.radius = 3;
                this.isPlayer = isPlayer;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#fff';
                
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx) + Math.PI/2);
                
                // Draw laser bolt
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(2, 5);
                ctx.lineTo(-2, 5);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.markedForDeletion = true;
                }
                this.draw();
            }
        }

        class Enemy {
            constructor() {
                this.x = random(30, width - 30);
                this.y = -30;
                this.radius = 18;
                this.color = C_ALIEN;
                this.vx = random(-2, 2);
                this.vy = random(2, 5);
                this.health = 30;
                this.maxHealth = 30;
                this.markedForDeletion = false;
                this.type = Math.random() > 0.5 ? 'shooter' : 'diver';
                this.lastShot = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';

                // Draw alien saucer/ship
                ctx.beginPath();
                ctx.moveTo(0, 15);
                ctx.lineTo(20, 0);
                ctx.lineTo(10, -10);
                ctx.lineTo(-10, -10);
                ctx.lineTo(-20, 0);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Core
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off walls
                if (this.x - this.radius <= 0 || this.x + this.radius >= width) {
                    this.vx *= -1;
                }

                // Shooter logic
                if (this.type === 'shooter' && this.y > 50 && this.y < height - 200) {
                    if (frameCount - this.lastShot > 80) {
                        // Aim at player
                        const angle = Math.atan2(player.y - this.y, player.x - this.x);
                        const speed = 7;
                        projectiles.push(new Projectile(this.x, this.y, Math.cos(angle)*speed, Math.sin(angle)*speed, C_ENEMY_LASER, false));
                        this.lastShot = frameCount;
                    }
                }

                if (this.y > height + this.radius) {
                    this.markedForDeletion = true;
                }
                this.draw();
            }

            takeDamage(amount) {
                this.health -= amount;
                createExplosion(this.x, this.y, this.color, 5, 2);
                if (this.health <= 0) {
                    this.die();
                }
            }

            die() {
                this.markedForDeletion = true;
                createExplosion(this.x, this.y, this.color, 30, 8);
                screenShake = Math.max(screenShake, 5);
                addScore(100);
                floatingTexts.push(new FloatingText("+100", this.x, this.y, this.color));
            }
        }

        class Asteroid {
            constructor(x, y, radius, level = 1) {
                this.x = x || random(30, width - 30);
                this.y = y || -50;
                this.radius = radius || random(30, 60);
                this.color = C_ASTEROID;
                this.vx = random(-1.5, 1.5);
                this.vy = random(1, 4) * (70 / this.radius); // smaller = faster
                this.rotation = 0;
                this.rotSpeed = random(-0.05, 0.05);
                this.level = level; // 1 = big, 2 = medium, 3 = small
                this.health = this.radius;
                this.markedForDeletion = false;

                // Generate random jagged shape
                this.vertices = [];
                const points = Math.floor(random(7, 12));
                for(let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = this.radius * random(0.7, 1.1);
                    this.vertices.push({ x: Math.cos(angle)*r, y: Math.sin(angle)*r });
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.fillStyle = '#0a0500';

                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for(let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Inner detail lines
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                ctx.lineTo(this.vertices[Math.floor(this.vertices.length/2)].x, this.vertices[Math.floor(this.vertices.length/2)].y);
                ctx.strokeStyle = 'rgba(255, 170, 0, 0.3)';
                ctx.stroke();

                ctx.restore();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotSpeed;

                // Wrap horizontally
                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;

                if (this.y > height + this.radius) {
                    this.markedForDeletion = true;
                }
                this.draw();
            }

            takeDamage(amount) {
                this.health -= amount;
                createExplosion(this.x, this.y, '#fff', 3, 2);
                if (this.health <= 0) {
                    this.die();
                }
            }

            die() {
                this.markedForDeletion = true;
                createExplosion(this.x, this.y, this.color, 25, 6);
                screenShake = Math.max(screenShake, 8);
                
                const pts = Math.floor(100 * this.level);
                addScore(pts);
                floatingTexts.push(new FloatingText(`+${pts}`, this.x, this.y, this.color));

                // Split into smaller asteroids
                if (this.level < 3 && this.radius > 20) {
                    asteroids.push(new Asteroid(this.x, this.y, this.radius * 0.5, this.level + 1));
                    asteroids.push(new Asteroid(this.x, this.y, this.radius * 0.5, this.level + 1));
                }
            }
        }

        class Particle {
            constructor(x, y, vx, vy, radius, color, lifeSpan = 1) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = radius;
                this.color = color;
                this.alpha = 1;
                this.lifeSpan = lifeSpan;
                this.decay = random(0.01, 0.03) / lifeSpan;
                this.markedForDeletion = false;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.vx *= 0.95; // friction
                this.vy *= 0.95;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.alpha <= 0.05) {
                    this.markedForDeletion = true;
                }
                this.draw();
            }
        }

        class FloatingText {
            constructor(text, x, y, color) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1;
                this.markedForDeletion = false;
            }
            update() {
                this.y -= 1;
                this.alpha -= 0.02;
                if (this.alpha <= 0) this.markedForDeletion = true;
                this.draw();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.font = 'bold 20px Orbitron';
                ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // --- GAME ENGINE FUNCTIONS ---

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createExplosion(x, y, color, count, speed) {
            for (let i = 0; i < count; i++) {
                const angle = random(0, Math.PI * 2);
                const velocity = random(1, speed);
                particles.push(new Particle(
                    x, y, 
                    Math.cos(angle) * velocity, 
                    Math.sin(angle) * velocity, 
                    random(1, 4), 
                    color
                ));
            }
        }

        function addScore(amount) {
            score += amount;
            scoreDisplay.innerText = `SCORE: ${score}`;
        }

        function spawnEntities() {
            // Difficulty scaling
            const enemyRate = Math.max(30, 100 - Math.floor(score / 500));
            const asteroidRate = Math.max(40, 120 - Math.floor(score / 300));

            if (frameCount % enemyRate === 0) {
                enemies.push(new Enemy());
            }

            if (frameCount % asteroidRate === 0) {
                asteroids.push(new Asteroid());
            }
        }

        // --- MAIN GAME LOOP ---

        function init() {
            resize();
            player = new Player(width / 2, height - 100);
            projectiles = [];
            enemies = [];
            particles = [];
            asteroids = [];
            floatingTexts = [];
            score = 0;
            frameCount = 0;
            screenShake = 0;
            addScore(0);
            
            // Create background stars
            stars = [];
            for(let i=0; i<150; i++) stars.push(new Star());

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            isPlaying = true;
            
            if (animationId) cancelAnimationFrame(animationId);
            animate();
        }

        function endGame() {
            isPlaying = false;
            createExplosion(player.x, player.y, player.color, 100, 10);
            setTimeout(() => {
                gameOverScreen.style.display = 'flex';
                finalScoreDisplay.innerText = `Final Score: ${score}`;
            }, 1000);
        }

        function animate() {
            if (!isPlaying && particles.length === 0) return;
            animationId = requestAnimationFrame(animate);

            // Screen Shake calculation
            let dx = 0, dy = 0;
            if (screenShake > 0) {
                dx = random(-screenShake, screenShake);
                dy = random(-screenShake, screenShake);
                screenShake *= 0.9;
                if (screenShake < 0.5) screenShake = 0;
            }

            // Clear Background with a slight trail effect
            ctx.fillStyle = 'rgba(3, 3, 8, 0.4)';
            ctx.fillRect(0, 0, width, height);

            ctx.save();
            ctx.translate(dx, dy);

            // Use 'lighter' for that intense neon glow stacking
            ctx.globalCompositeOperation = 'lighter';

            // Draw Background
            stars.forEach(star => star.update());

            if (isPlaying) {
                frameCount++;
                spawnEntities();
                player.update();
            }

            // Update & Draw Projectiles
            projectiles.forEach(p => p.update());
            
            // Update & Draw Particles
            particles.forEach(p => p.update());

            // Update & Draw Enemies
            enemies.forEach(enemy => enemy.update());

            // Update & Draw Asteroids
            asteroids.forEach(ast => ast.update());

            // Floating Text
            floatingTexts.forEach(ft => ft.update());

            // --- COLLISION DETECTION ---
            
            if (isPlaying) {
                // Player vs Asteroids
                asteroids.forEach(ast => {
                    if (dist(player.x, player.y, ast.x, ast.y) < player.radius + ast.radius - 5) {
                        player.takeDamage(20);
                        ast.takeDamage(100); // destroy asteroid
                    }
                });

                // Player vs Enemies
                enemies.forEach(enemy => {
                    if (dist(player.x, player.y, enemy.x, enemy.y) < player.radius + enemy.radius) {
                        player.takeDamage(20);
                        enemy.takeDamage(100);
                    }
                });

                // Projectiles vs Entities
                projectiles.forEach(proj => {
                    if (proj.isPlayer) {
                        // Player Laser vs Enemies
                        enemies.forEach(enemy => {
                            if (!proj.markedForDeletion && dist(proj.x, proj.y, enemy.x, enemy.y) < enemy.radius) {
                                enemy.takeDamage(15);
                                proj.markedForDeletion = true;
                                createExplosion(proj.x, proj.y, C_LASER, 5, 2);
                            }
                        });

                        // Player Laser vs Asteroids
                        asteroids.forEach(ast => {
                            if (!proj.markedForDeletion && dist(proj.x, proj.y, ast.x, ast.y) < ast.radius) {
                                ast.takeDamage(15);
                                proj.markedForDeletion = true;
                                createExplosion(proj.x, proj.y, C_LASER, 5, 2);
                            }
                        });
                    } else {
                        // Enemy Laser vs Player
                        if (!proj.markedForDeletion && dist(proj.x, proj.y, player.x, player.y) < player.radius) {
                            player.takeDamage(10);
                            proj.markedForDeletion = true;
                            createExplosion(proj.x, proj.y, C_ENEMY_LASER, 8, 3);
                        }
                    }
                });
            }

            // Cleanup marked arrays
            projectiles = projectiles.filter(p => !p.markedForDeletion);
            enemies = enemies.filter(e => !e.markedForDeletion);
            asteroids = asteroids.filter(a => !a.markedForDeletion);
            particles = particles.filter(p => !p.markedForDeletion);
            floatingTexts = floatingTexts.filter(ft => !ft.markedForDeletion);

            ctx.restore();
        }

        // --- EVENT LISTENERS ---

        window.addEventListener('resize', resize);

        // Mouse Controls
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Touch Controls (Mobile support)
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });
        
        window.addEventListener('touchstart', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
        }, { passive: false });

        // Buttons
        startBtn.addEventListener('click', init);
        restartBtn.addEventListener('click', init);

        // Initial setup
        resize();
        // Draw static background before start
        stars = [];
        for(let i=0; i<150; i++) stars.push(new Star());
        ctx.fillStyle = '#030308';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        stars.forEach(star => star.draw());

    </script>
</body>
</html>
