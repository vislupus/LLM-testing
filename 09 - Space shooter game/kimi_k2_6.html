<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Runner — Space Shooter</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:#000; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  }
  #renderCanvas { width:100%; height:100%; display:block; outline:none; }

  /* HUD */
  #hud {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 22px;
    background:linear-gradient(180deg, rgba(4,6,12,0.9) 0%, transparent 100%);
    pointer-events:none; user-select:none;
  }
  .hud-group { display:flex; gap:32px; align-items:center; }
  .hud-item { text-align:center; }
  .hud-label {
    font-size:9px; color:#5a6a8a; text-transform:uppercase;
    letter-spacing:1.5px; font-weight:700;
  }
  .hud-value {
    font-size:24px; font-weight:800; color:#e0e8f0;
    font-family:'Courier New',monospace;
  }
  .hud-value.score { color:#ffd54f; }
  .hud-value.wave { color:#4fc3f7; }

  /* Health bar */
  #hpBarWrap {
    width:180px; height:10px; background:rgba(255,255,255,0.06);
    border-radius:5px; overflow:hidden; margin-top:4px;
    border:1px solid rgba(255,255,255,0.08);
  }
  #hpBar {
    width:100%; height:100%; background:linear-gradient(90deg,#66bb6a,#43a047);
    border-radius:5px; transition:width 0.2s, background 0.2s;
  }

  /* Overlays */
  #startScreen, #gameOverScreen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(2,4,10,0.88);
    z-index:10; backdrop-filter:blur(6px);
  }
  #gameOverScreen { display:none; }
  .screen-title {
    font-size:52px; font-weight:900; color:#e0e8f0;
    letter-spacing:6px; text-transform:uppercase;
    margin-bottom:8px;
    text-shadow:0 0 40px rgba(79,195,247,0.4);
  }
  .screen-sub {
    font-size:15px; color:#5a6a8a; margin-bottom:36px;
    letter-spacing:1px;
  }
  .screen-btn {
    padding:14px 48px; border-radius:12px;
    border:1px solid rgba(79,195,247,0.35);
    background:rgba(79,195,247,0.1);
    color:#4fc3f7; font-size:15px; font-weight:700;
    cursor:pointer; text-transform:uppercase;
    letter-spacing:2px; transition:all 0.2s;
  }
  .screen-btn:hover {
    background:rgba(79,195,247,0.2);
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(79,195,247,0.15);
  }
  .final-score {
    font-size:32px; color:#ffd54f; font-family:'Courier New',monospace;
    font-weight:800; margin-bottom:24px;
  }

  /* Controls hint */
  #controlsHint {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:#3a4a6a; font-size:11px; text-align:center;
    pointer-events:none; user-select:none;
    letter-spacing:0.5px;
  }
</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div class="hud-group">
    <div class="hud-item">
      <div class="hud-label">Score</div>
      <div class="hud-value score" id="scoreVal">0</div>
    </div>
    <div class="hud-item">
      <div class="hud-label">Wave</div>
      <div class="hud-value wave" id="waveVal">1</div>
    </div>
  </div>
  <div class="hud-group">
    <div class="hud-item">
      <div class="hud-label">Shield Integrity</div>
      <div id="hpBarWrap"><div id="hpBar"></div></div>
    </div>
  </div>
</div>

<div id="startScreen">
  <div class="screen-title">Void Runner</div>
  <div class="screen-sub">Pilot through the asteroid belt. Survive.</div>
  <button class="screen-btn" id="startBtn">Launch</button>
</div>

<div id="gameOverScreen">
  <div class="screen-title">Critical Failure</div>
  <div class="screen-sub">Your ship has been destroyed.</div>
  <div class="final-score" id="finalScore">0</div>
  <button class="screen-btn" id="restartBtn">Re-Deploy</button>
</div>

<div id="controlsHint">
  WASD / Arrows to move &middot; SPACE to fire &middot; Mouse to aim
</div>

<script>
// ============================================================
//  VOID RUNNER — 3D Space Shooter
// ============================================================
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true });

// --- Game State ---------------------------------------------------
const GAME = {
  state: 'menu', // menu, playing, gameover
  score: 0,
  wave: 1,
  hp: 100, maxHp: 100,
  playerPos: new BABYLON.Vector3(0, 0, 0),
  playerVel: new BABYLON.Vector3(0, 0, 0),
  speed: 22,
  fireCooldown: 0,
  fireRate: 0.12,
  invulnerable: 0,
  screenShake: 0,
  asteroids: [],
  enemies: [],
  lasers: [],
  enemyLasers: [],
  particles: [],
  stars: [],
  waveTimer: 0,
  spawnTimer: 0,
  difficulty: 1,
  killCount: 0
};

// --- Scene --------------------------------------------------------
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color3(0.01, 0.015, 0.03);

// Camera — third person chase
const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 6, -14), scene);
camera.setTarget(new BABYLON.Vector3(0, 0, 8));

// Lighting
const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0.3), scene);
hemi.intensity = 0.3;
hemi.groundColor = new BABYLON.Color3(0.05, 0.05, 0.1);

const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(0.3, -0.5, 1), scene);
sun.position = new BABYLON.Vector3(-20, 30, -40);
sun.intensity = 0.8;

const rim = new BABYLON.DirectionalLight("rim", new BABYLON.Vector3(-0.5, 0.2, -1), scene);
rim.position = new BABYLON.Vector3(20, 10, 40);
rim.intensity = 0.4;
rim.diffuse = new BABYLON.Color3(0.4, 0.5, 0.9);

// Glow layer for neon effects
const glow = new BABYLON.GlowLayer("glow", scene);
glow.intensity = 0.7;

// Fog for depth
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.012;
scene.fogColor = new BABYLON.Color3(0.01, 0.015, 0.03);

// --- Procedural Textures ------------------------------------------
function makeNoiseTex(size, baseR, baseG, baseB, variance) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(size, size);
  for(let i = 0; i < img.data.length; i += 4) {
    const v = (Math.random() - 0.5) * variance;
    img.data[i]   = Math.min(255, Math.max(0, baseR + v));
    img.data[i+1] = Math.min(255, Math.max(0, baseG + v));
    img.data[i+2] = Math.min(255, Math.max(0, baseB + v));
    img.data[i+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL();
}

function makeParticleTex() {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 64;
  const ctx = c.getContext("2d");
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.3, "rgba(255,255,255,0.6)");
  g.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return c.toDataURL();
}

// --- Materials ----------------------------------------------------
const hullMat = new BABYLON.StandardMaterial("hull", scene);
hullMat.diffuseTexture = new BABYLON.Texture(makeNoiseTex(256, 80, 90, 110, 40), scene);
hullMat.specularColor = new BABYLON.Color3(0.6, 0.7, 0.9);
hullMat.specularPower = 64;

const cockpitMat = new BABYLON.StandardMaterial("cockpit", scene);
cockpitMat.diffuseColor = new BABYLON.Color3(0.1, 0.15, 0.25);
cockpitMat.emissiveColor = new BABYLON.Color3(0.05, 0.1, 0.2);
cockpitMat.specularColor = new BABYLON.Color3(0.9, 0.95, 1);
cockpitMat.specularPower = 128;

const engineMat = new BABYLON.StandardMaterial("engine", scene);
engineMat.emissiveColor = new BABYLON.Color3(0.2, 0.7, 1.0);
engineMat.diffuseColor = new BABYLON.Color3(0, 0, 0);

const laserMat = new BABYLON.StandardMaterial("laser", scene);
laserMat.emissiveColor = new BABYLON.Color3(0.2, 0.9, 1.0);
laserMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
laserMat.alpha = 0.85;

const enemyLaserMat = new BABYLON.StandardMaterial("elaser", scene);
enemyLaserMat.emissiveColor = new BABYLON.Color3(1.0, 0.2, 0.1);
enemyLaserMat.diffuseColor = new BABYLON.Color3(0, 0, 0);
enemyLaserMat.alpha = 0.85;

const asteroidMat = new BABYLON.StandardMaterial("asteroid", scene);
asteroidMat.diffuseTexture = new BABYLON.Texture(makeNoiseTex(256, 90, 80, 70, 50), scene);
asteroidMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
asteroidMat.ambientColor = new BABYLON.Color3(0.2, 0.18, 0.15);

const enemyMat = new BABYLON.StandardMaterial("enemy", scene);
enemyMat.diffuseColor = new BABYLON.Color3(0.75, 0.15, 0.1);
enemyMat.emissiveColor = new BABYLON.Color3(0.15, 0.02, 0.01);
enemyMat.specularColor = new BABYLON.Color3(0.5, 0.1, 0.05);

const enemyCockpitMat = new BABYLON.StandardMaterial("ecockpit", scene);
enemyCockpitMat.emissiveColor = new BABYLON.Color3(0.9, 0.1, 0.05);
enemyCockpitMat.diffuseColor = new BABYLON.Color3(0, 0, 0);

// --- Starfield ----------------------------------------------------
const starCount = 1200;
const starMesh = new BABYLON.Mesh("stars", scene);
const starPositions = [];
const starColors = [];
for(let i = 0; i < starCount; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 200,
    (Math.random() - 0.5) * 120,
    Math.random() * 300
  );
  const brightness = 0.5 + Math.random() * 0.5;
  const tint = Math.random();
  if(tint < 0.7) {
    starColors.push(brightness, brightness, brightness, 1);
  } else if(tint < 0.85) {
    starColors.push(brightness, brightness * 0.9, brightness * 0.7, 1);
  } else {
    starColors.push(brightness * 0.7, brightness * 0.8, brightness, 1);
  }
}
const starVertexData = new BABYLON.VertexData();
starVertexData.positions = starPositions;
starVertexData.colors = starColors;
BABYLON.VertexData.ApplyToMesh(starMesh, starVertexData, true);
starMesh.hasVertexAlpha = false;
const starMat = new BABYLON.StandardMaterial("starMat", scene);
starMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
starMat.disableLighting = true;
starMat.pointsCloud = true;
starMat.pointSize = 2;
starMesh.material = starMat;

// --- Player Ship --------------------------------------------------
const playerRoot = new BABYLON.TransformNode("player", scene);

// Main fuselage
const fuselage = BABYLON.MeshBuilder.CreateBox("fuselage", {width: 1.2, height: 0.6, depth: 3.5}, scene);
fuselage.position.z = 0;
fuselage.parent = playerRoot;
fuselage.material = hullMat;

// Nose cone
const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {diameterTop: 0, diameterBottom: 1.0, height: 1.2, tessellation: 8}, scene);
nose.rotation.x = Math.PI / 2;
nose.position.z = 2.3;
nose.parent = playerRoot;
nose.material = hullMat;

// Wings
const wingL = BABYLON.MeshBuilder.CreateBox("wingL", {width: 2.5, height: 0.15, depth: 1.8}, scene);
wingL.position = new BABYLON.Vector3(-1.6, 0, -0.3);
wingL.parent = playerRoot;
wingL.material = hullMat;

const wingR = BABYLON.MeshBuilder.CreateBox("wingR", {width: 2.5, height: 0.15, depth: 1.8}, scene);
wingR.position = new BABYLON.Vector3(1.6, 0, -0.3);
wingR.parent = playerRoot;
wingR.material = hullMat;

// Wing tips (engines)
const engineL = BABYLON.MeshBuilder.CreateCylinder("engL", {diameter: 0.5, height: 0.8, tessellation: 12}, scene);
engineL.rotation.x = Math.PI / 2;
engineL.position = new BABYLON.Vector3(-2.8, 0, -1.0);
engineL.parent = playerRoot;
engineL.material = hullMat;

const engineR = BABYLON.MeshBuilder.CreateCylinder("engR", {diameter: 0.5, height: 0.8, tessellation: 12}, scene);
engineR.rotation.x = Math.PI / 2;
engineR.position = new BABYLON.Vector3(2.8, 0, -1.0);
engineR.parent = playerRoot;
engineR.material = hullMat;

// Engine glows
const glowL = BABYLON.MeshBuilder.CreateCylinder("glowL", {diameter: 0.35, height: 0.1, tessellation: 12}, scene);
glowL.rotation.x = Math.PI / 2;
glowL.position = new BABYLON.Vector3(-2.8, 0, -1.45);
glowL.parent = playerRoot;
glowL.material = engineMat;

const glowR = BABYLON.MeshBuilder.CreateCylinder("glowR", {diameter: 0.35, height: 0.1, tessellation: 12}, scene);
glowR.rotation.x = Math.PI / 2;
glowR.position = new BABYLON.Vector3(2.8, 0, -1.45);
glowR.parent = playerRoot;
glowR.material = engineMat;

// Cockpit
const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", {diameter: 0.9, slice: 0.5}, scene);
cockpit.position = new BABYLON.Vector3(0, 0.45, 0.8);
cockpit.parent = playerRoot;
cockpit.material = cockpitMat;

// Engine trail particles
function createEngineTrail(offsetX) {
  const ps = new BABYLON.ParticleSystem("trail", 200, scene);
  ps.particleTexture = new BABYLON.Texture(makeParticleTex(), scene);
  ps.emitter = new BABYLON.Vector3(offsetX, 0, -1.6);
  ps.minEmitBox = new BABYLON.Vector3(-0.1, -0.1, 0);
  ps.maxEmitBox = new BABYLON.Vector3(0.1, 0.1, 0);
  ps.color1 = new BABYLON.Color4(0.2, 0.7, 1.0, 0.6);
  ps.color2 = new BABYLON.Color4(0.1, 0.4, 0.8, 0.3);
  ps.colorDead = new BABYLON.Color4(0.05, 0.1, 0.3, 0);
  ps.minSize = 0.1; ps.maxSize = 0.35;
  ps.minLifeTime = 0.3; ps.maxLifeTime = 0.8;
  ps.emitRate = 80;
  ps.gravity = new BABYLON.Vector3(0, 0, 0);
  ps.direction1 = new BABYLON.Vector3(0, 0, -4);
  ps.direction2 = new BABYLON.Vector3(0, 0, -7);
  ps.minEmitPower = 2; ps.maxEmitPower = 5;
  ps.updateSpeed = 0.01;
  ps.start();
  return ps;
}

const trailL = createEngineTrail(-2.8);
const trailR = createEngineTrail(2.8);

// --- Input --------------------------------------------------------
const keys = {};
let mouseX = 0, mouseY = 0;
window.addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  mouseX = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouseY = -((e.clientY - rect.top) / rect.height) * 2 + 1;
});

// --- Spawners -----------------------------------------------------
function spawnAsteroid() {
  const size = 1.2 + Math.random() * 2.5;
  const asteroid = BABYLON.MeshBuilder.CreatePolyhedron("ast", {type: 1, size: size}, scene);
  asteroid.position = new BABYLON.Vector3(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 25,
    120 + Math.random() * 40
  );
  asteroid.rotation = new BABYLON.Vector3(Math.random()*6, Math.random()*6, Math.random()*6);
  asteroid.material = asteroidMat;

  const data = {
    mesh: asteroid,
    rotSpeed: new BABYLON.Vector3(
      (Math.random()-0.5)*1.5,
      (Math.random()-0.5)*1.5,
      (Math.random()-0.5)*1.5
    ),
    vel: new BABYLON.Vector3(
      (Math.random()-0.5)*3,
      (Math.random()-0.5)*2,
      -(8 + Math.random()*6 + GAME.difficulty*2)
    ),
    hp: Math.floor(size * 2),
    size: size
  };
  GAME.asteroids.push(data);
}

function spawnEnemy() {
  const enemyRoot = new BABYLON.TransformNode("enemy", scene);
  enemyRoot.position = new BABYLON.Vector3(
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 15,
    100 + Math.random() * 30
  );

  // Enemy body
  const body = BABYLON.MeshBuilder.CreateBox("eb", {width: 2.2, height: 0.7, depth: 2.8}, scene);
  body.position.y = 0;
  body.parent = enemyRoot;
  body.material = enemyMat;

  // Enemy wings
  const ewL = BABYLON.MeshBuilder.CreateBox("ewL", {width: 3.0, height: 0.12, depth: 1.2}, scene);
  ewL.position = new BABYLON.Vector3(-2.0, 0, 0.2);
  ewL.parent = enemyRoot;
  ewL.material = enemyMat;

  const ewR = BABYLON.MeshBuilder.CreateBox("ewR", {width: 3.0, height: 0.12, depth: 1.2}, scene);
  ewR.position = new BABYLON.Vector3(2.0, 0, 0.2);
  ewR.parent = enemyRoot;
  ewR.material = enemyMat;

  // Enemy cockpit
  const ec = BABYLON.MeshBuilder.CreateSphere("ec", {diameter: 0.7}, scene);
  ec.position = new BABYLON.Vector3(0, 0.4, 0.6);
  ec.parent = enemyRoot;
  ec.material = enemyCockpitMat;

  const data = {
    root: enemyRoot,
    pos: enemyRoot.position.clone(),
    vel: new BABYLON.Vector3(0, 0, -(10 + Math.random()*5 + GAME.difficulty*3)),
    hp: 3 + Math.floor(GAME.difficulty),
    fireCooldown: 1.5 + Math.random(),
    swayOffset: Math.random() * Math.PI * 2,
    alive: true
  };
  GAME.enemies.push(data);
}

function fireLaser(from, dir, isPlayer) {
  const laser = BABYLON.MeshBuilder.CreateCylinder("laser", {diameter: 0.12, height: 2.5}, scene);
  laser.rotation.x = Math.PI / 2;
  laser.position = from.clone();
  laser.material = isPlayer ? laserMat : enemyLaserMat;

  const data = {
    mesh: laser,
    pos: from.clone(),
    vel: dir.scale(isPlayer ? 90 : 50),
    isPlayer: isPlayer,
    life: 2.5
  };
  if(isPlayer) GAME.lasers.push(data);
  else GAME.enemyLasers.push(data);
}

// --- Explosions ---------------------------------------------------
function spawnExplosion(pos, color, scale) {
  const s = scale || 1;

  // Flash
  const flash = BABYLON.MeshBuilder.CreateSphere("flash", {diameter: 2*s}, scene);
  flash.position = pos.clone();
  const fm = new BABYLON.StandardMaterial("fm", scene);
  fm.emissiveColor = color;
  fm.diffuseColor = new BABYLON.Color3(0,0,0);
  fm.alpha = 0.7;
  flash.material = fm;

  let flashLife = 0.15;
  const flashAnim = () => {
    flashLife -= 0.016;
    if(flashLife > 0) {
      flash.scaling = new BABYLON.Vector3(1 + (0.15-flashLife)*10, 1 + (0.15-flashLife)*10, 1 + (0.15-flashLife)*10);
      fm.alpha = flashLife / 0.15 * 0.7;
      requestAnimationFrame(flashAnim);
    } else {
      flash.dispose();
    }
  };
  flashAnim();

  // Particle burst
  const ps = new BABYLON.ParticleSystem("exp", 100, scene);
  ps.particleTexture = new BABYLON.Texture(makeParticleTex(), scene);
  ps.emitter = pos;
  ps.minEmitBox = new BABYLON.Vector3(-0.3*s, -0.3*s, -0.3*s);
  ps.maxEmitBox = new BABYLON.Vector3(0.3*s, 0.3*s, 0.3*s);
  ps.color1 = new BABYLON.Color4(color.r, color.g, color.b, 0.9);
  ps.color2 = new BABYLON.Color4(color.r*0.6, color.g*0.4, color.b*0.2, 0.5);
  ps.colorDead = new BABYLON.Color4(0.1, 0.05, 0.02, 0);
  ps.minSize = 0.1*s; ps.maxSize = 0.5*s;
  ps.minLifeTime = 0.2; ps.maxLifeTime = 0.8;
  ps.emitRate = 500;
  ps.gravity = new BABYLON.Vector3(0, 0, 0);
  ps.direction1 = new BABYLON.Vector3(-1, -1, -1);
  ps.direction2 = new BABYLON.Vector3(1, 1, 1);
  ps.minEmitPower = 3*s; ps.maxEmitPower = 10*s;
  ps.updateSpeed = 0.01;
  ps.targetStopDuration = 0.12;
  ps.start();
  setTimeout(() => ps.dispose(), 1500);

  // Secondary sparks
  const ps2 = new BABYLON.ParticleSystem("sparks", 60, scene);
  ps2.particleTexture = new BABYLON.Texture(makeParticleTex(), scene);
  ps2.emitter = pos;
  ps2.minEmitBox = new BABYLON.Vector3(-0.1*s, -0.1*s, -0.1*s);
  ps2.maxEmitBox = new BABYLON.Vector3(0.1*s, 0.1*s, 0.1*s);
  ps2.color1 = new BABYLON.Color4(1, 0.9, 0.5, 0.8);
  ps2.color2 = new BABYLON.Color4(1, 0.6, 0.1, 0.5);
  ps2.colorDead = new BABYLON.Color4(0.3, 0.1, 0, 0);
  ps2.minSize = 0.05*s; ps2.maxSize = 0.2*s;
  ps2.minLifeTime = 0.1; ps2.maxLifeTime = 0.4;
  ps2.emitRate = 400;
  ps2.gravity = new BABYLON.Vector3(0, 0, 0);
  ps2.direction1 = new BABYLON.Vector3(-2, -2, -2);
  ps2.direction2 = new BABYLON.Vector3(2, 2, 2);
  ps2.minEmitPower = 5*s; ps2.maxEmitPower = 15*s;
  ps2.updateSpeed = 0.01;
  ps2.targetStopDuration = 0.08;
  ps2.start();
  setTimeout(() => ps2.dispose(), 1000);
}

// --- Game Logic ---------------------------------------------------
function resetGame() {
  GAME.state = 'playing';
  GAME.score = 0;
  GAME.wave = 1;
  GAME.hp = 100;
  GAME.playerPos = new BABYLON.Vector3(0, 0, 0);
  GAME.playerVel = new BABYLON.Vector3(0, 0, 0);
  GAME.fireCooldown = 0;
  GAME.invulnerable = 0;
  GAME.screenShake = 0;
  GAME.difficulty = 1;
  GAME.killCount = 0;
  GAME.waveTimer = 0;
  GAME.spawnTimer = 0;

  // Clear entities
  for(let a of GAME.asteroids) a.mesh.dispose();
  GAME.asteroids = [];
  for(let e of GAME.enemies) { e.root.dispose(); }
  GAME.enemies = [];
  for(let l of GAME.lasers) l.mesh.dispose();
  GAME.lasers = [];
  for(let l of GAME.enemyLasers) l.mesh.dispose();
  GAME.enemyLasers = [];

  playerRoot.position = GAME.playerPos;
  playerRoot.rotation = new BABYLON.Vector3(0, 0, 0);

  updateHUD();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
}

function updateHUD() {
  document.getElementById('scoreVal').textContent = GAME.score;
  document.getElementById('waveVal').textContent = GAME.wave;
  const hpPct = Math.max(0, GAME.hp);
  const bar = document.getElementById('hpBar');
  bar.style.width = hpPct + '%';
  if(hpPct > 60) bar.style.background = 'linear-gradient(90deg,#66bb6a,#43a047)';
  else if(hpPct > 30) bar.style.background = 'linear-gradient(90deg,#ffa726,#f57c00)';
  else bar.style.background = 'linear-gradient(90deg,#ef5350,#c62828)';
}

function damagePlayer(amount) {
  if(GAME.invulnerable > 0) return;
  GAME.hp -= amount;
  GAME.invulnerable = 1.0;
  GAME.screenShake = 0.25;
  updateHUD();
  if(GAME.hp <= 0) {
    GAME.hp = 0;
    GAME.state = 'gameover';
    spawnExplosion(GAME.playerPos, new BABYLON.Color3(0.2, 0.7, 1.0), 2.5);
    playerRoot.setEnabled(false);
    document.getElementById('finalScore').textContent = GAME.score;
    document.getElementById('gameOverScreen').style.display = 'flex';
    document.getElementById('hud').style.display = 'none';
  }
}

// --- Main Loop ----------------------------------------------------
let time = 0;
scene.registerBeforeRender(() => {
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
  time += dt;

  // Starfield scroll
  const starPos = starMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
  for(let i = 2; i < starPos.length; i += 3) {
    starPos[i] -= 30 * dt;
    if(starPos[i] < -20) starPos[i] += 300;
  }
  starMesh.updateVerticesData(BABYLON.VertexBuffer.PositionKind, starPos);

  if(GAME.state !== 'playing') {
    // Menu idle animation
    if(GAME.state === 'menu') {
      playerRoot.position.x = Math.sin(time * 0.5) * 2;
      playerRoot.position.y = Math.sin(time * 0.8) * 0.5;
      playerRoot.rotation.z = Math.sin(time * 0.5) * 0.05;
      camera.position.x = playerRoot.position.x * 0.3;
      camera.position.y = 6 + playerRoot.position.y * 0.3;
    }
    return;
  }

  // Player movement
  let moveX = 0, moveY = 0;
  if(keys['a'] || keys['arrowleft']) moveX -= 1;
  if(keys['d'] || keys['arrowright']) moveX += 1;
  if(keys['w'] || keys['arrowup']) moveY += 1;
  if(keys['s'] || keys['arrowdown']) moveY -= 1;

  // Mouse aim influence (subtle)
  moveX += mouseX * 0.5;
  moveY += mouseY * 0.5;

  // Clamp
  moveX = Math.max(-1, Math.min(1, moveX));
  moveY = Math.max(-1, Math.min(1, moveY));

  const targetX = moveX * 18;
  const targetY = moveY * 10;
  GAME.playerPos.x += (targetX - GAME.playerPos.x) * 4 * dt;
  GAME.playerPos.y += (targetY - GAME.playerPos.y) * 4 * dt;

  // Tilt based on movement
  const tiltZ = -moveX * 0.35;
  const tiltX = moveY * 0.2;
  playerRoot.rotation.z += (tiltZ - playerRoot.rotation.z) * 6 * dt;
  playerRoot.rotation.x += (tiltX - playerRoot.rotation.x) * 6 * dt;
  playerRoot.position = GAME.playerPos.clone();

  // Camera follow with lag
  const camTargetX = GAME.playerPos.x * 0.4;
  const camTargetY = 6 + GAME.playerPos.y * 0.3;
  camera.position.x += (camTargetX - camera.position.x) * 3 * dt;
  camera.position.y += (camTargetY - camera.position.y) * 3 * dt;
  camera.setTarget(new BABYLON.Vector3(GAME.playerPos.x * 0.2, GAME.playerPos.y * 0.2, 8));

  // Screen shake
  if(GAME.screenShake > 0) {
    GAME.screenShake -= dt;
    const shakeAmt = GAME.screenShake * 0.4;
    camera.position.x += (Math.random() - 0.5) * shakeAmt;
    camera.position.y += (Math.random() - 0.5) * shakeAmt;
  }

  // Invulnerability blink
  if(GAME.invulnerable > 0) {
    GAME.invulnerable -= dt;
    playerRoot.setEnabled(Math.floor(time * 15) % 2 === 0);
  } else {
    playerRoot.setEnabled(true);
  }

  // Firing
  GAME.fireCooldown -= dt;
  if((keys[' '] || keys['space']) && GAME.fireCooldown <= 0) {
    fireLaser(
      new BABYLON.Vector3(GAME.playerPos.x - 0.4, GAME.playerPos.y, GAME.playerPos.z + 2.5),
      new BABYLON.Vector3(0, 0, 1), true
    );
    fireLaser(
      new BABYLON.Vector3(GAME.playerPos.x + 0.4, GAME.playerPos.y, GAME.playerPos.z + 2.5),
      new BABYLON.Vector3(0, 0, 1), true
    );
    GAME.fireCooldown = GAME.fireRate;
  }

  // Spawning
  GAME.spawnTimer -= dt;
  if(GAME.spawnTimer <= 0) {
    const spawnRoll = Math.random();
    if(spawnRoll < 0.55) spawnAsteroid();
    else if(GAME.wave >= 2 || GAME.killCount > 5) spawnEnemy();
    GAME.spawnTimer = Math.max(0.3, 1.2 - GAME.difficulty * 0.08);
  }

  GAME.waveTimer += dt;
  if(GAME.waveTimer > 20) {
    GAME.waveTimer = 0;
    GAME.wave++;
    GAME.difficulty += 0.4;
    updateHUD();
  }

  // Update asteroids
  for(let i = GAME.asteroids.length - 1; i >= 0; i--) {
    const a = GAME.asteroids[i];
    a.mesh.position.addInPlace(a.vel.scale(dt));
    a.mesh.rotation.addInPlace(a.rotSpeed.scale(dt));

    // Collision with player
    const dist = BABYLON.Vector3.Distance(a.mesh.position, GAME.playerPos);
    if(dist < a.size + 1.2) {
      damagePlayer(15);
      spawnExplosion(a.mesh.position, new BABYLON.Color3(0.7, 0.6, 0.5), a.size * 0.6);
      a.mesh.dispose();
      GAME.asteroids.splice(i, 1);
      continue;
    }

    // Collision with lasers
    for(let j = GAME.lasers.length - 1; j >= 0; j--) {
      const l = GAME.lasers[j];
      if(BABYLON.Vector3.Distance(l.pos, a.mesh.position) < a.size + 0.5) {
        a.hp--;
        l.life = 0; // destroy laser
        spawnExplosion(l.pos, new BABYLON.Color3(0.2, 0.9, 1.0), 0.5);
        if(a.hp <= 0) {
          spawnExplosion(a.mesh.position, new BABYLON.Color3(0.7, 0.6, 0.5), a.size * 0.8);
          GAME.score += Math.floor(a.size * 10);
          a.mesh.dispose();
          GAME.asteroids.splice(i, 1);
        }
        break;
      }
    }

    if(a.mesh.position.z < -30) {
      a.mesh.dispose();
      GAME.asteroids.splice(i, 1);
    }
  }

  // Update enemies
  for(let i = GAME.enemies.length - 1; i >= 0; i--) {
    const e = GAME.enemies[i];
    if(!e.alive) continue;

    // Sway movement
    e.pos.x += Math.sin(time * 2 + e.swayOffset) * 3 * dt;
    e.pos.addInPlace(e.vel.scale(dt));
    e.root.position = e.pos.clone();

    // Face player slightly
    const toPlayer = GAME.playerPos.subtract(e.pos);
    toPlayer.normalize();
    e.root.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
    e.root.rotation.x = -toPlayer.y * 0.3;

    // Fire at player
    e.fireCooldown -= dt;
    if(e.fireCooldown <= 0 && e.pos.z > 20 && e.pos.z < 90) {
      const aim = GAME.playerPos.subtract(e.pos).normalize();
      fireLaser(new BABYLON.Vector3(e.pos.x, e.pos.y, e.pos.z + 1.5), aim, false);
      e.fireCooldown = 2.0 - Math.min(1.2, GAME.difficulty * 0.15);
    }

    // Collision with player
    if(BABYLON.Vector3.Distance(e.pos, GAME.playerPos) < 2.5) {
      damagePlayer(20);
      spawnExplosion(e.pos, new BABYLON.Color3(0.9, 0.2, 0.1), 1.5);
      e.root.dispose();
      GAME.enemies.splice(i, 1);
      continue;
    }

    // Collision with lasers
    for(let j = GAME.lasers.length - 1; j >= 0; j--) {
      const l = GAME.lasers[j];
      if(BABYLON.Vector3.Distance(l.pos, e.pos) < 2.0) {
        e.hp--;
        l.life = 0;
        spawnExplosion(l.pos, new BABYLON.Color3(0.2, 0.9, 1.0), 0.6);
        if(e.hp <= 0) {
          spawnExplosion(e.pos, new BABYLON.Color3(0.9, 0.2, 0.1), 1.5);
          GAME.score += 50 * GAME.wave;
          GAME.killCount++;
          e.root.dispose();
          GAME.enemies.splice(i, 1);
        }
        break;
      }
    }

    if(e.pos.z < -30) {
      e.root.dispose();
      GAME.enemies.splice(i, 1);
    }
  }

  // Update player lasers
  for(let i = GAME.lasers.length - 1; i >= 0; i--) {
    const l = GAME.lasers[i];
    l.pos.addInPlace(l.vel.scale(dt));
    l.mesh.position = l.pos.clone();
    l.life -= dt;
    if(l.life <= 0 || l.pos.z > 150) {
      l.mesh.dispose();
      GAME.lasers.splice(i, 1);
    }
  }

  // Update enemy lasers
  for(let i = GAME.enemyLasers.length - 1; i >= 0; i--) {
    const l = GAME.enemyLasers[i];
    l.pos.addInPlace(l.vel.scale(dt));
    l.mesh.position = l.pos.clone();
    l.life -= dt;

    // Hit player
    if(BABYLON.Vector3.Distance(l.pos, GAME.playerPos) < 1.5) {
      damagePlayer(10);
      spawnExplosion(l.pos, new BABYLON.Color3(1.0, 0.3, 0.1), 0.8);
      l.mesh.dispose();
      GAME.enemyLasers.splice(i, 1);
      continue;
    }

    if(l.life <= 0 || l.pos.z < -30) {
      l.mesh.dispose();
      GAME.enemyLasers.splice(i, 1);
    }
  }

  // Passive score
  GAME.score += Math.floor(dt * 10 * GAME.wave);
  updateHUD();
});

// --- UI Handlers --------------------------------------------------
document.getElementById('startBtn').addEventListener('click', () => {
  resetGame();
});

document.getElementById('restartBtn').addEventListener('click', () => {
  playerRoot.setEnabled(true);
  resetGame();
});

// Start render
engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());
</script>
