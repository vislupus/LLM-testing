<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Cosmic Defender - Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #gameContainer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5),
                        0 0 60px rgba(0, 255, 255, 0.3),
                        inset 0 0 30px rgba(0, 255, 255, 0.1);
            border-radius: 5px;
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 15px;
        }

        .hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            color: #0ff;
            font-size: 18px;
            text-shadow: 0 0 10px #0ff;
        }

        .hud-left, .hud-right {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .health-bar {
            width: 150px;
            height: 15px;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #f00;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #f00, #ff6600);
            transition: width 0.3s;
            box-shadow: 0 0 10px #f00;
        }

        .energy-bar {
            width: 150px;
            height: 10px;
            background: rgba(0, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #0ff;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #0ff, #00ff88);
            transition: width 0.1s;
            box-shadow: 0 0 10px #0ff;
        }

        /* Menu Screens */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            pointer-events: auto;
            z-index: 100;
        }

        .screen.hidden {
            display: none;
        }

        .title {
            font-size: 48px;
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff; }
            to { text-shadow: 0 0 30px #0ff, 0 0 60px #0ff, 0 0 80px #0ff; }
        }

        .subtitle {
            font-size: 20px;
            color: #888;
            margin-bottom: 40px;
        }

        .btn {
            padding: 15px 50px;
            font-size: 20px;
            font-family: inherit;
            background: linear-gradient(135deg, #0ff, #0088ff);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.8);
        }

        .instructions {
            color: #888;
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.8;
        }

        .instructions span {
            color: #0ff;
            background: rgba(0, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 4px;
            margin: 0 3px;
        }

        .score-display {
            font-size: 36px;
            color: #ff0;
            text-shadow: 0 0 20px #ff0;
            margin: 20px 0;
        }

        .stats {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 20px;
        }

        /* Power-up indicators */
        .powerup-indicator {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .powerup-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            opacity: 0.3;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .powerup-icon.active {
            opacity: 1;
            box-shadow: 0 0 20px currentColor;
        }

        .powerup-icon.shield {
            background: rgba(0, 255, 255, 0.3);
            border-color: #0ff;
            color: #0ff;
        }

        .powerup-icon.rapid {
            background: rgba(255, 255, 0, 0.3);
            border-color: #ff0;
            color: #ff0;
        }

        .powerup-icon.spread {
            background: rgba(255, 0, 255, 0.3);
            border-color: #f0f;
            color: #f0f;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="ui">
            <div class="hud">
                <div class="hud-left">
                    <div class="hud-item">
                        <div>HEALTH</div>
                        <div class="health-bar">
                            <div class="health-fill" id="healthFill"></div>
                        </div>
                    </div>
                    <div class="hud-item">
                        <div>ENERGY</div>
                        <div class="energy-bar">
                            <div class="energy-fill" id="energyFill"></div>
                        </div>
                    </div>
                </div>
                <div class="hud-right">
                    <div class="hud-item">SCORE: <span id="scoreDisplay">0</span></div>
                    <div class="hud-item">WAVE: <span id="waveDisplay">1</span></div>
                    <div class="hud-item">LIVES: <span id="livesDisplay">3</span></div>
                </div>
            </div>
            
            <!-- Power-up indicators -->
            <div class="powerup-indicator">
                <div class="powerup-icon shield" id="shieldIcon">🛡️</div>
                <div class="powerup-icon rapid" id="rapidIcon">⚡</div>
                <div class="powerup-icon spread" id="spreadIcon">💥</div>
            </div>
        </div>
        
        <!-- Start Screen -->
        <div class="screen" id="startScreen">
            <div class="title">🚀 COSMIC DEFENDER</div>
            <div class="subtitle">Space Shooter</div>
            <button class="btn" onclick="startGame()">START MISSION</button>
            <div class="instructions">
                <span>↑↓←→</span> or <span>WASD</span> to move<br>
                <span>SPACE</span> or <span>CLICK</span> to fire<br>
                <span>P</span> to pause<br><br>
                Destroy asteroids and aliens. Collect power-ups!
            </div>
        </div>
        
        <!-- Game Over Screen -->
        <div class="screen hidden" id="gameOverScreen">
            <div class="title" style="color: #f44;">GAME OVER</div>
            <div class="score-display">Score: <span id="finalScore">0</span></div>
            <div class="stats">
                Waves Survived: <span id="finalWave">1</span><br>
                Enemies Destroyed: <span id="finalEnemies">0</span><br>
                Asteroids Destroyed: <span id="finalAsteroids">0</span>
            </div>
            <button class="btn" onclick="startGame()">PLAY AGAIN</button>
        </div>
        
        <!-- Pause Screen -->
        <div class="screen hidden" id="pauseScreen">
            <div class="title">PAUSED</div>
            <button class="btn" onclick="togglePause()">RESUME</button>
        </div>
    </div>

    <script>
        // ============================================
        // GAME CONFIGURATION
        // ============================================
        const CONFIG = {
            width: 900,
            height: 700,
            playerSpeed: 6,
            bulletSpeed: 12,
            asteroidBaseSpeed: 2,
            alienBaseSpeed: 1.5,
            spawnRate: 60,
            maxAsteroids: 15,
            maxAliens: 8,
            particleCount: 30,
            starLayers: 3
        };

        // ============================================
        // GAME STATE
        // ============================================
        let canvas, ctx;
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let lives = 3;
        let wave = 1;
        let enemiesDestroyed = 0;
        let asteroidsDestroyed = 0;
        let frameCount = 0;

        // Game objects
        let player = null;
        let bullets = [];
        let asteroids = [];
        let aliens = [];
        let alienBullets = [];
        let particles = [];
        let powerUps = [];
        let stars = [];

        // Input state
        let keys = {};
        let mouseDown = false;

        // ============================================
        // ASSET GENERATION (Procedural Graphics)
        // ============================================
        const Assets = {
            // Create player ship SVG-like drawing
            drawPlayer(ctx, x, y, angle, shield = false) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(angle);
                
                // Engine glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#0ff';
                
                // Ship body
                ctx.beginPath();
                ctx.moveTo(0, -25);
                ctx.lineTo(-15, 20);
                ctx.lineTo(-5, 15);
                ctx.lineTo(0, 20);
                ctx.lineTo(5, 15);
                ctx.lineTo(15, 20);
                ctx.closePath();
                
                // Gradient fill
                const gradient = ctx.createLinearGradient(0, -25, 0, 20);
                gradient.addColorStop(0, '#0ff');
                gradient.addColorStop(0.5, '#0088ff');
                gradient.addColorStop(1, '#004488');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Cockpit
                ctx.beginPath();
                ctx.ellipse(0, -5, 5, 10, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#88ffff';
                ctx.fill();
                
                // Engine flames
                if (keys['ArrowUp'] || keys['KeyW']) {
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = '#f80';
                    ctx.beginPath();
                    ctx.moveTo(-5, 20);
                    ctx.lineTo(0, 35 + Math.random() * 10);
                    ctx.lineTo(5, 20);
                    ctx.closePath();
                    const flameGrad = ctx.createLinearGradient(0, 20, 0, 45);
                    flameGrad.addColorStop(0, '#ff0');
                    flameGrad.addColorStop(0.5, '#f80');
                    flameGrad.addColorStop(1, 'transparent');
                    ctx.fillStyle = flameGrad;
                    ctx.fill();
                }
                
                // Shield effect
                if (shield) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = '#0ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 30, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                
                ctx.restore();
            },

            // Draw asteroid
            drawAsteroid(ctx, x, y, size, rotation, vertices) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                
                ctx.beginPath();
                for (let i = 0; i < vertices.length; i++) {
                    const v = vertices[i];
                    if (i === 0) ctx.moveTo(v.x, v.y);
                    else ctx.lineTo(v.x, v.y);
                }
                ctx.closePath();
                
                // Rocky texture gradient
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, size);
                gradient.addColorStop(0, '#666');
                gradient.addColorStop(0.5, '#444');
                gradient.addColorStop(1, '#222');
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Crater details
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(size * 0.3, -size * 0.2, size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-size * 0.2, size * 0.3, size * 0.1, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            },

            // Draw alien ship
            drawAlien(ctx, x, y, type, rotation, pulse) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);
                
                const pulseScale = 1 + Math.sin(pulse) * 0.1;
                ctx.scale(pulseScale, pulseScale);
                
                if (type === 0) {
                    // Saucer type
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#f0f';
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 25, 10, 0, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(0, -5, 0, 0, 0, 25);
                    grad.addColorStop(0, '#ff00ff');
                    grad.addColorStop(1, '#440044');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    // Dome
                    ctx.beginPath();
                    ctx.ellipse(0, -5, 12, 8, 0, Math.PI, 0);
                    ctx.fillStyle = '#ff88ff';
                    ctx.fill();
                    
                    // Lights
                    for (let i = 0; i < 5; i++) {
                        ctx.beginPath();
                        ctx.arc(Math.cos(i * Math.PI * 0.4) * 20, 3, 2, 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${Date.now() * 0.1 + i * 50}, 100%, 70%)`;
                        ctx.fill();
                    }
                } else {
                    // Fighter type
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#0f0';
                    
                    ctx.beginPath();
                    ctx.moveTo(0, -20);
                    ctx.lineTo(-20, 15);
                    ctx.lineTo(0, 5);
                    ctx.lineTo(20, 15);
                    ctx.closePath();
                    
                    const grad = ctx.createLinearGradient(0, -20, 0, 15);
                    grad.addColorStop(0, '#0f0');
                    grad.addColorStop(1, '#004400');
                    ctx.fillStyle = grad;
                    ctx.fill();
                    
                    // Eye
                    ctx.beginPath();
                    ctx.arc(0, -5, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#f00';
                    ctx.fill();
                }
                
                ctx.restore();
            },

            // Draw bullet
            drawBullet(ctx, x, y, isPlayer) {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = isPlayer ? '#0ff' : '#f00';
                
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 8);
                if (isPlayer) {
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.5, '#0ff');
                    gradient.addColorStop(1, 'transparent');
                } else {
                    gradient.addColorStop(0, '#fff');
                    gradient.addColorStop(0.5, '#f00');
                    gradient.addColorStop(1, 'transparent');
                }
                
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                ctx.restore();
            },

            // Draw power-up
            drawPowerUp(ctx, x, y, type, pulse) {
                ctx.save();
                ctx.translate(x, y);
                
                const scale = 1 + Math.sin(pulse) * 0.2;
                ctx.scale(scale, scale);
                
                ctx.shadowBlur = 20;
                
                let color, symbol;
                switch(type) {
                    case 'shield':
                        color = '#0ff';
                        symbol = '🛡️';
                        break;
                    case 'rapid':
                        color = '#ff0';
                        symbol = '⚡';
                        break;
                    case 'spread':
                        color = '#f0f';
                        symbol = '💥';
                        break;
                    case 'health':
                        color = '#0f0';
                        symbol = '❤️';
                        break;
                }
                
                ctx.shadowColor = color;
                
                // Outer glow
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.fillStyle = color + '33';
                ctx.fill();
                
                // Inner circle
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Symbol
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(symbol, 0, 0);
                
                ctx.restore();
            }
        };

        // ============================================
        // PARTICLE SYSTEM
        // ============================================
        class Particle {
            constructor(x, y, color, speed = 3, size = 3, life = 60) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.life = life;
                this.maxLife = life;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * speed + 1;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.gravity = 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.life--;
                this.size *= 0.97;
            }

            draw(ctx) {
                const alpha = this.life / this.maxLife;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color, count = CONFIG.particleCount) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 5, 4, 40 + Math.random() * 20));
            }
        }

        function createSparkle(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 2, 2, 20 + Math.random() * 10));
            }
        }

        // ============================================
        // STAR BACKGROUND
        // ============================================
        function initStars() {
            stars = [];
            for (let layer = 0; layer < CONFIG.starLayers; layer++) {
                const layerStars = [];
                const count = 50 + layer * 30;
                for (let i = 0; i < count; i++) {
                    layerStars.push({
                        x: Math.random() * CONFIG.width,
                        y: Math.random() * CONFIG.height,
                        size: (CONFIG.starLayers - layer) * 1.5,
                        speed: (layer + 1) * 0.5,
                        brightness: 0.3 + Math.random() * 0.7
                    });
                }
                stars.push(layerStars);
            }
        }

        function updateStars() {
            stars.forEach((layer, layerIndex) => {
                layer.forEach(star => {
                    star.y += star.speed;
                    if (star.y > CONFIG.height) {
                        star.y = 0;
                        star.x = Math.random() * CONFIG.width;
                    }
                });
            });
        }

        function drawStars() {
            stars.forEach((layer, layerIndex) => {
                layer.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    const alpha = star.brightness * (0.5 + Math.sin(Date.now() * 0.003 + star.x) * 0.2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                });
            });
        }

        // ============================================
        // PLAYER
        // ============================================
        class Player {
            constructor() {
                this.x = CONFIG.width / 2;
                this.y = CONFIG.height - 80;
                this.width = 30;
                this.height = 45;
                this.speed = CONFIG.playerSpeed;
                this.health = 100;
                this.maxHealth = 100;
                this.energy = 100;
                this.maxEnergy = 100;
                this.fireRate = 10;
                this.lastShot = 0;
                this.shield = false;
                this.shieldTimer = 0;
                this.rapid = false;
                this.rapidTimer = 0;
                this.spread = false;
                this.spreadTimer = 0;
                this.invincible = false;
                this.invincibleTimer = 0;
            }

            update() {
                // Movement
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
                if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
                if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

                // Boundary
                this.x = Math.max(20, Math.min(CONFIG.width - 20, this.x));
                this.y = Math.max(30, Math.min(CONFIG.height - 30, this.y));

                // Energy regen
                this.energy = Math.min(this.maxEnergy, this.energy + 0.5);

                // Power-up timers
                if (this.shield && Date.now() - this.shieldTimer > 8000) {
                    this.shield = false;
                    document.getElementById('shieldIcon').classList.remove('active');
                }
                if (this.rapid && Date.now() - this.rapidTimer > 6000) {
                    this.rapid = false;
                    this.fireRate = 10;
                    document.getElementById('rapidIcon').classList.remove('active');
                }
                if (this.spread && Date.now() - this.spreadTimer > 7000) {
                    this.spread = false;
                    document.getElementById('spreadIcon').classList.remove('active');
                }
                if (this.invincible && Date.now() - this.invincibleTimer > 2000) {
                    this.invincible = false;
                }

                // Shooting
                if ((keys['Space'] || mouseDown) && frameCount - this.lastShot > this.fireRate) {
                    this.shoot();
                }
            }

            shoot() {
                if (this.energy < 5) return;
                this.energy -= 5;
                this.lastShot = frameCount;

                if (this.spread) {
                    // Spread shot - 3 bullets
                    bullets.push({ x: this.x, y: this.y - 20, vx: 0, vy: -CONFIG.bulletSpeed });
                    bullets.push({ x: this.x - 10, y: this.y - 15, vx: -2, vy: -CONFIG.bulletSpeed });
                    bullets.push({ x: this.x + 10, y: this.y - 15, vx: 2, vy: -CONFIG.bulletSpeed });
                } else {
                    bullets.push({ x: this.x, y: this.y - 20, vx: 0, vy: -CONFIG.bulletSpeed });
                }

                createSparkle(this.x, this.y - 20, '#0ff', 3);
            }

            draw() {
                if (this.invincible && frameCount % 6 < 3) return; // Blinking effect
                Assets.drawPlayer(ctx, this.x, this.y, 0, this.shield);
            }

            takeDamage(amount) {
                if (this.invincible) return;
                if (this.shield) {
                    createSparkle(this.x, this.y, '#0ff', 15);
                    return;
                }
                
                this.health -= amount;
                this.invincible = true;
                this.invincibleTimer = Date.now();
                createExplosion(this.x, this.y, '#f00', 15);
                
                if (this.health <= 0) {
                    loseLife();
                }
                
                updateHUD();
            }
        }

        // ============================================
        // ASTEROIDS
        // ============================================
        class Asteroid {
            constructor(x, y, size) {
                this.x = x || Math.random() * CONFIG.width;
                this.y = y || -50;
                this.size = size || 30 + Math.random() * 40;
                this.speed = CONFIG.asteroidBaseSpeed + Math.random() * (wave * 0.2);
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = this.speed;
                
                // Generate random vertices for irregular shape
                this.vertices = [];
                const vertexCount = 8 + Math.floor(Math.random() * 4);
                for (let i = 0; i < vertexCount; i++) {
                    const angle = (i / vertexCount) * Math.PI * 2;
                    const radius = this.size * (0.7 + Math.random() * 0.3);
                    this.vertices.push({
                        x: Math.cos(angle) * radius,
                        y: Math.sin(angle) * radius
                    });
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                Assets.drawAsteroid(ctx, this.x, this.y, this.size, this.rotation, this.vertices);
            }

            isOffScreen() {
                return this.y > CONFIG.height + this.size;
            }
        }

        // ============================================
        // ALIENS
        // ============================================
        class Alien {
            constructor() {
                this.type = Math.random() > 0.5 ? 0 : 1;
                this.x = Math.random() * (CONFIG.width - 100) + 50;
                this.y = -50;
                this.speed = CONFIG.alienBaseSpeed + wave * 0.15;
                this.health = this.type === 0 ? 2 : 1;
                this.lastShot = 0;
                this.fireRate = this.type === 0 ? 100 : 60;
                this.rotation = 0;
                this.pulse = Math.random() * Math.PI * 2;
                this.movePattern = Math.random();
                this.moveTimer = 0;
            }

            update() {
                this.pulse += 0.1;
                this.moveTimer++;
                
                // Movement patterns
                if (this.type === 0) {
                    // Saucer - sine wave movement
                    this.x += Math.sin(this.moveTimer * 0.03) * 2;
                    this.y += this.speed;
                } else {
                    // Fighter - tracking player
                    const dx = player.x - this.x;
                    this.x += Math.sign(dx) * Math.min(Math.abs(dx) * 0.02, 1);
                    this.y += this.speed * 0.8;
                }
                
                // Shooting
                if (this.y > 50 && this.y < CONFIG.height - 100 && 
                    frameCount - this.lastShot > this.fireRate) {
                    this.shoot();
                }
            }

            shoot() {
                this.lastShot = frameCount;
                const angle = Math.atan2(player.y - this.y, player.x - this.x);
                alienBullets.push({
                    x: this.x,
                    y: this.y + 15,
                    vx: Math.cos(angle) * 6,
                    vy: Math.sin(angle) * 6
                });
            }

            draw() {
                Assets.drawAlien(ctx, this.x, this.y, this.type, this.rotation, this.pulse);
            }

            isOffScreen() {
                return this.y > CONFIG.height + 50;
            }
        }

        // ============================================
        // POWER-UPS
        // ============================================
        function spawnPowerUp(x, y) {
            if (Math.random() > 0.15) return;
            
            const types = ['shield', 'rapid', 'spread', 'health'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            powerUps.push({
                x: x,
                y: y,
                type: type,
                pulse: 0,
                vy: 1
            });
        }

        function updatePowerUps() {
            powerUps.forEach((p, index) => {
                p.y += p.vy;
                p.pulse += 0.15;
                
                if (p.y > CONFIG.height) {
                    powerUps.splice(index, 1);
                    return;
                }
                
                // Collision with player
                const dx = p.x - player.x;
                const dy = p.y - player.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 30) {
                    applyPowerUp(p.type);
                    createSparkle(p.x, p.y, '#fff', 20);
                    powerUps.splice(index, 1);
                }
            });
        }

        function applyPowerUp(type) {
            switch(type) {
                case 'shield':
                    player.shield = true;
                    player.shieldTimer = Date.now();
                    document.getElementById('shieldIcon').classList.add('active');
                    break;
                case 'rapid':
                    player.rapid = true;
                    player.rapidTimer = Date.now();
                    player.fireRate = 4;
                    document.getElementById('rapidIcon').classList.add('active');
                    break;
                case 'spread':
                    player.spread = true;
                    player.spreadTimer = Date.now();
                    document.getElementById('spreadIcon').classList.add('active');
                    break;
                case 'health':
                    player.health = Math.min(player.maxHealth, player.health + 30);
                    updateHUD();
                    break;
            }
        }

        // ============================================
        // COLLISION DETECTION
        // ============================================
        function checkCollisions() {
            // Bullets vs Asteroids
            bullets.forEach((bullet, bi) => {
                asteroids.forEach((asteroid, ai) => {
                    const dx = bullet.x - asteroid.x;
                    const dy = bullet.y - asteroid.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < asteroid.size) {
                        createExplosion(bullet.x, bullet.y, '#f80', 20);
                        bullets.splice(bi, 1);
                        asteroid.size -= 15;
                        
                        if (asteroid.size < 20) {
                            createExplosion(asteroid.x, asteroid.y, '#ff0', 40);
                            score += 100;
                            asteroidsDestroyed++;
                            spawnPowerUp(asteroid.x, asteroid.y);
                            asteroids.splice(ai, 1);
                        } else {
                            // Split asteroid
                            if (Math.random() > 0.7) {
                                asteroids.push(new Asteroid(asteroid.x, asteroid.y, asteroid.size * 0.6));
                            }
                        }
                        updateHUD();
                    }
                });
            });

            // Bullets vs Aliens
            bullets.forEach((bullet, bi) => {
                aliens.forEach((alien, ali) => {
                    const dx = bullet.x - alien.x;
                    const dy = bullet.y - alien.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < 25) {
                        createExplosion(bullet.x, bullet.y, alien.type === 0 ? '#f0f' : '#0f0', 15);
                        bullets.splice(bi, 1);
                        alien.health--;
                        
                        if (alien.health <= 0) {
                            createExplosion(alien.x, alien.y, alien.type === 0 ? '#f0f' : '#0f0', 50);
                            score += alien.type === 0 ? 200 : 150;
                            enemiesDestroyed++;
                            spawnPowerUp(alien.x, alien.y);
                            aliens.splice(ali, 1);
                            updateHUD();
                        }
                    }
                });
            });

            // Player vs Asteroids
            asteroids.forEach((asteroid, ai) => {
                const dx = player.x - asteroid.x;
                const dy = player.y - asteroid.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < asteroid.size + 20) {
                    player.takeDamage(20);
                    createExplosion(asteroid.x, asteroid.y, '#f80', 30);
                    asteroids.splice(ai, 1);
                }
            });

            // Player vs Aliens
            aliens.forEach((alien, ai) => {
                const dx = player.x - alien.x;
                const dy = player.y - alien.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 40) {
                    player.takeDamage(30);
                    createExplosion(alien.x, alien.y, '#f0f', 40);
                    aliens.splice(ai, 1);
                }
            });

            // Alien bullets vs Player
            alienBullets.forEach((bullet, bi) => {
                const dx = player.x - bullet.x;
                const dy = player.y - bullet.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist < 25) {
                    player.takeDamage(15);
                    createSparkle(bullet.x, bullet.y, '#f00', 10);
                    alienBullets.splice(bi, 1);
                }
            });
        }

        // ============================================
        // SPAWNING
        // ============================================
        function spawnEnemies() {
            // Spawn asteroids
            if (asteroids.length < CONFIG.maxAsteroids && frameCount % Math.max(20, 60 - wave * 5) === 0) {
                asteroids.push(new Asteroid());
            }

            // Spawn aliens
            if (aliens.length < CONFIG.maxAliens && frameCount % Math.max(40, 120 - wave * 10) === 0) {
                aliens.push(new Alien());
            }

            // Wave progression
            if (frameCount % 1800 === 0) {
                wave++;
                updateHUD();
            }
        }

        // ============================================
        // GAME STATE MANAGEMENT
        // ============================================
        function loseLife() {
            lives--;
            updateHUD();
            
            if (lives <= 0) {
                gameOver();
            } else {
                player.health = player.maxHealth;
                player.invincible = true;
                player.invincibleTimer = Date.now();
            }
        }

        function updateHUD() {
            document.getElementById('scoreDisplay').textContent = score.toLocaleString();
            document.getElementById('waveDisplay').textContent = wave;
            document.getElementById('livesDisplay').textContent = lives;
            document.getElementById('healthFill').style.width = `${player.health}%`;
            document.getElementById('energyFill').style.width = `${player.energy}%`;
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            // Reset game state
            score = 0;
            lives = 3;
            wave = 1;
            frameCount = 0;
            enemiesDestroyed = 0;
            asteroidsDestroyed = 0;
            
            // Clear arrays
            bullets = [];
            asteroids = [];
            aliens = [];
            alienBullets = [];
            particles = [];
            powerUps = [];
            
            // Create player
            player = new Player();
            
            // Initialize stars
            initStars();
            
            // Update HUD
            updateHUD();
            
            // Reset power-up icons
            document.querySelectorAll('.powerup-icon').forEach(el => el.classList.remove('active'));
            
            // Start game
            gameRunning = true;
            gamePaused = false;
            
            if (!gameLoop.running) {
                gameLoop();
            }
        }

        function gameOver() {
            gameRunning = false;
            
            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('finalWave').textContent = wave;
            document.getElementById('finalEnemies').textContent = enemiesDestroyed;
            document.getElementById('finalAsteroids').textContent = asteroidsDestroyed;
            
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            document.getElementById('pauseScreen').classList.toggle('hidden', !gamePaused);
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function gameLoop() {
            gameLoop.running = true;
            
            if (gameRunning && !gamePaused) {
                frameCount++;
                
                // Clear canvas
                ctx.fillStyle = '#000011';
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                
                // Draw background nebula effect
                const nebulaGrad = ctx.createRadialGradient(
                    CONFIG.width / 2, CONFIG.height / 2, 0,
                    CONFIG.width / 2, CONFIG.height / 2, CONFIG.width
                );
                nebulaGrad.addColorStop(0, 'rgba(50, 0, 80, 0.3)');
                nebulaGrad.addColorStop(0.5, 'rgba(0, 30, 60, 0.2)');
                nebulaGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = nebulaGrad;
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                
                // Update and draw stars
                updateStars();
                drawStars();
                
                // Spawn enemies
                spawnEnemies();
                
                // Update player
                player.update();
                
                // Update bullets
                bullets = bullets.filter(b => {
                    b.x += b.vx;
                    b.y += b.vy;
                    return b.y > -10 && b.y < CONFIG.height + 10;
                });
                
                // Update alien bullets
                alienBullets = alienBullets.filter(b => {
                    b.x += b.vx;
                    b.y += b.vy;
                    return b.y < CONFIG.height + 10 && b.y > -10 && b.x > -10 && b.x < CONFIG.width + 10;
                });
                
                // Update asteroids
                asteroids = asteroids.filter(a => {
                    a.update();
                    return !a.isOffScreen();
                });
                
                // Update aliens
                aliens = aliens.filter(a => {
                    a.update();
                    return !a.isOffScreen();
                });
                
                // Update power-ups
                updatePowerUps();
                
                // Update particles
                particles = particles.filter(p => {
                    p.update();
                    return p.life > 0;
                });
                
                // Check collisions
                checkCollisions();
                
                // Draw asteroids
                asteroids.forEach(a => a.draw());
                
                // Draw aliens
                aliens.forEach(a => a.draw());
                
                // Draw bullets
                bullets.forEach(b => Assets.drawBullet(ctx, b.x, b.y, true));
                alienBullets.forEach(b => Assets.drawBullet(ctx, b.x, b.y, false));
                
                // Draw power-ups
                powerUps.forEach(p => Assets.drawPowerUp(ctx, p.x, p.y, p.type, p.pulse));
                
                // Draw player
                player.draw();
                
                // Draw particles
                particles.forEach(p => p.draw(ctx));
            }
            
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INPUT HANDLING
        // ============================================
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            if (e.code === 'KeyP') {
                togglePause();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        canvas = document.getElementById('gameCanvas');
        canvas.width = CONFIG.width;
        canvas.height = CONFIG.height;
        ctx = canvas.getContext('2d');

        canvas.addEventListener('mousedown', () => mouseDown = true);
        canvas.addEventListener('mouseup', () => mouseDown = false);
        canvas.addEventListener('mouseleave', () => mouseDown = false);

        // Prevent context menu
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Initialize and show start screen
        initStars();
        
        // Draw initial background
        function drawStartBackground() {
            if (!gameRunning) {
                ctx.fillStyle = '#000011';
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                
                const nebulaGrad = ctx.createRadialGradient(
                    CONFIG.width / 2, CONFIG.height / 2, 0,
                    CONFIG.width / 2, CONFIG.height / 2, CONFIG.width
                );
                nebulaGrad.addColorStop(0, 'rgba(50, 0, 80, 0.3)');
                nebulaGrad.addColorStop(0.5, 'rgba(0, 30, 60, 0.2)');
                nebulaGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = nebulaGrad;
                ctx.fillRect(0, 0, CONFIG.width, CONFIG.height);
                
                updateStars();
                drawStars();
                requestAnimationFrame(drawStartBackground);
            }
        }
        drawStartBackground();
    </script>
</body>
</html>
