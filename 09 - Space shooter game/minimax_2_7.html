<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter - Cosmic Assault</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           BASE STYLES
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a3a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* ============================================================
           HEADER STYLES
           ============================================================ */
        .game-header {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            position: absolute;
            top: 0;
            z-index: 100;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s linear infinite;
        }

        @keyframes titleGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* ============================================================
           HUD STYLES
           ============================================================ */
        .hud {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .hud-item {
            text-align: center;
        }

        .hud-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hud-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }

        .hud-value.score {
            color: #ffff00;
            text-shadow: 0 0 10px rgba(255,255,0,0.5);
        }

        .hud-value.lives {
            color: #ff6b6b;
        }

        /* ============================================================
           GAME CANVAS CONTAINER
           ============================================================ */
        #game-container {
            position: relative;
            margin-top: 70px;
        }

        #gameCanvas {
            border: 2px solid #333;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(0,255,255,0.2),
                        inset 0 0 100px rgba(0,0,0,0.5);
        }

        /* ============================================================
           START SCREEN
           ============================================================ */
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20,20,60,0.95) 0%, rgba(0,0,0,0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 10px;
        }

        .start-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s linear infinite;
            text-shadow: none;
        }

        .start-subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 40px;
            text-align: center;
        }

        .start-btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 20px 60px;
            background: linear-gradient(135deg, #00ffff, #0088ff);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(0,255,255,0.5);
        }

        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 50px rgba(0,255,255,0.8);
        }

        .controls-info {
            margin-top: 40px;
            color: #666;
            text-align: center;
            line-height: 2;
        }

        .controls-info span {
            display: inline-block;
            background: #222;
            padding: 5px 15px;
            border-radius: 5px;
            margin: 0 5px;
            border: 1px solid #444;
        }

        /* ============================================================
           GAME OVER SCREEN
           ============================================================ */
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(60,20,20,0.95) 0%, rgba(0,0,0,0.98) 100%);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            border-radius: 10px;
        }

        .game-over-screen.show {
            display: flex;
        }

        .game-over-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 30px rgba(255,50,50,0.8);
            margin-bottom: 20px;
        }

        .final-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            color: #ffff00;
            margin-bottom: 10px;
        }

        .final-wave {
            font-size: 1.2rem;
            color: #aaa;
            margin-bottom: 30px;
        }

        /* ============================================================
           POWER-UP INDICATOR
           ============================================================ */
        .power-up-indicator {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 15px;
        }

        .power-up-slot {
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            opacity: 0.3;
            transition: all 0.3s ease;
        }

        .power-up-slot.active {
            opacity: 1;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0,255,255,0.5);
        }

        /* ============================================================
           WAVE ANNOUNCEMENT
           ============================================================ */
        .wave-announce {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 30px rgba(255,255,255,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 150;
        }

        .wave-announce.show {
            animation: waveAnnounce 2s ease-out forwards;
        }

        @keyframes waveAnnounce {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            40% { transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <!-- Game Header with HUD -->
    <div class="game-header">
        <div class="game-title">COSMIC ASSAULT</div>
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">Score</div>
                <div class="hud-value score" id="score">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Wave</div>
                <div class="hud-value" id="wave">1</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Lives</div>
                <div class="hud-value lives" id="lives">3</div>
            </div>
        </div>
    </div>

    <!-- Game Canvas Container -->
    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="650"></canvas>

        <!-- Start Screen -->
        <div class="start-screen" id="startScreen">
            <h1 class="start-title">COSMIC ASSAULT</h1>
            <p class="start-subtitle">Defend Earth from the Alien Invasion!</p>
            <button class="start-btn" onclick="startGame()">START GAME</button>
            <div class="controls-info">
                <p><span>← →</span> or <span>A D</span> Move Ship</p>
                <p><span>SPACE</span> or <span>W</span> Fire Lasers</p>
                <p><span>P</span> Pause Game</p>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div class="game-over-screen" id="gameOverScreen">
            <h1 class="game-over-title">GAME OVER</h1>
            <div class="final-score" id="finalScore">Score: 0</div>
            <div class="final-wave" id="finalWave">Reached Wave 1</div>
            <button class="start-btn" onclick="startGame()">PLAY AGAIN</button>
        </div>

        <!-- Wave Announcement -->
        <div class="wave-announce" id="waveAnnounce">WAVE 1</div>

        <!-- Power-up Indicator -->
        <div class="power-up-indicator">
            <div class="power-up-slot" id="shieldSlot" title="Shield">🛡️</div>
            <div class="power-up-slot" id="rapidSlot" title="Rapid Fire">⚡</div>
            <div class="power-up-slot" id="bombSlot" title="Bomb">💣</div>
        </div>
    </div>

    <script>
        // ============================================================
        // GAME CONFIGURATION
        // ============================================================
        const CONFIG = {
            CANVAS_WIDTH: 900,
            CANVAS_HEIGHT: 650,
            PLAYER_SPEED: 7,
            LASER_SPEED: 12,
            ASTEROID_SPEED: 2,
            ALIEN_SPEED: 2,
            STAR_COUNT: 150,
            PARTICLE_COUNT: 50,
            FIRE_RATE: 200, // ms between shots
            RAPID_FIRE_RATE: 80
        };

        // ============================================================
        // GAME STATE
        // ============================================================
        let gameState = {
            isRunning: false,
            isPaused: false,
            score: 0,
            wave: 1,
            lives: 3,
            lastFireTime: 0,
            rapidFireActive: false,
            shieldActive: false,
            bombCount: 0
        };

        // Game objects
        let player, lasers, asteroids, aliens, particles, powerUps, stars;
        let canvas, ctx;
        let keys = {};
        let animationId;

        // ============================================================
        // INITIALIZATION
        // ============================================================

        /**
         * Initialize the game
         */
        function init() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');

            // Initialize arrays
            lasers = [];
            asteroids = [];
            aliens = [];
            particles = [];
            powerUps = [];
            stars = [];

            // Create starfield
            createStarfield();

            // Create player
            player = {
                x: CONFIG.CANVAS_WIDTH / 2,
                y: CONFIG.CANVAS_HEIGHT - 80,
                width: 50,
                height: 50,
                speed: CONFIG.PLAYER_SPEED,
                color: '#00ffff'
            };

            // Event listeners
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // Start game loop
            gameLoop();
        }

        /**
         * Create the starfield background
         */
        function createStarfield() {
            for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
                stars.push({
                    x: Math.random() * CONFIG.CANVAS_WIDTH,
                    y: Math.random() * CONFIG.CANVAS_HEIGHT,
                    size: Math.random() * 2 + 0.5,
                    speed: Math.random() * 2 + 0.5,
                    brightness: Math.random()
                });
            }
        }

        // ============================================================
        // INPUT HANDLING
        // ============================================================

        function handleKeyDown(e) {
            keys[e.key.toLowerCase()] = true;

            if (e.key === ' ' || e.key.toLowerCase() === 'w') {
                e.preventDefault();
                fireLaser();
            }

            if (e.key.toLowerCase() === 'p' && gameState.isRunning) {
                togglePause();
            }

            if (e.key.toLowerCase() === 'b' && gameState.bombCount > 0) {
                useBomb();
            }
        }

        function handleKeyUp(e) {
            keys[e.key.toLowerCase()] = false;
        }

        function togglePause() {
            gameState.isPaused = !gameState.isPaused;
        }

        // ============================================================
        // PLAYER SHIP
        // ============================================================

        /**
         * Draw the player ship using Canvas
         */
        function drawPlayer() {
            const { x, y } = player;

            // Shield effect if active
            if (gameState.shieldActive) {
                ctx.beginPath();
                ctx.arc(x, y, 40, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.fillStyle = 'rgba(0, 255, 255, 0.1)';
                ctx.fill();
            }

            // Engine glow
            ctx.save();
            ctx.translate(x, y);

            // Engine flames
            const flameGradient = ctx.createLinearGradient(0, 20, 0, 45);
            flameGradient.addColorStop(0, '#ff6600');
            flameGradient.addColorStop(0.5, '#ffff00');
            flameGradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.moveTo(-12, 20);
            ctx.lineTo(0, 40 + Math.random() * 10);
            ctx.lineTo(12, 20);
            ctx.fillStyle = flameGradient;
            ctx.fill();

            // Ship body
            ctx.beginPath();
            ctx.moveTo(0, -25);  // Nose
            ctx.lineTo(25, 20);   // Right wing
            ctx.lineTo(15, 15);
            ctx.lineTo(5, 20);
            ctx.lineTo(-5, 20);
            ctx.lineTo(-15, 15);
            ctx.lineTo(-25, 20);  // Left wing
            ctx.closePath();

            const shipGradient = ctx.createLinearGradient(0, -25, 0, 20);
            shipGradient.addColorStop(0, '#00ffff');
            shipGradient.addColorStop(0.5, '#0088ff');
            shipGradient.addColorStop(1, '#0044aa');
            ctx.fillStyle = shipGradient;
            ctx.fill();

            // Cockpit
            ctx.beginPath();
            ctx.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2);
            const cockpitGradient = ctx.createRadialGradient(0, -2, 0, 0, 0, 12);
            cockpitGradient.addColorStop(0, '#ffffff');
            cockpitGradient.addColorStop(0.3, '#00ffff');
            cockpitGradient.addColorStop(1, '#0044aa');
            ctx.fillStyle = cockpitGradient;
            ctx.fill();

            // Wing details
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-20, 15);
            ctx.lineTo(-10, 5);
            ctx.moveTo(20, 15);
            ctx.lineTo(10, 5);
            ctx.stroke();

            ctx.restore();
        }

        /**
         * Update player position
         */
        function updatePlayer() {
            if (keys['arrowleft'] || keys['a']) {
                player.x -= player.speed;
            }
            if (keys['arrowright'] || keys['d']) {
                player.x += player.speed;
            }
            if (keys['arrowup'] || keys['arrowdown']) {
                // Optional vertical movement
                if (keys['arrowup'] || keys['s']) {
                    player.y -= player.speed * 0.7;
                }
                if (keys['arrowdown']) {
                    player.y += player.speed * 0.7;
                }
            }

            // Keep player in bounds
            player.x = Math.max(30, Math.min(CONFIG.CANVAS_WIDTH - 30, player.x));
            player.y = Math.max(50, Math.min(CONFIG.CANVAS_HEIGHT - 30, player.y));
        }

        // ============================================================
        // LASERS
        // ============================================================

        /**
         * Fire a laser from the player
         */
        function fireLaser() {
            if (!gameState.isRunning || gameState.isPaused) return;

            const now = Date.now();
            const fireRate = gameState.rapidFireActive ? CONFIG.RAPID_FIRE_RATE : CONFIG.FIRE_RATE;

            if (now - gameState.lastFireTime < fireRate) return;

            gameState.lastFireTime = now;

            // Create laser
            lasers.push({
                x: player.x,
                y: player.y - 25,
                width: 4,
                height: 20,
                speed: CONFIG.LASER_SPEED,
                color: gameState.rapidFireActive ? '#ff00ff' : '#00ffff'
            });

            // Double shot for rapid fire
            if (gameState.rapidFireActive) {
                lasers.push({
                    x: player.x - 10,
                    y: player.y - 20,
                    width: 4,
                    height: 20,
                    speed: CONFIG.LASER_SPEED,
                    color: '#ff00ff'
                });
                lasers.push({
                    x: player.x + 10,
                    y: player.y - 20,
                    width: 4,
                    height: 20,
                    speed: CONFIG.LASER_SPEED,
                    color: '#ff00ff'
                });
            }
        }

        /**
         * Draw lasers
         */
        function drawLasers() {
            lasers.forEach(laser => {
                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = laser.color;

                // Laser beam
                const gradient = ctx.createLinearGradient(
                    laser.x, laser.y - laser.height/2,
                    laser.x, laser.y + laser.height/2
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, laser.color);
                gradient.addColorStop(1, laser.color);

                ctx.fillStyle = gradient;
                ctx.fillRect(laser.x - laser.width/2, laser.y - laser.height/2, laser.width, laser.height);

                ctx.shadowBlur = 0;
            });
        }

        /**
         * Update laser positions
         */
        function updateLasers() {
            lasers = lasers.filter(laser => {
                laser.y -= laser.speed;
                return laser.y > -laser.height;
            });
        }

        // ============================================================
        // ASTEROIDS
        // ============================================================

        /**
         * Spawn an asteroid
         */
        function spawnAsteroid() {
            const size = Math.random() * 30 + 20;
            asteroids.push({
                x: Math.random() * CONFIG.CANVAS_WIDTH,
                y: -size,
                size: size,
                speedY: Math.random() * CONFIG.ASTEROID_SPEED + 1 + (gameState.wave * 0.2),
                speedX: (Math.random() - 0.5) * 2,
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.05,
                vertices: generateAsteroidVertices(size)
            });
        }

        /**
         * Generate random asteroid shape
         */
        function generateAsteroidVertices(size) {
            const vertices = [];
            const numVertices = Math.floor(Math.random() * 5) + 8;
            for (let i = 0; i < numVertices; i++) {
                const angle = (i / numVertices) * Math.PI * 2;
                const radius = size * (0.7 + Math.random() * 0.3);
                vertices.push({
                    x: Math.cos(angle) * radius,
                    y: Math.sin(angle) * radius
                });
            }
            return vertices;
        }

        /**
         * Draw asteroids
         */
        function drawAsteroids() {
            asteroids.forEach(asteroid => {
                ctx.save();
                ctx.translate(asteroid.x, asteroid.y);
                ctx.rotate(asteroid.rotation);

                // Asteroid body
                ctx.beginPath();
                ctx.moveTo(asteroid.vertices[0].x, asteroid.vertices[0].y);
                for (let i = 1; i < asteroid.vertices.length; i++) {
                    ctx.lineTo(asteroid.vertices[i].x, asteroid.vertices[i].y);
                }
                ctx.closePath();

                const asteroidGradient = ctx.createRadialGradient(0, 0, 0, 0, 0, asteroid.size);
                asteroidGradient.addColorStop(0, '#666');
                asteroidGradient.addColorStop(0.5, '#444');
                asteroidGradient.addColorStop(1, '#222');
                ctx.fillStyle = asteroidGradient;
                ctx.fill();

                ctx.strokeStyle = '#888';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Crater details
                ctx.beginPath();
                ctx.arc(asteroid.size * 0.2, -asteroid.size * 0.1, asteroid.size * 0.15, 0, Math.PI * 2);
                ctx.fillStyle = '#333';
                ctx.fill();

                ctx.restore();
            });
        }

        /**
         * Update asteroid positions
         */
        function updateAsteroids() {
            asteroids = asteroids.filter(asteroid => {
                asteroid.y += asteroid.speedY;
                asteroid.x += asteroid.speedX;
                asteroid.rotation += asteroid.rotationSpeed;

                // Bounce off walls
                if (asteroid.x < asteroid.size || asteroid.x > CONFIG.CANVAS_WIDTH - asteroid.size) {
                    asteroid.speedX *= -1;
                }

                return asteroid.y < CONFIG.CANVAS_HEIGHT + asteroid.size;
            });
        }

        // ============================================================
        // ALIENS
        // ============================================================

        /**
         * Spawn an alien
         */
        function spawnAlien() {
            const type = Math.random() < 0.7 ? 'basic' : 'advanced';
            aliens.push({
                x: Math.random() * (CONFIG.CANVAS_WIDTH - 100) + 50,
                y: -50,
                width: type === 'basic' ? 40 : 50,
                height: type === 'basic' ? 35 : 45,
                speed: CONFIG.ALIEN_SPEED + (gameState.wave * 0.3),
                type: type,
                health: type === 'basic' ? 1 : 3,
                points: type === 'basic' ? 100 : 300,
                wobble: 0,
                color: type === 'basic' ? '#ff6b6b' : '#9b59b6'
            });
        }

        /**
         * Draw aliens
         */
        function drawAliens() {
            aliens.forEach(alien => {
                ctx.save();
                ctx.translate(alien.x, alien.y);

                // Alien body
                ctx.beginPath();
                if (alien.type === 'basic') {
                    // Basic alien - classic invader shape
                    ctx.moveTo(0, -15);
                    ctx.lineTo(20, 0);
                    ctx.lineTo(15, 15);
                    ctx.lineTo(5, 10);
                    ctx.lineTo(0, 18);
                    ctx.lineTo(-5, 10);
                    ctx.lineTo(-15, 15);
                    ctx.lineTo(-20, 0);
                } else {
                    // Advanced alien - more complex
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                }
                ctx.closePath();

                const alienGradient = ctx.createRadialGradient(0, -5, 0, 0, 0, 25);
                alienGradient.addColorStop(0, alien.type === 'basic' ? '#ff8888' : '#bb79d6');
                alienGradient.addColorStop(1, alien.color);
                ctx.fillStyle = alienGradient;
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-8, -3, 6, 0, Math.PI * 2);
                ctx.arc(8, -3, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-8, -3, 3, 0, Math.PI * 2);
                ctx.arc(8, -3, 3, 0, Math.PI * 2);
                ctx.fill();

                // Antenna for advanced aliens
                if (alien.type === 'advanced') {
                    ctx.strokeStyle = alien.color;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(-10, -20);
                    ctx.lineTo(-15, -30);
                    ctx.moveTo(10, -20);
                    ctx.lineTo(15, -30);
                    ctx.stroke();

                    ctx.fillStyle = '#ffff00';
                    ctx.beginPath();
                    ctx.arc(-15, -32, 4, 0, Math.PI * 2);
                    ctx.arc(15, -32, 4, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
        }

        /**
         * Update alien positions
         */
        function updateAliens() {
            aliens = aliens.filter(alien => {
                alien.y += alien.speed;
                alien.wobble += 0.1;
                alien.x += Math.sin(alien.wobble) * 0.5;

                return alien.y < CONFIG.CANVAS_HEIGHT + 50;
            });
        }

        // ============================================================
        // PARTICLES & EXPLOSIONS
        // ============================================================

        /**
         * Create an explosion effect
         */

        // ============================================================

        function updateWaves() {

        // ============================================================

        // ============================================================

        function startGame() {

        }

            document.getElementById('finalWave').textContent = `Reached Wave ${gameState.wave}`;
            document.getElementById('gameOverScreen').classList.add('show');

        function gameLoop() {

            ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);

            drawStars();

            if (gameState.isRunning && !gameState.isPaused) {
                // Update game objects
                updatePlayer();
                updateLasers();
                updateAsteroids();
                updateAliens();
                updatePowerUps();
                updateParticles();
                updateWaves();

    try {
      window.parent.postMessage({
        type: "iframe-element-hover",
        data: null,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 点击事件处理
  function handleClick(e) {
    var target = e.target;
    if (!target || target === overlay || target === highlightBox || target === tagLabel || target === selectedBox || target === selectedLabel) {
      return;
    }

    // 避免处理 html 和 body 元素
    if (target === document.documentElement || target === document.body) {
      return;
    }

    // 检查是否是交互元素，这些元素需要保留默认行为
    var isInteractiveElement = ['input', 'textarea', 'select', 'button', 'a'].includes(target.tagName.toLowerCase());

    // 如果高亮功能启用，对于非交互元素阻止默认行为和事件传播
    if (highlightEnabled) {
      e.preventDefault();
      e.stopPropagation();
    }
    var rect = target.getBoundingClientRect();
    var selector = getElementSelector(target);
    var text = getElementText(target);
    var attributes = getElementAttributes(target);
    console.log("Element clicked:", {
      tagName: target.tagName,
      selector: selector,
      rect: rect
    });

    // 立即更新选中高亮
    updateSelectedHighlight(target);

    // 隐藏悬停高亮，因为现在是选中状态
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    var elementInfo = {
      tagName: target.tagName.toLowerCase(),
      rect: {
        left: rect.left,
        top: rect.top,
        right: rect.right,
        bottom: rect.bottom,
        width: rect.width,
        height: rect.height,
        x: rect.x,
        y: rect.y
      },
      selector: selector,
      text: text,
      attributes: attributes,
      url: window.location.href,
      path: window.location.pathname,
      timestamp: Date.now()
    };
    try {
      window.parent.postMessage({
        type: "iframe-element-click",
        data: elementInfo,
        source: "iframe-highlight-injector"
      }, "*");
    } catch (error) {
      console.warn("无法发送消息到父窗口:", error);
    }
  }

  // 监听来自父窗口的消息
  function handleParentMessage(event) {
    console.log("Received message from parent:", event.data);
    if (event.data.type === "iframe-highlight-toggle") {
      var enabled = event.data.enabled;
      console.log("Highlight toggle:", enabled);
      if (enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "enable-iframe-highlight") {
      console.log("Enable iframe highlight");
      enableHighlight();
    } else if (event.data.type === "disable-iframe-highlight") {
      console.log("Disable iframe highlight");
      disableHighlight();
    } else if (event.data.type === "toggle-iframe-highlight") {
      var _enabled = event.data.enabled !== undefined ? event.data.enabled : !highlightEnabled;
      console.log("Toggle iframe highlight to:", _enabled);
      if (_enabled) {
        enableHighlight();
      } else {
        disableHighlight();
      }
    } else if (event.data.type === "update-selected-element") {
      var selector = event.data.selector;
      console.log("Update selected element with selector:", selector);
      if (selector) {
        try {
          var element = document.querySelector(selector);
          console.log("Found element by selector:", element);
          updateSelectedHighlight(element);
        } catch (error) {
          console.warn("Failed to select element:", error);
          updateSelectedHighlight(null);
        }
      } else {
        updateSelectedHighlight(null);
      }
    } else if (event.data.type === "clear-selected-element") {
      console.log("Clear selected element");
      updateSelectedHighlight(null);
    }
  }

  // 启用高亮功能
  function enableHighlight() {
    console.log("Enabling highlight");
    document.addEventListener("mouseover", handleMouseOver, true);
    document.addEventListener("mouseout", handleMouseOut, true);
    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
