<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Havoc - Space Shooter</title>
    <style>
        /* 
         * STANDALONE ASSET NOTE: 
         * To ensure this game runs perfectly as a single file without broken external links, 
         * all visual assets (ships, asteroids, effects) are rendered procedurally 
         * using the Canvas 2D API with high-end glow and vector styling.
         */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: crosshair;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .ui-box {
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            color: #0ff;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            backdrop-filter: blur(5px);
        }
        #health-bar-container {
            width: 200px;
            height: 12px;
            background: rgba(255, 0, 0, 0.2);
            border-radius: 6px;
            margin-top: 8px;
            border: 1px solid rgba(255, 0, 0, 0.5);
            overflow: hidden;
        }
        #health-bar {
            width: 100%;
            height: 100%;
            background: #f00;
            box-shadow: 0 0 15px #f00;
            transition: width 0.2s;
        }
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a0f1e 0%, #000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #fff;
        }
        h1 {
            font-size: 64px;
            margin: 0;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            letter-spacing: 5px;
            color: #0ff;
        }
        .subtitle {
            color: #888;
            margin-bottom: 40px;
            font-size: 20px;
        }
        button {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 15px 40px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
            pointer-events: all;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            transform: scale(1.05);
        }
        .controls-info {
            margin-top: 30px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>STELLAR HAVOC</h1>
        <div class="subtitle">Survive the Void</div>
        <button onclick="startGame()">Launch Mission</button>
        <div class="controls-info">
            WASD / Arrows - Move<br>
            Mouse - Aim<br>
            Left Click - Fire Lasers
        </div>
    </div>

    <div id="ui-layer" style="display:none;">
        <div class="ui-box">
            SCORE: <span id="score-display">0</span>
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
        <div class="ui-box">WAVE: <span id="wave-display">1</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Resize handler
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game State
    let gameRunning = false;
    let score = 0;
    let wave = 1;
    let screenShakeAmount = 0;
    let spawnTimer = 0;
    let spawnInterval = 120; // Frames between spawns

    // Input State
    const keys = {};
    const mouse = { x: canvas.width/2, y: canvas.height/2, down: false };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mousedown', e => { if(e.button === 0) mouse.down = true; });
    window.addEventListener('mouseup', e => { if(e.button === 0) mouse.down = false; });

    // Utility Functions
    function dist(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
    }

    function randomRange(min, max) {
        return Math.random() * (max - min + 1) + min;
    }

    // Arrays
    let stars = [];
    let particles = [];
    let projectiles = [];
    let enemies = [];
    let asteroids = [];

    // Player Object
    const player = {
        x: 0, y: 0, 
        radius: 15, 
        angle: 0, 
        speed: 5, 
        health: 100, 
        maxHealth: 100,
        fireRate: 8, 
        fireCooldown: 0,
        invincibleTimer: 0,
        vx: 0, vy: 0
    };

    function initStars() {
        stars = [];
        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 2 + 0.5
            });
        }
    }

    function startGame() {
        document.getElementById('menu-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        
        player.x = canvas.width / 2;
        player.y = canvas.height / 2;
        player.health = player.maxHealth;
        player.invincibleTimer = 0;
        
        score = 0;
        wave = 1;
        spawnInterval = 90;
        spawnTimer = 0;
        
        projectiles = [];
        enemies = [];
        asteroids = [];
        particles = [];
        
        initStars();
        gameRunning = true;
        updateUI();
        loop();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = score;
        document.getElementById('wave-display').innerText = wave;
        document.getElementById('health-bar').style.width = (player.health / player.maxHealth) * 100 + '%';
    }

    function gameOver() {
        gameRunning = false;
        document.getElementById('menu-screen').style.display = 'flex';
        document.getElementById('menu-screen').querySelector('h1').innerText = "MISSION FAILED";
        document.getElementById('menu-screen').querySelector('.subtitle').innerText = `Final Score: ${score}`;
        document.getElementById('menu-screen').querySelector('button').innerText = "Retry";
    }

    // Particle System
    function createExplosion(x, y, color, count, speed, size) {
        for(let i=0; i<count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * speed;
            particles.push({
                x: x, y: y,
                vx: Math.cos(angle) * velocity,
                vy: Math.sin(angle) * velocity,
                life: 1,
                decay: Math.random() * 0.03 + 0.01,
                size: Math.random() * size + 1,
                color: color
            });
        }
    }

    function createThrusterParticle() {
        const angle = player.angle + Math.PI; // Back of ship
        const offsetDist = 12;
        const px = player.x + Math.cos(angle) * offsetDist;
        const py = player.y + Math.sin(angle) * offsetDist;
        
        particles.push({
            x: px, y: py,
            vx: Math.cos(angle + randomRange(-0.3, 0.3)) * randomRange(1, 3),
            vy: Math.sin(angle + randomRange(-0.3, 0.3)) * randomRange(1, 3),
            life: 1,
            decay: 0.05,
            size: randomRange(1, 3),
            color: '#0ff'
        });
    }

    // Spawn Logic
    function spawnEnemy() {
        const side = Math.floor(Math.random() * 4); // 0:Top, 1:Right, 2:Bottom, 3:Left
        let x, y;
        if(side === 0) { x = Math.random() * canvas.width; y = -30; }
        else if(side === 1) { x = canvas.width + 30; y = Math.random() * canvas.height; }
        else if(side === 2) { x = Math.random() * canvas.width; y = canvas.height + 30; }
        else { x = -30; y = Math.random() * canvas.height; }

        enemies.push({
            x: x, y: y,
            radius: 18,
            angle: 0,
            speed: randomRange(1.5, 3) + (wave * 0.2),
            health: 2,
            fireCooldown: Math.floor(Math.random() * 100),
            fireRate: 120 - (wave * 5)
        });
    }

    function spawnAsteroid() {
        const side = Math.floor(Math.random() * 4);
        let x, y, vx, vy;
        if(side === 0) { x = Math.random() * canvas.width; y = -50; vx = randomRange(-1, 1); vy = randomRange(1, 3); }
        else if(side === 1) { x = canvas.width + 50; y = Math.random() * canvas.height; vx = randomRange(-3, -1); vy = randomRange(-1, 1); }
        else if(side === 2) { x = Math.random() * canvas.width; y = canvas.height + 50; vx = randomRange(-1, 1); vy = randomRange(-3, -1); }
        else { x = -50; y = Math.random() * canvas.height; vx = randomRange(1, 3); vy = randomRange(-1, 1); }

        const radius = randomRange(15, 40);
        // Generate random polygon shape for asteroid
        const vertices = [];
        const numVerts = Math.floor(randomRange(6, 10));
        for(let i=0; i<numVerts; i++) {
            const angle = (i / numVerts) * Math.PI * 2;
            const r = radius + randomRange(-radius*0.3, radius*0.3);
            vertices.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
        }

        asteroids.push({
            x: x, y: y,
            vx: vx, vy: vy,
            radius: radius,
            rotation: 0,
            rotSpeed: randomRange(-0.02, 0.02),
            vertices: vertices,
            health: Math.ceil(radius / 15)
        });
    }

    // Update Functions
    function updatePlayer(dt) {
        // Movement
        let ax = 0, ay = 0;
        if(keys['w'] || keys['arrowup']) ay -= 1;
        if(keys['s'] || keys['arrowdown']) ay += 1;
        if(keys['a'] || keys['arrowleft']) ax -= 1;
        if(keys['d'] || keys['arrowright']) ax += 1;

        if(ax !== 0 || ay !== 0) {
            const moveAngle = Math.atan2(ay, ax);
            player.vx += Math.cos(moveAngle) * player.speed * 0.2;
            player.vy += Math.sin(moveAngle) * player.speed * 0.2;
            createThrusterParticle();
        }

        player.vx *= 0.92; // Friction
        player.vy *= 0.92;
        
        player.x += player.vx;
        player.y += player.vy;

        // Bounds
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

        // Aim
        player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

        // Shoot
        if(player.fireCooldown > 0) player.fireCooldown--;
        if(mouse.down && player.fireCooldown === 0) {
            projectiles.push({
                x: player.x + Math.cos(player.angle) * 20,
                y: player.y + Math.sin(player.angle) * 20,
                vx: Math.cos(player.angle) * 12,
                vy: Math.sin(player.angle) * 12,
                radius: 3,
                damage: 1,
                color: '#0ff',
                life: 100,
                isEnemy: false
            });
            player.fireCooldown = player.fireRate;
        }

        if(player.invincibleTimer > 0) player.invincibleTimer--;
    }

    function updateProjectiles() {
        for(let i = projectiles.length-1; i>=0; i--) {
            const p = projectiles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life--;

            // Trail particle
            if(Math.random() < 0.5) {
                particles.push({
                    x: p.x, y: p.y,
                    vx: randomRange(-0.5, 0.5), vy: randomRange(-0.5, 0.5),
                    life: 0.5, decay: 0.05, size: 1, color: p.color
                });
            }

            if(p.life <= 0 || p.x < -50 || p.x > canvas.width+50 || p.y < -50 || p.y > canvas.height+50) {
                projectiles.splice(i, 1);
            }
        }
    }

    function updateEnemies() {
        for(let i = enemies.length-1; i>=0; i--) {
            const e = enemies[i];
            // Chase player loosely
            const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
            e.angle += (angleToPlayer - e.angle) * 0.05; // Smooth rotation
            
            e.x += Math.cos(e.angle) * e.speed;
            e.y += Math.sin(e.angle) * e.speed;

            // Enemy shooting
            if(e.fireCooldown <= 0) {
                const fireAngle = Math.atan2(player.y - e.y, player.x - e.x);
                projectiles.push({
                    x: e.x, y: e.y,
                    vx: Math.cos(fireAngle) * 6,
                    vy: Math.sin(fireAngle) * 6,
                    radius: 4, damage: 10, color: '#f0f', life: 150, isEnemy: true
                });
                e.fireCooldown = Math.max(30, e.fireRate);
            } else {
                e.fireCooldown--;
            }

            // Engine trail for enemy
            if(Math.random() < 0.3) {
                 particles.push({
                    x: e.x - Math.cos(e.angle) * 15,
                    y: e.y - Math.sin(e.angle) * 15,
                    vx: randomRange(-0.5, 0.5), vy: randomRange(-0.5, 0.5),
                    life: 0.6, decay: 0.04, size: 2, color: '#f0f'
                });
            }

            // Remove if way off screen
            if(dist(e.x, e.y, canvas.width/2, canvas.height/2) > 2000) {
                enemies.splice(i, 1);
            }
        }
    }

    function updateAsteroids() {
        for(let i = asteroids.length-1; i>=0; i--) {
            const a = asteroids[i];
            a.x += a.vx;
            a.y += a.vy;
            a.rotation += a.rotSpeed;

            if(a.x < -100 || a.x > canvas.width+100 || a.y < -100 || a.y > canvas.height+100) {
                asteroids.splice(i, 1);
            }
        }
    }

    function updateParticles() {
        for(let i = particles.length-1; i>=0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;
            p.vx *= 0.98;
            p.vy *= 0.98;
            if(p.life <= 0) particles.splice(i, 1);
        }
    }

    // Collision Detection
    function checkCollisions() {
        // Player vs Enemy Lasers
        if(player.invincibleTimer === 0) {
            for(let i = projectiles.length-1; i>=0; i--) {
                const p = projectiles[i];
                if(p.isEnemy && dist(player.x, player.y, p.x, p.y) < player.radius + p.radius) {
                    player.health -= p.damage;
                    player.invincibleTimer = 30; // Flash frames
                    screenShakeAmount = 10;
                    createExplosion(player.x, player.y, '#f00', 10, 3, 2);
                    projectiles.splice(i, 1);
                    updateUI();
                    if(player.health <= 0) {
                        createExplosion(player.x, player.y, '#0ff', 50, 8, 4);
                        screenShakeAmount = 30;
                        gameOver();
                        return;
                    }
                }
            }

            // Player vs Enemies
            for(let i = enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                if(dist(player.x, player.y, e.x, e.y) < player.radius + e.radius) {
                    player.health -= 30;
                    player.invincibleTimer = 60;
                    screenShakeAmount = 20;
                    createExplosion(e.x, e.y, '#f0f', 30, 5, 3);
                    enemies.splice(i, 1);
                    score += 50;
                    updateUI();
                    if(player.health <= 0) {
                        createExplosion(player.x, player.y, '#0ff', 50, 8, 4);
                        screenShakeAmount = 30;
                        gameOver();
                        return;
                    }
                }
            }

            // Player vs Asteroids
            for(let i = asteroids.length-1; i>=0; i--) {
                const a = asteroids[i];
                if(dist(player.x, player.y, a.x, a.y) < player.radius + a.radius * 0.8) {
                    player.health -= 20;
                    player.invincibleTimer = 40;
                    screenShakeAmount = 15;
                    createExplosion(a.x, a.y, '#fff', 20, 4, 2);
                    asteroids.splice(i, 1);
                    updateUI();
                    if(player.health <= 0) {
                        createExplosion(player.x, player.y, '#0ff', 50, 8, 4);
                        screenShakeAmount = 30;
                        gameOver();
                        return;
                    }
                }
            }
        }

        // Player Lasers vs Enemies
        for(let i = projectiles.length-1; i>=0; i--) {
            const p = projectiles[i];
            if(!p.isEnemy) {
                for(let j = enemies.length-1; j>=0; j--) {
                    const e = enemies[j];
                    if(dist(p.x, p.y, e.x, e.y) < e.radius + p.radius) {
                        e.health -= p.damage;
                        createExplosion(p.x, p.y, '#0ff', 5, 2, 1);
                        projectiles.splice(i, 1);
                        if(e.health <= 0) {
                            createExplosion(e.x, e.y, '#f0f', 40, 6, 3);
                            screenShakeAmount = 5;
                            enemies.splice(j, 1);
                            score += 100;
                            updateUI();
                        }
                        break;
                    }
                }
            }
        }

        // Player Lasers vs Asteroids
        for(let i = projectiles.length-1; i>=0; i--) {
            const p = projectiles[i];
            if(!p.isEnemy) {
                for(let j = asteroids.length-1; j>=0; j--) {
                    const a = asteroids[j];
                    if(dist(p.x, p.y, a.x, a.y) < a.radius + p.radius) {
                        a.health -= p.damage;
                        createExplosion(p.x, p.y, '#0ff', 3, 2, 1);
                        projectiles.splice(i, 1);
                        if(a.health <= 0) {
                            createExplosion(a.x, a.y, '#aaa', 30, 5, 3);
                            screenShakeAmount = 8;
                            asteroids.splice(j, 1);
                            score += 25;
                            updateUI();
                        }
                        break;
                    }
                }
            }
        }
    }

    // Drawing Functions
    function drawStars() {
        ctx.fillStyle = '#fff';
        stars.forEach(star => {
            star.y += star.speed;
            if(star.y > canvas.height) {
                star.y = 0;
                star.x = Math.random() * canvas.width;
            }
            ctx.globalAlpha = star.speed / 3; // Brighter if closer/faster
            ctx.fillRect(star.x, star.y, star.size, star.size);
        });
        ctx.globalAlpha = 1;
    }

    function drawPlayer() {
        ctx.save();
        ctx.translate(player.x, player.y);
        ctx.rotate(player.angle + Math.PI / 2); // Adjust so top is forward

        if(player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 3) % 2 === 0) {
            ctx.globalAlpha = 0.5; // Flash effect
        }

        // Glow
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#0ff';

        // Ship Body
        ctx.fillStyle = '#0af';
        ctx.beginPath();
        ctx.moveTo(0, -20); // Nose
        ctx.lineTo(-12, 14); // Left wing
        ctx.lineTo(-4, 8);   // Left indent
        ctx.lineTo(4, 8);    // Right indent
        ctx.lineTo(12, 14);  // Right wing
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(0, -4, 4, 0, Math.PI*2);
        ctx.fill();

        ctx.restore();
    }

    function drawProjectiles() {
        ctx.save();
        // Additive blending for lasers
        ctx.globalCompositeOperation = 'lighter';
        
        projectiles.forEach(p => {
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2);
            ctx.fill();
            
            // Streak
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.radius * 0.8;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x - p.vx*1.5, p.y - p.vy*1.5);
            ctx.stroke();
        });
        ctx.restore();
    }

    function drawEnemies() {
        ctx.save();
        enemies.forEach(e => {
            ctx.translate(e.x, e.y);
            ctx.rotate(e.angle + Math.PI / 2);
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f0f';
            
            // Alien Ship Body
            ctx.fillStyle = '#a0f';
            ctx.beginPath();
            ctx.moveTo(0, -18);
            ctx.quadraticCurveTo(15, -5, 10, 15);
            ctx.lineTo(-10, 15);
            ctx.quadraticCurveTo(-15, -5, 0, -18);
            ctx.fill();

            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(0, 1, 2.5, 0, Math.PI*2);
            ctx.fill();

            ctx.resetTransform(); // Faster than restore/translate back
        });
        ctx.restore();
    }

    function drawAsteroids() {
        ctx.save();
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#555';
        ctx.fillStyle = '#4a4a4a';
        ctx.strokeStyle = '#7a7a7a';
        ctx.lineWidth = 2;

        asteroids.forEach(a => {
            ctx.save();
            ctx.translate(a.x, a.y);
            ctx.rotate(a.rotation);
            
            ctx.beginPath();
            ctx.moveTo(a.vertices[0].x, a.vertices[0].y);
            for(let i=1; i<a.vertices.length; i++) {
                ctx.lineTo(a.vertices[i].x, a.vertices[i].y);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        });
        ctx.restore();
    }

    function drawParticles() {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 5;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.restore();
    }

    // Main Loop
    function loop() {
        if(!gameRunning) return;

        // Clear
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Screen Shake
        ctx.save();
        if(screenShakeAmount > 0) {
            ctx.translate(randomRange(-screenShakeAmount, screenShakeAmount), randomRange(-screenShakeAmount, screenShakeAmount));
            screenShakeAmount *= 0.9;
            if(screenShakeAmount < 0.5) screenShakeAmount = 0;
        }

        // Spawning Logic
        spawnTimer++;
        if(spawnTimer >= spawnInterval) {
            spawnTimer = 0;
            if(Math.random() < 0.6 || wave > 3) spawnEnemy();
            if(Math.random() < 0.8) spawnAsteroid();
            
            // Increase difficulty
            score += 10;
            if(score > 0 && score % 500 === 0) {
                wave++;
                spawnInterval = Math.max(30, spawnInterval - 10);
                updateUI();
            }
        }

        // Updates
        updatePlayer();
        updateProjectiles();
        updateEnemies();
        updateAsteroids();
        updateParticles();
        checkCollisions();

        // Draws
        drawStars();
        drawAsteroids();
        drawParticles();
        drawProjectiles();
        drawEnemies();
        drawPlayer();

        ctx.restore(); // End screen shake transform

        requestAnimationFrame(loop);
    }

</script>
