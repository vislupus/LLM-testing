<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID RUNNER - Space Shooter</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    cursor: none;
  }
  canvas { display: block; }

  #ui {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 16px 24px; pointer-events: none;
  }
  .ui-block {
    background: rgba(0,0,0,.5);
    border: 1px solid rgba(0,200,255,.15);
    border-radius: 8px; padding: 8px 14px;
    color: #8cf; font-size: 13px;
    backdrop-filter: blur(6px);
  }
  .ui-block .label { color: #4a6a8a; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; }
  .ui-block .value { color: #0ff; font-size: 20px; font-weight: 700; text-shadow: 0 0 10px rgba(0,255,255,.5); }

  #hpBar {
    width: 200px; height: 8px; background: rgba(255,255,255,.1);
    border-radius: 4px; overflow: hidden; margin-top: 4px;
  }
  #hpFill {
    height: 100%; width: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #0f0, #0ff);
    transition: width .3s, background .3s;
    box-shadow: 0 0 8px rgba(0,255,255,.4);
  }

  #shieldBar {
    width: 200px; height: 4px; background: rgba(255,255,255,.05);
    border-radius: 2px; overflow: hidden; margin-top: 2px;
  }
  #shieldFill {
    height: 100%; width: 100%; border-radius: 2px;
    background: linear-gradient(90deg, #44f, #88f);
    transition: width .3s;
    box-shadow: 0 0 6px rgba(100,100,255,.4);
  }

  #overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,.85);
    backdrop-filter: blur(10px);
    transition: opacity .5s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay h1 {
    font-size: 64px; font-weight: 900; letter-spacing: 8px;
    background: linear-gradient(135deg, #0ff, #f0f, #ff0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: none; margin-bottom: 8px;
  }
  #overlay .subtitle { color: #4a6a8a; font-size: 14px; letter-spacing: 4px; margin-bottom: 40px; }
  #overlay .stats { color: #8cf; font-size: 16px; margin-bottom: 8px; }
  #overlay .stats span { color: #0ff; font-weight: 700; }

  #startBtn {
    margin-top: 20px; padding: 14px 48px;
    background: linear-gradient(135deg, rgba(0,255,255,.2), rgba(0,100,255,.2));
    border: 1px solid rgba(0,255,255,.4);
    color: #0ff; font-size: 18px; font-weight: 700;
    letter-spacing: 3px; border-radius: 30px;
    cursor: pointer; pointer-events: auto;
    transition: all .2s;
    text-transform: uppercase;
  }
  #startBtn:hover {
    background: linear-gradient(135deg, rgba(0,255,255,.4), rgba(0,100,255,.4));
    box-shadow: 0 0 30px rgba(0,255,255,.3);
    transform: scale(1.05);
  }

  #waveBanner {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    z-index: 50; color: #0ff; font-size: 36px; font-weight: 800;
    letter-spacing: 4px; pointer-events: none;
    text-shadow: 0 0 30px rgba(0,255,255,.6), 0 0 60px rgba(0,255,255,.3);
    opacity: 0; transition: opacity .3s;
  }
  #waveBanner.show { opacity: 1; }

  #comboDisplay {
    position: fixed; top: 50%; right: 30px; transform: translateY(-50%);
    z-index: 50; color: #ff0; font-size: 24px; font-weight: 800;
    pointer-events: none; opacity: 0; transition: opacity .3s;
    text-shadow: 0 0 20px rgba(255,255,0,.5);
  }
  #comboDisplay.show { opacity: 1; }

  #powerupMsg {
    position: fixed; top: 35%; left: 50%; transform: translate(-50%,-50%);
    z-index: 50; color: #0f0; font-size: 20px; font-weight: 700;
    letter-spacing: 2px; pointer-events: none;
    opacity: 0; transition: opacity .3s;
    text-shadow: 0 0 15px rgba(0,255,0,.5);
  }
  #powerupMsg.show { opacity: 1; }

  #crosshair {
    position: fixed; z-index: 20; pointer-events: none;
    width: 24px; height: 24px;
    border: 2px solid rgba(0,255,255,.5);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width .1s, height .1s;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,255,255,.4);
  }
  #crosshair::before {
    width: 1px; height: 8px; top: -4px; left: 50%; transform: translateX(-50%);
  }
  #crosshair::after {
    width: 8px; height: 1px; left: -4px; top: 50%; transform: translateY(-50%);
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="crosshair"></div>

<div id="ui">
  <div class="ui-block">
    <div class="label">Score</div>
    <div class="value" id="scoreVal">0</div>
  </div>
  <div class="ui-block" style="text-align:center;">
    <div class="label">Wave</div>
    <div class="value" id="waveVal">1</div>
  </div>
  <div class="ui-block">
    <div class="label">Hull Integrity</div>
    <div id="hpBar"><div id="hpFill"></div></div>
    <div id="shieldBar"><div id="shieldFill"></div></div>
    <div style="margin-top:4px;">
      <span class="label">Shield</span>
    </div>
  </div>
</div>

<div id="waveBanner"></div>
<div id="comboDisplay"></div>
<div id="powerupMsg"></div>

<div id="overlay">
  <h1>VOID RUNNER</h1>
  <div class="subtitle">SPACE SHOOTER</div>
  <div class="stats" id="prevStats" style="display:none;"></div>
  <button id="startBtn">LAUNCH</button>
  <div style="color:#4a6a8a;font-size:11px;margin-top:20px;letter-spacing:1px;">
    WASD / Arrow Keys to move &nbsp;|&nbsp; Mouse to aim &nbsp;|&nbsp; Click / Space to fire
  </div>
</div>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════
   CANVAS SETUP
   ═══════════════════════════════════════════ */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

/* ═══════════════════════════════════════════
   AUDIO (Procedural)
   ═══════════════════════════════════════════ */
let audioCtx = null;
function initAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;

  switch(type){
    case 'laser': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + .12);
      gain.gain.setValueAtTime(.08, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + .12);
      break;
    }
    case 'laserHeavy': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + .2);
      gain.gain.setValueAtTime(.12, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .2);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + .2);
      break;
    }
    case 'explosion': {
      const bufferSize = audioCtx.sampleRate * .3;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * (1-i/bufferSize);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.15, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .3);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2000, now);
      filter.frequency.exponentialRampToValueAtTime(100, now + .3);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(now);
      break;
    }
    case 'bigExplosion': {
      const bufferSize = audioCtx.sampleRate * .6;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1-i/bufferSize, .5);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(.25, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .6);
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, now);
      filter.frequency.exponentialRampToValueAtTime(60, now + .6);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(now);
      break;
    }
    case 'hit': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(50, now + .1);
      gain.gain.setValueAtTime(.1, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .1);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + .1);
      break;
    }
    case 'powerup': {
      [523,659,784,1047].forEach((f,i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(.08, now + i*.08);
        gain.gain.exponentialRampToValueAtTime(.001, now + i*.08 + .15);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i*.08); osc.stop(now + i*.08 + .15);
      });
      break;
    }
    case 'shield': {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + .15);
      gain.gain.setValueAtTime(.06, now);
      gain.gain.exponentialRampToValueAtTime(.001, now + .15);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + .15);
      break;
    }
    case 'gameover': {
      [400,350,300,200,150].forEach((f,i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = f;
        gain.gain.setValueAtTime(.08, now + i*.15);
        gain.gain.exponentialRampToValueAtTime(.001, now + i*.15 + .3);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(now + i*.15); osc.stop(now + i*.15 + .3);
      });
      break;
    }
  }
}

/* ═══════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════ */
let W, H;
let player, bullets, enemies, asteroids, particles, powerups, stars;
let score, wave, combo, comboTimer, maxCombo;
let gameRunning, gameOver, lastTime, waveTimer, enemiesLeft;
let screenShakeX, screenShakeY, screenShakeDecay;
let mouseX, mouseY, mouseDown;
let keys = {};
let fireTimer, fireRate;
let totalKills, prevScore, prevWave, prevKills;

/* ═══════════════════════════════════════════
   STARFIELD
   ═══════════════════════════════════════════ */
function createStars(){
  stars = [];
  for(let layer = 0; layer < 3; layer++){
    const count = [120, 80, 40][layer];
    for(let i = 0; i < count; i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: [1, 1.5, 2.5][layer] * (.5 + Math.random()*.5),
        speed: [0.3, 0.6, 1.2][layer],
        brightness: [0.3, 0.5, 0.8][layer] * (.5 + Math.random()*.5),
        twinkle: Math.random() * Math.PI * 2,
        twinkleSpeed: .5 + Math.random() * 2,
        layer
      });
    }
  }
}

/* ═══════════════════════════════════════════
   NEBULA BACKGROUND
   ═══════════════════════════════════════════ */
let nebulaCanvas;
function createNebula(){
  nebulaCanvas = document.createElement('canvas');
  nebulaCanvas.width = W;
  nebulaCanvas.height = H;
  const nctx = nebulaCanvas.getContext('2d');

  // Create several nebula clouds
  for(let i = 0; i < 5; i++){
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = 100 + Math.random() * 300;
    const hue = Math.random() * 360;
    const grad = nctx.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, `hsla(${hue}, 80%, 30%, .08)`);
    grad.addColorStop(.5, `hsla(${hue+30}, 60%, 20%, .04)`);
    grad.addColorStop(1, 'transparent');
    nctx.fillStyle = grad;
    nctx.fillRect(0, 0, W, H);
  }
}

/* ═══════════════════════════════════════════
   PLAYER
   ═══════════════════════════════════════════ */
function createPlayer(){
  return {
    x: W / 2,
    y: H * .75,
    vx: 0, vy: 0,
    width: 28, height: 36,
    hp: 100, maxHP: 100,
    shield: 50, maxShield: 50,
    shieldRegen: 5, // per second
    shieldRegenDelay: 0,
    speed: 320,
    angle: -Math.PI/2,
    invincible: 0,
    weaponLevel: 1,
    fireRate: .12,
    engineFlicker: 0
  };
}

function drawPlayer(){
  const p = player;
  if(!p) return;

  ctx.save();
  ctx.translate(p.x, p.y);

  // Aim toward mouse
  const aimAngle = Math.atan2(mouseY - p.y, mouseX - p.x);
  p.angle = aimAngle;
  ctx.rotate(p.angle + Math.PI/2);

  // Invincibility flash
  if(p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0){
    ctx.globalAlpha = .4;
  }

  // Engine glow
  p.engineFlicker += .15;
  const engineSize = 12 + Math.sin(p.engineFlicker) * 3 + Math.sin(p.engineFlicker * 2.7) * 2;
  const engineGrad = ctx.createRadialGradient(0, 20, 0, 0, 20, engineSize);
  engineGrad.addColorStop(0, 'rgba(0,200,255,.8)');
  engineGrad.addColorStop(.3, 'rgba(0,100,255,.4)');
  engineGrad.addColorStop(1, 'rgba(0,50,255,0)');
  ctx.fillStyle = engineGrad;
  ctx.beginPath();
  ctx.arc(0, 20, engineSize, 0, Math.PI * 2);
  ctx.fill();

  // Engine flame
  const flameH = 14 + Math.sin(p.engineFlicker * 3) * 5;
  ctx.fillStyle = '#0af';
  ctx.beginPath();
  ctx.moveTo(-5, 16);
  ctx.lineTo(0, 16 + flameH);
  ctx.lineTo(5, 16);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(-3, 16);
  ctx.lineTo(0, 16 + flameH * .6);
  ctx.lineTo(3, 16);
  ctx.closePath();
  ctx.fill();

  // Ship body
  ctx.globalAlpha = p.invincible > 0 && Math.floor(p.invincible * 10) % 2 === 0 ? .4 : 1;

  // Main hull
  const hullGrad = ctx.createLinearGradient(0, -18, 0, 18);
  hullGrad.addColorStop(0, '#2a4a6a');
  hullGrad.addColorStop(.5, '#1a3a5a');
  hullGrad.addColorStop(1, '#0a2a4a');
  ctx.fillStyle = hullGrad;
  ctx.beginPath();
  ctx.moveTo(0, -18);
  ctx.lineTo(-12, 8);
  ctx.lineTo(-14, 14);
  ctx.lineTo(-8, 16);
  ctx.lineTo(8, 16);
  ctx.lineTo(14, 14);
  ctx.lineTo(12, 8);
  ctx.closePath();
  ctx.fill();

  // Hull highlight
  ctx.strokeStyle = 'rgba(0,200,255,.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Cockpit
  const cockpitGrad = ctx.createLinearGradient(0, -14, 0, -4);
  cockpitGrad.addColorStop(0, '#0ff');
  cockpitGrad.addColorStop(1, '#048');
  ctx.fillStyle = cockpitGrad;
  ctx.beginPath();
  ctx.moveTo(0, -14);
  ctx.lineTo(-5, -4);
  ctx.lineTo(5, -4);
  ctx.closePath();
  ctx.fill();

  // Wings
  ctx.fillStyle = '#1a3a5a';
  ctx.beginPath();
  ctx.moveTo(-12, 8);
  ctx.lineTo(-22, 14);
  ctx.lineTo(-18, 16);
  ctx.lineTo(-10, 12);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(12, 8);
  ctx.lineTo(22, 14);
  ctx.lineTo(18, 16);
  ctx.lineTo(10, 12);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Shield visual
  if(p.shield > 0){
    const shieldAlpha = (p.shield / p.maxShield) * .15;
    ctx.strokeStyle = `rgba(100,150,255,${shieldAlpha + .1})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════
   BULLETS
   ═══════════════════════════════════════════ */
function fireBullet(){
  if(!player || player.invincible > 0) return;
  const p = player;
  const angle = p.angle;
  const speed = 700;
  const cos = Math.cos(angle);
  const sin = Math.sin(angle);

  playSound(p.weaponLevel >= 3 ? 'laserHeavy' : 'laser');

  const bx = p.x + cos * 20;
  const by = p.y + sin * 20;

  if(p.weaponLevel === 1){
    bullets.push({
      x: bx, y: by,
      vx: cos * speed, vy: sin * speed,
      damage: 20, life: 2, size: 3,
      color: '#0ff', type: 'player'
    });
  } else if(p.weaponLevel === 2){
    for(let i = -1; i <= 1; i += 2){
      const perpCos = Math.cos(angle + Math.PI/2) * i * 5;
      const perpSin = Math.sin(angle + Math.PI/2) * i * 5;
      bullets.push({
        x: bx + perpCos, y: by + perpSin,
        vx: cos * speed, vy: sin * speed,
        damage: 18, life: 2, size: 3,
        color: '#0ff', type: 'player'
      });
    }
  } else {
    for(let i = -1; i <= 1; i++){
      const spread = i * .12;
      const a = angle + spread;
      bullets.push({
        x: bx, y: by,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
        damage: 22, life: 2, size: 3,
        color: '#0ff', type: 'player'
      });
    }
  }
}

function drawBullet(b){
  ctx.save();

  // Glow
  const glowGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.size * 4);
  glowGrad.addColorStop(0, b.color || '#0ff');
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.globalAlpha = .4;
  ctx.fillRect(b.x - b.size*4, b.y - b.size*4, b.size*8, b.size*8);

  // Core
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.size * .6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = b.color || '#0ff';
  ctx.beginPath();
  ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
  ctx.fill();

  // Trail
  ctx.strokeStyle = b.color || '#0ff';
  ctx.lineWidth = b.size * .8;
  ctx.globalAlpha = .3;
  ctx.beginPath();
  ctx.moveTo(b.x, b.y);
  ctx.lineTo(b.x - b.vx * .02, b.y - b.vy * .02);
  ctx.stroke();

  ctx.restore();
}

/* ═══════════════════════════════════════════
   ASTEROIDS
   ═══════════════════════════════════════════ */
function createAsteroid(x, y, size){
  const s = size || (30 + Math.random() * 50);
  // Generate irregular shape
  const points = [];
  const numPoints = 8 + Math.floor(Math.random() * 6);
  for(let i = 0; i < numPoints; i++){
    const angle = (i / numPoints) * Math.PI * 2;
    const r = s * (.6 + Math.random() * .4);
    points.push({ angle, r });
  }

  const hue = 20 + Math.random() * 30;
  const lightness = 25 + Math.random() * 15;

  return {
    x: x !== undefined ? x : Math.random() * W,
    y: y !== undefined ? y : -s - Math.random() * 200,
    vx: (Math.random() - .5) * 40,
    vy: 30 + Math.random() * 60,
    size: s,
    hp: s * 1.5,
    maxHP: s * 1.5,
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - .5) * 1.5,
    points,
    hue,
    lightness,
    type: 'asteroid'
  };
}

function drawAsteroid(a){
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rotation);

  // Shadow/glow
  ctx.shadowColor = `hsla(${a.hue}, 30%, ${a.lightness}%, .3)`;
  ctx.shadowBlur = 10;

  // Body
  const grad = ctx.createRadialGradient(-a.size*.2, -a.size*.2, 0, 0, 0, a.size);
  grad.addColorStop(0, `hsl(${a.hue}, 20%, ${a.lightness + 15}%)`);
  grad.addColorStop(1, `hsl(${a.hue}, 15%, ${a.lightness - 10}%)`);
  ctx.fillStyle = grad;

  ctx.beginPath();
  ctx.moveTo(
    Math.cos(a.points[0].angle) * a.points[0].r,
    Math.sin(a.points[0].angle) * a.points[0].r
  );
  for(let i = 1; i < a.points.length; i++){
    ctx.lineTo(
      Math.cos(a.points[i].angle) * a.points[i].r,
      Math.sin(a.points[i].angle) * a.points[i].r
    );
  }
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // Outline
  ctx.strokeStyle = `hsla(${a.hue}, 20%, ${a.lightness + 20}%, .3)`;
  ctx.lineWidth = 1;
  ctx.stroke();

  // Craters
  ctx.fillStyle = `hsla(${a.hue}, 15%, ${a.lightness - 8}%, .4)`;
  for(let i = 0; i < 3; i++){
    const cx = (Math.random() - .5) * a.size * .8;
    const cy = (Math.random() - .5) * a.size * .8;
    const cr = a.size * (.08 + Math.random() * .1);
    ctx.beginPath();
    ctx.arc(cx, cy, cr, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════
   ENEMIES (Alien Invaders)
   ═══════════════════════════════════════════ */
function createEnemy(type, x, y){
  const types = {
    scout: { hp: 30, speed: 150, size: 16, score: 100, color: '#f44', fireRate: 2 },
    fighter: { hp: 60, speed: 100, size: 20, score: 200, color: '#f80', fireRate: 1.5 },
    cruiser: { hp: 120, speed: 60, size: 28, score: 400, color: '#f0f', fireRate: 1 },
    boss: { hp: 500, speed: 40, size: 45, score: 2000, color: '#ff0', fireRate: .5 }
  };

  const t = types[type] || types.scout;
  return {
    x: x || Math.random() * (W - 100) + 50,
    y: y || -50,
    vx: 0, vy: t.speed * .5,
    ...t,
    type,
    maxHP: t.hp,
    rotation: 0,
    fireTimer: Math.random() * t.fireRate,
    movePattern: Math.random() * Math.PI * 2,
    moveSpeed: 1 + Math.random() * 2,
    alive: true,
    flash: 0
  };
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x, e.y);

  const flash = e.flash > 0;
  e.rotation += .02;

  // Glow
  const glowGrad = ctx.createRadialGradient(0, 0, e.size * .5, 0, 0, e.size * 2);
  glowGrad.addColorStop(0, flash ? '#fff' : e.color);
  glowGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGrad;
  ctx.globalAlpha = .2;
  ctx.fillRect(-e.size*2, -e.size*2, e.size*4, e.size*4);
  ctx.globalAlpha = 1;

  switch(e.type){
    case 'scout':
      // Diamond shape
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath();
      ctx.moveTo(0, -e.size);
      ctx.lineTo(e.size * .7, 0);
      ctx.lineTo(0, e.size * .6);
      ctx.lineTo(-e.size * .7, 0);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.lineWidth = 1;
      ctx.stroke();
      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, -e.size * .2, 3, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 'fighter':
      // Angular ship
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath();
      ctx.moveTo(0, -e.size);
      ctx.lineTo(e.size, e.size * .3);
      ctx.lineTo(e.size * .6, e.size * .7);
      ctx.lineTo(-e.size * .6, e.size * .7);
      ctx.lineTo(-e.size, e.size * .3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.stroke();
      // Wings
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.globalAlpha = .7;
      ctx.beginPath();
      ctx.moveTo(-e.size, e.size * .3);
      ctx.lineTo(-e.size * 1.4, e.size * .8);
      ctx.lineTo(-e.size * .6, e.size * .7);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(e.size, e.size * .3);
      ctx.lineTo(e.size * 1.4, e.size * .8);
      ctx.lineTo(e.size * .6, e.size * .7);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      // Eyes
      ctx.fillStyle = '#ff0';
      ctx.beginPath();
      ctx.arc(-4, -e.size * .2, 2.5, 0, Math.PI * 2);
      ctx.arc(4, -e.size * .2, 2.5, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 'cruiser':
      // Hexagonal
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath();
      for(let i = 0; i < 6; i++){
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const px = Math.cos(a) * e.size;
        const py = Math.sin(a) * e.size;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.3)';
      ctx.stroke();
      // Inner hex
      ctx.fillStyle = flash ? '#faa' : '#808';
      ctx.beginPath();
      for(let i = 0; i < 6; i++){
        const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
        const px = Math.cos(a) * e.size * .5;
        const py = Math.sin(a) * e.size * .5;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      // Core eye
      ctx.fillStyle = '#f0f';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, 2, 0, Math.PI * 2);
      ctx.fill();
      break;

    case 'boss':
      // Large menacing shape
      ctx.fillStyle = flash ? '#fff' : e.color;
      ctx.beginPath();
      ctx.moveTo(0, -e.size);
      ctx.lineTo(e.size * 1.2, -e.size * .3);
      ctx.lineTo(e.size, e.size * .5);
      ctx.lineTo(e.size * .5, e.size);
      ctx.lineTo(-e.size * .5, e.size);
      ctx.lineTo(-e.size, e.size * .5);
      ctx.lineTo(-e.size * 1.2, -e.size * .3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.4)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Rotating ring
      ctx.save();
      ctx.rotate(e.rotation);
      ctx.strokeStyle = `rgba(255,255,0,${.3 + Math.sin(performance.now()/500)*.2})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, e.size * .7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Eyes
      ctx.fillStyle = '#f00';
      ctx.beginPath();
      ctx.arc(-10, -5, 5, 0, Math.PI * 2);
      ctx.arc(10, -5, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-10, -5, 2, 0, Math.PI * 2);
      ctx.arc(10, -5, 2, 0, Math.PI * 2);
      ctx.fill();

      // HP bar
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(-e.size, -e.size - 12, e.size * 2, 5);
      ctx.fillStyle = e.hp / e.maxHP > .3 ? '#0f0' : '#f00';
      ctx.fillRect(-e.size, -e.size - 12, e.size * 2 * (e.hp / e.maxHP), 5);
      break;
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════
   PARTICLES
   ═══════════════════════════════════════════ */
function spawnExplosion(x, y, count, color, speed, size){
  for(let i = 0; i < count; i++){
    const angle = Math.random() * Math.PI * 2;
    const spd = (speed || 200) * (.3 + Math.random() * .7);
    const s = (size || 3) * (.5 + Math.random() * .5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: .01 + Math.random() * .025,
      size: s,
      color: color || '#ff8800',
      type: 'explosion'
    });
  }

  // Sparks
  for(let i = 0; i < count / 2; i++){
    const angle = Math.random() * Math.PI * 2;
    const spd = (speed || 200) * (.5 + Math.random() * 1.5);
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: .02 + Math.random() * .04,
      size: 1 + Math.random(),
      color: '#fff',
      type: 'spark'
    });
  }

  // Shockwave ring
  particles.push({
    x, y, vx: 0, vy: 0,
    life: 1, decay: .03,
    size: 5, maxSize: (size || 3) * 20,
    color: color || '#ff8800',
    type: 'ring'
  });
}

function spawnEngineTrail(x, y, angle){
  for(let i = 0; i < 2; i++){
    const spread = (Math.random() - .5) * .5;
    const spd = 30 + Math.random() * 50;
    const a = angle + Math.PI/2 + spread;
    particles.push({
      x: x + (Math.random()-0.5) * 6,
      y: y + (Math.random()-0.5) * 6,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 1,
      decay: .04 + Math.random() * .04,
      size: 1 + Math.random() * 2,
      color: '#08f',
      type: 'trail'
    });
  }
}

function drawParticle(p){
  ctx.save();

  if(p.type === 'ring'){
    const progress = 1 - p.life;
    const currentSize = p.size + (p.maxSize - p.size) * progress;
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = p.life * .5;
    ctx.lineWidth = 2 * p.life;
    ctx.beginPath();
    ctx.arc(p.x, p.y, currentSize, 0, Math.PI * 2);
    ctx.stroke();
  } else if(p.type === 'spark'){
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    // Trail
    ctx.strokeStyle = p.color;
    ctx.globalAlpha = p.life * .3;
    ctx.lineWidth = p.size * .5;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * .03, p.y - p.vy * .03);
    ctx.stroke();
  } else {
    ctx.globalAlpha = p.life;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
    grad.addColorStop(0, p.color);
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.restore();
}

/* ═══════════════════════════════════════════
   POWERUPS
   ═══════════════════════════════════════════ */
function spawnPowerup(x, y){
  if(Math.random() > .25) return; // 25% chance
  const types = ['weapon', 'health', 'shield'];
  const type = types[Math.floor(Math.random() * types.length)];
  const colors = { weapon: '#0ff', health: '#0f0', shield: '#44f' };
  const labels = { weapon: 'W', health: '+', shield: 'S' };

  powerups.push({
    x, y,
    vy: 50,
    type,
    color: colors[type],
    label: labels[type],
    size: 12,
    life: 10,
    pulse: 0
  });
}

function drawPowerup(p){
  ctx.save();
  ctx.translate(p.x, p.y);

  p.pulse += .05;
  const pulseSize = p.size + Math.sin(p.pulse) * 3;

  // Glow
  const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, pulseSize * 3);
  grad.addColorStop(0, p.color);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.globalAlpha = .3;
  ctx.beginPath();
  ctx.arc(0, 0, pulseSize * 3, 0, Math.PI * 2);
  ctx.fill();

  // Box
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.6)';
  ctx.strokeStyle = p.color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, pulseSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Label
  ctx.fillStyle = p.color;
  ctx.font = `bold ${pulseSize}px "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.label, 0, 1);

  ctx.restore();
}

/* ═══════════════════════════════════════════
   WAVE SYSTEM
   ═══════════════════════════════════════════ */
function startWave(){
  waveTimer = 0;
  const banner = document.getElementById('waveBanner');
  banner.textContent = `WAVE ${wave}`;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2000);

  // Spawn enemies based on wave
  const numScouts = Math.min(3 + wave * 2, 20);
  const numFighters = wave >= 2 ? Math.min(wave - 1, 10) : 0;
  const numCruisers = wave >= 4 ? Math.min(Math.floor((wave - 3) / 2), 5) : 0;
  const hasBoss = wave % 5 === 0;

  enemiesLeft = numScouts + numFighters + numCruisers + (hasBoss ? 1 : 0);

  // Stagger spawns
  for(let i = 0; i < numScouts; i++){
    setTimeout(() => {
      if(!gameRunning) return;
      enemies.push(createEnemy('scout'));
    }, i * 400);
  }
  for(let i = 0; i < numFighters; i++){
    setTimeout(() => {
      if(!gameRunning) return;
      enemies.push(createEnemy('fighter'));
    }, 1000 + i * 600);
  }
  for(let i = 0; i < numCruisers; i++){
    setTimeout(() => {
      if(!gameRunning) return;
      enemies.push(createEnemy('cruiser'));
    }, 2000 + i * 800);
  }
  if(hasBoss){
    setTimeout(() => {
      if(!gameRunning) return;
      enemies.push(createEnemy('boss', W/2, -60));
    }, 3000);
  }

  // Spawn asteroids
  const numAsteroids = 3 + wave;
  for(let i = 0; i < numAsteroids; i++){
    setTimeout(() => {
      if(!gameRunning) return;
      asteroids.push(createAsteroid());
    }, Math.random() * 5000);
  }
}

/* ═══════════════════════════════════════════
   COLLISION
   ═══════════════════════════════════════════ */
function circleCollision(a, b, r1, r2){
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx*dx + dy*dy < (r1+r2)*(r1+r2);
}

/* ═══════════════════════════════════════════
   SCREEN SHAKE
   ═══════════════════════════════════════════ */
function addScreenShake(amount){
  screenShakeX = (Math.random() - .5) * amount;
  screenShakeY = (Math.random() - .5) * amount;
  screenShakeDecay = amount;
}

/* ═══════════════════════════════════════════
   COMBO
   ═══════════════════════════════════════════ */
function addCombo(){
  combo++;
  comboTimer = 2;
  if(combo > maxCombo) maxCombo = combo;

  const comboEl = document.getElementById('comboDisplay');
  if(combo >= 3){
    comboEl.textContent = `${combo}x COMBO`;
    comboEl.classList.add('show');
  }
}

/* ═══════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════ */
function initGame(){
  W = canvas.width;
  H = canvas.height;

  player = createPlayer();
  bullets = [];
  enemies = [];
  asteroids = [];
  particles = [];
  powerups = [];
  score = 0;
  wave = 1;
  combo = 0;
  comboTimer = 0;
  maxCombo = 0;
  gameRunning = true;
  gameOver = false;
  lastTime = performance.now();
  waveTimer = 0;
  enemiesLeft = 0;
  screenShakeX = 0;
  screenShakeY = 0;
  screenShakeDecay = 0;
  fireTimer = 0;
  totalKills = 0;

  createStars();
  createNebula();

  document.getElementById('overlay').classList.add('hidden');
  updateUI();

  startWave();
}

function endGame(){
  gameRunning = false;
  gameOver = true;
  playSound('gameover');

  // Big explosion at player position
  spawnExplosion(player.x, player.y, 80, '#0ff', 400, 5);
  spawnExplosion(player.x, player.y, 60, '#f80', 300, 4);
  addScreenShake(30);

  setTimeout(() => {
    const overlay = document.getElementById('overlay');
    document.querySelector('#overlay h1').textContent = 'GAME OVER';
    document.querySelector('#overlay .subtitle').textContent = 'YOUR SHIP WAS DESTROYED';
    const stats = document.getElementById('prevStats');
    stats.style.display = 'block';
    stats.innerHTML = `
      Score: <span>${score.toLocaleString()}</span> &nbsp;|&nbsp;
      Wave: <span>${wave}</span> &nbsp;|&nbsp;
      Kills: <span>${totalKills}</span> &nbsp;|&nbsp;
      Max Combo: <span>${maxCombo}x</span>
    `;
    document.getElementById('startBtn').textContent = 'RELAUNCH';
    overlay.classList.remove('hidden');
  }, 1500);
}

function updateUI(){
  document.getElementById('scoreVal').textContent = score.toLocaleString();
  document.getElementById('waveVal').textContent = wave;

  const hpPct = Math.max(0, player.hp / player.maxHP * 100);
  const hpFill = document.getElementById('hpFill');
  hpFill.style.width = hpPct + '%';
  if(hpPct < 30) hpFill.style.background = 'linear-gradient(90deg, #f00, #f44)';
  else if(hpPct < 60) hpFill.style.background = 'linear-gradient(90deg, #f80, #ff0)';
  else hpFill.style.background = 'linear-gradient(90deg, #0f0, #0ff)';

  const shieldPct = Math.max(0, player.shield / player.maxShield * 100);
  document.getElementById('shieldFill').style.width = shieldPct + '%';
}

/* ═══════════════════════════════════════════
   UPDATE
   ═══════════════════════════════════════════ */
function update(dt){
  if(!gameRunning) return;

  W = canvas.width;
  H = canvas.height;

  // Screen shake decay
  if(screenShakeDecay > 0){
    screenShakeDecay *= .9;
    screenShakeX = (Math.random() - .5) * screenShakeDecay;
    screenShakeY = (Math.random() - .5) * screenShakeDecay;
    if(screenShakeDecay < .5) screenShakeDecay = 0;
  }

  // Combo timer
  if(comboTimer > 0){
    comboTimer -= dt;
    if(comboTimer <= 0){
      combo = 0;
      document.getElementById('comboDisplay').classList.remove('show');
    }
  }

  /* ── Player Movement ── */
  if(player && player.hp > 0){
    let mx = 0, my = 0;
    if(keys['ArrowLeft'] || keys['KeyA']) mx -= 1;
    if(keys['ArrowRight'] || keys['KeyD']) mx += 1;
    if(keys['ArrowUp'] || keys['KeyW']) my -= 1;
    if(keys['ArrowDown'] || keys['KeyS']) my += 1;

    // Normalize diagonal
    if(mx && my){ mx *= .707; my *= .707; }

    player.vx = mx * player.speed;
    player.vy = my * player.speed;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    // Bounds
    player.x = Math.max(player.width, Math.min(W - player.width, player.x));
    player.y = Math.max(player.height, Math.min(H - player.height, player.y));

    // Engine trail
    if(mx || my){
      spawnEngineTrail(player.x, player.y, player.angle);
    }

    // Shield regen
    if(player.shieldRegenDelay > 0){
      player.shieldRegenDelay -= dt;
    } else {
      player.shield = Math.min(player.maxShield, player.shield + player.shieldRegen * dt);
    }

    // Invincibility
    if(player.invincible > 0) player.invincible -= dt;

    // Firing
    fireTimer -= dt;
    if((mouseDown || keys['Space']) && fireTimer <= 0){
      fireBullet();
      fireTimer = player.fireRate;
    }
  }

  /* ── Stars ── */
  stars.forEach(s => {
    s.y += s.speed * dt * 60;
    s.twinkle += s.twinkleSpeed * dt;
    if(s.y > H){ s.y = -2; s.x = Math.random() * W; }
  });

  /* ── Bullets ── */
  for(let i = bullets.length - 1; i >= 0; i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    if(b.life <= 0 || b.x < -50 || b.x > W+50 || b.y < -50 || b.y > H+50){
      bullets.splice(i, 1);
      continue;
    }

    // Player bullets vs enemies
    if(b.type === 'player'){
      for(let j = enemies.length - 1; j >= 0; j--){
        const e = enemies[j];
        if(!e.alive) continue;
        if(circleCollision(b, e, b.size, e.size)){
          e.hp -= b.damage;
          e.flash = .1;
          bullets.splice(i, 1);

          // Hit particles
          spawnExplosion(b.x, b.y, 5, e.color, 80, 2);
          playSound('hit');

          if(e.hp <= 0){
            e.alive = false;
            const comboMult = Math.max(1, combo);
            score += e.score * comboMult;
            totalKills++;
            addCombo();

            // Explosion
            const expSize = e.type === 'boss' ? 80 : (e.type === 'cruiser' ? 50 : 30);
            const expCount = e.type === 'boss' ? 100 : (e.type === 'cruiser' ? 60 : 35);
            spawnExplosion(e.x, e.y, expCount, e.color, expSize * 3, 4);
            playSound(e.type === 'boss' ? 'bigExplosion' : 'explosion');
            addScreenShake(e.type === 'boss' ? 20 : (e.type === 'cruiser' ? 10 : 5));

            spawnPowerup(e.x, e.y);
            enemiesLeft--;
          }
          break;
        }
      }

      // Player bullets vs asteroids
      for(let j = asteroids.length - 1; j >= 0; j--){
        const a = asteroids[j];
        if(circleCollision(b, a, b.size, a.size)){
          a.hp -= b.damage;
          bullets.splice(i, 1);
          spawnExplosion(b.x, b.y, 3, '#f80', 60, 2);
          playSound('hit');

          if(a.hp <= 0){
            score += Math.floor(a.size);
            spawnExplosion(a.x, a.y, 25, '#f80', 150, 3);
            playSound('explosion');
            addScreenShake(4);

            // Split into smaller asteroids
            if(a.size > 25){
              for(let k = 0; k < 2; k++){
                const na = createAsteroid(
                  a.x + (Math.random()-0.5)*20,
                  a.y + (Math.random()-0.5)*20,
                  a.size * .5
                );
                na.vx = a.vx + (Math.random()-0.5) * 60;
                na.vy = a.vy + (Math.random()-0.5) * 30;
                asteroids.push(na);
              }
            }
            asteroids.splice(j, 1);
          }
          break;
        }
      }
    }

    // Enemy bullets vs player
    if(b.type === 'enemy' && player && player.invincible <= 0){
      if(circleCollision(b, player, b.size, 14)){
        let dmg = b.damage || 10;
        if(player.shield > 0){
          const absorbed = Math.min(player.shield, dmg);
          player.shield -= absorbed;
          dmg -= absorbed;
          playSound('shield');
        }
        if(dmg > 0){
          player.hp -= dmg;
          player.invincible = .5;
          addScreenShake(6);
        }
        player.shieldRegenDelay = 3;
        spawnExplosion(b.x, b.y, 8, '#44f', 60, 2);
        bullets.splice(i, 1);
        updateUI();

        if(player.hp <= 0){
          endGame();
          return;
        }
      }
    }
  }

  /* ── Enemies ── */
  for(let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if(!e.alive){
      enemies.splice(i, 1);
      continue;
    }

    e.flash = Math.max(0, e.flash - dt);

    // Movement patterns
    e.movePattern += e.moveSpeed * dt;
    e.x += Math.sin(e.movePattern) * 80 * dt;
    e.y += e.vy * dt;

    // Enemy firing
    e.fireTimer -= dt;
    if(e.fireTimer <= 0 && e.y > 0 && e.y < H * .7){
      e.fireTimer = e.fireRate * (1 + Math.random() * .5);

      if(player){
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        const bulletSpeed = 250 + wave * 10;

        if(e.type === 'boss'){
          // Boss fires spread
          for(let s = -2; s <= 2; s++){
            const a = angle + s * .2;
            bullets.push({
              x: e.x, y: e.y + e.size,
              vx: Math.cos(a) * bulletSpeed,
              vy: Math.sin(a) * bulletSpeed,
              damage: 15, life: 3, size: 4,
              color: '#ff0', type: 'enemy'
            });
          }
        } else {
          bullets.push({
            x: e.x, y: e.y + e.size * .5,
            vx: Math.cos(angle) * bulletSpeed,
            vy: Math.sin(angle) * bulletSpeed,
            damage: 8 + wave, life: 3, size: 3,
            color: e.color, type: 'enemy'
          });
        }
      }
    }

    // Enemy collision with player
    if(player && player.invincible <= 0 && circleCollision(e, player, e.size, 14)){
      let dmg = 20;
      if(player.shield > 0){
        const absorbed = Math.min(player.shield, dmg);
        player.shield -= absorbed;
        dmg -= absorbed;
      }
      if(dmg > 0){
        player.hp -= dmg;
        player.invincible = 1;
        addScreenShake(10);
      }
      player.shieldRegenDelay = 3;
      spawnExplosion(player.x, player.y, 15, '#f44', 100, 3);
      e.hp -= 30;
      if(e.hp <= 0){
        e.alive = false;
        spawnExplosion(e.x, e.y, 30, e.color, 150, 3);
        score += e.score;
        totalKills++;
        enemiesLeft--;
      }
      updateUI();
      if(player.hp <= 0){ endGame(); return; }
    }

    // Remove if off screen
    if(e.y > H + 100){
      enemies.splice(i, 1);
      enemiesLeft--;
    }
  }

  /* ── Asteroids ── */
  for(let i = asteroids.length - 1; i >= 0; i--){
    const a = asteroids[i];
    a.x += a.vx * dt;
    a.y += a.vy * dt;
    a.rotation += a.rotSpeed * dt;

    // Wrap horizontally
    if(a.x < -a.size) a.x = W + a.size;
    if(a.x > W + a.size) a.x = -a.size;

    // Asteroid collision with player
    if(player && player.invincible <= 0 && circleCollision(a, player, a.size, 14)){
      let dmg = Math.floor(a.size * .5);
      if(player.shield > 0){
        const absorbed = Math.min(player.shield, dmg);
        player.shield -= absorbed;
        dmg -= absorbed;
      }
      if(dmg > 0){
        player.hp -= dmg;
        player.invincible = 1;
        addScreenShake(8);
      }
      player.shieldRegenDelay = 3;
      spawnExplosion(player.x, player.y, 15, '#f80', 100, 3);
      playSound('explosion');

      a.hp -= 40;
      if(a.hp <= 0){
        spawnExplosion(a.x, a.y, 20, '#f80', 120, 3);
        if(a.size > 25){
          for(let k = 0; k < 2; k++){
            const na = createAsteroid(a.x, a.y, a.size * .5);
            asteroids.push(na);
          }
        }
        asteroids.splice(i, 1);
      }
      updateUI();
      if(player.hp <= 0){ endGame(); return; }
      continue;
    }

    // Remove if off screen
    if(a.y > H + a.size + 50){
      asteroids.splice(i, 1);
    }
  }

  /* ── Particles ── */
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= p.decay;

    if(p.type === 'explosion' || p.type === 'trail'){
      p.vx *= .98;
      p.vy *= .98;
    }

    if(p.life <= 0) particles.splice(i, 1);
  }

  /* ── Powerups ── */
  for(let i = powerups.length - 1; i >= 0; i--){
    const p = powerups[i];
    p.y += p.vy * dt;
    p.life -= dt;

    if(p.life <= 0 || p.y > H + 50){
      powerups.splice(i, 1);
      continue;
    }

    // Player pickup
    if(player && circleCollision(p, player, p.size, 20)){
      playSound('powerup');
      const msg = document.getElementById('powerupMsg');

      switch(p.type){
        case 'weapon':
          player.weaponLevel = Math.min(3, player.weaponLevel + 1);
          msg.textContent = `⚡ WEAPON LEVEL ${player.weaponLevel}`;
          break;
        case 'health':
          player.hp = Math.min(player.maxHP, player.hp + 30);
          msg.textContent = '❤️ HULL REPAIRED';
          break;
        case 'shield':
          player.shield = player.maxShield;
          player.shieldRegenDelay = 0;
          msg.textContent = '🛡️ SHIELD RESTORED';
          break;
      }

      msg.classList.add('show');
      setTimeout(() => msg.classList.remove('show'), 1500);

      spawnExplosion(p.x, p.y, 15, p.color, 80, 2);
      powerups.splice(i, 1);
      updateUI();
    }
  }

  /* ── Wave Management ── */
  if(enemiesLeft <= 0 && enemies.length === 0){
    waveTimer += dt;
    if(waveTimer >= 3){
      wave++;
      startWave();
    }
  }

  updateUI();
}

/* ═══════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════ */
function render(){
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(screenShakeX, screenShakeY);

  // Deep space background
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#020408');
  bgGrad.addColorStop(.5, '#050a14');
  bgGrad.addColorStop(1, '#0a0818');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(-10, -10, W+20, H+20);

  // Nebula
  if(nebulaCanvas){
    ctx.globalAlpha = .6;
    ctx.drawImage(nebulaCanvas, 0, 0);
    ctx.globalAlpha = 1;
  }

  // Stars
  stars.forEach(s => {
    const twinkle = .5 + Math.sin(s.twinkle) * .5;
    ctx.globalAlpha = s.brightness * twinkle;
    ctx.fillStyle = s.layer === 2 ? '#aaccff' : '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Powerups
  powerups.forEach(p => drawPowerup(p));

  // Asteroids
  asteroids.forEach(a => drawAsteroid(a));

  // Enemies
  enemies.forEach(e => { if(e.alive) drawEnemy(e); });

  // Bullets
  bullets.forEach(b => drawBullet(b));

  // Player
  if(player && player.hp > 0) drawPlayer();

  // Particles (on top)
  particles.forEach(p => drawParticle(p));

  ctx.restore();

  // Vignette
  const vigGrad = ctx.createRadialGradient(W/2, H/2, W*.3, W/2, H/2, W*.8);
  vigGrad.addColorStop(0, 'transparent');
  vigGrad.addColorStop(1, 'rgba(0,0,0,.4)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  // Damage flash
  if(player && player.invincible > 0 && player.hp < player.maxHP * .3){
    ctx.fillStyle = `rgba(255,0,0,${.1 * Math.sin(performance.now()/100)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/* ═══════════════════════════════════════════
   GAME LOOP
   ═══════════════════════════════════════════ */
function gameLoop(timestamp){
  const dt = Math.min((timestamp - lastTime) / 1000, .05);
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(gameLoop);
}

/* ═══════════════════════════════════════════
   INPUT
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;
});

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  const ch = document.getElementById('crosshair');
  ch.style.left = e.clientX + 'px';
  ch.style.top = e.clientY + 'px';
});

canvas.addEventListener('mousedown', e => {
  mouseDown = true;
  initAudio();
});
canvas.addEventListener('mouseup', () => { mouseDown = false; });

// Touch support
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  mouseDown = true;
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  mouseDown = false;
});

document.getElementById('startBtn').addEventListener('click', () => {
  initAudio();
  initGame();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
});

/* ═══════════════════════════════════════════
   INITIAL STATE
   ═══════════════════════════════════════════ */
W = canvas.width;
H = canvas.height;
mouseX = W/2;
mouseY = H/2;
mouseDown = false;
gameRunning = false;
particles = [];
stars = [];
createStars();
createNebula();

// Render initial background
function renderIdle(){
  if(gameRunning) return;
  W = canvas.width; H = canvas.height;

  ctx.clearRect(0, 0, W, H);
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#020408');
  bgGrad.addColorStop(.5, '#050a14');
  bgGrad.addColorStop(1, '#0a0818');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  if(nebulaCanvas){
    ctx.globalAlpha = .6;
    ctx.drawImage(nebulaCanvas, 0, 0);
    ctx.globalAlpha = 1;
  }

  const now = performance.now() / 1000;
  stars.forEach(s => {
    s.y += s.speed * .016 * 60;
    s.twinkle += s.twinkleSpeed * .016;
    if(s.y > H){ s.y = -2; s.x = Math.random() * W; }
    const twinkle = .5 + Math.sin(s.twinkle) * .5;
    ctx.globalAlpha = s.brightness * twinkle;
    ctx.fillStyle = s.layer === 2 ? '#aaccff' : '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  const vigGrad = ctx.createRadialGradient(W/2, H/2, W*.3, W/2, H/2, W*.8);
  vigGrad.addColorStop(0, 'transparent');
  vigGrad.addColorStop(1, 'rgba(0,0,0,.4)');
  ctx.fillStyle = vigGrad;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(renderIdle);
}
renderIdle();

})();
</script>
