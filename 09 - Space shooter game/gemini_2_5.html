<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Havoc</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
        }
        canvas {
            display: block;
            background-color: #000;
        }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 24px;
            text-shadow: 0 0 5px #0ff;
        }
        #lives {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            display: flex;
            align-items: center;
        }
        #lives span {
            margin-right: 10px;
        }
        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            text-align: center;
            cursor: pointer;
        }
        #game-overlay h1 {
            font-size: 60px;
            margin: 0;
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
        }
        #game-overlay p {
            font-size: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-score" class="ui">Score: 0</div>
    <div id="lives">
        <span id="lives-text">Lives: </span>
        <div id="lives-icons"></div>
    </div>
    <div id="game-overlay">
        <h1 id="title-text">GALACTIC HAVOC</h1>
        <p id="subtitle-text">Use [WASD] or [Arrow Keys] to move.<br>[Spacebar] to shoot.<br><br>Click to Start</p>
    </div>
</div>

window.addEventListener('load', function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('game-overlay');
    const titleText = document.getElementById('title-text');
    const subtitleText = document.getElementById('subtitle-text');
    const scoreElement = document.getElementById('ui-score');
    const livesIconsElement = document.getElementById('lives-icons');
    
    canvas.width = 800;
    canvas.height = 600;

    // --- Asset Loading ---
    const playerImage = new Image();
    playerImage.src = PLAYER_SHIP_SRC;

    const enemyImage = new Image();
    enemyImage.src = ENEMY_SHIP_SRC;
    
    const asteroidImage = new Image();
    asteroidImage.src = ASTEROID_SRC;

    const playerIconImage = new Image();
    playerIconImage.src = PLAYER_ICON_SRC;

    const laserSound = new Audio(LASER_SOUND_SRC);
    const explosionSound = new Audio(EXPLOSION_SOUND_SRC);
    laserSound.volume = 0.2;
    explosionSound.volume = 0.4;

    function playSound(sound) {
        const newSound = sound.cloneNode();
        newSound.play();
    }
    
    class InputHandler {
        constructor(game) {
            this.game = game;
            this.keys = [];
            window.addEventListener('keydown', e => {
                if ((e.key === 'ArrowDown' || e.key.toLowerCase() === 's' ||
                     e.key === 'ArrowUp' || e.key.toLowerCase() === 'w' ||
                     e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a' ||
                     e.key === 'ArrowRight' || e.key.toLowerCase() === 'd' ||
                     e.key === ' ') && this.keys.indexOf(e.key) === -1) {
                    this.keys.push(e.key);
                }
            });
            window.addEventListener('keyup', e => {
                if (this.keys.indexOf(e.key) > -1) {
                    this.keys.splice(this.keys.indexOf(e.key), 1);
                }
            });
        }
    }

    class Player {
        constructor(game) {
            this.game = game;
            this.width = 60;
            this.height = 55;
            this.x = this.game.width / 2 - this.width / 2;
            this.y = this.game.height - this.height - 20;
            this.speedX = 0;
            this.speedY = 0;
            this.maxSpeed = 5;
            this.projectiles = [];
            this.shootTimer = 0;
            this.shootCooldown = 15; // frames
            this.image = playerImage;
            this.lives = 3;
            this.invincible = false;
            this.invincibilityDuration = 1500; // ms
            this.invincibilityTimer = 0;
        }
        update(input, deltaTime) {
            // Movement
            if (input.keys.indexOf('ArrowRight') > -1 || input.keys.indexOf('d') > -1) this.speedX = this.maxSpeed;
            else if (input.keys.indexOf('ArrowLeft') > -1 || input.keys.indexOf('a') > -1) this.speedX = -this.maxSpeed;
            else this.speedX = 0;

            if (input.keys.indexOf('ArrowUp') > -1 || input.keys.indexOf('w') > -1) this.speedY = -this.maxSpeed;
            else if (input.keys.indexOf('ArrowDown') > -1 || input.keys.indexOf('s') > -1) this.speedY = this.maxSpeed;
            else this.speedY = 0;
            
            this.x += this.speedX;
            this.y += this.speedY;

            // Boundaries
            if (this.x < 0) this.x = 0;
            if (this.x > this.game.width - this.width) this.x = this.game.width - this.width;
            if (this.y < 0) this.y = 0;
            if (this.y > this.game.height - this.height) this.y = this.game.height - this.height;

            // Shooting
            if (input.keys.indexOf(' ') > -1 && this.shootTimer <= 0) {
                this.shoot();
                this.shootTimer = this.shootCooldown;
            }
            if (this.shootTimer > 0) this.shootTimer--;
            
            this.projectiles.forEach(p => p.update());
            this.projectiles = this.projectiles.filter(p => !p.markedForDeletion);
            
            // Invincibility
            if (this.invincible) {
                this.invincibilityTimer -= deltaTime;
                if (this.invincibilityTimer <= 0) {
                    this.invincible = false;
                }
            }
        }
        draw(context) {
            if (this.invincible) {
                 context.globalAlpha = Math.abs(Math.cos(this.invincibilityTimer * 0.01));
            }
            context.drawImage(this.image, this.x, this.y, this.width, this.height);
            context.globalAlpha = 1.0;
            this.projectiles.forEach(p => p.draw(context));
        }
        shoot() {
            this.projectiles.push(new Projectile(this.game, this.x + this.width / 2 - 2.5, this.y));
            playSound(laserSound);
        }
        hit() {
            if (!this.invincible) {
                this.lives--;
                this.invincible = true;
                this.invincibilityTimer = this.invincibilityDuration;
                if (this.lives <= 0) {
                    this.game.gameOver = true;
                }
            }
        }
    }

    class Projectile {
        constructor(game, x, y) {
            this.game = game;
            this.x = x;
            this.y = y;
            this.width = 5;
            this.height = 15;
            this.speed = 10;
            this.markedForDeletion = false;
        }
        update() {
            this.y -= this.speed;
            if (this.y < 0) this.markedForDeletion = true;
        }
        draw(context) {
            context.fillStyle = '#0ff';
            context.shadowColor = '#0ff';
            context.shadowBlur = 10;
            context.fillRect(this.x, this.y, this.width, this.height);
            context.shadowBlur = 0;
        }
    }

    class Enemy {
        constructor(game) {
            this.game = game;
            this.width = 50;
            this.height = 45;
            this.x = Math.random() * (this.game.width - this.width);
            this.y = -this.height;
            this.speedY = Math.random() * 2 + 1;
            this.markedForDeletion = false;
            this.image = enemyImage;
            this.points = 100;
        }
        update() {
            this.y += this.speedY;
            if (this.y > this.game.height) this.markedForDeletion = true;
        }
        draw(context) {
            context.drawImage(this.image, this.x, this.y, this.width, this.height);
        }
    }

    class Asteroid {
        constructor(game) {
            this.game = game;
            this.radius = Math.random() * 20 + 20;
            this.x = Math.random() * (this.game.width - this.radius * 2) + this.radius;
            this.y = -this.radius;
            this.speedY = Math.random() * 1.5 + 0.5;
            this.markedForDeletion = false;
            this.image = asteroidImage;
            this.angle = 0;
            this.rotationSpeed = (Math.random() - 0.5) * 0.05;
            this.points = 50;
        }
        update() {
            this.y += this.speedY;
            this.angle += this.rotationSpeed;
            if (this.y > this.game.height + this.radius) this.markedForDeletion = true;
        }
        draw(context) {
            context.save();
            context.translate(this.x, this.y);
            context.rotate(this.angle);
            context.drawImage(this.image, -this.radius, -this.radius, this.radius * 2, this.radius * 2);
            context.restore();
        }
    }
    
    class Particle {
        constructor(game, x, y) {
            this.game = game;
            this.x = x;
            this.y = y;
            this.size = Math.random() * 5 + 1;
            this.speedX = (Math.random() * 3 - 1.5);
            this.speedY = (Math.random() * 3 - 1.5);
            this.color = `hsl(${Math.random() * 60 + 0}, 100%, 50%)`;
            this.life = 100;
            this.markedForDeletion = false;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            this.life--;
            if (this.life <= 0) {
                this.markedForDeletion = true;
            }
        }
        draw(context) {
            context.fillStyle = this.color;
            context.beginPath();
            context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            context.fill();
        }
    }

    class Star {
        constructor(game) {
            this.game = game;
            this.x = Math.random() * this.game.width;
            this.y = Math.random() * this.game.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedY = this.size * 0.5; // smaller stars move slower
        }
        update() {
            this.y += this.speedY;
            if (this.y > this.game.height) {
                this.y = 0;
                this.x = Math.random() * this.game.width;
            }
        }
        draw(context) {
            context.fillStyle = 'white';
            context.beginPath();
            context.arc(this.x, this.y, this.size / 2, 0, Math.PI * 2);
            context.fill();
        }
    }

    class Game {
        constructor(width, height) {
            this.width = width;
            this.height = height;
            this.input = new InputHandler(this);
            this.score = 0;
            this.gameOver = false;
            this.gameState = 'start'; // 'start', 'playing', 'gameOver'

            this.enemyTimer = 0;
            this.enemyInterval = 1000;
            this.asteroidTimer = 0;
            this.asteroidInterval = 1500;
            
            this.init();
        }

        init() {
            this.player = new Player(this);
            this.enemies = [];
            this.asteroids = [];
            this.particles = [];
            this.stars = [];
            for (let i = 0; i < 100; i++) {
                this.stars.push(new Star(this));
            }
            this.score = 0;
            this.gameOver = false;
            this.updateUI();
        }

        update(deltaTime) {
            if (this.gameOver) {
                this.gameState = 'gameOver';
                return;
            }
            
            // Background
            this.stars.forEach(star => star.update());

            // Game Objects
            this.player.update(this.input, deltaTime);
            
            this.enemies.forEach(enemy => enemy.update());
            this.enemies = this.enemies.filter(enemy => !enemy.markedForDeletion);
            
            this.asteroids.forEach(asteroid => asteroid.update());
            this.asteroids = this.asteroids.filter(asteroid => !asteroid.markedForDeletion);

            this.particles.forEach(p => p.update());
            this.particles = this.particles.filter(p => !p.markedForDeletion);

            // Spawning
            if (this.enemyTimer > this.enemyInterval) {
                this.addEnemy();
                this.enemyTimer = 0;
                if (this.enemyInterval > 400) this.enemyInterval *= 0.99; // Get harder
            } else {
                this.enemyTimer += deltaTime;
            }
            
            if (this.asteroidTimer > this.asteroidInterval) {
                this.addAsteroid();
                this.asteroidTimer = 0;
            } else {
                this.asteroidTimer += deltaTime;
            }

            this.checkCollisions();
            this.updateUI();
        }

        draw(context) {
            context.clearRect(0, 0, this.width, this.height);
            this.stars.forEach(star => star.draw(context));
            this.asteroids.forEach(asteroid => asteroid.draw(context));
            this.player.draw(context);
            this.enemies.forEach(enemy => enemy.draw(context));
            this.particles.forEach(p => p.draw(context));
        }

        addEnemy() {
            this.enemies.push(new Enemy(this));
        }
        
        addAsteroid() {
            this.asteroids.push(new Asteroid(this));
        }
        
        createExplosion(x, y, size) {
            const particleCount = size;
            for(let i=0; i < particleCount; i++) {
                this.particles.push(new Particle(this, x, y));
            }
            playSound(explosionSound);
        }
        
        checkCollisions() {
            // Player projectiles vs enemies
            this.player.projectiles.forEach(projectile => {
                this.enemies.forEach(enemy => {
                    if (this.checkRectCollision(projectile, enemy)) {
                        this.createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 20);
                        enemy.markedForDeletion = true;
                        projectile.markedForDeletion = true;
                        this.score += enemy.points;
                    }
                });
                this.asteroids.forEach(asteroid => {
                     if (this.checkCircleRectCollision(projectile, asteroid)) {
                         this.createExplosion(asteroid.x, asteroid.y, asteroid.radius);
                         asteroid.markedForDeletion = true;
                         projectile.markedForDeletion = true;
                         this.score += asteroid.points;
                     }
                });
            });

            // Player vs enemies
            this.enemies.forEach(enemy => {
                if (this.checkRectCollision(this.player, enemy)) {
                    this.createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 20);
                    enemy.markedForDeletion = true;
                    this.player.hit();
                }
            });
            
            // Player vs asteroids
            this.asteroids.forEach(asteroid => {
                if (this.checkCircleRectCollision(this.player, asteroid)) {
                    this.createExplosion(asteroid.x, asteroid.y, asteroid.radius);
                    asteroid.markedForDeletion = true;
                    this.player.hit();
                }
            });
        }
        
        checkRectCollision(rect1, rect2) {
            return (
                rect1.x < rect2.x + rect2.width &&
                rect1.x + rect1.width > rect2.x &&
                rect1.y < rect2.y + rect2.height &&
                rect1.y + rect1.height > rect2.y
            );
        }
        
        checkCircleRectCollision(rect, circle) {
            let testX = circle.x;
            let testY = circle.y;
        
            if (circle.x < rect.x) testX = rect.x;
            else if (circle.x > rect.x + rect.width) testX = rect.x + rect.width;
        
            if (circle.y < rect.y) testY = rect.y;
            else if (circle.y > rect.y + rect.height) testY = rect.y + rect.height;
        
            let distX = circle.x - testX;
            let distY = circle.y - testY;
            let distance = Math.sqrt((distX * distX) + (distY * distY));
        
            return distance <= circle.radius;
        }

        updateUI() {
            scoreElement.textContent = 'Score: ' + this.score;
            livesIconsElement.innerHTML = '';
            for(let i=0; i < this.player.lives; i++) {
                livesIconsElement.appendChild(playerIconImage.cloneNode());
            }
        }
    }

    const game = new Game(canvas.width, canvas.height);
    let lastTime = 0;

    function animate(timeStamp) {
        const deltaTime = timeStamp - lastTime;
        lastTime = timeStamp;

        if (game.gameState === 'playing') {
             game.update(deltaTime);
             game.draw(ctx);
        }
        requestAnimationFrame(animate);
    }
    
    function showOverlay(state) {
        overlay.style.display = 'flex';
        if (state === 'start') {
            titleText.textContent = 'GALACTIC HAVOC';
            subtitleText.innerHTML = 'Use [WASD] or [Arrow Keys] to move.<br>[Spacebar] to shoot.<br><br>Click to Start';
        } else if (state === 'gameOver') {
            titleText.textContent = 'GAME OVER';
            subtitleText.innerHTML = `Your final score: ${game.score}<br><br>Click to Restart`;
        }
    }
    
    overlay.addEventListener('click', () => {
        if(game.gameState === 'start' || game.gameState === 'gameOver') {
            game.init();
            game.gameState = 'playing';
            overlay.style.display = 'none';
            if (!lastTime) { // Ensure animation loop starts on first click
                 animate(0);
            }
        }
    });

    // Initial state
    showOverlay('start');
});
</script>
