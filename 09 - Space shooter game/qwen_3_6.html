<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚀 Stellar Fury - Space Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    canvas {
      display: block;
      box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
    }
    #game-container {
      position: relative;
    }
    #ui-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .ui-panel {
      background: rgba(0, 20, 40, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      font-size: 14px;
      text-shadow: 0 0 10px rgba(0, 200, 255, 0.5);
    }
    .score { font-size: 20px; font-weight: bold; color: #00d4ff; }
    .lives { color: #ff6b6b; }
    .level { color: #ffd93d; }
    
    #start-screen, #game-over {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 5, 15, 0.9);
      z-index: 20;
    }
    #game-over { display: none; }
    h1 {
      font-size: 3.5rem;
      background: linear-gradient(45deg, #00d4ff, #ff6b6b, #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      text-shadow: none;
    }
    .subtitle {
      color: #88a;
      font-size: 1.2rem;
      margin-bottom: 30px;
      text-align: center;
      line-height: 1.6;
    }
    .btn {
      background: linear-gradient(135deg, #0066cc, #0099ff);
      border: none;
      color: white;
      padding: 14px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0, 150, 255, 0.4);
    }
    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 150, 255, 0.6);
    }
    .stats {
      color: #88a;
      margin-top: 20px;
      font-size: 1rem;
    }
    .final-score {
      color: #00d4ff;
      font-size: 2.5rem;
      font-weight: bold;
      margin: 10px 0;
    }
    .controls {
      color: #668;
      font-size: 0.9rem;
      margin-top: 20px;
      text-align: center;
      line-height: 1.8;
    }
    .controls kbd {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-overlay">
      <div class="ui-panel score">Score: <span id="score">0</span></div>
      <div class="ui-panel level">Wave: <span id="level">1</span></div>
      <div class="ui-panel lives">Lives: <span id="lives">❤️❤️❤️</span></div>
    </div>
    
    <div id="start-screen">
      <h1>🚀 STELLAR FURY</h1>
      <div class="subtitle">
        Pilot your ship through deadly asteroid fields<br>
        and destroy the alien invasion!
      </div>
      <button class="btn" onclick="startGame()">START MISSION</button>
      <div class="controls">
        <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move<br>
        <kbd>SPACE</kbd> or <kbd>Click</kbd> to fire lasers<br>
        <kbd>SHIFT</kbd> for special weapon
      </div>
    </div>
    
    <div id="game-over">
      <h1>MISSION FAILED</h1>
      <div class="stats">Your ship was destroyed</div>
      <div class="final-score" id="final-score">0</div>
      <button class="btn" onclick="restartGame()">TRY AGAIN</button>
    </div>
  </div>

  <script>
    // ===== GAME CONFIGURATION =====
    const CONFIG = {
      CANVAS_WIDTH: 800,
      CANVAS_HEIGHT: 600,
      PLAYER_SPEED: 5,
      PLAYER_LIVES: 3,
      LASER_SPEED: 10,
      LASER_COOLDOWN: 150, // ms
      ASTEROID_BASE_SPEED: 2,
      ALIEN_BASE_SPEED: 1.5,
      PARTICLE_LIFETIME: 1000, // ms
      STAR_COUNT: 150,
      POWERUP_CHANCE: 0.15,
      WAVES: 10
    };

    // ===== CANVAS SETUP =====
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = CONFIG.CANVAS_WIDTH;
    canvas.height = CONFIG.CANVAS_HEIGHT;

    // ===== GAME STATE =====
    let game = {
      running: false,
      score: 0,
      lives: CONFIG.PLAYER_LIVES,
      wave: 1,
      lastTime: 0,
      laserCooldown: 0,
      specialAmmo: 3,
      screenShake: 0,
      difficulty: 1
    };

    // ===== INPUT HANDLING =====
    const keys = {};
    let mouseDown = false;

    document.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
      if (e.key === ' ') {
        e.preventDefault();
        keys['space'] = true;
      }
    });

    document.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
      if (e.key === ' ') {
        keys['space'] = false;
      }
    });

    canvas.addEventListener('mousedown', () => mouseDown = true);
    canvas.addEventListener('mouseup', () => mouseDown = false);
    canvas.addEventListener('mouseleave', () => mouseDown = false);

    // ===== ASSETS / SPRITES (Programmatically Generated) =====
    const Assets = {
      player: null,
      alien1: null,
      alien2: null,
      alien3: null,
      asteroid1: null,
      asteroid2: null,
      asteroid3: null,
      powerup: null
    };

    function generatePlayerSprite() {
      const c = document.createElement('canvas');
      c.width = 40; c.height = 48;
      const x = c.getContext('2d');
      
      // Main body
      const gradient = x.createLinearGradient(20, 0, 20, 48);
      gradient.addColorStop(0, '#00d4ff');
      gradient.addColorStop(0.5, '#0099ff');
      gradient.addColorStop(1, '#0066cc');
      
      x.beginPath();
      x.moveTo(20, 0);
      x.lineTo(35, 35);
      x.lineTo(28, 42);
      x.lineTo(12, 42);
      x.lineTo(5, 35);
      x.closePath();
      x.fillStyle = gradient;
      x.fill();
      x.strokeStyle = '#00ffff';
      x.lineWidth = 2;
      x.stroke();
      
      // Cockpit
      x.beginPath();
      x.ellipse(20, 15, 6, 10, 0, 0, Math.PI * 2);
      x.fillStyle = '#ffffff';
      x.fill();
      
      // Engine glow
      x.beginPath();
      x.ellipse(20, 45, 5, 8, 0, 0, Math.PI * 2);
      const engineGrad = x.createRadialGradient(20, 45, 0, 20, 45, 8);
      engineGrad.addColorStop(0, '#ff6600');
      engineGrad.addColorStop(0.5, '#ff3300');
      engineGrad.addColorStop(1, 'transparent');
      x.fillStyle = engineGrad;
      x.fill();
      
      Assets.player = c;
    }

    function generateAlienSprites() {
      // Alien 1 - Basic
      let c = document.createElement('canvas');
      c.width = 36; c.height = 36;
      let x = c.getContext('2d');
      x.beginPath();
      x.moveTo(18, 0);
      x.lineTo(36, 18);
      x.lineTo(28, 36);
      x.lineTo(8, 36);
      x.lineTo(0, 18);
      x.closePath();
      x.fillStyle = '#ff4444';
      x.fill();
      x.strokeStyle = '#ff8888';
      x.lineWidth = 2;
      x.stroke();
      // Eyes
      x.beginPath();
      x.arc(12, 14, 4, 0, Math.PI * 2);
      x.arc(24, 14, 4, 0, Math.PI * 2);
      x.fillStyle = '#000';
      x.fill();
      Assets.alien1 = c;
      
      // Alien 2 - Fast
      c = document.createElement('canvas');
      c.width = 40; c.height = 32;
      x = c.getContext('2d');
      x.beginPath();
      x.moveTo(20, 0);
      x.quadraticCurveTo(40, 16, 30, 32);
      x.lineTo(10, 32);
      x.quadraticCurveTo(0, 16, 20, 0);
      x.fillStyle = '#aa00ff';
      x.fill();
      x.strokeStyle = '#dd88ff';
      x.lineWidth = 2;
      x.stroke();
      // Eyes
      x.beginPath();
      x.arc(15, 12, 5, 0, Math.PI * 2);
      x.arc(25, 12, 5, 0, Math.PI * 2);
      x.fillStyle = '#00ff00';
      x.fill();
      Assets.alien2 = c;
      
      // Alien 3 - Tank
      c = document.createElement('canvas');
      c.width = 48; c.height = 40;
      x = c.getContext('2d');
      x.beginPath();
      x.arc(24, 20, 20, 0, Math.PI * 2);
      x.fillStyle = '#4488ff';
      x.fill();
      x.strokeStyle = '#88bbff';
      x.lineWidth = 2;
      x.stroke();
      // Face
      x.beginPath();
      x.arc(18, 16, 4, 0, Math.PI * 2);
      x.arc(30, 16, 4, 0, Math.PI * 2);
      x.fillStyle = '#000';
      x.fill();
      x.beginPath();
      x.arc(24, 28, 8, 0.2, Math.PI - 0.2);
      x.strokeStyle = '#000';
      x.lineWidth = 3;
      x.stroke();
      Assets.alien3 = c;
    }

    function generateAsteroidSprites() {
      const shapes = [
        { w: 30, h: 30, color: '#8B7355' },
        { w: 45, h: 40, color: '#7a6652' },
        { w: 60, h: 55, color: '#6b5745' }
      ];
      
      shapes.forEach((shape, i) => {
        const c = document.createElement('canvas');
        c.width = shape.w; c.height = shape.h;
        const x = c.getContext('2d');
        const cx = shape.w / 2;
        const cy = shape.h / 2;
        const r = Math.min(shape.w, shape.h) / 2;
        
        x.beginPath();
        const points = 8 + Math.floor(Math.random() * 5);
        for (let p = 0; p <= points; p++) {
          const angle = (p / points) * Math.PI * 2;
          const radius = r * (0.7 + Math.random() * 0.3);
          const px = cx + Math.cos(angle) * radius;
          const py = cy + Math.sin(angle) * radius;
          if (p === 0) x.moveTo(px, py);
          else x.lineTo(px, py);
        }
        x.closePath();
        
        const grad = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        grad.addColorStop(0, '#a89080');
        grad.addColorStop(0.7, shape.color);
        grad.addColorStop(1, '#4a3a2a');
        x.fillStyle = grad;
        x.fill();
        x.strokeStyle = '#5a4a3a';
        x.lineWidth = 2;
        x.stroke();
        
        // Craters
        for (let c = 0; c < 3; c++) {
          const craterX = cx + (Math.random() - 0.5) * r;
          const craterY = cy + (Math.random() - 0.5) * r;
          const craterR = 3 + Math.random() * 5;
          x.beginPath();
          x.arc(craterX, craterY, craterR, 0, Math.PI * 2);
          x.fillStyle = 'rgba(0,0,0,0.2)';
          x.fill();
        }
        
        Assets['asteroid' + (i + 1)] = c;
      });
    }

    function generatePowerupSprite() {
      const c = document.createElement('canvas');
      c.width = 24; c.height = 24;
      const x = c.getContext('2d');
      x.beginPath();
      x.arc(12, 12, 10, 0, Math.PI * 2);
      const grad = x.createRadialGradient(12, 12, 0, 12, 12, 10);
      grad.addColorStop(0, '#00ff88');
      grad.addColorStop(1, '#00aa55');
      x.fillStyle = grad;
      x.fill();
      x.strokeStyle = '#88ffcc';
      x.lineWidth = 2;
      x.stroke();
      // Plus sign
      x.fillStyle = '#fff';
      x.fillRect(10, 5, 4, 14);
      x.fillRect(5, 10, 14, 4);
      Assets.powerup = c;
    }

    function generateAllAssets() {
      generatePlayerSprite();
      generateAlienSprites();
      generateAsteroidSprites();
      generatePowerupSprite();
    }

    // ===== PARTICLE SYSTEM =====
    class Particle {
      constructor(x, y, vx, vy, life, color, size) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.maxLife = life;
        this.color = color;
        this.size = size;
      }
      
      update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt;
        this.vx *= 0.98;
        this.vy *= 0.98;
      }
      
      draw(ctx) {
        const alpha = Math.max(0, this.life / this.maxLife);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size * alpha, 0, Math.PI * 2);
        ctx.fillStyle = this.color.replace('1)', `${alpha})`);
        ctx.fill();
      }
    }

    let particles = [];

    function createExplosion(x, y, count, colors, speed = 150) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const vel = (Math.random() * 0.5 + 0.5) * speed;
        const vx = Math.cos(angle) * vel;
        const vy = Math.sin(angle) * vel;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 2 + Math.random() * 4;
        const life = 300 + Math.random() * 700;
        particles.push(new Particle(x, y, vx, vy, life, color, size));
      }
    }

    function createTrail(x, y, color) {
      const vx = (Math.random() - 0.5) * 20;
      const vy = 30 + Math.random() * 50;
      const life = 200 + Math.random() * 300;
      particles.push(new Particle(x, y, vx, vy, life, color, 1.5));
    }

    // ===== STAR FIELD =====
    class Star {
      constructor() {
        this.reset();
        this.y = Math.random() * CONFIG.CANVAS_HEIGHT;
      }
      
      reset() {
        this.x = Math.random() * CONFIG.CANVAS_WIDTH;
        this.y = -5;
        this.size = 0.5 + Math.random() * 2;
        this.speed = 20 + Math.random() * 80;
        this.brightness = 0.3 + Math.random() * 0.7;
        this.twinkle = Math.random() * Math.PI * 2;
      }
      
      update(dt) {
        this.y += this.speed * dt;
        this.twinkle += dt * 5;
        if (this.y > CONFIG.CANVAS_HEIGHT + 5) {
          this.reset();
        }
      }
      
      draw(ctx) {
        const alpha = this.brightness * (0.7 + 0.3 * Math.sin(this.twinkle));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();
      }
    }

    let stars = [];

    function initStars() {
      stars = [];
      for (let i = 0; i < CONFIG.STAR_COUNT; i++) {
        stars.push(new Star());
      }
    }

    // ===== ENTITIES =====
    class Player {
      constructor() {
        this.width = 40;
        this.height = 48;
        this.x = CONFIG.CANVAS_WIDTH / 2;
        this.y = CONFIG.CANVAS_HEIGHT - 80;
        this.speed = CONFIG.PLAYER_SPEED;
        this.invincible = false;
        this.invincibleTime = 0;
      }
      
      update(dt) {
        // Movement
        let dx = 0, dy = 0;
        if (keys['arrowleft'] || keys['a']) dx = -1;
        if (keys['arrowright'] || keys['d']) dx = 1;
        if (keys['arrowup'] || keys['w']) dy = -1;
        if (keys['arrowdown'] || keys['s']) dy = 1;
        
        // Normalize diagonal
        if (dx !== 0 && dy !== 0) {
          dx *= 0.707;
          dy *= 0.707;
        }
        
        this.x += dx * this.speed * 60 * dt;
        this.y += dy * this.speed * 60 * dt;
        
        // Bounds
        this.x = Math.max(this.width / 2, Math.min(CONFIG.CANVAS_WIDTH - this.width / 2, this.x));
        this.y = Math.max(this.height / 2, Math.min(CONFIG.CANVAS_HEIGHT - this.height / 2, this.y));
        
        // Engine trail
        if (Math.random() < 0.5) {
          createTrail(this.x, this.y + this.height / 2, 'rgba(255, 100, 0, 1)');
        }
        
        // Invincibility timer
        if (this.invincible) {
          this.invincibleTime -= dt * 1000;
          if (this.invincibleTime <= 0) {
            this.invincible = false;
          }
        }
      }
      
      draw(ctx) {
        if (this.invincible && Math.floor(Date.now() / 100) % 2 === 0) return;
        
        ctx.drawImage(Assets.player, this.x - this.width / 2, this.y - this.height / 2);
      }
    }

    class Laser {
      constructor(x, y, angle = -Math.PI / 2, isSpecial = false) {
        this.x = x;
        this.y = y;
        this.angle = angle;
        this.speed = CONFIG.LASER_SPEED * 60;
        this.width = isSpecial ? 6 : 3;
        this.height = isSpecial ? 30 : 15;
        this.isSpecial = isSpecial;
        this.damage = isSpecial ? 3 : 1;
        this.alive = true;
      }
      
      update(dt) {
        this.x += Math.cos(this.angle) * this.speed * dt;
        this.y += Math.sin(this.angle) * this.speed * dt;
        
        if (this.y < -50 || this.x < -50 || this.x > CONFIG.CANVAS_WIDTH + 50) {
          this.alive = false;
        }
      }
      
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle + Math.PI / 2);
        
        const color = this.isSpecial ? '#ff6600' : '#00ffff';
        const glow = this.isSpecial ? 'rgba(255, 100, 0, 0.5)' : 'rgba(0, 255, 255, 0.5)';
        
        // Glow
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        
        // Laser beam
        ctx.fillStyle = color;
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
        
        // Core
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-this.width / 4, -this.height / 2, this.width / 2, this.height);
        
        ctx.restore();
      }
    }

    class Asteroid {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 1, 2, or 3
        const sizes = [30, 45, 60];
        const speeds = [3, 2, 1.5];
        this.size = sizes[type - 1];
        this.speed = speeds[type - 1] * (0.8 + Math.random() * 0.4) * game.difficulty;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 2;
        this.vx = (Math.random() - 0.5) * 50;
        this.health = type;
        this.alive = true;
      }
      
      update(dt) {
        this.y += this.speed * 60 * dt;
        this.x += this.vx * dt;
        this.rotation += this.rotationSpeed * dt;
        
        if (this.y > CONFIG.CANVAS_HEIGHT + 100) {
          this.alive = false;
        }
      }
      
      draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        
        const asset = Assets['asteroid' + this.type];
        ctx.drawImage(asset, -asset.width / 2, -asset.height / 2);
        
        ctx.restore();
      }
      
      getBounds() {
        return {
          x: this.x - this.size / 2,
          y: this.y - this.size / 2,
          width: this.size,
          height: this.size
        };
      }
    }

    class Alien {
      constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // 1, 2, or 3
        this.width = 36;
        this.height = 36;
        this.health = type;
        this.speed = CONFIG.ALIEN_BASE_SPEED * (0.8 + Math.random() * 0.4) * game.difficulty;
        this.movePattern = Math.floor(Math.random() * 3); // 0: straight, 1: sine, 2: zigzag
        this.time = Math.random() * Math.PI * 2;
        this.alive = true;
        this.shootCooldown = 0;
        this.points = type * 100;
      }
      
      update(dt) {
        this.time += dt * 2;
        this.y += this.speed * 60 * dt;
        
        // Movement patterns
        switch (this.movePattern) {
          case 0: // Straight
            break;
          case 1: // Sine wave
            this.x += Math.sin(this.time) * 80 * dt;
            break;
          case 2: // Zigzag
            this.x += Math.sign(Math.sin(this.time * 1.5)) * 100 * dt;
            break;
        }
        
        // Keep in bounds
        this.x = Math.max(this.width, Math.min(CONFIG.CANVAS_WIDTH - this.width, this.x));
        
        // Shooting
        this.shootCooldown -= dt * 1000;
        if (this.shootCooldown <= 0 && Math.random() < 0.01 * game.difficulty) {
          this.shootCooldown = 1000;
          enemyLasers.push(new EnemyLaser(this.x, this.y + this.height / 2));
        }
        
        if (this.y > CONFIG.CANVAS_HEIGHT + 50) {
          this.alive = false;
        }
      }
      
      draw(ctx) {
        const assets = [Assets.alien1, Assets.alien2, Assets.alien3];
        const asset = assets[this.type - 1];
        
        // Slight bobbing
        const bob = Math.sin(this.time * 3) * 2;
        
        ctx.drawImage(asset, this.x - asset.width / 2, this.y - asset.height / 2 + bob);
      }
      
      getBounds() {
        return {
          x: this.x - this.width / 2,
          y: this.y - this.height / 2,
          width: this.width,
          height: this.height
        };
      }
    }

    class EnemyLaser {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 200;
        this.width = 3;
        this.height = 12;
        this.alive = true;
      }
      
      update(dt) {
        this.y += this.speed * dt;
        if (this.y > CONFIG.CANVAS_HEIGHT + 50) {
          this.alive = false;
        }
      }
      
      draw(ctx) {
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ff4444';
        ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x - this.width / 4, this.y - this.height / 2, this.width / 2, this.height);
        ctx.shadowBlur = 0;
      }
    }

    class PowerUp {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.speed = 60;
        this.width = 24;
        this.height = 24;
        this.alive = true;
        this.time = 0;
      }
      
      update(dt) {
        this.y += this.speed * dt;
        this.time += dt;
        if (this.y > CONFIG.CANVAS_HEIGHT + 50) {
          this.alive = false;
        }
      }
      
      draw(ctx) {
        const bob = Math.sin(this.time * 3) * 3;
        const glow = 0.5 + 0.5 * Math.sin(this.time * 5);
        
        ctx.save();
        ctx.globalAlpha = 0.3 + 0.2 * glow;
        ctx.beginPath();
        ctx.arc(this.x, this.y + bob, 15, 0, Math.PI * 2);
        ctx.fillStyle = '#00ff88';
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.drawImage(Assets.powerup, this.x - 12, this.y + bob - 12);
        ctx.restore();
      }
      
      getBounds() {
        return {
          x: this.x - this.width / 2,
          y: this.y - this.height / 2,
          width: this.width,
          height: this.height
        };
      }
    }

    // ===== ENTITY ARRAYS =====
    let player;
    let lasers = [];
    let enemyLasers = [];
    let asteroids = [];
    let aliens = [];
    let powerups = [];
    let spawnTimers = {};

    // ===== COLLISION DETECTION =====
    function checkCollision(a, b) {
      return a.x < b.x + b.width &&
             a.x + a.width > b.x &&
             a.y < b.y + b.height &&
             a.y + a.height > b.y;
    }

    function checkCircleCollision(x1, y1, r1, x2, y2, r2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const dist = Math.sqrt(dx * dx + dy * dy);
      return dist < r1 + r2;
    }

    // ===== GAME FUNCTIONS =====
    function startGame() {
      generateAllAssets();
      initStars();
      
      game.running = true;
      game.score = 0;
      game.lives = CONFIG.PLAYER_LIVES;
      game.wave = 1;
      game.difficulty = 1;
      game.specialAmmo = 3;
      
      player = new Player();
      lasers = [];
      enemyLasers = [];
      asteroids = [];
      aliens = [];
      powerups = [];
      particles = [];
      
      spawnTimers = {
        asteroid: 0,
        alien: 0,
        wave: 0,
        waveTimer: 8000
      };
      
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over').style.display = 'none';
      
      updateUI();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      startGame();
    }

    function gameOver() {
      game.running = false;
      document.getElementById('final-score').textContent = game.score;
      document.getElementById('game-over').style.display = 'flex';
    }

    function updateUI() {
      document.getElementById('score').textContent = game.score;
      document.getElementById('level').textContent = game.wave;
      document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, game.lives));
    }

    function shootLaser() {
      const now = Date.now();
      if (now - game.laserCooldown < CONFIG.LASER_COOLDOWN) return;
      
      game.laserCooldown = now;
      
      // Main laser
      lasers.push(new Laser(player.x, player.y - player.height / 2));
      
      // Side lasers at higher waves
      if (game.wave >= 3) {
        lasers.push(new Laser(player.x - 12, player.y - player.height / 2 + 10, -Math.PI / 2 - 0.1));
        lasers.push(new Laser(player.x + 12, player.y - player.height / 2 + 10, -Math.PI / 2 + 0.1));
      }
      
      // Muzzle flash particles
      createExplosion(player.x, player.y - player.height / 2, 3, 
        ['rgba(0, 255, 255, 1)', 'rgba(255, 255, 255, 1)'], 50);
    }

    function shootSpecial() {
      if (game.specialAmmo <= 0) return;
      
      game.specialAmmo--;
      
      // Spread shot
      for (let i = -2; i <= 2; i++) {
        const angle = -Math.PI / 2 + i * 0.15;
        lasers.push(new Laser(player.x, player.y - player.height / 2, angle, true));
      }
      
      createExplosion(player.x, player.y, 15, 
        ['rgba(255, 100, 0, 1)', 'rgba(255, 255, 0, 1)', 'rgba(255, 255, 255, 1)'], 100);
    }

    function spawnAsteroid() {
      const x = Math.random() * CONFIG.CANVAS_WIDTH;
      const type = Math.floor(Math.random() * 3) + 1;
      asteroids.push(new Asteroid(x, -50, type));
    }

    function spawnAlien() {
      const x = 50 + Math.random() * (CONFIG.CANVAS_WIDTH - 100);
      const type = Math.floor(Math.random() * Math.min(3, game.wave)) + 1;
      aliens.push(new Alien(x, -50, type));
    }

    function spawnPowerup(x, y) {
      if (Math.random() < CONFIG.POWERUP_CHANCE) {
        powerups.push(new PowerUp(x, y));
      }
    }

    // ===== GAME LOOP =====
    function gameLoop(timestamp) {
      if (!game.running) return;
      
      const dt = Math.min((timestamp - game.lastTime) / 1000, 0.05);
      game.lastTime = timestamp;
      
      // Clear canvas
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      
      // Draw nebula background
      drawNebula(ctx);
      
      // Screen shake
      ctx.save();
      if (game.screenShake > 0) {
        const shake = game.screenShake * 0.5;
        ctx.translate(
          (Math.random() - 0.5) * shake,
          (Math.random() - 0.5) * shake
        );
        game.screenShake *= 0.9;
        if (game.screenShake < 0.5) game.screenShake = 0;
      }
      
      // Update and draw stars
      stars.forEach(star => {
        star.update(dt);
        star.draw(ctx);
      });
      
      // Update player
      player.update(dt);
      
      // Shooting
      if (keys['space'] || keys['shift']) {
        if (keys['shift']) {
          shootSpecial();
        } else {
          shootLaser();
        }
      }
      if (mouseDown) shootLaser();
      
      // Update lasers
      lasers = lasers.filter(l => l.alive);
      lasers.forEach(l => {
        l.update(dt);
        l.draw(ctx);
      });
      
      // Update enemy lasers
      enemyLasers = enemyLasers.filter(l => l.alive);
      enemyLasers.forEach(l => {
        l.update(dt);
        l.draw(ctx);
      });
      
      // Update asteroids
      asteroids = asteroids.filter(a => a.alive);
      asteroids.forEach(a => {
        a.update(dt);
        a.draw(ctx);
      });
      
      // Update aliens
      aliens = aliens.filter(a => a.alive);
      aliens.forEach(a => {
        a.update(dt);
        a.draw(ctx);
      });
      
      // Update powerups
      powerups = powerups.filter(p => p.alive);
      powerups.forEach(p => {
        p.update(dt);
        p.draw(ctx);
      });
      
      // Update particles
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update(dt);
        p.draw(ctx);
      });
      
      // Spawn logic
      spawnTimers.asteroid += dt * 1000;
      if (spawnTimers.asteroid > 1200 / game.difficulty) {
        spawnAsteroid();
        spawnTimers.asteroid = 0;
      }
      
      spawnTimers.alien += dt * 1000;
      if (spawnTimers.alien > 2000 / game.difficulty) {
        spawnAlien();
        spawnTimers.alien = 0;
      }
      
      // Wave progression
      spawnTimers.waveTimer -= dt * 1000;
      if (spawnTimers.waveTimer <= 0) {
        game.wave++;
        game.difficulty = 1 + game.wave * 0.15;
        spawnTimers.waveTimer = 8000;
        
        // Wave notification
        createExplosion(CONFIG.CANVAS_WIDTH / 2, CONFIG.CANVAS_HEIGHT / 2, 20,
          ['rgba(0, 212, 255, 1)', 'rgba(255, 217, 61, 1)'], 200);
      }
      
      // Collision detection
      checkCollisions();
      
      ctx.restore();
      
      // Draw wave progress bar
      drawWaveBar(ctx);
      
      // Update UI
      updateUI();
      
      requestAnimationFrame(gameLoop);
    }

    function checkCollisions() {
      // Lasers vs asteroids
      lasers.forEach(laser => {
        if (!laser.alive) return;
        asteroids.forEach(asteroid => {
          if (!asteroid.alive) return;
          const bounds = asteroid.getBounds();
          if (checkCollision(
            { x: laser.x - laser.width/2, y: laser.y - laser.height/2, width: laser.width, height: laser.height },
            bounds
          )) {
            laser.alive = false;
            asteroid.health -= laser.damage;
            
            if (asteroid.health <= 0) {
              asteroid.alive = false;
              game.score += 50 * asteroid.type;
              
              // Explosion
              const colors = [
                'rgba(180, 160, 140, 1)',
                'rgba(140, 120, 100, 1)',
                'rgba(255, 200, 150, 1)'
              ];
              createExplosion(asteroid.x, asteroid.y, 15 + asteroid.type * 5, colors);
              game.screenShake = 5;
              
              // Split into smaller asteroids
              if (asteroid.type > 1) {
                for (let i = 0; i < 2; i++) {
                  const newType = asteroid.type - 1;
                  const newAsteroid = new Asteroid(
                    asteroid.x + (Math.random() - 0.5) * 30,
                    asteroid.y,
                    newType
                  );
                  newAsteroid.vx = (Math.random() - 0.5) * 80;
                  asteroids.push(newAsteroid);
                }
              }
              
              spawnPowerup(asteroid.x, asteroid.y);
            } else {
              createExplosion(asteroid.x, asteroid.y, 5, 
                ['rgba(255, 200, 100, 1)'], 50);
            }
          }
        });
      });
      
      // Lasers vs aliens
      lasers.forEach(laser => {
        if (!laser.alive) return;
        aliens.forEach(alien => {
          if (!alien.alive) return;
          const bounds = alien.getBounds();
          if (checkCollision(
            { x: laser.x - laser.width/2, y: laser.y - laser.height/2, width: laser.width, height: laser.height },
            bounds
          )) {
            laser.alive = false;
            alien.health -= laser.damage;
            
            if (alien.health <= 0) {
              alien.alive = false;
              game.score += alien.points;
              
              // Explosion
              const colors = [
                'rgba(255, 50, 50, 1)',
                'rgba(255, 150, 50, 1)',
                'rgba(255, 255, 100, 1)',
                'rgba(255, 255, 255, 1)'
              ];
              createExplosion(alien.x, alien.y, 25 + alien.type * 10, colors);
              game.screenShake = 8;
              
              spawnPowerup(alien.x, alien.y);
            } else {
              createExplosion(alien.x, alien.y, 8, 
                ['rgba(255, 200, 50, 1)'], 60);
            }
          }
        });
      });
      
      // Player vs asteroids
      if (!player.invincible) {
        asteroids.forEach(asteroid => {
          if (!asteroid.alive) return;
          const bounds = asteroid.getBounds();
          if (checkCollision(
            { x: player.x - player.width/2, y: player.y - player.height/2, width: player.width, height: player.height },
            bounds
          )) {
            asteroid.alive = false;
            playerHit();
          }
        });
      }
      
      // Player vs aliens
      if (!player.invincible) {
        aliens.forEach(alien => {
          if (!alien.alive) return;
          const bounds = alien.getBounds();
          if (checkCollision(
            { x: player.x - player.width/2, y: player.y - player.height/2, width: player.width, height: player.height },
            bounds
          )) {
            alien.alive = false;
            playerHit();
          }
        });
      }
      
      // Player vs enemy lasers
      if (!player.invincible) {
        enemyLasers.forEach(laser => {
          if (!laser.alive) return;
          if (checkCollision(
            { x: player.x - player.width/2, y: player.y - player.height/2, width: player.width, height: player.height },
            { x: laser.x - laser.width/2, y: laser.y - laser.height/2, width: laser.width, height: laser.height }
          )) {
            laser.alive = false;
            playerHit();
          }
        });
      }
      
      // Player vs powerups
      powerups.forEach(powerup => {
        if (!powerup.alive) return;
        const bounds = powerup.getBounds();
        if (checkCollision(
          { x: player.x - player.width/2, y: player.y - player.height/2, width: player.width, height: player.height },
          bounds
        )) {
          powerup.alive = false;
          game.lives = Math.min(game.lives + 1, 5);
          game.score += 200;
          game.specialAmmo = Math.min(game.specialAmmo + 1, 5);
          
          createExplosion(powerup.x, powerup.y, 15,
            ['rgba(0, 255, 136, 1)', 'rgba(136, 255, 200, 1)', 'rgba(255, 255, 255, 1)'], 100);
        }
      });
    }

    function playerHit() {
      game.lives--;
      player.invincible = true;
      player.invincibleTime = 2000;
      game.screenShake = 15;
      
      createExplosion(player.x, player.y, 30,
        ['rgba(0, 212, 255, 1)', 'rgba(0, 150, 255, 1)', 'rgba(255, 255, 255, 1)'], 150);
      
      if (game.lives <= 0) {
        // Big explosion
        createExplosion(player.x, player.y, 80,
          ['rgba(255, 100, 0, 1)', 'rgba(255, 255, 0, 1)', 'rgba(255, 50, 50, 1)', 'rgba(255, 255, 255, 1)'], 250);
        setTimeout(gameOver, 1000);
      }
    }

    function drawNebula(ctx) {
      // Subtle nebula effect
      const time = Date.now() * 0.0003;
      const gradient = ctx.createRadialGradient(
        CONFIG.CANVAS_WIDTH * 0.3 + Math.sin(time) * 100,
        CONFIG.CANVAS_HEIGHT * 0.4 + Math.cos(time * 0.7) * 50,
        0,
        CONFIG.CANVAS_WIDTH * 0.5,
        CONFIG.CANVAS_HEIGHT * 0.5,
        CONFIG.CANVAS_WIDTH * 0.6
      );
      gradient.addColorStop(0, 'rgba(30, 0, 60, 0.15)');
      gradient.addColorStop(0.5, 'rgba(0, 20, 60, 0.1)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    }

    function drawWaveBar(ctx) {
      const barWidth = 200;
      const barHeight = 4;
      const x = CONFIG.CANVAS_WIDTH / 2 - barWidth / 2;
      const y = 35;
      const progress = 1 - (spawnTimers.waveTimer / 8000);
      
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(x, y, barWidth, barHeight);
      
      const gradient = ctx.createLinearGradient(x, y, x + barWidth * progress, y);
      gradient.addColorStop(0, '#00d4ff');
      gradient.addColorStop(1, '#0099ff');
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, barWidth * progress, barHeight);
    }

    // ===== INITIALIZATION =====
    window.addEventListener('load', () => {
      // Pre-generate assets
      generateAllAssets();
      initStars();
      
      // Draw initial background
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
      drawNebula(ctx);
      stars.forEach(star => star.draw(ctx));
    });
  </script>
</body>
