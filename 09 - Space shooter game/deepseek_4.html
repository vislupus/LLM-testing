<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Vanguard - Space Shooter</title>
    <style>
        :root {
            --bg: #000010;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: 'Orbitron', 'Segoe UI', 'Consolas', monospace;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: none;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 10px;
        }
        .hud-item {
            background: rgba(0, 0, 20, 0.7);
            border: 1px solid rgba(100, 180, 255, 0.3);
            border-radius: 10px;
            padding: 8px 16px;
            color: #c8e0ff;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.05em;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            text-shadow: 0 0 10px rgba(100, 180, 255, 0.5);
            min-width: 70px;
            text-align: center;
        }
        .hud-item .label {
            font-size: 9px;
            opacity: 0.7;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .hud-item .value {
            font-size: 20px;
            color: #fff;
        }
        .lives-value {
            color: #ff5588 !important;
            text-shadow: 0 0 14px rgba(255, 80, 120, 0.7) !important;
        }
        #game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 10, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
            z-index: 20;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h1 {
            font-size: 52px;
            color: #ff3355;
            text-shadow: 0 0 50px rgba(255, 50, 70, 0.8), 0 0 100px rgba(255, 30, 50, 0.4);
            margin-bottom: 8px;
            letter-spacing: 0.06em;
        }
        #game-over-screen .final {
            font-size: 18px;
            color: #ddd;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        #game-over-screen button {
            margin-top: 16px;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.06em;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(200, 40, 60, 0.3);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        #game-over-screen button:hover {
            background: rgba(255, 50, 80, 0.5);
            box-shadow: 0 0 40px rgba(255, 60, 80, 0.6);
            transform: scale(1.05);
        }
        #mobile-controls {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            align-items: center;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            background: rgba(20, 20, 40, 0.7);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            touch-action: manipulation;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .ctrl-btn:active {
            background: rgba(100, 150, 255, 0.4);
            border-color: #fff;
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(100, 160, 255, 0.5);
        }
        .fire-btn {
            width: 64px;
            height: 64px;
            background: rgba(200, 30, 50, 0.35);
            border-color: rgba(255, 80, 100, 0.6);
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.04em;
        }
        .fire-btn:active {
            background: rgba(255, 50, 70, 0.6);
            box-shadow: 0 0 30px rgba(255, 60, 80, 0.7);
        }
        @media (min-width: 900px) {
            #mobile-controls {
                display: none;
            }
            body {
                cursor: none;
            }
        }
        @media (max-width: 600px) {
            .hud-item {
                padding: 5px 10px;
                font-size: 10px;
                border-radius: 6px;
            }
            .hud-item .value {
                font-size: 15px;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
            .fire-btn {
                width: 48px;
                height: 48px;
                font-size: 11px;
            }
            #game-over-screen h1 {
                font-size: 32px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div id="hud">
        <div class="hud-item">
            <div class="label">Score</div>
            <div class="value" id="score-val">0</div>
        </div>
        <div class="hud-item">
            <div class="label">Wave</div>
            <div class="value" id="wave-val">1</div>
        </div>
        <div class="hud-item">
            <div class="label">Lives</div>
            <div class="value lives-value" id="lives-val">♥♥♥</div>
        </div>
        <div class="hud-item">
            <div class="label">Kills</div>
            <div class="value" id="kills-val">0</div>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p class="final" id="final-score">Final Score: 0</p>
        <p class="final" id="final-wave">Wave Reached: 1</p>
        <button id="restart-btn">🚀 PLAY AGAIN</button>
    </div>

    <div id="mobile-controls">
        <button class="ctrl-btn" id="btn-left">◀</button>
        <button class="ctrl-btn" id="btn-up">▲</button>
        <button class="ctrl-btn" id="btn-down">▼</button>
        <button class="ctrl-btn" id="btn-right">▶</button>
        <button class="ctrl-btn fire-btn" id="btn-fire">FIRE</button>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js">
    </script>
    <script>
        (function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: false,
                stencil: true,
                antialias: true,
            });
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.01, 0.06, 1.0);

            // ────────────────────────────────────
            // CAMERA
            // ────────────────────────────────────
            const camera = new BABYLON.UniversalCamera("camera", new BABYLON.Vector3(0, 14, -18), scene);
            camera.setTarget(new BABYLON.Vector3(0, 0, 10));
            camera.fov = 0.75;
            camera.minZ = 0.5;
            camera.maxZ = 300;
            camera.rotation.x = 0.55;

            // ────────────────────────────────────
            // LIGHTING
            // ────────────────────────────────────
            const ambientLight = new BABYLON.HemisphericLight("ambient", new BABYLON.Vector3(0.3, 1, 0.2), scene);
            ambientLight.intensity = 0.55;
            ambientLight.diffuse = new BABYLON.Color3(0.5, 0.5, 0.7);
            ambientLight.groundColor = new BABYLON.Color3(0.05, 0.05, 0.12);

            const sunLight = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.3, -0.8, -0.4), scene);
            sunLight.intensity = 0.7;
            sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);

            const playerLight = new BABYLON.PointLight("playerLight", new BABYLON.Vector3(0, 3, 0), scene);
            playerLight.intensity = 0.5;
            playerLight.diffuse = new BABYLON.Color3(0.3, 0.6, 1);
            playerLight.range = 30;

            // ────────────────────────────────────
            // STARFIELD
            // ────────────────────────────────────
            const starCount = 800;
            const starData = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starData[i * 3] = (Math.random() - 0.5) * 160;
                starData[i * 3 + 1] = Math.random() * 40 - 5;
                starData[i * 3 + 2] = (Math.random() - 0.5) * 160;
            }
            const starCloud = new BABYLON.PointsCloudSystem("stars", 1, scene);
            const starMesh = new BABYLON.Mesh("starMesh", scene);
            const starVertexData = new BABYLON.VertexData();
            starVertexData.positions = starData;
            starVertexData.applyToMesh(starMesh, false);
            starMesh.material = new BABYLON.StandardMaterial("starMat", scene);
            starMesh.material.emissiveColor = new BABYLON.Color3(0.8, 0.85, 1);
            starMesh.material.disableLighting = true;
            starMesh.material.pointsCloud = true;
            starMesh.material.pointSize = 0.25;
            const starParticles = new BABYLON.PointsCloudSystem("starPCS", 1, scene);
            starParticles.addPoints(starCount, (p, i) => {
                p.position = new BABYLON.Vector3(starData[i * 3], starData[i * 3 + 1], starData[i * 3 + 2]);
                p.color = new BABYLON.Color4(0.9 + Math.random() * 0.1, 0.85 + Math.random() * 0.15, 0.9 + Math
                    .random() * 0.1, 0.6 + Math.random() * 0.4);
            });
            starParticles.buildMeshAsync().then(m => {
                m.material = new BABYLON.StandardMaterial("starParticleMat", scene);
                m.material.emissiveColor = new BABYLON.Color3(1, 1, 1);
                m.material.disableLighting = true;
                m.material.pointsCloud = true;
                m.material.pointSize = 0.3;
            });

            // ────────────────────────────────────
            // NEBULA RINGS (decorative)
            // ────────────────────────────────────
            for (let n = 0; n < 3; n++) {
                const nebula = BABYLON.MeshBuilder.CreateTorus("nebula" + n, {
                    diameter: 50 + n * 20,
                    thickness: 2 + n * 1.5,
                    tessellation: 48,
                }, scene);
                nebula.position.y = -8 - n * 3;
                nebula.rotation.x = Math.PI / 2 + (n - 1) * 0.3;
                const nebMat = new BABYLON.StandardMaterial("nebMat" + n, scene);
                nebMat.emissiveColor = new BABYLON.Color3(0.08, 0.04, 0.2 + n * 0.1);
                nebMat.alpha = 0.18;
                nebMat.disableLighting = true;
                nebula.material = nebMat;
            }

            // ────────────────────────────────────
            // GAME STATE
            // ────────────────────────────────────
            let score = 0;
            let wave = 1;
            let lives = 3;
            let kills = 0;
            let gameOver = false;
            let invincibleTimer = 0;
            const PLAY_AREA = 55;
            const PLAY_AREA_HALF = PLAY_AREA / 2;

            let playerShip = null;
            let playerBody = null;
            let playerEngineGlow = null;
            let playerVelocity = new BABYLON.Vector3(0, 0, 0);
            let playerSpeed = 16;
            let fireCooldown = 0;
            const FIRE_RATE = 0.18;

            const lasers = [];
            const asteroids = [];
            const aliens = [];
            const explosions = [];
            const debrisPool = [];

            // ────────────────────────────────────
            // MATERIALS
            // ────────────────────────────────────
            function createGlowMaterial(name, hexColor, alpha = 1) {
                const mat = new BABYLON.StandardMaterial(name, scene);
                mat.emissiveColor = BABYLON.Color3.FromHexString(hexColor);
                mat.diffuseColor = BABYLON.Color3.FromHexString(hexColor);
                mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                mat.roughness = 0.4;
                mat.alpha = alpha;
                return mat;
            }
            const hullMat = createGlowMaterial("hullMat", "#8899bb");
            const wingMat = createGlowMaterial("wingMat", "#667799");
            const engineGlowMat = createGlowMaterial("engineGlow", "#33aaff");
            engineGlowMat.alpha = 0.85;
            const laserMat = createGlowMaterial("laserMat", "#00ddff");
            const enemyLaserMat = createGlowMaterial("enemyLaserMat", "#ff4422");
            const asteroidMat = new BABYLON.StandardMaterial("asteroidMat", scene);
            asteroidMat.diffuseColor = new BABYLON.Color3(0.45, 0.38, 0.32);
            asteroidMat.specularColor = new BABYLON.Color3(0.15, 0.12, 0.1);
            asteroidMat.roughness = 0.9;
            const alienHullMat = createGlowMaterial("alienHull", "#556688");
            const alienGlowMat = createGlowMaterial("alienGlow", "#ff5533");

            // ────────────────────────────────────
            // CREATE PLAYER SHIP
            // ────────────────────────────────────
            function createPlayerShip() {
                const root = new BABYLON.TransformNode("playerRoot", scene);
                root.position.set(0, 0, 0);

                // Fuselage
                const fuselage = BABYLON.MeshBuilder.CreateCylinder("fuselage", {
                    diameterTop: 0.3,
                    diameterBottom: 1.1,
                    height: 4.5,
                    tessellation: 12,
                }, scene);
                fuselage.parent = root;
                fuselage.position.y = 0;
                fuselage.rotation.x = Math.PI / 2;
                fuselage.material = hullMat;

                // Cockpit
                const cockpit = BABYLON.MeshBuilder.CreateSphere("cockpit", {
                    diameter: 1.0,
                    segments: 10,
                }, scene);
                cockpit.parent = root;
                cockpit.position.set(0, 0.35, 1.4);
                cockpit.scaling.set(0.9, 0.55, 0.7);
                const cockpitMat = createGlowMaterial("cockpitMat", "#44aacc");
                cockpitMat.alpha = 0.8;
                cockpit.material = cockpitMat;

                // Wings
                for (let s = -1; s <= 1; s += 2) {
                    const wing = BABYLON.MeshBuilder.CreateBox("wing", {
                        width: 3.8,
                        height: 0.18,
                        depth: 1.4,
                    }, scene);
                    wing.parent = root;
                    wing.position.set(s * 2.1, -0.2, -0.3);
                    wing.rotation.z = s * 0.18;
                    wing.material = wingMat;

                    // Wingtip
                    const wingtip = BABYLON.MeshBuilder.CreateBox("wingtip", {
                        width: 0.6,
                        height: 0.35,
                        depth: 0.8,
                    }, scene);
                    wingtip.parent = root;
                    wingtip.position.set(s * 3.6, -0.15, -0.1);
                    wingtip.material = createGlowMaterial("wingtipMat", "#5566aa");

                    // Engine pod
                    const enginePod = BABYLON.MeshBuilder.CreateCylinder("enginePod", {
                        diameterTop: 0.35,
                        diameterBottom: 0.45,
                        height: 1.6,
                        tessellation: 10,
                    }, scene);
                    enginePod.parent = root;
                    enginePod.position.set(s * 2.2, -0.25, -1.5);
                    enginePod.rotation.x = Math.PI / 2;
                    enginePod.material = createGlowMaterial("enginePodMat", "#334455");

                    // Engine glow
                    const glow = BABYLON.MeshBuilder.CreateSphere("engineGlow", {
                        diameter: 0.4,
                        segments: 8,
                    }, scene);
                    glow.parent = root;
                    glow.position.set(s * 2.2, -0.25, -2.3);
                    glow.scaling.set(0.8, 0.8, 0.5);
                    glow.material = engineGlowMat;
                }

                // Central engine glow
                const centralGlow = BABYLON.MeshBuilder.CreateSphere("centralGlow", {
                    diameter: 0.55,
                    segments: 8,
                }, scene);
                centralGlow.parent = root;
                centralGlow.position.set(0, 0, -2.5);
                centralGlow.scaling.set(0.7, 0.7, 0.6);
                centralGlow.material = engineGlowMat;
                playerEngineGlow = centralGlow;

                // Nose
                const nose = BABYLON.MeshBuilder.CreateCylinder("nose", {
                    diameterTop: 0.08,
                    diameterBottom: 0.35,
                    height: 1.2,
                    tessellation: 10,
                }, scene);
                nose.parent = root;
                nose.position.set(0, 0, 3.0);
                nose.rotation.x = Math.PI / 2;
                nose.material = createGlowMaterial("noseMat", "#99aacc");

                root._glowMeshes = [centralGlow];
                return root;
            }

            // ────────────────────────────────────
            // CREATE ASTEROID
            // ────────────────────────────────────
            function createAsteroid(size) {
                const root = new BABYLON.TransformNode("asteroidRoot", scene);
                const segments = 7 + Math.floor(Math.random() * 5);
                const mesh = BABYLON.MeshBuilder.CreateSphere("asteroid", {
                    diameter: size,
                    segments: segments,
                }, scene);
                mesh.parent = root;
                // Deform vertices
                const positions = mesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                if (positions) {
                    for (let i = 0; i < positions.length; i++) {
                        positions[i] += (Math.random() - 0.5) * size * 0.5;
                    }
                    mesh.setVerticesData(BABYLON.VertexBuffer.PositionKind, positions, true);
                }
                mesh.material = asteroidMat;
                mesh.receiveShadows = true;
                const rotSpeed = {
                    x: (Math.random() - 0.5) * 2.5,
                    y: (Math.random() - 0.5) * 2.5,
                    z: (Math.random() - 0.5) * 2.5,
                };
                const velocity = new BABYLON.Vector3(
                    (Math.random() - 0.5) * 7,
                    0,
                    (Math.random() - 0.5) * 7
                );
                // Spawn at edges
                const edge = Math.floor(Math.random() * 4);
                switch (edge) {
                    case 0:
                        root.position.set(-PLAY_AREA_HALF - 5, 0, (Math.random() - 0.5) * PLAY_AREA);
                        break;
                    case 1:
                        root.position.set(PLAY_AREA_HALF + 5, 0, (Math.random() - 0.5) * PLAY_AREA);
                        break;
                    case 2:
                        root.position.set((Math.random() - 0.5) * PLAY_AREA, 0, -PLAY_AREA_HALF - 5);
                        break;
                    case 3:
                        root.position.set((Math.random() - 0.5) * PLAY_AREA, 0, PLAY_AREA_HALF + 5);
                        break;
                }
                root.position.y = (Math.random() - 0.5) * 2;
                return { root, mesh, size, rotSpeed, velocity, health: size * 1.5 };
            }

            // ────────────────────────────────────
            // CREATE ALIEN SHIP
            // ────────────────────────────────────
            function createAlienShip() {
                const root = new BABYLON.TransformNode("alienRoot", scene);
                // Saucer top
                const topDome = BABYLON.MeshBuilder.CreateCylinder("saucerTop", {
                    diameterTop: 0,
                    diameterBottom: 2.8,
                    height: 1.2,
                    tessellation: 14,
                }, scene);
                topDome.parent = root;
                topDome.position.y = 0.5;
                topDome.material = alienHullMat;

                // Saucer bottom
                const bottomDome = BABYLON.MeshBuilder.CreateCylinder("saucerBottom", {
                    diameterTop: 2.4,
                    diameterBottom: 0.3,
                    height: 1.0,
                    tessellation: 14,
                }, scene);
                bottomDome.parent = root;
                bottomDome.position.y = -0.4;
                bottomDome.material = alienHullMat;

                // Center glow
                const centerGlow = BABYLON.MeshBuilder.CreateSphere("alienGlow", {
                    diameter: 0.8,
                    segments: 8,
                }, scene);
                centerGlow.parent = root;
                centerGlow.position.y = 0.3;
                centerGlow.material = alienGlowMat;

                // Ring
                const ring = BABYLON.MeshBuilder.CreateTorus("alienRing", {
                    diameter: 2.9,
                    thickness: 0.25,
                    tessellation: 16,
                }, scene);
                ring.parent = root;
                ring.position.y = -0.15;
                ring.material = createGlowMaterial("ringMat", "#ff6644");

                const edge = Math.floor(Math.random() * 4);
                switch (edge) {
                    case 0:
                        root.position.set(-PLAY_AREA_HALF - 8, 0, (Math.random() - 0.5) * PLAY_AREA);
                        break;
                    case 1:
                        root.position.set(PLAY_AREA_HALF + 8, 0, (Math.random() - 0.5) * PLAY_AREA);
                        break;
                    case 2:
                        root.position.set((Math.random() - 0.5) * PLAY_AREA, 0, -PLAY_AREA_HALF - 8);
                        break;
                    case 3:
                        root.position.set((Math.random() - 0.5) * PLAY_AREA, 0, PLAY_AREA_HALF + 8);
                        break;
                }
                root.position.y = 1 + Math.random() * 4;
                const behavior = {
                    timer: Math.random() * 3,
                    strafeDir: Math.random() < 0.5 ? 1 : -1,
                    shootTimer: 1.5 + Math.random() * 3,
                    speed: 3 + Math.random() * 5,
                };
                return { root, topDome, bottomDome, centerGlow, ring, behavior, health: 3 + wave };
            }

            // ────────────────────────────────────
            // LASER
            // ────────────────────────────────────
            function fireLaser(origin, direction, isEnemy = false) {
                const laser = BABYLON.MeshBuilder.CreateCylinder("laser", {
                    diameterTop: 0.1,
                    diameterBottom: 0.1,
                    height: 2.5,
                    tessellation: 6,
                }, scene);
                laser.position.copyFrom(origin);
                laser.rotation.x = Math.PI / 2;
                const mat = isEnemy ? enemyLaserMat : laserMat;
                laser.material = mat;
                const glowSphere = BABYLON.MeshBuilder.CreateSphere("laserGlow", {
                    diameter: 0.35,
                    segments: 6,
                }, scene);
                glowSphere.parent = laser;
                glowSphere.position.z = 1.2;
                glowSphere.material = mat;
                const vel = direction.normalize().scale(isEnemy ? 18 : 30);
                lasers.push({
                    mesh: laser,
                    glow: glowSphere,
                    velocity: vel,
                    isEnemy: isEnemy,
                    lifetime: 3.5,
                    material: mat,
                });
            }

            // ────────────────────────────────────
            // EXPLOSION / PARTICLES
            // ────────────────────────────────────
            function spawnExplosion(position, color, count = 30) {
                for (let i = 0; i < count; i++) {
                    const spark = BABYLON.MeshBuilder.CreateSphere("spark", {
                        diameter: 0.12 + Math.random() * 0.4,
                        segments: 4,
                    }, scene);
                    spark.position.copyFrom(position);
                    const vel = new BABYLON.Vector3(
                        (Math.random() - 0.5) * 16,
                        Math.random() * 10 + 2,
                        (Math.random() - 0.5) * 16
                    );
                    const sparkMat = new BABYLON.StandardMaterial("sparkMat", scene);
                    sparkMat.emissiveColor = color.clone();
                    sparkMat.diffuseColor = color.clone();
                    sparkMat.disableLighting = true;
                    spark.material = sparkMat;
                    explosions.push({
                        mesh: spark,
                        velocity: vel,
                        lifetime: 0.4 + Math.random() * 0.8,
                        material: sparkMat,
                    });
                }
                // Flash sphere
                const flash = BABYLON.MeshBuilder.CreateSphere("flash", {
                    diameter: 1.5,
                    segments: 8,
                }, scene);
                flash.position.copyFrom(position);
                const flashMat = new BABYLON.StandardMaterial("flashMat", scene);
                flashMat.emissiveColor = new BABYLON.Color3(1, 1, 1);
                flashMat.diffuseColor = new BABYLON.Color3(1, 0.8, 0.5);
                flashMat.alpha = 0.9;
                flashMat.disableLighting = true;
                flash.material = flashMat;
                explosions.push({
                    mesh: flash,
                    velocity: new BABYLON.Vector3(0, 0, 0),
                    lifetime: 0.25,
                    material: flashMat,
                    isFlash: true,
                });
            }

            // ────────────────────────────────────
            // INITIALIZE GAME OBJECTS
            // ────────────────────────────────────
            playerShip = createPlayerShip();
            playerBody = playerShip;

            function spawnAsteroids(count) {
                for (let i = 0; i < count; i++) {
                    const size = 1.2 + Math.random() * 4.5;
                    asteroids.push(createAsteroid(size));
                }
            }

            function spawnAliens(count) {
                for (let i = 0; i < count; i++) {
                    aliens.push(createAlienShip());
                }
            }

            function clearAllEnemies() {
                [...asteroids].forEach(a => {
                    if (a.root && !a.root.isDisposed()) a.root.dispose();
                });
                asteroids.length = 0;
                [...aliens].forEach(a => {
                    if (a.root && !a.root.isDisposed()) a.root.dispose();
                });
                aliens.length = 0;
                [...lasers].forEach(l => {
                    if (l.mesh && !l.mesh.isDisposed()) l.mesh.dispose();
                    if (l.material && !l.material.isDisposed()) l.material.dispose();
                });
                lasers.length = 0;
            }

            function startNewWave() {
                clearAllEnemies();
                wave++;
                spawnAsteroids(6 + wave * 3);
                spawnAliens(2 + wave);
                document.getElementById('wave-val').textContent = wave;
            }

            function resetGame() {
                clearAllEnemies();
                [...explosions].forEach(e => {
                    if (e.mesh && !e.mesh.isDisposed()) e.mesh.dispose();
                    if (e.material && !e.material.isDisposed()) e.material.dispose();
                });
                explosions.length = 0;
                score = 0;
                wave = 1;
                lives = 3;
                kills = 0;
                gameOver = false;
                invincibleTimer = 0;
                fireCooldown = 0;
                playerVelocity.set(0, 0, 0);
                playerShip.position.set(0, 0, 0);
                playerShip.rotation.set(0, 0, 0);
                spawnAsteroids(8);
                spawnAliens(3);
                document.getElementById('score-val').textContent = '0';
                document.getElementById('wave-val').textContent = '1';
                document.getElementById('lives-val').textContent = '♥♥♥';
                document.getElementById('kills-val').textContent = '0';
                document.getElementById('game-over-screen').classList.remove('active');
                document.body.style.cursor = 'none';
            }

            // Initial spawn
            spawnAsteroids(8);
            spawnAliens(3);

            // ────────────────────────────────────
            // INPUT
            // ────────────────────────────────────
            const keys = {};
            window.addEventListener('keydown', e => {
                keys[e.key.toLowerCase()] = true;
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                }
                if ((e.key === 'r' || e.key === 'R') && gameOver) {
                    resetGame();
                }
            });
            window.addEventListener('keyup', e => {
                keys[e.key.toLowerCase()] = false;
            });

            // Mobile buttons
            function setupMobileButton(id, key) {
                const btn = document.getElementById(id);
                if (!btn) return;
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    keys[key] = true;
                });
                btn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    keys[key] = false;
                });
                btn.addEventListener('pointerleave', () => { keys[key] = false; });
                btn.addEventListener('pointercancel', () => { keys[key] = false; });
            }
            setupMobileButton('btn-left', 'a');
            setupMobileButton('btn-right', 'd');
            setupMobileButton('btn-up', 'w');
            setupMobileButton('btn-down', 's');
            setupMobileButton('btn-fire', ' ');

            document.getElementById('restart-btn').addEventListener('click', resetGame);
            document.getElementById('restart-btn').addEventListener('pointerdown', (e) => e.stopPropagation());

            // ────────────────────────────────────
            // AUDIO (simple Web Audio beeps)
            // ────────────────────────────────────
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }

            function playBeep(freq, dur, type = 'square', vol = 0.04) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + dur);
                } catch (e) {}
            }

            function sfxShoot() { playBeep(800, 0.06, 'square', 0.025);
                playBeep(200, 0.04, 'triangle', 0.02); }

            function sfxHit() { playBeep(50, 0.2, 'sawtooth', 0.06); }

            function sfxExplosion() { playBeep(30, 0.35, 'sawtooth', 0.07);
                playBeep(60, 0.25, 'triangle', 0.05); }

            function sfxGameOverSound() { playBeep(40, 0.6, 'sawtooth', 0.06);
                playBeep(25, 0.8, 'triangle', 0.05); }

            canvas.addEventListener('click', initAudio);
            canvas.addEventListener('pointerdown', initAudio);
            window.addEventListener('keydown', initAudio, { once: true });

            // ────────────────────────────────────
            // GAME LOOP
            // ────────────────────────────────────
            scene.registerBeforeRender(() => {
                if (gameOver) return;
                const dt = Math.min(engine.getDeltaTime() / 1000, 0.15);
                initAudio();

                // ── INVINCIBILITY ─────────────
                if (invincibleTimer > 0) {
                    invincibleTimer -= dt;
                    playerShip._glowMeshes.forEach(g => {
                        if (g && !g.isDisposed()) g.isVisible = Math.floor(invincibleTimer * 15) % 2 ===
                            0;
                    });
                    if (invincibleTimer <= 0) {
                        playerShip._glowMeshes.forEach(g => { if (g && !g.isDisposed()) g.isVisible =
                                true; });
                    }
                }

                // ── PLAYER MOVEMENT ───────────
                const moveInput = new BABYLON.Vector3(0, 0, 0);
                if (keys['w'] || keys['arrowup']) moveInput.z += 1;
                if (keys['s'] || keys['arrowdown']) moveInput.z -= 1;
                if (keys['a'] || keys['arrowleft']) moveInput.x -= 1;
                if (keys['d'] || keys['arrowright']) moveInput.x += 1;
                if (moveInput.length() > 1) moveInput.normalize();

                playerVelocity.x += moveInput.x * playerSpeed * dt * 8;
                playerVelocity.z += moveInput.z * playerSpeed * dt * 8;
                playerVelocity.x *= Math.exp(-3.5 * dt);
                playerVelocity.z *= Math.exp(-3.5 * dt);
                const maxSpeed = playerSpeed;
                const speed = Math.sqrt(playerVelocity.x ** 2 + playerVelocity.z ** 2);
                if (speed > maxSpeed) {
                    playerVelocity.x *= maxSpeed / speed;
                    playerVelocity.z *= maxSpeed / speed;
                }
                playerShip.position.x += playerVelocity.x * dt;
                playerShip.position.z += playerVelocity.z * dt;
                playerShip.position.x = BABYLON.Scalar.Clamp(playerShip.position.x, -PLAY_AREA_HALF + 2,
                    PLAY_AREA_HALF - 2);
                playerShip.position.z = BABYLON.Scalar.Clamp(playerShip.position.z, -PLAY_AREA_HALF + 2,
                    PLAY_AREA_HALF - 2);
                playerShip.position.y = 0.3 + Math.sin(performance.now() * 0.003) * 0.3;

                // Ship tilt
                const targetRoll = -playerVelocity.x * 0.08;
                const targetPitch = playerVelocity.z * 0.04;
                playerShip.rotation.z += (targetRoll - playerShip.rotation.z) * 4 * dt;
                playerShip.rotation.x += (targetPitch - playerShip.rotation.x) * 3 * dt;

                // ── CAMERA FOLLOW ─────────────
                const camTarget = playerShip.position.clone();
                camTarget.z += 10;
                camTarget.y += 6;
                camera.position.x += (camTarget.x - camera.position.x) * 4 * dt;
                camera.position.y += (camTarget.y - camera.position.y) * 3 * dt;
                camera.position.z += (camTarget.z - camera.position.z) * 4 * dt;
                camera.setTarget(playerShip.position.clone());

                // ── FIRE LASERS ───────────────
                fireCooldown = Math.max(0, fireCooldown - dt);
                if ((keys[' '] || keys['spacebar']) && fireCooldown <= 0) {
                    const forward = new BABYLON.Vector3(0, 0, 1);
                    forward.applyRotationQuaternion(playerShip.rotationQuaternion || BABYLON.Quaternion.Identity());
                    const spawnPos = playerShip.position.clone();
                    spawnPos.z += 2.5;
                    spawnPos.y += 0.1;
                    fireLaser(spawnPos, new BABYLON.Vector3(0, 0, 1), false);
                    // Slight spread for wing cannons
                    const leftSpawn = spawnPos.clone();
                    leftSpawn.x -= 2.2;
                    fireLaser(leftSpawn, new BABYLON.Vector3(-0.04, 0, 1).normalize(), false);
                    const rightSpawn = spawnPos.clone();
                    rightSpawn.x += 2.2;
                    fireLaser(rightSpawn, new BABYLON.Vector3(0.04, 0, 1).normalize(), false);
                    fireCooldown = FIRE_RATE;
                    sfxShoot();
                }

                // ── UPDATE LASERS ─────────────
                for (let i = lasers.length - 1; i >= 0; i--) {
                    const l = lasers[i];
                    l.lifetime -= dt;
                    if (l.lifetime <= 0 || !l.mesh || l.mesh.isDisposed()) {
                        if (l.mesh && !l.mesh.isDisposed()) l.mesh.dispose();
                        if (l.glow && !l.glow.isDisposed()) l.glow.dispose();
                        if (l.material && !l.material.isDisposed()) l.material.dispose();
                        lasers.splice(i, 1);
                        continue;
                    }
                    l.mesh.position.addInPlace(l.velocity.scale(dt));

                    // Check out of bounds
                    const lp = l.mesh.position;
                    if (Math.abs(lp.x) > PLAY_AREA_HALF + 10 || Math.abs(lp.z) > PLAY_AREA_HALF + 10) {
                        l.mesh.dispose();
                        if (l.glow && !l.glow.isDisposed()) l.glow.dispose();
                        if (l.material && !l.material.isDisposed()) l.material.dispose();
                        lasers.splice(i, 1);
                        continue;
                    }

                    // Check collision with asteroids
                    let hitSomething = false;
                    if (!l.isEnemy) {
                        for (let j = asteroids.length - 1; j >= 0; j--) {
                            const a = asteroids[j];
                            const dist = BABYLON.Vector3.Distance(l.mesh.position, a.root.position);
                            if (dist < a.size * 0.7) {
                                a.health -= 15;
                                spawnExplosion(l.mesh.position.clone(), new BABYLON.Color3(0.8, 0.5,
                                    0.25), 8);
                                if (a.health <= 0) {
                                    spawnExplosion(a.root.position.clone(), new BABYLON.Color3(1, 0.6,
                                        0.3), 22);
                                    score += Math.floor(a.size * 20);
                                    kills++;
                                    if (a.root && !a.root.isDisposed()) a.root.dispose();
                                    asteroids.splice(j, 1);
                                }
                                l.mesh.dispose();
                                if (l.glow && !l.glow.isDisposed()) l.glow.dispose();
                                if (l.material && !l.material.isDisposed()) l.material.dispose();
                                lasers.splice(i, 1);
                                hitSomething = true;
                                sfxHit();
                                break;
                            }
                        }
                        if (hitSomething) continue;

                        // Check collision with aliens
                        for (let j = aliens.length - 1; j >= 0; j--) {
                            const a = aliens[j];
                            const dist = BABYLON.Vector3.Distance(l.mesh.position, a.root.position);
                            if (dist < 2.0) {
                                a.health -= 15;
                                spawnExplosion(l.mesh.position.clone(), new BABYLON.Color3(1, 0.4, 0.2),
                                    10);
                                if (a.health <= 0) {
                                    spawnExplosion(a.root.position.clone(), new BABYLON.Color3(1, 0.3,
                                        0.1), 35);
                                    score += 150 + wave * 30;
                                    kills++;
                                    if (a.root && !a.root.isDisposed()) a.root.dispose();
                                    aliens.splice(j, 1);
                                    sfxExplosion();
                                }
                                l.mesh.dispose();
                                if (l.glow && !l.glow.isDisposed()) l.glow.dispose();
                                if (l.material && !l.material.isDisposed()) l.material.dispose();
                                lasers.splice(i, 1);
                                hitSomething = true;
                                sfxHit();
                                break;
                            }
                        }
                    } else {
                        // Enemy laser vs player
                        const dist = BABYLON.Vector3.Distance(l.mesh.position, playerShip.position);
                        if (dist < 2.2 && invincibleTimer <= 0) {
                            spawnExplosion(playerShip.position.clone(), new BABYLON.Color3(1, 0.2, 0.1),
                                25);
                            lives--;
                            invincibleTimer = 2.5;
                            sfxExplosion();
                            l.mesh.dispose();
                            if (l.glow && !l.glow.isDisposed()) l.glow.dispose();
                            if (l.material && !l.material.isDisposed()) l.material.dispose();
                            lasers.splice(i, 1);
                            if (lives <= 0) {
                                gameOver = true;
                                sfxGameOverSound();
                                document.getElementById('final-score').textContent = 'Final Score: ' +
                                    score;
                                document.getElementById('final-wave').textContent =
                                    'Wave Reached: ' + wave;
                                document.getElementById('game-over-screen').classList.add('active');
                                document.body.style.cursor = 'default';
                                return;
                            }
                            document.getElementById('lives-val').textContent = '♥'.repeat(lives) + '♡'
                                .repeat(3 - lives);
                            continue;
                        }
                    }
                }

                // ── UPDATE ASTEROIDS ──────────
                for (let i = asteroids.length - 1; i >= 0; i--) {
                    const a = asteroids[i];
                    if (!a.root || a.root.isDisposed()) { asteroids.splice(i, 1); continue; }
                    a.root.position.x += a.velocity.x * dt;
                    a.root.position.z += a.velocity.z * dt;
                    a.root.rotation.x += a.rotSpeed.x * dt;
                    a.root.rotation.y += a.rotSpeed.y * dt;
                    a.root.rotation.z += a.rotSpeed.z * dt;
                    // Wrap around
                    if (Math.abs(a.root.position.x) > PLAY_AREA_HALF + 8) a.root.position.x *= -0.95;
                    if (Math.abs(a.root.position.z) > PLAY_AREA_HALF + 8) a.root.position.z *= -0.95;
                    a.root.position.y += (Math.sin(performance.now() * 0.002 + i) * 0.3 - a.root.position.y) *
                        0.5 * dt;

                    // Collision with player
                    const dist = BABYLON.Vector3.Distance(a.root.position, playerShip.position);
                    if (dist < a.size * 0.6 + 1.5 && invincibleTimer <= 0) {
                        spawnExplosion(playerShip.position.clone(), new BABYLON.Color3(1, 0.5, 0.2), 30);
                        lives--;
                        invincibleTimer = 2.5;
                        sfxExplosion();
                        // Push asteroid away
                        const pushDir = a.root.position.subtract(playerShip.position).normalize();
                        a.root.position.addInPlace(pushDir.scale(8));
                        a.velocity.addInPlace(pushDir.scale(10));
                        if (lives <= 0) {
                            gameOver = true;
                            sfxGameOverSound();
                            document.getElementById('final-score').textContent = 'Final Score: ' + score;
                            document.getElementById('final-wave').textContent = 'Wave Reached: ' + wave;
                            document.getElementById('game-over-screen').classList.add('active');
                            document.body.style.cursor = 'default';
                            return;
                        }
                        document.getElementById('lives-val').textContent = '♥'.repeat(lives) + '♡'.repeat(3 -
                            lives);
                    }
                }

                // ── UPDATE ALIENS ─────────────
                for (let i = aliens.length - 1; i >= 0; i--) {
                    const a = aliens[i];
                    if (!a.root || a.root.isDisposed()) { aliens.splice(i, 1); continue; }
                    a.behavior.timer += dt;
                    // Move toward player with some strafing
                    const toPlayer = playerShip.position.subtract(a.root.position);
                    const distToPlayer = toPlayer.length();
                    if (distToPlayer > 0.5) {
                        toPlayer.normalize();
                        const strafe = new BABYLON.Vector3(-toPlayer.z, 0, toPlayer.x).scale(a.behavior
                            .strafeDir);
                        const moveDir = toPlayer.scale(0.7).add(strafe.scale(0.3)).normalize();
                        a.root.position.addInPlace(moveDir.scale(a.behavior.speed * dt));
                    }
                    if (a.behavior.timer > 3) {
                        a.behavior.strafeDir *= -1;
                        a.behavior.timer = 0;
                    }
                    a.root.position.y = 1.5 + Math.sin(performance.now() * 0.004 + i) * 1.5;
                    a.root.rotation.y += dt * 0.8;

                    // Alien shooting
                    a.behavior.shootTimer -= dt;
                    if (a.behavior.shootTimer <= 0 && distToPlayer < 35) {
                        const dir = toPlayer.normalize();
                        const spawnPos = a.root.position.clone();
                        spawnPos.y -= 0.5;
                        fireLaser(spawnPos, dir, true);
                        a.behavior.shootTimer = 1.8 + Math.random() * 2.5;
                    }

                    // Wrap
                    if (Math.abs(a.root.position.x) > PLAY_AREA_HALF + 10) a.root.position.x *= -0.9;
                    if (Math.abs(a.root.position.z) > PLAY_AREA_HALF + 10) a.root.position.z *= -0.9;
                }

                // ── UPDATE EXPLOSIONS ─────────
                for (let i = explosions.length - 1; i >= 0; i--) {
                    const e = explosions[i];
                    e.lifetime -= dt;
                    if (e.lifetime <= 0 || !e.mesh || e.mesh.isDisposed()) {
                        if (e.mesh && !e.mesh.isDisposed()) e.mesh.dispose();
                        if (e.material && !e.material.isDisposed()) e.material.dispose();
                        explosions.splice(i, 1);
                        continue;
                    }
                    e.mesh.position.addInPlace(e.velocity.scale(dt));
                    e.velocity.y -= 4 * dt;
                    if (e.isFlash) {
                        e.mesh.scaling.scaleInPlace(1 + 6 * dt);
                        e.mesh.material.alpha = Math.max(0, e.lifetime / 0.25);
                    } else {
                        e.mesh.scaling.scaleInPlace(1 - 2.5 * dt);
                    }
                }

                // ── CHECK WAVE COMPLETE ───────
                if (asteroids.length === 0 && aliens.length === 0 && !gameOver) {
                    startNewWave();
                }

                // ── UPDATE HUD ────────────────
                document.getElementById('score-val').textContent = score;
                document.getElementById('kills-val').textContent = kills;
                document.getElementById('lives-val').textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);

                // ── PLAYER LIGHT FOLLOW ───────
                playerLight.position.copyFrom(playerShip.position);
                playerLight.position.y += 4;
            });

            // ────────────────────────────────────
            // RENDER LOOP
            // ────────────────────────────────────
            engine.runRenderLoop(() => {
                scene.render();
            });

            // ────────────────────────────────────
            // RESIZE
            // ────────────────────────────────────
            window.addEventListener('resize', () => engine.resize());

            console.log('🚀 Star Vanguard Ready!');
            console.log('   WASD: Move | Space: Fire | R: Restart when game over');
            console.log('   Survive waves of asteroids and alien invaders!');
        })();
    </script>
</body>
</html>
