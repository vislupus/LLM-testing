<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NEBULA STRIKE — Space Shooter</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060f;font-family:'Orbitron',sans-serif}
  #game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:none}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:10}
  .hud{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start}
  .hud-panel{background:linear-gradient(180deg,rgba(18,24,48,0.9),rgba(10,14,30,0.85));border:1px solid rgba(100,180,255,0.25);border-radius:12px;padding:10px 14px;backdrop-filter:blur(10px);box-shadow:0 0 20px rgba(80,140,255,0.15), inset 0 1px 0 rgba(255,255,255,0.08)}
  .hud-title{font-size:9px;letter-spacing:0.2em;color:#7fb8ff;opacity:0.8;margin-bottom:4px}
  .hud-value{font-size:20px;font-weight:800;color:#e6f2ff;text-shadow:0 0 12px rgba(100,200,255,0.8);font-family:'JetBrains Mono',monospace}
  .lives{display:flex;gap:6px;margin-top:6px}
  .life{width:16px;height:12px;background:linear-gradient(180deg,#7df2ff,#3a9bff);clip-path:polygon(50% 0%,100% 40%,85% 100%,15% 100%,0% 40%);box-shadow:0 0 8px #5ac8ff}
  .life.off{opacity:0.15;filter:grayscale(1)}
  .center-hud{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:auto}
  .title{font-size:clamp(32px,7vw,72px);font-weight:800;letter-spacing:-0.03em;line-height:0.9;background:linear-gradient(180deg,#ffffff 20%,#7fb8ff 60%,#3a5bff 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 30px rgba(100,160,255,0.6));}
  .subtitle{font-size:12px;letter-spacing:0.4em;color:#7fb8ff;margin-top:12px;opacity:0.8}
  .btn{margin-top:28px;pointer-events:auto;cursor:pointer;border:0;padding:14px 36px;border-radius:999px;background:linear-gradient(180deg,#7df2ff,#4a7bff);color:#020617;font-weight:800;letter-spacing:0.12em;font-size:13px;box-shadow:0 0 30px rgba(90,200,255,0.6), inset 0 1px 0 rgba(255,255,255,0.8);transition:transform .12s, box-shadow .12s}
  .btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 0 40px rgba(90,200,255,0.9)}
  .btn:active{transform:scale(0.98)}
  .controls{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(200,230,255,0.6);line-height:1.6}
  .controls b{color:#9ed4ff}
  #gameOver{position:absolute;inset:0;background:radial-gradient(120% 120% at 50% 50%, rgba(10,20,60,0.85), rgba(3,6,15,0.96));display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20;pointer-events:auto;text-align:center}
  #gameOver.show{display:flex}
  .score-big{font-size:56px;font-weight:800;color:white;text-shadow:0 0 30px #5ac8ff}
  .wave-indicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;font-weight:800;color:white;opacity:0;pointer-events:none;text-shadow:0 0 20px #7df2ff;letter-spacing:0.2em}
  @keyframes waveIn{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.2)}}
  .crosshair{position:absolute;width:20px;height:20px;border:1px solid rgba(125,242,255,0.6);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:15;box-shadow:0 0 10px rgba(125,242,255,0.5)}
  .crosshair:after{content:'';position:absolute;top:50%;left:50%;width:4px;height:4px;background:#7df2ff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px #7df2ff}
  @media(max-width:600px){.hud{flex-direction:column;gap:10px}.hud-panel{padding:8px 12px}.hud-value{font-size:16px}#game{cursor:auto}.crosshair{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="crosshair" id="crosshair"></div>
<div id="ui">
  <div class="hud">
    <div class="hud-panel">
      <div class="hud-title">SCORE</div>
      <div class="hud-value" id="score">000000</div>
      <div class="lives" id="lives"></div>
    </div>
    <div class="hud-panel" style="text-align:right">
      <div class="hud-title">WAVE • MULTIPLIER</div>
      <div class="hud-value"><span id="wave">1</span> • <span id="mult" style="color:#7df2ff">x1</span></div>
      <div class="hud-title" style="margin-top:6px">SHIELD</div>
      <div style="width:100px;height:6px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden;margin-top:2px"><div id="shieldBar" style="width:100%;height:100%;background:linear-gradient(90deg,#7df2ff,#4a7bff);box-shadow:0 0 10px #5ac8ff;transition:width .2s"></div></div>
    </div>
  </div>
  <div class="center-hud" id="menu">
    <div class="title">NEBULA<br>STRIKE</div>
    <div class="subtitle">ASTEROID FIELD • ALIEN SWARM • SURVIVE</div>
    <button class="btn" id="playBtn">▶ ENGAGE THRUSTERS</button>
    <div class="controls">
      <b>WASD / ARROWS</b> PILOT • <b>SPACE / CLICK</b> FIRE • <b>SHIFT</b> BOOST<br>
      SHRED ASTEROIDS → SPLIT → DODGE → VAPORIZE INVADERS
    </div>
  </div>
  <div class="wave-indicator" id="waveIndicator">WAVE 1</div>
</div>
<div id="gameOver">
  <div style="font-size:12px;letter-spacing:0.5em;color:#7fb8ff;margin-bottom:12px">TRANSMISSION LOST</div>
  <div class="title" style="font-size:48px">SHIP DESTROYED</div>
  <div class="score-big" id="finalScore">0</div>
  <div class="subtitle" id="finalWave">WAVE 1 • 0 ASTEROIDS • 0 INVADERS</div>
  <button class="btn" id="restartBtn">↺ RESTART MISSION</button>
</div>

<script>
// NEBULA STRIKE - Single File Space Shooter
// No external assets - everything procedural with canvas + Web Audio
(() => {
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', {alpha:false});
const crosshair = document.getElementById('crosshair');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = canvas.width = window.innerWidth * DPR;
  H = canvas.height = window.innerHeight * DPR;
  canvas.style.width = window.innerWidth+'px';
  canvas.style.height = window.innerHeight+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); window.addEventListener('resize', resize);

const rand = (a,b)=> a + Math.random()*(b-a);
const lerp = (a,b,t)=> a + (b-a)*t;
const dist = (x1,y1,x2,y2)=> Math.hypot(x2-x1,y2-y1);
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));

// Input
const keys = {};
const mouse = {x: innerWidth/2, y: innerHeight*0.8, down:false, active:false};
window.addEventListener('keydown', e=>{ keys[e.code]=true; if(e.code==='Space') e.preventDefault(); });
window.addEventListener('keyup', e=>{ keys[e.code]=false; });
window.addEventListener('mousemove', e=>{ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; crosshair.style.left=e.clientX+'px'; crosshair.style.top=e.clientY+'px'; });
window.addEventListener('mousedown', ()=>{ mouse.down=true; if(!audioCtx) initAudio(); });
window.addEventListener('mouseup', ()=>{ mouse.down=false; });
canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; mouse.down=true; mouse.active=true; if(!audioCtx) initAudio(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ const t=e.touches[0]; mouse.x=t.clientX; mouse.y=t.clientY; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchend', ()=>{ mouse.down=false; });

// Audio - procedural
let audioCtx;
function initAudio(){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch{} }
function playSound(type){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  if(type==='laser'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(900,now); o.frequency.exponentialRampToValueAtTime(1800,now+0.08);
    g.gain.setValueAtTime(0.18,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(now+0.16);
  }else if(type==='explosion'){
    const bufferSize = audioCtx.sampleRate*0.5;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufferSize,2);
    const src=audioCtx.createBufferSource(); src.buffer=buffer;
    const filter=audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value=800;
    const g=audioCtx.createGain(); g.gain.setValueAtTime(0.6,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    src.connect(filter).connect(g).connect(audioCtx.destination); src.start();
  }else if(type==='hit'){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='square'; o.frequency.setValueAtTime(200,now); o.frequency.linearRampToValueAtTime(40,now+0.12);
    g.gain.setValueAtTime(0.25,now); g.gain.linearRampToValueAtTime(0,now+0.15);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(now+0.16);
  }
}

// Game State
const state = {
  running:false, over:false, score:0, wave:1, lives:3, shield:100,
  multiplier:1, multTimer:0, shake:0, time:0, kills:0, asteroids:0
};

let player, bullets=[], enemyBullets=[], asteroids=[], enemies=[], particles=[], stars=[], powerups=[];

class Star{
  constructor(){ this.reset(true); }
  reset(initial=false){
    this.x=rand(0,innerWidth); this.y= initial? rand(0,innerHeight) : -10;
    this.size=rand(0.3,2.2); this.speed=rand(0.3,3.5)*(this.size*0.6);
    this.alpha=rand(0.2,1); this.twinkle=rand(0,Math.PI*2);
    this.color = Math.random()<0.15 ? `hsl(${rand(200,260)},100%,70%)` : `hsl(0,0%,${rand(70,100)}%)`;
  }
  update(dt){ this.y+=this.speed*dt*60*0.06; this.twinkle+=dt*2; if(this.y>innerHeight+20) this.reset(); }
  draw(ctx){
    const a = this.alpha * (0.6 + Math.sin(this.twinkle)*0.4);
    ctx.globalAlpha=a; ctx.fillStyle=this.color;
    ctx.shadowBlur=this.size*2; ctx.shadowColor=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
}
for(let i=0;i<240;i++) stars.push(new Star());

class Player{
  constructor(){
    this.x=innerWidth/2; this.y=innerHeight*0.82;
    this.vx=0; this.vy=0; this.r=18;
    this.cooldown=0; this.invul=0; this.boost=0;
    this.flame=0; this.tilt=0;
  }
  update(dt){
    const speed = (keys['ShiftLeft']||keys['ShiftRight']? 560: 380) * dt;
    let ix=0,iy=0;
    if(keys['KeyA']||keys['ArrowLeft']) ix=-1;
    if(keys['KeyD']||keys['ArrowRight']) ix=1;
    if(keys['KeyW']||keys['ArrowUp']) iy=-1;
    if(keys['KeyS']||keys['ArrowDown']) iy=1;
    // mouse follow
    if(mouse.active && !ix && !iy){
      const dx=mouse.x - this.x, dy=mouse.y - this.y;
      ix = clamp(dx/120,-1,1); iy = clamp(dy/120,-1,1);
    }
    this.vx = lerp(this.vx, ix*speed*2.2, dt*12);
    this.vy = lerp(this.vy, iy*speed*2.2, dt*12);
    this.x += this.vx*dt; this.y += this.vy*dt;
    this.x = clamp(this.x, 30, innerWidth-30);
    this.y = clamp(this.y, 80, innerHeight-40);
    this.tilt = lerp(this.tilt, -this.vx*0.0015, dt*10);
    this.flame = Math.sin(state.time*20)*0.3+0.7;
    if(this.cooldown>0) this.cooldown-=dt;
    if(this.invul>0) this.invul-=dt;
    if(this.boost>0) this.boost-=dt;
    // shooting
    if((keys['Space']||mouse.down) && this.cooldown<=0){
      this.shoot();
      this.cooldown = this.boost>0?0.08:0.16;
    }
  }
  shoot(){
    const spread = state.multiplier>=3 ? 2 : 0;
    if(spread){
      bullets.push(new Bullet(this.x-12,this.y-18, -70, -720, true));
      bullets.push(new Bullet(this.x,this.y-22, 0, -780, true));
      bullets.push(new Bullet(this.x+12,this.y-18, 70, -720, true));
    }else{
      bullets.push(new Bullet(this.x, this.y-20, rand(-30,30), -820, true));
    }
    playSound('laser');
    // muzzle flash particles
    for(let i=0;i<6;i++) particles.push(new Particle(this.x+rand(-6,6), this.y-18, rand(-80,80), rand(-300,-100), `hsl(${rand(180,200)},100%,70%)`, rand(2,4), 0.25));
  }
  hit(dmg=34){
    if(this.invul>0) return;
    state.shield-=dmg;
    playSound('hit');
    state.shake=12;
    if(state.shield<=0){
      state.lives--; state.shield=100; this.invul=2.2;
      explosion(this.x,this.y,80, '#7df2ff');
      if(state.lives<=0){ gameOver(); }
    }else{
      this.invul=0.6;
      for(let i=0;i<20;i++) particles.push(new Particle(this.x+rand(-12,12), this.y+rand(-8,8), rand(-120,120), rand(-120,120), '#7df2ff', rand(1,3), 0.5));
    }
  }
  draw(ctx){
    if(this.invul>0 && Math.floor(this.invul*20)%2===0) return;
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.tilt);
    // engine flame
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const f = this.flame;
    const grad = ctx.createRadialGradient(0,14,0,0,14,22*f);
    grad.addColorStop(0,'rgba(255,255,200,1)'); grad.addColorStop(0.3,'rgba(255,180,40,0.9)'); grad.addColorStop(1,'rgba(255,60,0,0)');
    ctx.fillStyle=grad;
    ctx.beginPath(); ctx.moveTo(-8,8); ctx.quadraticCurveTo(0, 18+12*f, 8,8); ctx.fill();
    ctx.restore();
    // shadow
    ctx.shadowBlur=22; ctx.shadowColor='#5ac8ff';
    // hull
    ctx.fillStyle='#e6f3ff';
    ctx.strokeStyle='#7df2ff'; ctx.lineWidth=1.2;
    ctx.beginPath();
    ctx.moveTo(0,-22); ctx.lineTo(-12,12); ctx.lineTo(-6,10); ctx.lineTo(6,10); ctx.lineTo(12,12); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // cockpit
    const cg = ctx.createRadialGradient(0,-6,0,0,-6,9);
    cg.addColorStop(0,'#aeeaff'); cg.addColorStop(1,'#1a5a9a');
    ctx.fillStyle=cg; ctx.beginPath(); ctx.ellipse(0,-4,5,7,0,0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

class Bullet{
  constructor(x,y,vx,vy,playerOwned){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.playerOwned=playerOwned;
    this.r=playerOwned?3.5:4.5; this.life=2.2;
    this.color=playerOwned?'#7df2ff':'#ff6b6b';
  }
  update(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt; this.life-=dt;
    return this.life>0 && this.y>-100 && this.y<innerHeight+100 && this.x>-100 && this.x<innerWidth+100;
  }
  draw(ctx){
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    ctx.shadowBlur=14; ctx.shadowColor=this.color;
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill();
    // trail
    ctx.globalAlpha=0.35; ctx.beginPath(); ctx.arc(this.x-this.vx*0.012, this.y-this.vy*0.012, this.r*1.6,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Asteroid{
  constructor(x,y,sizeTier){
    this.x=x||rand(0,innerWidth); this.y=y||-80;
    this.tier = sizeTier ?? (Math.random()<0.6?2:Math.random()<0.8?1:0); // 2=big,1=med,0=small
    const sizes=[18,32,58]; this.r=sizes[this.tier]+rand(-4,6);
    this.vx=rand(-50,50); this.vy=rand(60,180) + state.wave*8;
    this.rot=rand(0,Math.PI*2); this.vr=rand(-1.2,1.2);
    this.health=this.tier*2+1;
    this.poly=[]; const pts=8+Math.floor(rand(0,5));
    for(let i=0;i<pts;i++){ const a=i/pts*Math.PI*2; const rad=this.r*rand(0.75,1.25); this.poly.push([Math.cos(a)*rad, Math.sin(a)*rad]); }
    this.color=`hsl(${rand(20,35)},${rand(12,28)}%,${rand(45,62)}%)`;
    this.craters=[]; for(let i=0;i<3;i++) this.craters.push([rand(-this.r*0.5,this.r*0.5), rand(-this.r*0.5,this.r*0.5), rand(2, this.r*0.25)]);
  }
  update(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt; this.rot+=this.vr*dt;
    if(this.x<-100) this.x=innerWidth+100; if(this.x>innerWidth+100) this.x=-100;
    return this.y<innerHeight+140;
  }
  hit(dmg){
    this.health-=dmg;
    if(this.health<=0){
      explosion(this.x,this.y, 12+this.tier*14, this.color, this.r*0.3);
      state.score+= (3-this.tier)*100 * state.multiplier;
      state.asteroids++;
      state.multiplier = Math.min(5, state.multiplier+0.06);
      state.multTimer=4;
      playSound('explosion');
      // split
      if(this.tier>0){
        for(let i=0;i<2;i++){
          const a=new Asteroid(this.x+rand(-10,10), this.y+rand(-10,10), this.tier-1);
          a.vx=rand(-120,120); a.vy=rand(60,160);
          asteroids.push(a);
        }
      }
      // chance powerup
      if(Math.random()<0.12) powerups.push(new PowerUp(this.x,this.y));
      return true;
    }
    // hit flash particles
    for(let i=0;i<6;i++) particles.push(new Particle(this.x+rand(-8,8), this.y+rand(-8,8), rand(-80,80), rand(-80,80), '#ffcf8a', rand(1,3), 0.3));
    return false;
  }
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y); ctx.rotate(this.rot);
    ctx.shadowBlur=18; ctx.shadowColor='rgba(0,0,0,0.6)';
    ctx.fillStyle=this.color; ctx.strokeStyle='rgba(0,0,0,0.35)'; ctx.lineWidth=2;
    ctx.beginPath(); this.poly.forEach((p,i)=>{ if(i===0) ctx.moveTo(p[0],p[1]); else ctx.lineTo(p[0],p[1]); }); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,0.18)';
    this.craters.forEach(c=>{ ctx.beginPath(); ctx.arc(c[0],c[1],c[2],0,Math.PI*2); ctx.fill(); });
    ctx.restore();
  }
}

class Enemy{
  constructor(){
    this.x=rand(40,innerWidth-40); this.y=-60;
    this.type = Math.random()<0.55?0:Math.random()<0.75?1:2;
    this.r=[16,20,28][this.type];
    this.vx=rand(-60,60); this.vy=rand(70,140);
    this.health=[2,3,6][this.type];
    this.cooldown=rand(0.5,1.8);
    this.phase=rand(0,Math.PI*2);
    this.t=0;
  }
  update(dt){
    this.t+=dt;
    this.x+=this.vx*dt + Math.sin(this.t*1.8+this.phase)*40*dt;
    this.y+=this.vy*dt;
    if(this.x<30||this.x>innerWidth-30) this.vx*=-1;
    this.cooldown-=dt;
    if(this.cooldown<=0){
      this.shoot();
      this.cooldown = this.type===0? rand(1.2,2.2) : this.type===1? rand(0.6,1.2) : rand(0.9,1.6);
    }
    return this.y<innerHeight+100;
  }
  shoot(){
    const dx=player.x-this.x, dy=player.y-this.y;
    const len=Math.hypot(dx,dy)||1;
    const sp= this.type===2? 260: 300;
    enemyBullets.push(new Bullet(this.x, this.y+16, dx/len*sp + rand(-30,30), dy/len*sp + rand(-20,20), false));
    if(this.type===2){
      enemyBullets.push(new Bullet(this.x-10, this.y+10, -80, 240, false));
      enemyBullets.push(new Bullet(this.x+10, this.y+10, 80, 240, false));
    }
  }
  hit(dmg){
    this.health-=dmg;
    if(this.health<=0){
      explosion(this.x,this.y, 28+this.type*10, this.type===0?'#ff7a7a':this.type===1?'#7aff7a':'#7a9bff', 6);
      state.score+= [300,500,900][this.type]*state.multiplier;
      state.kills++; state.multiplier=Math.min(5, state.multiplier+0.12); state.multTimer=4;
      playSound('explosion'); return true;
    }
    return false;
  }
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y);
    const bob=Math.sin(state.time*3+this.phase)*2;
    ctx.translate(0,bob);
    ctx.shadowBlur=20; ctx.shadowColor= this.type===0?'#ff4d4d':this.type===1?'#4dff8a':'#4d8aff';
    ctx.fillStyle= this.type===0?'#ff3b3b':this.type===1?'#2aff6a':'#3a6aff';
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1;
    // alien shape
    ctx.beginPath();
    if(this.type===0){
      ctx.moveTo(0,-16); ctx.lineTo(-14,10); ctx.lineTo(-6,8); ctx.lineTo(6,8); ctx.lineTo(14,10); ctx.closePath();
    }else if(this.type===1){
      ctx.moveTo(-18,-4); ctx.lineTo(-8,-14); ctx.lineTo(8,-14); ctx.lineTo(18,-4); ctx.lineTo(10,14); ctx.lineTo(-10,14); ctx.closePath();
    }else{
      ctx.moveTo(0,-20); ctx.lineTo(-22,0); ctx.lineTo(-16,18); ctx.lineTo(16,18); ctx.lineTo(22,0); ctx.closePath();
    }
    ctx.fill(); ctx.stroke();
    // eyes
    ctx.fillStyle='#ffffff'; ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(-5,-2,2.5,0,Math.PI*2); ctx.arc(5,-2,2.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-5,-1,1.2,0,Math.PI*2); ctx.arc(5,-1,1.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class Particle{
  constructor(x,y,vx,vy,color,size,life){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.color=color; this.size=size; this.life=life; this.maxLife=life;
  }
  update(dt){
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.vx*=Math.pow(0.96, dt*60); this.vy*=Math.pow(0.96, dt*60);
    this.vy+=40*dt; // gravity a bit
    this.life-=dt; return this.life>0;
  }
  draw(ctx){
    const t=1-this.life/this.maxLife;
    const a=1-t;
    const s=this.size*(1+t*0.6);
    ctx.save(); ctx.globalAlpha=a*0.9; ctx.globalCompositeOperation='lighter';
    ctx.shadowBlur=s*3; ctx.shadowColor=this.color; ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,s,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

class PowerUp{
  constructor(x,y){
    this.x=x; this.y=y; this.vy=90; this.r=12; this.type=Math.random()<0.5?'rapid':'shield';
    this.phase=rand(0,Math.PI*2);
  }
  update(dt){
    this.y+=this.vy*dt; this.phase+=dt*3;
    return this.y<innerHeight+40;
  }
  draw(ctx){
    ctx.save(); ctx.translate(this.x,this.y+Math.sin(this.phase)*4);
    ctx.shadowBlur=18; ctx.shadowColor= this.type==='rapid'?'#ffdf5a':'#5affff';
    ctx.fillStyle= this.type==='rapid'?'#ffef8a':'#8affff';
    ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='12px Orbitron'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(this.type==='rapid'?'⚡':'🛡',0,1);
    ctx.restore();
  }
}

function explosion(x,y,count=30,color='#ffaa55', extraSize=0){
  const hues = color.startsWith('hsl') ? null : null;
  for(let i=0;i<count;i++){
    const ang=rand(0,Math.PI*2), sp=rand(40, 320+extraSize*8);
    const vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp;
    const col = i%3===0 ? '#ffffff' : (Math.random()<0.5? color : `hsl(${rand(15,45)},100%,${rand(55,75)}%)`);
    particles.push(new Particle(x+rand(-6,6), y+rand(-6,6), vx, vy, col, rand(1.5,4.5+extraSize*0.1), rand(0.3,0.9)));
  }
  // ring
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2;
    particles.push(new Particle(x,y, Math.cos(a)*180, Math.sin(a)*180, '#7df2ff', 2.5, 0.4));
  }
  state.shake=Math.min(20, state.shake+count*0.18);
}

// Wave spawner
let spawnTimer=0, enemyTimer=0;
function spawnLogic(dt){
  spawnTimer-=dt; enemyTimer-=dt;
  if(spawnTimer<=0){
    const n = 1 + Math.floor(state.wave*0.6 + Math.random()*2);
    for(let i=0;i<n;i++) asteroids.push(new Asteroid(rand(0,innerWidth), rand(-200,-40)));
    spawnTimer = Math.max(0.2, 1.4 - state.wave*0.08 + rand(-0.2,0.3));
  }
  if(enemyTimer<=0){
    if(Math.random()<0.7 + state.wave*0.05) enemies.push(new Enemy());
    enemyTimer = Math.max(0.6, 3.2 - state.wave*0.12 + rand(-0.5,0.5));
  }
}

// Main Loop
let last=performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-last)/1000); last=now;
  if(state.running){
    state.time+=dt;
    // background shake
    let sx=0, sy=0;
    if(state.shake>0){ sx=rand(-state.shake,state.shake); sy=rand(-state.shake,state.shake); state.shake*=Math.pow(0.88, dt*60); }
    ctx.save(); ctx.translate(sx,sy);
    // clear with nebula gradient
    const bgGrad = ctx.createRadialGradient(innerWidth*0.5, innerHeight*0.3, 0, innerWidth*0.5, innerHeight*0.3, innerWidth*0.9);
    bgGrad.addColorStop(0,'#0e1a3a'); bgGrad.addColorStop(0.4,'#0a1026'); bgGrad.addColorStop(1,'#05060f');
    ctx.fillStyle=bgGrad; ctx.fillRect(-20,-20,innerWidth+40,innerHeight+40);
    // stars
    stars.forEach(s=>{ s.update(dt); s.draw(ctx); });
    // vignette
    const vig = ctx.createRadialGradient(innerWidth/2, innerHeight/2, innerHeight*0.3, innerWidth/2, innerHeight/2, innerWidth);
    vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.65)');
    ctx.fillStyle=vig; ctx.fillRect(0,0,innerWidth,innerHeight);

    // update
    player.update(dt);
    bullets = bullets.filter(b=> b.update(dt));
    enemyBullets = enemyBullets.filter(b=> b.update(dt));
    asteroids = asteroids.filter(a=> a.update(dt));
    enemies = enemies.filter(e=> e.update(dt));
    particles = particles.filter(p=> p.update(dt));
    powerups = powerups.filter(p=> p.update(dt));
    spawnLogic(dt);

    // collisions: player bullets vs asteroids/enemies
    for(let i=bullets.length-1;i>=0;i--){
      const b=bullets[i];
      if(!b.playerOwned) continue;
      let hit=false;
      for(let j=asteroids.length-1;j>=0;j--){
        const a=asteroids[j];
        if(dist(b.x,b.y,a.x,a.y) < a.r + b.r){
          if(a.hit(1)){ asteroids.splice(j,1); }
          bullets.splice(i,1); hit=true; break;
        }
      }
      if(hit) continue;
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(dist(b.x,b.y,e.x,e.y) < e.r + b.r){
          if(e.hit(1)){ enemies.splice(j,1); }
          bullets.splice(i,1); break;
        }
      }
    }
    // enemy bullets vs player
    for(let i=enemyBullets.length-1;i>=0;i--){
      const b=enemyBullets[i];
      if(dist(b.x,b.y,player.x,player.y) < player.r + b.r){
        player.hit(22); enemyBullets.splice(i,1);
      }
    }
    // asteroids vs player
    for(let j=asteroids.length-1;j>=0;j--){
      const a=asteroids[j];
      if(dist(a.x,a.y,player.x,player.y) < a.r + player.r -4){
        player.hit(38); explosion(a.x,a.y,18,'#ffaa66'); asteroids.splice(j,1);
      }
    }
    // enemies vs player
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(dist(e.x,e.y,player.x,player.y) < e.r + player.r -2){
        player.hit(45); explosion(e.x,e.y,30); enemies.splice(j,1);
      }
    }
    // powerups
    for(let i=powerups.length-1;i>=0;i--){
      const p=powerups[i];
      if(dist(p.x,p.y,player.x,player.y) < 28){
        if(p.type==='rapid') player.boost=6;
        else { state.shield=Math.min(100, state.shield+45); }
        explosion(p.x,p.y,22,'#ffffff'); state.score+=250;
        powerups.splice(i,1);
      }
    }
    // multiplier decay
    if(state.multTimer>0){ state.multTimer-=dt; if(state.multTimer<=0){ state.multiplier=Math.max(1, state.multiplier-1); state.multTimer= state.multiplier>1?3:0; } }

    // draw order
    asteroids.forEach(a=>a.draw(ctx));
    powerups.forEach(p=>p.draw(ctx));
    enemies.forEach(e=>e.draw(ctx));
    player.draw(ctx);
    bullets.forEach(b=>b.draw(ctx));
    enemyBullets.forEach(b=>b.draw(ctx));
    particles.forEach(p=>p.draw(ctx));

    ctx.restore();

    // UI
    document.getElementById('score').textContent = String(Math.floor(state.score)).padStart(6,'0');
    document.getElementById('wave').textContent = state.wave;
    document.getElementById('mult').textContent = 'x'+state.multiplier.toFixed(state.multiplier>=5?0:1);
    document.getElementById('shieldBar').style.width = state.shield+'%';
    document.getElementById('lives').innerHTML = Array.from({length:3},(_,i)=>`<div class="life ${i<state.lives?'':'off'}"></div>`).join('');

    // wave progression
    if(state.asteroids + state.kills > state.wave*18){
      state.wave++; state.asteroids=0; state.kills=0;
      const wi=document.getElementById('waveIndicator');
      wi.textContent='WAVE '+state.wave; wi.style.animation='none'; wi.offsetHeight; wi.style.animation='waveIn 2s ease';
    }
  }
  requestAnimationFrame(loop);
}

function startGame(){
  state.running=true; state.over=false; state.score=0; state.wave=1; state.lives=3; state.shield=100; state.multiplier=1; state.multTimer=0; state.time=0; state.kills=0; state.asteroids=0;
  bullets=[]; enemyBullets=[]; asteroids=[]; enemies=[]; particles=[]; powerups=[];
  player=new Player();
  document.getElementById('menu').style.display='none';
  document.getElementById('gameOver').classList.remove('show');
  spawnTimer=0.5; enemyTimer=2;
}
function gameOver(){
  state.running=false; state.over=true;
  document.getElementById('gameOver').classList.add('show');
  document.getElementById('finalScore').textContent=String(Math.floor(state.score)).padStart(6,'0');
  document.getElementById('finalWave').textContent=`WAVE ${state.wave} • ${state.asteroids} ASTEROIDS • ${state.kills} INVADERS • MULT x${state.multiplier}`;
}

document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);
window.addEventListener('keydown', e=>{
  if(e.code==='Enter' && !state.running) startGame();
  if(e.code==='KeyP') state.running=!state.running;
});

// start loop
loop(performance.now());
})();
</script>
