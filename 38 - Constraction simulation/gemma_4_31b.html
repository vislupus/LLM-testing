<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structural Stress Lab | Physics Simulation</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid #334155;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 20px 0;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #334155;
            color: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        button:hover {
            background: #475569;
        }

        button.active {
            background: var(--accent);
            color: var(--bg-dark);
            font-weight: bold;
        }

        .stats-panel {
            flex-grow: 1;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .stat-value {
            color: var(--text-main);
        }

        /* Simulation Canvas */
        #canvas-container {
            flex-grow: 1;
            position: relative;
            cursor: crosshair;
            background-image: 
                radial-gradient(#334155 1px, transparent 1px);
            background-size: 40px 40px;
        }

        canvas {
            display: block;
        }

        #overlay-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: none;
            text-align: right;
        }

        .badge {
            background: rgba(15, 23, 42, 0.8);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--accent);
            font-size: 0.75rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

<div id="app-container">
    <aside id="sidebar">
        <div class="panel-section">
            <h1><span>🏗️</span> Structure Lab</h1>
            
            <label>Tool Selection</label>
            <div class="btn-group">
                <button id="tool-node" class="active" onclick="setTool('node')">Add Node</button>
                <button id="tool-beam" onclick="setTool('beam')">Add Beam</button>
                <button id="tool-lock" onclick="setTool('lock')">Lock Node</button>
                <button id="tool-clear" onclick="clearCanvas()" style="color: var(--danger)">Clear All</button>
            </div>
        </div>

        <div class="panel-section">
            <label>Environmental Forces</label>
            
            <div class="control-group">
                <label>Gravity <span id="val-gravity">9.8</span></label>
                <input type="range" id="input-gravity" min="0" max="30" step="0.1" value="9.8">
            </div>

            <div class="control-group">
                <label>Wind Intensity <span id="val-wind">0</span></label>
                <input type="range" id="input-wind" min="0" max="50" step="1" value="0">
            </div>

            <div class="control-group">
                <label>Atmospheric Pressure <span id="val-pressure">0</span></label>
                <input type="range" id="input-pressure" min="0" max="20" step="0.1" value="0">
            </div>

            <div class="control-group">
                <label>Material Stiffness <span id="val-stiffness">0.5</span></label>
                <input type="range" id="input-stiffness" min="0.1" max="1.0" step="0.05" value="0.5">
            </div>
        </div>

        <div class="stats-panel" id="stats">
            <div style="color: var(--accent); margin-bottom: 10px; font-weight: bold;">LIVE ANALYSIS</div>
            <div class="stat-item"><span>Nodes:</span> <span class="stat-value" id="stat-nodes">0</span></div>
            <div class="stat-item"><span>Beams:</span> <span class="stat-value" id="stat-beams">0</span></div>
            <div class="stat-item"><span>Max Stress:</span> <span class="stat-value" id="stat-stress">0%</span></div>
            <div class="stat-item"><span>Status:</span> <span class="stat-value" id="stat-status">Stable</span></div>
            <div id="log" style="margin-top: 15px; font-size: 0.7rem; color: #64748b; overflow-y: auto; max-height: 150px;"></div>
        </div>
    </aside>

    <main id="canvas-container">
        <div id="overlay-ui">
            <div class="badge">Physics: Verlet Integration v1.0</div>
        </div>
        <canvas id="simCanvas"></canvas>
    </main>
</div>

<script>
    /** 
     * PHYSICS ENGINE CONFIG 
     */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const logElement = document.getElementById('log');

    let width, height;
    let points = [];
    let beams = [];
    let currentTool = 'node';
    let selectedPoint = null;
    let isDragging = false;
    let draggedPoint = null;

    // Simulation Parameters
    const params = {
        gravity: 9.8,
        wind: 0,
        pressure: 0,
        stiffness: 0.5,
        breakThreshold: 1.6, // Beams break at 160% length
        friction: 0.99,
        iterations: 5 // Constraint solver iterations
    };

    class Point {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.oldX = x;
            this.oldY = y;
            this.ax = 0;
            this.ay = 0;
            this.locked = false;
            this.radius = 5;
        }

        update(dt) {
            if (this.locked) return;

            let vx = (this.x - this.oldX) * params.friction;
            let vy = (this.y - this.oldY) * params.friction;

            this.oldX = this.x;
            this.oldY = this.y;

            this.x += vx + this.ax * dt * dt;
            this.y += vy + this.ay * dt * dt;

            this.ax = 0;
            this.ay = 0;
        }

        applyForce(fx, fy) {
            this.ax += fx;
            this.ay += fy;
        }
    }

    class Beam {
        constructor(p1, p2) {
            this.p1 = p1;
            this.p2 = p2;
            this.length = Math.hypot(p1.x - p2.x, p1.y - p2.y);
            this.stress = 0;
            this.broken = false;
        }

        solve() {
            if (this.broken) return;

            let dx = this.p2.x - this.p1.x;
            let dy = this.p2.y - this.p1.y;
            let dist = Math.hypot(dx, dy);
            
            // Calculate stress (ratio of current length to original)
            this.stress = dist / this.length;

            if (this.stress > params.breakThreshold) {
                this.broken = true;
                addLog("Structural Failure: Beam Snapped!");
                return;
            }

            let diff = (this.length - dist) / dist * params.stiffness;
            let offsetX = dx * diff * 0.5;
            let offsetY = dy * diff * 0.5;

            if (!this.p1.locked) {
                this.p1.x -= offsetX;
                this.p1.y -= offsetY;
            }
            if (!this.p2.locked) {
                this.p2.x += offsetX;
                this.p2.y += offsetY;
            }
        }

        draw() {
            if (this.broken) return;

            // Color based on stress: Green -> Yellow -> Red
            let color = '#22c55e'; // Green
            if (this.stress > 1.1) color = '#f59e0b'; // Yellow
            if (this.stress > 1.3) color = '#ef4444'; // Red

            ctx.beginPath();
            ctx.moveTo(this.p1.x, this.p1.y);
            ctx.lineTo(this.p2.x, this.p2.y);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3 * (1 + (this.stress - 1));
            ctx.stroke();
        }
    }

    /**
     * APP LOGIC
     */

    function init() {
        window.addEventListener('resize', resize);
        resize();

        // UI Listeners
        document.getElementById('input-gravity').oninput = (e) => {
            params.gravity = parseFloat(e.target.value);
            document.getElementById('val-gravity').innerText = params.gravity;
        };
        document.getElementById('input-wind').oninput = (e) => {
            params.wind = parseFloat(e.target.value);
            document.getElementById('val-wind').innerText = params.wind;
        };
        document.getElementById('input-pressure').oninput = (e) => {
            params.pressure = parseFloat(e.target.value);
            document.getElementById('val-pressure').innerText = params.pressure;
        };
        document.getElementById('input-stiffness').oninput = (e) => {
            params.stiffness = parseFloat(e.target.value);
            document.getElementById('val-stiffness').innerText = params.stiffness;
        };

        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseup', handleMouseUp);

        requestAnimationFrame(loop);
    }

    function resize() {
        width = canvas.width = window.innerWidth - 320;
        height = canvas.height = window.innerHeight;
    }

    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tool-${tool}`).classList.add('active');
    }

    function clearCanvas() {
        points = [];
        beams = [];
        addLog("Workspace cleared.");
    }

    function addLog(msg) {
        const time = new Date().toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
        logElement.innerHTML = `<div>[${time}] ${msg}</div>` + logElement.innerHTML;
    }

    function handleMouseDown(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        // Check for point selection
        let hit = points.find(p => Math.hypot(p.x - mx, p.y - my) < 15);

        if (currentTool === 'node') {
            if (!hit) {
                points.push(new Point(mx, my));
                addLog("Added Node");
            } else {
                draggedPoint = hit;
                isDragging = true;
            }
        } else if (currentTool === 'beam') {
            if (hit) {
                selectedPoint = hit;
            }
        } else if (currentTool === 'lock') {
            if (hit) {
                hit.locked = !hit.locked;
                addLog(hit.locked ? "Node Locked" : "Node Unlocked");
            }
        }
    }

    function handleMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (isDragging && draggedPoint) {
            draggedPoint.x = mx;
            draggedPoint.y = my;
            draggedPoint.oldX = mx;
            draggedPoint.oldY = my;
        }
    }

    function handleMouseUp(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;

        if (currentTool === 'beam' && selectedPoint) {
            let hit = points.find(p => Math.hypot(p.x - mx, p.y - my) < 15);
            if (hit && hit !== selectedPoint) {
                beams.push(new Beam(selectedPoint, hit));
                addLog("Added Structural Beam");
            }
        }

        selectedPoint = null;
        draggedPoint = null;
        isDragging = false;
    }

    function loop() {
        // Physics Step
        const dt = 0.016; // Fixed time step
        
        // 1. Apply Global Forces
        let windForce = params.wind * Math.sin(Date.now() / 1000) * 0.1; 
        
        points.forEach(p => {
            p.applyForce(windForce, params.gravity * 0.1);
            
            // Pressure simulation: force based on elevation
            if (params.pressure > 0) {
                p.applyForce(0, params.pressure * 0.05);
            }

            p.update(dt);

            // Floor collision
            if (p.y > height - 20) {
                p.y = height - 20;
                p.oldY = p.y;
            }
        });

        // 2. Solve constraints multiple times for stability
        for (let i = 0; i < params.iterations; i++) {
            beams.forEach(b => b.solve());
        }

        // 3. Render
        ctx.clearRect(0, 0, width, height);

        // Draw Beams
        let maxStress = 0;
        beams.forEach(b => {
            b.draw();
            if (!b.broken && b.stress > maxStress) maxStress = b.stress;
        });

        // Draw Points
        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.locked ? varColor('--accent') : varColor('--text-dim');
            ctx.fill();
            if (p.locked) {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        });

        // Draw Preview Beam
        if (currentTool === 'beam' && selectedPoint) {
            // Note: Mouse coordinates are handled in event listeners,’
            // for the preview we can't easily get current mouse here without a global var
        }

        updateStats(maxStress);
        requestAnimationFrame(loop);
    }

    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function updateStats(maxStress) {
        document.getElementById('stat-nodes').innerText = points.length;
        document.getElementById('stat-beams').innerText = beams.filter(b => !b.broken).length;
        
        let stressPct = Math.round((maxStress - 1) * 100);
        document.getElementById('stat-stress').innerText = (stressPct < 0 ? 0 : stressPct) + "%";
        
        const statusEl = document.getElementById('stat-status');
        if (maxStress < 1.1) {
            statusEl.innerText = "Stable";
            statusEl.style.color = varColor('--success');
        } else if (maxStress < 1.4) {
            statusEl.innerText = "Strained";
            statusEl.style.color = varColor('--warning');
        } else {
            statusEl.innerText = "Critical";
            statusEl.style.color = varColor('--danger');
        }
    }

    init();
</script>
</body>
</html>
