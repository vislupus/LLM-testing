<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StructuralSim Pro — Interactive Structure Simulation</title>
    <style>
        :root {
            --bg: #1a1d23;
            --panel: #21252b;
            --surface: #282c34;
            --border: #3a3f4b;
            --text: #e0e0e0;
            --text2: #a0a8b4;
            --accent: #4fc3f7;
            --accent2: #29b6f6;
            --green: #66bb6a;
            --yellow: #ffca28;
            --orange: #ff9800;
            --red: #ef5350;
            --red2: #e53935;
            --purple: #ab47bc;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s ease;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: #121418;
            color: var(--text);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }
        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        header .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -0.3px;
            white-space: nowrap;
        }
        header .logo span {
            color: var(--text2);
            font-weight: 400;
            font-size: 0.85rem;
            margin-left: 4px;
        }
        .btn {
            padding: 7px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.85rem;
            font-family: var(--font);
            transition: var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover {
            background: #353b48;
            border-color: #5a6170;
        }
        .btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn.play {
            background: var(--green);
            color: #000;
            border-color: var(--green);
            font-weight: 600;
        }
        .btn.play.paused {
            background: var(--orange);
            border-color: var(--orange);
            color: #000;
        }
        .btn.danger {
            background: transparent;
            border-color: var(--red);
            color: var(--red);
        }
        .btn.danger:hover {
            background: var(--red);
            color: #fff;
        }
        .btn.small {
            padding: 4px 10px;
            font-size: 0.75rem;
        }
        .sep {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar {
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 12px;
            overflow-y: auto;
            flex-shrink: 0;
            width: 230px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar.right {
            border-right: none;
            border-left: 1px solid var(--border);
            width: 260px;
        }
        .sidebar h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text2);
            margin-bottom: 2px;
        }
        .sidebar .section {
            background: var(--surface);
            border-radius: var(--radius-sm);
            padding: 10px;
        }
        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .tool-btn {
            padding: 8px 6px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            font-family: var(--font);
            text-align: center;
            transition: var(--transition);
            line-height: 1.2;
        }
        .tool-btn:hover {
            background: #353b48;
        }
        .tool-btn.sel {
            border-color: var(--accent);
            background: #1b2838;
            box-shadow: 0 0 8px rgba(79, 195, 247, 0.25);
        }
        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #181b21;
            cursor: crosshair;
            min-width: 400px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--text2);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            pointer-events: none;
        }
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-size: 0.78rem;
            margin: 3px 0;
        }
        .param-row label {
            color: var(--text2);
            flex-shrink: 0;
            min-width: 40px;
        }
        .param-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            height: 6px;
        }
        .param-row .val {
            width: 32px;
            text-align: right;
            font-size: 0.7rem;
            color: var(--accent);
            flex-shrink: 0;
        }
        .stress-bar {
            height: 6px;
            border-radius: 3px;
            background: #3a3f4b;
            margin: 2px 0;
            overflow: hidden;
        }
        .stress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s;
        }
        .member-item {
            font-size: 0.7rem;
            padding: 3px 6px;
            background: var(--surface);
            border-radius: 4px;
            margin: 2px 0;
            display: flex;
            justify-content: space-between;
            border-left: 3px solid transparent;
        }
        .member-item.crit {
            border-left-color: var(--red);
        }
        .member-item.warn {
            border-left-color: var(--orange);
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            margin: 2px 0;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        @media (max-width: 900px) {
            .sidebar {
                width: 170px;
                padding: 8px;
            }
            .sidebar.right {
                width: 200px;
            }
            .tool-btn {
                font-size: 0.7rem;
                padding: 6px 4px;
            }
            header {
                padding: 6px 10px;
                gap: 6px;
            }
            .btn {
                padding: 5px 10px;
                font-size: 0.75rem;
            }
        }
        @media (max-width: 650px) {
            .main {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                max-height: 120px;
                overflow-y: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .sidebar.right {
                width: 100%;
                max-height: 150px;
                border-left: none;
                border-top: 1px solid var(--border);
            }
            .canvas-wrap {
                min-width: auto;
                min-height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <div class="logo">StructuralSim<span>Pro</span></div>
            <div class="sep"></div>
            <button class="btn play" id="btnPlay" title="Run/Pause simulation">▶ Run</button>
            <button class="btn" id="btnStep" title="Single step">⏭ Step</button>
            <button class="btn danger" id="btnReset" title="Reset all deformations">↺ Reset</button>
            <div class="sep"></div>
            <button class="btn small" id="btnPresetBridge">🌉 Bridge</button>
            <button class="btn small" id="btnPresetTower">🗼 Tower</button>
            <button class="btn small" id="btnPresetHouse">🏠 House</button>
            <button class="btn small" id="btnPresetCrane">🏗 Crane</button>
            <div class="sep"></div>
            <span style="font-size:0.75rem;color:var(--text2);">Speed:</span>
            <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" style="width:70px;accent-color:var(--accent);">
            <span id="speedVal" style="font-size:0.7rem;color:var(--accent);width:24px;">1×</span>
        </header>
        <div class="main">
            <aside class="sidebar" id="leftPanel">
                <div class="section">
                    <h3>🛠 Tools</h3>
                    <div class="tool-grid" id="toolGrid">
                        <button class="tool-btn sel" data-tool="select">👆 Select</button>
                        <button class="tool-btn" data-tool="node">➕ Node</button>
                        <button class="tool-btn" data-tool="beam">🔗 Beam</button>
                        <button class="tool-btn" data-tool="support">📌 Support</button>
                        <button class="tool-btn" data-tool="force">⬇ Force</button>
                        <button class="tool-btn" data-tool="distload">📐 Dist.Load</button>
                        <button class="tool-btn" data-tool="delete">🗑 Delete</button>
                    </div>
                </div>
                <div class="section">
                    <h3>🌍 Environment</h3>
                    <div class="param-row"><label>Gravity</label><input type="range" id="gravSlider" min="0" max="600" value="300" step="10"><span class="val" id="gravVal">300</span></div>
                    <div class="param-row"><label>Wind</label><input type="range" id="windSlider" min="0" max="200" value="0" step="5"><span class="val" id="windVal">0</span></div>
                    <div style="display:flex;gap:6px;margin-top:4px;">
                        <button class="btn small" id="btnRain" style="flex:1;">🌧 Rain OFF</button>
                        <button class="btn small" id="btnWindDir" style="flex:1;">💨 →</button>
                    </div>
                </div>
                <div class="section">
                    <h3>📐 Material</h3>
                    <div class="param-row"><label>Stiffness</label><input type="range" id="stiffSlider" min="5000" max="100000" value="40000" step="1000"><span class="val" id="stiffVal">40k</span></div>
                    <div class="param-row"><label>Yield Str.</label><input type="range" id="yieldSlider" min="50" max="600" value="280" step="10"><span class="val" id="yieldVal">280</span></div>
                </div>
            </aside>
            <div class="canvas-wrap" id="canvasWrap">
                <canvas id="simCanvas"></canvas>
                <div class="overlay-info" id="overlayInfo">Click to build • Drag nodes to move • Press Del to remove selected</div>
            </div>
            <aside class="sidebar right" id="rightPanel">
                <div class="section">
                    <h3>📊 Live Analysis</h3>
                    <div id="analysisContent" style="font-size:0.75rem;">
                        <div class="param-row"><label>Nodes:</label><span id="statNodes">0</span></div>
                        <div class="param-row"><label>Beams:</label><span id="statBeams">0</span></div>
                        <div class="param-row"><label>Max Stress:</label><span id="statMaxStress" style="color:var(--green);">0%</span></div>
                        <div class="param-row"><label>Max Deflect:</label><span id="statMaxDeflect">0 px</span></div>
                        <div class="param-row"><label>Safety Factor:</label><span id="statSafety" style="color:var(--green);">—</span></div>
                        <div class="param-row"><label>Broken:</label><span id="statBroken" style="color:var(--red);">0</span></div>
                    </div>
                </div>
                <div class="section">
                    <h3>🔴 Critical Members</h3>
                    <div id="criticalList" style="max-height:140px;overflow-y:auto;">
                        <span style="font-size:0.7rem;color:var(--text2);">None yet</span>
                    </div>
                </div>
                <div class="section">
                    <h3>📖 Legend</h3>
                    <div class="legend-row"><span class="legend-dot" style="background:#66bb6a;"></span> Safe (&lt;40%)</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#ffca28;"></span> Moderate (40-70%)</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#ff9800;"></span> High (70-95%)</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#ef5350;"></span> Critical (&gt;95%)</div>
                    <div class="legend-row"><span class="legend-dot" style="background:#fff;border:1px solid #ef5350;"></span> Broken</div>
                </div>
            </aside>
        </div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('simCanvas');
            const ctx = canvas.getContext('2d');
            const wrap = document.getElementById('canvasWrap');

            let W, H, groundY;
            const GRID = 20;

            function resize() {
                const rect = wrap.getBoundingClientRect();
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                W = rect.width;
                H = rect.height;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                canvas.style.width = W + 'px';
                canvas.style.height = H + 'px';
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.scale(dpr, dpr);
                groundY = H - 40;
            }
            window.addEventListener('resize', resize);
            resize();

            // --- STATE ---
            let nodes = [];
            let beams = [];
            let pointLoads = [];
            let distLoads = [];
            let rainDrops = [];
            let breakParticles = [];
            let selectedNode = null;
            let selectedBeam = null;
            let hoveredNode = null;
            let hoveredBeam = null;
            let currentTool = 'select';
            let beamStartNode = null;
            let isDragging = false;
            let dragNode = null;
            let forceDragNode = null;
            let forceDragStart = null;
            let forceDragCurrent = null;
            let simRunning = true;
            let simSpeed = 1;
            let gravityMag = 300;
            let windMag = 0;
            let windDir = 1;
            let rainOn = false;
            let stiffness = 40000;
            let yieldStress = 280;
            let ultimateStress = 420;
            let beamArea = 0.8;
            let nodeMass = 1.0;
            let damping = 0.985;
            let constraintIters = 8;
            let nodeIdCounter = 0;
            let beamIdCounter = 0;
            let mouseX = 0,
                mouseY = 0;
            let mouseDown = false;

            // --- DATA STRUCTURES ---
            function createNode(x, y, fixed = false, supportType = 'none') {
                return {
                    id: nodeIdCounter++,
                    x,
                    y,
                    origX: x,
                    origY: y,
                    vx: 0,
                    vy: 0,
                    mass: nodeMass,
                    fixed,
                    supportType, // 'none','fixed','pin','roller'
                    _fx: 0,
                    _fy: 0
                };
            }

            function createBeam(n1, n2) {
                const dx = n2.x - n1.x;
                const dy = n2.y - n1.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                return {
                    id: beamIdCounter++,
                    n1,
                    n2,
                    restLen: len,
                    area: beamArea,
                    stressRatio: 0,
                    broken: false,
                    _currentLen: len
                };
            }

            function createPointLoad(node, fx, fy) {
                return { node, fx, fy, id: Math.random() };
            }

            function createDistLoad(beam, intensity) {
                return { beam, intensity, id: Math.random() };
            }

            // --- PHYSICS ---
            function getBeamStiffness(beam) {
                return stiffness * beam.area / Math.max(beam.restLen, 1);
            }

            function solvePhysics(dt) {
                const subDt = dt / Math.max(constraintIters, 1);
                for (let iter = 0; iter < constraintIters; iter++) {
                    // Reset accumulated forces
                    for (const n of nodes) { n._fx = 0;
                        n._fy = 0; }

                    // Gravity
                    for (const n of nodes) {
                        if (!n.fixed) {
                            n._fy += gravityMag * n.mass;
                        }
                    }

                    // Wind on nodes
                    if (windMag > 0) {
                        for (const n of nodes) {
                            if (!n.fixed) {
                                n._fx += windMag * windDir * 0.3;
                            }
                        }
                    }

                    // Point loads
                    for (const pl of pointLoads) {
                        pl.node._fx += pl.fx;
                        pl.node._fy += pl.fy;
                    }

                    // Distributed loads → split to nodes
                    for (const dl of distLoads) {
                        if (dl.beam.broken) continue;
                        const b = dl.beam;
                        const halfFx = 0;
                        const halfFy = dl.intensity * b.restLen / 2;
                        b.n1._fy += halfFy;
                        b.n2._fy += halfFy;
                    }

                    // Beam spring forces
                    for (const b of beams) {
                        if (b.broken) continue;
                        const dx = b.n2.x - b.n1.x;
                        const dy = b.n2.y - b.n1.y;
                        const currentLen = Math.sqrt(dx * dx + dy * dy);
                        if (currentLen < 0.001) continue;
                        b._currentLen = currentLen;
                        const extension = currentLen - b.restLen;
                        const k = getBeamStiffness(b);
                        const force = k * extension;
                        const nx = dx / currentLen;
                        const ny = dy / currentLen;
                        const fx = force * nx;
                        const fy = force * ny;
                        if (!b.n1.fixed) { b.n1._fx += fx;
                            b.n1._fy += fy; }
                        if (!b.n2.fixed) { b.n2._fx -= fx;
                            b.n2._fy -= fy; }

                        // Stress ratio
                        const stress = Math.abs(force) / Math.max(b.area, 0.01);
                        b.stressRatio = yieldStress > 0 ? stress / yieldStress : 0;
                    }

                    // Update velocities & positions
                    for (const n of nodes) {
                        if (n.fixed) {
                            n.vx = 0;
                            n.vy = 0;
                            n.x = n.origX;
                            n.y = n.origY;
                            continue;
                        }
                        const ax = n._fx / n.mass;
                        const ay = n._fy / n.mass;
                        n.vx = (n.vx + ax * subDt) * damping;
                        n.vy = (n.vy + ay * subDt) * damping;
                        n.x += n.vx * subDt;
                        n.y += n.vy * subDt;

                        // Support constraints
                        if (n.supportType === 'fixed' || n.supportType === 'pin') {
                            n.x = n.origX;
                            n.y = n.origY;
                            n.vx = 0;
                            n.vy = 0;
                        } else if (n.supportType === 'roller') {
                            n.y = n.origY;
                            n.vy = 0;
                        }
                    }
                }

                // Check for beam failures
                for (const b of beams) {
                    if (b.broken) continue;
                    const stress = b.stressRatio * yieldStress;
                    if (stress > ultimateStress && b.stressRatio > 1.15) {
                        b.broken = true;
                        spawnBreakParticles(b);
                    }
                }
            }

            function spawnBreakParticles(beam) {
                const mx = (beam.n1.x + beam.n2.x) / 2;
                const my = (beam.n1.y + beam.n2.y) / 2;
                for (let i = 0; i < 20; i++) {
                    breakParticles.push({
                        x: mx,
                        y: my,
                        vx: (Math.random() - 0.5) * 150,
                        vy: (Math.random() - 0.5) * 150 - 60,
                        life: 0.6 + Math.random() * 0.8,
                        maxLife: 0.6 + Math.random() * 0.8,
                        color: Math.random() < 0.5 ? '#ff6e40' : '#ffab40'
                    });
                }
            }

            // --- RAIN ---
            function updateRain(dt) {
                if (rainOn) {
                    const spawnRate = 300;
                    const toSpawn = Math.floor(spawnRate * dt);
                    for (let i = 0; i < toSpawn; i++) {
                        rainDrops.push({
                            x: Math.random() * W,
                            y: -Math.random() * 60,
                            vy: 500 + Math.random() * 400,
                            vx: windMag * windDir * 0.4 + (Math.random() - 0.5) * 30,
                            life: 1.5,
                            len: 8 + Math.random() * 14
                        });
                    }
                }
                for (const d of rainDrops) {
                    d.y += d.vy * dt;
                    d.x += d.vx * dt;
                    d.life -= dt;
                }
                rainDrops = rainDrops.filter(d => d.life > 0 && d.y < H + 40 && d.x > -40 && d.x < W + 40);
                if (rainDrops.length > 800) rainDrops.splice(0, rainDrops.length - 800);
            }

            function updateBreakParticles(dt) {
                for (const p of breakParticles) {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.vy += 400 * dt;
                    p.life -= dt;
                }
                breakParticles = breakParticles.filter(p => p.life > 0);
            }

            // --- RENDER ---
            function drawGrid() {
                ctx.strokeStyle = '#252830';
                ctx.lineWidth = 0.5;
                for (let x = GRID; x < W; x += GRID) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (let y = GRID; y < H; y += GRID) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                // Ground line
                ctx.strokeStyle = '#4a5058';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();
                ctx.setLineDash([6, 4]);
                ctx.strokeStyle = '#3a3f48';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, groundY);
                ctx.lineTo(W, groundY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            function getStressColor(ratio) {
                if (ratio < 0.4) return { r: 100, g: 180, b: 100, hex: '#64b464' };
                if (ratio < 0.7) return { r: 255, g: 200, b: 40, hex: '#ffc828' };
                if (ratio < 0.95) return { r: 255, g: 150, b: 30, hex: '#ff9620' };
                return { r: 240, g: 60, b: 50, hex: '#f03c32' };
            }

            function drawBeam(b) {
                if (b.broken) {
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                } else {
                    const col = getStressColor(b.stressRatio);
                    ctx.strokeStyle = col.hex;
                    ctx.lineWidth = 2.5 + b.stressRatio * 3;
                    ctx.setLineDash([]);
                    // Glow for high stress
                    if (b.stressRatio > 0.85) {
                        ctx.shadowColor = col.hex;
                        ctx.shadowBlur = 8;
                    } else {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                    }
                }
                ctx.beginPath();
                ctx.moveTo(b.n1.x, b.n1.y);
                ctx.lineTo(b.n2.x, b.n2.y);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // Midpoint stress indicator dot
                if (!b.broken && b.stressRatio > 0.25) {
                    const mx = (b.n1.x + b.n2.x) / 2;
                    const my = (b.n1.y + b.n2.y) / 2;
                    const col = getStressColor(b.stressRatio);
                    ctx.fillStyle = col.hex;
                    ctx.beginPath();
                    ctx.arc(mx, my, 3 + b.stressRatio * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawNode(n) {
                const isSelected = n === selectedNode;
                const isHovered = n === hoveredNode;
                const r = isSelected ? 9 : isHovered ? 8 : 6;
                // Glow
                if (isSelected || isHovered) {
                    ctx.shadowColor = '#4fc3f7';
                    ctx.shadowBlur = 14;
                }
                // Support shape
                if (n.supportType === 'fixed') {
                    ctx.fillStyle = '#e0e0e0';
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(n.x - 10, n.y + 6);
                    ctx.lineTo(n.x + 10, n.y + 6);
                    ctx.lineTo(n.x + 8, n.y + 14);
                    ctx.lineTo(n.x - 8, n.y + 14);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                    // Hatching
                    ctx.strokeStyle = '#777';
                    ctx.lineWidth = 1;
                    for (let hx = n.x - 7; hx <= n.x + 6; hx += 4) {
                        ctx.beginPath();
                        ctx.moveTo(hx, n.y + 6);
                        ctx.lineTo(hx, n.y + 14);
                        ctx.stroke();
                    }
                } else if (n.supportType === 'pin') {
                    ctx.fillStyle = '#e0e0e0';
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y + 5, 9, Math.PI, 0);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#555';
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                } else if (n.supportType === 'roller') {
                    ctx.fillStyle = '#e0e0e0';
                    ctx.strokeStyle = '#999';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y + 5, 9, Math.PI, 0);
                    ctx.fill();
                    ctx.stroke();
                    // Wheels
                    ctx.fillStyle = '#777';
                    ctx.beginPath();
                    ctx.arc(n.x - 6, n.y + 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(n.x + 6, n.y + 12, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#555';
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = isSelected ? '#4fc3f7' : isHovered ? '#81d4fa' : '#ccc';
                    ctx.strokeStyle = '#555';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;

                // Show deformation offset
                if (!n.fixed && n.supportType === 'none') {
                    const dx = n.x - n.origX;
                    const dy = n.y - n.origY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > 1.5 && !isDragging) {
                        ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                        ctx.lineWidth = 0.8;
                        ctx.setLineDash([2, 3]);
                        ctx.beginPath();
                        ctx.moveTo(n.origX, n.origY);
                        ctx.lineTo(n.x, n.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        ctx.fillStyle = 'rgba(255,255,255,0.5)';
                        ctx.beginPath();
                        ctx.arc(n.origX, n.origY, 2.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            function drawForceArrow(node, fx, fy, color = '#ff6d00') {
                const mag = Math.sqrt(fx * fx + fy * fy);
                if (mag < 0.5) return;
                const scale = 0.15;
                const sx = node.x;
                const sy = node.y;
                const ex = sx + fx * scale;
                const ey = sy + fy * scale;
                const arrowLen = Math.min(16, mag * scale * 0.4);
                const angle = Math.atan2(ey - sy, ex - sx);

                ctx.strokeStyle = color;
                ctx.lineWidth = 2.5;
                ctx.shadowColor = color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Arrowhead
                const ax1 = ex - arrowLen * Math.cos(angle - 0.5);
                const ay1 = ey - arrowLen * Math.sin(angle - 0.5);
                const ax2 = ex - arrowLen * Math.cos(angle + 0.5);
                const ay2 = ey - arrowLen * Math.sin(angle + 0.5);
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.moveTo(ex, ey);
                ctx.lineTo(ax1, ay1);
                ctx.lineTo(ax2, ay2);
                ctx.closePath();
                ctx.fill();
            }

            function drawDistLoadIndicator(dl) {
                if (dl.beam.broken) return;
                const b = dl.beam;
                const mx = (b.n1.x + b.n2.x) / 2;
                const my = (b.n1.y + b.n2.y) / 2;
                const dx = b.n2.x - b.n1.x;
                const dy = b.n2.y - b.n1.y;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len < 1) return;
                const nx = -dy / len;
                const ny = dx / len;
                const offset = 18;
                const numArrows = Math.max(2, Math.floor(len / 30));
                ctx.strokeStyle = 'rgba(255,140,30,0.7)';
                ctx.fillStyle = 'rgba(255,140,30,0.7)';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < numArrows; i++) {
                    const t = (i + 0.5) / numArrows;
                    const px = b.n1.x + dx * t;
                    const py = b.n1.y + dy * t;
                    const ax = px + nx * offset;
                    const ay = py + ny * offset;
                    const bx = px - nx * offset * 0.4;
                    const by = py - ny * offset * 0.4;
                    ctx.beginPath();
                    ctx.moveTo(bx, by);
                    ctx.lineTo(ax, ay);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(ax, ay, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function drawRain() {
                ctx.strokeStyle = 'rgba(150,200,255,0.5)';
                ctx.lineWidth = 1;
                for (const d of rainDrops) {
                    const alpha = Math.min(1, d.life / 0.3);
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.moveTo(d.x, d.y);
                    ctx.lineTo(d.x - d.vx * 0.015, d.y - d.len);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;
            }

            function drawBreakParticles() {
                for (const p of breakParticles) {
                    const alpha = p.life / p.maxLife;
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = alpha;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2.5 * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            function drawBeamPreview() {
                if (currentTool === 'beam' && beamStartNode && hoveredNode && hoveredNode !== beamStartNode) {
                    ctx.strokeStyle = 'rgba(79,195,247,0.5)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([6, 4]);
                    ctx.beginPath();
                    ctx.moveTo(beamStartNode.x, beamStartNode.y);
                    ctx.lineTo(hoveredNode.x, hoveredNode.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
                if (currentTool === 'force' && forceDragNode && forceDragStart && forceDragCurrent) {
                    const fx = forceDragCurrent.x - forceDragStart.x;
                    const fy = forceDragCurrent.y - forceDragStart.y;
                    const mag = Math.sqrt(fx * fx + fy * fy);
                    if (mag > 5) {
                        drawForceArrow(forceDragNode, fx, fy, 'rgba(255,140,30,0.6)');
                        ctx.fillStyle = 'rgba(255,255,255,0.7)';
                        ctx.font = '11px ' + getComputedStyle(document.body).fontFamily;
                        ctx.fillText(Math.round(mag) + ' N', forceDragCurrent.x + 8, forceDragCurrent.y - 4);
                    }
                }
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#181b21';
                ctx.fillRect(0, 0, W, H);
                drawGrid();

                // Dist load indicators
                for (const dl of distLoads) drawDistLoadIndicator(dl);

                // Beams
                for (const b of beams) drawBeam(b);

                // Beam preview
                drawBeamPreview();

                // Nodes
                for (const n of nodes) drawNode(n);

                // Point load arrows
                for (const pl of pointLoads) drawForceArrow(pl.node, pl.fx, pl.fy, '#ff6d00');

                // Rain
                if (rainOn) drawRain();

                // Break particles
                drawBreakParticles();

                // Wind indicator
                if (windMag > 0) {
                    const wx = W - 50;
                    const wy = 25;
                    ctx.fillStyle = 'rgba(200,220,255,0.6)';
                    ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
                    ctx.fillText('💨 Wind ' + Math.round(windMag) + ' N', wx - 60, wy + 4);
                }
            }

            // --- INTERACTION ---
            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            function findClosestNode(pos, maxDist = 18) {
                let best = null;
                let bestDist = maxDist;
                for (const n of nodes) {
                    const dx = n.x - pos.x;
                    const dy = n.y - pos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < bestDist) { bestDist = dist;
                        best = n; }
                }
                return best;
            }

            function findClosestBeam(pos, maxDist = 14) {
                let best = null;
                let bestDist = maxDist;
                for (const b of beams) {
                    if (b.broken) continue;
                    const ax = b.n1.x,
                        ay = b.n1.y;
                    const bx = b.n2.x,
                        by = b.n2.y;
                    const dx = bx - ax,
                        dy = by - ay;
                    const len2 = dx * dx + dy * dy;
                    if (len2 < 1) continue;
                    let t = ((pos.x - ax) * dx + (pos.y - ay) * dy) / len2;
                    t = Math.max(0, Math.min(1, t));
                    const cx = ax + t * dx;
                    const cy = ay + t * dy;
                    const dist = Math.sqrt((pos.x - cx) ** 2 + (pos.y - cy) ** 2);
                    if (dist < bestDist) { bestDist = dist;
                        best = b; }
                }
                return best;
            }

            function addNode(x, y) {
                const n = createNode(x, y);
                nodes.push(n);
                selectedNode = n;
                selectedBeam = null;
                updateAnalysis();
                return n;
            }

            function addBeam(n1, n2) {
                const exists = beams.find(b => !b.broken && ((b.n1 === n1 && b.n2 === n2) || (b.n1 === n2 && b
                    .n2 === n1)));
                if (exists) return null;
                const b = createBeam(n1, n2);
                beams.push(b);
                selectedBeam = b;
                selectedNode = null;
                updateAnalysis();
                return b;
            }

            function deleteNode(node) {
                beams = beams.filter(b => {
                    if (b.n1 === node || b.n2 === node) { b.broken = true;
                        spawnBreakParticles(b); return false; }
                    return true;
                });
                pointLoads = pointLoads.filter(pl => pl.node !== node);
                nodes = nodes.filter(n => n !== node);
                if (selectedNode === node) selectedNode = null;
                if (hoveredNode === node) hoveredNode = null;
                updateAnalysis();
            }

            function deleteBeam(beam) {
                beam.broken = true;
                spawnBreakParticles(beam);
                distLoads = distLoads.filter(dl => dl.beam !== beam);
                if (selectedBeam === beam) selectedBeam = null;
                if (hoveredBeam === beam) hoveredBeam = null;
                updateAnalysis();
            }

            function cycleSupport(node) {
                const types = ['none', 'fixed', 'pin', 'roller'];
                const idx = types.indexOf(node.supportType);
                const next = types[(idx + 1) % types.length];
                node.supportType = next;
                node.fixed = (next === 'fixed' || next === 'pin');
                node.origX = node.x;
                node.origY = node.y;
                if (node.fixed) { node.vx = 0;
                    node.vy = 0; }
                updateAnalysis();
            }

            function clearAll() {
                nodes = [];
                beams = [];
                pointLoads = [];
                distLoads = [];
                rainDrops = [];
                breakParticles = [];
                selectedNode = null;
                selectedBeam = null;
                hoveredNode = null;
                hoveredBeam = null;
                beamStartNode = null;
                nodeIdCounter = 0;
                beamIdCounter = 0;
                updateAnalysis();
            }

            function resetDeformation() {
                for (const n of nodes) {
                    n.x = n.origX;
                    n.y = n.origY;
                    n.vx = 0;
                    n.vy = 0;
                }
                for (const b of beams) {
                    b.broken = false;
                    b.stressRatio = 0;
                    b._currentLen = b.restLen;
                }
                breakParticles = [];
                updateAnalysis();
            }

            function updateAnalysis() {
                document.getElementById('statNodes').textContent = nodes.length;
                const activeBeams = beams.filter(b => !b.broken);
                document.getElementById('statBeams').textContent = activeBeams.length;
                const brokenCount = beams.filter(b => b.broken).length;
                document.getElementById('statBroken').textContent = brokenCount;

                let maxStress = 0;
                let maxDeflect = 0;
                let maxStressBeam = null;
                for (const b of activeBeams) {
                    if (b.stressRatio > maxStress) { maxStress = b.stressRatio;
                        maxStressBeam = b; }
                }
                for (const n of nodes) {
                    const dx = n.x - n.origX;
                    const dy = n.y - n.origY;
                    const d = Math.sqrt(dx * dx + dy * dy);
                    if (d > maxDeflect) maxDeflect = d;
                }

                document.getElementById('statMaxStress').textContent = (maxStress * 100).toFixed(1) + '%';
                document.getElementById('statMaxStress').style.color = maxStress > 0.9 ? 'var(--red)' : maxStress >
                    0.6 ? 'var(--orange)' : 'var(--green)';
                document.getElementById('statMaxDeflect').textContent = maxDeflect.toFixed(1) + ' px';
                const safety = maxStress > 0.001 ? (1 / maxStress).toFixed(2) : '—';
                document.getElementById('statSafety').textContent = safety;
                document.getElementById('statSafety').style.color = maxStress > 0.9 ? 'var(--red)' : maxStress > 0.5 ?
                    'var(--orange)' : 'var(--green)';

                // Critical members list
                const criticalList = document.getElementById('criticalList');
                const sorted = activeBeams.filter(b => b.stressRatio > 0.5).sort((a, b) => b.stressRatio - a.stressRatio)
                    .slice(0, 8);
                if (sorted.length === 0) {
                    criticalList.innerHTML = '<span style="font-size:0.7rem;color:var(--text2);">None yet</span>';
                } else {
                    criticalList.innerHTML = sorted.map(b => {
                        const cls = b.stressRatio > 0.9 ? 'crit' : b.stressRatio > 0.7 ? 'warn' : '';
                        return `<div class="member-item ${cls}"><span>Beam #${b.id}</span><span style="color:${getStressColor(b.stressRatio).hex}">${(b.stressRatio*100).toFixed(0)}%</span></div>`;
                    }).join('');
                }
            }

            // --- PRESETS ---
            function loadPreset(name) {
                clearAll();
                let presetNodes = [],
                    presetBeams = [],
                    presetSupports = [],
                    presetLoads = [];
                const cx = W / 2;
                const gy = groundY;

                if (name === 'bridge') {
                    const span = 500;
                    const height = 120;
                    const x0 = cx - span / 2;
                    const panels = 8;
                    const pw = span / panels;
                    const topY = gy - height;
                    const botY = gy - 10;
                    const topNodes = [];
                    const botNodes = [];
                    for (let i = 0; i <= panels; i++) {
                        const tx = x0 + i * pw;
                        const tn = createNode(tx, topY);
                        const bn = createNode(tx, botY);
                        nodes.push(tn);
                        nodes.push(bn);
                        topNodes.push(tn);
                        botNodes.push(bn);
                    }
                    for (let i = 0; i < panels; i++) {
                        beams.push(createBeam(topNodes[i], topNodes[i + 1]));
                        beams.push(createBeam(botNodes[i], botNodes[i + 1]));
                        beams.push(createBeam(topNodes[i], botNodes[i + 1]));
                        beams.push(createBeam(botNodes[i], topNodes[i + 1]));
                        if (i === 0 || i === panels - 1) {
                            beams.push(createBeam(topNodes[i], botNodes[i]));
                        }
                    }
                    beams.push(createBeam(topNodes[panels], botNodes[panels]));
                    botNodes[0].supportType = 'pin';
                    botNodes[0].fixed = true;
                    botNodes[0].origX = botNodes[0].x;
                    botNodes[0].origY = botNodes[0].y;
                    botNodes[panels].supportType = 'roller';
                    botNodes[panels].origX = botNodes[panels].x;
                    botNodes[panels].origY = botNodes[panels].y;
                    pointLoads.push(createPointLoad(topNodes[Math.floor(panels / 2)], 0, 500));
                } else if (name === 'tower') {
                    const baseW = 160;
                    const topW = 40;
                    const height = 280;
                    const tx = cx;
                    const ty = gy - height;
                    const sections = 6;
                    const topN = createNode(tx, ty);
                    nodes.push(topN);
                    let prevLeft = createNode(tx - baseW / 2, gy - 10);
                    let prevRight = createNode(tx + baseW / 2, gy - 10);
                    nodes.push(prevLeft);
                    nodes.push(prevRight);
                    prevLeft.supportType = 'fixed';
                    prevLeft.fixed = true;
                    prevLeft.origX = prevLeft.x;
                    prevLeft.origY = prevLeft.y;
                    prevRight.supportType = 'fixed';
                    prevRight.fixed = true;
                    prevRight.origX = prevRight.x;
                    prevRight.origY = prevRight.y;
                    let allLefts = [prevLeft];
                    let allRights = [prevRight];
                    for (let i = 1; i < sections; i++) {
                        const t = i / sections;
                        const w = baseW - (baseW - topW) * t;
                        const y = gy - 10 - height * t;
                        const ln = createNode(tx - w / 2, y);
                        const rn = createNode(tx + w / 2, y);
                        nodes.push(ln);
                        nodes.push(rn);
                        beams.push(createBeam(allLefts[allLefts.length - 1], ln));
                        beams.push(createBeam(allRights[allRights.length - 1], rn));
                        beams.push(createBeam(allLefts[allLefts.length - 1], rn));
                        beams.push(createBeam(allRights[allRights.length - 1], ln));
                        beams.push(createBeam(ln, rn));
                        allLefts.push(ln);
                        allRights.push(rn);
                    }
                    beams.push(createBeam(allLefts[allLefts.length - 1], topN));
                    beams.push(createBeam(allRights[allRights.length - 1], topN));
                    beams.push(createBeam(allLefts[allLefts.length - 1], allRights[allRights.length - 1]));
                    pointLoads.push(createPointLoad(topN, windMag > 0 ? 300 * windDir : 0, 200));
                } else if (name === 'house') {
                    const w = 300;
                    const h = 180;
                    const x0 = cx - w / 2;
                    const y0 = gy - 10;
                    const nBL = createNode(x0, y0);
                    const nBR = createNode(x0 + w, y0);
                    const nTL = createNode(x0, y0 - h);
                    const nTR = createNode(x0 + w, y0 - h);
                    const nPeak = createNode(cx, y0 - h - 80);
                    nodes.push(nBL, nBR, nTL, nTR, nPeak);
                    nBL.supportType = 'fixed';
                    nBL.fixed = true;
                    nBL.origX = nBL.x;
                    nBL.origY = nBL.y;
                    nBR.supportType = 'fixed';
                    nBR.fixed = true;
                    nBR.origX = nBR.x;
                    nBR.origY = nBR.y;
                    beams.push(createBeam(nBL, nTL));
                    beams.push(createBeam(nBR, nTR));
                    beams.push(createBeam(nTL, nTR));
                    beams.push(createBeam(nTL, nPeak));
                    beams.push(createBeam(nTR, nPeak));
                    beams.push(createBeam(nBL, nBR));
                    distLoads.push(createDistLoad(beams[beams.length - 2], 4));
                    distLoads.push(createDistLoad(beams[beams.length - 3], 4));
                } else if (name === 'crane') {
                    const baseX = cx - 200;
                    const baseY = gy - 10;
                    const towerH = 200;
                    const boomLen = 280;
                    const nBase = createNode(baseX, baseY);
                    const nTop = createNode(baseX, baseY - towerH);
                    const nBoomTip = createNode(baseX + boomLen, baseY - towerH + 20);
                    const nCounter = createNode(baseX - 60, baseY - towerH + 30);
                    const nTie = createNode(baseX + boomLen * 0.55, baseY - towerH - 70);
                    nodes.push(nBase, nTop, nBoomTip, nCounter, nTie);
                    nBase.supportType = 'fixed';
                    nBase.fixed = true;
                    nBase.origX = nBase.x;
                    nBase.origY = nBase.y;
                    beams.push(createBeam(nBase, nTop));
                    beams.push(createBeam(nTop, nBoomTip));
                    beams.push(createBeam(nTop, nCounter));
                    beams.push(createBeam(nTop, nTie));
                    beams.push(createBeam(nTie, nBoomTip));
                    beams.push(createBeam(nTie, nCounter));
                    pointLoads.push(createPointLoad(nBoomTip, 0, 600));
                }
                updateAnalysis();
            }

            // --- EVENT HANDLERS ---
            canvas.addEventListener('mousedown', (e) => {
                const pos = getMousePos(e);
                mouseDown = true;
                const nearNode = findClosestNode(pos);
                const nearBeam = findClosestBeam(pos);

                if (currentTool === 'select') {
                    if (nearNode) {
                        selectedNode = nearNode;
                        selectedBeam = null;
                        dragNode = nearNode;
                        isDragging = true;
                    } else if (nearBeam) {
                        selectedBeam = nearBeam;
                        selectedNode = null;
                    } else {
                        selectedNode = null;
                        selectedBeam = null;
                    }
                } else if (currentTool === 'node') {
                    const n = addNode(pos.x, pos.y);
                    selectedNode = n;
                } else if (currentTool === 'beam') {
                    if (nearNode) {
                        if (beamStartNode === null) {
                            beamStartNode = nearNode;
                            selectedNode = nearNode;
                        } else if (nearNode !== beamStartNode) {
                            addBeam(beamStartNode, nearNode);
                            beamStartNode = null;
                        }
                    } else {
                        beamStartNode = null;
                    }
                } else if (currentTool === 'support') {
                    if (nearNode) {
                        cycleSupport(nearNode);
                        selectedNode = nearNode;
                    }
                } else if (currentTool === 'force') {
                    if (nearNode) {
                        forceDragNode = nearNode;
                        forceDragStart = pos;
                        forceDragCurrent = pos;
                        selectedNode = nearNode;
                    }
                } else if (currentTool === 'distload') {
                    if (nearBeam) {
                        const existing = distLoads.find(dl => dl.beam === nearBeam);
                        if (existing) {
                            existing.intensity += 5;
                        } else {
                            distLoads.push(createDistLoad(nearBeam, 10));
                        }
                        selectedBeam = nearBeam;
                    }
                } else if (currentTool === 'delete') {
                    if (nearNode) {
                        deleteNode(nearNode);
                    } else if (nearBeam) {
                        deleteBeam(nearBeam);
                    }
                }
                updateAnalysis();
            });

            canvas.addEventListener('mousemove', (e) => {
                const pos = getMousePos(e);
                mouseX = pos.x;
                mouseY = pos.y;
                hoveredNode = findClosestNode(pos);
                hoveredBeam = findClosestBeam(pos);

                if (isDragging && dragNode && currentTool === 'select') {
                    if (!dragNode.fixed && dragNode.supportType === 'none') {
                        dragNode.x = pos.x;
                        dragNode.y = pos.y;
                        dragNode.origX = pos.x;
                        dragNode.origY = pos.y;
                        dragNode.vx = 0;
                        dragNode.vy = 0;
                    }
                }
                if (forceDragNode && currentTool === 'force') {
                    forceDragCurrent = pos;
                }
                const wrapEl = wrap;
                if (currentTool === 'node') {
                    wrapEl.style.cursor = 'crosshair';
                } else if (currentTool === 'delete') {
                    wrapEl.style.cursor = (hoveredNode || hoveredBeam) ? 'pointer' : 'not-allowed';
                } else if (currentTool === 'beam' && beamStartNode && hoveredNode && hoveredNode !== beamStartNode) {
                    wrapEl.style.cursor = 'pointer';
                } else {
                    wrapEl.style.cursor = (hoveredNode || hoveredBeam) ? 'pointer' : 'default';
                }
            });

            canvas.addEventListener('mouseup', (e) => {
                const pos = getMousePos(e);
                if (forceDragNode && forceDragStart && currentTool === 'force') {
                    const fx = pos.x - forceDragStart.x;
                    const fy = pos.y - forceDragStart.y;
                    const mag = Math.sqrt(fx * fx + fy * fy);
                    if (mag > 8) {
                        const existing = pointLoads.findIndex(pl => pl.node === forceDragNode);
                        if (existing >= 0) pointLoads.splice(existing, 1);
                        pointLoads.push(createPointLoad(forceDragNode, fx, fy));
                    }
                }
                forceDragNode = null;
                forceDragStart = null;
                forceDragCurrent = null;
                isDragging = false;
                dragNode = null;
                mouseDown = false;
                updateAnalysis();
            });

            canvas.addEventListener('mouseleave', () => {
                hoveredNode = null;
                hoveredBeam = null;
                isDragging = false;
                dragNode = null;
                forceDragNode = null;
                forceDragStart = null;
                forceDragCurrent = null;
                mouseDown = false;
            });

            // Touch events
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const pos = { x: touch.clientX - canvas.getBoundingClientRect().left, y: touch.clientY - canvas
                            .getBoundingClientRect().top };
                    mouseX = pos.x;
                    mouseY = pos.y;
                    mouseDown = true;
                    const nearNode = findClosestNode(pos, 24);
                    if (currentTool === 'select' && nearNode) {
                        selectedNode = nearNode;
                        dragNode = nearNode;
                        isDragging = true;
                    } else if (currentTool === 'node') {
                        addNode(pos.x, pos.y);
                    } else if (currentTool === 'beam' && nearNode) {
                        if (beamStartNode === null) beamStartNode = nearNode;
                        else if (nearNode !== beamStartNode) { addBeam(beamStartNode, nearNode);
                            beamStartNode = null; }
                    } else if (currentTool === 'support' && nearNode) {
                        cycleSupport(nearNode);
                    } else if (currentTool === 'delete' && nearNode) {
                        deleteNode(nearNode);
                    }
                    updateAnalysis();
                }
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const pos = { x: touch.clientX - canvas.getBoundingClientRect().left, y: touch.clientY - canvas
                            .getBoundingClientRect().top };
                    mouseX = pos.x;
                    mouseY = pos.y;
                    if (isDragging && dragNode && !dragNode.fixed && dragNode.supportType === 'none') {
                        dragNode.x = pos.x;
                        dragNode.y = pos.y;
                        dragNode.origX = pos.x;
                        dragNode.origY = pos.y;
                        dragNode.vx = 0;
                        dragNode.vy = 0;
                    }
                }
                e.preventDefault();
            }, { passive: false });

            canvas.addEventListener('touchend', () => {
                isDragging = false;
                dragNode = null;
                mouseDown = false;
                updateAnalysis();
            });

            // Keyboard
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (selectedNode) deleteNode(selectedNode);
                    else if (selectedBeam) deleteBeam(selectedBeam);
                    updateAnalysis();
                }
                if (e.key === 'Escape') {
                    beamStartNode = null;
                    forceDragNode = null;
                    forceDragStart = null;
                    forceDragCurrent = null;
                    selectedNode = null;
                    selectedBeam = null;
                    updateAnalysis();
                }
                if (e.key === ' ' && !e.target.closest('input')) {
                    e.preventDefault();
                    simRunning = !simRunning;
                    updatePlayButton();
                }
            });

            // --- UI BUTTONS ---
            function updatePlayButton() {
                const btn = document.getElementById('btnPlay');
                if (simRunning) {
                    btn.textContent = '⏸ Pause';
                    btn.classList.add('play');
                    btn.classList.remove('paused');
                } else {
                    btn.textContent = '▶ Run';
                    btn.classList.add('paused');
                    btn.classList.remove('play');
                }
            }

            document.getElementById('btnPlay').addEventListener('click', () => {
                simRunning = !simRunning;
                updatePlayButton();
            });
            document.getElementById('btnStep').addEventListener('click', () => {
                solvePhysics(0.016);
                updateAnalysis();
            });
            document.getElementById('btnReset').addEventListener('click', resetDeformation);

            document.getElementById('btnPresetBridge').addEventListener('click', () => loadPreset('bridge'));
            document.getElementById('btnPresetTower').addEventListener('click', () => loadPreset('tower'));
            document.getElementById('btnPresetHouse').addEventListener('click', () => loadPreset('house'));
            document.getElementById('btnPresetCrane').addEventListener('click', () => loadPreset('crane'));

            document.getElementById('btnRain').addEventListener('click', function() {
                rainOn = !rainOn;
                this.textContent = rainOn ? '🌧 Rain ON' : '🌧 Rain OFF';
                if (rainOn) this.style.background = '#1b3a5c';
                else this.style.background = '';
            });
            document.getElementById('btnWindDir').addEventListener('click', function() {
                windDir *= -1;
                this.textContent = windDir > 0 ? '💨 →' : '💨 ←';
            });

            // Tool buttons
            const toolBtns = document.querySelectorAll('.tool-btn');
            toolBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    currentTool = this.dataset.tool;
                    toolBtns.forEach(b => b.classList.remove('sel'));
                    this.classList.add('sel');
                    beamStartNode = null;
                    forceDragNode = null;
                    forceDragStart = null;
                    forceDragCurrent = null;
                    if (currentTool !== 'select') { selectedNode = null;
                        selectedBeam = null; }
                    document.getElementById('overlayInfo').textContent =
                        currentTool === 'node' ? 'Click canvas to place nodes' :
                        currentTool === 'beam' ? 'Click first node, then second node to create beam' :
                        currentTool === 'support' ? 'Click a node to cycle support type' :
                        currentTool === 'force' ? 'Click & drag from a node to apply force' :
                        currentTool === 'distload' ? 'Click a beam to add distributed load' :
                        currentTool === 'delete' ? 'Click nodes or beams to delete' :
                        'Click to select • Drag nodes to move • Del to remove';
                });
            });

            // Sliders
            function bindSlider(id, valId, callback, format) {
                const slider = document.getElementById(id);
                const valEl = document.getElementById(valId);
                slider.addEventListener('input', () => {
                    const v = parseFloat(slider.value);
                    valEl.textContent = format ? format(v) : v;
                    callback(v);
                    updateAnalysis();
                });
            }
            bindSlider('speedSlider', 'speedVal', v => { simSpeed = v; }, v => v.toFixed(1) + '×');
            bindSlider('gravSlider', 'gravVal', v => { gravityMag = v; });
            bindSlider('windSlider', 'windVal', v => { windMag = v; });
            bindSlider('stiffSlider', 'stiffVal', v => { stiffness = v; }, v => (v / 1000).toFixed(0) + 'k');
            bindSlider('yieldSlider', 'yieldVal', v => { yieldStress = v;
                ultimateStress = v * 1.5; });

            // --- MAIN LOOP ---
            let lastTime = performance.now();
            let physicsAccum = 0;
            const fixedDt = 0.016;

            function loop(time) {
                requestAnimationFrame(loop);
                let dt = (time - lastTime) / 1000;
                lastTime = time;
                if (dt > 0.1) dt = 0.1;
                if (dt <= 0) dt = 0.016;

                if (simRunning) {
                    const simDt = dt * simSpeed;
                    physicsAccum += simDt;
                    let steps = 0;
                    while (physicsAccum >= fixedDt && steps < 6) {
                        physicsAccum -= fixedDt;
                        solvePhysics(fixedDt);
                        steps++;
                    }
                    if (physicsAccum > 0 && steps === 0) {
                        solvePhysics(physicsAccum);
                        physicsAccum = 0;
                    }
                }

                updateRain(dt);
                updateBreakParticles(dt);

                if (simRunning && Math.floor(time / 300) !== Math.floor((time - dt * 1000) / 300)) {
                    updateAnalysis();
                }

                resize();
                render();
            }

            function init() {
                updatePlayButton();
                loadPreset('bridge');
                updateAnalysis();
                requestAnimationFrame(loop);
            }

            init();
            console.log('🏗 StructuralSim Pro ready — Build, test, and analyze structures!');
            console.log('Tools: Select | Node | Beam | Support | Force | Dist.Load | Delete');
            console.log('Presets: Bridge | Tower | House | Crane');
            console.log('Controls: Space=Play/Pause | Del=Remove | Esc=Deselect');
            console.log('Try: Load Bridge preset → Increase wind → Watch stress colors → Push to failure!');
        })();
    </script>
</body>
</html>
