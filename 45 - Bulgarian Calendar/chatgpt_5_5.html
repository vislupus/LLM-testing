<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Български работен календар</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel-2:#f9fafc; --text:#172033; --muted:#657084;
    --border:#e0e5ef; --border-2:#cdd5e4; --brand:#2e66f7; --brand-2:#edf3ff;
    --danger:#d94141; --ok:#168a51; --warning:#a86b00; --holiday:#ffe8e8; --weekend:#f3f5f9;
    --work:#f3fbf6; --shadow:0 18px 50px rgba(26,37,61,.12); --radius:18px;
    --hour-height:54px; --slot-min:15; --header-h:74px;
  }
  [data-theme="dark"]{
    --bg:#0f1524; --panel:#161e2f; --panel-2:#111827; --text:#eef2ff; --muted:#a9b4cb;
    --border:#28344d; --border-2:#3c4a66; --brand:#78a0ff; --brand-2:#1d2b4c;
    --danger:#ff7777; --ok:#54d28d; --warning:#ffc266; --holiday:#3a2328; --weekend:#151c2a;
    --work:#13231c; --shadow:0 18px 50px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:linear-gradient(135deg,var(--bg),var(--panel-2));color:var(--text);font-family:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;font-size:14px}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  .app{min-height:100%;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.84);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);padding:12px 16px}
  [data-theme="dark"] .topbar{background:rgba(15,21,36,.86)}
  .toprow{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;min-width:240px}
  .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2e66f7,#7d5cff);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 10px 26px rgba(46,102,247,.35)}
  .brand h1{font-size:18px;margin:0;line-height:1.1}.brand small{color:var(--muted);display:block;margin-top:2px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn,.seg button{border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:9px 12px;min-height:38px;transition:.18s ease;box-shadow:0 2px 8px rgba(22,32,51,.03)}
  .btn:hover,.seg button:hover{border-color:var(--border-2);transform:translateY(-1px)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:white}.btn.danger{color:white;background:var(--danger);border-color:var(--danger)}
  .btn.ghost{background:transparent}.btn.icon{width:38px;padding:8px}.btn.small{padding:6px 8px;min-height:30px;border-radius:9px;font-size:12px}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:3px;gap:2px}.seg button{box-shadow:none;border:0;background:transparent;padding:7px 10px}.seg button.active{background:var(--panel);box-shadow:0 2px 8px rgba(22,32,51,.08);color:var(--brand)}
  .search{position:relative}.search input{width:min(330px,64vw);border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:9px 34px 9px 12px;outline:none}.search span{position:absolute;right:10px;top:9px;color:var(--muted)}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:16px;max-width:1800px;width:100%;margin:0 auto;flex:1}.main.sidebar-collapsed{grid-template-columns:minmax(0,1fr)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.view-card{min-height:720px;display:flex;flex-direction:column}.view-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.view-title h2{margin:0;font-size:24px}.view-title p{margin:4px 0 0;color:var(--muted)}
  .legend{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--border);font-size:12px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:99px;background:var(--brand)}
  .view-body{flex:1;min-height:0;overflow:auto}.calendar-grid{height:100%}
  .weekday-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--panel-2)}.weekday-row div{padding:9px 10px;font-weight:650;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.weekday-row .wkno{color:var(--brand)}
  .month-grid{display:grid;grid-template-columns:repeat(7,1fr);auto-rows:minmax(116px,1fr)}.day-cell{position:relative;min-height:116px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px;background:var(--panel);transition:.16s}.day-cell:nth-child(7n){border-right:0}.day-cell:hover{background:var(--brand-2)}.day-cell.out{background:var(--panel-2);color:var(--muted)}.day-cell.weekend{background:var(--weekend)}.day-cell.holiday{background:linear-gradient(0deg,var(--holiday),var(--panel))}.day-cell.today{outline:2px solid var(--brand);outline-offset:-2px}.day-num{display:flex;align-items:center;justify-content:space-between;gap:4px;font-weight:700}.day-num .num{min-width:26px;height:26px;border-radius:50%;display:grid;place-items:center}.today .day-num .num{background:var(--brand);color:white}.iso-mini{font-size:11px;color:var(--muted);font-weight:600}.holiday-name{font-size:11px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.event-stack{display:flex;flex-direction:column;gap:3px;margin-top:6px}.event-pill{position:relative;display:block;border-radius:8px;padding:4px 6px;color:#fff;font-size:12px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 8px rgba(0,0,0,.12);user-select:none}.event-pill.conflict{outline:2px solid var(--danger)}.more{font-size:12px;color:var(--muted);padding:2px 4px}.all-day-pill{border-radius:8px;padding:4px 7px;background:var(--brand-2);border:1px solid var(--border);font-size:12px;margin:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
  .year-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;padding:16px}.mini-month{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel)}.mini-title{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel-2);font-weight:800}.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);padding:8px;gap:3px}.mini-grid div{height:27px;border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--muted)}.mini-grid .wd{height:auto;font-weight:800;font-size:10px;color:var(--muted);text-transform:uppercase}.mini-grid .day{cursor:pointer;color:var(--text)}.mini-grid .day:hover{background:var(--brand-2)}.mini-grid .today{background:var(--brand);color:white}.mini-grid .holiday{background:var(--holiday);color:var(--danger)}.mini-grid .has-events::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--brand);align-self:end;margin-bottom:2px}.mini-grid .weekend{background:var(--weekend)}
  .time-view{min-width:760px}.week-header,.day-header{display:grid;border-bottom:1px solid var(--border);background:var(--panel-2);position:sticky;top:0;z-index:8}.week-header{grid-template-columns:68px repeat(7,1fr)}.day-header{grid-template-columns:68px 1fr}.head-cell{padding:10px;border-left:1px solid var(--border);min-height:60px}.head-cell:first-child{border-left:0}.head-date{font-weight:800}.head-date.today{color:var(--brand)}.head-holiday{font-size:11px;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.all-day-row{display:grid;grid-template-columns:68px repeat(7,1fr);border-bottom:1px solid var(--border);background:var(--panel);min-height:42px}.day-mode .all-day-row{grid-template-columns:68px 1fr}.all-day-label{padding:9px;color:var(--muted);font-size:12px;background:var(--panel-2);border-right:1px solid var(--border)}.all-day-lane{padding:6px;border-right:1px solid var(--border);min-height:42px}.time-grid{display:grid;grid-template-columns:68px repeat(7,1fr);position:relative}.day-mode .time-grid{grid-template-columns:68px 1fr}.hour-labels{display:grid;grid-template-rows:repeat(24,var(--hour-height));background:var(--panel-2);border-right:1px solid var(--border)}.hour-label{height:var(--hour-height);padding:3px 8px;color:var(--muted);font-size:11px;text-align:right;border-bottom:1px solid var(--border)}.time-col{position:relative;min-height:calc(24 * var(--hour-height));border-right:1px solid var(--border);background:linear-gradient(to bottom,transparent calc(var(--hour-height) - 1px),var(--border) calc(var(--hour-height) - 1px),var(--border) var(--hour-height));background-size:100% var(--hour-height)}.time-col.weekend{background-color:var(--weekend)}.time-col.holiday{background-color:var(--holiday)}.work-band{position:absolute;left:0;right:0;background:var(--work);border-top:1px solid rgba(22,138,81,.16);border-bottom:1px solid rgba(22,138,81,.16);pointer-events:none}.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:5}.time-event{position:absolute;border-radius:10px;color:white;padding:5px 7px;box-shadow:0 8px 16px rgba(0,0,0,.18);overflow:hidden;min-height:18px;border:1px solid rgba(255,255,255,.35);user-select:none}.time-event .t{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time-event .m{font-size:11px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time-event.conflict{box-shadow:0 0 0 2px var(--danger),0 8px 16px rgba(0,0,0,.18)}.resize-handle{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.18))}.drop-target{outline:2px dashed var(--brand);outline-offset:-4px}
  .side{display:flex;flex-direction:column;gap:16px}.side.hidden{display:none}.side .card{box-shadow:0 12px 34px rgba(26,37,61,.09)}.side-section{padding:14px}.side-section h3{margin:0 0 10px;font-size:15px}.agenda-list,.holiday-list,.conflict-list,.search-list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--border);border-radius:12px;background:var(--panel-2);padding:9px}.item-title{font-weight:750}.item-meta{color:var(--muted);font-size:12px;margin-top:3px}.item.bad{border-color:rgba(217,65,65,.4);background:var(--holiday)}.item.good{border-color:rgba(22,138,81,.35);background:var(--work)}.calc-grid{display:grid;gap:8px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:10px;background:var(--panel);padding:8px;outline:none;min-width:0}.field textarea{resize:vertical;min-height:74px}.help{color:var(--muted);font-size:12px;line-height:1.45}.calc-result{padding:10px;border-radius:12px;background:var(--brand-2);font-weight:800}.category-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}.category-row input[type=color]{width:34px;height:32px;padding:0;border:0;background:transparent}.category-row input[type=text]{flex:1}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,15,25,.52);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(720px,96vw);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 80px rgba(0,0,0,.32)}.modal-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{margin:0;font-size:19px}.modal-body{padding:16px 18px;display:grid;gap:12px}.modal-actions{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}.radio-line{display:flex;gap:12px;flex-wrap:wrap}.inline{display:flex;gap:8px;align-items:center}.hidden{display:none!important}.toast{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast div{background:var(--text);color:var(--panel);padding:10px 12px;border-radius:12px;box-shadow:var(--shadow)}
  @media (max-width:1100px){.main{grid-template-columns:1fr}.side{order:-1}.year-grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:720px){.topbar{padding:10px}.brand{min-width:auto}.main{padding:10px}.view-card{min-height:620px}.month-grid{auto-rows:minmax(94px,1fr)}.day-cell{min-height:94px;padding:6px}.year-grid{grid-template-columns:1fr;padding:10px}.form-row{grid-template-columns:1fr}.toolbar{width:100%}.search input{width:100%}.search{flex:1}.view-title h2{font-size:20px}}
  @media print{.topbar,.side,.modal-backdrop,.toast{display:none}.main{display:block;padding:0}.card{box-shadow:none;border:0}.view-body{overflow:visible}.day-cell,.mini-month{break-inside:avoid}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">
        <div class="logo">BG</div>
        <div><h1>Български работен календар</h1><small>Europe/Sofia · понеделник първи · локално съхранение</small></div>
      </div>
      <div class="toolbar">
        <button class="btn icon" id="prevBtn" title="Назад">‹</button>
        <button class="btn" id="todayBtn">Днес</button>
        <button class="btn icon" id="nextBtn" title="Напред">›</button>
        <div class="seg" id="viewSeg">
          <button data-view="year">Година</button><button data-view="month" class="active">Месец</button><button data-view="week">Седмица</button><button data-view="day">Ден</button>
        </div>
        <button class="btn primary" id="newBtn">+ Събитие</button>
        <button class="btn" id="exportBtn">Експорт</button>
        <label class="btn" for="importFile">Импорт</label><input id="importFile" type="file" accept="application/json" hidden>
        <button class="btn ghost" id="themeBtn">☾</button>
        <button class="btn ghost" id="sideBtn">☰</button>
      </div>
      <div class="search"><input id="searchInput" placeholder="Търсене: събития, категории, бележки…" autocomplete="off"><span>⌕</span></div>
    </div>
  </header>
  <main class="main" id="main">
    <section class="card view-card">
      <div class="view-head">
        <div class="view-title"><h2 id="periodTitle"></h2><p id="periodSub"></p></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="view-body" id="viewBody"></div>
    </section>
    <aside class="side" id="side">
      <div class="card"><div class="side-section"><h3>Дневен ред</h3><div class="agenda-list" id="agendaList"></div></div></div>
      <div class="card"><div class="side-section"><h3>Празници в периода</h3><div class="holiday-list" id="holidayList"></div></div></div>
      <div class="card"><div class="side-section"><h3>Конфликти</h3><div class="conflict-list" id="conflictList"></div></div></div>
      <div class="card"><div class="side-section"><h3>Калкулатор работни дни</h3><div class="calc-grid">
        <div class="field"><label>Начална дата</label><input type="date" id="calcStart"></div>
        <div class="form-row"><div class="field"><label>Операция</label><select id="calcMode"><option value="add">Добавяне</option><option value="count">Броене</option></select></div><div class="field"><label id="calcNumberLabel">Работни дни</label><input type="number" id="calcDays" value="10" min="0"></div></div>
        <div class="field" id="calcEndWrap"><label>Крайна дата</label><input type="date" id="calcEnd"></div>
        <label class="inline help"><input type="checkbox" id="calcIncludeStart"> Брой началната дата, ако е работна</label>
        <label class="inline help"><input type="checkbox" id="calcSchool" checked> 1 ноември да е само учебен празник</label>
        <button class="btn" id="calcBtn">Изчисли</button><div class="calc-result" id="calcResult">—</div>
      </div></div></div>
      <div class="card"><div class="side-section"><h3>Категории</h3><div id="categoryEditor"></div><button class="btn small" id="addCatBtn">+ Категория</button></div></div>
    </aside>
  </main>
</div>

<div class="modal-backdrop" id="eventModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
    <div class="modal-head"><h2 id="eventModalTitle">Събитие</h2><button class="btn icon" id="closeModal">×</button></div>
    <div class="modal-body">
      <input type="hidden" id="eventId"><input type="hidden" id="occKey"><input type="hidden" id="masterId">
      <div class="field"><label>Заглавие</label><input id="titleInput" placeholder="Напр. Среща с екипа"></div>
      <div class="form-row"><div class="field"><label>Категория</label><select id="categoryInput"></select></div><div class="field"><label>Място</label><input id="locationInput" placeholder="Офис / онлайн"></div></div>
      <label class="inline"><input type="checkbox" id="allDayInput"> Цял ден</label>
      <div class="form-row"><div class="field"><label>Начална дата</label><input type="date" id="startDateInput"></div><div class="field"><label>Крайна дата</label><input type="date" id="endDateInput"></div></div>
      <div class="form-row" id="timeRow"><div class="field"><label>Начален час</label><input type="time" id="startTimeInput" step="900"></div><div class="field"><label>Краен час</label><input type="time" id="endTimeInput" step="900"></div></div>
      <div class="form-row" id="repeatRow"><div class="field"><label>Повторение</label><select id="repeatFreq"><option value="none">Без повторение</option><option value="daily">Ежедневно</option><option value="weekly">Седмично</option><option value="monthly">Месечно</option></select></div><div class="field"><label>На всеки</label><input type="number" id="repeatInterval" min="1" value="1"></div></div>
      <div class="form-row" id="repeatUntilRow"><div class="field"><label>До дата (по избор)</label><input type="date" id="repeatUntil"></div><div class="field"><label>Редактиране</label><select id="editScope"><option value="single">Само това появяване</option><option value="series">Цялата серия</option></select></div></div>
      <div class="field"><label>Бележки</label><textarea id="notesInput" placeholder="Бележки, дневен ред, линкове…"></textarea></div>
      <div id="modalConflicts" class="help"></div>
    </div>
    <div class="modal-actions"><div><button class="btn danger" id="deleteBtn">Изтрий</button></div><div><button class="btn" id="duplicateBtn">Дублирай</button><button class="btn" id="cancelBtn">Отказ</button><button class="btn primary" id="saveBtn">Запази</button></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(()=>{
'use strict';
const TZ='Europe/Sofia';
const STORE_KEY='bg-work-calendar-v1';
const DAY=86400000;
const BG_MONTHS=['януари','февруари','март','април','май','юни','юли','август','септември','октомври','ноември','декември'];
const BG_MONTHS_SHORT=['ян','фев','мар','апр','май','юни','юли','авг','сеп','окт','ное','дек'];
const BG_WEEK=['понеделник','вторник','сряда','четвъртък','петък','събота','неделя'];
const BG_WEEK_SHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const DEFAULT_CATEGORIES=[
  {id:'work',name:'Работа',color:'#2e66f7'}, {id:'personal',name:'Лично',color:'#7d5cff'},
  {id:'deadline',name:'Срок',color:'#d94141'}, {id:'travel',name:'Пътуване',color:'#168a51'},
  {id:'holiday',name:'Празник',color:'#a86b00'}
];
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.() || 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
let state=loadState();
let view=state.ui.view||'month';
let cursor=state.ui.cursor||todayYMD();
let searchText='';
let drag=null;

function loadState(){
  let d={events:[],categories:DEFAULT_CATEGORIES,settings:{workStart:'09:00',workEnd:'18:00',theme:'light'},ui:{view:'month',cursor:todayYMD()}};
  try{const raw=localStorage.getItem(STORE_KEY); if(raw){d={...d,...JSON.parse(raw)};}}
  catch(e){console.warn(e)}
  d.categories=d.categories?.length?d.categories:DEFAULT_CATEGORIES;
  d.settings={...{workStart:'09:00',workEnd:'18:00',theme:'light'},...(d.settings||{})};
  d.ui={...{view:'month',cursor:todayYMD()},...(d.ui||{})};
  return d;
}
function saveState(){ state.ui={view,cursor}; localStorage.setItem(STORE_KEY,JSON.stringify(state)); }
function toast(msg){const t=document.createElement('div');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),3200)}

function parseYMD(s){const [y,m,d]=s.split('-').map(Number);return {y,m,d};}
function ymd(y,m,d){return `${y}-${pad(m)}-${pad(d)}`;}
function dateFromInput(v){return v||todayYMD();}
function gregToJdn(y,m,d){let a=Math.floor((14-m)/12);y=y+4800-a;m=m+12*a-3;return d+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;}

    for(const e of g){const c=category(e.categoryId);const s=partsInTZ(Math.max(eventStartEpoch(e),sofiaEpoch(date,'00:00')));const en=partsInTZ(Math.min(eventEndEpoch(e),sofiaEpoch(addDays(date,1),'00:00')));let top=(s.h*60+s.min)/60*54;let bottom=(en.h*60+en.min)/60*54;if(eventEndEpoch(e)>=sofiaEpoch(addDays(date,1),'00:00'))bottom=24*54;let height=Math.max(20,bottom-top);let width=100/e._cols;let left=e._col*width;
      html+=`<div class="time-event ${hasConflict(e,events)?'conflict':''}" draggable="true" data-event="${e.id}" data-occ="${esc(e.occurrenceKey||'')}" style="top:${top}px;height:${height}px;left:calc(${left}% + 3px);width:calc(${width}% - 6px);background:${esc(c.color)}" title="${esc(eventLabel(e))}"><div class="t">${esc(e.title)}</div><div class="m">${esc(e.startTime)}–${esc(e.endTime)} ${esc(c.name)}</div><div class="resize-handle"></div></div>`;
    }
  }
  return html;
}
function eventShort(e,date){let prefix=e.allDay?'':`${e.startTime} `; if(e.startDate!==e.endDate)prefix+='↔ '; return prefix+e.title;}
function eventLabel(e){return `${e.title}\n${e.allDay?'Цял ден':e.startTime+'–'+e.endTime}\n${formatDate(e.startDate)}${e.endDate!==e.startDate?' – '+formatDate(e.endDate):''}\n${category(e.categoryId).name}`}
function bindMonthInteractions(){
  $$('.day-cell').forEach(cell=>{cell.ondblclick=e=>{if(e.target.closest('[data-event]'))return;openNew(cell.dataset.date)};cell.ondragover=e=>{e.preventDefault();cell.classList.add('drop-target')};cell.ondragleave=()=>cell.classList.remove('drop-target');cell.ondrop=e=>{e.preventDefault();cell.classList.remove('drop-target');moveDraggedToDate(cell.dataset.date)}});
  $$('[data-event]').forEach(el=>{el.onclick=e=>{e.stopPropagation();openExisting(el.dataset.event,el.dataset.occ)};el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.event+'|'+(el.dataset.occ||''));drag={id:el.dataset.event,occ:el.dataset.occ||''}}});
}
function bindTimeInteractions(){
  $$('.time-col').forEach(col=>{col.ondblclick=e=>{if(e.target.closest('[data-event]'))return;const rect=col.getBoundingClientRect();const y=e.clientY-rect.top+col.scrollTop;const mins=Math.round((y/54*60)/15)*15;openNew(col.dataset.date,timeFromMin(mins),timeFromMin(mins+60))};col.ondragover=e=>{e.preventDefault();col.classList.add('drop-target')};col.ondragleave=()=>col.classList.remove('drop-target');col.ondrop=e=>{e.preventDefault();col.classList.remove('drop-target');const rect=col.getBoundingClientRect();const mins=Math.round(((e.clientY-rect.top+col.scrollTop)/54*60)/15)*15;moveDraggedToDate(col.dataset.date,timeFromMin(mins))}});
  $$('.all-day-lane').forEach(l=>{l.ondblclick=e=>{if(!e.target.closest('[data-event]'))openNew(l.dataset.date,null,null,true)};l.ondragover=e=>e.preventDefault();l.ondrop=e=>{e.preventDefault();moveDraggedToDate(l.dataset.date,null,true)}});
  $$('[data-event]').forEach(el=>{el.onclick=e=>{if(e.target.classList.contains('resize-handle'))return;e.stopPropagation();openExisting(el.dataset.event,el.dataset.occ)};el.ondragstart=e=>{drag={id:el.dataset.event,occ:el.dataset.occ||''};e.dataTransfer.setData('text/plain',drag.id+'|'+drag.occ)};
    const handle=el.querySelector('.resize-handle'); if(handle){handle.onpointerdown=e=>startResize(e,el)} });
}
function startResize(ev,el){ev.preventDefault();ev.stopPropagation();const id=el.dataset.event,occ=el.dataset.occ||'';const inst=findInstance(id,occ);if(!inst||inst.allDay)return;const startY=ev.clientY,origEnd=minutesOf(inst.endTime);function move(e){let delta=Math.round(((e.clientY-startY)/54*60)/15)*15;let newMin=Math.max(minutesOf(inst.startTime)+15,origEnd+delta);el.style.height=Math.max(20,(newMin-minutesOf(inst.startTime))/60*54)+'px';el.dataset.newEnd=timeFromMin(newMin)}function up(){document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);if(el.dataset.newEnd)updateMovedOrResized(inst,{endTime:el.dataset.newEnd,endDate:inst.startDate})}document.addEventListener('pointermove',move);document.addEventListener('pointerup',up)}
function moveDraggedToDate(date,time=null,allDay=null){if(!drag)return;const inst=findInstance(drag.id,drag.occ);if(!inst)return;const dayShift=diffDays(inst.startDate,date),durDays=diffDays(inst.startDate,inst.endDate);let changes={startDate:date,endDate:addDays(date,durDays)};if(allDay!==null)changes.allDay=allDay;if(time){let dur=minutesOf(inst.endTime)-minutesOf(inst.startTime);if(dur<=0)dur=60;changes.startTime=time;changes.endTime=timeFromMin(minutesOf(time)+dur)}updateMovedOrResized(inst,changes);drag=null;}
function updateMovedOrResized(inst,changes){
  const master=state.events.find(e=>e.id===inst.id); if(!master)return;
  if(master.recurrence && inst.occurrenceKey){const series=confirm('OK: промяна само на това появяване. Отказ: промяна на цялата серия.'); if(series){master.exceptions=master.exceptions||{};master.exceptions[inst.occurrenceKey]=makeOverride(master,inst,{...inst,...changes}).override?makeOverride(master,inst,{...inst,...changes}):null;} else Object.assign(master,changes);}
  else Object.assign(master,changes); saveState();render();toast('Събитието е преместено/преоразмерено.');
}
function findInstance(id,occ=''){const r=displayRange();return expandEvents(addDays(r.start,-370),addDays(r.end,370)).find(e=>e.id===id && ((e.occurrenceKey||'')===occ || !occ));}
function renderSide(r,events,confs){
  const agenda=events.slice(0,18).map(e=>`<div class="item" data-side-event="${e.id}" data-occ="${esc(e.occurrenceKey||'')}"><div class="item-title">${esc(e.title)}</div><div class="item-meta">${e.allDay?'Цял ден':e.startTime+'–'+e.endTime} · ${formatDate(e.startDate)}${e.endDate!==e.startDate?'–'+formatDate(e.endDate):''} · ${esc(category(e.categoryId).name)}</div></div>`).join('')||'<div class="help">Няма събития в периода.</div>';
  $('#agendaList').innerHTML=agenda; $$('[data-side-event]').forEach(el=>el.onclick=()=>openExisting(el.dataset.sideEvent,el.dataset.occ));
  let hs=[]; for(let d=r.start;d<=r.end;d=addDays(d,1)) hs.push(...holidayOn(d));
  $('#holidayList').innerHTML=hs.length?hs.map(h=>`<div class="item ${h.nonWorking?'bad':'good'}"><div class="item-title">${formatDate(h.date)} · ${esc(h.name)}</div><div class="item-meta">${esc(h.type)}${h.nonWorking?' · неприсъствен':' · информационен'}</div></div>`).join(''):'<div class="help">Няма празници в периода.</div>';
  $('#conflictList').innerHTML=confs.length?confs.slice(0,12).map(([a,b])=>`<div class="item bad"><div class="item-title">${esc(a.title)} ↔ ${esc(b.title)}</div><div class="item-meta">${formatDate(a.startDate)} · ${a.startTime}–${a.endTime} / ${b.startTime}–${b.endTime}</div></div>`).join(''):'<div class="help">Няма засечени конфликти.</div>';
}
function renderCategories(){
  const sel=$('#categoryInput'); if(sel)sel.innerHTML=state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
  $('#categoryEditor').innerHTML=state.categories.map(c=>`<div class="category-row" data-cat="${esc(c.id)}"><input type="color" value="${esc(c.color)}"><input type="text" value="${esc(c.name)}"><button class="btn small" title="Изтрий">×</button></div>`).join('');
  $$('.category-row').forEach(row=>{const c=state.categories.find(x=>x.id===row.dataset.cat);row.querySelector('input[type=color]').onchange=e=>{c.color=e.target.value;saveState();render()};row.querySelector('input[type=text]').onchange=e=>{c.name=e.target.value||c.name;saveState();render()};row.querySelector('button').onclick=()=>{if(state.categories.length<=1)return toast('Оставете поне една категория.');state.categories=state.categories.filter(x=>x.id!==c.id);state.events.forEach(ev=>{if(ev.categoryId===c.id)ev.categoryId=state.categories[0].id});saveState();render()}})
}
function openNew(date=todayYMD(),start='09:00',end='10:00',allDay=false){
  $('#eventModalTitle').textContent='Ново събитие';$('#eventId').value='';$('#masterId').value='';$('#occKey').value='';
  $('#titleInput').value='';$('#categoryInput').value=state.categories[0]?.id||'';$('#locationInput').value='';$('#notesInput').value='';$('#allDayInput').checked=allDay;
  $('#startDateInput').value=date;$('#endDateInput').value=date;$('#startTimeInput').value=start||'09:00';$('#endTimeInput').value=end||'10:00';$('#repeatFreq').value='none';$('#repeatInterval').value=1;$('#repeatUntil').value='';$('#editScope').value='series';
  $('#deleteBtn').classList.add('hidden');$('#duplicateBtn').classList.add('hidden');$('#editScope').parentElement.classList.add('hidden');updateModalVisibility();showModal();checkModalConflicts();

function openExisting(id,occ=''){
  const e=findInstance(id,occ)||state.events.find(x=>x.id===id); if(!e)return;
  $('#eventModalTitle').textContent=e.recurrence&&occ?'Редакция на повторение':'Редакция на събитие';$('#eventId').value=e.id;$('#masterId').value=e.masterId||e.id;$('#occKey').value=occ||'';
  $('#titleInput').value=e.title;$('#categoryInput').value=e.categoryId;$('#locationInput').value=e.location||'';$('#notesInput').value=e.notes||'';$('#allDayInput').checked=!!e.allDay;$('#startDateInput').value=e.startDate;$('#endDateInput').value=e.endDate;$('#startTimeInput').value=e.startTime||'09:00';$('#endTimeInput').value=e.endTime||'10:00';

  $('#deleteBtn').classList.remove('hidden');$('#duplicateBtn').classList.remove('hidden');$('#editScope').parentElement.classList.toggle('hidden',!(e.recurrence&&occ));updateModalVisibility();showModal();checkModalConflicts();

function showModal(){$('#eventModal').classList.add('open');$('#titleInput').focus()}
function hideModal(){$('#eventModal').classList.remove('open')}
function updateModalVisibility(){const all=$('#allDayInput').checked;$('#timeRow').classList.toggle('hidden',all);const existing=!!$('#eventId').value, occ=!!$('#occKey').value;$('#repeatRow').classList.toggle('hidden',occ&&$('#editScope').value==='single');$('#repeatUntilRow').classList.toggle('hidden',false)}
function modalEvent(){
  const rfreq=$('#repeatFreq').value;return normalizeEvent({id:$('#eventId').value||uid(),title:$('#titleInput').value.trim()||'Без заглавие',categoryId:$('#categoryInput').value,location:$('#locationInput').value.trim(),notes:$('#notesInput').value.trim(),allDay:$('#allDayInput').checked,startDate:dateFromInput($('#startDateInput').value),endDate:dateFromInput($('#endDateInput').value),startTime:$('#startTimeInput').value||'09:00',endTime:$('#endTimeInput').value||'10:00',recurrence:rfreq==='none'?null:{freq:rfreq,interval:Math.max(1,+$('#repeatInterval').value||1),until:$('#repeatUntil').value||null},exceptions:{}});

function saveModal(){
  const e=modalEvent(); const id=$('#eventId').value, occ=$('#occKey').value, scope=$('#editScope').value;
  if(id){const master=state.events.find(x=>x.id===id); if(master?.recurrence && occ && scope==='single'){master.exceptions=master.exceptions||{};master.exceptions[occ]=makeOverride(master,findInstance(id,occ)||e,e);}
    else {const keep=master?.exceptions||{};Object.assign(master,e);master.id=id;master.exceptions=scope==='series'?keep:(master.exceptions||{});} }
  else state.events.push(e);
  saveState();hideModal();render();toast('Запазено.');

function deleteModal(){
  const id=$('#eventId').value, occ=$('#occKey').value, scope=$('#editScope').value; const idx=state.events.findIndex(e=>e.id===id); if(idx<0)return;
  if(state.events[idx].recurrence && occ && scope==='single'){state.events[idx].exceptions=state.events[idx].exceptions||{};state.events[idx].exceptions[occ]={key:occ,deleted:true};}
  else state.events.splice(idx,1);

function duplicateModal(){const e=modalEvent();e.id=uid();e.title+=' (копие)';e.recurrence=null;e.exceptions={};state.events.push(e);saveState();hideModal();render();toast('Създадено копие.');}
function checkModalConflicts(){
  const e=modalEvent(); const r={start:addDays(e.startDate,-1),end:addDays(e.endDate,1)}; const others=expandEvents(r.start,r.end).filter(x=>!(x.id===e.id && (x.occurrenceKey||'')===$('#occKey').value)); const temp=[...others,e]; const hits=conflicts(temp).filter(([a,b])=>a===e||b===e);
  $('#modalConflicts').innerHTML=hits.length?`<span style="color:var(--danger);font-weight:800">Конфликт:</span> ${hits.map(([a,b])=>esc((a===e?b:a).title)).join(', ')}`:'Няма конфликт за избрания интервал.';
}
function addWorkingDays(start,n,includeStart=false,opts={}){let d=start,added=0;if(includeStart&&isWorkingDay(d,opts))added++;while(added<n){d=addDays(d,1);if(isWorkingDay(d,opts))added++;}return d;}
function countWorkingDays(start,end,includeStart=false,opts={}){let n=0,d=includeStart?start:addDays(start,1),step=start<=end?1:-1;while(step>0?d<=end:d>=end){if(isWorkingDay(d,opts))n+=step;d=addDays(d,step)}return n;}
function calc(){const opts={schoolIsNonWorking:!$('#calcSchool').checked}, start=$('#calcStart').value||todayYMD(); if($('#calcMode').value==='add'){const n=+$('input#calcDays').value||0;const res=addWorkingDays(start,n,$('#calcIncludeStart').checked,opts);$('#calcResult').textContent=`${n} работни дни от ${formatDate(start)} → ${formatDate(res)} (${BG_WEEK[weekdayIso(res)-1]})`;}
  else {const end=$('#calcEnd').value||start;const n=countWorkingDays(start,end,$('#calcIncludeStart').checked,opts);$('#calcResult').textContent=`${formatDate(start)} – ${formatDate(end)}: ${n} работни дни`;}}
function exportData(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bg-work-calendar-export.json';a.click();URL.revokeObjectURL(a.href)}

$('#todayBtn').onclick=()=>{cursor=todayYMD();render()};$('#newBtn').onclick=()=>openNew(cursor);$('#closeModal').onclick=hideModal;$('#cancelBtn').onclick=hideModal;$('#saveBtn').onclick=saveModal;$('#deleteBtn').onclick=deleteModal;$('#duplicateBtn').onclick=duplicateModal;$('#allDayInput').onchange=()=>{updateModalVisibility();checkModalConflicts()};['titleInput','startDateInput','endDateInput','startTimeInput','endTimeInput','allDayInput','categoryInput'].forEach(id=>$('#'+id).addEventListener('input',checkModalConflicts));$('#editScope').onchange=updateModalVisibility;
$('#viewSeg').onclick=e=>{if(e.target.dataset.view){view=e.target.dataset.view;render()}};$('#searchInput').oninput=e=>{searchText=e.target.value.trim();render()};$('#themeBtn').onclick=()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';render()};$('#sideBtn').onclick=()=>{$('#side').classList.toggle('hidden');$('#main').classList.toggle('sidebar-collapsed')};$('#exportBtn').onclick=exportData;$('#importFile').onchange=e=>e.target.files[0]&&importData(e.target.files[0]);$('#addCatBtn').onclick=()=>{state.categories.push({id:uid(),name:'Нова категория',color:'#657084'});saveState();render()};$('#calcBtn').onclick=calc;$('#calcMode').onchange=()=>{$('#calcEndWrap').classList.toggle('hidden',$('#calcMode').value==='add');$('#calcNumberLabel').textContent=$('#calcMode').value==='add'?'Работни дни':'Не се използва';calc()};

$('#calcStart').value=todayYMD();$('#calcEnd').value=addDays(todayYMD(),30);$('#calcEndWrap').classList.add('hidden');
render();calc();
