<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Работен календар • България</title>
<style>
:root{
  --bg:#f4f6f8;--paper:#fff;--ink:#16212d;--muted:#667786;--line:#dce3e8;
  --blue:#225bd6;--blue2:#e8efff;--work:#f7fbff;--weekend:#f1f3f5;--holiday:#fff0f0;
  --green:#18794e;--amber:#a15c00;--red:#c63535;--shadow:0 10px 30px rgba(25,44,65,.10);
  --hourH:54px;--side:300px;--top:64px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{height:100%;display:grid;grid-template-rows:var(--top) 1fr}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);z-index:20}
.brand{font-weight:850;letter-spacing:-.02em;white-space:nowrap}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:650;letter-spacing:.08em}
.navgroup,.viewtabs{display:flex;gap:5px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:8px 10px}
.btn:hover{border-color:#aebcc7;background:#fafbfd}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.active{background:var(--blue2);border-color:#9cb5ef;color:#123d9d}
.btn.icon{width:36px;padding:8px 0}
.title{font-size:18px;font-weight:800;min-width:180px;text-align:center}
.spacer{flex:1}
.search{width:min(260px,25vw);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fbfcfd}
.main{min-height:0;display:grid;grid-template-columns:1fr var(--side)}
.workspace{min-width:0;min-height:0;position:relative;background:var(--paper);overflow:auto}
.sidebar{border-left:1px solid var(--line);background:#fbfcfd;overflow:auto;padding:14px}
.sideTitle{font-size:11px;font-weight:850;letter-spacing:.09em;color:#667786;text-transform:uppercase;margin:3px 0 9px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
.muted{color:var(--muted)}
.small{font-size:11px}.tiny{font-size:10px}
.row{display:flex;gap:7px;align-items:center}.row>*{min-width:0}
.col{display:flex;flex-direction:column;gap:7px}
input,select,textarea{border:1px solid #cdd7df;border-radius:7px;padding:7px 8px;background:#fff;color:var(--ink)}
label{font-size:11px;color:#536574;font-weight:700}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:800;background:#edf1f5;color:#526575}
.badge.holiday{background:#ffe2e2;color:#a42d2d}.badge.comp{background:#fff0d0;color:#885100}.badge.school{background:#ede7ff;color:#5d45a3}.badge.custom{background:#e6f7ef;color:#19754c}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
#statusline{font-size:10px;color:#718291;white-space:nowrap}
#toast{position:fixed;left:50%;top:76px;transform:translateX(-50%);background:#172433;color:#fff;padding:8px 12px;border-radius:8px;box-shadow:var(--shadow);z-index:100;opacity:0;pointer-events:none;transition:.18s}
#agenda .agendaItem{border-left:3px solid var(--blue);padding:7px 8px;margin:6px 0;background:#fff;border-radius:0 7px 7px 0;border-top:1px solid #edf1f4;border-right:1px solid #edf1f4;border-bottom:1px solid #edf1f4;cursor:pointer}
.agendaItem b{display:block;font-size:11px}.agendaItem span{font-size:10px;color:var(--muted)}
.conflict{outline:2px solid rgba(198,53,53,.55)!important}
.conflictTag{color:var(--red);font-size:9px;font-weight:800}
.empty{padding:16px;text-align:center;color:#8493a0;font-size:11px}

/* Year */
.yearView{padding:14px;display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;min-width:920px}
.miniMonth{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.miniHead{padding:8px 9px;font-weight:800;background:#f9fbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.miniGrid{display:grid;grid-template-columns:25px repeat(7,1fr);font-size:9px}
.miniGrid .dow,.miniGrid .wk{color:#81909c;background:#f8fafb}
.miniCell,.miniGrid .dow,.miniGrid .wk{min-height:28px;border-right:1px solid #edf1f3;border-bottom:1px solid #edf1f3;padding:3px;text-align:center;position:relative}
.miniCell.out{color:#bdc5ca;background:#fafbfc}.miniCell.weekend{background:#f5f6f7}.miniCell.holiday{background:#fff0f0;color:#a52626;font-weight:800}
.miniCell.today{box-shadow:inset 0 0 0 2px var(--blue);border-radius:3px}
.miniCell.hasEvent:after{content:"";position:absolute;left:50%;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--blue);transform:translateX(-50%)}

/* Month */
.monthWrap{min-width:860px}
.monthGrid{display:grid;grid-template-columns:42px repeat(7,1fr);grid-template-rows:30px repeat(6,minmax(112px,1fr));min-height:calc(100vh - 64px)}
.monthDow,.weekNum{background:#f8fafb;color:#6c7d8a;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.dayCell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:25px 4px 4px;overflow:hidden}
.dayCell.out{background:#fafbfc;color:#aab4bc}.dayCell.weekend{background:var(--weekend)}.dayCell.holiday{background:var(--holiday)}
.dayNum{position:absolute;left:6px;top:4px;font-size:11px;font-weight:800}.dayNum.today{background:var(--blue);color:white;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;top:2px}
.holidayMark{position:absolute;right:4px;top:5px;font-size:8px;color:#b03535;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eventChip{height:18px;border-radius:4px;padding:2px 5px;color:#fff;font-size:9px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.eventChip.cont:before{content:"↔ ";opacity:.8}.more{font-size:9px;color:#526777;padding:2px 4px;cursor:pointer}

/* Week/day */
.timeline{position:relative;min-width:900px;background:#fff}
.timeHead{position:sticky;top:0;z-index:9;display:grid;background:#fff;border-bottom:1px solid var(--line)}
.timeHead .corner{background:#fafbfc;border-right:1px solid var(--line)}
.dayHead{padding:7px;text-align:center;border-right:1px solid var(--line);font-size:10px}
.dayHead b{display:block;font-size:12px}.dayHead.today{background:#edf3ff}
.allDayRow{display:grid;border-bottom:1px solid var(--line);min-height:42px;background:#fbfcfd}
.allDayLabel{font-size:9px;color:#71818e;padding:7px;border-right:1px solid var(--line)}
.allDayCell{border-right:1px solid var(--line);padding:3px;min-height:42px}
.timeBody{display:grid;position:relative}
.timeLabels{position:relative;border-right:1px solid var(--line);background:#fbfcfd}
.hourLabel{position:absolute;right:6px;transform:translateY(-7px);font-size:9px;color:#7c8c98}
.dayColumn{position:relative;border-right:1px solid var(--line);background:repeating-linear-gradient(to bottom,#fff 0,#fff calc(var(--hourH)/2 - 1px),#eff2f4 calc(var(--hourH)/2),#fff calc(var(--hourH)/2 + 1px),#fff calc(var(--hourH) - 1px),#dce3e8 var(--hourH))}
.dayColumn.weekend{background:repeating-linear-gradient(to bottom,#f5f6f7 0,#f5f6f7 calc(var(--hourH)/2 - 1px),#e6e9ec calc(var(--hourH)/2),#f5f6f7 calc(var(--hourH)/2 + 1px),#f5f6f7 calc(var(--hourH) - 1px),#d9dee2 var(--hourH))}
.dayColumn.holiday{background:repeating-linear-gradient(to bottom,#fff4f4 0,#fff4f4 calc(var(--hourH)/2 - 1px),#f4dddd calc(var(--hourH)/2),#fff4f4 calc(var(--hourH)/2 + 1px),#fff4f4 calc(var(--hourH) - 1px),#ead1d1 var(--hourH))}
.workBand{position:absolute;left:0;right:0;background:rgba(34,91,214,.045);border-top:1px dashed rgba(34,91,214,.22);border-bottom:1px dashed rgba(34,91,214,.22);pointer-events:none}
.nowLine{position:absolute;height:2px;background:#e14141;left:0;right:0;z-index:6;pointer-events:none}.nowLine:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#e14141;left:-3px;top:-3px}
.timeEvent{position:absolute;border-radius:6px;color:#fff;padding:4px 6px;font-size:9px;overflow:hidden;cursor:grab;box-shadow:0 2px 4px rgba(0,0,0,.12);z-index:4;border:1px solid rgba(0,0,0,.12)}
.timeEvent:active{cursor:grabbing}.timeEvent b{font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timeEvent .resize{position:absolute;bottom:0;left:0;right:0;height:7px;cursor:ns-resize;background:rgba(255,255,255,.14)}
.timeEvent.dragging{opacity:.75;z-index:20}

/* Modal */
.modalBack{position:fixed;inset:0;background:rgba(18,29,39,.42);z-index:80;display:none;align-items:center;justify-content:center;padding:18px}
.modalBack.show{display:flex}
.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.24);padding:16px}
.modal h2{font-size:17px;margin:0 0 12px}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
.modalActions{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.modalActions .right{display:flex;gap:7px}
.scopeBox{padding:10px;border:1px solid #d9e1e7;border-radius:9px;background:#f8fafc;margin-bottom:10px}
.scopeBox button{margin-right:6px}
.hidden{display:none!important}
.calcResult{padding:8px;border-radius:7px;background:#f3f7fb;font-size:11px;margin-top:7px}
.holidayList{max-height:215px;overflow:auto}
.holidayRow{display:grid;grid-template-columns:78px 1fr auto;gap:7px;padding:6px 0;border-bottom:1px solid #edf1f4;font-size:10px;align-items:center}
.colorInput{width:44px;height:32px;padding:2px}
.checkbox{display:flex;align-items:center;gap:7px;font-size:11px;color:#435563}
.checkbox input{width:auto}
@media(max-width:1100px){:root{--side:260px}.yearView{grid-template-columns:repeat(3,minmax(210px,1fr))}.search{display:none}}
@media(max-width:780px){
  :root{--side:0px}.sidebar{display:none}.main{grid-template-columns:1fr}
  .brand small{display:none}.title{min-width:120px;font-size:14px}.viewtabs .btn{padding:7px 6px;font-size:11px}
}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">Работен календар<small>БЪЛГАРИЯ • EUROPE/SOFIA</small></div>
  <div class="navgroup">
    <button class="btn icon" id="prevBtn" title="Назад">‹</button>
    <button class="btn" id="todayBtn">Днес</button>
    <button class="btn icon" id="nextBtn" title="Напред">›</button>
  </div>
  <div class="title" id="rangeTitle"></div>
  <div class="viewtabs">
    <button class="btn" data-view="year">Година</button>
    <button class="btn active" data-view="month">Месец</button>
    <button class="btn" data-view="week">Седмица</button>
    <button class="btn" data-view="day">Ден</button>
  </div>
  <div class="spacer"></div>
  <input class="search" id="searchInput" placeholder="Търсене в събития…">
  <button class="btn primary" id="newBtn">+ Събитие</button>
</header>

<div class="main">
  <main class="workspace" id="workspace"></main>
  <aside class="sidebar">
    <div class="sideTitle">Предстоящо</div>
    <div class="card" id="agenda"><div class="empty">Няма събития.</div></div>

    <div class="sideTitle">Работни дни</div>
    <div class="card">
      <div class="col">
        <label>Начална дата</label><input id="calcStart" type="date">
        <div class="row"><input id="calcN" type="number" value="10" min="-9999" style="width:88px"><button class="btn" id="addWorkBtn" style="flex:1">Добави работни дни</button></div>
        <label>Крайна дата</label><input id="calcEnd" type="date">
        <button class="btn" id="countWorkBtn">Преброй работните дни</button>
        <label class="checkbox"><input id="schoolMode" type="checkbox"> Учебно заведение (1 ноември е неприсъствен)</label>
        <div id="calcResult" class="calcResult">—</div>
      </div>
    </div>

    <div class="sideTitle">Работно време</div>
    <div class="card">
      <div class="row"><input id="workStart" type="time" value="09:00"><span>–</span><input id="workEnd" type="time" value="18:00"></div>
      <div class="small muted" style="margin-top:7px">Маркира се в седмичния и дневния изглед.</div>
    </div>

    <div class="sideTitle">Празници <span id="holidayYear"></span></div>
    <div class="card">
      <div class="holidayList" id="holidayList"></div>
      <hr>
      <div class="row"><input id="customHolidayDate" type="date" style="width:132px"><input id="customHolidayName" placeholder="Име" style="flex:1"></div>
      <button class="btn" id="addCustomHoliday" style="width:100%;margin-top:7px">+ Допълнителен неприсъствен ден</button>
      <div class="tiny muted" style="margin-top:8px">Стандартните дни следват чл. 154 КТ. Еднократни решения на МС се добавят тук ръчно.</div>
    </div>
    <div id="statusline"></div>
  </aside>
</div>
</div>
<div id="toast"></div>

<div class="modalBack" id="eventModal">
  <div class="modal">
    <h2 id="modalTitle">Събитие</h2>
    <div id="scopeBox" class="scopeBox hidden">
      <div class="small" style="margin-bottom:7px"><b>Повтарящо се събитие:</b> кое искате да редактирате?</div>
      <button class="btn active" id="scopeOne">Само това повторение</button>
      <button class="btn" id="scopeSeries">Цялата серия</button>
    </div>
    <div class="formGrid">
      <div class="field full"><label>Заглавие</label><input id="evTitle" maxlength="120"></div>
      <div class="field"><label>Категория</label>
        <select id="evCategory">
          <option>Работа</option><option>Среща</option><option>Фокус</option><option>Лично</option><option>Срок</option><option>Пътуване</option>
        </select>
      </div>
      <div class="field"><label>Цвят</label><input class="colorInput" id="evColor" type="color" value="#225bd6"></div>
      <div class="field full"><label class="checkbox"><input id="evAllDay" type="checkbox"> Цял ден</label></div>
      <div class="field"><label>Начало</label><input id="evStartDate" type="date"></div>
      <div class="field timeField"><label>Час</label><input id="evStartTime" type="time" value="09:00"></div>
      <div class="field"><label>Край</label><input id="evEndDate" type="date"></div>
      <div class="field timeField"><label>Час</label><input id="evEndTime" type="time" value="10:00"></div>
      <div class="field"><label>Повторение</label>
        <select id="evRepeat"><option value="none">Без повторение</option><option value="daily">Всеки ден</option><option value="weekly">Всяка седмица</option><option value="monthly">Всеки месец</option></select>
      </div>
      <div class="field"><label>Интервал</label><input id="evInterval" type="number" value="1" min="1" max="99"></div>
      <div class="field"><label>Повтаряй до</label><input id="evUntil" type="date"></div>
      <div class="field full"><label>Бележки</label><textarea id="evNotes" rows="3"></textarea></div>
      <div class="field full"><div id="editorConflict" class="small"></div></div>
    </div>
    <div class="modalActions">
      <button class="btn" id="deleteBtn" style="color:#b32f2f">Изтрий</button>
      <div class="right"><button class="btn" id="cancelBtn">Отказ</button><button class="btn primary" id="saveEventBtn">Запази</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
"use strict";
const TZ="Europe/Sofia", LOCALE="bg-BG", STORE="bg_work_calendar_offline_v1";
const MONTHS=["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
const DOW=["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];
const CATCOL={Работа:"#225bd6",Среща:"#7a49c9",Фокус:"#18794e",Лично:"#cf5d22",Срок:"#c63535",Пътуване:"#167f92"};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0");
const uid=()=>crypto?.randomUUID?.()||("e"+Date.now().toString(36)+Math.random().toString(36).slice(2));
const clone=o=>JSON.parse(JSON.stringify(o));
let state={view:"month",anchor:"",events:[],customHolidays:[],workStart:"09:00",workEnd:"18:00",schoolMode:false};
let editing=null, editScope="one", search="", dragState=null;

function todaySofia(){
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const p=Object.fromEntries(parts.filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
  return `${p.year}-${p.month}-${p.day}`;
}
state.anchor=todaySofia();

function load(){
  try{
    const x=JSON.parse(localStorage.getItem(STORE)||"null");
    if(x&&x.events){state={...state,...x};}
  }catch(e){}
  if(!state.anchor)state.anchor=todaySofia();
}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
load();

function dateObj(ds){const [y,m,d]=ds.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function ds(d){return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`}
function addDays(s,n){const d=dateObj(s);d.setUTCDate(d.getUTCDate()+n);return ds(d)}
function addMonths(s,n,anchorDay=null){
  const d=dateObj(s), day=anchorDay??d.getUTCDate(); let y=d.getUTCFullYear(),m=d.getUTCMonth()+n;
  y+=Math.floor(m/12);m=((m%12)+12)%12;const last=new Date(Date.UTC(y,m+1,0)).getUTCDate();
  return `${y}-${pad(m+1)}-${pad(Math.min(day,last))}`;
}
function dayDiff(a,b){return Math.round((dateObj(b)-dateObj(a))/86400000)}
function weekday(s){const w=dateObj(s).getUTCDay();return w===0?7:w}
function startOfWeek(s){return addDays(s,1-weekday(s))}
function endOfWeek(s){return addDays(startOfWeek(s),6)}
function startOfMonth(s){return s.slice(0,8)+"01"}
function endOfMonth(s){const [y,m]=s.split("-").map(Number);return ds(new Date(Date.UTC(y,m,0)))}
function fmtDate(s){const [y,m,d]=s.split("-");return `${d}.${m}.${y}`}
function fmtShort(s){const [y,m,d]=s.split("-");return `${d}.${m}.`}
function monthName(s){return MONTHS[+s.slice(5,7)-1]}
function minutes(t){const [h,m]=t.split(":").map(Number);return h*60+m}
function minToTime(v){v=((v%1440)+1440)%1440;return `${pad(Math.floor(v/60))}:${pad(v%60)}`}
function wallStamp(date,time="00:00"){return date+"T"+time}
function wallDiffMinutes(aD,aT,bD,bT){return dayDiff(aD,bD)*1440+minutes(bT)-minutes(aT)}
function addWallMinutes(date,time,delta){
  let total=minutes(time)+delta, dd=0;
  while(total<0){total+=1440;dd--}while(total>=1440){total-=1440;dd++}
  return {date:addDays(date,dd),time:minToTime(total)}
}
function isoWeek(s){
  const d=dateObj(s);d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));
  const y0=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y0)/86400000)+1)/7);
}
function compareStamp(aD,aT,bD,bT){return wallStamp(aD,aT).localeCompare(wallStamp(bD,bT))}
function rangesOverlap(a,b){
  const as=wallStamp(a.startDate,a.allDay?"00:00":a.startTime),ae=wallStamp(a.endDate,a.allDay?"23:59":a.endTime);
  const bs=wallStamp(b.startDate,b.allDay?"00:00":b.startTime),be=wallStamp(b.endDate,b.allDay?"23:59":b.endTime);
  return as<be && bs<ae;
}
function tzName(date){
  try{return new Intl.DateTimeFormat("bg-BG",{timeZone:TZ,timeZoneName:"shortOffset",hour:"2-digit"}).formatToParts(new Date(date+"T12:00:00Z")).find(p=>p.type==="timeZoneName")?.value||""}
  catch(e){return "Europe/Sofia"}
}

/* Orthodox Easter: Julian computus, converted exactly through Julian Day Number. */
function julianToJdn(y,m,d){
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-32083;
}
function jdnToGregorian(j){
  let a=j+32044,b=Math.floor((4*a+3)/146097),c=a-Math.floor(146097*b/4);
  let d=Math.floor((4*c+3)/1461),e=c-Math.floor(1461*d/4),m=Math.floor((5*e+2)/153);

function orthodoxEaster(y){

function holidayMap(year){
  const map=new Map();
  const add=(date,name,type="official",nonworking=true)=>map.set(date,{date,name,type,nonworking});
  [
    ["01-01","Нова година"],["03-03","Ден на Освобождението на България от османско иго — национален празник"],
    ["05-01","Ден на труда и на международната работническа солидарност"],
    ["05-06","Гергьовден — Ден на храбростта и Българската армия"],
    ["05-24","Ден на светите братя Кирил и Методий, на българската азбука, просвета и култура и на славянската книжовност"],
    ["09-06","Ден на Съединението"],["09-22","Ден на Независимостта на България"],
    ["12-24","Бъдни вечер"],["12-25","Рождество Христово"],["12-26","Рождество Христово"]
  ].forEach(([md,n])=>add(`${year}-${md}`,n));
  add(`${year}-11-01`,"Ден на народните будители — неприсъствен за всички учебни заведения","school",false);

  const easter=orthodoxEaster(year);
  add(addDays(easter,-2),"Велики петък","easter",true);
  add(addDays(easter,-1),"Велика събота","easter",true);
  add(easter,"Великден — неделя","easter",true);
  add(addDays(easter,1),"Великден — понеделник","easter",true);

  // Art. 154(2): weekend compensation excludes the Easter holidays.
  const weekendFixed=[...map.values()].filter(h=>h.type==="official"&&weekday(h.date)>=6).sort((a,b)=>a.date.localeCompare(b.date));
  const blocked=new Set([...map.values()].filter(h=>h.nonworking).map(h=>h.date));
  const compensation=[];
  for(const h of weekendFixed){
    let d=addDays(h.date,1);
    while(weekday(d)>=6 || blocked.has(d) || compensation.some(x=>x.date===d)) d=addDays(d,1);
    compensation.push({date:d,name:`Неприсъствен ден за ${h.name}`,type:"comp",nonworking:true});
    blocked.add(d);
  }
  compensation.forEach(h=>map.set(h.date,h));
  state.customHolidays.filter(x=>x.date.startsWith(year+"-")).forEach(x=>map.set(x.date,{...x,type:"custom",nonworking:true}));
  return map;
}
function holiday(date){return holidayMap(+date.slice(0,4)).get(date)}
function isWorkday(date){

}
function addWorkingDays(start,n){

}

  while(true){if(isWorkday(d))count+=dir;if(d===b)break;d=addDays(d,dir)}
  return count;
}

/* Recurrences and occurrences */
function eventDuration(ev){
  return ev.allDay ? Math.max(1,dayDiff(ev.startDate,ev.endDate)+1)*1440 :
    Math.max(15,wallDiffMinutes(ev.startDate,ev.startTime,ev.endDate,ev.endTime));
}
function recurrenceKey(date,time){return date+"|"+(time||"ALL")}
function occurrences(rangeStart,rangeEnd,ignoreSearch=false){
  let out=[];
  for(const ev of state.events){
    const q=(ev.title+" "+(ev.notes||"")+" "+(ev.category||"")).toLocaleLowerCase("bg-BG");
    if(!ignoreSearch && search && !q.includes(search))continue;
    if(!ev.recurrence || ev.recurrence.freq==="none"){
      if(ev.endDate>=rangeStart&&ev.startDate<=rangeEnd)out.push({...ev,_sourceId:ev.id,_occKey:ev.id,_generated:false});
      continue;
    }
    const rec=ev.recurrence,dur=eventDuration(ev),anchorDay=+ev.startDate.slice(8,10);
    let cur=ev.startDate, guard=0;
    while(cur<=rangeEnd && guard++<5000){
      const key=recurrenceKey(cur,ev.allDay?null:ev.startTime);
      if((!rec.until||cur<=rec.until) && !ev.exdates?.includes(key)){
        const end=ev.allDay?{date:addDays(cur,Math.max(0,Math.round(dur/1440)-1)),time:""}:addWallMinutes(cur,ev.startTime,dur);
        let occ={...ev,startDate:cur,endDate:end.date,endTime:ev.allDay?"":end.time,_sourceId:ev.id,_occKey:ev.id+"@"+key,_seriesKey:key,_generated:true};
        if(ev.exceptions?.[key]) occ={...occ,...ev.exceptions[key],_sourceId:ev.id,_occKey:ev.id+"@"+key,_seriesKey:key,_generated:true};
        if(occ.endDate>=rangeStart&&occ.startDate<=rangeEnd)out.push(occ);
      }
      if(rec.freq==="daily")cur=addDays(cur,rec.interval||1);
      else if(rec.freq==="weekly")cur=addDays(cur,7*(rec.interval||1));
      else cur=addMonths(cur,rec.interval||1,anchorDay);
      if(rec.until && cur>rec.until && cur>rangeEnd)break;
    }
  }
  return out.sort((a,b)=>wallStamp(a.startDate,a.startTime||"00:00").localeCompare(wallStamp(b.startDate,b.startTime||"00:00")));
}
function sourceEvent(occ){return state.events.find(e=>e.id===occ._sourceId||e.id===occ.id)}
function commitOccurrence(occ,patch){
  const src=sourceEvent(occ);if(!src)return;

    src.exceptions ||= {};

}
function pickEditable(e){return {title:e.title,category:e.category,color:e.color,allDay:e.allDay,startDate:e.startDate,startTime:e.startTime,endDate:e.endDate,endTime:e.endTime,notes:e.notes||""}}
function conflictSet(occs){
  const set=new Set();
  for(let i=0;i<occs.length;i++)for(let j=i+1;j<occs.length;j++){
    if(occs[j].startDate>occs[i].endDate)break;
    if(occs[i]._occKey!==occs[j]._occKey && rangesOverlap(occs[i],occs[j])){set.add(occs[i]._occKey);set.add(occs[j]._occKey)}
  }
  return set;
}

function renderTimeline(oneDay){

  let all=`<div class="allDayRow" style="grid-template-columns:${colDef}"><div class="allDayLabel">цял ден</div>${dayList.map(d=>`<div class="allDayCell" data-date="${d}">${occs.filter(o=>o.allDay&&o.startDate<=d&&o.endDate>=d).slice(0,4).map(o=>`<div class="eventChip ${o.startDate!==o.endDate?"cont":""} ${conf.has(o._occKey)?"conflict":""}" data-occ="${escAttr(o._occKey)}" style="background:${o.color}">${esc(o.title)}</div>`).join("")}</div>`).join("")}</div>`;

function sofiaNowMinutes(){

}
function setScope(s){
  editScope=s;$("#scopeOne").classList.toggle("active",s==="one");$("#scopeSeries").classList.toggle("active",s==="series");
  if(editing)fillEditor(s==="series"?sourceEvent(editing):editing);
  $("#evRepeat").disabled=(s==="one"&&editing?._generated);$("#evInterval").disabled=$("#evRepeat").disabled;$("#evUntil").disabled=$("#evRepeat").disabled;
}
function editorData(){
  const all=$("#evAllDay").checked;
  return {title:$("#evTitle").value.trim()||"(Без заглавие)",category:$("#evCategory").value,color:$("#evColor").value,allDay:all,
    startDate:$("#evStartDate").value,startTime:all?"":$("#evStartTime").value,endDate:$("#evEndDate").value,endTime:all?"":$("#evEndTime").value,
    notes:$("#evNotes").value.trim()};
}
function saveEditor(){
  const d=editorData();if(!d.startDate||!d.endDate){toast("Изберете дати");return}
  if(d.endDate<d.startDate || (!d.allDay&&d.endDate===d.startDate&&d.endTime<=d.startTime)){toast("Краят трябва да е след началото");return}
  const rec=$("#evRepeat").value==="none"?null:{freq:$("#evRepeat").value,interval:Math.max(1,+$("#evInterval").value||1),until:$("#evUntil").value||null};
  if(!editing){
    state.events.push({...d,id:uid(),recurrence:rec,exdates:[],exceptions:{},createdAt:Date.now()});
  }else if(editing._generated&&editScope==="one"){
    const src=sourceEvent(editing);src.exceptions ||= {};src.exceptions[editing._seriesKey]=d;
  }else{
    const src=sourceEvent(editing);Object.assign(src,d,{recurrence:rec});
  }
  closeEditor();persist();render();toast("Събитието е записано");
}
function deleteEditor(){
  if(!editing)return;
  const src=sourceEvent(editing);
  if(editing._generated&&editScope==="one"){src.exdates ||= [];if(!src.exdates.includes(editing._seriesKey))src.exdates.push(editing._seriesKey)}
  else state.events=state.events.filter(e=>e.id!==src.id);
  closeEditor();persist();render();toast("Събитието е изтрито");
}
function closeEditor(){$("#eventModal").classList.remove("show");editing=null}
function syncAllDay(){$$(".timeField").forEach(x=>x.classList.toggle("hidden",$("#evAllDay").checked))}
function updateEditorConflict(){
  const box=$("#editorConflict");if(!$("#evStartDate").value||!$("#evEndDate").value){box.textContent="";return}
  const d=editorData(),all=occurrences(addDays(d.startDate,-1),addDays(d.endDate,1),true).filter(o=>!editing||o._occKey!==editing._occKey);
  const hits=all.filter(o=>rangesOverlap(d,o));
  box.innerHTML=hits.length?`<span class="bad"><b>Конфликт:</b> застъпва се с ${hits.slice(0,3).map(x=>esc(x.title)).join(", ")}${hits.length>3?"…":""}</span>`:'<span style="color:var(--green)">Няма открит конфликт.</span>';
}

/* Calculator + app controls */
function toast(t){const e=$("#toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,1700)}
$("#prevBtn").onclick=()=>{state.anchor=state.view==="year"?addMonths(state.anchor,-12):state.view==="month"?addMonths(state.anchor,-1):state.view==="week"?addDays(state.anchor,-7):addDays(state.anchor,-1);render()};
$("#nextBtn").onclick=()=>{state.anchor=state.view==="year"?addMonths(state.anchor,12):state.view==="month"?addMonths(state.anchor,1):state.view==="week"?addDays(state.anchor,7):addDays(state.anchor,1);render()};
$("#todayBtn").onclick=()=>{state.anchor=todaySofia();render()};
$$("[data-view]").forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});
$("#newBtn").onclick=()=>openNew(state.anchor);
$("#searchInput").oninput=e=>{search=e.target.value.trim().toLocaleLowerCase("bg-BG");render()};
$("#workStart").onchange=e=>{state.workStart=e.target.value||"09:00";render()};
$("#workEnd").onchange=e=>{state.workEnd=e.target.value||"18:00";render()};
$("#schoolMode").onchange=e=>{state.schoolMode=e.target.checked;render();runCountCalc()};
$("#calcStart").value=todaySofia();$("#calcEnd").value=addDays(todaySofia(),30);
$("#addWorkBtn").onclick=()=>{const s=$("#calcStart").value,n=+$("#calcN").value||0;if(!s)return;const r=addWorkingDays(s,n);$("#calcResult").innerHTML=`${n>=0?"След":"Преди"} <b>${Math.abs(n)}</b> работни дни: <b>${fmtDate(r)}</b>${holiday(r)?` — ${esc(holiday(r).name)}`:""}`};
function runCountCalc(){const a=$("#calcStart").value,b=$("#calcEnd").value;if(!a||!b)return;$("#calcResult").innerHTML=`Работни дни (включително границите): <b>${countWorkingDays(a,b)}</b>`}
$("#countWorkBtn").onclick=runCountCalc;
$("#addCustomHoliday").onclick=()=>{const date=$("#customHolidayDate").value,name=$("#customHolidayName").value.trim();if(!date||!name){toast("Въведете дата и име");return}state.customHolidays=state.customHolidays.filter(x=>x.date!==date);state.customHolidays.push({date,name});$("#customHolidayName").value="";persist();render()};
$("#evCategory").onchange=e=>{if(CATCOL[e.target.value])$("#evColor").value=CATCOL[e.target.value]};
$("#evAllDay").onchange=()=>{syncAllDay();updateEditorConflict()};
["evTitle","evStartDate","evStartTime","evEndDate","evEndTime"].forEach(id=>$("#"+id).addEventListener("input",updateEditorConflict));
$("#saveEventBtn").onclick=saveEditor;$("#deleteBtn").onclick=deleteEditor;$("#cancelBtn").onclick=closeEditor;
$("#eventModal").onclick=e=>{if(e.target===$("#eventModal"))closeEditor()};
$("#scopeOne").onclick=()=>setScope("one");$("#scopeSeries").onclick=()=>setScope("series");
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeEditor();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#searchInput").focus()}if(e.key==="n"&&!e.ctrlKey&&!e.metaKey&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))openNew(state.anchor)});
window.addEventListener("storage",e=>{if(e.key===STORE){load();render()}});
render();
setInterval(()=>{if(state.view==="day"||state.view==="week")render()},60000);
})();
</script>
</body>
</html>
