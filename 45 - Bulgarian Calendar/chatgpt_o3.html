
<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Bulgarian Work Calendar (offline)</title>
<style>
:root{
 --bg:#ffffff;
 --fg:#111;
 --accent:#0069d9;
 --holiday:#ffecf0;
 --weekend:#f5f5f5;
 --business:#eaf6ff;
 --grid:#ddd;
 --event-bg:#0069d922;
 --event-border:#0069d9;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);}
header{display:flex;align-items:center;gap:.5rem;background:var(--accent);color:#fff;padding:.5rem 1rem;flex-wrap:wrap}
header h1{font-size:1rem;margin:0 1rem 0 0}
header button,header select{padding:.3rem .6rem;font-size:.9rem;border:0;border-radius:4px;margin:2px}
header button{background:#fff;color:var(--accent);cursor:pointer}
header button:disabled{opacity:.5;cursor:default}
header select{background:#fff;color:var(--fg)}
#view-container{padding:1rem}
table.calendar{border-collapse:collapse;width:100%}
.calendar th,.calendar td{border:1px solid var(--grid);padding:.25rem;text-align:right;vertical-align:top;font-size:.75rem;position:relative;height:6.5rem}
.calendar th{background:var(--accent);color:#fff;font-weight:400;font-size:.75rem}
.calendar td.weeknum{background:var(--weekend);font-weight:bold;text-align:center}
.calendar td.today{outline:2px solid var(--accent)}
.calendar td.weekend{background:var(--weekend)}
.calendar td.holiday{background:var(--holiday)}
.calendar td .day-number{position:absolute;top:2px;right:2px;font-size:.7rem;font-weight:bold}
.event{position:absolute;left:2px;right:2px;border:1px solid var(--event-border);border-left:4px solid var(--event-border);background:var(--event-bg);padding:0 2px;font-size:.65rem;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.event.all-day{top:14px;height:14px}
.event.partial{height:12px}
#agenda{max-height:40vh;overflow:auto}
#agenda table{width:100%;border-collapse:collapse}
#agenda th,#agenda td{padding:.4rem;border:1px solid var(--grid);font-size:.8rem;text-align:left}
label{font-size:.85rem}
input,select{font-size:.85rem;padding:.25rem}
dialog{border:0;border-radius:6px;padding:1rem;max-width:24rem}
dialog::backdrop{background:#0006}
.business-hour{background:var(--business)}
</style>
</head>
<body>
<header>
  <h1>Работен календар – България</h1>
  <button id="todayBtn">Днес</button>
  <button id="prevBtn">‹</button>
  <button id="nextBtn">›</button>
  <select id="viewSelect">
    <option value="year">Година</option>
    <option value="month" selected>Месец</option>
    <option value="week">Седмица</option>
    <option value="day">Ден</option>
  </select>
  <span id="title"></span>
  <button id="addBtn">Добави събитие</button>
  <input id="searchInput" placeholder="Търсене">
</header>
<div id="view-container"></div>

<dialog id="eventDialog">
  <form method="dialog" id="eventForm">
    <h3 id="dlgTitle">Събитие</h3>
    <input type="hidden" id="eventId">
    <label>Заглавие<br><input id="eventTitle" required></label><br>
    <label>Начало<br><input type="datetime-local" id="eventStart" required></label><br>
    <label>Край<br><input type="datetime-local" id="eventEnd"></label><br>
    <label><input type="checkbox" id="eventAllDay"> Целодневно</label><br>
    <label>Категория<br>
      <select id="eventCat">
        <option value="default">Обикновено</option>
        <option value="meeting">Среща</option>
        <option value="deadline">Срок</option>
        <option value="holiday">Почивка</option>
      </select>
    </label><br>
    <label>Повтаряне<br>
      <select id="eventRec">
        <option value="">–</option>
        <option value="daily">Ежедневно</option>
        <option value="weekly">Ежеседмично</option>
        <option value="monthly">Ежемесечно</option>
      </select>
    </label><br><br>
    <menu>
      <button value="cancel">Отказ</button>
      <button value="delete" id="delBtn" style="margin-left:auto;background:#c00;color:#fff">Изтрий</button>
      <button value="save" style="background:#0a7;color:#fff">Запис</button>
    </menu>
  </form>
</dialog>

<dialog id="workdayDialog">
  <form method="dialog" id="workdayForm">
    <h3>Калкулатор работни дни</h3>
    <label>Начална дата<br><input type="date" id="wdStart" required></label><br>
    <label>Крайна дата<br><input type="date" id="wdEnd" required></label><br><br>
    <menu>
      <button value="cancel">Затвори</button>
      <button value="calc" style="background:#0a7;color:#fff">Изчисли</button>
    </menu>
    <p id="wdResult"></p>
  </form>
</dialog>

<script>
/* ===== Utilities ===== */
const tz='Europe/Sofia';
const today=new Date();
let currentDate = new Date();
let currentView='month';
const locale='bg-BG';

function cloneDate(d){return new Date(d.getTime());}
function startOfWeek(d){const n=cloneDate(d);const day=(n.getDay()+6)%7; n.setDate(n.getDate()-day); n.setHours(0,0,0,0);return n;}
function startOfMonth(d){const n=new Date(d.getFullYear(),d.getMonth(),1);return n;}
function formatDate(d,opts){return new Intl.DateTimeFormat(locale,opts).format(d);}
function pad(n){return n<10?'0'+n:n;}

function isoWeekNumber(date){
  const tmp=new Date(date.getTime());
  tmp.setHours(0,0,0,0);
  tmp.setDate(tmp.getDate()+3 - ((tmp.getDay()+6)%7));
  const firstThursday=new Date(tmp.getFullYear(),0,4);
  firstThursday.setDate(firstThursday.getDate()+3-((firstThursday.getDay()+6)%7));
  const week=Math.floor(1+(tmp - firstThursday)/604800000);
  return week;
}

/* ===== Holidays ===== */
function orthodoxEaster(year){
  // Meeus Julian algorithm
  const a=year%4;
  const b=year%7;
  const c=year%19;
  const d=(19*c+15)%30;
  const e=(2*a+4*b+6*d+6)%7;
  const julianDay=4+d+e;
  const gregorian= new Date(year,2, julianDay+13); // March base, +13 day conversion
  if(gregorian.getMonth()>3){gregorian.setDate(gregorian.getDate()-30);}
  return gregorian;
}

function bulgarianHolidays(year){
  const fixed=[
    ['01-01','Нова година'],
    ['03-03','Освобождение'],
    ['05-01','Ден на труда'],
    ['05-06','Гергьовден'],
    ['05-24','Култура и писменост'],
    ['09-06','Съединение'],
    ['09-22','Независимост'],
    ['12-24','Бъдни вечер'],
    ['12-25','Коледа'],
    ['12-26','Коледа 2']
  ];
  const list=[];
  fixed.forEach(([md,name])=>{
    const [m,d]=md.split('-');
    list.push({date:new Date(year,Number(m)-1,Number(d)),name});
  });
  const easter=orthodoxEaster(year);
  ['Велики петък','Велика събота','Великден','Великден'].forEach((n,i)=>{
    const dt=new Date(easter.getTime());
    dt.setDate(dt.getDate()+i-2);
    list.push({date:dt,name:n});
  });
  // weekend compensation
  const offs=[];
  list.forEach(h=>{
    const dow=h.date.getDay();
    if(dow===0||dow===6){
      const comp=new Date(h.date.getTime());
      comp.setDate(comp.getDate()+(dow===6?2:1));
      offs.push({date:comp,name:h.name+' (почивен ден)'});
    }
  });
  return list.concat(offs);
}
function isHoliday(date,holidays){
  return holidays.find(h=>h.date.toDateString()===date.toDateString());
}

/* ===== Storage ===== */
function loadEvents(){
  try{
    return JSON.parse(localStorage.getItem('bgCalEvents')||'[]');
  }catch(e){return [];}
}
function saveEvents(evts){
  localStorage.setItem('bgCalEvents',JSON.stringify(evts));
}

/* ===== Event helpers ===== */
function generateOccurrences(event,start,end){
  const occs=[];
  const rec=event.recurrence;
  if(!rec){ // single
    const st=new Date(event.start);
    if(st<=end && new Date(event.end)>=start){
      occs.push({...event,occDate:st});
    }
    return occs;
  }
  let cursor=new Date(event.start);
  const until=rec.until?new Date(rec.until):end;
  while(cursor<=end && cursor<=until){
    const nextEnd=new Date(cursor.getTime()+(new Date(event.end)-new Date(event.start)));
    if(nextEnd>=start){
      occs.push({...event,occDate:new Date(cursor)});
    }
    if(rec.freq==='daily')cursor.setDate(cursor.getDate()+rec.interval);
    else if(rec.freq==='weekly')cursor.setDate(cursor.getDate()+7*rec.interval);
    else if(rec.freq==='monthly'){
      cursor.setMonth(cursor.getMonth()+rec.interval);
    }else break;
  }
  return occs;
}
function getEventsInRange(start,end){
  const evts=loadEvents();
  const occs=[];
  evts.forEach(evt=>{
    occs.push(...generateOccurrences(evt,start,end));
  });
  return occs;
}
function overlaps(aStart,aEnd,bStart,bEnd){
  return aStart<bEnd && bStart<aEnd;
}

/* ===== Rendering ===== */
function render(){
  document.getElementById('title').textContent=viewTitle();
  const container=document.getElementById('view-container');
  container.innerHTML='';
  if(currentView==='year')renderYear(container);
  else if(currentView==='month')renderMonth(container);
  else if(currentView==='week')renderWeek(container);
  else renderDay(container);
}

function viewTitle(){
  if(currentView==='year')return currentDate.getFullYear();
  if(currentView==='month')return formatDate(currentDate,{month:'long',year:'numeric'});
  if(currentView==='week'){
    const start=startOfWeek(currentDate);
    const end=cloneDate(start);end.setDate(end.getDate()+6);
    return 'Седмица '+isoWeekNumber(start)+' ('+formatDate(start,{day:'2-digit',month:'2-digit'})+' – '+formatDate(end,{day:'2-digit',month:'2-digit'})+')';
  }
  return formatDate(currentDate,{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}

function renderYear(container){
  const year=currentDate.getFullYear();
  const holidays=bulgarianHolidays(year);
  const grid=document.createElement('div');
  grid.style.display='grid';grid.style.gridTemplateColumns='repeat(3,1fr)';grid.style.gap='1rem';
  for(let m=0;m<12;m++){
    const mDate=new Date(year,m,1);
    const table=buildMonthTable(mDate,holidays,true);
    const wrap=document.createElement('div');
    const h=document.createElement('h3');
    h.textContent=formatDate(mDate,{month:'long'});
    wrap.appendChild(h);
    wrap.appendChild(table);
    grid.appendChild(wrap);
  }
  container.appendChild(grid);
}

function renderMonth(container){
  const year=currentDate.getFullYear();
  const month=currentDate.getMonth();
  const holidays=bulgarianHolidays(year);
  const table=buildMonthTable(new Date(year,month,1),holidays,false);
  container.appendChild(table);
}

function buildMonthTable(firstDay,holidays,mini){
  const year=firstDay.getFullYear(),month=firstDay.getMonth();
  const start=startOfWeek(firstDay);
  const tbl=document.createElement('table');
  tbl.className='calendar';
  const thead=tbl.createTHead();
  let row=thead.insertRow();
  row.insertCell().innerText='W'; // weeknum col
  const days=['Пон','Вт','Ср','Чет','Пет','Съб','Нед'];
  days.forEach(d=>{const th=document.createElement('th');th.textContent=d;row.appendChild(th);});
  const tbody=tbl.createTBody();
  let d=cloneDate(start);
  for(let r=0;r<6;r++){
    row=tbody.insertRow();
    // week num
    const wn=row.insertCell();
    wn.className='weeknum';
    wn.textContent=isoWeekNumber(d);
    for(let c=0;c<7;c++){
      const cell=row.insertCell();
      cell.dataset.date=d.toISOString();
      cell.onclick=()=>{currentDate=new Date(cell.dataset.date);setView('day');}
      if(d.getMonth()!==month)cell.style.opacity=.5;
      const dow=d.getDay();
      if(dow===0||dow===6)cell.classList.add('weekend');
      if(d.toDateString()===today.toDateString())cell.classList.add('today');
      const hol=isHoliday(d,holidays);
      if(hol)cell.classList.add('holiday');
      const n=document.createElement('span');
      n.className='day-number';
      n.textContent=d.getDate();
      cell.appendChild(n);
      if(!mini)renderCellEvents(cell,d,holidays);
      d.setDate(d.getDate()+1);
    }
  }
  return tbl;
}
function renderCellEvents(cell,date,holidays){
  const start=new Date(date.getFullYear(),date.getMonth(),date.getDate(),0,0,0);
  const end=cloneDate(start);end.setDate(end.getDate()+1);
  const events=getEventsInRange(start,end);
  events.forEach(e=>{
    const div=document.createElement('div');
    div.className='event '+(e.allDay?'all-day':'partial');
    div.style.top=e.allDay?'14px':(20+(new Date(e.start).getHours()*2))+'px';
    div.textContent=e.title;
    div.onclick=(ev)=>{ev.stopPropagation();openEventDialog(e.id);}
    cell.appendChild(div);
  });
}

/* Week & Day simple render */
function renderWeek(container){
  const start=startOfWeek(currentDate);
  const end=cloneDate(start);end.setDate(end.getDate()+6);
  const events=getEventsInRange(start,end);
  const table=document.createElement('table');table.className='calendar';
  const thead=table.createTHead();let row=thead.insertRow();
  row.insertCell(); // corner
  for(let i=0;i<7;i++){
    const d=cloneDate(start);d.setDate(d.getDate()+i);
    const th=document.createElement('th');th.textContent=formatDate(d,{weekday:'short',day:'2-digit',month:'2-digit'});
    row.appendChild(th);
  }
  const tbody=table.createTBody();
  for(let h=0;h<24;h++){
    row=tbody.insertRow();
    const label=row.insertCell();label.textContent=pad(h)+':00';if(h>=9&&h<18)label.className='business-hour';
    for(let i=0;i<7;i++){
      const cell=row.insertCell();
      const d=cloneDate(start);d.setDate(d.getDate()+i);
      if(h>=9&&h<18)cell.className='business-hour';
      events.filter(e=>{
        const st=new Date(e.start),ed=new Date(e.end);
        return st<=ed && st.getHours()<=h && ed> new Date(d.getTime()+h*3600000) && st.getDate()===d.getDate() && st.getMonth()===d.getMonth();
      }).forEach(e=>{
        cell.style.background=varGet('--event-bg');
        cell.title=e.title;
      });
    }
  }
  container.appendChild(table);
}

function renderDay(container){
  const day=startOfWeek(currentDate);day.setDate(currentDate.getDate()); // midnight
  const next=cloneDate(day);next.setDate(next.getDate()+1);
  const events=getEventsInRange(day,next);
  const table=document.createElement('table');table.className='calendar';
  const thead=table.createTHead();let row=thead.insertRow();
  row.insertCell().innerText='Час';
  row.insertCell().innerText=formatDate(day,{weekday:'long',day:'2-digit',month:'2-digit'});
  const tbody=table.createTBody();
  for(let h=0;h<24;h++){
    row=tbody.insertRow();
    const label=row.insertCell();label.textContent=pad(h)+':00';if(h>=9&&h<18)label.className='business-hour';
    const cell=row.insertCell();
    if(h>=9&&h<18)cell.className='business-hour';
    events.filter(e=>{
      const st=new Date(e.start),ed=new Date(e.end);
      return overlaps(st,ed,new Date(day.getTime()+h*3600000), new Date(day.getTime()+(h+1)*3600000));
    }).forEach(e=>{
      cell.style.background=varGet('--event-bg');
      cell.title=e.title;
    });
  }
  container.appendChild(table);
}

function varGet(name){return getComputedStyle(document.documentElement).getPropertyValue(name);}

/* ===== Dialogs ===== */
function openEventDialog(id=null){
  const dlg=document.getElementById('eventDialog');
  const form=document.getElementById('eventForm');
  const evts=loadEvents();
  let evt=null;
  if(id!==null){
    evt=evts.find(e=>e.id===id);
  }
  document.getElementById('delBtn').style.display=evt?'inline-block':'none';
  document.getElementById('dlgTitle').textContent=evt?'Редакция':'Ново събитие';
  form.reset();
  if(evt){
    document.getElementById('eventId').value=evt.id;
    document.getElementById('eventTitle').value=evt.title;
    document.getElementById('eventStart').value=evt.start.slice(0,16);
    document.getElementById('eventEnd').value=evt.end.slice(0,16);
    document.getElementById('eventAllDay').checked=evt.allDay;
    document.getElementById('eventCat').value=evt.category||'default';
    document.getElementById('eventRec').value=evt.recurrence?evt.recurrence.freq:'';
  }
  dlg.showModal();
  form.onsubmit=(e)=>{e.preventDefault();}
  form.onclose=()=>{render();}
  form.addEventListener('click',function(ev){
    const val=ev.target.value;
    if(val==='save'){
      saveEventFromForm();
      dlg.close();
    }else if(val==='delete'){
      deleteEvent(id);
      dlg.close();
    }
 },{once:true});
}

function saveEventFromForm(){
  const evts=loadEvents();
  const id=document.getElementById('eventId').value || Date.now();
  const obj={
    id:Number(id),
    title:document.getElementById('eventTitle').value,
    start:new Date(document.getElementById('eventStart').value).toISOString(),
    end:new Date(document.getElementById('eventEnd').value||document.getElementById('eventStart').value).toISOString(),
    allDay:document.getElementById('eventAllDay').checked,
    category:document.getElementById('eventCat').value
  };
  const rec=document.getElementById('eventRec').value;
  if(rec){
    obj.recurrence={freq:rec,interval:1};
  }
  const existing=evts.findIndex(e=>e.id==id);
  if(existing>-1)evts[existing]=obj;else evts.push(obj);
  saveEvents(evts);
}

function deleteEvent(id){
  let evts=loadEvents();
  evts=evts.filter(e=>e.id!==id);
  saveEvents(evts);
}

/* ===== Workday calc ===== */
function openWorkdayCalc(){
  const dlg=document.getElementById('workdayDialog');
  dlg.showModal();
  document.getElementById('wdResult').textContent='';
  dlg.addEventListener('click',function(ev){
    if(ev.target.value==='calc'){
      const s=new Date(document.getElementById('wdStart').value);
      const e=new Date(document.getElementById('wdEnd').value);
      const holidays=bulgarianHolidays(s.getFullYear()).concat(bulgarianHolidays(e.getFullYear()));
      let count=0,cur=new Date(s);
      while(cur<=e){
        const dow=cur.getDay();
        if(dow!==0&&dow!==6&&!isHoliday(cur,holidays))count++;
        cur.setDate(cur.getDate()+1);
      }
      document.getElementById('wdResult').textContent='Работни дни: '+count;
    }
  },{once:true});
}

/* ===== Navigation handlers ===== */
function setView(v){
  currentView=v;document.getElementById('viewSelect').value=v;render();
}
document.getElementById('viewSelect').onchange=e=>{setView(e.target.value);}
document.getElementById('todayBtn').onclick=()=>{currentDate=new Date();render();}
document.getElementById('prevBtn').onclick=()=>{navigate(-1);}
document.getElementById('nextBtn').onclick=()=>{navigate(1);}
function navigate(step){
  if(currentView==='year')currentDate.setFullYear(currentDate.getFullYear()+step);
  else if(currentView==='month')currentDate.setMonth(currentDate.getMonth()+step);
  else if(currentView==='week')currentDate.setDate(currentDate.getDate()+7*step);
  else currentDate.setDate(currentDate.getDate()+step);
  render();
}
document.getElementById('addBtn').onclick=()=>openEventDialog();
document.getElementById('searchInput').oninput=function(){
  const term=this.value.toLowerCase();
  const evts=loadEvents().filter(e=>e.title.toLowerCase().includes(term));
  const list=document.createElement('div');
  if(evts.length){
    const tbl=document.createElement('table');
    tbl.innerHTML='<tr><th>Събитие</th><th>Начало</th></tr>';
    evts.forEach(e=>{
      const tr=document.createElement('tr');
      tr.innerHTML='<td>'+e.title+'</td><td>'+formatDate(new Date(e.start),{day:'2-digit',month:'2-digit',year:'numeric'})+'</td>';
      tbl.appendChild(tr);
    });
    list.appendChild(tbl);
  }else list.textContent='Няма резултати';
  const cont=document.getElementById('view-container');
  cont.innerHTML='';
  cont.appendChild(list);
};

/* init */
render();
</script>
</body>
</html>
