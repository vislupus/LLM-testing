<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gas Statistical Mechanics Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            width: 280px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.1);
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #66ccff;
            text-shadow: 0 0 10px #66ccff;
            font-size: 14px;
        }
        
        .control-group {
            margin: 12px 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #88ddff;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
            accent-color: #66ccff;
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #66ccff;
        }
        
        button {
            background: linear-gradient(135deg, #0066cc, #00aaff);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px 3px 3px 0;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #00aaff, #00ddff);
            box-shadow: 0 2px 15px rgba(100, 200, 255, 0.5);
        }
        
        .value-display {
            color: #00ffff;
            float: right;
            font-weight: bold;
        }
        
        .stat-value {
            color: #ffdd00;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }
        
        #stats {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            width: 250px;
            border: 1px solid rgba(255, 200, 100, 0.3);
            box-shadow: 0 0 20px rgba(255, 200, 100, 0.1);
        }
        
        #stats h3 {
            margin: 0 0 10px 0;
            color: #ffaa66;
            text-shadow: 0 0 10px #ffaa66;
            font-size: 14px;
        }
        
        .key {
            display: inline-block;
            background: rgba(100, 200, 255, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            border: 1px solid rgba(100, 200, 255, 0.4);
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>⚛️ Gas Simulation Controls</h3>
        
        <div class="control-group">
            <strong>🎮 Keyboard Controls:</strong><br>
            <span class="key">Space</span> Pause/Resume<br>
            <span class="key">R</span> Reset simulation<br>
            <span class="key">C</span> Toggle collisions<br>
            <span class="key">T</span> Toggle trails<br>
            <span class="key">H</span> Heat system<br>
            <span class="key">K</span> Cool system
        </div>
        
        <div class="control-group">
            <label>Number of Particles:
                <span class="value-display" id="particleCountVal">100</span>
            </label>
            <input type="range" id="particleCount" min="10" max="500" value="100" step="10">
            
            <label>Temperature (K):
                <span class="value-display" id="temperatureVal">300</span>
            </label>
            <input type="range" id="temperature" min="50" max="1000" value="300" step="10">
        </div>
        
        <div class="control-group">
            <label>Box Width:
                <span class="value-display" id="boxWidthVal">600</span>
            </label>
            <input type="range" id="boxWidth" min="300" max="800" value="600" step="50">
            
            <label>Box Height:
                <span class="value-display" id="boxHeightVal">400</span>
            </label>
            <input type="range" id="boxHeight" min="200" max="600" value="400" step="50">
        </div>
        
        <div class="control-group">
            <label>Particle Radius:
                <span class="value-display" id="radiusVal">3</span>
            </label>
            <input type="range" id="particleRadius" min="1" max="10" value="3" step="0.5">
            
            <label>Mass Ratio (Heavy/Light):
                <span class="value-display" id="massRatioVal">1.0</span>
            </label>
            <input type="range" id="massRatio" min="1" max="10" value="1" step="0.5">
        </div>
        
        <div class="control-group">
            <label>Heavy Particle Fraction:
                <span class="value-display" id="heavyFractionVal">0.0</span>
            </label>
            <input type="range" id="heavyFraction" min="0" max="1" value="0" step="0.1">
        </div>
        
        <div class="control-group">
            <label><input type="checkbox" id="collisionsEnabled" checked> Enable Collisions</label>
            <label><input type="checkbox" id="showTrails"> Show Trails</label>
            <label><input type="checkbox" id="showVelocities"> Show Velocities</label>
            <label><input type="checkbox" id="showHistogram" checked> Show Speed Distribution</label>
        </div>
        
        <div class="control-group">
            <button onclick="resetSimulation()">Reset</button>
            <button onclick="togglePause()">Pause</button>
            <button onclick="addHeat()">Add Heat</button>
            <button onclick="removeHeat()">Cool Down</button>
        </div>
    </div>
    
    <div id="stats">
        <h3>📊 Statistical Properties</h3>
        <div>Temperature: <span class="stat-value" id="measuredTemp">0</span> K</div>
        <div>Mean Speed: <span class="stat-value" id="meanSpeed">0</span> px/s</div>
        <div>RMS Speed: <span class="stat-value" id="rmsSpeed">0</span> px/s</div>
        <div>Pressure: <span class="stat-value" id="pressure">0</span> units</div>
        <div>Mean Free Path: <span class="stat-value" id="meanFreePath">0</span> px</div>
        <div>Total KE: <span class="stat-value" id="totalKE">0</span></div>
        <div>Collisions/s: <span class="stat-value" id="collisionRate">0</span></div>
    </div>

    <script>
        // Constants
        const k_B = 1; // Boltzmann constant (simplified units)
        const timeStep = 0.016; // ~60 FPS
        
        class Particle {
            constructor(x, y, vx, vy, mass, radius, isHeavy = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.isHeavy = isHeavy;
                this.trail = [];
                this.maxTrailLength = 20;
                this.collisionCount = 0;
            }
            
            update(dt, boxWidth, boxHeight) {
                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                
                // Wall collisions (perfectly elastic)
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx = Math.abs(this.vx);
                    this.recordWallCollision('left');
                } else if (this.x + this.radius > boxWidth) {
                    this.x = boxWidth - this.radius;
                    this.vx = -Math.abs(this.vx);
                    this.recordWallCollision('right');
                }
                
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy = Math.abs(this.vy);
                    this.recordWallCollision('top');
                } else if (this.y + this.radius > boxHeight) {
                    this.y = boxHeight - this.radius;
                    this.vy = -Math.abs(this.vy);
                    this.recordWallCollision('bottom');
                }
                
                // Update trail
                if (frameCount % 2 === 0) {
                    this.trail.push({x: this.x, y: this.y});
                    if (this.trail.length > this.maxTrailLength) {
                        this.trail.shift();
                    }
                }
            }
            
            recordWallCollision(wall) {
                // Record momentum transfer for pressure calculation
                let impulse = 0;
                if (wall === 'left' || wall === 'right') {
                    impulse = 2 * this.mass * Math.abs(this.vx);
                } else {
                    impulse = 2 * this.mass * Math.abs(this.vy);
                }
                sim.wallImpulses[wall] += impulse;
            }
            
            getSpeed() {
                return Math.sqrt(this.vx * this.vx + this.vy * this.vy);
            }
            
            getKineticEnergy() {
                return 0.5 * this.mass * this.getSpeed() * this.getSpeed();
            }
        }
        
        class GasSimulation {
            constructor() {
                this.particles = [];
                this.boxWidth = 600;
                this.boxHeight = 400;
                this.collisionsEnabled = true;
                this.showTrails = false;
                this.showVelocities = false;
                this.showHistogram = true;
                this.isPaused = false;
                this.particleRadius = 3;
                this.massRatio = 1;
                this.heavyFraction = 0;
                
                // Statistics
                this.wallImpulses = {left: 0, right: 0, top: 0, bottom: 0};
                this.collisionCount = 0;
                this.speedHistogram = new Array(50).fill(0);
                this.maxwellBoltzmannCurve = [];
                
                // Spatial partitioning for efficient collision detection
                this.cellSize = 20;
                this.grid = {};
            }
            
            initializeParticles(count, temperature) {
                this.particles = [];
                
                // Calculate speed from temperature
                const lightMass = 1;
                const heavyMass = lightMass * this.massRatio;
                const meanSpeedLight = Math.sqrt(2 * k_B * temperature / lightMass);
                const meanSpeedHeavy = Math.sqrt(2 * k_B * temperature / heavyMass);
                
                for (let i = 0; i < count; i++) {
                    // Random position avoiding walls
                    let x = random(this.particleRadius * 2, this.boxWidth - this.particleRadius * 2);
                    let y = random(this.particleRadius * 2, this.boxHeight - this.particleRadius * 2);
                    
                    // Check for overlap with existing particles
                    let attempts = 0;
                    while (attempts < 100) {
                        let overlap = false;
                        for (let p of this.particles) {
                            let dx = x - p.x;
                            let dy = y - p.y;
                            if (dx * dx + dy * dy < 4 * this.particleRadius * this.particleRadius) {
                                overlap = true;
                                break;
                            }
                        }
                        if (!overlap) break;
                        x = random(this.particleRadius * 2, this.boxWidth - this.particleRadius * 2);
                        y = random(this.particleRadius * 2, this.boxHeight - this.particleRadius * 2);
                        attempts++;
                    }
                    
                    // Determine if heavy or light particle
                    const isHeavy = i < count * this.heavyFraction;
                    const mass = isHeavy ? heavyMass : lightMass;
                    const meanSpeed = isHeavy ? meanSpeedHeavy : meanSpeedLight;
                    
                    // Maxwell-Boltzmann distribution for speed
                    let speed = this.maxwellBoltzmannSpeed(meanSpeed);
                    let angle = random(TWO_PI);
                    
                    let vx = speed * cos(angle);
                    let vy = speed * sin(angle);
                    
                    this.particles.push(new Particle(x, y, vx, vy, mass, this.particleRadius, isHeavy));
                }
            }
            
            maxwellBoltzmannSpeed(meanSpeed) {
                // Box-Muller transform for normal distribution
                let u1 = random();
                let u2 = random();
                let z = sqrt(-2 * log(u1)) * cos(TWO_PI * u2);
                return abs(meanSpeed * (1 + z * 0.5));
            }
            
            updateGrid() {
                this.grid = {};
                for (let p of this.particles) {
                    let cellX = Math.floor(p.x / this.cellSize);
                    let cellY = Math.floor(p.y / this.cellSize);
                    let key = `${cellX},${cellY}`;
                    
                    if (!this.grid[key]) this.grid[key] = [];
                    this.grid[key].push(p);
                }
            }
            
            checkCollisions() {
                if (!this.collisionsEnabled) return;
                
                this.updateGrid();
                
                // Check collisions using spatial partitioning
                for (let key in this.grid) {
                    let cell = this.grid[key];
                    let [cx, cy] = key.split(',').map(Number);
                    
                    // Check within cell and neighboring cells
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            let neighborKey = `${cx + dx},${cy + dy}`;
                            let neighborCell = this.grid[neighborKey];
                            
                            if (neighborCell) {
                                for (let i = 0; i < cell.length; i++) {
                                    for (let j = (dx === 0 && dy === 0) ? i + 1 : 0; j < neighborCell.length; j++) {
                                        this.handleCollision(cell[i], neighborCell[j]);
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            handleCollision(p1, p2) {
                let dx = p2.x - p1.x;
                let dy = p2.y - p1.y;
                let distSq = dx * dx + dy * dy;
                let minDist = p1.radius + p2.radius;
                
                if (distSq < minDist * minDist && distSq > 0) {
                    let dist = Math.sqrt(distSq);
                    
                    // Normalize collision vector
                    dx /= dist;
                    dy /= dist;
                    
                    // Relative velocity
                    let dvx = p2.vx - p1.vx;
                    let dvy = p2.vy - p1.vy;
                    let dvDotDr = dvx * dx + dvy * dy;
                    
                    // Only resolve if particles are approaching
                    if (dvDotDr < 0) {
                        // Conservation of momentum and energy (elastic collision)
                        let reducedMass = 2 * p1.mass * p2.mass / (p1.mass + p2.mass);
                        let impulse = reducedMass * dvDotDr;
                        
                        p1.vx += impulse * dx / p1.mass;
                        p1.vy += impulse * dy / p1.mass;
                        p2.vx -= impulse * dx / p2.mass;
                        p2.vy -= impulse * dy / p2.mass;
                        
                        // Separate overlapping particles
                        let overlap = minDist - dist;
                        let separationX = dx * overlap * 0.5;
                        let separationY = dy * overlap * 0.5;
                        
                        p1.x -= separationX;
                        p1.y -= separationY;
                        p2.x += separationX;
                        p2.y += separationY;
                        
                        this.collisionCount++;
                        p1.collisionCount++;
                        p2.collisionCount++;
                    }
                }
            }
            
            update(dt) {
                if (this.isPaused) return;
                
                // Reset wall impulses for pressure calculation
                this.wallImpulses = {left: 0, right: 0, top: 0, bottom: 0};
                
                // Update particles
                for (let p of this.particles) {
                    p.update(dt, this.boxWidth, this.boxHeight);
                }
                
                // Check collisions
                this.checkCollisions();
                
                // Update statistics
                this.updateStatistics();
            }
            
            updateStatistics() {
                // Calculate temperature from kinetic energy
                let totalKE = 0;
                let speeds = [];
                
                for (let p of this.particles) {
                    totalKE += p.getKineticEnergy();
                    speeds.push(p.getSpeed());
                }
                
                // Temperature (2D: KE = N*k*T for N particles)
                let measuredTemp = totalKE / (this.particles.length * k_B);
                
                // Mean and RMS speeds
                let meanSpeed = speeds.reduce((a, b) => a + b, 0) / speeds.length;
                let rmsSpeed = Math.sqrt(speeds.reduce((a, b) => a + b * b, 0) / speeds.length);
                
                // Pressure from wall collisions
                let perimeter = 2 * (this.boxWidth + this.boxHeight);
                let totalImpulse = Object.values(this.wallImpulses).reduce((a, b) => a + b, 0);
                let pressure = totalImpulse / (perimeter * timeStep);
                
                // Mean free path estimation
                let density = this.particles.length / (this.boxWidth * this.boxHeight);
                let crossSection = Math.PI * (2 * this.particleRadius) * (2 * this.particleRadius);
                let meanFreePath = 1 / (Math.sqrt(2) * density * crossSection);
                
                // Update speed histogram
                this.speedHistogram = new Array(50).fill(0);
                let maxSpeed = Math.max(...speeds);
                for (let speed of speeds) {
                    let bin = Math.floor((speed / maxSpeed) * 49);
                    this.speedHistogram[bin]++;
                }
                
                // Generate Maxwell-Boltzmann curve for comparison
                this.maxwellBoltzmannCurve = [];
                for (let i = 0; i < 50; i++) {
                    let v = (i / 49) * maxSpeed;
                    let prob = (v / (measuredTemp * k_B)) * Math.exp(-v * v / (2 * k_B * measuredTemp));
                    this.maxwellBoltzmannCurve.push(prob);
                }
                
                // Normalize curves
                let maxHist = Math.max(...this.speedHistogram);
                let maxMB = Math.max(...this.maxwellBoltzmannCurve);
                if (maxMB > 0) {
                    this.maxwellBoltzmannCurve = this.maxwellBoltzmannCurve.map(v => v * maxHist / maxMB);
                }
                
                // Update display
                document.getElementById('measuredTemp').textContent = measuredTemp.toFixed(1);
                document.getElementById('meanSpeed').textContent = meanSpeed.toFixed(1);
                document.getElementById('rmsSpeed').textContent = rmsSpeed.toFixed(1);
                document.getElementById('pressure').textContent = pressure.toFixed(2);
                document.getElementById('meanFreePath').textContent = meanFreePath.toFixed(1);
                document.getElementById('totalKE').textContent = totalKE.toFixed(1);
                document.getElementById('collisionRate').textContent = 
                    (this.collisionCount * 60).toFixed(0); // per second
                
                this.collisionCount = 0; // Reset for next frame
            }
            
            render() {
                push();
                translate((width - this.boxWidth) / 2, (height - this.boxHeight) / 2);
                
                // Draw box
                stroke(100, 200, 255);
                strokeWeight(2);
                noFill();
                rect(0, 0, this.boxWidth, this.boxHeight);
                
                // Draw particles
                for (let p of this.particles) {
                    // Trail
                    if (this.showTrails && p.trail.length > 1) {
                        noFill();
                        stroke(100, 100, 255, 50);
                        strokeWeight(1);
                        beginShape();
                        for (let point of p.trail) {
                            vertex(point.x, point.y);
                        }
                        endShape();
                    }
                    
                    // Particle
                    noStroke();
                    if (p.isHeavy) {
                        fill(255, 100, 100); // Red for heavy
                    } else {
                        fill(100, 200, 255); // Blue for light
                    }
                    
                    // Color by speed
                    let speed = p.getSpeed();
                    let brightness = map(speed, 0, 200, 50, 255);
                    if (p.isHeavy) {
                        fill(255, brightness * 0.5, brightness * 0.5);
                    } else {
                        fill(brightness * 0.5, brightness * 0.8, brightness);
                    }
                    
                    ellipse(p.x, p.y, p.radius * 2);
                    
                    // Velocity vector
                    if (this.showVelocities) {
                        stroke(255, 255, 0, 100);
                        strokeWeight(1);
                        let scale = 0.2;
                        line(p.x, p.y, p.x + p.vx * scale, p.y + p.vy * scale);
                    }
                }
                
                pop();
                
                // Draw histogram
                if (this.showHistogram) {
                    this.drawHistogram();
                }
            }
            
            drawHistogram() {
                push();
                translate(width - 250, height - 180);
                
                // Background
                fill(0, 0, 0, 200);
                noStroke();
                rect(-10, -10, 240, 170, 5);
                
                // Title
                fill(255, 200, 100);
                textSize(11);
                text("Speed Distribution", 50, 0);
                
                // Axes
                stroke(255, 255, 255, 100);
                strokeWeight(1);
                line(0, 140, 200, 140);
                line(0, 20, 0, 140);
                
                // Draw histogram bars
                let barWidth = 200 / this.speedHistogram.length;
                noStroke();
                fill(100, 200, 255, 150);
                for (let i = 0; i < this.speedHistogram.length; i++) {
                    let barHeight = map(this.speedHistogram[i], 0, Math.max(...this.speedHistogram), 0, 100);
                    rect(i * barWidth, 140 - barHeight, barWidth - 1, barHeight);
                }
                
                // Draw Maxwell-Boltzmann curve
                stroke(255, 100, 100);
                strokeWeight(2);
                noFill();
                beginShape();
                for (let i = 0; i < this.maxwellBoltzmannCurve.length; i++) {
                    let x = (i / this.maxwellBoltzmannCurve.length) * 200;
                    let y = 140 - map(this.maxwellBoltzmannCurve[i], 0, Math.max(...this.speedHistogram), 0, 100);
                    vertex(x, y);
                }
                endShape();
                
                // Legend
                fill(100, 200, 255);
                text("Observed", 10, 160);
                fill(255, 100, 100);
                text("Maxwell-Boltzmann", 80, 160);
                
                pop();
            }
        }
        
        // Global variables
        let sim;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            sim = new GasSimulation();
            sim.initializeParticles(100, 300);
            setupControls();
        }
        
        function draw() {
            background(10, 10, 20);
            
            sim.update(timeStep);
            sim.render();
            
            // Display title
            fill(255);
            textAlign(CENTER);
            textSize(16);
            text("2D Ideal Gas Simulation", width / 2, 30);
            textSize(12);
            text("Statistical Mechanics Demonstration", width / 2, 50);
        }
        
        function setupControls() {
            // Particle count
            document.getElementById('particleCount').addEventListener('input', function(e) {
                let count = parseInt(e.target.value);
                document.getElementById('particleCountVal').textContent = count;
                let temp = parseFloat(document.getElementById('temperature').value);
                sim.initializeParticles(count, temp);
            });
            
            // Temperature
            document.getElementById('temperature').addEventListener('input', function(e) {
                let temp = parseFloat(e.target.value);
                document.getElementById('temperatureVal').textContent = temp;
                let count = parseInt(document.getElementById('particleCount').value);
                sim.initializeParticles(count, temp);
            });
            
            // Box dimensions
            document.getElementById('boxWidth').addEventListener('input', function(e) {
                sim.boxWidth = parseInt(e.target.value);
                document.getElementById('boxWidthVal').textContent = sim.boxWidth;
            });
            
            document.getElementById('boxHeight').addEventListener('input', function(e) {
                sim.boxHeight = parseInt(e.target.value);
                document.getElementById('boxHeightVal').textContent = sim.boxHeight;
            });
            
            // Particle properties
            document.getElementById('particleRadius').addEventListener('input', function(e) {
                sim.particleRadius = parseFloat(e.target.value);
                document.getElementById('radiusVal').textContent = sim.particleRadius;
                for (let p of sim.particles) {
                    p.radius = sim.particleRadius;
                }
            });
            
            document.getElementById('massRatio').addEventListener('input', function(e) {
                sim.massRatio = parseFloat(e.target.value);
                document.getElementById('massRatioVal').textContent = sim.massRatio.toFixed(1);
            });
            
            document.getElementById('heavyFraction').addEventListener('input', function(e) {
                sim.heavyFraction = parseFloat(e.target.value);
                document.getElementById('heavyFractionVal').textContent = sim.heavyFraction.toFixed(1);
                let count = parseInt(document.getElementById('particleCount').value);
                let temp = parseFloat(document.getElementById('temperature').value);
                sim.initializeParticles(count, temp);
            });
            
            // Checkboxes
            document.getElementById('collisionsEnabled').addEventListener('change', function(e) {
                sim.collisionsEnabled = e.target.checked;
            });
            
            document.getElementById('showTrails').addEventListener('change', function(e) {
                sim.showTrails = e.target.checked;
            });
            
            document.getElementById('showVelocities').addEventListener('change', function(e) {
                sim.showVelocities = e.target.checked;
            });
            
            document.getElementById('showHistogram').addEventListener('change', function(e) {
                sim.showHistogram = e.target.checked;
            });
        }
        
        function keyPressed() {
            switch(key.toLowerCase()) {
                case ' ':
                    togglePause();
                    break;
                case 'r':
                    resetSimulation();
                    break;
                case 'c':
                    sim.collisionsEnabled = !sim.collisionsEnabled;
                    document.getElementById('collisionsEnabled').checked = sim.collisionsEnabled;
                    break;
                case 't':
                    sim.showTrails = !sim.showTrails;
                    document.getElementById('showTrails').checked = sim.showTrails;
                    break;
                case 'h':
                    addHeat();
                    break;
                case 'k':
                    removeHeat();
                    break;
            }
        }
        
        function resetSimulation() {
            let count = parseInt(document.getElementById('particleCount').value);
            let temp = parseFloat(document.getElementById('temperature').value);
            sim.initializeParticles(count, temp);
        }
        
        function togglePause() {
            sim.isPaused = !sim.isPaused;
        }
        
        function addHeat() {
            // Increase all particle speeds by 20%
            for (let p of sim.particles) {
                p.vx *= 1.2;
                p.vy *= 1.2;
            }
        }
        
        function removeHeat() {
            // Decrease all particle speeds by 20%
            for (let p of sim.particles) {
                p.vx *= 0.8;
                p.vy *= 0.8;
            }
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
