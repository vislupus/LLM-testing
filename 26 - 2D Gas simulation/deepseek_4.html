<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gas Simulation – Statistical Mechanics</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js">
    </script>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: #16213e;
            --text: #e0e0e0;
            --accent: #e94560;
            --accent2: #0f3460;
            --border: #2a2a4a;
            --gold: #f0a500;
            --radius: 6px;
            --font: 'Segoe UI', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }
        .header {
            background: var(--panel-bg);
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            min-height: 38px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .header .badge {
            font-size: 0.7rem;
            background: var(--accent);
            color: #fff;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        #simContainer {
            flex: 1;
            position: relative;
            background: #0a0a18;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }
        #simContainer canvas {
            display: block;
            border-radius: 4px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .sidebar {
            width: 300px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex-shrink: 0;
            font-size: 12px;
        }
        .sidebar h3 {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .control-group label {
            font-size: 0.7rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .control-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .control-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .control-row input[type="number"] {
            width: 52px;
            padding: 3px 5px;
            border-radius: 3px;
            border: 1px solid var(--border);
            background: #0a0a20;
            color: #fff;
            font-size: 0.75rem;
            text-align: center;
            font-family: var(--font);
        }
        .control-row span {
            font-size: 0.7rem;
            color: #ccc;
            min-width: 28px;
            text-align: right;
        }
        button {
            padding: 6px 12px;
            border-radius: var(--radius);
            border: none;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: 0.15s;
            font-family: var(--font);
            letter-spacing: 0.3px;
        }
        button.accent {
            background: var(--accent);
            color: #fff;
        }
        button.accent:hover {
            background: #ff5a75;
        }
        button.secondary {
            background: var(--accent2);
            color: #ddd;
            border: 1px solid var(--border);
        }
        button.secondary:hover {
            background: #1a4a7a;
        }
        .stats-box {
            background: #0a0a20;
            border-radius: var(--radius);
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
        }
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 55px;
        }
        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        .stat-label {
            font-size: 0.6rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        #histogramCanvas {
            width: 100%;
            height: 160px;
            background: #0a0a20;
            border-radius: var(--radius);
            display: block;
        }
        hr {
            border-color: var(--border);
            margin: 2px 0;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-row input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .main-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 40vh;
                flex-shrink: 1;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚛️ 2D Gas Simulation</h1>
        <span class="badge">Statistical Mechanics</span>
        <span style="font-size:0.7rem;color:#888;margin-left:auto;">Elastic collisions · MB distribution · Real-time</span>
    </div>
    <div class="main-layout">
        <div id="simContainer"></div>
        <div class="sidebar" id="sidebar">
            <h3>📐 Parameters</h3>
            <div class="control-group">
                <label>Particles: <span id="nVal">200</span></label>
                <div class="control-row">
                    <input type="range" id="numParticles" min="10" max="600" value="200" step="10">
                    <input type="number" id="numParticlesNum" value="200" min="10" max="600">
                </div>
            </div>
            <div class="control-group">
                <label>Temperature: <span id="tVal">200</span></label>
                <div class="control-row">
                    <input type="range" id="initTemp" min="20" max="800" value="200" step="10">
                    <input type="number" id="initTempNum" value="200" min="20" max="800">
                </div>
            </div>
            <div class="control-group">
                <label>Mass ratio (heavy/light): <span id="mrVal">4.0</span></label>
                <div class="control-row">
                    <input type="range" id="massRatio" min="1" max="10" value="4" step="0.5">
                    <span id="mrDisplay">4.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>Particle radius: <span id="radVal">7</span> px</label>
                <div class="control-row">
                    <input type="range" id="particleRadius" min="3" max="18" value="7" step="1">
                    <span id="radDisplay">7</span>
                </div>
            </div>
            <div class="toggle-row">
                <input type="checkbox" id="collisionsEnabled" checked>
                <label style="font-size:0.75rem;color:#ddd;">Enable inter-particle collisions</label>
            </div>
            <hr>
            <div class="control-row" style="gap:6px;flex-wrap:wrap;">
                <button class="accent" id="btnReset">🔄 Reset</button>
                <button class="secondary" id="btnAddEnergy">🔥 Add Energy</button>
                <button class="secondary" id="btnCool">❄️ Cool</button>
            </div>
            <hr>
            <h3>📊 Live Measurements</h3>
            <div class="stats-box">
                <div class="stat-item">
                    <span class="stat-value" id="tempDisplay">200</span>
                    <span class="stat-label">Temp (kT)</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="pressureDisplay">0.00</span>
                    <span class="stat-label">Pressure</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="keDisplay">0.00</span>
                    <span class="stat-label">Avg KE</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="speedDisplay">0.0</span>
                    <span class="stat-label">Mean speed</span>
                </div>
            </div>
            <label style="font-size:0.7rem;color:#aaa;text-transform:uppercase;letter-spacing:0.4px;">Speed Distribution + MB Curve</label>
            <canvas id="histogramCanvas" width="280" height="160"></canvas>
        </div>
    </div>

    <script>
        // ==================== GLOBAL STATE ====================
        let particles = [];
        let boxW = 0;
        let boxH = 0;
        let numParticles = 200;
        let initTemperature = 200;
        let massRatio = 4.0;
        let particleRadius = 7;
        let collisionsEnabled = true;
        let wallImpulseAccum = { left: 0, right: 0, top: 0, bottom: 0 };
        let smoothedPressure = 0;
        let frameCountSincePressureReset = 0;
        const pressureSmoothing = 0.92;
        let spatialGrid = [];
        let cellSize = 30;
        let gridCols = 0;
        let gridRows = 0;

        // Speed histogram data
        let speedHistBins = [];
        const histBinCount = 40;
        let maxSpeedForHist = 50;

        // Temperature & pressure history for mini-graph
        let tempHistory = [];
        let pressureHistory = [];
        const maxHistory = 150;

        // ==================== HELPER FUNCTIONS ====================
        function getCellSize() {
            return Math.max(particleRadius * 2.2, 20);
        }

        function buildSpatialGrid() {
            cellSize = getCellSize();
            gridCols = Math.max(1, Math.floor(boxW / cellSize));
            gridRows = Math.max(1, Math.floor(boxH / cellSize));
            spatialGrid = new Array(gridCols * gridRows);
            for (let i = 0; i < spatialGrid.length; i++) spatialGrid[i] = [];
            for (const p of particles) {
                const cx = Math.min(gridCols - 1, Math.max(0, Math.floor(p.x / cellSize)));
                const cy = Math.min(gridRows - 1, Math.max(0, Math.floor(p.y / cellSize)));
                spatialGrid[cy * gridCols + cx].push(p);
            }
        }

        function getNeighborCells(cx, cy) {
            const cells = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    const nx = cx + dx;
                    const ny = cy + dy;
                    if (nx >= 0 && nx < gridCols && ny >= 0 && ny < gridRows) {
                        cells.push(ny * gridCols + nx);
                    }
                }
            }
            return cells;
        }

        // ==================== PARTICLE CLASS ====================
        class Particle {
            constructor(x, y, vx, vy, mass, radius, species) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.species = species; // 'light' or 'heavy'
            }
            speed() { return Math.sqrt(this.vx * this.vx + this.vy * this.vy); }
            kineticEnergy() { return 0.5 * this.mass * (this.vx * this.vx + this.vy * this.vy); }
        }

        // ==================== INITIALIZATION ====================
        function createParticles(count, temp, radius, ratio) {
            const newParticles = [];
            const lightMass = 1.0;
            const heavyMass = ratio;
            const halfCount = Math.floor(count / 2);

            for (let i = 0; i < count; i++) {
                const isHeavy = i >= halfCount;
                const mass = isHeavy ? heavyMass : lightMass;
                const species = isHeavy ? 'heavy' : 'light';
                const stdDev = Math.sqrt(temp / mass);
                const vx = gaussianRandom(0, stdDev);
                const vy = gaussianRandom(0, stdDev);
                const r = radius;

                let px, py;
                let attempts = 0;
                const maxAttempts = 2000;
                let validPosition = false;
                while (attempts < maxAttempts) {
                    px = r + Math.random() * (boxW - 2 * r);
                    py = r + Math.random() * (boxH - 2 * r);
                    validPosition = true;
                    for (const other of newParticles) {
                        const dx = px - other.x;
                        const dy = py - other.y;
                        const minDist = r + other.radius;
                        if (dx * dx + dy * dy < minDist * minDist) {
                            validPosition = false;
                            break;
                        }
                    }
                    if (validPosition) break;
                    attempts++;
                }
                if (!validPosition) {
                    px = r + Math.random() * (boxW - 2 * r);
                    py = r + Math.random() * (boxH - 2 * r);
                }
                newParticles.push(new Particle(px, py, vx, vy, mass, r, species));
            }
            return newParticles;
        }

        function gaussianRandom(mean, stdDev) {
            let u1, u2;
            do { u1 = Math.random(); } while (u1 === 0);
            u2 = Math.random();
            const z = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            return mean + z * stdDev;
        }

        function resetSimulation() {
            particles = createParticles(numParticles, initTemperature, particleRadius, massRatio);
            wallImpulseAccum = { left: 0, right: 0, top: 0, bottom: 0 };
            smoothedPressure = 0;
            frameCountSincePressureReset = 0;
            tempHistory = [];
            pressureHistory = [];
            speedHistBins = new Array(histBinCount).fill(0);
        }

        // ==================== COLLISION HANDLING ====================
        function resolveElasticCollision(p1, p2) {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = p1.radius + p2.radius;
            if (dist >= minDist || dist < 1e-9) return;

            // Normal vector
            const nx = dx / dist;
            const ny = dy / dist;

            // Relative velocity along normal
            const dvx = p1.vx - p2.vx;
            const dvy = p1.vy - p2.vy;
            const dvDotN = dvx * nx + dvy * ny;

            // Only resolve if approaching
            if (dvDotN >= 0) return;

            // Separate particles
            const overlap = minDist - dist;
            const totalMass = p1.mass + p2.mass;
            const sep1 = overlap * (p2.mass / totalMass);
            const sep2 = overlap * (p1.mass / totalMass);
            p1.x += nx * sep1;
            p1.y += ny * sep1;
            p2.x -= nx * sep2;
            p2.y -= ny * sep2;

            // Elastic collision velocity update
            const impulse = (2.0 * dvDotN) / (1.0 / p1.mass + 1.0 / p2.mass);
            p1.vx -= (impulse / p1.mass) * nx;
            p1.vy -= (impulse / p1.mass) * ny;
            p2.vx += (impulse / p2.mass) * nx;
            p2.vy += (impulse / p2.mass) * ny;
        }

        function handleWallCollision(p) {
            const r = p.radius;
            let collided = false;
            if (p.x < r) {
                p.x = r;
                if (p.vx < 0) {
                    wallImpulseAccum.left += 2 * p.mass * Math.abs(p.vx);
                    p.vx = -p.vx;
                }
                collided = true;
            }
            if (p.x > boxW - r) {
                p.x = boxW - r;
                if (p.vx > 0) {
                    wallImpulseAccum.right += 2 * p.mass * Math.abs(p.vx);
                    p.vx = -p.vx;
                }
                collided = true;
            }
            if (p.y < r) {
                p.y = r;
                if (p.vy < 0) {
                    wallImpulseAccum.top += 2 * p.mass * Math.abs(p.vy);
                    p.vy = -p.vy;
                }
                collided = true;
            }
            if (p.y > boxH - r) {
                p.y = boxH - r;
                if (p.vy > 0) {
                    wallImpulseAccum.bottom += 2 * p.mass * Math.abs(p.vy);
                    p.vy = -p.vy;
                }
                collided = true;
            }
            return collided;
        }

        // ==================== PHYSICS UPDATE ====================
        function updatePhysics(dt) {
            // Move particles
            for (const p of particles) {
                p.x += p.vx * dt;
                p.y += p.vy * dt;
            }

            // Wall collisions
            for (const p of particles) {
                handleWallCollision(p);
            }

            // Inter-particle collisions
            if (collisionsEnabled) {
                buildSpatialGrid();
                for (const p of particles) {
                    const cx = Math.min(gridCols - 1, Math.max(0, Math.floor(p.x / cellSize)));
                    const cy = Math.min(gridRows - 1, Math.max(0, Math.floor(p.y / cellSize)));
                    const neighborCells = getNeighborCells(cx, cy);
                    for (const cellIdx of neighborCells) {
                        const cell = spatialGrid[cellIdx];
                        for (const other of cell) {
                            if (other === p) continue;
                            const dx = p.x - other.x;
                            const dy = p.y - other.y;
                            const minDist = p.radius + other.radius;
                            if (dx * dx + dy * dy < minDist * minDist) {
                                resolveElasticCollision(p, other);
                            }
                        }
                    }
                }
            }

            // Update pressure estimate
            frameCountSincePressureReset++;
            const totalImpulse = wallImpulseAccum.left + wallImpulseAccum.right +
                wallImpulseAccum.top + wallImpulseAccum.bottom;
            const perimeter = 2 * (boxW + boxH);
            const instantPressure = (frameCountSincePressureReset > 0 && perimeter > 0) ?
                totalImpulse / (frameCountSincePressureReset * dt * perimeter) : 0;
            if (smoothedPressure === 0) smoothedPressure = instantPressure;
            else smoothedPressure = pressureSmoothing * smoothedPressure + (1 - pressureSmoothing) * instantPressure;
            if (frameCountSincePressureReset >= 30) {
                wallImpulseAccum = { left: 0, right: 0, top: 0, bottom: 0 };
                frameCountSincePressureReset = 0;
            }
        }

        // ==================== MEASUREMENTS ====================
        function computeTemperature() {
            let totalKE = 0;
            for (const p of particles) totalKE += p.kineticEnergy();
            const avgKE = particles.length > 0 ? totalKE / particles.length : 0;
            return avgKE; // In 2D, kT = <KE> for 2 DOF
        }

        function computeSpeedHistogram() {
            speedHistBins = new Array(histBinCount).fill(0);
            if (particles.length === 0) return;
            let maxSpeed = 0;
            const speeds = particles.map(p => p.speed());
            maxSpeed = Math.max(...speeds, 1);
            maxSpeedForHist = maxSpeed * 1.15;
            const binWidth = maxSpeedForHist / histBinCount;
            for (const s of speeds) {
                const bin = Math.min(histBinCount - 1, Math.floor(s / binWidth));
                speedHistBins[bin]++;
            }
            // Normalize to probability density
            const total = particles.length;
            for (let i = 0; i < histBinCount; i++) {
                speedHistBins[i] = speedHistBins[i] / (total * binWidth);
            }
        }

        function maxwellBoltzmann2D(v, m, T) {
            if (T <= 0 || m <= 0) return 0;
            return (m / T) * v * Math.exp(-m * v * v / (2 * T));
        }

        // ==================== RENDERING (p5.js sketch) ====================
        const sketch = (p) => {
            p.setup = function() {
                const container = document.getElementById('simContainer');
                const w = Math.min(container.clientWidth - 4, 900);
                const h = Math.min(container.clientHeight - 4, 560);
                boxW = Math.max(300, w);
                boxH = Math.max(200, h);
                const canvas = p.createCanvas(boxW, boxH);
                canvas.parent('simContainer');
                p.frameRate(60);
                resetSimulation();
                computeSpeedHistogram();
                updateHistogramCanvas();
            };

            p.draw = function() {
                const dt = Math.min(p.deltaTime / 1000, 0.05);
                // Sub-step physics
                const subSteps = 2;
                const subDt = dt / subSteps;
                for (let s = 0; s < subSteps; s++) {
                    updatePhysics(subDt);
                }

                // Compute measurements
                const temperature = computeTemperature();
                const meanSpeed = particles.reduce((sum, p) => sum + p.speed(), 0) / Math.max(1, particles.length);

                // Update history
                tempHistory.push(temperature);
                pressureHistory.push(smoothedPressure);
                if (tempHistory.length > maxHistory) tempHistory.shift();
                if (pressureHistory.length > maxHistory) pressureHistory.shift();

                // Compute speed histogram every 3 frames
                if (p.frameCount % 3 === 0) {
                    computeSpeedHistogram();
                    updateHistogramCanvas();
                }

                // Update UI displays
                updateStatsDisplay(temperature, meanSpeed);

                // ---- DRAW ----
                p.background(10, 10, 25);
                // Box background
                p.noStroke();
                p.fill(18, 18, 40);
                p.rect(0, 0, boxW, boxH);

                // Grid lines
                p.stroke(30, 30, 55, 80);
                p.strokeWeight(0.5);
                const gs = 50;
                for (let gx = gs; gx < boxW; gx += gs) p.line(gx, 0, gx, boxH);
                for (let gy = gs; gy < boxH; gy += gs) p.line(0, gy, boxW, gy);

                // Wall boundaries
                p.stroke(100, 130, 170, 200);
                p.strokeWeight(2);
                p.noFill();
                p.rect(0, 0, boxW, boxH);

                // Draw particles
                p.noStroke();
                for (const pt of particles) {
                    const alpha = p.map(pt.speed(), 0, maxSpeedForHist, 180, 255);
                    if (pt.species === 'heavy') {
                        p.fill(240, 100, 70, alpha);
                    } else {
                        p.fill(70, 160, 240, alpha);
                    }
                    p.ellipse(pt.x, pt.y, pt.radius * 2, pt.radius * 2);
                    // Speed indicator (tiny line)
                    if (pt.speed() > 2) {
                        const angle = Math.atan2(pt.vy, pt.vx);
                        const lx = pt.x + Math.cos(angle) * pt.radius * 0.7;
                        const ly = pt.y + Math.sin(angle) * pt.radius * 0.7;
                        p.stroke(255, 255, 255, 100);
                        p.strokeWeight(1);
                        p.line(pt.x, pt.y, lx, ly);
                        p.noStroke();
                    }
                }

                // Temperature history mini-graph (inset)
                drawHistoryInset(p);

                // Legend
                p.fill(70, 160, 240, 220);
                p.noStroke();
                p.ellipse(20, boxH - 20, 10, 10);
                p.fill(200);
                p.textAlign(p.LEFT, p.CENTER);
                p.textSize(10);
                p.text('Light (m=1)', 28, boxH - 20);
                p.fill(240, 100, 70, 220);
                p.ellipse(120, boxH - 20, 10, 10);
                p.fill(200);
                p.text('Heavy (m=' + massRatio.toFixed(1) + ')', 128, boxH - 20);
                p.textAlign(p.LEFT, p.TOP);
                p.textSize(10);
                p.fill(180);
                p.text('T=' + temperature.toFixed(0) + '  P=' + smoothedPressure.toFixed(2), 20, 20);
            };

            function drawHistoryInset(p) {
                const ix = boxW - 170;
                const iy = 8;
                const iw = 155;
                const ih = 80;
                p.fill(0, 0, 0, 140);
                p.noStroke();
                p.rect(ix, iy, iw, ih, 4);
                p.fill(200);
                p.textSize(9);
                p.textAlign(p.LEFT, p.TOP);
                p.text('Temp history', ix + 6, iy + 3);
                if (tempHistory.length < 2) return;
                const tMin = Math.min(...tempHistory);
                const tMax = Math.max(...tempHistory, tMin + 10);
                const range = tMax - tMin || 1;
                p.stroke(255, 200, 100, 200);
                p.strokeWeight(1.2);
                p.noFill();
                p.beginShape();
                for (let i = 0; i < tempHistory.length; i++) {
                    const sx = ix + 5 + (i / Math.max(1, tempHistory.length - 1)) * (iw - 10);
                    const sy = iy + ih - 8 - ((tempHistory[i] - tMin) / range) * (ih - 22);
                    p.vertex(sx, sy);
                }
                p.endShape();
                p.fill(200);
                p.textSize(8);
                p.text(tMax.toFixed(0), ix + iw - 25, iy + 6);
                p.text(tMin.toFixed(0), ix + iw - 25, iy + ih - 16);
            }

            p.windowResized = function() {
                const container = document.getElementById('simContainer');
                const w = Math.min(container.clientWidth - 4, 900);
                const h = Math.min(container.clientHeight - 4, 560);
                boxW = Math.max(300, w);
                boxH = Math.max(200, h);
                p.resizeCanvas(boxW, boxH);
                // Keep particles inside new box
                for (const pt of particles) {
                    pt.x = Math.min(boxW - pt.radius, Math.max(pt.radius, pt.x));
                    pt.y = Math.min(boxH - pt.radius, Math.max(pt.radius, pt.y));
                }
                resetSimulation();
            };
        };

        // ==================== HISTOGRAM CANVAS ====================
        function updateHistogramCanvas() {
            const histCanvas = document.getElementById('histogramCanvas');
            if (!histCanvas) return;
            const ctx = histCanvas.getContext('2d');
            const w = histCanvas.width;
            const h = histCanvas.height;
            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = '#0a0a20';
            ctx.fillRect(0, 0, w, h);

            if (particles.length === 0 || speedHistBins.length === 0) return;

            const margin = { top: 15, right: 15, bottom: 25, left: 30 };
            const plotW = w - margin.left - margin.right;
            const plotH = h - margin.top - margin.bottom;
            const binWidth = plotW / histBinCount;
            const maxDensity = Math.max(...speedHistBins, 0.001);

            // Draw axes
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, margin.top + plotH);
            ctx.lineTo(margin.left + plotW, margin.top + plotH);
            ctx.stroke();

            // Y-axis label
            ctx.fillStyle = '#aaa';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText('P(v)', margin.left - 4, margin.top - 4);
            ctx.textAlign = 'center';
            ctx.fillText('Speed v', margin.left + plotW / 2, h - 4);

            // Draw histogram bars
            for (let i = 0; i < histBinCount; i++) {
                const barH = (speedHistBins[i] / maxDensity) * plotH;
                const x = margin.left + i * binWidth;
                const y = margin.top + plotH - barH;
                ctx.fillStyle = 'rgba(100,160,220,0.7)';
                ctx.fillRect(x + 1, y, binWidth - 2, barH);
            }

            // Draw Maxwell-Boltzmann theoretical curve
            const temperature = computeTemperature();
            if (temperature > 0) {
                ctx.strokeStyle = '#f0a500';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                let firstPoint = true;
                const lightMass = 1.0;
                const heavyMass = massRatio;
                const fracLight = 0.5;
                const fracHeavy = 0.5;
                for (let i = 0; i <= plotW; i++) {
                    const v = (i / plotW) * maxSpeedForHist;
                    let pdf = fracLight * maxwellBoltzmann2D(v, lightMass, temperature) +
                        fracHeavy * maxwellBoltzmann2D(v, heavyMass, temperature);
                    pdf = Math.max(0, pdf);
                    const px = margin.left + i;
                    const py = margin.top + plotH - (pdf / maxDensity) * plotH;
                    if (py > margin.top + plotH) { firstPoint = true; continue; }
                    if (firstPoint) { ctx.moveTo(px, py);
                        firstPoint = false; } else ctx.lineTo(px, py);
                }
                ctx.stroke();
                ctx.setLineDash([]);

                // Legend
                ctx.fillStyle = '#f0a500';
                ctx.font = '9px sans-serif';
                ctx.textAlign = 'left';
                ctx.fillText('MB curve', margin.left + 4, margin.top + 10);
                ctx.fillStyle = 'rgba(100,160,220,0.9)';
                ctx.fillRect(margin.left + 4, margin.top + 14, 10, 6);
                ctx.fillStyle = '#ccc';
                ctx.fillText('Data', margin.left + 17, margin.top + 20);
            }

            // X-axis ticks
            ctx.fillStyle = '#888';
            ctx.font = '8px sans-serif';
            ctx.textAlign = 'center';
            const numXTicks = 5;
            for (let i = 0; i <= numXTicks; i++) {
                const v = (i / numXTicks) * maxSpeedForHist;
                const x = margin.left + (i / numXTicks) * plotW;
                ctx.fillText(v.toFixed(0), x, margin.top + plotH + 12);
            }
        }

        function updateStatsDisplay(temperature, meanSpeed) {
            document.getElementById('tempDisplay').textContent = temperature.toFixed(0);
            document.getElementById('pressureDisplay').textContent = smoothedPressure.toFixed(2);
            document.getElementById('keDisplay').textContent = temperature.toFixed(1);
            document.getElementById('speedDisplay').textContent = meanSpeed.toFixed(1);
        }

        // ==================== UI EVENT HANDLERS ====================
        function syncUI() {
            document.getElementById('numParticles').value = numParticles;
            document.getElementById('numParticlesNum').value = numParticles;
            document.getElementById('nVal').textContent = numParticles;
            document.getElementById('initTemp').value = initTemperature;
            document.getElementById('initTempNum').value = initTemperature;
            document.getElementById('tVal').textContent = initTemperature;
            document.getElementById('massRatio').value = massRatio;
            document.getElementById('mrDisplay').textContent = massRatio.toFixed(1);
            document.getElementById('mrVal').textContent = massRatio.toFixed(1);
            document.getElementById('particleRadius').value = particleRadius;
            document.getElementById('radDisplay').textContent = particleRadius;
            document.getElementById('radVal').textContent = particleRadius;
            document.getElementById('collisionsEnabled').checked = collisionsEnabled;
        }

        function applySettingsAndReset() {
            numParticles = parseInt(document.getElementById('numParticles').value) || 200;
            initTemperature = parseInt(document.getElementById('initTemp').value) || 200;
            massRatio = parseFloat(document.getElementById('massRatio').value) || 4;
            particleRadius = parseInt(document.getElementById('particleRadius').value) || 7;
            collisionsEnabled = document.getElementById('collisionsEnabled').checked;
            numParticles = Math.max(10, Math.min(600, numParticles));
            initTemperature = Math.max(20, Math.min(800, initTemperature));
            massRatio = Math.max(1, Math.min(10, massRatio));
            particleRadius = Math.max(3, Math.min(18, particleRadius));
            syncUI();
            resetSimulation();
            computeSpeedHistogram();
            updateHistogramCanvas();
        }

        document.getElementById('btnReset').addEventListener('click', applySettingsAndReset);
        document.getElementById('numParticles').addEventListener('input', function() {
            document.getElementById('numParticlesNum').value = this.value;
            document.getElementById('nVal').textContent = this.value;
        });
        document.getElementById('numParticlesNum').addEventListener('change', function() {
            document.getElementById('numParticles').value = this.value;
            document.getElementById('nVal').textContent = this.value;
        });
        document.getElementById('initTemp').addEventListener('input', function() {
            document.getElementById('initTempNum').value = this.value;
            document.getElementById('tVal').textContent = this.value;
        });
        document.getElementById('initTempNum').addEventListener('change', function() {
            document.getElementById('initTemp').value = this.value;
            document.getElementById('tVal').textContent = this.value;
        });
        document.getElementById('massRatio').addEventListener('input', function() {
            document.getElementById('mrDisplay').textContent = parseFloat(this.value).toFixed(1);
            document.getElementById('mrVal').textContent = parseFloat(this.value).toFixed(1);
        });
        document.getElementById('particleRadius').addEventListener('input', function() {
            document.getElementById('radDisplay').textContent = this.value;
            document.getElementById('radVal').textContent = this.value;
        });
        document.getElementById('collisionsEnabled').addEventListener('change', function() {
            collisionsEnabled = this.checked;
        });
        document.getElementById('btnAddEnergy').addEventListener('click', function() {
            for (const p of particles) {
                p.vx *= 1.4;
                p.vy *= 1.4;
            }
            wallImpulseAccum = { left: 0, right: 0, top: 0, bottom: 0 };
            showToast('Energy increased ×1.4');
        });
        document.getElementById('btnCool').addEventListener('click', function() {
            for (const p of particles) {
                p.vx *= 0.7;
                p.vy *= 0.7;
            }
            wallImpulseAccum = { left: 0, right: 0, top: 0, bottom: 0 };
            showToast('Cooled ×0.7');
        });

        function showToast(msg) {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.style.cssText =
                    'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;z-index:999;pointer-events:none;opacity:0;transition:opacity 0.3s;';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.opacity = '1';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.opacity = '0'; }, 1500);
        }

        // ==================== STARTUP ====================
        function init() {
            syncUI();
            // Create the p5 instance
            new p5(sketch);
            // Initial histogram
            setTimeout(() => {
                computeSpeedHistogram();
                updateHistogramCanvas();
            }, 200);
        }

        // Handle window load
        window.addEventListener('load', init);
        window.addEventListener('resize', () => {
            updateHistogramCanvas();
        });

        console.log('⚛️ 2D Gas Simulation ready');
        console.log('  • Elastic collisions conserve momentum & kinetic energy');
        console.log('  • Two species: light (m=1, blue) and heavy (m=' + massRatio + ', red)');
        console.log('  • Temperature from <KE> (2D equipartition: kT = <KE>)');
        console.log('  • Pressure from wall momentum transfer');
        console.log('  • Speed histogram + Maxwell-Boltzmann overlay (gold dashed)');
        console.log('  • Controls: adjust particles, temperature, mass ratio, radius, collisions');
    </script>
</body>
