<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Statistical Mechanics Gas Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevent scrollbars */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-container {
            position: relative;
            margin-top: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border: 2px solid #444;
        }

        #controls {
            width: 800px;
            background: #2a2a2a;
            padding: 15px;
            margin-top: 10px;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .value-display {
            float: right;
            color: #4db8ff;
            font-weight: bold;
        }

        button {
            background-color: #4db8ff;
            border: none;
            color: #1a1a1a;
            padding: 8px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #3399cc;
        }

        #stats-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 4px;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            color: #fff;
        }
        
        .stat-row {
            margin-bottom: 4px;
        }
        
        .highlight { color: #ffeb3b; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="stats-overlay">
            <div class="stat-row">Particles: <span id="disp-n" class="highlight">0</span></div>
            <div class="stat-row">Temp (Kinetic): <span id="disp-t" class="highlight">0</span> K</div>
            <div class="stat-row">Pressure (Impulse): <span id="disp-p" class="highlight">0</span></div>
            <div class="stat-row">Avg Speed: <span id="disp-v" class="highlight">0</span></div>
        </div>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>Particle Count <span id="val-n" class="value-display">200</span></label>
            <input type="range" id="inp-n" min="10" max="400" value="200">
        </div>
        <div class="control-group">
            <label>Initial Temp (Speed) <span id="val-temp" class="value-display">5.0</span></label>
            <input type="range" id="inp-temp" min="1" max="20" step="0.5" value="5.0">
        </div>
        <div class="control-group">
            <label>Mass Ratio (Heavy/Light) <span id="val-mass" class="value-display">5</span></label>
            <input type="range" id="inp-mass" min="1" max="20" step="1" value="5">
        </div>
        <div class="control-group">
            <label>Collisions</label>
            <button id="btn-collide">Toggle Collisions (ON)</button>
        </div>
        <div class="control-group" style="grid-column: span 4; text-align: center; margin-top:10px; border-top: 1px solid #444; padding-top:10px;">
            <label style="display:inline; margin-right: 10px;">Reset Simulation</label>
            <button id="btn-reset">Reset</button>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        let particles = [];
        let boxW, boxH;
        let collisionsEnabled = true;
        
        // Physics Constants
        const K_B = 1.0; // Boltzmann constant (arbitrary units for simulation)
        const RESTITUTION = 1.0; // Perfectly elastic
        
        // Stats tracking
        let totalWallImpulse = 0;
        let speedHistogram = new Array(30).fill(0);
        let maxSpeedObserved = 10;

        // UI Elements
        const ui = {
            n: document.getElementById('inp-n'),
            temp: document.getElementById('inp-temp'),
            mass: document.getElementById('inp-mass'),
            btnCollide: document.getElementById('btn-collide'),
            btnReset: document.getElementById('btn-reset'),
            dispN: document.getElementById('disp-n'),
            dispT: document.getElementById('disp-t'),
            dispP: document.getElementById('disp-p'),
            dispV: document.getElementById('disp-v'),
            valN: document.getElementById('val-n'),
            valTemp: document.getElementById('val-temp'),
            valMass: document.getElementById('val-mass')
        };

        // --- Particle Class ---
        class Particle {
            constructor(x, y, vx, vy, mass, radius, color) {
                this.pos = createVector(x, y);
                this.vel = createVector(vx, vy);
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.prevPos = this.pos.copy(); // For collision resolution
            }

            update() {
                this.prevPos = this.pos.copy();
                this.pos.add(this.vel);
                this.checkWalls();
            }

            checkWalls() {
                let hit = false;
                // Right Wall
                if (this.pos.x > boxW - this.radius) {
                    this.pos.x = boxW - this.radius;
                    this.vel.x *= -1;
                    totalWallImpulse += 2 * this.mass * abs(this.vel.x);
                    hit = true;
                } 
                // Left Wall
                else if (this.pos.x < this.radius) {
                    this.pos.x = this.radius;
                    this.vel.x *= -1;
                    totalWallImpulse += 2 * this.mass * abs(this.vel.x);
                    hit = true;
                }

                // Bottom Wall
                if (this.pos.y > boxH - this.radius) {
                    this.pos.y = boxH - this.radius;
                    this.vel.y *= -1;
                    totalWallImpulse += 2 * this.mass * abs(this.vel.y);
                    hit = true;
                } 
                // Top Wall
                else if (this.pos.y < this.radius) {
                    this.pos.y = this.radius;
                    this.vel.y *= -1;
                    totalWallImpulse += 2 * this.mass * abs(this.vel.y);
                    hit = true;
                }
            }

            display() {
                noStroke();
                fill(this.color);
                ellipse(this.pos.x, this.pos.y, this.radius * 2);
                
                // Shine effect
                fill(255, 100);
                ellipse(this.pos.x - this.radius*0.3, this.pos.y - this.radius*0.3, this.radius * 0.6);
            }

            getSpeed() {
                return this.vel.mag();
            }

            getKE() {
                return 0.5 * this.mass * this.vel.magSq();
            }
        }

        // --- p5.js Functions ---

        function setup() {
            let cnv = createCanvas(800, 500);
            cnv.parent('canvas-container');
            boxW = width;
            boxH = height;
            
            // Event Listeners
            ui.n.addEventListener('input', (e) => {
                ui.valN.innerText = e.target.value;
                initParticles();
            });
            ui.temp.addEventListener('input', (e) => ui.valTemp.innerText = e.target.value);
            ui.mass.addEventListener('input', (e) => {
                ui.valMass.innerText = e.target.value;
                initParticles();
            });
            ui.btnCollide.addEventListener('click', () => {
                collisionsEnabled = !collisionsEnabled;
                ui.btnCollide.innerText = `Toggle Collisions (${collisionsEnabled ? 'ON' : 'OFF'})`;
                ui.btnCollide.style.backgroundColor = collisionsEnabled ? '#4db8ff' : '#ff6b6b';
            });
            ui.btnReset.addEventListener('click', initParticles);

            initParticles();
        }

        function initParticles() {
            particles = [];
            const count = parseInt(ui.n.value);
            const targetSpeed = parseFloat(ui.temp.value);
            const massRatio = parseInt(ui.mass.value);
            
            const rSmall = 4;
            const rLarge = 7;
            const mSmall = 1;
            const mLarge = massRatio;

            for (let i = 0; i < count; i++) {
                // Random position with padding
                let x = random(rLarge, width - rLarge);
                let y = random(rLarge, height - rLarge);
                
                // Random velocity direction, magnitude based on Temp
                let angle = random(TWO_PI);
                // Maxwell-Boltzmann-ish initialization: mostly target speed with some variance
                let speed = targetSpeed * (0.8 + random(0.4)); 
                
                let vx = cos(angle) * speed;
                let vy = sin(angle) * speed;

                // 50/50 mix of light and heavy particles
                let isHeavy = random() > 0.5;
                let m, r, c;

                if (isHeavy) {
                    m = mLarge;
                    r = rLarge;
                    c = color(255, 100, 100); // Reddish
                } else {
                    m = mSmall;
                    r = rSmall;
                    c = color(100, 150, 255); // Bluish
                }

                // Ensure no initial overlap (simple retry)
                let overlapping = true;
                let attempts = 0;
                while(overlapping && attempts < 100) {
                    overlapping = false;
                    for(let other of particles) {
                        let d = dist(x, y, other.pos.x, other.pos.y);
                        if(d < r + other.radius) {
                            x = random(rLarge, width - rLarge);
                            y = random(rLarge, height - rLarge);
                            overlapping = true;
                            break;
                        }
                    }
                    attempts++;
                }

                particles.push(new Particle(x, y, vx, vy, m, r, c));
            }
        }

        function draw() {
            background(30);

            // 1. Update Physics
            totalWallImpulse = 0; // Reset impulse counter for this frame
            
            // Move particles
            for (let p of particles) {
                p.update();
            }

            // Handle Collisions
            if (collisionsEnabled) {
                resolveCollisions();
            }

            // 2. Calculate Statistics
            calculateStats();

            // 3. Draw Particles
            for (let p of particles) {
                p.display();
            }

            // 4. Draw Histogram (Maxwell-Boltzmann Visualization)
            drawHistogram();
            
            // 5. Update UI Text
            updateUI();
        }

        function resolveCollisions() {
            // Simple O(N^2) check. For N < 400 this is fine in JS.
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i];
                    let p2 = particles[j];

                    let distVect = p5.Vector.sub(p2.pos, p1.pos);
                    let distMag = distVect.mag();
                    let minDist = p1.radius + p2.radius;

                    if (distMag < minDist) {
                        // 1. Resolve Overlap (prevent sticking)
                        let overlap = minDist - distMag;
                        let correction = distVect.copy().normalize().mult(overlap / 2);
                        p1.pos.sub(correction);
                        p2.pos.add(correction);

                        // 2. Resolve Velocity (Elastic Collision)
                        // Normal vector at collision point
                        let n = distVect.copy().normalize();
                        
                        // Relative velocity
                        let relVel = p5.Vector.sub(p1.vel, p2.vel);
                        
                        // Velocity along normal
                        let velAlongNormal = relVel.dot(n);

                        // Do not resolve if velocities are separating
                        if (velAlongNormal > 0) continue;

                        // Impulse scalar
                        let jVal = -(1 + RESTITUTION) * velAlongNormal;
                        jVal /= (1 / p1.mass + 1 / p2.mass);

                        // Apply impulse
                        let impulse = n.mult(jVal);
                        p1.vel.add(p5.Vector.div(impulse, p1.mass));
                        p2.vel.sub(p5.Vector.div(impulse, p2.mass));
                    }
                }
            }
        }

        function calculateStats() {
            let totalKE = 0;
            let totalSpeed = 0;
            
            // Reset histogram bins
            speedHistogram.fill(0);
            maxSpeedObserved = 0;

            for (let p of particles) {
                let ke = p.getKE();
                totalKE += ke;
                
                let speed = p.getSpeed();
                totalSpeed += speed;
                if(speed > maxSpeedObserved) maxSpeedObserved = speed;
            }

            // Temperature T = (2 * AvgKE) / (DegreesOfFreedom * kB)
            // In 2D, DOF = 2. So T = AvgKE / kB
            let avgKE = totalKE / particles.length;
            let temperature = avgKE / K_B;

            // Pressure P = Force / Area (Perimeter in 2D)
            // Force = Impulse / Time (dt = 1 frame approx)
            let perimeter = 2 * (width + height);
            let pressure = totalWallImpulse / perimeter;

            // Store global stats for drawing
            window.currentTemp = temperature;
            window.currentPressure = pressure;
            window.currentAvgSpeed = totalSpeed / particles.length;

            // Bin speeds for histogram
            let binWidth = maxSpeedObserved / speedHistogram.length;
            if(binWidth === 0) binWidth = 1;
            
            for (let p of particles) {
                let s = p.getSpeed();
                let binIndex = floor(s / binWidth);
                if (binIndex >= speedHistogram.length) binIndex = speedHistogram.length - 1;
                speedHistogram[binIndex]++;
            }
            window.histBinWidth = binWidth;
        }

        function drawHistogram() {
            let hHeight = 100;
            let hWidth = 200;
            let hX = width - hWidth - 20;
            let hY = height - hHeight - 20;

            // Background for graph
            fill(40);
            noStroke();
            rect(hX, hY, hWidth, hHeight);

            // Title
            fill(200);
            textSize(12);
            textAlign(LEFT, TOP);
            text("Speed Distribution", hX + 5, hY + 5);

            if (particles.length === 0) return;

            // Find max bin count for normalization
            let maxCount = 1;
            for(let count of speedHistogram) {
                if(count > maxCount) maxCount = count;
            }

            // Draw Bars
            noStroke();
            fill(100, 200, 100, 150);
            let barW = hWidth / speedHistogram.length;
            
            for (let i = 0; i < speedHistogram.length; i++) {
                let h = (speedHistogram[i] / maxCount) * (hHeight - 10);
                rect(hX + i * barW, hY + hHeight - h, barW - 1, h);
            }

            // Draw Theoretical Maxwell-Boltzmann Curve Overlay
            // f(v) ~ v * exp(-mv^2 / 2kT)
            // We need to scale this to fit the histogram visually
            stroke(255, 200, 0);
            strokeWeight(2);
            noFill();
            beginShape();
            for (let x = 0; x < hWidth; x+=2) {
                // Map pixel x to speed v
                let v = (x / hWidth) * (speedHistogram.length * window.histBinWidth);
                
                // Calculate MB probability density (simplified for visualization)
                // Using average mass for the curve approximation
                let avgMass = 0;
                for(let p of particles) avgMass += p.mass;
                avgMass /= particles.length;

                let exponent = - (avgMass * v * v) / (2 * K_B * window.currentTemp);
                let prob = v * exp(exponent);
                
                // Scale prob to fit histogram height
                // This scaling factor is heuristic to make it look nice overlaid
                let scaleY = (hHeight / maxCount) * particles.length * 0.15; 
                
                let plotY = hY + hHeight - (prob * scaleY);
                
                // Clamp to graph bounds
                if(plotY < hY) plotY = hY;
                if(plotY > hY + hHeight) plotY = hY + hHeight;

                vertex(hX + x, plotY);
            }
            endShape();
            noStroke();
        }

        function updateUI() {
            ui.dispN.innerText = particles.length;
            ui.dispT.innerText = window.currentTemp ? window.currentTemp.toFixed(2) : "0.00";
            ui.dispP.innerText = window.currentPressure ? window.currentPressure.toFixed(2) : "0.00";
            ui.dispV.innerText = window.currentAvgSpeed ? window.currentAvgSpeed.toFixed(2) : "0.00";
        }

        function windowResized() {
            // Optional: Handle resize if needed, currently fixed size container
        }
    </script>
</body>
</html>
