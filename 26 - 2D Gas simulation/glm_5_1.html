<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Statistical Mechanics Gas Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            overflow: hidden;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        canvas {
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #ui-panel {
            width: 320px;
            background: #252526;
            padding: 20px;
            border-left: 1px solid #333;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #4dc9f6; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #444; padding-bottom: 8px;}
        h3 { margin: 0 0 5px 0; font-size: 14px; color: #aaa; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .slider-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .slider-val { color: #4dc9f6; font-weight: bold; }
        input[type="range"] { width: 100%; accent-color: #4dc9f6; }
        button { padding: 8px; background: #333; border: 1px solid #555; color: #fff; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        button:hover { background: #4dc9f6; color: #000; }
        .stat-box { background: #1e1e1e; padding: 10px; border-radius: 4px; border: 1px solid #333; font-family: monospace; font-size: 14px; }
        .stat-label { color: #888; }
        .stat-value { color: #fff; font-weight: bold; float: right; }
        #histogram-container { background: #111; border-radius: 4px; border: 1px solid #333; height: 200px; position: relative; overflow: hidden; }
        .legend { display: flex; gap: 15px; font-size: 12px; margin-top: 5px; }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-panel">
    <h2>Controls</h2>
    
    <div class="control-group">
        <h3>System</h3>
        <div class="slider-row">Particles (N): <span class="slider-val" id="nVal">100</span></div>
        <input type="range" id="numParticles" min="10" max="300" value="100">
        <div class="slider-row">Box Size: <span class="slider-val" id="boxVal">400</span></div>
        <input type="range" id="boxSize" min="200" max="600" value="400">
    </div>

    <div class="control-group">
        <h3>Thermodynamics</h3>
        <div class="slider-row">Initial Temp: <span class="slider-val" id="tempVal">300</span></div>
        <input type="range" id="temperature" min="50" max="1000" value="300">
    </div>

    <div class="control-group">
        <h3>Species B (Heavy)</h3>
        <div class="slider-row">Mass Ratio (mB/mA): <span class="slider-val" id="massVal">4.0</span></div>
        <input type="range" id="massRatio" min="1" max="10" step="0.5" value="4">
        <div class="slider-row">Fraction B: <span class="slider-val" id="fracVal">0.3</span></div>
        <input type="range" id="fractionB" min="0" max="1" step="0.05" value="0.3">
    </div>

    <div class="control-group">
        <button id="collisionBtn">Collisions: ON</button>
        <button id="resetBtn">Reset Simulation</button>
    </div>

    <h2>Statistics</h2>
    <div class="stat-box">
        <div><span class="stat-label">Temperature (T):</span> <span class="stat-value" id="statT">0</span></div>
        <div><span class="stat-label">Pressure (P):</span> <span class="stat-value" id="statP">0</span></div>
        <div><span class="stat-label">Total Energy (E):</span> <span class="stat-value" id="statE">0</span></div>
        <div><span class="stat-label">Ideal Gas (NkT):</span> <span class="stat-value" id="statIdeal">0</span></div>
    </div>

    <h2>Speed Distribution</h2>
    <div id="histogram-container"></div>
    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #4dc9f6;"></div> Species A</div>
        <div class="legend-item"><div class="dot" style="background: #ff6384;"></div> Species B</div>
        <div class="legend-item"><div class="dot" style="background: #fff;"></div> M-B Theory</div>
    </div>
</div>

<script>
// --- Configuration ---
let particles = [];
let boxW = 400, boxH = 400;
let collisionsEnabled = true;
let kB = 1.0; // Boltzmann constant (arbitrary units)

// Pressure tracking
let momentumTransferred = 0;
let pressureWindow = 60; // frames
let frameCountP = 0;
let currentPressure = 0;

// UI elements
let nSlider, boxSlider, tempSlider, massSlider, fracSlider;

function setup() {
    let canvas = createCanvas(boxW, boxH);
    canvas.parent('canvas-container');
    
    nSlider = select('#numParticles');
    boxSlider = select('#boxSize');
    tempSlider = select('#temperature');
    massSlider = select('#massRatio');
    fracSlider = select('#fractionB');
    
    // Event Listeners
    nSlider.input(() => select('#nVal').html(nSlider.value()));
    boxSlider.input(() => { 
        boxW = int(boxSlider.value()); boxH = int(boxSlider.value()); 
        resizeCanvas(boxW, boxH); 
        select('#boxVal').html(boxSlider.value());
        constrainParticles();
    });
    tempSlider.input(() => select('#tempVal').html(tempSlider.value()));
    massSlider.input(() => select('#massVal').html(massSlider.value()));
    fracSlider.input(() => select('#fracVal').html(fracSlider.value()));
    
    select('#collisionBtn').mousePressed(toggleCollisions);
    select('#resetBtn').mousePressed(initParticles);
    
    initParticles();
}

function initParticles() {
    particles = [];
    let N = int(nSlider.value());
    let T = float(tempSlider.value());
    let mRatio = float(massSlider.value());
    let frac = float(fracSlider.value());
    
    let mA = 1.0;
    let rA = 4;
    let mB = mA * mRatio;
    let rB = rA * Math.sqrt(mRatio); // Area proportional to mass
    
    for (let i = 0; i < N; i++) {
        let isB = random() < frac;
        let m = isB ? mB : mA;
        let r = isB ? rB : rA;
        
        // Position (avoid edges)
        let x = random(r + 1, boxW - r - 1);
        let y = random(r + 1, boxH - r - 1);
        
        // Velocity from Maxwell-Boltzmann (Rayleigh distribution in 2D for speed)
        // <v^2> = 2kT/m
        let sigma = sqrt(kB * T / m);
        let vx = randomGaussian(0, sigma);
        let vy = randomGaussian(0, sigma);
        
        particles.push({ x, y, vx, vy, m, r, isB });
    }
    momentumTransferred = 0;
    frameCountP = 0;
}

function constrainParticles() {
    for (let p of particles) {
        p.x = constrain(p.x, p.r + 1, boxW - p.r - 1);
        p.y = constrain(p.y, p.r + 1, boxH - p.r - 1);
    }
}

function toggleCollisions() {
    collisionsEnabled = !collisionsEnabled;
    select('#collisionBtn').html("Collisions: " + (collisionsEnabled ? "ON" : "OFF"));
}

// --- Physics Update ---
function draw() {
    background(20);
    
    // Update Physics
    for (let p of particles) {
        p.x += p.vx;
        p.y += p.vy;
    }
    
    checkWalls();
    if (collisionsEnabled) checkCollisions();
    
    // Draw Particles
    noStroke();
    for (let p of particles) {
        fill(p.isB ? color(255, 99, 132) : color(77, 201, 246));
        ellipse(p.x, p.y, p.r * 2);
    }
    
    // Calculate Stats every frame
    frameCountP++;
    if (frameCountP >= pressureWindow) {
        // P = F/L = (dp/dt) / Perimeter
        currentPressure = momentumTransferred / (2 * (boxW + boxH) * (pressureWindow / 60.0)); 
        momentumTransferred = 0;
        frameCountP = 0;
    }
    
    updateStats();
    drawHistogram();
}

function checkWalls() {
    for (let p of particles) {
        // Left/Right
        if (p.x - p.r < 0) {
            p.x = p.r;
            momentumTransferred += 2 * p.m * abs(p.vx);
            p.vx = abs(p.vx);
        } else if (p.x + p.r > boxW) {
            p.x = boxW - p.r;
            momentumTransferred += 2 * p.m * abs(p.vx);
            p.vx = -abs(p.vx);
        }
        
        // Top/Bottom
        if (p.y - p.r < 0) {
            p.y = p.r;
            momentumTransferred += 2 * p.m * abs(p.vy);
            p.vy = abs(p.vy);
        } else if (p.y + p.r > boxH) {
            p.y = boxH - p.r;
            momentumTransferred += 2 * p.m * abs(p.vy);
            p.vy = -abs(p.vy);
        }
    }
}

function checkCollisions() {
    const N = particles.length;
    for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
            let p1 = particles[i];
            let p2 = particles[j];
            
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let distSq = dx * dx + dy * dy;
            let minDist = p1.r + p2.r;
            
            if (distSq < minDist * minDist) {
                let dist = sqrt(distSq);
                if (dist === 0) continue; // Prevent division by zero
                
                // Normal vector
                let nx = dx / dist;
                let ny = dy / dist;
                
                // Relative velocity
                let dvx = p1.vx - p2.vx;
                let dvy = p1.vy - p2.vy;
                
                // Relative velocity along normal
                let dvn = dvx * nx + dvy * ny;
                
                // Do not resolve if velocities are separating
                if (dvn > 0) {
                    let m1 = p1.m, m2 = p2.m;
                    // Elastic collision impulse scalar
                    let j = (2 * dvn) / (m1 + m2);
                    
                    // Update velocities
                    p1.vx -= j * m2 * nx;
                    p1.vy -= j * m2 * ny;
                    p2.vx += j * m1 * nx;
                    p2.vy += j * m1 * ny;
                    
                    // Separate particles to prevent overlap
                    let overlap = minDist - dist;
                    p1.x -= overlap / 2 * nx;
                    p1.y -= overlap / 2 * ny;
                    p2.x += overlap / 2 * nx;
                    p2.y += overlap / 2 * ny;
                }
            }
        }
    }
}

// --- Statistics ---
function updateStats() {
    let totalKE = 0;
    let N = particles.length;
    
    for (let p of particles) {
        let v2 = p.vx * p.vx + p.vy * p.vy;
        totalKE += 0.5 * p.m * v2;
    }
    
    // T = (2/Nf) * <E_k>, Nf = 2 degrees of freedom per particle in 2D
    let T = (1 / (N * kB)) * totalKE; 
    let idealP = N * kB * T / (boxW * boxH); // 2D Ideal Gas Law: PA = NkT => P = NkT/A
    
    select('#statT').html(T.toFixed(1));
    select('#statP').html(currentPressure.toFixed(4));
    select('#statE').html(totalKE.toFixed(1));
    select('#statIdeal').html(idealP.toFixed(4));
}

function drawHistogram() {
    let container = document.getElementById('histogram-container');
    let ctx = drawingContext; // Use p5's canvas context for drawing over everything if needed, but we want it in the div.
    // Actually, p5 doesn't easily draw into a div. We will draw the histogram on the main canvas in the corner or use a separate graphics buffer.
    // For a cleaner UI, let's draw it in the bottom-right of the main canvas.
    
    push();
    let histX = boxW - 180;
    let histY = boxH - 110;
    let histW = 170;
    let histH = 100;
    
    // Background
    fill(0, 0, 0, 200);
    stroke(100);
    strokeWeight(1);
    rect(histX, histY, histW, histH);
    
    // Calculate bins
    let maxSpeed = 15; // Adjust based on temp
    let numBins = 20;
    let binWidth = maxSpeed / numBins;
    let binsA = new Array(numBins).fill(0);
    let binsB = new Array(numBins).fill(0);
    let totalA = 0, totalB = 0;
    
    for (let p of particles) {
        let speed = sqrt(p.vx * p.vx + p.vy * p.vy);
        let bin = floor(speed / binWidth);
        if (bin >= 0 && bin < numBins) {
            if (p.isB) { binsB[bin]++; totalB++; }
            else { binsA[bin]++; totalA++; }
        }
    }
    
    // Find max count for scaling
    let maxCount = 1;
    for (let i = 0; i < numBins; i++) {
        if (binsA[i] > maxCount) maxCount = binsA[i];
        if (binsB[i] > maxCount) maxCount = binsB[i];
    }
    
    // Draw bars
    let barW = (histW - 20) / numBins;
    noStroke();
    
    // Species A bars
    fill(77, 201, 246, 150);
    for (let i = 0; i < numBins; i++) {
        let h = map(binsA[i], 0, maxCount, 0, histH - 20);
        rect(histX + 10 + i * barW, histY + histH - 10 - h, barW/2, h);
    }
    
    // Species B bars
    fill(255, 99, 132, 150);
    for (let i = 0; i < numBins; i++) {
        let h = map(binsB[i], 0, maxCount, 0, histH - 20);
        rect(histX + 10 + i * barW + barW/2, histY + histH - 10 - h, barW/2, h);
    }
    
    // Theoretical Maxwell-Boltzmann Curve
    // f(v) = (m / kT) * v * exp(-mv^2 / 2kT)
    // Normalized to histogram: N * binWidth * f(v)
    let T = float(select('#statT').html());
    if (T > 0) {
        stroke(255);
        strokeWeight(2);
        noFill();
        beginShape();
        let mA = 1.0;
        let mB = float(massSlider.value());
        
        // Draw theory for A
        for (let i = 0; i < numBins * 2; i++) {
            let v = (i / (numBins * 2)) * maxSpeed;
            let fA = (mA / (kB * T)) * v * exp(-(mA * v * v) / (2 * kB * T));
            let expectedCountA = totalA * binWidth * fA;
            let h = map(expectedCountA, 0, maxCount, 0, histH - 20);
            let x = map(v, 0, maxSpeed, histX + 10, histX + histW - 10);
            vertex(x, histY + histH - 10 - h);
        }
        endShape();
        
        // Draw theory for B
        stroke(255, 150, 150);
        beginShape();
        for (let i = 0; i < numBins * 2; i++) {
            let v = (i / (numBins * 2)) * maxSpeed;
            let fB = (mB / (kB * T)) * v * exp(-(mB * v * v) / (2 * kB * T));
            let expectedCountB = totalB * binWidth * fB;
            let h = map(expectedCountB, 0, maxCount, 0, histH - 20);
            let x = map(v, 0, maxSpeed, histX + 10, histX + histW - 10);
            vertex(x, histY + histH - 10 - h);
        }
        endShape();
    }
    
    pop();
}

// Handle window resize
function windowResized() {
    // Canvas size is fixed based on slider, so no auto-resize needed for canvas itself,
    // but UI might need adjustments.
}
</script>
</body>
</html>
