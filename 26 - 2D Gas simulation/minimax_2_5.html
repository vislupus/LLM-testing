<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gas Simulation - Statistical Mechanics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d12;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        #simulation-canvas {
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.1);
        }

        #sidebar {
            width: 300px;
            background: rgba(15, 15, 25, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(100, 200, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #sidebar h1 {
            font-size: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #sidebar .subtitle {
            font-size: 10px;
            color: #556;
            margin-bottom: 8px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
        }

        .panel-title {
            font-size: 10px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
        }

        .stat-value.temp { color: #f97316; }
        .stat-value.pressure { color: #10b981; }
        .stat-value.energy { color: #8b5cf6; }
        .stat-value.particles { color: #3b82f6; }

        .stat-label {
            font-size: 8px;
            color: #667788;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .control-row {
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 6px;
        }

        .control-row label span.value {
            color: #64ffda;
            font-weight: 600;
            font-size: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
        }

        .toggle-group {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899aa;
            font-size: 9px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .toggle-btn:hover {
            background: rgba(100, 200, 255, 0.1);
        }

        .toggle-btn.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
            color: #64ffda;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #10b981);
            color: #0d0d12;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #aabbcc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .legend {
            display: flex;
            gap: 12px;
            font-size: 10px;
            margin-top: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.light { background: #3b82f6; }
        .legend-dot.heavy { background: #ef4444; }

        .instructions {
            font-size: 9px;
            color: #556;
            line-height: 1.6;
        }

        .instructions .key {
            display: inline-block;
            background: rgba(100, 200, 255, 0.15);
            border: 1px solid rgba(100, 200, 255, 0.25);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 8px;
            color: #64ffda;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-area">
            <canvas id="simulation-canvas"></canvas>
        </div>

        <div id="sidebar">
            <div>
                <h1>KINETIC GAS SIM</h1>
                <div class="subtitle">Statistical Mechanics Simulation</div>
            </div>

            <div class="panel">
                <div class="panel-title">Macroscopic Properties</div>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value temp" id="temperature">0</div>
                        <div class="stat-label">Temperature (K)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value pressure" id="pressure">0</div>
                        <div class="stat-label">Pressure (Pa)</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value energy" id="energy">0</div>
                        <div class="stat-label">Total Energy</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value particles" id="particleCount">0</div>
                        <div class="stat-label">Particles</div>
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Parameters</div>
                <div class="control-row">
                    <label>Particle Count <span class="value" id="countVal">150</span></label>
                    <input type="range" id="particleCount" min="10" max="400" value="150">
                </div>
                <div class="control-row">
                    <label>Initial Temperature <span class="value" id="tempVal">5.0</span></label>
                    <input type="range" id="temperature" min="1" max="20" value="50">
                </div>
                <div class="control-row">
                    <label>Heavy Particle Ratio <span class="value" id="heavyVal">0%</span></label>
                    <input type="range" id="heavyRatio" min="0" max="100" value="0">
                </div>
                <div class="control-row">
                    <label>Particle Radius <span class="value" id="radiusVal">4</span></label>
                    <input type="range" id="radius" min="2" max="10" value="4">
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Options</div>
                <div class="toggle-group" style="margin-bottom: 12px;">
                    <button class="toggle-btn active" id="collisionsOn" onclick="setCollisions(true)">Collisions ON</button>
                    <button class="toggle-btn" id="collisionsOff" onclick="setCollisions(false)">OFF</button>
                </div>
                <div class="toggle-group" style="margin-bottom: 12px;">
                    <button class="toggle-btn active" id="wallsOn" onclick="setWalls(true)">Walls ON</button>
                    <button class="toggle-btn" id="wallsOff" onclick="setWalls(false)">OFF</button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">Controls</div>
                <button class="btn btn-primary" onclick="resetSimulation()">Reset / Apply</button>
                <button class="btn btn-secondary" onclick="togglePause()">Pause / Resume</button>
            </div>

            <div class="panel">
                <div class="panel-title">Legend</div>
                <div class="legend">
                    <div class="legend-item"><div class="legend-dot light"></div> Light (m=1)</div>
                    <div class="legend-item"><div class="legend-dot heavy"></div> Heavy (m=4)</div>
                </div>
                <div class="legend" style="margin-top: 8px;">
                    <div class="legend-item" style="color: #10b981;">Histogram shows speed distribution</div>
                </div>
            </div>

            <div class="instructions">
                <span class="key">Space</span> Pause<br>
                <span class="key">R</span> Reset
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // GAS SIMULATION - STATISTICAL MECHANICS
        // ============================================

        // Simulation parameters
        const CANVAS_WIDTH = 700;
        const CANVAS_HEIGHT = 600;
        const BOX_MARGIN = 40;
        const WALL_THICKNESS = 3;

        // Physics constants
        const LIGHT_MASS = 1;
        const HEAVY_MASS = 4;
        const LIGHT_COLOR = [59, 130, 246];  // Blue
        const HEAVY_COLOR = [239, 68, 68];    // Red

        // State
        let particles = [];
        let particleCount = 150;
        let initialTemperature = 5;
        let heavyRatio = 0;
        let particleRadius = 4;
        let collisionsEnabled = true;
        let wallsEnabled = true;
        let isPaused = false;

        // Pressure calculation
        let wallImpulse = { left: 0, right: 0, top: 0, bottom: 0 };
        let pressureHistory = [];
        const PRESSURE_HISTORY_SIZE = 60;

        // Box bounds
        let box = {
            left: BOX_MARGIN,
            right: CANVAS_WIDTH - BOX_MARGIN,
            top: BOX_MARGIN,
            bottom: CANVAS_HEIGHT - BOX_MARGIN,
            width: function() { return this.right - this.left; },
            height: function() { return this.bottom - this.top; }
        };

        // Histogram
        let histogramBins = 20;
        let maxSpeed = 15;

        function setup() {
            let canvas = createCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
            canvas.parent('simulation-canvas');
            pixelDensity(1);

            // Initialize simulation
            resetSimulation();

            // Set up UI
            setupUI();
        }

        function setupUI() {
            document.getElementById('particleCount').addEventListener('input', (e) => {
                particleCount = parseInt(e.target.value);
                document.getElementById('countVal').textContent = particleCount;
            });

            document.getElementById('temperature').addEventListener('input', (e) => {
                initialTemperature = parseInt(e.target.value) / 10;
                document.getElementById('tempVal').textContent = initialTemperature.toFixed(1);
            });

            document.getElementById('heavyRatio').addEventListener('input', (e) => {
                heavyRatio = parseInt(e.target.value);
                document.getElementById('heavyVal').textContent = heavyRatio + '%';
            });

            document.getElementById('radius').addEventListener('input', (e) => {
                particleRadius = parseInt(e.target.value);
                document.getElementById('radiusVal').textContent = particleRadius;
            });
        }

        function resetSimulation() {
            particles = [];
            pressureHistory = [];
            wallImpulse = { left: 0, right: 0, top: 0, bottom: 0 };

            // Create particles
            for (let i = 0; i < particleCount; i++) {
                let isHeavy = random() < heavyRatio / 100;
                let mass = isHeavy ? HEAVY_MASS : LIGHT_MASS;
                let radius = particleRadius * (isHeavy ? 1.3 : 1);

                // Random position within box
                let x = random(box.left + radius, box.right - radius);
                let y = random(box.top + radius, box.bottom - radius);

                // Random velocity based on temperature (Maxwell-Boltzmann)
                let speed = randomGaussian(0, initialTemperature);
                let angle = random(TWO_PI);

                particles.push({
                    x: x,
                    y: y,
                    vx: speed * cos(angle),
                    vy: speed * sin(angle),
                    mass: mass,
                    radius: radius,
                    isHeavy: isHeavy,
                    color: isHeavy ? HEAVY_COLOR : LIGHT_COLOR
                });
            }
        }

        function setCollisions(enabled) {
            collisionsEnabled = enabled;
            document.getElementById('collisionsOn').classList.toggle('active', enabled);
            document.getElementById('collisionsOff').classList.toggle('active', !enabled);
        }

        function setWalls(enabled) {
            wallsEnabled = enabled;
            document.getElementById('wallsOn').classList.toggle('active', enabled);
            document.getElementById('wallsOff').classList.toggle('active', !enabled);
        }

        function togglePause() {
            isPaused = !isPaused;
        }

        // ============================================
        // PHYSICS UPDATE
        // ============================================

        function update() {
            if (isPaused) return;

            // Reset wall impulse for this frame
            let currentImpulse = { left: 0, right: 0, top: 0, bottom: 0 };

            // Update particle positions
            for (let p of particles) {
                // Move particle
                p.x += p.vx;
                p.y += p.vy;

                // Wall collisions
                if (wallsEnabled) {
                    // Left wall
                    if (p.x - p.radius < box.left) {
                        p.x = box.left + p.radius;
                        let impulse = abs(p.vx) * p.mass * 2;
                        p.vx = -p.vx;
                        currentImpulse.left += impulse;
                    }
                    // Right wall
                    if (p.x + p.radius > box.right) {
                        p.x = box.right - p.radius;
                        let impulse = abs(p.vx) * p.mass * 2;
                        p.vx = -p.vx;
                        currentImpulse.right += impulse;
                    }
                    // Top wall
                    if (p.y - p.radius < box.top) {
                        p.y = box.top + p.radius;
                        let impulse = abs(p.vy) * p.mass * 2;
                        p.vy = -p.vy;
                        currentImpulse.top += impulse;
                    }
                    // Bottom wall
                    if (p.y + p.radius > box.bottom) {
                        p.y = box.bottom - p.radius;
                        let impulse = abs(p.vy) * p.mass * 2;
                        p.vy = -p.vy;
                        currentImpulse.bottom += impulse;
                    }
                }
            }

            // Particle-particle collisions
            if (collisionsEnabled) {
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        resolveCollision(particles[i], particles[j]);
                    }
                }
            }

            // Update pressure history
            let totalImpulse = currentImpulse.left + currentImpulse.right + currentImpulse.top + currentImpulse.bottom;
            pressureHistory.push(totalImpulse);
            if (pressureHistory.length > PRESSURE_HISTORY_SIZE) {
                pressureHistory.shift();
            }
        }

        function resolveCollision(p1, p2) {
            let dx = p2.x - p1.x;
            let dy = p2.y - p1.y;
            let dist = sqrt(dx * dx + dy * dy);
            let minDist = p1.radius + p2.radius;

            if (dist < minDist && dist > 0) {
                // Normalize collision vector
                let nx = dx / dist;
                let ny = dy / dist;

                // Relative velocity
                let dvx = p1.vx - p2.vx;
                let dvy = p1.vy - p2.vy;

                // Relative velocity along collision normal
                let dvn = dvx * nx + dvy * ny;

                // Only resolve if particles are approaching
                if (dvn > 0) {
                    // Calculate impulse (elastic collision)
                    let massSum = p1.mass + p2.mass;
                    let impulse = (2 * dvn) / massSum;

                    // Update velocities
                    p1.vx -= impulse * p2.mass * nx;
                    p1.vy -= impulse * p2.mass * ny;
                    p2.vx += impulse * p1.mass * nx;
                    p2.vy += impulse * p1.mass * ny;

                    // Separate particles to prevent overlap
                    let overlap = minDist - dist;
                    let separationX = nx * overlap / 2;
                    let separationY = ny * overlap / 2;
                    p1.x -= separationX;
                    p1.y -= separationY;
                    p2.x += separationX;
                    p2.y += separationY;
                }
            }
        }

        // ============================================
        // THERMODYNAMICS CALCULATIONS
        // ============================================

        function calculateTemperature() {
            // Temperature proportional to average kinetic energy
            // KE = 0.5 * m * v^2
            let totalKE = 0;
            for (let p of particles) {
                let v2 = p.vx * p.vx + p.vy * p.vy;
                totalKE += 0.5 * p.mass * v2;
            }
            // T = (2/degrees_of_freedom) * <KE>
            // In 2D, DOF = 2, so T = <KE>
            return particles.length > 0 ? totalKE / particles.length : 0;
        }

        function calculatePressure() {
            // Pressure = Force / Area
            // Force = impulse / time (we're using frames as time)
            // For 2D, we use perimeter instead of area
            if (pressureHistory.length === 0) return 0;

            let avgImpulse = pressureHistory.reduce((a, b) => a + b, 0) / pressureHistory.length;
            let perimeter = 2 * (box.width() + box.height());

            return avgImpulse / perimeter;
        }

        function calculateTotalEnergy() {
            let totalE = 0;
            for (let p of particles) {
                let v2 = p.vx * p.vx + p.vy * p.vy;
                totalE += 0.5 * p.mass * v2;
            }
            return totalE;
        }

        function calculateHistogram() {
            let bins = new Array(histogramBins).fill(0);
            let binWidth = maxSpeed / histogramBins;

            for (let p of particles) {
                let speed = sqrt(p.vx * p.vx + p.vy * p.vy);
                let binIndex = Math.floor(speed / binWidth);
                if (binIndex >= 0 && binIndex < histogramBins) {
                    bins[binIndex]++;
                }
            }

            return bins;
        }

        // ============================================
        // RENDERING
        // ============================================

        function draw() {
            background(13, 15, 20);

            // Update physics
            update();

            // Draw box
            drawBox();

            // Draw particles
            drawParticles();

            // Draw histogram
            drawHistogram();

            // Update stats
            updateStats();
        }

        function drawBox() {
            // Box fill
            noStroke();
            fill(20, 25, 35);
            rect(box.left, box.top, box.width(), box.height());

            // Box walls
            stroke(255);
            strokeWeight(WALL_THICKNESS);
            noFill();
            rect(box.left, box.top, box.width(), box.height());
        }

        function drawParticles() {
            noStroke();

            for (let p of particles) {
                // Glow effect
                for (let i = 3; i > 0; i--) {
                    fill(p.color[0], p.color[1], p.color[2], 30 / i);
                    ellipse(p.x, p.y, p.radius * 2 + i * 4);
                }

                // Main particle
                fill(p.color[0], p.color[1], p.color[2]);
                ellipse(p.x, p.y, p.radius * 2);

                // Highlight
                fill(255, 255, 255, 100);
                ellipse(p.x - p.radius * 0.3, p.y - p.radius * 0.3, p.radius * 0.5);
            }
        }

        function drawHistogram() {
            let bins = calculateHistogram();
            let maxCount = Math.max(...bins, 1);

            // Histogram position
            let histX = box.right - 180;
            let histY = box.bottom - 120;
            let histW = 160;
            let histH = 100;
            let binW = histW / histogramBins;

            // Background
            fill(0, 0, 0, 150);
            noStroke();
            rect(histX - 10, histY - 10, histW + 20, histH + 30, 5);

            // Draw bars
            for (let i = 0; i < histogramBins; i++) {
                let barHeight = (bins[i] / maxCount) * histH;
                let x = histX + i * binW;
                let y = histY + histH - barHeight;

                // Color gradient from green (slow) to orange (fast)
                let t = i / histogramBins;
                fill(lerp(16, 249, t), lerp(185, 115, t), lerp(129, 18, t), 200);
                rect(x, y, binW - 1, barHeight);
            }

            // Axes
            stroke(100);
            strokeWeight(1);
            line(histX, histY + histH, histX + histW, histY + histH);
            line(histX, histY, histX, histY + histH);

            // Labels
            fill(150);
            noStroke();
            textSize(8);
            textAlign(CENTER);
            text('0', histX, histY + histH + 12);
            text(maxSpeed.toFixed(0), histX + histW, histY + histH + 12);
            textAlign(RIGHT);
            text('Speed', histX + histW, histY - 2);
        }

        function updateStats() {
            if (frameCount % 5 !== 0) return;

            let temp = calculateTemperature();
            let pressure = calculatePressure();
            let energy = calculateTotalEnergy();

            document.getElementById('temperature').textContent = temp.toFixed(2);
            document.getElementById('pressure').textContent = (pressure * 100).toFixed(1);
            document.getElementById('energy').textContent = energy.toFixed(0);
            document.getElementById('particleCount').textContent = particles.length;
        }

        function keyPressed() {
            if (key === ' ') {
                togglePause();
            } else if (key === 'r' || key === 'R') {
                resetSimulation();
            }
        }

        function windowResized() {
            // Keep canvas size fixed
        }
    </script>
</body>
</html>
