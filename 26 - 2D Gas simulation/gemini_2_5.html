<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Gas Simulation - Statistical Mechanics</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/addons/p5.dom.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #1a1a1a;
            color: #f0f0f0;
            display: flex;
            gap: 20px;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #canvas-container {
            border: 2px solid #555;
            line-height: 0;
            background-color: #000;
        }
        #sidebar {
            display: flex;
            flex-direction: column;
            width: 300px;
            gap: 15px;
        }
        .ui-section {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 5px;
        }
        h3 {
            margin-top: 0;
            border-bottom: 1px solid #555;
            padding-bottom: 5px;
        }
        label, .stat-item {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
        }
        .stat-value {
            font-family: 'Courier New', Courier, monospace;
            color: #4CAF50;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button.toggled {
            background-color: #dc3545;
        }
        #histogram-container {
            position: relative;
            height: 150px;
            background-color: #111;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <main>
        <div id="canvas-container"></div>
    </main>
    <div id="sidebar">
        <div class="ui-section">
            <h3>Controls</h3>
            <div id="sliders"></div>
            <button id="resetButton">Reset Simulation</button>
            <button id="collisionButton">Toggle Collisions</button>
        </div>
        <div class="ui-section">
            <h3>Macroscopic Properties</h3>
            <div id="stats-display"></div>
        </div>
        <div class="ui-section">
            <h3>Speed Distribution</h3>
            <div id="histogram-container"></div>
        </div>
    </div>

<script>
// =======================================================
// 2D GAS SIMULATION in p5.js
// =======================================================

// --- Global Variables ---
let particles = [];
let quadTree;
let box = { w: 600, h: 600 };

// --- Simulation Parameters ---
let params = {
    numParticles: 150,
    temperature: 2,
    boxWidth: 600,
    massRatio: 1.0, // Ratio of mass2 / mass1
    collisionsEnabled: true,
};

// --- Statistics ---
let stats = {
    temperature: 0,
    pressure: 0,
    momentumTransfer: 0,
    history: [],
    historyLength: 60, // Average pressure over 60 frames
};
let histogram;
const histogramBins = 30;

// --- UI Elements ---
let sliders = {};
let collisionButton;

function setup() {
    let canvas = createCanvas(box.w, box.h);
    canvas.parent('canvas-container');

    histogram = createGraphics(270, 150);
    histogram.parent('histogram-container');
    
    createUI();
    resetSimulation();
}

function createUI() {
    const slidersContainer = select('#sliders');
    const statsContainer = select('#stats-display');
    
    sliders.numParticles = createSliderWithLabel(slidersContainer, "Particles", 10, 500, params.numParticles, 1);
    sliders.temperature = createSliderWithLabel(slidersContainer, "Temperature", 0.1, 10, params.temperature, 0.1);
    sliders.boxWidth = createSliderWithLabel(slidersContainer, "Box Width", 300, 800, params.boxWidth, 10);
    sliders.massRatio = createSliderWithLabel(slidersContainer, "Mass Ratio (m2/m1)", 1, 50, params.massRatio, 0.5);

    statsContainer.html(`
        <div class="stat-item">Temperature: <span id="temp-val" class="stat-value">0</span> K</div>
        <div class="stat-item">Pressure: <span id="pressure-val" class="stat-value">0</span> N/m</div>
    `);

    select('#resetButton').mousePressed(resetSimulation);
    collisionButton = select('#collisionButton');
    collisionButton.mousePressed(() => {
        params.collisionsEnabled = !params.collisionsEnabled;
        collisionButton.html(params.collisionsEnabled ? "Toggle Collisions (ON)" : "Toggle Collisions (OFF)");
        collisionButton.toggleClass('toggled', !params.collisionsEnabled);
    });
}

function createSliderWithLabel(parent, label, min, max, initial, step) {
    const p = createP(label).parent(parent);
    p.style('margin', '10px 0 5px 0');
    const s = createSlider(min, max, initial, step).parent(parent);
    s.style('width', '100%');
    const valSpan = createSpan(` (${s.value()})`).parent(p);
    s.input(() => valSpan.html(` (${s.value()})`));
    return s;
}

function resetSimulation() {
    // Read values from sliders
    params.numParticles = sliders.numParticles.value();
    params.temperature = sliders.temperature.value();
    params.boxWidth = sliders.boxWidth.value();
    params.massRatio = sliders.massRatio.value();

    box.w = params.boxWidth;
    box.h = params.boxWidth; // Keep it square
    resizeCanvas(box.w, box.h);

    particles = [];
    stats.history = [];
    stats.momentumTransfer = 0;
    
    const mass1 = 1;
    const mass2 = mass1 * params.massRatio;
    
    for (let i = 0; i < params.numParticles; i++) {
        let isSpecies2 = (i < params.numParticles / 2 && params.massRatio > 1);
        let mass = isSpecies2 ? mass2 : mass1;
        let radius = 5 + Math.sqrt(mass) * 2;
        let newParticle;
        let attempts = 0;

        // Attempt to place particle without overlap
        do {
            let x = random(radius, box.w - radius);
            let y = random(radius, box.h - radius);
            newParticle = new Particle(i, x, y, radius, mass);
            attempts++;
        } while (isOverlapping(newParticle) && attempts < 100);

        if (attempts < 100) {
            // Initial velocity based on temperature
            let speed = sqrt(2 * params.temperature / mass);
            newParticle.vel = p5.Vector.random2D().mult(speed * random(0.5, 1.5));
            particles.push(newParticle);
        }
    }
}

function isOverlapping(p) {
    for (const other of particles) {
        if (dist(p.pos.x, p.pos.y, other.pos.x, other.pos.y) < p.radius + other.radius) {
            return true;
        }
    }
    return false;
}

function draw() {
    background(0);
    stroke(150);
    noFill();
    rect(0, 0, box.w, box.h);

    // --- Build Quadtree for efficient collision detection ---
    let boundary = new Rectangle(box.w / 2, box.h / 2, box.w / 2, box.h / 2);
    quadTree = new QuadTree(boundary, 4);
    for (const p of particles) {
        quadTree.insert(p);
    }
    
    // --- Update Physics and Render ---
    for (const p of particles) {
        p.update();
        if (params.collisionsEnabled) {
            p.checkCollisions(quadTree);
        }
        p.checkWalls();
        p.draw();
    }
    
    // --- Calculate and Display Stats ---
    calculateAndDisplayStats();
}

function calculateAndDisplayStats() {
    let totalKE = 0;
    let speeds = [];

    for (const p of particles) {
        const speed = p.vel.mag();
        totalKE += 0.5 * p.mass * speed * speed;
        speeds.push(speed);
    }

    // Temperature is proportional to the average kinetic energy
    stats.temperature = (totalKE / particles.length);

    // Pressure calculation (force/length for 2D)
    stats.history.push(stats.momentumTransfer);
    if (stats.history.length > stats.historyLength) {
        stats.history.shift();
    }
    let avgMomentumChange = stats.history.reduce((a, b) => a + b, 0) / stats.history.length;
    // Pressure = (Force) / (Perimeter) = (d(momentum)/dt) / (Perimeter)
    let perimeter = 2 * (box.w + box.h);
    stats.pressure = avgMomentumChange / (1 / frameRate()) / perimeter * 1000; // Scaled for display
    stats.momentumTransfer = 0; // Reset for next frame

    // Update HTML display
    select('#temp-val').html(stats.temperature.toFixed(2));
    select('#pressure-val').html(stats.pressure.toFixed(2));
    
    // Update and draw histogram
    drawSpeedHistogram(speeds);
}

function drawSpeedHistogram(speeds) {
    histogram.background(20);
    histogram.noStroke();
    
    let bins = new Array(histogramBins).fill(0);
    const maxSpeed = Math.max(10, ...speeds);

    for (const s of speeds) {
        let binIndex = floor(map(s, 0, maxSpeed, 0, histogramBins));
        if (binIndex < histogramBins) {
            bins[binIndex]++;
        }
    }
    
    const maxCount = Math.max(1, ...bins);
    const binWidth = histogram.width / histogramBins;

    for (let i = 0; i < histogramBins; i++) {
        if(bins[i] > 0) {
            const barHeight = map(bins[i], 0, maxCount, 0, histogram.height);
            histogram.fill(100, 200, 255);
            histogram.rect(i * binWidth, histogram.height - barHeight, binWidth - 1, barHeight);
        }
    }
    
    image(histogram, 0, 0);
}


// =======================================================
// PARTICLE CLASS
// =======================================================
class Particle {
    constructor(id, x, y, r, m) {
        this.id = id;
        this.pos = createVector(x, y);
        this.vel = createVector(0, 0);
        this.radius = r;
        this.mass = m;
        this.color = (m > 1) ? color(255, 204, 0) : color(0, 150, 255);
    }

    update() {
        this.pos.add(this.vel);
    }

    draw() {
        noStroke();
        fill(this.color);
        ellipse(this.pos.x, this.pos.y, this.radius * 2);
    }

    checkWalls() {
        if (this.pos.x < this.radius) {
            this.pos.x = this.radius;
            stats.momentumTransfer += 2 * this.mass * abs(this.vel.x);
            this.vel.x *= -1;
        } else if (this.pos.x > box.w - this.radius) {
            this.pos.x = box.w - this.radius;
            stats.momentumTransfer += 2 * this.mass * abs(this.vel.x);
            this.vel.x *= -1;
        }
        if (this.pos.y < this.radius) {
            this.pos.y = this.radius;
            stats.momentumTransfer += 2 * this.mass * abs(this.vel.y);
            this.vel.y *= -1;
        } else if (this.pos.y > box.h - this.radius) {
            this.pos.y = box.h - this.radius;
            stats.momentumTransfer += 2 * this.mass * abs(this.vel.y);
            this.vel.y *= -1;
        }
    }

    checkCollisions(quadtree) {
        let range = new Rectangle(this.pos.x, this.pos.y, this.radius * 2, this.radius * 2);
        let others = quadtree.query(range);

        for (const other of others) {
            if (this.id >= other.id) continue; // Avoid double checks and self-collision

            let d = p5.Vector.sub(other.pos, this.pos);
            let distSq = d.magSq();
            let rSum = this.radius + other.radius;

            if (distSq < rSum * rSum) {
                this.resolveCollision(other, d);
            }
        }
    }

    resolveCollision(other, d) {
        let distance = sqrt(d.magSq());
        
        // --- Elastic Collision Physics ---
        // Normal and tangent vectors
        let normal = d.copy().normalize();
        let tangent = createVector(-normal.y, normal.x);

        // Project velocities onto normal and tangent
        let v1n = this.vel.dot(normal);
        let v1t = this.vel.dot(tangent);
        let v2n = other.vel.dot(normal);
        let v2t = other.vel.dot(tangent);

        // 1D collision formula for the normal components
        let v1n_new = (v1n * (this.mass - other.mass) + 2 * other.mass * v2n) / (this.mass + other.mass);
        let v2n_new = (v2n * (other.mass - this.mass) + 2 * this.mass * v1n) / (this.mass + other.mass);

        // Convert scalar normal velocities back to vectors
        let v1n_vec = normal.copy().mult(v1n_new);
        let v2n_vec = normal.copy().mult(v2n_new);

        // Tangential velocities remain the same
        let v1t_vec = tangent.copy().mult(v1t);
        let v2t_vec = tangent.copy().mult(v2t);

        // Recombine to get final velocities
        this.vel = v1n_vec.add(v1t_vec);
        other.vel = v2n_vec.add(v2t_vec);
        
        // --- Overlap Correction ---
        let overlap = (this.radius + other.radius) - distance;
        if (overlap > 0) {
            let correction = normal.mult(overlap / 2);
            this.pos.sub(correction);
            other.pos.add(correction);
        }
    }
}

// =======================================================
// QUADTREE CLASS (FOR EFFICIENT COLLISION DETECTION)
// =======================================================
class Rectangle {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; // Center
        this.w = w; this.h = h; // Half-width, half-height
    }
    contains(particle) {
        return (particle.pos.x >= this.x - this.w &&
                particle.pos.x < this.x + this.w &&
                particle.pos.y >= this.y - this.h &&
                particle.pos.y < this.y + this.h);
    }
    intersects(range) {
        return !(range.x - range.w > this.x + this.w ||
                 range.x + range.w < this.x - this.w ||
                 range.y - range.h > this.y + this.h ||
                 range.y + range.h < this.y - this.h);
    }
}

class QuadTree {
    constructor(boundary, capacity) {
        this.boundary = boundary;
        this.capacity = capacity;
        this.particles = [];
        this.divided = false;
    }

    subdivide() {
        let x = this.boundary.x;
        let y = this.boundary.y;
        let w = this.boundary.w / 2;
        let h = this.boundary.h / 2;
        this.ne = new QuadTree(new Rectangle(x + w, y - h, w, h), this.capacity);
        this.nw = new QuadTree(new Rectangle(x - w, y - h, w, h), this.capacity);
        this.se = new QuadTree(new Rectangle(x + w, y + h, w, h), this.capacity);
        this.sw = new QuadTree(new Rectangle(x - w, y + h, w, h), this.capacity);
        this.divided = true;
    }

    insert(particle) {
        if (!this.boundary.contains(particle)) return false;

        if (this.particles.length < this.capacity) {
            this.particles.push(particle);
            return true;
        }
        
        if (!this.divided) this.subdivide();

        return (this.ne.insert(particle) || this.nw.insert(particle) ||
                this.se.insert(particle) || this.sw.insert(particle));
    }

    query(range, found) {
        if (!found) found = [];
        if (!this.boundary.intersects(range)) return found;

        for (let p of this.particles) {
            if (range.contains(p)) {
                found.push(p);
            }
        }
        if (this.divided) {
            this.nw.query(range, found);
            this.ne.query(range, found);
            this.sw.query(range, found);
            this.se.query(range, found);
        }
        return found;
    }
}
</script>
</body>
</html>
