<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Eukaryotic Cell Simulation</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050510;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .panel {
            background: rgba(10, 15, 30, 0.8);
            border: 1px solid rgba(100, 200, 255, 0.3);
            padding: 15px;
            margin: 20px;
            border-radius: 8px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #4db8ff; }
        .controls button, .controls input {
            background: #1a2a40; color: white; border: 1px solid #4db8ff;
            padding: 8px 12px; margin: 5px 5px 5px 0; border-radius: 4px;
            cursor: pointer; transition: 0.2s;
        }
        .controls button:hover { background: #4db8ff; color: #000; }
        .tooltip { font-size: 0.9rem; color: #aaa; margin-top: 10px; }
        #timeline { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <canvas id="sim-canvas"></canvas>

    <div id="ui-layer">
        <div class="panel" style="align-self: flex-start;">
            <h1>Eukaryotic Cell Inspector</h1>
            <div class="controls">
                <button id="btn-play">Pause/Play</button>
                <button id="btn-mitosis">Trigger Mitosis</button>
                <br>
                <label for="speed">Sim Speed: </label>
                <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1">
            </div>
            <div class="tooltip" id="info-tooltip">Hover over organelles to learn more...</div>
        </div>
        
        <div class="panel" style="align-self: center; width: 80%; text-align: center; margin-bottom: 30px;">
            <label for="timeline">Cell Cycle Phase:</label>
            <input type="range" id="timeline" min="0" max="100" value="0" disabled>
            <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 5px; color: #888;">
                <span>Interphase</span>
                <span>Prophase</span>
                <span>Metaphase</span>
                <span>Anaphase</span>
                <span>Telophase</span>
                <span>Cytokinesis</span>
            </div>
        </div>
    </div>

    <script type="text/wgsl" id="shader-code">
        struct Uniforms {
            mvpMatrix : mat4x4<f32>,
            time : f32,
        };
        @binding(0) @group(0) var<uniform> uniforms : Uniforms;

        struct VertexInput {
            @location(0) position : vec3<f32>,
            @location(1) color : vec3<f32>,
        };

        struct VertexOutput {
            @builtin(position) position : vec4<f32>,
            @location(0) color : vec4<f32>,
        };

        // Vertex Shader: Handles 3D transformations and pulsing effects
        @vertex
        fn vs_main(input : VertexInput) -> VertexOutput {
            var output : VertexOutput;
            
            // Simple biological pulsing effect based on time
            let pulse = 1.0 + sin(uniforms.time * 2.0 + input.position.x) * 0.05;
            let animatedPos = vec4<f32>(input.position * pulse, 1.0);
            
            output.position = uniforms.mvpMatrix * animatedPos;
            output.color = vec4<f32>(input.color, 0.8); // Semi-transparent
            return output;
        }

        // Fragment Shader: High-quality glowing material proxy
        @fragment
        fn fs_main(input : VertexOutput) -> @location(0) vec4<f32> {
            // In a full implementation, lighting/shadow calculations go here
            return input.color;
        }
    </script>

    <script>
        // Minimal Zero-Dependency 3D Math Library (mat4)
        const Mat4 = {
            create: () => new Float32Array(16),
            perspective: (out, fovy, aspect, near, far) => {
                const f = 1.0 / Math.tan(fovy / 2);
                out.fill(0);
                out[0] = f / aspect; out[5] = f;
                out[10] = (far + near) / (near - far); out[11] = -1;
                out[14] = (2 * far * near) / (near - far);
                return out;
            },
            lookAt: (out, eye, center, up) => {
                let x0, x1, x2, y0, y1, y2, z0, z1, z2, len;
                let eyex = eye[0], eyey = eye[1], eyez = eye[2];
                let upx = up[0], upy = up[1], upz = up[2];
                let centerx = center[0], centery = center[1], centerz = center[2];
                z0 = eyex - centerx; z1 = eyey - centery; z2 = eyez - centerz;
                len = 1 / Math.hypot(z0, z1, z2);
                z0 *= len; z1 *= len; z2 *= len;
                x0 = upy * z2 - upz * z1; x1 = upz * z0 - upx * z2; x2 = upx * z1 - upy * z0;
                len = 1 / Math.hypot(x0, x1, x2);
                x0 *= len; x1 *= len; x2 *= len;
                y0 = z1 * x2 - z2 * x1; y1 = z2 * x0 - z0 * x2; y2 = z0 * x1 - z1 * x0;
                out[0] = x0; out[1] = y0; out[2] = z0; out[3] = 0;
                out[4] = x1; out[5] = y1; out[6] = z1; out[7] = 0;
                out[8] = x2; out[9] = y2; out[10] = z2; out[11] = 0;
                out[12] = -(x0 * eyex + x1 * eyey + x2 * eyez);
                out[13] = -(y0 * eyex + y1 * eyey + y2 * eyez);
                out[14] = -(z0 * eyex + z1 * eyey + z2 * eyez);
                out[15] = 1;
                return out;
            },
            multiply: (out, a, b) => {
                let a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
                let a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
                let a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
                let a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
                let b0  = b[0], b1 = b[1], b2 = b[2], b3 = b[3];
                out[0] = b0*a00 + b1*a10 + b2*a20 + b3*a30; out[1] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
                out[2] = b0*a02 + b1*a12 + b2*a22 + b3*a32; out[3] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
                b0 = b[4]; b1 = b[5]; b2 = b[6]; b3 = b[7];
                out[4] = b0*a00 + b1*a10 + b2*a20 + b3*a30; out[5] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
                out[6] = b0*a02 + b1*a12 + b2*a22 + b3*a32; out[7] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
                b0 = b[8]; b1 = b[9]; b2 = b[10]; b3 = b[11];
                out[8] = b0*a00 + b1*a10 + b2*a20 + b3*a30; out[9] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
                out[10] = b0*a02 + b1*a12 + b2*a22 + b3*a32; out[11] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
                b0 = b[12]; b1 = b[13]; b2 = b[14]; b3 = b[15];
                out[12] = b0*a00 + b1*a10 + b2*a20 + b3*a30; out[13] = b0*a01 + b1*a11 + b2*a21 + b3*a31;
                out[14] = b0*a02 + b1*a12 + b2*a22 + b3*a32; out[15] = b0*a03 + b1*a13 + b2*a23 + b3*a33;
                return out;
            }
        };

        // State Variables
        let isPlaying = true;
        let simSpeed = 1.0;
        let isMitosis = false;
        let time = 0;
        
        async function initWebGPU() {
            if (!navigator.gpu) {
                document.getElementById('info-tooltip').innerText = "WebGPU is not supported in this browser.";
                return;
            }

            const canvas = document.getElementById('sim-canvas');
            const adapter = await navigator.gpu.requestAdapter();
            const device = await adapter.requestDevice();
            const context = canvas.getContext('webgpu');
            const format = navigator.gpu.getPreferredCanvasFormat();

            context.configure({ device, format, alphaMode: 'premultiplied' });

            // Generate procedural data for organelles (Placeholder geometries)
            // Real implementation would parse complex arrays of vertices for Nucleus, ER, Golgi, etc.
            const vertices = new Float32Array([
                // X, Y, Z, R, G, B
                -1, -1, 0,  0.8, 0.2, 0.8, // Nucleus proxy (purple)
                 1, -1, 0,  0.8, 0.2, 0.8,
                 0,  1, 0,  1.0, 0.5, 1.0
            ]);

            const vertexBuffer = device.createBuffer({
                size: vertices.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
            });
            device.queue.writeBuffer(vertexBuffer, 0, vertices);

            // Shader Module setup
            const shaderCode = document.getElementById('shader-code').textContent;
            const shaderModule = device.createShaderModule({ code: shaderCode });

            // Pipeline setup (including depth and alpha blending for transparency)
            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vs_main',
                    buffers: [{
                        arrayStride: 24, // 6 floats * 4 bytes
                        attributes: [
                            { shaderLocation: 0, offset: 0, format: 'float32x3' }, // position
                            { shaderLocation: 1, offset: 12, format: 'float32x3' } // color
                        ]
                    }]
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ 
                        format: format,
                        blend: {
                            color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                            alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
                        }
                    }]
                },
                primitive: { topology: 'triangle-list' }
            });

            // Uniform buffer (Camera MVP matrix + time)
            const uniformBufferSize = 64 + 4 + 12; // mat4 + float (time) + padding
            const uniformBuffer = device.createBuffer({
                size: uniformBufferSize,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });

            const bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
            });

            // Camera Setup
            const projMatrix = Mat4.create();
            const viewMatrix = Mat4.create();
            const mvpMatrix = Mat4.create();

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                Mat4.perspective(projMatrix, Math.PI / 4, canvas.width / canvas.height, 0.1, 100.0);
            }
            window.addEventListener('resize', resize);
            resize();

            // UI Listeners
            document.getElementById('btn-play').addEventListener('click', () => isPlaying = !isPlaying);
            document.getElementById('btn-mitosis').addEventListener('click', () => {
                isMitosis = true;
                document.getElementById('timeline').value = 0;
            });
            document.getElementById('speed').addEventListener('input', (e) => simSpeed = parseFloat(e.target.value));

            // Render Loop
            let lastFrameTime = performance.now();
            
            function frame() {
                const now = performance.now();
                const dt = (now - lastFrameTime) / 1000.0;
                lastFrameTime = now;

                if (isPlaying) {
                    time += dt * simSpeed;
                    
                    // Mitosis timeline logic simulation
                    if (isMitosis) {
                        let tl = document.getElementById('timeline');
                        tl.value = Math.min(100, parseFloat(tl.value) + (dt * simSpeed * 5));
                        if(tl.value >= 100) isMitosis = false; // Reset when complete
                    }
                }

                // Orbit Camera
                const radius = 5.0;
                Mat4.lookAt(viewMatrix, 
                    [Math.sin(time * 0.2) * radius, 2, Math.cos(time * 0.2) * radius], 
                    [0, 0, 0], [0, 1, 0]
                );
                Mat4.multiply(mvpMatrix, projMatrix, viewMatrix);

                // Update Uniforms
                device.queue.writeBuffer(uniformBuffer, 0, mvpMatrix.buffer);
                device.queue.writeBuffer(uniformBuffer, 64, new Float32Array([time]));

                // Rendering Commands
                const commandEncoder = device.createCommandEncoder();
                const textureView = context.getCurrentTexture().createView();
                const renderPass = commandEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.02, g: 0.02, b: 0.06, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store'
                    }]
                });

                renderPass.setPipeline(pipeline);
                renderPass.setBindGroup(0, bindGroup);
                renderPass.setVertexBuffer(0, vertexBuffer);
                renderPass.draw(3, 1, 0, 0); // Drawing the placeholder geometry
                renderPass.end();
                
                device.queue.submit([commandEncoder.finish()]);
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        initWebGPU();
    </script>
</body>
</html>
