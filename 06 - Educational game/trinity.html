<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Explorers: The Particle Quest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.0.4/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #game-container {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        #svg-canvas {
            width: 100%;
            height: 100%;
            cursor: default;
        }

        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 100;
        }

        .ui-panel {
            background: rgba(10, 20, 40, 0.85);
            border: 2px solid #4a6fff;
            border-radius: 12px;
            padding: 15px;
            pointer-events: auto;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .panel-title {
            color: #4a6fff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #4a6fff;
            text-shadow: 0 0 10px rgba(74, 111, 255, 0.5);
        }

        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
        }

        #message-panel {
            max-width: 400px;
            min-height: 150px;
        }

        .message {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .message.system {
            color: #4a6fff;
        }

        .message.success {
            color: #4fff4a;
        }

        .message.challenge {
            color: #ffaa4a;
        }

        .btn {
            background: linear-gradient(135deg, #4a6fff 0%, #2a4aff 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(74, 111, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        #player-info {
            text-align: center;
        }

        .player-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 10px;
            border: 3px solid #4a6fff;
            box-shadow: 0 0 20px rgba(74, 111, 255, 0.5);
        }

        .player-name {
            font-size: 1.2rem;
            color: #4a6fff;
            margin-bottom: 5px;
        }

        .player-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-box .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffaa4a;
        }

        .stat-box .label {
            font-size: 0.8rem;
            color: #aaa;
        }

        #particle-display {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .particle-icon {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #dice-panel {
            text-align: center;
        }

        #dice {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ff4a4a 0%, #aa1a1a 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin: 10px auto;
            cursor: pointer;
            border: 3px solid #ff6a6a;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
            transition: transform 0.1s;
        }

        #dice:hover {
            transform: scale(1.05);
        }

        #dice:active {
            transform: scale(0.95);
        }

        #quantum-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        #quantum-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4a4a 0%, #ffaa4a 50%, #4fff4a 100%);
            width: 0%;
            transition: width 0.5s;
        }

        #card-display {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 30, 60, 0.95);
            border: 3px solid #4a6fff;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            z-index: 200;
            box-shadow: 0 0 50px rgba(74, 111, 255, 0.7);
        }

        .card-title {
            color: #4a6fff;
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .card-content {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: linear-gradient(135deg, #4a6fff 0%, #2a4aff 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .option-btn:hover {
            transform: translateX(5px);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #4fff4a 0%, #2aff2a 100%);
        }

        .option-btn.incorrect {
            background: linear-gradient(135deg, #ff4a4a 0%, #ff2a2a 100%);
        }

        .close-card {
            position: absolute;
            top: 10px;
            right: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
        }

        .close-card:hover {
            color: #ff4a4a;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            border: 3px solid #4a6fff;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            z-index: 300;
            color: white;
        }

        .game-over-title {
            font-size: 2.5rem;
            color: #4fff4a;
            margin-bottom: 30px;
        }

        .game-over-message {
            font-size: 1.3rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .restart-btn {
            background: linear-gradient(135deg, #ffaa4a 0%, #ff7a4a 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .restart-btn:hover {
            transform: scale(1.05);
        }

        .quantum-effect {
            animation: quantumPulse 2s infinite;
        }

        @keyframes quantumPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        @media (max-width: 768px) {
            #ui-overlay {
                flex-direction: column;
                gap: 15px;
            }
            
            .ui-panel {
                padding: 10px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <svg id="svg-canvas" width="100%" height="100%"></svg>
        
        <div id="ui-overlay">
            <div class="ui-panel" id="message-panel">
                <div class="panel-title">Quantum Log</div>
                <div id="messages"></div>
            </div>
            
            <div class="ui-panel" id="player-panel">
                <div class="panel-title">Player Stats</div>
                <div class="player-avatar" id="player-avatar"></div>
                <div class="player-name" id="player-name">Quantum Explorer</div>
                <div class="player-stats">
                    <div class="stat-box">
                        <div class="value" id="moves">0</div>
                        <div class="label">Moves</div>
                    </div>
                    <div class="stat-box">
                        <div class="value" id="energy">100</div>
                        <div class="label">Energy</div>
                    </div>
                    <div class="stat-box">
                        <div class="value" id="knowledge">0</div>
                        <div class="label">Knowledge</div>
                    </div>
                </div>
                <div id="particle-display"></div>
            </div>
            
            <div class="ui-panel" id="dice-panel">
                <div class="panel-title">Quantum Dice</div>
                <div id="dice">?</div>
                <div id="quantum-bar">
                    <div id="quantum-fill"></div>
                </div>
                <div style="font-size: 0.8rem; color: #aaa; margin-top: 5px;">
                    Quantum Charge: <span id="quantum-text">0%</span>
                </div>
                <button class="btn" id="roll-btn" onclick="rollDice()">Roll Dice</button>
                <div id="card-instruction" style="font-size: 0.9rem; color: #ffaa4a; margin-top: 10px;">
                    Land on quantum nodes to answer questions!
                </div>
            </div>
        </div>
    </div>

    <div id="card-display">
        <div class="close-card">&times;</div>
        <div class="card-title" id="card-title"></div>
        <div class="card-content" id="card-content"></div>
        <div class="card-options" id="card-options"></div>
    </div>

    <div id="game-over">
        <div class="game-over-title" id="game-over-title"></div>
        <div class="game-over-message" id="game-over-message"></div>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <script>
        // ========== GAME STATE ==========
        let draw, svg, width, height;
        let player, playerPosition = 0;
        let quantumCharge = 0;
        let moves = 0;
        let knowledge = 0;
        let energy = 100;
        let particles = {
            quark: 0,
            electron: 0,
            neutrino: 0,
            gluon: 0
        };
        let gameActive = true;
        let quantumNodes = [];
        let specialNodes = [];
        let currentCard = null;
        
        // Quantum question database
        const quantumQuestions = [
            {
                title: "Superposition State",
                content: "In quantum mechanics, a particle can exist in multiple states at once until it is measured. This is known as:",
                options: ["A) Quantum entanglement", "B) Wave-particle duality", "C) Superposition", "D) Uncertainty principle"],
                correct: 2,
                knowledge: 20,
                energy: -10
            },
            {
                title: "Heisenberg's Uncertainty",
                content: "Which two properties of a quantum particle cannot both be known with perfect precision at the same time?",
                options: ["A) Position and momentum", "B) Mass and charge", "C) Spin and color", "D) Energy and time"],
                correct: 0,
                knowledge: 25,
                energy: -15
            },
            {
                title: "Quantum Entanglement",
                content: "When two particles become entangled, the state of one particle is instantly correlated with the state of the other, no matter the distance. This phenomenon is:",
                options: ["A) Local", "B) Classical", "C) Non-local", "D) Deterministic"],
                correct: 2,
                knowledge: 30,
                energy: -20
            },
            {
                title: "Wave-Particle Duality",
                content: "Light exhibits both wave-like and particle-like properties. This is known as:",
                options: ["A) Quantum tunneling", "B) Wave-particle duality", "C) Quantum superposition", "D) Quantum decoherence"],
                correct: 1,
                knowledge: 15,
                energy: -5
            },
            {
                title: "Quantum Tunneling",
                content: "The phenomenon where a particle can pass through a potential barrier that it classically shouldn't be able to is called:",
                options: ["A) Quantum leap", "B) Quantum tunneling", "C) Quantum teleportation", "D) Quantum superposition"],
                correct: 1,
                knowledge: 25,
                energy: -15
            },
            {
                title: "Schrödinger's Cat",
                content: "In Schrödinger's famous thought experiment, the cat is in a superposition of what two states?",
                options: ["A) Alive and dead", "B) Sleeping and awake", "C) Hungry and full", "D) Hidden and visible"],
                correct: 0,
                knowledge: 20,
                energy: -10
            },
            {
                title: "Quantum Spin",
                content: "Quantum spin is:",
                options: ["A) The physical rotation of a particle", "B) An intrinsic form of angular momentum", "C) The path a particle takes", "D) The speed of a particle"],
                correct: 1,
                knowledge: 15,
                energy: -5
            },
            {
                title: "Standard Model",
                content: "Which of these is NOT one of the fundamental fermions in the Standard Model?",
                options: ["A) Quarks", "B) Leptons", "C) Bosons", "D) Neutrinos"],
                correct: 2,
                knowledge: 30,
                energy: -20
            },
            {
                title: "Wave Function",
                content: "What does the square of the wave function's magnitude represent?",
                options: ["A) Particle's velocity", "B) Probability density", "C) Energy level", "D) Spin direction"],
                correct: 1,
                knowledge: 20,
                energy: -10
            },
            {
                title: "Quantum Decoherence",
                content: "The process by which a quantum system loses its quantum behavior due to interaction with its environment is called:",
                options: ["A) Quantum superposition", "B) Quantum entanglement", "C) Quantum decoherence", "D) Quantum tunneling"],
                correct: 2,
                knowledge: 25,
                energy: -15
            }
        ];

        // Special events database
        const specialEvents = [
            {
                title: "Quantum Fluctuation",
                content: "A temporary change in energy has occurred! Gain 20 energy but lose 1 turn.",
                type: "energy",
                energy: 20,
                turns: -1
            },
            {
                title: "Particle Storm",
                content: "You've been caught in a particle storm! Lose 30 energy but gain 2 quarks.",
                type: "particles",
                energy: -30,
                particles: { quark: 2 },
                knowledge: 10
            },
            {
                title: "Entanglement Discovery",
                content: "You've discovered quantum entanglement! Gain 30 knowledge and 1 gluon.",
                type: "knowledge",
                knowledge: 30,
                particles: { gluon: 1 }
            },
            {
                title: "Uncertainty Principle",
                content: "You cannot measure both position and momentum precisely. Lose 15 energy.",
                type: "energy",
                energy: -15
            },
            {
                title: "Quantum Teleportation",
                content: "You've successfully teleported! Move forward 5 spaces.",
                type: "move",
                spaces: 5
            }
        ];

        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize SVG
            svg = SVG('svg-canvas').size('100%', '100%');
            width = window.innerWidth;
            height = window.innerHeight;
            
            // Create game board
            createBoard();
            
            // Create player
            createPlayer();
            
            // Generate quantum nodes
            generateQuantumNodes();
            
            // Set up event listeners
            setupEventListeners();
            
            // Show welcome message
            showMessage("Welcome to Quantum Explorers! Roll the dice to begin your journey.", "system");
            
            // Update UI
            updateUI();
        });

        function createBoard() {
            // Draw background with quantum foam pattern
            const foamGroup = svg.group().attr('class', 'quantum-foam');
            
            // Create quantum foam effect with random circles
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const radius = Math.random() * 3 + 1;
                const opacity = Math.random() * 0.3 + 0.1;
                
                foamGroup.circle(radius)
                    .move(x, y)
                    .attr('fill', 'rgba(74, 111, 255, ' + opacity + ')');
            }
            
            // Draw spiral galaxy pattern (main game board)
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.min(width, height) * 0.4;
            
            // Create spiral arms
            const arms = 5;
            const armPoints = [];
            
            for (let arm = 0; arm < arms; arm++) {
                const angleOffset = (arm / arms) * Math.PI * 2;
                
                for (let i = 0; i < 200; i++) {
                    const angle = angleOffset + i * 0.1;
                    const radius = (i / 200) * maxRadius;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;
                    
                    armPoints.push({ x, y });
                    
                    // Draw star
                    if (i % 5 === 0) {
                        svg.circle(2)
                            .move(x, y)
                            .attr('fill', '#fffacd')
                            .opacity(0.8);
                    }
                }
            }
            
            // Draw connection lines between stars to create galaxy structure
            for (let i = 0; i < armPoints.length; i += 10) {
                const p1 = armPoints[i];
                const p2 = armPoints[(i + 20) % armPoints.length];
                
                svg.line(p1.x, p1.y, p2.x, p2.y)
                    .stroke({ width: 1, color: 'rgba(100, 150, 255, 0.1)' });
            }
            
            // Add central black hole
            const blackHole = svg.group().attr('class', 'quantum-effect');
            blackHole.circle(80)
                .move(centerX - 40, centerY - 40)
                .attr('fill', 'black')
                .attr('stroke', '#4a6fff')
                .attr('stroke-width', 3);
            
            // Add accretion disk
            blackHole.circle(120)
                .move(centerX - 60, centerY - 60)
                .attr('fill', 'none')
                .attr('stroke', 'rgba(255, 100, 50, 0.5)')
                .attr('stroke-width', 5)
                .attr('stroke-dasharray', '30, 15');
            
            blackHole.circle(140)
                .move(centerX - 70, centerY - 70)
                .attr('fill', 'none')
                .attr('stroke', 'rgba(100, 200, 255, 0.3)')
                .attr('stroke-width', 3)
                .attr('stroke-dasharray', '20, 10');
            
            // Add destination marker
            const destination = svg.group();
            destination.circle(40)
                .move(centerX - 20, centerY - 160)
                .attr('fill', '#4fff4a')
                .attr('stroke', '#2aff2a')
                .attr('stroke-width', 3)
                .attr('class', 'quantum-effect');
            
            destination.text('FINISH')
                .move(centerX - 30, centerY - 165)
                .attr('fill', 'black')
                .attr('font-size', 12)
                .attr('font-weight', 'bold')
                .attr('text-anchor', 'middle');
            
            // Store important positions
            window.gameBoard = {
                centerX,
                centerY,
                maxRadius,
                blackHole: { x: centerX, y: centerY },
                destination: { x: centerX, y: centerY - 160 },
                armPoints
            };
        }

        function createPlayer() {
            const board = window.gameBoard;
            player = svg.group().attr('class', 'quantum-effect');
            
            // Create player token as a quantum particle
            player.circle(30)
                .attr('fill', '#ff4a4a')
                .attr('stroke', '#ff2a2a')
                .attr('stroke-width', 3);
            
            // Add quantum symbol
            player.text('Q')
                .attr('fill', 'white')
                .attr('font-size', 18)
                .attr('font-weight', 'bold')
                .attr('text-anchor', 'middle')
                .move(0, 5);
            
            // Start position near black hole
            playerPosition = 0;
            updatePlayerPosition();
            
            // Add player info to UI
            document.getElementById('player-avatar').innerHTML = '';
            const avatar = svg.select('#player-avatar').first();
            if (avatar) avatar.remove();
            
            const uiAvatar = SVG('#player-avatar');
            uiAvatar.circle(40)
                .attr('fill', '#ff4a4a')
                .attr('stroke', '#ff2a2a')
                .attr('stroke-width', 3);
            uiAvatar.text('Q')
                .attr('fill', 'white')
                .attr('font-size', 24)
                .attr('font-weight', 'bold')
                .move(20, 10);
        }

        function generateQuantumNodes() {
            // Clear existing nodes
            quantumNodes = [];
            svg.select('.quantum-node').forEach(n => n.remove());
            
            const board = window.gameBoard;
            const nodeCount = 30;
            
            for (let i = 0; i < nodeCount; i++) {
                // Position along spiral arms
                const armIndex = i % 5;
                const progress = Math.floor(i / 5) / 6;
                const angleOffset = (armIndex / 5) * Math.PI * 2;
                const angle = angleOffset + progress * 4; // Spread along arm
                const radius = progress * board.maxRadius * 0.8;
                
                const x = board.centerX + Math.cos(angle) * radius;
                const y = board.centerY + Math.sin(angle) * radius;
                
                // Create node
                const node = svg.circle(20)
                    .move(x - 10, y - 10)
                    .attr('fill', 'rgba(74, 111, 255, 0.3)')
                    .attr('stroke', '#4a6fff')
                    .attr('stroke-width', 2)
                    .attr('class', 'quantum-node')
                    .data('position', i)
                    .data('type', 'quantum')
                    .click(handleNodeClick);
                
                // Add label
                const label = svg.text(`Q${i + 1}`)
                    .move(x - 15, y + 15)
                    .attr('fill', '#4a6fff')
                    .attr('font-size', 10)
                    .attr('text-anchor', 'middle');
                
                quantumNodes.push({
                    id: `node-${i}`,
                    x,
                    y,
                    position: i,
                    type: 'quantum',
                    element: node,
                    label: label
                });
                
                // Randomly add special nodes (5% chance)
                if (Math.random() < 0.05) {
                    node.data('type', 'special')
                        .attr('fill', 'rgba(255, 170, 74, 0.3)')
                        .attr('stroke', '#ffaa4a');
                    label.attr('fill', '#ffaa4a');
                    
                    specialNodes.push({
                        id: `special-${i}`,
                        x,
                        y,
                        position: i,
                        type: 'special',
                        element: node,
                        label: label
                    });
                }
            }
            
            // Add start and finish nodes
            const startNode = svg.circle(30)
                .move(board.centerX - 15, board.centerY + board.maxRadius - 15)
                .attr('fill', 'rgba(74, 111, 255, 0.5)')
                .attr('stroke', '#4a6fff')
                .attr('stroke-width', 3)
                .data('position', -1)
                .data('type', 'start');
            
            const finishNode = svg.circle(30)
                .move(board.destination.x - 15, board.destination.y - 15)
                .attr('fill', 'rgba(79, 255, 74, 0.5)')
                .attr('stroke', '#4fff4a')
                .attr('stroke-width', 3)
                .data('position', quantumNodes.length)
                .data('type', 'finish');
            
            quantumNodes.unshift({
                id: 'start',
                x: board.centerX,
                y: board.centerY + board.maxRadius,
                position: -1,
                type: 'start',
                element: startNode
            });
            
            quantumNodes.push({
                id: 'finish',
                x: board.destination.x,
                y: board.destination.y,
                position: quantumNodes.length,
                type: 'finish',
                element: finishNode
            });
        }

        function updatePlayerPosition() {
            const board = window.gameBoard;
            let targetX, targetY;
            
            if (playerPosition === -1) {
                targetX = board.centerX;
                targetY = board.centerY + board.maxRadius;
            } else if (playerPosition === quantumNodes.length - 1) {
                targetX = board.destination.x;
                targetY = board.destination.y;
            } else if (playerPosition >= 0 && playerPosition < quantumNodes.length) {
                const node = quantumNodes[playerPosition];
                targetX = node.x;
                targetY = node.y;
            } else {
                // Player finished
                targetX = board.destination.x;
                targetY = board.destination.y;
            }
            
            // Animate player movement
            player.animate(500, '<>', 0).move(targetX - 15, targetY - 15);
        }

        function handleNodeClick() {
            if (!gameActive || currentCard) return;
            
            const nodePos = this.data('position');
            if (nodePos === playerPosition) {
                showMessage("You're already on this node. Roll the dice to move!", "system");
            } else if (nodePos < playerPosition) {
                showMessage("You need to move forward, not backward!", "system");
            } else {
                showMessage(`You need to roll a ${nodePos - playerPosition} to reach this node.`, "system");
            }
        }

        // ========== GAMEPLAY ==========
        function rollDice() {
            if (!gameActive || currentCard) return;
            
            const dice = document.getElementById('dice');
            dice.textContent = '?';
            
            // Animate dice roll
            let rolls = 0;
            const maxRolls = 15;
            const interval = setInterval(() => {
                dice.textContent = Math.floor(Math.random() * 6) + 1;
                rolls++;
                if (rolls >= maxRolls) {
                    clearInterval(interval);
                    const rollResult = parseInt(dice.textContent);
                    handleMove(rollResult);
                }
            }, 50);
        }

        function handleMove(spaces) {
            if (playerPosition + spaces >= quantumNodes.length - 1) {
                // Player reaches finish
                playerPosition = quantumNodes.length - 1;
                updatePlayerPosition();
                showMessage("Congratulations! You've reached the Quantum Computer!", "success");
                endGame(true);
                return;
            }
            
            playerPosition += spaces;
            updatePlayerPosition();
            moves++;
            
            // Check what type of node we landed on
            const currentNode = quantumNodes[playerPosition];
            showMessage(`You moved ${spaces} spaces and landed on node Q${playerPosition + 1}!`, "system");
            
            // Update energy based on distance from start
            energy = Math.max(0, energy - 2);
            
            // Check for quantum node
            if (currentNode.type === 'quantum') {
                showCard('quantum', quantumQuestions[Math.floor(Math.random() * quantumQuestions.length)]);
            } 
            // Check for special node
            else if (currentNode.type === 'special') {
                showCard('special', specialEvents[Math.floor(Math.random() * specialEvents.length)]);
            }
            
            updateUI();
        }

        function showCard(type, cardData) {
            currentCard = { type, data: cardData };
            
            document.getElementById('card-title').textContent = cardData.title;
            document.getElementById('card-content').textContent = cardData.content;
            
            const optionsContainer = document.getElementById('card-options');
            optionsContainer.innerHTML = '';
            
            if (type === 'quantum') {
                // Multiple choice question
                cardData.options.forEach((option, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = option;
                    btn.onclick = () => checkAnswer(index, btn);
                    optionsContainer.appendChild(btn);
                });
            } else if (type === 'special') {
                // Special event - just display message
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = "Continue";
                btn.onclick = () => resolveSpecialEvent(btn);
                optionsContainer.appendChild(btn);
            }
            
            document.getElementById('card-display').style.display = 'flex';
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (!currentCard || currentCard.type !== 'quantum') return;
            
            const question = currentCard.data;
            const isCorrect = selectedIndex === question.correct;
            
            // Disable all buttons
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            if (isCorrect) {
                btnElement.classList.add('correct');
                showMessage(`Correct! You gained ${question.knowledge} knowledge.`, "success");
                
                knowledge += question.knowledge;
                energy = Math.max(0, energy + question.energy);
                
                // Increase quantum charge
                quantumCharge = Math.min(100, quantumCharge + 20);
            } else {
                btnElement.classList.add('incorrect');
                showMessage(`Incorrect. The correct answer was: ${question.options[question.correct]}.`, "challenge");
                
                energy = Math.max(0, energy + question.energy); // Energy change can be negative
                knowledge += 5; // Still gain some knowledge for trying
                
                // Decrease quantum charge
                quantumCharge = Math.max(0, quantumCharge - 10);
            }
            
            updateUI();
            setTimeout(() => {
                document.getElementById('card-display').style.display = 'none';
                currentCard = null;
                updateQuantumBar();
            }, 1500);
        }

        function resolveSpecialEvent(btnElement) {
            if (!currentCard || currentCard.type !== 'special') return;
            
            const event = currentCard.data;
            btnElement.classList.add('correct');
            
            // Apply event effects
            if (event.type === 'energy') {
                energy = Math.max(0, Math.min(200, energy + event.energy));
            } else if (event.type === 'knowledge') {
                knowledge += event.knowledge;
                energy = Math.max(0, Math.min(200, energy + event.energy || 0));
            } else if (event.type === 'move') {
                // Move player
                if (playerPosition + event.spaces < quantumNodes.length - 1) {
                    playerPosition += event.spaces;
                    updatePlayerPosition();
                } else {
                    playerPosition = quantumNodes.length - 1;
                    updatePlayerPosition();
                }
            }
            
            // Apply particle gains
            if (event.particles) {
                for (const [particle, amount] of Object.entries(event.particles)) {
                    particles[particle] = (particles[particle] || 0) + amount;
                }
            }
            
            showMessage(`Event resolved: ${event.title}`, "system");
            updateUI();
            
            setTimeout(() => {
                document.getElementById('card-display').style.display = 'none';
                currentCard = null;
            }, 1500);
        }

        function updateQuantumBar() {
            document.getElementById('quantum-fill').style.width = quantumCharge + '%';
            document.getElementById('quantum-text').textContent = quantumCharge + '%';
            
            // Change color based on charge level
            const fill = document.getElementById('quantum-fill');
            if (quantumCharge >= 80) {
                fill.style.background = 'linear-gradient(90deg, #4fff4a 0%, #2aff2a 100%)';
            } else if (quantumCharge >= 30) {
                fill.style.background = 'linear-gradient(90deg, #ffaa4a 0%, #ff7a4a 100%)';
            } else {
                fill.style.background = 'linear-gradient(90deg, #ff4a4a 0%, #aa1a1a 100%)';
            }
        }

        // ========== UI UPDATES ==========
        function updateUI() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('energy').textContent = energy;
            document.getElementById('knowledge').textContent = knowledge;
            
            // Update particle display
            const particleContainer = document.getElementById('particle-display');
            particleContainer.innerHTML = '';
            
            for (const [particle, count] of Object.entries(particles)) {
                if (count > 0) {
                    const icon = document.createElement('div');
                    icon.className = 'particle-icon';
                    icon.style.background = getParticleColor(particle);
                    icon.textContent = particle.charAt(0).toUpperCase() + particle.slice(1) + ` x${count}`;
                    particleContainer.appendChild(icon);
                }
            }
            
            updateQuantumBar();
        }

        function getParticleColor(particle) {
            switch(particle) {
                case 'quark': return '#ff4a4a';
                case 'electron': return '#4a6fff';
                case 'neutrino': return '#4fff4a';
                case 'gluon': return '#ffaa4a';
                default: return '#aaa';
            }
        }

        function showMessage(text, type = 'system') {
            const messagesDiv = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = `message ${type}`;
            message.textContent = text;
            messagesDiv.appendChild(message);
            
            // Keep only last 5 messages
            while (messagesDiv.children.length > 5) {
                messagesDiv.removeChild(messagesDiv.firstChild);
            }
            
            // Scroll to bottom
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ========== GAME OVER ==========
        function endGame(won) {
            gameActive = false;
            const gameOverScreen = document.getElementById('game-over');
            const title = document.getElementById('game-over-title');
            const message = document.getElementById('game-over-message');
            
            if (won) {
                title.textContent = "Quantum Victory!";
                title.className = "game-over-title";
                message.textContent = `Congratulations, Quantum Explorer! You've successfully navigated the quantum realm, collected valuable particles, and reached the Quantum Computer. Your final knowledge: ${knowledge} Q-bits!`;
            } else {
                title.textContent = "Quantum Defeat";
                title.className = "game-over-title";
                message.textContent = "Your energy has been depleted. The quantum secrets remain unsolved. Try again!";
            }
            
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('game-over').style.display = 'none';
            
            // Reset player position
            playerPosition = 0;
            updatePlayerPosition();
            
            // Reset stats
            moves = 0;
            energy = 100;
            knowledge = 0;
            quantumCharge = 0;
            particles = { quark: 0, electron: 0, neutrino: 0, gluon: 0 };
            
            // Clear messages
            document.getElementById('messages').innerHTML = '';
            
            // Reset game state
            gameActive = true;
            currentCard = null;
            
            // Hide card if open
            document.getElementById('card-display').style.display = 'none';
            
            // Show welcome message
            showMessage("Welcome back, Quantum Explorer! Roll the dice to begin your journey.", "system");
            
            // Update UI
            updateUI();
        }

        // ========== EVENT LISTENERS ==========
        function setupEventListeners() {
            // Close card when clicking X
            document.querySelector('.close-card').addEventListener('click', () => {
                if (currentCard) {
                    document.getElementById('card-display').style.display = 'none';
                    currentCard = null;
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                
                // Redraw board (simplified - in full implementation would adjust positions)
                // For now, we'll just keep positions relative
            });
        }

        // ========== INITIAL MESSAGE ==========
        function showWelcomeMessage() {
            const welcome = `
                <div style="text-align: center; padding: 20px;">
                    <h2 style="color: #4a6fff; margin-bottom: 15px;">Welcome to Quantum Explorers!</h2>
                    <p style="line-height: 1.6; font-size: 1.1rem;">
                        You are a quantum scientist exploring the subatomic realm. Your mission is to navigate the quantum board, 
                        collect particles, answer quantum physics questions, and reach the Quantum Computer at the center.
                    </p>
                    <p style="line-height: 1.6; font-size: 1.1rem; margin-top: 15px;">
                        <strong>Rules:</strong><br>
                        • Roll the dice to move along the spiral path<br>
                        • Land on quantum nodes to answer questions<br>
                        • Answer correctly to gain knowledge and energy<br>
                        • Collect particles for bonus effects<br>
                        • Reach the finish with high knowledge to win!
                    </p>
                </div>
            `;
            
            const card = document.getElementById('card-display');
            card.style.display = 'flex';
            document.getElementById('card-title').textContent = "How to Play";
            document.getElementById('card-content').innerHTML = welcome;
            document.getElementById('card-options').innerHTML = `
                <button class="option-btn" onclick="document.getElementById('card-display').style.display = 'none'">Start Game</button>
            `;
        }

        // ========== START GAME ==========
        // Show welcome message after a short delay
        setTimeout(showWelcomeMessage, 1000);
    </script>
</body>
</html>
