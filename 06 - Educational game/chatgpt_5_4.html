<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biome Beacon — An Ecosystem Strategy Board Game</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07131f;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef4ff;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div id="app" aria-label="Biome Beacon board game"></div>
  <div class="sr-only">A solo educational board game about ecosystems and climate science.</div>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.5/dist/svg.min.js"></script>
  <script>
    (() => {
      const WIDTH = 1440;
      const HEIGHT = 920;
      const HUD_X = 940;
      const PANEL_W = 470;
      const BIOMES = {
        Forest: { color: '#3fc27c', light: '#9af4bf', icon: '🌿' },
        Wetland: { color: '#36c5b3', light: '#95fff1', icon: '🪷' },
        Ocean: { color: '#4da6ff', light: '#bde0ff', icon: '🌊' },
        Desert: { color: '#f0b85b', light: '#ffe0aa', icon: '☀️' },
        Tundra: { color: '#b6c8ff', light: '#edf3ff', icon: '❄️' },
      };

      const nodes = [
        { x: 145, y: 700, biome: 'Forest', kind: 'start', title: 'Seed Harbor' },
        { x: 190, y: 615, biome: 'Forest', kind: 'question', title: 'Fern Trail' },
        { x: 260, y: 530, biome: 'Forest', kind: 'sanctuary', title: 'Canopy Beacon' },
        { x: 360, y: 485, biome: 'Wetland', kind: 'event', title: 'River Bend' },
        { x: 455, y: 430, biome: 'Wetland', kind: 'question', title: 'Reed Garden' },
        { x: 565, y: 360, biome: 'Wetland', kind: 'sanctuary', title: 'Marsh Beacon' },
        { x: 690, y: 300, biome: 'Ocean', kind: 'question', title: 'Kelp Crossing' },
        { x: 800, y: 255, biome: 'Ocean', kind: 'event', title: 'Tide Gate' },
        { x: 860, y: 345, biome: 'Ocean', kind: 'sanctuary', title: 'Reef Beacon' },
        { x: 820, y: 455, biome: 'Desert', kind: 'question', title: 'Dune Arc' },
        { x: 760, y: 560, biome: 'Desert', kind: 'event', title: 'Mirage Fork' },
        { x: 675, y: 655, biome: 'Desert', kind: 'sanctuary', title: 'Solar Beacon' },
        { x: 570, y: 735, biome: 'Tundra', kind: 'question', title: 'Frost Loop' },
        { x: 450, y: 785, biome: 'Tundra', kind: 'event', title: 'Aurora Camp' },
        { x: 330, y: 805, biome: 'Tundra', kind: 'sanctuary', title: 'Glacier Beacon' },
        { x: 235, y: 760, biome: 'Forest', kind: 'question', title: 'Moss Lane' },
      ];

      const questions = {
        Forest: [
          { q: 'Which forest layer receives the most direct sunlight?', choices: ['Forest floor', 'Canopy', 'Shrub layer', 'Root zone'], a: 1, fact: 'The canopy is the sunlit roof of many forests and drives much of the ecosystem’s photosynthesis.' },
          { q: 'What do mycorrhizal fungi mainly do for trees?', choices: ['Steal sunlight', 'Help roots absorb water and nutrients', 'Turn leaves blue', 'Keep animals away'], a: 1, fact: 'Mycorrhizal networks link fungi and roots, improving access to water and minerals.' },
          { q: 'Why are old-growth forests important for climate?', choices: ['They reflect all sunlight', 'They store large amounts of carbon', 'They never lose leaves', 'They make deserts colder'], a: 1, fact: 'Large mature forests are major carbon stores above and below ground.' },
          { q: 'A deciduous tree is one that usually…', choices: ['Lives underwater', 'Drops leaves seasonally', 'Grows only in deserts', 'Cannot make seeds'], a: 1, fact: 'Many deciduous trees shed leaves to conserve water and energy in harsh seasons.' },
          { q: 'Which organism is a producer in a forest food web?', choices: ['Owl', 'Mushroom', 'Oak tree', 'Fox'], a: 2, fact: 'Plants are producers because they make food using sunlight.' },
          { q: 'What is one reason biodiversity helps forests?', choices: ['It makes every tree identical', 'It improves resilience to pests and change', 'It removes all decomposers', 'It stops rainfall'], a: 1, fact: 'Greater biodiversity often means more ecological backup systems and stability.' },
        ],
        Wetland: [
          { q: 'Why do wetlands often reduce flooding?', choices: ['They speed water away immediately', 'They store and slow down water', 'They remove all rain clouds', 'They turn rivers into roads'], a: 1, fact: 'Wetlands work like natural sponges that hold and slowly release water.' },
          { q: 'Why are frogs often called indicator species?', choices: ['They only live in caves', 'Their health reflects environmental quality', 'They predict earthquakes perfectly', 'They eat only algae'], a: 1, fact: 'Amphibians are sensitive to pollution and habitat change, so they reveal ecosystem stress.' },
          { q: 'Which wetland plant can help trap sediment and slow water?', choices: ['Cactus', 'Reeds', 'Pine needles', 'Sea ice'], a: 1, fact: 'Dense wetland vegetation helps capture sediment and stabilize shorelines.' },
          { q: 'Peatlands are important partly because they…', choices: ['Contain active volcanoes', 'Store huge amounts of carbon', 'Are always dry', 'Prevent birds from nesting'], a: 1, fact: 'Peat accumulates slowly and can lock away carbon for very long periods.' },
          { q: 'What is a major benefit of wetlands near coasts?', choices: ['They increase storm waves', 'They buffer storms and erosion', 'They remove oxygen from water', 'They stop tides'], a: 1, fact: 'Coastal wetlands can absorb wave energy and protect inland areas.' },
          { q: 'Many wetlands are nurseries because they…', choices: ['Have no food', 'Offer shelter and abundant nutrients', 'Are too salty for life', 'Never connect to other habitats'], a: 1, fact: 'Sheltered, nutrient-rich habitats give young animals a strong start.' },
        ],
        Ocean: [
          { q: 'Which tiny organisms produce much of Earth’s oxygen in the ocean?', choices: ['Phytoplankton', 'Coral polyps', 'Sharks', 'Jellyfish'], a: 0, fact: 'Phytoplankton are microscopic producers that drive many ocean food webs.' },
          { q: 'What most directly causes coral bleaching?', choices: ['Colder sand', 'Heat stress', 'Moonlight', 'Extra sea shells'], a: 1, fact: 'When waters get too warm, corals can expel the algae they depend on.' },
          { q: 'What is upwelling?', choices: ['Warm surface water sinking slowly', 'Deep nutrient-rich water rising upward', 'Fish moving into rivers', 'Sea ice melting'], a: 1, fact: 'Upwelling brings nutrients to the surface and fuels productive marine ecosystems.' },
          { q: 'Mangroves are valuable because they…', choices: ['Grow only on glaciers', 'Protect coasts and shelter young fish', 'Turn salt into metal', 'Eliminate tides'], a: 1, fact: 'Mangrove roots stabilize coasts and create nursery habitat.' },
          { q: 'Why can too much nutrient runoff be harmful to oceans?', choices: ['It always cools the water', 'It can trigger algal blooms and low oxygen', 'It makes corals grow instantly', 'It removes all plankton'], a: 1, fact: 'Excess nutrients can cause blooms that later deplete oxygen when they decay.' },
          { q: 'What best describes salinity?', choices: ['Water depth', 'Amount of dissolved salts', 'Wave speed', 'Number of fish'], a: 1, fact: 'Salinity helps shape ocean density, circulation, and life distributions.' },
        ],
        Desert: [
          { q: 'Why are many desert animals nocturnal?', choices: ['To find more snow', 'To avoid daytime heat and water loss', 'To grow faster', 'To make the sand wetter'], a: 1, fact: 'Night activity helps conserve water and avoid extreme daytime temperatures.' },
          { q: 'What is a common adaptation of succulent plants?', choices: ['Hollow bones', 'Water-storing tissues', 'Webbed feet', 'Thick fur'], a: 1, fact: 'Succulents store water in stems or leaves for dry periods.' },
          { q: 'Why can deserts be cold at night?', choices: ['Sand creates its own ice', 'Dry air and few clouds let heat escape quickly', 'Cacti remove warmth', 'All deserts are near the poles'], a: 1, fact: 'Without much moisture or cloud cover, heat can radiate away rapidly after sunset.' },
          { q: 'A flash flood in a desert can happen because…', choices: ['Rain never soaks in', 'Dry ground may absorb water poorly at first', 'There are too many glaciers', 'Sand turns to stone'], a: 1, fact: 'Hard, dry soils and sparse vegetation can make runoff intense after rain.' },
          { q: 'Camel humps mainly store…', choices: ['Water', 'Air', 'Fat', 'Salt'], a: 2, fact: 'Camel humps store fat, which can be metabolized for energy and some water.' },
          { q: 'Which surface color generally reflects more sunlight in sunny regions?', choices: ['Darker surfaces', 'Lighter surfaces', 'Transparent surfaces', 'Red-only surfaces'], a: 1, fact: 'Lighter colors often reflect more solar energy and stay cooler.' },
        ],
        Tundra: [
          { q: 'What is permafrost?', choices: ['Seasonal sea ice', 'Ground that stays frozen for at least two years', 'A cold wind', 'A polar flower'], a: 1, fact: 'Permafrost is long-frozen ground that strongly affects drainage and infrastructure.' },
          { q: 'Why is the tundra growing season short?', choices: ['Too much shade from tall trees', 'Cold temperatures and limited warm months', 'There is no sunlight at all', 'Plants dislike open space'], a: 1, fact: 'Tundra plants must grow and reproduce quickly during a brief warm season.' },
          { q: 'Which organism is common in tundra ecosystems?', choices: ['Mangrove tree', 'Lichen', 'Coral reef', 'Coconut palm'], a: 1, fact: 'Lichens are well adapted to cold, nutrient-poor environments.' },
          { q: 'Why does snow and ice affect climate?', choices: ['They absorb all light', 'They reflect a lot of sunlight', 'They stop wind forever', 'They create oxygen directly'], a: 1, fact: 'High reflectivity, or albedo, helps snow and ice send solar energy back to space.' },
          { q: 'Why are many tundra animals migratory?', choices: ['To escape underwater volcanoes', 'To follow seasonal food and breeding conditions', 'Because tundra has no summers', 'To avoid moonlight'], a: 1, fact: 'Migration helps animals track shifting resources in extreme seasonal environments.' },
          { q: 'Why is thawing permafrost a climate concern?', choices: ['It can release trapped greenhouse gases', 'It turns all rivers solid', 'It increases sea salt', 'It prevents all plants from growing'], a: 0, fact: 'As frozen soils thaw, stored carbon can be released as carbon dioxide and methane.' },
        ]
      };

      const events = [
        {
          title: 'Field Choice: Pollinator Corridor',
          text: 'You find a meadow link between habitats. Pollinators help many plants reproduce. What will you do?',
          options: [
            { label: 'Plant native flowers', effect: { type: 'charge', biome: 'Forest', amount: 1 }, result: '+1 Forest charge. Native flowers support pollinators and seed production.' },
            { label: 'Take biodiversity notes', effect: { type: 'insight', amount: 1 }, result: '+1 Insight. Careful observation helps scientists track ecosystem health.' },
          ],
        },
        {
          title: 'Field Choice: Reed Restoration',
          text: 'A muddy bank is eroding. Wetland plants can stabilize soil and slow water.',
          options: [
            { label: 'Replant reeds', effect: { type: 'charge', biome: 'Wetland', amount: 1 }, result: '+1 Wetland charge. Rooted plants help protect banks and filter runoff.' },
            { label: 'Build a simple boardwalk', effect: { type: 'resilience', amount: 1 }, result: '+1 Resilience. Keeping feet off fragile soil reduces damage.' },
          ],
        },
        {
          title: 'Field Choice: Drift Current',
          text: 'A current carries nutrient-rich water toward your route. Productive water often supports rich marine life.',
          options: [
            { label: 'Sample plankton', effect: { type: 'charge', biome: 'Ocean', amount: 1 }, result: '+1 Ocean charge. Plankton are the foundation of many marine food webs.' },
            { label: 'Chart the current', effect: { type: 'insight', amount: 2 }, result: '+2 Insight. Ocean circulation shapes nutrients, climate, and migration.' },
          ],
        },
        {
          title: 'Field Choice: Shade Structure',
          text: 'At the dune edge, you can either protect seedlings or store extra water for travel.',
          options: [
            { label: 'Shield the seedlings', effect: { type: 'charge', biome: 'Desert', amount: 1 }, result: '+1 Desert charge. Micro-shade can help young plants survive.' },
            { label: 'Save the water', effect: { type: 'resilience', amount: 1 }, result: '+1 Resilience. Water planning is a core desert survival skill.' },
          ],
        },
        {
          title: 'Field Choice: Reflective Snow Patch',
          text: 'Fresh snow brightens the ground. High-albedo surfaces reflect more sunlight.',
          options: [
            { label: 'Measure albedo', effect: { type: 'charge', biome: 'Tundra', amount: 1 }, result: '+1 Tundra charge. Surface reflectivity matters for energy balance.' },
            { label: 'Warm up in camp', effect: { type: 'resilience', amount: 2 }, result: '+2 Resilience. A safer team makes for better science.' },
          ],
        },
        {
          title: 'Field Choice: Shared Data Cache',
          text: 'Researchers left an open data station. Sharing observations improves ecosystem decisions.',
          options: [
            { label: 'Download habitat maps', effect: { type: 'insight', amount: 2 }, result: '+2 Insight. Shared data helps link patterns across landscapes.' },
            { label: 'Update the beacon logs', effect: { type: 'chargeAnyLowest', amount: 1 }, result: '+1 charge to your weakest biome. Good records guide restoration priorities.' },
          ],
        },
      ];

      const state = {
        turn: 1,
        maxTurns: 16,
        resilience: 6,
        maxResilience: 10,
        insight: 0,
        position: 0,
        animating: false,
        awaitingChoice: false,
        rolling: false,
        extraRoll: false,
        biomeCharge: { Forest: 0, Wetland: 0, Ocean: 0, Desert: 0, Tundra: 0 },
        usedQuestions: { Forest: [], Wetland: [], Ocean: [], Desert: [], Tundra: [] },
        currentOverlay: null,
        log: ['Welcome to Biome Beacon. Restore all five beacons before turn 16!'],
        lastDie: 1,
        gameOver: false,
      };

      const app = document.getElementById('app');
      const draw = SVG().addTo(app).size('100%', '100%').viewbox(0, 0, WIDTH, HEIGHT);
      let boardLayer, hudLayer, overlayLayer, effectsLayer;
      let token, tokenGlow, diceGroup, diceFace, rollButton, statusTexts = {}, beaconBars = {}, beaconLabels = {}, logText;

      function wrapText(text, maxChars = 34) {
        const words = String(text).split(/\s+/);
        const lines = [];
        let line = '';
        words.forEach(word => {
          const candidate = line ? line + ' ' + word : word;
          if (candidate.length > maxChars && line) {
            lines.push(line);
            line = word;
          } else {
            line = candidate;
          }
        });
        if (line) lines.push(line);
        return lines;
      }

      function multiline(parent, x, y, text, options = {}) {
        const { size = 20, fill = '#eef4ff', weight = 500, width = 34, anchor = 'left', leading = 1.3 } = options;
        const lines = Array.isArray(text) ? text : wrapText(text, width);
        const t = parent.text(add => {
          lines.forEach((line, idx) => {
            const span = add.tspan(line);
            if (idx > 0) span.newLine();
          });
        });
        t.move(x, y).font({ family: 'Inter, system-ui, sans-serif', size, weight, leading });
        t.fill(fill);
        t.attr({ 'text-anchor': anchor });
        return t;
      }

      function roundedPanel(parent, x, y, w, h, fill, stroke = null, opacity = 1) {
        const panel = parent.rect(w, h).move(x, y).radius(28).fill({ color: fill, opacity });
        if (stroke) panel.stroke(stroke);
        return panel;
      }

      function createButton(parent, x, y, w, h, label, onClick, options = {}) {
        const {
          fill = '#1f6fff',
          fill2 = null,
          textFill = '#ffffff',
          radius = 18,
          fontSize = 22,
          stroke = null,
          disabled = false,
        } = options;
        const g = parent.group();
        const bg = g.rect(w, h).move(x, y).radius(radius);
        if (fill2) {
          bg.fill(draw.gradient('linear', stop => {
            stop.at(0, fill);
            stop.at(1, fill2);
          }).from(0, 0).to(1, 1));
        } else {
          bg.fill(fill);
        }
        if (stroke) bg.stroke(stroke);
        bg.opacity(disabled ? 0.45 : 1);
        const shadow = g.rect(w, h).move(x, y + 7).radius(radius).fill({ color: '#07131f', opacity: 0.18 }).back();
        const txt = multiline(g, x + w / 2, y + h / 2 - fontSize * 0.55, label, {
          size: fontSize,
          fill: textFill,
          weight: 700,
          width: Math.max(12, Math.floor(w / 11)),
          anchor: 'middle'
        });
        g.front();
        g.data('bg', bg);
        g.data('txt', txt);
        g.data('disabled', !!disabled);
        function setDisabled(val) {
          g.data('disabled', val);
          bg.opacity(val ? 0.45 : 1);
          txt.opacity(val ? 0.6 : 1);
        }
        g.setDisabled = setDisabled;
        g.on('mouseover', () => {
          if (g.data('disabled')) return;
          bg.animate(120).transform({ scale: 1.03, origin: 'center center' });
          shadow.animate(120).y(y + 10);
        });
        g.on('mouseout', () => {
          bg.animate(120).transform({ scale: 1, origin: 'center center' });
          shadow.animate(120).y(y + 7);
        });
        g.on('click', () => {
          if (g.data('disabled')) return;
          bg.animate(90).transform({ scale: 0.98, origin: 'center center' }).after(() => {
            bg.animate(90).transform({ scale: 1, origin: 'center center' });
          });
          if (typeof onClick === 'function') onClick();
        });
        return g;
      }

      function pushLog(message) {
        state.log.unshift(message);
        state.log = state.log.slice(0, 5);
        updateHUD();
      }

      function restoredCount() {
        return Object.values(state.biomeCharge).filter(v => v >= 2).length;
      }

      function randomFrom(array) {
        return array[Math.floor(Math.random() * array.length)];
      }

      function pickQuestion(biome) {
        const pool = questions[biome];
        const used = state.usedQuestions[biome];
        if (used.length >= pool.length) state.usedQuestions[biome] = [];
        const remaining = pool.filter((_, idx) => !state.usedQuestions[biome].includes(idx));
        const choice = remaining[Math.floor(Math.random() * remaining.length)];
        const idx = pool.indexOf(choice);
        state.usedQuestions[biome].push(idx);
        return choice;
      }

      function applyEffect(effect) {
        if (!effect) return '';
        if (effect.type === 'charge') {
          addCharge(effect.biome, effect.amount || 1);
          return `${effect.biome} +${effect.amount || 1}`;
        }
        if (effect.type === 'insight') {
          state.insight += effect.amount || 1;
          return `Insight +${effect.amount || 1}`;
        }
        if (effect.type === 'resilience') {
          state.resilience = Math.min(state.maxResilience, state.resilience + (effect.amount || 1));
          return `Resilience +${effect.amount || 1}`;
        }
        if (effect.type === 'chargeAnyLowest') {
          const entries = Object.entries(state.biomeCharge).sort((a, b) => a[1] - b[1]);
          addCharge(entries[0][0], effect.amount || 1);
          return `${entries[0][0]} +${effect.amount || 1}`;
        }
        return '';
      }

      function addCharge(biome, amount) {
        const before = state.biomeCharge[biome];
        state.biomeCharge[biome] = Math.min(2, before + amount);
        const after = state.biomeCharge[biome];
        if (before < 2 && after >= 2) {
          pushLog(`${BIOMES[biome].icon} ${biome} Beacon restored!`);
          celebrateBeacon(biome);
        }
      }

      function drawBackground() {
        draw.rect(WIDTH, HEIGHT).fill(draw.gradient('linear', stop => {
          stop.at(0, '#0b1b2b');
          stop.at(1, '#09101d');
        }).from(0, 0).to(1, 1));

        const starGroup = draw.group();
        for (let i = 0; i < 60; i++) {
          starGroup.circle(2 + Math.random() * 3).fill({ color: '#ffffff', opacity: 0.25 + Math.random() * 0.4 }).move(40 + Math.random() * (WIDTH - 80), 30 + Math.random() * (HEIGHT - 60));
        }
        starGroup.back();

        const boardBack = draw.group();
        boardBack.rect(900, 820).move(24, 50).radius(36).fill({ color: '#12253a', opacity: 0.95 }).stroke({ color: '#274362', width: 2 });
        boardBack.rect(900, 820).move(34, 60).radius(32).fill({ color: '#09121d', opacity: 0.35 });

        const biomeBlobs = [
          { x: 110, y: 120, w: 300, h: 250, fill: '#163725' },
          { x: 330, y: 140, w: 330, h: 240, fill: '#103a40' },
          { x: 620, y: 140, w: 250, h: 280, fill: '#0c2446' },
          { x: 600, y: 420, w: 260, h: 280, fill: '#402d12' },
          { x: 180, y: 560, w: 430, h: 220, fill: '#223559' },
        ];
        biomeBlobs.forEach(b => {
          boardBack.ellipse(b.w, b.h).move(b.x, b.y).fill({ color: b.fill, opacity: 0.48 });
        });

        boardBack.text('BIOME BEACON').move(68, 84).font({ family: 'Inter, system-ui, sans-serif', size: 36, weight: 900, letterSpacing: 1 }).fill('#f3f8ff');
        multiline(boardBack, 68, 126, 'Restore the five ecosystem beacons by answering science challenges and making wise field choices.', { size: 18, fill: '#bfd0e5', width: 54 });
      }

      function drawBoard() {
        boardLayer = draw.group();
        effectsLayer = draw.group();
        overlayLayer = draw.group();
        hudLayer = draw.group();

        const path = boardLayer.path('M145 700 C 185 625 235 560 300 510 C 380 450 480 390 570 355 C 660 322 790 220 850 345 C 882 418 803 532 739 601 C 649 699 512 806 329 804 C 253 803 196 774 145 700')
          .fill('none')
          .stroke({ color: '#f3f7ff', width: 18, opacity: 0.08, linecap: 'round', linejoin: 'round' });
        boardLayer.path(path.array().toString()).fill('none').stroke({ color: '#7ad9ff', width: 7, opacity: 0.12, linecap: 'round', linejoin: 'round' });

        nodes.forEach((node, idx) => {
          const g = boardLayer.group();
          const color = BIOMES[node.biome].color;
          const outer = g.circle(node.kind === 'sanctuary' ? 54 : 42).center(node.x, node.y).fill({ color: '#0e1624', opacity: 0.92 }).stroke({ color, width: node.kind === 'sanctuary' ? 4 : 3, opacity: 0.95 });
          const inner = g.circle(node.kind === 'sanctuary' ? 34 : 22).center(node.x, node.y).fill({ color, opacity: node.kind === 'event' ? 0.32 : 0.2 });
          if (node.kind === 'event') {
            multiline(g, node.x, node.y - 14, '?', { size: 26, fill: '#ffffff', weight: 900, anchor: 'middle', width: 2 });
          } else if (node.kind === 'sanctuary') {
            g.polygon('0,-14 12,0 0,14 -12,0').fill(BIOMES[node.biome].light).center(node.x, node.y);
          } else if (node.kind === 'start') {
            multiline(g, node.x, node.y - 13, '⟲', { size: 26, fill: '#ffffff', weight: 800, anchor: 'middle', width: 2 });
          } else {
            multiline(g, node.x, node.y - 11, String(idx), { size: 14, fill: '#ffffff', weight: 800, anchor: 'middle', width: 4 });
          }
          if (node.kind === 'sanctuary') {
            outer.data('halo', g.circle(68).center(node.x, node.y).fill({ color, opacity: 0 }).back());
          }
        });

        const labels = [
          ['Forest Zone', 120, 208, 'Forest'],
          ['Wetland Zone', 404, 218, 'Wetland'],
          ['Ocean Zone', 674, 205, 'Ocean'],
          ['Desert Zone', 645, 555, 'Desert'],
          ['Tundra Zone', 252, 682, 'Tundra'],
        ];
        labels.forEach(([txt, x, y, biome]) => {
          const pill = boardLayer.group();
          pill.rect(138, 34).move(x - 10, y - 6).radius(17).fill({ color: BIOMES[biome].color, opacity: 0.14 }).stroke({ color: BIOMES[biome].color, opacity: 0.25, width: 1.5 });
          multiline(pill, x + 58, y, txt, { size: 16, fill: BIOMES[biome].light, weight: 700, anchor: 'middle', width: 18 });
        });

        tokenGlow = boardLayer.circle(62).fill({ color: '#fff6b7', opacity: 0.16 }).center(nodes[0].x, nodes[0].y);
        token = boardLayer.group();
        token.circle(36).fill('#ffe17a').stroke({ color: '#fff7d9', width: 2.5 });
        token.circle(20).center(0, 0).fill('#f3954b');
        token.path('M -9 12 Q 0 2 9 12').fill('none').stroke({ color: '#6a3519', width: 3, linecap: 'round' });
        token.circle(5).center(-6, -5).fill('#1f2840');
        token.circle(5).center(6, -5).fill('#1f2840');
        token.center(nodes[0].x, nodes[0].y);
      }

      function drawHUD() {
        const panel = hudLayer.group();
        roundedPanel(panel, HUD_X, 34, PANEL_W, 852, '#112137', { color: '#25425f', width: 2 }, 0.96);
        panel.rect(PANEL_W - 26, 110).move(HUD_X + 13, 46).radius(24).fill({ color: '#0d1827', opacity: 0.88 });
        multiline(panel, HUD_X + 38, 66, 'Mission', { size: 20, fill: '#8dbcf0', weight: 700, width: 12 });
        multiline(panel, HUD_X + 38, 95, 'Charge every biome beacon to 2. You have 16 turns to restore Forest, Wetland, Ocean, Desert, and Tundra.', { size: 17, fill: '#eef4ff', width: 36 });

        const statY = 172;
        const statCards = [
          { key: 'turn', title: 'Turn', x: HUD_X + 26, y: statY, w: 130, color: '#6fa9ff' },
          { key: 'resilience', title: 'Resilience', x: HUD_X + 170, y: statY, w: 130, color: '#7ce1b1' },
          { key: 'insight', title: 'Insight', x: HUD_X + 314, y: statY, w: 130, color: '#ffc96b' },
        ];
        statCards.forEach(card => {
          const g = panel.group();
          roundedPanel(g, card.x, card.y, card.w, 94, '#0d1827', { color: '#21374f', width: 1.5 }, 0.92);
          multiline(g, card.x + 18, card.y + 14, card.title, { size: 15, fill: '#93a9c5', weight: 700, width: 10 });
          statusTexts[card.key] = multiline(g, card.x + card.w / 2, card.y + 42, '0', { size: 30, fill: card.color, weight: 900, anchor: 'middle', width: 8 });
        });

        multiline(panel, HUD_X + 28, 292, 'Beacon Charge', { size: 22, fill: '#f6fbff', weight: 800, width: 15 });
        let by = 330;
        Object.keys(BIOMES).forEach((biome) => {
          const color = BIOMES[biome].color;
          const g = panel.group();
          roundedPanel(g, HUD_X + 24, by, PANEL_W - 48, 74, '#0d1827', { color: '#1d334b', width: 1.2 }, 0.92);
          multiline(g, HUD_X + 46, by + 15, `${BIOMES[biome].icon} ${biome}`, { size: 19, fill: '#eef4ff', weight: 700, width: 15 });
          g.rect(220, 16).move(HUD_X + 200, by + 28).radius(8).fill({ color: '#17283b', opacity: 1 });
          beaconBars[biome] = g.rect(0, 16).move(HUD_X + 200, by + 28).radius(8).fill(color);
          beaconLabels[biome] = multiline(g, HUD_X + 426, by + 15, '0 / 2', { size: 17, fill: BIOMES[biome].light, weight: 800, anchor: 'end', width: 8 });
          by += 84;
        });

        multiline(panel, HUD_X + 28, 760, 'Field Controls', { size: 22, fill: '#f6fbff', weight: 800, width: 18 });
        diceGroup = panel.group();
        roundedPanel(diceGroup, HUD_X + 34, 795, 108, 72, '#0d1827', { color: '#20364d', width: 1.5 }, 0.96);
        diceFace = diceGroup.group();
        drawDicePips(1);
        rollButton = createButton(panel, HUD_X + 160, 792, 268, 76, 'Roll the Expedition Die', onRollClick, { fill: '#1976ff', fill2: '#4ec4ff', radius: 22, fontSize: 21 });

        const restart = createButton(panel, HUD_X + 330, 58, 116, 42, 'Restart', resetGame, { fill: '#1d3149', textFill: '#dce8f6', radius: 16, fontSize: 18, stroke: { color: '#35506e', width: 1.5 } });

        multiline(panel, HUD_X + 28, 612, 'Field Log', { size: 22, fill: '#f6fbff', weight: 800, width: 10 });
        roundedPanel(panel, HUD_X + 24, 644, PANEL_W - 48, 104, '#0d1827', { color: '#20354d', width: 1.3 }, 0.92);
        logText = multiline(panel, HUD_X + 42, 664, state.log.join('   •   '), { size: 15, fill: '#b8c8da', width: 44, leading: 1.4 });
      }

      function drawDicePips(value) {
        diceFace.clear();
        const x = HUD_X + 52;
        const y = 808;
        diceFace.rect(72, 46).move(x, y).radius(12).fill('#f5f8ff').stroke({ color: '#d4deea', width: 1.5 });
        const pipCoords = {
          1: [[36, 23]],
          2: [[18, 14], [54, 32]],
          3: [[18, 14], [36, 23], [54, 32]],
          4: [[18, 14], [54, 14], [18, 32], [54, 32]],
          5: [[18, 14], [54, 14], [36, 23], [18, 32], [54, 32]],
          6: [[18, 12], [54, 12], [18, 23], [54, 23], [18, 34], [54, 34]],
        };
        (pipCoords[value] || []).forEach(([cx, cy]) => {
          diceFace.circle(8).center(x + cx, y + cy).fill('#233447');
        });
      }

      function updateHUD() {
        statusTexts.turn.text(`${state.turn}/${state.maxTurns}`);
        statusTexts.resilience.text(`${state.resilience}`);
        statusTexts.insight.text(`${state.insight}`);
        Object.keys(BIOMES).forEach(biome => {
          const charge = state.biomeCharge[biome];
          beaconBars[biome].animate(250).width(charge * 110);
          beaconLabels[biome].text(`${charge} / 2`);
          if (charge >= 2) {
            beaconBars[biome].opacity(1);
            beaconLabels[biome].fill('#ffffff');
          } else {
            beaconBars[biome].opacity(0.85);
            beaconLabels[biome].fill(BIOMES[biome].light);
          }
        });
        drawDicePips(state.lastDie);
        logText.text(state.log.join('   •   '));
        const disabled = state.animating || state.awaitingChoice || state.gameOver;
        rollButton.setDisabled(disabled);
      }

      function celebrateBeacon(biome) {
        const node = nodes.find(n => n.biome === biome && n.kind === 'sanctuary');
        if (!node) return;
        const burst = effectsLayer.group();
        const halo = burst.circle(20).center(node.x, node.y).fill({ color: BIOMES[biome].color, opacity: 0.35 });
        halo.animate(900).size(160, 160).opacity(0).after(() => burst.remove());
        for (let i = 0; i < 14; i++) {
          const angle = (Math.PI * 2 * i) / 14;
          const line = burst.line(node.x, node.y, node.x + Math.cos(angle) * 12, node.y + Math.sin(angle) * 12).stroke({ color: BIOMES[biome].light, width: 3, linecap: 'round' });
          line.animate(700).plot(node.x, node.y, node.x + Math.cos(angle) * (52 + Math.random() * 18), node.y + Math.sin(angle) * (52 + Math.random() * 18)).opacity(0);
        }
      }

      function showOverlay(builder) {
        overlayLayer.clear();
        state.awaitingChoice = true;
        const veil = overlayLayer.rect(WIDTH, HEIGHT).fill({ color: '#03080e', opacity: 0.62 });
        const panel = overlayLayer.group();
        roundedPanel(panel, 300, 150, 840, 600, '#102137', { color: '#2a4a68', width: 2 }, 0.99);
        panel.rect(790, 12).move(325, 175).radius(6).fill(draw.gradient('linear', stop => {
          stop.at(0, '#3fc27c');
          stop.at(0.25, '#36c5b3');
          stop.at(0.5, '#4da6ff');
          stop.at(0.75, '#f0b85b');
          stop.at(1, '#b6c8ff');
        }).from(0, 0).to(1, 0));
        builder(panel);
      }

      function closeOverlay() {
        overlayLayer.clear();
        state.awaitingChoice = false;
        updateHUD();
      }

      function showIntro() {
        showOverlay(panel => {
          multiline(panel, 720, 230, 'Biome Beacon', { size: 42, fill: '#f9fcff', weight: 900, anchor: 'middle', width: 18 });
          multiline(panel, 720, 288, 'An original solo board game about ecosystems, climate, and habitat restoration.', { size: 22, fill: '#b7d0ea', weight: 600, anchor: 'middle', width: 50 });
          roundedPanel(panel, 360, 360, 720, 180, '#0d1827', { color: '#223b55', width: 1.5 }, 0.95);
          multiline(panel, 390, 392, 'How to play', { size: 22, fill: '#eff7ff', weight: 800, width: 16 });
          multiline(panel, 390, 432, [
            '• Roll the die to move your explorer around the habitat ring.',
            '• On question spaces, answer ecology challenges to gain charge and insight.',
            '• On event spaces, make field decisions with real science tradeoffs.',
            '• Charge each biome beacon to 2 before turn 16 to win.'
          ], { size: 19, fill: '#c7d6e7', width: 66, leading: 1.45 });
          createButton(panel, 535, 590, 370, 82, 'Begin the Expedition', () => {
            closeOverlay();
            pushLog('Expedition launched. Roll the die to begin.');
          }, { fill: '#1976ff', fill2: '#4ec4ff', radius: 24, fontSize: 26 });
        });
      }

      function showQuestion(node) {
        const biome = node.biome;
        const q = pickQuestion(biome);
        const reward = node.kind === 'sanctuary' ? 2 : 1;
        showOverlay(panel => {
          multiline(panel, 720, 224, `${BIOMES[biome].icon} ${node.title}`, { size: 32, fill: BIOMES[biome].light, weight: 900, anchor: 'middle', width: 24 });
          multiline(panel, 720, 272, node.kind === 'sanctuary' ? `Sanctuary challenge — answer correctly to gain ${reward} ${biome} charge.` : `Field question — answer correctly to gain ${reward} ${biome} charge.`, { size: 19, fill: '#8fc0ef', weight: 700, anchor: 'middle', width: 50 });
          roundedPanel(panel, 360, 320, 720, 120, '#0d1827', { color: '#1e3854', width: 1.5 }, 0.96);
          multiline(panel, 395, 350, q.q, { size: 27, fill: '#f8fcff', weight: 800, width: 42, leading: 1.32 });
          q.choices.forEach((choice, idx) => {
            createButton(panel, 392, 476 + idx * 74, 656, 58, `${String.fromCharCode(65 + idx)}. ${choice}`, () => {
              const correct = idx === q.a;
              if (correct) {
                addCharge(biome, reward);
                state.insight += node.kind === 'sanctuary' ? 2 : 1;
                tokenGlow.animate(240).opacity(0.34).after(() => tokenGlow.animate(260).opacity(0.16));
                pushLog(`Correct! ${biome} charge increased.`);
              } else {
                state.resilience = Math.max(0, state.resilience - 1);
                pushLog(`Not quite. ${q.fact}`);
              }
              showResolution(correct ? 'Correct!' : 'Not quite', q.fact, () => endTurnAndCheck(), correct ? BIOMES[biome].color : '#ff7e7e');
            }, { fill: '#18283b', textFill: '#edf4ff', radius: 18, fontSize: 20, stroke: { color: '#304963', width: 1.4 } });
          });
        });
      }

      function showEvent(node) {
        const event = randomFrom(events);
        showOverlay(panel => {
          multiline(panel, 720, 228, node.title, { size: 30, fill: '#f9fcff', weight: 900, anchor: 'middle', width: 24 });
          multiline(panel, 720, 270, event.title, { size: 24, fill: '#8fdcff', weight: 800, anchor: 'middle', width: 34 });
          roundedPanel(panel, 360, 320, 720, 150, '#0d1827', { color: '#1e3854', width: 1.5 }, 0.96);
          multiline(panel, 395, 350, event.text, { size: 24, fill: '#eef4ff', weight: 700, width: 44, leading: 1.32 });
          createButton(panel, 405, 520, 290, 82, event.options[0].label, () => {
            applyEffect(event.options[0].effect);
            pushLog(event.options[0].result);
            showResolution('Field decision logged', event.options[0].result, () => endTurnAndCheck(), '#65d7ac');
          }, { fill: '#18486c', fill2: '#2d85c7', radius: 22, fontSize: 22 });
          createButton(panel, 745, 520, 290, 82, event.options[1].label, () => {
            applyEffect(event.options[1].effect);
            pushLog(event.options[1].result);
            showResolution('Field decision logged', event.options[1].result, () => endTurnAndCheck(), '#65d7ac');
          }, { fill: '#224635', fill2: '#41b56b', radius: 22, fontSize: 22 });
        });
      }

      function showResolution(title, body, onContinue, accent) {
        showOverlay(panel => {
          panel.circle(84).center(720, 272).fill({ color: accent, opacity: 0.16 }).stroke({ color: accent, width: 2.5, opacity: 0.8 });
          multiline(panel, 720, 245, title, { size: 32, fill: '#ffffff', weight: 900, anchor: 'middle', width: 24 });
          roundedPanel(panel, 360, 350, 720, 150, '#0d1827', { color: '#1f3b55', width: 1.5 }, 0.96);
          multiline(panel, 392, 388, body, { size: 23, fill: '#d8e6f4', weight: 650, width: 48, leading: 1.35 });
          createButton(panel, 555, 560, 330, 84, 'Continue Expedition', () => {
            closeOverlay();
            if (typeof onContinue === 'function') onContinue();
          }, { fill: '#1976ff', fill2: '#4ec4ff', radius: 24, fontSize: 25 });
        });
      }

      function showOutcome(win) {
        state.gameOver = true;
        updateHUD();
        showOverlay(panel => {
          const accent = win ? '#63e1a5' : '#ff947a';
          panel.circle(110).center(720, 262).fill({ color: accent, opacity: 0.14 }).stroke({ color: accent, width: 3, opacity: 0.9 });
          multiline(panel, 720, 220, win ? 'All Beacons Restored!' : 'Expedition Debrief', { size: 38, fill: '#ffffff', weight: 900, anchor: 'middle', width: 24 });
          multiline(panel, 720, 278, win ? 'The ecosystems are connected and glowing again.' : 'You ran out of time, but the field notes still matter.', { size: 22, fill: '#cde0f4', weight: 600, anchor: 'middle', width: 48 });
          roundedPanel(panel, 355, 350, 730, 160, '#0d1827', { color: '#1d3954', width: 1.5 }, 0.96);
          multiline(panel, 390, 382, [
            `Beacons restored: ${restoredCount()} / 5`,
            `Insight gathered: ${state.insight}`,
            `Turns used: ${Math.min(state.turn - 1, state.maxTurns)} / ${state.maxTurns}`,
            `Resilience remaining: ${state.resilience}`
          ], { size: 24, fill: '#eef4ff', weight: 700, width: 36, leading: 1.45 });
          multiline(panel, 390, 548, win ? 'Learning bonus: diverse ecosystems buffer climate, filter water, store carbon, and support food webs.' : 'Learning bonus: every biome offers a different strategy for survival, adaptation, and resilience.', { size: 21, fill: '#a7c8e8', weight: 600, width: 52, leading: 1.35 });
          createButton(panel, 548, 630, 344, 84, 'Play Again', () => {
            closeOverlay();
            resetGame();
          }, { fill: '#1976ff', fill2: '#4ec4ff', radius: 24, fontSize: 26 });
        });
      }

      function resolveLanding() {
        const node = nodes[state.position];
        if (node.kind === 'start') {
          pushLog('Back at Seed Harbor. Regain 1 resilience and prepare the next route.');
          state.resilience = Math.min(state.maxResilience, state.resilience + 1);
          endTurnAndCheck();
          return;
        }
        if (node.kind === 'event') {
          showEvent(node);
          return;
        }
        showQuestion(node);
      }

      function animateTo(x, y, duration = 260) {
        return new Promise(resolve => {
          token.animate(duration, 0, '<>').center(x, y).after(() => resolve());
          tokenGlow.animate(duration, 0, '<>').center(x, y);
        });
      }

      async function moveSteps(steps) {
        state.animating = true;
        updateHUD();
        for (let i = 0; i < steps; i++) {
          state.position = (state.position + 1) % nodes.length;
          await animateTo(nodes[state.position].x, nodes[state.position].y, 220);
          await new Promise(r => setTimeout(r, 60));
        }
        state.animating = false;
        updateHUD();
        resolveLanding();
      }

      function rollAnimation(finalValue) {
        return new Promise(resolve => {
          state.rolling = true;
          let ticks = 0;
          const timer = setInterval(() => {
            const temp = 1 + Math.floor(Math.random() * 6);
            drawDicePips(temp);
            ticks += 1;
            if (ticks >= 10) {
              clearInterval(timer);
              drawDicePips(finalValue);
              diceFace.animate(160).transform({ rotate: 8, origin: 'center center' }).after(() => {
                diceFace.animate(180).transform({ rotate: 0, origin: 'center center' }).after(() => {
                  state.rolling = false;
                  resolve();
                });
              });
            }
          }, 70);
        });
      }

      async function onRollClick() {
        if (state.animating || state.awaitingChoice || state.gameOver || state.rolling) return;
        const roll = 1 + Math.floor(Math.random() * 6);
        state.lastDie = roll;
        pushLog(`Die rolled: ${roll}`);
        updateHUD();
        await rollAnimation(roll);
        await moveSteps(roll);
      }

      function endTurnAndCheck() {
        updateHUD();
        if (restoredCount() >= 5) {
          showOutcome(true);
          return;
        }
        if (state.resilience <= 0) {
          showOutcome(false);
          return;
        }
        state.turn += 1;
        if (state.turn > state.maxTurns) {
          showOutcome(restoredCount() >= 5);
          return;
        }
        updateHUD();
      }

      function resetGame() {
        state.turn = 1;
        state.resilience = 6;
        state.insight = 0;
        state.position = 0;
        state.animating = false;
        state.awaitingChoice = false;
        state.rolling = false;
        state.lastDie = 1;
        state.gameOver = false;
        state.log = ['A new expedition begins. Roll the die to set your route.'];
        state.biomeCharge = { Forest: 0, Wetland: 0, Ocean: 0, Desert: 0, Tundra: 0 };
        state.usedQuestions = { Forest: [], Wetland: [], Ocean: [], Desert: [], Tundra: [] };
        token.center(nodes[0].x, nodes[0].y);
        tokenGlow.center(nodes[0].x, nodes[0].y).opacity(0.16);
        overlayLayer.clear();
        updateHUD();
      }

      function init() {
        drawBackground();
        drawBoard();
        drawHUD();
        updateHUD();
        showIntro();
      }

      init();
      window.addEventListener('resize', () => draw.size('100%', '100%'));
    })();
  </script>
</body>
</html>
