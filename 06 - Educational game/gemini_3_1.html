<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Voyager: The Trivia Constellation</title>
    <!-- SVG.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

        :root {
            --bg-color: #050510;
            --panel-bg: #111122;
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --text: #e0e0e0;
            --success: #00ff88;
            --danger: #ff3366;
            --gold: #ffd700;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            display: flex;
            width: 1200px;
            height: 800px;
            background: radial-gradient(circle at center, #111122 0%, #050510 100%);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            border: 2px solid #2a2a4a;
            position: relative;
            overflow: hidden;
        }

        #board-area {
            flex: 1;
            position: relative;
        }

        #ui-panel {
            width: 350px;
            background: var(--panel-bg);
            border-left: 2px solid #2a2a4a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .header p {
            margin: 0 0 20px 0;
            font-size: 14px;
            color: #888;
        }

        .stats-box {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid var(--primary);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .stats-box h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }

        .star-dust {
            color: var(--gold);
            font-weight: bold;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            color: white;
            padding: 15px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.4);
        }

        button:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #dice-result {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: var(--primary);
            min-height: 60px;
            margin-bottom: 10px;
        }

        .log-area {
            flex: 1;
            background: rgba(0,0,0,0.5);
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            border: 1px solid #2a2a4a;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #222;
        }
        .log-entry.success { color: var(--success); }
        .log-entry.danger { color: var(--danger); }
        .log-entry.info { color: var(--primary); }

        /* Modal Overlay */
        #modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal {
            background: var(--panel-bg);
            border: 2px solid var(--primary);
            border-radius: 15px;
            width: 600px;
            max-width: 90%;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            position: relative;
        }

        .modal h2 { margin-top: 0; color: var(--primary); }
        .modal p.question-text { font-size: 20px; margin-bottom: 30px; }
        
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: #1a1a3a;
            border: 1px solid #3a3a6a;
            padding: 15px;
            font-size: 16px;
        }
        .option-btn:hover { background: #2a2a5a; }
        .option-btn.correct { background: var(--success) !important; color: #000; border-color: var(--success); }
        .option-btn.wrong { background: var(--danger) !important; color: #fff; border-color: var(--danger); }

        #explanation {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: none;
            font-style: italic;
        }

        #continue-btn {
            margin-top: 20px;
            display: none;
            width: 100%;
        }

        /* Powerup */
        .powerup-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-size: 14px;
            padding: 10px;
            margin-top: 10px;
        }
        .powerup-btn:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.2);
        }

        .legend {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
        }
        .legend div { margin-bottom: 5px; display: flex; align-items: center; gap: 8px; }
        .legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }
        .legend .c-blue { background: #00d2ff; }
        .legend .c-green { background: #00ff88; }
        .legend .c-red { background: #ff3366; }
        .legend .c-gold { background: #ffd700; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="board-area"></div>
    
    <div id="ui-panel">
        <div class="header">
            <h1>Galactic Voyager</h1>
            <p>Journey to the Galactic Core</p>
        </div>

        <div class="stats-box">
            <h3>Ship Computer</h3>
            <div class="star-dust">
                ✨ Star Dust: <span id="dust-count">0</span>
            </div>
            <button class="powerup-btn" id="skip-btn" title="Costs 30 Star Dust">Skip Question (30 ✨)</button>
        </div>

        <div class="controls">
            <div id="dice-result">🎲</div>
            <button id="roll-btn">Engage Warp Drive (Roll 1-3)</button>
        </div>

        <div class="log-area" id="log-area">
            <div class="log-entry info">System initialized. Awaiting orders to launch.</div>
        </div>

        <div class="legend">
            <div><span class="c-blue"></span> Nebula (Standard Trivia)</div>
            <div><span class="c-green"></span> Wormhole (Correct answer = Jump +2)</div>
            <div><span class="c-red"></span> Asteroid Field (Wrong answer = Fall back 2)</div>
            <div><span class="c-gold"></span> The Galactic Core (Finish)</div>
        </div>
    </div>

    <!-- Trivia Modal -->
    <div id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">Encounter!</h2>
            <p class="question-text" id="question-text">Question goes here?</p>
            <div class="options-grid" id="options-grid"></div>
            <div id="explanation"></div>
            <button id="continue-btn">Continue Journey</button>
        </div>
    </div>
</div>

<script>
    /* =========================================
       EDUCATIONAL CONTENT (Astronomy Trivia)
       ========================================= */
    const triviaDatabase = [
        { q: "Which planet is known as the 'Morning Star' or 'Evening Star'?", options: ["Mars", "Venus", "Mercury", "Jupiter"], a: 1, exp: "Venus is highly reflective and appears as a bright point of light just after sunset or before sunrise." },
        { q: "What force keeps the planets in orbit around the Sun?", options: ["Magnetism", "Friction", "Gravity", "Inertia"], a: 2, exp: "Gravity is the attractive force between all masses, keeping our solar system bound together." },
        { q: "What is the name of the boundary around a black hole from which nothing, not even light, can escape?", options: ["Event Horizon", "Accretion Disk", "Singularity", "Photon Sphere"], a: 0, exp: "The Event Horizon is the 'point of no return' for anything falling into a black hole." },
        { q: "Which of these is the largest volcano in the Solar System?", options: ["Mauna Loa", "Mount Everest", "Olympus Mons", "Krakatoa"], a: 2, exp: "Olympus Mons on Mars is a shield volcano nearly three times the height of Mount Everest!" },
        { q: "How long does it take for light from the Sun to reach Earth?", options: ["Instantaneous", "8 minutes", "1 hour", "24 hours"], a: 1, exp: "Light travels at 300,000 km/s, taking about 8 minutes and 20 seconds to cross the 150 million km to Earth." },
        { q: "What is the most abundant element in the universe?", options: ["Oxygen", "Carbon", "Helium", "Hydrogen"], a: 3, exp: "Hydrogen makes up about 75% of the normal matter in the universe and fuels the stars." },
        { q: "Which planet rotates on its side, rolling like a barrel?", options: ["Neptune", "Saturn", "Uranus", "Pluto"], a: 2, exp: "Uranus has an axial tilt of 98 degrees, likely caused by a massive collision in its early history." },
        { q: "What is a supernova?", options: ["A new star forming", "The explosive death of a star", "A colliding galaxy", "A shooting star"], a: 1, exp: "A supernova is a massive explosion that occurs at the end of a very large star's life." },
        { q: "Which galaxy is on a collision course with our Milky Way?", options: ["Andromeda", "Triangulum", "Sombrero", "Whirlpool"], a: 0, exp: "The Andromeda galaxy will collide with the Milky Way in about 4.5 billion years." },
        { q: "Who was the first human to journey into outer space?", options: ["Neil Armstrong", "Yuri Gagarin", "Buzz Aldrin", "John Glenn"], a: 1, exp: "Soviet cosmonaut Yuri Gagarin orbited the Earth on April 12, 1961." },
        { q: "What are comets mostly composed of?", options: ["Solid iron", "Ice, dust, and rocky material", "Liquid hydrogen", "Superheated plasma"], a: 1, exp: "Often called 'dirty snowballs', comets are icy remnants from the formation of the solar system." },
        { q: "What is the closest star system to Earth (besides the Sun)?", options: ["Sirius", "Alpha Centauri", "Betelgeuse", "Proxima Orionis"], a: 1, exp: "The Alpha Centauri system is about 4.37 light-years away from us." },
        { q: "What is the approximate age of the Universe?", options: ["4.6 billion years", "13.8 billion years", "100 million years", "Trillions of years"], a: 1, exp: "Based on the cosmic microwave background radiation, the universe is roughly 13.8 billion years old." },
        { q: "Which planet has the most confirmed moons?", options: ["Jupiter", "Saturn", "Uranus", "Neptune"], a: 1, exp: "As of recent discoveries, Saturn leads the solar system with over 140 confirmed moons." },
        { q: "What is the Great Red Spot on Jupiter?", options: ["A giant volcano", "A massive crater", "A long-lasting storm", "A solid ocean"], a: 2, exp: "It is a gigantic anticyclonic storm that has been raging for hundreds of years." },
        { q: "Which tool did Edwin Hubble use to discover that the universe is expanding?", options: ["Radio Telescope", "Optical Telescope", "Spectroscope", "Electron Microscope"], a: 1, exp: "Using the Hooker optical telescope, Hubble observed galaxies moving away from us." },
        { q: "What happens during a solar eclipse?", options: ["Earth blocks the Sun", "The Sun goes dark", "The Moon passes between Earth and the Sun", "A comet blocks the light"], a: 2, exp: "The Moon's shadow falls on the Earth when it perfectly aligns between the Earth and Sun." },
        { q: "What is the state of matter inside the Sun?", options: ["Solid", "Liquid", "Gas", "Plasma"], a: 3, exp: "The extreme heat strips electrons from atoms, creating a soup of charged particles called plasma." }
    ];

    /* =========================================
       GAME STATE & VARIABLES
       ========================================= */
    const SVG_WIDTH = 850;
    const SVG_HEIGHT = 800;
    const TOTAL_NODES = 24;
    
    let currentPos = 0;
    let starDust = 0;
    let nodes = [];
    let isMoving = false;
    let currentTrivia = null;
    let activeNodeDetails = null;

    // UI Elements
    const rollBtn = document.getElementById('roll-btn');
    const skipBtn = document.getElementById('skip-btn');
    const diceResult = document.getElementById('dice-result');
    const dustCount = document.getElementById('dust-count');
    const logArea = document.getElementById('log-area');
    const modalOverlay = document.getElementById('modal-overlay');
    const optionsGrid = document.getElementById('options-grid');
    const continueBtn = document.getElementById('continue-btn');
    const explanationDiv = document.getElementById('explanation');

    /* =========================================
       SVG.JS SETUP & DRAWING
       ========================================= */
    const draw = SVG().addTo('#board-area').size('100%', '100%').viewbox(0, 0, SVG_WIDTH, SVG_HEIGHT);
    let rocket;

    function initBoard() {
        // Draw starry background
        for (let i = 0; i < 150; i++) {
            let r = Math.random() * 2;
            let cx = Math.random() * SVG_WIDTH;
            let cy = Math.random() * SVG_HEIGHT;
            draw.circle(r).cx(cx).cy(cy).fill('#ffffff').opacity(Math.random() * 0.8 + 0.2);
        }

        // Generate Spiral Nodes
        let cx = SVG_WIDTH / 2;
        let cy = SVG_HEIGHT / 2;
        let maxRadius = 340;

        for (let i = 0; i < TOTAL_NODES; i++) {
            let fraction = i / (TOTAL_NODES - 1); // 0 to 1
            // Spiral math: radius decreases as i increases (towards center)
            let radius = maxRadius - (fraction * maxRadius * 0.9);
            // Angle increases to create a spiral
            let angle = fraction * Math.PI * 5; // 2.5 full turns

            // Start from outside (bottom leftish)
            let x = cx + Math.cos(angle + Math.PI) * radius;
            let y = cy + Math.sin(angle + Math.PI) * radius;

            // Determine Node Type
            let type = 'normal';
            let color = '#00d2ff'; // Blue
            let glow = 'rgba(0, 210, 255, 0.4)';

            if (i === TOTAL_NODES - 1) {
                type = 'end';
                color = '#ffd700'; // Gold core
                glow = 'rgba(255, 215, 0, 0.6)';
            } else if (i !== 0 && i % 4 === 0) {
                type = 'wormhole';
                color = '#00ff88'; // Green
                glow = 'rgba(0, 255, 136, 0.4)';
            } else if (i !== 0 && (i % 5 === 0 || i === 11)) {
                type = 'asteroid';
                color = '#ff3366'; // Red
                glow = 'rgba(255, 51, 102, 0.4)';
            } else if (i === 0) {
                type = 'start';
            }

            nodes.push({ x, y, type, color, glow, index: i });
        }

        // Draw Paths (Lines between nodes)
        for (let i = 0; i < nodes.length - 1; i++) {
            draw.line(nodes[i].x, nodes[i].y, nodes[i+1].x, nodes[i+1].y)
                .stroke({ color: 'rgba(255,255,255,0.3)', width: 3, dasharray: '5,5' });
        }

        // Draw Nodes
        nodes.forEach(n => {
            let size = n.type === 'end' ? 40 : (n.type === 'start' ? 25 : 20);
            
            // Outer Glow
            draw.circle(size * 1.8).cx(n.x).cy(n.y).fill(n.glow);
            
            // Inner Core
            draw.circle(size).cx(n.x).cy(n.y).fill(n.color).stroke({ color: '#fff', width: 2 });
            
            // End Core Special Animation
            if (n.type === 'end') {
                let pulse = draw.circle(size * 2.5).cx(n.x).cy(n.y).fill('none').stroke({ color: '#ffd700', width: 2 });
                pulse.animate(1500, 0, 'now').loop().transform({ scale: 1.5 }).opacity(0);
            }
        });

        // Draw Player Rocket
        createRocket();
        placeRocketOnNode(0);
    }

    function createRocket() {
        rocket = draw.group();
        
        // Ship Body
        rocket.polygon('0,30 15,0 30,30').fill('#e2ede3');
        // Window
        rocket.circle(10).cx(15).cy(18).fill('#00d2ff');
        // Fins
        rocket.polygon('0,20 -8,35 5,30').fill('#ff3366');
        rocket.polygon('30,20 38,35 25,30').fill('#ff3366');
        // Engine fire
        let fire = rocket.polygon('10,30 15,45 20,30').fill('#ffd700');
        fire.animate(200).loop(true, true).transform({ scaleY: 1.3, origin: 'top' });

        // Center origin for rotation
        rocket.cx(15).cy(15);
    }

    function placeRocketOnNode(index) {
        let n = nodes[index];
        rocket.center(n.x, n.y);
    }

    /* =========================================
       GAME MECHANICS & LOGIC
       ========================================= */
    function logMsg(msg, type = 'info') {
        const el = document.createElement('div');
        el.className = `log-entry ${type}`;
        el.innerText = msg;
        logArea.appendChild(el);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function updateDust(amount) {
        starDust += amount;
        if(starDust < 0) starDust = 0;
        dustCount.innerText = starDust;
        
        if (starDust >= 30) skipBtn.disabled = false;
        else skipBtn.disabled = true;
    }

    // Dice Roll
    rollBtn.addEventListener('click', () => {
        if (isMoving) return;
        isMoving = true;
        rollBtn.disabled = true;
        skipBtn.disabled = true;

        // Dice animation
        let rolls = 0;
        let finalRoll = 1;
        let rollInterval = setInterval(() => {
            finalRoll = Math.floor(Math.random() * 3) + 1; // 1 to 3
            diceResult.innerText = `🎲 ${finalRoll}`;
            rolls++;
            if (rolls > 10) {
                clearInterval(rollInterval);
                logMsg(`Rolled a ${finalRoll}. Engaging thrusters...`);
                movePlayer(finalRoll);
            }
        }, 50);
    });

    // Move Animation Logic
    function movePlayer(steps) {
        let targetIndex = currentPos + steps;
        if (targetIndex >= nodes.length) targetIndex = nodes.length - 1;
        
        animateToNode(currentPos, targetIndex, () => {
            currentPos = targetIndex;
            handleLanding(nodes[currentPos]);
        });
    }

    function moveBackward(steps) {
        let targetIndex = currentPos - steps;
        if (targetIndex < 0) targetIndex = 0;
        
        logMsg(`Falling back ${steps} sectors!`, 'danger');
        animateToNode(currentPos, targetIndex, () => {
            currentPos = targetIndex;
            handleLanding(nodes[currentPos], true); // true = skip trivia to avoid endless loops
        });
    }

    function animateToNode(from, to, callback) {
        if (from === to) {
            callback();
            return;
        }

        let direction = from < to ? 1 : -1;
        let nextIndex = from + direction;
        let nextNode = nodes[nextIndex];

        // Calculate angle for rocket rotation
        let dx = nextNode.x - nodes[from].x;
        let dy = nextNode.y - nodes[from].y;
        let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90; // +90 because rocket points up natively

        rocket.transform({ rotation: angle });

        rocket.animate(400, '-', 0).center(nextNode.x, nextNode.y).after(() => {
            animateToNode(nextIndex, to, callback);
        });
    }

    // Landing Logic
    function handleLanding(node, skippedEvent = false) {
        if (node.type === 'end') {
            triggerVictory();
            return;
        }

        activeNodeDetails = node;

        if (skippedEvent || node.type === 'start') {
            endTurn();
            return;
        }

        // Setup Trivia based on node
        let title = "Nebula Sector";
        if (node.type === 'wormhole') title = "Wormhole Detected!";
        if (node.type === 'asteroid') title = "Asteroid Field Navigation!";
        
        document.getElementById('modal-title').innerText = title;
        document.getElementById('modal-title').style.color = node.color;
        
        loadTrivia();
        modalOverlay.style.display = 'flex';
    }

    // Trivia Logic
    function loadTrivia() {
        // Pick random question
        currentTrivia = triviaDatabase[Math.floor(Math.random() * triviaDatabase.length)];
        
        document.getElementById('question-text').innerText = currentTrivia.q;
        optionsGrid.innerHTML = '';
        explanationDiv.style.display = 'none';
        continueBtn.style.display = 'none';

        currentTrivia.options.forEach((opt, idx) => {
            let btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(idx, btn);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btnElement) {
        // Disable all buttons
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(b => b.disabled = true);

        explanationDiv.innerText = currentTrivia.exp;
        explanationDiv.style.display = 'block';
        continueBtn.style.display = 'inline-block';

        let isCorrect = (selectedIndex === currentTrivia.a);

        if (isCorrect) {
            btnElement.classList.add('correct');
            updateDust(10);
            logMsg("Correct! Gained 10 Star Dust.", 'success');
            activeNodeDetails.status = 'pass';
        } else {
            btnElement.classList.add('wrong');
            // Highlight correct answer
            btns[currentTrivia.a].classList.add('correct');
            logMsg("Incorrect answer.", 'danger');
            activeNodeDetails.status = 'fail';
        }
    }

    // Skip Logic
    skipBtn.addEventListener('click', () => {
        if (starDust >= 30 && modalOverlay.style.display === 'flex') {
            updateDust(-30);
            logMsg("Used Star Dust to bypass computer lock!", 'info');
            activeNodeDetails.status = 'pass';
            
            // Show bypass visually
            explanationDiv.innerText = "Bypassed via Ship Computer!";
            explanationDiv.style.display = 'block';
            continueBtn.style.display = 'inline-block';
            
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => {
                b.disabled = true;
                if(b.innerText === currentTrivia.options[currentTrivia.a]) b.classList.add('correct');
            });
        }
    });

    continueBtn.addEventListener('click', () => {
        modalOverlay.style.display = 'none';
        resolveNodeEvent();
    });

    function resolveNodeEvent() {
        if (activeNodeDetails.type === 'wormhole' && activeNodeDetails.status === 'pass') {
            logMsg("Navigated the Wormhole safely! Jumping +2 sectors.", 'success');
            setTimeout(() => movePlayer(2), 500);
        } 
        else if (activeNodeDetails.type === 'asteroid' && activeNodeDetails.status === 'fail') {
            logMsg("Ship damaged by asteroids! Falling back.", 'danger');
            setTimeout(() => moveBackward(2), 500);
        } 
        else {
            endTurn();
        }
    }

    function endTurn() {
        isMoving = false;
        rollBtn.disabled = false;
        if(starDust >= 30) skipBtn.disabled = false;
    }

    function triggerVictory() {
        document.getElementById('modal-title').innerText = "Mission Accomplished!";
        document.getElementById('modal-title').style.color = "#ffd700";
        document.getElementById('question-text').innerText = "You have successfully navigated the cosmos and reached the Supermassive Black Hole at the Galactic Core!";
        optionsGrid.innerHTML = '';
        explanationDiv.style.display = 'none';
        continueBtn.innerText = "Play Again";
        continueBtn.style.display = 'inline-block';
        continueBtn.onclick = () => location.reload();
        
        modalOverlay.style.display = 'flex';
        logMsg("Arrived at Galactic Core. Victory!", 'success');
    }

    /* =========================================
       INITIALIZE GAME
       ========================================= */
    initBoard();
    updateDust(0); // init ui

</script>
</body>
</html>
