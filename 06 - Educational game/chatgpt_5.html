<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Starpath: Math Odyssey — Single‑File SVG.js Board Game</title>
<style>
  :root{
    --bg:#0b1220;--panel:#0f172a;--line:#1e2a49;--text:#e7eefc;--muted:#9fb3d9;--accent:#60a5fa;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;
  }
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#0a1224,#0b1220);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);}
  header{max-width:1100px;margin:16px auto 0;padding:0 12px}
  h1{font-size:20px;margin:0 0 10px 0; color:#cfe0ff}
  .wrap{max-width:1100px;margin:0 auto;padding:12px}
  #game{width:100%;height:700px;border:1px solid var(--line);background:#0a162e;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.25) inset}
  .hud{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:#cfe0ff}
  .legend{display:flex;gap:10px;flex-wrap:wrap}
  .key{display:flex;align-items:center;gap:6px;font-size:12px;color:#aac1ef}
  .dot{width:14px;height:14px;border-radius:4px;display:inline-block}
  .pill{padding:4px 8px;border:1px solid var(--line);border-radius:999px;background:#0e1830;color:#cfe0ff;font-size:12px}
  .btn{display:inline-block;padding:8px 14px;background:#152a56;border:1px solid #20407c;border-radius:10px;color:#cfe0ff;cursor:pointer;user-select:none}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>
  <header>
    <h1>⭐ Starpath: Math Odyssey</h1>
    <div class="legend">
      <span class="pill">Objective: Be the first to reach the finish while earning stars by solving math challenges.</span>
    </div>
  </header>
  <div class="wrap">
    <div id="game"></div>
    <div class="hud">
      <div class="legend" id="catLegend"></div>
      <div>
        <span class="btn" id="newGameBtn">New Game</span>
        <span class="btn" id="rollBtn">Roll 🎲</span>
      </div>
    </div>
  </div>

  <!-- SVG.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
  <script>
  (()=>{
    const WIDTH = 1080, HEIGHT = 700;
    const cols = 9, rows = 4; // path grid
    const tileW = 90, tileH = 90, gap = 12;
    const boardPadding = 24;

    // Categories and colors
    const CATS = [
      {id:'ADD',    label:'Add/Sub', color:'#3b82f6'},
      {id:'MUL',    label:'Multiply', color:'#22c55e'},
      {id:'DIV',    label:'Divide', color:'#a855f7'},
      {id:'FACT',   label:'Factors', color:'#f59e0b'},
      {id:'PRIME',  label:'Prime?',  color:'#ef4444'},
      {id:'FRAC',   label:'Fractions', color:'#14b8a6'},
      {id:'SEQ',    label:'Sequence', color:'#eab308'}
    ];

    // Game state
    let draw, boardG, uiG, overlayG, diceG, wiresG;
    let tiles = []; // positions and category
    let players = [];
    let turn = 0; // index
    let moving = false;
    let started = false;

    // Helpers
    const rand = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
    const choice = (arr)=> arr[Math.floor(Math.random()*arr.length)];
    const clamp = (v,min,max)=> Math.max(min,Math.min(max,v));

    function initSVG(){
      draw = SVG().addTo('#game').size('100%','100%').viewbox(0,0,WIDTH,HEIGHT);
      draw.rect(WIDTH,HEIGHT).fill('#0a162e');
      boardG = draw.group();
      wiresG = draw.group(); // not used but kept for aesthetics if needed later
      uiG = draw.group();
      overlayG = draw.group().attr({opacity:0});
      diceG = draw.group();
    }

    // Build board path (snake)
    function buildBoard(){
      tiles = [];
      boardG.clear();
      const startX = boardPadding, startY = 120;
      const colors = CATS.map(c=>c.color);
      for(let r=0;r<rows;r++){
        const y = startY + r*(tileH+gap);
        const dir = (r%2===0) ? 1 : -1;
        for(let c=0;c<cols;c++){
          const idx = r*cols + (dir===1? c : cols-1-c);
          const x = startX + c*(tileW+gap);
          const cat = CATS[idx % CATS.length];
          const tile = drawTile(x,y,tileW,tileH, cat.color, idx);
          tiles.push({x:x+tileW/2,y:y+tileH/2,cat,idx,rect:tile});
        }
      }
      // START & FINISH banners
      const startTile = tiles[0];
      labelBanner(startTile.x, startTile.y, 'START', '#22c55e');
      const endTile = tiles[tiles.length-1];
      labelBanner(endTile.x, endTile.y, 'FINISH', '#f43f5e');
    }

    function drawTile(x,y,w,h,color,idx){
      const g = boardG.group();
      const r = g.rect(w,h).radius(16).move(x,y).fill({color:color,opacity:.18}).stroke({color:'#1e2a49',width:1});
      // subtle gradient overlay
      g.rect(w,h).radius(16).move(x,y).fill(draw.gradient('linear', add=>{ add.stop(0,'rgba(255,255,255,0.06)'); add.stop(1,'rgba(0,0,0,0.1)'); })).stroke({width:0});
      const n = g.text(String(idx+1)).font({family:'ui-sans-serif,system-ui', size:14, anchor:'middle'}).fill('#aac1ef').center(x+w-16, y+h-16);
      // category dot
      g.circle(10).fill(color).stroke({color:'#0a162e',width:2}).center(x+14,y+14);
      return r;
    }

    function labelBanner(cx,cy, text, color){
      const g = boardG.group();
      const w = 72, h = 28;
      const x = cx - w/2, y = cy - tileH/2 - 18;
      g.rect(w,h).move(x,y).radius(10).fill(color).stroke({color:'#0a162e',width:2});
      g.text(text).font({size:14,weight:700,anchor:'middle',family:'system-ui'}).fill('#fff').center(cx,y+h/2+1);
    }

    // Players
    function setupPlayers(count=2){
      players = [];
      const colors = ['#60a5fa','#22c55e','#f59e0b','#ef4444'];
      for(let i=0;i<count;i++){
        const token = draw.group();
        const base = token.circle(28).fill(colors[i]).stroke({color:'#0a1a33',width:3});
        token.circle(10).fill('#fff').center(14,14);
        token.center(tiles[0].x, tiles[0].y);
        players.push({id:i, color:colors[i], token, pos:0, stars:0, name:'P'+(i+1)});
      }
      renderScore();
    }

    function renderScore(){
      uiG.clear();
      // Panel
      const panel = uiG.group();
      const w = WIDTH-48, h = 86; const x=24,y=20;
      panel.rect(w,h).move(x,y).radius(12).fill('#0e1830').stroke({color:'#1e2a49',width:1});
      panel.text('Starpath: Math Odyssey').move(x+16,y+10).font({size:18,weight:700});
      // per player
      let px = x+16, py=y+40;
      players.forEach((p,i)=>{
        const row = panel.group();
        row.circle(16).fill(p.color).move(px,py+2).stroke({color:'#0a1a33',width:2});
        row.text(`${p.name}  ★ ${p.stars}  • Tile ${p.pos+1}/${tiles.length}`).move(px+24,py).font({size:14});
        if(i===turn){ row.rect(92,20).move(px-10,py-2).fill('none').stroke({color:'#60a5fa',width:1}).radius(6); }
        px += 240;
      });
      // dice area
      diceG.clear();
      const d = diceG.group();
      const bx = WIDTH-170, by=28;
      d.rect(140,60).move(bx,by).radius(12).fill('#0b1430').stroke({color:'#1e2a49',width:1});
      const die = d.rect(42,42).radius(6).fill('#223463').move(bx+12,by+9).stroke({color:'#3b4f7a',width:2});
      const face = d.text('–').move(bx+33,by+11).font({size:28,anchor:'middle',family:'system-ui'});
      d.text('Roll').move(bx+78,by+25).font({size:16,weight:700});
      diceG.dieFace = face; diceG.dieRect = die;
    }

    // Dice roll animation
    function rollDie(){
      if(!started) return infoOverlay('Click "New Game" to set players!');
      if(moving) return;
      const n = rand(1,6);
      diceG.dieRect.animate(300).rotate(20).after(()=> diceG.dieRect.animate(200).rotate(0));
      let t = 8; const inter = setInterval(()=>{ diceG.dieFace.text(String(rand(1,6))); if(--t<=0){ clearInterval(inter); diceG.dieFace.text(String(n)); moveCurrent(n); } }, 60);
    }

    // Movement
    function moveCurrent(steps){
      const p = players[turn];
      moving = true; disableRoll(true);
      const go = ()=>{
        if(steps<=0){ landing(p); return; }
        const next = clamp(p.pos+1,0,tiles.length-1);
        if(next>=tiles.length-1){ p.pos = tiles.length-1; p.token.animate(400,0,'>').center(tiles[p.pos].x,tiles[p.pos].y).after(()=> landing(p)); return; }
        p.pos = next;
        p.token.animate(280,0,'>').center(tiles[p.pos].x, tiles[p.pos].y).after(()=>{ steps--; go(); });
      };
      go();
    }

    function landing(p){
      const tile = tiles[p.pos];
      if(p.pos === tiles.length-1){
        // finish
        showEnd(`${p.name} wins with ${p.stars}★!`);
        moving=false; disableRoll(true); return;
      }
      // Ask a question based on category
      askQuestion(tile.cat, (correct)=>{
        if(correct){ p.stars++; popStar(tile.x,tile.y,p.color); renderScore(); toast('Correct! +1★', '#22c55e'); }
        else { toast('Oops! No star this time.', '#ef4444'); }
        // Next player's turn
        turn = (turn+1)%players.length;
        renderScore();
        moving=false; disableRoll(false);
      });
    }

    // Star pop animation
    function popStar(x,y,color){
      const g = draw.group();
      const s = star(g, x, y, 0, color);
      s.animate(600).plot(starPoints(x,y,16)).fill({opacity:1}).after(()=> g.animate(400).dy(-30).opacity(0).after(()=> g.remove()));
    }
    function star(group,x,y,r,color='#ffd166'){ // returns polygon element
      const poly = group.polygon(starPoints(x,y,r)).fill(color).stroke({color:'#0a162e',width:2}).opacity(0);
      return poly;
    }
    function starPoints(cx,cy,r){
      if(r===0) return [[cx,cy],[cx,cy],[cx,cy]];
      const spikes = 5; const step = Math.PI/spikes; let rot = Math.PI/2*3; let x=cx, y=cy; const pts=[]; for(let i=0;i<spikes;i++){ x=cx+Math.cos(rot)*r; y=cy+Math.sin(rot)*r; pts.push([x,y]); rot+=step; x=cx+Math.cos(rot)*r/2; y=cy+Math.sin(rot)*r/2; pts.push([x,y]); rot+=step; } return pts; }

    // Overlay UI (questions, messages)
    function infoOverlay(text){
      overlayG.clear();
      const dim = overlayG.rect(WIDTH,HEIGHT).fill('rgba(0,0,0,.55)');
      const card = overlayG.group();
      const cw = 560, ch = 220, cx = WIDTH/2-cw/2, cy = HEIGHT/2-ch/2;
      card.rect(cw,ch).move(cx,cy).radius(14).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      card.text(text).move(cx+24, cy+24).font({size:18,weight:700});
      const ok = button(card, cx+cw-120, cy+ch-54, 96, 36, 'OK', '#2563eb');
      ok.on('click', ()=> overlayG.animate(200).opacity(0));
      overlayG.front().animate(200).opacity(1);
    }

    function toast(text,color){
      const g = uiG.group().front();
      const w=260,h=36; const x=WIDTH/2-w/2, y=HEIGHT-70;
      g.rect(w,h).move(x,y).radius(12).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      g.rect(8,h).move(x,y).fill(color);
      g.text(text).move(x+16,y+9).font({size:14});
      g.animate(800).dy(-8).after(()=> g.animate(300).opacity(0).after(()=> g.remove()));
    }

    function button(group,x,y,w,h,label,bg){
      const b = group.group();
      b.rect(w,h).move(x,y).radius(10).fill(bg||'#223463').stroke({color:'#1e2a49',width:1});
      b.text(label).center(x+w/2, y+h/2).font({size:14,weight:700});
      b.attr({cursor:'pointer'}).on('mouseover',()=> b.animate(120).scale(1.03,1.03, x+w/2,y+h/2)).on('mouseout',()=> b.animate(120).scale(1,1, x+w/2,y+h/2));
      return b;
    }

    function askQuestion(cat, cb){
      const q = generateQuestion(cat.id);
      overlayG.clear();
      const dim = overlayG.rect(WIDTH,HEIGHT).fill('rgba(0,0,0,.55)');
      const card = overlayG.group(); const cw=640, ch=320; const cx=WIDTH/2-cw/2, cy=HEIGHT/2-ch/2;
      card.rect(cw,ch).move(cx,cy).radius(14).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      card.rect(cw,30).move(cx,cy).radius(14).fill('#0b1430');
      card.text(`${cat.label} Challenge`).move(cx+16,cy+6).font({size:14,weight:700,fill:'#cfe0ff'});
      card.text(q.prompt).move(cx+24, cy+60).font({size:22,weight:700});
      // options
      const cols = 2, spacingX=280, spacingY=64; const sx=cx+40, sy=cy+120;
      q.options.forEach((opt,i)=>{
        const bx = sx + (i%cols)*spacingX; const by = sy + Math.floor(i/cols)*spacingY;
        const btn = button(card, bx, by, 240, 42, String(opt.label), '#1a2b54');
        btn.on('click', ()=>{
          const correct = (opt.value===q.answer);
          // visual feedback
          btn.clear(); btn.rect(240,42).move(bx,by).radius(10).fill(correct? '#1e3a2f':'#3a1e2a').stroke({color: correct? '#2dd4bf':'#f87171', width:1});
          btn.text(correct? '✔ '+opt.label : '✖ '+opt.label).center(bx+120,by+21).font({size:14,weight:700,fill: correct? '#34e3c9':'#ffc4c4'});
          setTimeout(()=> overlayG.animate(200).opacity(0).after(()=> cb(correct)), 600);
        });
      });
      overlayG.front().animate(200).opacity(1);
    }

    // Question generators
    function generateQuestion(kind){
      switch(kind){
        case 'ADD':{
          const a=rand(10,99), b=rand(10,99), ans=a+b;
          return mcq(`${a} + ${b} = ?`, ans, jitter(ans));
        }
        case 'MUL':{
          const a=rand(3,12), b=rand(3,12), ans=a*b;
          return mcq(`${a} × ${b} = ?`, ans, jitter(ans));
        }
        case 'DIV':{
          const b=rand(2,12); const ans=rand(2,12); const a=b*ans;
          return mcq(`${a} ÷ ${b} = ?`, ans, jitter(ans));
        }
        case 'FACT':{
          const n=rand(12,60); const factors = divisors(n); const good = choice(factors);
          const bads=[]; while(bads.length<3){ const r=rand(2,60); if(n%r!==0 && !bads.includes(r)) bads.push(r); }
          const opts = shuffle([good,...bads]);
          return { prompt:`Which is a factor of ${n}?`, answer:good, options: opts.map(v=>({label:String(v), value:v})) };
        }
        case 'PRIME':{
          const n=rand(11,79); const ans=isPrime(n)? 'Prime':'Composite';
          const opts=[{label:'Prime',value:'Prime'},{label:'Composite',value:'Composite'},{label:'Both',value:'Both'},{label:'Neither', value:'Neither'}];
          return { prompt:`${n} is …`, answer: ans, options: opts };
        }
        case 'FRAC':{
          // Compare fractions: which is greater?
          let a=rand(1,9), b=rand(2,10); while(a>=b) { a=rand(1,9); b=rand(2,10);} // a<b proper
          let c=rand(1,9), d=rand(2,10); while(c>=d || (a/b===c/d)) { c=rand(1,9); d=rand(2,10);} 
          const ans = (a/b > c/d) ? 'Left' : 'Right';
          const opts = [ {label:`${a}/${b} (Left)`, value:'Left'}, {label:`${c}/${d} (Right)`, value:'Right'}, {label:'Equal', value:'Equal'}, {label:'Cannot tell', value:'?'} ];
          return { prompt:`Which fraction is larger?`, answer: ans, options: shuffle(opts) };
        }
        case 'SEQ':{
          // Simple arithmetic/geometric sequence or alternating
          const typ = choice(['arith','geom']);
          if(typ==='arith'){
            const start=rand(2,12), d=rand(2,9); const seq=[start,start+d,start+2*d,start+3*d,start+4*d]; const hole=rand(1,3); const ans=seq[hole]; seq[hole]='?';
            return mcq(`Fill the missing term: ${seq.join('  ')}`, ans, jitter(ans));
          } else {
            const start=rand(2,5), r=rand(2,4); const seq=[start,start*r,start*r*r,start*r*r*r,start*r*r*r*r]; const hole=rand(1,3); const ans=seq[hole]; seq[hole]='?';
            return mcq(`Fill the missing term: ${seq.join('  ')}`, ans, jitter(ans));
          }
        }
      }
    }

    function mcq(prompt, answer, extras){
      const options = shuffle([answer, ...extras.slice(0,3)]).map(v=>({label:String(v), value:v}));
      return { prompt, answer, options };
    }
    function jitter(ans){ const s=new Set(); while(s.size<6){ let d=rand(-10,10); if(d!==0) s.add(ans+d); } return Array.from(s); }
    function divisors(n){ const out=[]; for(let i=2;i<=n;i++){ if(n%i===0) out.push(i);} return out; }
    function isPrime(n){ if(n<2) return false; for(let i=2;i*i<=n;i++){ if(n%i===0) return false; } return true; }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

    // UI controls
    function disableRoll(dis){ document.getElementById('rollBtn').toggleAttribute('disabled', dis); }

    function newGameFlow(){
      overlayG.clear();
      const dim = overlayG.rect(WIDTH,HEIGHT).fill('rgba(0,0,0,.55)');
      const card = overlayG.group();
      const cw=560,ch=340; const cx=WIDTH/2-cw/2, cy=HEIGHT/2-ch/2;
      card.rect(cw,ch).move(cx,cy).radius(14).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      card.text('New Game').move(cx+24,cy+16).font({size:20,weight:700});
      card.text('Choose number of players and enter names.').move(cx+24,cy+48).font({size:14,fill:'#aac1ef'});

      const pBox = card.group();
      const entries = [];
      for(let i=0;i<4;i++){
        const y = cy+82 + i*52; const x = cx+28;
        pBox.rect(500,42).move(x,y).radius(10).fill('#0b1430').stroke({color:'#1e2a49',width:1});
        pBox.text(`Player ${i+1} name:`).move(x+12,y+10).font({size:13,fill:'#9fb3d9'});
        // Use foreignObject to embed HTML input
        const fo = pBox.foreignObject(320,28).move(x+150,y+7);
        const div = document.createElement('div'); div.innerHTML = `<input data-idx="${i}" style="width:100%;height:28px;border-radius:8px;border:1px solid #2b3f6e;background:#0e1830;color:#cfe0ff;padding:4px 8px" placeholder="(leave blank to disable)"/>`;
        fo.add(SVG(div));
        entries.push(fo);
      }
      const ok = button(card, cx+cw-120, cy+ch-54, 96, 36, 'Start ▶', '#2563eb');
      ok.on('click', ()=>{
        const names = entries.map(fo=> fo.node.querySelector('input').value.trim()).filter(Boolean);
        if(names.length===0){ infoOverlay('Add at least one player name.'); return; }
        started = true; turn=0; buildBoard(); setupPlayers(names.length); names.forEach((n,i)=> players[i].name = n.substring(0,12)); renderScore(); overlayG.animate(200).opacity(0);
      });
      overlayG.front().animate(200).opacity(1);
    }

    function showEnd(message){
      overlayG.clear();
      const dim = overlayG.rect(WIDTH,HEIGHT).fill('rgba(0,0,0,.6)');
      const card = overlayG.group();
      const cw=560,ch=260; const cx=WIDTH/2-cw/2, cy=HEIGHT/2-ch/2;
      card.rect(cw,ch).move(cx,cy).radius(14).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      card.text('Victory!').move(cx+24,cy+18).font({size:22,weight:800});
      card.text(message).move(cx+24,cy+60).font({size:18});
      const again = button(card, cx+cw-140, cy+ch-54, 120, 36, 'Play Again', '#22c55e');
      again.on('click', ()=>{ started=false; newGameFlow(); });
      overlayG.front().animate(200).opacity(1);
    }

    // Legends
    function renderLegend(){
      const leg = document.getElementById('catLegend');
      leg.innerHTML = CATS.map(c=>`<span class="key"><span class="dot" style="background:${c.color}"></span>${c.label}</span>`).join('');
    }

    // Controls
    document.getElementById('rollBtn').addEventListener('click', rollDie);
    document.getElementById('newGameBtn').addEventListener('click', ()=>{ newGameFlow(); });

    // Init
    initSVG();
    buildBoard();
    setupPlayers(2); started=false; disableRoll(true); newGameFlow(); renderLegend();
  })();
  </script>
</body>
</html>
