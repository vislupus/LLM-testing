<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Biomebound: The Living Circuit</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 20% 10%, rgba(76, 255, 190, .13), transparent 28%),
      radial-gradient(circle at 85% 90%, rgba(104, 168, 255, .14), transparent 30%),
      #07131d;
    font-family: Inter, ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  #game { width: 100%; height: 100%; touch-action: manipulation; user-select: none; }
  #game svg { width: 100%; height: 100%; display: block; }
  .clickable { cursor: pointer; }
  .soft-shadow { filter: drop-shadow(0 10px 16px rgba(0,0,0,.28)); }
  .glow { filter: drop-shadow(0 0 10px currentColor); }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
<!-- SVG.js is loaded when online. The embedded compatibility layer below keeps the one-file game playable offline. -->

</head>
<body>
<div id="game" aria-label="Biomebound educational ecology board game"></div>
<script>
/* Embedded offline compatibility layer for the SVG.js methods used by this game. */

  class W {

    addTo(target) { (typeof target === 'string' ? document.querySelector(target) : target).appendChild(this.node); return this; }

    size(w,h) { return this.attr({width:w,height:h}); }
    viewbox(x,y,w,h) { return this.attr({viewBox:`${x} ${y} ${w} ${h}`}); }
    attr(a,b) { if (typeof a === 'string') { if (b === undefined) return this.node.getAttribute(a); this.node.setAttribute(a,b); }
      else Object.entries(a||{}).forEach(([k,v])=>v!=null&&this.node.setAttribute(k,v)); return this; }
    fill(v) { return this.attr('fill', typeof v === 'object' ? (v.color || 'none') : v); }
    stroke(v) { if (typeof v === 'string') return this.attr('stroke',v); return this.attr({stroke:v.color||'none','stroke-width':v.width||1,'stroke-linecap':v.linecap||'round','stroke-linejoin':v.linejoin||'round','stroke-dasharray':v.dasharray||null}); }
    opacity(v) { return this.attr('opacity',v); }
    move(x,y) { return this.attr({x,y}); }
    x(v) { return v===undefined ? +(this.attr('x')||0) : this.attr('x',v); }
    y(v) { return v===undefined ? +(this.attr('y')||0) : this.attr('y',v); }
    cx(v) { return v===undefined ? +(this.attr('cx')||0) : this.attr('cx',v); }
    cy(v) { return v===undefined ? +(this.attr('cy')||0) : this.attr('cy',v); }
    center(x,y) { const tag=this.node.tagName; if(['circle','ellipse'].includes(tag)) this.attr({cx:x,cy:y}); else { const b=this.bbox(); this.move(x-b.width/2,y-b.height/2); } return this; }
    radius(r) { return this.attr({rx:r,ry:r}); }
    font(o) { const map={family:'font-family',size:'font-size',weight:'font-weight',anchor:'text-anchor',leading:'line-height'}; Object.entries(o||{}).forEach(([k,v])=>this.attr(map[k]||k,v)); return this; }
    text(v) { this.node.textContent=v; return this; }
    rotate(deg,cx,cy) { return this.attr('transform',`rotate(${deg}${cx!=null?' '+cx+' '+cy:''})`); }
    transform(v) { const p=[]; if(v.translateX||v.translateY) p.push(`translate(${v.translateX||0} ${v.translateY||0})`); if(v.rotate) p.push(`rotate(${v.rotate})`); if(v.scale) p.push(`scale(${v.scale})`); return this.attr('transform',p.join(' ')); }
    on(e,fn) { this.node.addEventListener(e,fn); return this; }
    off(e,fn) { this.node.removeEventListener(e,fn); return this; }
    addClass(c) { this.node.classList.add(c); return this; }
    removeClass(c) { this.node.classList.remove(c); return this; }
    css(o) { Object.assign(this.node.style,o); return this; }
    hide() { this.node.style.display='none'; return this; }
    show() { this.node.style.display=''; return this; }
    remove() { this.node.remove(); return this; }
    clear() { this.node.replaceChildren(); return this; }
    front() { this.node.parentNode && this.node.parentNode.appendChild(this.node); return this; }
    back() { this.node.parentNode && this.node.parentNode.insertBefore(this.node,this.node.parentNode.firstChild); return this; }
    bbox() { try { return this.node.getBBox(); } catch { return {x:0,y:0,width:0,height:0}; } }
    group() { return this.addWrap('g'); }
    rect(w,h) { return this.addWrap('rect').size(w,h); }
    circle(d) { return this.addWrap('circle').attr('r',d/2); }
    ellipse(w,h) { return this.addWrap('ellipse').attr({rx:w/2,ry:h/2}); }

(() => {
'use strict';

const W = 1280, H = 800;
const draw = SVG().addTo('#game').size('100%','100%').viewbox(0,0,W,H);
draw.attr({'role':'img','aria-label':'Biomebound: The Living Circuit board game'});

const C = {
  bg:'#07131d', panel:'#0d2230', panel2:'#102b3a', ink:'#eafcff', muted:'#9db8c5',
  canopy:'#48d597', reef:'#4fc8ff', dune:'#ffc96b', frost:'#bca7ff',
  danger:'#ff6d7a', good:'#77f2bb', gold:'#ffe28a', white:'#ffffff', dark:'#07131d'
};
const BIOMES = [
  {name:'Canopy', color:C.canopy, icon:'leaf', subtitle:'Rainforest systems'},
  {name:'Reef', color:C.reef, icon:'wave', subtitle:'Ocean communities'},
  {name:'Dune', color:C.dune, icon:'sun', subtitle:'Dryland survival'},
  {name:'Frost', color:C.frost, icon:'snow', subtitle:'Polar adaptation'}
];
const PLAYER_COLORS = ['#ff7ab6','#69e7ff','#ffd45d','#9bff82'];
const PLAYER_NAMES = ['Moss','Ripple','Sol','Nova'];
const TILE_TYPES = ['quiz','link','rest','quiz','rift','quiz','wild','gate'];
const TILE_LABELS = {quiz:'?',link:'↔',rest:'✦',rift:'!',wild:'★',gate:'◆'};

const state = {
  screen:'title', players:[], playerCount:1, current:0, turn:0, busy:false,
  position:[], energy:[0,0,0,0], stabilized:[false,false,false,false],
  storm:0, insight:1, streak:0, bestStreak:0, score:0, sound:true,
  tileCenters:[], tokenEls:[], question:null, finalAsked:false
};

const layers = {
  bg:draw.group(), board:draw.group(), fx:draw.group(), tokens:draw.group(), ui:draw.group(), overlay:draw.group()
};

function txt(parent, str, x, y, size=20, color=C.ink, weight=600, anchor='start') {
  const t = parent.plain(str).font({family:'Inter, Segoe UI, sans-serif',size,weight,anchor}).fill(color);
  t.attr({'dominant-baseline':'middle'}).move(x,y-size*0.55);
  return t;
}
function multiline(parent, lines, x, y, size=18, color=C.ink, weight=500, gap=1.35, anchor='start') {
  const g=parent.group(); lines.forEach((s,i)=>txt(g,s,x,y+i*size*gap,size,color,weight,anchor)); return g;
}
function roundRect(parent,x,y,w,h,r,fill,stroke=null,sw=1) {
  const el=parent.rect(w,h).move(x,y).radius(r).fill(fill);
  if(stroke) el.stroke({color:stroke,width:sw}); return el;
}
function button(parent,x,y,w,h,label,opts={}) {
  const g=parent.group().addClass('clickable');
  const bg=roundRect(g,x,y,w,h,opts.r||18,opts.fill||C.panel2,opts.stroke||'rgba(255,255,255,.14)',opts.sw||1.5);
  const t=txt(g,label,x+w/2,y+h/2,(opts.size||18),opts.color||C.ink,opts.weight||750,'middle');
  g.on('pointerenter',()=>{ bg.attr('opacity',.86); });
  g.on('pointerleave',()=>{ bg.attr('opacity',1); });
  if(opts.onClick) g.on('click',e=>{e.stopPropagation(); opts.onClick();});
  return {g,bg,t};
}
function icon(parent,type,x,y,s,color=C.ink) {
  const g=parent.group();
  if(type==='leaf') {
    g.path(`M ${x-s*.05} ${y+s*.38} C ${x-s*.52} ${y+s*.1}, ${x-s*.35} ${y-s*.44}, ${x+s*.42} ${y-s*.36} C ${x+s*.42} ${y+s*.12}, ${x+s*.22} ${y+s*.43}, ${x-s*.05} ${y+s*.38} Z`).fill(color);
    g.path(`M ${x-s*.22} ${y+s*.22} Q ${x+s*.05} ${y-.02*s}, ${x+s*.27} ${y-s*.22}`).fill('none').stroke({color:C.dark,width:Math.max(1.5,s*.07)});
  } else if(type==='wave') {
    for(let i=-1;i<=1;i++) g.path(`M ${x-s*.5} ${y+i*s*.22} Q ${x-s*.25} ${y-s*.18+i*s*.22}, ${x} ${y+i*s*.22} T ${x+s*.5} ${y+i*s*.22}`).fill('none').stroke({color,width:Math.max(2,s*.09)});
  } else if(type==='sun') {
    g.circle(s*.42).center(x,y).fill(color); for(let i=0;i<8;i++){ const a=i*Math.PI/4; g.line(x+Math.cos(a)*s*.31,y+Math.sin(a)*s*.31,x+Math.cos(a)*s*.52,y+Math.sin(a)*s*.52).stroke({color,width:Math.max(2,s*.08)}); }
  } else if(type==='snow') {
    for(let i=0;i<3;i++){ const a=i*Math.PI/3; g.line(x-Math.cos(a)*s*.48,y-Math.sin(a)*s*.48,x+Math.cos(a)*s*.48,y+Math.sin(a)*s*.48).stroke({color,width:Math.max(2,s*.075)}); }
    g.circle(s*.14).center(x,y).fill(color);
  } else if(type==='book') {
    g.path(`M${x-s*.48},${y-s*.34} Q${x-s*.2},${y-s*.42} ${x},${y-s*.2} L${x},${y+s*.4} Q${x-s*.22},${y+s*.2} ${x-s*.48},${y+s*.28}Z`).fill('none').stroke({color,width:s*.07});
    g.path(`M${x+s*.48},${y-s*.34} Q${x+s*.2},${y-s*.42} ${x},${y-s*.2} L${x},${y+s*.4} Q${x+s*.22},${y+s*.2} ${x+s*.48},${y+s*.28}Z`).fill('none').stroke({color,width:s*.07});
  } else if(type==='sound') {
    g.polygon([[x-s*.45,y-s*.18],[x-s*.18,y-s*.18],[x+s*.08,y-s*.42],[x+s*.08,y+s*.42],[x-s*.18,y+s*.18],[x-s*.45,y+s*.18]]).fill(color);
    g.path(`M${x+s*.18},${y-s*.24} Q${x+s*.48},${y} ${x+s*.18},${y+s*.24}`).fill('none').stroke({color,width:s*.08});
  }
  return g;
}
function safeAnimate(el, keyframes, options) {
  if (el && el.node && el.node.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) return el.node.animate(keyframes,options);
  return {finished:Promise.resolve()};
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
function rand(n){ return Math.floor(Math.random()*n); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

let audioCtx=null;
function tone(freq=440,dur=.08,type='sine',gain=.035){
  if(!state.sound) return;
  try { audioCtx ||= new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type=type;o.frequency.value=freq;g.gain.value=gain;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur); } catch{}
}
function sfx(kind){ if(kind==='good'){tone(660,.09);setTimeout(()=>tone(880,.12),70);} else if(kind==='bad'){tone(180,.18,'sawtooth',.025);} else if(kind==='roll'){tone(280,.06);setTimeout(()=>tone(360,.07),55);} else if(kind==='win'){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.04),i*100));} }

function clearAll(){ Object.values(layers).forEach(l=>l.clear()); }

function drawBackdrop() {
  layers.bg.clear();
  layers.bg.rect(W,H).fill(C.bg);
  for(let i=0;i<85;i++){
    const x=Math.random()*W,y=Math.random()*H,r=Math.random()*1.8+.4;
    const p=layers.bg.circle(r*2).center(x,y).fill(i%5===0?C.gold:C.white).opacity(Math.random()*.45+.15);
    if(i<18) safeAnimate(p,[{opacity:.12},{opacity:.65},{opacity:.12}],{duration:1800+Math.random()*2400,iterations:Infinity,delay:Math.random()*1200});
  }
  layers.bg.circle(720).center(390,420).fill('none').stroke({color:'rgba(76,225,176,.09)',width:70});
  layers.bg.circle(920).center(390,420).fill('none').stroke({color:'rgba(87,163,255,.05)',width:2,dasharray:'8 18'});
}

function drawTitle() {
  clearAll(); drawBackdrop(); state.screen='title'; state.busy=false;
  const g=layers.board;
  roundRect(g,95,72,1090,650,42,'rgba(10,30,42,.88)','rgba(152,255,218,.18)',2).addClass('soft-shadow');
  // living circuit emblem
  const emblem=g.group();
  emblem.circle(238).center(350,345).fill('rgba(38,100,91,.28)').stroke({color:'rgba(130,255,211,.35)',width:2});
  for(let i=0;i<4;i++){
    const a=-Math.PI/2+i*Math.PI/2, bx=350+Math.cos(a)*92, by=345+Math.sin(a)*92;
    emblem.path(`M350 345 Q ${350+Math.cos(a+.55)*56} ${345+Math.sin(a+.55)*56}, ${bx} ${by}`).fill('none').stroke({color:BIOMES[i].color,width:8,linecap:'round'});
    emblem.circle(44).center(bx,by).fill(BIOMES[i].color).opacity(.9);
    icon(emblem,BIOMES[i].icon,bx,by,22,C.dark);
  }
  emblem.circle(82).center(350,345).fill(C.gold).stroke({color:C.white,width:3});
  emblem.path('M350 372 C327 348 337 320 350 303 C363 320 373 348 350 372Z').fill(C.dark);
  emblem.path('M349 359 Q324 338 317 318 M351 346 Q375 329 384 309').fill('none').stroke({color:C.dark,width:5,linecap:'round'});
  safeAnimate(emblem,[{transform:'translateY(0px)'},{transform:'translateY(-10px)'},{transform:'translateY(0px)'}],{duration:3600,iterations:Infinity,easing:'ease-in-out'});

  txt(g,'BIOMEBOUND',595,170,58,C.ink,900);
  txt(g,'THE LIVING CIRCUIT',598,228,22,C.good,800);
  multiline(g,[
    'A cooperative ecology board game.',
    'Travel through four biomes, solve living-system',
    'challenges, and restore balance before the storm rises.'
  ],600,290,20,C.muted,520,1.45);

  txt(g,'Choose explorers',600,410,16,C.muted,700);
  const choices=[];
  for(let i=1;i<=4;i++){
    const b=button(g,600+(i-1)*108,440,88,58,String(i),{fill:i===state.playerCount?'rgba(119,242,187,.22)':C.panel2,stroke:i===state.playerCount?C.good:'rgba(255,255,255,.14)',size:22,onClick:()=>{state.playerCount=i;drawTitle();}});
    choices.push(b);
  }
  button(g,600,530,420,70,'ENTER THE CIRCUIT  →',{fill:C.good,color:C.dark,size:19,stroke:C.good,onClick:startGame});
  button(g,1037,530,70,70,'? ',{fill:C.panel2,size:24,onClick:showRules});
  icon(g,'book',1072,565,24,C.ink);
  txt(g,'Ages 10+  •  1–4 players  •  10–20 minutes',600,635,15,C.muted,600);
  txt(g,'All artwork, animation, and game pieces are vector-drawn.',350,690,13,'rgba(222,244,248,.48)',500,'middle');
}

function startGame(){
  state.players=Array.from({length:state.playerCount},(_,i)=>({name:PLAYER_NAMES[i],color:PLAYER_COLORS[i]}));
  state.current=0;state.turn=0;state.position=Array(state.playerCount).fill(0);state.energy=[0,0,0,0];state.stabilized=[false,false,false,false];state.storm=0;state.insight=1;state.streak=0;state.bestStreak=0;state.score=0;state.finalAsked=false;state.busy=false;
  state.screen='game'; renderGame();
}

function boardPoint(i,r=302){
  const a=-Math.PI/2 + (i/32)*Math.PI*2;
  return {x:416+Math.cos(a)*r,y:405+Math.sin(a)*r,a};
}
function regionOfTile(i){ return Math.floor((i%32)/8); }

function renderGame(){
  clearAll(); drawBackdrop(); drawBoard(); drawSidePanel(); drawTokens(); updateUI();
}

function drawBoard(){
  const g=layers.board;
  roundRect(g,34,30,844,740,34,'rgba(9,28,39,.78)','rgba(255,255,255,.12)',1.5).addClass('soft-shadow');
  txt(g,'THE LIVING CIRCUIT',72,66,16,C.good,850);
  txt(g,'Answer • Connect • Stabilize',72,92,13,C.muted,600);

  // region arcs and labels
  for(let b=0;b<4;b++){
    const start=-Math.PI/2+b*Math.PI/2+.035, end=start+Math.PI/2-.07, r=342;
    const p1={x:416+Math.cos(start)*r,y:405+Math.sin(start)*r},p2={x:416+Math.cos(end)*r,y:405+Math.sin(end)*r};
    const arc=g.path(`M${p1.x},${p1.y} A${r},${r} 0 0 1 ${p2.x},${p2.y}`).fill('none').stroke({color:BIOMES[b].color,width:20,linecap:'round'}).opacity(.22);
    const m=(start+end)/2, lx=416+Math.cos(m)*360,ly=405+Math.sin(m)*360;
    txt(g,BIOMES[b].name.toUpperCase(),lx,ly,13,BIOMES[b].color,850,'middle');
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches) safeAnimate(arc,[{opacity:.13},{opacity:.3},{opacity:.13}],{duration:3100+b*300,iterations:Infinity});
  }

  // circuit path
  let path='';
  for(let i=0;i<32;i++){ const p=boardPoint(i); path += (i?' L':'M')+p.x+' '+p.y; }
  path += ' Z';
  g.path(path).fill('none').stroke({color:'rgba(182,232,236,.12)',width:18,linecap:'round',linejoin:'round'});
  g.path(path).fill('none').stroke({color:'rgba(194,255,231,.3)',width:2,dasharray:'4 12'});

  state.tileCenters=[];
  for(let i=0;i<32;i++){
    const p=boardPoint(i), b=regionOfTile(i), type=TILE_TYPES[i%8], isGate=type==='gate';
    state.tileCenters.push(p);
    const tg=g.group();
    const r=isGate?26:20;
    tg.circle(r*2).center(p.x,p.y).fill(isGate?BIOMES[b].color:'rgba(15,43,56,.97)').stroke({color:isGate?C.white:BIOMES[b].color,width:isGate?2.5:2});
    if(type==='rest') tg.circle(19).center(p.x,p.y).fill(BIOMES[b].color).opacity(.22);
    txt(tg,TILE_LABELS[type],p.x,p.y+(type==='gate'?1:0),isGate?19:16,isGate?C.dark:(type==='rift'?C.danger:BIOMES[b].color),900,'middle');
    tg.addClass('clickable').on('click',()=>showTileHint(i));
  }

  drawCore(g);
}

function drawCore(g){
  const core=g.group();
  core.circle(315).center(416,405).fill('rgba(7,20,29,.82)').stroke({color:'rgba(180,255,230,.12)',width:2});
  core.circle(248).center(416,405).fill('rgba(12,39,49,.92)').stroke({color:'rgba(255,255,255,.09)',width:2});
  core.circle(180).center(416,405).fill('rgba(18,57,62,.72)').stroke({color:'rgba(119,242,187,.2)',width:2,dasharray:'6 10'});
  // branches
  for(let b=0;b<4;b++){
    const a=-Math.PI/2+b*Math.PI/2, ex=416+Math.cos(a)*102,ey=405+Math.sin(a)*102;
    core.path(`M416 422 Q ${416+Math.cos(a+.42)*58} ${405+Math.sin(a+.42)*58}, ${ex} ${ey}`).fill('none').stroke({color:BIOMES[b].color,width:state.stabilized[b]?12:7,linecap:'round'}).opacity(state.stabilized[b]?1:.33);
    const orb=core.circle(44).center(ex,ey).fill(state.stabilized[b]?BIOMES[b].color:'rgba(8,27,35,.95)').stroke({color:BIOMES[b].color,width:3});
    icon(core,BIOMES[b].icon,ex,ey,20,state.stabilized[b]?C.dark:BIOMES[b].color);
    if(state.stabilized[b]) safeAnimate(orb,[{transformOrigin:`${ex}px ${ey}px`,transform:'scale(1)'},{transformOrigin:`${ex}px ${ey}px`,transform:'scale(1.12)'},{transformOrigin:`${ex}px ${ey}px`,transform:'scale(1)'}],{duration:1600,iterations:Infinity});
  }
  core.path('M416 462 C383 429 397 381 416 350 C435 381 449 429 416 462Z').fill(C.gold).stroke({color:C.white,width:3});
  core.path('M416 447 Q385 416 374 385 M417 427 Q447 405 459 376').fill('none').stroke({color:C.dark,width:7,linecap:'round'});
  txt(core,'LIVING CORE',416,482,12,C.ink,900,'middle');
}

function drawSidePanel(){
  const g=layers.ui;
  roundRect(g,900,30,346,740,34,'rgba(9,28,39,.92)','rgba(255,255,255,.13)',1.5).addClass('soft-shadow');
  txt(g,'MISSION CONTROL',934,65,15,C.good,850);
  const sound=button(g,1178,48,42,42,'',{fill:'rgba(255,255,255,.05)',r:13,always:true,onClick:()=>{state.sound=!state.sound;updateUI();}});
  icon(sound.g,'sound',1199,69,20,state.sound?C.good:C.muted);

function drawTokens(){
  state.tokenEls=[];

  state.players.forEach((p,i)=>{
    const pos=state.tileCenters[state.position[i]], ox=offsets[i][0],oy=offsets[i][1];

async function rollMove(){
  if(state.busy||state.screen!=='game')return;
  state.busy=true;updateUI();sfx('roll');
  const roll=1+rand(4);
  showToast(`Pulse ${roll}`,C.gold,850);
  await sleep(550);
  for(let step=0;step<roll;step++){
    state.position[state.current]=(state.position[state.current]+1)%32;
    await moveTokenTo(state.current,state.position[state.current],230);
    tone(280+step*55,.04,'triangle',.018);
  }
  await sleep(180);
  resolveTile(state.position[state.current]);
}
async function moveTokenTo(pi,tile,duration=260){
  const el=state.tokenEls[pi], p=state.tileCenters[tile], offsets=[[-12,-8],[12,-8],[-12,12],[12,12]],ox=offsets[pi][0],oy=offsets[pi][1];
  const from=el.node.getBoundingClientRect();
  const bb=el.bbox();
  const currentTransform=el.attr('transform')||'';
  const oldP=state.tileCenters[(tile+31)%32];
  const dx=(p.x+ox)-(oldP.x+ox),dy=(p.y+oy)-(oldP.y+oy);
  // SVG group coordinates are internal; translate incrementally.
  const prev=el.node.dataset.tx?+el.node.dataset.tx:0, prevY=el.node.dataset.ty?+el.node.dataset.ty:0;
  const nx=prev+dx,ny=prevY+dy;el.node.dataset.tx=nx;el.node.dataset.ty=ny;
  const anim=safeAnimate(el,[{transform:`translate(${prev}px,${prevY}px) scale(1)`},{transform:`translate(${(prev+nx)/2}px,${(prevY+ny)/2-12}px) scale(1.12)`},{transform:`translate(${nx}px,${ny}px) scale(1)`}],{duration,easing:'ease-in-out',fill:'forwards'});
  await anim.finished.catch(()=>{}); el.attr('transform',`translate(${nx} ${ny})`);
}

function resolveTile(i){
  const type=TILE_TYPES[i%8], biome=regionOfTile(i);
  if(type==='quiz') askQuestion('quiz',biome);
  else if(type==='link') askQuestion('link',biome);
  else if(type==='gate') gateEvent(biome);
  else if(type==='rest') restEvent(biome);
  else if(type==='rift') riftEvent(biome);
  else wildEvent(biome);
}

function restEvent(b){
  const gain=state.insight<5?1:0;state.insight+=gain;
  showEventCard('QUIET CLEARING', gain?'Your team observes before acting. Gain 1 Insight.':'Your Insight reserve is already full.', BIOMES[b].color,'✦',()=>endTurn());
}
function riftEvent(b){

      {label:'TAKE +1 STORM',color:C.danger,action:()=>{addStorm(1);endTurn();}}

function wildEvent(b){

function gateEvent(b){
  if(state.stabilized[b]){

function addEnergy(b,n){
  if(state.stabilized[b]){state.insight=clamp(state.insight+1,0,5);return;}
  state.energy[b]=clamp(state.energy[b]+n,0,3);state.score+=n*20;updateUI();pulseBiome(b);
  if(state.energy[b]>=3) showToast(`${BIOMES[b].name} ready — land on ◆`,BIOMES[b].color,1200);

function pulseBiome(b){

function closeOverlay(){layers.overlay.clear();}
function showRules(){
  const prev=state.screen;state.busy=true;layers.overlay.clear();const o=layers.overlay;o.rect(W,H).fill('rgba(2,9,14,.82)');
  const g=o.group();roundRect(g,150,60,980,680,36,'rgba(11,34,46,.99)',C.good,2.5).addClass('soft-shadow');
  txt(g,'HOW TO PLAY',205,110,30,C.ink,950);txt(g,'Restore four ecosystems before the Storm reaches 10.',205,150,16,C.good,700);
  const cols=[205,525,845];
  const heads=['1  MOVE','2  LEARN','3  STABILIZE'];
  const bodies=[
    ['Pulse the orb to move 1–4','spaces around the circuit.','Each player shares one mission.'],
    ['? asks a science question.','↔ tests cause-and-effect.','★ creates a surprise event.'],
    ['Correct answers add energy.','Reach 3, then land on ◆','to stabilize that biome.']
  ];
  heads.forEach((h,i)=>{txt(g,h,cols[i],215,17,[C.canopy,C.reef,C.dune][i],900);multiline(g,bodies[i],cols[i],255,15,C.muted,560,1.55);});
  roundRect(g,205,365,870,130,24,'rgba(255,255,255,.045)','rgba(255,255,255,.09)',1);
  txt(g,'SPACE GUIDE',235,397,14,C.ink,850);
  const guide=[['?','Question','Correct: +1 stability, +1 Insight'],['↔','Connection','Correct: +2 stability, +1 Insight'],['✦','Clearing','Gain 1 Insight'],['!','Rift','Spend Insight or take +1 Storm'],['★','Wild','A discovery, event, or challenge'],['◆','Beacon','At 3 energy, stabilize the biome']];
  guide.forEach((r,i)=>{const x=235+(i%3)*285,y=432+Math.floor(i/3)*42;txt(g,r[0],x,y,20,i===3?C.danger:C.good,900);txt(g,r[1],x+35,y-8,14,C.ink,780);txt(g,r[2],x+35,y+11,11,C.muted,550);});
  txt(g,'TEAM TIPS',205,550,14,C.gold,900);
  multiline(g,['Insight can prevent Rift damage. Every 4 turns, time advances the Storm by 1.','Stabilized biomes turn future energy into Insight. Use mistakes as clues—explanations teach the system.'],205,585,15,C.muted,560,1.6);
  button(g,420,665,440,52,'BACK TO THE GAME',{fill:C.good,color:C.dark,stroke:C.good,always:true,onClick:()=>{closeOverlay();state.busy=false;if(prev==='title')drawTitle();else if(prev==='win')showWin();else if(prev==='loss')showLoss();else updateUI();}});
}

function showEventCard(title,body,color,symbol,after){
  state.busy=true;layers.overlay.clear();const o=layers.overlay;o.rect(W,H).fill('rgba(2,9,14,.78)');const g=o.group();roundRect(g,300,170,680,450,34,'rgba(12,35,47,.99)',color,2.5).addClass('soft-shadow');
  g.circle(90).center(640,255).fill('rgba(255,255,255,.06)').stroke({color,width:3});txt(g,symbol,640,257,48,color,900,'middle');
  txt(g,title,640,340,25,C.ink,900,'middle');multiline(g,wrapText(body,62),640,390,18,C.muted,560,1.45,'middle');
  button(g,390,530,500,58,'CONTINUE',{fill:color,color:C.dark,stroke:color,onClick:after});
}
function showChoiceCard(title,body,choices,color,symbol){
  state.busy=true;layers.overlay.clear();const o=layers.overlay;o.rect(W,H).fill('rgba(2,9,14,.78)');const g=o.group();roundRect(g,270,140,740,520,34,'rgba(12,35,47,.99)',color,2.5).addClass('soft-shadow');
  txt(g,symbol,640,220,58,color,900,'middle');txt(g,title,640,292,25,C.ink,900,'middle');multiline(g,wrapText(body,64),640,345,17,C.muted,560,1.45,'middle');
  choices.forEach((c,i)=>button(g,350,480+i*72,580,56,c.label,{fill:i===0?c.color:C.panel2,color:i===0?C.dark:C.ink,stroke:c.color,onClick:c.action}));
}
function showTileHint(i){
  if(state.busy||state.screen!=='game')return;const type=TILE_TYPES[i%8],b=regionOfTile(i), map={quiz:'Question: answer for stability.',link:'Connection: trace cause and effect.',rest:'Quiet Clearing: gain Insight.',rift:'Rift: spend Insight or raise the Storm.',wild:'Wild discovery: expect the unexpected.',gate:'Beacon: stabilize at 3 energy.'};
  showToast(`${BIOMES[b].name} • ${map[type]}`,BIOMES[b].color,1400);
}
function showToast(message,color=C.good,duration=1000){
  const g=layers.fx.group();const width=Math.min(620,Math.max(220,message.length*8.3+60));roundRect(g,416-width/2,112,width,48,18,'rgba(6,20,28,.96)',color,1.5);txt(g,message,416,136,14,C.ink,750,'middle');
  safeAnimate(g,[{transform:'translateY(-12px)',opacity:0},{transform:'translateY(0)',opacity:1},{transform:'translateY(0)',opacity:1},{transform:'translateY(-10px)',opacity:0}],{duration:duration+400,easing:'ease-out',fill:'forwards'});setTimeout(()=>g.remove(),duration+450);
}
function burst(x,y,color,count=18){
  const g=layers.fx.group();for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,d=35+Math.random()*95,r=2+Math.random()*4;const p=g.circle(r*2).center(x,y).fill(i%4===0?C.gold:color);safeAnimate(p,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:600+Math.random()*500,easing:'cubic-bezier(.15,.75,.25,1)',fill:'forwards'});}setTimeout(()=>g.remove(),1200);
}
function wrapText(s,max){
  const words=s.split(/\s+/),lines=[];let line='';words.forEach(w=>{const test=line?line+' '+w:w;if(test.length>max&&line){lines.push(line);line=w;}else line=test;});if(line)lines.push(line);return lines;
}

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&state.screen==='game'&&!state.busy){e.preventDefault();rollMove();}
  if(e.key==='Escape'&&layers.overlay.node.childNodes.length&&state.screen==='game'){closeOverlay();state.busy=false;updateUI();}
});

drawTitle();
})();
</script>
</body>
</html>
