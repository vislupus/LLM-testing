<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Seekers: An Educational Board Game</title>
    <!-- Load SVG.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d17;
            --panel-bg: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --text: #ffffff;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: var(--font-main);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 700px;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
            overflow: hidden;
        }

        /* UI Overlays */
        .ui-panel {
            position: absolute;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 12px;
            pointer-events: none; /* Let clicks pass through to SVG unless button */
        }

        #top-bar {
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        #player-stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            text-align: center;
        }
        .stat-label { font-size: 0.8rem; color: #aaa; }
        .stat-value { font-size: 1.2rem; font-weight: bold; color: var(--accent); }

        #controls {
            bottom: 20px;
            right: 20px;
            width: 200px;
            text-align: center;
            pointer-events: auto;
        }

        #dice-btn {
            background: linear-gradient(45deg, #ff00cc, #333399);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 204, 0.5);
            transition: transform 0.1s;
            font-weight: bold;
            text-transform: uppercase;
        }
        #dice-btn:active { transform: scale(0.95); }
        #dice-btn:disabled { filter: grayscale(1); cursor: not-allowed; }

        #message-area {
            bottom: 20px;
            left: 20px;
            width: 300px;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* Modal for Cards/Events */
        #modal-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
        }

        #modal-content {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--accent);
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        h2 { margin-top: 0; color: var(--accent); }
        .modal-text { font-size: 1.1rem; margin: 20px 0; }
        
        .choice-btn {
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .choice-btn:hover { background: var(--accent); color: #000; }

        /* SVG Styles */
        svg {
            display: block;
        }
        .tile-label {
            font-family: var(--font-main);
            font-size: 10px;
            fill: rgba(255,255,255,0.7);
            text-anchor: middle;
            pointer-events: none;
        }
        .player-token {
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.8));
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- SVG Canvas will be injected here -->
        
        <!-- UI Layer -->
        <div id="top-bar" class="ui-panel">
            <div style="font-size: 1.5rem; font-weight: bold; letter-spacing: 2px;">STELLAR SEEKERS</div>
            <div id="player-stats">
                <div class="stat-box">
                    <div class="stat-label">Player</div>
                    <div class="stat-value" id="p-name">Explorer</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Crystals</div>
                    <div class="stat-value" id="p-crystals">0 / 3</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Fuel</div>
                    <div class="stat-value" id="p-fuel">10</div>
                </div>
            </div>
        </div>

        <div id="message-area" class="ui-panel">
            Welcome, Explorer! Roll the dice to begin your journey through the galaxy. Collect 3 Unique Crystals to win!
        </div>

        <div id="controls" class="ui-panel">
            <button id="dice-btn" onclick="game.rollDice()">Roll Dice</button>
        </div>

        <!-- Modal -->
        <div id="modal-overlay">
            <div id="modal-content">
                <h2 id="modal-title">Event</h2>
                <p id="modal-body" class="modal-text">Something happened!</p>
                <div id="modal-actions"></div>
                <button class="choice-btn" onclick="game.closeModal()" style="margin-top:15px; width:100%;">Continue</button>
            </div>
        </div>
    </div>

    <script>
        // --- Game Configuration & Data ---
        const CONFIG = {
            width: 1000,
            height: 700,
            centerX: 500,
            centerY: 350,
            spiralRadius: 280,
            spiralRotations: 2.5,
            colors: {
                path: '#2a2a40',
                pathActive: '#00d2ff',
                planet: '#ff00cc',
                event: '#ffaa00',
                start: '#00ffaa',
                end: '#ffffff'
            }
        };

        // Educational Content: Astronomy Facts & Math Challenges
        const PLANET_DATA = [
            { name: "Mercury", fact: "Mercury is the smallest planet in our solar system.", type: "crystal" },
            { name: "Venus", fact: "Venus spins in the opposite direction to most other planets.", type: "crystal" },
            { name: "Mars", fact: "Mars is known as the Red Planet due to iron oxide.", type: "crystal" },
            { name: "Jupiter", fact: "Jupiter is the largest planet and has a Great Red Spot.", type: "crystal" },
            { name: "Saturn", fact: "Saturn has the most extensive ring system.", type: "crystal" },
            { name: "Uranus", fact: "Uranus rotates on its side.", type: "crystal" },
            { name: "Neptune", fact: "Neptune has the strongest winds in the solar system.", type: "crystal" }
        ];

        const EVENT_CARDS = [
            { text: "Solar Flare! Lose 2 Fuel.", action: (p) => p.fuel = Math.max(0, p.fuel - 2) },
            { text: "Asteroid Field! Navigate carefully. Lose 1 turn.", action: (p) => p.skipTurn = true },
            { text: "Comet Tail! Gain extra speed. Roll again.", action: (p) => p.extraRoll = true },
            { text: "Alien Trade! Gain 3 Fuel.", action: (p) => p.fuel += 3 },
            { text: "Black Hole Gravity! Move back 2 spaces.", action: (p) => p.move(-2) },
            { text: "Wormhole! Jump forward 3 spaces.", action: (p) => p.move(3) },
            { text: "Math Challenge: What is 5 + 7?", type: "math", answer: 12, reward: "Gain 1 Crystal" },
            { text: "Math Challenge: What is 10 - 4?", type: "math", answer: 6, reward: "Gain 1 Crystal" },
            { text: "Math Challenge: What is 3 x 3?", type: "math", answer: 9, reward: "Gain 1 Crystal" }
        ];

        // --- Game Engine ---
        class Game {
            constructor() {
                this.draw = SVG().addTo('#game-container').size(CONFIG.width, CONFIG.height);
                this.tiles = [];
                this.players = [{
                    id: 1,
                    name: "Explorer",
                    pos: 0,
                    fuel: 10,
                    crystals: [],
                    color: '#00d2ff',
                    skipTurn: false,
                    extraRoll: false,
                    token: null
                }];
                this.currentPlayerIndex = 0;
                this.isAnimating = false;
                this.gameOver = false;

                this.initBoard();
                this.updateUI();
            }

            // Generate Spiral Path Coordinates
            generatePathPoints() {
                const points = [];
                const totalTiles = 30; // 30 steps to finish
                for (let i = 0; i < totalTiles; i++) {
                    const t = i / totalTiles; // 0 to 1
                    const angle = t * Math.PI * 2 * CONFIG.spiralRotations;
                    const radius = 50 + (t * CONFIG.spiralRadius); // Start near center, go out
                    
                    // Add some wobble for organic feel
                    const wobble = Math.sin(angle * 5) * 10; 

                    const x = CONFIG.centerX + Math.cos(angle) * (radius + wobble);
                    const y = CONFIG.centerY + Math.sin(angle) * (radius + wobble);
                    points.push({ x, y, index: i });
                }
                return points;
            }

            initBoard() {
                const points = this.generatePathPoints();
                
                // Draw Connection Line
                const linePoints = points.map(p => `${p.x},${p.y}`).join(' ');
                this.draw.polyline(linePoints)
                    .fill('none')
                    .stroke({ width: 15, color: CONFIG.colors.path, linecap: 'round', linejoin: 'round' })
                    .back();

                // Create Tiles
                points.forEach((p, i) => {
                    let type = 'normal';
                    let color = '#444';
                    let label = i + 1;

                    // Assign special tiles
                    if (i === 0) { type = 'start'; color = CONFIG.colors.start; label = "START"; }
                    else if (i === points.length - 1) { type = 'end'; color = CONFIG.colors.end; label = "GOAL"; }
                    else if (i % 5 === 0) { type = 'planet'; color = CONFIG.colors.planet; label = "PLANET"; }
                    else if (i % 7 === 0) { type = 'event'; color = CONFIG.colors.event; label = "EVENT"; }

                    // Draw Tile Circle
                    const circle = this.draw.circle(25).fill(color).stroke({width: 3, color: '#fff'}).move(p.x - 12.5, p.y - 12.5);
                    
                    // Draw Label
                    this.draw.text(label).addClass('tile-label').move(p.x, p.y - 20);

                    this.tiles.push({ x: p.x, y: p.y, type, data: null });
                });

                // Create Player Token
                const p = this.players[0];
                p.token = this.draw.group().addClass('player-token');
                p.token.circle(20).fill(p.color).stroke({width: 3, color: '#fff'});
                p.token.text("🚀").font({ size: 16, anchor: 'middle' }).move(0, -8); // Emoji as icon
                p.token.move(this.tiles[0].x - 10, this.tiles[0].y - 10);
            }

            rollDice() {
                if (this.isAnimating || this.gameOver) return;
                
                const player = this.players[this.currentPlayerIndex];

                if (player.skipTurn) {
                    this.showMessage(`${player.name} is stuck in an Asteroid Field! Turn skipped.`);
                    player.skipTurn = false;
                    this.endTurn();
                    return;
                }

                if (player.fuel <= 0) {
                    this.showMessage("Out of Fuel! Game Over.");
                    this.gameOver = true;
                    document.getElementById('dice-btn').disabled = true;
                    return;
                }

                // Simple Dice Animation Logic
                const btn = document.getElementById('dice-btn');
                btn.disabled = true;
                btn.innerText = "Rolling...";

                setTimeout(() => {
                    const roll = Math.floor(Math.random() * 6) + 1;
                    this.showMessage(`${player.name} rolled a ${roll}!`);
                    this.movePlayer(roll);
                    btn.innerText = "Roll Dice";
                }, 500);
            }

            movePlayer(steps) {
                this.isAnimating = true;
                const player = this.players[this.currentPlayerIndex];
                let currentStep = 0;

                const stepInterval = setInterval(() => {
                    if (currentStep >= steps) {
                        clearInterval(stepInterval);
                        this.isAnimating = false;
                        this.handleTileArrival();
                        return;
                    }

                    let nextPos = player.pos + 1;
                    if (nextPos >= this.tiles.length) nextPos = this.tiles.length - 1; // Cap at end

                    // Animate SVG
                    const target = this.tiles[nextPos];
                    player.token.animate(200).move(target.x - 10, target.y - 10);

                    player.pos = nextPos;
                    currentStep++;
                }, 300);
            }

            handleTileArrival() {
                const player = this.players[this.currentPlayerIndex];
                const tile = this.tiles[player.pos];

                // Fuel Cost per move (1 fuel per step roughly, simplified here to flat cost per turn)
                player.fuel -= 1; 
                this.updateUI();

                if (tile.type === 'planet') {
                    this.triggerPlanetEvent(tile);
                } else if (tile.type === 'event') {
                    this.triggerRandomEvent();
                } else if (tile.type === 'end') {
                    this.gameWin();
                } else {
                    // Normal tile, just end turn unless extra roll
                    if (!player.extraRoll) this.endTurn();
                    else {
                        player.extraRoll = false;
                        this.isAnimating = false; // Allow rolling again
                        document.getElementById('dice-btn').disabled = false;
                        this.showMessage("Wormhole Energy! Roll again!");
                    }
                }
            }

            triggerPlanetEvent(tile) {
                // Pick a random planet fact
                const planet = PLANET_DATA[Math.floor(Math.random() * PLANET_DATA.length)];
                
                // Check if player already has this crystal (represented by planet name)
                if (player.crystals.includes(planet.name)) {
                    this.showModal("Already Visited", `You've already collected the ${planet.name} crystal. You gain 2 Fuel instead.`, () => {
                        player.fuel += 2;
                        this.updateUI();
                        this.endTurn();
                    });
                } else {
                    this.showModal(planet.name, `${planet.fact}<br><br>Collect Crystal?`, [
                        { text: "Collect (+1 Crystal)", action: () => {
                            player.crystals.push(planet.name);
                            this.updateUI();
                            if(player.crystals.length >= 3) this.gameWin();
                            else this.endTurn();
                        }}
                    ]);
                }
            }

            triggerRandomEvent() {
                const event = EVENT_CARDS[Math.floor(Math.random() * EVENT_CARDS.length)];
                
                if (event.type === 'math') {
                    this.showModal("Math Challenge", event.text, [
                        { text: event.answer, action: () => {
                            this.showMessage("Correct! " + event.reward);
                            this.players[0].crystals.push("Math Star"); // Dummy crystal for math win
                            this.updateUI();
                            if(this.players[0].crystals.length >= 3) this.gameWin();
                            else this.endTurn();
                        }},
                        { text: "Pass", action: () => {
                            this.showMessage("Incorrect. No reward.");
                            this.endTurn();
                        }}
                    ]);
                } else {
                    this.showModal("Space Event", event.text, [
                        { text: "Resolve", action: () => {
                            event.action(this.players[0]);
                            this.updateUI();
                            this.endTurn();
                        }}
                    ]);
                }
            }

            endTurn() {
                if (this.gameOver) return;
                // In a multiplayer game, we would switch index here.
                // For this single-player demo, we just reset animation lock.
                this.isAnimating = false;
                if(!this.gameOver) document.getElementById('dice-btn').disabled = false;
            }

            gameWin() {
                this.gameOver = true;
                this.showModal("MISSION COMPLETE!", "You have collected enough crystals to power the galaxy! You Win!", [
                    { text: "Play Again", action: () => location.reload() }
                ]);
                document.getElementById('dice-btn').disabled = true;
            }

            // --- UI & Modal Helpers ---
            showMessage(msg) {
                document.getElementById('message-area').innerText = msg;
            }

            updateUI() {
                const p = this.players[0];
                document.getElementById('p-crystals').innerText = `${p.crystals.length} / 3`;
                document.getElementById('p-fuel').innerText = p.fuel;
                
                // Visual warning for low fuel
                const fuelEl = document.getElementById('p-fuel');
                if (p.fuel <= 3) fuelEl.style.color = '#ff0055';
                else fuelEl.style.color = '#00d2ff';
            }

            showModal(title, body, actions = []) {
                const modal = document.getElementById('modal-overlay');
                document.getElementById('modal-title').innerText = title;
                document.getElementById('modal-body').innerHTML = body;
                
                const actionContainer = document.getElementById('modal-actions');
                actionContainer.innerHTML = '';

                actions.forEach(act => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = act.text;
                    btn.onclick = () => {
                        act.action();
                        modal.style.display = 'none';
                    };
                    actionContainer.appendChild(btn);
                });

                // Hide default close button if actions exist
                const closeBtn = modal.querySelector('button[onclick="game.closeModal()"]');
                if(actions.length > 0) closeBtn.style.display = 'none';
                else closeBtn.style.display = 'inline-block';

                modal.style.display = 'flex';
            }

            closeModal() {
                document.getElementById('modal-overlay').style.display = 'none';
                this.endTurn();
            }
        }

        // Start Game
        const game = new Game();

    </script>
</body>
</html>
