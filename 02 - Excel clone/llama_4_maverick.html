<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Clone</title>
    <style>
        /* Global Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }
        
        /* Toolbar Styles */
        .toolbar {
            background-color: #f0f0f0;
            padding: 5px;
            border-bottom: 1px solid #ccc;
        }
        
        .toolbar button {
            margin-right: 10px;
        }
        
        /* Formula Bar Styles */
        .formula-bar {
            padding: 5px;
            border-bottom: 1px solid #ccc;
        }
        
        .formula-bar input {
            width: 100%;
            padding: 5px;
            font-size: 14px;
        }
        
        /* Spreadsheet Styles */
        .spreadsheet {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 100px);
        }
        
        .sheet-tabs {
            background-color: #f0f0f0;
            padding: 5px;
            border-bottom: 1px solid #ccc;
        }
        
        .sheet-tabs button {
            margin-right: 10px;
        }
        
        .grid-container {
            overflow: auto;
            flex: 1;
        }
        
        .grid {
            border-collapse: collapse;
        }
        
        .grid th, .grid td {
            border: 1px solid #ccc;
            padding: 5px;
            min-width: 100px;
        }
        
        .grid th {
            background-color: #f0f0f0;
            position: sticky;
            top: 0;
        }
        
        .grid td {
            white-space: nowrap;
        }
        
        .grid td.selected {
            background-color: #add8e6;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="bold-btn">Bold</button>
        <button id="italic-btn">Italic</button>
        <input type="color" id="background-color" value="#ffffff">
        <button id="clear-contents-btn">Clear Contents</button>
        <button id="download-csv-btn">Download as CSV</button>
        <input type="file" id="upload-csv" style="display: none;">
        <button id="upload-csv-btn">Upload CSV</button>
    </div>
    <div class="formula-bar">
        <input type="text" id="formula-input" spellcheck="false">
    </div>
    <div class="spreadsheet">
        <div class="sheet-tabs">
            <button id="add-sheet-btn">+</button>
        </div>
        <div class="grid-container">
            <table class="grid" id="grid">
                <!-- Grid content will be generated dynamically -->
            </table>
        </div>
    </div>

    <script>
        // Initialize spreadsheet data and UI
        let currentSheet = 0;
        let sheets = [{ data: [], columnWidths: [] }];
        let selectedCell = null;
        let editingCell = null;
        let formulaInput = document.getElementById('formula-input');
        let grid = document.getElementById('grid');
        let sheetTabs = document.querySelector('.sheet-tabs');

        // Generate initial grid content
        generateGrid();

        // Event listeners
        grid.addEventListener('click', handleGridClick);
        grid.addEventListener('dblclick', handleGridDblClick);
        document.addEventListener('keydown', handleKeyDown);
        formulaInput.addEventListener('input', handleFormulaInput);
        document.getElementById('bold-btn').addEventListener('click', handleBoldClick);
        document.getElementById('italic-btn').addEventListener('click', handleItalicClick);
        document.getElementById('background-color').addEventListener('input', handleBackgroundColorChange);
        document.getElementById('clear-contents-btn').addEventListener('click', handleClearContentsClick);
        document.getElementById('download-csv-btn').addEventListener('click', handleDownloadCsvClick);
        document.getElementById('upload-csv-btn').addEventListener('click', handleUploadCsvClick);
        document.getElementById('add-sheet-btn').addEventListener('click', handleAddSheetClick);
        sheetTabs.addEventListener('click', handleSheetTabClick);

        // Generate grid content based on current sheet data
        function generateGrid() {
            let gridHtml = '<tr><th></th>';
            for (let i = 0; i < 26; i++) {
                gridHtml += `<th>${String.fromCharCode(65 + i)}</th>`;
            }
            gridHtml += '</tr>';
            for (let i = 0; i < 100; i++) {
                gridHtml += `<tr><th>${i + 1}</th>`;
                for (let j = 0; j < 26; j++) {
                    gridHtml += `<td data-row="${i}" data-col="${j}"></td>`;
                }
                gridHtml += '</tr>';
            }
            grid.innerHTML = gridHtml;

            // Initialize cell data and render cell contents
            let sheetData = sheets[currentSheet].data;
            let cells = grid.querySelectorAll('td');
            cells.forEach((cell) => {
                let row = parseInt(cell.dataset.row);
                let col = parseInt(cell.dataset.col);
                if (!sheetData[row]) sheetData[row] = {};
                if (!sheetData[row][col]) sheetData[row][col] = { value: '', formula: '' };
                cell.textContent = sheetData[row][col].value;
            });

            // Update sheet tabs
            updateSheetTabs();
        }

        // Update sheet tabs based on current sheets data
        function updateSheetTabs() {
            let sheetTabHtml = '';
            for (let i = 0; i < sheets.length; i++) {
                sheetTabHtml += `<button data-sheet-index="${i}">Sheet ${i + 1}</button>`;
            }
            sheetTabHtml += '<button id="add-sheet-btn">+</button>';
            sheetTabs.innerHTML = sheetTabHtml;
            document.querySelector(`button[data-sheet-index="${currentSheet}"]`).style.background = 'lightblue';
        }

        // Handle grid click event
        function handleGridClick(e) {
            if (e.target.tagName === 'TD') {
                let row = parseInt(e.target.dataset.row);
                let col = parseInt(e.target.dataset.col);
                selectCell(row, col);
            }
        }

        // Handle grid double click event
        function handleGridDblClick(e) {
            if (e.target.tagName === 'TD') {
                let row = parseInt(e.target.dataset.row);
                let col = parseInt(e.target.dataset.col);
                editCell(row, col);
            }
        }

        // Handle key down event
        function handleKeyDown(e) {
            if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                if (selectedCell) {
                    let row = selectedCell.row;
                    let col = selectedCell.col;
                    if (e.key === 'ArrowUp') row--;
                    if (e.key === 'ArrowDown') row++;
                    if (e.key === 'ArrowLeft') col--;
                    if (e.key === 'ArrowRight') col++;
                    selectCell(row, col);
                }
            } else if (e.key === 'Enter') {
                if (selectedCell) {
                    let row = selectedCell.row + 1;
                    let col = selectedCell.col;
                    selectCell(row, col);
                }
            } else if (e.key === 'Tab') {
                if (selectedCell) {
                    let row = selectedCell.row;
                    let col = selectedCell.col + 1;
                    selectCell(row, col);
                }
            }
        }

        // Handle formula input event
        function handleFormulaInput(e) {
            if (editingCell) {
                let row = editingCell.row;
                let col = editingCell.col;
                let sheetData = sheets[currentSheet].data;
                sheetData[row][col].formula = formulaInput.value;
                updateCellValue(row, col);
            }
        }

        // Select a cell
        function selectCell(row, col) {
            if (row < 0 || row >= 100 || col < 0 || col >= 26) return;
            let cells = grid.querySelectorAll('td');
            cells.forEach((cell) => cell.classList.remove('selected'));
            let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('selected');
            selectedCell = { row, col };
            let sheetData = sheets[currentSheet].data;
            formulaInput.value = sheetData[row] && sheetData[row][col] ? sheetData[row][col].formula : '';
        }

        // Edit a cell
        function editCell(row, col) {
            editingCell = { row, col };
            let sheetData = sheets[currentSheet].data;
            formulaInput.value = sheetData[row] && sheetData[row][col] ? sheetData[row][col].formula : '';
            formulaInput.focus();
        }

        // Update cell value based on formula
        function updateCellValue(row, col) {
            let sheetData = sheets[currentSheet].data;
            let cellData = sheetData[row][col];
            if (cellData.formula.startsWith('=')) {
                try {
                    let formula = cellData.formula.substring(1);
                    cellData.value = evaluateFormula(formula);
                } catch (e) {
                    cellData.value = 'Error';
                }
            } else {
                cellData.value = cellData.formula;
            }
            let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
            cell.textContent = cellData.value;
        }

        // Evaluate a formula
        function evaluateFormula(formula) {
            // Simple formula evaluation, supports basic arithmetic and cell references
            // This is a very basic implementation and doesn't handle complex formulas or errors well
            formula = formula.replace(/([A-Z])(\d+)/g, (match, col, row) => {
                let colIndex = col.charCodeAt(0) - 65;
                let rowIndex = parseInt(row) - 1;
                let sheetData = sheets[currentSheet].data;
                return sheetData[rowIndex] && sheetData[rowIndex][colIndex] ? sheetData[rowIndex][colIndex].value : '0';
            });
            return eval(formula);
        }

        // Handle bold button click
        function handleBoldClick() {
            if (selectedCell) {
                let row = selectedCell.row;
                let col = selectedCell.col;
                let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
                cell.style.fontWeight = cell.style.fontWeight === 'bold' ? '' : 'bold';
            }
        }

        // Handle italic button click
        function handleItalicClick() {
            if (selectedCell) {
                let row = selectedCell.row;
                let col = selectedCell.col;
                let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
                cell.style.fontStyle = cell.style.fontStyle === 'italic' ? '' : 'italic';
            }
        }

        // Handle background color change
        function handleBackgroundColorChange(e) {
            if (selectedCell) {
                let row = selectedCell.row;
                let col = selectedCell.col;
                let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
                cell.style.background = e.target.value;
            }
        }

        // Handle clear contents button click
        function handleClearContentsClick() {
            if (selectedCell) {
                let row = selectedCell.row;
                let col = selectedCell.col;
                let sheetData = sheets[currentSheet].data;
                sheetData[row][col] = { value: '', formula: '' };
                let cell = grid.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
                cell.textContent = '';
                cell.style.fontWeight = '';
                cell.style.fontStyle = '';
                cell.style.background = '';
            }
        }

        // Handle download CSV button click
        function handleDownloadCsvClick() {
            let sheetData = sheets[currentSheet].data;
            let csv = '';
            for (let i = 0; i < 100; i++) {
                for (let j = 0; j < 26; j++) {
                    if (sheetData[i] && sheetData[i][j]) {
                        csv += sheetData[i][j].value + ',';
                    } else {
                        csv += ',';
                    }
                }
                csv += '\n';
            }
            let blob = new Blob([csv], { type: 'text/csv' });
            let link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'sheet.csv';
            link.click();
        }

        // Handle upload CSV button click
        function handleUploadCsvClick() {
            let input = document.getElementById('upload-csv');
            input.click();
            input.addEventListener('change', (e) => {
                let file = e.target.files[0];
                let reader = new FileReader();
                reader.onload = (e) => {
                    let csv = e.target.result;
                    let rows = csv.split('\n');
                    let sheetData = [];
                    for (let i = 0; i < rows.length; i++) {
                        let cols = rows[i].split(',');
                        for (let j = 0; j < cols.length; j++) {
                            if (!sheetData[i]) sheetData[i] = {};
                            sheetData[i][j] = { value: cols[j], formula: cols[j] };
                        }
                    }
                    sheets[currentSheet].data = sheetData;
                    generateGrid();
                };
                reader.readAsText(file);
            });
        }

        // Handle add sheet button click
        function handleAddSheetClick() {
            sheets.push({ data: [], columnWidths: [] });
            currentSheet = sheets.length - 1;
            generateGrid();
        }

        // Handle sheet tab click
        function handleSheetTabClick(e) {
            if (e.target.tagName === 'BUTTON' && e.target.dataset.sheetIndex) {
                currentSheet = parseInt(e.target.dataset.sheetIndex);
                generateGrid();
            }
        }
    </script>
</body>
</html>
