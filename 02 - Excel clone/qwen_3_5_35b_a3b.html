<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel Clone</title>
    <style>
        :root {
            --border-color: #d4d4d4;
            --selection-color: #2b7de9;
            --header-bg: #f8f9fa;
            --text-color: #333;
            --toolbar-bg: #ffffff;
            --active-border-color: #2b7de9;
        }

        * { box-sizing: border-box; outline: none; }
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; background: #fff; color: var(--text-color); font-size: 13px; }

        /* Layout */
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Toolbar */
        .toolbar {
            display: flex; align-items: center; gap: 5px; padding: 4px; background: #f3f2f1; border-bottom: 1px solid var(--border-color);
        }
        .tool-group { display: flex; gap: 2px; padding-right: 5px; border-right: 1px solid #ccc; }
        .tool-btn {
            border: 1px solid transparent; background: transparent; cursor: pointer; 
            padding: 4px 8px; border-radius: 3px; font-size: 12px; color: #333;
        }
        .tool-btn:hover { background: #e8dfdd; }
        .tool-btn.active { background: #c7e0f4; border-color: var(--selection-color); }
        .tool-icon { font-weight: bold; font-family: monospace; }

        /* Formula Bar */
        .formula-bar {
            display: flex; align-items: center; padding: 4px; background: #fff; border-bottom: 1px solid var(--border-color); height: 32px;
        }
        .name-box {
            width: 80px; border: 1px solid var(--border-color); padding: 2px 6px; text-align: center;
            background: #f3f2f1; margin-right: 5px;
        }
        .fx-icon { color: #777; margin-right: 5px; font-weight: bold; }
        .input-formula { flex-grow: 1; border: 1px solid transparent; padding: 3px; font-size: 13px; }
        .input-formula:focus { border-color: var(--selection-color); background: #fff; }

        /* Spreadsheet Area */
        .spreadsheet-wrapper { flex-grow: 1; overflow: auto; position: relative; background: #fff; }
        .grid-table { border-collapse: collapse; table-layout: fixed; min-width: 100%; }
        
        th, td { 
            border: 1px solid var(--border-color); padding: 0; margin: 0; 
            height: 20px; white-space: nowrap; overflow: hidden; position: relative; 
        }
        
        .col-header, .row-header {
            background: var(--header-bg); color: #666; font-size: 12px; 
            text-align: center; line-height: 20px; user-select: none; z-index: 10;
        }
        .col-header { font-weight: normal; height: 24px; border-right: 1px solid var(--border-color); position: sticky; left: 0; z-index: 20; min-width: 60px; max-width: 150px; }
        .col-header.fixed { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid var(--border-color); }
        
        /* Cell styling */
        .cell-content {
            padding: 0 4px; width: 100%; height: 100%; 
            line-height: 19px; text-align: right; 
            cursor: cell; user-select: none;
        }
        .cell-editable:focus {
            outline: 2px solid var(--selection-color); position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 50;
            border: none; padding: 0 4px; width: calc(100% - 8px); height: calc(100% - 4px);
            background: white; font-size: 13px;
        }

        /* Sheet Tabs */
        .sheets-area {
            display: flex; background: var(--toolbar-bg); border-top: 1px solid var(--border-color);
        }
        .sheet-tab {
            padding: 5px 15px; cursor: pointer; border-right: 1px solid var(--border-color); background: #e6e6e6; color: #666;
        }
        .sheet-tab.active { background: #fff; color: #000; font-weight: 500; border-top: 2px solid var(--selection-color); }
        .sheet-add { padding: 5px 10px; cursor: pointer; font-weight: bold; }

        /* Selection Overlay */
        .selection-overlay {
            position: absolute; border: 2px solid var(--selection-color); pointer-events: none; display: none; z-index: 100;
        }

        /* Helpers */
        input[type="color"] { padding: 0; border: none; width: 20px; height: 20px; vertical-align: middle; }
        input[type="number"] { padding: 0; border: none; width: 60px; text-align: center; }

    </style>
</head>
<body>

<div class="app-container">
    <!-- Toolbar -->
    <div class="toolbar">
        <button class="tool-btn" onclick="fileOps.downloadCSV()">Download CSV</button>
        <label class="tool-btn" style="cursor:pointer;">
            Upload CSV <input type="file" id="csvUpload" accept=".csv" style="display:none" onchange="fileOps.uploadCSV(this)">
        </label>
        <div class="tool-group">
            <button class="tool-btn" onclick="fmt.setBold()" title="Bold"><span class="tool-icon">B</span></button>
            <button class="tool-btn" onclick="fmt.setItalic()" title="Italic"><span class="tool-icon">I</span></button>
            <button class="tool-btn" onclick="fmt.setUnderline()" title="Underline"><span class="tool-icon">U</span></button>
        </div>
        <div class="tool-group">
            Fill Color
            <input type="color" onchange="fmt.setBgColor(this.value)" title="Background Color">
            Text Color
            <input type="color" value="#000000" onchange="fmt.setTextColor(this.value)" title="Text Color">
        </div>
        <div class="tool-group" style="margin-left:auto;">
            <button class="tool-btn" onclick="actions.clearCells()">Clear Contents</button>
        </div>
    </div>

    <!-- Formula Bar -->
    <div class="formula-bar">
        <div class="name-box" id="nameBox"></div>
        <div class="fx-icon">fx</div>
        <input type="text" class="input-formula" id="formulaInput" placeholder="Enter value or formula...">
    </div>

    <!-- Grid -->
    <div class="spreadsheet-wrapper" id="scrollContainer">
        <table class="grid-table" id="gridTable">
            <!-- Generated by JS -->
        </table>
        <div class="selection-overlay" id="selectionOverlay"></div>
    </div>

    <!-- Sheet Tabs -->
    <div class="sheets-area" id="sheetTabs"></div>
</div>

<script>
/**
 * WebExcel Core Logic
 */

// --- Configuration & State ---
const ROWS = 100;
const COLS = 26; // A-Z
let sheets = [{ name: "Sheet1", data: [], styles: [] }];
let currentSheetIdx = 0;
let selectedCell = { r: 0, c: 0 }; // Row, Col index
let isSelecting = false;
let dragStartCell = null;

// Formula Dependencies Cache: Map<ReferenceString, Set<DependentReferenceStrings>>
let depGraph = {}; 

// --- Utilities ---
function getColLabel(index) { return String.fromCharCode(65 + index); }
function cellId(r, c) { return `${getColLabel(c)}${r + 1}`; }
function parseCellId(str) {
    const match = str.match(/^([A-Z]+)(\d+)$/);
    if (!match) return null;
    const col = match[1].charCodeAt(0) - 65;
    const row = parseInt(match[2]) - 1;
    return { r: row, c: col };
}

// --- Initialization ---
function initGrid() {
    const table = document.getElementById('gridTable');
    let html = '<thead><tr>';
    
    // Top-left corner
    html += `<th class="col-header row-header fixed">&nbsp;</th>`;
    
    // Column Headers
    for(let c=0; c<COLS; c++) {
        html += `<th class="col-header fixed">${getColLabel(c)}</th>`;
    }
    html += '</tr></thead><tbody>';

    // Rows
    for(let r=0; r<ROWS; r++) {
        html += `<tr>`;
        html += `<th class="row-header fixed">${r + 1}</th>`;
        for(let c=0; c<COLS; c++) {
            // Data storage initialized
            if(!sheets[currentSheetIdx].data[r]) sheets[currentSheetIdx].data[r] = [];
            if(sheets[currentSheetIdx].data[r][c] === undefined) {
                sheets[currentSheetIdx].data[r][c] = ""; // Formula string
            }
            if(!sheets[currentSheetIdx].styles[r]) sheets[currentSheetIdx].styles[r] = [];
            if(sheets[currentSheetIdx].styles[r][c] === undefined) sheets[currentSheetIdx].styles[r][c] = {};

            html += `<td id="cell-${r}-${c}" ondblclick="editCell(${r},${c})" tabindex="-1"><div class="cell-content" id="view-${r}-${c}"></div></td>`;
        }
        html += '</tr>';
    }
    table.innerHTML = html;

    // Render Initial View
    renderAll();
    setupScroll();
    selectCell(0, 0);
}

// --- Core Logic: Evaluation ---

// Tokenizer to replace cell references with values inside formulas
function evaluateFormula(formulaStr, myRef) {
    if (!formulaStr.startsWith('=')) return formulaStr;
    const originalFormula = formulaStr;
    formulaStr = formulaStr.substring(1); // remove '='

    // Handle Functions First
    // Matches SUM(range), AVERAGE(range), etc.
    formulaStr = formulaStr.replace(/=(\w+)\((.*)\)/ig, (_, func, args) => executeFunction(func.toUpperCase(), args));

    // Replace remaining Cell References (e.g., A1, B2) with their value strings
    // Regex matches patterns like [A-Z]{1,}\d+
    const refRegex = /([A-Z]+\d+)/g;
    
    try {
        // We create a safe scope. We won't allow global eval, just our scope variables.
        let expr = formulaStr.replace(refRegex, (match) => {
            const p = parseCellId(match);
            if(p && isValidCell(p.r, p.c)) {
                const val = getRawValue(p.r, p.c);
                // If empty, treat as 0 in math? Let's treat as 0.
                return isNaN(Number(val)) ? `"${val}"` : val; 
            }
            return 0;
        });

        // Attempt evaluation
        // Note: In a real app, use a proper parser library like jsep or mathjs. 
        // Here we assume basic arithmetic (+ - * / () %).
        // Using Function constructor to isolate eval slightly better than window.eval, but still requires caution.
        // We sanitize simply by allowing only digits and operators.
        if (/[^0-9+\-*/().\s]/.test(expr)) throw new Error("Invalid characters in formula");
        
        // eslint-disable-next-line no-new-func
        let result = new Function('return ' + expr)();
        return result || "";
    } catch (e) {
        return "#ERR";
    }
}

function executeFunction(name, rangeArg) {
    // Expect format: A1:C3
    const cells = parseRange(rangeArg);
    if(cells.length === 0) return 0;
    
    let sum = 0;
    let count = 0;
    let min = Infinity;
    let max = -Infinity;

    for(let p of cells) {
        let val = parseFloat(getRawValue(p.r, p.c));
        if(isNaN(val)) continue;
        
        if (name === 'SUM') sum += val;
        else if (name === 'AVERAGE') { sum += val; count++; }
        else if (name === 'MIN' && val < min) min = val;
        else if (name === 'MAX' && val > max) max = val;
    }

    if (name === 'AVERAGE') return count > 0 ? sum/count : 0;
    if (name === 'MIN') return min === Infinity ? 0 : min;
    if (name === 'MAX') return max === -Infinity ? 0 : max;
    
    return sum;
}

function parseRange(rangeStr) {
    const parts = rangeStr.split(':');
    if (parts.length !== 2) return [parseCellId(parts[0])] || [];
    
    const start = parseCellId(parts[0]);
    const end = parseCellId(parts[1]);
    const res = [];
    
    for(let r = Math.min(start.r, end.r); r <= Math.max(start.r, end.r); r++) {
        for(let c = Math.min(start.c, end.c); c <= Math.max(start.c, end.c); c++) {
            res.push({r, c});
        }
    }
    return res;
}

function isValidCell(r, c) {
    return r >= 0 && r < ROWS && c >= 0 && c < COLS;
}

function getRawValue(r, c) {
    const sheet = sheets[currentSheetIdx];
    const val = sheet.data[r][c];
    if(typeof val === 'string' && val.startsWith('=')) {
        return evaluateFormula(val);
    }
    return val;
}

function setCellData(r, c, val) {
    sheets[currentSheetIdx].data[r][c] = val;
    triggerRecalculation(cellId(r,c));
}

// Dependency Graph Logic
// When A1 changes, check who has A1 in their formula? 
// For simplicity in this single-file demo, we rebuild the dependency graph on every change. 
// Ideally, parse the formula -> extract refs -> update map.
function triggerRecalculation(changedId) {
    // 1. Update the changed cell view immediately
    const p = parseCellId(changedId);
    renderCellView(p.r, p.c);

    // 2. Scan whole sheet for formulas referencing changedId?
    // Optimization: Re-parse all formulas in the current sheet to find dependents
    let affected = new Set();
    
    for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            const raw = sheets[currentSheetIdx].data[r][c];
            if(typeof raw === 'string' && raw.startsWith('=')) {
                 // Check if current formula contains reference to changedId
                 // We need to normalize case or check strict equality
                 // Regex looks for word boundaries around ref
                 const regex = new RegExp(`\\b${changedId}\\b`, 'g');
                 if(regex.test(raw)) {
                     affected.add(`${r},${c}`);
                 }
            }
        }
    }

    // 3. Recalculate affected cells
    affected.forEach(id => {
        const [pr, pc] = id.split(',').map(Number);
        const rawVal = sheets[currentSheetIdx].data[pr][pc];
        const evaluated = evaluateFormula(rawVal);
        
        // Store Evaluated Value separately or just recompute on demand?
        // App architecture choice: We keep raw ('=A1') in data, re-evaluate on access.
        renderCellView(pr, pc);
        
        // Chain reaction (recursion): If A1 affects B1, and B1 affects C1...
        if(evaluated !== "") {
             triggerRecalculation(cellId(pr, pc));
        }
    });

    updateFormulaBar();
}


// --- Rendering ---

function renderAll() {
    for(let r=0; r<ROWS; r++){
        for(let c=0; c<COLS; c++){
            renderCellView(r, c);
        }
    }
}

function renderCellView(r, c) {
    const view = document.getElementById(`view-${r}-${c}`);
    const td = document.getElementById(`cell-${r}-${c}`);
    
    // Calculate Value
    let val = getRawValue(r, c);
    if(isNaN(val)) val = "";

    // Style
    const st = sheets[currentSheetIdx].styles[r] && sheets[currentSheetIdx].styles[r][c] ? sheets[currentSheetIdx].styles[r][c] : {};
    
    view.innerText = val.toString();
    view.style.backgroundColor = st.bg || '';
    view.style.color = st.color || '';
    
    if(st.bold) td.style.fontWeight = 'bold'; else td.style.fontWeight = 'normal';
    if(st.italic) td.style.fontStyle = 'italic'; else td.style.fontStyle = 'normal';
    if(st.underline) td.style.textDecoration = 'underline'; else td.style.textDecoration = 'none';
}

// --- Interaction ---

function setupScroll() {
    const scrollDiv = document.getElementById('scrollContainer');
    scrollDiv.addEventListener('scroll', (e) => {
        // Sync sticky headers (simple offset logic)
        // In production, transform: translate(x,y) is smoother
        const table = document.getElementById('gridTable');
        // This logic handles sticky positioning visually
        // Sticky handles most of it natively now.
    });
}

function selectCell(r, c, extend = false) {
    if(!isValidCell(r,c)) return;

    // Clear previous selection visuals
    document.querySelectorAll('.selected-cell').forEach(el => el.classList.remove('selected-cell'));

    selectedCell = { r, c };
    
    // Highlight UI
    const cell = document.getElementById(`cell-${r}-${c}`);
    if(cell) cell.classList.add('selected-cell');
    
    // Formula Bar Update
    updateFormulaBar();
}

function updateFormulaBar() {
    document.getElementById('nameBox').innerText = cellId(selectedCell.r, selectedCell.c);
    const rawVal = sheets[currentSheetIdx].data[selectedCell.r][selectedCell.c];
    const input = document.getElementById('formulaInput');
    input.value = rawVal !== undefined ? rawVal : "";
}

function editCell(r, c) {
    const cell = document.getElementById(`cell-${r}-${c}`);
    const valInput = document.createElement('input');
    valInput.type = 'text';
    valInput.className = 'cell-editable';
    
    // Initialize input with current formula/value
    valInput.value = sheets[currentSheetIdx].data[r][c] !== undefined ? sheets[currentSheetIdx].data[r][c] : "";
    
    cell.innerHTML = '';
    cell.appendChild(valInput);
    valInput.focus();

    let isDone = false;

    const finishEditing = () => {
        if(isDone) return;
        isDone = true;
        const newVal = valInput.value.trim();
        
        // If input is purely numeric or boolean, strip formula sign? No, Excel allows "=1+1" to equal 2.
        // If typed "=" it stays formula. If typed number, it becomes static value.
        
        setCellData(r, c, newVal);
        renderAll(); // Refresh view completely
        selectCell(r, c);
    };

    valInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') {
            e.preventDefault();
            finishEditing();
        } else if (e.key === 'Tab') {
            e.preventDefault();
            finishEditing();
            // Move focus next
            let nr = r, nc = c;
            if (e.shiftKey) {
                nc--; if(nc<0){nc=COLS-1; nr--;}
            } else {
                nc++;
                if(nc>=COLS){nc=0; nr++;}
            }
            selectCell(nr, nc);
            setTimeout(() => editCell(nr, nc), 10);
        }
    });

    // Focus out listener
    valInput.addEventListener('blur', finishEditing);
}

// --- Drag Select Logic ---
document.addEventListener('mousedown', (e) => {
    if(e.target.closest('.cell-content')) {
        isSelecting = true;
        dragStartCell = {
            r: parseInt(e.target.closest('td').id.split('-')[1]),
            c: parseInt(e.target.closest('td').id.split('-')[2])
        };
        e.preventDefault(); // Prevent text selection highlighting
    }
});

document.addEventListener('mouseup', (e) => {
    if(isSelecting) {
        const targetTd = e.target.closest('td');
        if(targetTd) {
            const trIdx = targetTd.parentElement.rowIndex - 1; // -1 for header
            const tdIdx = targetTd.cellIndex - 1; // -1 for row num header
            applySelection(dragStartCell.r, dragStartCell.c, trIdx, tdIdx);
        }
        isSelecting = false;
    }
});

function applySelection(r1, c1, r2, c2) {
    // Draw visual selection rect
    const overlay = document.getElementById('selectionOverlay');
    const startX = 65 + c1 * (100/COLS) + 5; // Approx pixel math for grid
    const startY = 24 + r1 * 20 + 5; // Approx
    
    // Actually, let's use absolute positioning relative to the table wrapper
    // Get element coordinates
    const cell1 = document.getElementById(`cell-${r1}-${c1}`);
    const cell2 = document.getElementById(`cell-${r2}-${c2}`);
    
    const rect1 = cell1.getBoundingClientRect();
    const wrapperRect = document.getElementById('scrollContainer').getBoundingClientRect();
    const rect2 = cell2.getBoundingClientRect();

    const left = cell1.offsetLeft;
    const top = cell1.offsetTop;
    const width = cell2.offsetLeft - left + cell2.offsetWidth;
    const height = cell2.offsetTop - top + cell2.offsetHeight;

    overlay.style.left = left + 'px';
    overlay.style.top = top + 'px';
    overlay.style.width = width + 'px';
    overlay.style.height = height + 'px';
    overlay.style.display = 'block';

    // Update Logic Selection
    const startR = Math.min(r1, r2), endR = Math.max(r1, r2);
    const startC = Math.min(c1, c2), endC = Math.max(c1, c2);
    document.getElementById('nameBox').innerText = `${getColLabel(startC)}${startR+1}:${getColLabel(endC)}${endR+1}`;
}

// --- Formula Bar Interaction ---

document.getElementById('formulaInput').addEventListener('focus', () => {
    // Highlight cell under mouse if dragging? Not implemented here for brevity.
});

document.getElementById('formulaInput').addEventListener('change', (e) => {
    const val = e.target.value;
    setCellData(selectedCell.r, selectedCell.c, val);
    renderCellView(selectedCell.r, selectedCell.c);
});

// Click in formula bar inserts cell reference
document.getElementById('formulaInput').addEventListener('click', (e) => {
    e.stopPropagation(); // stop cell click events bubbling
});

// --- Formatting Actions ---
const fmt = {
    currentProp: null,
    setProp: function(key, val) {
        if (key == null) return;
        const sheet = sheets[currentSheetIdx];
        sheet.styles[selectedCell.r][selectedCell.c] = sheet.styles[selectedCell.r][selectedCell.c] || {};
        sheet.styles[selectedCell.r][selectedCell.c][key] = val;
        renderCellView(selectedCell.r, selectedCell.c);
    },
    setBold: () => { fmt.setProp('bold', !fmt.get('bold')); },
    setItalic: () => { fmt.setProp('italic', !fmt.get('italic')); },
    setUnderline: () => { fmt.setProp('underline', !fmt.get('underline')); },
    setBgColor: (val) => { fmt.setProp('bg', val); },
    setTextColor: (val) => { fmt.setProp('color', val); },
    get: function(prop) {
         const s = sheets[currentSheetIdx].styles[selectedCell.r][selectedCell.c];
         return s ? s[prop] : false;
    }
};

const actions = {
    clearCells: () => {
        const sheet = sheets[currentSheetIdx];
        sheet.data[selectedCell.r][selectedCell.c] = "";
        renderCellView(selectedCell.r, selectedCell.c);
        triggerRecalculation(cellId(selectedCell.r, selectedCell.c));
    }
};

// --- File Operations ---
const fileOps = {
    downloadCSV: () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        const sheet = sheets[currentSheetIdx];
        for(let r=0; r<ROWS; r++) {
            let rowData = [];
            for(let c=0; c<COLS; c++) {
                rowData.push(JSON.stringify(sheet.data[r][c])); // Escape special chars
            }
            csvContent += rowData.join(",") + "\n";
        }
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "spreadsheet.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    },
    uploadCSV: (input) => {
        const file = input.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const text = e.target.result;
            const rows = text.split('\n');
            // Basic load into sheet data structure
            for(let i=0; i<Math.min(rows.length, ROWS); i++) {
                cols = rows[i].split(',');
                for(let j=0; j<Math.min(cols.length, COLS); j++) {
                    let val = cols[j].replace(/"/g, '').trim();
                    // Remove quote marks
                    sheets[currentSheetIdx].data[i][j] = val;
                }
            }
            renderAll();
            alert("CSV Loaded Successfully!");
        };
        reader.readAsText(file);
        input.value = ""; // reset
    }
};

// --- Sheets Management ---
function renderSheetTabs() {
    const container = document.getElementById('sheetTabs');
    container.innerHTML = '';
    sheets.forEach((s, idx) => {
        const tab = document.createElement('div');
        tab.className = `sheet-tab ${idx === currentSheetIdx ? 'active' : ''}`;
        tab.innerText = s.name;
        tab.onclick = () => switchSheet(idx);
        container.appendChild(tab);
    });
    const addBtn = document.createElement('div');
    addBtn.className = 'sheet-add';
    addBtn.innerText = '+';
    addBtn.title = "Add Sheet";
    addBtn.onclick = addSheet;
    container.appendChild(addBtn);
}

function switchSheet(idx) {
    currentSheetIdx = idx;
    renderSheetTabs();
    renderAll();
    selectCell(0, 0);
}

function addSheet() {
    const newSheet = { name: `Sheet${sheets.length + 1}`, data: Array(ROWS).fill(null).map(() => Array(COLS).fill("")), styles: Array(ROWS).fill(null).map(() => Array(COLS).fill(null)) };
    sheets.push(newSheet);
    renderSheetTabs();
    switchSheet(sheets.length - 1);
}

// --- Startup ---
initGrid();
renderSheetTabs();

</script>
</body>
</html>
