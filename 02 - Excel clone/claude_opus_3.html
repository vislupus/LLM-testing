<!DOCTYPE html>
<html>
<head>
  <title>Spreadsheet App</title>
  <style>
    /* CSS styles for the spreadsheet app */
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .toolbar { background-color: #f1f1f1; padding: 10px; }
    .toolbar button { margin-right: 5px; }
    .formula-bar { display: flex; align-items: center; padding: 5px; }
    .formula-bar input { flex-grow: 1; margin-left: 5px; }
    .sheet-tabs { display: flex; background-color: #f1f1f1; padding: 5px; }
    .sheet-tabs div { padding: 5px 10px; cursor: pointer; }
    .sheet-tabs div.active { background-color: #fff; }
    .sheet-container { flex-grow: 1; overflow: auto; }
    table { border-collapse: collapse; table-layout: fixed; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 5px; text-align: left; min-width: 100px; }
    th { background-color: #f1f1f1; font-weight: bold; }
    td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    td.selected { background-color: #e1e1e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <button id="boldBtn"><b>B</b></button>
      <button id="italicBtn"><i>I</i></button>
      <input type="color" id="bgColorPicker">
      <button id="clearBtn">Clear</button>
      <button id="downloadBtn">Download CSV</button>
      <label for="uploadBtn">Upload CSV</label>
      <input type="file" id="uploadBtn" accept=".csv" style="display: none;">
    </div>
    <div class="formula-bar">
      <span id="cellAddress"></span>
      <input type="text" id="formulaInput">
    </div>
    <div class="sheet-tabs" id="sheetTabs"></div>
    <div class="sheet-container">
      <table id="sheet"></table>
    </div>
  </div>

  <script>
    // JavaScript code for the spreadsheet app
    const sheetTabs = document.getElementById('sheetTabs');
    const sheet = document.getElementById('sheet');
    const formulaInput = document.getElementById('formulaInput');
    const cellAddress = document.getElementById('cellAddress');
    const boldBtn = document.getElementById('boldBtn');
    const italicBtn = document.getElementById('italicBtn');
    const bgColorPicker = document.getElementById('bgColorPicker');
    const clearBtn = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const uploadBtn = document.getElementById('uploadBtn');

    let data = {
      'Sheet 1': {},
    };

    let activeSheet = 'Sheet 1';
    let selectedCell = null;

    function createSheet(sheetName) {
      const sheetData = {};
      const rows = 100;
      const cols = 26;

      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          const cell = String.fromCharCode(65 + j) + (i + 1);
          sheetData[cell] = { value: '', formula: '' };
        }
      }

      data[sheetName] = sheetData;
      renderSheetTabs();
      renderSheet();
    }

    function renderSheetTabs() {
      sheetTabs.innerHTML = '';
      Object.keys(data).forEach((sheetName) => {
        const tab = document.createElement('div');
        tab.textContent = sheetName;
        tab.classList.add(sheetName === activeSheet ? 'active' : '');
        tab.addEventListener('click', () => {
          activeSheet = sheetName;
          renderSheetTabs();
          renderSheet();
        });
        sheetTabs.appendChild(tab);
      });

      const addTab = document.createElement('div');
      addTab.textContent = '+';
      addTab.addEventListener('click', () => {
        const sheetName = prompt('Enter sheet name:');
        if (sheetName) {
          createSheet(sheetName);
        }
      });
      sheetTabs.appendChild(addTab);
    }

    function renderSheet() {
      sheet.innerHTML = '';
      const sheetData = data[activeSheet];
      const rows = Object.keys(sheetData).reduce((max, cell) => Math.max(max, parseInt(cell.slice(1))), 0);
      const cols = Object.keys(sheetData).reduce((max, cell) => Math.max(max, cell.charCodeAt(0) - 64), 0);

      const headerRow = document.createElement('tr');
      headerRow.appendChild(document.createElement('th'));
      for (let i = 0; i < cols; i++) {
        const th = document.createElement('th');
        th.textContent = String.fromCharCode(65 + i);
        headerRow.appendChild(th);
      }
      sheet.appendChild(headerRow);

      for (let i = 1; i <= rows; i++) {
        const row = document.createElement('tr');
        const rowHeader = document.createElement('th');
        rowHeader.textContent = i;
        row.appendChild(rowHeader);

        for (let j = 0; j < cols; j++) {
          const cell = String.fromCharCode(65 + j) + i;
          const td = document.createElement('td');
          td.textContent = sheetData[cell].value;
          td.addEventListener('click', () => {
            selectCell(cell);
          });
          td.addEventListener('dblclick', () => {
            editCell(cell);
          });
          row.appendChild(td);
        }

        sheet.appendChild(row);
      }

      updateCellStyles();
    }

    function selectCell(cell) {
      if (selectedCell) {
        document.querySelector(`[data-cell="${selectedCell}"]`).classList.remove('selected');
      }
      selectedCell = cell;
      document.querySelector(`[data-cell="${selectedCell}"]`).classList.add('selected');
      cellAddress.textContent = selectedCell;
      formulaInput.value = data[activeSheet][selectedCell].formula;
    }

    function editCell(cell) {
      formulaInput.value = data[activeSheet][cell].formula;
      formulaInput.focus();
    }

    function updateCellValue(cell, value) {
      data[activeSheet][cell].value = value;
      document.querySelector(`[data-cell="${cell}"]`).textContent = value;
    }

    function updateCellFormula(cell, formula) {
      data[activeSheet][cell].formula = formula;
    }

    function evaluateFormula(formula) {
      // Implement formula evaluation logic here
      // This is a simplified example, you can extend it to support more complex formulas
      const cellRegex = /[A-Z]\d+/g;
      const cellReferences = formula.match(cellRegex);

      if (cellReferences) {
        cellReferences.forEach((reference) => {
          const value = data[activeSheet][reference].value;
          formula = formula.replace(reference, value);
        });
      }

      try {
        return eval(formula.slice(1));
      } catch (error) {
        return 'Error';
      }
    }

    function updateCellStyles() {
      // Implement cell styling logic here
      // This is a simplified example, you can extend it to support more styles
      const cells = sheet.querySelectorAll('td');
      cells.forEach((cell) => {
        const cellAddress = cell.dataset.cell;
        const cellData = data[activeSheet][cellAddress];
        cell.style.fontWeight = cellData.bold ? 'bold' : 'normal';
        cell.style.fontStyle = cellData.italic ? 'italic' : 'normal';
        cell.style.backgroundColor = cellData.bgColor || '';
      });
    }

    function downloadCSV() {
      const sheetData = data[activeSheet];
      const rows = Object.keys(sheetData).reduce((max, cell) => Math.max(max, parseInt(cell.slice(1))), 0);
      const cols = Object.keys(sheetData).reduce((max, cell) => Math.max(max, cell.charCodeAt(0) - 64), 0);

      let csvContent = '';

      for (let i = 1; i <= rows; i++) {
        let rowData = [];
        for (let j = 0; j < cols; j++) {
          const cell = String.fromCharCode(65 + j) + i;
          rowData.push(sheetData[cell].value);
        }
        csvContent += rowData.join(',') + '\n';
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', `${activeSheet}.csv`);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function uploadCSV(event) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = (e) => {
        const contents = e.target.result;
        const rows = contents.split('\n');
        const sheetData = {};

        rows.forEach((row, i) => {
          const cells = row.split(',');
          cells.forEach((cell, j) => {
            const cellAddress = String.fromCharCode(65 + j) + (i + 1);
            sheetData[cellAddress] = { value: cell, formula: '' };
          });
        });

        data[activeSheet] = sheetData;
        renderSheet();
      };
      reader.readAsText(file);
    }

    formulaInput.addEventListener('input', () => {
      const formula = formulaInput.value;
      updateCellFormula(selectedCell, formula);

      if (formula.startsWith('=')) {
        const value = evaluateFormula(formula);
        updateCellValue(selectedCell, value);
      } else {
        updateCellValue(selectedCell, formula);
      }
    });

    boldBtn.addEventListener('click', () => {
      data[activeSheet][selectedCell].bold = !data[activeSheet][selectedCell].bold;
      updateCellStyles();
    });

    italicBtn.addEventListener('click', () => {
      data[activeSheet][selectedCell].italic = !data[activeSheet][selectedCell].italic;
      updateCellStyles();
    });

    bgColorPicker.addEventListener('input', () => {
      data[activeSheet][selectedCell].bgColor = bgColorPicker.value;
      updateCellStyles();
    });

    clearBtn.addEventListener('click', () => {
      data[activeSheet][selectedCell] = { value: '', formula: '' };
      updateCellValue(selectedCell, '');
      formulaInput.value = '';
      updateCellStyles();
    });

    downloadBtn.addEventListener('click', () => {
      downloadCSV();
    });

    uploadBtn.addEventListener('change', (event) => {
      uploadCSV(event);
    });

    createSheet('Sheet 1');
  </script>
</body>
</html>
