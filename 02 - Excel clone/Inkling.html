<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Excel Clone — Full Spreadsheet</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg-main: #0f1115;
    --bg-toolbar: #16181f;
    --bg-formula: #12141a;
    --bg-grid: #ffffff;
    --text-main: #e9ecf2;
    --text-dim: #9aa0b0;
    --accent: #2b7fff;
    --accent-soft: rgba(43,127,255,0.12);
    --border: #23262f;
    --cell-border: #d8dde8;
    --header-bg: #f4f6fa;
    --header-text: #5a6275;
    --danger: #ff4d4d;
    --success: #2ecc71;
    --font-body: 'Inter', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100vh; width: 100vw;
    overflow: hidden;
    background: var(--bg-main);
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 14px;
  }

  /* Layout */
  .app {
    display: flex; flex-direction: column;
    height: 100vh; width: 100vw;
  }

  /* Header / Brand */
  header {
    height: 56px;
    background: linear-gradient(90deg, #12141a 0%, #16181f 100%);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    flex-shrink: 0;
  }
  header .brand {
    font-family: var(--font-body);
    font-weight: 800; font-size: 1.15rem; letter-spacing: 0.06em;
    color: var(--text-main);
  }
  header .brand span { color: var(--accent); margin-right: 6px; }

  /* Toolbar */
  .toolbar {
    height: 52px;
    background: var(--bg-toolbar);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    padding: 0 20px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .toolbar .group { display: flex; gap: 6px; align-items: center; }
  .toolbar button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toolbar button:hover { background: var(--accent-soft); border-color: rgba(43,127,255,0.25); color: #fff; }
  .toolbar button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar input[type="color"] {
    width: 28px; height: 28px; border: none; border-radius: 4px; cursor: pointer; background: transparent;
  }
  .toolbar label { color: var(--text-dim); font-size: 0.8rem; }

  /* Formula Bar */
  .formula-bar {
    height: 44px;
    background: var(--bg-formula);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    flex-shrink: 0;
  }
  .formula-bar .cell-ref {
    min-width: 60px; width: 60px;
    text-align: center; font-family: var(--font-mono);
    font-size: 0.85rem; color: var(--text-dim);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 4px 0;
    user-select: none;
  }
  .formula-bar input {
    flex: 1;
    height: 32px;
    background: #0a0b10;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 12px;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    color: var(--text-main);
    outline: none;
  }
  .formula-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* Sheet Tabs */
  .tabs {
    height: 36px;
    background: #12141a;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-end; padding: 0 20px; gap: 4px;
    flex-shrink: 0;
  }
  .tab {
    padding: 6px 18px 7px;
    border-radius: 8px 8px 0 0;
    font-size: 0.8rem; font-weight: 600;
    color: var(--text-dim);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text-main); }
  .tab.active {
    color: var(--text-main);
    background: rgba(255,255,255,0.04);
    border-bottom-color: var(--accent);
  }
  .tab.new { color: var(--accent); }

  /* Main Grid Area */
  .grid-wrap {
    flex: 1;
    overflow: auto;
    position: relative;
    background: var(--bg-grid);
  }

  /* Table */
  table.grid {
    border-collapse: separate;
    border-spacing: 0;
    font-family: var(--font-body);
    font-size: 0.82rem;
    table-layout: fixed;
  }

  /* Header row (columns) */
  table.grid thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--header-bg);
    color: var(--header-text);
    font-weight: 700; font-size: 0.75rem; letter-spacing: 0.04em;
    text-align: center;
    height: 26px;
    border-right: 1px solid var(--cell-border);
    border-bottom: 1px solid #c5cad6;
    user-select: none;
    position: relative;
  }
  table.grid thead th:first-child { width: 48px; min-width: 48px; }

  /* Corner header */
  .corner { width: 48px; min-width: 48px; }

  /* Row headers */
  table.grid tbody td:first-child,
  table.grid tbody th:first-child { display: none; } /* We will use first column for row numbers */
  /* Actually let's make row numbers in first column using th inside tbody? Let's keep it simple: every row starts with a th for row number */
  table.grid tbody th.row-num {
    position: sticky; left: 0; z-index: 2;
    background: var(--header-bg);
    color: var(--header-text);
    font-weight: 700; font-size: 0.75rem;
    text-align: center;
    width: 48px; min-width: 48px;
    border-right: 1px solid #c5cad6;
    border-bottom: 1px solid var(--cell-border);
    user-select: none;
    height: 24px;
  }

  /* Data cells */
  table.grid tbody td {
    width: 100px; min-width: 60px; height: 24px;
    border-right: 1px solid var(--cell-border);
    border-bottom: 1px solid var(--cell-border);
    padding: 2px 6px;
    color: #1a1c23;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    cursor: cell;
    user-select: none;
    transition: background 0.08s;
    vertical-align: middle;
  }

  table.grid tbody td.active {
    outline: 2px solid var(--accent);
    outline-offset: -2px;
    background: #e8f0fe;
    z-index: 1;
    position: relative;
  }

  table.grid tbody td.selected {
    background: rgba(43,127,255,0.08);
  }

  table.grid tbody td:hover:not(.active) {
    background: rgba(43,127,255,0.04);
  }

  /* Resize handle */
  .resize-handle {
    position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
    cursor: col-resize; z-index: 4;
  }

  /* Inline edit input overlay (optional) */
  .cell-edit {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    border: none; outline: 2px solid var(--accent); z-index: 10;
    padding: 2px 6px; font-family: var(--font-body); font-size: 0.82rem;
    background: #fff; color: #1a1c23;
  }

  /* Status bar */
  .status-bar {
    height: 28px;
    background: #12141a;
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    color: var(--text-dim); font-size: 0.75rem;
  }

  /* Responsive tweaks */
  @media (max-width: 640px) {
    .toolbar { gap: 6px; padding: 0 10px; height: auto; min-height: 52px; flex-wrap: wrap; }
    header .brand { font-size: 0.95rem; }
    .formula-bar { padding: 0 10px; height: auto; min-height: 44px; }
    .tabs { padding: 0 10px; }
    .grid-wrap { font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span>●</span> Excel Clone</div>
    <div style="font-size: 0.75rem; color: var(--text-dim);">Full Spreadsheet • No Backend</div>
  </header>

  <div class="toolbar">
    <div class="group">
      <button onclick="formatBold()" title="Bold">B</button>
      <button onclick="formatItalic()" title="Italic">I</button>
      <button onclick="formatBg()" title="Background">Bg</button>
      <input type="color" id="bgPicker" value="#ffffff" oninput="formatBg()" style="width:28px; height:28px; border:none; background:transparent; cursor:pointer;">
    </div>
    <div class="group">
      <button onclick="clearSelection()" title="Clear">Clear</button>
      <button onclick="addSheet()" title="New Sheet">+ Sheet</button>
      <button onclick="downloadCSV()" title="Download CSV">CSV ↓</button>
      <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="uploadCSV(this)">
      <button onclick="document.getElementById('csvInput').click()" title="Upload CSV">CSV ↑</button>
    </div>
  </div>

  <div class="formula-bar">
    <div class="cell-ref" id="cellRefDisplay">A1</div>
    <input id="formulaInput" type="text" placeholder="Enter value or formula..." autocomplete="off" spellcheck="false" />
  </div>

  <div class="tabs" id="sheetTabs"></div>

  <div class="grid-wrap" id="gridWrap">
    <table class="grid" id="gridTable">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
    </table>
  </div>

  <div class="status-bar">
    <span id="statusText">Ready</span>
    <span>Rows × Cols: 100 × 26</span>
  </div>
</div>

<script>
  // ==========================================================
  // Core Spreadsheet Engine
  // ==========================================================

  const COLS = 26; // A-Z
  const ROWS = 100;
  const COL_WIDTH = 110;

  // State
  const sheets = {};
  let currentSheet = "Sheet1";
  let selectedCell = { r: 0, c: 0 };
  let dragStart = null;
  let dragEnd = null;
  let isDragging = false;
  let resizingCol = null;
  let resizeStartX = 0;
  let resizeStartWidth = COL_WIDTH;

  // Initialize default sheets
  function initSheets() {
    createSheet("Sheet1");
    createSheet("Sheet2");
  }

  function createSheet(name) {
    const grid = [];
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        row.push({
          value: "",
          formula: "",
          style: {
            bold: false,
            italic: false,
            bg: "#ffffff",
            color: "#1a1c23"
          }
        });
      }
      grid.push(row);
    }
    sheets[name] = {
      name,
      grid,
      colWidths: new Array(COLS).fill(COL_WIDTH),
      selectedRange: null
    };
  }

  function addSheet() {
    const names = Object.keys(sheets);
    let idx = names.length + 1;
    let newName = "Sheet" + idx;
    while (sheets[newName]) {
      idx++;
      newName = "Sheet" + idx;
    }
    createSheet(newName);
    switchToSheet(newName);
  }

  function switchToSheet(name) {
    currentSheet = name;
    selectedCell = { r: 0, c: 0 };
    dragStart = null; dragEnd = null; isDragging = false;
    renderTabs();
    renderGrid();
    focusFormula();
    updateStatus("Switched to " + name);
  }

  // Utilities
  function colToLetter(i) {
    let s = "";
    while (i >= 0) {
      s = String.fromCharCode(65 + (i % 26)) + s;
      i = Math.floor(i / 26) - 1;
    }
    return s;
  }

  function letterToCol(s) {
    s = s.toUpperCase();
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      n = n * 26 + (s.charCodeAt(i) - 64);
    }
    return n - 1;
  }

  function cellRef(r, c) {
    return colToLetter(c) + (r + 1);
  }

  // Data Access & Calculation
  function getCellRaw(r, c) {
    const s = sheets[currentSheet];
    if (!s || r < 0 || c < 0 || r >= s.grid.length || c >= s.grid[r].length) return { value: "", formula: "", style: {} };
    return s.grid[r][c];
  }

  function getNumericValue(r, c, evaluating = new Set()) {
    const key = r + "," + c;
    if (evaluating.has(key)) return 0;
    evaluating.add(key);
    const cell = getCellRaw(r, c);
    if (cell.formula && cell.formula.startsWith("=")) {
      const result = evaluateFormula(cell.formula, evaluating);
      evaluating.delete(key);
      return parseFloat(result) || 0;
    }
    const val = parseFloat(cell.value);
    evaluating.delete(key);
    return isNaN(val) ? 0 : val;
  }

  // Simple parser for arithmetic + cell refs + SUM/AVERAGE/MIN/MAX ranges
  function evaluateFormula(formula, evaluating = new Set()) {
    try {
      let expr = formula.slice(1); // remove leading =
      // Replace range functions
      expr = expr.replace(/\b(SUM|AVERAGE|MIN|MAX)\(([^)]+)\)/gi, (match, func, rangeStr) => {
        return computeRangeFunc(func.toUpperCase(), rangeStr.trim(), evaluating);
      });
      // Replace cell references like A1, B2 with numeric values
      expr = expr.replace(/\b([A-Z]{1,3})(\d{1,3})\b/g, (match, colStr, rowStr) => {
        const c = letterToCol(colStr);
        const r = parseInt(rowStr) - 1;
        return getNumericValue(r, c, evaluating);
      });
      // Evaluate arithmetic expression safely
      const result = new Function("return (" + expr + ")")();
      return isNaN(result) ? "#ERROR!" : result;
    } catch (e) {
      return "#ERROR!";
    }
  }

  function computeRangeFunc(func, rangeStr, evaluating) {
    let range = rangeStr;
    // Handle single range like A1:A5 or A1:A5
    let nums = [];
    if (range.includes(":")) {
      const [start, end] = range.split(":");
      const startC = letterToCol(start.replace(/\d+/, ""));
      const startR = parseInt(start.replace(/[A-Z]+/, "")) - 1;
      const endC = letterToCol(end.replace(/\d+/, ""));
      const endR = parseInt(end.replace(/[A-Z]+/, "")) - 1;
      for (let r = startR; r <= endR; r++) {
        for (let c = startC; c <= endC; c++) {
          nums.push(getNumericValue(r, c, evaluating));
        }
      }
    } else {
      // Single cell reference for range functions? Just take that cell
      const c = letterToCol(range.replace(/\d+/, ""));
      const r = parseInt(range.replace(/[A-Z]+/, "")) - 1;
      nums.push(getNumericValue(r, c, evaluating));
    }
    if (nums.length === 0) return 0;
    if (func === "SUM") return nums.reduce((a, b) => a + b, 0);
    if (func === "AVERAGE") return nums.reduce((a, b) => a + b, 0) / nums.length;
    if (func === "MIN") return Math.min(...nums);
    if (func === "MAX") return Math.max(...nums);
    return 0;
  }

  // Rendering
  function renderTabs() {
    const container = document.getElementById("sheetTabs");
    container.innerHTML = "";
    Object.keys(sheets).forEach(name => {
      const btn = document.createElement("button");
      btn.className = "tab" + (name === currentSheet ? " active" : "");
      btn.textContent = name;
      btn.onclick = () => switchToSheet(name);
      container.appendChild(btn);
    });
    const btnNew = document.createElement("button");
    btnNew.className = "tab new";
    btnNew.textContent = "+";
    btnNew.title = "New Sheet";
    btnNew.onclick = addSheet;
    container.appendChild(btnNew);
  }

  function renderGrid() {
    const s = sheets[currentSheet];
    if (!s) return;
    const head = document.getElementById("gridHead");
    const body = document.getElementById("gridBody");

    // Build header row (A-Z)
    let headHTML = "<tr>";
    headHTML += `<th class="corner" style="width:48px;"></th>`;
    for (let c = 0; c < COLS; c++) {
      const width = s.colWidths[c] || COL_WIDTH;
      headHTML += `<th data-c="${c}" style="width:${width}px;" onclick="startResize(${c},event)">${colToLetter(c)}<div class="resize-handle" onmousedown="startResize(${c},event)"></div></th>`;
    }
    headHTML += "</tr>";
    head.innerHTML = headHTML;

    // Build body rows
    let bodyHTML = "";
    for (let r = 0; r < ROWS; r++) {
      bodyHTML += `<tr>`;
      bodyHTML += `<th class="row-num" style="width:48px;">${r + 1}</th>`;
      for (let c = 0; c < COLS; c++) {
        const cell = s.grid[r][c];
        const width = s.colWidths[c] || COL_WIDTH;
        const styleStr = buildCellStyle(cell.style);
        const isActive = (r === selectedCell.r && c === selectedCell.c);
        const isInRange = isInSelection(r, c);
        const displayValue = cell.formula ? (cell.formula.startsWith("=") ? evaluateFormula(cell.formula) : cell.formula) : cell.value;
        const displayStr = (typeof displayValue === "number") ? displayValue : (displayValue || "");
        bodyHTML += `<td data-r="${r}" data-c="${c}" style="width:${width}px; ${styleStr}" 
          onclick="selectCell(${r},${c},event)" 
          ondblclick="startEditInCell(${r},${c})"
          onmousedown="startDrag(${r},${c},event)"
          onmousemove="continueDrag(${r},${c},event)"
          onmouseup="endDrag(event)"
          class="${isActive ? 'active' : ''} ${isInRange ? 'selected' : ''}"
        >${escapeHtml(String(displayStr))}</td>`;
      }
      bodyHTML += `</tr>`;
    }
    body.innerHTML = bodyHTML;

    // Apply sticky column header width adjustments via CSS variables? No, inline is fine.
  }

  function buildCellStyle(st) {
    let s = "";
    if (st.bold) s += "font-weight:bold;";
    if (st.italic) s += "font-style:italic;";
    s += "background-color:" + (st.bg || "#ffffff") + ";";
    s += "color:" + (st.color || "#1a1c23") + ";";
    return s;
  }

  function isInSelection(r, c) {
    if (!dragStart || !dragEnd) return false;
    const minR = Math.min(dragStart.r, dragEnd.r);
    const maxR = Math.max(dragStart.r, dragEnd.r);
    const minC = Math.min(dragStart.c, dragEnd.c);
    const maxC = Math.max(dragStart.c, dragEnd.c);
    return r >= minR && r <= maxR && c >= minC && c <= maxC;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // Interaction
  function selectCell(r, c, event) {
    if (isDragging) return;
    if (event && event.shiftKey) {
      dragEnd = { r, c };
      selectedCell = { r, c };
      renderGrid();
      updateFormula();
      return;
    }
    dragStart = null; dragEnd = null;
    selectedCell = { r, c };
    renderGrid();
    updateFormula();
    updateStatus(`Selected ${cellRef(r, c)}`);
  }

  function startDrag(r, c, event) {
    isDragging = true;
    dragStart = { r, c };
    dragEnd = { r, c };
    event.preventDefault();
  }

  function continueDrag(r, c, event) {
    if (!isDragging) return;
    dragEnd = { r, c };
    // Re-render grid to show selection highlight
    renderGrid();
    event.preventDefault();
  }

  function endDrag(event) {
    if (isDragging) {
      isDragging = false;
      if (dragStart && dragEnd) {
        selectedCell = dragEnd;
        renderGrid();
      }
      dragStart = null; dragEnd = null;
    }
  }

  function startResize(colIndex, event) {
    if (event) event.preventDefault();
    resizingCol = colIndex;
    resizeStartX = event ? event.clientX : 0;
    const s = sheets[currentSheet];
    resizeStartWidth = s.colWidths[colIndex] || COL_WIDTH;
    document.body.style.cursor = "col-resize";
    updateStatus("Resizing column " + colToLetter(colIndex));
  }

  window.addEventListener("mousemove", (e) => {
    if (resizingCol !== null) {
      const diff = e.clientX - resizeStartX;
      const s = sheets[currentSheet];
      s.colWidths[resizingCol] = Math.max(40, resizeStartWidth + diff);
      renderGrid();
    }
  });

  window.addEventListener("mouseup", () => {
    if (resizingCol !== null) {
      resizingCol = null;
      document.body.style.cursor = "";
    }
    endDrag();
  });

  // Editing / Formula Bar
  function focusFormula() {
    document.getElementById("formulaInput").focus();
  }

  function updateFormula() {
    const input = document.getElementById("formulaInput");
    const s = sheets[currentSheet];
    const cell = s.grid[selectedCell.r][selectedCell.c];
    // If formula editing mode is active and user clicks a cell, insert ref
    // We handle click-to-insert via selectCell override when input focused
  }

  document.getElementById("formulaInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      confirmEdit();
      return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      cancelEdit();
      return;
    }
  });

  function confirmEdit() {
    const input = document.getElementById("formulaInput");
    const val = input.value.trim();
    const s = sheets[currentSheet];
    const cell = s.grid[selectedCell.r][selectedCell.c];
    if (val.startsWith("=")) {
      cell.formula = val;
      cell.value = ""; // value is computed
    } else {
      cell.formula = "";
      cell.value = val;
    }
    input.blur();
    renderGrid();
    updateStatus("Updated " + cellRef(selectedCell.r, selectedCell.c));
  }

  function cancelEdit() {
    const input = document.getElementById("formulaInput");
    const s = sheets[currentSheet];
    const cell = s.grid[selectedCell.r][selectedCell.c];
    input.value = cell.formula || cell.value;
    renderGrid();
  }

  // Click-to-insert reference while editing formula
  let formulaInsertMode = false;
  document.getElementById("formulaInput").addEventListener("focus", () => {
    formulaInsertMode = true;
  });
  document.getElementById("formulaInput").addEventListener("blur", () => {
    formulaInsertMode = false;
  });

  // Override selectCell when formula input focused
  const originalSelectCell = selectCell;
  function selectCell(r, c, event) {
    const inputFocused = document.activeElement === document.getElementById("formulaInput");
    if (inputFocused && event && !event.shiftKey) {
      const input = document.getElementById("formulaInput");
      const ref = cellRef(r, c);
      const start = input.selectionStart || 0;
      const end = input.selectionEnd || 0;
      const curVal = input.value;
      input.value = curVal.slice(0, start) + ref + curVal.slice(end);
      input.focus();
      // Place cursor after inserted reference
      setTimeout(() => {
        input.setSelectionRange(start + ref.length, start + ref.length);
      }, 0);
      // Highlight selected cell briefly, don't change main selection permanently
      selectedCell = { r, c };
      renderGrid();
      return;
    }
    originalSelectCell(r, c, event);
  }

  // Formatting
  function formatBold() {
    applyToSelection(s => s.style.bold = !s.style.bold);
  }
  function formatItalic() {
    applyToSelection(s => s.style.italic = !s.style.italic);
  }
  function formatBg() {
    const picker = document.getElementById("bgPicker");
    applyToSelection(s => s.style.bg = picker.value);
  }
  function clearSelection() {
    applyToSelection(s => {
      s.value = "";
      s.formula = "";
    });
  }

  function applyToSelection(fn) {
    const s = sheets[currentSheet];
    let range = { r: selectedCell.r, c: selectedCell.c };
    // If drag range active, apply to range
    if (dragStart && dragEnd) {
      const minR = Math.min(dragStart.r, dragEnd.r), maxR = Math.max(dragStart.r, dragEnd.r);
      const minC = Math.min(dragStart.c, dragEnd.c), maxC = Math.max(dragStart.c, dragEnd.c);
      for (let r = minR; r <= maxR; r++) {
        for (let c = minC; c <= maxC; c++) {
          fn(s.grid[r][c]);
        }
      }
    } else {
      fn(s.grid[selectedCell.r][selectedCell.c]);
    }
    renderGrid();
  }

  // CSV Download
  function downloadCSV() {
    const s = sheets[currentSheet];
    let csv = "";
    for (let r = 0; r < ROWS; r++) {
      const row = [];
      for (let c = 0; c < COLS; c++) {
        const cell = s.grid[r][c];
        let val = cell.formula ? cell.formula : cell.value;
        if (val == null || val === undefined) val = "";
        val = String(val);
        if (val.includes(",") || val.includes("\n") || val.includes('"')) {
          val = '"' + val.replace(/"/g, '""') + '"';
        }
        row.push(val);
      }
      csv += row.join(",") + "\n";
    }
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (s.name || "Sheet") + ".csv";
    a.click();
    URL.revokeObjectURL(url);
    updateStatus("Downloaded CSV");
  }

  // CSV Upload
  function uploadCSV(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const text = e.target.result;
        const lines = text.split(/\r?\n/).filter(line => line.trim() !== "");
        const s = sheets[currentSheet];
        // Clear existing data
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            s.grid[r][c].value = "";
            s.grid[r][c].formula = "";
          }
        }
        lines.forEach((line, rIdx) => {
          if (rIdx >= ROWS) return;
          const parts = parseCSVLine(line);
          parts.forEach((val, cIdx) => {
            if (cIdx >= COLS) return;
            const cleanVal = val.trim();
            if (cleanVal.startsWith("=")) {
              s.grid[rIdx][cIdx].formula = cleanVal;
              s.grid[rIdx][cIdx].value = "";
            } else {
              s.grid[rIdx][cIdx].value = cleanVal;
              s.grid[rIdx][cIdx].formula = "";
            }
          });
        });
        renderGrid();
        updateStatus("Uploaded CSV into " + currentSheet);
      } catch (err) {
        alert("Failed to parse CSV.");
      }
    };
    reader.readAsText(file);
  }

  function parseCSVLine(line) {
    const result = [];
    let current = "";
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      const next = line[i + 1];
      if (inQuotes) {
        if (char === '"' && next === '"') {
          current += '"';
          i++;
        } else if (char === '"') {
          inQuotes = false;
        } else {
          current += char;
        }
      } else {
        if (char === '"') {
          inQuotes = true;
        } else if (char === ',') {
          result.push(current);
          current = "";
        } else {
          current += char;
        }
      }
    }
    result.push(current);
    return result;
  }

  // Status
  function updateStatus(msg) {
    document.getElementById("statusText").textContent = msg;
  }

  // Initialize
  initSheets();
  renderTabs();
  renderGrid();
  focusFormula();
  updateStatus("Ready — Click a cell and type, or use the formula bar");

  // Keyboard navigation for grid
  document.addEventListener("keydown", (e) => {
    if (document.activeElement === document.getElementById("formulaInput")) {
      // Formula bar handled by its own listeners
      return;
    }
    const s = sheets[currentSheet];
    let { r, c } = selectedCell;

    if (e.key === "ArrowUp") { e.preventDefault(); r = Math.max(0, r - 1); selectCell(r, c); }
    else if (e.key === "ArrowDown") { e.preventDefault(); r = Math.min(ROWS - 1, r + 1); selectCell(r, c); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); c = Math.max(0, c - 1); selectCell(r, c); }
    else if (e.key === "ArrowRight") { e.preventDefault(); c = Math.min(COLS - 1, c + 1); selectCell(r, c); }
    else if (e.key === "Enter") {
      e.preventDefault();
      document.getElementById("formulaInput").focus();
      document.getElementById("formulaInput").select();
    }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      // Start typing in cell
      e.preventDefault();
      const input = document.getElementById("formulaInput");
      const cell = s.grid[r][c];
      input.value = cell.formula || cell.value;
      input.focus();
    }
    else if (e.key === "Delete" || e.key === "Backspace") {
      e.preventDefault();
      clearSelection();
    }
  });

  // Make grid scrollable and smooth
  document.getElementById("gridWrap").addEventListener("scroll", () => {
    // Optional: sync headers? Not needed with sticky CSS.
  });
</script>
</body>
