<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreadsheet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; color: #1a1a1a; background: #f0f0f0; }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* Toolbar */
  #toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #f8f9fa; border-bottom: 1px solid #d0d0d0; flex-shrink: 0; min-height: 38px; }
  #toolbar .btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 28px; border: 1px solid #d0d0d0; background: #fff; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 600; color: #333; transition: all 0.1s; }
  #toolbar .btn:hover { background: #e8e8e8; }
  #toolbar .btn.active { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  #toolbar .sep { width: 1px; height: 22px; background: #d0d0d0; margin: 0 4px; }
  #toolbar .label { font-size: 11px; color: #888; margin-right: 4px; }
  #toolbar input[type="color"] { width: 28px; height: 24px; padding: 0; border: 1px solid #d0d0d0; border-radius: 3px; cursor: pointer; background: #fff; }
  #toolbar .break { flex: 1; }
  #toolbar .file-btn { width: auto; padding: 0 8px; font-size: 12px; font-weight: 500; gap: 4px; }

  /* Formula bar */
  #formula-bar { display: flex; align-items: center; gap: 0; padding: 3px 8px; background: #fff; border-bottom: 1px solid #d0d0d0; flex-shrink: 0; min-height: 32px; }
  #formula-bar .addr { display: inline-flex; align-items: center; min-width: 60px; padding: 2px 8px; background: #f3f3f3; border: 1px solid #d0d0d0; border-right: none; border-radius: 3px 0 0 3px; font-size: 12px; font-weight: 500; color: #555; }
  #formula-bar .input { flex: 1; padding: 2px 8px; border: 1px solid #d0d0d0; border-right: none; border-radius: 3px 0 0 3px; font-size: 12px; font-family: 'Consolas', 'Monaco', monospace; outline: none; min-width: 0; }
  #formula-bar .input:focus { border-color: #4a90d9; box-shadow: 0 0 0 1px #4a90d9; }
  #formula-bar .value { display: inline-flex; align-items: center; min-width: 80px; padding: 2px 8px; background: #f3f3f3; border: 1px solid #d0d0d0; border-radius: 0 3px 3px 0; font-size: 12px; font-family: 'Consolas', 'Monaco', monospace; color: #555; }

  /* Grid area */
  #grid-area { flex: 1; overflow: hidden; position: relative; background: #fff; }
  #grid-scroll { overflow: auto; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #grid-content { position: relative; }
  .corner { position: sticky; top: 0; left: 0; z-index: 30; background: #f8f8f8; border-right: 1px solid #d0d0d0; border-bottom: 1px solid #d0d0d0; width: 35px; height: 24px; }
  .col-header { position: sticky; top: 0; z-index: 20; background: #f8f8f8; border-right: 1px solid #d0d0d0; border-bottom: 1px solid #d0d0d0; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #666; user-select: none; }
  .row-num { position: sticky; left: 0; z-index: 10; background: #f8f8f8; border-right: 1px solid #d0d0d0; border-bottom: 1px solid #d0d0d0; width: 35px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #888; user-select: none; }
  .cell { border-right: 1px solid #e8e8e8; border-bottom: 1px solid #e8e8e8; height: 24px; padding: 0 4px; overflow: hidden; white-space: nowrap; cursor: cell; position: relative; font-size: 12px; outline: none; }
  .cell.selected { outline: 2px solid #4a90d9; outline-offset: -1px; z-index: 5; }
  .cell.range-selected { background: rgba(74, 144, 217, 0.12); }
  .cell.active-range { background: rgba(74, 144, 217, 0.08); }
  .col-resize { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 25; }
  .col-resize:hover, .col-resize.active { background: #4a90d9; }
  .row-resize { position: absolute; bottom: 0; left: 0; right: 0; height: 5px; cursor: row-resize; z-index: 15; }
  .row-resize:hover { background: #4a90d9; }

  /* Sheet tabs */
  #sheet-tabs { display: flex; align-items: center; gap: 0; padding: 0 4px; background: #fff; border-top: 1px solid #d0d0d0; flex-shrink: 0; min-height: 32px; overflow-x: auto; }
  .sheet-tab { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1px solid #d0d0d0; border-bottom: none; border-radius: 3px 3px 0 0; cursor: pointer; font-size: 12px; background: #f8f8f8; white-space: nowrap; min-width: 80px; max-width: 140px; }
  .sheet-tab:hover { background: #eee; }
  .sheet-tab.active { background: #fff; border-bottom: 1px solid #fff; font-weight: 600; }
  .sheet-tab .tab-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .sheet-tab .tab-close { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 12px; color: #999; cursor: pointer; }
  .sheet-tab .tab-close:hover { background: #ddd; color: #c00; }
  #sheet-add { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: 1px solid #d0d0d0; background: #fff; border-radius: 3px; cursor: pointer; font-size: 16px; color: #666; }
  #sheet-add:hover { background: #eee; }

  /* Scrollbar styling */
  #grid-scroll::-webkit-scrollbar { width: 12px; height: 12px; }
  #grid-scroll::-webkit-scrollbar-track { background: #f0f0f0; }
  #grid-scroll::-webkit-scrollbar-thumb { background: #c0c0c0; border-radius: 6px; border: 2px solid #f0f0f0; }
  #grid-scroll::-webkit-scrollbar-thumb:hover { background: #a0a0a0; }

  /* Hidden file input */
  #csv-upload { display: none; }

  /* Error display */
  .cell.err { color: #c00; font-style: italic; }
  .cell.value-text { color: #333; }

  /* Responsive */
  @media (max-width: 600px) {
    #toolbar .file-btn { padding: 0 4px; font-size: 11px; }
    #formula-bar .addr { min-width: 40px; }
    #formula-bar .value { min-width: 50px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button class="btn" id="btn-bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
    <button class="btn" id="btn-italic" title="Italic (Ctrl+I)"><em>I</em></button>
    <span class="sep"></span>
    <input type="color" id="bg-color" value="#ffffff" title="Background color">
    <button class="btn" id="btn-clear" title="Clear contents">✕</button>
    <span class="sep"></span>
    <button class="btn file-btn" id="btn-download" title="Download as CSV">📥 Download CSV</button>
    <button class="btn file-btn" id="btn-upload" title="Upload CSV">📤 Upload CSV</button>
    <input type="file" id="csv-upload" accept=".csv">
    <span class="break"></span>
    <span class="label">Spreadsheet</span>
  </div>

  <div id="formula-bar">
    <div class="addr" id="cell-addr">A1</div>
    <input class="input" id="formula-input" spellcheck="false" autocomplete="off">
    <div class="value" id="cell-value">&nbsp;</div>
  </div>

  <div id="grid-area">
    <div id="grid-scroll">
      <div id="grid-content"></div>
    </div>
  </div>

  <div id="sheet-tabs">
    <button id="sheet-add" title="Add sheet">+</button>
  </div>
</div>

<script>
'use strict';

// ===== CONSTANTS =====
const NUM_COLS = 26;
const NUM_ROWS = 200;
const DEFAULT_COL_WIDTH = 85;
const DEFAULT_ROW_HEIGHT = 24;
const HEADER_HEIGHT = 24;
const ROW_NUM_WIDTH = 35;

// ===== STATE =====
let sheets = [];
let activeSheetIdx = 0;
let selStart = { r: 0, c: 0 };
let selEnd = { r: 0, c: 0 };
let isEditing = false;
let colWidths = [];
let isSelecting = false;
let selectStart = null;
let isResizing = false;
let resizeCol = -1;
let resizeStartX = 0;
let resizeStartWidth = 0;
let cellElements = []; // 2D array [row][col] -> DOM element
let colHeaderElements = [];
let rowNumElements = [];
let depGraph = new Map(); // ref -> Set of refs that depend on it
let pendingRecalc = new Set();

// ===== HELPERS =====
function colToIndex(colStr) {
  let n = 0;
  for (let i = 0; i < colStr.length; i++) n = n * 26 + (colStr.charCodeAt(i) - 64);
  return n - 1;
}
function indexToCol(idx) {
  let s = '';
  while (idx >= 0) { s = String.fromCharCode(65 + (idx % 26)) + s; idx = Math.floor(idx / 26) - 1; }
  return s;
}
function makeRef(r, c) { return indexToCol(c) + (r + 1); }
function parseRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;
  return { c: colToIndex(m[1]), r: parseInt(m[2]) - 1 };
}
function getSheet() { return sheets[activeSheetIdx]; }
function getCell(ref) { return getSheet().cells.get(ref); }
function getCellValue(ref) {
  const cell = getCell(ref);
  if (!cell) return 0;
  if (cell.error) return NaN;
  return cell.value;
}
function isNumber(v) { return typeof v === 'number' && !isNaN(v); }

// ===== FORMULA ENGINE =====
function tokenize(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if (c === ' ') { i++; continue; }
    if (c === '(') { tokens.push({ type: 'LPAREN' }); i++; continue; }
    if (c === ')') { tokens.push({ type: 'RPAREN' }); i++; continue; }
    if (c === ',') { tokens.push({ type: 'COMMA' }); i++; continue; }
    if (c === ':') { tokens.push({ type: 'COLON' }); i++; continue; }
    if (c === '+') { tokens.push({ type: 'PLUS' }); i++; continue; }
    if (c === '-') {
      // Check if it's a unary minus (preceded by operator, paren, or start)
      if (tokens.length === 0 || tokens[tokens.length-1].type === 'LPAREN' || tokens[tokens.length-1].type === 'PLUS' || tokens[tokens.length-1].type === 'MINUS' || tokens[tokens.length-1].type === 'MUL' || tokens[tokens.length-1].type === 'DIV' || tokens[tokens.length-1].type === 'COMMA') {
        tokens.push({ type: 'UMINUS' });
      } else {
        tokens.push({ type: 'MINUS' });
      }
      i++; continue;
    }
    if (c === '*') { tokens.push({ type: 'MUL' }); i++; continue; }
    if (c === '/') { tokens.push({ type: 'DIV' }); i++; continue; }
    if ((c >= '0' && c <= '9') || (c === '.' && i+1 < s.length && s[i+1] >= '0' && s[i+1] <= '9')) {
      let num = '';
      while (i < s.length && (s[i] >= '0' && s[i] <= '9' || s[i] === '.')) { num += s[i]; i++; }
      tokens.push({ type: 'NUMBER', value: parseFloat(num) });
      continue;
    }
    if ((c >= 'A' && c <= 'Z') || (c >= 'a' && c <= 'z')) {
      let name = '';
      while (i < s.length && ((s[i] >= 'A' && s[i] <= 'Z') || (s[i] >= 'a' && s[i] <= 'z'))) { name += s[i]; i++; }
      // Look ahead
      let j = i;
      while (j < s.length && s[j] === ' ') j++;
      if (j < s.length && s[j] >= '0' && s[j] <= '9') {
        let cell = name.toUpperCase();
        while (i < s.length && s[i] >= '0' && s[i] <= '9') { cell += s[i]; i++; }
        tokens.push({ type: 'CELL', value: cell });
      } else if (j < s.length && s[j] === '(') {
        tokens.push({ type: 'FUNC', value: name.toUpperCase() });
      } else {
        tokens.push({ type: 'IDENT', value: name.toUpperCase() });
      }
      continue;
    }
    throw new Error('Unexpected character: ' + c);
  }
  return tokens;
}

class Parser {
  constructor(tokens) { this.tokens = tokens; this.pos = 0; }
  peek() { return this.tokens[this.pos]; }
  consume() { return this.tokens[this.pos++]; }
  expect(type) {
    const t = this.consume();
    if (!t || t.type !== type) throw new Error('Expected ' + type);
    return t;
  }
  parse() {
    if (this.tokens.length === 0) throw new Error('Empty expression');
    const expr = this.parseExpr();
    if (this.pos < this.tokens.length) throw new Error('Unexpected token');
    return expr;
  }
  parseExpr() {
    let left = this.parseTerm();
    while (this.peek() && (this.peek().type === 'PLUS' || this.peek().type === 'MINUS')) {
      const op = this.consume().type;
      const right = this.parseTerm();
      left = { type: 'BINOP', op, left, right };
    }
    return left;
  }
  parseTerm() {
    let left = this.parseFactor();
    while (this.peek() && (this.peek().type === 'MUL' || this.peek().type === 'DIV')) {
      const op = this.consume().type;
      const right = this.parseFactor();
      left = { type: 'BINOP', op, left, right };
    }
    return left;
  }
  parseFactor() {
    const t = this.peek();
    if (!t) throw new Error('Unexpected end');
    if (t.type === 'NUMBER') { this.consume(); return { type: 'NUMBER', value: t.value }; }
    if (t.type === 'CELL') { this.consume(); return { type: 'CELL', value: t.value }; }
    if (t.type === 'FUNC') {
      this.consume();
      this.expect('LPAREN');
      const args = [];
      if (this.peek() && this.peek().type !== 'RPAREN') {
        args.push(this.parseExpr());
        while (this.peek() && this.peek().type === 'COMMA') { this.consume(); args.push(this.parseExpr()); }
      }
      this.expect('RPAREN');
      return { type: 'FUNC', name: t.value, args };
    }
    if (t.type === 'LPAREN') { this.consume(); const e = this.parseExpr(); this.expect('RPAREN'); return e; }
    if (t.type === 'UMINUS') { this.consume(); return { type: 'UMINUS', operand: this.parseFactor() }; }
    if (t.type === 'CELL') {
      // Check for range
      const saved = this.pos;
      const first = this.consume();
      if (this.peek() && this.peek().type === 'COLON') {
        this.consume();
        const second = this.expect('CELL');
        return { type: 'RANGE', start: first.value, end: second.value };
      }
      this.pos = saved;
      return { type: 'CELL', value: first.value };
    }
    if (t.type === 'IDENT') {
      this.consume();
      if (this.peek() && this.peek().type === 'COLON') {
        this.consume();
        const second = this.expect('CELL');
        return { type: 'RANGE', start: t.value + '?', end: second.value };
      }
      throw new Error('Unknown identifier: ' + t.value);
    }
    throw new Error('Unexpected token: ' + t.type);
  }
}

function parseFormula(formula) {
  const s = formula.startsWith('=') ? formula.substring(1) : formula;
  const tokens = tokenize(s);
  const parser = new Parser(tokens);
  return parser.parse();
}

function getRangeCells(startRef, endRef) {
  const s = parseRef(startRef), e = parseRef(endRef);
  if (!s || !e) return [];
  const cells = [];
  const minR = Math.min(s.r, e.r), maxR = Math.max(s.r, e.r);
  const minC = Math.min(s.c, e.c), maxC = Math.max(s.c, e.c);
  for (let r = minR; r <= maxR; r++)
    for (let c = minC; c <= maxC; c++)
      cells.push(makeRef(r, c));
  return cells;
}

function extractDeps(ast) {
  const deps = new Set();
  function walk(node) {
    if (!node) return;
    if (node.type === 'CELL') deps.add(node.value);
    else if (node.type === 'RANGE') getRangeCells(node.start, node.end).forEach(deps.add, deps);
    else if (node.type === 'BINOP') { walk(node.left); walk(node.right); }
    else if (node.type === 'UMINUS') walk(node.operand);
    else if (node.type === 'FUNC') node.args.forEach(walk);
  }
  walk(ast);
  return deps;
}

function evaluate(ast) {
  function evalNode(node) {
    if (node.type === 'NUMBER') return node.value;
    if (node.type === 'CELL') {
      const v = getCellValue(node.value);
      if (isNaN(v)) throw new Error('#REF!');
      return v;
    }
    if (node.type === 'RANGE') {
      const cells = getRangeCells(node.start, node.end);
      return cells.map(c => { const v = getCellValue(c); if (isNaN(v)) throw new Error('#REF!'); return v; });
    }
    if (node.type === 'UMINUS') return -evalNode(node.operand);
    if (node.type === 'BINOP') {
      const l = evalNode(node.left);
      const r = evalNode(node.right);
      if (node.op === 'PLUS') {
        if (Array.isArray(l)) return l.reduce((a,b)=>a+(Array.isArray(b)?b.reduce((x,y)=>x+y,0):b), 0);
        if (Array.isArray(r)) return r.reduce((a,b)=>a+(Array.isArray(l)?l.reduce((x,y)=>x+y,0):l), 0);
        return l + r;
      }
      if (node.op === 'MINUS') return l - r;
      if (node.op === 'MUL') return l * r;
      if (node.op === 'DIV') return r === 0 ? NaN : l / r;
    }
    if (node.type === 'FUNC') {
      const args = node.args.map(evalNode);
      switch (node.name) {
        case 'SUM': {
          let s = 0;
          for (const a of args) {
            if (Array.isArray(a)) for (const v of a) s += v;
            else s += a;
          }
          return s;
        }
        case 'AVERAGE': {
          let s = 0, n = 0;
          for (const a of args) {
            if (Array.isArray(a)) { for (const v of a) { s += v; n++; } }
            else { s += a; n++; }
          }
          return n === 0 ? NaN : s / n;
        }
        case 'MIN': {
          let m = Infinity;
          for (const a of args) {
            if (Array.isArray(a)) for (const v of a) m = Math.min(m, v);
            else m = Math.min(m, a);
          }
          return m === Infinity ? NaN : m;
        }
        case 'MAX': {
          let m = -Infinity;
          for (const a of args) {
            if (Array.isArray(a)) for (const v of a) m = Math.max(m, v);
            else m = Math.max(m, a);
          }
          return m === -Infinity ? NaN : m;
        }
        case 'COUNT': {
          let n = 0;
          for (const a of args) {
            if (Array.isArray(a)) n += a.length;
            else n++;
          }
          return n;
        }
        default: throw new Error('Unknown function: ' + node.name);
      }
    }
    throw new Error('Unknown node type');
  }
  return evalNode(ast);
}

function recomputeCell(ref) {
  const cell = getCell(ref);
  if (!cell) return;
  const oldDeps = cell.deps ? new Set(cell.deps) : new Set();
  if (cell.formula !== null) {
    try {
      const ast = parseFormula(cell.formula);
      const val = evaluate(ast);
      cell.value = val;
      cell.error = isNaN(val) ? '#ERROR' : null;
      const newDeps = extractDeps(ast);
      // Update dep graph
      for (const d of oldDeps) {
        const set = depGraph.get(d);
        if (set) { set.delete(ref); if (set.size === 0) depGraph.delete(d); }
      }
      for (const d of newDeps) {
        if (!depGraph.has(d)) depGraph.set(d, new Set());
        depGraph.get(d).add(ref);
      }
      cell.deps = newDeps;
    } catch (e) {
      cell.value = NaN;
      cell.error = '#ERROR';
      for (const d of oldDeps) {
        const set = depGraph.get(d);
        if (set) { set.delete(ref); if (set.size === 0) depGraph.delete(d); }
      }
      cell.deps = new Set();
    }
  } else {
    // Literal value - remove from dep graph
    for (const d of oldDeps) {
      const set = depGraph.get(d);
      if (set) { set.delete(ref); if (set.size === 0) depGraph.delete(d); }
    }
    cell.deps = new Set();
    cell.error = null;
  }
}

function recalcAll() {
  // Topological recalc: recompute all formula cells
  const allRefs = getSheet().cells.keys();
  // First pass: clear all deps
  for (const ref of getSheet().cells.keys()) {
    const cell = getSheet().cells.get(ref);
    if (cell.deps) {
      for (const d of cell.deps) {
        const set = depGraph.get(d);
        if (set) { set.delete(ref); if (set.size === 0) depGraph.delete(d); }
      }
      cell.deps = new Set();
    }
  }
  depGraph.clear();
  // Second pass: recompute and build deps
  for (const ref of getSheet().cells.keys()) {
    const cell = getSheet().cells.get(ref);
    if (cell.formula !== null) {
      try {
        const ast = parseFormula(cell.formula);
        const val = evaluate(ast);
        cell.value = val;
        cell.error = isNaN(val) ? '#ERROR' : null;
        const newDeps = extractDeps(ast);
        for (const d of newDeps) {
          if (!depGraph.has(d)) depGraph.set(d, new Set());
          depGraph.get(d).add(ref);
        }
        cell.deps = newDeps;
      } catch (e) {
        cell.value = NaN;
        cell.error = '#ERROR';
        cell.deps = new Set();
      }
    } else {
      cell.error = null;
      cell.deps = new Set();
    }
  }
}

function recalcAfterChange(changedRef) {
  // BFS through dependency graph
  const visited = new Set();
  const queue = [changedRef];
  while (queue.length > 0) {
    const ref = queue.shift();
    if (visited.has(ref)) continue;
    visited.add(ref);
    recomputeCell(ref);
    const deps = depGraph.get(ref);
    if (deps) {
      for (const dep of deps) {
        if (!visited.has(dep)) queue.push(dep);
      }
    }
  }
}

// ===== CELL DATA =====
function setCellValue(ref, raw, isFormula) {
  const sheet = getSheet();
  const cell = sheet.cells.get(ref) || { raw: '', formula: null, value: 0, error: null, deps: new Set(), style: {} };
  if (isFormula) {
    cell.raw = raw;
    cell.formula = raw;
    cell.value = 0;
    cell.error = null;
    cell.style = cell.style || {};
  } else {
    cell.raw = raw;
    cell.formula = null;
    // Try to parse as number
    const num = parseFloat(raw);
    if (raw.trim() !== '' && !isNaN(num) && String(num) === raw.trim()) {
      cell.value = num;
    } else if (raw.trim() === '') {
      cell.value = 0;
    } else {
      cell.value = raw;
    }
    cell.error = null;
    cell.style = cell.style || {};
  }
  sheet.cells.set(ref, cell);
}

function clearCell(ref) {
  const sheet = getSheet();
  const cell = sheet.cells.get(ref);
  if (cell) {
    cell.raw = '';
    cell.formula = null;
    cell.value = 0;
    cell.error = null;
    cell.deps = new Set();
  }
}

function clearSelection() {
  const { r1, r2, c1, c2 } = getSelectionBounds();
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const ref = makeRef(r, c);
      clearCell(ref);
    }
  recalcAll();
  updateCellDisplay();
  updateFormulaBar();
}

function mergeStyles(base, overlay) {
  return {
    bold: overlay.bold !== undefined ? overlay.bold : base.bold,
    italic: overlay.italic !== undefined ? overlay.italic : base.italic,
    bgColor: overlay.bgColor !== undefined ? overlay.bgColor : base.bgColor,
  };
}

function applyStyleToSelection(style) {
  const { r1, r2, c1, c2 } = getSelectionBounds();
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const ref = makeRef(r, c);
      const cell = getCell(ref);
      if (cell) {
        cell.style = mergeStyles(cell.style || {}, style);
        getSheet().cells.set(ref, cell);
      }
    }
  updateCellDisplay();
}

function getSelectionBounds() {
  const r1 = Math.min(selStart.r, selEnd.r), r2 = Math.max(selStart.r, selEnd.r);
  const c1 = Math.min(selStart.c, selEnd.c), c2 = Math.max(selStart.c, selEnd.c);
  return { r1, r2, c1, c2 };
}

// ===== RENDERING =====
function createGridDOM() {
  const container = document.getElementById('grid-content');
  container.innerHTML = '';
  container.style.display = 'grid';
  container.style.gridTemplateColumns = ` ${ROW_NUM_WIDTH}px repeat(${NUM_COLS}, ${DEFAULT_COL_WIDTH}px)`;
  container.style.gridTemplateRows = `${HEADER_HEIGHT}px repeat(${NUM_ROWS}, ${DEFAULT_ROW_HEIGHT}px)`;
  container.style.width = (ROW_NUM_WIDTH + NUM_COLS * DEFAULT_COL_WIDTH) + 'px';
  container.style.height = (HEADER_HEIGHT + NUM_ROWS * DEFAULT_ROW_HEIGHT) + 'px';

  // Corner
  const corner = document.createElement('div');
  corner.className = 'corner';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  container.appendChild(corner);

  // Column headers
  colHeaderElements = [];
  for (let c = 0; c < NUM_COLS; c++) {
    const el = document.createElement('div');
    el.className = 'col-header';
    el.textContent = indexToCol(c);
    el.style.gridColumn = (c + 2);
    el.style.gridRow = '1';
    el.style.width = DEFAULT_COL_WIDTH + 'px';
    el.dataset.col = c;
    const resize = document.createElement('div');
    resize.className = 'col-resize';
    resize.dataset.col = c;
    el.appendChild(resize);
    container.appendChild(el);
    colHeaderElements.push(el);
  }

  // Row numbers + cells
  cellElements = [];
  rowNumElements = [];
  for (let r = 0; r < NUM_ROWS; r++) {
    const rn = document.createElement('div');
    rn.className = 'row-num';
    rn.textContent = r + 1;
    rn.style.gridColumn = '1';
    rn.style.gridRow = (r + 2);
    rn.style.height = DEFAULT_ROW_HEIGHT + 'px';
    container.appendChild(rn);
    rowNumElements.push(rn);

    cellElements[r] = [];
    for (let c = 0; c < NUM_COLS; c++) {
      const el = document.createElement('div');
      el.className = 'cell';
      el.style.gridColumn = (c + 2);
      el.style.gridRow = (r + 2);
      el.style.width = DEFAULT_COL_WIDTH + 'px';
      el.style.height = DEFAULT_ROW_HEIGHT + 'px';
      el.dataset.row = r;
      el.dataset.col = c;
      el.dataset.ref = makeRef(r, c);
      container.appendChild(el);
      cellElements[r][c] = el;
    }
  }

  // Update column widths
  updateColumnWidths();
}

function updateColumnWidths() {
  for (let c = 0; c < NUM_COLS; c++) {
    const w = colWidths[c] || DEFAULT_COL_WIDTH;
    colHeaderElements[c].style.width = w + 'px';
    for (let r = 0; r < NUM_ROWS; r++) {
      cellElements[r][c].style.width = w + 'px';
    }
  }
  const totalWidth = ROW_NUM_WIDTH + colWidths.reduce((a, b) => a + b, 0);
  document.getElementById('grid-content').style.width = totalWidth + 'px';
}

function updateCellDisplay() {
  const sheet = getSheet();
  for (let r = 0; r < NUM_ROWS; r++) {
    for (let c = 0; c < NUM_COLS; c++) {
      const el = cellElements[r][c];
      const ref = makeRef(r, c);
      const cell = sheet.cells.get(ref);
      if (!cell || (cell.raw === '' && cell.formula === null)) {
        el.textContent = '';
        el.className = 'cell';
        el.style.background = '';
        el.style.fontWeight = '';
        el.style.fontStyle = '';
        continue;
      }
      el.textContent = cell.error ? cell.error : (cell.value !== 0 && cell.formula ? cell.value : cell.value !== 0 ? cell.value : (cell.raw !== '' ? cell.raw : ''));
      el.className = 'cell';
      if (cell.error) el.classList.add('err');
      if (cell.style) {
        if (cell.style.bgColor && cell.style.bgColor !== '#ffffff') el.style.background = cell.style.bgColor;
        else el.style.background = '';
        el.style.fontWeight = cell.style.bold ? 'bold' : '';
        el.style.fontStyle = cell.style.italic ? 'italic' : '';
      } else {
        el.style.background = '';
        el.style.fontWeight = '';
        el.style.fontStyle = '';
      }
    }
  }
  // Update selection styling
  updateSelectionDisplay();
}

function updateSelectionDisplay() {
  // Clear all selection classes
  for (let r = 0; r < NUM_ROWS; r++)
    for (let c = 0; c < NUM_COLS; c++) {
      const el = cellElements[r][c];
      el.classList.remove('selected', 'range-selected', 'active-range');
      el.style.zIndex = '';
    }

  const { r1, r2, c1, c2 } = getSelectionBounds();
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const el = cellElements[r][c];
      el.classList.add('range-selected');
    }
  // Active cell
  const el = cellElements[selStart.r][selStart.c];
  if (el) {
    el.classList.add('selected');
    el.style.zIndex = '5';
  }
}

function updateFormulaBar() {
  const addr = document.getElementById('cell-addr');
  const input = document.getElementById('formula-input');
  const value = document.getElementById('cell-value');
  const sheet = getSheet();

  syncToolbarState();
  if (isEditing) {
    // Don't override the input while editing
    addr.textContent = makeRef(selStart.r, selStart.c);
    const cell = sheet.cells.get(makeRef(selStart.r, selStart.c));
    if (cell && cell.formula) value.textContent = cell.value !== 0 || cell.error ? (cell.error || cell.value) : '';
    else if (cell) value.textContent = cell.value !== 0 ? cell.value : '';
    else value.textContent = '';
    return;
  }

  const isRange = selStart.r !== selEnd.r || selStart.c !== selEnd.c;
  if (isRange) {
    addr.textContent = makeRef(selStart.r, selStart.c) + ':' + makeRef(selEnd.r, selEnd.c);
    input.disabled = true;
    input.style.background = '#f3f3f3';
    const firstCell = sheet.cells.get(makeRef(selStart.r, selStart.c));
    if (firstCell && firstCell.formula) value.textContent = firstCell.error || firstCell.value;
    else if (firstCell) value.textContent = firstCell.value !== 0 ? firstCell.value : '';
    else value.textContent = '';
  } else {
    addr.textContent = makeRef(selStart.r, selStart.c);
    input.disabled = false;
    input.style.background = '';
    const cell = sheet.cells.get(makeRef(selStart.r, selStart.c));
    if (cell) {
      input.value = cell.formula || cell.raw || '';
      if (cell.formula) value.textContent = cell.error || (cell.value !== 0 ? cell.value : '');
      else if (cell.raw !== '') value.textContent = cell.value !== 0 ? cell.value : cell.raw;
      else value.textContent = '';
    } else {
      input.value = '';
      value.textContent = '';
    }
  }
}

function renderSheetTabs() {
  const container = document.getElementById('sheet-tabs');
  // Keep the add button
  const addBtn = document.getElementById('sheet-add');
  container.innerHTML = '';
  container.appendChild(addBtn);

  for (let i = 0; i < sheets.length; i++) {
    const tab = document.createElement('div');
    tab.className = 'sheet-tab' + (i === activeSheetIdx ? ' active' : '');
    tab.dataset.idx = i;

    const nameSpan = document.createElement('span');
    nameSpan.className = 'tab-name';
    nameSpan.textContent = sheets[i].name;
    tab.appendChild(nameSpan);

    const closeBtn = document.createElement('span');
    closeBtn.className = 'tab-close';
    closeBtn.textContent = '×';
    closeBtn.title = 'Delete sheet';
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSheet(i);
    });
    tab.appendChild(closeBtn);

    tab.addEventListener('click', () => switchSheet(i));
    tab.addEventListener('dblclick', () => renameSheet(i));
    container.appendChild(tab);
  }
}

// ===== SHEET MANAGEMENT =====
function switchSheet(idx) {
  if (idx < 0 || idx >= sheets.length) return;
  if (isEditing) commitEdit();
  activeSheetIdx = idx;
  selStart = { r: 0, c: 0 };
  selEnd = { r: 0, c: 0 };
  renderSheetTabs();
  updateCellDisplay();
  updateFormulaBar();
}

function addSheet() {
  const n = sheets.length + 1;
  sheets.push({ name: 'Sheet' + n, cells: new Map() });
  activeSheetIdx = sheets.length - 1;
  selStart = { r: 0, c: 0 };
  selEnd = { r: 0, c: 0 };
  renderSheetTabs();
  updateCellDisplay();
  updateFormulaBar();
}

function renameSheet(idx) {
  const name = prompt('Rename sheet:', sheets[idx].name);
  if (name && name.trim()) {
    sheets[idx].name = name.trim();
    renderSheetTabs();
  }
}

function deleteSheet(idx) {
  if (sheets.length <= 1) { alert('Cannot delete the last sheet.'); return; }
  if (!confirm('Delete "' + sheets[idx].name + '"?')) return;
  sheets.splice(idx, 1);
  if (activeSheetIdx >= sheets.length) activeSheetIdx = sheets.length - 1;
  if (activeSheetIdx === idx) activeSheetIdx = Math.min(idx, sheets.length - 1);
  renderSheetTabs();
  updateCellDisplay();
  updateFormulaBar();
}

// ===== EDITING =====
function startEdit() {
  if (isEditing) return;
  isEditing = true;
  const input = document.getElementById('formula-input');
  const cell = getSheet().cells.get(makeRef(selStart.r, selStart.c));
  input.disabled = false;
  input.style.background = '';
  input.value = cell ? (cell.formula || cell.raw || '') : '';
  input.focus();
  input.select();
  updateFormulaBar();
}

function commitEdit() {
  if (!isEditing) return;
  isEditing = false;
  const input = document.getElementById('formula-input');
  const val = input.value;
  const ref = makeRef(selStart.r, selStart.c);
  const { r1, r2, c1, c2 } = getSelectionBounds();

  if (val.startsWith('=')) {
    // Formula
    setCellValue(ref, val, true);
    // Fill range if selected
    if (r1 !== r2 || c1 !== c2) {
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++) {
          if (makeRef(r, c) !== ref) {
            const sheet = getSheet();
            const copy = getCell(ref);
            if (copy) {
              const newRef = makeRef(r, c);
              const newFormula = copy.formula.replace(new RegExp('\\b' + ref + '\\b', 'g'), newRef);
              sheet.cells.set(newRef, {
                raw: newFormula,
                formula: newFormula,
                value: 0,
                error: null,
                deps: new Set(),
                style: { ...copy.style }
              });
            }
          }
        }
    }
  } else {
    // Literal value
    setCellValue(ref, val, false);
    if (r1 !== r2 || c1 !== c2) {
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++) {
          if (makeRef(r, c) !== ref) {
            const sheet = getSheet();
            const newRef = makeRef(r, c);
            sheet.cells.set(newRef, {
              raw: val,
              formula: null,
              value: parseFloat(val) || (val.trim() === '' ? 0 : val),
              error: null,
              deps: new Set(),
              style: {}
            });
          }
        }
    }
  }

  recalcAll();
  updateCellDisplay();
  updateFormulaBar();
  input.blur();
}

function cancelEdit() {
  if (!isEditing) return;
  isEditing = false;
  const input = document.getElementById('formula-input');
  input.disabled = false;
  input.style.background = '';
  updateFormulaBar();
  input.blur();
}

function insertRefIntoFormula(ref) {
  if (!isEditing) return;
  const input = document.getElementById('formula-input');
  const start = input.selectionStart;
  const end = input.selectionEnd;
  const val = input.value;
  input.value = val.substring(0, start) + ref + val.substring(end);
  input.focus();
  input.setSelectionRange(start + ref.length, start + ref.length);
}

// ===== EVENTS =====
function bindEvents() {
  const scroll = document.getElementById('grid-scroll');
  const content = document.getElementById('grid-content');
  const input = document.getElementById('formula-input');

  // Cell mousedown (for selection and editing)
  content.addEventListener('mousedown', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.row);
    const c = parseInt(cell.dataset.col);

    if (isEditing) {
      // Insert ref into formula
      const ref = makeRef(r, c);
      e.preventDefault();
      // Start potential range drag for formula insertion
      isSelecting = true;
      selectStart = { r, c };
      selStart = { r, c };
      selEnd = { r, c };
      insertRefIntoFormula(ref);
      updateSelectionDisplay();
      return;
    }

    e.preventDefault();
    selStart = { r, c };
    selEnd = { r, c };
    isSelecting = true;
    selectStart = { r, c };
    updateSelectionDisplay();
    updateFormulaBar();
  });

  // Cell double-click (start editing)
  content.addEventListener('dblclick', (e) => {
    const cell = e.target.closest('.cell');
    if (!cell) return;
    const r = parseInt(cell.dataset.row);
    const c = parseInt(cell.dataset.col);
    selStart = { r, c };
    selEnd = { r, c };
    updateSelectionDisplay();
    updateFormulaBar();
    startEdit();
  });

  // Mousemove (selection drag and column resize)
  document.addEventListener('mousemove', (e) => {
    if (isSelecting) {
      const cell = e.target.closest('.cell');
      if (cell && !isEditing) {
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        selEnd = { r, c };
        updateSelectionDisplay();
      } else if (cell && isEditing) {
        // Range insertion for formula
        const r = parseInt(cell.dataset.row);
        const c = parseInt(cell.dataset.col);
        selEnd = { r, c };
        const ref = makeRef(Math.min(selectStart.r, r), Math.min(selectStart.c, c)) +
                    ':' + makeRef(Math.max(selectStart.r, r), Math.max(selectStart.c, c));
        insertRefIntoFormula(ref);
        updateSelectionDisplay();
      }
    }
    if (isResizing) {
      const dx = e.clientX - resizeStartX;
      const newWidth = Math.max(30, resizeStartWidth + dx);
      colWidths[resizeCol] = newWidth;
      updateColumnWidths();
      updateCellDisplay();
    }
  });

  document.addEventListener('mouseup', (e) => {
    if (isSelecting) {
      isSelecting = false;
      selectStart = null;
    }
    if (isResizing) {
      isResizing = false;
      document.querySelectorAll('.col-resize').forEach(el => el.classList.remove('active'));
    }
  });

  // Column resize
  content.addEventListener('mousedown', (e) => {
    const resize = e.target.closest('.col-resize');
    if (!resize) return;
    e.preventDefault();
    e.stopPropagation();
    const c = parseInt(resize.dataset.col);
    resizeCol = c;
    resizeStartX = e.clientX;
    resizeStartWidth = colWidths[c] || DEFAULT_COL_WIDTH;
    isResizing = true;
    document.querySelectorAll('.col-resize').forEach(el => el.classList.remove('active'));
    resize.classList.add('active');
  });

  // Keyboard navigation
  document.addEventListener('keydown', (e) => {
    // Formula bar shortcuts
    if (isEditing) {
      // Enter/Tab/Escape are handled by the formula input's own keydown handler
      return;
    }

    // Navigation
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      selStart.r = Math.max(0, selStart.r - 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      selStart.r = Math.min(NUM_ROWS - 1, selStart.r + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      selStart.c = Math.max(0, selStart.c - 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      selStart.c = Math.min(NUM_COLS - 1, selStart.c + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      selStart.r = Math.min(NUM_ROWS - 1, selStart.r + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      selStart.c = Math.min(NUM_COLS - 1, selStart.c + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'F2') {
      e.preventDefault();
      startEdit();
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      clearSelection();
    } else if (e.ctrlKey && e.key === 'b') {
      e.preventDefault();
      toggleBold();
    } else if (e.ctrlKey && e.key === 'i') {
      e.preventDefault();
      toggleItalic();
    } else if (e.key === 'F2' || e.key === 'Delete') {
      // handled above
    }
  });

  // Formula bar click to start editing
  input.addEventListener('click', () => {
    if (!isEditing) startEdit();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitEdit();
      selStart.r = Math.min(NUM_ROWS - 1, selStart.r + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      commitEdit();
      selStart.c = Math.min(NUM_COLS - 1, selStart.c + 1);
      selEnd = { ...selStart };
      updateSelectionDisplay();
      updateFormulaBar();
      scrollToCell(selStart.r, selStart.c);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      cancelEdit();
    }
  });

  input.addEventListener('blur', () => {
    if (isEditing) commitEdit();
  });

  // Toolbar buttons
  document.getElementById('btn-bold').addEventListener('click', toggleBold);
  document.getElementById('btn-italic').addEventListener('click', toggleItalic);
  document.getElementById('bg-color').addEventListener('input', (e) => {
    applyStyleToSelection({ bgColor: e.target.value });
  });
  document.getElementById('btn-clear').addEventListener('click', () => {
    if (confirm('Clear contents of selected cells?')) clearSelection();
  });
  document.getElementById('btn-download').addEventListener('click', downloadCSV);
  document.getElementById('btn-upload').addEventListener('click', () => {
    document.getElementById('csv-upload').click();
  });
  document.getElementById('csv-upload').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => importCSV(ev.target.result);
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('sheet-add').addEventListener('click', addSheet);

  // Click on empty area to reset selection
  content.addEventListener('click', (e) => {
    if (!e.target.closest('.cell') && !e.target.closest('.col-resize')) {
      // Click on corner or header - select A1
      selStart = { r: 0, c: 0 };
      selEnd = { r: 0, c: 0 };
      updateSelectionDisplay();
      updateFormulaBar();
    }
  });
}

function toggleBold() {
  const { r1, r2, c1, c2 } = getSelectionBounds();
  // Check if any selected cell has bold
  let hasBold = false;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const cell = getCell(makeRef(r, c));
      if (cell && cell.style && cell.style.bold) hasBold = true;
    }
  applyStyleToSelection({ bold: !hasBold });
  document.getElementById('btn-bold').classList.toggle('active', !hasBold);
}

function toggleItalic() {
  const { r1, r2, c1, c2 } = getSelectionBounds();
  let hasItalic = false;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const cell = getCell(makeRef(r, c));
      if (cell && cell.style && cell.style.italic) hasItalic = true;
    }
  applyStyleToSelection({ italic: !hasItalic });
  document.getElementById('btn-italic').classList.toggle('active', !hasItalic);
}

function syncToolbarState() {
  const { r1, r2, c1, c2 } = getSelectionBounds();
  let hasBold = false, hasItalic = false;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const cell = getCell(makeRef(r, c));
      if (cell && cell.style && cell.style.bold) hasBold = true;
      if (cell && cell.style && cell.style.italic) hasItalic = true;
    }
  const boldBtn = document.getElementById('btn-bold');
  const italicBtn = document.getElementById('btn-italic');
  // Only sync if not in editing mode (editing mode focus is on input)
  if (!isEditing) {
    boldBtn.classList.toggle('active', hasBold);
    italicBtn.classList.toggle('active', hasItalic);
  }
}

function scrollToCell(r, c) {
  const scroll = document.getElementById('grid-scroll');
  const el = cellElements[r] && cellElements[r][c];
  if (!el) return;
  const scrollLeft = scroll.scrollLeft;
  const scrollTop = scroll.scrollTop;
  const rect = el.getBoundingClientRect();
  const containerRect = scroll.getBoundingClientRect();
  if (rect.left < containerRect.left) scroll.scrollLeft = Math.max(0, scrollLeft + rect.left - containerRect.left - 20);
  if (rect.top < containerRect.top) scroll.scrollTop = Math.max(0, scrollTop + rect.top - containerRect.top - 20);
  if (rect.right > containerRect.right) scroll.scrollLeft = scrollLeft + rect.right - containerRect.right + 20;
  if (rect.bottom > containerRect.bottom) scroll.scrollTop = scrollTop + rect.bottom - containerRect.bottom + 20;
}

// ===== CSV =====
function parseCSVLine(line) {
  const fields = [];
  let i = 0;
  while (i < line.length) {
    if (line[i] === '"') {
      i++;
      let field = '';
      while (i < line.length && line[i] !== '"') {
        if (line[i] === '"' && i+1 < line.length && line[i+1] === '"') { field += '"'; i += 2; }
        else { field += line[i]; i++; }
      }
      if (i < line.length) i++;
      fields.push(field);
      if (i < line.length && line[i] === ',') i++;
    } else {
      let field = '';
      while (i < line.length && line[i] !== ',') { field += line[i]; i++; }
      fields.push(field);
      if (i < line.length) i++;
    }
  }
  return fields;
}

function downloadCSV() {
  const sheet = getSheet();
  const maxR = NUM_ROWS, maxC = NUM_COLS;
  const rows = [];
  for (let r = 0; r < maxR; r++) {
    const cells = [];
    let hasContent = false;
    for (let c = 0; c < maxC; c++) {
      const ref = makeRef(r, c);
      const cell = sheet.cells.get(ref);
      let val = '';
      if (cell) {
        if (cell.formula !== null) {
          // Export computed value
          val = cell.error ? cell.error : (cell.value !== 0 ? cell.value : '');
        } else {
          val = cell.raw || (typeof cell.value === 'number' ? cell.value : (cell.value !== 0 ? cell.value : ''));
        }
      }
      if (val !== '' && val !== 0) hasContent = true;
      // Escape for CSV
      if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n'))) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      cells.push(val);
    }
    if (hasContent) rows.push(cells.join(','));
  }
  const csv = rows.join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = sheet.name + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function importCSV(text) {
  const sheet = getSheet();
  sheet.cells.clear();
  depGraph.clear();
  const lines = text.split(/\r?\n/);
  for (let r = 0; r < lines.length; r++) {
    const line = lines[r].trim();
    if (!line) continue;
    const parts = parseCSVLine(line);
    for (let c = 0; c < parts.length; c++) {
      const ref = makeRef(r, c);
      const val = parts[c];
      const num = parseFloat(val);
      if (val.trim() !== '' && !isNaN(num) && String(num) === val.trim()) {
        sheet.cells.set(ref, { raw: val, formula: null, value: num, error: null, deps: new Set(), style: {} });
      } else if (val.startsWith('=')) {
        sheet.cells.set(ref, { raw: val, formula: val, value: 0, error: null, deps: new Set(), style: {} });
      } else {
        sheet.cells.set(ref, { raw: val, formula: null, value: val, error: null, deps: new Set(), style: {} });
      }
    }
  }
  recalcAll();
  updateCellDisplay();
  updateFormulaBar();
}

// ===== INIT =====
function init() {
  colWidths = Array(NUM_COLS).fill(DEFAULT_COL_WIDTH);
  sheets = [{ name: 'Sheet1', cells: new Map() }];
  activeSheetIdx = 0;
  selStart = { r: 0, c: 0 };
  selEnd = { r: 0, c: 0 };
  createGridDOM();
  renderSheetTabs();
  updateCellDisplay();
  updateFormulaBar();
  bindEvents();
}

init();
</script>
