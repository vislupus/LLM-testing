<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Clone</title>
<style>
  :root {
    --excel-green: #217346;
    --excel-light-green: #e1f0e7;
    --header-bg: #f3f2f1;
    --grid-line: #e0e0e0;
    --selection-blue: rgba(0, 112, 192, 0.15);
    --active-border: #0070c0;
    --text-dark: #333;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

  body { background: #fff; color: var(--text-dark); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* Toolbar */
  #toolbar { display: flex; align-items: center; padding: 4px 10px; background: var(--excel-light-green); border-bottom: 1px solid var(--grid-line); gap: 4px; flex-wrap: wrap; }
  .toolbar-btn { background: none; border: 1px solid transparent; border-radius: 3px; padding: 4px 8px; cursor: pointer; font-size: 14px; color: var(--text-dark); display: flex; align-items: center; justify-content: center; }
  .toolbar-btn:hover { background: rgba(255,255,255,0.8); border-color: var(--grid-line); }
  .toolbar-btn.active { background: #fff; border-color: var(--grid-line); box-shadow: inset 0 1px 2px rgba(0,0,0,0.1); }
  .separator { width: 1px; height: 24px; background: var(--grid-line); margin: 0 4px; }
  .toolbar-color-input { width: 0; height: 0; padding: 0; border: none; position: absolute; visibility: hidden; }

  /* Formula Bar */
  #formula-bar { display: flex; align-items: center; background: #fff; border-bottom: 1px solid var(--grid-line); height: 30px; }
  #cell-address { width: 80px; text-align: center; border-right: 1px solid var(--grid-line); border-left: none; border-top: none; border-bottom: none; height: 100%; font-size: 13px; font-weight: bold; outline: none; background: #fff; }
  #fx-icon { padding: 0 8px; color: var(--text-dark); font-style: italic; font-weight: bold; color: var(--excel-green); border-right: 1px solid var(--grid-line); height: 100%; display: flex; align-items: center; }
  #cell-formula { flex: 1; border: none; height: 100%; padding: 0 6px; font-size: 13px; outline: none; background: #fff; }

  /* Grid Container */
  #grid-container { flex: 1; overflow: auto; position: relative; background: #fff; user-select: none; }

  /* Table */
  #grid { border-collapse: collapse; table-layout: fixed; }
  
  /* Headers */
  th { background: var(--header-bg); color: var(--text-dark); font-weight: normal; font-size: 12px; border: 1px solid var(--grid-line); position: sticky; z-index: 2; padding: 0; }
  thead th { top: 0; height: 22px; }
  thead th:first-child { left: 0; z-index: 3; width: 45px; }
  tbody th { left: 0; width: 45px; height: 22px; text-align: center; }
  
  /* Cells */
  td { border: 1px solid var(--grid-line); height: 22px; font-size: 13px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; position: relative; }
  
  /* Selection & Active */
  td.selected { background: var(--selection-blue); }
  td.active { border: 2px solid var(--active-border); outline: none; z-index: 1; background: transparent; padding: 0 3px; }
  th.header-selected { background: #d5e8f4; color: var(--active-border); }

  /* Column Resizer */
  .col-resizer { position: absolute; right: 0; top: 0; width: 4px; height: 100%; cursor: col-resize; z-index: 5; background: transparent; }
  .col-resizer:hover, .col-resizer.resizing { background: var(--active-border); }

  /* Cell Editor Overlay */
  #cell-editor { position: absolute; display: none; border: 2px solid var(--active-border); outline: none; font-size: 13px; font-family: inherit; padding: 0 3px; z-index: 10; background: #fff; resize: none; overflow: hidden; }

  /* Sheet Tabs */
  #sheet-tabs-bar { display: flex; align-items: center; background: var(--header-bg); border-top: 1px solid var(--grid-line); height: 32px; padding-left: 10px; }
  .sheet-tab { padding: 6px 16px; font-size: 12px; border: 1px solid var(--grid-line); border-bottom: none; background: #e6e6e6; margin-right: 2px; cursor: pointer; border-radius: 0 0 3px 3px; position: relative; }
  .sheet-tab.active { background: #fff; border-bottom: 1px solid #fff; font-weight: bold; }
  .add-sheet { border: none; background: none; font-size: 18px; cursor: pointer; margin-left: 5px; color: var(--text-dark); }
  .delete-sheet { position: absolute; top: 2px; right: 2px; font-size: 10px; border-radius: 50%; width: 14px; height: 14px; text-align: center; line-height: 14px; background: #ccc; color: #fff; cursor: pointer; display: none; border: none; }
  .sheet-tab.active .delete-sheet { display: block; }
  .delete-sheet:hover { background: #ff4444; }
  
  /* Tab rename input */
  .tab-rename-input { border: 1px solid var(--active-border); outline: none; font-size: 12px; padding: 0; margin: 0; width: 100%; text-align: center; position: absolute; top: 0; left: 0; height: 100%; }

  /* Context Menu */
  #context-menu { position: absolute; background: #fff; border: 1px solid #ccc; box-shadow: 2px 2px 5px rgba(0,0,0,0.2); padding: 4px 0; z-index: 100; display: none; min-width: 150px; }
  .ctx-item { padding: 6px 15px; font-size: 13px; cursor: pointer; }
  .ctx-item:hover { background: var(--selection-blue); }
</style>
</head>
<body>

<div id="toolbar">
  <button class="toolbar-btn" id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="toolbar-btn" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <div class="separator"></div>
  <button class="toolbar-btn" id="btn-bg-color" title="Background Color">🎨 <span id="color-preview" style="border-bottom: 3px solid #ffff00; width: 12px; height: 12px; display: inline-block; margin-left: 2px;"></span></button>
  <input type="color" id="bg-color-picker" value="#ffff00" class="toolbar-color-input">
  <div class="separator"></div>
  <button class="toolbar-btn" id="btn-clear" title="Clear Contents">🗑️ Clear</button>
  <div class="separator"></div>
  <button class="toolbar-btn" id="btn-csv-dl" title="Download as CSV">📥 CSV</button>
  <button class="toolbar-btn" id="btn-csv-ul" title="Upload CSV">📤 CSV</button>
  <input type="file" id="csv-upload" accept=".csv" style="display: none;">
</div>

<div id="formula-bar">
  <input type="text" id="cell-address" readonly>
  <div id="fx-icon">fx</div>
  <input type="text" id="cell-formula">
</div>

<div id="grid-container">
  <table id="grid"></table>
  <textarea id="cell-editor"></textarea>
</div>

<div id="sheet-tabs-bar">
  <div id="sheet-tabs"></div>
  <button class="add-sheet" title="Add Sheet">+</button>
</div>

<div id="context-menu">
  <div class="ctx-item" data-action="delete">Delete Sheet</div>
  <div class="ctx-item" data-action="rename">Rename Sheet</div>
</div>

<script>
// --- Configuration ---
const ROWS = 100;
const COLS = 26;
const DEFAULT_COL_WIDTH = 80;

// --- Data Structure ---
const workbook = {
  sheets: [ { name: 'Sheet1', cells: {}, colWidths: {} } ],
  activeSheet: 0
};

// --- State ---
let activeCell = {r: 0, c: 0};
let selectionRange = {start: {r:0, c:0}, end: {r:0, c:0}};
let isSelecting = false;
let isEditing = false;
let isEditingFormula = false;
let formulaInsertTarget = null; // Tracks if we are clicking to insert ref in formula
let formulaInsertStart = null; // Tracks range start when dragging in formula mode
let isResizing = false;
let resizeCol = -1;
let resizeStartX = 0;
let resizeStartWidth = 0;
let contextTab = null;

// --- DOM Elements ---
const gridContainer = document.getElementById('grid-container');
const gridTable = document.getElementById('grid');
const cellAddressInput = document.getElementById('cell-address');
const cellFormulaInput = document.getElementById('cell-formula');
const cellEditor = document.getElementById('cell-editor');
const sheetTabsContainer = document.getElementById('sheet-tabs');
const contextMenu = document.getElementById('context-menu');

// --- Utility Functions ---
function colToLetter(c) {
  let s = '';
  while (c >= 0) {
    s = String.fromCharCode(c % 26 + 65) + s;
    c = Math.floor(c / 26) - 1;
  }
  return s;
}

function letterToCol(s) {
  let c = 0;
  for (let i = 0; i < s.length; i++) {
    c = c * 26 + (s.charCodeAt(i) - 64);
  }
  return c - 1;
}

function getCellId(r, c) { return `${colToLetter(c)}${r + 1}`; }

function parseCellId(id) {
  const match = id.match(/^([A-Z]+)(\d+)$/);
  if (!match) return null;
  return { r: parseInt(match[2]) - 1, c: letterToCol(match[1]) };
}

function getCellData(r, c, sheetIdx) {
  if (sheetIdx === undefined) sheetIdx = workbook.activeSheet;
  const id = getCellId(r, c);
  return workbook.sheets[sheetIdx].cells[id] || null;
}

function setCellData(r, c, data, sheetIdx) {
  if (sheetIdx === undefined) sheetIdx = workbook.activeSheet;
  const id = getCellId(r, c);
  if (!workbook.sheets[sheetIdx].cells[id]) {
    workbook.sheets[sheetIdx].cells[id] = { value: '', formula: '', bold: false, italic: false, bgColor: '' };
  }
  Object.assign(workbook.sheets[sheetIdx].cells[id], data);
}

function getCellEl(r, c) {
  return gridTable.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
}

// --- Initialization ---
function initGrid() {
  gridTable.innerHTML = '';
  const thead = document.createElement('thead');
  const tbody = document.createElement('tbody');
  
  // Header row
  const headerRow = document.createElement('tr');
  const cornerTh = document.createElement('th');
  headerRow.appendChild(cornerTh);
  
  for (let c = 0; c < COLS; c++) {
    const th = document.createElement('th');
    const width = workbook.sheets[workbook.activeSheet].colWidths[c] || DEFAULT_COL_WIDTH;
    th.style.width = width + 'px';
    th.style.minWidth = width + 'px';
    th.innerText = colToLetter(c);
    th.dataset.col = c;
    
    // Resizer
    const resizer = document.createElement('div');
    resizer.className = 'col-resizer';
    resizer.addEventListener('mousedown', startResize);
    th.appendChild(resizer);
    
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);
  
  // Body rows
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('tr');
    const rowTh = document.createElement('th');
    rowTh.innerText = r + 1;
    row.appendChild(rowTh);
    
    for (let c = 0; c < COLS; c++) {
      const td = document.createElement('td');
      td.dataset.row = r;
      td.dataset.col = c;
      row.appendChild(td);
    }
    tbody.appendChild(row);
  }
  
  gridTable.appendChild(thead);
  gridTable.appendChild(tbody);
  
  renderSheet();
  setActiveCell(0, 0);
}

// --- Rendering ---
function renderSheet() {
  const sheet = workbook.sheets[workbook.activeSheet];
  for (let id in sheet.cells) {
    const pos = parseCellId(id);
    if (pos && pos.r < ROWS && pos.c < COLS) {
      const el = getCellEl(pos.r, pos.c);
      if (el) {
        const data = sheet.cells[id];
        el.innerText = data.value !== null && data.value !== undefined ? data.value : '';
        el.style.fontWeight = data.bold ? 'bold' : 'normal';
        el.style.fontStyle = data.italic ? 'italic' : 'normal';
        el.style.backgroundColor = data.bgColor || '';
      }
    }
  }
  
  // Reset empty cells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const id = getCellId(r, c);
      const el = getCellEl(r, c);
      if (!sheet.cells[id] && el) {
        el.innerText = '';
        el.style.fontWeight = 'normal';
        el.style.fontStyle = 'normal';
        el.style.backgroundColor = '';
      }
    }
  }
  
  // Apply col widths
  const ths = gridTable.querySelectorAll('thead th[data-col]');
  ths.forEach(th => {
    const c = parseInt(th.dataset.col);
    const width = sheet.colWidths[c] || DEFAULT_COL_WIDTH;
    th.style.width = width + 'px';
    th.style.minWidth = width + 'px';
  });
  
  updateSelectionUI();
}

function updateSelectionUI() {
  // Clear old selections
  gridTable.querySelectorAll('td.selected').forEach(el => el.classList.remove('selected'));
  gridTable.querySelectorAll('td.active').forEach(el => el.classList.remove('active'));
  gridTable.querySelectorAll('th.header-selected').forEach(el => el.classList.remove('header-selected'));
  
  const minR = Math.min(selectionRange.start.r, selectionRange.end.r);
  const maxR = Math.max(selectionRange.start.r, selectionRange.end.r);
  const minC = Math.min(selectionRange.start.c, selectionRange.end.c);
  const maxC = Math.max(selectionRange.start.c, selectionRange.end.c);
  
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const el = getCellEl(r, c);
      if (el) el.classList.add('selected');
    }
  }
  
  const activeEl = getCellEl(activeCell.r, activeCell.c);
  if (activeEl) {
    activeEl.classList.add('active');
  }
  
  // Highlight headers
  for (let c = minC; c <= maxC; c++) {
    const th = gridTable.querySelector(`thead th[data-col="${c}"]`);
    if(th) th.classList.add('header-selected');
  }
  for (let r = minR; r <= maxR; r++) {
    const th = gridTable.querySelector(`tbody tr:nth-child(${r+1}) th`);
    if(th) th.classList.add('header-selected');
  }
  
  updateFormulaBar();
}

function updateFormulaBar() {
  cellAddressInput.value = getCellId(activeCell.r, activeCell.c);
  const data = getCellData(activeCell.r, activeCell.c);
  cellFormulaInput.value = data ? (data.formula || data.value || '') : '';
}

// --- Cell Selection & Editing ---
function setActiveCell(r, c, extend = false) {
  if (isEditing) commitEdit();
  
  r = Math.max(0, Math.min(ROWS - 1, r));
  c = Math.max(0, Math.min(COLS - 1, c));
  
  activeCell.r = r;
  activeCell.c = c;
  
  if (!extend) {
    selectionRange.start = {r, c};
  }
  selectionRange.end = {r, c};
  
  updateSelectionUI();
  scrollToActive();
}

function scrollToActive() {
  const el = getCellEl(activeCell.r, activeCell.c);
  if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function startEdit(initialValue = null) {
  if (isEditing) return;
  isEditing = true;
  
  const el = getCellEl(activeCell.r, activeCell.c);
  if (!el) return;
  
  const rect = el.getBoundingClientRect();
  const containerRect = gridContainer.getBoundingClientRect();
  
  cellEditor.style.display = 'block';
  cellEditor.style.left = (rect.left - containerRect.left + gridContainer.scrollLeft) + 'px';
  cellEditor.style.top = (rect.top - containerRect.top + gridContainer.scrollTop) + 'px';
  cellEditor.style.width = rect.width + 'px';
  cellEditor.style.height = rect.height + 'px';
  
  const data = getCellData(activeCell.r, activeCell.c);
  cellEditor.value = initialValue !== null ? initialValue : (data ? (data.formula || data.value || '') : '');
  
  // Sync formula bar
  cellFormulaInput.value = cellEditor.value;
  
  if (cellEditor.value.startsWith('=')) {
    isEditingFormula = true;
  }
  
  cellEditor.focus();
  if (initialValue !== null) {
    // Cursor at end for new typing
    cellEditor.setSelectionRange(cellEditor.value.length, cellEditor.value.length);
  }
}

function commitEdit() {
  if (!isEditing) return;
  const newVal = cellEditor.value.trim();
  
  const data = getCellData(activeCell.r, activeCell.c) || {};
  
  if (newVal.startsWith('=')) {
    data.formula = newVal;
    data.value = evaluateFormula(newVal.substring(1));
  } else {
    data.formula = '';
    data.value = newVal === '' ? '' : (!isNaN(newVal) && newVal !== '' ? Number(newVal) : newVal);
  }
  
  setCellData(activeCell.r, activeCell.c, data);
  cellEditor.style.display = 'none';
  isEditing = false;
  isEditingFormula = false;
  formulaInsertTarget = null;
  
  recalcSheet();
  renderSheet();
}

function cancelEdit() {
  cellEditor.style.display = 'none';
  isEditing = false;
  isEditingFormula = false;
  formulaInsertTarget = null;
  updateFormulaBar();
}

// --- Formula Evaluation ---
function evaluateFormula(formulaStr) {
  try {
    // Expand ranges first: A1:B2 -> (A1,A2,B1,B2)
    const expanded = formulaStr.replace(/([A-Z]+[0-9]+):([A-Z]+[0-9]+)/gi, (match, start, end) => {
      const s = parseCellId(start.toUpperCase());
      const e = parseCellId(end.toUpperCase());
      if (!s || !e) return '0';
      const minR = Math.min(s.r, e.r), maxR = Math.max(s.r, e.r);
      const minC = Math.min(s.c, e.c), maxC = Math.max(s.c, e.c);
      let refs = [];
      for (let r = minR; r <= maxR; r++) {
        for (let c = minC; c <= maxC; c++) {
          refs.push(getCellId(r, c));
        }
      }
      return refs.join(',');
    });

    // Replace functions
    const funcReplaced = expanded.replace(/(SUM|AVERAGE|MIN|MAX)\(([^)]+)\)/gi, (match, func, argsStr) => {
      const args = argsStr.split(',').map(a => a.trim().toUpperCase());
      let vals = [];
      args.forEach(arg => {
        if (/^[A-Z]+[0-9]+$/.test(arg)) {
          const data = getCellData(parseCellId(arg).r, parseCellId(arg).c);
          const v = data ? Number(data.value) : 0;
          if (!isNaN(v)) vals.push(v);
        }
      });
      
      if (func === 'SUM') return vals.reduce((a, b) => a + b, 0);
      if (func === 'AVERAGE') return vals.length > 0 ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      if (func === 'MIN') return Math.min(...vals);
      if (func === 'MAX') return Math.max(...vals);
      return 0;
    });

    // Replace remaining cell references
    const cellRefReplaced = funcReplaced.replace(/([A-Z]+[0-9]+)/gi, (match) => {
      const pos = parseCellId(match.toUpperCase());
      if (!pos) return '0';
      const data = getCellData(pos.r, pos.c);
      const v = data ? data.value : 0;
      if (v === '' || v === null || v === undefined) return '0';
      return isNaN(v) ? `"${v}"` : Number(v);
    });

    // Safe evaluation
    if (/^[\d\s+\-*/()."]+$/.test(cellRefReplaced)) {
      const result = new Function(`return ${cellRefReplaced}`)();
      return typeof result === 'number' ? Math.round(result * 10000) / 10000 : result;
    }
    return formulaStr; // Fallback
  } catch (e) {
    console.error("Formula Error", e);
    return "#ERROR!";
  }
}

function recalcSheet() {
  const sheet = workbook.sheets[workbook.activeSheet];
  for (let id in sheet.cells) {
    if (sheet.cells[id].formula) {
      sheet.cells[id].value = evaluateFormula(sheet.cells[id].formula.substring(1));
    }
  }
}

// --- Event Listeners ---
// Grid mouse events
gridTable.addEventListener('mousedown', (e) => {
  const td = e.target.closest('td');
  if (!td) return;
  
  const r = parseInt(td.dataset.row);
  const c = parseInt(td.dataset.col);
  
  // If editing formula, clicking inserts reference
  if (isEditingFormula) {
    e.preventDefault();
    formulaInsertStart = {r, c};
    const ref = getCellId(r, c);
    insertFormulaRef(ref);
    return;
  }
  
  // Double click handled separately
  if (e.detail === 1) {
    isSelecting = true;
    setActiveCell(r, c, e.shiftKey); // Shift extends selection
  }
});

gridTable.addEventListener('mouseover', (e) => {
  const td = e.target.closest('td');
  if (!td) return;
  
  const r = parseInt(td.dataset.row);
  const c = parseInt(td.dataset.col);
  
  if (isEditingFormula && formulaInsertStart) {
    const ref = `${getCellId(formulaInsertStart.r, formulaInsertStart.c)}:${getCellId(r, c)}`;
    insertFormulaRef(ref, true); // true = overwrite the last insertion
  } else if (isSelecting) {
    selectionRange.end = {r, c};
    updateSelectionUI();
  }
});

document.addEventListener('mouseup', () => {
  isSelecting = false;
  if (formulaInsertStart) {
    formulaInsertStart = null;
  }
});

gridTable.addEventListener('dblclick', (e) => {
  const td = e.target.closest('td');
  if (!td) return;
  startEdit();
});

// Keyboard Navigation
document.addEventListener('keydown', (e) => {
  if (isResizing) return;
  
  // If inside cell editor
  if (isEditing && document.activeElement === cellEditor) {
    isEditingFormula = cellEditor.value.startsWith('=');
    if (e.key === 'Enter') {
      e.preventDefault();
      commitEdit();
      setActiveCell(activeCell.r + 1, activeCell.c);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      commitEdit();
      setActiveCell(activeCell.r, activeCell.c + (e.shiftKey ? -1 : 1));
    } else if (e.key === 'Escape') {
      cancelEdit();
    }
    // Sync formula bar
    setTimeout(() => { cellFormulaInput.value = cellEditor.value; }, 0);
    return;
  }
  
  // If inside formula bar
  if (document.activeElement === cellFormulaInput) {
    isEditingFormula = cellFormulaInput.value.startsWith('=');
    if (e.key === 'Enter') {
      e.preventDefault();
      const data = getCellData(activeCell.r, activeCell.c) || {};
      const newVal = cellFormulaInput.value.trim();
      if (newVal.startsWith('=')) {
        data.formula = newVal;
        data.value = evaluateFormula(newVal.substring(1));
      } else {
        data.formula = '';
        data.value = newVal === '' ? '' : (!isNaN(newVal) && newVal !== '' ? Number(newVal) : newVal);
      }
      setCellData(activeCell.r, activeCell.c, data);
      recalcSheet();
      renderSheet();
      gridContainer.focus();
    } else if (e.key === 'Escape') {
      updateFormulaBar(); // Revert
      gridContainer.focus();
    }
    return;
  }

  // Grid navigation
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Tab' || e.key === 'Enter') {
    e.preventDefault();
    let nr = activeCell.r, nc = activeCell.c;
    
    if (e.key === 'ArrowDown') nr++;
    else if (e.key === 'ArrowUp') nr--;
    else if (e.key === 'ArrowRight' || e.key === 'Tab') nc += e.shiftKey ? -1 : 1;
    else if (e.key === 'ArrowLeft') nc--;
    else if (e.key === 'Enter') nr += e.shiftKey ? -1 : 1;
    
    setActiveCell(nr, nc, e.ctrlKey || e.shiftKey);
    
  } else if (e.key === 'F2') {
    startEdit();
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    clearSelection();
  } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    // Start editing with typed character
    startEdit(e.key);
  }
});

// Formula reference insertion logic
function insertFormulaRef(ref, isRangeDrag = false) {
  const input = isEditing ? cellEditor : cellFormulaInput;
  if (!isEditing) {
    // Activate editing mode if modifying from formula bar via click
    startEdit(input.value);
  }
  
  let val = cellEditor.value;
  
  if (isRangeDrag && formulaInsertStart) {
    // Remove the single cell ref we just added on mousedown, replace with range
    const lastSpace = val.lastIndexOf(' ') + 1;
    const lastColon = val.lastIndexOf(':');
    // simple hack: if last char is not space or operator, we replace the last word
    val = val.substring(0, val.lastIndexOf(' ') + 1) + ref;
  } else {
    val += ref;
  }
  
  cellEditor.value = val;
  cellFormulaInput.value = val;
  isEditingFormula = true;
}

// Formula Bar sync
cellFormulaInput.addEventListener('focus', () => {
  if (isEditing) commitEdit();
});

// --- Column Resizing ---
function startResize(e) {
  e.preventDefault();
  e.stopPropagation();
  isResizing = true;
  resizeCol = parseInt(e.target.parentElement.dataset.col);
  resizeStartX = e.clientX;
  resizeStartWidth = e.target.parentElement.offsetWidth;
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup', stopResize);
  e.target.classList.add('resizing');
}

function doResize(e) {
  if (!isResizing) return;
  const diff = e.clientX - resizeStartX;
  const newWidth = Math.max(30, resizeStartWidth + diff);
  
  const th = gridTable.querySelector(`thead th[data-col="${resizeCol}"]`);
  if (th) {
    th.style.width = newWidth + 'px';
    th.style.minWidth = newWidth + 'px';
  }
}

function stopResize(e) {
  isResizing = false;
  document.querySelectorAll('.col-resizer').forEach(el => el.classList.remove('resizing'));
  document.removeEventListener('mousemove', doResize);
  document.removeEventListener('mouseup', stopResize);
  
  // Save width
  const th = gridTable.querySelector(`thead th[data-col="${resizeCol}"]`);
  if (th) {
    workbook.sheets[workbook.activeSheet].colWidths[resizeCol] = th.offsetWidth;
  }
}

// --- Toolbar Actions ---
function applyToSelection(prop, value) {
  const minR = Math.min(selectionRange.start.r, selectionRange.end.r);
  const maxR = Math.max(selectionRange.start.r, selectionRange.end.r);
  const minC = Math.min(selectionRange.start.c, selectionRange.end.c);
  const maxC = Math.max(selectionRange.start.c, selectionRange.end.c);
  
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const data = getCellData(r, c) || { value: '', formula: '', bold: false, italic: false, bgColor: '' };
      data[prop] = value;
      setCellData(r, c, data);
    }
  }
  renderSheet();
}

document.getElementById('btn-bold').addEventListener('click', () => {
  const data = getCellData(activeCell.r, activeCell.c);
  const isBold = data ? !data.bold : true;
  applyToSelection('bold', isBold);
  document.getElementById('btn-bold').classList.toggle('active', isBold);
});

document.getElementById('btn-italic').addEventListener('click', () => {
  const data = getCellData(activeCell.r, activeCell.c);
  const isItalic = data ? !data.italic : true;
  applyToSelection('italic', isItalic);
  document.getElementById('btn-italic').classList.toggle('active', isItalic);
});

document.getElementById('btn-bg-color').addEventListener('click', () => {
  document.getElementById('bg-color-picker').click();
});

document.getElementById('bg-color-picker').addEventListener('input', (e) => {
  applyToSelection('bgColor', e.target.value);
  document.getElementById('color-preview').style.borderBottomColor = e.target.value;
});

document.getElementById('btn-clear').addEventListener('click', clearSelection);

function clearSelection() {
  const minR = Math.min(selectionRange.start.r, selectionRange.end.r);
  const maxR = Math.max(selectionRange.start.r, selectionRange.end.r);
  const minC = Math.min(selectionRange.start.c, selectionRange.end.c);
  const maxC = Math.max(selectionRange.start.c, selectionRange.end.c);
  
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      setCellData(r, c, { value: '', formula: '', bold: false, italic: false, bgColor: '' });
    }
  }
  recalcSheet();
  renderSheet();
}

// --- CSV Import/Export ---
document.getElementById('btn-csv-dl').addEventListener('click', () => {
  let csvContent = '';
  for (let r = 0; r < ROWS; r++) {
    let row = [];
    let hasData = false;
    for (let c = 0; c < COLS; c++) {
      const data = getCellData(r, c);
      const val = data ? String(data.value) : '';
      if (val !== '') hasData = true;
      row.push(val.includes(',') ? `"${val}"` : val);
    }
    // Stop if rest of sheet is empty (basic optimization)
    if (!hasData && r > 10) break; 
    csvContent += row.join(',') + '\n';
  }
  
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${workbook.sheets[workbook.activeSheet].name}.csv`;
  link.click();
});

document.getElementById('btn-csv-ul').addEventListener('click', () => {
  document.getElementById('csv-upload').click();
});

document.getElementById('csv-upload').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    const rows = text.split('\n');
    
    // Clear current sheet
    workbook.sheets[workbook.activeSheet].cells = {};
    
    rows.forEach((row, r) => {
      if (r >= ROWS) return;
      // Basic CSV parse (doesn't handle all edge cases like newlines inside quotes)
      const cols = row.split(',');
      cols.forEach((val, c) => {
        if (c >= COLS) return;
        val = val.trim().replace(/^"|"$/g, '');
        if (val !== '') {
          setCellData(r, c, { value: !isNaN(val) && val !== '' ? Number(val) : val, formula: '' });
        }
      });
    });
    
    recalcSheet();
    renderSheet();
  };
  reader.readAsText(file);
  e.target.value = ''; // Reset input
});

// --- Multiple Sheets ---
function renderSheetTabs() {
  sheetTabsContainer.innerHTML = '';
  workbook.sheets.forEach((sheet, idx) => {
    const tab = document.createElement('div');
    tab.className = 'sheet-tab' + (idx === workbook.activeSheet ? ' active' : '');
    tab.innerText = sheet.name;
    tab.dataset.idx = idx;
    
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-sheet';
    delBtn.innerText = '×';
    tab.appendChild(delBtn);
    
    tab.addEventListener('click', (e) => {
      if (e.target === delBtn) return;
      switchSheet(idx);
    });
    
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteSheet(idx);
    });
    
    tab.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      contextTab = idx;
      contextMenu.style.left = e.clientX + 'px';
      contextMenu.style.top = e.clientY + 'px';
      contextMenu.style.display = 'block';
    });
    
    tab.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      startRenameSheet(idx);
    });
    
    sheetTabsContainer.appendChild(tab);
  });
}

function switchSheet(idx) {
  if (isEditing) commitEdit();
  workbook.activeSheet = idx;
  initGrid(); // Rebuilds and renders
  renderSheetTabs();
}

document.querySelector('.add-sheet').addEventListener('click', () => {
  const num = workbook.sheets.length + 1;
  workbook.sheets.push({ name: `Sheet${num}`, cells: {}, colWidths: {} });
  switchSheet(workbook.sheets.length - 1);
});

function deleteSheet(idx) {
  if (workbook.sheets.length <= 1) return; // Can't delete last sheet
  if (confirm(`Delete ${workbook.sheets[idx].name}?`)) {
    workbook.sheets.splice(idx, 1);
    if (workbook.activeSheet >= workbook.sheets.length) {
      workbook.activeSheet = workbook.sheets.length - 1;
    }
    switchSheet(workbook.activeSheet);
  }
}

function startRenameSheet(idx) {
  const tab = sheetTabsContainer.children[idx];
  const currentName = workbook.sheets[idx].name;
  
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'tab-rename-input';
  input.value = currentName;
  
  tab.innerHTML = '';
  tab.appendChild(input);
  input.focus();
  input.select();
  
  const finishRename = () => {
    const newName = input.value.trim() || currentName;
    workbook.sheets[idx].name = newName;
    renderSheetTabs();
  };
  
  input.addEventListener('blur', finishRename);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = currentName; input.blur(); }
  });
}

// Context menu actions
contextMenu.addEventListener('click', (e) => {
  const action = e.target.dataset.action;
  if (contextTab === null) return;
  
  if (action === 'delete') deleteSheet(contextTab);
  if (action === 'rename') startRenameSheet(contextTab);
  
  contextMenu.style.display = 'none';
});

document.addEventListener('click', () => {
  contextMenu.style.display = 'none';
});

// --- Initial Load ---
initGrid();
renderSheetTabs();

</script>
</body>
