<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SheetPro — Spreadsheet</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:#eef1f5;color:#0f172a;-webkit-font-smoothing:antialiased}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace}

  /* ---------- grid ---------- */
  .cell{position:absolute;display:flex;align-items:center;padding:0 5px;border-right:1px solid #e6eaf0;border-bottom:1px solid #e6eaf0;
        font-size:13px;line-height:1.2;color:#1f2937;white-space:nowrap;overflow:hidden;background:transparent}
  .cell.b{font-weight:700}.cell.i{font-style:italic}.cell.u{text-decoration:underline}
  .cell.err{color:#b91c1c}
  .cell.ovf{overflow:visible;z-index:2}
  .tintbox{position:absolute;background:rgba(16,124,65,.11);pointer-events:none}
  .selbox{position:absolute;border:2px solid #107c41;pointer-events:none;z-index:3}
  .focusbox{position:absolute;border:1px solid #107c41;background:rgba(255,255,255,.45);pointer-events:none;z-index:4}
  .pickbox{position:absolute;border:2px dashed #1a73e8;background:rgba(26,115,232,.10);pointer-events:none;z-index:5}
  .picklabel{position:absolute;background:#1a73e8;color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;pointer-events:none;z-index:7;white-space:nowrap;font-weight:600}
  .fillbox{position:absolute;border:1px dashed #107c41;pointer-events:none;z-index:5}
  .fh{position:absolute;width:8px;height:8px;background:#107c41;border:1px solid #fff;z-index:6;cursor:crosshair}
  .cell-editor{position:absolute;display:none;border:2px solid #107c41;padding:0 4px;font-size:13px;line-height:1.2;font-family:inherit;
        outline:none;z-index:20;background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(15,23,42,.18)}
  .hcell{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11px;color:#475569;background:#f7f9fc;
        border-right:1px solid #d9e0ea;border-bottom:1px solid #d9e0ea;user-select:none;cursor:pointer;overflow:hidden}
  .hcell.hl{background:#d8f0e3;color:#0b5a30;font-weight:700}
  .rowh{left:0;width:48px}
  .grip{position:absolute;right:0;top:0;width:7px;height:100%;cursor:col-resize}
  .grip.row{left:0;top:auto;bottom:0;width:100%;height:7px;cursor:row-resize}
  #colHeadWrap{border-bottom:1px solid #cbd5e1}
  #rowHeadWrap{border-right:1px solid #cbd5e1}
  #scroll{border-top:1px solid #e6eaf0;border-left:1px solid #e6eaf0;background:#fff}
  .cfgrip{position:absolute;background:#107c41;width:1px;pointer-events:none;z-index:40;display:none}

  /* ---------- chrome ---------- */
  .tbtn{height:28px;min-width:28px;display:inline-flex;align-items:center;justify-content:center;gap:4px;border:1px solid transparent;border-radius:5px;
        background:transparent;color:#334155;font-size:12.5px;padding:0 6px;cursor:pointer;flex:none}
  .tbtn:hover{background:#eef3f8;border-color:#dbe2ea}
  .tbtn.active{background:#d8f0e3;border-color:#a6d8bf;color:#0b5a30}
  .tbtn:disabled{opacity:.4;cursor:default}
  .tbtn svg{width:15px;height:15px;display:block}
  .tsep{width:1px;height:20px;background:#e2e8f0;margin:0 4px;flex:none}
  .colorbtn{width:28px;height:28px;border-radius:5px;border:1px solid #dbe2ea;display:inline-flex;align-items:flex-end;justify-content:center;
        position:relative;cursor:pointer;overflow:hidden;background:#fff;flex:none}
  .colorbtn:hover{background:#eef3f8}
  .colorbtn input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;border:0;padding:0}
  .colorbtn .lbl{font-size:12px;font-weight:700;line-height:1;padding-bottom:3px;position:relative;z-index:1}
  .colorbtn .bar{position:absolute;left:4px;right:4px;bottom:2px;height:3px;border-radius:2px;background:#111827}
  .tab{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:7px 7px 0 0;font-size:12.5px;color:#334155;
        border:1px solid transparent;cursor:pointer;white-space:nowrap;max-width:190px;background:transparent}
  .tab:hover{background:#eef3f8}
  .tab.active{background:#fff;border-color:#d9e0ea;border-bottom-color:#fff;color:#0b5a30;font-weight:700;box-shadow:inset 0 3px 0 #107c41}
  .tab .tname{overflow:hidden;text-overflow:ellipsis}
  .tab input{width:110px;font:inherit;font-weight:600;border:1px solid #107c41;border-radius:3px;padding:1px 4px;outline:none}
  .menu{position:fixed;z-index:200;background:#fff;border:1px solid #dbe2ea;border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.18);padding:4px;min-width:186px}
  .menu button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:#334155;background:none;border:0;border-radius:5px;cursor:pointer;text-align:left}
  .menu button:hover{background:#f1f5f9}
  .menu button.danger:hover{background:#fee2e2;color:#b91c1c}
  .menu .msplit{height:1px;background:#e8edf3;margin:4px 2px}
  .pop{position:absolute;z-index:150;background:#fff;border:1px solid #dbe2ea;border-radius:10px;box-shadow:0 16px 40px rgba(15,23,42,.2)}
  .kbd{display:inline-block;min-width:20px;text-align:center;padding:1px 5px;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;background:#f8fafc;font-size:11px;font-family:inherit}
  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%) translateY(14px);background:#0f172a;color:#fff;padding:8px 14px;border-radius:8px;
        font-size:12.5px;opacity:0;transition:all .18s ease;z-index:300;pointer-events:none}
  #toast.show{opacity:.96;transform:translateX(-50%) translateY(0)}
  .fnitem{display:flex;flex-direction:column;padding:6px 9px;border-radius:6px;cursor:pointer}
  .fnitem:hover{background:#f1f5f9}
  ::-webkit-scrollbar{width:13px;height:13px}
  ::-webkit-scrollbar-track{background:#f7f9fc}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:7px;border:3px solid #f7f9fc}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}

  /* ---- fallback layout utilities (used if the Tailwind CDN is unavailable) ---- */
  .flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.grid{display:grid}
  .items-center{align-items:center}.place-items-center{place-items:center}.shrink-0{flex-shrink:0}.min-h-0{min-height:0}
  .relative{position:relative}.absolute{position:absolute}
  .overflow-hidden{overflow:hidden}.overflow-auto{overflow:auto}.overflow-x-auto{overflow-x:auto}.overflow-y-hidden{overflow-y:hidden}
  .h-screen{height:100vh}.w-screen{width:100%}.h-11{height:2.75rem}.h-10{height:2.5rem}.h-7{height:1.75rem}.w-7{width:1.75rem}.w-24{width:6rem}.w-40{width:10rem}
  .gap-0\.5{gap:.125rem}.gap-1{gap:.25rem}.gap-2{gap:.5rem}.gap-3{gap:.75rem}.gap-4{gap:1rem}
  .px-2{padding-left:.5rem;padding-right:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}
  .py-1{padding-top:.25rem;padding-bottom:.25rem}.py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
  .p-3{padding:.75rem}.p-4{padding:1rem}
  .bg-white{background:#fff}.text-white{color:#fff}.font-bold{font-weight:700}.rounded{border-radius:.25rem}.rounded-xl{border-radius:.75rem}
  .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .border-t{border-top:1px solid #e2e8f0}.border-b{border-bottom:1px solid #e2e8f0}
  .hid{display:none}
  .show-sm{display:none}.show-md{display:none}
  @media (min-width:640px){.show-sm{display:inline}}
  @media (min-width:768px){.show-md{display:inline}}
</style>
</head>
<body>
<div id="app" class="h-screen w-screen flex flex-col overflow-hidden">

  <!-- ===== app bar ===== -->
  <header class="flex items-center gap-2 px-3 h-11 shrink-0 text-white" style="background:#107c41">
    <div class="w-7 h-7 rounded grid place-items-center font-extrabold text-[15px]" style="background:rgba(255,255,255,.18)">X</div>
    <input id="bookName" spellcheck="false" value="Untitled workbook"
      class="bg-transparent border border-transparent hover:border-white/30 focus:border-white/70 rounded px-2 py-[3px] text-sm font-semibold outline-none w-40 sm:w-52">
    <span class="text-[11px] opacity-80 show-md">Spreadsheet Studio · all local, no backend</span>
    <div class="flex-1"></div>
    <button id="btnHelp" class="text-xs border border-white/30 hover:bg-white/15 rounded px-2 py-1">Functions & shortcuts</button>
  </header>

  <!-- ===== toolbar ===== -->
  <div id="toolbar" class="flex items-center gap-0.5 px-2 py-1.5 bg-white border-b border-slate-200 shrink-0 overflow-x-auto overflow-y-hidden">
    <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↺</button>
    <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Y)">↻</button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnCut" title="Cut (Ctrl+X)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 3.2 8.6 9.4l-1.1 1.5L2.6 4.7z"/><path d="M12 3.2 7.4 9.4l1.1 1.5 4.9-6.2z"/><circle cx="4.2" cy="12.4" r="2"/><circle cx="11.8" cy="12.4" r="2"/></svg></button>
    <button class="tbtn" id="btnCopy" title="Copy (Ctrl+C)"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="9" height="10" rx="1.5" opacity=".55"/><rect x="5" y="4.5" width="9" height="9.5" rx="1.5" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></button>
    <button class="tbtn" id="btnPaste" title="Paste (Ctrl+V)"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 1.5h5a1 1 0 0 1 1 1v.8h-7v-.8a1 1 0 0 1 1-1z"/><rect x="3" y="3.4" width="10" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnB" title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tbtn" id="btnI" title="Italic (Ctrl+I)"><i>I</i></button>
    <button class="tbtn" id="btnU" title="Underline (Ctrl+U)"><u>U</u></button>
    <span class="tsep"></span>
    <label class="colorbtn" title="Text color"><span class="lbl">A</span><span class="bar" id="txtColorBar"></span><input type="color" id="txtColor" value="#111827"></label>
    <label class="colorbtn" title="Fill color"><span class="lbl" style="padding-bottom:2px">▩</span><span class="bar" id="fillColorBar" style="background:#fff6cc"></span><input type="color" id="fillColor" value="#fff6cc"></label>
    <button class="tbtn" id="btnNoFill" title="No fill">∅</button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnAL" title="Align left"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="2" y="7" width="8" height="1.6"/><rect x="2" y="11" width="12" height="1.6"/></svg></button>
    <button class="tbtn" id="btnAC" title="Align center"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="4" y="7" width="8" height="1.6"/><rect x="2" y="11" width="12" height="1.6"/></svg></button>
    <button class="tbtn" id="btnAR" title="Align right"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="3" width="12" height="1.6"/><rect x="6" y="7" width="8" height="1.6"/><rect x="2" y="11" width="12" height="1.6"/></svg></button>
    <span class="tsep"></span>
    <select id="nfSelect" class="tbtn" title="Number format" style="padding:0 4px">
      <option value="general">General</option>
      <option value="number">Number</option>
      <option value="currency">Currency</option>
      <option value="percent">Percent</option>
      <option value="text">Text</option>
    </select>
    <span class="tsep"></span>
    <button class="tbtn" id="btnClear" title="Clear contents (Del)">Clear contents</button>
    <button class="tbtn" id="btnClearFmt" title="Clear formatting">Clear formats</button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnDl" title="Download active sheet as CSV"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.6v7.2l2.7-2.7 1.1 1.1L8 11.1 4.2 7.2l1.1-1.1L8 8.8V1.6z"/><rect x="2" y="12.4" width="12" height="1.8" rx=".6"/></svg>CSV</button>
    <label class="tbtn" title="Upload CSV into the active sheet"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.6l3.8 3.9-1.1 1.1L8 3.9v7.2H6.6V3.9L3.3 6.6 2.2 5.5z"/><rect x="2" y="12.4" width="12" height="1.8" rx=".6"/></svg>CSV<input type="file" id="csvInput" accept=".csv,text/csv" class="hid hidden"></label>
  </div>

  <!-- ===== formula bar ===== -->
  <div class="flex items-center gap-2 px-2 py-[5px] bg-white border-b border-slate-200 shrink-0">
    <input id="nameBox" spellcheck="false" class="w-24 text-center text-[12.5px] border border-slate-300 rounded px-1 py-1 outline-none focus:border-[#107c41]">
    <div class="w-px h-6 bg-slate-200"></div>
    <button id="fxBtn" class="tbtn italic font-semibold text-slate-500" title="Insert function">fx</button>
    <input id="formulaInput" spellcheck="false" placeholder="Enter a value or a formula, e.g. =SUM(A1:A10)"
      class="flex-1 min-w-0 border border-slate-300 rounded px-2 py-1 text-[13px] mono outline-none focus:border-[#107c41] focus:ring-1 focus:ring-[#107c41]/30">
  </div>

  <!-- ===== grid ===== -->
  <div id="gridWrap" class="relative flex-1 min-h-0 bg-white">
    <div id="corner" class="absolute z-30 grid place-items-center" style="top:0;left:0;width:48px;height:26px;background:#eef2f7;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;cursor:pointer">
      <svg viewBox="0 0 12 12" width="11" height="11" fill="#64748b"><path d="M1 8.5 8.5 1h1.5L1.6 9.4z"/><path d="M5 11 11 5v1.6L6.6 11z"/></svg>
    </div>
    <div id="colHeadWrap" class="absolute overflow-hidden z-20" style="top:0;left:48px;right:0;height:26px;background:#f7f9fc">
      <div id="colHead" class="absolute" style="top:0;left:0;height:26px"></div>
    </div>
    <div id="rowHeadWrap" class="absolute overflow-hidden z-20" style="top:26px;left:0;bottom:0;width:48px;background:#f7f9fc">
      <div id="rowHead" class="absolute" style="top:0;left:0;width:48px"></div>
    </div>
    <div id="scroll" tabindex="0" class="absolute overflow-auto outline-none" style="top:26px;left:48px;right:0;bottom:0">
      <div id="sheetPad" style="position:relative">
        <div id="tintLayer" style="position:absolute;top:0;left:0;z-index:1"></div>
        <div id="cellsLayer" style="position:absolute;top:0;left:0;z-index:2"></div>
        <div id="overLayer" style="position:absolute;top:0;left:0;z-index:5"></div>
        <input id="cellEditor" spellcheck="false" autocomplete="off">
      </div>
    </div>
    <div id="cfgrip" class="cfgrip"></div>
  </div>

  <!-- ===== status bar ===== -->
  <div class="h-7 flex items-center gap-3 px-3 bg-slate-100 border-t border-slate-200 text-[11.5px] text-slate-600 shrink-0">
    <span id="statSheet" class="font-semibold text-slate-700">Sheet1</span>
    <span id="statStats" class="truncate"></span>
    <span class="flex-1"></span>
    <span id="statCell" class="show-sm"></span>
    <span class="show-md text-slate-400">Ready</span>
  </div>

  <!-- ===== sheet tabs ===== -->
  <div class="flex items-center gap-1 px-2 h-10 bg-white border-t border-slate-200 shrink-0 overflow-x-auto">
    <button id="addSheet" class="tbtn" title="New sheet">+ New sheet</button>
    <button id="sheetMenuBtn" class="tbtn" title="Sheet actions">⋮</button>
    <div id="tabs" class="flex items-end gap-1 h-full pt-1"></div>
  </div>
</div>

<div id="toast"></div>

<!-- help modal -->
<div id="helpModal" class="hid fixed hidden" style="position:fixed;inset:0;z-index:250;background:rgba(15,23,42,.45);overflow:auto;padding:14px">
  <div class="mx-auto max-w-3xl bg-white rounded-xl shadow-2xl border border-slate-200 overflow-hidden">
    <div class="flex items-center gap-3 px-4 py-3 border-b border-slate-200" style="background:#107c41">
      <span class="text-white font-bold">SheetPro — functions & shortcuts</span>
      <span class="flex-1"></span>
      <button id="helpClose" class="text-white/90 hover:text-white text-sm border border-white/40 rounded px-2 py-0.5">Close</button>
    </div>
    <div class="p-4 grid gap-4 sm:grid-cols-2">
      <div>
        <h3 class="font-bold text-sm mb-2 text-slate-700">Keyboard</h3>
        <div id="helpKeys" class="text-[12.5px] text-slate-600 grid gap-1.5"></div>
      </div>
      <div>
        <h3 class="font-bold text-sm mb-2 text-slate-700">Formulas</h3>
        <p class="text-[12.5px] text-slate-600 mb-2">Start with <span class="mono font-semibold">=</span> — use <span class="mono">+ - * / ^ % &amp;</span>, comparisons, cell refs
          (<span class="mono">=A1+B2*2</span>, <span class="mono">=$A$1</span>, <span class="mono">Sheet2!A1</span>) and ranges (<span class="mono">=A1:A10</span>).
          While typing a formula you can <b>click or drag cells</b> to insert their address.</p>
        <div id="helpFns" class="text-[12px] mono text-slate-600 max-h-64 overflow-auto rounded border border-slate-200 p-2 bg-slate-50"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ==========================================================================
   PART A — constants, utilities, formula engine, workbook model
   ========================================================================== */
const ROWS = 400, COLS = 26, DEF_W = 96, DEF_H = 26;
const $id = s => document.getElementById(s);
const clampN = (v, a, b) => v < a ? a : (v > b ? b : v);
const escH = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));

function colName(c) { let s = ""; c = Math.floor(c); while (c >= 0) { s = String.fromCharCode(65 + (c % 26)) + s; c = Math.floor(c / 26) - 1; } return s; }
function lettersToCol(s) { let v = 0; for (let i = 0; i < s.length; i++) v = v * 26 + (s.toUpperCase().charCodeAt(i) - 64); return v - 1; }
function refName(r, c) { return colName(c) + (r + 1); }
function parseRef(s) {
  const m = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,7})$/.exec(String(s).trim());
  if (!m) return null;
  const c = lettersToCol(m[1]), r = parseInt(m[2], 10) - 1;
  if (r < 0 || c < 0) return null;
  return { r, c, key: colName(c) + (r + 1) };
}

/* ---------- error values / number helpers ---------- */
const CErr = code => ({ __err: code });
const isErr = v => v !== null && typeof v === "object" && !Array.isArray(v) && "__err" in v;
function fmtGeneral(v) {
  if (!isFinite(v)) return String(v);
  if (Number.isInteger(v)) { if (Math.abs(v) >= 1e15) return v.toExponential(6); return String(v); }
  return String(parseFloat(v.toPrecision(11)));
}
const fmtNumber = v => v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtCurrency = v => v.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtPercent = v => (v * 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%";

/* ==========================================================================
   Formula engine: tokenizer -> parser -> evaluator + function library
   ========================================================================== */
const RE_REF = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,7})$/;
const isDigit = ch => ch >= "0" && ch <= "9";

function tokenize(src) {
  const T = []; let i = 0; const n = src.length;
  while (i < n) {
    const ch = src[i];
    if (ch === " " || ch === "\t" || ch === "\r" || ch === "\n") { i++; continue; }
    if (isDigit(ch) || (ch === "." && isDigit(src[i + 1] || ""))) {
      let j = i;
      while (j < n && isDigit(src[j])) j++;
      if (src[j] === ".") { j++; while (j < n && isDigit(src[j])) j++; }
      if ((src[j] === "e" || src[j] === "E") && (isDigit(src[j + 1] || "") || ((src[j + 1] === "+" || src[j + 1] === "-") && isDigit(src[j + 2] || "")))) {
        j += 2; while (j < n && isDigit(src[j])) j++;
      }
      T.push({ type: "num", value: parseFloat(src.slice(i, j)) }); i = j; continue;
    }
    if (ch === '"') {
      let j = i + 1, out = "";
      while (j < n) { if (src[j] === '"') { if (src[j + 1] === '"') { out += '"'; j += 2; continue; } j++; break; } out += src[j++]; }
      T.push({ type: "str", value: out }); i = j; continue;
    }
    if (ch === "'") {
      let j = i + 1, out = "";
      while (j < n && src[j] !== "'") out += src[j++];
      j++;
      if (src[j] === "!") { T.push({ type: "sheet", value: out }); i = j + 1; continue; }
      T.push({ type: "str", value: out }); i = j; continue;
    }
    if (/[A-Za-z_$]/.test(ch) || ch.charCodeAt(0) > 127) {
      let j = i;
      while (j < n && (/[A-Za-z0-9_$.]/.test(src[j]) || src[j].charCodeAt(0) > 127)) j++;
      const word = src.slice(i, j);
      if (src[j] === "!") { T.push({ type: "sheet", value: word }); i = j + 1; continue; }

function gridKeys(e) {
  const k = e.key, mod = e.ctrlKey || e.metaKey, f = wb.focus;
  if (mod && !e.altKey) {
    const kk = k.toLowerCase();
    if (kk === "z") { e.preventDefault(); doUndo(); return; }
    if (kk === "y") { e.preventDefault(); doRedo(); return; }
    if (kk === "b") { e.preventDefault(); toggleStyle("b"); return; }
    if (kk === "i") { e.preventDefault(); toggleStyle("i"); return; }
    if (kk === "u") { e.preventDefault(); toggleStyle("u"); return; }
    if (kk === "c") { e.preventDefault(); copySel(false); return; }
    if (kk === "x") { e.preventDefault(); copySel(true); return; }
    if (kk === "v") { if (clip.data) { e.preventDefault(); pasteClip(); } return; }
    if (kk === "a") { e.preventDefault(); selectAll(); return; }
    if (kk === "s") { e.preventDefault(); downloadCSV(); return; }
    if (kk === "home") { e.preventDefault(); applyFocus(0, 0, false); return; }

    case "ArrowLeft": e.preventDefault(); mod ? ctrlMove(0, -1, e.shiftKey) : moveRel(0, -1, e.shiftKey); return;
    case "ArrowRight": e.preventDefault(); mod ? ctrlMove(0, 1, e.shiftKey) : moveRel(0, 1, e.shiftKey); return;
    case "Enter": e.preventDefault(); if (editing) commitEdit(null); else startEdit(f.r, f.c, { caretEnd: true }); return;
    case "Tab": e.preventDefault(); moveRel(0, e.shiftKey ? -1 : 1, e.shiftKey); return;
    case "F2": e.preventDefault(); if (editing) commitEdit(null); else startEdit(f.r, f.c, { caretEnd: true }); return;
    case "Delete": case "Backspace": e.preventDefault(); clearContents(); return;
    case "Home": e.preventDefault(); applyFocus(f.r, 0, e.shiftKey); return;
    case "End": e.preventDefault(); { const u = usedRange(activeSheet()); applyFocus(u.r, u.c, e.shiftKey); } return;
    case "PageDown": e.preventDefault(); moveRel(22, 0, e.shiftKey); return;
    case "PageUp": e.preventDefault(); moveRel(-22, 0, e.shiftKey); return;
    case "Escape": e.preventDefault(); return;
  }

function loadCSVText(text, fname) {
  pushUndo();
  const s = activeSheet();
  s.cells = {};
  s.colW = new Array(COLS).fill(DEF_W);
  const rows = parseCSV(text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n"));
  let maxC = 0;
  rows.slice(0, ROWS).forEach((row, r) => {
    row.slice(0, COLS).forEach((raw, c) => {
      const val = raw == null ? "" : String(raw);
      if (val === "") return;
      maxC = Math.max(maxC, c);
      const cell = {};
      if (val.charAt(0) === "=") cell.v = val;
      else {
        const num = Number(val.replace(/,/g, ""));
        cell.v = (val.trim() !== "" && !isNaN(num)) ? num : val;
      }
      s.cells[refName(r, c)] = cell;
    });
  });
  for (let c = 0; c <= maxC; c++) {
    let w = DEF_W;
    for (let r = 0; r < Math.min(rows.length, 300); r++) {
      const v = rows[r] && rows[r][c];
      if (v) w = Math.max(w, Math.min(340, measureText(String(v)) + 22));
    }
    s.colW[c] = Math.round(w);
  }
  markSizes(s); markRecalc();
  if (fname) { wb.name = fname.replace(/\.csv$/i, ""); bookNameEl.value = wb.name; }
  wb.sel = [{ r1: 0, c1: 0, r2: Math.min(ROWS - 1, rows.length - 1), c2: Math.max(0, maxC) }];
  wb.focus = { r: 0, c: 0 }; wb.anchor = { r: 0, c: 0 };
  scrollEl.scrollTop = 0; scrollEl.scrollLeft = 0;
  refreshAll();
  toast("Imported " + rows.length + " row(s) into " + s.name);
}

  btn.innerHTML = "<input value=\"" + escH(old) + "\">";

  let done = false;
  const finish = save => {

}

/* ---------- help ---------- */
function buildHelp() {
  const keys = [
    ["Type text", "start editing the cell"], ["Enter / Tab", "commit & move down / right"],
    ["Shift+Enter / Tab", "commit & move up / left"], ["Arrows", "move · Shift+Arrows extends the selection"],
    ["Ctrl+Arrows", "jump to edge of data"], ["F2", "edit the active cell"],
    ["Double-click", "edit a cell"], ["Delete", "clear contents"],
    ["Esc", "cancel the edit"], ["Ctrl+B / I / U", "bold / italic / underline"],
    ["Ctrl+C / X / V", "copy / cut / paste (refs adjust)"], ["Ctrl+Z / Y", "undo / redo"],
    ["Ctrl+A", "select all"], ["Ctrl+Home / End", "go to A1 / last used cell"],
    ["Drag fill handle", "fill the selection (formulas adjust)"], ["Click while writing a formula", "insert cell reference"]
  ];
  $id("helpKeys").innerHTML = keys.map(k => "<div class=\"flex gap-2 items-baseline\"><span class=\"shrink-0\">" + k[0].split(" / ").map(x => "<span class=\"kbd\">" + escH(x) + "</span>").join(" or ") + "</span><span>" + escH(k[1]) + "</span></div>").join("");
  $id("helpFns").innerHTML = Object.keys(FX).sort().map(n => "<div><b>" + n + "</b>(" + (FX[n].d || "") + ")</div>").join("");
}
function setModal(show) {
  const m = $id("helpModal");
  m.classList.toggle("hidden", !show);
  m.classList.toggle("hid", !show);
}
function modalOpen() { return !$id("helpModal").classList.contains("hid"); }
$id("btnHelp").addEventListener("click", () => setModal(true));
$id("helpClose").addEventListener("click", () => setModal(false));
$id("helpModal").addEventListener("click", e => { if (e.target === $id("helpModal")) setModal(false); });

/* ---------- toolbar wiring ---------- */
$id("btnUndo").onclick = doUndo;
$id("btnRedo").onclick = doRedo;
$id("btnCut").onclick = () => copySel(true);
$id("btnCopy").onclick = () => copySel(false);
$id("btnPaste").onclick = pasteClip;
$id("btnB").onclick = () => toggleStyle("b");
$id("btnI").onclick = () => toggleStyle("i");
$id("btnU").onclick = () => toggleStyle("u");
$id("txtColor").addEventListener("input", e => { $id("txtColorBar").style.background = e.target.value; });
$id("txtColor").addEventListener("change", e => applyStyle("fg", e.target.value));
$id("fillColor").addEventListener("input", e => { $id("fillColorBar").style.background = e.target.value; });
$id("fillColor").addEventListener("change", e => applyStyle("bg", e.target.value));
$id("btnNoFill").onclick = () => applyStyle("bg", null);
$id("btnAL").onclick = () => applyStyle("al", "l");
$id("btnAC").onclick = () => applyStyle("al", "c");
$id("btnAR").onclick = () => applyStyle("al", "r");
$id("nfSelect").onchange = e => applyStyle("nf", e.target.value === "general" ? null : e.target.value);
$id("btnClear").onclick = clearContents;
$id("btnClearFmt").onclick = clearFormats;
$id("btnDl").onclick = downloadCSV;
bookNameEl.addEventListener("input", () => { wb.name = bookNameEl.value; });

/* ---------- demo content + boot ---------- */
function seedDemo(sheet) {
  const set = (addr, v, style) => { const cell = { v }; if (style) Object.assign(cell, style); sheet.cells[addr] = cell; };
  const head = { b: true, bg: "#d8f0e3", al: "c" };
  set("A1", "Product", head); set("B1", "Units", head); set("C1", "Unit price", head); set("D1", "Revenue", head); set("E1", "% of total", head);
  const rows = [["Widgets", 120, 4.5], ["Gadgets", 86, 12.25], ["Doohickeys", 214, 1.75], ["Sprockets", 58, 9]];
  rows.forEach((row, i) => {
    const r = i + 2;
    set("A" + r, row[0]);
    set("B" + r, row[1], { al: "c" });
    set("C" + r, row[2], { nf: "currency" });
    set("D" + r, "=B" + r + "*C" + r, { nf: "currency" });
    set("E" + r, "=D" + r + "/$D$6", { nf: "percent" });
  });
  set("A6", "Total", { b: true });
  set("B6", "=SUM(B2:B5)", { b: true, al: "c" });
  set("D6", "=SUM(D2:D5)", { b: true, nf: "currency" });
  set("E6", "=SUM(E2:E5)", { b: true, nf: "percent" });
  set("A8", "Quick stats", { b: true, i: true });
  set("A9", "Average unit price"); set("B9", "=AVERAGE(C2:C5)", { nf: "currency" });
  set("A10", "Best revenue"); set("B10", "=MAX(D2:D5)", { nf: "currency" });
  set("A11", "Lowest units"); set("B11", "=MIN(B2:B5)", { al: "c" });
  set("A12", "Products counted"); set("B12", "=COUNT(D2:D5)", { al: "c" });
  set("A13", "Units over 100"); set("B13", "=SUMIF(B2:B5,\">100\")", { al: "c" });
  set("D9", "=IF(D6>500,\"Target met ✓\",\"Below target\")", { b: true, fg: "#0b5a30" });
  set("A15", "Tip: type = in a cell or the formula bar, then click/drag cells to insert references.", { i: true, fg: "#475569" });
  sheet.colW[0] = 150; sheet.colW[1] = 82; sheet.colW[2] = 108; sheet.colW[3] = 118; sheet.colW[4] = 112;
  markSizes(sheet);
}
function init() {
  const s1 = newSheet("Sales Q1"); seedDemo(s1);
  const s2 = newSheet("Sheet2");
  wb.sheets = [s1, s2];
  wb.active = 0;
  bookNameEl.value = wb.name;
  $id("txtColorBar").style.background = $id("txtColor").value;
  $id("fillColorBar").style.background = $id("fillColor").value;
  markRecalc();
  buildHelp();
  refreshAll();
  ensureVisible(0, 0);
  scrollEl.focus({ preventScroll: true });
  setTimeout(() => toast("Welcome to SheetPro — type a value or =formula"), 400);
}
init();

</script>
