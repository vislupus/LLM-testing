<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Clone - Standalone</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#f8f8f8;color:#1a1a1a;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#titlebar{height:36px;background:#107c41;display:flex;align-items:center;padding:0 16px;color:white;gap:10px;font-size:14px;font-weight:600;flex-shrink:0}
#toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 12px;background:#f3f2f1;border-bottom:1px solid #e1dfdd;align-items:center;flex-shrink:0}
.tb-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid #e1dfdd;margin-right:4px}
.tb-btn{height:32px;min-width:32px;padding:0 10px;border:1px solid transparent;border-radius:4px;background:transparent;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;user-select:none}
.tb-btn:hover{background:#e8e8e8;border-color:#d0d0d0}
.tb-btn.active{background:#107c41;color:white}
#formulaBar{display:flex;gap:8px;padding:6px 12px;background:#f3f2f1;border-bottom:1px solid #d4d4d4;align-items:center;flex-shrink:0}
#nameBox{width:80px;padding:6px 8px;border:1px solid #d4d4d4;border-radius:3px;background:white;font-size:13px;font-family:Consolas,monospace}
#formulaInput{flex:1;padding:6px 10px;border:1px solid #d4d4d4;border-radius:3px;font-size:14px;font-family:Consolas,monospace;outline:none}
#formulaInput:focus{border-color:#107c41;box-shadow:0 0 0 1px #107c41}
#gridContainer{flex:1;overflow:auto;position:relative;background:#fff}
#grid{position:relative;min-width:max-content}
#headerRow{display:flex;position:sticky;top:0;z-index:5;background:#f3f2f1}
#corner{width:46px;min-width:46px;height:26px;background:#f3f2f1;border:1px solid #d4d4d4;display:flex;align-items:center;justify-content:center;position:sticky;left:0;top:0;z-index:6;cursor:pointer}
#colHeaders{display:flex}
.colHeader{height:26px;border:1px solid #d4d4d4;background:#f3f2f1;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative;user-select:none;cursor:pointer}
.col-resizer{position:absolute;right:0;top:0;width:6px;height:100%;cursor:col-resize}
#bodyRow{display:flex}
#rowHeaders{position:sticky;left:0;z-index:4;background:#f3f2f1;display:flex;flex-direction:column}
.rowHeader{width:46px;min-width:46px;height:26px;border:1px solid #d4d4d4;border-top:none;background:#f3f2f1;display:flex;align-items:center;justify-content:center;font-size:12px;user-select:none}
#cells{display:flex;flex-direction:column}
.row{display:flex}
.cell{height:26px;border-right:1px solid #e1dfdd;border-bottom:1px solid #e1dfdd;background:white;padding:0 6px;font-size:13px;line-height:24px;overflow:hidden;white-space:nowrap;user-select:none;cursor:cell;flex-shrink:0}
.cell.selected{background:#e8f0ff}
.cell.active{outline:2px solid #107c41;outline-offset:-2px;z-index:2}
.cell.bold{font-weight:700}.cell.italic{font-style:italic}.cell.error{color:#a80000;background:#fde7e9}
.cell-editor{position:absolute;z-index:20;border:2px solid #107c41;background:white;padding:0 6px;font-size:13px;outline:none;box-shadow:0 2px 6px rgba(0,0,0,0.2)}
#sheetBar{height:38px;background:#f3f2f1;border-top:1px solid #e1dfdd;display:flex;align-items:center;padding:0 12px;gap:4px;flex-shrink:0}
.sheetTab{height:28px;padding:0 16px;border:1px solid transparent;border-radius:4px 4px 0 0;cursor:pointer;font-size:13px;user-select:none;position:relative}
.sheetTab.active{background:white;border-color:#e1dfdd;color:#107c41;font-weight:600}
.sheetTab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:2px;background:#107c41}
</style>
</head>
<body>
<div id="titlebar">Excel Clone — Standalone (No backend • Auto-recalc • Click-to-insert refs)</div>
<div id="toolbar">
  <div class="tb-group"><button class="tb-btn" id="btnBold"><b>B</b></button><button class="tb-btn" id="btnItalic"><i>I</i></button></div>
  <div class="tb-group"><button class="tb-btn" id="btnBgColor">Fill <input type="color" id="colorPicker" style="width:0;height:0;opacity:0"></button><select id="fontSizeSel"><option>13</option><option>10</option><option>12</option><option>14</option><option>16</option></select></div>
  <div class="tb-group"><button class="tb-btn" id="btnClear">Clear</button></div>
  <div class="tb-group"><button class="tb-btn" id="btnDownload">Download CSV</button><button class="tb-btn" id="btnUpload">Upload CSV</button><input type="file" id="csvFileInput" accept=".csv" style="display:none"></div>
  <span style="margin-left:auto;font-size:12px;color:#666">Tip: Type = in fx bar then click/drag cells to insert</span>
</div>
<div id="formulaBar"><input id="nameBox" readonly><span>fx</span><input id="formulaInput" placeholder="=A1+B2 or =SUM(A1:A10)"></div>
<div id="gridContainer"><div id="grid"><div id="headerRow"><div id="corner">◫</div><div id="colHeaders"></div></div><div id="bodyRow"><div id="rowHeaders"></div><div id="cells"></div></div></div></div>
<div id="sheetBar"><div id="sheetTabs"></div><button id="addSheetBtn">+</button></div>
<script>
/* Full JS engine — supports =A1+B2, SUM/AVERAGE/MIN/MAX, ranges, auto-recalc, click-to-insert, resizing, sheets, CSV */
const ROWS=200,COLS=60;let sheets=[],activeSheetIdx=0,activeCell={row:0,col:0},selection={startRow:0,startCol:0,endRow:0,endCol:0},isMouseDown=false,isPicking=false,pickingStart=null,pickingInsertPos=null,pickingLastLen=0,colWidths={},cellEditor=null,activeFormulaInput=null;
function colToLetter(c){let s='';c++;while(c>0){let m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}function letterToCol(l){let col=0;for(let i=0;i<l.length;i++){col=col*26+(l.charCodeAt(i)-64);}return col-1;}function parseId(id){if(!id) return null;id=id.toUpperCase().replace(/\$/g,'').trim();const m=id.match(/^([A-Z]+)(\d+)$/);if(!m) return null;return {col:letterToCol(m[1]),row:parseInt(m[2],10)-1};}function cellId(r,c){return colToLetter(c)+(r+1);}
function createEmptySheet(n){return {id:Date.now()+Math.random(),name:n,data:{},colWidths:{}};}function getSheet(){return sheets[activeSheetIdx];}function getCellData(s,r,c){return s.data[r+','+c]||null;}function setCellData(s,r,c,o){const k=r+','+c;if(!o||(o.v===''&&!o.f&&(!o.style||Object.keys(o.style).length===0))) delete s.data[k];else s.data[k]=o;}
function evaluateCell(sheet,r,c,vis){const k=r+','+c;if(vis.has(k)) return '#CIRC!';const cell=getCellData(sheet,r,c);if(!cell) return '';if(!cell.f||!cell.f.startsWith('=')) return cell.v??'';return evaluateFormula(sheet,cell.f,r,c,vis);}
function evaluateFormula(sheet,formula,curR,curC,visited){
 if(!formula.startsWith('=')) return formula;let expr=formula.slice(1).trim();if(!expr) return '';const curKey=curR+','+curC;if(visited.has(curKey)) return '#CIRC!';visited.add(curKey);
 const getNum=(r,c)=>{const k=r+','+c;if(visited.has(k)) throw new Error('CIRC');const d=getCellData(sheet,r,c);if(!d) return 0;if(d.f&&d.f.startsWith('=')){const v=evaluateFormula(sheet,d.f,r,c,new Set(visited));if(typeof v==='string'&&v.startsWith('#')) throw new Error(v);return isNaN(parseFloat(v))?0:parseFloat(v);}return isNaN(parseFloat(d.v))?0:parseFloat(d.v);};
 const getNumOrNull=(r,c)=>{const d=getCellData(sheet,r,c);if(!d) return null;if(d.f&&d.f.startsWith('=')){try{const v=evaluateFormula(sheet,d.f,r,c,new Set(visited));if(typeof v==='string'&&v.startsWith('#')) return null;const n=parseFloat(v);return isNaN(n)?null:n;}catch{return null;}}if(d.v===''||d.v==null) return null;const n=parseFloat(d.v);return isNaN(n)?null:n;};
 try{
  const funcRe=/(SUM|AVERAGE|MIN|MAX)\s*\(([^()]*)\)/gi;let m,loop=0;while((m=funcRe.exec(expr))!==null&&loop<50){const full=m[0],fn=m[1].toUpperCase(),args=m[2].split(',').map(s=>s.trim()).filter(Boolean);let vals=[];for(let arg of args){arg=arg.replace(/\$/g,'');if(arg.includes(':')){const p=arg.split(':');const s=parseId(p[0]),e=parseId(p[1]);if(!s||!e) continue;const r1=Math.min(s.row,e.row),r2=Math.max(s.row,e.row),c1=Math.min(s.col,e.col),c2=Math.max(s.col,e.col);for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const nv=getNumOrNull(r,c);if(nv!==null) vals.push(nv);}}else if(/^[A-Z]+\d+$/i.test(arg)){const p=parseId(arg);if(p){const nv=getNumOrNull(p.row,p.col);if(nv!==null) vals.push(nv);}}else{const n=parseFloat(arg);if(!isNaN(n)) vals.push(n);}}let res=0;if(fn==='SUM') res=vals.reduce((a,b)=>a+b,0);else if(fn==='AVERAGE') res=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;else if(fn==='MIN') res=vals.length?Math.min(...vals):0;else if(fn==='MAX') res=vals.length?Math.max(...vals):0;expr=expr.slice(0,m.index)+res+expr.slice(m.index+full.length);funcRe.lastIndex=0;loop++;}
  expr=expr.replace(/\$?([A-Z]+)\$?(\d+)/gi,(mm,cl,rn)=>{const p=parseId(cl+rn);if(!p) return '0';if(p.row===curR&&p.col===curC) throw new Error('CIRC');return getNum(p.row,p.col);});
  const cleaned=expr.replace(/\s+/g,'');if(!cleaned) return 0;if(!/^[\d\.\+\-\*\/\(\)\^\%]+$/.test(cleaned)) return '#NAME?';const result=Function('"use strict";return ('+cleaned.replace(/\^/g,'**')+')')();if(!isFinite(result)) return '#DIV/0!';return result;
 }catch(e){const msg=e.message||'';if(msg.includes('CIRC')) return '#CIRC!';if(msg.startsWith('#')) return msg;return '#ERR!';}
}
function getDisplayValue(s,r,c){const d=getCellData(s,r,c);if(!d) return '';if(d.f&&d.f.startsWith('=')) return evaluateCell(s,r,c,new Set());return d.v;}
function getColWidth(c){return colWidths[c]||getSheet().colWidths[c]||80;}
function renderHeaders(){const ch=document.getElementById('colHeaders'),rh=document.getElementById('rowHeaders');ch.innerHTML='';rh.innerHTML='';for(let c=0;c<COLS;c++){const w=getColWidth(c),div=document.createElement('div');div.className='colHeader';div.style.width=w+'px';div.style.minWidth=w+'px';div.dataset.col=c;div.textContent=colToLetter(c);const rs=document.createElement('div');rs.className='col-resizer';rs.dataset.col=c;div.appendChild(rs);ch.appendChild(div);}for(let r=0;r<ROWS;r++){const d=document.createElement('div');d.className='rowHeader';d.dataset.row=r;d.textContent=r+1;rh.appendChild(d);}}
function renderCells(){const ce=document.getElementById('cells');ce.innerHTML='';const sh=getSheet(),frag=document.createDocumentFragment();for(let r=0;r<ROWS;r++){const rd=document.createElement('div');rd.className='row';for(let c=0;c<COLS;c++){const w=getColWidth(c),cd=document.createElement('div');cd.className='cell';cd.dataset.row=r;cd.dataset.col=c;cd.style.width=w+'px';cd.style.minWidth=w+'px';let disp=getDisplayValue(sh,r,c);if(typeof disp==='number') disp=disp.toString();cd.textContent=disp;const data=getCellData(sh,r,c);if(data&&data.style){if(data.style.bold) cd.classList.add('bold');if(data.style.italic) cd.classList.add('italic');if(data.style.bg) cd.style.background=data.style.bg;}const r1=Math.min(selection.startRow,selection.endRow),r2=Math.max(selection.startRow,selection.endRow),c1=Math.min(selection.startCol,selection.endCol),c2=Math.max(selection.startCol,selection.endCol);if(r>=r1&&r<=r2&&c>=c1&&c<=c2) cd.classList.add('selected');if(r===activeCell.row&&c===activeCell.col) cd.classList.add('active');rd.appendChild(cd);}frag.appendChild(rd);}ce.appendChild(frag);document.getElementById('nameBox').value=cellId(activeCell.row,activeCell.col);const d=getCellData(sh,activeCell.row,activeCell.col);const fi=document.getElementById('formulaInput');if(document.activeElement!==fi) fi.value=d?(d.f?d.f:d.v):'';}
function fullRender(){renderHeaders();renderCells();renderTabs();}
function renderTabs(){const c=document.getElementById('sheetTabs');c.innerHTML='';sheets.forEach((sh,i)=>{const t=document.createElement('div');t.className='sheetTab'+(i===activeSheetIdx?' active':'');t.dataset.idx=i;t.textContent=sh.name;c.appendChild(t);});}
function setActiveCell(r,c,ext){r=Math.max(0,Math.min(ROWS-1,r));c=Math.max(0,Math.min(COLS-1,c));if(!ext){activeCell={row:r,col:c};selection={startRow:r,startCol:c,endRow:r,endCol:c};}else{activeCell={row:r,col:c};selection.endRow=r;selection.endCol=c;}fullRender();}
function startEditCell(r,c,ch=''){const cellEl=document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);if(!cellEl) return;if(cellEditor) cellEditor.remove();const w=getColWidth(c);const inp=document.createElement('input');inp.className='cell-editor';const d=getCellData(getSheet(),r,c);let init=d?(d.f?d.f:d.v):'';if(ch&&ch.length===1) init=ch;inp.value=init;inp.style.left=cellEl.offsetLeft+'px';inp.style.top=cellEl.offsetTop+'px';inp.style.width=w+'px';inp.style.height='26px';inp.dataset.row=r;inp.dataset.col=c;document.getElementById('cells').appendChild(inp);cellEditor=inp;activeFormulaInput=inp;setTimeout(()=>{inp.focus();inp.select();},0);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();commitEdit();setActiveCell(r+1,c);}else if(e.key==='Tab'){e.preventDefault();commitEdit();setActiveCell(r,c+1);}else if(e.key==='Escape'){inp.remove();cellEditor=null;fullRender();}});inp.addEventListener('blur',commitEdit);}
function commitEdit(){if(!cellEditor) return;const r=parseInt(cellEditor.dataset.row),c=parseInt(cellEditor.dataset.col),val=cellEditor.value,sh=getSheet(),ex=getCellData(sh,r,c)||{style:{}};let nd={...ex};if(val.startsWith('=')){nd.f=val;nd.v='';}else{nd.v=val;nd.f=null;}if(val===''&&(!nd.style||Object.keys(nd.style).length===0)) setCellData(sh,r,c,null);else setCellData(sh,r,c,nd);cellEditor.remove();cellEditor=null;activeFormulaInput=null;fullRender();}
const formulaInput=document.getElementById('formulaInput');
formulaInput.addEventListener('focus',()=>{activeFormulaInput=formulaInput;if(formulaInput.value.startsWith('=')) isPicking=true;});
formulaInput.addEventListener('input',()=>{const sh=getSheet(),r=activeCell.row,c=activeCell.col,ex=getCellData(sh,r,c)||{style:{}};let nd={...ex};if(formulaInput.value.startsWith('=')){nd.f=formulaInput.value;nd.v='';}else{nd.v=formulaInput.value;nd.f=null;}setCellData(sh,r,c,nd);});
formulaInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const sh=getSheet(),r=activeCell.row,c=activeCell.col,ex=getCellData(sh,r,c)||{style:{}};let nd={...ex};if(formulaInput.value.startsWith('=')){nd.f=formulaInput.value;nd.v='';}else{nd.v=formulaInput.value;nd.f=null;}setCellData(sh,r,c,nd);fullRender();setActiveCell(r+1,c);}});
document.getElementById('gridContainer').addEventListener('mousedown',e=>{
 if(e.target.classList.contains('col-resizer')) return;
 const cellEl=e.target.closest('.cell');
 if(cellEl&&activeFormulaInput&&activeFormulaInput.value.startsWith('=')){
  e.preventDefault();isMouseDown=true;const r=parseInt(cellEl.dataset.row),c=parseInt(cellEl.dataset.col);pickingStart={row:r,col:c};pickingInsertPos=activeFormulaInput.selectionStart;pickingLastLen=0;const ref=cellId(r,c);const inp=activeFormulaInput, s=inp.selectionStart;inp.value=inp.value.slice(0,s)+ref+inp.value.slice(s);pickingLastLen=ref.length;inp.focus();return;
 }
 if(cellEl){const r=parseInt(cellEl.dataset.row),c=parseInt(cellEl.dataset.col);if(e.detail===2){startEditCell(r,c);return;}isMouseDown=true;setActiveCell(r,c,e.shiftKey);e.preventDefault();}
});
document.addEventListener('mousemove',e=>{
 if(window._resizingCol!=null){const col=window._resizingCol,newW=Math.max(40,window._resizingStartW+(e.clientX-window._resizingStartX));colWidths[col]=newW;getSheet().colWidths[col]=newW;document.querySelectorAll(`[data-col="${col}"]`).forEach(el=>{el.style.width=newW+'px';el.style.minWidth=newW+'px';});return;}
 if(!isMouseDown) return;const ce=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(ce&&activeFormulaInput&&isPicking){const r=parseInt(ce.dataset.row),c=parseInt(ce.dataset.col);if(pickingStart){const id1=cellId(pickingStart.row,pickingStart.col),id2=cellId(r,c),ref=id1===id2?id1:id1+':'+id2;const inp=activeFormulaInput;if(pickingInsertPos!==null){inp.value=inp.value.slice(0,pickingInsertPos)+ref+inp.value.slice(pickingInsertPos+pickingLastLen);pickingLastLen=ref.length;}}}
 else if(ce){const r=parseInt(ce.dataset.row),c=parseInt(ce.dataset.col);selection.endRow=r;selection.endCol=c;activeCell={row:r,col:c};fullRender();}
});
document.addEventListener('mouseup',()=>{isMouseDown=false;if(window._resizingCol!=null){window._resizingCol=null;fullRender();}pickingInsertPos=null;});
document.addEventListener('mousedown',e=>{if(e.target.classList.contains('col-resizer')){e.preventDefault();window._resizingCol=parseInt(e.target.dataset.col);window._resizingStartX=e.clientX;window._resizingStartW=getColWidth(window._resizingCol);}});
document.addEventListener('keydown',e=>{if(cellEditor||e.target===formulaInput) return;if(e.key==='ArrowDown') setActiveCell(activeCell.row+1,activeCell.col,e.shiftKey);if(e.key==='ArrowUp') setActiveCell(activeCell.row-1,activeCell.col,e.shiftKey);if(e.key==='ArrowLeft') setActiveCell(activeCell.row,activeCell.col-1,e.shiftKey);if(e.key==='ArrowRight') setActiveCell(activeCell.row,activeCell.col+1,e.shiftKey);if(e.key==='Enter'){setActiveCell(activeCell.row+1,activeCell.col);startEditCell(activeCell.row,activeCell.col);}if(e.key==='Delete'){const sh=getSheet();for(let r=Math.min(selection.startRow,selection.endRow);r<=Math.max(selection.startRow,selection.endRow);r++)for(let c=Math.min(selection.startCol,selection.endCol);c<=Math.max(selection.startCol,selection.endCol);c++) setCellData(sh,r,c,null);fullRender();}if(e.key.length===1&&!e.ctrlKey){startEditCell(activeCell.row,activeCell.col,e.key);e.preventDefault();}});
document.getElementById('btnBold').onclick=()=>{const sh=getSheet();for(let r=selection.startRow;r<=selection.endRow;r++)for(let c=selection.startCol;c<=selection.endCol;c++){let d=getCellData(sh,r,c)||{v:'',style:{}};d.style.bold=!d.style.bold;setCellData(sh,r,c,d);}fullRender();};
document.getElementById('btnClear').onclick=()=>{const sh=getSheet();for(let r=selection.startRow;r<=selection.endRow;r++)for(let c=selection.startCol;c<=selection.endCol;c++) setCellData(sh,r,c,null);fullRender();};
document.getElementById('btnDownload').onclick=()=>{const sh=getSheet();let csv='';for(let r=0;r<50;r++){let row=[];for(let c=0;c<20;c++){let v=getDisplayValue(sh,r,c);row.push(v);}csv+=row.join(',')+'\n';}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=sh.name+'.csv';a.click();};
sheets=[createEmptySheet('Sheet1'),createEmptySheet('Sheet2')];fullRender();
</script>
</body>
</html>
