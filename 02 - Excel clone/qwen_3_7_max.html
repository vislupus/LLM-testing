<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            background: #f0f0f0;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: #f8f9fa;
            border-bottom: 1px solid #d0d0d0;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 4px;
            align-items: center;
            padding-right: 12px;
            border-right: 1px solid #e0e0e0;
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .btn {
            padding: 6px 12px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #e8e8e8;
            border-color: #d0d0d0;
        }

        .btn:active {
            background: #d0d0d0;
        }

        .btn.active {
            background: #d0e0ff;
            border-color: #4a90e2;
        }

        .color-picker {
            width: 30px;
            height: 30px;
            border: 1px solid #d0d0d0;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Formula Bar */
        .formula-bar {
            background: white;
            border-bottom: 1px solid #d0d0d0;
            display: flex;
            align-items: center;
            height: 32px;
        }

        .cell-address {
            padding: 0 12px;
            border-right: 1px solid #d0d0d0;
            font-weight: 600;
            color: #333;
            width: 80px;
            text-align: center;
            background: #f8f9fa;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .formula-input {
            flex: 1;
            padding: 0 12px;
            border: none;
            outline: none;
            font-size: 14px;
            height: 100%;
        }

        /* Spreadsheet Grid */
        .spreadsheet {
            flex: 1;
            display: flex;
            overflow: hidden;
            background: white;
        }

        .row-numbers {
            width: 50px;
            background: #f8f9fa;
            border-right: 1px solid #d0d0d0;
            overflow-y: auto;
        }

        .row-number {
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
            user-select: none;
        }

        .grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .column-headers {
            display: flex;
            position: sticky;
            top: 0;
            background: #f8f9fa;
            border-bottom: 2px solid #d0d0d0;
            z-index: 10;
        }

        .column-header {
            width: 100px;
            min-width: 100px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #d0d0d0;
            font-weight: 600;
            font-size: 12px;
            color: #666;
            user-select: none;
            position: relative;
        }

        .column-resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            cursor: col-resize;
            background: transparent;
        }

        .column-resizer:hover {
            background: #4a90e2;
        }

        .grid {
            display: flex;
            flex-direction: column;
        }

        .grid-row {
            display: flex;
        }

        .cell {
            width: 100px;
            min-width: 100px;
            height: 24px;
            border-right: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            padding: 4px;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: cell;
            outline: none;
            position: relative;
        }

        .cell:focus {
            outline: 2px solid #4a90e2;
            outline-offset: -2px;
            z-index: 5;
        }

        .cell.selected {
            outline: 2px solid #4a90e2;
            outline-offset: -2px;
            z-index: 5;
        }

        .cell.in-range {
            background: rgba(74, 144, 226, 0.1);
        }

        .cell-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            pointer-events: none;
        }

        /* Sheet Tabs */
        .sheet-tabs {
            background: #f8f9fa;
            border-top: 1px solid #d0d0d0;
            display: flex;
            align-items: center;
            height: 36px;
            padding: 0 8px;
        }

        .sheet-tab {
            padding: 8px 16px;
            background: white;
            border: 1px solid #d0d0d0;
            border-bottom: none;
            margin-right: 4px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px 4px 0 0;
            user-select: none;
        }

        .sheet-tab.active {
            background: white;
            border-bottom: 2px solid white;
            font-weight: 600;
        }

        .sheet-tab:hover {
            background: #e8e8e8;
        }

        .add-sheet {
            width: 28px;
            height: 28px;
            border: 1px solid #d0d0d0;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-sheet:hover {
            background: #e8e8e8;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 12px;
            height: 12px;
        }

        ::-webkit-scrollbar-track {
            background: #f0f0f0;
        }

        ::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 6px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .file-input {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <button class="btn" id="btnBold" title="Bold (Ctrl+B)"><b>B</b></button>
                <button class="btn" id="btnItalic" title="Italic (Ctrl+I)"><i>I</i></button>
                <input type="color" class="color-picker" id="colorPicker" title="Background Color">
            </div>
            <div class="toolbar-group">
                <button class="btn" id="btnClear">Clear</button>
            </div>
            <div class="toolbar-group">
                <button class="btn" id="btnDownloadCSV">📥 Download CSV</button>
                <button class="btn" id="btnUploadCSV">📤 Upload CSV</button>
                <input type="file" id="fileInput" accept=".csv" class="file-input">
            </div>
        </div>

        <!-- Formula Bar -->
        <div class="formula-bar">
            <div class="cell-address" id="cellAddress">A1</div>
            <input type="text" class="formula-input" id="formulaInput" placeholder="Enter value or formula (e.g., =SUM(A1:A10))">
        </div>

        <!-- Spreadsheet Grid -->
        <div class="spreadsheet">
            <div class="row-numbers" id="rowNumbers"></div>
            <div class="grid-container" id="gridContainer">
                <div class="column-headers" id="columnHeaders"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>

        <!-- Sheet Tabs -->
        <div class="sheet-tabs">
            <div id="sheetTabs"></div>
            <button class="add-sheet" id="addSheetBtn" title="Add Sheet">+</button>
        </div>
    </div>

    <script>
        // Data structures
        const NUM_ROWS = 100;
        const NUM_COLS = 26; // A-Z
        
        class Sheet {
            constructor(name) {
                this.name = name;
                this.cells = {}; // { "A1": { value, formula, style } }
                this.columnWidths = {}; // { "A": 100 }
            }

            getCell(ref) {
                return this.cells[ref] || { value: '', formula: '', style: {} };
            }

            setCell(ref, data) {
                if (data.value === '' && data.formula === '' && Object.keys(data.style).length === 0) {
                    delete this.cells[ref];
                } else {
                    this.cells[ref] = { ...data };
                }
            }
        }

        let sheets = [new Sheet('Sheet1')];
        let activeSheetIndex = 0;
        let activeCell = 'A1';
        let selectedRange = { start: 'A1', end: 'A1' };
        let isDragging = false;
        let isSelecting = false;
        let isEditing = false;

        // Dependency graph: maps cell references to arrays of cells that depend on them
        let dependencies = {};

        // Helper functions
        function colToIndex(col) {
            return col.toUpperCase().charCodeAt(0) - 65;
        }

        function indexToCol(index) {
            return String.fromCharCode(65 + index);
        }

        function parseRef(ref) {
            const match = ref.match(/^([A-Z])(\d+)$/);
            if (!match) return null;
            return { col: match[1], row: parseInt(match[2]) };
        }

        function getCellRef(col, row) {
            return `${indexToCol(col)}${row}`;
        }

        // Formula parser and evaluator
        function parseFormula(formula) {
            if (!formula.startsWith('=')) return null;
            return formula.substring(1);
        }

        function extractReferences(expr) {
            const refs = [];
            const rangeRegex = /([A-Z]\d+):([A-Z]\d+)/g;
            const cellRegex = /(?<![A-Z])([A-Z]\d+)(?!\d)/g;
            
            let match;
            while ((match = rangeRegex.exec(expr)) !== null) {
                refs.push({ type: 'range', start: match[1], end: match[2] });
            }
            
            while ((match = cellRegex.exec(expr)) !== null) {
                refs.push({ type: 'cell', ref: match[1] });
            }
            
            return refs;
        }

        function evaluateRange(startRef, endRef) {
            const start = parseRef(startRef);
            const end = parseRef(endRef);
            const values = [];
            
            const minCol = Math.min(colToIndex(start.col), colToIndex(end.col));
            const maxCol = Math.max(colToIndex(start.col), colToIndex(end.col));
            const minRow = Math.min(start.row, end.row);
            const maxRow = Math.max(start.row, end.row);
            
            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    const ref = getCellRef(c, r);
                    const cell = sheets[activeSheetIndex].getCell(ref);
                    const val = parseFloat(cell.value);
                    if (!isNaN(val)) {
                        values.push(val);
                    }
                }
            }
            
            return values;
        }

        function evaluateFormula(formula, currentRef) {
            try {
                const expr = parseFormula(formula);
                if (!expr) return '';

                let evaluated = expr;

                // Replace ranges with arrays
                evaluated = evaluated.replace(/([A-Z]\d+):([A-Z]\d+)/g, (match, start, end) => {
                    const values = evaluateRange(start, end);
                    return JSON.stringify(values);
                });

                // Replace cell references with values
                evaluated = evaluated.replace(/(?<![A-Z])([A-Z]\d+)(?!\d)/g, (match, ref) => {
                    const cell = sheets[activeSheetIndex].getCell(ref);
                    const val = parseFloat(cell.value);
                    return isNaN(val) ? '0' : val;
                });

                // Handle functions
                evaluated = evaluated.replace(/SUM\((\[.*?\])\)/g, (match, arr) => {
                    const values = JSON.parse(arr);
                    return values.reduce((a, b) => a + b, 0);
                });

                evaluated = evaluated.replace(/AVERAGE\((\[.*?\])\)/g, (match, arr) => {
                    const values = JSON.parse(arr);
                    return values.length > 0 ? values.reduce((a, b) => a + b, 0) / values.length : 0;
                });

                evaluated = evaluated.replace(/MIN\((\[.*?\])\)/g, (match, arr) => {
                    const values = JSON.parse(arr);
                    return values.length > 0 ? Math.min(...values) : 0;
                });

                evaluated = evaluated.replace(/MAX\((\[.*?\])\)/g, (match, arr) => {
                    const values = JSON.parse(arr);
                    return values.length > 0 ? Math.max(...values) : 0;
                });

                // Evaluate the expression
                const result = eval(evaluated);
                return typeof result === 'number' ? result.toString() : result;
            } catch (e) {
                return '#ERROR';
            }
        }

        function updateDependencies(ref, formula) {
            // Remove old dependencies
            for (let key in dependencies) {
                dependencies[key] = dependencies[key].filter(r => r !== ref);
            }

            // Add new dependencies
            if (formula && formula.startsWith('=')) {
                const refs = extractReferences(formula);
                refs.forEach(r => {
                    if (r.type === 'cell') {
                        if (!dependencies[r.ref]) dependencies[r.ref] = [];
                        if (!dependencies[r.ref].includes(ref)) {
                            dependencies[r.ref].push(ref);
                        }
                    } else if (r.type === 'range') {
                        const start = parseRef(r.start);
                        const end = parseRef(r.end);
                        const minCol = Math.min(colToIndex(start.col), colToIndex(end.col));
                        const maxCol = Math.max(colToIndex(start.col), colToIndex(end.col));
                        const minRow = Math.min(start.row, end.row);
                        const maxRow = Math.max(start.row, end.row);
                        
                        for (let row = minRow; row <= maxRow; row++) {
                            for (let col = minCol; col <= maxCol; col++) {
                                const cellRef = getCellRef(col, row);
                                if (!dependencies[cellRef]) dependencies[cellRef] = [];
                                if (!dependencies[cellRef].includes(ref)) {
                                    dependencies[cellRef].push(ref);
                                }
                            }
                        }
                    }
                });
            }
        }

        function recalculate(ref) {
            const cell = sheets[activeSheetIndex].getCell(ref);
            
            if (cell.formula) {
                const newValue = evaluateFormula(cell.formula, ref);
                if (newValue !== cell.value) {
                    cell.value = newValue;
                    sheets[activeSheetIndex].setCell(ref, cell);
                    renderCell(ref);
                }
            }

            // Recalculate dependent cells
            if (dependencies[ref]) {
                dependencies[ref].forEach(depRef => {
                    recalculate(depRef);
                });
            }
        }

        // UI rendering
        function renderGrid() {
            const rowNumbers = document.getElementById('rowNumbers');
            const columnHeaders = document.getElementById('columnHeaders');
            const grid = document.getElementById('grid');

            // Clear existing
            rowNumbers.innerHTML = '';
            columnHeaders.innerHTML = '';
            grid.innerHTML = '';

            // Row numbers
            for (let i = 1; i <= NUM_ROWS; i++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row-number';
                rowDiv.textContent = i;
                rowNumbers.appendChild(rowDiv);
            }

            // Column headers
            for (let i = 0; i < NUM_COLS; i++) {
                const colDiv = document.createElement('div');
                colDiv.className = 'column-header';
                colDiv.textContent = indexToCol(i);
                
                const resizer = document.createElement('div');
                resizer.className = 'column-resizer';
                resizer.dataset.col = indexToCol(i);
                colDiv.appendChild(resizer);
                
                columnHeaders.appendChild(colDiv);
            }

            // Grid cells
            for (let r = 1; r <= NUM_ROWS; r++) {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'grid-row';
                
                for (let c = 0; c < NUM_COLS; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = 'cell';
                    cellDiv.dataset.ref = getCellRef(c, r);
                    cellDiv.contentEditable = false;
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'cell-content';
                    cellDiv.appendChild(contentDiv);
                    
                    rowDiv.appendChild(cellDiv);
                }
                
                grid.appendChild(rowDiv);
            }

            renderAllCells();
        }

        function renderAllCells() {
            const cells = sheets[activeSheetIndex].cells;
            for (let ref in cells) {
                renderCell(ref);
            }
        }

        function renderCell(ref) {
            const cell = sheets[activeSheetIndex].getCell(ref);
            const cellDiv = document.querySelector(`[data-ref="${ref}"]`);
            if (!cellDiv) return;

            const contentDiv = cellDiv.querySelector('.cell-content');
            contentDiv.textContent = cell.value;

            // Apply styles
            cellDiv.style.fontWeight = cell.style.bold ? 'bold' : 'normal';
            cellDiv.style.fontStyle = cell.style.italic ? 'italic' : 'normal';
            cellDiv.style.backgroundColor = cell.style.backgroundColor || '';
        }

        function renderSheetTabs() {
            const tabsContainer = document.getElementById('sheetTabs');
            tabsContainer.innerHTML = '';

            sheets.forEach((sheet, index) => {
                const tab = document.createElement('div');
                tab.className = 'sheet-tab' + (index === activeSheetIndex ? ' active' : '');
                tab.textContent = sheet.name;
                tab.onclick = () => switchSheet(index);
                tab.ondblclick = (e) => {
                    e.stopPropagation();
                    const newName = prompt('Rename sheet:', sheet.name);
                    if (newName && newName.trim()) {
                        sheets[index].name = newName.trim();
                        renderSheetTabs();
                    }
                };
                tab.oncontextmenu = (e) => {
                    e.preventDefault();
                    if (sheets.length > 1 && confirm(`Delete sheet "${sheet.name}"?`)) {
                        sheets.splice(index, 1);
                        if (activeSheetIndex >= sheets.length) {
                            activeSheetIndex = sheets.length - 1;
                        }
                        renderSheetTabs();
                        renderGrid();
                        updateFormulaBar();
                    }
                };
                tabsContainer.appendChild(tab);
            });
        }

        function switchSheet(index) {
            activeSheetIndex = index;
            activeCell = 'A1';
            selectedRange = { start: 'A1', end: 'A1' };
            renderSheetTabs();
            renderGrid();
            updateFormulaBar();
            scrollToCell('A1');
        }

        function updateFormulaBar() {
            const addressDiv = document.getElementById('cellAddress');
            const formulaInput = document.getElementById('formulaInput');

            addressDiv.textContent = activeCell;
            
            const cell = sheets[activeSheetIndex].getCell(activeCell);
            formulaInput.value = cell.formula || cell.value;
        }

        function scrollToCell(ref) {
            const cellDiv = document.querySelector(`[data-ref="${ref}"]`);
            if (cellDiv) {
                cellDiv.scrollIntoView({ block: 'center', inline: 'center' });
            }
        }

        function selectCell(ref, extend = false) {
            // Clear previous selection
            document.querySelectorAll('.cell.selected, .cell.in-range').forEach(cell => {
                cell.classList.remove('selected', 'in-range');
            });

            if (!extend) {
                selectedRange = { start: ref, end: ref };
            } else {
                selectedRange.end = ref;
            }

            // Highlight selected range
            const start = parseRef(selectedRange.start);
            const end = parseRef(selectedRange.end);
            
            const minCol = Math.min(colToIndex(start.col), colToIndex(end.col));
            const maxCol = Math.max(colToIndex(start.col), colToIndex(end.col));
            const minRow = Math.min(start.row, end.row);
            const maxRow = Math.max(start.row, end.row);

            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    const cellRef = getCellRef(c, r);
                    const cellDiv = document.querySelector(`[data-ref="${cellRef}"]`);
                    if (cellDiv) {
                        cellDiv.classList.add('in-range');
                    }
                }
            }

            activeCell = ref;
            const cellDiv = document.querySelector(`[data-ref="${ref}"]`);
            if (cellDiv) {
                cellDiv.classList.add('selected');
            }

            updateFormulaBar();
        }

        function getRangeText() {
            if (selectedRange.start === selectedRange.end) {
                return selectedRange.start;
            }
            return `${selectedRange.start}:${selectedRange.end}`;
        }

        // Event handlers
        function setupEventListeners() {
            const grid = document.getElementById('grid');
            const formulaInput = document.getElementById('formulaInput');

            // Cell click and drag
            grid.addEventListener('mousedown', (e) => {
                const cell = e.target.closest('.cell');
                if (!cell) return;

                if (isEditing) {
                    // Insert range into formula
                    const rangeText = getRangeText();
                    const start = formulaInput.selectionStart;
                    const end = formulaInput.selectionEnd;
                    formulaInput.value = formulaInput.value.substring(0, start) + rangeText + formulaInput.value.substring(end);
                    formulaInput.focus();
                } else {
                    const ref = cell.dataset.ref;
                    selectCell(ref, e.shiftKey);
                    isDragging = true;
                }
            });

            grid.addEventListener('mousemove', (e) => {
                if (!isDragging || isEditing) return;

                const cell = e.target.closest('.cell');
                if (cell) {
                    const ref = cell.dataset.ref;
                    selectCell(ref, true);
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            grid.addEventListener('dblclick', (e) => {
                const cell = e.target.closest('.cell');
                if (cell) {
                    enterEditMode(cell.dataset.ref);
                }
            });

            // Cell focus and editing
            grid.addEventListener('focus', (e) => {
                const cell = e.target.closest('.cell');
                if (cell) {
                    const ref = cell.dataset.ref;
                    selectCell(ref);
                }
            }, true);

            // Formula bar
            formulaInput.addEventListener('focus', () => {
                isEditing = true;
                selectCell(activeCell);
            });

            formulaInput.addEventListener('blur', () => {
                isEditing = false;
                commitEdit();
            });

            formulaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    commitEdit();
                    formulaInput.blur();
                    navigateCell('down');
                } else if (e.key === 'Escape') {
                    formulaInput.value = sheets[activeSheetIndex].getCell(activeCell).formula || 
                                        sheets[activeSheetIndex].getCell(activeCell).value;
                    formulaInput.blur();
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.target.closest('.formula-input')) return;

                const cell = document.querySelector(`[data-ref="${activeCell}"]`);
                
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (document.activeElement === cell && cell.contentEditable === 'true') {
                        commitEdit();
                        cell.contentEditable = false;
                        navigateCell('down');
                    } else {
                        enterEditMode(activeCell);
                    }
                } else if (e.key === 'Enter' && e.shiftKey) {
                    e.preventDefault();
                    navigateCell('up');
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    commitEdit();
                    navigateCell(e.shiftKey ? 'left' : 'right');
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    navigateCell('up');
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    navigateCell('down');
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    navigateCell('left');
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    navigateCell('right');
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    if (document.activeElement !== cell || cell.contentEditable !== 'true') {
                        e.preventDefault();
                        clearCell(activeCell);
                    }
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
                    e.preventDefault();
                    toggleBold();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
                    e.preventDefault();
                    toggleItalic();
                } else if (e.key === 'F2') {
                    e.preventDefault();
                    enterEditMode(activeCell);
                } else if (e.target.tagName !== 'INPUT' && e.key.length === 1) {
                    enterEditMode(activeCell);
                }
            });

            // Column resizing
            document.getElementById('columnHeaders').addEventListener('mousedown', (e) => {
                const resizer = e.target.closest('.column-resizer');
                if (!resizer) return;

                const col = resizer.dataset.col;
                const startX = e.clientX;
                const header = resizer.parentElement;
                const startWidth = header.offsetWidth;

                function onMouseMove(e) {
                    const newWidth = Math.max(50, startWidth + (e.clientX - startX));
                    header.style.width = newWidth + 'px';
                    header.style.minWidth = newWidth + 'px';
                    
                    document.querySelectorAll(`[data-col="${col}"]`).forEach(cell => {
                        cell.style.width = newWidth + 'px';
                        cell.style.minWidth = newWidth + 'px';
                    });
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            // Toolbar buttons
            document.getElementById('btnBold').addEventListener('click', toggleBold);
            document.getElementById('btnItalic').addEventListener('click', toggleItalic);
            document.getElementById('colorPicker').addEventListener('change', (e) => {
                applyStyle('backgroundColor', e.target.value);
            });
            document.getElementById('btnClear').addEventListener('click', () => {
                clearCell(activeCell);
            });

            // CSV
            document.getElementById('btnDownloadCSV').addEventListener('click', downloadCSV);
            document.getElementById('btnUploadCSV').addEventListener('click', () => {
                document.getElementById('fileInput').click();
            });
            document.getElementById('fileInput').addEventListener('change', uploadCSV);

            // Sheet management
            document.getElementById('addSheetBtn').addEventListener('click', () => {
                const name = prompt('Sheet name:', `Sheet${sheets.length + 1}`);
                if (name && name.trim()) {
                    sheets.push(new Sheet(name.trim()));
                    renderSheetTabs();
                }
            });
        }

        function enterEditMode(ref) {
            const cell = document.querySelector(`[data-ref="${ref}"]`);
            const cellData = sheets[activeSheetIndex].getCell(ref);
            
            cell.contentEditable = true;
            cell.textContent = cellData.formula || cellData.value;
            cell.focus();
            
            // Select all text
            const range = document.createRange();
            range.selectNodeContents(cell);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function commitEdit() {
            const cell = document.querySelector(`[data-ref="${activeCell}"]`);
            if (!cell || cell.contentEditable !== 'true') return;

            const value = cell.textContent.trim();
            const cellData = sheets[activeSheetIndex].getCell(activeCell);

            if (value.startsWith('=')) {
                cellData.formula = value;
                cellData.value = evaluateFormula(value, activeCell);
                updateDependencies(activeCell, value);
            } else {
                cellData.formula = '';
                cellData.value = value;
                updateDependencies(activeCell, '');
            }

            sheets[activeSheetIndex].setCell(activeCell, cellData);
            renderCell(activeCell);
            recalculate(activeCell);
            updateFormulaBar();
        }

        function navigateCell(direction) {
            const parsed = parseRef(activeCell);
            let newCol = colToIndex(parsed.col);
            let newRow = parsed.row;

            switch (direction) {
                case 'up': newRow = Math.max(1, newRow - 1); break;
                case 'down': newRow = Math.min(NUM_ROWS, newRow + 1); break;
                case 'left': newCol = Math.max(0, newCol - 1); break;
                case 'right': newCol = Math.min(NUM_COLS - 1, newCol + 1); break;
            }

            const newRef = getCellRef(newCol, newRow);
            selectCell(newRef);
            scrollToCell(newRef);
        }

        function clearCell(ref) {
            const cellData = sheets[activeSheetIndex].getCell(ref);
            cellData.value = '';
            cellData.formula = '';
            sheets[activeSheetIndex].setCell(ref, cellData);
            updateDependencies(ref, '');
            renderCell(ref);
            recalculate(ref);
            updateFormulaBar();
        }

        function applyStyle(styleProp, value) {
            const cellData = sheets[activeSheetIndex].getCell(activeCell);
            cellData.style[styleProp] = value;
            sheets[activeSheetIndex].setCell(activeCell, cellData);
            renderCell(activeCell);
        }

        function toggleBold() {
            const cellData = sheets[activeSheetIndex].getCell(activeCell);
            cellData.style.bold = !cellData.style.bold;
            sheets[activeSheetIndex].setCell(activeCell, cellData);
            renderCell(activeCell);
            document.getElementById('btnBold').classList.toggle('active', cellData.style.bold);
        }

        function toggleItalic() {
            const cellData = sheets[activeSheetIndex].getCell(activeCell);
            cellData.style.italic = !cellData.style.italic;
            sheets[activeSheetIndex].setCell(activeCell, cellData);
            renderCell(activeCell);
            document.getElementById('btnItalic').classList.toggle('active', cellData.style.italic);
        }

        function downloadCSV() {
            const sheet = sheets[activeSheetIndex];
            let csv = '';
            
            for (let r = 1; r <= NUM_ROWS; r++) {
                const row = [];
                for (let c = 0; c < NUM_COLS; c++) {
                    const ref = getCellRef(c, r);
                    const cell = sheet.getCell(ref);
                    row.push(cell.value);
                }
                csv += row.join(',') + '\n';
            }

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${sheet.name}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function uploadCSV(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const csv = event.target.result;
                const rows = csv.split('\n');
                const sheet = sheets[activeSheetIndex];

                rows.forEach((row, r) => {
                    if (!row.trim()) return;
                    const cols = row.split(',');
                    cols.forEach((value, c) => {
                        if (c < NUM_COLS) {
                            const ref = getCellRef(c, r + 1);
                            sheet.setCell(ref, { value: value.trim(), formula: '', style: {} });
                        }
                    });
                });

                renderGrid();
                updateFormulaBar();
            };
            reader.readAsText(file);
        }

        // Initialize
        function init() {
            renderGrid();
            renderSheetTabs();
            setupEventListeners();
            updateFormulaBar();
            selectCell('A1');
        }

        init();
    </script>
</body>
</html>
