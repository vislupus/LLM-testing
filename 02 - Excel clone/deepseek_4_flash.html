<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spreadsheet Clone</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background: #fff;
        }
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: #f3f4f6;
            border-bottom: 1px solid #d0d7de;
            flex-wrap: wrap;
        }
        #toolbar button {
            padding: 4px 10px;
            min-width: 32px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        #toolbar button:hover {
            background: #eaeff2;
        }
        #toolbar input[type="color"] {
            width: 38px;
            height: 30px;
            padding: 0;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
        }
        #toolbar .sep {
            width: 1px;
            height: 24px;
            background: #d0d7de;
            margin: 0 6px;
        }
        .spacer {
            flex: 1;
        }
        #formulaBar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #d0d7de;
            background: #fafbfc;
        }
        #cellAddress {
            min-width: 80px;
            padding: 6px 10px;
            border-right: 1px solid #d0d7de;
            font-weight: bold;
            background: #fff;
            color: #24292f;
            text-align: center;
            font-size: 14px;
        }
        #formulaInput {
            flex: 1;
            padding: 6px 10px;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
        }
        #formulaInput:focus {
            background: #fff;
        }
        #gridContainer {
            flex: 1;
            overflow: auto;
            background: #fff;
            position: relative;
            outline: none;
        }
        #grid {
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0;
            width: auto;
        }
        #grid thead th,
        #grid tbody th {
            background: #f8f9fa;
            color: #24292f;
            border: 1px solid #d0d7de;
            font-weight: normal;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            position: sticky;
            z-index: 2;
        }
        #grid thead th {
            top: 0;
            height: 24px;
        }
        #grid tbody th {
            left: 0;
            z-index: 1;
            width: 50px;
            min-width: 50px;
        }
        #grid thead th:first-child {
            left: 0;
            z-index: 3;
        }
        #grid td {
            border: 1px solid #e1e4e8;
            padding: 0 4px;
            height: 24px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            font-size: 14px;
            cursor: cell;
        }
        #grid td.active {
            outline: 2px solid #217346;
            outline-offset: -1px;
        }
        #grid td.range {
            background-color: rgba(33, 115, 70, 0.08);
        }
        .cell-input {
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            padding: 0 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .col-header {
            position: sticky;
            overflow: visible;
        }
        .resize-handle {
            position: absolute;
            top: 0;
            right: -4px;
            width: 8px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
        }
        #sheetTabs {
            display: flex;
            align-items: center;
            background: #f3f4f6;
            border-top: 1px solid #d0d7de;
            overflow-x: auto;
            padding: 0 5px;
        }
        .sheet-tab {
            display: inline-flex;
            align-items: center;
            padding: 5px 10px;
            margin: 2px;
            border: 1px solid transparent;
            border-radius: 4px 4px 0 0;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
            color: #24292f;
            user-select: none;
        }
        .sheet-tab.active {
            background: #fff;
            border-color: #d0d7de #d0d7de #fff;
            font-weight: bold;
        }
        .sheet-close {
            display: inline-block;
            margin-left: 6px;
            color: #888;
            font-weight: bold;
            cursor: pointer;
            font-family: monospace;
        }
        .sheet-close:hover {
            color: red;
        }
        .sheet-add {
            padding: 5px 12px;
            margin: 2px;
            cursor: pointer;
            font-size: 18px;
            color: #217346;
        }
        .sheet-add:hover {
            background: #eaeff2;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <button id="btnBold" title="Bold"><b>B</b></button>
            <button id="btnItalic" title="Italic"><i>I</i></button>
            <input type="color" id="bgColor" title="Background Color" value="#ffff00">
            <button id="btnClear" title="Clear contents">Clear</button>
            <span class="sep"></span>
            <button id="btnDownload">Download CSV</button>
            <button id="btnUpload">Upload CSV</button>
            <span class="spacer"></span>
        </div>
        <div id="formulaBar">
            <span id="cellAddress">A1</span>
            <input id="formulaInput" type="text" placeholder="Enter value or formula">
        </div>
        <div id="gridContainer" tabindex="0">
            <table id="grid"></table>
        </div>
        <div id="sheetTabs"></div>
    </div>
    <input type="file" id="csvFile" accept=".csv" style="display:none">

    <script>
        // ---------- Configuration ----------
        const ROWS = 50;
        const COLS = 26;

        // ---------- Application State ----------
        let sheets = [];
        let currentSheetIndex = 0;
        let activeCell = { row: 0, col: 0 };
        let selectionStart = { row: 0, col: 0 };
        let selectionEnd = { row: 0, col: 0 };
        let editingCell = null; // {row, col} when inline editing
        let editingOriginal = '';
        let cellElements = [];
        let colgroupEl = null;

        // ---------- Utility Functions ----------
        function colIndexToName(index) {
            let name = '';
            let n = index + 1;
            while (n > 0) {
                const rem = (n - 1) % 26;
                name = String.fromCharCode(65 + rem) + name;
                n = Math.floor((n - 1) / 26);
            }
            return name;
        }

        function colNameToIndex(name) {
            let n = 0;
            for (let i = 0; i < name.length; i++) {
                n = n * 26 + (name.charCodeAt(i) - 64);
            }
            return n - 1;
        }

        function cellIdFromRC(row, col) {
            return colIndexToName(col) + (row + 1);
        }

        function rcFromCellId(id) {
            const m = /^([A-Z]+)(\d+)$/.exec(id);
            if (!m) return null;
            const col = colNameToIndex(m[1]);
            const row = parseInt(m[2], 10) - 1;
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return null;
            return { row, col };
        }

        function createSheet(name) {
            return {
                name,
                cells: {},
                colWidths: Array(COLS).fill(80)
            };
        }

        function getSheet() {
            return sheets[currentSheetIndex];
        }

        function getCellOfSheet(sheet, row, col) {
            const id = cellIdFromRC(row, col);
            if (!sheet.cells[id]) {
                sheet.cells[id] = { raw: '', value: '', style: {} };
            }
            return sheet.cells[id];
        }

        function getCell(row, col) {
            return getCellOfSheet(getSheet(), row, col);
        }

        // ---------- Formula Engine ----------
        function tokenizeFormula(s) {
            const tokens = [];
            let i = 0;
            while (i < s.length) {
                const ch = s[i];
                if (/\s/.test(ch)) { i++; continue; }
                if ('+-*/(),:'.includes(ch)) {
                    tokens.push({ type: 'op', value: ch });
                    i++;
                    continue;
                }
                if (/\d/.test(ch) || (ch === '.' && /\d/.test(s[i + 1] || ''))) {
                    let num = '';
                    while (i < s.length && /\d/.test(s[i])) num += s[i++];
                    if (s[i] === '.' && /\d/.test(s[i + 1] || '')) {
                        num += '.';
                        i++;
                        while (i < s.length && /\d/.test(s[i])) num += s[i++];
                    }
                    tokens.push({ type: 'num', value: parseFloat(num) });
                    continue;
                }
                if (/[A-Za-z_/.test(ch)]) {
                    let word = '';
                    while (i < s.length && /[A-Za-z0-9_.]/.test(s[i])) word += s[i++];
                    const m = /^([A-Za-z]+)(\d+)$/.exec(word);
                    if (m) {
                        tokens.push({ type: 'cell', value: m[1].toUpperCase() + m[2] });
                    } else {
                        tokens.push({ type: 'ident', value: word.toUpperCase() });
                    }
                    continue;
                }
                throw new Error('#ERROR?');
            }
            return tokens;
        }

        function getCellNumericValue(cellId, sheet, visiting) {
            const rc = rcFromCellId(cellId);
            if (!rc) return null;
            const { row, col } = rc;
            const id = cellIdFromRC(row, col);
            const cell = sheet.cells[id];
            if (!cell || cell.raw === undefined) return null;
            if (visiting.has(id)) throw new Error('#CYCLE');

            if (cell.raw.startsWith('=')) {
                visiting.add(id);
                try {
                    const val = evalFormula(cell.raw.slice(1), sheet, visiting);
                    visiting.delete(id);
                    return typeof val === 'number' ? val : null;
                } catch (e) {
                    visiting.delete(id);
                    throw e;
                }
            } else {
                const trimmed = cell.raw.trim();
                if (trimmed === '') return null;
                const num = Number(trimmed);
                return isNaN(num) ? null : num;
            }
        }

        function getRangeValues(startCell, endCell, sheet, visiting) {
            const startRC = rcFromCellId(startCell);
            const endRC = rcFromCellId(endCell);
            if (!startRC || !endRC) throw new Error('#REF!');
            const minRow = Math.min(startRC.row, endRC.row);
            const maxRow = Math.max(startRC.row, endRC.row);
            const minCol = Math.min(startRC.col, endRC.col);
            const maxCol = Math.max(startRC.col, endRC.col);
            const values = [];
            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    const num = getCellNumericValue(cellIdFromRC(r, c), sheet, visiting);
                    if (num !== null) values.push(num);
                }
            }
            return values;
        }

        function evalFormula(expr, sheet, visiting) {
            const tokens = tokenizeFormula(expr);
            let pos = 0;

            const peek = () => tokens[pos];
            const next = () => tokens[pos++];
            const expectOp = (op) => {
                if (peek() && peek().type === 'op' && peek().value === op) return next();
                throw new Error('#ERROR?');
            };

            function parseExpr() {
                let val = parseTerm();
                while (peek() && peek().type === 'op' && (peek().value === '+' || peek().value === '-')) {
                    const op = next().value;
                    const rhs = parseTerm();
                    if (op === '+') val = val + rhs;
                    else val = val - rhs;
                }
                return val;
            }

            function parseTerm() {
                let val = parseFactor();
                while (peek() && peek().type === 'op' && (peek().value === '*' || peek().value === '/')) {
                    const op = next().value;
                    const rhs = parseFactor();
                    if (op === '*') val = val * rhs;
                    else if (rhs === 0) throw new Error('#DIV/0!');
                    else val = val / rhs;
                }
                return val;
            }

            function parseFactor() {
                const token = peek();
                if (!token) throw new Error('#ERROR?');
                if (token.type === 'num') {
                    next();
                    return token.value;
                }
                if (token.type === 'cell') {
                    next();
                    const num = getCellNumericValue(token.value, sheet, visiting);
                    return num === null ? 0 : num;
                }
                if (token.type === 'op' && token.value === '(') {
                    next();
                    const val = parseExpr();
                    expectOp(')');
                    return val;
                }
                if (token.type === 'ident') {
                    next();
                    return parseFunction(token.value);
                }
                throw new Error('#ERROR?');
            }

            function parseFunction(name) {
                expectOp('(');
                const args = [];
                if (peek() && peek().type === 'op' && peek().value === ')') {
                    next();
                } else {
                    while (true) {
                        args.push(parseArg());
                        if (peek() && peek().type === 'op' && peek().value === ',') {
                            next();
                            continue;
                        }
                        break;
                    }
                    expectOp(')');
                }

                const values = [];
                for (const arg of args) {
                    if (Array.isArray(arg)) values.push(...arg);
                    else values.push(arg);
                }
                const nums = values.filter(v => typeof v === 'number' && isFinite(v));

                switch (name) {
                    case 'SUM':
                        return nums.reduce((a, b) => a + b, 0);
                    case 'AVERAGE':
                        if (nums.length === 0) throw new Error('#DIV/0!');
                        return nums.reduce((a, b) => a + b, 0) / nums.length;
                    case 'MIN':
                        return nums.length ? Math.min(...nums) : 0;
                    case 'MAX':
                        return nums.length ? Math.max(...nums) : 0;
                    default:
                        throw new Error('#NAME?');
                }
            }

            function parseArg() {
                // Range check
                if (peek() && peek().type === 'cell' &&
                    tokens[pos + 1] && tokens[pos + 1].type === 'op' && tokens[pos + 1].value === ':' &&
                    tokens[pos + 2] && tokens[pos + 2].type === 'cell') {
                    const start = next().value;
                    next(); // ':'
                    const end = next().value;
                    return getRangeValues(start, end, sheet, visiting);
                }
                return parseExpr();
            }

            try {
                const val = parseExpr();
                if (pos < tokens.length) throw new Error('#ERROR?');
                return val;
            } catch (e) {
                throw e;
            }
        }

        function recalcSheet(sheet) {
            for (const id in sheet.cells) {
                if (Object.prototype.hasOwnProperty.call(sheet.cells, id)) {
                    const cell = sheet.cells[id];
                    if (cell.raw && cell.raw.startsWith('=')) {
                        const visiting = new Set();
                        try {
                            const val = evalFormula(cell.raw.slice(1), sheet, visiting);
                            cell.value = (typeof val === 'number' && !isNaN(val)) ? String(val) : '';
                        } catch (e) {
                            cell.value = e.message || '#ERROR';
                        }
                    }
                }
            }
        }

        // ---------- Grid DOM ----------
        function buildGrid() {
            const table = document.getElementById('grid');
            colgroupEl = document.createElement('colgroup');
            const rowHeaderCol = document.createElement('col');
            rowHeaderCol.width = 50;
            colgroupEl.appendChild(rowHeaderCol);
            for (let c = 0; c < COLS; c++) {
                const col = document.createElement('col');
                col.width = 80;
                colgroupEl.appendChild(col);
            }
            table.appendChild(colgroupEl);

            const thead = document.createElement('thead');
            const tr = document.createElement('tr');
            const corner = document.createElement('th');
            corner.textContent = '';
            tr.appendChild(corner);
            for (let c = 0; c < COLS; c++) {
                const th = document.createElement('th');
                th.textContent = colIndexToName(c);
                th.dataset.col = c;
                th.className = 'col-header';
                const handle = document.createElement('div');
                handle.className = 'resize-handle';
                th.appendChild(handle);
                tr.appendChild(th);
            }
            thead.appendChild(tr);
            table.appendChild(thead);

            const tbody = document.createElement('tbody');
            for (let r = 0; r < ROWS; r++) {
                const trRow = document.createElement('tr');
                const rowHeader = document.createElement('th');
                rowHeader.textContent = r + 1;
                rowHeader.dataset.row = r;
                rowHeader.className = 'row-header';
                trRow.appendChild(rowHeader);
                cellElements[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const td = document.createElement('td');
                    td.dataset.row = r;
                    td.dataset.col = c;
                    td.className = 'cell';
                    trRow.appendChild(td);
                    cellElements[r][c] = td;
                }
                tbody.appendChild(trRow);
            }
            table.appendChild(tbody);
        }

        function updateColumnWidths(sheet) {
            for (let c = 0; c < COLS; c++) {
                colgroupEl.children[c + 1].width = sheet.colWidths[c];
            }
        }

        function updateCellDisplay(row, col, sheet) {
            const td = cellElements[row][col];
            const cell = sheet.cells[cellIdFromRC(row, col)];
            if (cell) {
                td.textContent = cell.value !== undefined ? cell.value : '';
                td.style.fontWeight = cell.style.bold ? 'bold' : '';
                td.style.fontStyle = cell.style.italic ? 'italic' : '';
                td.style.backgroundColor = cell.style.bgColor || '';
            } else {
                td.textContent = '';
                td.style.fontWeight = '';
                td.style.fontStyle = '';
                td.style.backgroundColor = '';
            }
        }

        function renderAll() {
            const sheet = getSheet();
            updateColumnWidths(sheet);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    updateCellDisplay(r, c, sheet);
                }
            }
            updateSelectionUI();
            updateFormulaBar();
        }

        function updateSelectionUI() {
            const minRow = Math.min(selectionStart.row, selectionEnd.row);
            const maxRow = Math.max(selectionStart.row, selectionEnd.row);
            const minCol = Math.min(selectionStart.col, selectionEnd.col);
            const maxCol = Math.max(selectionStart.col, selectionEnd.col);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const td = cellElements[r][c];
                    const inRange = r >= minRow && r <= maxRow && c >= minCol && c <= maxCol;
                    const isActive = r === activeCell.row && c === activeCell.col;
                    td.classList.toggle('range', inRange);
                    td.classList.toggle('active', isActive);
                }
            }
        }

        function isRangeSelected() {
            return selectionStart.row !== selectionEnd.row || selectionStart.col !== selectionEnd.col;
        }

        function getRangeString() {
            if (isRangeSelected()) {
                return cellIdFromRC(selectionStart.row, selectionStart.col) + ':' + cellIdFromRC(selectionEnd.row, selectionEnd.col);
            }
            return cellIdFromRC(activeCell.row, activeCell.col);
        }

        function updateFormulaBar() {
            const addr = isRangeSelected() ? getRangeString() : cellIdFromRC(activeCell.row, activeCell.col);
            document.getElementById('cellAddress').textContent = addr;
            const cell = getCell(activeCell.row, activeCell.col);
            if (document.activeElement !== document.getElementById('formulaInput')) {
                document.getElementById('formulaInput').value = cell ? cell.raw : '';
            }
        }

        // ---------- Sheet Operations ----------
        function switchSheet(index) {
            currentSheetIndex = index;
            activeCell = { row: 0, col: 0 };
            selectionStart = { row: 0, col: 0 };
            selectionEnd = { row: 0, col: 0 };
            editingCell = null;
            renderSheetTabs();
            renderAll();
        }

        function addSheet() {
            sheets.push(createSheet('Sheet' + (sheets.length + 1)));
            switchSheet(sheets.length - 1);
        }

        function renameSheet(index) {
            const newName = prompt('Sheet name:', sheets[index].name);
            if (newName && newName.trim()) {
                sheets[index].name = newName.trim();
                renderSheetTabs();
            }
        }

        function deleteSheet(index) {
            if (sheets.length <= 1) return;
            if (!confirm('Delete sheet "' + sheets[index].name + '"?')) return;
            sheets.splice(index, 1);
            if (currentSheetIndex >= sheets.length) currentSheetIndex = sheets.length - 1;
            else if (currentSheetIndex > index) currentSheetIndex--;
            renderSheetTabs();
            renderAll();
        }

        function renderSheetTabs() {
            const container = document.getElementById('sheetTabs');
            container.innerHTML = '';
            sheets.forEach((sheet, index) => {
                const tab = document.createElement('div');
                tab.className = 'sheet-tab' + (index === currentSheetIndex ? ' active' : '');
                tab.textContent = sheet.name;

                const close = document.createElement('span');
                close.className = 'sheet-close';
                close.textContent = '×';
                close.addEventListener('mousedown', e => e.stopPropagation());
                close.addEventListener('click', e => {
                    e.stopPropagation();
                    deleteSheet(index);
                });

                tab.appendChild(close);
                tab.addEventListener('dblclick', e => {
                    e.stopPropagation();
                    renameSheet(index);
                });
                tab.addEventListener('click', () => switchSheet(index));
                container.appendChild(tab);
            });

            const addBtn = document.createElement('div');
            addBtn.className = 'sheet-add';
            addBtn.textContent = '+';
            addBtn.title = 'Add Sheet';
            addBtn.addEventListener('click', addSheet);
            container.appendChild(addBtn);
        }

        // ---------- Data Editing ----------
        function setCellRaw(row, col, raw) {
            const sheet = getSheet();
            const cell = getCellOfSheet(sheet, row, col);
            cell.raw = raw;
            if (raw.startsWith('=')) {
                cell.value = '';
            } else {
                cell.value = raw;
            }
            recalcSheet(sheet);
            renderAll();
            updateFormulaBar();
        }

        function startEditing(row, col, initialChar) {
            if (editingCell) return;
            const td = cellElements[row][col];
            const cell = getCell(row, col);
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'cell-input';
            input.value = initialChar !== undefined ? initialChar : cell.raw;
            editingOriginal = cell.raw;
            editingCell = { row, col };

            td.innerHTML = '';
            td.appendChild(input);
            input.focus();
            input.select();

            input.addEventListener('keydown', editKeyHandler);
            input.addEventListener('blur', () => commitEdit());
        }

        function editKeyHandler(e) {
            const input = e.target;
            if (e.key === 'Enter') {
                e.preventDefault();
                commitEdit();
                moveActive(1, 0);
            } else if (e.key === 'Tab') {
                e.preventDefault();
                commitEdit();
                moveActive(0, e.shiftKey ? -1 : 1);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                cancelEdit();
            }
        }

        function commitEdit() {
            if (!editingCell) return;
            const { row, col } = editingCell;
            const td = cellElements[row][col];
            const input = td.querySelector('input');
            if (!input) {
                editingCell = null;
                return;
            }
            const raw = input.value;
            editingCell = null;
            td.innerHTML = '';
            setCellRaw(row, col, raw);
        }

        function cancelEdit() {
            if (!editingCell) return;
            const { row, col } = editingCell;
            const td = cellElements[row][col];
            td.innerHTML = '';
            editingCell = null;
            renderAll();
        }

        function moveActive(dr, dc) {
            const newRow = Math.max(0, Math.min(ROWS - 1, activeCell.row + dr));
            const newCol = Math.max(0, Math.min(COLS - 1, activeCell.col + dc));
            activeCell = { row: newRow, col: newCol };
            selectionStart = { row: newRow, col: newCol };
            selectionEnd = { row: newRow, col: newCol };
            updateSelectionUI();
            updateFormulaBar();
        }

        // ---------- Selection & Formula Insertion ----------
        function insertIntoFormulaBar(text) {
            const input = document.getElementById('formulaInput');
            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? start;
            input.setRangeText(text, start, end, 'end');
            input.focus();
        }

        // ---------- Toolbar ----------
        function getSelectedCells() {
            const cells = [];
            const minRow = Math.min(selectionStart.row, selectionEnd.row);
            const maxRow = Math.max(selectionStart.row, selectionEnd.row);
            const minCol = Math.min(selectionStart.col, selectionEnd.col);
            const maxCol = Math.max(selectionStart.col, selectionEnd.col);
            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    cells.push({ row: r, col: c });
                }
            }
            return cells;
        }

        function toggleBold() {
            const cells = getSelectedCells();
            const allBold = cells.every(({ row, col }) => getCell(row, col).style.bold);
            const newBold = !allBold;
            cells.forEach(({ row, col }) => { getCell(row, col).style.bold = newBold; });
            renderAll();
        }

        function toggleItalic() {
            const cells = getSelectedCells();
            const allItalic = cells.every(({ row, col }) => getCell(row, col).style.italic);
            const newItalic = !allItalic;
            cells.forEach(({ row, col }) => { getCell(row, col).style.italic = newItalic; });
            renderAll();
        }

        function clearContents() {
            const cells = getSelectedCells();
            const sheet = getSheet();
            cells.forEach(({ row, col }) => {
                const id = cellIdFromRC(row, col);
                if (sheet.cells[id]) {
                    sheet.cells[id].raw = '';
                    sheet.cells[id].value = '';
                }
            });
            recalcSheet(sheet);
            renderAll();
        }

        // ---------- CSV ----------
        function exportCSV() {
            const sheet = getSheet();
            let maxRow = -1;
            let maxCol = -1;
            for (const id in sheet.cells) {
                const rc = rcFromCellId(id);
                if (rc && sheet.cells[id].raw !== '') {
                    maxRow = Math.max(maxRow, rc.row);
                    maxCol = Math.max(maxCol, rc.col);
                }
            }
            if (maxRow === -1) return;

            const rows = [];
            for (let r = 0; r <= maxRow; r++) {
                const cols = [];
                for (let c = 0; c <= maxCol; c++) {
                    const cell = sheet.cells[cellIdFromRC(r, c)];
                    let val = cell ? cell.value : '';
                    val = String(val);
                    if (val.includes(',') || val.includes('"') || val.includes('\n') || val.includes('\r')) {
                        val = '"' + val.replace(/"/g, '""') + '"';
                    }
                    cols.push(val);
                }
                rows.push(cols.join(','));
            }
            const csv = rows.join('\r\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = sheet.name + '.csv';
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function parseCSV(text) {
            const rows = [];
            let row = [];
            let field = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (inQuotes) {
                    if (ch === '"') {
                        if (text[i + 1] === '"') {
                            field += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        field += ch;
                    }
                } else {
                    if (ch === '"') {
                        inQuotes = true;
                    } else if (ch === ',') {
                        row.push(field);
                        field = '';
                    } else if (ch === '\n' || ch === '\r') {
                        if (ch === '\r' && text[i + 1] === '\n') i++;
                        row.push(field);
                        field = '';
                        rows.push(row);
                        row = [];
                    } else {
                        field += ch;
                    }
                }
            }
            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }
            return rows;
        }

        function importCSV(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const rows = parseCSV(text);
                const sheet = getSheet();
                sheet.cells = {};
                for (let r = 0; r < Math.min(ROWS, rows.length); r++) {
                    const row = rows[r];
                    for (let c = 0; c < Math.min(COLS, row.length); c++) {
                        const raw = row[c].trim();
                        if (raw !== '') {
                            const cell = getCellOfSheet(sheet, r, c);
                            cell.raw = raw;
                            cell.value = raw.startsWith('=') ? '' : raw;
                        }
                    }
                }
                recalcSheet(sheet);
                renderAll();
                document.getElementById('csvFile').value = '';
            };
            reader.readAsText(file);
        }

        // ---------- Event Setup ----------
        function attachEvents() {
            const gridContainer = document.getElementById('gridContainer');
            const formulaInput = document.getElementById('formulaInput');

            // Grid mousedown -> selection drag
            gridContainer.addEventListener('mousedown', (e) => {
                const td = e.target.closest('td[data-row]');
                if (!td) return;
                const row = parseInt(td.dataset.row, 10);
                const col = parseInt(td.dataset.col, 10);

                if (editingCell) {
                    commitEdit();
                }

                const isFormulaActive = document.activeElement === formulaInput;
                if (isFormulaActive) {
                    e.preventDefault(); // keep focus in formula bar
                } else {
                    gridContainer.focus();
                }

                selectionStart = { row, col };
                selectionEnd = { row, col };
                activeCell = { row, col };
                updateSelectionUI();
                updateFormulaBar();

                // Drag
                const onMove = (ev) => {
                    const cell = ev.target.closest('td[data-row]');
                    if (cell) {
                        const r = parseInt(cell.dataset.row, 10);
                        const c = parseInt(cell.dataset.col, 10);
                        if (selectionEnd.row !== r || selectionEnd.col !== c) {
                            selectionEnd = { row: r, col: c };
                            updateSelectionUI();
                            updateFormulaBar();
                        }
                    }
                };

                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    if (document.activeElement === formulaInput) {
                        insertIntoFormulaBar(isRangeSelected() ? getRangeString() : cellIdFromRC(selectionStart.row, selectionStart.col));
                    }
                    updateFormulaBar();
                };

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });

            // Double click to edit
            gridContainer.addEventListener('dblclick', (e) => {
                const td = e.target.closest('td[data-row]');
                if (!td) return;
                const row = parseInt(td.dataset.row, 10);
                const col = parseInt(td.dataset.col, 10);
                if (editingCell) commitEdit();
                startEditing(row, col);
            });

            // Keyboard navigation
            gridContainer.addEventListener('keydown', (e) => {
                if (editingCell) return;
                const key = e.key;
                const ctrl = e.ctrlKey || e.metaKey;
                if (ctrl) return;

                switch (key) {
                    case 'ArrowUp':
                        e.preventDefault();
                        moveActive(-1, 0);
                        break;
                    case 'ArrowDown':
                        e.preventDefault();
                        moveActive(1, 0);
                        break;
                    case 'ArrowLeft':
                        e.preventDefault();
                        moveActive(0, -1);
                        break;
                    case 'ArrowRight':
                        e.preventDefault();
                        moveActive(0, 1);
                        break;
                    case 'Enter':
                        e.preventDefault();
                        moveActive(1, 0);
                        break;
                    case 'Tab':
                        e.preventDefault();
                        moveActive(0, e.shiftKey ? -1 : 1);
                        break;
                    default:
                        if (key.length === 1 && !e.altKey) {
                            e.preventDefault();
                            startEditing(activeCell.row, activeCell.col, key);
                        }
                }
            });

            // Formula bar
            formulaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const raw = formulaInput.value;
                    setCellRaw(activeCell.row, activeCell.col, raw);
                    moveActive(1, 0);
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    const cell = getCell(activeCell.row, activeCell.col);
                    formulaInput.value = cell ? cell.raw : '';
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    const raw = formulaInput.value;
                    setCellRaw(activeCell.row, activeCell.col, raw);
                    moveActive(0, e.shiftKey ? -1 : 1);
                }
            });

            // Toolbar buttons
            document.getElementById('btnBold').addEventListener('click', toggleBold);
            document.getElementById('btnItalic').addEventListener('click', toggleItalic);
            document.getElementById('bgColor').addEventListener('input', (e) => {
                const color = e.target.value;
                getSelectedCells().forEach(({ row, col }) => { getCell(row, col).style.bgColor = color; });
                renderAll();
            });
            document.getElementById('btnClear').addEventListener('click', clearContents);
            document.getElementById('btnDownload').addEventListener('click', exportCSV);
            document.getElementById('btnUpload').addEventListener('click', () => document.getElementById('csvFile').click());
            document.getElementById('csvFile').addEventListener('change', (e) => {
                if (e.target.files.length) importCSV(e.target.files[0]);
            });

            // Column resizing
            const table = document.getElementById('grid');
            table.querySelectorAll('thead th').forEach((th) => {
                const col = parseInt(th.dataset.col, 10);
                if (isNaN(col)) return;
                const handle = th.querySelector('.resize-handle');
                handle.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const sheet = getSheet();
                    const startX = e.clientX;
                    const startWidth = sheet.colWidths[col];
                    const onMove = (ev) => {
                        const dx = ev.clientX - startX;
                        const newWidth = Math.max(30, startWidth + dx);
                        sheet.colWidths[col] = newWidth;
                        updateColumnWidths(sheet);
                    };
                    const onUp = () => {
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
            });
        }

        // ---------- Init ----------
        function init() {
            sheets.push(createSheet('Sheet1'));
            buildGrid();
            renderSheetTabs();
            renderAll();
            attachEvents();
            document.getElementById('gridContainer').focus();
        }

        init();
    </script>
</body>
</html>
