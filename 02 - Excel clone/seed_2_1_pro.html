<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Spreadsheet</title>
<style>
  :root{
    --bg:#f3f2f1; --panel:#fafafa; --border:#d0d0d0; --head:#e7e6e5;
    --sel:#107c41; --sel2:#cfe2d6; --active:#0f6e38; --text:#202020;
    --accent:#2b7cd3; --header-text:#555; --grid:#e1e1e1; --hover:#eef4fb;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:var(--text);font-size:12px}
  .app{height:100%;display:flex;flex-direction:column;background:var(--bg);}

  /* ---- Toolbar ---- */
  .ribbon{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .ribbon .group{display:flex;align-items:center;gap:3px;padding:2px 8px;border-right:1px solid var(--border)}
  .ribbon .group:last-child{border-right:none}
  .btn{background:#fff;border:1px solid #c8c6c4;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px;min-height:24px}
  .btn:hover{background:#f3f2f1;border-color:#a19f9d}
  .btn.active{background:#e1efff;border-color:var(--accent);color:var(--accent)}
  .btn.b{font-weight:700}
  .btn.i{font-style:italic}
  .btn.u{text-decoration:underline}
  .spacer{width:8px}
  input[type="color"]{width:24px;height:24px;padding:0;border:1px solid #c8c6c4;border-radius:4px;background:#fff;cursor:pointer}
  .file-btn{padding:4px 10px}

  /* ---- Name / formula bar ---- */
  .formula-bar{display:flex;align-items:stretch;padding:4px;background:var(--panel);border-bottom:1px solid var(--border);gap:4px}
  .name-box{width:90px;border:1px solid #c8c6c4;border-radius:3px;padding:4px 6px;background:#fff;font-family:Consolas,monospace;font-size:12px;outline:none}
  .fx{width:28px;display:flex;align-items:center;justify-content:center;color:#555;font-style:italic;font-weight:700}
  .formula-input{flex:1;border:1px solid #c8c6c4;border-radius:3px;padding:4px 8px;background:#fff;font-family:Consolas,monospace;font-size:12px;outline:none;min-height:22px}
  .formula-input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}

  /* ---- Grid area ---- */
  .grid-wrap{flex:1;position:relative;overflow:hidden;background:var(--panel)}
  .grid{position:absolute;inset:0;overflow:auto;will-change:transform}
  .grid table{border-collapse:separate;border-spacing:0;table-layout:fixed;}
  .grid th, .grid td{
    border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
    background:#fff; padding:2px 4px; font-size:12px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; position:relative; user-select:none;
    height:22px;
  }
  .grid th{
    background:var(--head); color:var(--header-text); text-align:center; font-weight:400;
    position:sticky; top:0; z-index:3; border-top:1px solid var(--grid);
  }
  .grid th.corner{left:0; z-index:5; width:42px; border-left:1px solid var(--grid)}
  .grid th.col{min-width:84px; width:84px; cursor:col-resize}
  .grid td.row{
    position:sticky; left:0; background:var(--head); color:var(--header-text); text-align:center;
    width:42px; min-width:42px; z-index:2; border-left:1px solid var(--grid);
  }
  .grid td.cell{cursor:cell}
  .grid td.cell.selected{background:var(--sel2)}
  .grid td.cell.active{outline:2px solid var(--active); outline-offset:-2px; background:#fff; z-index:1}
  .grid td.cell.range-selecting{background:#cfe2d6}
  .grid td.cell.bold{font-weight:700}
  .grid td.cell.italic{font-style:italic}
  .grid td.cell.under{text-decoration:underline}
  .grid td.cell.num{text-align:right}
  .col-resizer{position:absolute;top:0;right:-2px;width:5px;cursor:col-resize;z-index:4;height:22px}
  .col-resizer:hover{background:var(--accent);opacity:.4}

  .editor{
    position:absolute; z-index:10;
    border:2px solid var(--accent);
    background:#fff; padding:2px 4px; margin:0; font:inherit; font-size:12px;
    outline:none; box-shadow:0 2px 8px rgba(0,0,0,.12);
    min-height:22px; font-family:Consolas,monospace;
  }

  /* Fill handle */
  .fill-handle{position:absolute;width:6px;height:6px;background:var(--active);right:-3px;bottom:-3px;z-index:6;cursor:crosshair}

  /* ---- Sheets tab bar ---- */
  .sheet-bar{display:flex;align-items:stretch;background:var(--panel);border-top:1px solid var(--border);height:32px}
  .sheet-bar .tabs{display:flex;align-items:stretch;flex:1;overflow-x:auto}
  .tab{
    padding:0 12px; display:inline-flex; align-items:center; gap:8px;
    border-right:1px solid var(--border); cursor:pointer; font-size:12px;
    background:#ecebea; color:#444; white-space:nowrap;
  }
  .tab.active{background:#fff; color:#000; border-bottom:2px solid var(--sel); font-weight:600}
  .tab .x{opacity:.5; font-size:13px; padding:0 2px; border-radius:2px}
  .tab .x:hover{background:#c8c6c4; opacity:1}
  .tab .name{outline:none}
  .tab .name[contenteditable="true"]{background:#ffd}
  .add-sheet{padding:0 10px; background:#ecebea; border:none; font-size:16px; cursor:pointer;color:#444;border-right:1px solid var(--border)}
  .add-sheet:hover{background:#e1dfdd}

  .status{padding:4px 10px;font-size:11px;color:#666;display:flex;gap:14px;border-top:1px solid var(--border);background:var(--panel)}

  /* selection overlay for formula range picking */
  .range-hl{position:absolute;pointer-events:none;background:rgba(16,124,65,.18);border:1px dashed var(--active);z-index:4;}
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">
    <div class="group">
      <button class="btn file-btn" id="csv-in" title="Upload CSV">📥 Import CSV</button>
      <button class="btn file-btn" id="csv-out" title="Download CSV">📤 Export CSV</button>
    </div>
    <div class="group">
      <button class="btn b" id="boldBtn" title="Bold (Ctrl+B)">B</button>
      <button class="btn i" id="italicBtn" title="Italic (Ctrl+I)">I</button>
      <button class="btn u" id="underBtn" title="Underline">U</button>
    </div>
    <div class="group">
      <label for="fcolor" style="font-size:11px;color:#555">Text</label>
      <input type="color" id="fcolor" value="#202020">
      <label for="bcolor" style="font-size:11px;color:#555">Fill</label>
      <input type="color" id="bcolor" value="#ffffff">
    </div>
    <div class="group">
      <button class="btn" id="clearBtn" title="Clear contents (Del)">🧹 Clear</button>
      <button class="btn" id="sumBtn" title="Insert =SUM()">∑</button>
    </div>
  </div>
  <div class="formula-bar">
    <div class="name-box" id="nameBox" contenteditable="true" spellcheck="false">A1</div>
    <div class="fx">fx</div>
    <div class="formula-input" id="formulaBar" contenteditable="true" spellcheck="false"></div>
  </div>
  <div class="grid-wrap">
    <div class="grid" id="gridEl"></div>
  </div>
  <div class="sheet-bar">
    <div class="tabs" id="tabsEl"></div>
    <button class="add-sheet" id="addSheet">+</button>
  </div>
  <div class="status"><span id="status">Ready</span><span id="selInfo"></span></div>
</div>
<input type="file" id="fileInput" accept=".csv,text/csv" style="display:none">

<script>
"use strict";
/* ====================================================================
   Mini Excel clone
   - Multi-sheet workbook with A1..ZZ cols x 500 rows
   - Cells: { raw, value, style:{b,i,u,fc,bc} }
   - Formula engine: numbers, refs, ranges, + - * / ( ), unary -,
     SUM/AVG/AVERAGE/MIN/MAX/COUNT
   - Dependency graph for recalc; cyclic detection.
   - Selection, range selection, in-cell editing, formula-bar editing,
     keyboard nav, column resize, multi-sheet, CSV, toolbar styling.
=================================================================== */

const NUM_COLS = 702; // A..ZZ
const NUM_ROWS = 400;

function colToName(c){
  let s = "";
  c++;
  while (c>0){ const r = (c-1)%26; s = String.fromCharCode(65+r)+s; c = Math.floor((c-1)/26); }
  return s;
}
function nameToCol(n){
  let c = 0;
  for (let i=0;i<n.length;i++){ c = c*26 + (n.charCodeAt(i)-64); }
  return c-1;
}
function cellKey(r,c){ return colToName(c) + (r+1); }
function parseRef(k){
  const m = /^\$?([A-Z]+)\$?(\d+)$/.exec(k.toUpperCase());
  if (!m) return null;
  return { col: nameToCol(m[1]), row: parseInt(m[2])-1 };
}

// --------- Workbook ----------
function makeSheet(name){
  const data = {};
  return { name, data };
}
const state = {
  sheets: [makeSheet("Sheet1")],
  active: 0,
  selStart: {r:0,c:0},
  selEnd: {r:0,c:0},
  activeCell: {r:0,c:0},
  editing: null, // {r,c, target: 'cell'|'formula'}
  colWidths: {},
};
function sheet(){ return state.sheets[state.active]; }

function getCellObj(sheet, r, c){
  const k = r+"_"+c;
  if (!sheet.data[k]) sheet.data[k] = { raw:"", value:undefined, style:{} };
  return sheet.data[k];
}
function getCell(sheet, r, c){
  if (r<0||c<0||r>=NUM_ROWS||c>=NUM_COLS) return { raw:"", value:"", style:{} };
  return getCellObj(sheet, r, c);
}

// ---------- Formula engine ----------
class EvalError { constructor(m){ this.m = m; this.v = "#ERR:"+m; } toString(){ return this.v; } }
const ERR_CYC = new EvalError("CYCLE");
const ERR_ARG = new EvalError("ARG");
const ERR_VAL = new EvalError("VALUE");
const ERR_NA  = new EvalError("REF");

// Tokenize
function tokenize(src){
  const tokens = [];
  let i=0;
  while (i<src.length){
    const c = src[i];
    if (/\s/.test(c)){ i++; continue; }
    if (/[0-9.]/.test(c)){
      let j=i; while(j<src.length && /[0-9.]/.test(src[j])) j++;
      tokens.push({t:'num', v: parseFloat(src.slice(i,j))});
      i=j; continue;
    }
    if (/[A-Za-z_]/.test(c)){
      let j=i; while(j<src.length && /[A-Za-z0-9_]/.test(src[j])) j++;
      const word = src.slice(i,j);
      // cell ref?
      if (/^[A-Z]+$/.test(word) && /[A-Z]/.test(word) && j<src.length && /[0-9]/.test(src[j])){
        let k=j; while(k<src.length && /[0-9]/.test(src[k])) k++;
        tokens.push({t:'ref', v: word+src.slice(j,k) });
        i=k; continue;
      }
      // check for range next? no, ranges only appear as a:b inside func args? parser handles
      tokens.push({t:'ident', v: word.toUpperCase()});
      i=j; continue;
    }
    if ('(),;:'.includes(c)){ tokens.push({t:c}); i++; continue; }
    if ('+-*/^'.includes(c)){ tokens.push({t:'op', v:c}); i++; continue; }
    if (c === '"'){
      let j=i+1, s="";
      while (j<src.length && src[j] !== '"'){ s += src[j++]; if (src[j] === '"') { j++; break; } }
      tokens.push({t:'str', v:s}); i = j; continue;
    }
    if (c === ':' && i>0 && tokens[tokens.length-1].t==='ref'){
      tokens.push({t:':'});
      i++; continue;
    }
    throw new Error("Unexpected char: "+c);
  }
  return tokens;
}

// Parser and eval in one pass, with range resolution passed in via ctx
// ctx has: sheet, evalCell, evaluating:Set
function parse(tokens, ctx){
  let p = 0;
  const peek = () => tokens[p];
  const eat = (t) => {
    const tk = tokens[p];
    if (tk && tk.t === t){ p++; return tk; }
    return null;
  };
  function parseExpr(){ return parseCmp(); }
  function parseCmp(){ return parseAdd(); }
  function parseAdd(){
    let v = parseMul();
    while (peek() && peek().t==='op' && (peek().v==='+'||peek().v==='-')){
      const op = tokens[p++].v;
      const r = parseMul();
      if (op === '+') v = v + r; else v = v - r;
    }
    return v;
  }
  function parseMul(){
    let v = parsePow();
    while (peek() && peek().t==='op' && (peek().v==='*'||peek().v==='/')){
      const op = tokens[p++].v;
      const r = parsePow();
      if (op === '*') v = v * r; else v = v / r;
    }
    return v;
  }
  function parsePow(){
    let v = parseUnary();
    if (peek() && peek().t==='op' && peek().v==='^'){ p++; const e = parseUnary(); v = Math.pow(v,e); }
    return v;
  }
  function parseUnary(){
    if (peek() && peek().t==='op' && peek().v==='-'){ p++; return -parseUnary(); }
    if (peek() && peek().t==='op' && peek().v==='+'){ p++; return parseUnary(); }
    return parsePrim();
  }
  function valuesFromRange(rng){
    // rng is "A1:B2"
    const [a,b] = rng.split(':');
    const ra = parseRef(a), rb = parseRef(b);
    const r1=Math.min(ra.row,rb.row), r2=Math.max(ra.row,rb.row);
    const c1=Math.min(ra.col,rb.col), c2=Math.max(ra.col,rb.col);
    const out = [];
    for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++){
      const v = ctx.evalCell(r, c);
      if (typeof v === 'number') out.push(v);
    }
    return out;
  }
  function parsePrim(){
    const tk = tokens[p];
    if (!tk) throw ERR_VAL;
    if (tk.t === 'num'){ p++; return tk.v; }
    if (tk.t === 'str'){ p++; return tk.v; }
    if (tk.t === 'ref'){
      p++;
      if (peek() && peek().t === ':'){
        p++;
        const next = tokens[p++];
        if (!next || next.t !== 'ref') throw ERR_VAL;
        const rng = tk.v+':'+next.v;
        // ranges valid only inside function args — but outside we return top-left value? error? return cell value from top-left in a range when used in scalar context.
        const parsed = parseRef(tk.v);
        return ctx.evalCell(parsed.row, parsed.col);
      }
      const rr = parseRef(tk.v);
      return ctx.evalCell(rr.row, rr.col);
    }
    if (tk.t === 'ident'){
      p++;
      const name = tk.v;
      eat('(');
      const args = [];
      // parse args, allowing ranges (ref:ref) and arrays
      while (p < tokens.length && peek().t !== ')'){
        // collect one argument: possibly range?
        if (peek().t==='ref'){
          const start = p;
          const saved = p;
          const a = tokens[p++];
          if (peek() && peek().t === ':'){
            p++;
            if (!peek() || peek().t !== 'ref'){ p = saved; args.push(parseExpr()); }
            else {
              const b = tokens[p++];
              args.push({ range: a.v+':'+b.v });
            }
          } else {
            p = saved;
            args.push({ scalar: parseExpr() });
          }
        } else {
          args.push({ scalar: parseExpr() });
        }
        if (peek() && peek().t === ',') p++;
      }
      eat(')');
      // compute arg value lists
      const callArgs = [];
      let totalCount = 0, numCount = 0, numericSum = 0;
      const nums = [];
      for (const a of args){
        if (a.range){
          const rngVals = valuesFromRange(a.range);
          for (const v of rngVals){
            nums.push(v);
            numericSum += v;
            numCount++;
            totalCount++;
          }
        } else {
          const v = a.scalar;
          totalCount++;
          if (typeof v === 'number'){ nums.push(v); numericSum += v; numCount++; }
        }
      }
      switch(name){
        case 'SUM': return nums.reduce((a,b)=>a+b, 0);
        case 'AVERAGE': case 'AVG': return numCount ? numericSum/numCount : 0;
        case 'MIN': return nums.length ? Math.min(...nums) : 0;
        case 'MAX': return nums.length ? Math.max(...nums) : 0;
        case 'COUNT': return numCount;
        case 'COUNTA': return totalCount;
        case 'IF': {
          if (args.length < 2) throw ERR_ARG;
          const cond = args[0].scalar;
          return cond ? args[1].scalar : (args[2] ? args[2].scalar : false);
        }
        case 'ABS': return Math.abs(args[0].scalar);
        case 'ROUND': {
          const n = args[0].scalar, d = args[1] ? args[1].scalar : 0;
          const f = Math.pow(10,d); return Math.round(n*f)/f;
        }
        case 'POWER': return Math.pow(args[0].scalar, args[1].scalar);
        case 'SQRT': return Math.sqrt(args[0].scalar);
        case 'PI': return Math.PI;
        case 'NOW': return Date.now();
        default: throw new EvalError("NAME:"+name);
      }
    }
    if (tk.t === '('){
      p++;
      const v = parseExpr();
      eat(')');
      return v;
    }
    throw ERR_VAL;
  }
  const v = parseExpr();
  if (p < tokens.length) throw ERR_VAL;
  return v;
}

// ---- Dependency tracking + recalc ----
const dependencies = new Map(); // key -> Set of keys that depend on it
function addDep(from, to){ // from depends on to
  if (!dependencies.has(to)) dependencies.set(to, new Set());
  dependencies.get(to).add(from);
}

function toNumber(v){
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v?1:0;
  if (v == null || v === "") return 0;
  const n = parseFloat(v);
  if (isNaN(n)) throw ERR_VAL;
  return n;
}

function evalCell(sheet, r, c, evaluating){
  if (r<0||c<0||r>=NUM_ROWS||c>=NUM_COLS) return 0;
  const cell = getCell(sheet, r, c);
  const k = r+"_"+c;
  if (evaluating.has(k)) throw ERR_CYC;
  evaluating.add(k);
  if (cell._dirty !== false && cell.value !== undefined){ evaluating.delete(k); return cell.value; }
  const raw = (cell.raw ?? "").trim();
  let val;
  try {
    if (raw === ""){
      val = "";
    } else if (raw[0] === '='){
      const tokens = tokenize(raw.slice(1));
      val = parse(tokens, {
        sheet,
        evalCell: (rr, cc) => {
          const k2 = rr+"_"+cc;
          addDep(k, k2);
          return evalCell(sheet, rr, cc, evaluating);
        }
      });
    } else if (/^-?\d+(\.\d+)?$/.test(raw)){
      val = parseFloat(raw);
    } else if (raw === 'TRUE') val = true;
    else if (raw === 'FALSE') val = false;
    else val = raw;
  } catch(e){
    val = e.v || String(e);
  }
  cell.value = val;
  cell._dirty = false;
  evaluating.delete(k);
  return val;
}

function recompute(sheet){
  // invalidate all caches & dependency edges for this sheet
  dependencies.clear();
  for (const k in sheet.data){
    sheet.data[k]._dirty = true;
    sheet.data[k].value = undefined;
  }
  for (const k in sheet.data){
    const [r,c] = k.split('_').map(Number);
    try { evalCell(sheet, r, c, new Set()); } catch(e){ sheet.data[k].value = e.v || "#ERR"; }
  }
}

// -------- Rendering ---------
const gridEl = document.getElementById('gridEl');
let tableEl, thead, tbody;
function buildGrid(){
  gridEl.innerHTML = '';
  tableEl = document.createElement('table');
  thead = document.createElement('thead');
  const trh = document.createElement('tr');
  const corner = document.createElement('th');
  corner.className = 'corner';
  trh.appendChild(corner);
  for (let c=0;c<NUM_COLS;c++){
    const th = document.createElement('th');
    th.className = 'col';
    th.dataset.c = c;
    const label = document.createElement('span');
    label.textContent = colToName(c);
    th.appendChild(label);
    const resizer = document.createElement('div');
    resizer.className = 'col-resizer';
    resizer.dataset.c = c;
    th.appendChild(resizer);
    trh.appendChild(th);
  }
  thead.appendChild(trh);
  tableEl.appendChild(thead);
  tbody = document.createElement('tbody');
  for (let r=0;r<NUM_ROWS;r++){
    const tr = document.createElement('tr');
    const th = document.createElement('td');
    th.className = 'row';
    th.textContent = r+1;
    tr.appendChild(th);
    for (let c=0;c<NUM_COLS;c++){
      const td = document.createElement('td');
      td.className = 'cell';
      td.dataset.r = r; td.dataset.c = c;
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  tableEl.appendChild(tbody);
  gridEl.appendChild(tableEl);
}
buildGrid();

// Column widths
function applyColWidth(c, w){
  state.colWidths[c] = w;
  const idx = c+1;
  tableEl.querySelectorAll('thead th.col:nth-child('+(idx+1)+')').forEach(th => th.style.width = w+'px');
  tableEl.querySelectorAll('tbody td:nth-child('+(idx+1)+')').forEach(td => td.style.width = w+'px');
}
// Set default widths
for (let c=0; c<NUM_COLS; c++) if (!state.colWidths[c]) state.colWidths[c] = 84;
for (let c=0; c<NUM_COLS; c++) applyColWidth(c, state.colWidths[c]);

// Cell formatting rendering
function cellDisplay(cell){
  if (cell.value === undefined || cell.value === null) return '';
  if (typeof cell.value === 'number'){
    if (!isFinite(cell.value)) return '#DIV/0!';
    const rounded = Math.round(cell.value*1e10)/1e10;
    return String(rounded);
  }
  if (cell.value === true) return 'TRUE';
  if (cell.value === false) return 'FALSE';
  if (typeof cell.value === 'string' && cell.value.startsWith('#')) return cell.value;
  return String(cell.value);
}
function renderCell(r,c){
  const td = tbody.children[r].children[c+1];
  const cell = getCell(sheet(), r, c);
  td.classList.toggle('bold', !!cell.style.b);
  td.classList.toggle('italic', !!cell.style.i);
  td.classList.toggle('under', !!cell.style.u);
  td.style.color = cell.style.fc || '';
  td.style.background = cell.style.bc || '';
  const isNum = typeof cell.value === 'number';
  td.classList.toggle('num', isNum);
  td.style.textAlign = isNum ? 'right' : '';
  td.textContent = cellDisplay(cell);
  td.title = cell.raw || '';
}
function renderAll(){
  for (let r=0;r<NUM_ROWS;r++){
    for (let c=0;c<Math.min(NUM_COLS, 40); c++){
      if (sheet().data[r+"_"+c]) renderCell(r,c);
    }
  }
  // render cells that are in viewport after a tick
  renderViewport();
}
function renderViewport(){
  const el = gridEl;
  const scrollTop = el.scrollTop, scrollLeft = el.scrollLeft;
  const h = el.clientHeight, w = el.clientWidth;
  const rowH = 23;
  const r0 = Math.max(0, Math.floor(scrollTop/rowH)-1);
  const r1 = Math.min(NUM_ROWS-1, Math.ceil((scrollTop+h)/rowH)+1);
  let x = 0;
  let c0=0, c1=NUM_COLS-1;
  for (let c=0;c<NUM_COLS;c++){
    const cw = state.colWidths[c];
    if (x + cw >= scrollLeft) { c0 = c; break; }
    x += cw;
  }
  x = 0;
  for (let c=0;c<NUM_COLS;c++){
    const cw = state.colWidths[c];
    if (x >= scrollLeft+w) { c1 = c; break; }
    x += cw;
  }
  c0 = Math.max(0, c0-1); c1 = Math.min(NUM_COLS-1, c1+1);
  for (let r=r0; r<=r1; r++){
    for (let c=c0; c<=c1; c++) renderCell(r,c);
  }
}
gridEl.addEventListener('scroll', renderViewport);

// ---------- Selection ----------
function normalizeSel(){
  return {
    r1: Math.min(state.selStart.r, state.selEnd.r),
    r2: Math.max(state.selStart.r, state.selEnd.r),
    c1: Math.min(state.selStart.c, state.selEnd.c),
    c2: Math.max(state.selStart.c, state.selEnd.c),
  };
}
let selecting = false, pickingRange = false, pickAnchor = null;
function updateSelectionUI(){
  tableEl.querySelectorAll('td.cell').forEach(td => td.classList.remove('selected','active'));
  const {r1,r2,c1,c2} = normalizeSel();
  const ac = state.activeCell;
  for (let r=r1;r<=r2;r++){
    const tr = tbody.children[r];
    if (!tr) break;
    for (let c=c1;c<=c2;c++){
      const td = tr.children[c+1];
      if (td) td.classList.add('selected');
    }
  }
  const tr = tbody.children[ac.r];
  if (tr){
    const td = tr.children[ac.c+1];
    if (td) td.classList.add('active');
  }
  document.getElementById('nameBox').textContent = cellKey(ac.r, ac.c);
  const cell = getCell(sheet(), ac.r, ac.c);
  document.getElementById('formulaBar').textContent = cell.raw ?? '';
  document.getElementById('selInfo').textContent = ` ${r2-r1+1}R × ${c2-c1+1}C`;
  scrollActiveIntoView();
}
function scrollActiveIntoView(){
  const r = state.activeCell.r, c = state.activeCell.c;
  const cw = state.colWidths[c];
  let x=0; for (let i=0;i<c;i++) x += state.colWidths[i];
  const y = r*23;
  const el = gridEl;
  if (x < el.scrollLeft) el.scrollLeft = x;
  if (x + cw > el.scrollLeft + el.clientWidth) el.scrollLeft = x + cw - el.clientWidth + 2;
  if (y < el.scrollTop) el.scrollTop = y;
  if (y + 23 > el.scrollTop + el.clientHeight) el.scrollTop = y + 23 - el.clientHeight + 2;
}
function setActive(r,c, extend=false){
  r = Math.max(0, Math.min(NUM_ROWS-1, r));
  c = Math.max(0, Math.min(NUM_COLS-1, c));
  state.activeCell = {r,c};
  if (!extend){ state.selStart = {r,c}; state.selEnd = {r,c}; }
  else { state.selEnd = {r,c}; }
  updateSelectionUI();
  cancelEdit();
}
function setSel(r1,c1,r2,c2){
  state.selStart = {r:r1,c:c1};
  state.selEnd = {r:r2,c:c2};
  state.activeCell = {r:r1,c:c1};
  updateSelectionUI();
}

function insertRefAtCaret(el, text, selectAfter){
  el.focus();
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !el.contains(sel.anchorNode)){
    el.textContent += text;
    placeCaretEnd(el);
    return;
  }
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const node = document.createTextNode(text);
  range.insertNode(node);
  range.setStartAfter(node);
  range.collapse(true);
  sel.removeAllRanges(); sel.addRange(range);
  if (selectAfter){
    // not needed now
  }
}
gridEl.addEventListener('mousedown', (e) => {
  const td = e.target.closest('td.cell');
  if (!td) return;
  const r = +td.dataset.r, c = +td.dataset.c;
  if (state.editing){
    // If editing formula bar or cell, insert reference
    e.preventDefault();
    const target = state.editing.target === 'formula' ? document.getElementById('formulaBar') : editor;
    if (!pickingRange){
      pickingRange = true;
      pickAnchor = {r,c};
      insertRefAtCaret(target, cellKey(r,c));
      highlightPickingRange();
    } else {
      // extend range: replace previous single ref with range
      replaceLastRefWithRange(target, pickAnchor, {r,c});
      highlightPickingRange();
    }
    state.selStart = {r: Math.min(pickAnchor.r, r), c: Math.min(pickAnchor.c, c)};
    state.selEnd = {r: Math.max(pickAnchor.r, r), c: Math.max(pickAnchor.c, c)};
    state.activeCell = {r,c};
    updateSelectionUI();
    return;
  }
  if (e.shiftKey){
    setActive(r,c,true);
  } else {
    state.selStart = {r,c}; state.selEnd = {r,c};
    state.activeCell = {r,c};
    updateSelectionUI();
    selecting = true;
  }
});
function replaceLastRefWithRange(target, a, b){
  const r1 = Math.min(a.r,b.r), r2 = Math.max(a.r,b.r);
  const c1 = Math.min(a.c,b.c), c2 = Math.max(a.c,b.c);
  const oneRef = (a2,b2)=>{
    if (a2.r===b2.r && a2.c===b2.c) return cellKey(a2.r,a2.c);
    return cellKey(r1,c1)+':'+cellKey(r2,c2);
  };
  const text = target.textContent;
  // Replace the trailing reference that we just added (or any trailing reference)
  const re = /(?:[A-Z]+\d+)(?::[A-Z]+\d+)?\s*$/;
  target.textContent = text.replace(re, oneRef(a,b));
  placeCaretEnd(target);
}
function highlightPickingRange(){
  const s = normalizeSel();
  tableEl.querySelectorAll('.range-hl').forEach(el=>el.remove());
  const tr0 = tbody.children[s.r1], trN = tbody.children[s.r2];
  if (!tr0 || !trN) return;
  const td0 = tr0.children[s.c1+1];
  const tdN = trN.children[s.c2+1];
  const r0 = gridEl.getBoundingClientRect();
  const p0 = td0.getBoundingClientRect();
  const pN = tdN.getBoundingClientRect();
  const hl = document.createElement('div');
  hl.className = 'range-hl';
  hl.style.left = (p0.left - r0.left + gridEl.scrollLeft) + 'px';
  hl.style.top = (p0.top - r0.top + gridEl.scrollTop) + 'px';
  hl.style.width = ((pN.left + pN.width) - p0.left) + 'px';
  hl.style.height = ((pN.top + pN.height) - p0.top) + 'px';
  gridEl.appendChild(hl);
}
window.addEventListener('mouseup', () => {
  selecting = false;
  if (pickingRange){
    pickingRange = false;
    pickAnchor = null;
    setTimeout(()=> document.querySelectorAll('.range-hl').forEach(el=>el.remove()), 600);
  }
});
gridEl.addEventListener('mousemove', (e) => {

    state.selStart = {r: Math.min(pickAnchor.r, r), c: Math.min(pickAnchor.c, c)};
    state.selEnd = {r: Math.max(pickAnchor.r, r), c: Math.max(pickAnchor.c, c)};
    state.activeCell = {r,c};
    updateSelectionUI();
    // update formula text
    const target = state.editing && state.editing.target === 'formula' ? document.getElementById('formulaBar') : editor;
    if (target) replaceLastRefWithRange(target, pickAnchor, {r,c});
    highlightPickingRange();
  }
});

// -------- Inline cell editing ----------
let editor;
function cancelEdit(){
  if (editor){ editor.remove(); editor = null; state.editing = null; }
}
function commitEdit(value){
  if (!state.editing) return;
  const {r,c} = state.editing;
  if (value !== undefined){
    getCell(sheet(), r, c).raw = value;
    recompute(sheet());
    renderAll();
  }
  cancelEdit();
  updateSelectionUI();
  gridEl.focus();
}
function beginEdit(r,c, target){
  cancelEdit();
  state.editing = {r,c, target};
  const tr = tbody.children[r];
  const td = tr.children[c+1];
  const cell = getCell(sheet(), r,c);
  const initialRaw = cell.raw ?? '';
  document.getElementById('formulaBar').textContent = initialRaw;
  if (target === 'cell'){
    editor = document.createElement('div');
    editor.className = 'editor';
    editor.contentEditable = 'true';
    editor.spellcheck = false;
    editor.textContent = initialRaw;
    const rect = td.getBoundingClientRect();
    const parentRect = gridEl.getBoundingClientRect();
    editor.style.left = (rect.left - parentRect.left + gridEl.scrollLeft - 1) + 'px';
    editor.style.top = (rect.top - parentRect.top + gridEl.scrollTop - 1) + 'px';
    editor.style.width = (rect.width+2) + 'px';
    editor.style.minHeight = (rect.height+2) + 'px';
    gridEl.appendChild(editor);
    editor.focus();
    const range = document.createRange(); range.selectNodeContents(editor);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
    editor.addEventListener('input', () => {
      document.getElementById('formulaBar').textContent = editor.textContent;
    });
    editor.addEventListener('keydown', onEditorKey);
  } else {
    const fb = document.getElementById('formulaBar');
    fb.focus();
    placeCaretEnd(fb);
  }
}
function onEditorKey(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    commitEdit(editor.textContent);
    setActive(state.editing.r+1, state.editing.c);
  } else if (e.key === 'Tab'){
    e.preventDefault();
    commitEdit(editor.textContent);
    setActive(state.editing.r, state.editing.c + (e.shiftKey?-1:1));
  } else if (e.key === 'Escape'){
    e.preventDefault(); cancelEdit();
  }
}
document.getElementById('formulaBar').addEventListener('focus', () => {
  if (!state.editing) beginEdit(state.activeCell.r, state.activeCell.c, 'formula');
  else state.editing.target = 'formula';
});
document.getElementById('formulaBar').addEventListener('keydown', e => {
  if (e.key === 'Tab'){
    e.preventDefault();
    const text = document.getElementById('formulaBar').textContent;
    if (state.editing) commitEdit(text);
    setActive(state.editing ? state.editing.r : state.activeCell.r, (state.editing?state.editing.c:state.activeCell.c) + (e.shiftKey?-1:1));
  }
});

// ---- Keyboard navigation ----
gridEl.tabIndex = 0;
gridEl.addEventListener('keydown', e => {
  if (state.editing) return;
  const ac = state.activeCell;
  if (e.key === 'ArrowUp'){ setActive(ac.r-1, ac.c, e.shiftKey); e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ setActive(ac.r+1, ac.c, e.shiftKey); e.preventDefault(); }
  else if (e.key === 'ArrowLeft'){ setActive(ac.r, ac.c-1, e.shiftKey); e.preventDefault(); }
  else if (e.key === 'ArrowRight'){ setActive(ac.r, ac.c+1, e.shiftKey); e.preventDefault(); }
  else if (e.key === 'Tab'){ setActive(ac.r, ac.c + (e.shiftKey?-1:1)); e.preventDefault(); }
  else if (e.key === 'Enter'){
    if (e.shiftKey) setActive(ac.r-1, ac.c);
    else { beginEdit(ac.r, ac.c, 'cell'); e.preventDefault(); }
  }
  else if (e.key === 'F2'){ beginEdit(ac.r, ac.c, 'cell'); e.preventDefault(); }
  else if (e.key === 'Delete' || e.key === 'Backspace'){
    clearSelection(); e.preventDefault();
  }
  else if (e.ctrlKey || e.metaKey){
    if (e.key === 'b'){ toggleStyle('b'); e.preventDefault(); }
    else if (e.key === 'i'){ toggleStyle('i'); e.preventDefault(); }
    else if (e.key === 'u'){ toggleStyle('u'); e.preventDefault(); }
    else if (e.key === 'c') copySelection();
    else if (e.key === 'v') navigator.clipboard?.readText().then(t=>pasteText(t));
    else if (e.key === 'a') setSel(0,0,NUM_ROWS-1, NUM_COLS-1);
  }
  else if (e.key.length === 1 || e.key === '='){
    // start editing with this key
    beginEdit(ac.r, ac.c, 'cell');
    editor.textContent = e.key;
    placeCaretEnd(editor);
    e.preventDefault();
  }
});
function placeCaretEnd(el){
  const range = document.createRange(); range.selectNodeContents(el); range.collapse(false);
  const s = window.getSelection(); s.removeAllRanges(); s.addRange(range);
}

function clearSelection(){
  const {r1,r2,c1,c2} = normalizeSel();
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++){
    const k = r+"_"+c;
    const cell = sheet().data[k];
    if (cell){
      cell.raw = ''; cell.value = ''; cell._dirty = true;
    }
  }
  recompute(sheet()); renderAll();
}

// ----- Styling -----
function applyToSelection(fn){
  const {r1,r2,c1,c2} = normalizeSel();
  for (let r=r1;r<=r2;r++) for (let c=c1;c<=c2;c++){
    const cell = getCell(sheet(),r,c);
    fn(cell.style);
  }
  renderAll();
}
function toggleStyle(prop){
  applyToSelection(s => s[prop] = !s[prop]);
}

  }
  const cell = getCell(sheet(), targetR, targetC);
  cell.raw = formula;
  recompute(sheet()); renderAll();

};

// ------ Copy/Paste (tab-separated) ------
function copySelection(){
  const {r1,r2,c1,c2} = normalizeSel();
  let out = '';
  for (let r=r1;r<=r2;r++){
    const rows = [];
    for (let c=c1;c<=c2;c++){
      const cell = getCell(sheet(), r,c);
      const v = cell.raw ?? (cell.value ?? '');
      rows.push(String(v).replace(/\t/g,' ').replace(/\n/g,' '));
    }
    out += rows.join('\t') + '\n';
  }
  navigator.clipboard?.writeText(out);
}
function pasteText(text){
  if (!text) return;
  const lines = text.replace(/\r/g,'').split('\n');
  if (lines[lines.length-1] === '') lines.pop();
  const ac = state.activeCell;
  for (let r=0;r<lines.length;r++){
    const parts = lines[r].split('\t');
    for (let c=0;c<parts.length;c++){
      const cell = getCell(sheet(), ac.r+r, ac.c+c);
      cell.raw = parts[c];
    }
  }
  recompute(sheet()); renderAll();
}

document.getElementById('csv-out').addEventListener('click', () => {
  const {r1,r2,c1,c2} = normalizeSel();
  let out = '';
  for (let r=r1; r<=r2; r++){
    const line = [];
    for (let c=c1; c<=c2; c++){
      const cell = getCell(sheet(),r,c);
      let v = cell.value ?? '';
      if (typeof v === 'string' && (v.includes(',') || v.includes('"') || v.includes('\n'))){
        v = '"' + v.replace(/"/g,'""') + '"';
      }
      line.push(v);
    }
    out += line.join(',') + '\n';
  }
  const blob = new Blob([out], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = sheet().name + '.csv';
  a.click();
});
document.getElementById('csv-in').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  const text = await f.text();
  const lines = text.replace(/\r/g,'').split('\n');
  // Clear current sheet selected area first? Just place at active cell.
  const ac = state.activeCell;
  let maxR = 0, maxC = 0;
  for (let r=0;r<lines.length;r++){
    if (lines[r] === '' && r === lines.length-1) continue;
    const cells = parseCsvLine(lines[r]);
    for (let c=0;c<cells.length;c++){
      const cell = getCell(sheet(), ac.r+r, ac.c+c);
      cell.raw = cells[c];
      maxR = Math.max(maxR, ac.r+r);
      maxC = Math.max(maxC, ac.c+c);
    }
  }
  recompute(sheet()); renderAll();
  setSel(ac.r, ac.c, maxR, maxC);
  e.target.value = '';
});
function parseCsvLine(line){
  const out = []; let cur = ''; let inQ = false;
  for (let i=0;i<line.length;i++){
    const ch = line[i];
    if (inQ){
      if (ch === '"' && line[i+1] === '"'){ cur += '"'; i++; }
      else if (ch === '"') inQ = false;
      else cur += ch;
    } else {
      if (ch === ','){ out.push(cur); cur=''; }
      else if (ch === '"') inQ = true;
      else cur += ch;
    }
  }
  out.push(cur);
  return out;
}

    [0,9,'Total'],[1,9,'=SUM(B5:B8)'],[2,9,'=SUM(C5:C8)'],[3,9,'=SUM(D5:D8)'],[4,9,'=SUM(E5:E8)'],[5,9,'=SUM(B10:E10)'],
    [0,11,'Average'],[1,11,'=AVERAGE(B5:B8)'],
    [0,12,'Max'],[1,12,'=MAX(B5:E8)'],
    [0,13,'Min'],[1,13,'=MIN(B5:E8)'],
    [0,15,'Try clicking cells, typing =A1+B2, or =SUM( ... )'],
    [0,16,'Double-click a cell · Enter/Tab to navigate · Drag to select ranges'],
  ];
  for (const [r,c,v] of demos){
    getCell(s, r, c).raw = v;
  }
  // bold headings
  getCell(s,0,0).style = {b:true, bc:'#107c41', fc:'#fff'};
  getCell(s,0,3).style = {b:true};
  for (let c=1;c<=5;c++) getCell(s, c, 3).style = {b:true};
  for (let r=4;r<=7;r++) getCell(s,0,r).style = {b:true};
  getCell(s,0,9).style = {b:true};
  for (let c=1;c<=5;c++) getCell(s,c,9).style = {b:true, bc:'#e7f1eb'};
  recompute(s);
  renderAll();
  setActive(0,1);
})();
updateSelectionUI();
requestAnimationFrame(() => {
  gridEl.scrollTop = 0;
  gridEl.scrollLeft = 0;
  renderViewport();
});
window.addEventListener('resize', renderViewport);

// Status
document.getElementById('status').textContent = 'Ready · click a cell and start typing. Begin formulas with =';
</script>
