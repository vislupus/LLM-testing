<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel - Standalone Spreadsheet App</title>
    <!-- Lucide Icons for a modern Look -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary-color: #107c41; /* Excel green */
            --primary-hover: #0f703a;
            --border-color: #e1e1e1;
            --border-dark: #bbb;
            --grid-line: #e2e3e5;
            --header-bg: #f8f9fa;
            --header-selected: #e1dfdd;
            --selected-cell-bg: rgba(16, 124, 65, 0.08);
            --selection-border: #107c41;
            --text-color: #333;
            --toolbar-bg: #f3f2f1;
            --active-tab-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
            color: var(--text-color);
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Top Title & Menu Bar */
        .title-bar {
            background-color: var(--primary-color);
            color: white;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
        }

        .title-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-logo {
            background-color: white;
            color: var(--primary-color);
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* Toolbar Styles */
        .toolbar {
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 2px;
            border-right: 1px solid var(--border-dark);
            padding-right: 8px;
            margin-right: 4px;
        }

        .tool-group:last-child {
            border-right: none;
            padding-right: 0;
            margin-right: 0;
        }

        .btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: #323130;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background-color: #edebe9;
        }

        .btn.active {
            background-color: #e1dfdd;
            border-color: #8a8886;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .color-picker-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .color-picker-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            top: 0;
            left: 0;
        }

        /* Formula Bar Styles */
        .formula-bar-container {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
            padding: 4px 8px;
            gap: 8px;
        }

        .cell-address-box {
            width: 70px;
            min-width: 70px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 4px 6px;
            font-family: Consolas, Monaco, monospace;
            font-weight: bold;
            text-align: center;
            background-color: #f8f9fa;
        }

        .formula-fx {
            font-family: "Georgia", serif;
            font-style: italic;
            font-weight: bold;
            color: #7f7f7f;
            user-select: none;
            padding: 0 4px;
        }

        .formula-input {
            flex-grow: 1;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 4px 8px;
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            outline: none;
        }

        .formula-input:focus {
            border-color: var(--primary-color);
        }

        /* Spreadsheet Main Area */
        .spreadsheet-container {
            flex-grow: 1;
            position: relative;
            overflow: auto;
            background-color: #f3f2f1;
        }

        /* The Grid Table */
        .excel-table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            background-color: white;
        }

        /* Grid Headers */
        .excel-table th, .excel-table td {
            border-right: 1px solid var(--grid-line);
            border-bottom: 1px solid var(--grid-line);
            font-weight: normal;
            position: relative;
        }

        /* Row Index / Column Headers */
        .excel-table th {
            background-color: var(--header-bg);
            color: #555;
            font-size: 11px;
            text-align: center;
            vertical-align: middle;
            user-select: none;
        }

        /* Top-Left Blank Header corner */
        .corner-header {
            z-index: 5;
            position: sticky;
            top: 0;
            left: 0;
            border-right: 2px solid var(--border-dark) !important;
            border-bottom: 2px solid var(--border-dark) !important;
            width: 40px;
            min-width: 40px;
            height: 25px;
        }

        /* Sticky Columns/Rows for scrolling */
        .column-header {
            position: sticky;
            top: 0;
            z-index: 3;
            border-bottom: 2px solid var(--border-dark) !important;
            height: 25px;
        }

        .row-header {
            position: sticky;
            left: 0;
            z-index: 3;
            border-right: 2px solid var(--border-dark) !important;
            width: 40px;
            min-width: 40px;
            font-weight: 600;
        }

        /* Header Selection Styles */
        .column-header.selected-header, .row-header.selected-header {
            background-color: var(--header-selected);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Cells */
        .excel-cell {
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            outline: none;
            background-color: #ffffff;
            cursor: cell;
            font-size: 13px;
            line-height: 24px;
            height: 25px;
        }

        /* Align classes */
        .align-left { text-align: left; }
        .align-center { text-align: center; }
        .align-right { text-align: right; }

        /* Cell Selection & Styling */
        .excel-cell.selected {
            background-color: var(--selected-cell-bg);
        }

        /* We will draw selection borders via absolute overlay divs dynamically to support fast dragging and seamless border outlines like Excel */
        .selection-box {
            position: absolute;
            border: 2px solid var(--selection-border);
            pointer-events: none;
            z-index: 10;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5);
            display: none;
        }

        .fill-handle {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: var(--selection-border);
            border: 1px solid white;
            bottom: -3px;
            right: -3px;
            cursor: crosshair;
            z-index: 11;
            pointer-events: auto;
        }

        /* Inline Cell Editor */
        .cell-editor {
            position: absolute;
            border: 2px solid var(--selection-border);
            background: white;
            outline: none;
            z-index: 12;
            padding: 0 4px;
            font-size: 13px;
            line-height: 24px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            display: none;
            overflow: hidden;
        }

        /* Resize Handles */
        .col-resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            z-index: 4;
        }

        .col-resize-handle:hover {
            background-color: var(--primary-color);
        }

        /* Sheet Tabs Bar */
        .sheets-bar {
            display: flex;
            align-items: center;
            background-color: #f3f2f1;
            border-top: 1px solid var(--border-color);
            padding: 0 8px;
            height: 32px;
            user-select: none;
        }

        .sheets-container {
            display: flex;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }

        .sheets-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .sheet-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            background-color: #e1dfdd;
            border: 1px solid var(--border-color);
            border-bottom: none;
            border-radius: 4px 4px 0 0;
            margin-right: 2px;
            cursor: pointer;
            font-weight: 500;
            position: relative;
            font-size: 12px;
            height: 32px;
            top: 1px;
            transition: all 0.1s ease;
        }

        .sheet-tab.active {
            background-color: var(--active-tab-bg);
            border-color: var(--border-dark) var(--border-dark) transparent var(--border-dark);
            font-weight: bold;
            color: var(--primary-color);
            border-top: 3px solid var(--primary-color);
            height: 33px;
            top: 0;
            z-index: 2;
        }

        .sheet-tab:hover:not(.active) {
            background-color: #edebe9;
        }

        .sheet-tab-close {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            color: #666;
            font-size: 10px;
        }

        .sheet-tab-close:hover {
            background-color: #e1dfdd;
            color: #333;
        }

        .add-sheet-btn {
            background: transparent;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #323130;
            margin-left: 6px;
        }

        .add-sheet-btn:hover {
            background-color: #edebe9;
        }

        /* Status Bar */
        .status-bar {
            background-color: var(--primary-color);
            color: white;
            padding: 4px 16px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Hidden File Inputs */
        #csv-upload-input {
            display: none;
        }

        /* Quick Tooltips / Modals for rename sheet */
        .rename-modal {
            position: absolute;
            background: white;
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 100;
            display: none;
        }

        .rename-modal input {
            padding: 4px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            outline: none;
            font-size: 12px;
            width: 120px;
        }

        .rename-modal input:focus {
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

    <!-- Title / Logo Bar -->
    <div class="title-bar">
        <div class="title-bar-left">
            <span class="title-logo">X</span>
            <span>WebExcel</span>
        </div>
        <div style="font-size: 11px; opacity: 0.85;">Standalone Spreadsheets</div>
    </div>

    <!-- Toolbar Area -->
    <div class="toolbar">
        <!-- Clipboard / CSV Group -->
        <div class="tool-group">
            <button class="btn btn-primary" onclick="triggerCSVUpload()" title="Import CSV File">
                <i data-lucide="upload" style="width: 14px; height: 14px;"></i> Upload CSV
            </button>
            <input type="file" id="csv-upload-input" accept=".csv" onchange="handleCSVUpload(event)">
            <button class="btn" onclick="exportToCSV()" title="Export sheet as CSV">
                <i data-lucide="download" style="width: 14px; height: 14px;"></i> Export CSV
            </button>
        </div>

        <!-- Font / Style Group -->
        <div class="tool-group">
            <button class="btn" id="btn-bold" onclick="toggleStyle('bold')" title="Toggle Bold text">
                <i data-lucide="bold" style="width: 14px; height: 14px;"></i>
            </button>
            <button class="btn" id="btn-italic" onclick="toggleStyle('italic')" title="Toggle Italic text">
                <i data-lucide="italic" style="width: 14px; height: 14px;"></i>
            </button>
        </div>

        <!-- Text Alignment Group -->
        <div class="tool-group">
            <button class="btn" id="btn-align-left" onclick="setAlignment('left')" title="Align Left">
                <i data-lucide="align-left" style="width: 14px; height: 14px;"></i>
            </button>
            <button class="btn" id="btn-align-center" onclick="setAlignment('center')" title="Align Center">
                <i data-lucide="align-center" style="width: 14px; height: 14px;"></i>
            </button>
            <button class="btn" id="btn-align-right" onclick="setAlignment('right')" title="Align Right">
                <i data-lucide="align-right" style="width: 14px; height: 14px;"></i>
            </button>
        </div>

        <!-- Colors Group -->
        <div class="tool-group">
            <div class="color-picker-wrapper btn" title="Cell Background Color">
                <i data-lucide="paint-bucket" style="width: 14px; height: 14px; color: #d83b01;"></i>
                <input type="color" class="color-picker-input" onchange="setCellColor(this.value)">
                <span>Fill Color</span>
            </div>
            <div class="color-picker-wrapper btn" title="Text Color">
                <i data-lucide="palette" style="width: 14px; height: 14px; color: #0078d4;"></i>
                <input type="color" class="color-picker-input" onchange="setTextColor(this.value)">
                <span>Text Color</span>
            </div>
        </div>

        <!-- Edit Actions Group -->
        <div class="tool-group">
            <button class="btn" onclick="clearSelectedContents()" title="Clear contents of selected cells">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> Clear Content
            </button>
        </div>
    </div>

    <!-- Formula Bar -->
    <div class="formula-bar-container">
        <div class="cell-address-box" id="formula-cell-address">A1</div>
        <div class="formula-fx">fx</div>
        <input type="text" class="formula-input" id="formula-bar-input" placeholder="Enter value or formula (e.g., =SUM(A1:B5))" autocomplete="off">
    </div>

    <!-- Main Spreadsheet Grid Workspace -->
    <div class="spreadsheet-container" id="grid-container" onscroll="handleGridScroll()">
        <!-- Custom Excel borders overlay -->
        <div class="selection-box" id="grid-selection-box">
            <div class="fill-handle" id="grid-fill-handle"></div>
        </div>
        <div class="cell-editor" id="cell-editor-input" contenteditable="true"></div>

        <table class="excel-table" id="excel-grid">
            <!-- Headers and Cells dynamically generated here -->
        </table>
    </div>

    <!-- Sheets / Tab bar -->
    <div class="sheets-bar">
        <div class="sheets-container" id="sheets-tab-container">
            <!-- Dynamic Sheet Tabs will be inserted here -->
        </div>
        <button class="add-sheet-btn" onclick="addNewSheet()" title="Insert new sheet">
            <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
        </button>
    </div>

    <!-- Status Bar / Info -->
    <div class="status-bar">
        <div>Ready</div>
        <div id="selection-summary">Sum: 0 | Average: 0 | Count: 0</div>
    </div>

    <!-- Modal for renaming tab -->
    <div class="rename-modal" id="sheet-rename-modal">
        <input type="text" id="sheet-rename-input">
    </div>

    <script>
        // --- CONSTANTS & CONFIGS ---
        const DEFAULT_COLS = 26; // A to Z
        const DEFAULT_ROWS = 100;

        // --- CORE APPLICATION STATE ---
        let sheets = {}; // Format: { sheetId: { id, name, cells: { 'A1': { value, formula, styles: {} } }, colWidths: {} } }
        let currentSheetId = '';
        let selectedRange = { startRow: 1, startCol: 1, endRow: 1, endCol: 1 };
        let activeCell = { row: 1, col: 1 };
        let isSelecting = false;
        let isEditing = false;
        let formulaSelectionMode = false; // flag when user selects cells while typing formula
        let colWidths = {}; // For current active sheet, format: { colIndex: width }

        // Initialize Lucide Icons
        lucide.createIcons();

        // --- INITIALIZATION ---
        window.onload = function() {
            // Setup First sheet
            addNewSheet("Sheet1");
            renderSheets();
            selectCell(1, 1);

            // Set up Global event handlers
            document.addEventListener('mouseup', handleGlobalMouseUp);
            document.addEventListener('keydown', handleGlobalKeyDown);

            // Formula Bar Interactivity
            const fBar = document.getElementById('formula-bar-input');
            fBar.addEventListener('focus', () => {
                formulaSelectionMode = fBar.value.startsWith('=');
            });
            fBar.addEventListener('input', (e) => {
                formulaSelectionMode = e.target.value.startsWith('=');
                updateActiveCellFromFormulaBar(e.target.value);
            });
            fBar.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    finishEditing();
                    fBar.blur();
                    e.preventDefault();
                }
            });

            // Prevent window default shortcuts for save
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                }
            });
        };

        // --- HELPER UTILITIES ---
        function getColName(colIdx) {
            let temp, colName = "";
            while (colIdx > 0) {
                temp = (colIdx - 1) % 26;
                colName = String.fromCharCode(65 + temp) + colName;
                colIdx = (colIdx - temp - 1) / 26;
            }
            return colName;
        }

        function getColIndex(colName) {
            let colIdx = 0;
            for (let i = 0; i < colName.length; i++) {
                colIdx = colIdx * 26 + (colName.charCodeAt(i) - 64);
            }
            return colIdx;
        }

        function getCellId(row, col) {
            return `${getColName(col)}${row}`;
        }

        function parseCellId(cellId) {
            const match = cellId.match(/^([A-Z]+)([0-9]+)$/);
            if (!match) return null;
            return {
                row: parseInt(match[2]),
                col: getColIndex(match[1])
            };
        }

        // --- SHEET MANAGEMENT ---
        function addNewSheet(name) {
            const id = 'sheet-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            if (!name) {
                name = `Sheet${Object.keys(sheets).length + 1}`;
            }
            sheets[id] = {
                id: id,
                name: name,
                cells: {},
                colWidths: {}
            };
            currentSheetId = id;
            colWidths = sheets[id].colWidths;
            renderSheets();
            buildGrid();
            selectCell(1, 1);
            return id;
        }

        function switchSheet(id) {
            if (isEditing) finishEditing();
            currentSheetId = id;
            colWidths = sheets[id].colWidths;
            renderSheets();
            buildGrid();
            selectCell(1, 1);
        }

        function renameSheet(id) {
            const modal = document.getElementById('sheet-rename-modal');
            const input = document.getElementById('sheet-rename-input');
            const tabElement = document.getElementById(`tab-${id}`);
            const rect = tabElement.getBoundingClientRect();

            modal.style.left = `${rect.left}px`;
            modal.style.top = `${rect.top - 40}px`;
            modal.style.display = 'block';
            input.value = sheets[id].name;
            input.focus();
            input.select();

            const finishRename = () => {
                const newName = input.value.trim();
                if (newName) {
                    sheets[id].name = newName;
                    renderSheets();
                }
                modal.style.display = 'none';
                window.removeEventListener('click', outsideClick);
            };

            const outsideClick = (e) => {
                if (!modal.contains(e.target) && !tabElement.contains(e.target)) {
                    finishRename();
                }
            };

            input.onkeydown = (e) => {
                if (e.key === 'Enter') finishRename();
                if (e.key === 'Escape') modal.style.display = 'none';
            };

            setTimeout(() => {
                window.addEventListener('click', outsideClick);
            }, 50);
        }

        function deleteSheet(id, event) {
            if (event) event.stopPropagation();
            if (Object.keys(sheets).length <= 1) {
                alert("A workbook must contain at least one visible worksheet.");
                return;
            }
            if (confirm(`Are you sure you want to delete worksheet "${sheets[id].name}"?`)) {
                delete sheets[id];
                if (currentSheetId === id) {
                    currentSheetId = Object.keys(sheets)[0];
                    colWidths = sheets[currentSheetId].colWidths;
                }
                renderSheets();
                buildGrid();
                selectCell(1, 1);
            }
        }

        function renderSheets() {
            const container = document.getElementById('sheets-tab-container');
            container.innerHTML = '';
            Object.keys(sheets).forEach(id => {
                const sheet = sheets[id];
                const activeClass = id === currentSheetId ? 'active' : '';
                const tab = document.createElement('div');
                tab.className = `sheet-tab ${activeClass}`;
                tab.id = `tab-${id}`;
                tab.onclick = () => switchSheet(id);
                tab.ondblclick = () => renameSheet(id);
                tab.innerHTML = `
                    <span>${sheet.name}</span>
                    <span class="sheet-tab-close" onclick="deleteSheet('${id}', event)">✕</span>
                `;
                container.appendChild(tab);
            });
        }

        // --- GRID RENDERING & BUILD ---
        function buildGrid() {
            const table = document.getElementById('excel-grid');
            table.innerHTML = '';

            // Generate Columns Header row
            const trHeader = document.createElement('tr');
            const corner = document.createElement('th');
            corner.className = 'corner-header';
            trHeader.appendChild(corner);

            for (let c = 1; c <= DEFAULT_COLS; c++) {
                const th = document.createElement('th');
                th.className = 'column-header';
                th.dataset.col = c;
                th.innerHTML = `
                    ${getColName(c)}
                    <div class="col-resize-handle" onmousedown="startColResize(event, ${c})"></div>
                `;
                // custom width if stored
                if (colWidths[c]) {
                    th.style.width = colWidths[c] + 'px';
                } else {
                    th.style.width = '100px'; // default
                }
                trHeader.appendChild(th);
            }
            table.appendChild(trHeader);

            // Generate rows
            for (let r = 1; r <= DEFAULT_ROWS; r++) {
                const tr = document.createElement('tr');

                // Row indicator header
                const thRow = document.createElement('th');
                thRow.className = 'row-header';
                thRow.dataset.row = r;
                thRow.innerText = r;
                tr.appendChild(thRow);

                // Row Cells
                for (let c = 1; c <= DEFAULT_COLS; c++) {
                    const td = document.createElement('td');
                    td.className = 'excel-cell';
                    td.id = `cell-${r}-${c}`;
                    td.dataset.row = r;
                    td.dataset.col = c;

                    // Mouse interactions
                    td.onmousedown = (e) => handleCellMouseDown(e, r, c);
                    td.onmouseover = (e) => handleCellMouseOver(r, c);
                    td.ondblclick = () => startEditing();

                    // Apply styles saved in state
                    applyCellVisualStyles(td, r, c);

                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }

            // Sync visual data
            recalculateAllCells();
            syncGridDisplay();
        }

        function handleGridScroll() {
            // Keep the relative absolute selection elements in sync when scrolling
            updateSelectionVisuals();
        }

        // --- COLUMN RESIZING ---
        function startColResize(e, colIndex) {
            e.stopPropagation();
            e.preventDefault();
            const th = document.querySelector(`.column-header[data-col='${colIndex}']`);
            const startWidth = th.offsetWidth;
            const startX = e.clientX;

            const onMouseMove = (moveEvent) => {
                const newWidth = Math.max(40, startWidth + (moveEvent.clientX - startX));
                th.style.width = newWidth + 'px';
                colWidths[colIndex] = newWidth;
                updateSelectionVisuals();
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        // --- SELECTION & NAVIGATION ---
        function selectCell(row, col, extendSelection = false) {
            if (isEditing) finishEditing();

            row = Math.max(1, Math.min(DEFAULT_ROWS, row));
            col = Math.max(1, Math.min(DEFAULT_COLS, col));

            if (!extendSelection) {
                activeCell = { row, col };
                selectedRange = { startRow: row, startCol: col, endRow: row, endCol: col };
            } else {
                selectedRange.endRow = row;
                selectedRange.endCol = col;
            }

            // Highlighting column/row headers
            document.querySelectorAll('.selected-header').forEach(el => el.classList.remove('selected-header'));
            
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                const header = document.querySelector(`.row-header[data-row='${r}']`);
                if (header) header.classList.add('selected-header');
            }
            for (let c = startColIdx; c <= endColIdx; c++) {
                const header = document.querySelector(`.column-header[data-col='${c}']`);
                if (header) header.classList.add('selected-header');
            }

            // Sync Formula Bar
            const activeCellId = getCellId(activeCell.row, activeCell.col);
            const activeCellState = sheets[currentSheetId].cells[activeCellId] || { value: '', formula: '' };
            document.getElementById('formula-cell-address').innerText = activeCellId;
            
            // If in formula editing mode and selecting elsewhere, insert cell range
            if (formulaSelectionMode && (activeCell.row !== row || activeCell.col !== col)) {
                insertRangeIntoFormula();
            } else {
                document.getElementById('formula-bar-input').value = activeCellState.formula || activeCellState.value || '';
            }

            updateSelectionVisuals();
            updateStatusBarSummary();
        }

        function insertRangeIntoFormula() {
            const fBar = document.getElementById('formula-bar-input');
            const startCellId = getCellId(selectedRange.startRow, selectedRange.startCol);
            const endCellId = getCellId(selectedRange.endRow, selectedRange.endCol);
            
            let rangeString = startCellId;
            if (startCellId !== endCellId) {
                rangeString = `${startCellId}:${endCellId}`;
            }

            // Replace or append range logic
            let currentFormula = fBar.value;
            // Let's replace anything after the last mathematical symbol or bracket
            const matchIndex = Math.max(
                currentFormula.lastIndexOf('('),
                currentFormula.lastIndexOf('+'),
                currentFormula.lastIndexOf('-'),
                currentFormula.lastIndexOf('*'),
                currentFormula.lastIndexOf('/')
            );
            
            if (matchIndex !== -1) {
                fBar.value = currentFormula.substring(0, matchIndex + 1) + rangeString;
            } else {
                fBar.value = '=' + rangeString;
            }
        }

        function updateSelectionVisuals() {
            const box = document.getElementById('grid-selection-box');
            
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            // Remove selected class from all cells
            document.querySelectorAll('.excel-cell.selected').forEach(cell => cell.classList.remove('selected'));

            // Apply selected class and find outer bounding rectangle
            let firstCell = null;
            let lastCell = null;

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell) {
                        cell.classList.add('selected');
                        if (!firstCell) firstCell = cell;
                        lastCell = cell;
                    }
                }
            }

            if (firstCell && lastCell) {
                const container = document.getElementById('grid-container');
                const scrollLeft = container.scrollLeft;
                const scrollTop = container.scrollTop;

                const firstRect = firstCell.getBoundingClientRect();
                const lastRect = lastCell.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                box.style.display = 'block';
                box.style.left = `${firstCell.offsetLeft}px`;
                box.style.top = `${firstCell.offsetTop}px`;
                box.style.width = `${lastCell.offsetLeft + lastCell.offsetWidth - firstCell.offsetLeft}px`;
                box.style.height = `${lastCell.offsetTop + lastCell.offsetHeight - firstCell.offsetTop}px`;
            } else {
                box.style.display = 'none';
            }
        }

        // --- MOUSE SELECTION FLOW ---
        function handleCellMouseDown(e, r, c) {
            if (e.shiftKey) {
                selectCell(r, c, true);
            } else {
                isSelecting = true;
                selectCell(r, c, false);
            }
        }

        function handleCellMouseOver(r, c) {
            if (isSelecting) {
                selectCell(r, c, true);
            }
        }

        function handleGlobalMouseUp() {
            isSelecting = false;
        }

        // --- CELL EDITING ---
        function startEditing() {
            if (isEditing) return;
            isEditing = true;

            const activeCellId = getCellId(activeCell.row, activeCell.col);
            const cellData = sheets[currentSheetId].cells[activeCellId] || { value: '', formula: '' };
            const cellElement = document.getElementById(`cell-${activeCell.row}-${activeCell.col}`);
            const editor = document.getElementById('cell-editor-input');

            // Position and show editor overlay
            editor.style.display = 'block';
            editor.style.left = `${cellElement.offsetLeft}px`;
            editor.style.top = `${cellElement.offsetTop}px`;
            editor.style.width = `${cellElement.offsetWidth}px`;
            editor.style.height = `${cellElement.offsetHeight}px`;

            // If cell has a formula, edit formula; else raw value
            editor.innerText = cellData.formula || cellData.value || '';
            
            // Set Selection caret at the end
            setTimeout(() => {
                editor.focus();
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(editor);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            }, 0);

            // Connect changes live to formula bar
            editor.oninput = () => {
                document.getElementById('formula-bar-input').value = editor.innerText;
                formulaSelectionMode = editor.innerText.startsWith('=');
            };
        }

        function finishEditing() {
            if (!isEditing) return;
            isEditing = false;

            const editor = document.getElementById('cell-editor-input');
            const formulaVal = editor.innerText.trim();
            editor.style.display = 'none';

            updateActiveCellFromFormulaBar(formulaVal);
        }

        function updateActiveCellFromFormulaBar(rawVal) {
            const activeCellId = getCellId(activeCell.row, activeCell.col);
            
            if (!sheets[currentSheetId].cells[activeCellId]) {
                sheets[currentSheetId].cells[activeCellId] = { value: '', formula: '', styles: {} };
            }

            const cellState = sheets[currentSheetId].cells[activeCellId];

            if (rawVal.startsWith('=')) {
                cellState.formula = rawVal;
                cellState.value = evaluateFormula(rawVal, currentSheetId, new Set());
            } else {
                cellState.formula = '';
                cellState.value = rawVal;
            }

            recalculateAllCells();
            syncGridDisplay();
            updateStatusBarSummary();
        }

        // --- KEYBOARD NAVIGATION ---
        function handleGlobalKeyDown(e) {
            if (isEditing) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    finishEditing();
                    selectCell(activeCell.row + 1, activeCell.col);
                    e.preventDefault();
                } else if (e.key === 'Tab') {
                    finishEditing();
                    selectCell(activeCell.row, activeCell.col + 1);
                    e.preventDefault();
                } else if (e.key === 'Escape') {
                    const editor = document.getElementById('cell-editor-input');
                    editor.style.display = 'none';
                    isEditing = false;
                    selectCell(activeCell.row, activeCell.col);
                }
                return;
            }

            if (document.activeElement === document.getElementById('formula-bar-input')) {
                return; // Formula bar has its own keyboard handle
            }

            let nextRow = activeCell.row;
            let nextCol = activeCell.col;
            let prevent = false;

            switch (e.key) {
                case 'ArrowUp':
                    nextRow = Math.max(1, activeCell.row - 1);
                    prevent = true;
                    break;
                case 'ArrowDown':
                    nextRow = Math.min(DEFAULT_ROWS, activeCell.row + 1);
                    prevent = true;
                    break;
                case 'ArrowLeft':
                    nextCol = Math.max(1, activeCell.col - 1);
                    prevent = true;
                    break;
                case 'ArrowRight':
                    nextCol = Math.min(DEFAULT_COLS, activeCell.col + 1);
                    prevent = true;
                    break;
                case 'Enter':
                    startEditing();
                    prevent = true;
                    break;
                case 'Tab':
                    nextCol = e.shiftKey ? Math.max(1, activeCell.col - 1) : Math.min(DEFAULT_COLS, activeCell.col + 1);
                    prevent = true;
                    break;
                case 'Delete':
                case 'Backspace':
                    clearSelectedContents();
                    prevent = true;
                    break;
                default:
                    // Start editing on alphanumeric key presses immediately (like Excel)
                    if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                        startEditing();
                        document.getElementById('cell-editor-input').innerText = '';
                    }
                    break;
            }

            if (prevent) {
                e.preventDefault();
                selectCell(nextRow, nextCol, e.shiftKey);
            }
        }

        // --- COMPUTATION ENGINE ---
        function recalculateAllCells() {
            const sheet = sheets[currentSheetId];
            if (!sheet) return;

            // Track calculation chain to resolve dependencies safely
            const visited = new Set();
            for (let cellId in sheet.cells) {
                const cell = sheet.cells[cellId];
                if (cell.formula) {
                    cell.value = evaluateFormula(cell.formula, currentSheetId, new Set());
                }
            }
        }

        function evaluateFormula(formulaText, sheetId, evalStack) {
            // Check recursive infinite reference loop
            if (evalStack.size > 100) return '#LOOP!'; 

            const formula = formulaText.substring(1).trim(); // remove '='
            
            // Resolve ranges or functions first: e.g. SUM(A1:B3)
            let resultFormula = formula;
            
            // Regular expressions for standard spreadsheet functions
            const functions = ['SUM', 'AVERAGE', 'MIN', 'MAX', 'COUNT'];
            for (const func of functions) {
                const regex = new RegExp(`${func}\\s*\\(\\s*([A-Z]+[0-9]+)\\s*:\\s*([A-Z]+[0-9]+)\\s*\\)`, 'gi');
                resultFormula = resultFormula.replace(regex, (match, startCell, endCell) => {
                    return computeRangeFunction(func, startCell, endCell, sheetId, evalStack);
                });
            }

            // Resolve single cell references, e.g. A1, B23
            const cellRefRegex = /\b([A-Z]+)([0-9]+)\b/g;
            resultFormula = resultFormula.replace(cellRefRegex, (match) => {
                if (evalStack.has(match)) return '#REF!';
                evalStack.add(match);
                const cellVal = getCellValue(match, sheetId, evalStack);
                evalStack.delete(match);
                return isNaN(Number(cellVal)) ? `"${cellVal}"` : Number(cellVal);
            });

            // Safely execute math parsing
            try {
                // Ensure safe sandbox eval
                const safeExpression = resultFormula.replace(/[^0-9+\-*/().\s"']/g, '');
                const evalResult = new Function(`return ${safeExpression}`)();
                return evalResult !== undefined ? evalResult : '';
            } catch (err) {
                return '#ERROR!';
            }
        }

        function getCellValue(cellId, sheetId, evalStack) {
            const cell = sheets[sheetId].cells[cellId];
            if (!cell) return 0;
            if (cell.formula) {
                return evaluateFormula(cell.formula, sheetId, evalStack);
            }
            return cell.value;
        }

        function computeRangeFunction(funcName, startCell, endCell, sheetId, evalStack) {
            const start = parseCellId(startCell.toUpperCase());
            const end = parseCellId(endCell.toUpperCase());

            if (!start || !end) return '#REF!';

            const minRow = Math.min(start.row, end.row);
            const maxRow = Math.max(start.row, end.row);
            const minCol = Math.min(start.col, end.col);
            const maxCol = Math.max(start.col, end.col);

            const values = [];
            for (let r = minRow; r <= maxRow; r++) {
                for (let c = minCol; c <= maxCol; c++) {
                    const cid = getCellId(r, c);
                    const val = Number(getCellValue(cid, sheetId, evalStack));
                    if (!isNaN(val)) {
                        values.push(val);
                    }
                }
            }

            if (values.length === 0) return 0;

            switch (funcName.toUpperCase()) {
                case 'SUM':
                    return values.reduce((a, b) => a + b, 0);
                case 'AVERAGE':
                    return values.reduce((a, b) => a + b, 0) / values.length;
                case 'MIN':
                    return Math.min(...values);
                case 'MAX':
                    return Math.max(...values);
                case 'COUNT':
                    return values.length;
                default:
                    return 0;
            }
        }

        // --- GRID UI SYNC ---
        function syncGridDisplay() {
            const sheet = sheets[currentSheetId];
            if (!sheet) return;

            for (let r = 1; r <= DEFAULT_ROWS; r++) {
                for (let c = 1; c <= DEFAULT_COLS; c++) {
                    const cellId = getCellId(r, c);
                    const cellState = sheet.cells[cellId];
                    const td = document.getElementById(`cell-${r}-${c}`);

                    if (td) {
                        if (cellState) {
                            td.innerText = cellState.value;
                            applyCellVisualStyles(td, r, c);
                        } else {
                            td.innerText = '';
                            td.style.backgroundColor = '';
                            td.style.color = '';
                            td.style.fontWeight = '';
                            td.style.fontStyle = '';
                            td.className = 'excel-cell';
                        }
                    }
                }
            }
        }

        function applyCellVisualStyles(element, r, c) {
            const cellId = getCellId(r, c);
            const cellState = sheets[currentSheetId].cells[cellId];
            
            if (!cellState || !cellState.styles) return;
            const styles = cellState.styles;

            element.style.fontWeight = styles.bold ? 'bold' : 'normal';
            element.style.fontStyle = styles.italic ? 'italic' : 'normal';
            element.style.backgroundColor = styles.bgColor || '';
            element.style.color = styles.textColor || '';

            // Alignment
            element.className = 'excel-cell';
            if (styles.align) {
                element.classList.add(`align-${styles.align}`);
            } else {
                // Default alignment depending on type
                if (!isNaN(Number(element.innerText)) && element.innerText !== '') {
                    element.classList.add('align-right');
                } else {
                    element.classList.add('align-left');
                }
            }
        }

        // --- SELECTION SUMMARY STATISTICS ---
        function updateStatusBarSummary() {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            let sum = 0;
            let count = 0;
            let numericCount = 0;
            let min = Infinity;
            let max = -Infinity;

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const cellId = getCellId(r, c);
                    const cellState = sheets[currentSheetId].cells[cellId];
                    if (cellState && cellState.value !== undefined && cellState.value !== '') {
                        count++;
                        const num = Number(cellState.value);
                        if (!isNaN(num)) {
                            sum += num;
                            numericCount++;
                            if (num < min) min = num;
                            if (num > max) max = num;
                        }
                    }
                }
            }

            const summaryEl = document.getElementById('selection-summary');
            if (numericCount > 0) {
                const avg = (sum / numericCount).toFixed(2);
                summaryEl.innerText = `Sum: ${sum} | Average: ${avg} | Count: ${count} | Min: ${min} | Max: ${max}`;
            } else if (count > 0) {
                summaryEl.innerText = `Count: ${count}`;
            } else {
                summaryEl.innerText = 'Ready';
            }
        }

        // --- TOOLBAR & STYLING ACTIONS ---
        function getOrCreateStyles(row, col) {
            const cellId = getCellId(row, col);
            if (!sheets[currentSheetId].cells[cellId]) {
                sheets[currentSheetId].cells[cellId] = { value: '', formula: '', styles: {} };
            }
            if (!sheets[currentSheetId].cells[cellId].styles) {
                sheets[currentSheetId].cells[cellId].styles = {};
            }
            return sheets[currentSheetId].cells[cellId].styles;
        }

        function toggleStyle(styleName) {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            // Determine current state based on activeCell
            const activeStyles = getOrCreateStyles(activeCell.row, activeCell.col);
            const newValue = !activeStyles[styleName];

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const styles = getOrCreateStyles(r, c);
                    styles[styleName] = newValue;
                }
            }

            // Sync visual button state
            document.getElementById(`btn-${styleName}`).classList.toggle('active', newValue);

            syncGridDisplay();
        }

        function setAlignment(alignValue) {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const styles = getOrCreateStyles(r, c);
                    styles.align = alignValue;
                }
            }

            // Sync alignment button states
            ['left', 'center', 'right'].forEach(align => {
                document.getElementById(`btn-align-${align}`).classList.toggle('active', align === alignValue);
            });

            syncGridDisplay();
        }

        function setCellColor(color) {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const styles = getOrCreateStyles(r, c);
                    styles.bgColor = color;
                }
            }
            syncGridDisplay();
        }

        function setTextColor(color) {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const styles = getOrCreateStyles(r, c);
                    styles.textColor = color;
                }
            }
            syncGridDisplay();
        }

        function clearSelectedContents() {
            const startRowIdx = Math.min(selectedRange.startRow, selectedRange.endRow);
            const endRowIdx = Math.max(selectedRange.startRow, selectedRange.endRow);
            const startColIdx = Math.min(selectedRange.startCol, selectedRange.endCol);
            const endColIdx = Math.max(selectedRange.startCol, selectedRange.endCol);

            for (let r = startRowIdx; r <= endRowIdx; r++) {
                for (let c = startColIdx; c <= endColIdx; c++) {
                    const cellId = getCellId(r, c);
                    if (sheets[currentSheetId].cells[cellId]) {
                        sheets[currentSheetId].cells[cellId].value = '';
                        sheets[currentSheetId].cells[cellId].formula = '';
                    }
                }
            }

            recalculateAllCells();
            syncGridDisplay();
            updateStatusBarSummary();
        }

        // --- IMPORT & EXPORT CSV ---
        function triggerCSVUpload() {
            document.getElementById('csv-upload-input').click();
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n');

                // Clear current active sheet contents
                sheets[currentSheetId].cells = {};

                for (let r = 0; r < Math.min(rows.length, DEFAULT_ROWS); r++) {
                    const cols = rows[r].split(',');
                    for (let c = 0; c < Math.min(cols.length, DEFAULT_COLS); c++) {
                        const val = cols[c].trim();
                        if (val) {
                            const cellId = getCellId(r + 1, c + 1);
                            sheets[currentSheetId].cells[cellId] = {
                                value: val,
                                formula: val.startsWith('=') ? val : '',
                                styles: {}
                            };
                        }
                    }
                }

                recalculateAllCells();
                syncGridDisplay();
                selectCell(1, 1);
                alert("CSV uploaded successfully!");
            };
            reader.readAsText(file);
        }

        function exportToCSV() {
            let csvContent = "";
            for (let r = 1; r <= DEFAULT_ROWS; r++) {
                let rowContent = [];
                for (let c = 1; c <= DEFAULT_COLS; c++) {
                    const cellId = getCellId(r, c);
                    const cellState = sheets[currentSheetId].cells[cellId];
                    let val = cellState ? (cellState.formula || cellState.value || '') : '';
                    
                    // Escape commas and quotes
                    if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                        val = `"${val.replace(/"/g, '""')}"`;
                    }
                    rowContent.push(val);
                }
                csvContent += rowContent.join(',') + "\n";
            }

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `${sheets[currentSheetId].name}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
