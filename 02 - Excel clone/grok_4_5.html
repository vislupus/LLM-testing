<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheetWorks — Spreadsheet</title>
  <style>
    :root {
      --bg: #f3f3f3;
      --surface: #ffffff;
      --border: #d0d0d0;
      --border-dark: #b0b0b0;
      --header-bg: #f8f8f8;
      --header-hover: #e8e8e8;
      --selected-header: #d0e2f5;
      --grid-line: #e0e0e0;
      --accent: #217346;
      --accent-hover: #1a5c38;
      --accent-light: #e7f2ec;
      --selection: rgba(33, 115, 70, 0.18);
      --selection-border: #217346;
      --active-cell: #217346;
      --text: #1a1a1a;
      --muted: #666;
      --toolbar-h: 42px;
      --formula-h: 32px;
      --sheet-h: 36px;
      --row-header-w: 46px;
      --col-min: 48px;
      --default-col-w: 100px;
      --default-row-h: 24px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      user-select: none;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Title bar */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 36px;
      padding: 0 12px;
      background: var(--accent);
      color: #fff;
      flex-shrink: 0;
    }
    .titlebar .logo {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar .logo-mark {
      width: 20px; height: 20px;
      background: #fff;
      color: var(--accent);
      border-radius: 3px;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 800;
    }
    .titlebar .doc-name {
      font-size: 13px;
      opacity: 0.95;
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      padding: 2px 8px;
      border-radius: 3px;
      min-width: 120px;
    }
    .titlebar .doc-name:hover, .titlebar .doc-name:focus {
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.1);
      outline: none;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      height: var(--toolbar-h);
      padding: 0 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      flex-wrap: wrap;
      overflow: hidden;
    }
    .tb-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 6px;
      border-right: 1px solid var(--border);
    }
    .tb-group:last-child { border-right: none; }
    .tb-btn {
      height: 30px;
      min-width: 30px;
      padding: 0 8px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tb-btn:hover { background: #f0f0f0; border-color: var(--border); }
    .tb-btn:active, .tb-btn.active { background: var(--accent-light); border-color: #a8d0b8; }
    .tb-btn:disabled { opacity: 0.4; cursor: default; }
    .tb-btn.bold { font-weight: 700; }
    .tb-btn.italic { font-style: italic; }
    .tb-btn .swatch {
      width: 16px; height: 16px;
      border: 1px solid var(--border-dark);
      border-radius: 2px;
      background: #fff;
    }
    .tb-label {
      font-size: 11px;
      color: var(--muted);
      margin-right: 2px;
    }
    input[type="color"].color-input {
      width: 28px; height: 28px;
      padding: 0; border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }

    /* Formula bar */
    .formulabar {
      display: flex;
      align-items: center;
      height: var(--formula-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      padding: 0 4px 0 0;
    }
    .name-box {
      width: 80px;
      height: 100%;
      border: none;
      border-right: 1px solid var(--border);
      text-align: center;
      font-size: 12px;
      font-family: inherit;
      background: var(--header-bg);
      color: var(--text);
      outline: none;
      flex-shrink: 0;
    }
    .fx-label {
      width: 28px;
      text-align: center;
      font-weight: 700;
      font-style: italic;
      color: var(--muted);
      font-size: 14px;
      flex-shrink: 0;
    }
    .formula-input {
      flex: 1;
      height: 26px;
      border: 1px solid transparent;
      border-radius: 2px;
      padding: 0 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    .formula-input:focus { border-color: var(--accent); }

    /* Grid area */
    .grid-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--surface);
      min-height: 0;
    }
    .grid-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      position: relative;
    }
    .grid-scroll::-webkit-scrollbar { width: 12px; height: 12px; }
    .grid-scroll::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border-radius: 6px;
      border: 2px solid #fff;
    }
    .grid-scroll::-webkit-scrollbar-corner { background: var(--header-bg); }

    .grid-inner {
      position: relative;
      display: grid;
      /* set by JS */
    }

    .corner {
      position: sticky;
      top: 0; left: 0;
      z-index: 5;
      background: var(--header-bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      width: var(--row-header-w);
      height: var(--default-row-h);
    }

    .col-header {
      position: sticky;
      top: 0;
      z-index: 3;
      background: var(--header-bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      height: var(--default-row-h);
      cursor: pointer;
      position: sticky;
    }
    .col-header.selected { background: var(--selected-header); color: var(--text); }
    .col-header .resize-handle {
      position: absolute;
      right: 0; top: 0;
      width: 5px; height: 100%;
      cursor: col-resize;
      z-index: 4;
    }
    .col-header .resize-handle:hover,
    .col-header .resize-handle.active {
      background: var(--accent);
    }

    .row-header {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--header-bg);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--muted);
      width: var(--row-header-w);
      cursor: pointer;
    }
    .row-header.selected { background: var(--selected-header); color: var(--text); font-weight: 600; }

    .cell {
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      padding: 1px 4px;
      font-size: 13px;
      line-height: calc(var(--default-row-h) - 4px);
      height: var(--default-row-h);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: cell;
      background: #fff;
      position: relative;
    }
    .cell.selected { background: var(--selection); }
    .cell.active {
      outline: 2px solid var(--active-cell);
      outline-offset: -2px;
      z-index: 2;
      background: #fff;
    }
    .cell.range-end {
      /* visual handled by selection class */
    }
    .cell.bold { font-weight: 700; }
    .cell.italic { font-style: italic; }
    .cell.editing {
      padding: 0;
      overflow: visible;
      z-index: 6;
      outline: 2px solid var(--active-cell);
      outline-offset: -2px;
    }
    .cell-editor {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      padding: 1px 4px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      min-width: 100%;
    }

    /* Sheet tabs */
    .sheetbar {
      display: flex;
      align-items: center;
      height: var(--sheet-h);
      background: var(--bg);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      padding: 0 4px;
      gap: 2px;
    }
    .sheet-tabs {
      display: flex;
      align-items: center;
      gap: 2px;
      overflow-x: auto;
      flex: 1;
      min-width: 0;
      height: 100%;
    }
    .sheet-tab {
      height: 28px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-bottom: none;
      background: transparent;
      border-radius: 4px 4px 0 0;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      color: var(--muted);
      white-space: nowrap;
      position: relative;
    }
    .sheet-tab:hover { background: #e8e8e8; color: var(--text); }
    .sheet-tab.active {
      background: var(--surface);
      color: var(--accent);
      font-weight: 600;
      border-color: var(--border);
      box-shadow: 0 -1px 0 var(--surface);
    }
    .sheet-tab input {
      border: 1px solid var(--accent);
      font: inherit;
      font-size: 12px;
      width: 90px;
      padding: 2px 4px;
      outline: none;
    }
    .sheet-add {
      width: 28px; height: 28px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 18px;
      color: var(--muted);
      line-height: 1;
      flex-shrink: 0;
    }
    .sheet-add:hover { background: #e0e0e0; color: var(--text); }
    .sheet-menu-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .sheet-menu-btn:hover { background: #e0e0e0; color: var(--text); }

    /* Context menu */
    .ctx-menu {
      position: fixed;
      z-index: 100;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 4px;
      min-width: 160px;
      display: none;
    }
    .ctx-menu.open { display: block; }
    .ctx-item {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      border-radius: 4px;
      color: var(--text);
    }
    .ctx-item:hover { background: var(--accent-light); }
    .ctx-item.danger { color: #b00020; }
    .ctx-sep { height: 1px; background: var(--border); margin: 4px 0; }

    /* Status */
    .status {
      font-size: 11px;
      color: var(--muted);
      padding: 0 10px;
      flex-shrink: 0;
    }

    .hidden-file { display: none; }

    /* Fill handle */
    .fill-handle {
      position: absolute;
      width: 7px; height: 7px;
      background: var(--accent);
      border: 1px solid #fff;
      right: -1px; bottom: -1px;
      cursor: crosshair;
      z-index: 7;
      display: none;
    }
    .cell.active .fill-handle { display: block; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="titlebar">
      <div class="logo">
        <span class="logo-mark">S</span>
        SheetWorks
      </div>
      <input class="doc-name" id="docName" value="Workbook1" spellcheck="false" />
    </div>

    <div class="toolbar" id="toolbar">
      <div class="tb-group">
        <button class="tb-btn bold" id="btnBold" title="Bold (Ctrl+B)" type="button">B</button>
        <button class="tb-btn italic" id="btnItalic" title="Italic (Ctrl+I)" type="button">I</button>
      </div>
      <div class="tb-group">
        <span class="tb-label">Fill</span>
        <input type="color" class="color-input" id="bgColor" value="#ffffff" title="Background color" />
        <button class="tb-btn" id="btnClearFormat" title="Clear fill color" type="button">Clear fill</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="btnClear" title="Clear contents" type="button">Clear</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="btnDownload" title="Download active sheet as CSV" type="button">⬇ CSV</button>
        <button class="tb-btn" id="btnUpload" title="Upload CSV into active sheet" type="button">⬆ CSV</button>
        <input type="file" id="fileInput" class="hidden-file" accept=".csv,text/csv,text/plain" />
      </div>
      <div class="tb-group">
        <span class="status" id="status">Ready</span>
      </div>
    </div>

    <div class="formulabar">
      <input class="name-box" id="nameBox" readonly value="A1" title="Selected cell" />
      <span class="fx-label">ƒx</span>
      <input class="formula-input" id="formulaInput" spellcheck="false" autocomplete="off" />
    </div>

    <div class="grid-wrap">
      <div class="grid-scroll" id="gridScroll">
        <div class="grid-inner" id="gridInner"></div>
      </div>
    </div>

    <div class="sheetbar">
      <button class="sheet-add" id="btnAddSheet" title="Add sheet" type="button">+</button>
      <div class="sheet-tabs" id="sheetTabs"></div>
      <button class="sheet-menu-btn" id="btnRenameSheet" type="button">Rename</button>
      <button class="sheet-menu-btn" id="btnDeleteSheet" type="button">Delete</button>
    </div>
  </div>

  <div class="ctx-menu" id="ctxMenu">
    <button class="ctx-item" data-act="cut" type="button">Cut</button>
    <button class="ctx-item" data-act="copy" type="button">Copy</button>
    <button class="ctx-item" data-act="paste" type="button">Paste</button>
    <div class="ctx-sep"></div>
    <button class="ctx-item" data-act="clear" type="button">Clear contents</button>
    <button class="ctx-item" data-act="bold" type="button">Bold</button>
    <button class="ctx-item" data-act="italic" type="button">Italic</button>
  </div>

  <script>
  (function () {
    "use strict";

    // ========== Constants ==========
    const ROWS = 100;
    const COLS = 26;
    const DEFAULT_COL_W = 100;
    const DEFAULT_ROW_H = 24;
    const ROW_HEADER_W = 46;

    // ========== Utilities ==========
    function colToLetter(c) {
      let s = "";
      let n = c;
      do {
        s = String.fromCharCode(65 + (n % 26)) + s;
        n = Math.floor(n / 26) - 1;
      } while (n >= 0);
      return s;
    }

    function letterToCol(letters) {
      let n = 0;
      const s = letters.toUpperCase();
      for (let i = 0; i < s.length; i++) {
        n = n * 26 + (s.charCodeAt(i) - 64);
      }
      return n - 1;
    }

    function cellId(r, c) {
      return colToLetter(c) + (r + 1);
    }

    function parseCellId(id) {
      const m = String(id).trim().toUpperCase().match(/^([A-Z]+)(\d+)$/);
      if (!m) return null;
      const c = letterToCol(m[1]);
      const r = parseInt(m[2], 10) - 1;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
      return { r, c };
    }

    function parseRange(str) {
      const s = String(str).trim().toUpperCase();
      if (s.includes(":")) {
        const [a, b] = s.split(":");
        const p1 = parseCellId(a);
        const p2 = parseCellId(b);
        if (!p1 || !p2) return null;
        return {
          r1: Math.min(p1.r, p2.r),
          c1: Math.min(p1.c, p2.c),
          r2: Math.max(p1.r, p2.r),
          c2: Math.max(p1.c, p2.c)
        };
      }
      const p = parseCellId(s);
      if (!p) return null;
      return { r1: p.r, c1: p.c, r2: p.r, c2: p.c };
    }

    function rangeToString(r1, c1, r2, c2) {
      if (r1 === r2 && c1 === c2) return cellId(r1, c1);
      return cellId(r1, c1) + ":" + cellId(r2, c2);
    }

    function clamp(v, a, b) {
      return Math.max(a, Math.min(b, v));
    }

    // ========== Workbook model ==========
    function createEmptySheet(name) {
      const cells = {}; // key "r,c" -> { raw, bold, italic, bg }
      const colWidths = {};
      return { name, cells, colWidths };
    }

    const state = {
      sheets: [createEmptySheet("Sheet1")],
      activeSheet: 0,
      sel: { r: 0, c: 0, r2: 0, c2: 0 }, // active + range end
      editing: false,
      editCell: null, // {r,c} cell being edited (stable during formula pointing)
      editValue: "",
      editSource: null, // 'cell' | 'formula'
      formulaPointing: false, // inserting refs while editing formula
      formulaCaret: 0,
      isSelecting: false,
      selectStart: null,
      clipboard: null,
      colResize: null,
      computed: {}, // cache for active sheet values
      deps: {}, // cellId -> Set of dependent cellIds (reverse: who depends on me)
      revDeps: {} // cellId -> Set of precedents
    };

    function sheet() {
      return state.sheets[state.activeSheet];
    }

    function cellKey(r, c) {
      return r + "," + c;
    }

    function getCell(r, c, sh) {
      const s = sh || sheet();
      return s.cells[cellKey(r, c)] || null;
    }

    function ensureCell(r, c, sh) {
      const s = sh || sheet();
      const k = cellKey(r, c);
      if (!s.cells[k]) s.cells[k] = { raw: "", bold: false, italic: false, bg: "" };
      return s.cells[k];
    }

    function getRaw(r, c, sh) {
      const cell = getCell(r, c, sh);
      return cell ? cell.raw : "";
    }

    function setRaw(r, c, raw) {
      const cell = ensureCell(r, c);
      cell.raw = raw;
      if (!raw && !cell.bold && !cell.italic && !cell.bg) {
        delete sheet().cells[cellKey(r, c)];
      }
    }

    function getColWidth(c) {
      return sheet().colWidths[c] || DEFAULT_COL_W;
    }

    // ========== Formula engine ==========
    function tokenize(expr) {
      const tokens = [];
      let i = 0;
      const s = expr.trim();
      while (i < s.length) {
        const ch = s[i];
        if (/\s/.test(ch)) { i++; continue; }
        if ("+-*/(),:".includes(ch)) {
          tokens.push({ type: ch, value: ch });
          i++;
          continue;
        }
        if (/[0-9.]/.test(ch)) {
          let j = i + 1;
          while (j < s.length && /[0-9.]/.test(s[j])) j++;
          tokens.push({ type: "number", value: parseFloat(s.slice(i, j)) });
          i = j;
          continue;
        }
        if (/[A-Za-z_]/.test(ch)) {
          let j = i + 1;
          while (j < s.length && /[A-Za-z0-9_]/.test(s[j])) j++;
          const word = s.slice(i, j);
          // Could be function or cell ref
          if (/^[A-Za-z]+[0-9]+$/.test(word)) {
            tokens.push({ type: "cell", value: word.toUpperCase() });
          } else {
            tokens.push({ type: "func", value: word.toUpperCase() });
          }
          i = j;
          continue;
        }
        throw new Error("Unexpected character: " + ch);
      }
      return tokens;
    }

    // Recursive descent parser
    function parseExpression(tokens) {
      let pos = 0;

      function peek() { return tokens[pos]; }
      function consume(type) {
        const t = tokens[pos];
        if (!t || (type && t.type !== type)) throw new Error("Expected " + type);
        pos++;
        return t;
      }
      function match(type) {
        if (peek() && peek().type === type) { pos++; return true; }
        return false;
      }

      function parseExpr() {
        return parseAdd();
      }

      function parseAdd() {
        let node = parseMul();
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = consume().type;
          const right = parseMul();
          node = { type: "binop", op, left: node, right };
        }
        return node;
      }

      function parseMul() {
        let node = parseUnary();
        while (peek() && (peek().type === "*" || peek().type === "/")) {
          const op = consume().type;
          const right = parseUnary();
          node = { type: "binop", op, left: node, right };
        }
        return node;
      }

      function parseUnary() {
        if (match("+")) return parseUnary();
        if (match("-")) return { type: "unary", op: "-", arg: parseUnary() };
        return parsePrimary();
      }

      function parsePrimary() {
        const t = peek();
        if (!t) throw new Error("Unexpected end");

        if (t.type === "number") {
          consume();
          return { type: "number", value: t.value };
        }
        if (t.type === "cell") {
          consume();
          // range A1:B2
          if (peek() && peek().type === ":") {
            consume(":");
            const t2 = consume("cell");
            return { type: "range", start: t.value, end: t2.value };
          }
          return { type: "cell", id: t.value };
        }
        if (t.type === "func") {
          const name = consume().value;
          consume("(");
          const args = [];
          if (peek() && peek().type !== ")") {
            args.push(parseExpr());
            while (match(",")) args.push(parseExpr());
          }
          consume(")");
          return { type: "func", name, args };
        }
        if (t.type === "(") {
          consume("(");
          const n = parseExpr();
          consume(")");
          return n;
        }
        throw new Error("Unexpected token: " + t.type);
      }

      const ast = parseExpr();
      if (pos < tokens.length) throw new Error("Unexpected trailing tokens");
      return ast;
    }

    function collectRefs(ast, out) {
      if (!ast) return;
      if (ast.type === "cell") out.add(ast.id);
      else if (ast.type === "range") {
        const rng = parseRange(ast.start + ":" + ast.end);
        if (rng) {
          for (let r = rng.r1; r <= rng.r2; r++) {
            for (let c = rng.c1; c <= rng.c2; c++) out.add(cellId(r, c));
          }
        }
      } else if (ast.type === "binop") {
        collectRefs(ast.left, out);
        collectRefs(ast.right, out);
      } else if (ast.type === "unary") collectRefs(ast.arg, out);
      else if (ast.type === "func") ast.args.forEach((a) => collectRefs(a, out));
    }

    function evalAst(ast, getValue, visiting) {
      if (!ast) return 0;
      switch (ast.type) {
        case "number": return ast.value;
        case "cell": {
          const id = ast.id;
          if (visiting.has(id)) throw new Error("#CYCLE!");
          return getValue(id, visiting);
        }
        case "range":
          throw new Error("Range only valid in functions");
        case "unary": {
          const v = evalAst(ast.arg, getValue, visiting);
          return ast.op === "-" ? -toNum(v) : toNum(v);
        }
        case "binop": {
          const l = toNum(evalAst(ast.left, getValue, visiting));
          const r = toNum(evalAst(ast.right, getValue, visiting));
          switch (ast.op) {
            case "+": return l + r;
            case "-": return l - r;
            case "*": return l * r;
            case "/": return r === 0 ? "#DIV/0!" : l / r;
          }
          return 0;
        }
        case "func": {
          const name = ast.name;
          if (["SUM", "AVERAGE", "MIN", "MAX", "COUNT"].includes(name)) {
            const vals = [];
            ast.args.forEach((arg) => flattenValues(arg, getValue, visiting, vals));
            const nums = vals.map(toNum).filter((n) => typeof n === "number" && !isNaN(n));
            if (name === "SUM") return nums.reduce((a, b) => a + b, 0);
            if (name === "COUNT") return nums.length;
            if (!nums.length) return 0;
            if (name === "AVERAGE") return nums.reduce((a, b) => a + b, 0) / nums.length;
            if (name === "MIN") return Math.min(...nums);
            if (name === "MAX") return Math.max(...nums);
          }
          throw new Error("#NAME?");
        }
        default:
          throw new Error("#ERROR!");
      }
    }

    function flattenValues(arg, getValue, visiting, out) {
      if (arg.type === "range") {
        const rng = parseRange(arg.start + ":" + arg.end);
        if (!rng) return;
        for (let r = rng.r1; r <= rng.r2; r++) {
          for (let c = rng.c1; c <= rng.c2; c++) {
            const id = cellId(r, c);
            if (visiting.has(id)) throw new Error("#CYCLE!");
            out.push(getValue(id, visiting));
          }
        }
      } else if (arg.type === "cell") {
        out.push(getValue(arg.id, visiting));
      } else {
        out.push(evalAst(arg, getValue, visiting));
      }
    }

    function toNum(v) {
      if (v === null || v === undefined || v === "") return 0;
      if (typeof v === "number") return v;
      if (typeof v === "string") {
        if (v.startsWith("#")) return NaN;
        const n = parseFloat(v);
        return isNaN(n) ? 0 : n;
      }
      return 0;
    }

    function formatValue(v) {
      if (v === null || v === undefined || v === "") return "";
      if (typeof v === "number") {
        if (!isFinite(v)) return "#NUM!";
        if (Number.isInteger(v)) return String(v);
        // trim float noise
        return String(Math.round(v * 1e10) / 1e10);
      }
      return String(v);
    }

    function recomputeSheet() {
      const s = sheet();
      state.computed = {};
      state.deps = {};
      state.revDeps = {};
      const cache = state.computed;
      const evaluating = new Set();

      function getValue(id, visiting) {
        if (cache.hasOwnProperty(id) && !visiting) {
          // use cache only outside of a nested visit? Always use cache if fully computed
        }
        if (cache.hasOwnProperty(id)) return cache[id];

        const pos = parseCellId(id);
        if (!pos) return 0;
        const raw = getRaw(pos.r, pos.c, s);

        if (raw === "" || raw == null) {
          cache[id] = "";
          return "";
        }

        if (typeof raw === "string" && raw.charAt(0) === "=") {
          try {
            const expr = raw.slice(1);
            const tokens = tokenize(expr);
            const ast = parseExpression(tokens);
            const refs = new Set();
            collectRefs(ast, refs);
            state.revDeps[id] = refs;
            refs.forEach((ref) => {
              if (!state.deps[ref]) state.deps[ref] = new Set();
              state.deps[ref].add(id);
            });

            const vis = visiting || new Set();
            vis.add(id);
            const result = evalAst(ast, (rid, vset) => {
              // recursive get
              if (cache.hasOwnProperty(rid) && !vset.has(rid)) {
                // still need to ensure computed
              }
              return getValueNested(rid, vset);
            }, vis);
            vis.delete(id);
            cache[id] = result;
            return result;
          } catch (e) {
            const msg = e.message && e.message.startsWith("#") ? e.message : "#ERROR!";
            cache[id] = msg;
            return msg;
          }
        }

        // plain value
        const num = parseFloat(raw);
        if (raw !== "" && !isNaN(num) && String(num) === String(raw).trim()) {
          cache[id] = num;
        } else {
          // try number with more flexibility
          if (raw !== "" && !isNaN(num) && /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(String(raw).trim())) {
            cache[id] = num;
          } else {
            cache[id] = raw;
          }
        }
        return cache[id];
      }

      function getValueNested(id, visiting) {
        if (visiting.has(id)) throw new Error("#CYCLE!");
        if (cache.hasOwnProperty(id)) return cache[id];

        const pos = parseCellId(id);
        if (!pos) return 0;
        const raw = getRaw(pos.r, pos.c, s);
        if (raw === "" || raw == null) {
          cache[id] = "";
          return "";
        }
        if (typeof raw === "string" && raw.charAt(0) === "=") {
          const expr = raw.slice(1);
          const tokens = tokenize(expr);
          const ast = parseExpression(tokens);
          const refs = new Set();
          collectRefs(ast, refs);
          state.revDeps[id] = refs;
          refs.forEach((ref) => {
            if (!state.deps[ref]) state.deps[ref] = new Set();
            state.deps[ref].add(id);
          });
          visiting.add(id);
          const result = evalAst(ast, (rid, vset) => getValueNested(rid, vset), visiting);
          visiting.delete(id);
          cache[id] = result;
          return result;
        }
        const num = parseFloat(raw);
        if (raw !== "" && !isNaN(num) && /^[-+]?(\d+\.?\d*|\.\d+)([eE][-+]?\d+)?$/.test(String(raw).trim())) {
          cache[id] = num;
        } else {
          cache[id] = raw;
        }
        return cache[id];
      }

      // Evaluate all cells that have content
      Object.keys(s.cells).forEach((k) => {
        const [r, c] = k.split(",").map(Number);
        getValue(cellId(r, c), new Set());
      });
    }

    function getDisplay(r, c) {
      const id = cellId(r, c);
      if (state.computed.hasOwnProperty(id)) {
        return formatValue(state.computed[id]);
      }
      return getRaw(r, c);
    }

    // ========== DOM refs ==========
    const gridInner = document.getElementById("gridInner");
    const gridScroll = document.getElementById("gridScroll");
    const formulaInput = document.getElementById("formulaInput");
    const nameBox = document.getElementById("nameBox");
    const sheetTabs = document.getElementById("sheetTabs");
    const statusEl = document.getElementById("status");
    const ctxMenu = document.getElementById("ctxMenu");
    const bgColorInput = document.getElementById("bgColor");

    let cellEls = {}; // "r,c" -> element
    let colHeaderEls = [];
    let rowHeaderEls = [];
    let editorEl = null;

    // ========== Render grid ==========
    function buildGrid() {
      gridInner.innerHTML = "";
      cellEls = {};
      colHeaderEls = [];
      rowHeaderEls = [];

      const colWs = [];
      for (let c = 0; c < COLS; c++) colWs.push(getColWidth(c) + "px");

      gridInner.style.gridTemplateColumns = ROW_HEADER_W + "px " + colWs.join(" ");
      gridInner.style.gridTemplateRows = DEFAULT_ROW_H + "px repeat(" + ROWS + ", " + DEFAULT_ROW_H + "px)";
      gridInner.style.width = (ROW_HEADER_W + colWs.reduce((a, w) => a + parseInt(w, 10), 0)) + "px";

      // Corner
      const corner = document.createElement("div");
      corner.className = "corner";
      corner.style.gridRow = "1";
      corner.style.gridColumn = "1";
      gridInner.appendChild(corner);

      // Column headers
      for (let c = 0; c < COLS; c++) {
        const h = document.createElement("div");
        h.className = "col-header";
        h.textContent = colToLetter(c);
        h.dataset.col = c;
        h.style.gridRow = "1";
        h.style.gridColumn = String(c + 2);
        const handle = document.createElement("div");
        handle.className = "resize-handle";
        handle.dataset.col = c;
        h.appendChild(handle);
        h.addEventListener("mousedown", onColHeaderMouseDown);
        handle.addEventListener("mousedown", onColResizeStart);
        gridInner.appendChild(h);
        colHeaderEls[c] = h;
      }

      // Rows
      for (let r = 0; r < ROWS; r++) {
        const rh = document.createElement("div");
        rh.className = "row-header";
        rh.textContent = String(r + 1);
        rh.dataset.row = r;
        rh.style.gridRow = String(r + 2);
        rh.style.gridColumn = "1";
        rh.addEventListener("mousedown", onRowHeaderMouseDown);
        gridInner.appendChild(rh);
        rowHeaderEls[r] = rh;

        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.style.gridRow = String(r + 2);
          cell.style.gridColumn = String(c + 2);
          cell.addEventListener("mousedown", onCellMouseDown);
          cell.addEventListener("mouseenter", onCellMouseEnter);
          cell.addEventListener("dblclick", onCellDblClick);
          gridInner.appendChild(cell);
          cellEls[cellKey(r, c)] = cell;
        }
      }

      recomputeSheet();
      paintAllCells();
      updateSelectionUI();
      updateFormulaBar();
    }

    function paintCell(r, c) {
      const el = cellEls[cellKey(r, c)];
      if (!el) return;
      if (
        state.editing &&
        state.editSource === "cell" &&
        state.editCell &&
        state.editCell.r === r &&
        state.editCell.c === c
      ) {
        return; // editor owns it
      }
      const data = getCell(r, c);
      el.textContent = getDisplay(r, c);
      el.classList.toggle("bold", !!(data && data.bold));
      el.classList.toggle("italic", !!(data && data.italic));
      el.style.background = (data && data.bg) ? data.bg : "";
      // keep selection classes managed separately
    }

    function paintAllCells() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) paintCell(r, c);
      }
    }

    function updateSelectionUI() {
      const { r, c, r2, c2 } = state.sel;
      const rMin = Math.min(r, r2), rMax = Math.max(r, r2);
      const cMin = Math.min(c, c2), cMax = Math.max(c, c2);

      Object.values(cellEls).forEach((el) => {
        el.classList.remove("selected", "active");
      });
      colHeaderEls.forEach((el) => el && el.classList.remove("selected"));
      rowHeaderEls.forEach((el) => el && el.classList.remove("selected"));

      for (let rr = rMin; rr <= rMax; rr++) {
        if (rowHeaderEls[rr]) rowHeaderEls[rr].classList.add("selected");
        for (let cc = cMin; cc <= cMax; cc++) {
          const el = cellEls[cellKey(rr, cc)];
          if (!el) continue;
          if (rr === r && cc === c) el.classList.add("active");
          else el.classList.add("selected");
        }
      }
      for (let cc = cMin; cc <= cMax; cc++) {
        if (colHeaderEls[cc]) colHeaderEls[cc].classList.add("selected");
      }

      nameBox.value = (rMin === rMax && cMin === cMax)
        ? cellId(r, c)
        : rangeToString(rMin, cMin, rMax, cMax);
    }

    function updateFormulaBar() {
      if (state.editing && state.editSource === "formula") return;
      if (state.editing && state.editSource === "cell") {
        formulaInput.value = state.editValue;
        return;
      }
      const { r, c } = state.sel;
      formulaInput.value = getRaw(r, c);
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    // ========== Selection ==========
    function setSelection(r, c, r2, c2, opts) {
      opts = opts || {};
      state.sel = {
        r: clamp(r, 0, ROWS - 1),
        c: clamp(c, 0, COLS - 1),
        r2: clamp(r2 != null ? r2 : r, 0, ROWS - 1),
        c2: clamp(c2 != null ? c2 : c, 0, COLS - 1)
      };
      updateSelectionUI();
      if (!opts.skipFormula) updateFormulaBar();
      // toolbar state
      const data = getCell(state.sel.r, state.sel.c);
      document.getElementById("btnBold").classList.toggle("active", !!(data && data.bold));
      document.getElementById("btnItalic").classList.toggle("active", !!(data && data.italic));
      bgColorInput.value = (data && data.bg) ? rgbToHex(data.bg) : "#ffffff";
    }

    function rgbToHex(color) {
      if (!color) return "#ffffff";
      if (color.startsWith("#")) return color.length === 7 ? color : "#ffffff";
      const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if (!m) return "#ffffff";
      return "#" + [m[1], m[2], m[3]].map((x) => {
        const h = parseInt(x, 10).toString(16);
        return h.length === 1 ? "0" + h : h;
      }).join("");
    }

    function isFormulaEditMode() {
      return state.editing && (
        (state.editSource === "formula" && formulaInput.value.trimStart().startsWith("=")) ||
        (state.editSource === "cell" && state.editValue.trimStart().startsWith("="))
      );
    }

    function getEditText() {
      if (state.editSource === "formula") return formulaInput.value;
      return state.editValue;
    }

    function setEditText(text, caret) {
      state.editValue = text;
      if (state.editSource === "formula") {
        formulaInput.value = text;
        if (caret != null) {
          formulaInput.setSelectionRange(caret, caret);
        }
      } else if (editorEl) {
        editorEl.value = text;
        if (caret != null) editorEl.setSelectionRange(caret, caret);
      }
    }

    function canInsertRef() {
      if (!state.editing) return false;
      const text = getEditText();
      if (!text.trimStart().startsWith("=")) return false;
      // Allow insert after operators, open paren, comma, or at start after =
      const caret = state.editSource === "formula"
        ? formulaInput.selectionStart
        : (editorEl ? editorEl.selectionStart : text.length);
      const before = text.slice(0, caret);
      if (before.length === 0) return false;
      const last = before[before.length - 1];
      if ("=+-*/(,:".includes(last)) return true;
      // also if selecting/replacing a previous ref at end of incomplete token
      return state.formulaPointing;
    }

    function insertRefIntoFormula(refStr, replaceLast) {
      let text = getEditText();
      let caret = state.editSource === "formula"
        ? formulaInput.selectionStart
        : (editorEl ? editorEl.selectionStart : text.length);

      if (replaceLast && state._lastInsertedRef) {
        // replace previous insertion
        const prev = state._lastInsertedRef;
        const idx = text.lastIndexOf(prev, caret);
        if (idx !== -1 && idx + prev.length === caret) {
          text = text.slice(0, idx) + refStr + text.slice(caret);
          caret = idx + refStr.length;
          setEditText(text, caret);
          state._lastInsertedRef = refStr;
          return;
        }
      }

      // If caret mid-token of existing ref, replace it
      const before = text.slice(0, caret);
      const after = text.slice(caret);
      // strip trailing incomplete cell ref being typed
      const m = before.match(/([A-Za-z]{1,3}\d{0,4})$/);
      let start = caret;
      if (m && canInsertRef() === false) {
        // still allow when formula pointing
      }
      if (state.formulaPointing && state._lastInsertedRef) {
        const prev = state._lastInsertedRef;
        const idx = before.lastIndexOf(prev);
        if (idx !== -1 && idx + prev.length === before.length) {
          text = before.slice(0, idx) + refStr + after;
          caret = idx + refStr.length;
          setEditText(text, caret);
          state._lastInsertedRef = refStr;
          return;
        }
      }

      text = before + refStr + after;
      caret = before.length + refStr.length;
      setEditText(text, caret);
      state._lastInsertedRef = refStr;
      state.formulaPointing = true;
    }

    // ========== Editing ==========
    function startEdit(initial, source, fromKey) {
      if (state.editing) commitEdit();
      const { r, c } = state.sel;
      state.editing = true;
      state.editCell = { r, c };
      state.editSource = source || "cell";
      state.formulaPointing = false;
      state._lastInsertedRef = null;

      const raw = getRaw(r, c);
      if (initial != null) {
        state.editValue = initial;
      } else {
        state.editValue = raw;
      }

      if (state.editSource === "formula") {
        formulaInput.value = state.editValue;
        formulaInput.focus();
        const pos = formulaInput.value.length;
        formulaInput.setSelectionRange(pos, pos);
      } else {
        const el = cellEls[cellKey(r, c)];
        if (!el) return;
        el.classList.add("editing");
        el.textContent = "";
        editorEl = document.createElement("input");
        editorEl.className = "cell-editor";
        editorEl.value = state.editValue;
        editorEl.spellcheck = false;
        el.appendChild(editorEl);
        editorEl.focus();
        if (fromKey && initial != null) {
          editorEl.setSelectionRange(editorEl.value.length, editorEl.value.length);
        } else {
          editorEl.select();
        }
        editorEl.addEventListener("keydown", onEditorKeyDown);
        editorEl.addEventListener("input", () => {
          state.editValue = editorEl.value;
          formulaInput.value = state.editValue;
          if (!state.editValue.trimStart().startsWith("=")) {
            state.formulaPointing = false;
          }
        });
        editorEl.addEventListener("blur", onEditorBlur);
      }
      updateFormulaBar();
    }

    function onEditorBlur(e) {
      // Delay to allow click on grid for formula pointing
      setTimeout(() => {
        if (!state.editing) return;
        if (state.formulaPointing && isFormulaEditMode()) {
          // keep editing if user is selecting refs
          if (state.editSource === "cell" && editorEl) editorEl.focus();
          return;
        }
        // if focus moved to formula bar, switch source
        if (document.activeElement === formulaInput) {
          state.editSource = "formula";
          if (editorEl) {
            state.editValue = editorEl.value;
            destroyEditor();
          }
          return;
        }
        if (document.activeElement === editorEl) return;
        commitEdit();
      }, 150);
    }

    function destroyEditor() {
      if (editorEl) {
        editorEl.removeEventListener("keydown", onEditorKeyDown);
        editorEl.removeEventListener("blur", onEditorBlur);
        if (editorEl.parentNode) editorEl.parentNode.removeChild(editorEl);
        editorEl = null;
      }
      const ec = state.editCell || state.sel;
      const el = cellEls[cellKey(ec.r, ec.c)];
      if (el) el.classList.remove("editing");
    }

    function commitEdit() {
      if (!state.editing) return;
      let value = getEditText();
      if (state.editSource === "formula") value = formulaInput.value;
      else if (editorEl) value = editorEl.value;

      const { r, c } = state.editCell || state.sel;
      state.editing = false;
      state.formulaPointing = false;
      state._lastInsertedRef = null;
      destroyEditor();
      state.editCell = null;

      setRaw(r, c, value);
      // Restore selection to the edited cell
      state.sel = { r, c, r2: r, c2: c };
      recomputeSheet();
      paintAllCells();
      updateSelectionUI();
      updateFormulaBar();
      setStatus("Edited " + cellId(r, c));
      gridScroll.focus({ preventScroll: true });
    }

    function cancelEdit() {
      if (!state.editing) return;
      const ec = state.editCell || state.sel;
      state.editing = false;
      state.formulaPointing = false;
      state._lastInsertedRef = null;
      destroyEditor();
      state.editCell = null;
      state.sel = { r: ec.r, c: ec.c, r2: ec.r, c2: ec.c };
      paintCell(ec.r, ec.c);
      updateSelectionUI();
      updateFormulaBar();
    }

    function onEditorKeyDown(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        commitEdit();
        setSelection(state.sel.r + 1, state.sel.c);
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        commitEdit();
        setSelection(state.sel.r, state.sel.c + (e.shiftKey ? -1 : 1));
        return;
      }
      if (e.key === "Escape") {
        e.preventDefault();
        cancelEdit();
        return;
      }
      // Arrow keys: if formula mode, allow range selection via keyboard later; else exit edit on arrow if not formula
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) {
        if (isFormulaEditMode()) {
          // let pointing work with shift+arrows optionally
          if (e.ctrlKey || e.metaKey) return;
          // stay in editor for formula navigation of caret unless Alt
          return;
        }
        e.preventDefault();
        commitEdit();
        const d = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] }[e.key];
        setSelection(state.sel.r + d[0], state.sel.c + d[1]);
      }
    }

    // ========== Mouse handlers ==========
    function onCellMouseDown(e) {
      if (e.button !== 0) return;
      const r = parseInt(e.currentTarget.dataset.r, 10);
      const c = parseInt(e.currentTarget.dataset.c, 10);

      // Formula pointing: insert/update ref
      if (state.editing && isFormulaEditMode()) {
        e.preventDefault();
        state.isSelecting = true;
        state.selectStart = { r, c };
        state.formulaPointing = true;
        insertRefIntoFormula(cellId(r, c), true);
        // visual selection without leaving edit
        state.sel = { r, c, r2: r, c2: c };
        updateSelectionUI();
        // keep focus
        if (state.editSource === "formula") formulaInput.focus();
        else if (editorEl) editorEl.focus();
        return;
      }

      if (state.editing) {
        commitEdit();
      }

      e.preventDefault();
      state.isSelecting = true;
      state.selectStart = { r, c };
      setSelection(r, c);
    }

    function onCellMouseEnter(e) {
      if (!state.isSelecting || !state.selectStart) return;
      const r = parseInt(e.currentTarget.dataset.r, 10);
      const c = parseInt(e.currentTarget.dataset.c, 10);

      if (state.editing && isFormulaEditMode() && state.formulaPointing) {
        const r1 = state.selectStart.r, c1 = state.selectStart.c;
        insertRefIntoFormula(rangeToString(r1, c1, r, c), true);
        state.sel = { r: r1, c: c1, r2: r, c2: c };
        updateSelectionUI();
        if (state.editSource === "formula") formulaInput.focus();
        else if (editorEl) editorEl.focus();
        return;
      }

      setSelection(state.selectStart.r, state.selectStart.c, r, c);
    }

    function onCellDblClick(e) {
      const r = parseInt(e.currentTarget.dataset.r, 10);
      const c = parseInt(e.currentTarget.dataset.c, 10);
      if (state.editing && isFormulaEditMode()) return;
      setSelection(r, c);
      startEdit(null, "cell");
    }

    function onColHeaderMouseDown(e) {
      if (e.target.classList.contains("resize-handle")) return;
      if (state.editing) commitEdit();
      const c = parseInt(e.currentTarget.dataset.col, 10);
      state.isSelecting = true;
      state.selectStart = { r: 0, c };
      setSelection(0, c, ROWS - 1, c);
    }

    function onRowHeaderMouseDown(e) {
      if (state.editing) commitEdit();
      const r = parseInt(e.currentTarget.dataset.row, 10);
      state.isSelecting = true;
      state.selectStart = { r, c: 0 };
      setSelection(r, 0, r, COLS - 1);
    }

    function onColResizeStart(e) {
      e.preventDefault();
      e.stopPropagation();
      const c = parseInt(e.currentTarget.dataset.col, 10);
      state.colResize = {
        c,
        startX: e.clientX,
        startW: getColWidth(c),
        handle: e.currentTarget
      };
      e.currentTarget.classList.add("active");
    }

    window.addEventListener("mousemove", (e) => {
      if (state.colResize) {
        const dx = e.clientX - state.colResize.startX;
        const w = clamp(state.colResize.startW + dx, 40, 500);
        sheet().colWidths[state.colResize.c] = w;
        // live update grid column
        const colWs = [];
        for (let c = 0; c < COLS; c++) colWs.push(getColWidth(c) + "px");
        gridInner.style.gridTemplateColumns = ROW_HEADER_W + "px " + colWs.join(" ");
        gridInner.style.width = (ROW_HEADER_W + colWs.reduce((a, x) => a + parseInt(x, 10), 0)) + "px";
        return;
      }
    });

    window.addEventListener("mouseup", () => {
      if (state.colResize) {
        state.colResize.handle.classList.remove("active");
        state.colResize = null;
      }
      if (state.isSelecting) {
        state.isSelecting = false;
        if (state.editing && isFormulaEditMode()) {
          // restore focus to editor after range select
          if (state.editSource === "formula") formulaInput.focus();
          else if (editorEl) editorEl.focus();
        }
      }
    });

    // ========== Keyboard ==========
    document.addEventListener("keydown", (e) => {
      // Don't steal when typing in title or renaming sheet
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" && e.target !== formulaInput && e.target !== editorEl && !e.target.classList.contains("cell-editor")) {
        return;
      }

      // Formula bar focused
      if (e.target === formulaInput) {
        if (e.key === "Enter") {
          e.preventDefault();
          if (!state.editing) {
            // start edit from formula bar content
            state.editing = true;
            state.editSource = "formula";
          }
          commitEdit();
          setSelection(state.sel.r + 1, state.sel.c);
          return;
        }
        if (e.key === "Escape") {
          e.preventDefault();
          cancelEdit();
          return;
        }
        if (e.key === "Tab") {
          e.preventDefault();
          if (!state.editing) {
            state.editing = true;
            state.editSource = "formula";
            state.editValue = formulaInput.value;
          }
          commitEdit();
          setSelection(state.sel.r, state.sel.c + (e.shiftKey ? -1 : 1));
          return;
        }
        // typing in formula bar starts/continues edit
        if (!state.editing && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
          state.editing = true;
          state.editCell = { r: state.sel.r, c: state.sel.c };
          state.editSource = "formula";
          state.editValue = formulaInput.value;
          state.formulaPointing = false;
        }
        if (state.editing) {
          state.editSource = "formula";
          // update after key
          setTimeout(() => {
            state.editValue = formulaInput.value;
            if (!formulaInput.value.trimStart().startsWith("=")) {
              state.formulaPointing = false;
              state._lastInsertedRef = null;
            }
          }, 0);
        }
        return;
      }

      if (state.editing && e.target === editorEl) return; // handled in editor

      if (state.editing) return;

      const { r, c, r2, c2 } = state.sel;

      // Shortcuts
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        toggleBold();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "i") {
        e.preventDefault();
        toggleItalic();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c") {
        e.preventDefault();
        copySelection();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "x") {
        e.preventDefault();
        cutSelection();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "v") {
        e.preventDefault();
        pasteClipboard();
        return;
      }

      if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        if (e.key === "Backspace") {
          startEdit("", "cell", true);
          return;
        }
        clearSelectionContents();
        return;
      }

      if (e.key === "F2") {
        e.preventDefault();
        startEdit(null, "cell");
        return;
      }

      if (e.key === "Enter") {
        e.preventDefault();
        if (e.shiftKey) setSelection(r - 1, c);
        else setSelection(r + 1, c);
        return;
      }
      if (e.key === "Tab") {
        e.preventDefault();
        setSelection(r, c + (e.shiftKey ? -1 : 1));
        return;
      }

      const shift = e.shiftKey;
      if (e.key === "ArrowUp") {
        e.preventDefault();
        if (shift) setSelection(state.sel.r, state.sel.c, r2 - 1, c2);
        else setSelection(r - 1, c);
        scrollActiveIntoView();
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (shift) setSelection(state.sel.r, state.sel.c, r2 + 1, c2);
        else setSelection(r + 1, c);
        scrollActiveIntoView();
        return;
      }
      if (e.key === "ArrowLeft") {
        e.preventDefault();
        if (shift) setSelection(state.sel.r, state.sel.c, r2, c2 - 1);
        else setSelection(r, c - 1);
        scrollActiveIntoView();
        return;
      }
      if (e.key === "ArrowRight") {
        e.preventDefault();
        if (shift) setSelection(state.sel.r, state.sel.c, r2, c2 + 1);
        else setSelection(r, c + 1);
        scrollActiveIntoView();
        return;
      }

      // Start typing
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        startEdit(e.key, "cell", true);
      }
    });

    function scrollActiveIntoView() {
      const el = cellEls[cellKey(state.sel.r, state.sel.c)];
      if (el) el.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    // ========== Formula bar focus ==========
    formulaInput.addEventListener("focus", () => {
      if (!state.editing) {
        state.editing = true;
        state.editCell = { r: state.sel.r, c: state.sel.c };
        state.editSource = "formula";
        state.editValue = formulaInput.value;
        state.formulaPointing = false;
        state._lastInsertedRef = null;
      } else if (state.editSource === "cell") {
        // move edit to formula bar
        if (editorEl) state.editValue = editorEl.value;
        destroyEditor();
        state.editSource = "formula";
        formulaInput.value = state.editValue;
      }
    });

    formulaInput.addEventListener("mousedown", (e) => {
      // clicking formula bar while formula pointing resets insert anchor
      state.formulaPointing = false;
      state._lastInsertedRef = null;
    });

    // ========== Toolbar actions ==========
    function forEachSelected(fn) {
      const { r, c, r2, c2 } = state.sel;
      const rMin = Math.min(r, r2), rMax = Math.max(r, r2);
      const cMin = Math.min(c, c2), cMax = Math.max(c, c2);
      for (let rr = rMin; rr <= rMax; rr++) {
        for (let cc = cMin; cc <= cMax; cc++) fn(rr, cc);
      }
    }

    function toggleBold() {
      let anyOff = false;
      forEachSelected((r, c) => {
        const cell = getCell(r, c);
        if (!cell || !cell.bold) anyOff = true;
      });
      forEachSelected((r, c) => {
        const cell = ensureCell(r, c);
        cell.bold = anyOff;
        paintCell(r, c);
      });
      document.getElementById("btnBold").classList.toggle("active", anyOff);
    }

    function toggleItalic() {
      let anyOff = false;
      forEachSelected((r, c) => {
        const cell = getCell(r, c);
        if (!cell || !cell.italic) anyOff = true;
      });
      forEachSelected((r, c) => {
        const cell = ensureCell(r, c);
        cell.italic = anyOff;
        paintCell(r, c);
      });
      document.getElementById("btnItalic").classList.toggle("active", anyOff);
    }

    function clearSelectionContents() {
      forEachSelected((r, c) => {
        const cell = getCell(r, c);
        if (cell) {
          cell.raw = "";
          if (!cell.bold && !cell.italic && !cell.bg) {
            delete sheet().cells[cellKey(r, c)];
          }
        }
      });
      recomputeSheet();
      paintAllCells();
      updateFormulaBar();
      setStatus("Cleared");
    }

    function applyBgColor(color) {
      forEachSelected((r, c) => {
        const cell = ensureCell(r, c);
        cell.bg = color;
        paintCell(r, c);
      });
    }

    document.getElementById("btnBold").addEventListener("click", toggleBold);
    document.getElementById("btnItalic").addEventListener("click", toggleItalic);
    document.getElementById("btnClear").addEventListener("click", clearSelectionContents);
    document.getElementById("btnClearFormat").addEventListener("click", () => {
      forEachSelected((r, c) => {
        const cell = getCell(r, c);
        if (cell) {
          cell.bg = "";
          paintCell(r, c);
        }
      });
    });
    bgColorInput.addEventListener("input", () => applyBgColor(bgColorInput.value));

    // ========== Clipboard ==========
    function copySelection() {
      const { r, c, r2, c2 } = state.sel;
      const rMin = Math.min(r, r2), rMax = Math.max(r, r2);
      const cMin = Math.min(c, c2), cMax = Math.max(c, c2);
      const data = [];
      for (let rr = rMin; rr <= rMax; rr++) {
        const row = [];
        for (let cc = cMin; cc <= cMax; cc++) {
          const cell = getCell(rr, cc);
          row.push(cell ? { ...cell } : { raw: "", bold: false, italic: false, bg: "" });
        }
        data.push(row);
      }
      state.clipboard = { data, cut: false };
      // also system clipboard as TSV of display values
      const tsv = data.map((row) => row.map((cell) => cell.raw).join("\t")).join("\n");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(tsv).catch(() => {});
      }
      setStatus("Copied");
    }

    function cutSelection() {
      copySelection();
      state.clipboard.cut = true;
      clearSelectionContents();
      setStatus("Cut");
    }

    function pasteClipboard() {
      if (!state.clipboard) return;
      const { data } = state.clipboard;
      const r0 = state.sel.r, c0 = state.sel.c;
      for (let i = 0; i < data.length; i++) {
        for (let j = 0; j < data[i].length; j++) {
          const rr = r0 + i, cc = c0 + j;
          if (rr >= ROWS || cc >= COLS) continue;
          const src = data[i][j];
          const cell = ensureCell(rr, cc);
          cell.raw = src.raw;
          cell.bold = src.bold;
          cell.italic = src.italic;
          cell.bg = src.bg;
        }
      }
      recomputeSheet();
      paintAllCells();
      updateFormulaBar();
      setStatus("Pasted");
    }

    // ========== CSV ==========
    function downloadCSV() {
      const s = sheet();
      // find used range
      let maxR = 0, maxC = 0;
      Object.keys(s.cells).forEach((k) => {
        const [r, c] = k.split(",").map(Number);
        if (s.cells[k].raw) {
          maxR = Math.max(maxR, r);
          maxC = Math.max(maxC, c);
        }
      });
      const lines = [];
      for (let r = 0; r <= maxR; r++) {
        const cols = [];
        for (let c = 0; c <= maxC; c++) {
          let v = getRaw(r, c);
          if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
          cols.push(v);
        }
        lines.push(cols.join(","));
      }
      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (document.getElementById("docName").value || "sheet") + "_" + s.name + ".csv";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("Downloaded CSV");
    }

    function uploadCSV(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "");
        const rows = parseCSV(text);
        // clear sheet content but keep name
        sheet().cells = {};
        for (let r = 0; r < Math.min(rows.length, ROWS); r++) {
          for (let c = 0; c < Math.min(rows[r].length, COLS); c++) {
            if (rows[r][c] !== "") {
              ensureCell(r, c).raw = rows[r][c];
            }
          }
        }
        recomputeSheet();
        paintAllCells();
        setSelection(0, 0);
        setStatus("Loaded CSV (" + rows.length + " rows)");
      };
      reader.readAsText(file);
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cur = "";
      let i = 0;
      let inQ = false;
      while (i < text.length) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cur += '"'; i += 2; continue; }
            inQ = false; i++; continue;
          }
          cur += ch; i++; continue;
        }
        if (ch === '"') { inQ = true; i++; continue; }
        if (ch === ",") { row.push(cur); cur = ""; i++; continue; }
        if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; i++; continue; }
        if (ch === "\r") { i++; continue; }
        cur += ch; i++;
      }
      row.push(cur);
      if (row.length > 1 || row[0] !== "") rows.push(row);
      return rows;
    }

    document.getElementById("btnDownload").addEventListener("click", downloadCSV);
    document.getElementById("btnUpload").addEventListener("click", () => {
      document.getElementById("fileInput").click();
    });
    document.getElementById("fileInput").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) uploadCSV(f);
      e.target.value = "";
    });

    // ========== Sheets ==========
    function renderSheetTabs() {
      sheetTabs.innerHTML = "";
      state.sheets.forEach((s, i) => {
        const tab = document.createElement("button");
        tab.type = "button";
        tab.className = "sheet-tab" + (i === state.activeSheet ? " active" : "");
        tab.textContent = s.name;
        tab.addEventListener("click", () => switchSheet(i));
        tab.addEventListener("dblclick", () => renameSheet(i));
        tab.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          // simple: select and show browser-like options via buttons
          switchSheet(i);
        });
        sheetTabs.appendChild(tab);
      });
    }

    function switchSheet(i) {
      if (state.editing) commitEdit();
      if (i < 0 || i >= state.sheets.length) return;
      state.activeSheet = i;
      state.sel = { r: 0, c: 0, r2: 0, c2: 0 };
      buildGrid();
      renderSheetTabs();
      setStatus("Sheet: " + sheet().name);
    }

    function addSheet() {
      if (state.editing) commitEdit();
      let n = state.sheets.length + 1;
      let name = "Sheet" + n;
      while (state.sheets.some((s) => s.name === name)) {
        n++;
        name = "Sheet" + n;
      }
      state.sheets.push(createEmptySheet(name));
      switchSheet(state.sheets.length - 1);
    }

    function renameSheet(index) {
      const i = index != null ? index : state.activeSheet;
      const tab = sheetTabs.children[i];
      if (!tab) return;
      const current = state.sheets[i].name;
      const input = document.createElement("input");
      input.value = current;
      tab.textContent = "";
      tab.appendChild(input);
      input.focus();
      input.select();
      const finish = () => {
        let name = input.value.trim() || current;
        // unique
        if (state.sheets.some((s, idx) => idx !== i && s.name === name)) {
          name = name + "_" + (i + 1);
        }
        state.sheets[i].name = name;
        renderSheetTabs();
      };
      input.addEventListener("blur", finish);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { input.value = current; input.blur(); }
      });
    }

    function deleteSheet() {
      if (state.sheets.length <= 1) {
        setStatus("Cannot delete the only sheet");
        return;
      }
      if (state.editing) commitEdit();
      const name = sheet().name;
      state.sheets.splice(state.activeSheet, 1);
      state.activeSheet = Math.min(state.activeSheet, state.sheets.length - 1);
      buildGrid();
      renderSheetTabs();
      setStatus("Deleted " + name);
    }

    document.getElementById("btnAddSheet").addEventListener("click", addSheet);
    document.getElementById("btnRenameSheet").addEventListener("click", () => renameSheet());
    document.getElementById("btnDeleteSheet").addEventListener("click", deleteSheet);

    // ========== Context menu ==========
    gridInner.addEventListener("contextmenu", (e) => {
      const cell = e.target.closest(".cell");
      if (!cell) return;
      e.preventDefault();
      if (state.editing && !isFormulaEditMode()) commitEdit();
      const r = parseInt(cell.dataset.r, 10);
      const c = parseInt(cell.dataset.c, 10);
      // if right-click outside selection, select cell
      const { r: sr, c: sc, r2, c2 } = state.sel;
      const rMin = Math.min(sr, r2), rMax = Math.max(sr, r2);
      const cMin = Math.min(sc, c2), cMax = Math.max(sc, c2);
      if (r < rMin || r > rMax || c < cMin || c > cMax) setSelection(r, c);
      ctxMenu.style.left = e.clientX + "px";
      ctxMenu.style.top = e.clientY + "px";
      ctxMenu.classList.add("open");
    });

    document.addEventListener("click", () => ctxMenu.classList.remove("open"));
    ctxMenu.addEventListener("click", (e) => {
      const btn = e.target.closest(".ctx-item");
      if (!btn) return;
      const act = btn.dataset.act;
      ctxMenu.classList.remove("open");
      if (act === "cut") cutSelection();
      if (act === "copy") copySelection();
      if (act === "paste") pasteClipboard();
      if (act === "clear") clearSelectionContents();
      if (act === "bold") toggleBold();
      if (act === "italic") toggleItalic();
    });

    // ========== Demo data ==========
    function loadDemo() {
      const s = sheet();
      const put = (r, c, raw, style) => {
        const cell = ensureCell(r, c, s);
        cell.raw = raw;
        if (style) Object.assign(cell, style);
      };
      put(0, 0, "Item", { bold: true, bg: "#d9ead3" });
      put(0, 1, "Qty", { bold: true, bg: "#d9ead3" });
      put(0, 2, "Price", { bold: true, bg: "#d9ead3" });
      put(0, 3, "Total", { bold: true, bg: "#d9ead3" });
      put(1, 0, "Apples"); put(1, 1, "12"); put(1, 2, "0.8"); put(1, 3, "=B2*C2");
      put(2, 0, "Bread"); put(2, 1, "4"); put(2, 2, "2.5"); put(2, 3, "=B3*C3");
      put(3, 0, "Milk"); put(3, 1, "6"); put(3, 2, "1.2"); put(3, 3, "=B4*C4");
      put(4, 0, "Eggs"); put(4, 1, "24"); put(4, 2, "0.25"); put(4, 3, "=B5*C5");
      put(6, 0, "Subtotal", { bold: true });
      put(6, 3, "=SUM(D2:D5)", { bold: true });
      put(7, 0, "Average line", { italic: true });
      put(7, 3, "=AVERAGE(D2:D5)");
      put(8, 0, "Min / Max");
      put(8, 2, "=MIN(D2:D5)");
      put(8, 3, "=MAX(D2:D5)");
      put(10, 0, "Tip: edit a formula, then click or drag cells to insert references.");
    }

    // ========== Init ==========
    loadDemo();
    buildGrid();
    renderSheetTabs();
    setSelection(0, 0);
    setStatus("Ready — try formulas like =SUM(D2:D5)");

    // Make grid focusable for keyboard
    gridScroll.tabIndex = 0;
  })();
  </script>
</body>
</html>
