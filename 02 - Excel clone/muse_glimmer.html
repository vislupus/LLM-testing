<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mini Excel Clone</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial;background:#f5f7fb;color:#111}
.toolbar{display:flex;gap:6px;padding:6px 8px;background:#fff;border-bottom:1px solid #ddd;align-items:center}
.toolbar button, .toolbar input{padding:4px 8px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer}
.formulabar{display:flex;gap:6px;padding:6px 8px;background:#fff;border-bottom:1px solid #ddd;align-items:center}
.formulabar span{min-width:60px;font-weight:600;color:#333}
.formulabar input{flex:1;padding:6px;border:1px solid #ccc;border-radius:4px}
.sheetbar{display:flex;gap:4px;padding:6px 8px;background:#eef2f7;border-top:1px solid #ddd;overflow:auto}
.sheettab{padding:4px 10px;border:1px solid #ccc;background:#fff;border-radius:4px;cursor:pointer;white-space:nowrap}
.sheettab.active{background:#1a73e8;color:#fff;border-color:#1a73e8}
.gridwrap{height:calc(100vh - 124px);overflow:auto;background:#fff}
table{border-collapse:collapse}
th{background:#f3f3f3;position:sticky;top:0;z-index:2;border:1px solid #ddd;padding:4px 6px;font-size:12px;user-select:none}
td{border:1px solid #e5e7eb;padding:0 6px;height:22px;min-width:80px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
td.selected{background:#e8f0fe;outline:1px solid #1a73e8}
td.active{border:2px solid #1a73e8}
.rowhead{background:#fafafa;position:sticky;left:0;z-index:1;text-align:center}
.colhead{position:sticky;top:0;z-index:2;text-align:center}
.corner{position:sticky;top:0;left:0;z-index:3;background:#e9ecef}
</style>
</head>
<body>
<div class="toolbar">
<button id="bold">B</button>
<button id="italic">I</button>
<input type="color" id="bgcolor" title="Fill">
<button id="clear">Clear</button>
<button id="csvDown">Download CSV</button>
<label style="margin-left:auto"><input type="file" id="csvUp" accept=".csv" style="display:none">Upload CSV</label>
<button id="csvUpBtn">Upload CSV</button>
</div>
<div class="formulabar">
<span id="addr">A1</span>
<input id="formula" placeholder="Enter value or formula =A1+B1"/>
</div>
<div class="gridwrap"><table id="grid"></table></div>
<div class="sheetbar" id="sheetbar"></div>
<script>
const ROWS=200, COLS=26;
const sheets={Sheet1:{cells:{},colWidths:Array(COLS).fill(100)}};
let active='Sheet1';
let sel={r:0,c:0,r2:0,c2:0};
let editing=false;
const grid=document.getElementById('grid');
const addrEl=document.getElementById('addr');
const formulaEl=document.getElementById('formula');

function colName(i){let s='';for(;;){s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26)-1;if(i<0)break}return s}
function colIdx(n){let i=0;for(let k=0;k<n.length;k++)i=i*26+(n.charCodeAt(k)-64);return i-1}
function key(r,c){return r+','+c}
function getCell(){const s=sheets[active].cells[key(sel.r,sel.c)];return s||{raw:''}}
function setCell(raw){sheets[active].cells[key(sel.r,sel.c)]={raw,format:getCell().format||{}};render()}
function evalCell(r,c,visiting=new Set()){
 const k=key(r,c); if(visiting.has(k)) return '#CYCLE';
 if(evalCache.has(k)) return evalCache.get(k);
 visiting.add(k);
 const cell=sheets[active].cells[k]; let raw=cell?cell.raw:'';
 let val=raw;
 if(raw && raw.startsWith('=')){
  try{
   let f=raw.slice(1);
   f=f.replace(/\b(SUM|AVERAGE|MIN|MAX)\(([A-Z]+[0-9]+:[A-Z]+[0-9]+)\)/g,(m,fn,a,b)=>{
     const vals=rangeVals(a,b,visiting);
     let v=0; if(fn==='SUM') v=vals.reduce((a,b)=>a+Number(b||0),0);
     if(fn==='AVERAGE') v=vals.length?vals.reduce((a,b)=>a+Number(b||0),0)/vals.length:0;
     if(fn==='MIN') v=Math.min(...vals.map(Number));
     if(fn==='MAX') v=Math.max(...vals.map(Number));
     return v;
   });
   f=f.replace(/([A-Z]+[0-9]+)/g,(m)=>{
     const m2=m.match(/^([A-Z]+)([0-9]+)$/); if(!m2) return 0;
     const cc=colIdx(m2[1]); const rr=parseInt(m2[2])-1;
     const v=evalCell(rr,cc,visiting); const n=parseFloat(v); return isNaN(n)?0:n;
   });
   val=Function('return ('+f+')')();
 }catch(e){val='#ERR'}
 }
 evalCache.set(k,val); visiting.delete(k); return val;
}
function rangeVals(a,b,visiting){
 const [ca,ra]=[colIdx(a.match(/[A-Z]+/)[0]),parseInt(a.match(/[0-9]+/)[0])-1];
 const [cb,rb]=[colIdx(b.match(/[A-Z]+/)[0]),parseInt(b.match(/[0-9]+/)[0])-1];
 const vals=[]; for(let r=Math.min(ra,rb);r<=Math.max(ra,rb);r++) for(let c=Math.min(ca,cb);c<=Math.max(ca,cb);c++) vals.push(evalCell(r,c,visiting)); return vals;
}
let evalCache=new Map();

function buildGrid(){
 grid.innerHTML='';
 const thead=document.createElement('thead'); const trh=document.createElement('tr');
 const th0=document.createElement('th'); th0.className='corner'; trh.appendChild(th0);
 for(let c=0;c<COLS;c++){const th=document.createElement('th');th.className='colhead';th.textContent=colName(c);th.dataset.c=c;trh.appendChild(th)}
 thead.appendChild(trh); grid.appendChild(thead);
 const tbody=document.createElement('tbody');
 for(let r=0;r<ROWS;r++){const tr=document.createElement('tr');
  const th=document.createElement('th');th.className='rowhead';th.textContent=r+1;tr.appendChild(th);
  for(let c=0;c<COLS;c++){const td=document.createElement('td');td.dataset.r=r;td.dataset.c=c;tr.appendChild(td)}
  tbody.appendChild(tr)}
 grid.appendChild(tbody);
}
buildGrid();

function render(){
 evalCache.clear();
 const sheet=sheets[active];
 document.querySelectorAll('td').forEach(td=>{
  const r=+td.dataset.r,c=+td.dataset.c;
  const cell=sheet.cells[key(r,c)];
  const v=evalCell(r,c);
  td.textContent=(v==='')?'':v;
  const fmt=cell?.format||{};
  td.style.fontWeight=fmt.bold?'bold':'';
  td.style.fontStyle=fmt.italic?'italic':'';
  td.style.background=fmt.bg||'';
 });
 // selection
 document.querySelectorAll('td').forEach(td=>td.classList.remove('selected','active'));
 for(let r=Math.min(sel.r,sel.r2);r<=Math.max(sel.r,sel.r2);r++) for(let c=Math.min(sel.c,sel.c2);c<=Math.max(sel.c,sel.c2);c++){
  const td=document.querySelector(`td[data-r="${r}"][data-c="${c}"]`); if(td) td.classList.add('selected');
 }
 const activeTd=document.querySelector(`td[data-r="${sel.r}"][data-c="${sel.c}"]`); if(activeTd) activeTd.classList.add('active');
 const r1=Math.min(sel.r,sel.r2),c1=Math.min(sel.c,sel.c2),r2=Math.max(sel.r,sel.r2),c2=Math.max(sel.c,sel.c2);
 addrEl.textContent=(r1===r2&&c1===c2)?colName(c1)+(r1+1):colName(c1)+(r1+1)+':'+colName(c2)+(r2+1);
 const cell=getCell(); formulaEl.value=cell.raw||'';
}
render();

grid.addEventListener('mousedown',e=>{
 const td=e.target.closest('td'); if(!td) return;
 sel.r=+td.dataset.r; sel.c=+td.dataset.c; sel.r2=sel.r; sel.c2=sel.c; editing=false; render();
 const onMove=ev=>{const t=ev.target.closest('td'); if(!t) return; sel.r2=+t.dataset.r; sel.c2=+t.dataset.c; render(); if(formulaEl===document.activeElement){ const range=colName(Math.min(sel.c,sel.c2))+(Math.min(sel.r,sel.r2)+1)+':'+colName(Math.max(sel.c,sel.c2))+(Math.max(sel.r,sel.r2)+1); const pos=formulaEl.selectionStart; formulaEl.value=formulaEl.value.slice(0,pos)+range+formulaEl.value.slice(pos); formulaEl.selectionStart=formulaEl.selectionEnd=pos+range.length;}}
 const onUp=()=>{document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp)};
 document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
});
grid.addEventListener('dblclick',e=>{
 const td=e.target.closest('td'); if(!td) return; sel.r=+td.dataset.r; sel.c=+td.dataset.c; editing=true; render(); formulaEl.focus(); formulaEl.select();
});
formulaEl.addEventListener('keydown',e=>{if(e.key==='Enter'){const raw=formulaEl.value; const s=sheets[active]; for(let r=Math.min(sel.r,sel.r2);r<=Math.max(sel.r,sel.r2);r++) for(let c=Math.min(sel.c,sel.c2);c<=Math.max(sel.c,sel.c2);c++){const k=key(r,c); s.cells[k]={raw,format:s.cells[k]?.format||{}};} render(); editing=false;}});
formulaEl.addEventListener('blur',()=>{editing=false;});
document.addEventListener('keydown',e=>{
 if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) return;
 let nr=sel.r,nc=sel.c;
 if(e.key==='ArrowUp') nr--; if(e.key==='ArrowDown') nr++; if(e.key==='ArrowLeft') nc--; if(e.key==='ArrowRight') nc++;
 if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){sel.r=nr;sel.c=nc;sel.r2=nr;sel.c2=nc;render();}
 if(e.key==='Enter'){editing=true;formulaEl.focus();formulaEl.select();}
 if(e.key==='Tab'){e.preventDefault(); sel.c=Math.min(COLS-1,sel.c+1); sel.r2=sel.r; sel.c2=sel.c; render();}
});
document.getElementById('bold').onclick=()=>applyFmt('bold');
document.getElementById('italic').onclick=()=>applyFmt('italic');
document.getElementById('bgcolor').oninput=e=>applyFmt('bg',e.target.value);
document.getElementById('clear').onclick=()=>{for(let r=Math.min(sel.r,sel.r2);r<=Math.max(sel.r,sel.r2);r++) for(let c=Math.min(sel.c,sel.c2);c<=Math.max(sel.c,sel.c2);c++){delete sheets[active].cells[key(r,c)];} render();};
function applyFmt(prop,val){const s=sheets[active];for(let r=Math.min(sel.r,sel.r2);r<=Math.max(sel.r,sel.r2);r++) for(let c=Math.min(sel.c,sel.c2);c<=Math.max(sel.c,sel.c2);c++){const k=key(r,c); if(!s.cells[k]) s.cells[k]={raw:'',format:{}}; if(!s.cells[k].format) s.cells[k].format={}; if(val===undefined) s.cells[k].format[prop]=!s.cells[k].format[prop]; else s.cells[k].format[prop]=val;} render();}

function refreshSheets(){
 const bar=document.getElementById('sheetbar'); bar.innerHTML='';
 Object.keys(sheets).forEach(name=>{
  const b=document.createElement('button');b.className='sheettab'+(name===active?' active':'');b.textContent=name;
  b.onclick=()=>{active=name;render();refreshSheets();};
  bar.appendChild(b);
  const del=document.createElement('button');del.textContent='×';del.style.marginLeft='4px';del.onclick=(e)=>{e.stopPropagation(); if(confirm('Delete sheet?')){delete sheets[name]; if(active===name){active=Object.keys(sheets)[0];} refreshSheets();}};
  bar.appendChild(del);
 });
 const add=document.createElement('button');add.textContent='+';add.className='sheettab';add.onclick=()=>{let n='Sheet'+(Object.keys(sheets).length+1);sheets[n]={cells:{},colWidths:Array(COLS).fill(100)};active=n;refreshSheets();render();};
 bar.appendChild(add);
}
refreshSheets();

document.getElementById('csvDown').onclick=()=>{
 const rows=[]; for(let r=0;r<ROWS;r++){const row=[]; for(let c=0;c<COLS;c++){row.push(''+evalCell(r,c));} rows.push(row.join(','));}
 const blob=new Blob([rows.join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sheet.csv'; a.click();
};
document.getElementById('csvUpBtn').onclick=()=>document.getElementById('csvUp').click();
document.getElementById('csvUp').onchange=e=>{
 const file=e.target.files[0]; if(!file) return; const reader=new FileReader();
 reader.onload=()=>{const txt=reader.result.split(/\r?\n/); sheets[active].cells={}; txt.forEach((line,i)=>{line.split(',').forEach((v,j)=>{if(v){sheets[active].cells[key(i,j)]={raw:v}})});}); render();};
 reader.readAsText(file);
};
</script>
</body>
</html>
