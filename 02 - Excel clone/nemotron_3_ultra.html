<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreadsheet</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3f2f1;
  --panel: #ffffff;
  --border: #d2d0ce;
  --border-strong: #8a8886;
  --text: #323130;
  --text-secondary: #605e5c;
  --accent: #0078d4;
  --accent-hover: #106ebe;
  --accent-bg: #e8f0fe;
  --selection: #b4d5fe;
  --selection-border: #0078d4;
  --header-bg: #faf9f8;
  --header-hover: #edebe9;
  --active-cell: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-strong: 0 4px 16px rgba(0,0,0,0.12);
  --scrollbar: #c8c6c4;
  --scrollbar-hover: #a19f9d;
  --danger: #d13438;
  --success: #107c10;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  min-height: 48px;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 8px;
  border-right: 1px solid var(--border);
}

.toolbar-group:last-child { border-right: none; }

.toolbar-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border: none;
  background: transparent;
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s;
}

.toolbar-btn:hover { background: var(--header-hover); }
.toolbar-btn:active { background: var(--border); }
.toolbar-btn.active { background: var(--accent-bg); color: var(--accent); }

.toolbar-btn svg { width: 16px; height: 16px; }

.toolbar-select {
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  font-size: 13px;
  color: var(--text);
  min-width: 100px;
}

.toolbar-divider { width: 1px; height: 24px; background: var(--border); margin: 0 4px; }

/* Formula Bar */
.formula-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}

.fx-label {
  width: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  color: var(--accent);
  font-size: 14px;
}

.cell-address {
  width: 80px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
}

.formula-input {
  flex: 1;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--panel);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--text);
  outline: none;
}

.formula-input:focus, .cell-address:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-bg);
}

/* Main Grid Area */
.main-grid {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

/* Column Headers */
.col-headers {
  display: flex;
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.corner-header {
  width: 48px;
  height: 36px;
  border-right: 1px solid var(--border);
  background: var(--header-bg);
  flex-shrink: 0;
}

.col-header {
  min-width: 80px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  border-right: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  user-select: none;
  white-space: nowrap;
  overflow: hidden;
  position: relative;
}

.col-header:hover { background: var(--header-hover); }

.col-resize {
  position: absolute;
  right: 0;
  top: 0;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  opacity: 0;
  transition: opacity 0.15s;
}

.col-header:hover .col-resize { opacity: 1; }
.col-resize.dragging { opacity: 1; background: var(--accent); }

/* Grid Container */
.grid-container {
  flex: 1;
  display: flex;
  overflow: hidden;
  position: relative;
}

/* Row Headers */
.row-headers {
  width: 48px;
  flex-shrink: 0;
  background: var(--header-bg);
  border-right: 1px solid var(--border);
  overflow-y: hidden;
  position: sticky;
  left: 0;
  z-index: 5;
}

.row-header {
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 8px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-secondary);
  user-select: none;
  white-space: nowrap;
}

.row-header:hover { background: var(--header-hover); }

.row-resize {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 4px;
  cursor: row-resize;
  opacity: 0;
  transition: opacity 0.15s;
}

.row-header:hover .row-resize { opacity: 1; }
.row-resize.dragging { opacity: 1; background: var(--accent); }

/* Viewport */
.viewport {
  flex: 1;
  overflow: auto;
  position: relative;
}

.grid-canvas {
  position: absolute;
  top: 0;
  left: 0;
}

/* Selection Overlay */
.selection-overlay {
  position: absolute;
  pointer-events: none;
  border: 2px solid var(--selection-border);
  background: var(--selection);
  border-radius: 1px;
  z-index: 20;
}

.selection-handle {
  position: absolute;
  bottom: -4px;
  right: -4px;
  width: 8px;
  height: 8px;
  background: var(--selection-border);
  border: 1px solid var(--panel);
  border-radius: 2px;
  cursor: crosshair;
  z-index: 21;
}

/* Active Cell Editor */
.cell-editor {
  position: absolute;
  border: 1px solid var(--accent);
  background: var(--panel);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  padding: 2px 6px;
  outline: none;
  z-index: 30;
  box-shadow: var(--shadow-strong);
}

/* Sheet Tabs */
.sheet-tabs {
  display: flex;
  align-items: center;
  padding: 0 8px;
  height: 36px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}

.sheet-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 28px;
  background: var(--header-bg);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  margin-right: 4px;
  font-size: 12px;
  color: var(--text);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  position: relative;
  white-space: nowrap;
}

.sheet-tab:hover { background: var(--header-hover); }
.sheet-tab.active {
  background: var(--panel);
  border-bottom: 1px solid var(--panel);
  margin-bottom: -1px;
  z-index: 5;
  font-weight: 500;
}

.sheet-tab-close {
  display: none;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}

.sheet-tab:hover .sheet-tab-close { display: flex; }
.sheet-tab-close:hover { background: var(--border); color: var(--danger); }

.add-sheet-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--border);
  border-radius: 4px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  margin-left: 8px;
  flex-shrink: 0;
}

.add-sheet-btn:hover { background: var(--header-hover); border-color: var(--accent); color: var(--accent); }

/* Context Menu */
.context-menu {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-strong);
  padding: 4px 0;
  min-width: 160px;
  z-index: 1000;
  display: none;
}

.context-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

.context-menu-item:hover { background: var(--header-hover); }
.context-menu-item.danger { color: var(--danger); }
.context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* Color Picker Popup */
.color-picker {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-strong);
  padding: 8px;
  display: none;
  z-index: 1000;
}

.color-grid {
  display: grid;
  grid-template-columns: repeat(10, 20px);
  gap: 4px;
}

.color-swatch {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.1s;
}

.color-swatch:hover { transform: scale(1.2); }
.color-swatch.selected { border-color: var(--accent); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
::-webkit-scrollbar-corner { background: var(--header-bg); }

/* Dialogs */
.dialog-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2000;
}

.dialog {
  background: var(--panel);
  border-radius: 8px;
  padding: 24px;
  min-width: 320px;
  box-shadow: var(--shadow-strong);
}

.dialog-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.dialog-input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
.dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; }
.btn { padding: 8px 16px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-secondary { background: var(--header-bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #b52d30; }

/* Status Bar */
.status-bar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 12px;
  height: 24px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-secondary);
}

/* Responsive */
@media (max-width: 768px) {
  .toolbar { padding: 4px 8px; gap: 2px; }
  .toolbar-group { padding: 0 4px; }
  .formula-bar { padding: 4px 8px; }
  .cell-address { width: 60px; }
}
</style>
</head>
<body>
<!-- Toolbar -->
<div class="toolbar" role="toolbar" aria-label="Main toolbar">
  <div class="toolbar-group">
    <button class="toolbar-btn" title="New (Ctrl+N)" onclick="newWorkbook()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></button>

  <div class="toolbar-group">

  </div>

    <button class="toolbar-btn" id="btn-clear" title="Clear Contents (Delete)" onclick="clearSelection()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
  </div>

<!-- Formula Bar -->

<!-- Main Grid -->
<div class="main-grid">

<!-- Status Bar -->
<div class="status-bar" id="status-bar">
  <span id="status-ready">Ready</span>
  <span id="status-selection"></span>
  <span id="status-calc"></span>
</div>

<!-- Context Menu -->
<div class="context-menu" id="context-menu" role="menu">
  <div class="context-menu-item" data-action="cut" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg> Cut</div>
  <div class="context-menu-item" data-action="copy" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</div>
  <div class="context-menu-item" data-action="paste" role="menuitem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Paste</div>

  <div class="context-menu-divider"></div>

  <div class="context-menu-item" data-action="delete-col" role="menuitem">Delete Column</div>
</div>

<!-- Color Picker -->
<div class="color-picker" id="color-picker-fill">
  <div class="color-grid" id="color-grid-fill"></div>
</div>

<!-- Dialogs -->

  <div class="dialog" id="dialog-box">
    <div class="dialog-title" id="dialog-title"></div>
    <input type="text" class="dialog-input" id="dialog-input" autocomplete="off">
    <div class="dialog-buttons">
      <button class="btn btn-secondary" onclick="closeDialog()">Cancel</button>
      <button class="btn btn-primary" id="dialog-confirm" onclick="confirmDialog()">OK</button>
    </div>
  </div>
</div>

<script>
// ============================================
// SPREADSHEET CORE ENGINE
// ============================================

const COLS = 1000;
const ROWS = 1000;
const DEFAULT_COL_WIDTH = 80;
const DEFAULT_ROW_HEIGHT = 24;
const HEADER_HEIGHT = 36;
const ROW_HEADER_WIDTH = 48;

class Spreadsheet {
  constructor() {
    this.sheets = [];
    this.activeSheetIndex = 0;
    this.cellData = new Map(); // key: "sheet:row:col" -> {v: value, f: formula, fmt: {}}
    this.dependencies = new Map(); // cell -> Set(dependents)
    this.dependents = new Map(); // cell -> Set(dependencies)
    this.dirty = new Set();
    
    // Selection state
    this.selection = { startRow: 0, startCol: 0, endRow: 0, endCol: 0, activeRow: 0, activeCol: 0 };
    this.isSelecting = false;
    this.isEditing = false;
    this.editRow = -1;
    this.editCol = -1;
    this.editor = null;
    
    // Viewport
    this.scrollLeft = 0;
    this.scrollTop = 0;
    this.colWidths = new Array(COLS).fill(DEFAULT_COL_WIDTH);
    this.rowHeights = new Array(ROWS).fill(DEFAULT_ROW_HEIGHT);
    
    // Resizing
    this.resizingCol = -1;
    this.resizingRow = -1;
    this.resizeStartX = 0;
    this.resizeStartY = 0;
    this.resizeStartWidth = 0;
    this.resizeStartHeight = 0;
    
    // Formula bar
    this.formulaBarEditing = false;
    this.formulaBarSelectionStart = 0;
    this.formulaBarSelectionEnd = 0;
    
    // Clipboard
    this.clipboard = null;
    
    this.init();
  }
  
  init() {
    this.createSheet('Sheet1');
    this.renderColumnHeaders();
    this.renderRowHeaders();
    this.setupEventListeners();
    this.updateViewport();
    this.updateFormulaBar();
    this.updateStatusBar();
  }
  
  // ========== SHEET MANAGEMENT ==========
  
  createSheet(name) {
    const index = this.sheets.length;
    this.sheets.push({ name, id: Date.now() + index });
    this.renderSheetTabs();
    this.switchSheet(index);
    return index;
  }
  
  switchSheet(index) {
    if (index < 0 || index >= this.sheets.length) return;
    this.activeSheetIndex = index;
    this.selection = { startRow: 0, startCol: 0, endRow: 0, endCol: 0, activeRow: 0, activeCol: 0 };
    this.scrollLeft = 0;
    this.scrollTop = 0;
    this.renderSheetTabs();
    this.renderColumnHeaders();
    this.renderRowHeaders();
    this.updateViewport();
    this.updateFormulaBar();
    this.updateStatusBar();
    this.viewport.scrollLeft = 0;
    this.viewport.scrollTop = 0;
  }
  
  deleteSheet(index) {
    if (this.sheets.length <= 1) return;
    this.sheets.splice(index, 1);
    // Clean up cell data for deleted sheet
    const prefix = `sheet${index}:`;
    for (const key of this.cellData.keys()) {
      if (key.startsWith(prefix)) this.cellData.delete(key);
    }
    // Reindex remaining sheets
    this.reindexSheets();
    if (this.activeSheetIndex >= this.sheets.length) {
      this.activeSheetIndex = this.sheets.length - 1;
    }
    this.switchSheet(this.activeSheetIndex);
  }
  
  renameSheet(index, name) {
    if (index < 0 || index >= this.sheets.length) return;
    this.sheets[index].name = name;
    this.renderSheetTabs();
  }
  
  reindexSheets() {
    // Update cellData keys
    const newData = new Map();
    for (const [key, value] of this.cellData) {
      const parts = key.split(':');
      const sheetIdx = parseInt(parts[0].replace('sheet', ''));
      if (sheetIdx < this.sheets.length) {
        newData.set(`sheet${sheetIdx}:${parts[1]}:${parts[2]}`, value);
      }
    }
    this.cellData = newData;
    this.rebuildDependencies();
  }
  
  renderSheetTabs() {
    const container = document.getElementById('sheet-tabs');
    container.innerHTML = '';
    this.sheets.forEach((sheet, i) => {
      const tab = document.createElement('div');
      tab.className = `sheet-tab ${i === this.activeSheetIndex ? 'active' : ''}`;
      tab.setAttribute('role', 'tab');
      tab.setAttribute('aria-selected', i === this.activeSheetIndex);
      tab.innerHTML = `
        <span>${this.escapeHtml(sheet.name)}</span>
        <button class="sheet-tab-close" onclick="event.stopPropagation(); spreadsheet.deleteSheet(${i})" aria-label="Delete sheet">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      `;
      tab.addEventListener('click', (e) => {
        if (!e.target.closest('.sheet-tab-close')) this.switchSheet(i);
      });
      tab.addEventListener('dblclick', (e) => {
        if (!e.target.closest('.sheet-tab-close')) this.promptRenameSheet(i);
      });
      container.appendChild(tab);
    });
    
    const addBtn = document.createElement('button');
    addBtn.className = 'add-sheet-btn';
    addBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
    addBtn.setAttribute('aria-label', 'Add sheet');
    addBtn.onclick = () => this.createSheet(`Sheet${this.sheets.length + 1}`);
    container.appendChild(addBtn);
  }
  
  promptRenameSheet(index) {
    const sheet = this.sheets[index];
    this.showDialog(`Rename "${sheet.name}"`, sheet.name, (name) => {
      if (name && name.trim()) this.renameSheet(index, name.trim());
    });
  }
  
  // ========== CELL DATA & FORMULAS ==========
  
  getCellKey(row, col, sheet = this.activeSheetIndex) {
    return `sheet${sheet}:${row}:${col}`;
  }
  
  getCell(row, col, sheet = this.activeSheetIndex) {
    return this.cellData.get(this.getCellKey(row, col, sheet)) || { v: '', f: '', fmt: {} };
  }
  
  setCell(row, col, value, formula = '', sheet = this.activeSheetIndex) {
    const key = this.getCellKey(row, col, sheet);
    const old = this.cellData.get(key) || { v: '', f: '', fmt: {} };
    const newValue = value === undefined || value === null ? '' : value;
    
    if (old.v === newValue && old.f === formula) return false;
    
    this.cellData.set(key, { v: newValue, f: formula, fmt: old.fmt || {} });
    this.markDirty(row, col, sheet);
    return true;
  }
  
  setCellFormat(row, col, format, sheet = this.activeSheetIndex) {
    const key = this.getCellKey(row, col, sheet);
    const cell = this.cellData.get(key) || { v: '', f: '', fmt: {} };
    cell.fmt = { ...cell.fmt, ...format };
    this.cellData.set(key, cell);
    this.markDirty(row, col, sheet);
  }
  
  clearCell(row, col, sheet = this.activeSheetIndex) {
    const key = this.getCellKey(row, col, sheet);
    this.cellData.delete(key);
    this.removeDependencies(row, col, sheet);
    this.markDirty(row, col, sheet);
  }
  
  // ========== DEPENDENCY TRACKING ==========
  
  parseReferences(formula) {
    if (!formula || !formula.startsWith('=')) return [];
    const refs = [];
    // Match cell references: A1, $A$1, Sheet1!A1, A1:B10
    const rangeRegex = /(?:(?:'[^']*'|[^!'\s]+)!)?\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?/g;
    let match;
    const formulaUpper = formula.toUpperCase();
    while ((match = rangeRegex.exec(formulaUpper)) !== null) {
      const [, col1, row1, col2, row2] = match;
      const c1 = this.colToIndex(col1);
      const r1 = parseInt(row1) - 1;
      if (col2 && row2) {
        const c2 = this.colToIndex(col2);
        const r2 = parseInt(row2) - 1;
        for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
          for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
            refs.push({ row: r, col: c });
          }
        }
      } else {
        refs.push({ row: r1, col: c1 });
      }
    }
    return refs;
  }
  
  rebuildDependencies() {
    this.dependencies.clear();
    this.dependents.clear();
    for (const [key, cell] of this.cellData) {
      if (cell.f && cell.f.startsWith('=')) {
        const [sheetStr, rowStr, colStr] = key.split(':');
        const sheet = parseInt(sheetStr.replace('sheet', ''));
        const row = parseInt(rowStr);
        const col = parseInt(colStr);
        const refs = this.parseReferences(cell.f);
        refs.forEach(ref => this.addDependency(ref.row, ref.col, sheet, row, col, sheet));
      }
    }
  }
  
  addDependency(depRow, depCol, depSheet, row, col, sheet) {
    const depKey = this.getCellKey(depRow, depCol, depSheet);
    const key = this.getCellKey(row, col, sheet);
    if (!this.dependencies.has(depKey)) this.dependencies.set(depKey, new Set());
    if (!this.dependents.has(key)) this.dependents.set(key, new Set());
    this.dependencies.get(depKey).add(key);
    this.dependents.get(key).add(depKey);
  }
  
  removeDependencies(row, col, sheet) {
    const key = this.getCellKey(row, col, sheet);
    const deps = this.dependents.get(key);
    if (deps) {
      deps.forEach(depKey => {
        const depSet = this.dependencies.get(depKey);
        if (depSet) depSet.delete(key);
      });
      this.dependents.delete(key);
    }
    this.dependencies.delete(key);
  }
  
  updateDependencies(row, col, sheet) {
    this.removeDependencies(row, col, sheet);
    const cell = this.getCell(row, col, sheet);
    if (cell.f && cell.f.startsWith('=')) {
      const refs = this.parseReferences(cell.f);
      refs.forEach(ref => this.addDependency(ref.row, ref.col, sheet, row, col, sheet));
    }
  }
  
  markDirty(row, col, sheet) {
    const key = this.getCellKey(row, col, sheet);
    this.dirty.add(key);
    const dependents = this.dependencies.get(key);
    if (dependents) {
      dependents.forEach(depKey => this.markDirty(...this.parseKey(depKey)));
    }
  }
  
  parseKey(key) {
    const [sheetStr, rowStr, colStr] = key.split(':');
    return [parseInt(rowStr), parseInt(colStr), parseInt(sheetStr.replace('sheet', ''))];
  }
  
  // ========== FORMULA EVALUATION ==========
  
  evaluateAll() {
    if (this.dirty.size === 0) return;
    
    // Topological sort would be ideal, but for simplicity we iterate until stable
    let iterations = 0;
    const maxIterations = 100;
    const evaluated = new Set();
    
    while (this.dirty.size > 0 && iterations < maxIterations) {
      const toEvaluate = Array.from(this.dirty);
      this.dirty.clear();
      
      for (const key of toEvaluate) {
        if (evaluated.has(key)) continue;
        const [row, col, sheet] = this.parseKey(key);
        this.evaluateCell(row, col, sheet);
        evaluated.add(key);
      }
      iterations++;
    }
    
    this.dirty.clear();
  }
  
  evaluateCell(row, col, sheet) {
    const key = this.getCellKey(row, col, sheet);
    const cell = this.cellData.get(key);
    if (!cell || !cell.f || !cell.f.startsWith('=')) return;
    
    try {
      const result = this.evaluateFormula(cell.f, row, col, sheet);
      cell.v = result;
      this.cellData.set(key, cell);
    } catch (e) {
      cell.v = '#ERROR';
      this.cellData.set(key, cell);
    }
  }
  
  evaluateFormula(formula, currentRow, currentCol, currentSheet) {
    const expr = formula.slice(1).trim();
    if (!expr) return '';
    
    // Replace cell references with values
    let processed = expr;
    const rangeRegex = /(?:(?:'[^']*'|[^!'\s]+)!)?\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?/gi;
    
    processed = processed.replace(rangeRegex, (match, col1, row1, col2, row2) => {
      const c1 = this.colToIndex(col1.toUpperCase());
      const r1 = parseInt(row1) - 1;
      if (col2 && row2) {
        const c2 = this.colToIndex(col2.toUpperCase());
        const r2 = parseInt(row2) - 1;
        const values = [];
        for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
          for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++) {
            const cell = this.getCell(r, c, currentSheet);
            const val = this.parseValue(cell.v);
            if (val !== null) values.push(val);
          }
        }
        return `[${values.join(',')}]`;
      } else {
        const cell = this.getCell(r1, c1, currentSheet);
        const val = this.parseValue(cell.v);
        return val !== null ? val : '0';
      }
    });
    
    // Replace functions
    processed = processed.replace(/(\w+)\(([^)]*)\)/gi, (match, func, args) => {
      const argArray = args.split(',').map(a => a.trim()).filter(a => a);
      const nums = argArray.map(a => {
        if (a.startsWith('[') && a.endsWith(']')) {
          return a.slice(1, -1).split(',').map(Number).filter(n => !isNaN(n));
        }
        const n = parseFloat(a);
        return isNaN(n) ? null : n;
      }).flat().filter(n => n !== null);
      
      switch (func.toUpperCase()) {
        case 'SUM': return nums.reduce((a, b) => a + b, 0);
        case 'AVERAGE': return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
        case 'MIN': return nums.length ? Math.min(...nums) : 0;
        case 'MAX': return nums.length ? Math.max(...nums) : 0;
        case 'COUNT': return nums.length;
        default: return match;
      }
    });
    
    // Safe evaluation
    return this.safeEval(processed);
  }
  
  parseValue(v) {
    if (v === '' || v === null || v === undefined) return null;
    if (typeof v === 'number') return v;
    const n = parseFloat(v);
    return isNaN(n) ? null : n;
  }
  
  safeEval(expr) {
    try {
      // Only allow numbers, operators, parentheses, and basic math
      if (!/^[\d+\-*/().,\s\[\]]+$/.test(expr)) return '#ERROR';
      return Function(`"use strict"; return (${expr})`)();
    } catch {
      return '#ERROR';
    }
  }
  
  // ========== RENDERING ==========
  
  renderColumnHeaders() {
    const container = document.getElementById('col-headers');
    const corner = container.querySelector('.corner-header');
    container.innerHTML = '';
    container.appendChild(corner);
    
    const startCol = this.getFirstVisibleCol();
    const endCol = this.getLastVisibleCol();
    
    for (let c = startCol; c <= endCol; c++) {
      const header = document.createElement('div');
      header.className = 'col-header';
      header.style.width = this.colWidths[c] + 'px';
      header.style.minWidth = this.colWidths[c] + 'px';
      header.textContent = this.indexToCol(c);
      header.dataset.col = c;
      header.innerHTML += '<div class="col-resize"></div>';
      container.appendChild(header);
    }
  }
  
  renderRowHeaders() {
    const container = document.getElementById('row-headers');
    container.innerHTML = '';
    
    const startRow = this.getFirstVisibleRow();
    const endRow = this.getLastVisibleRow();
    
    for (let r = startRow; r <= endRow; r++) {
      const header = document.createElement('div');
      header.className = 'row-header';
      header.style.height = this.rowHeights[r] + 'px';
      header.textContent = r + 1;
      header.dataset.row = r;
      header.innerHTML += '<div class="row-resize"></div>';
      container.appendChild(header);
    }
    
    container.style.height = this.getTotalRowsHeight() + 'px';
  }
  
  updateViewport() {
    this.evaluateAll();
    this.drawGrid();
    this.updateSelectionOverlay();
  }
  
  drawGrid() {
    const canvas = document.getElementById('grid-canvas');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    const vpWidth = this.viewport.clientWidth;
    const vpHeight = this.viewport.clientHeight;
    
    canvas.width = vpWidth * dpr;
    canvas.height = vpHeight * dpr;
    canvas.style.width = vpWidth + 'px';
    canvas.style.height = vpHeight + 'px';
    ctx.scale(dpr, dpr);
    
    // Clear
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, vpWidth, vpHeight);
    
    const startCol = this.getFirstVisibleCol();
    const endCol = this.getLastVisibleCol();
    const startRow = this.getFirstVisibleRow();
    const endRow = this.getLastVisibleRow();
    
    // Draw grid lines and cells
    ctx.font = '12px Inter, sans-serif';
    ctx.textBaseline = 'middle';
    
    let x = 0;
    for (let c = startCol; c <= endCol; c++) {
      const colWidth = this.colWidths[c];
      let y = 0;
      
      for (let r = startRow; r <= endRow; r++) {
        const rowHeight = this.rowHeights[r];
        const cell = this.getCell(r, c);
        const key = this.getCellKey(r, c);
        
        // Selection highlight
        if (this.isCellSelected(r, c)) {
          if (r === this.selection.activeRow && c === this.selection.activeCol && !this.isEditing) {
            ctx.fillStyle = '#fff';
          } else {
            ctx.fillStyle = 'rgba(180, 213, 254, 0.5)';
          }
          ctx.fillRect(x, y, colWidth, rowHeight);
        }
        
        // Cell background
        if (cell.fmt && cell.fmt.bg) {
          ctx.fillStyle = cell.fmt.bg;
          ctx.fillRect(x + 1, y + 1, colWidth - 2, rowHeight - 2);
        }
        
        // Cell text
        const displayValue = cell.f && cell.f.startsWith('=') ? cell.v : cell.v;
        if (displayValue !== '' && displayValue !== undefined && displayValue !== null) {
          ctx.fillStyle = cell.fmt && cell.fmt.color ? cell.fmt.color : '#323130';
          ctx.font = `${cell.fmt && cell.fmt.italic ? 'italic ' : ''}${cell.fmt && cell.fmt.bold ? 'bold ' : ''}12px ${cell.fmt && cell.fmt.font || 'Inter'}, sans-serif`;
          
          const text = String(displayValue);
          const padding = 4;
          const maxWidth = colWidth - padding * 2;
          
          // Clip text
          ctx.save();
          ctx.beginPath();
          ctx.rect(x + padding, y, maxWidth, rowHeight);
          ctx.clip();
          ctx.fillText(text, x + padding, y + rowHeight / 2);
          ctx.restore();
        }
        
        // Grid lines
        ctx.strokeStyle = '#e1dfdd';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x + colWidth, y);
        ctx.lineTo(x + colWidth, y + rowHeight);
        ctx.moveTo(x, y + rowHeight);
        ctx.lineTo(x + colWidth, y + rowHeight);
        ctx.stroke();
        
        y += rowHeight;
      }
      x += colWidth;
    }
    
    // Active cell border
    if (!this.isEditing) {
      const activeX = this.getColX(this.selection.activeCol) - this.scrollLeft;
      const activeY = this.getRowY(this.selection.activeRow) - this.scrollTop;
      const activeW = this.colWidths[this.selection.activeCol];
      const activeH = this.rowHeights[this.selection.activeRow];
      
      if (activeX >= -activeW && activeX <= vpWidth && activeY >= -activeH && activeY <= vpHeight) {
        ctx.strokeStyle = '#0078d4';
        ctx.lineWidth = 2;
        ctx.strokeRect(activeX + 0.5, activeY + 0.5, activeW - 1, activeH - 1);
      }
    }
  }
  
  getColX(col) {
    let x = 0;
    for (let c = 0; c < col; c++) x += this.colWidths[c];
    return x;
  }
  
  getRowY(row) {
    let y = 0;
    for (let r = 0; r < row; r++) y += this.rowHeights[r];
    return y;
  }
  
  getFirstVisibleCol() {
    let x = 0;
    for (let c = 0; c < COLS; c++) {
      if (x + this.colWidths[c] > this.scrollLeft) return c;
      x += this.colWidths[c];
    }
    return 0;
  }
  
  getLastVisibleCol() {
    let x = 0;
    for (let c = 0; c < COLS; c++) {
      if (x > this.scrollLeft + this.viewport.clientWidth) return Math.max(0, c - 1);
      x += this.colWidths[c];
    }
    return COLS - 1;
  }
  
  getFirstVisibleRow() {
    let y = 0;
    for (let r = 0; r < ROWS; r++) {
      if (y + this.rowHeights[r] > this.scrollTop) return r;
      y += this.rowHeights[r];
    }
    return 0;
  }
  
  getLastVisibleRow() {
    let y = 0;
    for (let r = 0; r < ROWS; r++) {
      if (y > this.scrollTop + this.viewport.clientHeight) return Math.max(0, r - 1);
      y += this.rowHeights[r];
    }
    return ROWS - 1;
  }
  
  getTotalRowsHeight() {
    return this.rowHeights.reduce((a, b) => a + b, 0);
  }
  
  getTotalColsWidth() {
    return this.colWidths.reduce((a, b) => a + b, 0);
  }
  
  // ========== SELECTION ==========
  
  isCellSelected(row, col) {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    return row >= startRow && row <= endRow && col >= startCol && col <= endCol;
  }
  
  getNormalizedSelection() {
    return {
      startRow: Math.min(this.selection.startRow, this.selection.endRow),
      startCol: Math.min(this.selection.startCol, this.selection.endCol),
      endRow: Math.max(this.selection.startRow, this.selection.endRow),
      endCol: Math.max(this.selection.startCol, this.selection.endCol)
    };
  }
  
  selectCell(row, col, extend = false) {
    if (extend) {
      this.selection.endRow = row;
      this.selection.endCol = col;
    } else {
      this.selection.startRow = this.selection.endRow = this.selection.activeRow = row;
      this.selection.startCol = this.selection.endCol = this.selection.activeCol = col;
    }
    this.ensureCellVisible(row, col);
    this.updateSelectionOverlay();
    this.updateFormulaBar();
    this.updateStatusBar();
    this.drawGrid();
  }
  
  ensureCellVisible(row, col) {
    const cellX = this.getColX(col);
    const cellY = this.getRowY(row);
    const cellW = this.colWidths[col];
    const cellH = this.rowHeights[row];
    const vpWidth = this.viewport.clientWidth;
    const vpHeight = this.viewport.clientHeight;
    
    if (cellX < this.scrollLeft) this.viewport.scrollLeft = cellX;
    else if (cellX + cellW > this.scrollLeft + vpWidth) this.viewport.scrollLeft = cellX + cellW - vpWidth;
    
    if (cellY < this.scrollTop) this.viewport.scrollTop = cellY;
    else if (cellY + cellH > this.scrollTop + vpHeight) this.viewport.scrollTop = cellY + cellH - vpHeight;
  }
  
  updateSelectionOverlay() {
    const overlay = document.getElementById('selection-overlay');
    const handle = document.getElementById('selection-handle');
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    
    const x = this.getColX(startCol) - this.scrollLeft;
    const y = this.getRowY(startRow) - this.scrollTop;
    const w = this.getColX(endCol + 1) - this.getColX(startCol);
    const h = this.getRowY(endRow + 1) - this.getRowY(startRow);
    
    overlay.style.left = x + 'px';
    overlay.style.top = y + 'px';
    overlay.style.width = w + 'px';
    overlay.style.height = h + 'px';
    
    handle.style.left = (x + w - 4) + 'px';
    handle.style.top = (y + h - 4) + 'px';
  }
  
  // ========== EDITING ==========
  
  startEditing(row, col) {
    if (this.isEditing) this.finishEditing();
    
    this.editRow = row;
    this.editCol = col;
    this.isEditing = true;
    
    const cell = this.getCell(row, col);
    const x = this.getColX(col) - this.scrollLeft;
    const y = this.getRowY(row) - this.scrollTop;
    const w = this.colWidths[col];
    const h = this.rowHeights[row];
    
    this.editor = document.createElement('input');
    this.editor.className = 'cell-editor';
    this.editor.style.left = x + 'px';
    this.editor.style.top = y + 'px';
    this.editor.style.width = w + 'px';
    this.editor.style.height = h + 'px';
    this.editor.value = cell.f || cell.v || '';
    this.editor.dataset.originalValue = this.editor.value;
    
    this.viewport.appendChild(this.editor);
    this.editor.focus();
    this.editor.select();
    
    this.editor.addEventListener('keydown', (e) => this.handleEditorKeydown(e));
    this.editor.addEventListener('blur', () => this.finishEditing());
    this.editor.addEventListener('input', () => this.onEditorInput());
  }
  
  finishEditing() {
    if (!this.isEditing || !this.editor) return;
    
    const value = this.editor.value;
    const original = this.editor.dataset.originalValue;
    
    if (value !== original) {
      this.commitEdit(value);
    }
    
    this.editor.remove();
    this.editor = null;
    this.isEditing = false;
    this.editRow = -1;
    this.editCol = -1;
    this.drawGrid();
    this.updateFormulaBar();
    this.viewport.focus();
  }
  
  commitEdit(value) {
    const { editRow, editCol } = this;
    if (value.startsWith('=')) {
      this.setCell(editRow, editCol, '', value);
      this.updateDependencies(editRow, editCol);
    } else {
      // Try to parse as number
      const num = parseFloat(value);
      this.setCell(editRow, editCol, isNaN(num) ? value : num, '');
      this.removeDependencies(editRow, editCol);
    }
    this.evaluateAll();
    this.updateViewport();
  }
  
  onEditorInput() {
    // Could add live preview here
  }
  
  handleEditorKeydown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this.finishEditing();
      this.moveSelection(0, 1);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      this.finishEditing();
      this.moveSelection(e.shiftKey ? -1 : 1, 0);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      this.editor.value = this.editor.dataset.originalValue;
      this.finishEditing();
    } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      // Allow arrow keys in formula bar editing mode
      if (this.formulaBarEditing) return;
      e.preventDefault();
      this.finishEditing();
      const dir = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
      this.moveSelection(dir[0], dir[1]);
    }
  }
  
  moveSelection(dCol, dRow) {
    const { activeRow, activeCol } = this.selection;
    const newRow = Math.max(0, Math.min(ROWS - 1, activeRow + dRow));
    const newCol = Math.max(0, Math.min(COLS - 1, activeCol + dCol));
    this.selectCell(newRow, newCol);
  }
  
  // ========== FORMULA BAR ==========
  
  updateFormulaBar() {
    const addressInput = document.getElementById('cell-address');
    const formulaInput = document.getElementById('formula-input');
    const { activeRow, activeCol } = this.selection;
    
    addressInput.value = this.indexToCol(activeCol) + (activeRow + 1);
    
    const cell = this.getCell(activeRow, activeCol);
    formulaInput.value = cell.f || cell.v || '';
  }
  
  onFormulaBarInput(e) {
    const value = e.target.value;
    const { activeRow, activeCol } = this.selection;
    
    if (this.formulaBarEditing) {
      // Handle cell reference insertion during formula editing
      // This is handled by mouse selection in the grid
    }
  }
  
  onFormulaBarKeydown(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      this.commitFormulaBarEdit();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      this.cancelFormulaBarEdit();
    }
  }
  
  commitFormulaBarEdit() {
    const formulaInput = document.getElementById('formula-input');
    const value = formulaInput.value;
    const { activeRow, activeCol } = this.selection;
    
    if (value.startsWith('=')) {
      this.setCell(activeRow, activeCol, '', value);
      this.updateDependencies(activeRow, activeCol);
    } else {
      const num = parseFloat(value);
      this.setCell(activeRow, activeCol, isNaN(num) ? value : num, '');
      this.removeDependencies(activeRow, activeCol);
    }
    this.evaluateAll();
    this.updateViewport();
    this.formulaBarEditing = false;
    this.viewport.focus();
  }
  
  cancelFormulaBarEdit() {
    this.updateFormulaBar();
    this.formulaBarEditing = false;
    this.viewport.focus();
  }
  
  startFormulaBarEdit() {
    this.formulaBarEditing = true;
    const formulaInput = document.getElementById('formula-input');
    formulaInput.focus();
    // Position cursor at end
    formulaInput.setSelectionRange(formulaInput.value.length, formulaInput.value.length);
  }
  
  insertCellReference(row, col, isRange = false, rangeEnd = null) {
    if (!this.formulaBarEditing) return;
    
    const formulaInput = document.getElementById('formula-input');
    const ref = this.indexToCol(col) + (row + 1);
    let insertText = ref;
    
    if (isRange && rangeEnd) {
      const endRef = this.indexToCol(rangeEnd.col) + (rangeEnd.row + 1);
      insertText = ref + ':' + endRef;
    }
    
    const start = formulaInput.selectionStart;
    const end = formulaInput.selectionEnd;
    const value = formulaInput.value;
    formulaInput.value = value.slice(0, start) + insertText + value.slice(end);
    formulaInput.setSelectionRange(start + insertText.length, start + insertText.length);
    formulaInput.focus();
  }
  
  // ========== TOOLBAR ACTIONS ==========
  
  toggleFormat(type) {
    const { activeRow, activeCol } = this.selection;
    const cell = this.getCell(activeRow, activeCol);
    const fmt = cell.fmt || {};
    fmt[type] = !fmt[type];
    this.setCellFormat(activeRow, activeCol, fmt);
    this.updateToolbarButtons();
    this.drawGrid();
  }
  
  applyFontFamily(font) {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        this.setCellFormat(r, c, { font });
      }
    }
    this.drawGrid();
  }
  
  applyFontSize(size) {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        this.setCellFormat(r, c, { fontSize: parseInt(size) });
      }
    }
    this.drawGrid();
  }
  
  updateToolbarButtons() {
    const { activeRow, activeCol } = this.selection;
    const cell = this.getCell(activeRow, activeCol);
    const fmt = cell.fmt || {};
    
    document.getElementById('btn-bold').classList.toggle('active', fmt.bold);
    document.getElementById('btn-italic').classList.toggle('active', fmt.italic);
  }
  
  toggleColorPicker(e, type) {
    const picker = document.getElementById('color-picker-fill');
    const rect = e.target.getBoundingClientRect();
    picker.style.left = rect.left + 'px';
    picker.style.top = (rect.bottom + 4) + 'px';
    picker.style.display = picker.style.display === 'block' ? 'none' : 'block';
    this.currentColorType = type;
  }
  
  pickColor(color) {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    const fmt = this.currentColorType === 'fill' ? { bg: color } : { color };
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        this.setCellFormat(r, c, fmt);
      }
    }
    this.drawGrid();
    document.getElementById('color-picker-fill').style.display = 'none';
  }
  
  clearSelection() {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        this.clearCell(r, c);
      }
    }
    this.evaluateAll();
    this.updateViewport();
  }
  
  // ========== CSV IMPORT/EXPORT ==========
  
  downloadCSV() {
    const sheet = this.sheets[this.activeSheetIndex];
    const { startRow, startCol, endRow, endCol } = this.getUsedRange();
    if (startRow === -1) return;
    
    let csv = '';
    for (let r = startRow; r <= endRow; r++) {
      const row = [];
      for (let c = startCol; c <= endCol; c++) {
        const cell = this.getCell(r, c);
        let val = cell.v;
        if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n'))) {
          val = '"' + val.replace(/"/g, '""') + '"';
        }
        row.push(val);
      }
      csv += row.join(',') + '\n';
    }
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${sheet.name}.csv`;
    link.click();
    URL.revokeObjectURL(link.href);
  }
  
  handleCSVUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
      const text = evt.target.result;
      this.importCSV(text);
    };
    reader.readAsText(file);
    e.target.value = '';
  }
  
  importCSV(text) {
    const lines = text.split('\n').map(l => l.trim()).filter(l => l);
    lines.forEach((line, r) => {
      const cells = this.parseCSVLine(line);
      cells.forEach((val, c) => {
        const num = parseFloat(val);
        this.setCell(r, c, isNaN(num) ? val : num, '');
      });
    });
    this.evaluateAll();
    this.updateViewport();
  }
  
  parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }
  
  getUsedRange() {
    let minRow = ROWS, maxRow = -1, minCol = COLS, maxCol = -1;
    const prefix = `sheet${this.activeSheetIndex}:`;
    
    for (const key of this.cellData.keys()) {
      if (!key.startsWith(prefix)) continue;
      const [, rowStr, colStr] = key.split(':');
      const row = parseInt(rowStr);
      const col = parseInt(colStr);
      minRow = Math.min(minRow, row);
      maxRow = Math.max(maxRow, row);
      minCol = Math.min(minCol, col);
      maxCol = Math.max(maxCol, col);
    }
    
    if (maxRow === -1) return { startRow: -1, startCol: -1, endRow: -1, endCol: -1 };
    return { startRow: minRow, startCol: minCol, endRow: maxRow, endCol: maxCol };
  }
  
  // ========== UTILITIES ==========
  
  indexToCol(index) {
    let result = '';
    while (index >= 0) {
      result = String.fromCharCode(65 + (index % 26)) + result;
      index = Math.floor(index / 26) - 1;
    }
    return result;
  }
  
  colToIndex(col) {
    let result = 0;
    for (let i = 0; i < col.length; i++) {
      result = result * 26 + (col.charCodeAt(i) - 64);
    }
    return result - 1;
  }
  
  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  showDialog(title, defaultValue, callback) {
    document.getElementById('dialog-title').textContent = title;
    const input = document.getElementById('dialog-input');
    input.value = defaultValue;
    this.dialogCallback = callback;
    document.getElementById('dialog-overlay').style.display = 'flex';
    input.focus();
    input.select();
  }
  
  closeDialog() {
    document.getElementById('dialog-overlay').style.display = 'none';
    this.dialogCallback = null;
  }
  
  confirmDialog() {
    if (this.dialogCallback) {
      this.dialogCallback(document.getElementById('dialog-input').value);
    }
    this.closeDialog();
  }
  
  updateStatusBar() {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    const rowCount = endRow - startRow + 1;
    const colCount = endCol - startCol + 1;
    
    document.getElementById('status-selection').textContent = 
      rowCount > 1 || colCount > 1 ? `${rowCount}R x ${colCount}C` : '';
    
    // Calculate sum/count for selection
    let sum = 0, count = 0, numCount = 0;
    for (let r = startRow; r <= endRow; r++) {
      for (let c = startCol; c <= endCol; c++) {
        count++;
        const cell = this.getCell(r, c);
        const val = this.parseValue(cell.v);
        if (val !== null) {
          sum += val;
          numCount++;
        }
      }
    }
    
    let status = '';
    if (numCount > 0) {
      status = `Sum: ${sum.toLocaleString()} | Avg: ${(sum/numCount).toFixed(2)} | Count: ${numCount}`;
    }
    document.getElementById('status-calc').textContent = status;
  }
  
  // ========== EVENT LISTENERS ==========
  
  setupEventListeners() {
    this.viewport = document.getElementById('viewport');
    const canvas = document.getElementById('grid-canvas');
    const formulaInput = document.getElementById('formula-input');
    const addressInput = document.getElementById('cell-address');
    
    // Viewport scroll
    this.viewport.addEventListener('scroll', () => {
      this.scrollLeft = this.viewport.scrollLeft;
      this.scrollTop = this.viewport.scrollTop;
      this.renderColumnHeaders();
      this.renderRowHeaders();
      this.drawGrid();
      this.updateSelectionOverlay();
      if (this.isEditing) this.finishEditing();
    });
    
    // Canvas mouse events
    canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
    canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
    canvas.addEventListener('mouseup', () => this.handleMouseUp());
    canvas.addEventListener('dblclick', (e) => this.handleDoubleClick(e));
    canvas.addEventListener('contextmenu', (e) => this.handleContextMenu(e));
    canvas.addEventListener('wheel', (e) => this.handleWheel(e), { passive: false });
    
    // Formula bar
    formulaInput.addEventListener('input', (e) => this.onFormulaBarInput(e));
    formulaInput.addEventListener('keydown', (e) => this.onFormulaBarKeydown(e));
    formulaInput.addEventListener('focus', () => { this.formulaBarEditing = true; });
    formulaInput.addEventListener('blur', () => { 
      if (this.formulaBarEditing) this.cancelFormulaBarEdit(); 
    });
    
    // Address input
    addressInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const addr = addressInput.value.trim().toUpperCase();
        const match = addr.match(/^([A-Z]+)(\d+)$/);
        if (match) {
          const col = this.colToIndex(match[1]);
          const row = parseInt(match[2]) - 1;
          if (col >= 0 && col < COLS && row >= 0 && row < ROWS) {
            this.selectCell(row, col);
          }
        }
        this.viewport.focus();
      }
    });
    
    // Column header resize
    document.getElementById('col-headers').addEventListener('mousedown', (e) => {
      const resize = e.target.closest('.col-resize');
      if (resize) {
        const header = resize.closest('.col-header');
        const col = parseInt(header.dataset.col);
        this.startColResize(col, e.clientX);
      }
    });
    
    // Row header resize
    document.getElementById('row-headers').addEventListener('mousedown', (e) => {
      const resize = e.target.closest('.row-resize');
      if (resize) {
        const header = resize.closest('.row-header');
        const row = parseInt(header.dataset.row);
        this.startRowResize(row, e.clientY);
      }
    });
    
    // Global mouse up for resize
    document.addEventListener('mousemove', (e) => {
      if (this.resizingCol >= 0) this.doColResize(e.clientX);
      if (this.resizingRow >= 0) this.doRowResize(e.clientY);
    });
    document.addEventListener('mouseup', () => {
      this.resizingCol = -1;
      this.resizingRow = -1;
      document.querySelectorAll('.col-resize.dragging, .row-resize.dragging').forEach(el => el.classList.remove('dragging'));
    });
    
    // Keyboard navigation
    this.viewport.addEventListener('keydown', (e) => this.handleKeydown(e));
    
    // Click outside to close popups
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.color-picker')) {
        document.getElementById('color-picker-fill').style.display = 'none';
      }
      if (!e.target.closest('.context-menu')) {
        document.getElementById('context-menu').style.display = 'none';
      }
    });
    
    // Window resize
    window.addEventListener('resize', () => this.updateViewport());
    
    // Initialize color picker
    this.initColorPicker();
  }
  
  initColorPicker() {

      '#ffcc99','#ff9966','#ff6633','#ff3300','#cc2900','#991f00','#661400','#330a00','#000000','#000000',
      '#ffffcc','#ffff99','#ffff66','#ffff33','#ffff00','#cccc00','#999900','#666600','#333300','#000000',
      '#ccffcc','#99ff99','#66ff66','#33ff33','#00ff00','#00cc00','#009900','#006600','#003300','#000000',
      '#ccffff','#99ffff','#66ffff','#33ffff','#00ffff','#00cccc','#009999','#006666','#003333','#000000',
      '#ccccff','#9999ff','#6666ff','#3333ff','#0000ff','#0000cc','#000099','#000066','#000033','#000000',

  // ========== MOUSE HANDLING ==========
  
  getCellFromEvent(e) {
    const rect = this.viewport.getBoundingClientRect();
    const x = e.clientX - rect.left + this.scrollLeft;
    const y = e.clientY - rect.top + this.scrollTop;
    
    let col = 0, cx = 0;
    while (col < COLS && cx + this.colWidths[col] <= x) {
      cx += this.colWidths[col];
      col++;
    }
    
    let row = 0, cy = 0;
    while (row < ROWS && cy + this.rowHeights[row] <= y) {
      cy += this.rowHeights[row];
      row++;
    }
    
    return { row: Math.min(row, ROWS - 1), col: Math.min(col, COLS - 1) };
  }
  
  handleMouseDown(e) {
    if (e.button !== 0) return;
    
    const { row, col } = this.getCellFromEvent(e);
    const handle = e.target.closest('.selection-handle');
    
    if (handle) {
      this.isSelecting = true;
      this.selectingFromHandle = true;
      return;
    }
    
    if (e.shiftKey) {
      this.selectCell(row, col, true);
    } else if (e.ctrlKey || e.metaKey) {
      // For simplicity, just select single cell
      this.selectCell(row, col);
    } else {
      this.selectCell(row, col);
      this.isSelecting = true;
      this.selectingFromHandle = false;
    }
    
    this.viewport.focus();
  }
  
  handleMouseMove(e) {
    if (!this.isSelecting) return;
    
    const { row, col } = this.getCellFromEvent(e);
    
    if (this.selectingFromHandle) {
      this.selection.endRow = row;
      this.selection.endCol = col;
    } else {
      this.selection.endRow = row;
      this.selection.endCol = col;
    }
    
    this.updateSelectionOverlay();
    this.updateStatusBar();
    this.drawGrid();
    
    // Auto-scroll
    const rect = this.viewport.getBoundingClientRect();
    const margin = 20;
    if (e.clientY > rect.bottom - margin) this.viewport.scrollTop += 20;
    if (e.clientY < rect.top + margin) this.viewport.scrollTop -= 20;
    if (e.clientX > rect.right - margin) this.viewport.scrollLeft += 20;
    if (e.clientX < rect.left + margin) this.viewport.scrollLeft -= 20;
  }
  
  handleMouseUp() {
    this.isSelecting = false;
    this.selectingFromHandle = false;
    
    // If formula bar is editing, insert reference
    if (this.formulaBarEditing) {
      const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
      if (startRow !== endRow || startCol !== endCol) {
        this.insertCellReference(startRow, startCol, true, { row: endRow, col: endCol });
      } else {
        this.insertCellReference(startRow, startCol);
      }
    }
  }
  
  handleDoubleClick(e) {
    const { row, col } = this.getCellFromEvent(e);
    this.selectCell(row, col);
    this.startEditing(row, col);
  }
  
  handleContextMenu(e) {
    e.preventDefault();
    const { row, col } = this.getCellFromEvent(e);
    this.selectCell(row, col);
    
    const menu = document.getElementById('context-menu');
    menu.style.left = e.pageX + 'px';
    menu.style.top = e.pageY + 'px';
    menu.style.display = 'block';
    
    menu.onclick = (ev) => {
      const action = ev.target.closest('.context-menu-item')?.dataset.action;
      if (action) this.handleContextAction(action);
      menu.style.display = 'none';
    };
  }
  
  handleContextAction(action) {
    const { activeRow, activeCol } = this.selection;
    switch (action) {
      case 'cut':
        this.copySelection();
        this.clearSelection();
        break;
      case 'copy':
        this.copySelection();
        break;
      case 'paste':
        this.pasteSelection();
        break;
      case 'clear':
        this.clearSelection();
        break;
      case 'insert-row':
        this.insertRow(activeRow);
        break;
      case 'delete-row':
        this.deleteRow(activeRow);
        break;
      case 'insert-col':
        this.insertCol(activeCol);
        break;
      case 'delete-col':
        this.deleteCol(activeCol);
        break;
    }
  }
  
  handleWheel(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      // Zoom not implemented
    } else if (e.shiftKey) {
      e.preventDefault();
      this.viewport.scrollLeft += e.deltaY;
    }
  }
  
  handleKeydown(e) {
    if (this.isEditing) return;
    
    const { activeRow, activeCol } = this.selection;
    let newRow = activeRow, newCol = activeCol;
    let extend = e.shiftKey;
    
    switch (e.key) {
      case 'ArrowUp': newRow = Math.max(0, activeRow - 1); break;
      case 'ArrowDown': newRow = Math.min(ROWS - 1, activeRow + 1); break;
      case 'ArrowLeft': newCol = Math.max(0, activeCol - 1); break;
      case 'ArrowRight': newCol = Math.min(COLS - 1, activeCol + 1); break;
      case 'Enter': newRow = Math.min(ROWS - 1, activeRow + 1); break;
      case 'Tab': 
        e.preventDefault();
        newCol = e.shiftKey ? Math.max(0, activeCol - 1) : Math.min(COLS - 1, activeCol + 1);
        break;
      case 'Home': newCol = 0; break;
      case 'End': newCol = COLS - 1; break;
      case 'PageUp': newRow = Math.max(0, activeRow - 20); break;
      case 'PageDown': newRow = Math.min(ROWS - 1, activeRow + 20); break;
      case 'Delete':
      case 'Backspace':
        e.preventDefault();
        this.clearSelection();
        return;
      case 'F2':
        e.preventDefault();
        this.startEditing(activeRow, activeCol);
        return;
      default: return;
    }
    
    e.preventDefault();
    this.selectCell(newRow, newCol, extend);
  }
  
  // ========== RESIZE HANDLING ==========
  
  startColResize(col, clientX) {
    this.resizingCol = col;
    this.resizeStartX = clientX;
    this.resizeStartWidth = this.colWidths[col];
    document.querySelector(`.col-header[data-col="${col}"] .col-resize`)?.classList.add('dragging');
  }
  
  doColResize(clientX) {
    if (this.resizingCol < 0) return;
    const delta = clientX - this.resizeStartX;
    const newWidth = Math.max(40, this.resizeStartWidth + delta);
    this.colWidths[this.resizingCol] = newWidth;
    this.renderColumnHeaders();
    this.drawGrid();
    this.updateSelectionOverlay();
  }
  
  startRowResize(row, clientY) {
    this.resizingRow = row;
    this.resizeStartY = clientY;
    this.resizeStartHeight = this.rowHeights[row];
    document.querySelector(`.row-header[data-row="${row}"] .row-resize`)?.classList.add('dragging');
  }
  
  doRowResize(clientY) {
    if (this.resizingRow < 0) return;
    const delta = clientY - this.resizeStartY;
    const newHeight = Math.max(20, this.resizeStartHeight + delta);
    this.rowHeights[this.resizingRow] = newHeight;
    this.renderRowHeaders();
    this.drawGrid();
    this.updateSelectionOverlay();
  }
  
  // ========== ROW/COL OPERATIONS ==========
  
  insertRow(atRow) {
    this.rowHeights.splice(atRow, 0, DEFAULT_ROW_HEIGHT);
    // Shift cell data down
    const newData = new Map();
    const prefix = `sheet${this.activeSheetIndex}:`;
    for (const [key, value] of this.cellData) {
      if (!key.startsWith(prefix)) { newData.set(key, value); continue; }
      const [, rowStr, colStr] = key.split(':');
      const row = parseInt(rowStr);
      const col = parseInt(colStr);
      if (row >= atRow) {
        newData.set(`${prefix}${row + 1}:${col}`, value);
      } else {
        newData.set(key, value);
      }
    }
    this.cellData = newData;
    this.rebuildDependencies();
    this.renderRowHeaders();
    this.updateViewport();
  }
  
  deleteRow(atRow) {
    this.rowHeights.splice(atRow, 1);
    this.rowHeights.push(DEFAULT_ROW_HEIGHT);
    // Shift cell data up
    const newData = new Map();
    const prefix = `sheet${this.activeSheetIndex}:`;
    for (const [key, value] of this.cellData) {
      if (!key.startsWith(prefix)) { newData.set(key, value); continue; }
      const [, rowStr, colStr] = key.split(':');
      const row = parseInt(rowStr);
      const col = parseInt(colStr);
      if (row > atRow) {
        newData.set(`${prefix}${row - 1}:${col}`, value);
      } else if (row < atRow) {
        newData.set(key, value);
      }
      // Row atRow is deleted
    }
    this.cellData = newData;
    this.rebuildDependencies();
    this.renderRowHeaders();
    this.updateViewport();
  }
  
  insertCol(atCol) {
    this.colWidths.splice(atCol, 0, DEFAULT_COL_WIDTH);
    const newData = new Map();
    const prefix = `sheet${this.activeSheetIndex}:`;
    for (const [key, value] of this.cellData) {
      if (!key.startsWith(prefix)) { newData.set(key, value); continue; }
      const [, rowStr, colStr] = key.split(':');
      const row = parseInt(rowStr);
      const col = parseInt(colStr);
      if (col >= atCol) {
        newData.set(`${prefix}${row}:${col + 1}`, value);
      } else {
        newData.set(key, value);
      }
    }
    this.cellData = newData;
    this.rebuildDependencies();
    this.renderColumnHeaders();
    this.updateViewport();
  }
  
  deleteCol(atCol) {
    this.colWidths.splice(atCol, 1);
    this.colWidths.push(DEFAULT_COL_WIDTH);
    const newData = new Map();
    const prefix = `sheet${this.activeSheetIndex}:`;
    for (const [key, value] of this.cellData) {
      if (!key.startsWith(prefix)) { newData.set(key, value); continue; }
      const [, rowStr, colStr] = key.split(':');
      const row = parseInt(rowStr);
      const col = parseInt(colStr);
      if (col > atCol) {
        newData.set(`${prefix}${row}:${col - 1}`, value);
      } else if (col < atCol) {
        newData.set(key, value);
      }
    }
    this.cellData = newData;
    this.rebuildDependencies();
    this.renderColumnHeaders();
    this.updateViewport();
  }
  
  // ========== CLIPBOARD ==========
  
  copySelection() {
    const { startRow, startCol, endRow, endCol } = this.getNormalizedSelection();
    const data = [];
    for (let r = startRow; r <= endRow; r++) {
      const row = [];
      for (let c = startCol; c <= endCol; c++) {
        const cell = this.getCell(r, c);
        row.push({ v: cell.v, f: cell.f, fmt: cell.fmt });
      }
      data.push(row);
    }
    this.clipboard = { data, startRow, startCol, endRow, endCol };
    
    // Also copy to system clipboard as text
    const text = data.map(row => row.map(c => c.v || '').join('\t')).join('\n');
    navigator.clipboard.writeText(text).catch(() => {});
  }
  
  pasteSelection() {
    if (!this.clipboard) return;
    
    const { activeRow, activeCol } = this.selection;
    const { data } = this.clipboard;
    
    data.forEach((row, r) => {
      row.forEach((cell, c) => {
        const targetRow = activeRow + r;
        const targetCol = activeCol + c;
        if (targetRow < ROWS && targetCol < COLS) {
          this.setCell(targetRow, targetCol, cell.v, cell.f);
          if (cell.fmt) this.setCellFormat(targetRow, targetCol, cell.fmt);
        }
      });
    });
    
    this.evaluateAll();
    this.updateViewport();
  }
  
  // ========== WORKBOOK ==========
  
  newWorkbook() {
    if (confirm('Create new workbook? Unsaved changes will be lost.')) {
      this.cellData.clear();
      this.dependencies.clear();
      this.dependents.clear();
      this.sheets = [];
      this.createSheet('Sheet1');
    }
  }
}

// ============================================
// GLOBAL FUNCTIONS FOR HTML EVENT HANDLERS
// ============================================

let spreadsheet;

function toggleFormat(type) { spreadsheet.toggleFormat(type); }
function applyFontFamily(font) { spreadsheet.applyFontFamily(font); }
function applyFontSize(size) { spreadsheet.applyFontSize(size); }
function clearSelection() { spreadsheet.clearSelection(); }
function downloadCSV() { spreadsheet.downloadCSV(); }
function handleCSVUpload(e) { spreadsheet.handleCSVUpload(e); }
function newWorkbook() { spreadsheet.newWorkbook(); }

// Initialize
document.addEventListener('DOMContentLoaded', () => {
  spreadsheet = new Spreadsheet();
  
  // Make spreadsheet globally accessible for inline handlers
  window.spreadsheet = spreadsheet;
  
  // Add some demo data
  spreadsheet.setCell(0, 0, 'Product', '');
  spreadsheet.setCell(0, 1, 'Q1', '');
  spreadsheet.setCell(0, 2, 'Q2', '');
  spreadsheet.setCell(0, 3, 'Q3', '');
  spreadsheet.setCell(0, 4, 'Q4', '');
  spreadsheet.setCell(0, 5, 'Total', '');
  
  const products = ['Widget A', 'Widget B', 'Widget C', 'Widget D'];
  products.forEach((p, i) => {
    const row = i + 1;
    spreadsheet.setCell(row, 0, p, '');
    [100, 150, 200, 75].forEach((base, j) => {
      const val = base + Math.floor(Math.random() * 50) * (i + 1);
      spreadsheet.setCell(row, j + 1, val, '');
    });
    spreadsheet.setCell(row, 5, '', `=SUM(B${row+1}:E${row+1})`);
  });
  
  spreadsheet.setCell(5, 0, 'Total', '');
  spreadsheet.setCell(5, 1, '', '=SUM(B2:B5)');
  spreadsheet.setCell(5, 2, '', '=SUM(C2:C5)');
  spreadsheet.setCell(5, 3, '', '=SUM(D2:D5)');
  spreadsheet.setCell(5, 4, '', '=SUM(E2:E5)');
  spreadsheet.setCell(5, 5, '', '=SUM(F2:F5)');
  
  spreadsheet.evaluateAll();
  spreadsheet.updateViewport();
  
  // Add keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      spreadsheet.downloadCSV();
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
      e.preventDefault();
      spreadsheet.toggleFormat('bold');
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'i') {
      e.preventDefault();
      spreadsheet.toggleFormat('italic');
    }
  });
});

function pickColor(color) { spreadsheet.pickColor(color); }
