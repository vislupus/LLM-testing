<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheetClone</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --header-bg: #f3f4f6;
      --header-border: #d1d5db;
      --grid-line: #e5e7eb;
      --selected-bg: rgba(59, 130, 246, 0.08);
      --selected-border: #3b82f6;
      --active-cell-bg: #ffffff;
      --row-header-width: 48px;
      --cell-height: 24px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: #fff; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Toolbar */
    #toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--header-border); background: #fafafa; flex-wrap: wrap; }
    .tool-btn { padding: 4px 8px; border: 1px solid transparent; border-radius: 4px; background: transparent; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    .tool-btn:hover { background: #e5e7eb; border-color: #d1d5db; }
    .tool-btn.active { background: #dbeafe; border-color: #93c5fd; color: #1d4ed8; }
    .tool-sep { width: 1px; height: 22px; background: var(--header-border); margin: 0 2px; }
    .color-swatch { width: 18px; height: 18px; border-radius: 3px; border: 1px solid #d1d5db; }

    /* Formula bar */
    #formula-bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--header-border); background: #fff; }
    #cell-name { width: 72px; padding: 4px 6px; border: 1px solid var(--header-border); border-radius: 4px; font-size: 13px; text-align: center; color: #374151; font-weight: 500; }
    #formula-input { flex: 1; padding: 4px 8px; border: 1px solid var(--header-border); border-radius: 4px; font-size: 13px; outline: none; }
    #formula-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }

    /* Grid area */
    #grid-wrap { flex: 1; overflow: auto; position: relative; background: #fff; }
    #grid {
      display: grid;
      grid-auto-rows: var(--cell-height);
      user-select: none;
      outline: none;
    }
    .grid-cell, .col-header, .row-header, .corner-cell {
      border-right: 1px solid var(--grid-line);
      border-bottom: 1px solid var(--grid-line);
      overflow: hidden;
      white-space: nowrap;
      font-size: 12px;
      line-height: var(--cell-height);
      padding: 0 4px;
      position: relative;
    }
    .corner-cell { background: var(--header-bg); position: sticky; top: 0; left: 0; z-index: 10; }
    .col-header { background: var(--header-bg); text-align: center; color: #4b5563; font-weight: 500; position: sticky; top: 0; z-index: 5; cursor: pointer; }
    .row-header { background: var(--header-bg); text-align: center; color: #4b5563; font-weight: 500; position: sticky; left: 0; z-index: 5; cursor: pointer; }
    .grid-cell { color: #111827; cursor: cell; background: #fff; }
    .grid-cell.text-right { text-align: right; }
    .grid-cell.text-left { text-align: left; }
    .grid-cell.selected { background: var(--selected-bg); }
    .grid-cell.active { outline: 2px solid var(--selected-border); outline-offset: -2px; z-index: 2; }
    .grid-cell.in-range { background: var(--selected-bg); }
    .grid-cell.error { color: #dc2626; }

    .col-resize-handle { position: absolute; right: 0; top: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 6; }
    .col-resize-handle:hover { background: rgba(59,130,246,0.25); }

    /* Inline editor */
    .cell-editor {
      position: absolute;
      border: 2px solid var(--selected-border);
      background: #fff;
      padding: 0 4px;
      font-size: 12px;
      line-height: var(--cell-height);
      outline: none;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    /* Sheet tabs */
    #sheet-tabs { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-top: 1px solid var(--header-border); background: #f9fafb; }
    .sheet-tab { padding: 4px 12px; border: 1px solid transparent; border-radius: 4px 4px 0 0; font-size: 13px; cursor: pointer; color: #4b5563; background: transparent; }
    .sheet-tab:hover { background: #e5e7eb; }
    .sheet-tab.active { background: #fff; border-color: var(--header-border); border-bottom-color: #fff; color: #111827; font-weight: 500; }
    .sheet-actions { margin-left: auto; display: flex; gap: 4px; }
    .icon-btn { padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 14px; }
    .icon-btn:hover { background: #e5e7eb; }

    /* Hidden file input */
    #csv-upload { display: none; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <button class="tool-btn" id="btn-bold" title="Bold"><b>B</b></button>
      <button class="tool-btn" id="btn-italic" title="Italic"><i>I</i></button>
      <span class="tool-sep"></span>
      <label class="tool-btn" title="Background color">
        <input type="color" id="bg-color" value="#ffffff" style="display:none" />
        <span class="color-swatch" id="bg-swatch" style="background:#ffffff"></span> Fill
      </label>
      <span class="tool-sep"></span>
      <button class="tool-btn" id="btn-clear">Clear</button>
      <span class="tool-sep"></span>
      <button class="tool-btn" id="btn-download">Download CSV</button>
      <button class="tool-btn" id="btn-upload">Upload CSV</button>
      <input type="file" id="csv-upload" accept=".csv,text/csv" />
    </div>

    <!-- Formula bar -->
    <div id="formula-bar">
      <div id="cell-name">A1</div>
      <input type="text" id="formula-input" spellcheck="false" autocomplete="off" />
    </div>

    <!-- Grid -->
    <div id="grid-wrap">
      <div id="grid" tabindex="0"></div>
    </div>

    <!-- Sheet tabs -->
    <div id="sheet-tabs">
      <div id="tabs-list"></div>
      <div class="sheet-actions">
        <button class="icon-btn" id="btn-add-sheet" title="Add sheet">+</button>
      </div>
    </div>
  </div>

  <script>
    /* ======================== Config ======================== */
    const ROWS = 100;
    const COLS = 40;
    const DEFAULT_COL_WIDTH = 90;
    const ROW_HEADER_WIDTH = 48;
    const CELL_HEIGHT = 24;

    /* ======================== State ======================== */
    const workbook = {
      sheets: [createSheet('Sheet1')],
      activeSheetId: 'sheet1'
    };

    let selection = { startRef: 'A1', endRef: 'A1' };
    let activeRef = 'A1';
    let isEditing = false;
    let editorEl = null;
    let formulaBarFocused = false;
    let resizeCol = null;
    let resizeStartX = 0;
    let resizeStartWidth = 0;
    let formulaRangeInsertStart = null;
    let formulaRangeInsertEnd = null;
    let isFormulaRangeSelecting = false;

    /* ======================== Helpers ======================== */
    function createSheet(name, id) {
      id = id || 'sheet' + Date.now() + Math.random().toString(36).slice(2, 7);
      return {
        id,
        name,
        cells: {},
        colWidths: {}
      };
    }

    function getActiveSheet() {
      return workbook.sheets.find(s => s.id === workbook.activeSheetId);
    }

    function getCell(sheet, ref) {
      return sheet.cells[ref] || null;
    }

    function getOrCreateCell(sheet, ref) {
      if (!sheet.cells[ref]) {
        sheet.cells[ref] = { raw: '', value: '', refs: new Set(), deps: new Set(), bold: false, italic: false, bgColor: null };
      }
      return sheet.cells[ref];
    }

    function colToNum(col) {
      let n = 0;
      for (let i = 0; i < col.length; i++) {
        n = n * 26 + (col.charCodeAt(i) - 64);
      }
      return n;
    }

    function numToCol(n) {
      let col = '';
      while (n > 0) {
        const rem = (n - 1) % 26;
        col = String.fromCharCode(65 + rem) + col;
        n = Math.floor((n - 1) / 26);
      }
      return col;
    }

    function parseRef(ref) {
      const m = ref.match(/^([A-Z]+)(\d+)$/);
      if (!m) return null;
      return { col: m[1], row: parseInt(m[2], 10), colNum: colToNum(m[1]) };
    }

    function getRef(colNum, row) {
      return numToCol(colNum) + row;
    }

    function getCellDisplayValue(sheet, ref) {
      const cell = getCell(sheet, ref);
      if (!cell) return '';
      if (cell.value === null || cell.value === undefined) return '';
      if (typeof cell.value === 'number') return cell.value;
      return String(cell.value);
    }

    function parseValue(raw) {
      if (raw === '' || raw === null || raw === undefined) return '';
      if (typeof raw !== 'string') return raw;
      const trimmed = raw.trim();
      if (trimmed === '') return '';
      const num = Number(trimmed);
      if (!isNaN(num) && trimmed !== '') return num;
      return raw;
    }

    function rangeToRefs(start, end) {
      const s = parseRef(start);
      const e = parseRef(end);
      if (!s || !e) return [];
      const c1 = Math.min(s.colNum, e.colNum);
      const c2 = Math.max(s.colNum, e.colNum);
      const r1 = Math.min(s.row, e.row);
      const r2 = Math.max(s.row, e.row);
      const refs = [];
      for (let r = r1; r <= r2; r++) {
        for (let c = c1; c <= c2; c++) {
          refs.push(getRef(c, r));
        }
      }
      return refs;
    }

    function rangeAddress(start, end) {
      return start + ':' + end;
    }

    function getSelectionRange() {
      const s = parseRef(selection.startRef);
      const e = parseRef(selection.endRef);
      if (!s || !e) return { c1: 1, c2: 1, r1: 1, r2: 1 };
      return {
        c1: Math.min(s.colNum, e.colNum),
        c2: Math.max(s.colNum, e.colNum),
        r1: Math.min(s.row, e.row),
        r2: Math.max(s.row, e.row)
      };
    }

    function isInSelection(ref) {
      const p = parseRef(ref);
      if (!p) return false;
      const rng = getSelectionRange();
      return p.colNum >= rng.c1 && p.colNum <= rng.c2 && p.row >= rng.r1 && p.row <= rng.r2;
    }

    /* ======================== Formula Parser / Evaluator ======================== */
    const evaluating = new Set();

    function tokenize(formula) {
      const tokens = [];
      let i = 0;
      while (i < formula.length) {
        const ch = formula[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (ch === '+' || ch === '-' || ch === '*' || ch === '/' || ch === '(' || ch === ')' || ch === ':' || ch === ',') {
          tokens.push({ type: 'op', value: ch });
          i++;
          continue;
        }
        if (/\d/.test(ch) || ch === '.') {
          let j = i;
          while (j < formula.length && (/\d/.test(formula[j]) || formula[j] === '.')) j++;
          tokens.push({ type: 'number', value: parseFloat(formula.slice(i, j)) });
          i = j;
          continue;
        }
        if (/[A-Z]/i.test(ch)) {
          let j = i;
          while (j < formula.length && /[A-Z]/i.test(formula[j])) j++;
          const word = formula.slice(i, j).toUpperCase();
          if (/^[A-Z]+$/.test(word) && j < formula.length && /\d/.test(formula[j])) {
            // Cell reference
            let k = j;
            while (k < formula.length && /\d/.test(formula[k])) k++;
            tokens.push({ type: 'cell', value: word + formula.slice(j, k) });
            i = k;
          } else {
            tokens.push({ type: 'func', value: word });
            i = j;
          }
          continue;
        }
        throw new Error('Unexpected character: ' + ch);
      }
      tokens.push({ type: 'eof' });
      return tokens;
    }

    function parseFormula(formula) {
      const tokens = tokenize(formula);
      let pos = 0;
      const peek = () => tokens[pos];
      const next = () => tokens[pos++];

      function parseExpr() {
        let node = parseTerm();
        while (true) {
          const t = peek();
          if (t.value === '+' || t.value === '-') {
            next();
            node = { type: 'op', op: t.value, left: node, right: parseTerm() };
          } else break;
        }
        return node;
      }

      function parseTerm() {
        let node = parseFactor();
        while (true) {
          const t = peek();
          if (t.value === '*' || t.value === '/') {
            next();
            node = { type: 'op', op: t.value, left: node, right: parseFactor() };
          } else break;
        }
        return node;
      }

      function parseFactor() {
        const t = peek();
        if (t.value === '-') {
          next();
          return { type: 'unary', op: '-', operand: parseFactor() };
        }
        if (t.value === '(') {
          next();
          const node = parseExpr();
          if (peek().value !== ')') throw new Error('Expected )');
          next();
          return node;
        }
        if (t.type === 'number') { next(); return { type: 'number', value: t.value }; }
        if (t.type === 'cell') {
          next();
          const ref = t.value;
          if (peek().value === ':') {
            next();
            const end = peek();
            if (end.type !== 'cell') throw new Error('Expected cell after :');
            next();
            return { type: 'range', start: ref, end: end.value };
          }
          return { type: 'cell', ref };
        }
        if (t.type === 'func') {
          next();
          const name = t.value;
          if (peek().value !== '(') throw new Error('Expected (');
          next();
          const args = [];
          if (peek().value !== ')') {
            args.push(parseExpr());
            while (peek().value === ',') {
              next();
              args.push(parseExpr());
            }
          }
          if (peek().value !== ')') throw new Error('Expected )');
          next();
          return { type: 'func', name, args };
        }
        throw new Error('Unexpected token');
      }

      const ast = parseExpr();
      if (peek().type !== 'eof') throw new Error('Unexpected token at end');
      return ast;
    }

    function evaluate(ast, sheetId, currentRef) {
      const sheet = getActiveSheet();
      const currentCell = getOrCreateCell(sheet, currentRef);

      function evalNode(node) {
        switch (node.type) {
          case 'number': return node.value;
          case 'cell': {
            const ref = node.ref;
            currentCell.refs.add(ref);
            const other = getCell(sheet, ref);
            if (!other) return 0;
            other.deps.add(currentRef);
            if (evaluating.has(ref)) throw new Error('#CIRCULAR');
            const v = other.value;
            if (typeof v === 'number') return v;
            if (v === '' || v === null || v === undefined) return 0;
            const n = Number(v);
            if (!isNaN(n)) return n;
            throw new Error('#VALUE');
          }
          case 'range': {
            const refs = rangeToRefs(node.start, node.end);
            refs.forEach(r => {
              currentCell.refs.add(r);
              const other = getCell(sheet, r);
              if (other) other.deps.add(currentRef);
            });
            return refs.map(r => {
              const c = getCell(sheet, r);
              if (!c) return 0;
              if (evaluating.has(r)) throw new Error('#CIRCULAR');
              const v = c.value;
              if (typeof v === 'number') return v;
              if (v === '' || v === null || v === undefined) return 0;
              const n = Number(v);
              return isNaN(n) ? 0 : n;
            });
          }
          case 'op': {
            const l = evalNode(node.left);
            const r = evalNode(node.right);
            if (Array.isArray(l) || Array.isArray(r)) throw new Error('#VALUE');
            switch (node.op) {
              case '+': return l + r;
              case '-': return l - r;
              case '*': return l * r;
              case '/': return r === 0 ? '#DIV/0' : l / r;
            }
          }
          case 'unary': {
            const v = evalNode(node.operand);
            if (Array.isArray(v)) throw new Error('#VALUE');
            return -v;
          }
          case 'func': {
            const vals = [];
            node.args.forEach(arg => {
              const v = evalNode(arg);
              if (Array.isArray(v)) vals.push(...v);
              else vals.push(v);
            });
            const nums = vals.filter(v => typeof v === 'number' && !isNaN(v));
            switch (node.name) {
              case 'SUM': return nums.reduce((a, b) => a + b, 0);
              case 'AVERAGE': return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
              case 'MIN': return nums.length ? Math.min(...nums) : 0;
              case 'MAX': return nums.length ? Math.max(...nums) : 0;
              default: throw new Error('#NAME?');
            }
          }
        }
        return 0;
      }

      evaluating.add(currentRef);
      try {
        const result = evalNode(ast);
        return Array.isArray(result) ? '#VALUE' : result;
      } finally {
        evaluating.delete(currentRef);
      }
    }

    function computeCell(sheet, ref) {
      const cell = getCell(sheet, ref);
      if (!cell) return;

      // Clear old dependency links
      cell.refs.forEach(r => {
        const other = getCell(sheet, r);
        if (other) other.deps.delete(ref);
      });
      cell.refs.clear();

      if (typeof cell.raw === 'string' && cell.raw.startsWith('=')) {
        try {
          const ast = parseFormula(cell.raw.slice(1));
          const val = evaluate(ast, sheet.id, ref);
          cell.value = val;
        } catch (e) {
          cell.value = e.message && e.message.startsWith('#') ? e.message : '#ERR';
        }
      } else {
        cell.value = parseValue(cell.raw);
      }
    }

    function setCellRaw(sheetId, ref, raw) {
      const sheet = workbook.sheets.find(s => s.id === sheetId);
      const cell = getOrCreateCell(sheet, ref);
      cell.raw = raw;

      // Compute this cell
      computeCell(sheet, ref);

      // Recalculate dependents (breadth-first)
      const queue = Array.from(cell.deps);
      const visited = new Set();
      while (queue.length) {
        const depRef = queue.shift();
        if (visited.has(depRef)) continue;
        visited.add(depRef);
        const depCell = getCell(sheet, depRef);
        if (!depCell) continue;
        computeCell(sheet, depRef);
        depCell.deps.forEach(d => queue.push(d));
      }
    }

    /* ======================== UI Rendering ======================== */
    const gridEl = document.getElementById('grid');
    const formulaInput = document.getElementById('formula-input');
    const cellNameEl = document.getElementById('cell-name');
    const tabsListEl = document.getElementById('tabs-list');

    function buildGrid() {
      gridEl.innerHTML = '';
      const sheet = getActiveSheet();
      const cols = [];
      cols.push(ROW_HEADER_WIDTH + 'px');
      for (let c = 1; c <= COLS; c++) {
        const colLetter = numToCol(c);
        cols.push((sheet.colWidths[colLetter] || DEFAULT_COL_WIDTH) + 'px');
      }
      gridEl.style.gridTemplateColumns = cols.join(' ');

      // Corner cell
      const corner = document.createElement('div');
      corner.className = 'corner-cell';
      gridEl.appendChild(corner);

      // Column headers
      for (let c = 1; c <= COLS; c++) {
        const col = numToCol(c);
        const th = document.createElement('div');
        th.className = 'col-header';
        th.dataset.col = col;
        th.textContent = col;
        const handle = document.createElement('div');
        handle.className = 'col-resize-handle';
        handle.dataset.resizeCol = col;
        th.appendChild(handle);
        gridEl.appendChild(th);
      }

      // Rows
      for (let r = 1; r <= ROWS; r++) {
        const rh = document.createElement('div');
        rh.className = 'row-header';
        rh.textContent = r;
        gridEl.appendChild(rh);

        for (let c = 1; c <= COLS; c++) {
          const ref = getRef(c, r);
          const cell = document.createElement('div');
          cell.className = 'grid-cell';
          cell.dataset.ref = ref;
          updateCellDisplay(cell, sheet, ref);
          gridEl.appendChild(cell);
        }
      }

      updateSelectionClasses();
    }

    function updateCellDisplay(el, sheet, ref) {
      const cell = getCell(sheet, ref);
      el.innerHTML = '';
      el.className = 'grid-cell';
      if (!cell) return;

      const val = getCellDisplayValue(sheet, ref);
      el.textContent = val;
      if (typeof cell.value === 'number' && typeof cell.raw === 'string' && !cell.raw.startsWith('=')) {
        el.classList.add('text-right');
      } else {
        el.classList.add('text-left');
      }
      if (String(val).startsWith('#')) el.classList.add('error');
      if (cell.bold) el.style.fontWeight = 'bold';
      if (cell.italic) el.style.fontStyle = 'italic';
      if (cell.bgColor) el.style.backgroundColor = cell.bgColor;
    }

    function refreshCell(ref) {
      const sheet = getActiveSheet();
      const el = gridEl.querySelector(`[data-ref="${ref}"]`);
      if (el) updateCellDisplay(el, sheet, ref);
    }

    function updateSelectionClasses() {
      gridEl.querySelectorAll('.grid-cell').forEach(el => {
        el.classList.remove('active', 'selected', 'in-range');
        const ref = el.dataset.ref;
        if (ref === activeRef) el.classList.add('active');
        if (isInSelection(ref)) {
          if (ref !== activeRef) el.classList.add('in-range');
        }
      });
      cellNameEl.textContent = activeRef;
    }

    function refreshAll() {
      const sheet = getActiveSheet();
      gridEl.querySelectorAll('.grid-cell').forEach(el => {
        updateCellDisplay(el, sheet, el.dataset.ref);
      });
      updateSelectionClasses();
      updateFormulaBar();
      renderTabs();
    }

    function updateFormulaBar() {
      const sheet = getActiveSheet();
      const cell = getCell(sheet, activeRef);
      if (!cell) {
        formulaInput.value = '';
        return;
      }
      if (isEditing) return;
      formulaInput.value = cell.raw;
    }

    function updateColumnWidth(col, width) {
      const sheet = getActiveSheet();
      sheet.colWidths[col] = width;
      const cols = [ROW_HEADER_WIDTH + 'px'];
      for (let c = 1; c <= COLS; c++) {
        const letter = numToCol(c);
        cols.push((sheet.colWidths[letter] || DEFAULT_COL_WIDTH) + 'px');
      }
      gridEl.style.gridTemplateColumns = cols.join(' ');
    }

    /* ======================== Selection / Editing ======================== */
    function setSelection(startRef, endRef, updateFormula = true) {
      activeRef = startRef;
      selection = { startRef, endRef };
      updateSelectionClasses();
      if (updateFormula && !isEditing) updateFormulaBar();
      gridEl.focus();
    }

    function startEdit(ref, initialValue) {
      if (isEditing) return;
      const sheet = getActiveSheet();
      const cell = getOrCreateCell(sheet, ref);
      activeRef = ref;
      selection = { startRef: ref, endRef: ref };
      updateSelectionClasses();

      const target = gridEl.querySelector(`[data-ref="${ref}"]`);
      if (!target) return;

      isEditing = true;
      formulaInput.value = initialValue !== undefined ? initialValue : cell.raw;
      formulaInput.focus();

      const rect = target.getBoundingClientRect();
      const wrapRect = document.getElementById('grid-wrap').getBoundingClientRect();
      editorEl = document.createElement('input');
      editorEl.type = 'text';
      editorEl.className = 'cell-editor';
      editorEl.value = formulaInput.value;
      editorEl.style.left = (rect.left - wrapRect.left + document.getElementById('grid-wrap').scrollLeft) + 'px';
      editorEl.style.top = (rect.top - wrapRect.top + document.getElementById('grid-wrap').scrollTop) + 'px';
      editorEl.style.width = rect.width + 'px';
      editorEl.style.height = rect.height + 'px';
      editorEl.style.lineHeight = rect.height + 'px';
      document.getElementById('grid-wrap').appendChild(editorEl);
      editorEl.focus();
      editorEl.select();

      const sync = () => { formulaInput.value = editorEl.value; };
      editorEl.addEventListener('input', sync);

      editorEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commitEdit(true); }
        if (e.key === 'Escape') { cancelEdit(); }
        if (e.key === 'Tab') { e.preventDefault(); commitEdit(true, true); }
      });
    }

    function commitEdit(moveDown = false, moveRight = false) {
      if (!isEditing || !editorEl) return;
      const value = editorEl.value;
      editorEl.remove();
      editorEl = null;
      isEditing = false;

      const sheet = getActiveSheet();
      setCellRaw(sheet.id, activeRef, value);
      refreshCell(activeRef);

      // Also refresh dependents via compute done in setCellRaw
      refreshAll();

      if (moveDown) moveSelection(0, 1);
      else if (moveRight) moveSelection(1, 0);
      else updateFormulaBar();
    }

    function cancelEdit() {
      if (!isEditing || !editorEl) return;
      editorEl.remove();
      editorEl = null;
      isEditing = false;
      updateFormulaBar();
    }

    function moveSelection(dc, dr, extend = false) {
      const p = parseRef(activeRef);
      if (!p) return;
      const newC = Math.max(1, Math.min(COLS, p.colNum + dc));
      const newR = Math.max(1, Math.min(ROWS, p.row + dr));
      const newRef = getRef(newC, newR);
      if (extend) {
        setSelection(selection.startRef, newRef);
      } else {
        setSelection(newRef, newRef);
      }
      scrollIntoView(newRef);
    }

    function scrollIntoView(ref) {
      const el = gridEl.querySelector(`[data-ref="${ref}"]`);
      if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }

    function insertRefIntoFormula(ref, isRangeStart = false) {
      const text = formulaInput.value;
      let start, end;
      if (isFormulaRangeSelecting && formulaRangeInsertStart !== null) {
        start = formulaRangeInsertStart;
        end = formulaRangeInsertEnd;
      } else {
        start = formulaInput.selectionStart;
        end = formulaInput.selectionEnd;
      }
      const before = text.slice(0, start);
      const after = text.slice(end);
      let insert = ref;
      if (!isFormulaRangeSelecting && before.length > 0 && /[A-Z0-9\)]$/.test(before)) {
        insert = '+' + ref;
      }
      formulaInput.value = before + insert + after;
      formulaRangeInsertEnd = start + insert.length;
      formulaInput.selectionStart = formulaInput.selectionEnd = formulaRangeInsertEnd;
      formulaInput.focus();
    }

    function updateFormulaRangeRef(startRef, endRef) {
      if (!isFormulaRangeSelecting || formulaRangeInsertStart === null) return;
      const addr = startRef === endRef ? startRef : rangeAddress(startRef, endRef);
      const text = formulaInput.value;
      const before = text.slice(0, formulaRangeInsertStart);
      const after = text.slice(formulaRangeInsertEnd);
      formulaInput.value = before + addr + after;
      formulaRangeInsertEnd = formulaRangeInsertStart + addr.length;
      formulaInput.selectionStart = formulaInput.selectionEnd = formulaRangeInsertEnd;
      formulaInput.focus();
    }

    /* ======================== Mouse / Keyboard Events ======================== */
    let isDragging = false;
    let dragStartRef = null;

    // Commit inline edit when clicking outside the editor
    window.addEventListener('mousedown', e => {
      if (isEditing && editorEl && e.target !== editorEl && e.target !== formulaInput) {
        commitEdit();
      }
    }, true);

    window.addEventListener('mouseup', () => {
      resizeCol = null;
      isDragging = false;
      dragStartRef = null;
      isFormulaRangeSelecting = false;
    });

    gridEl.addEventListener('mousedown', e => {
      const cell = e.target.closest('.grid-cell');
      const header = e.target.closest('.col-header');
      const handle = e.target.closest('.col-resize-handle');

      if (handle) {
        e.preventDefault();
        resizeCol = handle.dataset.resizeCol;
        resizeStartX = e.clientX;
        const sheet = getActiveSheet();
        resizeStartWidth = sheet.colWidths[resizeCol] || DEFAULT_COL_WIDTH;
        return;
      }

      if (header) {
        // Select entire column
        const col = header.dataset.col;
        const c = colToNum(col);
        setSelection(getRef(c, 1), getRef(c, ROWS));
        return;
      }

      const rowHeader = e.target.closest('.row-header');
      if (rowHeader) {
        const row = parseInt(rowHeader.textContent, 10);
        setSelection(getRef(1, row), getRef(COLS, row));
        return;
      }

      if (cell) {
        const ref = cell.dataset.ref;
        if (formulaBarFocused && formulaInput.value.startsWith('=')) {
          // Start formula reference selection
          isFormulaRangeSelecting = true;
          formulaRangeInsertStart = formulaInput.selectionStart;
          insertRefIntoFormula(ref, true);
          dragStartRef = ref;
          setSelection(ref, ref, false);
          return;
        }
        if (e.shiftKey) {
          setSelection(activeRef, ref);
          return;
        }
        dragStartRef = ref;
        isDragging = true;
        setSelection(ref, ref);
        if (e.detail === 2) {
          startEdit(ref);
        }
      }
    });

    gridEl.addEventListener('mousemove', e => {
      if (resizeCol) {
        const delta = e.clientX - resizeStartX;
        const newWidth = Math.max(40, resizeStartWidth + delta);
        updateColumnWidth(resizeCol, newWidth);
        return;
      }
      const cell = e.target.closest('.grid-cell');
      if (!cell) return;

      if (isFormulaRangeSelecting && dragStartRef) {
        const endRef = cell.dataset.ref;
        setSelection(dragStartRef, endRef, false);
        updateFormulaRangeRef(dragStartRef, endRef);
        return;
      }

      if (!isDragging || !dragStartRef) return;
      setSelection(dragStartRef, cell.dataset.ref);
    });




      const text = formulaInput.value;
      let start, end;
      if (isFormulaRangeSelecting && formulaRangeInsertStart !== null) {
        start = formulaRangeInsertStart;
        end = formulaRangeInsertEnd;
      } else {
        start = formulaInput.selectionStart;
        end = formulaInput.selectionEnd;
      }
      const before = text.slice(0, start);
      const after = text.slice(end);
      let insert = ref;
      if (!isFormulaRangeSelecting && before.length > 0 && /[A-Z0-9\)]$/.test(before)) {
        insert = '+' + ref;
      }
      formulaInput.value = before + insert + after;
      formulaRangeInsertEnd = start + insert.length;
      formulaInput.selectionStart = formulaInput.selectionEnd = formulaRangeInsertEnd;
      formulaInput.focus();
    }

    function updateFormulaRangeRef(startRef, endRef) {
      if (!isFormulaRangeSelecting || formulaRangeInsertStart === null) return;
      const addr = startRef === endRef ? startRef : rangeAddress(startRef, endRef);
      const text = formulaInput.value;
      const before = text.slice(0, formulaRangeInsertStart);
      const after = text.slice(formulaRangeInsertEnd);
      formulaInput.value = before + addr + after;
      formulaRangeInsertEnd = formulaRangeInsertStart + addr.length;
      formulaInput.selectionStart = formulaInput.selectionEnd = formulaRangeInsertEnd;
      formulaInput.focus();
    }

    gridEl.addEventListener('keydown', e => {
      if (isEditing) return;

      if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        applyToSelection((sheet, ref) => {
          delete sheet.cells[ref];
        });
        refreshAll();
        return;
      }

      if (e.key.startsWith('Arrow')) {
        e.preventDefault();
        const dc = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
        const dr = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
        moveSelection(dc, dr, e.shiftKey);
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        moveSelection(0, 1);
        return;
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        moveSelection(e.shiftKey ? -1 : 1, 0);
        return;
      }
      if (e.key === 'F2') {
        e.preventDefault();
        startEdit(activeRef);
        return;
      }

      // Typing starts edit
      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        startEdit(activeRef, e.key);
      }
    });

    formulaInput.addEventListener('focus', () => { formulaBarFocused = true; });
    formulaInput.addEventListener('blur', () => { setTimeout(() => { formulaBarFocused = false; }, 100); });

    formulaInput.addEventListener('input', () => {
      if (editorEl) editorEl.value = formulaInput.value;
    });

    formulaInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (isEditing && editorEl) {
          editorEl.remove();
          editorEl = null;
          isEditing = false;
        }
        const sheet = getActiveSheet();
        setCellRaw(sheet.id, activeRef, formulaInput.value);
        refreshAll();
        gridEl.focus();
      }
      if (e.key === 'Escape') {
        if (isEditing && editorEl) {
          editorEl.remove();
          editorEl = null;
          isEditing = false;
        }
        updateFormulaBar();
        gridEl.focus();
      }
    });

    /* ======================== Toolbar Actions ======================== */
    function applyToSelection(fn) {
      const sheet = getActiveSheet();
      const rng = getSelectionRange();
      for (let r = rng.r1; r <= rng.r2; r++) {
        for (let c = rng.c1; c <= rng.c2; c++) {
          const ref = getRef(c, r);
          fn(sheet, ref);
        }
      }
    }

    document.getElementById('btn-bold').addEventListener('click', () => {
      const btn = document.getElementById('btn-bold');
      const anyBold = applyToSelectionBool((sheet, ref) => {
        const cell = getCell(sheet, ref);
        return cell && cell.bold;
      });
      const newBold = !anyBold;
      applyToSelection((sheet, ref) => {
        getOrCreateCell(sheet, ref).bold = newBold;
      });
      btn.classList.toggle('active', newBold);
      refreshAll();
    });

    document.getElementById('btn-italic').addEventListener('click', () => {
      const btn = document.getElementById('btn-italic');
      const anyItalic = applyToSelectionBool((sheet, ref) => {
        const cell = getCell(sheet, ref);
        return cell && cell.italic;
      });
      const newItalic = !anyItalic;
      applyToSelection((sheet, ref) => {
        getOrCreateCell(sheet, ref).italic = newItalic;
      });
      btn.classList.toggle('active', newItalic);
      refreshAll();
    });

    function applyToSelectionBool(fn) {
      const sheet = getActiveSheet();
      const rng = getSelectionRange();
      for (let r = rng.r1; r <= rng.r2; r++) {
        for (let c = rng.c1; c <= rng.c2; c++) {
          if (fn(sheet, getRef(c, r))) return true;
        }
      }
      return false;
    }

    document.getElementById('bg-color').addEventListener('input', e => {
      const color = e.target.value;
      document.getElementById('bg-swatch').style.backgroundColor = color;
      applyToSelection((sheet, ref) => {
        getOrCreateCell(sheet, ref).bgColor = color;
      });
      refreshAll();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      applyToSelection((sheet, ref) => {
        delete sheet.cells[ref];
      });
      refreshAll();
    });

    document.getElementById('btn-download').addEventListener('click', downloadCSV);
    document.getElementById('btn-upload').addEventListener('click', () => document.getElementById('csv-upload').click());
    document.getElementById('csv-upload').addEventListener('change', uploadCSV);

    function downloadCSV() {
      const sheet = getActiveSheet();
      let csv = '';
      for (let r = 1; r <= ROWS; r++) {
        const row = [];
        let rowHasData = false;
        for (let c = 1; c <= COLS; c++) {
          const ref = getRef(c, r);
          const cell = getCell(sheet, ref);
          const val = cell ? String(cell.raw).replace(/"/g, '""') : '';
          if (val) rowHasData = true;
          row.push('"' + val + '"');
        }
        if (rowHasData) csv += row.join(',') + '\n';
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = sheet.name + '.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function uploadCSV(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        const text = evt.target.result;
        parseCSV(text);
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    function parseCSV(text) {
      const sheet = getActiveSheet();
      // Clear sheet
      sheet.cells = {};

      function parseLine(line) {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (inQuotes) {
            if (ch === '"') {
              if (line[i + 1] === '"') { cur += '"'; i++; }
              else { inQuotes = false; }
            } else {
              cur += ch;
            }
          } else {
            if (ch === '"') { inQuotes = true; }
            else if (ch === ',') { result.push(cur); cur = ''; }
            else { cur += ch; }
          }
        }
        result.push(cur);
        return result;
      }

      const lines = text.split(/\r?\n/);
      lines.forEach((line, rIdx) => {
        if (rIdx >= ROWS) return;
        const row = rIdx + 1;
        const cells = parseLine(line);
        cells.forEach((val, cIdx) => {
          if (cIdx >= COLS) return;
          const col = cIdx + 1;
          const ref = getRef(col, row);
          if (val !== '') {
            const cell = getOrCreateCell(sheet, ref);
            cell.raw = val;
          }
        });
      });

      // Recompute all with iterative passes
      for (let pass = 0; pass < 10; pass++) {
        Object.keys(sheet.cells).forEach(ref => computeCell(sheet, ref));
      }
      refreshAll();
    }

    /* ======================== Sheet Tabs ======================== */
    function renderTabs() {
      tabsListEl.innerHTML = '';
      workbook.sheets.forEach(sheet => {
        const tab = document.createElement('div');
        tab.className = 'sheet-tab' + (sheet.id === workbook.activeSheetId ? ' active' : '');
        tab.textContent = sheet.name;
        tab.addEventListener('click', () => {
          workbook.activeSheetId = sheet.id;
          buildGrid();
          refreshAll();
        });
        tab.addEventListener('contextmenu', e => {
          e.preventDefault();
          const action = prompt('Rename or Delete? (r/d)', 'r');
          if (action === 'd') {
            if (workbook.sheets.length <= 1) {
              alert('Cannot delete the only sheet.');
              return;
            }
            workbook.sheets = workbook.sheets.filter(s => s.id !== sheet.id);
            if (workbook.activeSheetId === sheet.id) {
              workbook.activeSheetId = workbook.sheets[0].id;
            }
          } else if (action === 'r') {
            const name = prompt('Sheet name:', sheet.name);
            if (name) sheet.name = name;
          }
          renderTabs();
        });
        tabsListEl.appendChild(tab);
      });
    }

    document.getElementById('btn-add-sheet').addEventListener('click', () => {
      const name = prompt('Sheet name:', 'Sheet' + (workbook.sheets.length + 1));
      if (!name) return;
      const sheet = createSheet(name);
      workbook.sheets.push(sheet);
      workbook.activeSheetId = sheet.id;
      buildGrid();
      refreshAll();
    });

    /* ======================== Init ======================== */
    // Sample data
    const sampleSheet = getActiveSheet();
    sampleSheet.cells['A1'] = { raw: 'Product', value: 'Product', refs: new Set(), deps: new Set(), bold: true, italic: false, bgColor: '#e5e7eb' };
    sampleSheet.cells['B1'] = { raw: 'Qty', value: 'Qty', refs: new Set(), deps: new Set(), bold: true, italic: false, bgColor: '#e5e7eb' };
    sampleSheet.cells['C1'] = { raw: 'Price', value: 'Price', refs: new Set(), deps: new Set(), bold: true, italic: false, bgColor: '#e5e7eb' };
    sampleSheet.cells['D1'] = { raw: 'Total', value: 'Total', refs: new Set(), deps: new Set(), bold: true, italic: false, bgColor: '#e5e7eb' };

    sampleSheet.cells['A2'] = { raw: 'Apples', value: 'Apples', refs: new Set(), deps: new Set() };
    sampleSheet.cells['B2'] = { raw: '10', value: 10, refs: new Set(), deps: new Set() };
    sampleSheet.cells['C2'] = { raw: '1.5', value: 1.5, refs: new Set(), deps: new Set() };
    sampleSheet.cells['D2'] = { raw: '=B2*C2', value: 15, refs: new Set(['B2','C2']), deps: new Set() };
    sampleSheet.cells['B2'].deps.add('D2');
    sampleSheet.cells['C2'].deps.add('D2');

    sampleSheet.cells['A3'] = { raw: 'Bananas', value: 'Bananas', refs: new Set(), deps: new Set() };
    sampleSheet.cells['B3'] = { raw: '5', value: 5, refs: new Set(), deps: new Set() };
    sampleSheet.cells['C3'] = { raw: '2', value: 2, refs: new Set(), deps: new Set() };
    sampleSheet.cells['D3'] = { raw: '=B3*C3', value: 10, refs: new Set(['B3','C3']), deps: new Set() };
    sampleSheet.cells['B3'].deps.add('D3');
    sampleSheet.cells['C3'].deps.add('D3');

    sampleSheet.cells['B5'] = { raw: '=SUM(B2:B10)', value: 15, refs: new Set(), deps: new Set() };

    // Compute all cells to build dependency graph
    Object.keys(sampleSheet.cells).forEach(ref => computeCell(sampleSheet, ref));

    buildGrid();
    refreshAll();
    gridEl.focus();
