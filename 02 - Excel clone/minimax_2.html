<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel - Spreadsheet Clone</title>
    <style>
        :root {
            --border-color: #c0c0c0;
            --header-bg: #f8f9fa;
            --select-bg: #217346; /* Excel Green */
            --grid-line: #e1e1e1;
            --toolbar-height: 40px;
            --formula-height: 30px;
            --sheet-height: 30px;
        }

        * { box-sizing: border-box; outline: none; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
        }

        /* --- Toolbar --- */
        #toolbar {
            height: var(--toolbar-height);
            background: #f3f2f1;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
        }
        .btn {
            background: transparent;
            border: 1px solid transparent;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .btn:hover { background: #e1dfdd; }
        .btn:active { background: #d0d0d0; }
        .separator { width: 1px; height: 20px; background: #ccc; margin: 0 5px; }

        /* --- Formula Bar --- */
        #formula-bar {
            height: var(--formula-height);
            display: flex;
            align-items: center;
            padding: 0 5px;
            border-bottom: 1px solid var(--border-color);
            background: #f3f2f1;
        }
        #selected-cell-indicator {
            width: 60px;
            font-weight: bold;
            color: #555;
            text-align: center;
            border-right: 1px solid var(--border-color);
            margin-right: 5px;
            user-select: none;
        }
        #formula-input {
            flex: 1;
            border: 1px solid #a0a0a0;
            padding: 2px 5px;
            height: 24px;
            font-family: monospace;
        }
        #formula-input:focus { border: 2px solid var(--select-bg); }

        /* --- Main Grid Area --- */
        #grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background: white;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        /* Headers */
        th {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: normal;
            font-size: 12px;
            color: #444;
            user-select: none;
        }
        #row-headers th {
            left: 0;
            z-index: 20; /* Top-left corner needs highest */
            background: var(--header-bg);
        }
        
        /* Cells */
        td {
            border: 1px solid var(--grid-line);
            min-width: 80px;
            height: 21px;
            padding: 0 3px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            vertical-align: middle;
            cursor: cell;
        }

        /* Selection Styles */
        .selected { border: 2px solid var(--select-bg) !important; z-index: 5; }
        .selected-tl { background: var(--select-bg); color: white; } /* Top-left of range */
        .selected-range { background: #e5f3ee; } /* Range fill */
        
        /* Scrollbar tweaks */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #ccc; }
        ::-webkit-scrollbar-track { background: #f0f0f0; }

        /* --- Sheet Tabs --- */
        #sheet-bar {
            height: var(--sheet-height);
            background: #f3f2f1;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding-left: 5px;
        }
        .sheet-tab {
            background: white;
            border: 1px solid #ccc;
            padding: 2px 10px;
            margin-right: 2px;
            cursor: pointer;
            font-size: 12px;
            border-bottom: none;
            border-radius: 3px 3px 0 0;
        }
        .sheet-tab.active {
            background: var(--select-bg);
            color: white;
            border-color: var(--select-bg);
        }
        .sheet-add { font-weight: bold; cursor: pointer; padding: 0 5px; }

    </style>
</head>
<body>

    <!-- Toolbar -->
    <div id="toolbar">
        <button class="btn" onclick="format('bold')" title="Bold"><b>B</b></button>
        <button class="btn" onclick="format('italic')" title="Italic"><i>I</i></button>
        <div class="separator"></div>
        <button class="btn" onclick="format('color')" title="Text Color">Color</button>
        <button class="btn" onclick="format('bgcolor')" title="Background Color">Fill</button>
        <div class="separator"></div>
        <button class="btn" onclick="clearContents()" title="Clear Contents">Clear</button>
        <div class="separator"></div>
        <button class="btn" onclick="downloadCSV()">CSV ⇩</button>
        <button class="btn" onclick="triggerUpload()">CSV ⇧</button>
        <input type="file" id="csv-upload" style="display:none" accept=".csv" onchange="uploadCSV(this)">
    </div>

    <!-- Formula Bar -->
    <div id="formula-bar">
        <div id="selected-cell-indicator">A1</div>
        <input type="text" id="formula-input" placeholder="fx">
    </div>

    <!-- Grid -->
    <div id="grid-container">
        <table id="sheet">
            <thead>
                <tr id="header-row">
                    <th id="corner" style="width:30px; z-index:30;"></th>
                    <!-- Headers generated by JS -->
                </tr>
            </thead>
            <tbody id="grid-body">
                <!-- Rows generated by JS -->
            </tbody>
        </table>
    </div>

    <!-- Sheet Tabs -->
    <div id="sheet-bar">
        <!-- Tabs generated by JS -->
        <div class="sheet-add" onclick="addSheet()" title="Add Sheet">+</div>
    </div>

<script>
/**
 * WebExcel Core Logic
 */

// --- Configuration ---
const COLS = 26; // A-Z
const ROWS = 100;
const COL_LABELS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

// --- State ---
let sheets = [
    { name: "Sheet1", data: {} } // Data stored as: { "A1": { value: "", computed: "", style: {} } }
];
let activeSheetIndex = 0;
let selectedCell = null; // { r: 0, c: 0 }
let selectionStart = null; // { r: 0, c: 0 }
let isDragging = false;
let isEditing = false;
let formulaMode = false; // True if typing in formula bar

// --- Initialization ---
const table = document.getElementById('sheet');
const headerRow = document.getElementById('header-row');
const gridBody = document.getElementById('grid-body');
const cellIndicator = document.getElementById('selected-cell-indicator');
const formulaInput = document.getElementById('formula-input');
const sheetBar = document.getElementById('sheet-bar');

function init() {
    createHeaders();
    createGrid();
    renderSheetTabs();
    selectCell(0, 0); // A1
}

// --- DOM Generation ---
function createHeaders() {
    // Corner
    // Cols
    for (let c = 0; c < COLS; c++) {
        const th = document.createElement('th');
        th.textContent = COL_LABELS[c];
        th.dataset.col = c;
        // Resize logic could go here
        headerRow.appendChild(th);
    }
}

function createGrid() {
    gridBody.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        const tr = document.createElement('tr');
        
        // Row Number
        const th = document.createElement('th');
        th.textContent = r + 1;
        tr.appendChild(th);

        // Cells
        for (let c = 0; c < COLS; c++) {
            const td = document.createElement('td');
            td.dataset.r = r;
            td.dataset.c = c;
            td.id = `cell-${r}-${c}`;
            
            // Events
            td.onmousedown = (e) => handleCellMouseDown(e, r, c);
            td.onmouseover = (e) => handleCellMouseOver(e, r, c);
            td.ondblclick = (e) => startEditing(r, c);
            
            tr.appendChild(td);
        }
        gridBody.appendChild(tr);
    }
}

// --- Interaction Logic ---

document.body.onmouseup = () => {
    isDragging = false;
};

// Handle cell click / drag
function handleCellMouseDown(e, r, c) {
    if (formulaMode) {
        // Insert reference into formula bar
        insertRef(r, c);
        return;
    }

    isDragging = true;
    endEditing(); // Stop editing if clicking elsewhere
    selectCell(r, c);
}

function handleCellMouseOver(e, r, c) {
    if (isDragging) {
        selectRange(r, c);
    }
}

function selectCell(r, c) {
    // Single selection logic
    if (selectedCell) {
        // clear previous
        document.querySelectorAll('.selected').forEach(el => {
            el.classList.remove('selected', 'selected-tl', 'selected-range');
        });
    }

    selectedCell = { r, c };
    const td = getCellEl(r, c);
    if (td) {
        td.classList.add('selected');
        cellIndicator.textContent = getCellId(r, c);
        
        // Update Formula Bar with raw value if not editing
        if (!isEditing) {
            const data = getActiveCellData();
            formulaInput.value = data ? data.value : "";
        }
    }
}

function selectRange(rEnd, cEnd) {
    if (!selectionStart) selectionStart = { ...selectedCell };
    
    const rStart = selectionStart.r;
    const cStart = selectionStart.c;

    // Min/Max
    const rMin = Math.min(rStart, rEnd);
    const rMax = Math.max(rStart, rEnd);
    const cMin = Math.min(cStart, cEnd);
    const cMax = Math.max(cStart, cEnd);

    // Clear old range selection visuals
    document.querySelectorAll('.selected-range').forEach(el => el.classList.remove('selected-range'));
    document.querySelectorAll('.selected-tl').forEach(el => el.classList.remove('selected-tl'));

    for (let r = rMin; r <= rMax; r++) {
        for (let c = cMin; c <= cMax; c++) {
            const td = getCellEl(r, c);
            if (r === rMin && c === cMin) td.classList.add('selected-tl');
            else td.classList.add('selected-range');
        }
    }
    selectedCell = { r: rEnd, c: cEnd }; // Current focus
}

// --- Keyboard Navigation ---
document.addEventListener('keydown', (e) => {
    if (isEditing) {
        if (e.key === 'Enter') { endEditing(true); moveSelection(1, 0); }
        if (e.key === 'Tab') { e.preventDefault(); endEditing(true); moveSelection(0, 1); }
        if (e.key === 'Escape') { endEditing(false); }
        return;
    }

    if (!selectedCell) return;

    if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        const dr = e.key === 'Enter' ? 1 : 0;
        const dc = e.key === 'Enter' ? 0 : 1;
        moveSelection(dr, dc);
    } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
        let dr = 0, dc = 0;
        if (e.key === 'Up') dr = -1;
        if (e.key === 'Down') dr = 1;
        if (e.key === 'Left') dc = -1;
        if (e.key === 'Right') dc = 1;
        moveSelection(dr, dc);
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
        clearContents();
    } else if (e.key === 'F2') {
        startEditing(selectedCell.r, selectedCell.c);
    } else if (e.key === 'c' && e.ctrlKey) { /* Copy handled by browser */ }
    else if (e.key === 'v' && e.ctrlKey) { /* Paste handled by browser */ }
    else {
        // Start typing numbers or text
        if (e.key.length === 1 && !e.ctrlKey && !e.altKey) {
            startEditing(selectedCell.r, selectedCell.c, e.key);
        }
    }
});

function moveSelection(dr, dc) {
    let nr = selectedCell.r + dr;
    let nc = selectedCell.c + dc;
    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
        selectCell(nr, nc);
    }
}

// --- Data Management ---

function getCellId(r, c) {
    return COL_LABELS[c] + (r + 1);
}

function getCellEl(r, c) {
    return document.getElementById(`cell-${r}-${c}`);
}

function getActiveSheet() {
    return sheets[activeSheetIndex];
}

function getCellData(r, c) {
    const id = getCellId(r, c);
    return getActiveSheet().data[id] || { value: "", computed: "", style: {} };
}

function getActiveCellData() {
    return getCellData(selectedCell.r, selectedCell.c);
}

function updateCellValue(r, c, val) {
    const id = getCellId(r, c);
    const sheet = getActiveSheet();
    
    if (!sheet.data[id]) sheet.data[id] = { value: "", computed: "", style: {} };
    
    sheet.data[id].value = val;
    
    // Recalculate
    calculateSheet();
    
    // Update visual if this cell is visible
    const td = getCellEl(r, c);
    if (td) td.textContent = sheet.data[id].computed;
}

function updateCellStyle(prop, val) {
    if (!selectedCell) return;
    const id = getCellId(selectedCell.r, selectedCell.c);
    const sheet = getActiveSheet();
    if (!sheet.data[id]) sheet.data[id] = { value: "", computed: "", style: {} };
    
    const style = sheet.data[id].style;
    style[prop] = val;

    const td = getCellEl(selectedCell.r, selectedCell.c);
    applyStyleToElement(td, style);
}

// --- Formula Engine ---

function calculateSheet() {
    const sheet = getActiveSheet();
    const ids = Object.keys(sheet.data);
    
    // Simple dependency resolution (Iterative approach for simplicity)
    // For a production app, a DAG (Directed Acyclic Graph) is needed.
    // Here we loop a few times to resolve chains. 
    // Limit to 5 passes to prevent infinite loops.
    
    // 1. Clear computed
    ids.forEach(id => sheet.data[id].computed = sheet.data[id].value);

    let changed = true;
    let passes = 0;
    while(changed && passes < 10) {
        changed = false;
        ids.forEach(id => {
            const cell = sheet.data[id];
            if (cell.value.toString().startsWith('=')) {
                const oldComputed = cell.computed;
                cell.computed = evaluateFormula(cell.value.substring(1), id);
                if (cell.computed !== oldComputed) changed = true;
            } else {
                cell.computed = cell.value;
            }
        });
        passes++;
    }

    // Re-render grid content
    renderSheetData();
}

function evaluateFormula(formula, selfId) {
    try {
        // 1. Handle Functions: SUM(A1:A5), AVG(...)
        // Regex to find function calls
        formula = formula.toUpperCase();
        
        // Process Ranges -> Values
        // Match A1:A10
        const rangeRegex = /([A-Z]+)(\d+):([A-Z]+)(\d+)/g;
        
        // We need to replace ranges with arrays of values or direct values
        // This is tricky with eval, so we replace RANGE(c1:c2) with a specific array literal [val1, val2]
        
        let parsedFormula = formula.replace(rangeRegex, (match, c1, r1, c2, r2) => {
            let values = [];
            let startC = c1.charCodeAt(0);
            let endC = c2.charCodeAt(0);
            let startR = parseInt(r1);
            let endR = parseInt(r2);
            
            for(let c=startC; c<=endC; c++) {
                for(let r=startR; r<=endR; r++) {
                    const cellId = String.fromCharCode(c) + r;
                    const val = getCellValueById(cellId);
                    values.push(isNaN(Number(val)) ? 0 : Number(val));
                }
            }
            return "[" + values.join(",") + "]";
        });

        // Process Single References: A1 -> value
        // Don't replace inside brackets []
        parsedFormula = parsedFormula.replace(/\[.*?\]/g, (match) => match) // Skip arrays
                      .replace(/[A-Z]+\d+/g, (match) => {
                          const val = getCellValueById(match);
                          return isNaN(Number(val)) ? `"${val}"` : Number(val);
                      });

        // Define helper functions available in scope
        const SUM = (arr) => arr.reduce((a, b) => a + b, 0);
        const AVERAGE = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
        const MIN = (arr) => Math.min(...arr);
        const MAX = (arr) => Math.max(...arr);
        const IF = (cond, t, f) => cond ? t : f;

        // Use Function constructor for math
        // Safe enough for local client-side only
        const result = new Function('return ' + parsedFormula)();
        return result;

    } catch (e) {
        return "#ERR";
    }
}

function getCellValueById(id) {
    const sheet = getActiveSheet();
    const cell = sheet.data[id];
    if (!cell) return 0;
    if (cell.value.toString().startsWith('=')) return cell.computed;
    return cell.value;
}

function renderSheetData() {
    const sheet = getActiveSheet();
    for (const id in sheet.data) {
        const cell = sheet.data[id];
        // Parse ID to coords
        const r = parseInt(id.substring(1)) - 1;
        const c = COL_LABELS.indexOf(id.charAt(0));
        
        const el = getCellEl(r, c);
        if (el) {
            el.textContent = cell.computed;
            applyStyleToElement(el, cell.style);
        }
    }
}

function applyStyleToElement(el, style) {
    if (!style) return;
    if (style.bold) el.style.fontWeight = 'bold'; else el.style.fontWeight = 'normal';
    if (style.italic) el.style.fontStyle = 'italic'; else el.style.fontStyle = 'normal';
    if (style.color) el.style.color = style.color;
    if (style.bgcolor) el.style.backgroundColor = style.bgcolor;
}

// --- Editing & Formula Bar ---

function startEditing(r, c, initChar) {
    isEditing = true;
    const data = getCellData(r, c);
    const input = document.createElement('input');
    input.type = 'text';
    input.value = data ? data.value : "";
    if (initChar) input.value = initChar;
    
    const td = getCellEl(r, c);
    td.textContent = "";
    td.appendChild(input);
    input.focus();
    
    // Save on blur
    input.onblur = () => endEditing(true);
    input.onkeydown = (e) => {
        if (e.key === 'Enter') input.blur();
    };
}

function endEditing(save) {
    if (!isEditing) return;
    isEditing = false;
    
    const td = getCellEl(selectedCell.r, selectedCell.c);
    const input = td.querySelector('input');
    const val = input ? input.value : "";
    
    // Remove input
    if(input) input.remove();
    
    if (save) {
        updateCellValue(selectedCell.r, selectedCell.c, val);
        formulaInput.value = val;
    } else {
        // Revert
        const data = getActiveCellData();
        td.textContent = data ? data.computed : "";
    }
}

// --- Formula Bar Interaction ---

formulaInput.addEventListener('focus', () => {
    formulaMode = true;
    // If a cell is selected, show value
    if(selectedCell) {
        const data = getActiveCellData();
        formulaInput.value = data ? data.value : "";
    }
});

formulaInput.addEventListener('blur', () => {
    // Small delay to allow click events on cells to register first
    setTimeout(() => { formulaMode = false; }, 100);
});

formulaInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        if (selectedCell) {
            updateCellValue(selectedCell.r, selectedCell.c, formulaInput.value);
            selectCell(selectedCell.r, selectedCell.c); // Refresh UI
        }
        formulaInput.blur();
    }
});

function insertRef(r, c) {
    const id = getCellId(r, c);
    const input = formulaInput;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const text = input.value;
    
    // Check if Shift is held for range? Simplified: if text has ":" inside, assume range. 
    // For this simple version, just insert ID.
    
    const newText = text.substring(0, start) + id + text.substring(end);
    input.value = newText;
    input.selectionStart = input.selectionEnd = start + id.length;
    input.focus();
}

// --- Toolbar Actions ---

function format(type) {
    if (!selectedCell) return;
    const id = getCellId(selectedCell.r, selectedCell.c);
    const sheet = getActiveSheet();
    let cell = sheet.data[id];
    if(!cell) cell = {value:"", computed:"", style:{}};
    
    if (type === 'bold') {
        cell.style.bold = !cell.style.bold;
    } else if (type === 'italic') {
        cell.style.italic = !cell.style.italic;
    } else if (type === 'color') {
        const c = prompt("Enter Hex Color (e.g. #FF0000):", "#000000");
        if(c) cell.style.color = c;
    } else if (type === 'bgcolor') {
        const c = prompt("Enter Hex Color (e.g. #FFFF00):", "#FFFF00");
        if(c) cell.style.bgcolor = c;
    }
    
    sheet.data[id] = cell;
    applyStyleToElement(getCellEl(selectedCell.r, selectedCell.c), cell.style);
}

function clearContents() {
    if(selectedCell) updateCellValue(selectedCell.r, selectedCell.c, "");
}

// --- Sheet Management ---

function renderSheetTabs() {
    // Remove old tabs
    const oldTabs = document.querySelectorAll('.sheet-tab');
    oldTabs.forEach(t => t.remove());

    sheets.forEach((s, i) => {
        const tab = document.createElement('div');
        tab.className = `sheet-tab ${i === activeSheetIndex ? 'active' : ''}`;
        tab.textContent = s.name;
        tab.onclick = () => switchSheet(i);
        
        // Double click to rename
        tab.ondblclick = (e) => {
            e.stopPropagation();
            const newName = prompt("Rename Sheet:", s.name);
            if(newName) {
                s.name = newName;
                renderSheetTabs();
            }
        };

        sheetBar.insertBefore(tab, document.querySelector('.sheet-add'));
    });
}

function switchSheet(index) {
    activeSheetIndex = index;
    renderSheetTabs();
    renderSheetData();
    // Clear selection
    document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
    selectCell(0,0);
}

function addSheet() {
    const name = "Sheet" + (sheets.length + 1);
    sheets.push({ name: name, data: {} });
    switchSheet(sheets.length - 1);
}

// --- CSV I/O ---

function downloadCSV() {
    const sheet = getActiveSheet();
    let csv = [];
    
    // Simple max bound detection could go here, iterating whole grid for now
    for(let r=0; r<ROWS; r++) {
        let row = [];
        for(let c=0; c<COLS; c++) {
            const id = getCellId(r,c);
            const val = sheet.data[id] ? sheet.data[id].computed : "";
            // Escape quotes and wrap in quotes if contains comma
            let cellStr = String(val).replace(/"/g, '""');
            if(cellStr.includes(',')) cellStr = `"${cellStr}"`;
            row.push(cellStr);
        }
        // Only add row if not empty
        if(row.some(c => c !== "")) csv.push(row.join(","));
    }
    
    const blob = new Blob([csv.join("\n")], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sheets[activeSheetIndex].name + ".csv";
    a.click();
}

function triggerUpload() {
    document.getElementById('csv-upload').click();
}

function uploadCSV(input) {
    const file = input.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        const text = e.target.result;
        const rows = text.split("\n");
        
        const sheet = getActiveSheet();
        sheet.data = {}; // Clear
        
        rows.forEach((rowStr, rIndex) => {
            // Simple CSV parser (doesn't handle quoted commas perfectly, but good enough for demo)
            const cols = rowStr.split(",");
            cols.forEach((val, cIndex) => {
                if(cIndex < COLS && rIndex < ROWS) {
                    const id = getCellId(rIndex, cIndex);
                    const cleanVal = val.replace(/^"|"$/g, '').replace(/""/g, '"'); // unquote
                    if(cleanVal) {
                        sheet.data[id] = { value: cleanVal, computed: cleanVal, style: {} };
                    }
                }
            });
        });
        
        calculateSheet();
    };
    reader.readAsText(file);
    input.value = ""; // Reset
}

// Run
init();

</script>
</body>
</html>
