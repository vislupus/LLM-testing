<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Clone</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#e8e8e8;display:flex;flex-direction:column;height:100vh;overflow:hidden;user-select:none;font-size:13px;color:#1a1a1a}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:#f3f3f3;border-bottom:1px solid #d0d0d0;flex-shrink:0;flex-wrap:wrap;min-height:36px}
.toolbar button{background:#f3f3f3;border:1px solid transparent;border-radius:3px;padding:4px 8px;cursor:pointer;font-size:12px;color:#333;min-width:28px;height:26px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.toolbar button:hover{background:#e0e0e0;border-color:#c0c0c0}
.toolbar button.active{background:#d0d8e8;border-color:#4a86c8;color:#1a5276}
.toolbar button:active{background:#c8c8c8}
.toolbar .sep{width:1px;height:22px;background:#d0d0d0;margin:0 3px}
.toolbar label{font-size:12px;color:#555;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.toolbar label input[type="color"]{width:26px;height:20px;border:1px solid #aaa;border-radius:2px;padding:1px;cursor:pointer;background:#fff}

/* Formula Bar */
.formula-bar{display:flex;align-items:center;border-bottom:1px solid #d0d0d0;background:#fff;flex-shrink:0;height:28px}
.cell-ref-box{width:60px;text-align:center;font-weight:600;font-size:12px;border-right:1px solid #d0d0d0;height:100%;display:flex;align-items:center;justify-content:center;background:#f8f8f8;flex-shrink:0;color:#333}
.formula-bar .sep{width:1px;height:20px;background:#d0d0d0;flex-shrink:0}
.formula-prefix{padding:0 6px;font-weight:700;color:#3b7a3b;font-size:14px;flex-shrink:0}
#formulaInput{flex:1;border:none;outline:none;font-size:13px;padding:2px 6px;font-family:'Segoe UI',Arial,sans-serif;height:100%;background:transparent}

/* Spreadsheet */
.spreadsheet{display:flex;flex-direction:column;flex:1;overflow:hidden;background:#fff}
.grid-container{display:flex;flex:1;overflow:hidden;position:relative}

/* Corner */
.corner{width:46px;min-width:46px;height:24px;background:#f0f0f0;border-right:1px solid #c0c0c0;border-bottom:1px solid #c0c0c0;z-index:12;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999}

/* Column Headers */
.col-header-container{display:flex;flex:1;overflow:hidden;background:#f0f0f0}
.col-header{display:flex;height:24px;flex-shrink:0}
.ch-cell{display:flex;align-items:center;justify-content:center;font-weight:500;font-size:11px;color:#444;border-right:1px solid #c0c0c0;border-bottom:1px solid #c0c0c0;background:#f0f0f0;position:relative;flex-shrink:0;height:24px}
.ch-cell.active{background:#4a86c8;color:#fff;font-weight:700}
.col-resize-handle{position:absolute;right:-2px;top:0;width:5px;height:100%;cursor:col-resize;z-index:5}
.col-resize-handle:hover,.col-resize-handle.active{background:rgba(74,134,200,.5)}
.col-header-spacer{flex-shrink:0;border-bottom:1px solid #c0c0c0}

/* Row Header Container */
.row-header-container{display:flex;flex-direction:column;width:46px;min-width:46px;overflow:hidden;border-right:1px solid #c0c0c0;flex-shrink:0}
.row-header{display:flex;flex-direction:column;flex-shrink:0}
.rh-cell{width:46px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:11px;color:#444;border-right:1px solid #c0c0c0;border-bottom:1px solid #e0e0e0;background:#f0f0f0;flex-shrink:0;box-sizing:border-box}
.rh-cell.active{background:#4a86c8;color:#fff;font-weight:700}

/* Grid Body */
.grid-body-container{display:flex;flex:1;overflow:hidden;position:relative}
.grid-body{overflow:auto;flex:1;position:relative;-webkit-overflow-scrolling:touch}
.grid-body::-webkit-scrollbar{width:14px;height:14px}
.grid-body::-webkit-scrollbar-track{background:#f1f1f1}
.grid-body::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:7px;border:3px solid #f1f1f1}
.grid-body::-webkit-scrollbar-thumb:hover{background:#a1a1a1}
.grid-body::-webkit-scrollbar-corner{background:#f1f1f1}
.grid-row{display:flex;flex-shrink:0}
.grid-row.hidden{display:none}
.cell{display:flex;align-items:center;padding:0 4px;border-right:1px solid #e8e8e8;border-bottom:1px solid #e8e8e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;flex-shrink:0;height:24px;cursor:cell;box-sizing:border-box;position:relative}
.cell:focus{outline:none}
.cell.editing{outline:2px solid #4a86c8;outline-offset:-1px;z-index:10;background:#fff!important;overflow:visible;white-space:normal}
.cell.bold{font-weight:700}
.cell.italic{font-style:italic}
.cell.error{color:#c0392b;font-size:11px}

/* Selection Box */
.selection-box{position:absolute;border:2px solid #1a73e8;pointer-events:none;z-index:8;box-sizing:border-box;background:rgba(26,115,232,.08)}
.selection-fill{position:absolute;border:2px solid #1a73e8;pointer-events:none;z-index:8;box-sizing:border-box;background:rgba(26,115,232,.08)}
.selection-handle{position:absolute;right:-4px;bottom:-4px;width:8px;height:8px;background:#1a73e8;border:1px solid #fff;z-index:9;cursor:crosshair;pointer-events:all}

/* Sheet Tabs */
.sheet-tabs-bar{display:flex;align-items:center;border-top:1px solid #c0c0c0;background:#e8e8e8;flex-shrink:0;height:32px;overflow-x:auto}
.sheet-tabs-bar::-webkit-scrollbar{height:4px}
.sheet-tabs-bar::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:2px}
.sheet-tabs{display:flex;align-items:center;gap:0;height:100%;padding:3px 0 0 4px}
.sheet-tab{padding:4px 14px;cursor:pointer;font-size:12px;color:#555;background:#ddd;border:1px solid #c0c0c0;border-bottom:none;border-radius:4px 4px 0 0;margin-right:2px;white-space:nowrap;position:relative;transition:background .15s;height:24px;display:flex;align-items:center}
.sheet-tab:hover{background:#e8e8e8}
.sheet-tab.active{background:#fff;color:#1a5276;font-weight:600;border-bottom:1px solid #fff;margin-bottom:-1px;z-index:2}
#addSheetBtn{background:none;border:1px dashed #aaa;border-radius:3px;padding:2px 8px;cursor:pointer;font-size:16px;color:#666;line-height:1;margin-left:4px;height:22px;display:flex;align-items:center}
#addSheetBtn:hover{background:#e0e0e0;color:#333}

/* Context Menu */
.context-menu{position:fixed;background:#fff;border:1px solid #c0c0c0;box-shadow:2px 2px 6px rgba(0,0,0,.2);z-index:1000;min-width:140px;border-radius:3px;padding:3px 0}
.context-menu-item{padding:6px 16px;cursor:pointer;font-size:12px;color:#333;transition:background .1s}
.context-menu-item:hover{background:#e8f0fe;color:#1a5276}

/* Hidden file input */
#csvUpload{display:none}

/* Resize state */
body.resizing{cursor:col-resize!important;user-select:none!important}
body.resizing *{cursor:col-resize!important}
</style>
</head>
<body>

<div class="toolbar">
    <button id="boldBtn" title="Bold (Ctrl+B)"><b>B</b></button>
    <button id="italicBtn" title="Italic (Ctrl+I)"><i>I</i></button>
    <div class="sep"></div>
    <label title="Background Color">
        🎨 <input type="color" id="bgColorPicker" value="#ffffff">
    </label>
    <div class="sep"></div>
    <button id="clearBtn" title="Clear Contents">✕ Clear</button>
    <div class="sep"></div>
    <button id="downloadBtn" title="Download Sheet as CSV">⬇ CSV</button>
    <button id="uploadBtn" title="Upload CSV to Sheet">⬆ CSV</button>
    <input type="file" id="csvUpload" accept=".csv,text/csv">
</div>

<div class="formula-bar">
    <div class="cell-ref-box" id="cellRefBox">A1</div>
    <div class="sep"></div>
    <span class="formula-prefix">fx</span>
    <input type="text" id="formulaInput" spellcheck="false" autocomplete="off" placeholder="Enter a value or formula...">
</div>

<div class="spreadsheet">
    <div class="grid-container" id="gridContainer">
        <div class="corner">◆</div>
        <div class="col-header-container" id="colHeaderContainer">
            <div class="col-header" id="colHeader"></div>
            <div class="col-header-spacer" id="colHeaderSpacer"></div>
        </div>
        <div class="row-header-container" id="rowHeaderContainer">
            <div class="row-header" id="rowHeader"></div>
        </div>
        <div class="grid-body-container" id="gridBodyContainer">
            <div class="grid-body" id="gridBody"></div>
        </div>
    </div>
</div>

<div class="sheet-tabs-bar">
    <div class="sheet-tabs" id="sheetTabs"></div>
    <button id="addSheetBtn" title="Add Sheet">+</button>
</div>

<div class="context-menu" id="contextMenu" style="display:none"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════════
const COLS = 26, ROWS = 100, DEFAULT_COL_WIDTH = 80, DEFAULT_ROW_HEIGHT = 24;

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
const sheets = {};
let currentSheet = null;

let selection = { row: 0, col: 0 };
let rangeSel = { startRow: 0, startCol: 0, endRow: 0, endCol: 0, active: false };
let isEditing = false, editingInBar = false, editingInCell = false;
let isFormulaDragRef = false;
let isRangeDrag = false;
let scrollRAF = null;

// ═══════════════════════════════════════════════════════════════
// DOM REFERENCES
// ═══════════════════════════════════════════════════════════════
const formulaInput = document.getElementById('formulaInput');
const cellRefBox = document.getElementById('cellRefBox');
const gridBody = document.getElementById('gridBody');
const colHeader = document.getElementById('colHeader');
const rowHeader = document.getElementById('rowHeader');
const gridContainer = document.getElementById('gridContainer');
const gridBodyContainer = document.getElementById('gridBodyContainer');
const colHeaderContainer = document.getElementById('colHeaderContainer');
const rowHeaderContainer = document.getElementById('rowHeaderContainer');
const colHeaderSpacer = document.getElementById('colHeaderSpacer');
const sheetTabs = document.getElementById('sheetTabs');
const addSheetBtn = document.getElementById('addSheetBtn');
const contextMenu = document.getElementById('contextMenu');
const boldBtn = document.getElementById('boldBtn');
const italicBtn = document.getElementById('italicBtn');
const bgColorPicker = document.getElementById('bgColorPicker');
const clearBtn = document.getElementById('clearBtn');
const downloadBtn = document.getElementById('downloadBtn');
const uploadBtn = document.getElementById('uploadBtn');
const csvUpload = document.getElementById('csvUpload');

// ═══════════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════════
function colName(c) { return String.fromCharCode(65 + c); }
function cellId(r, c) { return colName(c) + (r + 1); }
function cellPos(id) {
    const m = id.match(/^([A-Z]+)(\d+)$/);
    if (!m) return null;
    return { col: m[1].charCodeAt(0) - 65, row: parseInt(m[2]) - 1 };
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function normalizeRange(r1, c1, r2, c2) {
    return {
        sr: Math.min(r1, r2), er: Math.max(r1, r2),
        sc: Math.min(c1, c2), ec: Math.max(c1, c2)
    };
}
function toNum(v) {
    if (v == null || v === '') return 0;
    const n = Number(v);
    return isNaN(n) ? 0 : n;
}
function isBlank(v) { return v == null || v === ''; }

// ═══════════════════════════════════════════════════════════════
// SHEET & CELL DATA
// ═══════════════════════════════════════════════════════════════
function getSheet() { return sheets[currentSheet]; }
function initCell(r, c) {
    const s = getSheet();
    const k = cellId(r, c);
    if (!s.data[k]) {
        s.data[k] = { raw: '', formula: null, value: '', display: '', bold: false, italic: false, bgColor: '' };
    }
    return s.data[k];
}
function getCell(s, r, c) { return s.data[cellId(r, c)]; }

function initDefaultSheet() {
    const name = 'Sheet1';
    sheets[name] = { name, data: {}, colWidths: [], gridCells: [], gridEl: null, built: false };
    for (let c = 0; c < COLS; c++) sheets[name].colWidths.push(DEFAULT_COL_WIDTH);
}

// ═══════════════════════════════════════════════════════════════
// APP INIT
// ═══════════════════════════════════════════════════════════════
function initApp() {
    initDefaultSheet();
    currentSheet = 'Sheet1';
    renderSheetTabs();
    switchSheet('Sheet1');
    setupScrollSync();
    setupGridEvents();
    setupFormulaBar();
    setupToolbar();
    setupKeyboard();
    setupSheetTabEvents();
    detectScrollbarWidth();
}

function detectScrollbarWidth() {
    requestAnimationFrame(() => {
        const sw = gridBody.offsetWidth - gridBody.clientWidth;
        colHeaderSpacer.style.width = sw + 'px';
        colHeaderSpacer.style.minWidth = sw + 'px';
    });
}

// ═══════════════════════════════════════════════════════════════
// SCROLL SYNC
// ═══════════════════════════════════════════════════════════════
function setupScrollSync() {
    gridBody.addEventListener('scroll', () => {
        if (scrollRAF) cancelAnimationFrame(scrollRAF);
        scrollRAF = requestAnimationFrame(() => {
            colHeader.style.transform = `translateX(${-gridBody.scrollLeft}px)`;
            rowHeader.style.transform = `translateY(${-gridBody.scrollTop}px)`;
            updateSelectionBox();
            scrollRAF = null;
        });
    });
}

// ═══════════════════════════════════════════════════════════════
// GRID BUILD
// ═══════════════════════════════════════════════════════════════
function ensureGridBuilt(sheetName) {
    const s = sheets[sheetName];
    if (s.built) return;
    buildGridBody(s);
    s.built = true;
}

function buildGridHeaders() {
    colHeader.innerHTML = '';
    const s = getSheet();
    for (let c = 0; c < COLS; c++) {
        const ch = document.createElement('div');
        ch.className = 'ch-cell';
        ch.textContent = colName(c);
        ch.dataset.col = c;
        ch.style.width = s.colWidths[c] + 'px';
        const handle = document.createElement('div');
        handle.className = 'col-resize-handle';
        handle.dataset.col = c;
        ch.appendChild(handle);
        colHeader.appendChild(ch);
    }
    colHeader.style.width = s.colWidths.reduce((a, b) => a + b, 0) + 'px';
    rowHeader.innerHTML = '';
    for (let r = 0; r < ROWS; r++) {
        const rh = document.createElement('div');
        rh.className = 'rh-cell';
        rh.textContent = r + 1;
        rh.style.height = DEFAULT_ROW_HEIGHT + 'px';
        rowHeader.appendChild(rh);
    }
}

function buildGridBody(s) {
    const el = document.createElement('div');
    el.className = 'grid-body';
    el.dataset.sheet = s.name;
    s.gridCells = [];
    for (let r = 0; r < ROWS; r++) {
        const row = document.createElement('div');
        row.className = 'grid-row';
        s.gridCells[r] = [];
        for (let c = 0; c < COLS; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.style.width = s.colWidths[c] + 'px';
            cell.style.height = DEFAULT_ROW_HEIGHT + 'px';
            row.appendChild(cell);
            s.gridCells[r][c] = cell;
        }
        el.appendChild(row);
    }
    el.style.width = s.colWidths.reduce((a, b) => a + b, 0) + 'px';
    el.addEventListener('scroll', () => {
        if (scrollRAF) cancelAnimationFrame(scrollRAF);
        scrollRAF = requestAnimationFrame(() => {
            colHeader.style.transform = `translateX(${-el.scrollLeft}px)`;
            rowHeader.style.transform = `translateY(${-el.scrollTop}px)`;
            updateSelectionBox();
            scrollRAF = null;
        });
    });
    s.gridEl = el;
    gridBodyContainer.appendChild(el);
    el.style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
// SHEET SWITCHING
// ═══════════════════════════════════════════════════════════════
function switchSheet(name) {
    if (isEditing) commitEdit();
    const old = currentSheet;
    currentSheet = name;
    sheetTabs.querySelectorAll('.sheet-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.sheet === name);
    });
    Object.keys(sheets).forEach(sn => {
        const s = sheets[sn];
        if (s.gridEl) s.gridEl.style.display = sn === name ? 'block' : 'none';
    });
    ensureGridBuilt(name);
    getSheet().gridEl.style.display = 'block';
    gridBody = getSheet().gridEl;
    buildGridHeaders();
    selectCell(0, 0);
    requestAnimationFrame(() => detectScrollbarWidth());
}

function renderSheetTabs() {
    sheetTabs.innerHTML = '';
    Object.keys(sheets).forEach(name => {
        const tab = document.createElement('div');
        tab.className = 'sheet-tab' + (name === currentSheet ? ' active' : '');
        tab.textContent = name;
        tab.dataset.sheet = name;
        sheetTabs.appendChild(tab);
    });
}

function addSheet() {
    let name = prompt('Sheet name:', 'Sheet' + (Object.keys(sheets).length + 1));
    if (!name) return;
    name = name.trim().substring(0, 31).replace(/[\\/:*?\[\]]/g, '_');
    if (!name || sheets[name]) { alert('Invalid or duplicate name.'); return; }
    sheets[name] = { name, data: {}, colWidths: [], gridCells: [], gridEl: null, built: false };
    for (let c = 0; c < COLS; c++) sheets[name].colWidths.push(DEFAULT_COL_WIDTH);
    renderSheetTabs();
    switchSheet(name);
}

// ═══════════════════════════════════════════════════════════════
// FORMULA EVALUATION
// ═══════════════════════════════════════════════════════════════
function expandRange(id) {
    const p = id.indexOf(':');
    if (p === -1) return [id];
    const s1 = cellPos(id.substring(0, p)), s2 = cellPos(id.substring(p + 1));
    if (!s1 || !s2) return [id];
    const n = normalizeRange(s1.row, s1.col, s2.row, s2.col), out = [];
    for (let r = n.sr; r <= n.er; r++)
        for (let c = n.sc; c <= n.ec; c++)
            out.push(cellId(r, c));
    return out;
}

function resolveRef(id, s) {
    const ids = expandRange(id);
    return ids.map(k => { const d = s.data[k]; return d ? d.value : ''; });
}

function evalFormula(formula, s) {
    const fns = ['SUM', 'AVERAGE', 'MIN', 'MAX', 'ABS', 'ROUND', 'IF', 'COUNT', 'COUNTA', 'SQRT', 'POWER', 'MOD', 'INT'];
    let expr = formula;
    // Replace function calls
    const replaceFns = () => {
        fns.forEach(fn => {
            const re = new RegExp(fn + '\\(([^()]+)\\)', 'gi');
            while (re.test(expr)) {
                expr = expr.replace(re, (m, args) => {
                    const vals = args.split(',').flatMap(a => {
                        a = a.trim();
                        if (/^[A-Z]+\d+[A-Z]*\d*$/i.test(a) || /^[A-Z]+\d+:[A-Z]+\d+$/i.test(a)) {
                            return resolveRef(a.toUpperCase(), s).map(Number);
                        }
                        return [Number(a)];
                    }).filter(v => !isNaN(v));
                    switch (fn) {
                        case 'SUM': return vals.reduce((a, b) => a + b, 0);
                        case 'AVERAGE': return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
                        case 'MIN': return vals.length ? Math.min(...vals) : 0;
                        case 'MAX': return vals.length ? Math.max(...vals) : 0;
                        case 'COUNT': return vals.length;
                        case 'COUNTA': return vals.length;
                        case 'ABS': return Math.abs(vals[0] || 0);
                        case 'SQRT': return Math.sqrt(vals[0] || 0);
                        case 'INT': return Math.floor(vals[0] || 0);
                        case 'ROUND': return Math.round(vals[0] || 0);
                        case 'POWER': return Math.pow(vals[0] || 0, vals[1] || 0);
                        case 'MOD': return (vals[1] || 0) !== 0 ? (vals[0] || 0) % (vals[1]) : '#DIV/0!';
                        case 'IF': {
                            const ar = args.split(',');
                            return evalFormula(ar[0].trim(), s) ? evalFormula(ar[1].trim(), s) : evalFormula(ar[2].trim(), s);
                        }
                        default: return '#NAME?';
                    }
                });
            }
        });
    };
    replaceFns();
    // Replace cell references
    expr = expr.replace(/\b([A-Z]+)(\d+)\b/gi, (m, c, r) => {
        const p = cellPos(m.toUpperCase());
        if (!p || p.col >= COLS || p.row >= ROWS) return 0;
        const d = getCell(s, p.row, p.col);
        return d ? toNum(d.value) : 0;
    });
    try {
        expr = expr.replace(/\s+/g, '');
        if (!expr || /[^0-9+\-*/().,%]/.test(expr)) return expr || '';
        const result = new Function('return ' + expr)();
        if (result === Infinity || result === -Infinity) return '#DIV/0!';
        if (isNaN(result)) return '#VALUE!';
        return result;
    } catch { return '#ERROR!'; }
}

function getDeps(formula) {
    const deps = new Set();
    formula.replace(/\b([A-Z]+\d+(?::[A-Z]+\d+)?)\b/gi, m => {
        expandRange(m.toUpperCase()).forEach(k => deps.add(k));
    });
    return deps;
}

function recalcDeps(changedId, visited = new Set()) {
    if (visited.has(changedId)) return;
    visited.add(changedId);
    const s = getSheet();
    Object.keys(s.data).forEach(id => {
        const d = s.data[id];
        if (d && d.formula && getDeps(d.formula).has(changedId)) {
            const old = d.value;
            d.value = evalFormula(d.formula, s);
            d.display = typeof d.value === 'number' ? (Number.isInteger(d.value) ? d.value.toString() : d.value.toFixed(2)) : String(d.value);
            if (d.value !== old) recalcDeps(id, visited);
            const p = cellPos(id);
            if (p) renderCell(p.row, p.col);
        }
    });
}

function recalcAll() {
    const s = getSheet();
    Object.keys(s.data).forEach(id => {
        const d = s.data[id];
        if (d && d.formula) {
            d.value = evalFormula(d.formula, s);
            d.display = typeof d.value === 'number' ? (Number.isInteger(d.value) ? d.value.toString() : d.value.toFixed(2)) : String(d.value);
        }
    });
    renderAllCells();
}

// ═══════════════════════════════════════════════════════════════
// CELL EDITING
// ═══════════════════════════════════════════════════════════════
function startEdit(row, col, fromBar) {
    if (isEditing) commitEdit();
    isEditing = true;
    editingInBar = !!fromBar;
    editingInCell = !fromBar;
    const cell = getCell(getSheet(), row, col);
    const raw = cell ? (cell.formula ? cell.formula : cell.raw) : '';
    formulaInput.value = raw;
    if (editingInCell) {
        const el = getSheet().gridCells[row][col];
        el.contentEditable = 'true';
        el.classList.add('editing');
        el.textContent = cell ? (cell.formula ? cell.formula : cell.raw) : '';
        el.focus();
    } else {
        formulaInput.focus();
    }
}

function commitEdit() {
    if (!isEditing) return;
    const s = getSheet();
    const { row, col } = selection;
    const raw = editingInCell ? (s.gridCells[row][col].textContent || '') : formulaInput.value;
    editingInCell = false;
    editingInBar = false;
    isEditing = false;
    const el = s.gridCells[row][col];
    el.contentEditable = 'false';
    el.classList.remove('editing');
    setCellData(row, col, raw);
}

function cancelEdit() {
    if (!isEditing) return;
    editingInCell = false;
    editingInBar = false;
    isEditing = false;
    const s = getSheet();
    const el = s.gridCells[selection.row][selection.col];
    el.contentEditable = 'false';
    el.classList.remove('editing');
    renderCell(selection.row, selection.col);
    formulaInput.value = getCell(s, selection.row, selection.col)?.formula || getCell(s, selection.row, selection.col)?.raw || '';
}

function setCellData(row, col, raw) {
    const s = getSheet();
    const cell = initCell(row, col);
    cell.raw = raw;
    if (typeof raw === 'string' && raw.startsWith('=')) {
        cell.formula = raw;
        cell.value = evalFormula(raw, s);
        cell.display = typeof cell.value === 'number' ? (Number.isInteger(cell.value) ? cell.value.toString() : cell.value.toFixed(2)) : String(cell.value);
    } else {
        cell.formula = null;
        cell.value = raw;
        const num = Number(raw);
        cell.display = (raw !== '' && !isNaN(num)) ? (Number.isInteger(num) ? num.toString() : num.toFixed(2)) : String(raw);
    }
    renderCell(row, col);
    recalcDeps(cellId(row, col));
}

function renderCell(r, c) {
    const s = getSheet();
    const cell = getCell(s, r, c);
    const el = s.gridCells[r][c];
    if (!cell || isBlank(cell.display)) {
        el.textContent = '';
        el.style.background = '';
        el.style.fontWeight = '';
        el.style.fontStyle = '';
        el.className = 'cell';
    } else {
        const isError = typeof cell.display === 'string' && cell.display.startsWith('#');
        el.textContent = cell.display;
        el.className = 'cell' + (cell.bold ? ' bold' : '') + (cell.italic ? ' italic' : '') + (isError ? ' error' : '');
        el.style.background = cell.bgColor || '';
    }
}

function renderAllCells() {
    const s = getSheet();
    for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
            renderCell(r, c);
}

// ═══════════════════════════════════════════════════════════════
// SELECTION
// ═══════════════════════════════════════════════════════════════
function selectCell(row, col) {
    if (isEditing) commitEdit();
    row = clamp(row, 0, ROWS - 1);
    col = clamp(col, 0, COLS - 1);
    selection.row = row;
    selection.col = col;
    rangeSel.active = false;
    rangeSel.startRow = rangeSel.endRow = row;
    rangeSel.startCol = rangeSel.endCol = col;
    updateSelectionBox();
    updateHeaders();
    updateFormulaBar();
    updateToolbarState();
}

function startRangeSel(row, col) {
    rangeSel.startRow = rangeSel.endRow = row;
    rangeSel.startCol = rangeSel.endCol = col;
    rangeSel.active = true;
}

function extendRangeSel(row, col) {
    rangeSel.endRow = row;
    rangeSel.endCol = col;
    rangeSel.active = true;
    updateSelectionBox();
    updateRefDisplay();
}

function updateHeaders() {
    colHeader.querySelectorAll('.ch-cell').forEach(ch => {
        ch.classList.toggle('active', parseInt(ch.dataset.col) === selection.col);
    });
    rowHeader.querySelectorAll('.rh-cell').forEach((rh, i) => {
        rh.classList.toggle('active', i === selection.row);
    });
}

function updateFormulaBar() {
    const s = getSheet();
    const cell = getCell(s, selection.row, selection.col);
    formulaInput.value = cell?.formula || cell?.raw || '';
    updateRefDisplay();
}

function updateRefDisplay() {
    if (rangeSel.active && (rangeSel.startRow !== rangeSel.endRow || rangeSel.startCol !== rangeSel.endCol)) {
        const n = normalizeRange(rangeSel.startRow, rangeSel.startCol, rangeSel.endRow, rangeSel.endCol);
        const ar = (rangeSel.startRow === selection.row && rangeSel.startCol === selection.col) ?
            cellId(selection.row, selection.col) : cellId(n.sr, n.sc);
        cellRefBox.textContent = ar + ':' + cellId(n.er, n.ec);
    } else {
        cellRefBox.textContent = cellId(selection.row, selection.col);
    }
}

function updateToolbarState() {
    const cell = getCell(getSheet(), selection.row, selection.col);
    boldBtn.classList.toggle('active', cell?.bold);
    italicBtn.classList.toggle('active', cell?.italic);
    bgColorPicker.value = cell?.bgColor || '#ffffff';
}

function updateSelectionBox() {
    gridBodyContainer.querySelectorAll('.selection-box').forEach(el => el.remove());
    const s = getSheet();
    const el = s.gridEl;
    if (!el) return;
    const r1 = rangeSel.active ? Math.min(rangeSel.startRow, rangeSel.endRow) : selection.row;
    const r2 = rangeSel.active ? Math.max(rangeSel.startRow, rangeSel.endRow) : selection.row;
    const c1 = rangeSel.active ? Math.min(rangeSel.startCol, rangeSel.endCol) : selection.col;
    const c2 = rangeSel.active ? Math.max(rangeSel.startCol, rangeSel.endCol) : selection.col;

    let x1 = 0; for (let c = 0; c < c1; c++) x1 += s.colWidths[c];
    let x2 = x1; for (let c = c1; c <= c2; c++) x2 += s.colWidths[c];
    const y1 = r1 * DEFAULT_ROW_HEIGHT;
    const y2 = (r2 + 1) * DEFAULT_ROW_HEIGHT;

    const box = document.createElement('div');
    box.className = 'selection-box';
    box.style.left = x1 + 'px';
    box.style.top = y1 + 'px';
    box.style.width = (x2 - x1) + 'px';
    box.style.height = (y2 - y1) + 'px';
    if (!rangeSel.active || (rangeSel.startRow === rangeSel.endRow && rangeSel.startCol === rangeSel.endCol)) {
        box.style.background = 'transparent';
    }
    const handle = document.createElement('div');
    handle.className = 'selection-fill';
    box.appendChild(handle);
    el.appendChild(box);
}

function scrollToCell(row, col) {
    const s = getSheet();
    const el = s.gridEl;
    if (!el) return;
    let x = 0; for (let c = 0; c < col; c++) x += s.colWidths[c];
    const y = row * DEFAULT_ROW_HEIGHT;
    const vw = el.clientWidth, vh = el.clientHeight;
    if (x < el.scrollLeft) el.scrollLeft = x;
    if (x + s.colWidths[col] > el.scrollLeft + vw) el.scrollLeft = x + s.colWidths[col] - vw;
    if (y < el.scrollTop) el.scrollTop = y;
    if (y + DEFAULT_ROW_HEIGHT > el.scrollTop + vh) el.scrollTop = y + DEFAULT_ROW_HEIGHT - vh;
}

// ═══════════════════════════════════════════════════════════════
// INSERT FORMULA REF
// ═══════════════════════════════════════════════════════════════
function insertFormulaRef(ref) {
    const inp = formulaInput;
    const start = inp.selectionStart, end = inp.selectionEnd;
    const val = inp.value;
    // Find where current ref starts (for replacement)
    let rs = start;
    while (rs > 0 && /[A-Z0-9:$]/i.test(val[rs - 1])) rs--;
    inp.value = val.substring(0, rs) + ref + val.substring(end);
    inp.selectionStart = inp.selectionEnd = rs + ref.length;
    inp.focus();
}

// ═══════════════════════════════════════════════════════════════
// GRID EVENTS
// ═══════════════════════════════════════════════════════════════
function setupGridEvents() {
    // Mousedown on grid body (delegated)
    document.addEventListener('mousedown', (e) => {
        const cell = e.target.closest('.cell');
        const tab = e.target.closest('.sheet-tab');

        // Prevent blur of formulaInput when clicking inside app
        if (e.target.closest('.spreadsheet') || e.target.closest('.toolbar')) {
            e.preventDefault();
        }

        if (!cell) {
            hideContextMenu();
            return;
        }
        hideContextMenu();
        const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
        const s = getSheet();

        if (isEditing) {
            if (editingInBar) {
                // Insert formula ref
                insertFormulaRef(cellId(r, c));
                return;
            }
            // Commit cell edit and navigate
            if (r !== selection.row || c !== selection.col) {
                commitEdit();
                selectCell(r, c);
                return;
            }
        }

        if (e.shiftKey) {
            extendRangeSel(r, c);
            return;
        }

        selectCell(r, c);
        startRangeSel(r, c);
        isRangeDrag = true;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isRangeDrag) return;
        const cell = e.target.closest('.cell');
        if (!cell) return;
        const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
        if (r !== rangeSel.endRow || c !== rangeSel.endCol) {
            extendRangeSel(r, c);
        }
    });

    document.addEventListener('mouseup', () => {
        isRangeDrag = false;
    });

    // Double click
    document.addEventListener('dblclick', (e) => {
        const cell = e.target.closest('.cell');
        if (!cell) return;
        const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
        if (r === selection.row && c === selection.col) {
            startEdit(r, c, false);
        }
    });

    // Resize handles
    document.addEventListener('mousedown', (e) => {
        const handle = e.target.closest('.col-resize-handle');
        if (!handle) return;
        e.preventDefault();
        e.stopPropagation();
        const ci = parseInt(handle.dataset.col);
        startResizeCol(ci, e.clientX);
    });
}

// ═══════════════════════════════════════════════════════════════
// COLUMN RESIZE
// ═══════════════════════════════════════════════════════════════
let resizeCol = -1, resizeStartX = 0, resizeStartW = 0;

function startResizeCol(ci, x) {
    resizeCol = ci;
    resizeStartX = x;
    resizeStartW = getSheet().colWidths[ci];
    document.body.classList.add('resizing');
    const onMove = (e) => {
        const w = Math.max(30, resizeStartW + e.clientX - resizeStartX);
        getSheet().colWidths[ci] = w;
        applyColWidths();
        updateSelectionBox();
    };
    const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        document.body.classList.remove('resizing');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
}

function applyColWidths() {
    const s = getSheet();
    const totalW = s.colWidths.reduce((a, b) => a + b, 0);
    colHeader.querySelectorAll('.ch-cell').forEach((ch, i) => { ch.style.width = s.colWidths[i] + 'px'; });
    colHeader.style.width = totalW + 'px';
    if (s.gridEl) {
        s.gridEl.style.width = totalW + 'px';
        s.gridEl.querySelectorAll('.grid-row').forEach(row => {
            const cells = row.children;
            for (let c = 0; c < COLS; c++) cells[c].style.width = s.colWidths[c] + 'px';
        });
    }
}

// ═══════════════════════════════════════════════════════════════
// FORMULA BAR
// ═══════════════════════════════════════════════════════════════
function setupFormulaBar() {
    formulaInput.addEventListener('focus', () => {
        if (!isEditing) {
            startEdit(selection.row, selection.col, true);
        }
    });

    formulaInput.addEventListener('input', () => {
        if (!isEditing) {
            startEdit(selection.row, selection.col, true);
        }
        // Sync cell display
        if (editingInCell) {
            getSheet().gridCells[selection.row][selection.col].textContent = formulaInput.value;
        }
    });

    formulaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            commitEdit();
            moveAndSelect(selection.row + 1, selection.col);
        } else if (e.key === 'Escape') {
            e.preventDefault();
            cancelEdit();
        } else if (e.key === 'Tab') {
            e.preventDefault();
            commitEdit();
            moveAndSelect(selection.row, selection.col + (e.shiftKey ? -1 : 1));
        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
            // Allow natural cursor movement in formula bar
            e.stopPropagation();
        }
    });
}

// ═══════════════════════════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════════════════════════
function setupKeyboard() {
    document.addEventListener('keydown', (e) => {
        if (e.target === formulaInput && !isEditing) return;

        if (e.target === formulaInput || (isEditing && editingInBar)) {
            handleFormulaKey(e);
            return;
        }
        if (isEditing && editingInCell) {
            handleCellKey(e);
            return;
        }
        handleNavKey(e);
    });
}

function handleFormulaKey(e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        commitEdit();
        moveAndSelect(selection.row + 1, selection.col);
    } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
    } else if (e.key === 'Tab') {
        e.preventDefault();
        commitEdit();
        moveAndSelect(selection.row, selection.col + (e.shiftKey ? -1 : 1));
    } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.stopPropagation();
    }
}

function handleCellKey(e) {
    const s = getSheet();
    const el = s.gridCells[selection.row][selection.col];
    if (e.key === 'Enter') {
        e.preventDefault();
        formulaInput.value = el.textContent || '';
        commitEdit();
        moveAndSelect(selection.row + 1, selection.col);
    } else if (e.key === 'Escape') {
        e.preventDefault();
        cancelEdit();
    } else if (e.key === 'Tab') {
        e.preventDefault();
        formulaInput.value = el.textContent || '';
        commitEdit();
        moveAndSelect(selection.row, selection.col + (e.shiftKey ? -1 : 1));
    } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.stopPropagation();
    }
}

function handleNavKey(e) {
    if (e.ctrlKey || e.metaKey) {
        if (e.key === 'b' || e.key === 'B') { e.preventDefault(); toggleBold(); return; }
        if (e.key === 'i' || e.key === 'I') { e.preventDefault(); toggleItalic(); return; }
    }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveAndSelect(selection.row - 1, selection.col); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); moveAndSelect(selection.row + 1, selection.col); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); moveAndSelect(selection.row, selection.col - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); moveAndSelect(selection.row, selection.col + 1); }
    else if (e.key === 'Enter') { e.preventDefault(); startEdit(selection.row, selection.col, false); }
    else if (e.key === 'Tab') { e.preventDefault(); moveAndSelect(selection.row, selection.col + (e.shiftKey ? -1 : 1)); }
    else if (e.key === 'F2') { e.preventDefault(); startEdit(selection.row, selection.col, false); }
    else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); clearContents(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        formulaInput.value = '';
        startEdit(selection.row, selection.col, true);
        formulaInput.value = e.key;
        formulaInput.setSelectionRange(1, 1);
        e.preventDefault();
    }
}

function moveAndSelect(row, col) {
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
    selectCell(row, col);
    scrollToCell(row, col);
}

// ═══════════════════════════════════════════════════════════════
// TOOLBAR
// ═══════════════════════════════════════════════════════════════
function setupToolbar() {
    boldBtn.addEventListener('click', () => toggleBold());
    italicBtn.addEventListener('click', () => toggleItalic());
    bgColorPicker.addEventListener('input', (e) => applyBgColor(e.target.value));
    clearBtn.addEventListener('click', () => clearContents());
    downloadBtn.addEventListener('click', downloadCSV);
    uploadBtn.addEventListener('click', () => csvUpload.click());
    csvUpload.addEventListener('change', uploadCSV);
}

function toggleBold() {
    const s = getSheet();
    const n = rangeSel.active ? normalizeRange(rangeSel.startRow, rangeSel.startCol, rangeSel.endRow, rangeSel.endCol) :
        { sr: selection.row, er: selection.row, sc: selection.col, ec: selection.col };
    for (let r = n.sr; r <= n.er; r++)
        for (let c = n.sc; c <= n.ec; c++)
            initCell(r, c).bold = !initCell(r, c).bold;
    renderAllCells();
    updateToolbarState();
}

function toggleItalic() {
    const s = getSheet();
    const n = rangeSel.active ? normalizeRange(rangeSel.startRow, rangeSel.startCol, rangeSel.endRow, rangeSel.endCol) :
        { sr: selection.row, er: selection.row, sc: selection.col, ec: selection.col };
    for (let r = n.sr; r <= n.er; r++)
        for (let c = n.sc; c <= n.ec; c++)
            initCell(r, c).italic = !initCell(r, c).italic;
    renderAllCells();
    updateToolbarState();
}

function applyBgColor(color) {
    const n = rangeSel.active ? normalizeRange(rangeSel.startRow, rangeSel.startCol, rangeSel.endRow, rangeSel.endCol) :
        { sr: selection.row, er: selection.row, sc: selection.col, ec: selection.col };
    for (let r = n.sr; r <= n.er; r++)
        for (let c = n.sc; c <= n.ec; c++)
            initCell(r, c).bgColor = color;
    renderAllCells();
}

function clearContents() {
    const n = rangeSel.active ? normalizeRange(rangeSel.startRow, rangeSel.startCol, rangeSel.endRow, rangeSel.endCol) :
        { sr: selection.row, er: selection.row, sc: selection.col, ec: selection.col };
    const s = getSheet();
    for (let r = n.sr; r <= n.er; r++) {
        for (let c = n.sc; c <= n.ec; c++) {
            const k = cellId(r, c);
            if (s.data[k]) {
                s.data[k].raw = '';
                s.data[k].formula = null;
                s.data[k].value = '';
                s.data[k].display = '';
            }
        }
    }
    renderAllCells();
    recalcAll();
    updateFormulaBar();
}

// ═══════════════════════════════════════════════════════════════
// CSV
// ═══════════════════════════════════════════════════════════════
function downloadCSV() {
    const s = getSheet();
    let maxR = 0, maxC = 0;
    Object.keys(s.data).forEach(k => {
        const d = s.data[k];
        if (d && !isBlank(d.display)) {
            const p = cellPos(k);
            if (p) { maxR = Math.max(maxR, p.row); maxC = Math.max(maxC, p.col); }
        }
    });
    let csv = '';
    for (let r = 0; r <= maxR; r++) {
        const row = [];
        for (let c = 0; c <= maxC; c++) {
            const d = getCell(s, r, c);
            let v = d ? String(d.display ?? d.raw ?? '') : '';
            v = v.replace(/"/g, '""');
            row.push(v.includes(',') || v.includes('"') || v.includes('\n') ? `"${v}"` : v);
        }
        csv += row.join(',') + '\n';
    }
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = s.name + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
}

function uploadCSV() {
    const file = csvUpload.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        const lines = parseCSV(e.target.result);
        if (!lines.length) return;
        const s = getSheet();
        Object.keys(s.data).forEach(k => {
            s.data[k] = { raw: '', formula: null, value: '', display: '', bold: false, italic: false, bgColor: '' };
        });
        lines.forEach((cols, r) => {
            if (r >= ROWS) return;
            cols.forEach((v, c) => {
                if (c >= COLS || !v) return;
                setCellData(r, c, v);
            });
        });
        renderAllCells();
        recalcAll();
        selectCell(0, 0);
    };
    reader.readAsText(file);
    csvUpload.value = '';
}

function parseCSV(text) {
    const lines = [];
    let row = [], field = '', inQuote = false;
    for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQuote) {
            if (ch === '"') {
                if (text[i + 1] === '"') { field += '"'; i++; }
                else inQuote = false;
            } else field += ch;
        } else {
            if (ch === '"') inQuote = true;
            else if (ch === ',') { row.push(field); field = ''; }
            else if (ch === '\n' || ch === '\r') {
                if (ch === '\r' && text[i + 1] === '\n') i++;
                row.push(field); field = '';
                if (row.some(v => v !== '')) lines.push(row);
                row = [];
            } else field += ch;
        }
    }
    row.push(field);
    if (row.some(v => v !== '')) lines.push(row);
    return lines;
}

// ═══════════════════════════════════════════════════════════════
// SHEET TAB EVENTS
// ═══════════════════════════════════════════════════════════════
function setupSheetTabEvents() {
    sheetTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.sheet-tab');
        if (tab) switchSheet(tab.dataset.sheet);
    });

    sheetTabs.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        const tab = e.target.closest('.sheet-tab');
        if (!tab) return;
        showSheetContextMenu(tab.dataset.sheet, e.clientX, e.clientY);
    });

    addSheetBtn.addEventListener('click', addSheet);

    document.addEventListener('click', (e) => {
        if (!contextMenu.contains(e.target)) hideContextMenu();
    });
}

function showSheetContextMenu(name, x, y) {
    const isOnly = Object.keys(sheets).length <= 1;
    contextMenu.innerHTML = `
        <div class="context-menu-item" data-action="rename">✏️ Rename</div>
        <div class="context-menu-item" data-action="delete" ${isOnly ? 'style="opacity:.4;pointer-events:none"' : ''}>🗑️ Delete</div>
    `;
    contextMenu.style.display = 'block';
    contextMenu.style.left = Math.min(x, window.innerWidth - 160) + 'px';
    contextMenu.style.top = Math.min(y, window.innerHeight - 80) + 'px';

    contextMenu.querySelector('[data-action="rename"]').onclick = () => {
        hideContextMenu();
        const newName = prompt('New name:', name);
        if (!newName || newName.trim() === name || !newName.trim()) return;
        const trimmed = newName.trim().substring(0, 31).replace(/[\\/:*?\[\]]/g, '_');
        if (sheets[trimmed]) { alert('Name exists.'); return; }
        sheets[trimmed] = sheets[name];
        sheets[trimmed].name = trimmed;
        delete sheets[name];
        if (currentSheet === name) currentSheet = trimmed;
        renderSheetTabs();
    };

    contextMenu.querySelector('[data-action="delete"]').onclick = () => {
        hideContextMenu();
        if (Object.keys(sheets).length <= 1) return;
        if (!confirm(`Delete "${name}"?`)) return;
        if (sheets[name].gridEl) sheets[name].gridEl.remove();
        delete sheets[name];
        if (currentSheet === name) {
            currentSheet = Object.keys(sheets)[0];
            renderSheetTabs();
            switchSheet(currentSheet);
        } else {
            renderSheetTabs();
        }
    };
}

function hideContextMenu() { contextMenu.style.display = 'none'; }

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
} else {
    initApp();
}
</script>
