<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniSheet – Spreadsheet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#1a73e8;--blue-light:rgba(26,115,232,.12);--border:#d4d4d4;--header-bg:#f0f0f0;--toolbar-bg:#f8f9fa;--text:#202124}
body{font-family:'Segoe UI',Calibri,Arial,sans-serif;font-size:13px;color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column;background:#fff;user-select:none}

/* ── Toolbar ────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 8px;background:var(--toolbar-bg);border-bottom:1px solid var(--border);flex-shrink:0;min-height:36px}
.toolbar button,.toolbar label{background:none;border:1px solid transparent;border-radius:4px;padding:4px 8px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:4px}
.toolbar button:hover,.toolbar label:hover{background:#e8e8e8}
.toolbar button.active{background:#cce5ff;border-color:#99caff}
.toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.toolbar input[type=color]{width:24px;height:20px;border:none;cursor:pointer;padding:0}

/* ── Formula Bar ────────────────────────────────── */
.formula-bar{display:flex;align-items:center;border-bottom:1px solid var(--border);height:28px;flex-shrink:0;background:#fff}
.name-box{width:72px;border:none;border-right:1px solid var(--border);text-align:center;font-weight:600;font-size:12px;height:100%;outline:none;padding:0 4px}
.fx-label{padding:0 8px;color:#888;font-style:italic;font-size:12px;border-right:1px solid var(--border);height:100%;display:flex;align-items:center}
.formula-input{flex:1;border:none;outline:none;padding:0 8px;font-size:13px;height:100%}

/* ── Grid ───────────────────────────────────────── */
.grid-wrap{flex:1;overflow:auto;position:relative;background:#fff}
table.sheet{border-collapse:collapse;table-layout:fixed}
table.sheet th,table.sheet td{border:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.sheet thead th{position:sticky;top:0;z-index:12;background:var(--header-bg);font-weight:600;font-size:12px;color:#555;text-align:center;height:22px;padding:0 2px}
table.sheet tbody th{position:sticky;left:0;z-index:10;background:var(--header-bg);font-weight:400;font-size:12px;color:#555;text-align:center;width:42px;min-width:42px;padding:0 2px}
table.sheet thead th:first-child{position:sticky;left:0;top:0;z-index:20;width:42px;min-width:42px}
table.sheet td{height:22px;padding:0;position:relative;cursor:cell}
table.sheet td .c{display:block;padding:0 4px;height:100%;line-height:22px;overflow:hidden;text-overflow:ellipsis}
table.sheet td.sel{outline:2px solid var(--blue);outline-offset:-1px;z-index:5}
table.sheet td.in-range{background:var(--blue-light)}

/* column resize handle */
.col-resize{position:absolute;right:-2px;top:0;bottom:0;width:5px;cursor:col-resize;z-index:30}

/* ── Sheet Bar ──────────────────────────────────── */
.sheet-bar{display:flex;align-items:center;height:28px;border-top:1px solid var(--border);background:var(--toolbar-bg);flex-shrink:0}
.sheet-bar .add-btn{width:32px;height:100%;border:none;background:none;font-size:18px;cursor:pointer;border-right:1px solid var(--border);color:#555}
.sheet-bar .add-btn:hover{background:#e0e0e0}
.sheet-tabs{display:flex;align-items:flex-end;height:100%;overflow-x:auto;flex:1}
.sheet-tab{padding:4px 16px;font-size:12px;cursor:pointer;border:1px solid var(--border);border-bottom:none;border-radius:6px 6px 0 0;margin-left:2px;background:#e8e8e8;height:24px;display:flex;align-items:center;white-space:nowrap}
.sheet-tab.active{background:#fff;font-weight:600;height:26px;border-bottom:1px solid #fff}
.sheet-tab:hover:not(.active){background:#ddd}
.sheet-tab .del{margin-left:6px;font-size:10px;color:#999;cursor:pointer}
.sheet-tab .del:hover{color:#e44}

/* ── Cell Editor Overlay ────────────────────────── */
#cell-editor{position:absolute;display:none;z-index:100;border:2px solid var(--blue);outline:none;font-size:13px;font-family:inherit;padding:0 3px;background:#fff}

/* ── Context Menu ───────────────────────────────── */
.ctx-menu{position:absolute;background:#fff;border:1px solid #ccc;border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:999;display:none;min-width:120px}
.ctx-menu div{padding:6px 16px;cursor:pointer;font-size:12px}
.ctx-menu div:hover{background:var(--blue-light)}
</style>
</head>
<body>

<div class="toolbar">
  <button id="btnBold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="btnItalic" title="Italic (Ctrl+I)"><i>I</i></button>
  <div class="sep"></div>
  <label title="Background Color">🎨<input type="color" id="btnBg" value="#ffff00"></label>
  <div class="sep"></div>
  <button id="btnClear" title="Clear Contents">✕ Clear</button>
  <div class="sep"></div>
  <button id="btnDownCSV">⬇ CSV</button>
  <button id="btnUpCSV">⬆ CSV</button>
  <input type="file" id="csvInput" accept=".csv" hidden>
</div>

<div class="formula-bar">
  <input class="name-box" id="nameBox" value="A1" spellcheck="false">
  <span class="fx-label">fx</span>
  <input class="formula-input" id="fxInput" spellcheck="false" autocomplete="off">
</div>

<div class="grid-wrap" id="gridWrap"></div>

<div class="sheet-bar">
  <button class="add-btn" id="addSheet" title="Add Sheet">＋</button>
  <div class="sheet-tabs" id="sheetTabs"></div>
</div>

<input id="cellEditor">
<div class="ctx-menu" id="ctxMenu">
  <div data-act="rename">Rename Sheet</div>
  <div data-act="delete">Delete Sheet</div>
</div>

<script>
/* ============================================================
   Configuration
   ============================================================ */
const ROWS = 100, COLS = 26;
const DEF_W = 80;

/* ============================================================
   State
   ============================================================ */
let sheets = [ makeSheet('Sheet 1') ];
let si = 0;                          // active sheet index
let ac = { r:1, c:0 };              // active cell row/col
let sel = null;                      // range sel {r1,c1,r2,c2}
let dragging = false;
let editing  = false;
let fxEditing = false;              // formula-bar editing
let fxInsertStart = null;           // for range-insert via drag
let ctxTarget = null;               // sheet-tab context

/* ============================================================
   Helpers
   ============================================================ */
function makeSheet(name){
  return { name, cells:{}, colW:{} };
}
function colIdx(c){                  // "A"→0  "AA"→26
  let n=0; for(let i=0;i<c.length;i++) n=n*26+(c.charCodeAt(i)-64); return n-1;
}
function idxCol(i){                  // 0→"A"  26→"AA"
  let s=''; i++; while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);} return s;
}
function cid(r,c){ return idxCol(c)+r; }
function parseCid(id){ const m=id.match(/^([A-Z]+)(\d+)$/); return m?{c:colIdx(m[1]),r:+m[2]}:null; }
function sheet(){ return sheets[si]; }
function cell(r,c){ return sheet().cells[cid(r,c)]; }
function getCell(id){ return sheet().cells[id]; }

function displayVal(cell){
  if(!cell) return '';
  if(cell.formula){
    if(cell.computed===undefined) cell.computed = evalFormula(cell.formula, sheet());
    return cell.computed;
  }
  return cell.raw ?? '';
}

function tdEl(r,c){
  return document.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
}

/* ============================================================
   Formula Engine
   ============================================================ */
function expandRange(str){
  const [a,b] = str.toUpperCase().split(':');
  const p1=parseCid(a), p2=parseCid(b);
  if(!p1||!p2) return [];
  const out=[];
  for(let c=Math.min(p1.c,p2.c);c<=Math.max(p1.c,p2.c);c++)
    for(let r=Math.min(p1.r,p2.r);r<=Math.max(p1.r,p2.r);r++)
      out.push(cid(r,c));
  return out;
}

function splitArgs(s){
  const out=[]; let d=0, cur='';
  for(const ch of s){ if(ch==='(')d++; if(ch===')')d--; if(ch===','&&d===0){out.push(cur);cur='';}else cur+=ch; }
  if(cur) out.push(cur); return out;
}

function resolveArg(arg, sh){
  const t = arg.trim();
  if(/^[A-Z]+\d+:[A-Z]+\d+$/i.test(t)){
    return expandRange(t).map(id=>{ const c=sh.cells[id]; return c?num(displayVal(c)):0; });
  }
  if(/^[A-Z]+\d+$/i.test(t)){
    const c=sh.cells[t.toUpperCase()]; return c?num(displayVal(c)):0;
  }
  return num(t);
}

function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }

function evalFn(name, argsStr, sh){
  const parts = splitArgs(argsStr);
  let vals=[];
  for(const p of parts){
    const t=p.trim();
    if(/:/.test(t) && /^[A-Z]+\d+:[A-Z]+\d+$/i.test(t)){
      vals.push(...expandRange(t).map(id=>{const c=sh.cells[id];return c?num(displayVal(c)):0;}));
    } else if(/^[A-Z]+\d+$/i.test(t)){
      const c=sh.cells[t.toUpperCase()]; vals.push(c?num(displayVal(c)):0);
    } else vals.push(num(t));
  }
  switch(name){
    case 'SUM':     return vals.reduce((a,b)=>a+b,0);
    case 'AVERAGE': return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    case 'MIN':     return vals.length?Math.min(...vals):0;
    case 'MAX':     return vals.length?Math.max(...vals):0;
    case 'COUNT':   return vals.filter(v=>v!==0||arguments).length;
    case 'ABS':     return vals.length?Math.abs(vals[0]):0;
    case 'ROUND':   return vals.length?Math.round(vals[0]):0;
    case 'SQRT':    return vals.length?Math.sqrt(vals[0]):0;
    case 'POWER':   return vals.length>=2?Math.pow(vals[0],vals[1]):0;
    default:        return '#NAME?';
  }
}

function evalFormula(formula, sh){
  if(!formula||formula[0]!=='=') return formula;
  let expr = formula.substring(1);
  try{
    let iter=50;
    while(/[A-Z]+\([^()]+\)/i.test(expr) && iter-->0){
      expr = expr.replace(/([A-Z]+)\(([^()]+)\)/gi,(m,fn,a)=>evalFn(fn.toUpperCase(),a,sh));
    }
    expr = expr.replace(/\b([A-Z]+)(\d+)\b/gi,(m,col,row)=>{
      const cl=col.toUpperCase();
      if(colIdx(cl)<0||colIdx(cl)>=COLS) return m;
      const id=cl+row, c=sh.cells[id];
      return c?num(displayVal(c)):0;
    });
    if(!/^[\d\s+\-*/().%e]+$/.test(expr)) return '#ERROR';
    const r = Function('"use strict";return('+expr+')')();
    if(!isFinite(r)) return '#DIV/0!';
    return Math.round(r*1e12)/1e12;
  }catch(e){ return '#ERROR'; }
}

function recalcAll(){
  const sh = sheet();
  let ch=true,it=50;
  while(ch&&it-->0){
    ch=false;
    for(const id in sh.cells){
      const c=sh.cells[id];
      if(c.formula){
        const v=evalFormula(c.formula,sh);
        if(v!==c.computed){c.computed=v;ch=true;}
      }
    }
  }
}

function getFormulaRefs(formula){
  if(!formula||formula[0]!=='=') return [];
  const refs=new Set();
  const f=formula.substring(1);
  for(const m of f.matchAll(/([A-Z]+\d+):([A-Z]+\d+)/gi)){
    expandRange(m[0]).forEach(r=>refs.add(r));
  }
  for(const m of f.matchAll(/\b([A-Z]+)(\d+)\b/gi)){
    const id=m[1].toUpperCase()+m[2];
    if(colIdx(m[1].toUpperCase())>=0&&colIdx(m[1].toUpperCase())<COLS) refs.add(id);
  }
  return[...refs];
}

/* ============================================================
   Grid Rendering
   ============================================================ */
function buildGrid(){
  let h='<table class="sheet"><colgroup><col style="width:42px">';
  for(let c=0;c<COLS;c++){
    const w=sheet().colW[c]||DEF_W;
    h+=`<col style="width:${w}px" data-ci="${c}">`;
  }
  h+='</colgroup><thead><tr><th></th>';
  for(let c=0;c<COLS;c++){
    h+=`<th data-ch="${c}">${idxCol(c)}<div class="col-resize" data-ci="${c}"></div></th>`;
  }
  h+='</tr></thead><tbody>';
  for(let r=1;r<=ROWS;r++){
    h+=`<tr><th data-rh="${r}">${r}</th>`;
    for(let c=0;c<COLS;c++){
      h+=`<td data-r="${r}" data-c="${c}"><span class="c"></span></td>`;
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  gridWrap.innerHTML=h;
  refreshCells();
}

function refreshCells(){
  const sh=sheet();
  document.querySelectorAll('table.sheet td').forEach(td=>{
    const r=+td.dataset.r, c=+td.dataset.c;
    const id=cid(r,c), cell=sh.cells[id];
    const sp=td.querySelector('.c');
    const v=displayVal(cell);
    sp.textContent=(v!==undefined&&v!==null)?v:'';
    if(cell){
      sp.style.fontWeight=cell.bold?'bold':'';
      sp.style.fontStyle=cell.italic?'italic':'';
      sp.style.backgroundColor=cell.bg||'';
    } else {
      sp.style.cssText='';
    }
  });
}

function updateSelectionUI(){
  document.querySelectorAll('td.sel,td.in-range').forEach(t=>{t.classList.remove('sel','in-range');});
  if(sel){
    const r1=Math.min(sel.r1,sel.r2),r2=Math.max(sel.r1,sel.r2);
    const c1=Math.min(sel.c1,sel.c2),c2=Math.max(sel.c1,sel.c2);
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const t=tdEl(r,c); if(t) t.classList.add('in-range');
    }
  }
  const t=tdEl(ac.r,ac.c); if(t){t.classList.remove('in-range');t.classList.add('sel');}
}

function syncFormulaBar(){
  nameBox.value=cid(ac.r,ac.c);
  if(!editing){
    const c=cell(ac.r,ac.c);
    fxInput.value=c?(c.formula||c.raw||''):(c?c.raw:'')||'';
  }
  const c=cell(ac.r,ac.c);
  document.getElementById('btnBold').classList.toggle('active',!!(c&&c.bold));
  document.getElementById('btnItalic').classList.toggle('active',!!(c&&c.italic));
}

/* ============================================================
   Selection
   ============================================================ */
function selectCell(r,c){
  ac={r,c}; sel=null;
  editing=false; hideEditor();
  updateSelectionUI(); syncFormulaBar();
  scrollToCell(r,c);
}

function selectRange(r1,c1,r2,c2){
  ac={r:r1,c:c1};
  sel={r1,c1,r2,c2};
  updateSelectionUI(); syncFormulaBar();
}

function scrollToCell(r,c){
  const t=tdEl(r,c); if(t) t.scrollIntoView({block:'nearest',inline:'nearest'});
}

/* ============================================================
   Editing
   ============================================================ */
function showEditor(initial, focusFx){
  editing=true;
  const td=tdEl(ac.r,ac.c);
  if(!td) return;
  const rect=td.getBoundingClientRect();
  const wr=gridWrap.getBoundingClientRect();
  const ed=cellEditor;
  ed.style.display='block';
  ed.style.left=(rect.left-wr.left+gridWrap.scrollLeft)+'px';
  ed.style.top=(rect.top-wr.top+gridWrap.scrollTop)+'px';
  ed.style.width=rect.width+'px';
  ed.style.height=rect.height+'px';
  ed.value=initial??'';
  ed.style.fontWeight=cell(ac.r,ac.c)?.bold?'bold':'normal';
  ed.style.fontStyle=cell(ac.r,ac.c)?.italic?'italic':'normal';
  fxInput.value=initial??'';
  if(focusFx) fxInput.focus(); else ed.focus();
}

function hideEditor(){
  editing=false;
  cellEditor.style.display='none';
}

function commitEdit(){
  if(!editing) return;
  const val=cellEditor.value;
  setCellValue(ac.r,ac.c,val);
  hideEditor();
  editing=false;
  refreshCells(); recalcAll(); refreshCells();
  updateSelectionUI(); syncFormulaBar();
}

function cancelEdit(){
  hideEditor(); editing=false;
  syncFormulaBar();
}

function setCellValue(r,c,val){
  const sh=sheet();
  const id=cid(r,c);
  if(!val&&val!==0){delete sh.cells[id];return;}
  let entry=sh.cells[id]||{};
  entry.raw=val;
  if(typeof val==='string'&&val[0]==='='){
    entry.formula=val;
    entry.computed=evalFormula(val,sh);
  } else {
    entry.formula=null;
    entry.computed=undefined;
  }
  sh.cells[id]=entry;
  recalcAll();
}

/* ============================================================
   Keyboard Navigation
   ============================================================ */
function moveAc(dr,dc){
  const nr=Math.max(1,Math.min(ROWS,ac.r+dr));
  const nc=Math.max(0,Math.min(COLS-1,ac.c+dc));
  selectCell(nr,nc);
}

/* ============================================================
   Sheet Management
   ============================================================ */
function renderTabs(){
  const box=document.getElementById('sheetTabs');
  box.innerHTML='';
  sheets.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sheet-tab'+(i===si?' active':'');
    d.textContent=s.name;
    d.addEventListener('click',()=>switchSheet(i));
    d.addEventListener('dblclick',e=>{e.stopPropagation();renameSheet(i);});
    d.addEventListener('contextmenu',e=>{e.preventDefault();showCtxMenu(e,i);});
    box.appendChild(d);
  });
}
function switchSheet(i){ si=i; buildGrid(); renderTabs(); selectCell(1,0); }
function addSheet(){
  const n='Sheet '+(sheets.length+1);
  sheets.push(makeSheet(n));
  si=sheets.length-1;
  buildGrid(); renderTabs(); selectCell(1,0);
}
function renameSheet(i){
  const n=prompt('Sheet name:',sheets[i].name);
  if(n&&n.trim()){sheets[i].name=n.trim();renderTabs();}
}
function deleteSheet(i){
  if(sheets.length<=1){alert('Need at least one sheet.');return;}
  if(!confirm('Delete "'+sheets[i].name+'"?'))return;
  sheets.splice(i,1);
  if(si>=sheets.length)si=sheets.length-1;
  buildGrid(); renderTabs(); selectCell(1,0);
}

/* ── Context Menu ── */
function showCtxMenu(e,i){
  ctxTarget=i;
  const m=document.getElementById('ctxMenu');
  m.style.display='block';
  m.style.left=e.clientX+'px';
  m.style.top=e.clientY+'px';
}
document.getElementById('ctxMenu').addEventListener('click',e=>{
  const act=e.target.dataset.act;
  if(act==='rename'&&ctxTarget!==null) renameSheet(ctxTarget);
  if(act==='delete'&&ctxTarget!==null) deleteSheet(ctxTarget);
  document.getElementById('ctxMenu').style.display='none';
  ctxTarget=null;
});
document.addEventListener('click',()=>document.getElementById('ctxMenu').style.display='none');

/* ============================================================
   Column Resizing
   ============================================================ */
let resizing=null, resizeStartX=0, resizeStartW=0;
gridWrap.addEventListener('mousedown',e=>{
  const h=e.target.closest('.col-resize');
  if(!h) return;
  e.preventDefault(); e.stopPropagation();
  const ci=+h.dataset.ci;
  const col=gridWrap.querySelector(`col[data-ci="${ci}"]`);
  resizing={ci,col};
  resizeStartX=e.clientX;
  resizeStartW=col.offsetWidth;
  document.addEventListener('mousemove',onResizeMove);
  document.addEventListener('mouseup',onResizeUp);
});
function onResizeMove(e){
  if(!resizing) return;
  const w=Math.max(30,resizeStartW+(e.clientX-resizeStartX));
  resizing.col.style.width=w+'px';
  sheet().colW[resizing.ci]=w;
}
function onResizeUp(){
  resizing=null;
  document.removeEventListener('mousemove',onResizeMove);
  document.removeEventListener('mouseup',onResizeUp);
}

/* ============================================================
   Grid Mouse Events
   ============================================================ */
function getCellFromEvent(e){
  const td=e.target.closest('td[data-r]');
  if(!td) return null;
  return {r:+td.dataset.r, c:+td.dataset.c};
}

gridWrap.addEventListener('mousedown',e=>{
  if(e.target.closest('.col-resize')) return;
  const pos=getCellFromEvent(e);
  if(!pos) return;

  /* If editing formula in formula-bar → insert ref */
  if((document.activeElement===fxInput||document.activeElement===cellEditor)
     && editing && (fxInput.value.startsWith('=')||cellEditor.value.startsWith('='))){
    fxInsertStart={...pos};
    return; // handled on mouseup / drag
  }

  if(editing) commitEdit();

  if(e.shiftKey){
    sel={r1:ac.r,c1:ac.c,r2:pos.r,c2:pos.c};
    updateSelectionUI(); syncFormulaBar();
  } else {
    dragging=true;
    selectCell(pos.r,pos.c);
  }
});

gridWrap.addEventListener('mousemove',e=>{
  if(dragging){
    const pos=getCellFromEvent(e);
    if(pos) sel={r1:ac.r,c1:ac.c,r2:pos.r,c2:pos.c};
    updateSelectionUI();
  }
  if(fxInsertStart){
    const pos=getCellFromEvent(e);
    if(pos){
      const r1=Math.min(fxInsertStart.r,pos.r),r2=Math.max(fxInsertStart.r,pos.r);
      const c1=Math.min(fxInsertStart.c,pos.c),c2=Math.max(fxInsertStart.c,pos.c);
      sel={r1,c1,r2,c2}; updateSelectionUI();
    }
  }
});

document.addEventListener('mouseup',e=>{
  if(dragging){ dragging=false; syncFormulaBar(); }
  if(fxInsertStart){
    const pos=getCellFromEvent(e);
    if(pos){
      const s=cid(fxInsertStart.r,fxInsertStart.c);
      const en=cid(pos.r,pos.c);
      const ref=s===en?s:((()=>{const r1=Math.min(fxInsertStart.r,pos.r),r2=Math.max(fxInsertStart.r,pos.r),c1=Math.min(fxInsertStart.c,pos.c),c2=Math.max(fxInsertStart.c,pos.c);return cid(r1,c1)+':'+cid(r2,c2);})());
      const tgt=document.activeElement===fxInput?fxInput:cellEditor;
      const p=tgt.selectionStart;
      tgt.value=tgt.value.substring(0,p)+ref+tgt.value.substring(tgt.selectionEnd);
      tgt.focus();
      tgt.setSelectionRange(p+ref.length,p+ref.length);
      if(tgt===fxInput) cellEditor.value=fxInput.value;
      else fxInput.value=cellEditor.value;
    }
    fxInsertStart=null;
    sel=null; updateSelectionUI();
  }
});

/* Double-click → edit */
gridWrap.addEventListener('dblclick',e=>{
  const pos=getCellFromEvent(e);
  if(!pos) return;
  ac={r:pos.r,c:pos.c};
  const c=cell(ac.r,ac.c);
  showEditor(c?(c.formula||c.raw||''):'', false);
});

/* ============================================================
   Cell Editor Sync
   ============================================================ */
cellEditor.addEventListener('input',()=>{ fxInput.value=cellEditor.value; });
cellEditor.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();commitEdit();moveAc(1,0);}
  if(e.key==='Tab'){e.preventDefault();commitEdit();moveAc(0,e.shiftKey?-1:1);}
  if(e.key==='Escape'){cancelEdit();}
});

/* ============================================================
   Formula Bar Events
   ============================================================ */
fxInput.addEventListener('focus',()=>{ fxEditing=true; });
fxInput.addEventListener('blur',()=>{ setTimeout(()=>fxEditing=false,150); });
fxInput.addEventListener('input',()=>{ if(editing) cellEditor.value=fxInput.value; });
fxInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    if(!editing) showEditor(fxInput.value,false);
    else cellEditor.value=fxInput.value;
    commitEdit();
    moveAc(1,0);
  }
  if(e.key==='Escape'){cancelEdit();fxInput.blur();}
  if(e.key==='Tab'){
    e.preventDefault();
    if(!editing) showEditor(fxInput.value,false);
    else cellEditor.value=fxInput.value;
    commitEdit();
    moveAc(0,e.shiftKey?-1:1);
  }
});

/* ============================================================
   Name Box
   ============================================================ */
nameBox.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    const m=nameBox.value.toUpperCase().trim().match(/^([A-Z]+)(\d+)$/);
    if(m){
      const c=colIdx(m[1]),r=+m[2];
      if(c>=0&&c<COLS&&r>=1&&r<=ROWS){selectCell(r,c);gridWrap.focus();}
    }
    e.preventDefault();
  }
});

/* ============================================================
   Global Keyboard
   ============================================================ */
document.addEventListener('keydown',e=>{
  if(document.activeElement===fxInput||document.activeElement===nameBox||document.activeElement===cellEditor) return;

  /* Arrow keys */
  if(e.key==='ArrowUp'){e.preventDefault();moveAc(-1,0);}
  if(e.key==='ArrowDown'){e.preventDefault();moveAc(1,0);}
  if(e.key==='ArrowLeft'){e.preventDefault();moveAc(0,-1);}
  if(e.key==='ArrowRight'){e.preventDefault();moveAc(0,1);}
  if(e.key==='Enter'){e.preventDefault();startTypingEdit(e);}
  if(e.key==='Tab'){e.preventDefault();moveAc(0,e.shiftKey?-1:1);}
  if(e.key==='Delete'){clearCells();}
  if(e.key==='Escape'){sel=null;updateSelectionUI();syncFormulaBar();}

  /* Start typing → enter edit mode */
  if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    showEditor(e.key,false);
    e.preventDefault();
  }
  /* Shortcuts */
  if(e.ctrlKey||e.metaKey){
    if(e.key==='b'){e.preventDefault();toggleBold();}
    if(e.key==='i'){e.preventDefault();toggleItalic();}
  }
});

function startTypingEdit(e){
  const c=cell(ac.r,ac.c);
  showEditor(c?(c.formula||c.raw||''):'',false);
}

/* ============================================================
   Toolbar Actions
   ============================================================ */
function forEachSelected(fn){
  if(sel){
    const r1=Math.min(sel.r1,sel.r2),r2=Math.max(sel.r1,sel.r2);
    const c1=Math.min(sel.c1,sel.c2),c2=Math.max(sel.c1,sel.c2);
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) fn(r,c);
  } else fn(ac.r,ac.c);
}

function toggleBold(){
  forEachSelected((r,c)=>{
    const id=cid(r,c); let e=sheet().cells[id];
    if(!e) e=sheet().cells[id]={raw:''};
    e.bold=!e.bold;
  });
  refreshCells(); syncFormulaBar();
}
function toggleItalic(){
  forEachSelected((r,c)=>{
    const id=cid(r,c); let e=sheet().cells[id];
    if(!e) e=sheet().cells[id]={raw:''};
    e.italic=!e.italic;
  });
  refreshCells(); syncFormulaBar();
}
function setBg(color){
  forEachSelected((r,c)=>{
    const id=cid(r,c); let e=sheet().cells[id];
    if(!e) e=sheet().cells[id]={raw:''};
    e.bg=color;
  });
  refreshCells();
}
function clearCells(){
  forEachSelected((r,c)=>{delete sheet().cells[cid(r,c)];});
  recalcAll(); refreshCells(); syncFormulaBar();
}

document.getElementById('btnBold').addEventListener('click',toggleBold);
document.getElementById('btnItalic').addEventListener('click',toggleItalic);
document.getElementById('btnBg').addEventListener('input',e=>setBg(e.target.value));
document.getElementById('btnClear').addEventListener('click',clearCells);
document.getElementById('addSheet').addEventListener('click',addSheet);

/* ============================================================
   CSV Import / Export
   ============================================================ */
document.getElementById('btnDownCSV').addEventListener('click',()=>{
  let csv='';
  let maxR=0,maxC=0;
  const sh=sheet();
  for(const id in sh.cells){
    const p=parseCid(id); if(!p) continue;
    if(p.r>maxR)maxR=p.r; if(p.c>maxC)maxC=p.c;
  }
  for(let r=1;r<=maxR;r++){
    const row=[];
    for(let c=0;c<=maxC;c++){
      const cell=sh.cells[cid(r,c)];
      let v=cell?String(displayVal(cell)):'';
      if(v.includes(',')||v.includes('"')||v.includes('\n')) v='"'+v.replace(/"/g,'""')+'"';
      row.push(v);
    }
    csv+=row.join(',')+'\n';
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=sheet().name+'.csv';a.click();
});

document.getElementById('btnUpCSV').addEventListener('click',()=>document.getElementById('csvInput').click());
document.getElementById('csvInput').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.split(/\r?\n/);
    for(let r=0;r<lines.length;r++){
      if(!lines[r].trim()) continue;
      const cols=parseCSVLine(lines[r]);
      for(let c=0;c<cols.length;c++){
        if(cols[c]!=='') setCellValue(r+1,c,cols[c]);
      }
    }
    recalcAll(); refreshCells(); syncFormulaBar();
  };
  reader.readAsText(file);
  e.target.value='';
});

function parseCSVLine(line){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){ if(ch==='"'&&line[i+1]==='"'){cur+='"';i++;} else if(ch==='"'){inQ=false;} else cur+=ch; }
    else { if(ch==='"'){inQ=true;} else if(ch===','){out.push(cur);cur='';} else cur+=ch; }
  }
  out.push(cur); return out;
}

/* ============================================================
   Initialise
   ============================================================ */
buildGrid();
renderTabs();
selectCell(1,0);
</script>
