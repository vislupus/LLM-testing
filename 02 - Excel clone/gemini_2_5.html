<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Excel Clone</title>
    <style>
        :root {
            --primary-bg: #ffffff;
            --secondary-bg: #f8f9fa;
            --border-color: #dee2e6;
            --header-bg: #e9ecef;
            --selected-cell-border: #086a3c;
            --selected-range-bg: rgba(22, 115, 66, 0.1);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --toolbar-height: 40px;
            --formula-bar-height: 30px;
            --sheet-bar-height: 30px;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: var(--font-family);
            font-size: 14px;
            background-color: #f0f0f0;
        }

        .spreadsheet-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* --- Toolbar --- */
        .toolbar {
            height: var(--toolbar-height);
            background-color: var(--secondary-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 5px;
            flex-shrink: 0;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            border-right: 1px solid var(--border-color);
            padding-right: 10px;
            margin-right: 5px;
            gap: 5px;
        }

        .toolbar-button, .toolbar-input {
            background: none;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .toolbar-button:hover, .toolbar-input:hover {
            background-color: #e2e6ea;
            border-color: #dae0e5;
        }
        
        .toolbar-button.active {
            background-color: #d3d9df;
        }

        .toolbar-button svg {
            width: 18px;
            height: 18px;
        }
        
        input[type="color"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            background-color: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="color"]::-moz-color-swatch {
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        #file-upload { display: none; }


        /* --- Formula Bar --- */
        .formula-bar {
            height: var(--formula-bar-height);
            display: flex;
            align-items: center;
            background-color: var(--primary-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 0 5px;
            flex-shrink: 0;
        }

        #current-cell-address {
            padding: 0 10px;
            border: 1px solid var(--border-color);
            background-color: var(--secondary-bg);
            height: 24px;
            line-height: 24px;
            min-width: 60px;
            text-align: center;
        }

        #formula-input {
            flex-grow: 1;
            border: 1px solid transparent;
            height: 24px;
            padding: 0 8px;
            font-family: 'Consolas', 'Menlo', monospace;
            outline: none;
            margin-left: 5px;
        }
        #formula-input:focus {
            border: 1px solid var(--selected-cell-border);
        }

        /* --- Main Grid Area --- */
        .grid-container {
            flex-grow: 1;
            position: relative;
            overflow: scroll;
            cursor: cell;
        }

        .grid-table {
            border-collapse: collapse;
            table-layout: fixed;
            position: absolute;
            top: 0; left: 0;
        }

        .grid-table td, .grid-table th {
            border: 1px solid var(--border-color);
            padding: 2px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
            background-color: var(--primary-bg);
        }
        
        .grid-table th {
            background-color: var(--header-bg);
            font-weight: normal;
            position: relative;
            text-align: center;
        }

        /* Row and Column Headers */
        .col-header {
            min-width: 50px;
        }
        .row-header {
            min-width: 40px;
        }
        
        .col-resize-handle {
            position: absolute;
            top: 0;
            right: -3px;
            width: 6px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
        }

        /* Selections */
        #selection-box {
            position: absolute;
            border: 2px solid var(--selected-cell-border);
            pointer-events: none;
            box-sizing: border-box;
            z-index: 5;
        }

        #range-selection-box {
            position: absolute;
            background-color: var(--selected-range-bg);
            border: 1px solid var(--selected-cell-border);
            pointer-events: none;
            z-index: 4;
        }
        
        #autofill-handle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: var(--selected-cell-border);
            border: 1px solid white;
            cursor: crosshair;
            z-index: 6;
        }

        #cell-editor {
            position: absolute;
            outline: 2px solid var(--selected-cell-border);
            border: none;
            padding: 2px 5px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: inherit;
            display: none; /* Initially hidden */
            z-index: 20;
        }

        /* --- Sheet Bar --- */
        .sheet-bar {
            height: var(--sheet-bar-height);
            background-color: var(--secondary-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 5px;
            gap: 2px;
            flex-shrink: 0;
        }
        
        .sheet-tab {
            padding: 5px 15px;
            cursor: pointer;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            border: 1px solid transparent;
            border-bottom: none;
            position: relative;
        }
        
        .sheet-tab.active {
            background-color: var(--primary-bg);
            border-color: var(--border-color);
            color: #000;
        }
        
        .sheet-tab:not(.active):hover {
            background-color: #e2e6ea;
        }

        .sheet-tab .delete-sheet {
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 10px;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            line-height: 12px;
            text-align: center;
            display: none;
        }
        
        .sheet-tab:hover .delete-sheet {
            display: block;
        }
        .sheet-tab .delete-sheet:hover {
            background-color: #dc3545;
            color: white;
        }

        #add-sheet-btn {
            font-size: 18px;
            width: 24px;
            height: 24px;
            line-height: 22px;
            text-align: center;
            border-radius: 50%;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="spreadsheet-container">
        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-group">
                <label for="file-upload" class="toolbar-button" title="Upload CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h16v-7h2v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8h2v7zM12 2a1 1 0 0 1 1 1v10.586l2.293-2.293a1 1 0 1 1 1.414 1.414l-4 4a1 1 0 0 1-1.414 0l-4-4a1 1 0 0 1 1.414-1.414L11 13.586V3a1 1 0 0 1 1-1z"/></svg>
                </label>
                <input type="file" id="file-upload" accept=".csv">
                <button class="toolbar-button" id="download-csv-btn" title="Download as CSV">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M4 19h16v-7h2v8a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-8h2v7zM12 15l-4-4h3V3h2v8h3l-4 4z"/></svg>
                </button>
            </div>
            <div class="toolbar-group">
                <button class="toolbar-button" id="bold-btn" title="Bold (Ctrl+B)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 11h4.5a2.5 2.5 0 1 0 0-5H8v5zm10 4.5a4.5 4.5 0 0 1-4.5 4.5H6V4h6.5a4.5 4.5 0 0 1 3.256 7.597A4.5 4.5 0 0 1 18 15.5zM8 13.5h5.5a2.5 2.5 0 1 0 0-5H8v5z"/></svg>
                </button>
                <button class="toolbar-button" id="italic-btn" title="Italic (Ctrl+I)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 5h2.5l-4 14H6l4-14z"/></svg>
                </button>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-input" for="bg-color-picker" title="Background Color">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.207 2.207a2.121 2.121 0 0 1 2.992 2.992L11 16.586V20h3.414l8.293-8.293-2.992-2.992L16.207 2.207zM2 22h18v-2H2v2z"/></svg>
                </label>
                <input type="color" id="bg-color-picker" value="#ffffff">
            </div>
             <div class="toolbar-group">
                <button class="toolbar-button" id="clear-btn" title="Clear Contents">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M16.207 2.207a2.121 2.121 0 0 1 2.992 2.992L9.586 14.813a1 1 0 0 1-.707.293H5.414v-3.414a1 1 0 0 1 .293-.707L16.207 2.207zM2 22h18v-2H2v2z"/></svg>
                </button>
            </div>
        </div>

        <!-- Formula Bar -->
        <div class="formula-bar">
            <div id="current-cell-address">A1</div>
            <input type="text" id="formula-input" />
        </div>

        <!-- Main Grid -->
        <div class="grid-container" id="grid-container">
            <table class="grid-table" id="grid-table"></table>
            <div id="selection-box">
                <div id="autofill-handle"></div>
            </div>
            <div id="range-selection-box"></div>
            <input type="text" id="cell-editor" />
        </div>

        <!-- Sheet Bar -->
        <div class="sheet-bar" id="sheet-bar">
            <button class="toolbar-button" id="add-sheet-btn" title="Add Sheet">+</button>
        </div>
    </div>

<script>
class Spreadsheet {
    constructor(containerId, initialRows = 100, initialCols = 26) {
        // --- Core State ---
        this.rows = initialRows;
        this.cols = initialCols;
        this.sheets = {};
        this.activeSheetId = null;
        
        // --- Selection & UI State ---
        this.selection = {
            start: { row: 0, col: 0 },
            end: { row: 0, col: 0 },
        };
        this.currentCell = { row: 0, col: 0 };
        this.isSelecting = false;
        this.isResizingCol = false;
        this.resizingColIndex = -1;
        this.isFormulaEditing = false;

        // --- DOM Elements ---
        this.container = document.getElementById(containerId);
        this.gridTable = this.container.querySelector('#grid-table');
        this.selectionBox = this.container.querySelector('#selection-box');
        this.rangeSelectionBox = this.container.querySelector('#range-selection-box');
        this.cellEditor = this.container.querySelector('#cell-editor');
        this.formulaInput = this.container.querySelector('#formula-input');
        this.currentCellAddress = this.container.querySelector('#current-cell-address');
        this.sheetBar = this.container.querySelector('#sheet-bar');
        
        this.colWidths = Array(this.cols).fill(100); // Default column width
        this.rowHeights = Array(this.rows).fill(25); // Default row height

        // --- Init ---
        this.addSheet("Sheet1");
        this.initDOM();
        this.attachEventListeners();
        this.render();
        this.updateSelection(0, 0);
    }
    
    // --- Sheet Management ---
    addSheet(name = `Sheet${Object.keys(this.sheets).length + 1}`) {
        const sheetId = `sheet_${Date.now()}`;
        this.sheets[sheetId] = {
            id: sheetId,
            name: name,
            data: Array.from({ length: this.rows }, () => 
                Array.from({ length: this.cols }, () => ({
                    value: null,
                    formula: null,
                    style: {},
                    dependents: new Set(),
                    precedents: new Set(),
                }))
            ),
        };
        this.switchSheet(sheetId);
        return sheetId;
    }

    switchSheet(sheetId) {
        if (!this.sheets[sheetId] || this.activeSheetId === sheetId) return;
        this.activeSheetId = sheetId;
        this.render();
        this.updateSelection(0, 0);
        this.updateSheetTabs();
    }
    
    deleteSheet(sheetId) {
        if (Object.keys(this.sheets).length <= 1) {
            alert("Cannot delete the last sheet.");
            return;
        }
        if (confirm(`Are you sure you want to delete sheet "${this.sheets[sheetId].name}"?`)) {
            const sheetIds = Object.keys(this.sheets);
            const deletedIndex = sheetIds.indexOf(sheetId);
            delete this.sheets[sheetId];
            
            if (this.activeSheetId === sheetId) {
                const newActiveIndex = Math.max(0, deletedIndex - 1);
                this.switchSheet(sheetIds[newActiveIndex]);
            } else {
                 this.updateSheetTabs();
            }
        }
    }
    
    renameSheet(sheetId, newName) {
        if (!newName || newName.trim() === "") return;
        this.sheets[sheetId].name = newName.trim();
        this.updateSheetTabs();
    }

    // --- Data and Cell Logic ---
    getCell(sheetId, row, col) {
        return this.sheets[sheetId]?.data?.[row]?.[col];
    }
    
    updateCell(row, col, formula, fromUI = true) {
        const cell = this.getCell(this.activeSheetId, row, col);
        if (!cell) return;
        
        const oldFormula = cell.formula;
        if (oldFormula === formula) return;

        // Clean up old dependencies
        this.updateDependencies(cell, oldFormula, null);
        
        cell.formula = formula;
        
        // Establish new dependencies
        this.updateDependencies(cell, null, formula);
        
        // Recalculate this cell and all its dependents
        this.recalculateCellAndDependents(row, col);

        if (fromUI) {
            this.render();
            this.updateSelection(row, col);
        }
    }

    recalculateCellAndDependents(row, col, visited = new Set()) {
        const cellAddress = this.getColName(col) + (row + 1);
        if (visited.has(cellAddress)) {
            // Circular dependency detected
            const cell = this.getCell(this.activeSheetId, row, col);
            if (cell) cell.value = '#REF!';
            return;
        }
        visited.add(cellAddress);

        const cell = this.getCell(this.activeSheetId, row, col);
        if (!cell) return;
        
        const formula = cell.formula;
        let newValue;

        if (formula && formula.startsWith('=')) {
            newValue = this.evaluateFormula(formula.substring(1));
        } else {
            const num = parseFloat(formula);
            newValue = isNaN(num) || formula.trim() === '' ? formula : num;
        }

        cell.value = newValue;

        cell.dependents.forEach(depAddress => {
            const { row: depRow, col: depCol } = this.parseCellAddress(depAddress);
            this.recalculateCellAndDependents(depRow, depCol, new Set(visited));
        });
    }

    updateDependencies(cell, oldFormula, newFormula) {
        const cellAddress = this.getCellAddress(cell);

        // Remove old dependencies
        if (oldFormula && oldFormula.startsWith('=')) {
            const precedents = this.getFormulaPrecedents(oldFormula.substring(1));
            precedents.forEach(pAddress => {
                const { row: pRow, col: pCol } = this.parseCellAddress(pAddress);
                const precedentCell = this.getCell(this.activeSheetId, pRow, pCol);
                precedentCell?.dependents.delete(cellAddress);
            });
        }
        cell.precedents.clear();

        // Add new dependencies
        if (newFormula && newFormula.startsWith('=')) {
            const precedents = this.getFormulaPrecedents(newFormula.substring(1));
            precedents.forEach(pAddress => {
                const { row: pRow, col: pCol } = this.parseCellAddress(pAddress);
                const precedentCell = this.getCell(this.activeSheetId, pRow, pCol);
                precedentCell?.dependents.add(cellAddress);
                cell.precedents.add(pAddress);
            });
        }
    }
    
    // --- Formula Engine ---
    evaluateFormula(formula) {
        try {
            // Function calls: SUM(A1:B2)
            formula = formula.toUpperCase().replace(/\s/g, '');
            formula = this.evaluateFunctions(formula);

            // Cell references: A1, B2
            const cellRegex = /[A-Z]+[0-9]+/g;
            formula = formula.replace(cellRegex, (match) => {
                const { row, col } = this.parseCellAddress(match);
                const cell = this.getCell(this.activeSheetId, row, col);
                const value = cell ? (cell.value || 0) : 0;
                 if (typeof value !== 'number') throw new Error("#VALUE!");
                return value;
            });
            
             // Final evaluation of arithmetic
            if (/^[0-9+\-*/().\s]+$/.test(formula)) {
                return new Function('return ' + formula)();
            } else {
                 return '#NAME?';
            }
        } catch (e) {
            return e.message.startsWith('#') ? e.message : '#ERROR!';
        }
    }
    
    evaluateFunctions(formula) {
        const funcRegex = /(SUM|AVERAGE|MIN|MAX)\(([^)]+)\)/g;
        return formula.replace(funcRegex, (match, funcName, args) => {
            const range = this.parseRange(args);
            const values = range.map(addr => {
                const {row, col} = this.parseCellAddress(addr);
                const cell = this.getCell(this.activeSheetId, row, col);
                return (cell && typeof cell.value === 'number') ? cell.value : 0;
            });

            switch (funcName) {
                case 'SUM':
                    return values.reduce((a, b) => a + b, 0);
                case 'AVERAGE':
                    return values.length > 0 ? values.reduce((a, b) => a + b, 0) / values.length : 0;
                case 'MIN':
                    return Math.min(...values);
                case 'MAX':
                    return Math.max(...values);
                default:
                    return match; // Return original if function unknown
            }
        });
    }
    
    getFormulaPrecedents(formula) {
        const precedents = new Set();
        formula = formula.toUpperCase();

        const cellRegex = /[A-Z]+[0-9]+/g;
        let match;
        while ((match = cellRegex.exec(formula)) !== null) {
            precedents.add(match[0]);
        }
        
        const rangeRegex = /[A-Z]+[0-9]+:[A-Z]+[0-9]+/g;
        while ((match = rangeRegex.exec(formula)) !== null) {
            const rangeCells = this.parseRange(match[0]);
            rangeCells.forEach(cell => precedents.add(cell));
        }

        return precedents;
    }


    // --- Rendering ---
    initDOM() {
        this.gridTable.innerHTML = ''; // Clear existing
        const thead = document.createElement('thead');
        const tbody = document.createElement('tbody');

        // Column headers
        const colHeaderRow = document.createElement('tr');
        colHeaderRow.appendChild(document.createElement('th')); // Top-left empty cell
        for (let j = 0; j < this.cols; j++) {
            const th = document.createElement('th');
            th.className = 'col-header';
            const resizeHandle = document.createElement('div');
            resizeHandle.className = 'col-resize-handle';
            resizeHandle.dataset.col = j;
            th.appendChild(resizeHandle);
            colHeaderRow.appendChild(th);
        }
        thead.appendChild(colHeaderRow);

        // Rows
        for (let i = 0; i < this.rows; i++) {
            const tr = document.createElement('tr');
            const rowHeader = document.createElement('th');
            rowHeader.className = 'row-header';
            tr.appendChild(rowHeader);
            for (let j = 0; j < this.cols; j++) {
                const td = document.createElement('td');
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }

        this.gridTable.appendChild(thead);
        this.gridTable.appendChild(tbody);
    }
    
    render() {
        if (!this.activeSheetId) return;

        const { scrollTop, scrollLeft } = this.container;
        const colHeaders = this.gridTable.querySelector('thead tr').cells;
        const rows = this.gridTable.querySelector('tbody').rows;
        
        // Update column widths and headers
        let cumulativeLeft = this.rowHeights[0];
        for (let j = 0; j < this.cols; j++) {
            colHeaders[j + 1].style.width = `${this.colWidths[j]}px`;
            colHeaders[j + 1].textContent = this.getColName(j);
            cumulativeLeft += this.colWidths[j];
        }

        // Update row heights and headers
        let cumulativeTop = this.colWidths[0];
         for (let i = 0; i < this.rows; i++) {
            rows[i].cells[0].style.height = `${this.rowHeights[i]}px`;
            rows[i].cells[0].textContent = i + 1;
             for (let j=0; j < this.cols; j++) {
                 const cellData = this.getCell(this.activeSheetId, i, j);
                 const td = rows[i].cells[j+1];
                 td.textContent = cellData.value !== null ? cellData.value : '';

                 // Apply styles
                 td.style.fontWeight = cellData.style.bold ? 'bold' : 'normal';
                 td.style.fontStyle = cellData.style.italic ? 'italic' : 'normal';
                 td.style.backgroundColor = cellData.style.bgColor || 'var(--primary-bg)';
                 td.style.textAlign = typeof cellData.value === 'number' ? 'right' : 'left';
             }
            cumulativeTop += this.rowHeights[i];
        }
        
        this.updateSheetTabs();
        this.updateSelectionUI();
    }

    // --- UI and Event Handling ---
    attachEventListeners() {
        // Grid interactions
        this.gridTable.addEventListener('mousedown', this.onGridMouseDown.bind(this));
        document.addEventListener('mousemove', this.onDocumentMouseMove.bind(this));
        document.addEventListener('mouseup', this.onDocumentMouseUp.bind(this));
        this.gridTable.addEventListener('dblclick', this.onGridDoubleClick.bind(this));
        
        // Keyboard navigation
        document.addEventListener('keydown', this.onKeyDown.bind(this));

        // Formula bar and cell editor input
        this.formulaInput.addEventListener('input', () => this.updateCellFromInput(this.formulaInput.value));
        this.formulaInput.addEventListener('focus', () => this.isFormulaEditing = true);
        this.formulaInput.addEventListener('blur', () => { setTimeout(() => this.isFormulaEditing = false, 100) });
        this.cellEditor.addEventListener('blur', this.hideCellEditor.bind(this));
        this.cellEditor.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                this.hideCellEditor();
                this.moveSelection(1, 0); // Move down
            } else if (e.key === 'Escape') {
                this.hideCellEditor(true); // Cancel
            }
        });

        // Toolbar buttons
        document.getElementById('bold-btn').addEventListener('click', () => this.toggleStyle('bold'));
        document.getElementById('italic-btn').addEventListener('click', () => this.toggleStyle('italic'));
        document.getElementById('bg-color-picker').addEventListener('input', (e) => this.applyStyle('bgColor', e.target.value));
        document.getElementById('clear-btn').addEventListener('click', this.clearSelectedCells.bind(this));
        document.getElementById('download-csv-btn').addEventListener('click', this.downloadCSV.bind(this));
        document.getElementById('file-upload').addEventListener('change', this.uploadCSV.bind(this));
        
        // Sheet bar
        document.getElementById('add-sheet-btn').addEventListener('click', () => this.addSheet());
    }

    onGridMouseDown(e) {
        if (e.target.classList.contains('col-resize-handle')) {
            this.isResizingCol = true;
            this.resizingColIndex = parseInt(e.target.dataset.col, 10);
            this.startX = e.clientX;
            this.startWidth = this.colWidths[this.resizingColIndex];
            return;
        }

        const { row, col } = this.getCellCoordsFromEvent(e);
        if (row === -1 || col === -1) return;
        
        if (this.isFormulaEditing) {
            e.preventDefault();
            this.handleFormulaCellSelection(row, col, 'start');
        } else {
            this.isSelecting = true;
            this.selection.start = { row, col };
            this.selection.end = { row, col };
            this.updateSelection(row, col);
        }
    }
    
    onDocumentMouseMove(e) {
        if (this.isResizingCol) {
            const diff = e.clientX - this.startX;
            this.colWidths[this.resizingColIndex] = Math.max(30, this.startWidth + diff);
            this.render();
        } else if (this.isSelecting || this.isFormulaEditing) {
            const { row, col } = this.getCellCoordsFromEvent(e);
            if (row === -1 || col === -1) return;

            if (this.isFormulaEditing) {
                this.handleFormulaCellSelection(row, col, 'drag');
            } else {
                this.selection.end = { row, col };
                this.updateRangeSelectionUI();
            }
        }
    }
    
    onDocumentMouseUp(e) {
        this.isResizingCol = false;
        if(this.isSelecting) this.isSelecting = false;
        
        if(this.isFormulaEditing) {
            this.handleFormulaCellSelection(0,0, 'end');
        }
    }
    
    onGridDoubleClick(e) {
        const { row, col } = this.getCellCoordsFromEvent(e);
        if (row !== -1 && col !== -1) {
            this.showCellEditor(row, col);
        }
    }
    
    onKeyDown(e) {
        if (this.cellEditor.style.display !== 'none') return;
        
        if(e.ctrlKey) {
            if(e.key === 'b' || e.key === 'B') { e.preventDefault(); this.toggleStyle('bold'); }
            if(e.key === 'i' || e.key === 'I') { e.preventDefault(); this.toggleStyle('italic'); }
            return;
        }

        let { row, col } = this.currentCell;
        let handled = false;
        switch (e.key) {
            case 'ArrowUp': this.moveSelection(-1, 0); handled = true; break;
            case 'ArrowDown': this.moveSelection(1, 0); handled = true; break;
            case 'ArrowLeft': this.moveSelection(0, -1); handled = true; break;
            case 'ArrowRight': this.moveSelection(0, 1); handled = true; break;
            case 'Enter': this.moveSelection(1, 0); handled = true; break;
            case 'Tab': this.moveSelection(0, e.shiftKey ? -1 : 1); handled = true; break;
            case 'Escape': this.hideCellEditor(true); handled = true; break;
            case 'Delete':
            case 'Backspace':
                this.clearSelectedCells();
                handled = true;
                break;
            default:
                // Start typing
                if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                    this.showCellEditor(row, col, e.key);
                    handled = true;
                }
                break;
        }
        
        if (handled) e.preventDefault();
    }
    
    handleFormulaCellSelection(row, col, state) {
        const getAddress = (r, c) => this.getColName(c) + (r + 1);
        
        if(state === 'start') {
            this.formulaSelectionStart = { row, col };
            this.formulaSelectionEnd = { row, col };
        }
        
        this.formulaSelectionEnd = {row, col};
        
        const start = this.formulaSelectionStart;
        const end = this.formulaSelectionEnd;
        
        const minRow = Math.min(start.row, end.row);
        const maxRow = Math.max(start.row, end.row);
        const minCol = Math.min(start.col, end.col);
        const maxCol = Math.max(start.col, end.col);
        
        let address;
        if(minRow === maxRow && minCol === maxCol) {
            address = getAddress(row, col);
        } else {
            address = `${getAddress(minRow, minCol)}:${getAddress(maxRow, maxCol)}`;
        }
        
        // This is a simplified insertion. A real one would be cursor-aware.
        this.formulaInput.value += address;
    }
    
    updateSelection(row, col) {
        this.currentCell = { row, col };
        this.selection.start = { row, col };
        this.selection.end = { row, col };
        this.updateSelectionUI();
    }

    updateSelectionUI() {
        const { row, col } = this.currentCell;
        
        const cell = this.gridTable.rows[row + 1]?.cells[col + 1];
        if (!cell) return;
        
        this.selectionBox.style.left = `${cell.offsetLeft - 1}px`;
        this.selectionBox.style.top = `${cell.offsetTop - 1}px`;
        this.selectionBox.style.width = `${cell.offsetWidth}px`;
        this.selectionBox.style.height = `${cell.offsetHeight}px`;
        
        this.container.querySelector('#autofill-handle').style.left = `${cell.offsetWidth - 4}px`;
        this.container.querySelector('#autofill-handle').style.top = `${cell.offsetHeight - 4}px`;
        
        this.updateRangeSelectionUI();

        // Update formula bar
        const cellData = this.getCell(this.activeSheetId, row, col);
        this.currentCellAddress.textContent = this.getColName(col) + (row + 1);
        this.formulaInput.value = cellData.formula !== null ? cellData.formula : '';

        // Update toolbar state
        const boldBtn = document.getElementById('bold-btn');
        const italicBtn = document.getElementById('italic-btn');
        boldBtn.classList.toggle('active', !!cellData.style.bold);
        italicBtn.classList.toggle('active', !!cellData.style.italic);
        document.getElementById('bg-color-picker').value = cellData.style.bgColor || '#ffffff';
    }

    updateRangeSelectionUI() {
        const { start, end } = this.selection;
        const minRow = Math.min(start.row, end.row);
        const maxRow = Math.max(start.row, end.row);
        const minCol = Math.min(start.col, end.col);
        const maxCol = Math.max(start.col, end.col);

        const startCell = this.gridTable.rows[minRow + 1]?.cells[minCol + 1];
        const endCell = this.gridTable.rows[maxRow + 1]?.cells[maxCol + 1];
        
        if (!startCell || !endCell) return;
        
        this.rangeSelectionBox.style.left = `${startCell.offsetLeft -1}px`;
        this.rangeSelectionBox.style.top = `${startCell.offsetTop -1}px`;
        this.rangeSelectionBox.style.width = `${endCell.offsetLeft + endCell.offsetWidth - startCell.offsetLeft}px`;
        this.rangeSelectionBox.style.height = `${endCell.offsetTop + endCell.offsetHeight - startCell.offsetTop}px`;
    }
    
    updateSheetTabs() {
        this.sheetBar.querySelectorAll('.sheet-tab').forEach(tab => tab.remove());
        Object.values(this.sheets).forEach(sheet => {
            const tab = document.createElement('div');
            tab.className = 'sheet-tab';
            tab.textContent = sheet.name;
            tab.dataset.sheetId = sheet.id;
            if (sheet.id === this.activeSheetId) {
                tab.classList.add('active');
            }
            
            const deleteBtn = document.createElement('span');
            deleteBtn.className = 'delete-sheet';
            deleteBtn.textContent = '×';
            deleteBtn.title = 'Delete Sheet';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                this.deleteSheet(sheet.id);
            };
            tab.appendChild(deleteBtn);

            tab.onclick = () => this.switchSheet(sheet.id);
            tab.ondblclick = () => {
                const newName = prompt("Enter new sheet name:", sheet.name);
                this.renameSheet(sheet.id, newName);
            };
            
            this.sheetBar.insertBefore(tab, document.getElementById('add-sheet-btn'));
        });
    }

    moveSelection(dRow, dCol) {
        let { row, col } = this.currentCell;
        row = Math.max(0, Math.min(this.rows - 1, row + dRow));
        col = Math.max(0, Math.min(this.cols - 1, col + dCol));
        this.updateSelection(row, col);
        this.scrollIntoView(row, col);
    }
    
    scrollIntoView(row, col) {
        const cell = this.gridTable.rows[row + 1]?.cells[col + 1];
        if (!cell) return;
        cell.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
    
    showCellEditor(row, col, initialValue = '') {
        const cell = this.gridTable.rows[row + 1]?.cells[col + 1];
        const cellData = this.getCell(this.activeSheetId, row, col);
        if (!cell) return;

        this.cellEditor.style.display = 'block';
        this.cellEditor.style.left = `${cell.offsetLeft -1}px`;
        this.cellEditor.style.top = `${cell.offsetTop -1}px`;
        this.cellEditor.style.width = `${cell.offsetWidth}px`;
        this.cellEditor.style.height = `${cell.offsetHeight}px`;
        this.cellEditor.value = initialValue ? initialValue : (cellData.formula || '');
        this.cellEditor.focus();
        if (initialValue) this.cellEditor.select();
    }
    
    hideCellEditor(cancel = false) {
        if (this.cellEditor.style.display === 'none') return;
        if (!cancel) {
            this.updateCellFromInput(this.cellEditor.value);
        }
        this.cellEditor.style.display = 'none';
        this.container.focus();
    }

    updateCellFromInput(value) {
        const { row, col } = this.currentCell;
        this.updateCell(row, col, value);
    }
    
    toggleStyle(style) {
        const { start, end } = this.selection;
        const minRow = Math.min(start.row, end.row);
        const maxRow = Math.max(start.row, end.row);
        const minCol = Math.min(start.col, end.col);
        const maxCol = Math.max(start.col, end.col);
        
        const firstCell = this.getCell(this.activeSheetId, minRow, minCol);
        const isApplied = !!firstCell.style[style];

        for (let r = minRow; r <= maxRow; r++) {
            for (let c = minCol; c <= maxCol; c++) {
                this.getCell(this.activeSheetId, r, c).style[style] = !isApplied;
            }
        }
        this.render();
        this.updateSelectionUI();
    }
    
    applyStyle(style, value) {
         const { start, end } = this.selection;
        for (let r = Math.min(start.row, end.row); r <= Math.max(start.row, end.row); r++) {
            for (let c = Math.min(start.col, end.col); c <= Math.max(start.col, end.col); c++) {
                this.getCell(this.activeSheetId, r, c).style[style] = value;
            }
        }
        this.render();
    }
    
    clearSelectedCells() {
        const { start, end } = this.selection;
        for (let r = Math.min(start.row, end.row); r <= Math.max(start.row, end.row); r++) {
            for (let c = Math.min(start.col, end.col); c <= Math.max(start.col, end.col); c++) {
                this.updateCell(r, c, '', false);
            }
        }
        this.render();
    }

    // --- CSV Import/Export ---
    downloadCSV() {
        const sheetData = this.sheets[this.activeSheetId].data;
        let csvContent = "";

        // Only include rows/cols with data
        let maxRow = -1, maxCol = -1;
        sheetData.forEach((row, r) => {
            row.forEach((cell, c) => {
                if(cell.formula) {
                    maxRow = Math.max(maxRow, r);
                    maxCol = Math.max(maxCol, c);
                }
            });
        });

        for(let r = 0; r <= maxRow; r++) {
            let rowContent = [];
            for(let c = 0; c <= maxCol; c++) {
                let formula = sheetData[r][c].formula || '';
                // Escape quotes
                formula = formula.replace(/"/g, '""');
                // Wrap in quotes if it contains comma, quote, or newline
                if (/[",\n]/.test(formula)) {
                    formula = `"${formula}"`;
                }
                rowContent.push(formula);
            }
            csvContent += rowContent.join(',') + '\r\n';
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `${this.sheets[this.activeSheetId].name}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
    
    uploadCSV(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            // A simple CSV parser (doesn't handle complex cases like quotes inside quotes)
            const rows = text.split('\n').map(row => row.split(','));
            
            this.addSheet(file.name.replace('.csv',''));

            rows.forEach((row, r) => {
                if(r >= this.rows) return;
                row.forEach((cellValue, c) => {
                    if(c >= this.cols) return;
                    let value = cellValue.trim();
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.substring(1, value.length - 1).replace(/""/g, '"');
                    }
                    this.updateCell(r, c, value, false);
                });
            });
            this.render();
            this.updateSelection(0,0);
        };
        reader.readAsText(file);
        event.target.value = ''; // Reset file input
    }


    // --- Utility Functions ---
    getColName(col) {
        let name = '';
        let num = col + 1;
        while (num > 0) {
            let rem = num % 26;
            if (rem === 0) {
                name = 'Z' + name;
                num = Math.floor(num / 26) - 1;
            } else {
                name = String.fromCharCode(rem - 1 + 65) + name;
                num = Math.floor(num / 26);
            }
        }
        return name;
    }
    
    parseColName(colName) {
        let col = 0;
        for (let i = 0; i < colName.length; i++) {
            col = col * 26 + (colName.charCodeAt(i) - 64);
        }
        return col - 1;
    }
    
    parseCellAddress(address) {
        const match = address.match(/^([A-Z]+)([0-9]+)$/);
        if (!match) return { row: -1, col: -1 };
        const col = this.parseColName(match[1]);
        const row = parseInt(match[2], 10) - 1;
        return { row, col };
    }
    
    getCellAddress(cell) {
        for (let r = 0; r < this.rows; r++) {
            const c = this.sheets[this.activeSheetId].data[r].indexOf(cell);
            if (c > -1) {
                return this.getColName(c) + (r + 1);
            }
        }
        return '';
    }
    
    parseRange(rangeStr) {
        const [startAddr, endAddr] = rangeStr.split(':');
        const { row: startRow, col: startCol } = this.parseCellAddress(startAddr);
        const { row: endRow, col: endCol } = this.parseCellAddress(endAddr);
        
        const cells = [];
        for (let r = startRow; r <= endRow; r++) {
            for (let c = startCol; c <= endCol; c++) {
                cells.push(this.getColName(c) + (r + 1));
            }
        }
        return cells;
    }
    
    getCellCoordsFromEvent(e) {
        const target = e.target.closest('td, th');
        if (!target) return { row: -1, col: -1 };
        const tr = target.parentNode;
        const col = target.cellIndex - 1;
        const row = tr.rowIndex - 1;
        return { row, col };
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const spreadsheet = new Spreadsheet('grid-container', 200, 52);
});
