<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spreadsheet</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column;background:#217346;color:#fff}

  /* TOOLBAR */
  #toolbar{
    background:#217346;display:flex;align-items:center;gap:2px;
    padding:4px 8px;flex-shrink:0;flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.15);
  }
  #toolbar .sep{width:1px;height:24px;background:rgba(255,255,255,.2);margin:0 6px}
  .tb-btn{
    padding:4px 8px;border-radius:4px;cursor:pointer;
    font-size:13px;background:transparent;color:#fff;border:none;
    display:flex;align-items:center;gap:4px;transition:background .1s;
    white-space:nowrap;
  }
  .tb-btn:hover{background:rgba(255,255,255,.15)}
  .tb-btn.active{background:rgba(255,255,255,.2)}
  .tb-btn b{font-weight:700}
  .tb-btn i{font-style:italic}
  .tb-select{
    background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);
    border-radius:4px;padding:3px 6px;font-size:12px;outline:none;cursor:pointer;
  }
  .tb-select option{background:#333;color:#fff}
  #color-picker{width:28px;height:26px;border:none;cursor:pointer;border-radius:4px;padding:0;background:transparent}

  /* FORMULA BAR */
  #formula-bar{
    display:flex;align-items:center;background:#f3f3f3;
    border-bottom:1px solid #d1d1d1;flex-shrink:0;height:30px;
  }
  #cell-address{
    width:80px;text-align:center;font-size:12px;font-weight:600;
    color:#333;border-right:1px solid #d1d1d1;height:100%;
    display:flex;align-items:center;justify-content:center;
    background:#fff;flex-shrink:0;
  }
  #fx-label{
    padding:0 8px;color:#666;font-style:italic;font-size:13px;
    border-right:1px solid #d1d1d1;height:100%;
    display:flex;align-items:center;flex-shrink:0;background:#fff;
  }
  #formula-input{
    flex:1;border:none;outline:none;padding:0 8px;font-size:13px;
    font-family:'Segoe UI',sans-serif;background:#fff;color:#333;height:100%;
  }
  #formula-input:focus{background:#fff}

  /* SPREADSHEET AREA */
  #sheet-area{
    flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;
    background:#fff;
  }

  /* GRID CONTAINER */
  #grid-container{
    flex:1;overflow:auto;position:relative;
  }
  #grid{
    display:grid;position:relative;
    /* grid-template set dynamically */
  }

  /* CELLS */
  .cell{
    border-right:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;
    padding:2px 4px;font-size:13px;color:#333;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis;cursor:cell;
    min-height:24px;line-height:20px;position:relative;
    background:#fff;outline:none;
  }
  .cell.selected{outline:2px solid #217346;outline-offset:-1px;z-index:2}
  .cell.in-range{background:#d4edda!important}
  .cell.editing{outline:2px solid #217346;outline-offset:-1px;z-index:3;cursor:text}
  .cell.bold{font-weight:700}
  .cell.italic{font-style:italic}

  /* HEADERS */
  .col-header{
    background:#f0f0f0;border-right:1px solid #d1d1d1;border-bottom:1px solid #d1d1d1;
    text-align:center;font-size:12px;font-weight:600;color:#555;
    padding:2px 0;height:24px;position:sticky;top:0;z-index:5;
    cursor:default;user-select:none;display:flex;align-items:center;justify-content:center;
  }
  .col-header.active{background:#d4edda;color:#217346}
  .row-header{
    background:#f0f0f0;border-right:1px solid #d1d1d1;border-bottom:1px solid #d1d1d1;
    text-align:center;font-size:12px;font-weight:600;color:#555;
    padding:2px 4px;width:40px;position:sticky;left:0;z-index:5;
    cursor:default;user-select:none;display:flex;align-items:center;justify-content:center;
  }
  .row-header.active{background:#d4edda;color:#217346}
  .corner-header{
    background:#e8e8e8;border-right:1px solid #d1d1d1;border-bottom:1px solid #d1d1d1;
    position:sticky;top:0;left:0;z-index:6;width:40px;height:24px;
  }

  /* COLUMN RESIZE HANDLE */
  .col-resize{
    position:absolute;right:-3px;top:0;width:6px;height:100%;
    cursor:col-resize;z-index:10;
  }
  .col-resize:hover,.col-resize.active{background:#217346}

  /* SHEET TABS */
  #sheet-tabs{
    display:flex;align-items:center;background:#e8e8e8;
    border-top:1px solid #d1d1d1;flex-shrink:0;height:32px;
    padding:0 4px;gap:2px;overflow-x:auto;
  }
  .sheet-tab{
    padding:4px 16px;border-radius:4px 4px 0 0;cursor:pointer;
    font-size:12px;color:#555;background:transparent;border:none;
    white-space:nowrap;transition:background .1s;position:relative;
  }
  .sheet-tab:hover{background:rgba(0,0,0,.06)}
  .sheet-tab.active{background:#fff;color:#217346;font-weight:600;border-bottom:2px solid #217346}
  #add-sheet{
    width:28px;height:28px;border-radius:4px;cursor:pointer;
    font-size:18px;background:transparent;color:#555;border:none;
    display:flex;align-items:center;justify-content:center;
  }
  #add-sheet:hover{background:rgba(0,0,0,.08)}

  /* STATUS BAR */
  #status-bar{
    height:24px;background:#217346;display:flex;align-items:center;
    padding:0 12px;font-size:11px;color:rgba(255,255,255,.8);
    border-top:1px solid rgba(255,255,255,.15);flex-shrink:0;gap:20px;
  }
  #status-bar span{white-space:nowrap}

  /* SELECTION HIGHLIGHT OVERLAY */
  #selection-overlay{
    position:absolute;pointer-events:none;z-index:4;
    border:1px solid rgba(33,115,70,.3);background:rgba(33,115,70,.08);
    display:none;
  }

  /* CONTEXT MENU */
  #ctx-menu{
    position:fixed;min-width:180px;background:#fff;border-radius:8px;
    box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:99999;display:none;
    padding:4px;border:1px solid #e0e0e0;
  }
  .ctx-item{
    padding:6px 12px;font-size:12px;color:#333;cursor:pointer;
    border-radius:4px;display:flex;align-items:center;gap:8px;
  }
  .ctx-item:hover{background:#f0f0f0}
  .ctx-sep{height:1px;background:#e0e0e0;margin:4px 8px}

  /* HIDDEN FILE INPUT */
  #csv-upload{display:none}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:14px;height:14px}
  ::-webkit-scrollbar-track{background:#f0f0f0}
  ::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:7px;border:3px solid #f0f0f0}
  ::-webkit-scrollbar-thumb:hover{background:#a8a8a8}
  ::-webkit-scrollbar-corner{background:#f0f0f0}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button class="tb-btn" id="btn-bold" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="tb-btn" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
  <div class="sep"></div>
  <select class="tb-select" id="font-size-select" title="Font Size">
    <option value="11">11</option>
    <option value="12">12</option>
    <option value="14">14</option>
    <option value="16">16</option>
    <option value="18">18</option>
    <option value="20">20</option>
    <option value="24">24</option>
  </select>
  <div class="sep"></div>
  <input type="color" id="color-picker" value="#ffffff" title="Cell Background Color">
  <button class="tb-btn" id="btn-clear-color" title="Clear Color">🎨✕</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-clear" title="Clear Contents (Del)">🗑️ Clear</button>
  <div class="sep"></div>
  <button class="tb-btn" id="btn-download" title="Download CSV">📥 CSV</button>
  <button class="tb-btn" id="btn-upload" title="Upload CSV">📤 Import</button>
  <input type="file" id="csv-upload" accept=".csv,.txt">
</div>

<!-- FORMULA BAR -->
<div id="formula-bar">
  <div id="cell-address">A1</div>
  <div id="fx-label">fx</div>
  <input type="text" id="formula-input" placeholder="Enter value or formula (e.g. =SUM(A1:A10))">
</div>

<!-- SPREADSHEET -->
<div id="sheet-area">
  <div id="grid-container">
    <div id="grid"></div>
    <div id="selection-overlay"></div>
  </div>
</div>

<!-- SHEET TABS -->
<div id="sheet-tabs">
  <div id="tabs-container" style="display:flex;gap:2px"></div>
  <button id="add-sheet" title="Add Sheet">+</button>
</div>

<!-- STATUS BAR -->
<div id="status-bar">
  <span id="status-info">Ready</span>
  <span id="status-calc"></span>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu"></div>

<script>
// ===== CONFIGURATION =====
const NUM_COLS = 26;
const NUM_ROWS = 100;
const DEFAULT_COL_WIDTH = 100;
const ROW_HEIGHT = 24;

// ===== STATE =====
let sheets = [];
let activeSheetIdx = 0;
let selectedCell = { row: 0, col: 0 };
let selectionRange = null; // {r1,c1,r2,c2}
let isSelecting = false;
let editingCell = null; // {row, col}
let colWidths = [];
let cellData = {}; // "R,C" -> { value, formula, style:{bold,italic,bgColor,fontSize} }
let dependencyGraph = {}; // cellKey -> Set of dependent cellKeys
let formulaInputFocused = false;

// ===== UTILITY =====
function colName(c) {
  let s = '';
  c++;
  while (c > 0) {
    c--;
    s = String.fromCharCode(65 + (c % 26)) + s;
    c = Math.floor(c / 26);
  }
  return s;
}

function colIndex(name) {
  let idx = 0;
  for (let i = 0; i < name.length; i++) {
    idx = idx * 26 + (name.charCodeAt(i) - 64);
  }
  return idx - 1;
}

function cellKey(r, c) { return `${r},${c}`; }
function cellRef(r, c) { return colName(c) + (r + 1); }

function parseCellRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;
  return { row: parseInt(m[2]) - 1, col: colIndex(m[1]) };
}

function getCell(r, c) {
  return cellData[cellKey(r, c)] || null;
}

function getCellValue(r, c) {
  const cell = getCell(r, c);
  if (!cell) return '';
  return cell.value !== undefined ? cell.value : '';
}

function setCellData(r, c, data) {
  const key = cellKey(r, c);
  if (!cellData[key]) {
    cellData[key] = { value: '', formula: '', style: {} };
  }
  Object.assign(cellData[key], data);
}

// ===== SHEET MANAGEMENT =====
function createSheet(name) {
  return { name, cellData: {}, colWidths: new Array(NUM_COLS).fill(DEFAULT_COL_WIDTH), dependencyGraph: {} };
}

function saveCurrentSheet() {
  sheets[activeSheetIdx].cellData = JSON.parse(JSON.stringify(cellData));
  sheets[activeSheetIdx].colWidths = [...colWidths];
  sheets[activeSheetIdx].dependencyGraph = JSON.parse(JSON.stringify(dependencyGraph, (k, v) => v instanceof Set ? [...v] : v));
}

function loadSheet(idx) {
  saveCurrentSheet();
  activeSheetIdx = idx;
  cellData = JSON.parse(JSON.stringify(sheets[idx].cellData));
  colWidths = [...sheets[idx].colWidths];
  const dg = sheets[idx].dependencyGraph;
  dependencyGraph = {};
  for (const k in dg) {
    dependencyGraph[k] = new Set(dg[k]);
  }
  renderSheetTabs();
  buildGrid();
  selectCell(selectedCell.row, selectedCell.col);
  recalcAll();
}

function addSheet() {
  saveCurrentSheet();
  const name = 'Sheet' + (sheets.length + 1);
  sheets.push(createSheet(name));
  loadSheet(sheets.length - 1);
}

function renameSheet(idx) {
  const name = prompt('Rename sheet:', sheets[idx].name);
  if (name && name.trim()) {
    sheets[idx].name = name.trim();
    renderSheetTabs();
  }
}

function deleteSheet(idx) {
  if (sheets.length <= 1) { alert('Cannot delete the last sheet.'); return; }
  if (!confirm(`Delete "${sheets[idx].name}"?`)) return;
  sheets.splice(idx, 1);
  if (activeSheetIdx >= sheets.length) activeSheetIdx = sheets.length - 1;
  loadSheet(activeSheetIdx);
}

function renderSheetTabs() {
  const container = document.getElementById('tabs-container');
  container.innerHTML = '';
  sheets.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'sheet-tab' + (i === activeSheetIdx ? ' active' : '');
    btn.textContent = s.name;
    btn.onclick = () => loadSheet(i);
    btn.ondblclick = () => renameSheet(i);
    btn.oncontextmenu = (e) => {
      e.preventDefault();
      showSheetCtxMenu(e.clientX, e.clientY, i);
    };
    container.appendChild(btn);
  });
}

function showSheetCtxMenu(x, y, idx) {
  const menu = document.getElementById('ctx-menu');
  menu.style.display = 'block';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.innerHTML = `
    <div class="ctx-item" onclick="renameSheet(${idx});hideCtx()">Rename</div>
    <div class="ctx-item" onclick="deleteSheet(${idx});hideCtx()">Delete</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="moveSheet(${idx},-1);hideCtx()">Move Left</div>
    <div class="ctx-item" onclick="moveSheet(${idx},1);hideCtx()">Move Right</div>
  `;
}

function moveSheet(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sheets.length) return;
  saveCurrentSheet();
  [sheets[idx], sheets[newIdx]] = [sheets[newIdx], sheets[idx]];
  if (activeSheetIdx === idx) activeSheetIdx = newIdx;
  else if (activeSheetIdx === newIdx) activeSheetIdx = idx;
  loadSheet(activeSheetIdx);
}

function hideCtx() { document.getElementById('ctx-menu').style.display = 'none'; }

// ===== GRID BUILDING =====
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Set grid template
  const cols = ['40px'];
  for (let c = 0; c < NUM_COLS; c++) cols.push(colWidths[c] + 'px');
  grid.style.gridTemplateColumns = cols.join(' ');
  grid.style.gridTemplateRows = `24px repeat(${NUM_ROWS}, ${ROW_HEIGHT}px)`;

  // Corner
  const corner = document.createElement('div');
  corner.className = 'corner-header';
  corner.style.gridColumn = '1';
  corner.style.gridRow = '1';
  grid.appendChild(corner);

  // Column headers
  for (let c = 0; c < NUM_COLS; c++) {
    const ch = document.createElement('div');
    ch.className = 'col-header';
    ch.id = 'col-hdr-' + c;
    ch.style.gridColumn = c + 2;
    ch.style.gridRow = '1';
    ch.textContent = colName(c);

    // Resize handle
    const rh = document.createElement('div');
    rh.className = 'col-resize';
    rh.addEventListener('mousedown', (e) => startColResize(e, c));
    ch.appendChild(rh);

    grid.appendChild(ch);
  }

  // Row headers + cells
  for (let r = 0; r < NUM_ROWS; r++) {
    const rh = document.createElement('div');
    rh.className = 'row-header';
    rh.id = 'row-hdr-' + r;
    rh.style.gridColumn = '1';
    rh.style.gridRow = r + 2;
    rh.textContent = r + 1;
    grid.appendChild(rh);

    for (let c = 0; c < NUM_COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = 'cell-' + r + '-' + c;
      cell.style.gridColumn = c + 2;
      cell.style.gridRow = r + 2;
      cell.dataset.row = r;
      cell.dataset.col = c;

      // Events
      cell.addEventListener('mousedown', (e) => onCellMouseDown(e, r, c));
      cell.addEventListener('mouseover', (e) => onCellMouseOver(e, r, c));
      cell.addEventListener('dblclick', () => startEditing(r, c));

      grid.appendChild(cell);
    }
  }

  refreshAllCells();
}

function refreshAllCells() {
  for (let r = 0; r < NUM_ROWS; r++) {
    for (let c = 0; c < NUM_COLS; c++) {
      refreshCell(r, c);
    }
  }
}

function refreshCell(r, c) {
  const el = document.getElementById('cell-' + r + '-' + c);
  if (!el) return;
  const data = getCell(r, c);
  if (data) {
    el.textContent = data.value !== undefined ? data.value : '';
    el.className = 'cell';
    if (data.style) {
      if (data.style.bold) el.classList.add('bold');
      if (data.style.italic) el.classList.add('italic');
      if (data.style.bgColor) el.style.backgroundColor = data.style.bgColor;
      if (data.style.fontSize) el.style.fontSize = data.style.fontSize + 'px';
    }
  } else {
    el.textContent = '';
    el.className = 'cell';
    el.style.backgroundColor = '';
    el.style.fontSize = '';
  }
  // Re-apply selection
  if (r === selectedCell.row && c === selectedCell.col) {
    el.classList.add('selected');
  }
  if (selectionRange) {
    const { r1, c1, r2, c2 } = normalizeRange(selectionRange);
    if (r >= r1 && r <= r2 && c >= c1 && c <= c2 && !(r === selectedCell.row && c === selectedCell.col)) {
      el.classList.add('in-range');
    }
  }
}

// ===== CELL SELECTION =====
function selectCell(r, c) {
  // Clear previous selection
  document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('.cell.in-range').forEach(el => el.classList.remove('in-range'));
  document.querySelectorAll('.col-header.active').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.row-header.active').forEach(el => el.classList.remove('active'));

  selectedCell = { row: r, col: c };
  selectionRange = { r1: r, c1: c, r2: r, c2: c };

  const el = document.getElementById('cell-' + r + '-' + c);
  if (el) el.classList.add('selected');

  // Highlight headers
  const ch = document.getElementById('col-hdr-' + c);
  if (ch) ch.classList.add('active');
  const rh = document.getElementById('row-hdr-' + r);
  if (rh) rh.classList.add('active');

  // Update formula bar
  document.getElementById('cell-address').textContent = cellRef(r, c);
  const data = getCell(r, c);
  document.getElementById('formula-input').value = data ? (data.formula || data.value || '') : '';

  // Update toolbar state
  updateToolbarState();

  // Update status bar
  updateStatusBar();

  // Scroll into view
  scrollToCell(r, c);
}

function scrollToCell(r, c) {
  const el = document.getElementById('cell-' + r + '-' + c);
  if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function normalizeRange(rng) {
  return {
    r1: Math.min(rng.r1, rng.r2),
    c1: Math.min(rng.c1, rng.c2),
    r2: Math.max(rng.r1, rng.r2),
    c2: Math.max(rng.c1, rng.c2),
  };
}

function updateSelectionRange(r, c) {
  selectionRange.r2 = r;
  selectionRange.c2 = c;

  document.querySelectorAll('.cell.in-range').forEach(el => el.classList.remove('in-range'));
  const nr = normalizeRange(selectionRange);
  for (let rr = nr.r1; rr <= nr.r2; rr++) {
    for (let cc = nr.c1; cc <= nr.c2; cc++) {
      if (rr === selectedCell.row && cc === selectedCell.col) continue;
      const el = document.getElementById('cell-' + rr + '-' + cc);
      if (el) el.classList.add('in-range');
    }
  }
  updateStatusBar();
}

// ===== MOUSE EVENTS =====
function onCellMouseDown(e, r, c) {
  if (e.button === 2) return; // right click handled separately
  hideCtx();

  if (editingCell && (editingCell.row !== r || editingCell.col !== c)) {
    finishEditing();
  }

  if (e.shiftKey) {
    selectionRange.r2 = r;
    selectionRange.c2 = c;
    updateSelectionRange(r, c);
  } else {
    selectCell(r, c);
    isSelecting = true;
  }
  e.preventDefault();
}

function onCellMouseOver(e, r, c) {
  if (!isSelecting) return;
  updateSelectionRange(r, c);
}

document.addEventListener('mouseup', () => { isSelecting = false; });

// ===== CELL EDITING =====
function startEditing(r, c) {
  finishEditing();
  const el = document.getElementById('cell-' + r + '-' + c);
  if (!el) return;

  editingCell = { row: r, col: c };
  el.classList.add('editing');
  el.contentEditable = 'true';
  el.focus();

  const data = getCell(r, c);
  el.textContent = data ? (data.formula || data.value || '') : '';

  // Select all text
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);

  document.getElementById('formula-input').value = el.textContent;
}

function finishEditing() {
  if (!editingCell) return;
  const { row, col } = editingCell;
  const el = document.getElementById('cell-' + row + '-' + col);
  if (el) {
    el.contentEditable = 'false';
    el.classList.remove('editing');
    const raw = el.textContent.trim();
    setCellValue(row, col, raw);
  }
  editingCell = null;
}

function setCellValue(r, c, raw) {
  clearDependencies(r, c);

  if (raw.startsWith('=')) {
    setCellData(r, c, { formula: raw, value: '' });
    evaluateCell(r, c);
  } else {
    const num = parseFloat(raw);
    const val = raw === '' ? '' : (!isNaN(num) && raw.trim() !== '' ? num : raw);
    setCellData(r, c, { formula: '', value: val });
  }

  buildDependencies(r, c);
  refreshCell(r, c);
  recalcDependents(r, c);
  updateStatusBar();
}

// ===== FORMULA ENGINE =====
function evaluateCell(r, c) {
  const data = getCell(r, c);
  if (!data || !data.formula) return;

  try {
    const result = evalFormula(data.formula, r, c);
    data.value = result;
  } catch (e) {
    data.value = '#ERROR!';
  }
}

function evalFormula(formula, srcR, srcC) {
  let expr = formula.substring(1).trim();
  expr = expandRanges(expr);
  expr = resolveCellRefs(expr, srcR, srcC);
  // Safe eval
  const result = Function('"use strict"; return (' + expr + ')')();
  if (typeof result === 'number') {
    return Math.round(result * 1e10) / 1e10;
  }
  return result;
}

function expandRanges(expr) {
  // Replace SUM(A1:A10) etc with expanded arrays
  return expr.replace(/(SUM|AVERAGE|AVG|MIN|MAX|COUNT)\(([^)]+)\)/gi, (match, fn, args) => {
    const parts = args.split(',').map(a => a.trim());
    let values = [];
    parts.forEach(part => {
      if (part.includes(':')) {
        const [start, end] = part.split(':');
        const s = parseCellRef(start.toUpperCase());
        const e = parseCellRef(end.toUpperCase());
        if (s && e) {
          const r1 = Math.min(s.row, e.row), r2 = Math.max(s.row, e.row);
          const c1 = Math.min(s.col, e.col), c2 = Math.max(s.col, e.col);
          for (let rr = r1; rr <= r2; rr++) {
            for (let cc = c1; cc <= c2; cc++) {
              values.push(getCellValue(rr, cc));
            }
          }
        }
      } else {
        const ref = parseCellRef(part.toUpperCase());
        if (ref) {
          values.push(getCellValue(ref.row, ref.col));
        } else {
          values.push(parseFloat(part) || 0);
        }
      }
    });

    values = values.filter(v => v !== '' && v !== null && v !== undefined).map(v => typeof v === 'number' ? v : parseFloat(v)).filter(v => !isNaN(v));

    const fnUpper = fn.toUpperCase();
    if (fnUpper === 'SUM') return values.reduce((a, b) => a + b, 0);
    if (fnUpper === 'AVERAGE' || fnUpper === 'AVG') return values.length ? values.reduce((a, b) => a + b, 0) / values.length : 0;
    if (fnUpper === 'MIN') return values.length ? Math.min(...values) : 0;
    if (fnUpper === 'MAX') return values.length ? Math.max(...values) : 0;
    if (fnUpper === 'COUNT') return values.length;
    return 0;
  });
}

function resolveCellRefs(expr, srcR, srcC) {
  // Replace cell references like A1, B2 with their values
  return expr.replace(/\b([A-Z]+)(\d+)\b/gi, (match) => {
    const ref = parseCellRef(match.toUpperCase());
    if (!ref) return match;
    const val = getCellValue(ref.row, ref.col);
    if (val === '' || val === null || val === undefined) return '0';
    if (typeof val === 'number') return val;
    const num = parseFloat(val);
    return !isNaN(num) ? num : '"' + val.replace(/"/g, '\\"') + '"';
  });
}

// ===== DEPENDENCY TRACKING =====
function clearDependencies(r, c) {
  const key = cellKey(r, c);
  // Remove this cell from all dependency lists
  for (const k in dependencyGraph) {
    dependencyGraph[k].delete(key);
  }
}

function buildDependencies(r, c) {
  const data = getCell(r, c);
  if (!data || !data.formula) return;

  const key = cellKey(r, c);
  const expr = data.formula.substring(1);

  // Find all cell references
  const refs = expr.match(/\b([A-Z]+)(\d+)\b/gi) || [];
  refs.forEach(ref => {
    const parsed = parseCellRef(ref.toUpperCase());
    if (parsed) {
      const depKey = cellKey(parsed.row, parsed.col);
      if (!dependencyGraph[depKey]) dependencyGraph[depKey] = new Set();
      dependencyGraph[depKey].add(key);
    }
  });

  // Also find range references
  const ranges = expr.match(/\b([A-Z]+\d+):([A-Z]+\d+)\b/gi) || [];
  ranges.forEach(range => {
    const [start, end] = range.split(':');
    const s = parseCellRef(start.toUpperCase());
    const e = parseCellRef(end.toUpperCase());
    if (s && e) {
      const r1 = Math.min(s.row, e.row), r2 = Math.max(s.row, e.row);
      const c1 = Math.min(s.col, e.col), c2 = Math.max(s.col, e.col);
      for (let rr = r1; rr <= r2; rr++) {
        for (let cc = c1; cc <= c2; cc++) {
          const depKey = cellKey(rr, cc);
          if (!dependencyGraph[depKey]) dependencyGraph[depKey] = new Set();
          dependencyGraph[depKey].add(key);
        }
      }
    }
  });
}

function recalcDependents(r, c) {
  const key = cellKey(r, c);
  const deps = dependencyGraph[key];
  if (!deps) return;

  const visited = new Set();
  const queue = [...deps];

  while (queue.length > 0) {
    const depKey = queue.shift();
    if (visited.has(depKey)) continue;
    visited.add(depKey);

    const [dr, dc] = depKey.split(',').map(Number);
    const data = getCell(dr, dc);
    if (data && data.formula) {
      evaluateCell(dr, dc);
      refreshCell(dr, dc);
      // Add dependents of this cell
      const subDeps = dependencyGraph[depKey];
      if (subDeps) queue.push(...subDeps);
    }
  }
}

function recalcAll() {
  for (const key in cellData) {
    const data = cellData[key];
    if (data && data.formula) {
      const [r, c] = key.split(',').map(Number);
      evaluateCell(r, c);
      refreshCell(r, c);
    }
  }
}

// ===== COLUMN RESIZE =====
let resizingCol = -1, resizeStartX = 0, resizeStartW = 0;

function startColResize(e, col) {
  e.preventDefault();
  e.stopPropagation();
  resizingCol = col;
  resizeStartX = e.clientX;
  resizeStartW = colWidths[col];
  e.target.classList.add('active');
  document.addEventListener('mousemove', onColResize);
  document.addEventListener('mouseup', stopColResize);
}

function onColResize(e) {
  if (resizingCol < 0) return;
  const diff = e.clientX - resizeStartX;
  colWidths[resizingCol] = Math.max(40, resizeStartW + diff);
  buildGrid();
  selectCell(selectedCell.row, selectedCell.col);
}

function stopColResize() {
  resizingCol = -1;
  document.querySelectorAll('.col-resize.active').forEach(el => el.classList.remove('active'));
  document.removeEventListener('mousemove', onColResize);
  document.removeEventListener('mouseup', stopColResize);
}

// ===== KEYBOARD NAVIGATION =====
document.addEventListener('keydown', (e) => {
  // Context menu
  hideCtx();

  // If editing in cell
  if (editingCell) {
    if (e.key === 'Enter') {
      e.preventDefault();
      finishEditing();
      moveSelection(1, 0);
      return;
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      finishEditing();
      moveSelection(0, 1);
      return;
    }
    if (e.key === 'Escape') {
      const el = document.getElementById('cell-' + editingCell.row + '-' + editingCell.col);
      if (el) {
        el.contentEditable = 'false';
        el.classList.remove('editing');
        refreshCell(editingCell.row, editingCell.col);
      }
      editingCell = null;
      return;
    }
    return;
  }

  // If formula bar focused
  if (formulaInputFocused) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = document.getElementById('formula-input').value;
      setCellValue(selectedCell.row, selectedCell.col, val);
      refreshCell(selectedCell.row, selectedCell.col);
      document.getElementById('formula-input').blur();
      formulaInputFocused = false;
      moveSelection(1, 0);
      return;
    }
    if (e.key === 'Escape') {
      document.getElementById('formula-input').blur();
      formulaInputFocused = false;
      const data = getCell(selectedCell.row, selectedCell.col);
      document.getElementById('formula-input').value = data ? (data.formula || data.value || '') : '';
      return;
    }
    return;
  }

  // Normal navigation
  if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1, 0); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1, 0); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); moveSelection(0, -1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); moveSelection(0, 1); }
  else if (e.key === 'Tab') { e.preventDefault(); moveSelection(0, e.shiftKey ? -1 : 1); }
  else if (e.key === 'Enter') { e.preventDefault(); moveSelection(1, 0); }
  else if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    clearSelectedCells();
  }
  else if (e.key === 'F2') {
    e.preventDefault();
    startEditing(selectedCell.row, selectedCell.col);
  }
  else if (e.ctrlKey && e.key === 'b') {
    e.preventDefault();
    toggleBold();
  }
  else if (e.ctrlKey && e.key === 'i') {
    e.preventDefault();
    toggleItalic();
  }
  else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
    // Start typing in cell
    startEditing(selectedCell.row, selectedCell.col);
    const el = document.getElementById('cell-' + selectedCell.row + '-' + selectedCell.col);
    if (el) {
      el.textContent = e.key;
      // Place cursor at end
      const range = document.createRange();
      range.setStart(el.firstChild || el, 0);
      range.collapse(false);
    }
  }
});

function moveSelection(dr, dc) {
  const nr = Math.max(0, Math.min(NUM_ROWS - 1, selectedCell.row + dr));
  const nc = Math.max(0, Math.min(NUM_COLS - 1, selectedCell.col + dc));
  selectCell(nr, nc);
}

function clearSelectedCells() {
  if (!selectionRange) {
    setCellValue(selectedCell.row, selectedCell.col, '');
    refreshCell(selectedCell.row, selectedCell.col);
    return;
  }
  const nr = normalizeRange(selectionRange);
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      setCellValue(r, c, '');
      refreshCell(r, c);
    }
  }
  document.getElementById('formula-input').value = '';
}

// ===== FORMULA BAR =====
const formulaInput = document.getElementById('formula-input');
formulaInput.addEventListener('focus', () => { formulaInputFocused = true; });
formulaInput.addEventListener('blur', () => { formulaInputFocused = false; });

// Click cells while editing formula to insert references
let formulaClickInsert = false;
formulaInput.addEventListener('focus', () => {
  formulaClickInsert = true;
});

document.getElementById('grid').addEventListener('mousedown', (e) => {
  if (formulaClickInsert && formulaInputFocused) {
    const cell = e.target.closest('.cell');
    if (cell) {
      const r = parseInt(cell.dataset.row);
      const c = parseInt(cell.dataset.col);
      const ref = cellRef(r, c);
      const pos = formulaInput.selectionStart;
      const val = formulaInput.value;
      formulaInput.value = val.slice(0, pos) + ref + val.slice(pos);
      formulaInput.selectionStart = formulaInput.selectionEnd = pos + ref.length;
      formulaInput.focus();
      e.preventDefault();
    }
  }
});

// ===== TOOLBAR ACTIONS =====
function updateToolbarState() {
  const data = getCell(selectedCell.row, selectedCell.col);
  const boldBtn = document.getElementById('btn-bold');
  const italicBtn = document.getElementById('btn-italic');
  boldBtn.classList.toggle('active', data && data.style && data.style.bold);
  italicBtn.classList.toggle('active', data && data.style && data.style.italic);
}

function toggleBold() {
  if (!selectionRange) {
    applyStyle(selectedCell.row, selectedCell.col, 'bold');
    return;
  }
  const nr = normalizeRange(selectionRange);
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      applyStyle(r, c, 'bold');
    }
  }
  updateToolbarState();
}

function toggleItalic() {
  if (!selectionRange) {
    applyStyle(selectedCell.row, selectedCell.col, 'italic');
    return;
  }
  const nr = normalizeRange(selectionRange);
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      applyStyle(r, c, 'italic');
    }
  }
  updateToolbarState();
}

function applyStyle(r, c, prop) {
  const data = getCell(r, c);
  if (!data) setCellData(r, c, { value: '', formula: '', style: {} });
  const cell = getCell(r, c);
  if (!cell.style) cell.style = {};
  cell.style[prop] = !cell.style[prop];
  refreshCell(r, c);
}

function applyBgColor(color) {
  const nr = selectionRange ? normalizeRange(selectionRange) : { r1: selectedCell.row, c1: selectedCell.col, r2: selectedCell.row, c2: selectedCell.col };
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      const data = getCell(r, c);
      if (!data) setCellData(r, c, { value: '', formula: '', style: {} });
      getCell(r, c).style.bgColor = color;
      refreshCell(r, c);
    }
  }
}

function clearColor() {
  const nr = selectionRange ? normalizeRange(selectionRange) : { r1: selectedCell.row, c1: selectedCell.col, r2: selectedCell.row, c2: selectedCell.col };
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      const data = getCell(r, c);
      if (data && data.style) {
        data.style.bgColor = '';
        refreshCell(r, c);
      }
    }
  }
}

function applyFontSize(size) {
  const nr = selectionRange ? normalizeRange(selectionRange) : { r1: selectedCell.row, c1: selectedCell.col, r2: selectedCell.row, c2: selectedCell.col };
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      const data = getCell(r, c);
      if (!data) setCellData(r, c, { value: '', formula: '', style: {} });
      getCell(r, c).style.fontSize = parseInt(size);
      refreshCell(r, c);
    }
  }
}

// Toolbar event bindings
document.getElementById('btn-bold').onclick = toggleBold;
document.getElementById('btn-italic').onclick = toggleItalic;
document.getElementById('btn-clear').onclick = clearSelectedCells;
document.getElementById('color-picker').oninput = (e) => applyBgColor(e.target.value);
document.getElementById('btn-clear-color').onclick = clearColor;
document.getElementById('font-size-select').onchange = (e) => applyFontSize(e.target.value);

// ===== CSV DOWNLOAD =====
document.getElementById('btn-download').onclick = () => {
  let csv = '';
  // Find used range
  let maxR = 0, maxC = 0;
  for (const key in cellData) {
    const [r, c] = key.split(',').map(Number);
    if (cellData[key].value !== '' || cellData[key].formula !== '') {
      maxR = Math.max(maxR, r);
      maxC = Math.max(maxC, c);
    }
  }
  for (let r = 0; r <= maxR; r++) {
    const row = [];
    for (let c = 0; c <= maxC; c++) {
      let val = getCellValue(r, c);
      val = String(val);
      if (val.includes(',') || val.includes('"') || val.includes('\n')) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      row.push(val);
    }
    csv += row.join(',') + '\n';
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = sheets[activeSheetIdx].name + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ===== CSV UPLOAD =====
document.getElementById('btn-upload').onclick = () => {
  document.getElementById('csv-upload').click();
};

document.getElementById('csv-upload').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const text = ev.target.result;
    const lines = text.split('\n');
    lines.forEach((line, r) => {
      if (r >= NUM_ROWS) return;
      // Simple CSV parse
      const cols = parseCSVLine(line);
      cols.forEach((val, c) => {
        if (c >= NUM_COLS) return;
        setCellValue(r, c, val.trim());
        refreshCell(r, c);
      });
    });
    selectCell(0, 0);
  };
  reader.readAsText(file);
  e.target.value = '';
};

function parseCSVLine(line) {
  const result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQuotes) {
      if (ch === '"' && line[i + 1] === '"') {
        current += '"';
        i++;
      } else if (ch === '"') {
        inQuotes = false;
      } else {
        current += ch;
      }
    } else {
      if (ch === '"') {
        inQuotes = true;
      } else if (ch === ',') {
        result.push(current);
        current = '';
      } else {
        current += ch;
      }
    }
  }
  result.push(current);
  return result;
}

// ===== STATUS BAR =====
function updateStatusBar() {
  const info = document.getElementById('status-info');
  const calc = document.getElementById('status-calc');

  if (!selectionRange || (selectionRange.r1 === selectionRange.r2 && selectionRange.c1 === selectionRange.c2)) {
    info.textContent = 'Ready';
    calc.textContent = '';
    return;
  }

  const nr = normalizeRange(selectionRange);
  let values = [];
  let count = 0;
  for (let r = nr.r1; r <= nr.r2; r++) {
    for (let c = nr.c1; c <= nr.c2; c++) {
      const v = getCellValue(r, c);
      if (v !== '' && v !== null && v !== undefined) {
        count++;
        const num = typeof v === 'number' ? v : parseFloat(v);
        if (!isNaN(num)) values.push(num);
      }
    }
  }

  let stats = [`Count: ${count}`];
  if (values.length > 0) {
    const sum = values.reduce((a, b) => a + b, 0);
    const avg = sum / values.length;
    stats.push(`Sum: ${Math.round(sum * 100) / 100}`);
    stats.push(`Average: ${Math.round(avg * 100) / 100}`);
    stats.push(`Min: ${Math.min(...values)}`);
    stats.push(`Max: ${Math.max(...values)}`);
  }
  calc.textContent = stats.join('   ');
}

// ===== CONTEXT MENU =====
document.getElementById('grid').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const cell = e.target.closest('.cell');
  if (!cell) return;

  const r = parseInt(cell.dataset.row);
  const c = parseInt(cell.dataset.col);
  selectCell(r, c);

  const menu = document.getElementById('ctx-menu');
  menu.style.display = 'block';
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.innerHTML = `
    <div class="ctx-item" onclick="startEditing(${r},${c});hideCtx()">✏️ Edit Cell</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="toggleBold();hideCtx()"><b>B</b> Toggle Bold</div>
    <div class="ctx-item" onclick="toggleItalic();hideCtx()"><i>I</i> Toggle Italic</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="clearSelectedCells();hideCtx()">🗑️ Clear Contents</div>
  `;
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#ctx-menu')) hideCtx();
});

// ===== INITIALIZATION =====
function init() {
  // Create first sheet
  sheets.push(createSheet('Sheet1'));
  colWidths = [...sheets[0].colWidths];
  cellData = {};
  dependencyGraph = {};

  buildGrid();
  renderSheetTabs();
  selectCell(0, 0);

  // Add some sample data
  setCellValue(0, 0, 'Item');
  setCellValue(0, 1, 'Quantity');
  setCellValue(0, 2, 'Price');
  setCellValue(0, 3, 'Total');
  setCellValue(1, 0, 'Apples');
  setCellValue(1, 1, '5');
  setCellValue(1, 2, '1.50');
  setCellValue(1, 3, '=B2*C2');
  setCellValue(2, 0, 'Bananas');
  setCellValue(2, 1, '3');
  setCellValue(2, 2, '0.75');
  setCellValue(2, 3, '=B3*C3');
  setCellValue(3, 0, 'Cherries');
  setCellValue(3, 1, '2');
  setCellValue(3, 2, '3.00');
  setCellValue(3, 3, '=B4*C4');
  setCellValue(4, 0, 'Total');
  setCellValue(4, 3, '=SUM(D2:D4)');
  setCellValue(5, 0, 'Average');
  setCellValue(5, 3, '=AVERAGE(D2:D4)');

  // Apply some styling
  for (let c = 0; c < 4; c++) {
    const data = getCell(0, c);
    if (data) data.style.bold = true;
  }
  const totalData = getCell(4, 0);
  if (totalData) totalData.style.bold = true;
  const avgData = getCell(5, 0);
  if (avgData) avgData.style.bold = true;

  refreshAllCells();
  selectCell(0, 0);
}

init();
