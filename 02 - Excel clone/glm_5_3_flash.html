<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridline — Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f1; --chrome:#fafaf7; --panel:#ffffff;
    --ink:#20241f; --muted:#78806f; --faint:#a9af9e;
    --line:#dcded2; --grid:#e6e8df;
    --head:#f2f3ec; --head-ink:#6d7462;
    --accent:#17683e; --accent-deep:#0f5432; --accent-soft:rgba(23,104,62,.10);
    --ref-soft:rgba(201,151,47,.16); --ref-line:rgba(176,128,26,.5);
    --err:#b3372e;
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,monospace;
    --sans:'Instrument Sans','Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.4 var(--sans)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* ---------- top bar ---------- */
  .topbar{flex:none;display:flex;align-items:center;gap:14px;height:46px;padding:0 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;user-select:none;flex:none}
  .brand svg{display:block}
  .toolbar{display:flex;align-items:center;gap:2px;flex:1;min-width:0;overflow-x:auto;user-select:none;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .tsep{flex:none;width:1px;height:20px;background:var(--line);margin:0 6px}
  .tbtn{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:7px;color:#3c4237;transition:background .12s}
  .tbtn:hover{background:#eceede}
  .tbtn:active{background:#e2e5d8}
  .tbtn.on{background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px rgba(23,104,62,.28)}
  .tbtn svg{flex:none}
  .glyph-b{width:16px;text-align:center;font-weight:700;font-size:14px}
  .glyph-i{width:16px;text-align:center;font-family:Georgia,serif;font-style:italic;font-weight:600;font-size:15px}
  .fill-chip{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.18);background:transparent}
  .tbtn-label{font-size:12.5px;font-weight:500}

  /* ---------- formula bar ---------- */
  .fxbar{flex:none;display:flex;align-items:stretch;height:34px;background:var(--chrome);border-bottom:1px solid var(--line)}
  .namebox{flex:none;width:96px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--accent-deep);background:var(--head);border-right:1px solid var(--line);user-select:none}
  .fx-label{flex:none;width:42px;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-style:italic;font-size:14px;color:var(--faint);border-right:1px solid var(--line);user-select:none}
  .fx-wrap{flex:1;min-width:0;display:flex;align-items:center}
  #fxInput{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;padding:0 10px;font-family:var(--mono);font-size:12.5px;color:var(--ink);caret-color:var(--accent)}
  #fxInput::placeholder{color:var(--faint)}
  .fx-act{display:none;gap:2px;padding-right:6px}
  .fx-wrap.editing .fx-act{display:flex}
  .fx-act button{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .fx-act button:hover{background:#eceede;color:var(--ink)}
  .fx-act .ok{color:var(--accent)}

  /* ---------- grid ---------- */
  .grid-area{flex:1;min-height:0;display:grid;grid-template-columns:48px 1fr;grid-template-rows:28px 1fr;background:var(--panel)}
  .corner{grid-column:1;grid-row:1;display:flex;align-items:center;justify-content:center;background:var(--head);border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--faint);cursor:pointer;z-index:6}
  .corner:hover{color:var(--accent-deep)}
  .colhead-clip{grid-column:2;grid-row:1;position:relative;overflow:hidden;background:var(--head);border-bottom:1px solid var(--line);z-index:5}
  .rowhead-clip{grid-column:1;grid-row:2;position:relative;overflow:hidden;background:var(--head);border-right:1px solid var(--line);z-index:5}
  #colStrip,#rowStrip{position:absolute;top:0;left:0;will-change:transform}
  #colStrip{height:100%}
  #rowStrip{width:100%}
  .colhead,.rowhead{position:absolute;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:500;color:var(--head-ink);background:var(--head);user-select:none;cursor:pointer}
  .colhead{top:0;height:100%;border-right:1px solid var(--line)}
  .rowhead{left:0;width:100%;border-bottom:1px solid var(--line)}
  .colhead:hover,.rowhead:hover{background:#e9ebdf;color:#525a48}
  .colhead.hl,.rowhead.hl{background:#dfe9dd;color:var(--accent-deep);font-weight:600}
  .grip{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:2}
  .grip::after{content:'';position:absolute;right:3px;top:22%;height:56%;width:2px;border-radius:2px;background:transparent}
  .grip:hover::after{background:var(--accent)}
  body.col-resizing{cursor:col-resize;user-select:none}
  body.col-resizing .grip::after{background:var(--accent)}

  .scroller{grid-column:2;grid-row:2;position:relative;overflow:auto;outline:none}
  .scroller::-webkit-scrollbar{width:12px;height:12px}
  .scroller::-webkit-scrollbar-thumb{background:#c9cdbc;border-radius:8px;border:3px solid #fff}
  .scroller::-webkit-scrollbar-thumb:hover{background:#b3b8a5}
  .canvas{position:relative}
  #cellLayer{position:absolute;inset:0;z-index:1}
  .cell{position:absolute;display:flex;align-items:center;padding:0 7px;font-size:13px;color:var(--ink);border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);white-space:nowrap;overflow:hidden;background:transparent;user-select:none;cursor:cell}
  .cell.num{justify-content:flex-end;font-variant-numeric:tabular-nums}
  .cell.bool{justify-content:center;font-weight:500;letter-spacing:.03em;color:#5a5f52}
  .cell.err{color:var(--err);font-weight:500;font-size:12px}
  .cell.b{font-weight:700}
  .cell.i{font-style:italic}

  #hlLayer{position:absolute;inset:0;z-index:10;pointer-events:none}
  #selLayer{position:absolute;inset:0;z-index:20;pointer-events:none}
  .sel-fill{position:absolute;display:none;background:var(--accent-soft)}
  .ref-hl{position:absolute;background:var(--ref-soft);border:1px solid var(--ref-line)}
  .sel-outline{position:absolute;display:none;border:1px solid rgba(23,104,62,.55)}
  .sel-active{position:absolute;display:none;border:2px solid var(--accent);border-radius:1px}

  .cell-editor{position:absolute;z-index:30;display:none;border:2px solid var(--accent);border-radius:1px;outline:0;background:#fff;padding:0 6px;font-size:13px;color:var(--ink);caret-color:var(--accent);box-shadow:0 6px 18px rgba(25,30,22,.18)}
  .cell-editor.open{display:block}

  /* ---------- bottom bar ---------- */
  .bottombar{flex:none;display:flex;align-items:center;gap:12px;height:36px;padding:0 8px;background:var(--chrome);border-top:1px solid var(--line)}
  .tabs{flex:1;min-width:0;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;user-select:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;border:1px solid transparent;font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer}
  .tab:hover{background:#eceede;color:var(--ink)}
  .tab.active{background:#fff;border-color:var(--line);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(25,30,22,.06)}
  .tab-x{width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--faint);opacity:0;transition:opacity .12s}
  .tab.active .tab-x{opacity:1}
  .tab-x:hover{background:#f3d9d5;color:var(--err)}
  .tab-add{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .tab-add:hover{background:#eceede;color:var(--accent-deep)}
  .tab-rename{width:92px;font-size:12.5px;padding:2px 6px;border:1px solid var(--accent);border-radius:5px;outline:0;background:#fff}
  .hint{flex:none;font-size:11.5px;color:var(--faint);white-space:nowrap;user-select:none}
  .hint b{font-family:var(--mono);font-weight:500;color:var(--muted)}
  .stats{flex:none;display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
  .stats b{color:var(--ink);font-weight:500}

  /* ---------- palette / modal / toast ---------- */
  .palette{position:fixed;z-index:60;width:198px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(25,30,22,.18)}
  .palette h4{margin:0 0 9px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .sw{width:26px;height:26px;border-radius:7px;border:1px solid rgba(0,0,0,.12);transition:transform .1s}
  .sw:hover{transform:scale(1.14);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--accent)}
  .no-fill{margin-top:10px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px;border:1px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
  .no-fill:hover{color:var(--ink);border-color:var(--muted)}

  .veil{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(22,26,20,.42);opacity:0;pointer-events:none;transition:opacity .15s}
  .veil.open{opacity:1;pointer-events:auto}
  .modal{width:min(360px,calc(100vw - 40px));padding:20px;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(15,20,14,.3);transform:translateY(8px) scale(.98);transition:.15s}
  .veil.open .modal{transform:none}
  .modal h3{margin:0 0 6px;font-size:15px;font-weight:600}
  .modal p{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--muted)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px}
  .btn{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500}
  .btn.ghost{border:1px solid var(--line)}
  .btn.ghost:hover{background:#f0f2ea}
  .btn.solid{background:var(--accent);color:#fff}
  .btn.solid:hover{background:var(--accent-deep)}

  #toasts{position:fixed;left:50%;bottom:52px;z-index:90;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  .toast{padding:9px 16px;border-radius:9px;background:#262b22;color:#f2f3ec;font-size:12.5px;box-shadow:0 10px 28px rgba(15,20,14,.35);animation:tin .22s cubic-bezier(.2,.9,.3,1.2)}
  .toast.out{opacity:0;transform:translateY(6px);transition:.25s}
  @keyframes tin{from{opacity:0;transform:translateY(10px) scale(.96)}}

  @media (max-width:900px){.hint{display:none}}
  @media (max-width:760px){
    .bname,.tbtn-label{display:none}
    .namebox{width:72px}
    .grid-area{grid-template-columns:40px 1fr}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 24 24"><rect x="2.5" y="2.5" width="19" height="19" rx="5" fill="#17683e"/><path d="M2.5 9.2h19M9.2 2.5v19" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
    <span class="bname">Gridline</span>
  </div>
  <div class="toolbar">
    <button class="tbtn" id="btnBold" title="Bold (Ctrl+B)"><span class="glyph-b">B</span></button>
    <button class="tbtn" id="btnItalic" title="Italic (Ctrl+I)"><span class="glyph-i">I</span></button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnFill" title="Fill color">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5s5.5 6 5.5 9.7a5.5 5.5 0 0 1-11 0C6.5 9.5 12 3.5 12 3.5Z"/></svg>
      <span class="fill-chip" id="fillChip"></span>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 10 5 5 5-5"/></svg>
    </button>
    <button class="tbtn" id="btnClear" title="Clear cells (contents & formatting)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 20.5h9"/><path d="M3.8 15.4 12.4 6.8a2 2 0 0 1 2.8 0l2.4 2.4a2 2 0 0 1 0 2.8l-6.6 6.6a2 2 0 0 1-1.4.6H6.6a2 2 0 0 1-1.4-.6l-1.4-1.4a2 2 0 0 1 0-2.8Z"/><path d="m9.3 9.9 5.8 5.8"/></svg>
    </button>
    <span class="tsep"></span>
    <button class="tbtn" id="btnExport" title="Download the active sheet as a CSV file">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v9.5"/><path d="m8 10 4 4 4-4"/><path d="M4.5 16.5v1.7a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-1.7"/></svg>
      <span class="tbtn-label">Export CSV</span>
    </button>
    <button class="tbtn" id="btnImport" title="Import a CSV file into the active sheet">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V4.5"/><path d="m8 8.5 4-4 4 4"/><path d="M4.5 16.5v1.7a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-1.7"/></svg>
      <span class="tbtn-label">Import CSV</span>
    </button>
    <input type="file" id="fileInput" accept=".csv,text/csv,text/plain" hidden>
  </div>
</header>

<div class="fxbar">
  <div class="namebox" id="nameBox">A1</div>
  <div class="fx-label" title="Formula">fx</div>
  <div class="fx-wrap" id="fxWrap">
    <input id="fxInput" spellcheck="false" autocomplete="off" placeholder="Enter a value or a formula — e.g. =SUM(A1:A9)">
    <div class="fx-act">
      <button id="fxOk" class="ok" title="Accept (Enter)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></button>
      <button id="fxCancel" title="Cancel (Esc)"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
</div>

<div class="grid-area">
  <div class="corner" id="corner" title="Select all">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg>
  </div>
  <div class="colhead-clip"><div id="colStrip"></div></div>
  <div class="rowhead-clip"><div id="rowStrip"></div></div>
  <div class="scroller" id="scroller" tabindex="-1">
    <div class="canvas" id="canvas">
      <div id="cellLayer"></div>
      <div id="hlLayer"><div class="sel-fill" id="selFill"></div></div>
      <div id="selLayer"><div class="sel-outline" id="selOutline"></div><div class="sel-active" id="selActive"></div></div>
      <input class="cell-editor" id="cellEditor" spellcheck="false" autocomplete="off">
    </div>
  </div>
</div>

<div class="bottombar">
  <div class="tabs" id="tabs"></div>
  <div class="hint">Type <b>=</b> for formulas · click or drag cells while editing to insert references</div>
  <div class="stats" id="stats"></div>
</div>

<div class="palette" id="palette" style="display:none">
  <h4>Fill color</h4>
  <div class="swatches" id="swatches"></div>
  <button class="no-fill" id="noFill">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19 19 5"/></svg>
    No fill
  </button>
</div>

<div class="veil" id="veil">
  <div class="modal">
    <h3 id="mTitle"></h3>
    <p id="mBody"></p>
    <div class="modal-actions">
      <button class="btn ghost" id="mCancel">Cancel</button>
      <button class="btn solid" id="mOk">Delete</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
'use strict';
/* ================= constants & state ================= */
const ROWS = 500, COLS = 40, ROW_H = 26, DEF_W = 96, MIN_W = 44, MAX_W = 420;
const $ = id => document.getElementById(id);
const scroller=$('scroller'), canvas=$('canvas'), cellLayer=$('cellLayer'), hlLayer=$('hlLayer'),
      colStrip=$('colStrip'), rowStrip=$('rowStrip'),
      selFill=$('selFill'), selOutline=$('selOutline'), selActive=$('selActive'),
      cellEditor=$('cellEditor'), fxInput=$('fxInput'), fxWrap=$('fxWrap'),
      nameBox=$('nameBox'), statsEl=$('stats'), tabsEl=$('tabs'), veil=$('veil'), fileInput=$('fileInput');

const X_SVG='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const PLUS_SVG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const SWATCHES=['#17683e','#4c9f70','#a7cfb6','#e6f0e6','#c9972f','#e5c26a','#f6ecd4','#a33b2e','#d98a6a','#f4ded2','#3c5876','#93a8bf','#dde6ee','#5b6470','#9aa294','#e9ebe2'];

function makeSheet(name){ return { name, cells:{}, colW:new Array(COLS).fill(DEF_W), sel:null }; }
const wb = { sheets:[makeSheet('Sheet1')], active:0 };
const sheet = () => wb.sheets[wb.active];

let sel = { ar:0,ac:0, r1:0,c1:0, r2:0,c2:0 };  // ar/ac = active cell, r1/c1 = anchor, r2/c2 = extent
let edit = null;   // {r,c,viaBar,refSpan:{start,end},lastAnchor,lastTime}
let drag = null;
let colX=[], rowY=[], totalW=0, totalH=0;
let geomV=0, valV=0, lastCellSig='';
let hlRefs=[];

/* ================= small utils ================= */
const key=(r,c)=>r+','+c;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function colName(c){let s='';c++;while(c>0){c--;s=String.fromCharCode(65+c%26)+s;c=(c/26)|0;}return s;}
function colFromName(s){let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1;}
const refName=(r,c)=>colName(c)+(r+1);

/* ================= formula engine ================= */
const ERRV=e=>({err:e});
const isErr=v=>!!(v&&typeof v==='object'&&v.err);

function tokenize(src){
  const toks=[]; let i=0; const n=src.length;
  while(i<n){
    const ch=src[i];
    if(ch===' '||ch==='\t'){i++;continue;}
    if((ch>='0'&&ch<='9')||(ch==='.'&&/[0-9]/.test(src[i+1]||''))){
      const m=/^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(src.slice(i));
      if(!m) throw ERRV('#ERROR!');
      toks.push({t:'num',v:parseFloat(m[0])}); i+=m[0].length; continue;
    }
    if(ch==='"'){
      let j=i+1,s='';
      while(j<n&&src[j]!=='"'){s+=src[j];j++;}
      if(j>=n) throw ERRV('#ERROR!');
      toks.push({t:'str',v:s}); i=j+1; continue;
    }
    if(/[A-Za-z$]/.test(ch)){
      const m=/^[A-Za-z$][A-Za-z0-9$.]*/.exec(src.slice(i));
      const word=m[0]; i+=word.length;
      const rm=/^\$?([A-Za-z]{1,3})\$?(\d+)$/.exec(word);
      if(rm) toks.push({t:'ref',c:colFromName(rm[1].toUpperCase()),r:parseInt(rm[2],10)-1});
      else toks.push({t:'name',v:word.toUpperCase()});
      continue;
    }
    const two=src.slice(i,i+2);
    if(two==='<='||two==='>='||two==='<>'){toks.push({t:'op',v:two});i+=2;continue;}
    if('+-*/^()<>=:,'.includes(ch)){toks.push({t:'op',v:ch});i++;continue;}
    throw ERRV('#ERROR!');
  }
  return toks;
}

function parseFormula(src){
  const tk=tokenize(src); let p=0;
  const peek=()=>tk[p];
  const isOp=v=>tk[p]&&tk[p].t==='op'&&tk[p].v===v;
  const eat=v=>{if(isOp(v)){p++;return true;}return false;};
  const expect=v=>{if(!eat(v))throw ERRV('#ERROR!');};
  const CMP_OPS=['=','<>','<','<=','>','>='];

  function cmp(){let a=add();while(tk[p]&&tk[p].t==='op'&&CMP_OPS.includes(tk[p].v)){const op=tk[p++].v;a={t:'cmp',op,a,b:add()};}return a;}
  function add(){let a=mul();while(isOp('+')||isOp('-')){const op=tk[p++].v;a={t:'bin',op,a,b:mul()};}return a;}
  function mul(){let a=un();while(isOp('*')||isOp('/')){const op=tk[p++].v;a={t:'bin',op,a,b:un()};}return a;}
  function un(){if(eat('-'))return{t:'neg',a:un()};if(eat('+'))return un();return pw();}
  function pw(){const b=prim();if(eat('^'))return{t:'bin',op:'^',a:b,b:un()};return b;}
  function prim(){
    const t=peek(); if(!t)throw ERRV('#ERROR!');
    if(t.t==='num'){p++;return{t:'num',v:t.v};}
    if(t.t==='str'){p++;return{t:'str',v:t.v};}
    if(t.t==='ref'){
      p++;
      if(eat(':')){const t2=peek();if(!t2||t2.t!=='ref')throw ERRV('#ERROR!');p++;
        return{t:'range',r1:Math.min(t.r,t2.r),c1:Math.min(t.c,t2.c),r2:Math.max(t.r,t2.r),c2:Math.max(t.c,t2.c)};}
      return{t:'ref',r:t.r,c:t.c};
    }
    if(t.t==='name'){
      p++;
      if(t.v==='TRUE')return{t:'bool',v:true};
      if(t.v==='FALSE')return{t:'bool',v:false};
      expect('('); const args=[];
      if(!eat(')')){do{args.push(cmp());}while(eat(','));expect(')');}
      return{t:'call',fn:t.v,args};
    }
    if(eat('(')){const e=cmp();expect(')');return e;}
    throw ERRV('#ERROR!');
  }
  const ast=cmp();
  if(p<tk.length)throw ERRV('#ERROR!');
  return ast;
}

function toNum(v){
  if(isErr(v))return v;
  if(typeof v==='number')return v;
  if(v===null||v==='')return 0;
  if(typeof v==='boolean')return v?1:0;
  const n=Number(v);
  return (String(v).trim()!==''&&!isNaN(n))?n:ERRV('#VALUE!');
}
const numOrNull=v=>{const n=toNum(v);return isErr(n)?NaN:n;};

function fmtNum(n){
  if(!isFinite(n))return '#NUM!';
  if(n!==0&&(Math.abs(n)>=1e12||Math.abs(n)<1e-9))return n.toExponential(4);
  return String(parseFloat(n.toPrecision(12)));
}
function display(v){
  if(v==null||v==='')return '';
  if(typeof v==='number')return fmtNum(v);
  if(typeof v==='boolean')return v?'TRUE':'FALSE';
  if(isErr(v))return v.err;
  return String(v);
}

function compare(a,b,op){
  const x=numOrNull(a),y=numOrNull(b);
  let r;
  if(!isNaN(x)&&!isNaN(y))r=x<y?-1:x>y?1:0;
  else{const s1=String(display(a)).toLowerCase(),s2=String(display(b)).toLowerCase();r=s1<s2?-1:s1>s2?1:0;}
  switch(op){case '=':return r===0;case '<>':return r!==0;case '<':return r<0;
             case '<=':return r<=0;case '>':return r>0;case '>=':return r>=0;}
}

function evalNode(nd){
  switch(nd.t){
    case 'num':case 'str':case 'bool':return nd.v;
    case 'ref':
      if(nd.r<0||nd.r>=ROWS||nd.c<0||nd.c>=COLS)return ERRV('#REF!');
      return valueOf(nd.r,nd.c);
    case 'range':{
      if(nd.r1<0||nd.c1<0||nd.r2>=ROWS||nd.c2>=COLS)return ERRV('#REF!');
      const vals=[];
      for(let r=nd.r1;r<=nd.r2;r++)for(let c=nd.c1;c<=nd.c2;c++)vals.push(valueOf(r,c));
      return{rng:vals};
    }
    case 'neg':{const a=toNum(evalNode(nd.a));return isErr(a)?a:-a;}
    case 'bin':{
      const a=evalNode(nd.a),b=evalNode(nd.b);
      if(isErr(a))return a; if(isErr(b))return b;
      if((a&&a.rng)||(b&&b.rng))return ERRV('#VALUE!');
      const x=toNum(a),y=toNum(b);
      if(isErr(x))return x; if(isErr(y))return y;
      switch(nd.op){
        case '+':return x+y; case '-':return x-y; case '*':return x*y;
        case '/':return y===0?ERRV('#DIV/0!'):x/y;
        case '^':return Math.pow(x,y);
      }
      return ERRV('#ERROR!');
    }
    case 'cmp':{
      const a=evalNode(nd.a),b=evalNode(nd.b);
      if(isErr(a))return a; if(isErr(b))return b;
      if((a&&a.rng)||(b&&b.rng))return ERRV('#VALUE!');
      return compare(a,b,nd.op);
    }
    case 'call':return evalCall(nd);
  }
  return ERRV('#ERROR!');
}

function evalCall(nd){
  const collect=()=>{
    const nums=[];
    for(const arg of nd.args){
      const v=evalNode(arg);
      if(isErr(v))return v;
      if(v&&v.rng){for(const x of v.rng){if(isErr(x))return x;if(typeof x==='number')nums.push(x);}}
      else{const n=toNum(v);if(isErr(n))return n;nums.push(n);}
    }
    return nums;
  };
  switch(nd.fn){
    case 'PI':return Math.PI;
    case 'SUM':{const l=collect();if(isErr(l))return l;let s=0;for(const x of l)s+=x;return s;}
    case 'AVERAGE':case 'AVG':{const l=collect();if(isErr(l))return l;if(!l.length)return ERRV('#DIV/0!');let s=0;for(const x of l)s+=x;return s/l.length;}
    case 'MIN':{const l=collect();if(isErr(l))return l;if(!l.length)return 0;let m=Infinity;for(const x of l)if(x<m)m=x;return m;}
    case 'MAX':{const l=collect();if(isErr(l))return l;if(!l.length)return 0;let m=-Infinity;for(const x of l)if(x>m)m=x;return m;}
    case 'COUNT':{const l=collect();return isErr(l)?l:l.length;}
    case 'IF':{
      if(nd.args.length<2)return ERRV('#ERROR!');
      const c=evalNode(nd.args[0]);
      if(isErr(c))return c; if(c&&c.rng)return ERRV('#VALUE!');
      let t;
      if(typeof c==='boolean')t=c;
      else if(c===null||c==='')t=false;
      else if(typeof c==='number')t=c!==0;
      else if(/^true$/i.test(c))t=true;
      else if(/^false$/i.test(c))t=false;
      else return ERRV('#VALUE!');
      return t?evalNode(nd.args[1]):(nd.args[2]?evalNode(nd.args[2]):false);
    }
    case 'ABS':case 'SQRT':{
      if(nd.args.length!==1)return ERRV('#ERROR!');
      const n=toNum(evalNode(nd.args[0]));if(isErr(n))return n;
      if(nd.fn==='ABS')return Math.abs(n);
      if(n<0)return ERRV('#NUM!');
      return Math.sqrt(n);
    }
    case 'ROUND':case 'POWER':{
      if(nd.args.length!==2)return ERRV('#ERROR!');
      const a=toNum(evalNode(nd.args[0]));if(isErr(a))return a;
      const b=toNum(evalNode(nd.args[1]));if(isErr(b))return b;
      if(nd.fn==='ROUND'){const f=Math.pow(10,b);return Math.round(a*f)/f;}
      return Math.pow(a,b);
    }
    default:return ERRV('#NAME?');
  }
}

/* memoized, lazy evaluation with cycle detection */
let valueCache=new Map(), evalStack=new Set();
const parseCache=new Map();
function recompute(){valueCache=new Map();valV++;}
function valueOf(r,c){
  const k=key(r,c);
  if(valueCache.has(k))return valueCache.get(k);
  const cell=sheet().cells[k];
  let out=null;
  if(cell&&cell.v!=null&&cell.v!==''){
    const v=cell.v;
    if(typeof v==='string'&&v[0]==='='){
      if(evalStack.has(k))out=ERRV('#CIRC!');
      else{
        evalStack.add(k);
        try{
          let ast=parseCache.get(v);
          if(!ast){ast=parseFormula(v.slice(1));parseCache.set(v,ast);}
          out=evalNode(ast);
        }catch(e){out=isErr(e)?e:ERRV('#ERROR!');}
        evalStack.delete(k);
      }
    }else{
      const s=String(v),n=Number(s);
      out=(s.trim()!==''&&!isNaN(n))?n:s;
    }
  }
  valueCache.set(k,out);
  return out;
}

/* ================= geometry & rendering ================= */
function computeOffsets(){
  const sh=sheet();
  colX=new Array(COLS+1);colX[0]=0;
  for(let c=0;c<COLS;c++)colX[c+1]=colX[c]+sh.colW[c];
  rowY=new Array(ROWS+1);rowY[0]=0;
  for(let r=0;r<ROWS;r++)rowY[r+1]=rowY[r]+ROW_H;
  totalW=colX[COLS];totalH=rowY[ROWS];
  canvas.style.width=totalW+'px';canvas.style.height=totalH+'px';
  colStrip.style.width=totalW+'px';rowStrip.style.height=totalH+'px';
  geomV++;
}
function colAt(x){let lo=0,hi=COLS-1;while(lo<hi){const m=(lo+hi+1)>>1;if(colX[m]<=x)lo=m;else hi=m-1;}return clamp(lo,0,COLS-1);}
function rowAt(y){let lo=0,hi=ROWS-1;while(lo<hi){const m=(lo+hi+1)>>1;if(rowY[m]<=y)lo=m;else hi=m-1;}return clamp(lo,0,ROWS-1);}
function normSel(){return{t:Math.min(sel.r1,sel.r2),b:Math.max(sel.r1,sel.r2),l:Math.min(sel.c1,sel.c2),r:Math.max(sel.c1,sel.c2)};}

function renderCells(force){
  const sh=sheet();
  const stL=scroller.scrollLeft,stT=scroller.scrollTop;
  const c0=Math.max(0,colAt(stL)-1),c1=Math.min(COLS-1,colAt(stL+scroller.clientWidth)+1);
  const r0=Math.max(0,rowAt(stT)-1),r1=Math.min(ROWS-1,rowAt(stT+scroller.clientHeight)+1);
  const sig=r0+'|'+r1+'|'+c0+'|'+c1+'|'+geomV+'|'+valV;
  if(!force&&sig===lastCellSig)return;
  lastCellSig=sig;
  const out=[];
  for(let r=r0;r<=r1;r++){
    const y=rowY[r];
    for(let c=c0;c<=c1;c++){
      const cl=sh.cells[key(r,c)];
      let cls='cell',bg='',disp='';
      if(cl){
        const v=valueOf(r,c);
        disp=display(v);
        if(cl.s){
          if(cl.s.b)cls+=' b';
          if(cl.s.i)cls+=' i';
          if(cl.s.bg)bg='background:'+cl.s.bg+';';
        }
        if(typeof v==='number')cls+=' num';
        else if(isErr(v))cls+=' err';
        else if(typeof v==='boolean')cls+=' bool';
      }
      out.push(`<div class="${cls}" data-r="${r}" data-c="${c}" style="left:${colX[c]}px;top:${y}px;width:${sh.colW[c]}px;height:${ROW_H}px;${bg}">${esc(disp)}</div>`);
    }
  }
  cellLayer.innerHTML=out.join('');
}

function renderHeaders(){
  const stL=scroller.scrollLeft,stT=scroller.scrollTop;
  const c0=Math.max(0,colAt(stL)-1),c1=Math.min(COLS-1,colAt(stL+scroller.clientWidth)+1);
  const r0=Math.max(0,rowAt(stT)-1),r1=Math.min(ROWS-1,rowAt(stT+scroller.clientHeight)+1);
  const {t,b,l,r}=normSel();
  const sh=sheet();
  let s='';
  for(let c=c0;c<=c1;c++){
    const hl=c>=l&&c<=r;
    s+=`<div class="colhead${hl?' hl':''}" data-c="${c}" style="left:${colX[c]}px;width:${sh.colW[c]}px">${colName(c)}<span class="grip" data-c="${c}"></span></div>`;
  }
  colStrip.innerHTML=s;
  s='';
  for(let rr=r0;rr<=r1;rr++){
    const hl=rr>=t&&rr<=b;
    s+=`<div class="rowhead${hl?' hl':''}" data-r="${rr}" style="top:${rowY[rr]}px;height:${ROW_H}px">${rr+1}</div>`;
  }
  rowStrip.innerHTML=s;
}

function renderSelection(){
  const sh=sheet();
  const {t,b,l,r}=normSel();
  const x=colX[l],y=rowY[t],w=colX[r+1]-x,h=rowY[b+1]-y;
  selFill.style.display='block';
  Object.assign(selFill.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  selOutline.style.display='block';
  Object.assign(selOutline.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  selActive.style.display=(edit&&!edit.viaBar)?'none':'block';
  const ax=colX[sel.ac],ay=rowY[sel.ar];
  Object.assign(selActive.style,{left:(ax-1)+'px',top:(ay-1)+'px',width:(sh.colW[sel.ac]+2)+'px',height:(ROW_H+2)+'px'});
  nameBox.textContent=(t===b&&l===r)?refName(sel.ar,sel.ac):refName(t,l)+':'+refName(b,r);
  renderHeaders();
  updateStatus();
  updateToolbarState();
}

function updateStatus(){
  const {t,b,l,r}=normSel();
  const area=(b-t+1)*(r-l+1);
  if(area===1){statsEl.innerHTML='';return;}
  let count=0,nums=0,sum=0;
  for(let rr=t;rr<=b;rr++)for(let cc=l;cc<=r;cc++){
    const v=valueOf(rr,cc);
    if(v!==null&&v!=='')count++;
    if(typeof v==='number'){nums++;sum+=v;}
  }
  const parts=[`Count <b>${count}</b>`];
  if(nums)parts.push(`Sum <b>${esc(fmtNum(sum))}</b>`,`Avg <b>${esc(fmtNum(sum/nums))}</b>`);
  statsEl.innerHTML=parts.join('');
}

function updateToolbarState(){
  const cl=sheet().cells[key(sel.ar,sel.ac)];
  const s=(cl&&cl.s)||{};
  $('btnBold').classList.toggle('on',!!s.b);
  $('btnItalic').classList.toggle('on',!!s.i);
  $('fillChip').style.background=s.bg||'transparent';
}

function updateFormulaBar(){
  if(edit)return;
  fxWrap.classList.remove('editing');
  const cl=sheet().cells[key(sel.ar,sel.ac)];
  fxInput.value=cl&&cl.v!=null?String(cl.v):'';
}

function syncHeaders(){
  colStrip.style.transform=`translateX(${-scroller.scrollLeft}px)`;
  rowStrip.style.transform=`translateY(${-scroller.scrollTop}px)`;
}
function renderAll(){
  computeOffsets();
  syncHeaders();
  renderCells(true);
  renderSelection();
  updateFormulaBar();
}

let scrollRaf=0;
scroller.addEventListener('scroll',()=>{
  if(scrollRaf)return;
  scrollRaf=requestAnimationFrame(()=>{scrollRaf=0;syncHeaders();renderCells();renderHeaders();});
});
window.addEventListener('resize',()=>{renderCells(true);renderHeaders();});

/* ================= mouse: selection & headers ================= */
function cellFromEvent(e){
  const rc=canvas.getBoundingClientRect();
  return{r:rowAt(e.clientY-rc.top),c:colAt(e.clientX-rc.left)};
}
function beginSelect(p,e){
  e.preventDefault();
  if(e.shiftKey){sel.r2=p.r;sel.c2=p.c;}
  else sel={ar:p.r,ac:p.c,r1:p.r,c1:p.c,r2:p.r,c2:p.c};
  drag={type:'select'};
  renderSelection();
}
function edgeAutoscroll(e){
  const rc=scroller.getBoundingClientRect();
  let moved=false;
  if(e.clientY<rc.top+30&&scroller.scrollTop>0){scroller.scrollTop=Math.max(0,scroller.scrollTop-14);moved=true;}
  else if(e.clientY>rc.bottom-30&&scroller.scrollTop<totalH-scroller.clientHeight){scroller.scrollTop+=14;moved=true;}
  if(e.clientX<rc.left+30&&scroller.scrollLeft>0){scroller.scrollLeft=Math.max(0,scroller.scrollLeft-14);moved=true;}
  else if(e.clientX>rc.right-30&&scroller.scrollLeft<totalW-scroller.clientWidth){scroller.scrollLeft+=14;moved=true;}
  if(moved){syncHeaders();renderCells();renderHeaders();}
}

canvas.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(edit){
    const t=edit.viaBar?fxInput.value:cellEditor.value;
    if(t.startsWith('=')){e.preventDefault();refMouseDown(e);return;}
    commitEdit();
  }
  beginSelect(cellFromEvent(e),e);
});
canvas.addEventListener('dblclick',e=>{
  if(edit)return;
  const p=cellFromEvent(e);
  openEditor(p.r,p.c,null,false);
});

colStrip.addEventListener('mousedown',e=>{
  const grip=e.target.closest('.grip');
  if(grip){
    e.preventDefault();e.stopPropagation();
    const c=+grip.dataset.c;
    drag={type:'resize',c,x0:e.clientX,w0:sheet().colW[c]};
    document.body.classList.add('col-resizing');
    return;
  }
  const head=e.target.closest('.colhead');
  if(!head)return;
  e.preventDefault();
  const c=+head.dataset.c;
  if(e.shiftKey)sel.c2=c;
  else{sel.c1=c;sel.c2=c;sel.ac=c;}
  drag={type:'colsel'};
  renderSelection();
});
colStrip.addEventListener('dblclick',e=>{
  const grip=e.target.closest('.grip');
  if(grip)autofitCol(+grip.dataset.c);
});
rowStrip.addEventListener('mousedown',e=>{
  const head=e.target.closest('.rowhead');
  if(!head)return;
  e.preventDefault();
  const r=+head.dataset.r;
  if(e.shiftKey)sel.r2=r;
  else{sel.r1=r;sel.r2=r;sel.ar=r;}
  drag={type:'rowsel'};
  renderSelection();
});
 $('corner').addEventListener('mousedown',e=>{
  e.preventDefault();
  sel={ar:0,ac:0,r1:0,c1:0,r2:ROWS-1,c2:COLS-1};
  renderSelection();
});

window.addEventListener('mousemove',e=>{
  if(!drag)return;
  switch(drag.type){
    case 'select':{edgeAutoscroll(e);const p=cellFromEvent(e);sel.r2=p.r;sel.c2=p.c;renderSelection();break;}
    case 'colsel':{edgeAutoscroll(e);const p=cellFromEvent(e);sel.c2=p.c;renderSelection();break;}
    case 'rowsel':{edgeAutoscroll(e);const p=cellFromEvent(e);sel.r2=p.r;renderSelection();break;}
    case 'ref':refDragMove(e);break;
    case 'resize':{
      sheet().colW[drag.c]=clamp(drag.w0+e.clientX-drag.x0,MIN_W,MAX_W);
      computeOffsets();syncHeaders();renderCells(true);renderHeaders();renderSelection();
      break;
    }
  }
});
window.addEventListener('mouseup',()=>{
  if(drag&&drag.type==='ref')endRefDrag();
  drag=null;
  document.body.classList.remove('col-resizing');
});
window.addEventListener('blur',()=>{drag=null;document.body.classList.remove('col-resizing');});

function autofitCol(c){
  const sh=sheet();
  let w=0;
  for(const k in sh.cells){
    const parts=k.split(','),cc=+parts[1];
    if(cc!==c)continue;
    const cl=sh.cells[k];
    if(cl.v==null||cl.v==='')continue;
    const r=+parts[0];
    measCtx.font=((cl.s&&cl.s.b)?'700':'400')+' 13px "Instrument Sans",sans-serif';
    w=Math.max(w,measCtx.measureText(display(valueOf(r,c))).width);
  }
  measCtx.font='500 11.5px "Instrument Sans",sans-serif';
  w=Math.max(w,measCtx.measureText(colName(c)).width);
  sh.colW[c]=clamp(Math.ceil(w)+18,MIN_W,MAX_W);
  computeOffsets();syncHeaders();renderCells(true);renderHeaders();renderSelection();
}
const measCtx=document.createElement('canvas').getContext('2d');
function measure(t){measCtx.font='13px "Instrument Sans",sans-serif';return measCtx.measureText(t).width;}

/* ================= editing & live reference capture ================= */
function rawAt(r,c){const cl=sheet().cells[key(r,c)];return cl&&cl.v!=null?String(cl.v):'';}

function positionEditor(r,c){
  cellEditor.style.left=colX[c]+'px';
  cellEditor.style.top=rowY[r]+'px';
  cellEditor.style.height=ROW_H+'px';
}
function autosizeEditor(){
  if(!edit)return;
  const w=Math.max(sheet().colW[edit.c],Math.ceil(measure(cellEditor.value))+18);
  cellEditor.style.width=Math.min(w,520)+'px';
}

function openEditor(r,c,text,viaBar){
  edit={r,c,viaBar:!!viaBar,refSpan:null,lastAnchor:null,lastTime:0};
  if(viaBar){
    cellEditor.classList.remove('open');
    fxWrap.classList.add('editing');
    fxInput.value=text!=null?text:rawAt(r,c);
    fxInput.focus();
    const L=fxInput.value.length;fxInput.setSelectionRange(L,L);
    updateRefHighlights(fxInput.value);
  }else{
    positionEditor(r,c);
    cellEditor.value=text!=null?text:rawAt(r,c);
    cellEditor.classList.add('open');
    autosizeEditor();
    cellEditor.focus();
    const L=cellEditor.value.length;cellEditor.setSelectionRange(L,L);
    fxInput.value=cellEditor.value;
    fxWrap.classList.add('editing');
    updateRefHighlights(cellEditor.value);
  }
}
function closeEditorSurfaces(){
  cellEditor.classList.remove('open');
  fxWrap.classList.remove('editing');
  updateRefHighlights('');
}
function writeCell(r,c,text){
  const k=key(r,c),cells=sheet().cells;
  if(text===''){
    const cl=cells[k];
    if(cl){delete cl.v;if(isEmptyStyle(cl.s))delete cells[k];}
  }else{
    (cells[k]||(cells[k]={})).v=text;
  }
}
function isEmptyStyle(s){return !s||(!s.b&&!s.i&&!s.bg);}

function commitEdit(moveR=0,moveC=0){
  if(!edit)return;
  const {r,c}=edit;
  const text=edit.viaBar?fxInput.value:cellEditor.value;
  edit=null;
  closeEditorSurfaces();
  writeCell(r,c,text);
  recompute();
  renderCells(true);
  if(moveR||moveC)moveSel(moveR,moveC,false);
  else renderSelection();
  updateFormulaBar();
  const v=valueOf(r,c);
  if(isErr(v)&&v.err==='#CIRC!')toast('Circular reference detected');
  scroller.focus({preventScroll:true});
}
function cancelEdit(){
  if(!edit)return;
  edit=null;
  closeEditorSurfaces();
  renderSelection();
  updateFormulaBar();
  scroller.focus({preventScroll:true});
}

/* --- live cell/range references while editing a formula --- */
function refMouseDown(e){
  const input=edit.viaBar?fxInput:cellEditor;
  const p=cellFromEvent(e);
  const now=Date.now();
  // a quick second click on the grid turns the just-inserted ref into a drag-extendable range
  if(edit.refSpan&&input.selectionStart===edit.refSpan.end&&now-edit.lastTime<420){
    drag={type:'ref',input,start:edit.refSpan.start,r:edit.lastAnchor.r,c:edit.lastAnchor.c};
    return;
  }
  const caret=input.selectionStart??input.value.length;
  const endCut=input.selectionEnd??caret;
  const txt=refName(p.r,p.c);
  input.value=input.value.slice(0,caret)+txt+input.value.slice(endCut);
  const end=caret+txt.length;
  input.setSelectionRange(end,end);
  edit.refSpan={start:caret,end};
  edit.lastAnchor={r:p.r,c:p.c};
  edit.lastTime=now;
  drag={type:'ref',input,start:caret,r:p.r,c:p.c};
  afterRefChange(input);
}
function refDragMove(e){
  edgeAutoscroll(e);
  const p=cellFromEvent(e);
  const r1=Math.min(drag.r,p.r),r2=Math.max(drag.r,p.r);
  const c1=Math.min(drag.c,p.c),c2=Math.max(drag.c,p.c);
  const txt=refName(r1,c1)+((r1!==r2||c1!==c2)?':'+refName(r2,c2):'');
  const input=drag.input;
  input.value=input.value.slice(0,drag.start)+txt+input.value.slice(edit.refSpan.end);
  edit.refSpan.end=drag.start+txt.length;
  input.setSelectionRange(edit.refSpan.end,edit.refSpan.end);
  afterRefChange(input);
}
function endRefDrag(){if(edit)edit.refSpan=null;}
function afterRefChange(input){
  updateRefHighlights(input.value);
  if(!edit.viaBar){autosizeEditor();fxInput.value=input.value;}
}
function updateRefHighlights(text){
  for(const el of hlRefs)el.remove();
  hlRefs=[];
  if(!edit||!text||text[0]!=='=')return;
  const re=/(\$?)([A-Za-z]{1,3})(\$?)(\d+)(\s*:\s*\$?([A-Za-z]{1,3})(\$?)(\d+))?/g;
  let m,n=0;
  while((m=re.exec(text))&&n<80){
    const c1=colFromName(m[2].toUpperCase()),r1=parseInt(m[4],10)-1;
    let R1=r1,C1=c1,R2=r1,C2=c1;
    if(m[5]!=null){
      C2=colFromName(m[6].toUpperCase());R2=parseInt(m[8],10)-1;
      const a=Math.min(R1,R2),b=Math.max(R1,R2),l=Math.min(C1,C2),rr=Math.max(C1,C2);
      R1=a;R2=b;C1=l;C2=rr;
    }
    if(R1<0||R2>=ROWS||C1<0||C2>=COLS)continue;
    const div=document.createElement('div');
    div.className='ref-hl';
    Object.assign(div.style,{left:colX[C1]+'px',top:rowY[R1]+'px',width:(colX[C2+1]-colX[C1])+'px',height:(rowY[R2+1]-rowY[R1])+'px'});
    hlLayer.appendChild(div);
    hlRefs.push(div);
    n++;
  }
}

/* editor inputs */
fxInput.addEventListener('focus',()=>{
  if(edit){if(!edit.viaBar)openEditor(edit.r,edit.c,cellEditor.value,true);return;}
  openEditor(sel.ar,sel.ac,null,true);
});
fxInput.addEventListener('input',()=>{
  if(!edit||!edit.viaBar)return;
  edit.refSpan=null;
  updateRefHighlights(fxInput.value);
});
fxInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();commitEdit();}
  else if(e.key==='Tab'){e.preventDefault();commitEdit(0,e.shiftKey?-1:1);}
  else if(e.key==='Escape'){e.preventDefault();cancelEdit();}
});
cellEditor.addEventListener('input',()=>{
  if(!edit)return;
  edit.refSpan=null;
  fxInput.value=cellEditor.value;
  autosizeEditor();
  updateRefHighlights(cellEditor.value);
});
cellEditor.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();commitEdit(1,0);}
  else if(e.key==='Tab'){e.preventDefault();commitEdit(0,e.shiftKey?-1:1);}
  else if(e.key==='Escape'){e.preventDefault();cancelEdit();}
});
 $('fxOk').addEventListener('click',()=>commitEdit());
 $('fxCancel').addEventListener('click',()=>cancelEdit());

/* ================= keyboard ================= */
function moveSel(dr,dc,extend){
  let r=extend?sel.r2:sel.ar,c=extend?sel.c2:sel.ac;
  r=clamp(r+dr,0,ROWS-1);c=clamp(c+dc,0,COLS-1);
  if(extend){sel.r2=r;sel.c2=c;}
  else{sel.ar=r;sel.ac=c;sel.r1=r;sel.r2=r;sel.c1=c;sel.c2=c;}
  ensureCellVisible(r,c);
  renderSelection();
}
function ensureCellVisible(r,c){
  const x0=colX[c],x1=colX[c+1],y0=rowY[r],y1=rowY[r+1];
  if(x0<scroller.scrollLeft)scroller.scrollLeft=x0;
  else if(x1>scroller.scrollLeft+scroller.clientWidth)scroller.scrollLeft=x1-scroller.clientWidth;
  if(y0<scroller.scrollTop)scroller.scrollTop=y0;
  else if(y1>scroller.scrollTop+scroller.clientHeight)scroller.scrollTop=y1-scroller.clientHeight;
}

document.addEventListener('keydown',e=>{
  if(veil.classList.contains('open'))return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return; // editors handle their own keys
  const k=e.key,ctrl=e.ctrlKey||e.metaKey;
  if(ctrl&&!e.altKey){
    const kl=k.toLowerCase();
    if(kl==='a'){e.preventDefault();sel={ar:0,ac:0,r1:0,c1:0,r2:ROWS-1,c2:COLS-1};renderSelection();}
    else if(kl==='b'){e.preventDefault();toggleStyle('b');}
    else if(kl==='i'){e.preventDefault();toggleStyle('i');}
    else if(k==='Home'){e.preventDefault();sel={ar:0,ac:0,r1:0,c1:0,r2:0,c2:0};ensureCellVisible(0,0);renderSelection();}
    return;
  }
  switch(k){
    case 'ArrowUp':e.preventDefault();moveSel(-1,0,e.shiftKey);break;
    case 'ArrowDown':e.preventDefault();moveSel(1,0,e.shiftKey);break;
    case 'ArrowLeft':e.preventDefault();moveSel(0,-1,e.shiftKey);break;
    case 'ArrowRight':e.preventDefault();moveSel(0,1,e.shiftKey);break;
    case 'Enter':e.preventDefault();moveSel(1,0,false);break;
    case 'Tab':e.preventDefault();moveSel(0,e.shiftKey?-1:1,false);break;
    case 'F2':e.preventDefault();openEditor(sel.ar,sel.ac,null,false);break;
    case 'Delete':case 'Backspace':e.preventDefault();clearContents();break;
    case 'Escape':e.preventDefault();sel.r2=sel.r1;sel.c2=sel.c1;renderSelection();break;
    case 'Home':e.preventDefault();sel.ac=0;sel.c1=0;sel.c2=0;ensureCellVisible(sel.ar,0);renderSelection();break;
    default:
      if(k.length===1&&!e.altKey){e.preventDefault();openEditor(sel.ar,sel.ac,k,false);}
  }
});

/* ================= styling actions ================= */
function forEachSelCell(fn){
  const {t,b,l,r}=normSel();
  for(let rr=t;rr<=b;rr++)for(let cc=l;cc<=r;cc++)fn(rr,cc);
}
function toggleStyle(prop){
  if(edit)commitEdit();
  const cl=sheet().cells[key(sel.ar,sel.ac)];
  const target=!(cl&&cl.s&&cl.s[prop]);
  forEachSelCell((r,c)=>{
    const k=key(r,c);
    const cell=sheet().cells[k]||(sheet().cells[k]={});
    cell.s=cell.s||{};
    if(target)cell.s[prop]=1;else delete cell.s[prop];
    if(cell.v==null&&isEmptyStyle(cell.s))delete sheet().cells[k];
  });
  renderCells(true);
  renderSelection();
}
function applyFill(color){
  if(edit)commitEdit();
  forEachSelCell((r,c)=>{
    const k=key(r,c);
    const cell=sheet().cells[k]||(sheet().cells[k]={});
    cell.s=cell.s||{};
    if(color)cell.s.bg=color;else delete cell.s.bg;
    if(cell.v==null&&isEmptyStyle(cell.s))delete sheet().cells[k];
  });
  renderCells(true);
  renderSelection();
}
function clearContents(){ // Delete key: contents only, formatting survives
  if(edit)commitEdit();
  forEachSelCell((r,c)=>{
    const cl=sheet().cells[key(r,c)];
    if(!cl)return;
    delete cl.v;
    if(isEmptyStyle(cl.s))delete sheet().cells[key(r,c)];
  });
  recompute();
  renderCells(true);
  renderSelection();
  updateFormulaBar();
}
function clearAll(){ // toolbar eraser: contents + formatting
  if(edit)commitEdit();
  forEachSelCell((r,c)=>{delete sheet().cells[key(r,c)];});
  recompute();
  renderCells(true);
  renderSelection();
  updateFormulaBar();
  toast('Cells cleared');
}
 $('btnBold').addEventListener('click',()=>toggleStyle('b'));
 $('btnItalic').addEventListener('click',()=>toggleStyle('i'));
 $('btnClear').addEventListener('click',clearAll);

/* fill-color palette */
function closePalette(){$('palette').style.display='none';}
function togglePalette(){
  const pal=$('palette');
  if(pal.style.display==='block'){closePalette();return;}
  const r=$('btnFill').getBoundingClientRect();
  pal.style.display='block';
  pal.style.left=Math.max(8,Math.min(r.left,innerWidth-pal.offsetWidth-8))+'px';
  pal.style.top=(r.bottom+6)+'px';
}
 $('btnFill').addEventListener('click',e=>{e.stopPropagation();togglePalette();});
document.addEventListener('mousedown',e=>{
  if($('palette').style.display==='block'&&!e.target.closest('#palette')&&!e.target.closest('#btnFill'))closePalette();
});
 $('noFill').addEventListener('click',()=>{applyFill(null);closePalette();});

/* ================= sheets ================= */
function renderTabs(){
  let h='';
  wb.sheets.forEach((s,i)=>{
    h+=`<div class="tab${i===wb.active?' active':''}" data-i="${i}" title="${esc(s.name)}"><span class="tab-name">${esc(s.name)}</span>`;
    if(i===wb.active&&wb.sheets.length>1)h+=`<button class="tab-x" data-i="${i}" title="Delete sheet">${X_SVG}</button>`;
    h+='</div>';
  });
  h+=`<button class="tab-add" id="tabAdd" title="Add sheet">${PLUS_SVG}</button>`;
  tabsEl.innerHTML=h;
}
tabsEl.addEventListener('click',e=>{
  const x=e.target.closest('.tab-x');
  if(x){deleteSheet(+x.dataset.i);return;}
  if(e.target.closest('.tab-add')){addSheet();return;}
  const tab=e.target.closest('.tab');
  if(tab&&+tab.dataset.i!==wb.active)activate(+tab.dataset.i);
});
tabsEl.addEventListener('dblclick',e=>{
  const tab=e.target.closest('.tab');
  if(tab)startRename(+tab.dataset.i,tab);
});
function activate(i){
  if(edit)commitEdit();
  wb.sheets[wb.active].sel=sel;
  wb.active=i;
  sel=wb.sheets[i].sel||{ar:0,ac:0,r1:0,c1:0,r2:0,c2:0};
  recompute();
  renderAll();
  renderTabs();
}
function addSheet(){
  const names=wb.sheets.map(s=>s.name);
  let n=1;while(names.includes('Sheet'+n))n++;
  wb.sheets.push(makeSheet('Sheet'+n));
  activate(wb.sheets.length-1);
  toast('Sheet added');
}
async function deleteSheet(i){
  if(wb.sheets.length<=1){toast('A workbook needs at least one sheet');return;}
  const ok=await confirmModal(`Delete “${wb.sheets[i].name}”?`,'All cells on this sheet will be removed. This cannot be undone.','Delete');
  if(!ok)return;
  if(edit)commitEdit();
  wb.sheets.splice(i,1);
  let na=wb.active;
  if(i<na)na--;
  if(na>=wb.sheets.length)na=wb.sheets.length-1;
  wb.active=na;
  sel=wb.sheets[na].sel||{ar:0,ac:0,r1:0,c1:0,r2:0,c2:0};
  recompute();
  renderAll();
  renderTabs();
  toast('Sheet deleted');
}
function startRename(i,tab){
  const span=tab.querySelector('.tab-name');
  if(!span||tab.querySelector('.tab-rename'))return;
  const inp=document.createElement('input');
  inp.className='tab-rename';
  inp.value=wb.sheets[i].name;
  span.replaceWith(inp);
  inp.focus();inp.select();
  let done=false;
  const finish=save=>{
    if(done)return;done=true;
    if(save&&inp.value.trim())wb.sheets[i].name=inp.value.trim();
    renderTabs();
  };
  inp.addEventListener('keydown',ev=>{
    ev.stopPropagation();
    if(ev.key==='Enter')finish(true);
    else if(ev.key==='Escape')finish(false);
  });
  inp.addEventListener('blur',()=>finish(true));
  inp.addEventListener('mousedown',ev=>ev.stopPropagation());
  inp.addEventListener('dblclick',ev=>ev.stopPropagation());
}

/* ================= CSV import / export ================= */
function csvField(s){return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  if(edit)commitEdit();
  const cells=sheet().cells;
  let maxR=-1,maxC=-1;
  for(const k in cells){
    const parts=k.split(','),r=+parts[0],c=+parts[1];
    if(cells[k].v!=null&&cells[k].v!==''){if(r>maxR)maxR=r;if(c>maxC)maxC=c;}
  }
  if(maxR<0){toast('The active sheet is empty');return;}
  const lines=[];
  for(let r=0;r<=maxR;r++){
    const row=[];
    for(let c=0;c<=maxC;c++)row.push(csvField(display(valueOf(r,c))));
    lines.push(row.join(','));
  }
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=sheet().name.replace(/[\\/:*?"<>|]/g,'_')+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(`Exported ${maxR+1} row${maxR?'s':''} × ${maxC+1} column${maxC?'s':''}`);
}
function parseCSV(text){
  const rows=[];let cur=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}
      else field+=ch;
    }else if(ch==='"')q=true;
    else if(ch===','){cur.push(field);field='';}
    else if(ch==='\r'){/* skip */}
    else if(ch==='\n'){cur.push(field);field='';rows.push(cur);cur=[];}
    else field+=ch;
  }
  if(field!==''||cur.length){cur.push(field);rows.push(cur);}
  return rows;
}
function importCSV(text){
  const rows=parseCSV(text);
  while(rows.length&&rows[rows.length-1].every(v=>v===''))rows.pop();
  if(!rows.length){toast('That file appears to be empty');return;}
  const cells={};let count=0;
  rows.forEach((row,r)=>{
    if(r>=ROWS)return;
    row.forEach((v,c)=>{
      if(c>=COLS||v==='')return;
      cells[key(r,c)]={v,s:{}};
      count++;
    });
  });
  sheet().cells=cells;
  sel={ar:0,ac:0,r1:0,c1:0,r2:Math.min(rows.length-1,ROWS-1),c2:0};
  recompute();
  renderAll();
  toast(`Imported ${Math.min(rows.length,ROWS)} rows (${count} cells) into “${sheet().name}”`);
}
 $('btnExport').addEventListener('click',exportCSV);
 $('btnImport').addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{
  const f=e.target.files[0];
  e.target.value='';
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{importCSV(String(rd.result));}
    catch(err){toast('Could not parse that file as CSV');}
  };
  rd.readAsText(f);
});

/* ================= modal & toast ================= */
function confirmModal(title,body,okLabel){
  return new Promise(res=>{
    $('mTitle').textContent=title;
    $('mBody').textContent=body;
    $('mOk').textContent=okLabel||'OK';
    veil.classList.add('open');
    $('mOk').focus();
    const done=v=>{
      veil.classList.remove('open');
      $('mOk').onclick=null;$('mCancel').onclick=null;veil.onclick=null;
      document.removeEventListener('keydown',onKey,true);
      res(v);
    };
    const onKey=ev=>{
      ev.stopPropagation();
      if(ev.key==='Escape')done(false);
      else if(ev.key==='Enter')done(true);
    };
    $('mOk').onclick=()=>done(true);
    $('mCancel').onclick=()=>done(false);
    veil.onclick=ev=>{if(ev.target===veil)done(false);};
    document.addEventListener('keydown',onKey,true);
  });
}
function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},2400);
}

/* ================= init ================= */
(function init(){
  $('swatches').innerHTML=SWATCHES.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('');
  $('swatches').addEventListener('click',e=>{
    const b=e.target.closest('.sw');
    if(b){applyFill(b.dataset.c);closePalette();}
  });
  computeOffsets();
  renderAll();
  renderTabs();
  scroller.focus({preventScroll:true});
})();
</script>
