<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel - Book1.xlsx</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap');
        
        * { font-family: 'Segoe UI', system-ui, sans-serif; }
        .cell { 
            min-width: 100px; 
            height: 28px; 
            border-right: 1px solid #e5e7eb; 
            border-bottom: 1px solid #e5e7eb; 
            padding: 2px 6px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            font-size: 13px;
            position: relative;
        }
        .cell-header {
            background: #f8fafc;
            font-weight: 600;
            color: #64748b;
            text-align: center;
            cursor: pointer;
        }
        .row-header {
            background: #f8fafc;
            font-weight: 600;
            color: #64748b;
            text-align: right;
            padding-right: 8px;
            width: 50px;
            border-right: 2px solid #e5e7eb;
        }
        .selected {
            outline: 2px solid #2563eb;
            z-index: 10;
        }
        .range-highlight {
            background: rgba(37, 99, 235, 0.1) !important;
        }
        .formula-bar-input {
            font-family: monospace;
            font-size: 14px;
        }
        .sheet-tab {
            transition: all 0.2s;
        }
        .sheet-tab.active {
            background: white;
            border-bottom: 3px solid #2563eb;
            font-weight: 600;
        }
        .grid-container {
            overflow: auto;
            max-height: calc(100vh - 220px);
        }
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            width: 4px;
            height: 100%;
            cursor: col-resize;
            z-index: 20;
        }
    </style>
</head>
<body class="bg-zinc-100 text-zinc-900 overflow-hidden">
    <div class="flex flex-col h-screen">
        <!-- Top Bar -->
        <div class="bg-white border-b flex items-center px-4 py-1 gap-8 text-sm">
            <div class="flex items-center gap-2 font-semibold text-xl text-blue-600">
                <i class="fa-solid fa-file-excel"></i>
                <span>Excel</span>
            </div>
            <div class="flex-1 flex items-center gap-6 text-zinc-600">
                <span class="cursor-pointer hover:text-black px-3 py-1 rounded" onclick="newFile()">File</span>
                <span class="cursor-pointer hover:text-black px-3 py-1 rounded">Home</span>
                <span class="cursor-pointer hover:text-black px-3 py-1 rounded">Insert</span>
                <span class="cursor-pointer hover:text-black px-3 py-1 rounded">Data</span>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <div class="px-4 py-1 bg-emerald-100 text-emerald-700 rounded font-medium">Book1.xlsx</div>
                <button onclick="downloadCSV()" class="px-4 py-1 bg-blue-600 text-white text-xs rounded hover:bg-blue-700 flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> CSV
                </button>
                <label class="px-4 py-1 bg-zinc-100 hover:bg-zinc-200 rounded cursor-pointer flex items-center gap-2">
                    <i class="fa-solid fa-upload"></i> Upload CSV
                    <input type="file" accept=".csv" class="hidden" id="csvUpload" onchange="uploadCSV(event)">
                </label>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="bg-white border-b px-4 py-2 flex items-center gap-6 text-sm">
            <div class="flex gap-1">
                <button onclick="formatBold()" class="w-8 h-8 hover:bg-zinc-100 rounded flex items-center justify-center"><i class="fa-solid fa-bold"></i></button>
                <button onclick="formatItalic()" class="w-8 h-8 hover:bg-zinc-100 rounded flex items-center justify-center"><i class="fa-solid fa-italic"></i></button>
                <button onclick="formatUnderline()" class="w-8 h-8 hover:bg-zinc-100 rounded flex items-center justify-center"><i class="fa-solid fa-underline"></i></button>
            </div>
            
            <div class="flex items-center gap-2 border-l border-r px-4">
                <select id="fontSize" onchange="changeFontSize()" class="bg-transparent text-sm border border-zinc-300 rounded px-2 py-1 w-16">
                    <option value="11">11</option>
                    <option value="12" selected>12</option>
                    <option value="14">14</option>
                    <option value="16">16</option>
                </select>
            </div>

            <div class="flex items-center gap-1 border-l border-r px-4">
                <button onclick="setTextColor()" class="w-8 h-8 hover:bg-zinc-100 rounded flex items-center justify-center"><i class="fa-solid fa-font"></i></button>
                <input type="color" id="textColor" class="w-6 h-6 p-0 border-0" onchange="applyTextColor(this.value)" title="Text color">
            </div>

            <div class="flex items-center gap-1 border-l border-r px-4">
                <button onclick="setFillColor()" class="w-8 h-8 hover:bg-zinc-100 rounded flex items-center justify-center"><i class="fa-solid fa-fill-drip"></i></button>
                <input type="color" id="fillColor" class="w-6 h-6 p-0 border-0" onchange="applyFillColor(this.value)" title="Fill color">
            </div>

            <div class="flex-1"></div>

            <!-- Clear -->
            <button onclick="clearSelected()" class="px-5 py-1 text-sm border border-zinc-300 rounded hover:bg-red-50 hover:text-red-600 flex items-center gap-2">
                <i class="fa-solid fa-eraser"></i> Clear
            </button>
        </div>

        <!-- Formula Bar -->
        <div class="bg-white border-b flex items-center px-4 py-2 gap-4">
            <div id="cellAddress" class="font-mono font-semibold text-blue-600 w-20 text-center bg-zinc-100 py-1 rounded">A1</div>
            <div class="flex-1 flex items-center bg-zinc-100 border rounded">
                <div class="px-3 text-zinc-400"><i class="fa-solid fa-function"></i></div>
                <input id="formulaBar" 
                       class="flex-1 bg-transparent px-3 py-1 outline-none formula-bar-input"
                       onkeydown="if(event.key==='Enter') commitFormula()"
                       placeholder="Enter value or formula">
            </div>
        </div>

        <!-- Grid Container -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Main Grid -->
            <div class="flex-1 overflow-auto grid-container" id="gridWrapper">
                <table id="spreadsheet" class="border-collapse bg-white">
                    <thead>
                        <tr id="colHeaders">
                            <!-- JS populated -->
                        </tr>
                    </thead>
                    <tbody id="gridBody">
                        <!-- JS populated -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Sheet Tabs -->
        <div class="bg-white border-t flex items-center px-4 gap-1 text-sm h-11" id="sheetTabs">
            <!-- JS populated -->
        </div>
    </div>

    <script>
        // Tailwind script
        function initTailwind() {
            // Already loaded via CDN
        }

        // Globals
        let sheets = [
            {
                name: "Sheet1",
                data: Array.from({length: 100}, () => Array.from({length: 26}, () => ({
                    value: "",
                    formula: "",
                    style: { bold: false, italic: false, underline: false, color: "#000000", bg: "#ffffff", fontSize: "12" }
                })))
            }
        ];
        let currentSheetIndex = 0;
        let selectedRow = 0;
        let selectedCol = 0;
        let selectionStartRow = 0;
        let selectionStartCol = 0;
        let isSelecting = false;
        let columnWidths = Array(26).fill(100);

        // Col letter
        function colToLetter(col) {
            let letter = '';
            while (col >= 0) {
                letter = String.fromCharCode((col % 26) + 65) + letter;
                col = Math.floor(col / 26) - 1;
            }
            return letter;
        }

        // Letter to col
        function letterToCol(letter) {
            let col = 0;
            for (let i = 0; i < letter.length; i++) {
                col = col * 26 + (letter.charCodeAt(i) - 64);
            }
            return col - 1;
        }

        // Render headers and grid
        function renderGrid() {
            const thead = document.getElementById('colHeaders');
            const tbody = document.getElementById('gridBody');
            thead.innerHTML = '<th class="row-header cell-header w-12"></th>';
            
            for (let c = 0; c < 26; c++) {
                const th = document.createElement('th');
                th.className = 'cell-header cell px-2 relative';
                th.style.width = columnWidths[c] + 'px';
                th.style.minWidth = columnWidths[c] + 'px';
                th.textContent = colToLetter(c);
                
                // Resizer
                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                resizer.onmousedown = (e) => startResize(e, c);
                th.appendChild(resizer);
                
                thead.appendChild(th);
            }

            tbody.innerHTML = '';
            const sheetData = sheets[currentSheetIndex].data;

            for (let r = 0; r < 100; r++) {
                const tr = document.createElement('tr');
                
                // Row header
                const rowTh = document.createElement('th');
                rowTh.className = 'row-header cell';
                rowTh.textContent = r + 1;
                tr.appendChild(rowTh);

                for (let c = 0; c < 26; c++) {
                    const td = document.createElement('td');
                    td.className = `cell`;
                    td.dataset.row = r;
                    td.dataset.col = c;
                    
                    // Apply style
                    const cellData = sheetData[r][c];
                    td.style.fontWeight = cellData.style.bold ? '700' : '400';
                    td.style.fontStyle = cellData.style.italic ? 'italic' : 'normal';
                    td.style.textDecoration = cellData.style.underline ? 'underline' : 'none';
                    td.style.color = cellData.style.color;
                    td.style.backgroundColor = cellData.style.bg;
                    td.style.fontSize = cellData.style.fontSize + 'px';
                    
                    // Display value (evaluated)
                    td.textContent = cellData.value || '';
                    
                    // Events
                    td.addEventListener('mousedown', (e) => startSelection(e, r, c));
                    td.addEventListener('mousemove', (e) => updateSelection(e, r, c));
                    td.addEventListener('mouseup', () => endSelection());
                    td.addEventListener('dblclick', () => editCellInline(r, c));
                    
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            
            updateSelectedCell();
            renderSheetTabs();
        }

        function startResize(e, col) {
            e.preventDefault();
            const startX = e.pageX;
            const startWidth = columnWidths[col];
            
            function onMouseMove(moveE) {
                const diff = moveE.pageX - startX;
                columnWidths[col] = Math.max(60, startWidth + diff);
                renderGrid();
            }
            
            function onMouseUp() {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

        function startSelection(e, r, c) {
            selectedRow = r;
            selectedCol = c;
            selectionStartRow = r;
            selectionStartCol = c;
            isSelecting = true;
            updateSelectedCell();
            highlightRange();
        }

        function updateSelection(e, r, c) {
            if (!isSelecting) return;
            selectedRow = r;
            selectedCol = c;
            highlightRange();
        }

        function endSelection() {
            isSelecting = false;
        }

        function highlightRange() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                cell.classList.remove('selected', 'range-highlight');
                
                const row = parseInt(cell.dataset.row);
                const col = parseInt(cell.dataset.col);
                
                const minR = Math.min(selectedRow, selectionStartRow);
                const maxR = Math.max(selectedRow, selectionStartRow);
                const minC = Math.min(selectedCol, selectionStartCol);
                const maxC = Math.max(selectedCol, selectionStartCol);
                
                if (row >= minR && row <= maxR && col >= minC && col <= maxC) {
                    cell.classList.add('range-highlight');
                }
                if (row === selectedRow && col === selectedCol) {
                    cell.classList.add('selected');
                }
            });
        }

        function updateSelectedCell() {
            document.getElementById('cellAddress').textContent = colToLetter(selectedCol) + (selectedRow + 1);
            
            const cellData = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            const formulaBar = document.getElementById('formulaBar');
            
            if (cellData.formula) {
                formulaBar.value = cellData.formula;
            } else {
                formulaBar.value = cellData.value || '';
            }
        }

        function commitFormula() {
            const formulaBar = document.getElementById('formulaBar');
            const val = formulaBar.value.trim();
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            
            if (val.startsWith('=')) {
                cell.formula = val;
            } else {
                cell.formula = '';
                cell.value = val;
            }
            
            recalculateAll();
            renderGrid();
        }

        // Simple formula evaluator
        function evaluateFormula(formula, sheetData) {
            if (!formula || !formula.startsWith('=')) return formula;
            
            let expr = formula.substring(1).toUpperCase().trim();
            
            // Handle functions with ranges: SUM(A1:B10), AVERAGE, MIN, MAX
            const funcRegex = /^(\w+)\((.+)\)$/;
            const match = expr.match(funcRegex);
            
            if (match) {
                const func = match[1];
                const arg = match[2].trim();
                
                if (['SUM','AVERAGE','MIN','MAX'].includes(func)) {
                    return evaluateRangeFunction(func, arg, sheetData);
                }
            }
            
            // Replace cell references A1, B23 etc.
            expr = expr.replace(/([A-Z]+)(\d+)/g, (m, colStr, rowStr) => {
                const c = letterToCol(colStr);
                const r = parseInt(rowStr) - 1;
                if (r >= 0 && r < 100 && c >= 0 && c < 26) {
                    const v = sheetData[r][c].value;
                    return isNaN(v) || v === '' ? '0' : v;
                }
                return '0';
            });
            
            try {
                // Safe eval for arithmetic
                return eval(expr);
            } catch(e) {
                return '#ERROR';
            }
        }

        function evaluateRangeFunction(func, range, sheetData) {
            const [start, end] = range.split(':');
            if (!end) return '#ERROR';
            
            const startCol = letterToCol(start.replace(/\d+/,''));
            const startRow = parseInt(start.replace(/[A-Z]+/,'')) - 1;
            const endCol = letterToCol(end.replace(/\d+/,''));
            const endRow = parseInt(end.replace(/[A-Z]+/,'')) - 1;
            
            let values = [];
            
            for (let r = Math.min(startRow, endRow); r <= Math.max(startRow, endRow); r++) {
                for (let c = Math.min(startCol, endCol); c <= Math.max(startCol, endCol); c++) {
                    if (r < 0 || r >= 100 || c < 0 || c >= 26) continue;
                    const v = parseFloat(sheetData[r][c].value) || 0;
                    values.push(v);
                }
            }
            
            if (values.length === 0) return 0;
            
            switch(func) {
                case 'SUM': return values.reduce((a,b)=>a+b,0);
                case 'AVERAGE': return values.reduce((a,b)=>a+b,0) / values.length;
                case 'MIN': return Math.min(...values);
                case 'MAX': return Math.max(...values);
                default: return '#ERROR';
            }
        }

        function recalculateAll() {
            const sheetData = sheets[currentSheetIndex].data;
            
            for (let r = 0; r < 100; r++) {
                for (let c = 0; c < 26; c++) {
                    const cell = sheetData[r][c];
                    if (cell.formula) {
                        cell.value = evaluateFormula(cell.formula, sheetData);
                    }
                }
            }
        }

        function editCellInline(r, c) {
            const td = document.querySelector(`td[data-row="${r}"][data-col="${c}"]`);
            const cell = sheets[currentSheetIndex].data[r][c];
            
            const oldValue = td.textContent;
            td.contentEditable = true;
            td.focus();
            td.innerText = cell.formula || cell.value || '';
            
            td.onblur = () => {
                const newVal = td.innerText.trim();
                if (newVal.startsWith('=')) {
                    cell.formula = newVal;
                    cell.value = '';
                } else {
                    cell.formula = '';
                    cell.value = newVal;
                }
                td.contentEditable = false;
                recalculateAll();
                renderGrid();
            };
            
            td.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    td.blur();
                }
            };
        }

        // Formatting
        function formatBold() {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.bold = !cell.style.bold;
            renderGrid();
        }
        function formatItalic() {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.italic = !cell.style.italic;
            renderGrid();
        }
        function formatUnderline() {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.underline = !cell.style.underline;
            renderGrid();
        }
        function changeFontSize() {
            const size = document.getElementById('fontSize').value;
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.fontSize = size;
            renderGrid();
        }
        function setTextColor() {
            document.getElementById('textColor').click();
        }
        function applyTextColor(color) {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.color = color;
            renderGrid();
        }
        function setFillColor() {
            document.getElementById('fillColor').click();
        }
        function applyFillColor(color) {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.style.bg = color;
            renderGrid();
        }
        function clearSelected() {
            const cell = sheets[currentSheetIndex].data[selectedRow][selectedCol];
            cell.value = '';
            cell.formula = '';
            renderGrid();
        }

        // Sheets
        function renderSheetTabs() {
            const container = document.getElementById('sheetTabs');
            container.innerHTML = '';
            
            sheets.forEach((sheet, index) => {
                const tab = document.createElement('div');
                tab.className = `sheet-tab px-6 py-2 border-r cursor-pointer ${index === currentSheetIndex ? 'active' : 'bg-zinc-100'}`;
                tab.textContent = sheet.name;
                tab.onclick = () => {
                    currentSheetIndex = index;
                    renderGrid();
                };
                container.appendChild(tab);
            });
            
            // + button
            const addBtn = document.createElement('div');
            addBtn.className = 'px-4 py-2 cursor-pointer hover:bg-zinc-100 flex items-center';
            addBtn.innerHTML = `<i class="fa-solid fa-plus text-blue-600"></i>`;
            addBtn.onclick = addNewSheet;
            container.appendChild(addBtn);
        }

        function addNewSheet() {
            sheets.push({
                name: `Sheet${sheets.length + 1}`,
                data: Array.from({length: 100}, () => Array.from({length: 26}, () => ({
                    value: "",
                    formula: "",
                    style: { bold: false, italic: false, underline: false, color: "#000000", bg: "#ffffff", fontSize: "12" }
                })))
            });
            currentSheetIndex = sheets.length - 1;
            renderGrid();
        }

        // Keyboard navigation
        document.addEventListener('keydown', e => {
            if (document.getElementById('formulaBar') === document.activeElement) return;
            
            switch(e.key) {
                case 'ArrowRight':
                    if (selectedCol < 25) selectedCol++;
                    break;
                case 'ArrowLeft':
                    if (selectedCol > 0) selectedCol--;
                    break;
                case 'ArrowDown':
                    if (selectedRow < 99) selectedRow++;
                    break;
                case 'ArrowUp':
                    if (selectedRow > 0) selectedRow--;
                    break;
                case 'Enter':
                    editCellInline(selectedRow, selectedCol);
                    return;
                case 'Tab':
                    e.preventDefault();
                    if (selectedCol < 25) selectedCol++;
                    else if (selectedRow < 99) { selectedRow++; selectedCol = 0; }
                    break;
            }
            
            updateSelectedCell();
            highlightRange();
            renderGrid(); // to keep selection visual
        });

        // CSV
        function downloadCSV() {
            const sheetData = sheets[currentSheetIndex].data;
            let csv = '';
            
            for (let r = 0; r < 100; r++) {
                let row = [];
                for (let c = 0; c < 26; c++) {
                    let val = sheetData[r][c].value || '';
                    if (val.includes(',')) val = `"${val}"`;
                    row.push(val);
                }
                csv += row.join(',') + '\n';
            }
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = sheets[currentSheetIndex].name + '.csv';
            a.click();
            URL.revokeObjectURL(url);
        }

        function uploadCSV(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(ev) {
                const text = ev.target.result;
                const rows = text.split('\n').slice(0, 100);
                
                const sheetData = sheets[currentSheetIndex].data;
                
                rows.forEach((line, r) => {
                    if (!line) return;
                    const values = line.split(',');
                    values.forEach((val, c) => {
                        if (c >= 26) return;
                        val = val.replace(/^"|"$/g, '');
                        sheetData[r][c].value = val;
                        sheetData[r][c].formula = '';
                    });
                });
                
                recalculateAll();
                renderGrid();
            };
            reader.readAsText(file);
        }

        function newFile() {
            if (confirm('Create new workbook? Current data will be lost.')) {
                sheets = [ { name: "Sheet1", data: Array.from({length: 100}, () => Array.from({length: 26}, () => ({value:"", formula:"", style:{bold:false,italic:false,underline:false,color:"#000000",bg:"#ffffff",fontSize:"12"}}))) } ];
                currentSheetIndex = 0;
                renderGrid();
            }
        }

        // Init
        function init() {
            renderGrid();
            
            // Initial demo data
            const demoSheet = sheets[0].data;
            demoSheet[0][0].value = "Hello Excel Clone!";
            demoSheet[1][0].value = "100";
            demoSheet[1][1].value = "200";
            demoSheet[2][0].formula = "=SUM(A2:B2)";
            demoSheet[3][0].formula = "=AVERAGE(A2:B2)";
            demoSheet[4][0].formula = "=MAX(A2:B2)";
            
            recalculateAll();
            renderGrid();
            
            // Keyboard hint
            setTimeout(() => {
                alert("✅ Functional Excel Clone ready!\n\n• Click cells\n• Type in formula bar (start with = for formulas)\n• Drag to select range\n• Double-click to edit inline\n• Use toolbar for formatting\n• Multiple sheets + CSV import/export\n• Column resize\n\nEnjoy! 🚀");
            }, 600);
        }

        window.onload = init;
    </script>
</body>
</html>
