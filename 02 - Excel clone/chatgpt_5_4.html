<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spreadsheet Pro</title>
  <style>
    :root {
      --excel-green: #1f7a43;
      --excel-green-dark: #176336;
      --grid-border: #d9dde3;
      --grid-header: #f4f6f9;
      --grid-header-strong: #eef2f6;
      --selection-fill: rgba(31, 122, 67, 0.12);
      --selection-border: #1f7a43;
      --ref-fill: rgba(32, 120, 255, 0.12);
      --ref-border: #2078ff;
      --text: #1b2430;
      --muted: #687385;
      --bg: #eef2f7;
      --panel: #ffffff;
      --shadow: 0 14px 30px rgba(31, 45, 61, 0.12);
      --toolbar-height: 50px;
      --formula-height: 46px;
      --sheetbar-height: 42px;
      --rownum-width: 56px;
      --cell-height: 26px;
      --default-col-width: 116px;
      --font: Inter, Segoe UI, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: linear-gradient(180deg, #f7f9fc 0%, #edf2f7 100%); color: var(--text); font-family: var(--font); }
    body { overflow: hidden; }
    button, input, select { font: inherit; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      background: var(--bg);
    }

    .toolbar {
      height: var(--toolbar-height);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: linear-gradient(180deg, var(--excel-green) 0%, var(--excel-green-dark) 100%);
      color: white;
      box-shadow: var(--shadow);
      z-index: 20;
    }

    .toolbar .title {
      font-size: 15px;
      font-weight: 700;
      margin-right: 12px;
      white-space: nowrap;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border-left: 1px solid rgba(255,255,255,0.16);
    }
    .toolbar-group:first-of-type { border-left: none; padding-left: 0; }

    .tool-btn, .secondary-btn {
      border: none;
      border-radius: 9px;
      min-width: 34px;
      height: 34px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.12);
      color: white;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
      user-select: none;
    }

    .tool-btn:hover, .secondary-btn:hover { background: rgba(255,255,255,0.2); }
    .tool-btn:active, .secondary-btn:active { transform: translateY(1px); }
    .tool-btn.active { background: rgba(255,255,255,0.28); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22); }
    .tool-btn strong { font-size: 15px; }
    .tool-btn em { font-style: italic; font-size: 15px; }

    .color-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 8px;
      border-radius: 9px;
      background: rgba(255,255,255,0.12);
      height: 34px;
    }

    .color-wrap label { font-size: 12px; opacity: 0.92; }
    .color-wrap input[type="color"] {
      width: 28px;
      height: 22px;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .formula-bar {
      height: var(--formula-height);
      display: grid;
      grid-template-columns: 90px 52px 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid #dce3ea;
      z-index: 12;
    }

    .name-box, .formula-input {
      height: 32px;
      border: 1px solid #cad3df;
      border-radius: 8px;
      background: white;
      padding: 0 10px;
      outline: none;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }

    .name-box {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #314156;
      background: #fafbfd;
    }

    .formula-label {
      width: 52px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b778a;
      background: #f6f8fb;
      border: 1px solid #dde3ea;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .formula-input:focus {
      border-color: var(--selection-border);
      box-shadow: 0 0 0 3px rgba(31, 122, 67, 0.12);
    }

    .grid-wrap {
      min-height: 0;
      padding: 10px 12px 0 12px;
    }

    .grid-shell {
      height: 100%;
      background: var(--panel);
      border-radius: 14px 14px 0 0;
      box-shadow: var(--shadow);
      border: 1px solid #dde4ec;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .grid-scroll {
      flex: 1;
      overflow: auto;
      min-height: 0;
      background: white;
    }

    table.grid {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      width: max-content;
      min-width: 100%;
    }

    .grid th, .grid td {
      border-right: 1px solid var(--grid-border);
      border-bottom: 1px solid var(--grid-border);
      height: var(--cell-height);
      padding: 0 8px;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: white;
      position: relative;
      user-select: none;
    }

    .grid thead th {
      position: sticky;
      top: 0;
      z-index: 7;
      background: var(--grid-header);
      text-align: center;
      font-weight: 600;
      color: #44536a;
      height: 30px;
      padding: 0;
    }

    .corner {
      position: sticky !important;
      left: 0;
      z-index: 10 !important;
      width: var(--rownum-width);
      min-width: var(--rownum-width);
      background: var(--grid-header-strong) !important;
      border-right: 1px solid #cfd8e3;
    }

    .row-header {
      position: sticky;
      left: 0;
      z-index: 5;
      width: var(--rownum-width);
      min-width: var(--rownum-width);
      text-align: right;
      padding-right: 10px !important;
      background: var(--grid-header) !important;
      color: #4f5f76;
      font-weight: 500;
    }

    .col-header {
      min-width: var(--default-col-width);
    }

    .col-header.selected-header,
    .row-header.selected-header {
      background: #eaf4ee !important;
      color: var(--excel-green-dark);
    }

    .col-title {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 0 14px 0 10px;
      pointer-events: none;
    }

    .resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 11;
    }

    .resizer:hover::after,
    .resizer.active::after {
      content: "";
      position: absolute;
      top: 0;
      left: 2px;
      width: 2px;
      height: 100%;
      background: var(--selection-border);
    }

    .grid td { cursor: default; }

    .grid td.selected,
    .grid td.range-fill {
      background: var(--selection-fill);
    }

    .grid td.selected::after {
      content: "";
      position: absolute;
      inset: -1px;
      border: 2px solid var(--selection-border);
      pointer-events: none;
      z-index: 4;
    }

    .grid td.range-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--selection-fill);
      pointer-events: none;
      z-index: 1;
    }

    .grid td.range-edge-top::after,
    .grid td.range-edge-bottom::after,
    .grid td.range-edge-left::before,
    .grid td.range-edge-right::before {
      content: "";
      position: absolute;
      background: var(--selection-border);
      z-index: 2;
    }

    .grid td.range-edge-top::after { left: -1px; right: -1px; top: -1px; height: 2px; }
    .grid td.range-edge-bottom::after { left: -1px; right: -1px; bottom: -1px; height: 2px; }
    .grid td.range-edge-left::before { top: -1px; bottom: -1px; left: -1px; width: 2px; }
    .grid td.range-edge-right::before { top: -1px; bottom: -1px; right: -1px; width: 2px; }

    .grid td.ref-highlight {
      background: var(--ref-fill);
    }
    .grid td.ref-highlight::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 2px dashed var(--ref-border);
      pointer-events: none;
      z-index: 3;
    }

    .grid td.editing {
      padding: 0 !important;
      overflow: visible;
    }

    .cell-editor {
      position: absolute;
      inset: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      border: 2px solid var(--selection-border);
      outline: none;
      padding: 0 7px;
      margin: 0;
      background: white;
      z-index: 6;
      font: inherit;
      color: inherit;
    }

    .status-bar {
      height: var(--sheetbar-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 12px;
      background: #f9fbfd;
      border-top: 1px solid #dde5ee;
    }

    .sheet-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .sheet-tabs::-webkit-scrollbar { height: 8px; }
    .sheet-tabs::-webkit-scrollbar-thumb { background: #d2dbe6; border-radius: 999px; }

    .sheet-tab {
      min-width: 108px;
      max-width: 220px;
      height: 30px;
      padding: 0 10px 0 12px;
      border-radius: 9px;
      border: 1px solid #d6deea;
      background: white;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #48566d;
      cursor: pointer;
      flex: 0 0 auto;
      transition: all 0.12s ease;
    }

    .sheet-tab:hover { background: #f8fafc; }
    .sheet-tab.active {
      background: #eaf4ee;
      color: var(--excel-green-dark);
      border-color: #bfd7c9;
      box-shadow: inset 0 -2px 0 var(--excel-green);
    }

    .sheet-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
    }

    .sheet-delete {
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #7d8aa0;
      cursor: pointer;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .sheet-delete:hover { background: rgba(0,0,0,0.06); color: #c0392b; }

    .add-sheet {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      border: 1px dashed #c6d0dc;
      background: white;
      color: #506078;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .footer-meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      padding-right: 4px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: rgba(27,36,48,0.92);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 40;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      .toolbar { flex-wrap: wrap; height: auto; padding-bottom: 12px; }
      .formula-bar { grid-template-columns: 78px 44px 1fr; gap: 8px; }
      .footer-meta { display: none; }
      .sheet-tab { min-width: 90px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="toolbar">
      <div class="title">Spreadsheet Pro</div>
      <div class="toolbar-group">
        <button class="tool-btn" id="boldBtn" title="Bold"><strong>B</strong></button>
        <button class="tool-btn" id="italicBtn" title="Italic"><em>I</em></button>
        <div class="color-wrap" title="Cell background color">
          <label for="bgColorInput">Fill</label>
          <input type="color" id="bgColorInput" value="#fff59d" />
        </div>
        <button class="tool-btn" id="clearBtn" title="Clear contents">Clear</button>
      </div>
      <div class="toolbar-group">
        <button class="secondary-btn" id="downloadCsvBtn">Download CSV</button>
        <button class="secondary-btn" id="uploadCsvBtn">Upload CSV</button>
        <input type="file" id="csvFileInput" accept=".csv,text/csv" hidden />
      </div>
    </div>

    <div class="formula-bar">
      <div class="name-box" id="nameBox">A1</div>
      <div class="formula-label">fx</div>
      <input id="formulaInput" class="formula-input" spellcheck="false" autocomplete="off" />
    </div>

    <div class="grid-wrap">
      <div class="grid-shell">
        <div class="grid-scroll" id="gridScroll">
          <table class="grid" id="gridTable" aria-label="Spreadsheet grid">
            <colgroup id="gridColgroup"></colgroup>
            <thead id="gridHead"></thead>
            <tbody id="gridBody"></tbody>
          </table>
        </div>
        <div class="status-bar">
          <div class="sheet-tabs" id="sheetTabs"></div>
          <div class="footer-meta" id="footerMeta">Ready</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (() => {
      const ROWS = 200;
      const COLS = 40;
      const DEFAULT_COL_WIDTH = 116;
      const MIN_COL_WIDTH = 68;

      const gridTable = document.getElementById('gridTable');
      const gridColgroup = document.getElementById('gridColgroup');
      const gridHead = document.getElementById('gridHead');
      const gridBody = document.getElementById('gridBody');
      const gridScroll = document.getElementById('gridScroll');
      const formulaInput = document.getElementById('formulaInput');
      const nameBox = document.getElementById('nameBox');
      const boldBtn = document.getElementById('boldBtn');
      const italicBtn = document.getElementById('italicBtn');
      const bgColorInput = document.getElementById('bgColorInput');
      const clearBtn = document.getElementById('clearBtn');
      const downloadCsvBtn = document.getElementById('downloadCsvBtn');
      const uploadCsvBtn = document.getElementById('uploadCsvBtn');
      const csvFileInput = document.getElementById('csvFileInput');
      const sheetTabs = document.getElementById('sheetTabs');
      const footerMeta = document.getElementById('footerMeta');
      const toast = document.getElementById('toast');

      const state = {
        workbook: {
          sheets: [createSheet('Sheet1')],
          activeSheetIndex: 0,
        },
        selection: { startRow: 1, startCol: 1, endRow: 1, endCol: 1 },
        referenceSelection: null,
        anchor: { row: 1, col: 1 },
        isDraggingSelection: false,
        isFormulaReferenceDrag: false,
        editing: null,
        columnWidths: Array.from({ length: COLS + 1 }, () => DEFAULT_COL_WIDTH),
        formulaCursor: { start: 0, end: 0 },
        formulaReferenceInsert: null,
        formulaTargetCell: { row: 1, col: 1 },
        toastTimer: null,
        resizeState: null,
      };

      function createSheet(name) {
        return {
          name,
          cells: {},
          computed: {},
          evalMemo: {},
          styleDefaults: {},
        };
      }

      function activeSheet() {
        return state.workbook.sheets[state.workbook.activeSheetIndex];
      }

      function colToLabel(col) {
        let n = col;
        let s = '';
        while (n > 0) {
          const rem = (n - 1) % 26;
          s = String.fromCharCode(65 + rem) + s;
          n = Math.floor((n - 1) / 26);
        }
        return s;
      }

      function labelToCol(label) {
        let value = 0;
        const upper = label.toUpperCase();
        for (const ch of upper) value = value * 26 + (ch.charCodeAt(0) - 64);
        return value;
      }

      function addr(row, col) {
        return `${colToLabel(col)}${row}`;
      }

      function parseAddr(ref) {
        const m = /^([A-Z]+)(\d+)$/i.exec(String(ref || '').trim());
        if (!m) return null;
        const col = labelToCol(m[1]);
        const row = Number(m[2]);
        if (col < 1 || col > COLS || row < 1 || row > ROWS) return null;
        return { row, col, key: addr(row, col) };
      }

      function clamp(n, min, max) {
        return Math.min(max, Math.max(min, n));
      }

      function normalizeRange(range) {
        return {
          startRow: Math.min(range.startRow, range.endRow),
          endRow: Math.max(range.startRow, range.endRow),
          startCol: Math.min(range.startCol, range.endCol),
          endCol: Math.max(range.startCol, range.endCol),
        };
      }

      function selectionAddress(range = state.selection) {
        const r = normalizeRange(range);
        const start = addr(r.startRow, r.startCol);
        const end = addr(r.endRow, r.endCol);
        return start === end ? start : `${start}:${end}`;
      }

      function getCell(sheet, key, create = false) {
        if (!sheet.cells[key] && create) {
          sheet.cells[key] = { input: '', style: { bold: false, italic: false, bg: '' } };
        }
        return sheet.cells[key] || null;
      }

      function getCellInput(sheet, key) {
        const cell = getCell(sheet, key, false);
        return cell ? cell.input : '';
      }

      function getCellStyle(sheet, key) {
        const cell = getCell(sheet, key, false);
        return cell?.style || { bold: false, italic: false, bg: '' };
      }

      function ensureCellStyle(sheet, key) {
        const cell = getCell(sheet, key, true);
        if (!cell.style) cell.style = { bold: false, italic: false, bg: '' };
        return cell.style;
      }

      function setCellInput(sheet, key, input) {
        const value = String(input ?? '');
        if (value === '') {
          const existing = getCell(sheet, key, false);
          if (existing) {
            existing.input = '';
            const s = existing.style || {};
            if (!s.bold && !s.italic && !s.bg) delete sheet.cells[key];
          }
          return;
        }
        const cell = getCell(sheet, key, true);
        cell.input = value;
      }

      function parseLiteral(raw) {
        if (raw == null || raw === '') return '';
        const t = String(raw).trim();
        if (t === '') return '';
        const num = Number(t);
        return Number.isFinite(num) && /^[-+]?\d+(\.\d+)?$/.test(t) ? num : raw;
      }

      function numeric(value) {
        if (typeof value === 'number') return Number.isFinite(value) ? value : 0;
        if (typeof value === 'string' && value.startsWith('#')) throw new Error(value);
        if (value === '' || value == null) return 0;
        const num = Number(value);
        return Number.isFinite(num) ? num : 0;
      }

      function flatten(values) {
        const out = [];
        for (const val of values) {
          if (Array.isArray(val)) out.push(...flatten(val));
          else out.push(val);
        }
        return out;
      }

      function valuesFromRange(sheet, ref, stack) {
        const [startRef, endRef] = ref.toUpperCase().split(':');
        const start = parseAddr(startRef);
        const end = parseAddr(endRef);
        if (!start || !end) throw new Error('#REF!');
        const startRow = Math.min(start.row, end.row);
        const endRow = Math.max(start.row, end.row);
        const startCol = Math.min(start.col, end.col);
        const endCol = Math.max(start.col, end.col);
        const values = [];
        for (let row = startRow; row <= endRow; row++) {
          for (let col = startCol; col <= endCol; col++) {
            values.push(evaluateCell(sheet, addr(row, col), stack));
          }
        }
        return values;
      }

      function transformFormula(expr) {
        let transformed = expr.trim();
        if (/[^A-Za-z0-9_+\-*/().,:\s"]/g.test(transformed)) {
          throw new Error('#ERROR!');
        }
        transformed = transformed.replace(/\bSUM\s*\(/ig, 'func_SUM(');
        transformed = transformed.replace(/\bAVERAGE\s*\(/ig, 'func_AVERAGE(');
        transformed = transformed.replace(/\bMIN\s*\(/ig, 'func_MIN(');
        transformed = transformed.replace(/\bMAX\s*\(/ig, 'func_MAX(');
        transformed = transformed.replace(/([A-Z]+\d+):([A-Z]+\d+)/ig, (m) => `range("${m.toUpperCase()}")`);
        transformed = transformed.replace(/(?<![A-Z0-9_"])([A-Z]+\d+)(?![A-Z0-9_"])/ig, (m) => `ref("${m.toUpperCase()}")`);
        return transformed;
      }

      function evaluateFormula(sheet, raw, stack) {
        const expression = raw.slice(1).trim();
        if (!expression) return '';
        const ref = (cellRef) => {
          const parsed = parseAddr(cellRef);
          if (!parsed) throw new Error('#REF!');
          return evaluateCell(sheet, parsed.key, stack);
        };
        const range = (rangeRef) => valuesFromRange(sheet, rangeRef, stack);
        const func_SUM = (...args) => flatten(args).reduce((sum, value) => sum + numeric(value), 0);
        const func_AVERAGE = (...args) => {
          const nums = flatten(args).map(numeric);
          return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : 0;
        };
        const func_MIN = (...args) => {
          const nums = flatten(args).map(numeric);
          return nums.length ? Math.min(...nums) : 0;
        };
        const func_MAX = (...args) => {
          const nums = flatten(args).map(numeric);
          return nums.length ? Math.max(...nums) : 0;
        };
        try {
          const safe = transformFormula(expression);
          const fn = new Function('ref', 'range', 'func_SUM', 'func_AVERAGE', 'func_MIN', 'func_MAX', `return (${safe});`);
          const value = fn(ref, range, func_SUM, func_AVERAGE, func_MIN, func_MAX);
          if (typeof value === 'number' && !Number.isFinite(value)) return '#ERROR!';
          return value;
        } catch (err) {
          const message = String(err?.message || err || '');
          if (message.startsWith('#')) return message;
          return '#ERROR!';
        }
      }

      function evaluateCell(sheet, key, stack = new Set()) {
        if (sheet.evalMemo[key] !== undefined) return sheet.evalMemo[key];
        if (stack.has(key)) return '#CYCLE!';
        const raw = getCellInput(sheet, key);
        if (!raw) {
          sheet.evalMemo[key] = '';
          return '';
        }
        if (raw.startsWith('=')) {
          stack.add(key);
          const result = evaluateFormula(sheet, raw, stack);
          stack.delete(key);
          sheet.evalMemo[key] = result;
          return result;
        }
        const literal = parseLiteral(raw);
        sheet.evalMemo[key] = literal;
        return literal;
      }

      function recalcSheet(sheet) {
        sheet.evalMemo = {};
        sheet.computed = {};
        const keys = Object.keys(sheet.cells);
        for (const key of keys) {
          sheet.computed[key] = evaluateCell(sheet, key);
        }
      }

      function formatDisplay(value) {
        if (value == null) return '';
        if (typeof value === 'number') {
          if (Number.isInteger(value)) return String(value);
          return String(Number(value.toFixed(8)));
        }
        return String(value);
      }

      function buildGrid() {
        const fragCol = document.createDocumentFragment();
        const rowCol = document.createElement('col');
        rowCol.style.width = '56px';
        fragCol.appendChild(rowCol);
        for (let col = 1; col <= COLS; col++) {
          const c = document.createElement('col');
          c.dataset.col = String(col);
          c.style.width = `${state.columnWidths[col]}px`;
          fragCol.appendChild(c);
        }
        gridColgroup.replaceChildren(fragCol);

        const headRow = document.createElement('tr');
        const corner = document.createElement('th');
        corner.className = 'corner';
        headRow.appendChild(corner);
        for (let col = 1; col <= COLS; col++) {
          const th = document.createElement('th');
          th.className = 'col-header';
          th.dataset.col = String(col);
          const title = document.createElement('div');
          title.className = 'col-title';
          title.textContent = colToLabel(col);
          const resizer = document.createElement('div');
          resizer.className = 'resizer';
          resizer.dataset.col = String(col);
          th.append(title, resizer);
          headRow.appendChild(th);
        }
        gridHead.replaceChildren(headRow);

        const bodyFrag = document.createDocumentFragment();
        for (let row = 1; row <= ROWS; row++) {
          const tr = document.createElement('tr');
          const th = document.createElement('th');
          th.className = 'row-header';
          th.dataset.row = String(row);
          th.textContent = row;
          tr.appendChild(th);
          for (let col = 1; col <= COLS; col++) {
            const td = document.createElement('td');
            td.dataset.row = String(row);
            td.dataset.col = String(col);
            td.tabIndex = -1;
            tr.appendChild(td);
          }
          bodyFrag.appendChild(tr);
        }
        gridBody.replaceChildren(bodyFrag);
      }

      function forEachInRange(range, fn) {
        const r = normalizeRange(range);
        for (let row = r.startRow; row <= r.endRow; row++) {
          for (let col = r.startCol; col <= r.endCol; col++) {
            fn(row, col, r);
          }
        }
      }

      function getCellElement(row, col) {
        return gridBody.querySelector(`td[data-row="${row}"][data-col="${col}"]`);
      }

      function clearSelectionClasses() {
        gridBody.querySelectorAll('.selected, .range-fill, .range-edge-top, .range-edge-bottom, .range-edge-left, .range-edge-right, .ref-highlight').forEach(el => {
          el.classList.remove('selected', 'range-fill', 'range-edge-top', 'range-edge-bottom', 'range-edge-left', 'range-edge-right', 'ref-highlight');
        });
        gridHead.querySelectorAll('.selected-header').forEach(el => el.classList.remove('selected-header'));
        gridBody.querySelectorAll('.row-header.selected-header').forEach(el => el.classList.remove('selected-header'));
      }

      function paintRange(range, classMode = 'selection') {
        const r = normalizeRange(range);
        forEachInRange(r, (row, col) => {
          const td = getCellElement(row, col);
          if (!td) return;
          if (classMode === 'reference') {
            td.classList.add('ref-highlight');
            return;
          }
          const single = r.startRow === r.endRow && r.startCol === r.endCol;
          if (single) {
            td.classList.add('selected');
          } else {
            td.classList.add('range-fill');
            if (row === r.startRow) td.classList.add('range-edge-top');
            if (row === r.endRow) td.classList.add('range-edge-bottom');
            if (col === r.startCol) td.classList.add('range-edge-left');
            if (col === r.endCol) td.classList.add('range-edge-right');
          }
        });

        if (classMode === 'selection') {
          for (let col = r.startCol; col <= r.endCol; col++) {
            const header = gridHead.querySelector(`th[data-col="${col}"]`);
            if (header) header.classList.add('selected-header');
          }
          for (let row = r.startRow; row <= r.endRow; row++) {
            const header = gridBody.querySelector(`th[data-row="${row}"]`);
            if (header) header.classList.add('selected-header');
          }
        }
      }

      function renderGridValues() {
        const sheet = activeSheet();
        recalcSheet(sheet);
        for (let row = 1; row <= ROWS; row++) {
          for (let col = 1; col <= COLS; col++) {
            const key = addr(row, col);
            const td = getCellElement(row, col);
            if (!td || td.classList.contains('editing')) continue;
            td.textContent = formatDisplay(sheet.computed[key] ?? '');
            const style = getCellStyle(sheet, key);
            td.style.fontWeight = style.bold ? '700' : '400';
            td.style.fontStyle = style.italic ? 'italic' : 'normal';
            td.style.backgroundColor = style.bg || '';
          }
        }
        renderSelection();
        updateFormulaUI();
      }

      function renderSelection() {
        clearSelectionClasses();
        paintRange(state.selection, 'selection');
        if (state.referenceSelection) paintRange(state.referenceSelection, 'reference');
      }

      function setSelection(range, keepAnchor = false) {
        state.selection = {
          startRow: clamp(range.startRow, 1, ROWS),
          startCol: clamp(range.startCol, 1, COLS),
          endRow: clamp(range.endRow, 1, ROWS),
          endCol: clamp(range.endCol, 1, COLS),
        };
        const norm = normalizeRange(state.selection);
        if (!keepAnchor) {
          state.anchor = { row: norm.startRow, col: norm.startCol };
        }
        state.formulaTargetCell = { row: norm.startRow, col: norm.startCol };
        renderSelection();
        updateFormulaUI();
        syncToolbarState();
        ensureCellVisible(norm.startRow, norm.startCol);
      }

      function updateFormulaUI() {
        const sheet = activeSheet();
        const norm = normalizeRange(state.selection);
        const key = addr(norm.startRow, norm.startCol);
        nameBox.textContent = selectionAddress();
        if (document.activeElement !== formulaInput && !state.editing) {
          const raw = getCellInput(sheet, key);
          formulaInput.value = raw || formatDisplay(sheet.computed[key] ?? '');
        }
        footerMeta.textContent = `${activeSheet().name} · ${selectionAddress()}${state.referenceSelection ? ` · Ref ${selectionAddress(state.referenceSelection)}` : ''}`;
      }

      function syncToolbarState() {
        const sheet = activeSheet();
        const norm = normalizeRange(state.selection);
        const key = addr(norm.startRow, norm.startCol);
        const style = getCellStyle(sheet, key);
        boldBtn.classList.toggle('active', !!style.bold);
        italicBtn.classList.toggle('active', !!style.italic);
        bgColorInput.value = normalizeHex(style.bg || '#fff59d');
      }

      function normalizeHex(color) {
        if (!color) return '#fff59d';
        const ctx = document.createElement('canvas').getContext('2d');
        ctx.fillStyle = color;
        const resolved = ctx.fillStyle;
        if (resolved.startsWith('#')) {
          if (resolved.length === 4) {
            return '#' + [...resolved.slice(1)].map(ch => ch + ch).join('');
          }
          return resolved;
        }
        const m = resolved.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
        if (!m) return '#fff59d';
        return '#' + m.slice(1).map(v => Number(v).toString(16).padStart(2, '0')).join('');
      }

      function ensureCellVisible(row, col) {
        const td = getCellElement(row, col);
        if (!td) return;
        const gridRect = gridScroll.getBoundingClientRect();
        const cellRect = td.getBoundingClientRect();
        const leftPinnedWidth = 56;
        if (cellRect.right > gridRect.right) gridScroll.scrollLeft += cellRect.right - gridRect.right + 8;
        if (cellRect.left < gridRect.left + leftPinnedWidth) gridScroll.scrollLeft -= (gridRect.left + leftPinnedWidth) - cellRect.left + 8;
        if (cellRect.bottom > gridRect.bottom) gridScroll.scrollTop += cellRect.bottom - gridRect.bottom + 8;
        if (cellRect.top < gridRect.top + 28) gridScroll.scrollTop -= (gridRect.top + 28) - cellRect.top + 8;
      }

      function commitFormulaInput() {
        if (state.editing) return;
        const target = state.formulaTargetCell || normalizeRange(state.selection);
        const row = target.row ?? target.startRow;
        const col = target.col ?? target.startCol;
        const key = addr(row, col);
        setCellInput(activeSheet(), key, formulaInput.value);
        state.referenceSelection = null;
        state.formulaReferenceInsert = null;
        renderGridValues();
      }

      function beginCellEdit(row, col, initialText = null, selectAll = false) {
        endCellEdit(false);
        const td = getCellElement(row, col);
        if (!td) return;
        setSelection({ startRow: row, startCol: col, endRow: row, endCol: col });
        const key = addr(row, col);
        const sheet = activeSheet();
        const current = getCellInput(sheet, key);
        td.classList.add('editing');
        td.textContent = '';
        const input = document.createElement('input');
        input.className = 'cell-editor';
        input.spellcheck = false;
        input.value = initialText != null ? initialText : current;
        const style = getCellStyle(sheet, key);
        input.style.fontWeight = style.bold ? '700' : '400';
        input.style.fontStyle = style.italic ? 'italic' : 'normal';
        input.style.backgroundColor = style.bg || 'white';
        td.appendChild(input);
        state.editing = { row, col, input, initial: current };
        state.referenceSelection = null;
        formulaInput.value = input.value;
        input.focus();
        if (selectAll) input.select();
        else input.setSelectionRange(input.value.length, input.value.length);

        input.addEventListener('input', () => {
          formulaInput.value = input.value;
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            endCellEdit(true);
            moveSelection(1, 0);
          } else if (e.key === 'Escape') {
            e.preventDefault();
            endCellEdit(false);
          } else if (e.key === 'Tab') {
            e.preventDefault();
            endCellEdit(true);
            moveSelection(0, e.shiftKey ? -1 : 1);
          }
        });
        input.addEventListener('blur', () => {
          if (state.editing?.input === input) endCellEdit(true);
        });
      }

      function endCellEdit(commit = true) {
        const edit = state.editing;
        if (!edit) return;
        const { row, col, input } = edit;
        const key = addr(row, col);
        const td = getCellElement(row, col);
        const nextValue = commit ? input.value : edit.initial;
        setCellInput(activeSheet(), key, nextValue);
        state.editing = null;
        state.referenceSelection = null;
        state.formulaReferenceInsert = null;
        if (td) {
          td.classList.remove('editing');
          td.innerHTML = '';
        }
        renderGridValues();
      }

      function moveSelection(rowDelta, colDelta) {
        endCellEdit(true);
        const norm = normalizeRange(state.selection);
        const row = clamp(norm.startRow + rowDelta, 1, ROWS);
        const col = clamp(norm.startCol + colDelta, 1, COLS);
        setSelection({ startRow: row, startCol: col, endRow: row, endCol: col });
      }

      function applyStyleToSelection(updater) {
        const sheet = activeSheet();
        forEachInRange(state.selection, (row, col) => {
          const key = addr(row, col);
          const style = ensureCellStyle(sheet, key);
          updater(style, key, sheet);
        });
        renderGridValues();
      }

      function clearContents() {
        const sheet = activeSheet();
        forEachInRange(state.selection, (row, col) => {
          const key = addr(row, col);
          const cell = getCell(sheet, key, false);
          if (!cell) return;
          cell.input = '';
          if (!cell.style?.bold && !cell.style?.italic && !cell.style?.bg) delete sheet.cells[key];
        });
        renderGridValues();
      }

      function collectUsedBounds(sheet) {
        let maxRow = 1;
        let maxCol = 1;
        for (const key of Object.keys(sheet.cells)) {
          const cell = sheet.cells[key];
          if (!cell || (cell.input === '' && !cell.style?.bold && !cell.style?.italic && !cell.style?.bg)) continue;
          const parsed = parseAddr(key);
          if (!parsed) continue;
          maxRow = Math.max(maxRow, parsed.row);
          maxCol = Math.max(maxCol, parsed.col);
        }
        return { maxRow, maxCol };
      }

      function downloadCsv() {
        const sheet = activeSheet();
        recalcSheet(sheet);
        const { maxRow, maxCol } = collectUsedBounds(sheet);
        const lines = [];
        for (let row = 1; row <= maxRow; row++) {
          const values = [];
          for (let col = 1; col <= maxCol; col++) {
            const key = addr(row, col);
            const text = formatDisplay(sheet.computed[key] ?? '');
            const escaped = String(text).replace(/"/g, '""');
            values.push(/[",\n]/.test(escaped) ? `"${escaped}"` : escaped);
          }
          lines.push(values.join(','));
        }
        const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${sheet.name || 'sheet'}.csv`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showToast('CSV downloaded for the active sheet.');
      }

      function parseCsv(text) {
        const rows = [];
        let row = [];
        let cell = '';
        let i = 0;
        let inQuotes = false;
        while (i < text.length) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"' && text[i + 1] === '"') {
              cell += '"';
              i += 2;
              continue;
            }
            if (ch === '"') {
              inQuotes = false;
              i++;
              continue;
            }
            cell += ch;
            i++;
            continue;
          }
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cell);
            cell = '';
          } else if (ch === '\n') {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          } else if (ch === '\r') {
          } else {
            cell += ch;
          }
          i++;
        }
        row.push(cell);
        rows.push(row);
        return rows;
      }

      function uploadCsvFile(file) {
        const reader = new FileReader();
        reader.onload = () => {
          const rows = parseCsv(String(reader.result || ''));
          const sheet = activeSheet();
          const preserved = {};
          for (const [key, cell] of Object.entries(sheet.cells)) {
            if (cell.style?.bold || cell.style?.italic || cell.style?.bg) {
              preserved[key] = { input: '', style: { ...cell.style } };
            }
          }
          sheet.cells = preserved;
          rows.slice(0, ROWS).forEach((values, rowIndex) => {
            values.slice(0, COLS).forEach((value, colIndex) => {
              if (value !== '') setCellInput(sheet, addr(rowIndex + 1, colIndex + 1), value);
            });
          });
          renderGridValues();
          showToast('CSV uploaded into the active sheet.');
        };
        reader.readAsText(file);
      }

      function renderSheetTabs() {
        const frag = document.createDocumentFragment();
        state.workbook.sheets.forEach((sheet, index) => {
          const tab = document.createElement('div');
          tab.className = 'sheet-tab' + (index === state.workbook.activeSheetIndex ? ' active' : '');
          tab.dataset.index = String(index);
          tab.title = `${sheet.name} (double-click to rename)`;

          const name = document.createElement('div');
          name.className = 'sheet-name';
          name.textContent = sheet.name;

          const del = document.createElement('button');
          del.className = 'sheet-delete';
          del.title = 'Delete sheet';
          del.textContent = '×';
          del.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteSheet(index);
          });

          tab.append(name, del);
          tab.addEventListener('click', () => switchSheet(index));
          tab.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            renameSheet(index);
          });
          frag.appendChild(tab);
        });
        const add = document.createElement('button');
        add.className = 'add-sheet';
        add.title = 'Add sheet';
        add.textContent = '+';
        add.addEventListener('click', addSheet);
        frag.appendChild(add);
        sheetTabs.replaceChildren(frag);
      }

      function switchSheet(index) {
        endCellEdit(true);
        state.workbook.activeSheetIndex = index;
        state.referenceSelection = null;
        renderSheetTabs();
        renderGridValues();
      }

      function addSheet() {
        endCellEdit(true);
        let n = state.workbook.sheets.length + 1;
        let name = `Sheet${n}`;
        const existing = new Set(state.workbook.sheets.map(s => s.name));
        while (existing.has(name)) {
          n += 1;
          name = `Sheet${n}`;
        }
        state.workbook.sheets.push(createSheet(name));
        state.workbook.activeSheetIndex = state.workbook.sheets.length - 1;
        renderSheetTabs();
        renderGridValues();
        showToast(`Added ${name}.`);
      }

      function renameSheet(index) {
        const sheet = state.workbook.sheets[index];
        const next = prompt('Rename sheet', sheet.name);
        if (next == null) return;
        const trimmed = next.trim();
        if (!trimmed) return showToast('Sheet name cannot be empty.');
        if (state.workbook.sheets.some((s, i) => i !== index && s.name === trimmed)) {
          return showToast('A sheet with that name already exists.');
        }
        sheet.name = trimmed;
        renderSheetTabs();
        updateFormulaUI();
      }

      function deleteSheet(index) {
        if (state.workbook.sheets.length === 1) return showToast('At least one sheet is required.');
        const target = state.workbook.sheets[index];
        const ok = confirm(`Delete ${target.name}?`);
        if (!ok) return;
        state.workbook.sheets.splice(index, 1);
        state.workbook.activeSheetIndex = Math.max(0, Math.min(state.workbook.activeSheetIndex, state.workbook.sheets.length - 1));
        renderSheetTabs();
        renderGridValues();
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(state.toastTimer);
        state.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function startFormulaReferenceSelection(row, col) {
        if (!(document.activeElement === formulaInput && formulaInput.value.trim().startsWith('='))) return false;
        state.isFormulaReferenceDrag = true;
        state.referenceSelection = { startRow: row, startCol: col, endRow: row, endCol: col };
        if (!state.formulaReferenceInsert) {
          state.formulaReferenceInsert = {
            start: formulaInput.selectionStart ?? formulaInput.value.length,
            end: formulaInput.selectionEnd ?? formulaInput.value.length,
            base: formulaInput.value,
          };
        }
        applyFormulaReferenceSelection();
        return true;
      }

      function updateFormulaReferenceSelection(row, col) {
        if (!state.isFormulaReferenceDrag || !state.referenceSelection) return;
        state.referenceSelection.endRow = clamp(row, 1, ROWS);
        state.referenceSelection.endCol = clamp(col, 1, COLS);
        applyFormulaReferenceSelection();
      }

      function applyFormulaReferenceSelection() {
        const ref = state.referenceSelection;
        const insert = state.formulaReferenceInsert;
        if (!ref || !insert) return;
        const text = selectionAddress(ref);
        formulaInput.value = insert.base.slice(0, insert.start) + text + insert.base.slice(insert.end);
        const caret = insert.start + text.length;
        formulaInput.focus();
        formulaInput.setSelectionRange(caret, caret);
        renderSelection();
      }

      function finishFormulaReferenceSelection() {
        if (!state.isFormulaReferenceDrag) return;
        state.isFormulaReferenceDrag = false;
        const ref = state.referenceSelection;
        if (ref && state.formulaReferenceInsert) {
          const text = selectionAddress(ref);
          const caret = state.formulaReferenceInsert.start + text.length;
          formulaInput.focus();
          formulaInput.setSelectionRange(caret, caret);
          state.formulaCursor = { start: caret, end: caret };
        }
      }

      function onGridMouseDown(e) {
        const resizer = e.target.closest('.resizer');
        if (resizer) return startColumnResize(e, Number(resizer.dataset.col));
        const td = e.target.closest('td');
        if (!td) return;
        const row = Number(td.dataset.row);
        const col = Number(td.dataset.col);

        endCellEdit(true);

        if (startFormulaReferenceSelection(row, col)) {
          e.preventDefault();
          return;
        }

        state.isDraggingSelection = true;
        state.anchor = { row, col };
        setSelection({ startRow: row, startCol: col, endRow: row, endCol: col }, true);
        formulaInput.blur();
      }

      function onGridMouseMove(e) {
        const td = e.target.closest('td');
        if (!td) return;
        const row = Number(td.dataset.row);
        const col = Number(td.dataset.col);

        if (state.isFormulaReferenceDrag) {
          updateFormulaReferenceSelection(row, col);
          return;
        }
        if (!state.isDraggingSelection) return;
        state.selection = { startRow: state.anchor.row, startCol: state.anchor.col, endRow: row, endCol: col };
        renderSelection();
        updateFormulaUI();
      }

      function onGridMouseUp() {
        if (state.isDraggingSelection) {
          state.isDraggingSelection = false;
          renderSelection();
          updateFormulaUI();
          syncToolbarState();
        }
        finishFormulaReferenceSelection();
      }

      function startColumnResize(e, col) {
        e.preventDefault();
        e.stopPropagation();
        const target = gridHead.querySelector(`.resizer[data-col="${col}"]`);
        if (target) target.classList.add('active');
        state.resizeState = {
          col,
          startX: e.clientX,
          startWidth: state.columnWidths[col],
          handle: target,
        };
      }

      function onPointerMove(e) {
        if (state.resizeState) {
          const delta = e.clientX - state.resizeState.startX;
          const width = clamp(state.resizeState.startWidth + delta, MIN_COL_WIDTH, 320);
          state.columnWidths[state.resizeState.col] = width;
          const colEl = gridColgroup.querySelector(`col[data-col="${state.resizeState.col}"]`);
          if (colEl) colEl.style.width = `${width}px`;
          return;
        }
      }

      function onPointerUp() {
        if (state.resizeState?.handle) state.resizeState.handle.classList.remove('active');
        state.resizeState = null;
        onGridMouseUp();
      }

      function handleDocumentKeydown(e) {
        if (state.editing) return;
        if (document.activeElement === formulaInput) return;
        const meta = e.ctrlKey || e.metaKey;
        if (meta && e.key.toLowerCase() === 'b') {
          e.preventDefault();
          boldBtn.click();
          return;
        }
        if (meta && e.key.toLowerCase() === 'i') {
          e.preventDefault();
          italicBtn.click();
          return;
        }
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Tab'].includes(e.key)) {
          e.preventDefault();
        }
        switch (e.key) {
          case 'ArrowUp': moveSelection(-1, 0); break;
          case 'ArrowDown': moveSelection(1, 0); break;
          case 'ArrowLeft': moveSelection(0, -1); break;
          case 'ArrowRight': moveSelection(0, 1); break;
          case 'Enter': moveSelection(1, 0); break;
          case 'Tab': moveSelection(0, e.shiftKey ? -1 : 1); break;
          case 'F2': {
            const s = normalizeRange(state.selection);
            beginCellEdit(s.startRow, s.startCol, null, false);
            break;
          }
          case 'Delete':
          case 'Backspace':
            clearContents();
            break;
          default: {
            if (!meta && e.key.length === 1) {
              const s = normalizeRange(state.selection);
              beginCellEdit(s.startRow, s.startCol, e.key, false);
            }
          }
        }
      }

      gridBody.addEventListener('mousedown', onGridMouseDown);
      gridBody.addEventListener('dblclick', (e) => {
        const td = e.target.closest('td');
        if (!td) return;
        beginCellEdit(Number(td.dataset.row), Number(td.dataset.col), null, false);
      });
      gridBody.addEventListener('mousemove', onGridMouseMove);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      document.addEventListener('keydown', handleDocumentKeydown);

      formulaInput.addEventListener('focus', () => {
        state.formulaCursor = {
          start: formulaInput.selectionStart ?? formulaInput.value.length,
          end: formulaInput.selectionEnd ?? formulaInput.value.length,
        };
        const norm = normalizeRange(state.selection);
        state.formulaTargetCell = { row: norm.startRow, col: norm.startCol };
      });

      ['keyup', 'click', 'select'].forEach(evt => {
        formulaInput.addEventListener(evt, () => {
          state.formulaCursor = {
            start: formulaInput.selectionStart ?? formulaInput.value.length,
            end: formulaInput.selectionEnd ?? formulaInput.value.length,
          };
          state.formulaReferenceInsert = null;
        });
      });

      formulaInput.addEventListener('input', () => {
        state.referenceSelection = null;
        state.formulaReferenceInsert = null;
      });

      formulaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          commitFormulaInput();
          moveSelection(1, 0);
        } else if (e.key === 'Escape') {
          e.preventDefault();
          state.referenceSelection = null;
          state.formulaReferenceInsert = null;
          updateFormulaUI();
          renderSelection();
          formulaInput.blur();
        } else if (e.key === 'Tab') {
          e.preventDefault();
          commitFormulaInput();
          moveSelection(0, e.shiftKey ? -1 : 1);
        }
      });

      formulaInput.addEventListener('blur', () => {
        if (state.isFormulaReferenceDrag) return;
        state.formulaReferenceInsert = null;
        state.referenceSelection = null;
        renderSelection();
      });

      boldBtn.addEventListener('click', () => {
        const key = addr(normalizeRange(state.selection).startRow, normalizeRange(state.selection).startCol);
        const current = getCellStyle(activeSheet(), key).bold;
        applyStyleToSelection(style => { style.bold = !current; });
      });

      italicBtn.addEventListener('click', () => {
        const key = addr(normalizeRange(state.selection).startRow, normalizeRange(state.selection).startCol);
        const current = getCellStyle(activeSheet(), key).italic;
        applyStyleToSelection(style => { style.italic = !current; });
      });

      bgColorInput.addEventListener('input', () => {
        const color = bgColorInput.value;
        applyStyleToSelection(style => { style.bg = color; });
      });

      clearBtn.addEventListener('click', clearContents);
      downloadCsvBtn.addEventListener('click', downloadCsv);
      uploadCsvBtn.addEventListener('click', () => csvFileInput.click());
      csvFileInput.addEventListener('change', () => {
        const [file] = csvFileInput.files || [];
        if (file) uploadCsvFile(file);
        csvFileInput.value = '';
      });

      nameBox.addEventListener('dblclick', () => {
        const entered = prompt('Go to cell', nameBox.textContent);
        if (!entered) return;
        const parsed = parseAddr(entered.trim());
        if (!parsed) return showToast('Invalid cell address.');
        setSelection({ startRow: parsed.row, startCol: parsed.col, endRow: parsed.row, endCol: parsed.col });
      });

      buildGrid();
      renderSheetTabs();
      renderGridValues();
      setSelection({ startRow: 1, startCol: 1, endRow: 1, endCol: 1 });

      // Seed demo values for a more spreadsheet-like first impression.
      const demo = activeSheet();
      setCellInput(demo, 'A1', 'Quarter');
      setCellInput(demo, 'B1', 'Sales');
      setCellInput(demo, 'A2', 'Q1');
      setCellInput(demo, 'A3', 'Q2');
      setCellInput(demo, 'A4', 'Q3');
      setCellInput(demo, 'A5', 'Q4');
      setCellInput(demo, 'B2', '12500');
      setCellInput(demo, 'B3', '17420');
      setCellInput(demo, 'B4', '16210');
      setCellInput(demo, 'B5', '18950');
      setCellInput(demo, 'A7', 'Total');
      setCellInput(demo, 'B7', '=SUM(B2:B5)');
      setCellInput(demo, 'A8', 'Average');
      setCellInput(demo, 'B8', '=AVERAGE(B2:B5)');
      ensureCellStyle(demo, 'A1').bold = true;
      ensureCellStyle(demo, 'B1').bold = true;
      ensureCellStyle(demo, 'A7').bold = true;
      ensureCellStyle(demo, 'A8').bold = true;
      ensureCellStyle(demo, 'B7').bg = '#eaf4ee';
      ensureCellStyle(demo, 'B8').bg = '#eef5ff';
      renderGridValues();
    })();
  </script>
</body>
</html>
