<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-Sheets — Spreadsheet</title>
<style>
  :root{
    --line:#d4d7dc; --head:#f3f4f6; --sel:#2173ff; --selbg:rgba(33,115,255,.12);
    --accent:#2173ff; --ink:#1f2329; --muted:#6b7280;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.3 "Segoe UI",system-ui,Roboto,Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 10px;background:#fafbfc;border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .brand{font-weight:700;letter-spacing:.5px;margin-right:8px;color:var(--accent)}
  .brand span{color:var(--ink)}
  .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
  button.t{padding:6px 10px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink)}
  button.t:hover{background:#eef0f3}
  button.t.on{background:#dbe9ff;border-color:#9cc0ff;color:#0b53c9}
  button.t.b{font-weight:700;font-style:normal}
  button.t.i{font-style:italic;font-weight:400}
  button.t.primary{background:var(--accent);color:#fff}
  button.t.primary:hover{background:#1a63e0}
  input[type=color].t{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:#fff;cursor:pointer}
  label.lbl{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
  #fileInput{display:none}

  /* ---------- Formula bar ---------- */
  .formulabar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);background:#fff}
  .fx{font-style:italic;font-weight:700;color:var(--muted);padding:0 14px;border-right:1px solid var(--line);height:34px;display:flex;align-items:center}
  #cellAddr{width:78px;border:none;border-right:1px solid var(--line);height:34px;text-align:center;font-weight:600;outline:none;background:#fafbfc}
  .fsep{width:1px;height:34px;background:var(--line)}
  #formulaInput{flex:1;height:34px;border:none;padding:0 12px;outline:none;font-size:14px}
  #formulaInput:focus{background:#f5f9ff}

  /* ---------- Grid ---------- */
  .grid-wrap{flex:1;overflow:auto;position:relative;background:#fff}
  table{border-collapse:collapse;table-layout:fixed;width:max-content;min-width:100%}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;padding:0 4px;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  thead th,th.rowh{background:var(--head);color:var(--muted);font-weight:600;text-align:center;user-select:none}
  thead th{position:sticky;top:0;z-index:3;height:26px}
  th.rowh{position:sticky;left:0;z-index:2;width:48px;min-width:48px}
  th.corner{position:sticky;left:0;top:0;z-index:4;width:48px;cursor:pointer}
  td{position:relative;cursor:cell}
  td:nth-child(2){ } /* first data column after row header */
  col.rh-col{width:48px}
  td.sel{box-shadow:inset 0 0 0 100px var(--selbg)}
  td.active{box-shadow:inset 0 0 0 2px var(--sel);z-index:1}
  td.active.sel{box-shadow:inset 0 0 0 2px var(--sel)}
  th.colh .rs{position:absolute;right:-3px;top:0;width:7px;height:100%;cursor:col-resize;z-index:5}
  th.colh{position:relative}
  .cell-input{position:absolute;inset:0;width:100%;height:100%;border:2px solid var(--sel);padding:0 3px;font:inherit;outline:none;background:#fff;z-index:6}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;align-items:center;gap:2px;padding:4px 8px;border-top:1px solid var(--line);background:#fafbfc;overflow-x:auto}
  button.tab{padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:6px 6px 0 0;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
  button.tab.active{background:#fff;border-bottom-color:#fff;font-weight:600;color:var(--accent)}
  button.tab .tab-x{color:#aaa;font-weight:700;padding:0 2px;border-radius:4px}
  button.tab .tab-x:hover{background:#ffd9d9;color:#c00}
  button.tab.add{border:none;background:transparent;font-size:18px;padding:4px 10px;color:var(--muted)}

  .hint{padding:4px 10px;font-size:11px;color:var(--muted);background:#fafbfc;border-top:1px solid var(--line)}
  .hint b{color:var(--ink)}
</style>
</head>
<body>

<div class="toolbar">
  <div class="brand">X‑<span>Sheets</span></div>
  <div class="sep"></div>
  <button class="t b" id="boldBtn" title="Bold (Ctrl+B)">B</button>
  <button class="t i" id="italicBtn" title="Italic (Ctrl+I)">I</button>
  <div class="sep"></div>
  <label class="lbl">Fill <input type="color" class="t" id="fillColor" value="#fff3b0" title="Cell background color"></label>
  <button class="t" id="clearColorBtn" title="Clear fill color">No fill</button>
  <div class="sep"></div>
  <button class="t" id="clearBtn" title="Clear contents (Delete)">Clear</button>
  <div class="sep"></div>
  <button class="t" id="uploadBtn" title="Import CSV">Upload CSV</button>
  <button class="t" id="downloadBtn" title="Export active sheet as CSV">Download CSV</button>
  <div class="sep"></div>
  <button class="t" id="addSheetBtn" title="Add sheet">+ Sheet</button>
  <button class="t" id="deleteSheetBtn" title="Delete active sheet">– Sheet</button>
  <input type="file" id="fileInput" accept=".csv,text/csv">
</div>

<div class="formulabar">
  <div class="fx">fx</div>
  <input id="cellAddr" readonly title="Active cell">
  <div class="fsep"></div>
  <input id="formulaInput" spellcheck="false" title="Edit value or formula (start with =). Click/drag cells to insert references.">
</div>

<div class="grid-wrap" id="gridWrap">
  <table id="sheet"></table>
</div>

<div class="tabs" id="tabBar"></div>
<div class="hint">
  Click/drag to select · <b>F2</b> or double‑click to edit · <b>Enter/Tab</b> move · <b>=</b> starts a formula ·
  <b>=A1+B2</b> · <b>=SUM(A1:A10)</b> · <b>AVERAGE / MIN / MAX</b> · edit the formula bar and click cells to insert references.
</div>

<script>
"use strict";
/* ===================== Model ===================== */
const ROWS = 100, COLS = 26;
const workbook = { sheets: [], active: 0 };

function newSheet(name){
  return { name, cells:{}, colWidths: Array(COLS).fill(80) };
}
function activeSheet(){ return workbook.sheets[workbook.active]; }

function colLetter(c){ let s=''; c+=1; while(c>0){ const m=(c-1)%26; s=String.fromCharCode(65+m)+s; c=Math.floor((c-1)/26);} return s; }
function letterToCol(s){ let n=0; for(const ch of s){ n=n*26+(ch.toUpperCase().charCodeAt(0)-64);} return n-1; }
function addr(r,c){ return colLetter(c)+r; }
function rc(a){ const m=/^([A-Za-z]+)(\d+)$/i.exec(a); if(!m) return null; return [parseInt(m[2],10), letterToCol(m[1])]; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

function ensure(sheet,a){ if(!sheet.cells[a]) sheet.cells[a]={raw:'',formula:null,value:'',style:{}}; return sheet.cells[a]; }
function setCell(sheet,a,raw){
  raw = raw==null?'':String(raw);
  const cell = ensure(sheet,a);
  cell.raw = raw;
  cell.formula = raw.startsWith('=') ? raw : null;
}
function getCell(sheet,a){ return sheet.cells[a]; }

/* ===================== Formula engine ===================== */
function parseRaw(raw){
  if(raw==null) return '';
  raw = String(raw);
  if(raw.trim()==='') return '';
  const n = Number(raw);
  return (!isNaN(n) && raw.trim()!=='') ? n : raw;
}
function toNum(v){
  if(v===''||v==null) return 0;
  if(typeof v==='number') return v;
  if(typeof v==='string'){ if(v[0]==='#') return NaN; const n=Number(v); return isNaN(n)?NaN:n; }
  return NaN;
}
function expandRange(a1,a2){
  const [r1,c1]=rc(a1), [r2,c2]=rc(a2);
  const r0=Math.min(r1,r2), r1m=Math.max(r1,r2), c0=Math.min(c1,c2), c1m=Math.max(c1,c2);
  const out=[];
  for(let r=r0;r<=r1m;r++) for(let c=c0;c<=c1m;c++) out.push(addr(r,c));
  return out;
}
function tokenize(formula){
  let s = formula.replace(/^=/,'');
  const tokens=[]; let i=0;
  const isDigit=c=>c>='0'&&c<='9';
  const isAlpha=c=>(c>='a'&&c<='z')||(c>='A'&&c<='Z');
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\t'||c==='\n'){ i++; continue; }
    if(isDigit(c)||c==='.'){ let j=i; while(j<s.length && (isDigit(s[j])||s[j]==='.')) j++; tokens.push({t:'num',v:parseFloat(s.slice(i,j))}); i=j; continue; }
    if(isAlpha(c)){ let j=i; while(j<s.length && (isAlpha(s[j])||isDigit(s[j]))) j++; const word=s.slice(i,j);
      let k=j; while(k<s.length && (s[k]===' '||s[k]==='\t')) k++;
      if(s[k]==='(') tokens.push({t:'func',v:word.toUpperCase()});
      else if(/^[A-Za-z]+\d+$/.test(word)) tokens.push({t:'ref',v:word.toUpperCase()});
      else tokens.push({t:'name',v:word.toUpperCase()});
      i=j; continue; }
    if(c===':'){ tokens.push({t:'colon'}); i++; continue; }
    if(c==='('){ tokens.push({t:'lp'}); i++; continue; }
    if(c===')'){ tokens.push({t:'rp'}); i++; continue; }
    if(c===','){ tokens.push({t:'comma'}); i++; continue; }
    if('+-*/'.includes(c)){ tokens.push({t:'op',v:c}); i++; continue; }
    i++;
  }
  return tokens;
}
function applyFunc(fn,args,evalCell){
  function nums(){ const out=[]; for(const a of args){
      if(a&&a.range){ for(const c of expandRange(a.range[0],a.range[1])){ const v=toNum(evalCell(c)); if(!isNaN(v)) out.push(v); } }
      else { const v=toNum(a); if(!isNaN(v)) out.push(v); } }
    return out; }
  switch(fn){
    case 'SUM': { const n=nums(); return n.reduce((s,x)=>s+x,0); }
    case 'AVERAGE': { const n=nums(); return n.length? n.reduce((s,x)=>s+x,0)/n.length : 0; }
    case 'MIN': { const n=nums(); return n.length? Math.min(...n):0; }
    case 'MAX': { const n=nums(); return n.length? Math.max(...n):0; }
    case 'COUNT': return nums().length;
    default: throw new Error('unknown function '+fn);
  }
}
function evalFormula(formula, evalCell){
  const tokens = tokenize(formula);
  let pos=0;
  const peek=()=>tokens[pos], next=()=>tokens[pos++];
  function evExpr(){ let v=evTerm(); while(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){ const op=next().v; const r=evTerm(); v = op==='+'? v+r : v-r; } return v; }
  function evTerm(){ let v=evFactor(); while(peek()&&peek().t==='op'&&(peek().v==='*'||peek().v==='/')){ const op=next().v; const r=evFactor(); if(op==='/'&&r===0) return '#DIV/0!'; v = op==='*'? v*r : v/r; } return v; }
  function evFactor(){ let sign=1; if(peek()&&peek().t==='op'&&(peek().v==='+'||peek().v==='-')){ if(next().v==='-') sign=-1; } return sign*evPrimary(); }
  function evPrimary(){
    const tk=peek(); if(!tk) throw new Error('unexpected end');
    if(tk.t==='num'){ next(); return tk.v; }
    if(tk.t==='lp'){ next(); const v=evExpr(); if(peek()&&peek().t==='rp') next(); else throw new Error('missing )'); return v; }
    if(tk.t==='func') return evFunc();
    if(tk.t==='ref'){ next(); if(peek()&&peek().t==='colon'){ next(); const b=next(); if(!b||b.t!=='ref') throw new Error('bad range'); return {range:[tk.v,b.v]}; } return evalCell(tk.v); }
    throw new Error('bad token');
  }
  function evFunc(){ const fn=next().v; if(!(peek()&&peek().t==='lp')) throw new Error('missing ('); next(); const args=[];
    if(!(peek()&&peek().t==='rp')){ args.push(evArg()); while(peek()&&peek().t==='comma'){ next(); args.push(evArg()); } }
    if(!(peek()&&peek().t==='rp')) throw new Error('missing )'); next(); return applyFunc(fn,args,evalCell); }
  function evArg(){ if(peek()&&peek().t==='ref'&&tokens[pos+1]&&tokens[pos+1].t==='colon'){ const a=next().v; next(); const b=next(); if(!b||b.t!=='ref') throw new Error('bad range'); return {range:[a,b.v]}; } return evExpr(); }
  let res=evExpr();
  if(pos<tokens.length) throw new Error('extra tokens');
  if(typeof res==='number' && (isNaN(res)||!isFinite(res))) res='#ERROR!';
  if(res&&typeof res==='object'&&res.range) res='#ERROR!';
  return res;
}
function evaluateSheet(sheet){
  const memo=new Map(), computing=new Set();
  function evalCell(a){
    if(memo.has(a)) return memo.get(a);
    if(computing.has(a)) return '#CIRC!';
    const cell=sheet.cells[a];
    if(!cell){ memo.set(a,''); return ''; }
    if(cell.formula==null){ const v=parseRaw(cell.raw); memo.set(a,v); return v; }
    computing.add(a);
    let v; try{ v=evalFormula(cell.formula, evalCell); } catch(e){ v='#ERROR!'; }
    computing.delete(a);
    if(v===undefined) v='';
    memo.set(a,v); return v;
  }
  for(const a in sheet.cells) evalCell(a);
  for(const a in sheet.cells) sheet.cells[a].value = memo.get(a);
}

/* ===================== Selection / UI state ===================== */
let anchor={r:1,c:0}, fc={r:1,c:0};
let selecting=false, picking=false, pickStart=null, pickEnd=null, resizing=null;
let editingInline=false, formulaActive=false, activeEditInput=null;
let cellMap={}, cellEls=[], colEls=[], selectedEls=[];

const table = document.getElementById('sheet');
const gridWrap = document.getElementById('gridWrap');
const cellAddr = document.getElementById('cellAddr');
const formulaInput = document.getElementById('formulaInput');
const tabBar = document.getElementById('tabBar');

/* ===================== Build grid ===================== */
function buildGrid(){
  const sheet=activeSheet();
  let html='<colgroup><col class="rh-col">';
  for(let c=0;c<COLS;c++){ const w=sheet.colWidths[c]||80; html+=`<col data-col="${c}" style="width:${w}px">`; }
  html+='</colgroup><thead><tr><th class="corner" title="Select all"></th>';
  for(let c=0;c<COLS;c++){ html+=`<th class="colh" data-col="${c}">${colLetter(c)}<span class="rs" data-col="${c}"></span></th>`; }
  html+='</tr></thead><tbody>';
  for(let r=1;r<=ROWS;r++){ html+=`<tr><th class="rowh" data-row="${r}">${r}</th>`;
    for(let c=0;c<COLS;c++){ html+=`<td data-r="${r}" data-c="${c}"></td>`; } html+='</tr>'; }
  html+='</tbody>';
  table.innerHTML=html;
  colEls=Array.from(table.querySelectorAll('col[data-col]'));
  cellMap={}; cellEls=[];
  table.querySelectorAll('td[data-r]').forEach(td=>{ cellMap[addr(+td.dataset.r,+td.dataset.c)]=td; cellEls.push(td); });
  renderAll(); applySelection();
}
function display(v){ if(v===undefined||v==='') return ''; return String(v); }
function renderAll(){
  const sheet=activeSheet();
  for(const a in cellMap){
    const td=cellMap[a], cell=sheet.cells[a];
    td.textContent = display(cell?cell.value:'');
    if(cell){ td.style.fontWeight = cell.style.bold?'700':'400';
      td.style.fontStyle = cell.style.italic?'italic':'normal';
      td.style.background = cell.style.bg||''; }
    else { td.style.fontWeight='400'; td.style.fontStyle='normal'; td.style.background=''; }
  }
}
function normRange(a,b){ const [r0,c0]=rc(a), [r1,c1]=rc(b); return [Math.min(r0,r1),Math.min(c0,c1),Math.max(r0,r1),Math.max(c0,c1)]; }
function applySelection(){
  for(const el of selectedEls) el.classList.remove('sel');
  selectedEls.length=0;
  const r0=Math.min(anchor.r,fc.r), r1=Math.max(anchor.r,fc.r);
  const c0=Math.min(anchor.c,fc.c), c1=Math.max(anchor.c,fc.c);
  for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++){ const el=cellMap[addr(r,c)]; if(el){ el.classList.add('sel'); selectedEls.push(el); } }
  const act=cellMap[addr(anchor.r,anchor.c)]; if(act) act.classList.add('active');
  selectedEls.push(act);
  cellAddr.value = addr(anchor.r,anchor.c);
  const cell = activeSheet().cells[addr(anchor.r,anchor.c)];
  if(!formulaActive) formulaInput.value = cell?cell.raw:'';
  updateToolbarState();
}
function getSelectedAddrs(){ const r0=Math.min(anchor.r,fc.r),r1=Math.max(anchor.r,fc.r),c0=Math.min(anchor.c,fc.c),c1=Math.max(anchor.c,fc.c);
  const out=[]; for(let r=r0;r<=r1;r++) for(let c=c0;c<=c1;c++) out.push(addr(r,c)); return out; }

/* ===================== Navigation ===================== */
function nav(dr,dc,extend){
  if(extend){ fc.r=clamp(fc.r+dr,1,ROWS); fc.c=clamp(fc.c+dc,0,COLS-1); }
  else { anchor.r=clamp(anchor.r+dr,1,ROWS); anchor.c=clamp(anchor.c+dc,0,COLS-1); fc={r:anchor.r,c:anchor.c}; }
  applySelection();
}
function startEdit(r,c,initial){
  if(editingInline) return;
  const td=cellMap[addr(r,c)]; if(!td) return;
  const a=addr(r,c), cell=ensure(activeSheet(),a);
  editingInline=true;
  const inp=document.createElement('input'); inp.className='cell-input'; inp.value = initial!=null?String(initial):cell.raw;
  td.appendChild(inp); inp.focus(); if(initial==null) inp.select();
  let done=false;
  function commit(move){ if(done) return; done=true;
    setCell(activeSheet(),a,inp.value);
    editingInline=false; activeEditInput=null;
    if(inp.parentNode) inp.parentNode.removeChild(inp);
    evaluateSheet(activeSheet()); renderAll();
    if(move==='down') nav(1,0,false); else if(move==='right') nav(0,1,false);
    applySelection();
  }
  inp.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'){ ev.preventDefault(); commit('down'); }
    else if(ev.key==='Tab'){ ev.preventDefault(); commit('right'); }
    else if(ev.key==='Escape'){ ev.preventDefault(); done=true; editingInline=false; if(inp.parentNode) inp.parentNode.removeChild(inp); }
  });
  inp.addEventListener('blur',()=>{ if(!done) commit(null); });
  activeEditInput=inp;
}
function clearSelected(){
  const sheet=activeSheet();
  for(const a of getSelectedAddrs()) setCell(sheet,a,'');
  evaluateSheet(sheet); renderAll(); applySelection();
}
function applyStyleToSelected(prop,val){
  const sheet=activeSheet();
  for(const a of getSelectedAddrs()){ const cell=ensure(sheet,a); cell.style[prop]=val; }
  renderAll(); applySelection();
}

/* ===================== Mouse interaction ===================== */
table.addEventListener('mousedown',e=>{
  const rs=e.target.closest('.rs');
  if(rs){ e.preventDefault(); e.stopPropagation(); const c=+rs.dataset.col;
    resizing={c, startX:e.clientX, startW:activeSheet().colWidths[c]||80}; return; }
  const colh=e.target.closest('th.colh');
  const rowh=e.target.closest('th.rowh');
  const corner=e.target.closest('th.corner');
  e.preventDefault(); // keep focus on inputs / formula bar
  if(formulaActive){ // pick a reference
    const td=e.target.closest('td'); if(td){ picking=true; pickStart={r:+td.dataset.r,c:+td.dataset.c}; pickEnd={r:+td.dataset.r,c:+td.dataset.c}; } return; }
  if(corner){ anchor={r:1,c:0}; fc={r:ROWS,c:COLS-1}; selecting=true; applySelection(); return; }
  if(colh){ const c=+colh.dataset.col; anchor={r:1,c}; fc={r:ROWS,c}; selecting=true; applySelection(); return; }
  if(rowh){ const r=+rowh.dataset.row; anchor={r,c:0}; fc={r,c:COLS-1}; selecting=true; applySelection(); return; }
  const td=e.target.closest('td'); if(td){ const r=+td.dataset.r,c=+td.dataset.c;
    if(e.shiftKey){ fc={r,c}; } else { anchor={r,c}; fc={r,c}; } selecting=true; applySelection(); }
});
table.addEventListener('dblclick',e=>{
  const td=e.target.closest('td'); if(td){ const r=+td.dataset.r,c=+td.dataset.c; anchor={r,c}; fc={r,c}; applySelection(); startEdit(r,c); }
});
document.addEventListener('mousemove',e=>{
  if(resizing){ const w=Math.max(40,resizing.startW+(e.clientX-resizing.startX)); setColWidth(resizing.c,w); return; }
  if(selecting||picking){ const td=e.target.closest('td'); if(td){ const r=+td.dataset.r,c=+td.dataset.c;
    if(selecting){ fc={r,c}; applySelection(); } else if(picking){ pickEnd={r,c}; } } }
});
document.addEventListener('mouseup',e=>{
  if(resizing){ resizing=null; return; }
  if(selecting){ selecting=false; }
  if(picking){ picking=false;
    const a=pickStart, b=pickEnd;
    const [r0,c0,r1,c1]=normRange(addr(a.r,a.c),addr(b.r,b.c));
    const text = (r0===r1&&c0===c1)? addr(r0,c0) : addr(r0,c0)+':'+addr(r1,c1);
    insertRefAtCursor(text);
  }
});
function insertRefAtCursor(text){
  const inp=formulaInput, s=inp.selectionStart, en=inp.selectionEnd;
  inp.value = inp.value.slice(0,s)+text+inp.value.slice(en);
  const np=s+text.length; inp.setSelectionRange(np,np); inp.focus();
}
function setColWidth(c,w){ colEls[c].style.width=w+'px'; activeSheet().colWidths[c]=w; }

/* ===================== Formula bar ===================== */
formulaInput.addEventListener('focus',()=>{ formulaActive=true; });
formulaInput.addEventListener('blur',()=>{ if(!picking) formulaActive=false; });
formulaInput.addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); commitFormula(); nav(1,0,false); formulaInput.blur(); }
  else if(e.key==='Escape'){ const cell=activeSheet().cells[addr(anchor.r,anchor.c)]; formulaInput.value=cell?cell.raw:''; formulaInput.blur(); }
});
formulaInput.addEventListener('input',()=>{ /* live update not strictly needed; commit on Enter/blur */ });
function commitFormula(){ const a=addr(anchor.r,anchor.c); setCell(activeSheet(),a,formulaInput.value); evaluateSheet(activeSheet()); renderAll(); }

/* ===================== Keyboard (grid) ===================== */
document.addEventListener('keydown',e=>{
  if(editingInline||formulaActive) return;
  const t=document.activeElement?document.activeElement.tagName:'';
  if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT'||t==='BUTTON') return;
  const k=e.key;
  if(k==='ArrowDown'){ e.preventDefault(); nav(1,0,e.shiftKey); }
  else if(k==='ArrowUp'){ e.preventDefault(); nav(-1,0,e.shiftKey); }
  else if(k==='ArrowLeft'){ e.preventDefault(); nav(0,-1,e.shiftKey); }
  else if(k==='ArrowRight'){ e.preventDefault(); nav(0,1,e.shiftKey); }
  else if(k==='Enter'){ e.preventDefault(); nav(1,0,false); }
  else if(k==='Tab'){ e.preventDefault(); nav(0, e.shiftKey?-1:1, false); }
  else if(k==='Delete'||k==='Backspace'){ e.preventDefault(); clearSelected(); }
  else if(k==='F2'){ e.preventDefault(); startEdit(anchor.r,anchor.c); }
  else if(k==='='){ e.preventDefault(); startEdit(anchor.r,anchor.c,'='); }
  else if(k.length===1 && !e.ctrlKey && !e.metaKey && !e.altKey){ startEdit(anchor.r,anchor.c,k); e.preventDefault(); }
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && !editingInline){
    if(e.key.toLowerCase()==='b'){ e.preventDefault(); toggleStyle('bold'); }
    else if(e.key.toLowerCase()==='i'){ e.preventDefault(); toggleStyle('italic'); }
  }
});
function toggleStyle(prop){
  const sheet=activeSheet(), a=addr(anchor.r,anchor.c), cell=ensure(sheet,a);
  const target=!cell.style[prop];
  for(const ad of getSelectedAddrs()){ const cc=ensure(sheet,ad); cc.style[prop]=target; }
  renderAll(); applySelection();
}
function updateToolbarState(){
  const cell=activeSheet().cells[addr(anchor.r,anchor.c)]||{};
  document.getElementById('boldBtn').classList.toggle('on', !!(cell.style&&cell.style.bold));
  document.getElementById('italicBtn').classList.toggle('on', !!(cell.style&&cell.style.italic));
}

/* ===================== Sheets ===================== */
function buildSheetTabs(){
  tabBar.innerHTML='';
  workbook.sheets.forEach((s,i)=>{
    const b=document.createElement('button'); b.className='tab'+(i===workbook.active?' active':'');
    const label=document.createElement('span'); label.textContent=s.name; b.appendChild(label);
    const x=document.createElement('span'); x.className='tab-x'; x.textContent='×';
    x.onclick=ev=>{ ev.stopPropagation(); deleteSheet(i); };
    b.appendChild(x);
    b.onclick=()=>selectSheet(i);
    b.ondblclick=()=>{ const n=prompt('Rename sheet',s.name); if(n){ s.name=n; buildSheetTabs(); } };
    tabBar.appendChild(b);
  });
  const add=document.createElement('button'); add.className='tab add'; add.textContent='+'; add.title='Add sheet';
  add.onclick=addSheet; tabBar.appendChild(add);
}
function selectSheet(i){ workbook.active=i; buildGrid(); buildSheetTabs(); }
function addSheet(){ workbook.sheets.push(newSheet('Sheet'+(workbook.sheets.length+1))); workbook.active=workbook.sheets.length-1; buildGrid(); buildSheetTabs(); }
function deleteSheet(i){ if(workbook.sheets.length<=1) return; workbook.sheets.splice(i,1); workbook.active=clamp(i,0,workbook.sheets.length-1); buildGrid(); buildSheetTabs(); }

/* ===================== CSV ===================== */
function parseCSV(text){
  const rows=[]; let i=0,row=[],field='',inQ=false;
  while(i<text.length){ const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
      field+=c; i++; continue; }
    if(c==='"'){ inQ=true; i++; continue; }
    if(c===','){ row.push(field); field=''; i++; continue; }
    if(c==='\r'){ i++; continue; }
    if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=c; i++;
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows;
}
function toCSV(sheet){
  const rows=[];
  for(let r=1;r<=ROWS;r++){ const parts=[]; for(let c=0;c<COLS;c++){ let v=sheet.cells[addr(r,c)]; v=v?v.raw:''; if(v==null)v=''; v=String(v); if(/[",\n\r]/.test(v)) v='"'+v.replace(/"/g,'""')+'"'; parts.push(v); } rows.push(parts); }
  while(rows.length && rows[rows.length-1].every(p=>p==='')) rows.pop();
  return rows.map(p=>p.join(',')).join('\n');
}

/* ===================== Toolbar wiring ===================== */
document.getElementById('boldBtn').onclick=()=>toggleStyle('bold');
document.getElementById('italicBtn').onclick=()=>toggleStyle('italic');
document.getElementById('fillColor').addEventListener('input',e=>applyStyleToSelected('bg',e.target.value));
document.getElementById('clearColorBtn').onclick=()=>applyStyleToSelected('bg','');
document.getElementById('clearBtn').onclick=clearSelected;
document.getElementById('downloadBtn').onclick=()=>{
  const csv=toCSV(activeSheet()); const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=activeSheet().name+'.csv'; a.click(); URL.revokeObjectURL(url);
};
document.getElementById('uploadBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{ const rows=parseCSV(reader.result); const sheet=activeSheet(); sheet.cells={};
    for(let r=0;r<rows.length && r<ROWS;r++){ const row=rows[r]; for(let c=0;c<row.length && c<COLS;c++){ const v=row[c]; if(v!=='') setCell(sheet,addr(r+1,c),v); } }
    evaluateSheet(sheet); renderAll(); applySelection();
  };
  reader.readAsText(f); e.target.value='';
});
document.getElementById('addSheetBtn').onclick=addSheet;
document.getElementById('deleteSheetBtn').onclick=()=>deleteSheet(workbook.active);

/* ===================== Seed demo data ===================== */

  setCell(sheet,'A1','Item'); setCell(sheet,'B1','Q1'); setCell(sheet,'C1','Q2'); setCell(sheet,'D1','Total');
  setCell(sheet,'A2','Apples');  setCell(sheet,'B2',10); setCell(sheet,'C2',12); setCell(sheet,'D2','=B2+C2');
  setCell(sheet,'A3','Oranges'); setCell(sheet,'B3',5);  setCell(sheet,'C3',8);  setCell(sheet,'D3','=B3+C3');
  setCell(sheet,'A4','Pears');   setCell(sheet,'B4',7);  setCell(sheet,'C4',6);  setCell(sheet,'D4','=B4+C4');
  setCell(sheet,'A5','Sum');     setCell(sheet,'B5','=SUM(B2:B4)'); setCell(sheet,'C5','=SUM(C2:C4)'); setCell(sheet,'D5','=SUM(D2:D4)');
  setCell(sheet,'A6','Average'); setCell(sheet,'B6','=AVERAGE(B2:B4)'); setCell(sheet,'C6','=AVERAGE(C2:C4)');

  setCell(sheet,'A8','Min');     setCell(sheet,'B8','=MIN(B2:B4)'); setCell(sheet,'C8','=MIN(C2:C4)');
  setCell(sheet,'D10','Try: ');  setCell(sheet,'E10','=SUM(B2:C4)*2');
}

/* ===================== Init ===================== */
workbook.sheets.push(newSheet('Sheet1'));
seedDemo(activeSheet());
evaluateSheet(activeSheet());
buildSheetTabs();
buildGrid();
