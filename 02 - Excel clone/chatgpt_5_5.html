<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SheetForge — Single-File Spreadsheet</title>
<style>
:root{
  --bg:#f3f6fa;--panel:#ffffff;--panel2:#f8fafc;--line:#d9e2ec;--line2:#c5d0df;
  --text:#172033;--muted:#64748b;--green:#107c41;--green2:#e7f4ec;--blue:#2563eb;
  --sel:#217346;--sel2:rgba(33,115,70,.12);--hdr:#f1f5f9;--shadow:0 18px 45px rgba(15,23,42,.10)
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}
.app{height:100vh;display:grid;grid-template-rows:auto auto 1fr auto;grid-template-areas:"ribbon" "formula" "grid" "tabs"}
.ribbon{grid-area:ribbon;background:linear-gradient(180deg,#fff,#f7fafc);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(15,23,42,.05);padding:8px 10px;display:flex;gap:10px;align-items:center;overflow:auto}
.brand{font-weight:950;font-size:19px;letter-spacing:-.045em;color:#0f5132;white-space:nowrap;margin-right:4px}.brand span{color:#16a34a}
.group{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px}
.btn{border:1px solid var(--line2);background:#fff;color:var(--text);border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.12s}
.btn:hover{background:#f1f5f9;transform:translateY(-1px)}
.btn.active{background:var(--green2);border-color:var(--green);color:var(--green)}
.btn.green{background:var(--green);border-color:var(--green);color:white}
.btn.danger{color:#be123c;border-color:#fecdd3;background:#fff1f2}
.btn.small{padding:5px 8px;font-size:12px}
.color-input{width:34px;height:32px;padding:2px;border:1px solid var(--line2);border-radius:9px;background:#fff}
.file-label{position:relative;overflow:hidden}.file-label input{position:absolute;inset:0;opacity:0;cursor:pointer}
.formula{grid-area:formula;display:grid;grid-template-columns:98px 1fr;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)}
.namebox,.formula input{border:1px solid var(--line2);border-radius:10px;background:#fff;height:36px;padding:8px 10px;outline:none}
.namebox{display:flex;align-items:center;font-weight:850;color:var(--green);justify-content:center;background:#f8fafc}
.formula input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,124,65,.12)}
.grid-wrap{grid-area:grid;overflow:auto;position:relative;background:#eaf0f6}
.sheet-table{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff;user-select:none}
.sheet-table col.row-col{width:46px}
.sheet-table th,.sheet-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:28px;padding:0;position:relative}
.corner,.col-header,.row-header{background:var(--hdr);color:#475569;font-size:12px;font-weight:800;text-align:center}
.corner{position:sticky;left:0;top:0;z-index:8;min-width:46px}
.col-header{position:sticky;top:0;z-index:6;height:30px}
.row-header{position:sticky;left:0;z-index:5;width:46px;min-width:46px}
.cell{background:#fff;min-width:60px;height:28px;vertical-align:middle;outline:none;cursor:cell}
.cell .cell-content{height:100%;width:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;padding:0 6px;font-size:13px}
.cell.selected{box-shadow:inset 0 0 0 2px var(--sel);z-index:2}
.cell.range-selected{background:var(--sel2)}
.cell.editing{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.cell.error .cell-content{color:#dc2626}
.resize-handle{position:absolute;right:-4px;top:0;width:8px;height:100%;cursor:col-resize;z-index:12}
.resize-handle:hover{background:rgba(33,115,70,.16)}
.tabs{grid-area:tabs;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:7px 10px;overflow:auto}
.sheet-tab{border:1px solid var(--line);background:#f8fafc;border-radius:999px;padding:7px 12px;font-weight:800;color:#475569;cursor:pointer;white-space:nowrap}
.sheet-tab.active{background:var(--green2);border-color:var(--green);color:var(--green)}
.status{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
select,input[type=number]{height:32px;border:1px solid var(--line2);border-radius:9px;background:#fff;padding:5px 8px}
.toast{position:fixed;right:16px;bottom:52px;background:#102033;color:#fff;padding:11px 14px;border-radius:14px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;z-index:99}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:760px){.ribbon{gap:6px}.group{padding:5px}.formula{grid-template-columns:76px 1fr}.btn{padding:6px 8px;font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="ribbon">
    <div class="brand">Sheet<span>Forge</span></div>
    <div class="group">
      <button id="boldBtn" class="btn" title="Bold">B</button>
      <button id="italicBtn" class="btn" title="Italic"><i>I</i></button>
      <input id="bgColor" class="color-input" type="color" value="#fff2cc" title="Background color">
      <button id="applyBgBtn" class="btn small">Fill</button>
      <button id="clearBtn" class="btn small">Clear</button>
    </div>
    <div class="group">
      <button id="downloadCsvBtn" class="btn small green">Download CSV</button>
      <label class="btn small file-label">Upload CSV<input id="uploadCsv" type="file" accept=".csv,text/csv"></label>
    </div>
    <div class="group">
      <button id="addSheetBtn" class="btn small">+ Sheet</button>
      <button id="renameSheetBtn" class="btn small">Rename</button>
      <button id="deleteSheetBtn" class="btn small danger">Delete</button>
    </div>
    <div class="group">
      <span style="font-size:12px;color:var(--muted);font-weight:800">Rows</span><input id="rowCount" type="number" value="100" min="20" max="500" style="width:70px">
      <span style="font-size:12px;color:var(--muted);font-weight:800">Cols</span><input id="colCount" type="number" value="50" min="10" max="100" style="width:70px">
      <button id="resizeGridBtn" class="btn small">Resize Grid</button>
    </div>
    <div class="status" id="status">Ready</div>
  </div>

  <div class="formula">
    <div class="namebox" id="nameBox">A1</div>
    <input id="formulaBar" spellcheck="false" autocomplete="off" placeholder="Enter a value or formula, e.g. =SUM(A1:A10)" />
  </div>

  <div class="grid-wrap" id="gridWrap">
    <table class="sheet-table" id="sheetTable"></table>
  </div>

  <div class="tabs" id="tabs"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const table = document.getElementById("sheetTable");
  const formulaBar = document.getElementById("formulaBar");
  const nameBox = document.getElementById("nameBox");
  const status = document.getElementById("status");

  const DEFAULT_ROWS = 100;
  const DEFAULT_COLS = 50;

  const state = {
    rows: DEFAULT_ROWS,
    cols: DEFAULT_COLS,
    sheets: [],
    active: 0,
    selection: { r1: 1, c1: 1, r2: 1, c2: 1 },
    selecting: false,
    formulaSelecting: false,
    formulaSelectionOriginal: null,
    editingCell: null,
    resizing: null,
    cache: {},
    errors: {}
  };

  function colName(n) {
    let s = "";
    while (n > 0) {
      const m = (n - 1) % 26;
      s = String.fromCharCode(65 + m) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function colIndex(name) {
    let n = 0;
    for (const ch of name.toUpperCase()) n = n * 26 + ch.charCodeAt(0) - 64;
    return n;
  }

  function addr(r, c) { return colName(c) + r; }

  function parseAddr(a) {
    const m = String(a).toUpperCase().match(/^([A-Z]+)([0-9]+)$/);
    return m ? { c: colIndex(m[1]), r: Number(m[2]) } : null;
  }

  function normSel(sel = state.selection) {
    return {
      r1: Math.min(sel.r1, sel.r2),
      c1: Math.min(sel.c1, sel.c2),
      r2: Math.max(sel.r1, sel.r2),
      c2: Math.max(sel.c1, sel.c2)
    };
  }

  function rangeAddress(sel = state.selection) {
    const n = normSel(sel);
    return n.r1 === n.r2 && n.c1 === n.c2 ? addr(n.r1, n.c1) : `${addr(n.r1, n.c1)}:${addr(n.r2, n.c2)}`;
  }

  function activeSheet() { return state.sheets[state.active]; }

  function createSheet(name) {
    return {
      name,
      cells: {},
      widths: Array.from({ length: state.cols + 1 }, (_, i) => i === 0 ? 46 : 96)
    };
  }

  function ensureCell(r, c) {
    const sh = activeSheet();
    const a = addr(r, c);
    if (!sh.cells[a]) {
      sh.cells[a] = { raw: "", bold: false, italic: false, bg: "", color: "", align: "left" };
    }
    return sh.cells[a];
  }

  function readCell(r, c) {
    return activeSheet().cells[addr(r, c)] || null;
  }

  function setCellRaw(r, c, raw) {
    const cell = ensureCell(r, c);
    cell.raw = String(raw ?? "");
    cleanupCell(r, c);
    recalc();
    renderGrid();
  }

  function cleanupCell(r, c) {
    const sh = activeSheet();
    const a = addr(r, c);
    const cell = sh.cells[a];
    if (!cell) return;
    if (!cell.raw && !cell.bold && !cell.italic && !cell.bg && !cell.color && cell.align === "left") delete sh.cells[a];
  }

  function displayValue(r, c) {
    const a = addr(r, c);
    const cell = readCell(r, c);
    if (!cell || cell.raw === "") return "";
    if (cell.raw.trim().startsWith("=")) return state.cache[a] ?? "";
    return cell.raw;
  }

  function numericValue(ref, stack = []) {
    const p = parseAddr(ref);
    if (!p || p.r < 1 || p.r > state.rows || p.c < 1 || p.c > state.cols) return 0;
    const a = addr(p.r, p.c);
    const cell = activeSheet().cells[a];
    if (!cell || cell.raw === "") return 0;
    if (cell.raw.trim().startsWith("=")) {
      const v = evalCell(a, stack);
      return typeof v === "number" && Number.isFinite(v) ? v : 0;
    }
    const n = Number(cell.raw);
    return Number.isFinite(n) ? n : 0;
  }

  function splitArgs(s) {
    const out = [];
    let cur = "", depth = 0;
    for (const ch of s) {
      if (ch === "(") depth++;
      if (ch === ")") depth--;
      if (ch === "," && depth === 0) { out.push(cur.trim()); cur = ""; }
      else cur += ch;
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  }

  function rangeValues(range, stack) {
    const m = range.toUpperCase().match(/^([A-Z]+[0-9]+):([A-Z]+[0-9]+)$/);
    if (!m) return [];
    const a = parseAddr(m[1]), b = parseAddr(m[2]);
    if (!a || !b) return [];
    const vals = [];
    for (let r = Math.min(a.r, b.r); r <= Math.max(a.r, b.r); r++) {
      for (let c = Math.min(a.c, b.c); c <= Math.max(a.c, b.c); c++) {
        vals.push(numericValue(addr(r, c), stack));
      }
    }
    return vals;
  }

  function evalExpression(expr, stack) {
    let out = expr;

    for (let i = 0; i < 20; i++) {
      const before = out;
      out = out.replace(/\b(SUM|AVERAGE|MIN|MAX)\s*\(([^()]*)\)/gi, (_, fn, args) => {
        const values = [];
        for (const arg of splitArgs(args)) {
          if (/^[A-Z]+[0-9]+:[A-Z]+[0-9]+$/i.test(arg)) {
            values.push(...rangeValues(arg, stack));
          } else {
            values.push(evalExpression(arg, stack));
          }
        }
        const nums = values.map(Number).filter(Number.isFinite);
        if (!nums.length) return 0;
        fn = fn.toUpperCase();
        if (fn === "SUM") return nums.reduce((a, b) => a + b, 0);
        if (fn === "AVERAGE") return nums.reduce((a, b) => a + b, 0) / nums.length;
        if (fn === "MIN") return Math.min(...nums);
        if (fn === "MAX") return Math.max(...nums);
        return 0;
      });
      if (out === before) break;
    }

    out = out.replace(/\b([A-Z]+[0-9]+)\b/g, (_, ref) => String(numericValue(ref, stack)));
    if (!/^[0-9+\-*/().\s,]+$/.test(out)) throw new Error("Invalid formula");
    const result = Function(`"use strict"; return (${out});`)();
    if (!Number.isFinite(Number(result))) throw new Error("Invalid result");
    return Number(result);
  }

  function evalCell(a, stack = []) {
    if (stack.includes(a)) throw new Error("Circular reference");
    const cell = activeSheet().cells[a];
    if (!cell) return 0;
    if (!cell.raw.trim().startsWith("=")) {
      const n = Number(cell.raw);
      return Number.isFinite(n) ? n : 0;
    }
    const expr = cell.raw.trim().slice(1);
    return evalExpression(expr, [...stack, a]);
  }

  function recalc() {
    state.cache = {};
    state.errors = {};
    const sh = activeSheet();
    for (const [a, cell] of Object.entries(sh.cells)) {
      if (cell.raw && cell.raw.trim().startsWith("=")) {
        try {
          const value = evalCell(a, []);
          state.cache[a] = Number.isInteger(value) ? String(value) : String(Number(value.toFixed(8)));
        } catch (err) {
          state.cache[a] = "#ERROR";
          state.errors[a] = err.message;
        }
      }
    }
  }

  function renderGrid() {
    const sh = activeSheet();
    let html = "<colgroup><col class='row-col'>";
    for (let c = 1; c <= state.cols; c++) html += `<col data-col="${c}" style="width:${sh.widths[c] || 96}px">`;
    html += "</colgroup><thead><tr><th class='corner'></th>";
    for (let c = 1; c <= state.cols; c++) {
      html += `<th class="col-header" data-col="${c}">${colName(c)}<span class="resize-handle" data-col="${c}"></span></th>`;
    }
    html += "</tr></thead><tbody>";
    for (let r = 1; r <= state.rows; r++) {
      html += `<tr><th class="row-header">${r}</th>`;
      for (let c = 1; c <= state.cols; c++) {
        const a = addr(r, c);
        const cell = sh.cells[a];
        const styles = [];
        if (cell?.bg) styles.push(`background:${cell.bg}`);
        if (cell?.color) styles.push(`color:${cell.color}`);
        if (cell?.bold) styles.push("font-weight:800");
        if (cell?.italic) styles.push("font-style:italic");
        if (cell?.align) styles.push(`text-align:${cell.align}`);
        const value = displayValue(r, c);
        const error = state.errors[a] ? " error" : "";
        html += `<td class="cell${error}" data-r="${r}" data-c="${c}" style="${styles.join(";")}"><div class="cell-content">${escapeHtml(value)}</div></td>`;
      }
      html += "</tr>";
    }
    html += "</tbody>";
    table.innerHTML = html;
    updateSelectionUI();
    updateFormulaBar();
    renderTabs();
    status.textContent = `${activeSheet().name} · ${state.rows} rows × ${state.cols} columns`;
  }

  function updateSelectionUI() {
    table.querySelectorAll(".cell.selected,.cell.range-selected").forEach(td => td.classList.remove("selected", "range-selected"));
    const n = normSel();
    for (let r = n.r1; r <= n.r2; r++) {
      for (let c = n.c1; c <= n.c2; c++) {
        const td = cellNode(r, c);
        if (!td) continue;
        td.classList.add(n.r1 === n.r2 && n.c1 === n.c2 ? "selected" : "range-selected");
      }
    }
    const first = cellNode(n.r1, n.c1);
    if (first) first.classList.add("selected");
    nameBox.textContent = rangeAddress();
  }

  function cellNode(r, c) {
    return table.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  }

  function setSelection(r1, c1, r2 = r1, c2 = c1) {
    state.selection = {
      r1: clamp(r1, 1, state.rows),
      c1: clamp(c1, 1, state.cols),
      r2: clamp(r2, 1, state.rows),
      c2: clamp(c2, 1, state.cols)
    };
    updateSelectionUI();
    updateFormulaBar();
  }

  function updateFormulaBar() {
    if (document.activeElement === formulaBar && isFormulaEditing()) return;
    const n = normSel();
    if (n.r1 === n.r2 && n.c1 === n.c2) {
      const cell = readCell(n.r1, n.c1);
      formulaBar.value = cell ? cell.raw : "";
    } else {
      formulaBar.value = "";
    }
  }

  function commitFormulaBar() {
    const n = normSel();
    if (n.r1 !== n.r2 || n.c1 !== n.c2) return;
    setCellRaw(n.r1, n.c1, formulaBar.value);
  }

  function isFormulaEditing() {
    return formulaBar.value.trim().startsWith("=");
  }

  function insertFormulaRef(ref) {
    let value = formulaBar.value || "=";
    if (!value.startsWith("=")) value = "=" + value;
    const start = formulaBar.selectionStart ?? value.length;
    const end = formulaBar.selectionEnd ?? value.length;
    formulaBar.value = value.slice(0, start) + ref + value.slice(end);
    const pos = start + ref.length;
    formulaBar.focus();
    formulaBar.setSelectionRange(pos, pos);
  }

  function beginCellEdit(td, initialText = null) {
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    setSelection(r, c);
    const div = td.querySelector(".cell-content");
    const cell = readCell(r, c);
    td.classList.add("editing");
    td.contentEditable = "true";
    div.textContent = initialText !== null ? initialText : (cell ? cell.raw : "");
    div.focus();
    document.execCommand("selectAll", false, null);
    state.editingCell = { td, r, c, original: cell ? cell.raw : "" };

    function finish(save) {
      td.contentEditable = "false";
      td.classList.remove("editing");
      td.removeEventListener("blur", onBlur, true);
      td.removeEventListener("keydown", onKey);
      const raw = save ? div.textContent : state.editingCell.original;
      state.editingCell = null;
      setCellRaw(r, c, raw);
    }
    function onBlur() { finish(true); }
    function onKey(e) {
      if (e.key === "Enter") { e.preventDefault(); finish(true); moveSelection(1, 0); }
      if (e.key === "Escape") { e.preventDefault(); finish(false); }
      if (e.key === "Tab") { e.preventDefault(); finish(true); moveSelection(0, e.shiftKey ? -1 : 1); }
    }
    td.addEventListener("blur", onBlur, true);
    td.addEventListener("keydown", onKey);
  }

  table.addEventListener("mousedown", e => {
    const resize = e.target.closest(".resize-handle");
    if (resize) {
      startColumnResize(e, Number(resize.dataset.col));
      return;
    }

    const td = e.target.closest(".cell");
    if (!td) return;
    const r = Number(td.dataset.r), c = Number(td.dataset.c);

    if (document.activeElement === formulaBar && isFormulaEditing()) {
      e.preventDefault();
      state.formulaSelecting = true;
      state.formulaSelectionOriginal = { ...state.selection };
      setSelection(r, c);
      return;
    }

    if (state.editingCell) return;
    state.selecting = true;
    setSelection(r, c);
    e.preventDefault();
  });

  table.addEventListener("mouseover", e => {
    const td = e.target.closest(".cell");
    if (!td) return;
    if (!state.selecting && !state.formulaSelecting) return;
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    state.selection.r2 = r;
    state.selection.c2 = c;
    updateSelectionUI();
  });

  window.addEventListener("mouseup", () => {
    if (state.formulaSelecting) {
      const ref = rangeAddress();
      const original = state.formulaSelectionOriginal;
      insertFormulaRef(ref);
      state.formulaSelecting = false;
      state.formulaSelectionOriginal = null;
      if (original) setSelection(original.r1, original.c1, original.r2, original.c2);
    }
    state.selecting = false;
    state.resizing = null;
  });

  table.addEventListener("dblclick", e => {
    const td = e.target.closest(".cell");
    if (td) beginCellEdit(td);
  });

  window.addEventListener("keydown", e => {
    if (state.editingCell || document.activeElement === formulaBar) return;
    const n = normSel();
    if (e.key === "ArrowUp") { e.preventDefault(); moveSelection(-1, 0); }
    else if (e.key === "ArrowDown" || e.key === "Enter") { e.preventDefault(); moveSelection(1, 0); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); moveSelection(0, -1); }
    else if (e.key === "ArrowRight" || e.key === "Tab") { e.preventDefault(); moveSelection(0, e.shiftKey ? -1 : 1); }
    else if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearContents(); }
    else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      const td = cellNode(n.r1, n.c1);
      if (td) beginCellEdit(td, e.key);
    }
  });

  function moveSelection(dr, dc) {
    const n = normSel();
    const r = clamp(n.r1 + dr, 1, state.rows);
    const c = clamp(n.c1 + dc, 1, state.cols);
    setSelection(r, c);
    cellNode(r, c)?.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  formulaBar.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); commitFormulaBar(); }
    if (e.key === "Escape") updateFormulaBar();
  });
  formulaBar.addEventListener("blur", () => {
    if (!state.formulaSelecting) commitFormulaBar();
  });

  function startColumnResize(e, c) {
    e.preventDefault();
    const sh = activeSheet();
    state.resizing = { c, startX: e.clientX, startW: sh.widths[c] || 96 };
  }

  window.addEventListener("mousemove", e => {
    if (!state.resizing) return;
    const sh = activeSheet();
    const c = state.resizing.c;
    const w = Math.max(42, state.resizing.startW + e.clientX - state.resizing.startX);
    sh.widths[c] = w;
    const col = table.querySelector(`col[data-col="${c}"]`);
    if (col) col.style.width = w + "px";
  });

  function applyToRange(fn) {
    const n = normSel();
    for (let r = n.r1; r <= n.r2; r++) {
      for (let c = n.c1; c <= n.c2; c++) fn(ensureCell(r, c), r, c);
    }
    recalc();
    renderGrid();
  }

  document.getElementById("boldBtn").addEventListener("click", () => {
    applyToRange(cell => cell.bold = !cell.bold);
  });
  document.getElementById("italicBtn").addEventListener("click", () => {
    applyToRange(cell => cell.italic = !cell.italic);
  });
  document.getElementById("applyBgBtn").addEventListener("click", () => {
    const bg = document.getElementById("bgColor").value;
    applyToRange(cell => cell.bg = bg);
  });
  document.getElementById("clearBtn").addEventListener("click", clearContents);

  function clearContents() {
    const n = normSel();
    for (let r = n.r1; r <= n.r2; r++) {
      for (let c = n.c1; c <= n.c2; c++) {
        const cell = ensureCell(r, c);
        cell.raw = "";
        cleanupCell(r, c);
      }
    }
    recalc();
    renderGrid();
  }

  function renderTabs() {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    state.sheets.forEach((sh, i) => {
      const b = document.createElement("button");
      b.className = "sheet-tab" + (i === state.active ? " active" : "");
      b.textContent = sh.name;
      b.addEventListener("click", () => {
        state.active = i;
        state.selection = { r1: 1, c1: 1, r2: 1, c2: 1 };
        recalc();
        renderGrid();
      });
      b.addEventListener("dblclick", () => renameSheet(i));
      tabs.appendChild(b);
    });
  }

  document.getElementById("addSheetBtn").addEventListener("click", () => {
    state.sheets.push(createSheet("Sheet" + (state.sheets.length + 1)));
    state.active = state.sheets.length - 1;
    recalc();
    renderGrid();
  });
  document.getElementById("renameSheetBtn").addEventListener("click", () => renameSheet(state.active));
  document.getElementById("deleteSheetBtn").addEventListener("click", () => {
    if (state.sheets.length <= 1) return toast("At least one sheet is required.");
    if (!confirm("Delete this sheet?")) return;
    state.sheets.splice(state.active, 1);
    state.active = Math.max(0, state.active - 1);
    recalc();
    renderGrid();
  });

  function renameSheet(i) {
    const name = prompt("Sheet name:", state.sheets[i].name);
    if (!name) return;
    state.sheets[i].name = name.slice(0, 31);
    renderTabs();
  }

  document.getElementById("resizeGridBtn").addEventListener("click", () => {
    state.rows = clamp(Number(document.getElementById("rowCount").value) || state.rows, 20, 500);
    const newCols = clamp(Number(document.getElementById("colCount").value) || state.cols, 10, 100);
    state.cols = newCols;
    state.sheets.forEach(sh => {
      while (sh.widths.length <= state.cols) sh.widths.push(96);
    });
    recalc();
    renderGrid();
  });

  function downloadCSV() {
    const rows = [];
    for (let r = 1; r <= state.rows; r++) {
      const row = [];
      let has = false;
      for (let c = 1; c <= state.cols; c++) {
        const v = displayValue(r, c);
        if (v) has = true;
        row.push(csvEscape(v));
      }
      if (has || r <= 1) rows.push(row.join(","));
    }
    const blob = new Blob([rows.join("\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = activeSheet().name + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function csvEscape(v) {
    v = String(v ?? "");
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  document.getElementById("downloadCsvBtn").addEventListener("click", downloadCSV);
  document.getElementById("uploadCsv").addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const rows = parseCSV(text);
    rows.slice(0, state.rows).forEach((row, ri) => {
      row.slice(0, state.cols).forEach((value, ci) => {
        ensureCell(ri + 1, ci + 1).raw = value;
      });
    });
    recalc();
    renderGrid();
    e.target.value = "";
  });

  function parseCSV(text) {
    const rows = [];
    let row = [], field = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i], next = text[i + 1];
      if (quoted) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') quoted = false;
        else field += ch;
      } else {
        if (ch === '"') quoted = true;
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (ch !== "\r") field += ch;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 1500);
  }

  state.sheets.push(createSheet("Sheet1"));
  ensureCell(1, 1).raw = "Sales";
  ensureCell(1, 2).raw = "Cost";
  ensureCell(1, 3).raw = "Profit";
  ensureCell(2, 1).raw = "1200";
  ensureCell(2, 2).raw = "700";
  ensureCell(2, 3).raw = "=A2-B2";
  ensureCell(3, 1).raw = "900";
  ensureCell(3, 2).raw = "440";
  ensureCell(3, 3).raw = "=A3-B3";
  ensureCell(5, 1).raw = "Total";
  ensureCell(5, 3).raw = "=SUM(C2:C3)";
  recalc();
  renderGrid();
})();
</script>
</body>
</html>
