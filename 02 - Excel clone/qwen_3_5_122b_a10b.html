<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel</title>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #107c41; /* Excel Green */
            --border-color: #e1dfdd;
            --header-bg: #f3f2f1;
            --selection-color: #107c41;
            --hover-color: #edebe9;
            --text-color: #323130;
            --grid-line: #dcdcdc;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: white;
            color: var(--text-color);
        }

        /* --- Header & Toolbar --- */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
        }

        .app-title {
            font-weight: 600;
            font-size: 14px;
        }

        .toolbar-container {
            background: #fff;
            border-bottom: 1px solid var(--border-color);
            padding: 5px 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .tool-group {
            display: flex;
            gap: 5px;
            padding-right: 10px;
            border-right: 1px solid var(--border-color);
            align-items: center;
        }

        .tool-btn {
            border: none;
            background: transparent;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 14px;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tool-btn:hover { background-color: var(--hover-color); }
        .tool-btn.active { background-color: #c7e0b4; color: var(--primary-color); }
        .tool-btn i { font-size: 14px; margin-bottom: 2px; }
        .tool-label { font-size: 10px; }

        /* --- Formula Bar --- */
        .formula-bar-container {
            display: flex;
            align-items: center;
            padding: 5px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            gap: 10px;
        }

        .address-box {
            width: 50px;
            height: 24px;
            text-align: center;
            border: 1px solid var(--border-color);
            font-size: 12px;
            line-height: 22px;
            background: #f8f9fa;
        }

        .divider { width: 1px; height: 16px; background: var(--border-color); }

        .formula-input-wrapper {
            flex-grow: 1;
            position: relative;
        }

        #formula-input {
            width: 100%;
            border: 1px solid var(--border-color);
            height: 24px;
            padding: 2px 5px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            box-sizing: border-box; 
        }

        #formula-input:focus { border-color: var(--primary-color); }

        /* --- Spreadsheet Grid --- */
        .spreadsheet-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
            user-select: none;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 100%;
        }

        th, td {
            border: 1px solid var(--grid-line);
            padding: 0 4px;
            font-size: 13px;
            height: 24px;
            white-space: nowrap;
            overflow: hidden;
            outline: none;
            position: relative;
        }

        /* Headers */
        th {
            background: var(--header-bg);
            font-weight: normal;
            text-align: center;
            color: #666;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 10;
            min-width: 80px;
        }

        /* Column Number Header */
        th.row-header {
            left: 0;
            z-index: 20;
            min-width: 45px;
            width: 45px;
        }
        
        /* Corner */
        th.corner {
            position: sticky;
            left: 0;
            z-index: 30;
            width: 45px;
        }

        /* Cells */
        td {
            text-align: right; /* Numbers align right usually */
            cursor: cell;
        }
        
        td.text-cell { text-align: left; }
        td.center-cell { text-align: center; }

        /* Focus States */
        td.selected {
            border: 2px solid var(--primary-color) !important;
            z-index: 5;
        }
        
        td.editing {
            border: 2px solid var(--primary-color) !important;
            z-index: 5;
        }

        /* Selection Highlight Overlay (for drag select) */
        .selection-overlay {
            position: absolute;
            background-color: rgba(16, 124, 65, 0.1);
            border: 1px solid var(--selection-color);
            pointer-events: none;
            z-index: 4;
        }

        /* --- Sheet Tabs --- */
        .sheets-bar {
            background: #fff;
            height: 35px;
            display: flex;
            align-items: flex-end;
            padding-left: 10px;
            border-top: 1px solid var(--border-color);
        }

        .sheet-tabs {
            display: flex;
            gap: 2px;
            height: 100%;
        }

        .sheet-tab {
            padding: 5px 15px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            background: #f8f8f8;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: -1px;
            z-index: 1;
        }

        .sheet-tab.active {
            background: #fff;
            border-color: var(--border-color);
            border-bottom: 2px solid white; /* Hide overlap */
            color: var(--primary-color);
            position: relative;
            z-index: 2;
            font-weight: 600;
        }

        .add-sheet-btn {
            padding: 0 10px;
            cursor: pointer;
            color: var(--primary-color);
            font-size: 18px;
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .context-menu {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            display: none;
            z-index: 100;
            padding: 5px 0;
            min-width: 120px;
        }
        .context-item {
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }
        .context-item:hover { background: #eee; }

    </style>
</head>
<body>

<header>
    <div class="app-title"><i class="fas fa-table"></i> WebExcel</div>
    <div id="status-msg">Ready</div>
</header>

<div class="toolbar-container">
    <div class="tool-group">
        <button class="tool-btn" onclick="app.undo()" title="Undo"><i class="fas fa-undo"></i></button>
        <button class="tool-btn" onclick="app.redo()" title="Redo"><i class="fas fa-redo"></i></button>
    </div>
    
    <div class="tool-group">
        <button class="tool-btn" id="btn-bold" onclick="app.toggleStyle('bold')"><i class="fas fa-bold"></i></button>
        <button class="tool-btn" id="btn-italic" onclick="app.toggleStyle('italic')"><i class="fas fa-italic"></i></button>
        <button class="tool-btn" onclick="document.getElementById('bg-color-picker').click()"><i class="fas fa-fill-drip"></i></button>
        <input type="color" id="bg-color-picker" style="display:none" onchange="app.changeColor(this.value)">
    </div>

    <div class="tool-group">
        <button class="tool-btn" onclick="app.downloadCSV()"><i class="fas fa-file-csv"></i> <span class="tool-label">Save</span></button>
        <label class="tool-btn" style="cursor:pointer">
            <i class="fas fa-upload"></i> <span class="tool-label">Load</span>
            <input type="file" accept=".csv" style="display:none" onchange="app.uploadCSV(this)">
        </label>
    </div>
    
    <div class="tool-group" style="margin-left:auto;">
        <button class="tool-btn" onclick="app.addSheet()"><i class="fas fa-plus-circle"></i> <span class="tool-label">New Sheet</span></button>
    </div>
</div>

<div class="formula-bar-container">
    <div class="address-box" id="address-display">A1</div>
    <div class="divider"></div>
    <div class="tool-btn" onclick="app.clearContents()"><i class="far fa-trash-alt"></i></div>
    <div class="divider"></div>
    <div class="formula-input-wrapper">
        <input type="text" id="formula-input" placeholder="Enter value or formula (e.g. =SUM(A1:B2))">
    </div>
</div>

<div class="spreadsheet-container" id="spreadsheet-container">
    <!-- Table Generated by JS -->
</div>

<div class="sheets-bar">
    <div class="sheet-tabs" id="sheet-tabs">
        <!-- Sheets generated here -->
    </div>
    <div class="add-sheet-btn" onclick="app.addSheet()">+</div>
</div>

<!-- Context Menu -->
<div id="context-menu" class="context-menu">
    <div class="context-item" onclick="app.deleteSheetFromMenu()">Delete Sheet</div>
    <div class="context-item" onclick="app.renameSheetFromMenu()">Rename Sheet</div>
</div>

<script>
/**
 * Core Application Logic
 */
class SpreadsheetApp {
    constructor() {
        // State
        this.sheets = {};
        this.sheetOrder = [];
        this.activeSheetId = null;
        this.history = [];
        this.historyIndex = -1;
        
        // UI References
        this.gridContainer = document.getElementById('spreadsheet-container');
        this.formulaInput = document.getElementById('formula-input');
        this.addressDisplay = document.getElementById('address-display');
        this.sheetTabs = document.getElementById('sheet-tabs');
        this.contextMenu = document.getElementById('context-menu');

        // Constants
        this.cols = 26; // A-Z
        this.rows = 50; 
        
        // Selection State
        this.selectionStart = null; // {r, c}
        this.selectionEnd = null;   // {r, c}
        this.isSelecting = false;
        this.editing = false;

        // Initialize
        this.createSheet("Sheet1");
        this.setupListeners();
        this.renderSheetsBar();
    }

    // --- Data Management ---

    createSheet(name) {
        const id = Date.now().toString(36) + Math.random().toString(36).substr(2);
        this.sheets[id] = {
            name: name,
            data: {},       // cell key (e.g. "A1") -> { raw, display, style }
            colWidths: {}   // store specific widths
        };
        this.sheetOrder.push(id);
        this.setActiveSheet(id);
        this.saveHistory();
    }

    getActiveSheetData() {
        return this.sheets[this.activeSheetId];
    }

    setActiveSheet(id) {
        this.activeSheetId = id;
        this.renderSheetGrid();
        this.renderSheetsBar();
        this.updateStatus(`Opened ${this.getActiveSheetData().name}`);
        this.selectCell(1, 1); // Reset selection
    }

    addSheet() {
        let baseName = "Sheet";
        let count = 1;
        // Simple naming collision avoider could go here
        this.createSheet(`${baseName}${count}`); 
    }

    deleteSheet(sheetId) {
        if (this.sheetOrder.length <= 1) {
            alert("You must have at least one sheet.");
            return;
        }
        if(confirm("Delete this sheet?")) {
            delete this.sheets[sheetId];
            const idx = this.sheetOrder.indexOf(sheetId);
            this.sheetOrder.splice(idx, 1);
            this.setActiveSheet(this.sheetOrder[0]);
        }
    }

    // --- Rendering ---

    renderSheetsBar() {
        this.sheetTabs.innerHTML = '';
        this.sheetOrder.forEach(id => {
            const tab = document.createElement('div');
            tab.className = `sheet-tab ${id === this.activeSheetId ? 'active' : ''}`;
            tab.textContent = this.sheets[id].name;
            tab.onclick = () => this.setActiveSheet(id);
            // Right click context menu
            tab.oncontextmenu = (e) => this.showSheetContext(e, id);
            this.sheetTabs.appendChild(tab);
        });
    }

    renderSheetGrid() {
        const data = this.getActiveSheetData();
        let html = `<table><thead><tr>`;
        
        // Corner Header
        html += `<th class="corner"></th>`;
        
        // Column Headers
        for(let c=0; c<this.cols; c++) {
            html += `<th>${String.fromCharCode(65+c)}</th>`;
        }
        html += `</tr></thead><tbody>`;

        // Rows
        for(let r=1; r<=this.rows; r++) {
            html += `<tr><th class="row-header">${r}</th>`;
            for(let c=0; c<this.cols; c++) {
                const cellId = this.coordsToId(r, c+1);
                const cellData = data.data[cellId] || {};
                const val = cellData.display !== undefined ? cellData.display : "";
                
                // Style classes
                let styleClass = "";
                if(cellData.style && cellData.style.bgColor) styleClass += ` background-color:${cellData.style.bgColor};`;
                if(cellData.style && cellData.style.bold) styleClass += ` font-weight:bold;`;
                if(cellData.style && cellData.style.italic) styleClass += ` font-style:italic;`;
                
                // Alignment
                const isNum = /^[0-9\.\-\+\$]+$/;
                let textAlign = "";
                if (isNum.test(val.toString())) textAlign = "text-align:right;";
                else if (val.charAt(0) == "=") textAlign = "text-align:left;";
                else textAlign = "text-align:left;";

                html += `<td 
                    id="${cellId}" 
                    data-row="${r}" 
                    data-col="${c}" 
                    style="${textAlign} ${styleClass}"
                    onmousedown="app.mouseDownHandler(event)"
                    ondblclick="app.editCell()"
                >${val}</td>`;
            }
            html += `</tr>`;
        }
        html += `</tbody></table>`;
        this.gridContainer.innerHTML = html;
    }

    // --- Interaction Handlers ---

    setupListeners() {
        // Global Key Listener for Grid
        document.addEventListener('keydown', (e) => {
            if (!this.selectionEnd) return;
            
            if (document.activeElement === this.formulaInput) {
                 if(e.key === "Enter") this.commitEdit();
                 return; 
            }

            // Navigation
            if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) {
                e.preventDefault();
                let {r, c} = this.selectionEnd;
                if(e.key === 'ArrowUp') r = Math.max(1, r-1);
                if(e.key === 'ArrowDown') r = Math.min(this.rows, r+1);
                if(e.key === 'ArrowLeft') c = Math.max(1, c-1);
                if(e.key === 'ArrowRight') c = Math.min(this.cols, c+1);
                this.selectCell(r, c, e.shiftKey);
            }

            if(e.key === "Enter") {
                if(e.shiftKey) {
                     // Move Up
                     this.selectCell(Math.max(1, this.selectionEnd.r-1), this.selectionEnd.c);
                } else {
                    // Move Down
                    this.selectCell(Math.min(this.rows, this.selectionEnd.r+1), this.selectionEnd.c);
                }
            }

            if(e.key === "Tab") {
                 e.preventDefault();
                 if(e.shiftKey) this.selectCell(this.selectionEnd.r, Math.max(1, this.selectionEnd.c-1));
                 else this.selectCell(this.selectionEnd.r, Math.min(this.cols, this.selectionEnd.c+1));
            }

            // Type to Enter
            if(e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                this.startEdit(e.key);
            }
        });

        // Formula Input Focus Handler
        this.formulaInput.addEventListener('focus', () => {
             if(this.selectionEnd) {
                const cell = this.getCellValueObj(this.selectionEnd.r, this.selectionEnd.c);
                this.formulaInput.value = cell ? cell.raw : "";
                this.formulaInput.select();
             }
        });

        this.formulaInput.addEventListener('input', (e) => {
            // Live update cell visual
            if(this.selectionEnd) {
                this.setRawValue(this.selectionEnd.r, this.selectionEnd.c, e.target.value);
            }
        });
        
        // Prevent default paste
        document.addEventListener('paste', (e) => {
            // Allow implementation later if needed
        });
        
        // Context Menu
        window.onclick = () => this.contextMenu.style.display = 'none';
    }

    mouseDownHandler(e) {
        const td = e.target.closest('td');
        if(!td) return;
        
        const r = parseInt(td.dataset.row);
        const c = parseInt(td.dataset.col);

        if(e.shiftKey) {
            // Extend selection
            this.selectionEnd = {r, c};
        } else {
            // New selection
            this.selectionStart = {r, c};
            this.selectionEnd = {r, c};
        }
        
        this.drawSelection();
        
        // Drag Select Logic (Mouseover handled via global listeners ideally, simplified here to click only for MVP)
    }

    selectCell(r, c, extend=false) {
        this.selectionStart = extend && this.selectionStart ? this.selectionStart : {r,c};
        this.selectionEnd = {r, c};
        this.drawSelection();
        
        const cell = this.getCellValueObj(r, c);
        const raw = cell ? cell.raw : "";
        
        this.addressDisplay.textContent = `${this.idToCoords(r, c)}`;
        this.formulaInput.value = raw;
    }

    drawSelection() {
        // Clear previous selections
        document.querySelectorAll('td.selected').forEach(el => el.classList.remove('selected'));
        
        const minR = Math.min(this.selectionStart.r, this.selectionEnd.r);
        const maxR = Math.max(this.selectionStart.r, this.selectionEnd.r);
        const minC = Math.min(this.selectionStart.c, this.selectionEnd.c);
        const maxC = Math.max(this.selectionStart.c, this.selectionEnd.c);

        for(let r=minR; r<=maxR; r++){
            for(let c=minC; c<=maxC; c++){
                const el = document.getElementById(this.coordsToId(r, c));
                if(el) el.classList.add('selected');
            }
        }
        
        // Update Formula Bar
        const cell = this.getCellValueObj(this.selectionEnd.r, this.selectionEnd.c);
        const raw = cell ? cell.raw : "";
        this.formulaInput.value = raw;
        this.addressDisplay.textContent = this.idToCoords(this.selectionEnd.r, this.selectionEnd.c);
    }

    startEdit(prependChar="") {
        this.formulaInput.focus();
        if(prependChar) {
            this.formulaInput.value = prependChar;
        }
    }

    editCell() {
        const td = document.activeElement.closest('td');
        if(td) {
            const r = parseInt(td.dataset.row);
            const c = parseInt(td.dataset.col);
            const cell = this.getCellValueObj(r, c);
            this.formulaInput.value = cell ? cell.raw : "";
            this.formulaInput.focus();
        }
    }

    commitEdit() {
        if(!this.selectionEnd) return;
        const raw = this.formulaInput.value;
        this.setRawValue(this.selectionEnd.r, this.selectionEnd.c, raw);
        this.formulaInput.blur();
        // Move down after enter
        const nextR = Math.min(this.rows, this.selectionEnd.r + 1);
        this.selectCell(nextR, this.selectionEnd.c);
    }

    // --- Logic & Calculations ---

    setRawValue(r, c, raw) {
        const cellId = this.coordsToId(r, c);
        const sheetData = this.getActiveSheetData();
        
        // Basic formatting detection if not a formula
        let display = raw;
        let isFormula = raw.startsWith("=");

        sheetData.data[cellId] = {
            raw: raw,
            display: display,
            style: { ...sheetData.data[cellId]?.style || {} }
        };
        
        if(isFormula) {
            this.recalcSheet();
        } else {
            // Re-render just this cell if needed, or redraw all
            const el = document.getElementById(cellId);
            if(el) {
                el.innerText = raw;
                el.className = /^[0-9]/.test(raw) ? "" : "text-cell";
            }
        }
    }

    recalcSheet() {
        // Naive re-evaluation for simplicity (O(N^2) worst case without graph)
        // Iterative approach to resolve dependencies
        let data = this.getActiveSheetData();
        let visited = new Set();
        let queue = Object.keys(data.data).filter(k => data.data[k].raw.startsWith("="));

        // Dependency graph would be better, but simple recursion works for small sheets
        const evaluateCell = (key) => {
            if (visited.has(key)) return; // Stop circular
            
            const cellObj = data.data[key];
            if(!cellObj || !cellObj.raw.startsWith("=")) {
                if(cellObj) cellObj.display = cellObj.raw;
                return cellObj ? cellObj.raw : 0;
            }

            try {
                const expr = cellObj.raw.substring(1).toUpperCase();
                const parsedExpr = this.parseExpression(expr);
                
                // Safety guard against huge evaluations
                if(parsedExpr === "ERR") throw new Error("Cycle");
                
                cellObj.display = parsedExpr;
                visited.add(key);
            } catch(err) {
                cellObj.display = "#ERROR";
            }
        };

        // Loop until stable (Max 20 passes to prevent hang)
        let changed = true;
        let pass = 0;
        while(changed && pass < 20) {
            changed = false;
            Object.keys(data.data).forEach(key => {
                if(data.data[key].raw.startsWith("=")) {
                    const oldVal = data.data[key].display;
                    evaluateCell(key);
                    if(oldVal !== data.data[key].display) changed = true;
                }
            });
            pass++;
        }

        this.refreshGridDisplay();
    }

    refreshGridDisplay() {
        const data = this.getActiveSheetData();
        for(let key in data.data) {
            const el = document.getElementById(key);
            if(el) el.innerText = data.data[key].display;
        }
    }

    getCellValueObj(r, c) {
        const data = this.getActiveSheetData();
        return data.data[this.coordsToId(r, c)];
    }

    getValue(r, c) {
        const cell = this.getCellValueObj(r, c);
        if(!cell) return 0;
        
        // If raw is formula, try to eval it immediately (recursive risk in naive impl)
        if(cell.raw.startsWith("=")) {
            // Just get the cached display value if available
            return cell.display; 
        }
        
        const val = parseFloat(cell.raw);
        return isNaN(val) ? cell.raw : val;
    }

    // --- Formula Parser ---

    parseExpression(expr) {
        // 1. Identify Ranges (e.g., A1:B2) and Functions (SUM, AVG...)
        // This is a simplified parser. Real regex engines are needed for perfect parsing.
        
        // Replace Ranges with Arrays
        // Pattern: [A-Z]+\d+:[A-Z]+\d+
        const rangeRegex = /([A-Z]+[0-9]+):([A-Z]+[0-9]+)/g;
        
        const expandedExpr = expr.replace(rangeRegex, (match, start, end) => {
            const vals = [];
            const startR = parseInt(start.match(/\d+/)[0]);
            const startC = this.idToColNumber(start.match(/[A-Z]+/)[0]);
            const endR = parseInt(end.match(/\d+/)[0]);
            const endC = this.idToColNumber(end.match(/[A-Z]+/)[0]);
            
            const minR = Math.min(startR, endR), maxR = Math.max(startR, endR);
            const minC = Math.min(startC, endC), maxC = Math.max(startC, endC);
            
            for(let r=minR; r<=maxR; r++) {
                for(let c=minC; c<=maxC; c++) {
                    vals.push(this.getValue(r, c));
                }
            }
            return JSON.stringify(vals); // Stringify array so eval sees it as literal array
        });

        // Replace Single Cell References
        // Pattern: [A-Z]+\d+
        const singleRefRegex = /[A-Z]+\d+/g;
        const finalExpr = expandedExpr.replace(singleRefRegex, (match) => {
            const r = parseInt(match.match(/\d+/)[0]);
            const c = this.idToColNumber(match.match(/[A-Z]+/)[0]);
            return this.getValue(r, c);
        });

        // Handle Functions manually since JS doesn't have SUM(A1,A2) native
        let processed = finalExpr;
        
        // Helper for function extraction
        const processFunc = (name) => {
            const regex = new RegExp(`${name}\\(([^)]+)\\)`, 'g');
            return processed.replace(regex, (match, args) => {
                // args could be "[1,2,3]" (array) or "1,2,3" (comma list)
                let arr;
                try {
                   arr = JSON.parse(args); // If it was replaced range
                } catch(e) {
                   arr = args.split(',').map(x => parseFloat(x.trim())); // Manual csv
                }
                
                if(arr.some(isNaN)) return "ERR"; // Non-numeric data in math

                switch(name.toUpperCase()) {
                    case 'SUM': return arr.reduce((a,b) => a+b, 0);
                    case 'AVG': 
                        return arr.length ? arr.reduce((a,b) => a+b, 0)/arr.length : 0;
                    case 'MAX': return Math.max(...arr);
                    case 'MIN': return Math.min(...arr);
                    default: return "ERR";
                }
            });
        };

        ['SUM', 'AVG', 'MAX', 'MIN'].forEach(func => processed = processFunc(func));

        // Safe Evaluate Math
        // Only allow numbers, operators, parens, arrays
        if(/^[0-9+\-*/().\s,\[\]]+$/.test(processed)) {
            try {
                // eslint-disable-next-line no-new-func
                return new Function('return ' + processed)();
            } catch(e) { return "ERR"; }
        }
        return "ERR";
    }

    // --- Utilities ---

    coordsToId(r, c) {
        return `${String.fromCharCode(65+c-1)}${r}`;
    }
    
    idToCoords(id) {
        // Not strictly used but good for debugging
        const match = id.match(/([A-Z]+)([0-9]+)/);
        return {r: parseInt(match[2]), c: this.idToColNumber(match[1])};
    }

    idToColNumber(str) {
        let num = 0;
        for (let i = 0; i < str.length; i++) {
            num = num * 26 + (str.charCodeAt(i) - 64);
        }
        return num;
    }

    toggleStyle(prop) {
        if(!this.selectionEnd) return;
        const start = Math.min(this.selectionStart.r, this.selectionEnd.r);
        const end = Math.max(this.selectionStart.r, this.selectionEnd.r);
        const startC = Math.min(this.selectionStart.c, this.selectionEnd.c);
        const endC = Math.max(this.selectionStart.c, this.selectionEnd.c);

        for(let r=start; r<=end; r++){
            for(let c=startC; c<=endC; c++){
                const cellId = this.coordsToId(r, c);
                const data = this.getActiveSheetData();
                if(!data.data[cellId]) data.data[cellId] = { raw:"", display:"", style:{} };
                
                // Toggle
                const current = data.data[cellId].style[prop];
                data.data[cellId].style[prop] = !current;
                
                // Update DOM
                const el = document.getElementById(cellId);
                if(el) {
                    if(prop === 'bold') el.style.fontWeight = data.data[cellId].style.bold ? 'bold' : 'normal';
                    if(prop === 'italic') el.style.fontStyle = data.data[cellId].style.italic ? 'italic' : 'normal';
                }
            }
        }
    }

    changeColor(color) {
         if(!this.selectionEnd) return;
         const start = Math.min(this.selectionStart.r, this.selectionEnd.r);
         const end = Math.max(this.selectionStart.r, this.selectionEnd.r);
         const startC = Math.min(this.selectionStart.c, this.selectionEnd.c);
         const endC = Math.max(this.selectionStart.c, this.selectionEnd.c);

        for(let r=start; r<=end; r++){
            for(let c=startC; c<=endC; c++){
                const cellId = this.coordsToId(r, c);
                const data = this.getActiveSheetData();
                if(!data.data[cellId]) data.data[cellId] = { raw:"", display:"", style:{} };
                data.data[cellId].style.bgColor = color;
                const el = document.getElementById(cellId);
                if(el) el.style.backgroundColor = color;
            }
        }
    }

    clearContents() {
        if(!this.selectionEnd) return;
        const start = Math.min(this.selectionStart.r, this.selectionEnd.r);
        const end = Math.max(this.selectionStart.r, this.selectionEnd.r);
        const startC = Math.min(this.selectionStart.c, this.selectionEnd.c);
        const endC = Math.max(this.selectionStart.c, this.selectionEnd.c);

        for(let r=start; r<=end; r++){
            for(let c=startC; c<=endC; c++){
                this.setRawValue(r, c, "");
            }
        }
        this.formulaInput.value = "";
    }

    saveHistory() {
        this.history.push(JSON.stringify(this.sheets));
        this.historyIndex++;
    }
    
    undo() {
        // Simplified undo (restore whole state)
        if(this.historyIndex > 0) {
            this.historyIndex--;
            this.sheets = JSON.parse(this.history[this.historyIndex]);
            this.setActiveSheet(this.activeSheetId);
        }
    }
    redo() {
        if(this.historyIndex < this.history.length - 1) {
            this.historyIndex++;
            this.sheets = JSON.parse(this.history[this.historyIndex]);
            this.setActiveSheet(this.activeSheetId);
        }
    }

    // --- CSV IO ---

    downloadCSV() {
        const sheet = this.getActiveSheetData();
        let csvContent = "data:text/csv;charset=utf-8,";
        
        for(let r=1; r<=this.rows; r++) {
            let rowData = [];
            for(let c=1; c<=this.cols; c++) {
                const val = this.getValue(r, c);
                // Escape commas/quotes
                let str = String(val);
                if(str.search(/("|,|\n)/g) >= 0) str = `"${str.replace(/"/g, '""')}"`;
                rowData.push(str);
            }
            csvContent += rowData.join(",") + "\r\n";
        }
        
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `${sheet.name}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    uploadCSV(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            const lines = text.split("\n");
            this.createSheet("Imported CSV");
            
            for(let r=0; r<lines.length; r++) {
                // Handle quotes simply
                const cols = lines[r].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                for(let c=0; c<cols.length; c++) {
                    let val = cols[c].trim();
                    if(val.startsWith('"') && val.endsWith('"')) val = val.slice(1, -1).replace(/""/g, '"');
                    if(val) this.setRawValue(r+1, c+1, val);
                }
            }
            this.updateStatus("CSV Imported");
        };
        reader.readAsText(file);
        input.value = ''; // reset
    }
    
    updateStatus(msg) {
        document.getElementById('status-msg').innerText = msg;
        setTimeout(() => document.getElementById('status-msg').innerText = 'Ready', 3000);
    }

    // --- Context Menu Actions ---
    showSheetContext(e, sheetId) {
        e.preventDefault();
        this.contextMenu.sheetId = sheetId;
        this.contextMenu.style.top = e.pageY + "px";
        this.contextMenu.style.left = e.pageX + "px";
        this.contextMenu.style.display = "block";
    }
    
    deleteSheetFromMenu() {
        if(this.contextMenu.sheetId) this.deleteSheet(this.contextMenu.sheetId);
        this.contextMenu.style.display = 'none';
    }

    renameSheetFromMenu() {
        if(!this.contextMenu.sheetId) return;
        const newName = prompt("Enter new name:", this.sheets[this.contextMenu.sheetId].name);
        if(newName) this.sheets[this.contextMenu.sheetId].name = newName;
        this.contextMenu.style.display = 'none';
        this.renderSheetsBar();
    }
}

// Instantiate App
const app = new SpreadsheetApp();
