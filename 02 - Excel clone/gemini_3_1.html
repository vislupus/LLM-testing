<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Spreadsheet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        /* Table Styles */
        .grid-container { flex: 1; overflow: auto; background-color: #f3f4f6; position: relative; }
        table { border-collapse: collapse; table-layout: fixed; background: white; }
        th, td { border: 1px solid #d1d5db; padding: 0 4px; overflow: hidden; white-space: nowrap; outline: none; }
        th { background-color: #f9fafb; color: #4b5563; font-weight: normal; text-align: center; position: relative; user-select: none; }
        .row-header { width: 40px; background-color: #f9fafb; position: sticky; left: 0; z-index: 10; text-align: center; color: #4b5563; }
        .col-header { position: sticky; top: 0; z-index: 11; height: 24px; }
        .corner-header { position: sticky; top: 0; left: 0; z-index: 12; background-color: #e5e7eb; cursor: pointer; }
        
        /* Cell States */
        td { height: 24px; cursor: cell; user-select: none; font-size: 14px; position: relative; }
        .cell-selected { background-color: #e0f2fe; }
        .cell-active { border: 2px solid #10b981 !important; z-index: 5; background-color: white; }
        
        /* Column Resizer */
        .resizer { position: absolute; right: 0; top: 0; bottom: 0; width: 4px; cursor: col-resize; z-index: 20; }
        .resizer:hover, .resizer.resizing { background-color: #10b981; }

        /* Cell Editor */
        .cell-editor { position: absolute; top: -2px; left: -2px; right: -2px; bottom: -2px; border: 2px solid #10b981; padding: 0 3px; font-size: 14px; outline: none; z-index: 30; background: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); display: none; }
        .cell-editor.active { display: block; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        
        /* Sheet Tabs */
        .tab-active { background-color: white; border-top: 3px solid #10b981; color: #10b981; font-weight: 600; }
        .tab-inactive { background-color: #f3f4f6; color: #4b5563; border-top: 3px solid transparent; }
        .tab-inactive:hover { background-color: #e5e7eb; }
    </style>
</head>
<body class="h-screen flex flex-col bg-white text-gray-800">

    <!-- Toolbar -->
    <div class="flex items-center gap-2 p-2 bg-gray-50 border-b border-gray-200 shadow-sm text-sm">
        <div class="flex items-center gap-1 border-r pr-2 border-gray-300">
            <button id="btn-bold" class="w-8 h-8 rounded hover:bg-gray-200 text-gray-700" title="Bold"><i class="fa-solid fa-bold"></i></button>
            <button id="btn-italic" class="w-8 h-8 rounded hover:bg-gray-200 text-gray-700" title="Italic"><i class="fa-solid fa-italic"></i></button>
            <div class="relative flex items-center gap-1 ml-1 hover:bg-gray-200 rounded p-1 cursor-pointer" title="Fill Color">
                <i class="fa-solid fa-fill-drip text-gray-700"></i>
                <input type="color" id="btn-color" class="w-5 h-5 cursor-pointer opacity-0 absolute inset-0">
                <div id="color-indicator" class="w-4 h-1 absolute bottom-1 left-1 bg-white border border-gray-400"></div>
            </div>
            <button id="btn-clear" class="w-8 h-8 rounded hover:bg-gray-200 text-gray-700 ml-1" title="Clear Cell"><i class="fa-solid fa-eraser"></i></button>
        </div>
        <div class="flex items-center gap-2 ml-auto">
            <label class="cursor-pointer bg-white border border-gray-300 hover:bg-gray-50 px-3 py-1 rounded text-xs font-medium text-gray-600 shadow-sm">
                <i class="fa-solid fa-upload mr-1"></i> Import CSV
                <input type="file" id="import-csv" accept=".csv" class="hidden">
            </label>
            <button id="btn-export" class="bg-[#107c41] hover:bg-[#0b5e31] text-white px-3 py-1 rounded text-xs font-medium shadow-sm transition-colors">
                <i class="fa-solid fa-download mr-1"></i> Export CSV
            </button>
        </div>
    </div>

    <!-- Formula Bar -->
    <div class="flex items-center gap-2 p-2 border-b border-gray-200 bg-white shadow-sm">
        <div id="active-address" class="w-16 text-center font-medium text-sm text-gray-700 bg-gray-100 border border-gray-300 rounded py-1 px-2 select-none">
            A1
        </div>
        <div class="text-gray-400 px-2 italic font-serif">fx</div>
        <input type="text" id="formula-input" class="flex-1 border border-gray-300 rounded px-2 py-1 text-sm outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all" placeholder="Enter value or formula (e.g., =SUM(A1:B2))">
    </div>

    <!-- Spreadsheet Grid -->
    <div class="grid-container" id="grid-container">
        <table id="spreadsheet-table">
            <colgroup id="col-group"></colgroup>
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>

    <!-- Footer / Sheet Tabs -->
    <div class="flex items-center border-t border-gray-300 bg-gray-100 h-10 select-none">
        <div class="flex items-center px-2 border-r border-gray-300 h-full gap-2 text-gray-500">
            <button class="hover:text-gray-800"><i class="fa-solid fa-bars"></i></button>
        </div>
        <div id="sheet-tabs" class="flex h-full overflow-x-auto hide-scrollbar">
            <!-- Tabs generated by JS -->
        </div>
        <button id="btn-add-sheet" class="w-10 h-full flex items-center justify-center hover:bg-gray-200 text-gray-600 border-l border-gray-300" title="Add Sheet">
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>

    <script>
        // --- Core Configuration & State ---
        const COLS = 26; // A to Z
        const ROWS = 100;
        
        let state = {
            sheets: [],
            activeSheetId: null,
            selection: { start: {c: 0, r: 0}, end: {c: 0, r: 0}, active: {c: 0, r: 0} },
            clipboard: null,
            colWidths: {}, // { sheetId: { colIndex: width } }
        };

        // Dependency Graph for Reactive Recalculation
        let deps = {};        // { 'sheetId!addr': Set(['sheetId!depAddr']) }
        let reverseDeps = {}; // { 'sheetId!addr': Set(['sheetId!depAddr']) }
        
        let isDragging = false;
        let isEditing = false;
        
        // Formula clicking mechanics
        let formulaSelecting = false;
        let formulaBaseString = "";

        // Elements
        const elGrid = document.getElementById('spreadsheet-table');
        const elColGroup = document.getElementById('col-group');
        const elHead = document.getElementById('table-head');
        const elBody = document.getElementById('table-body');
        const elFormulaInput = document.getElementById('formula-input');
        const elActiveAddress = document.getElementById('active-address');
        const elSheetTabs = document.getElementById('sheet-tabs');
        let elCellEditor = null; // Dynamically created inside active cell

        // --- Helpers ---
        const colToLetter = (c) => String.fromCharCode(65 + c);
        const letterToCol = (l) => l.charCodeAt(0) - 65;
        const getAddr = (c, r) => `${colToLetter(c)}${r + 1}`;
        const parseAddr = (addr) => {
            const m = addr.toUpperCase().match(/^([A-Z]+)(\d+)$/);
            if (!m) return null;
            let c = 0;
            for (let i = 0; i < m[1].length; i++) c = c * 26 + (m[1].charCodeAt(i) - 64);
            return { c: c - 1, r: parseInt(m[2]) - 1 };
        };
        const getGlobalId = (sheetId, addr) => `${sheetId}!${addr}`;

        // Math/Excel Functions for Evaluator
        const EXCEL_FUNCS = {
            SUM: (args) => args.reduce((a,b) => a + (Number(b)||0), 0),
            AVERAGE: (args) => args.length ? EXCEL_FUNCS.SUM(args) / args.length : 0,
            MIN: (args) => args.length ? Math.min(...args.map(n => Number(n)||0)) : 0,
            MAX: (args) => args.length ? Math.max(...args.map(n => Number(n)||0)) : 0,
            COUNT: (args) => args.filter(a => typeof a === 'number' && !isNaN(a)).length
        };

        // --- Initialization ---
        function init() {
            addSheet("Sheet1");
            buildGridDOM();
            renderActiveSheet();
            setupEventListeners();
        }

        // --- Data Model ---
        function addSheet(name) {
            const id = 'sheet_' + Date.now();
            state.sheets.push({ id, name, data: {} });
            state.colWidths[id] = {};
            switchSheet(id);
        }

        function switchSheet(id) {
            state.activeSheetId = id;
            state.selection = { start: {c:0, r:0}, end: {c:0, r:0}, active: {c:0, r:0} };
            renderTabs();
            applyColWidths();
            renderActiveSheet();
            updateUIState();
        }

        function getActiveSheet() {
            return state.sheets.find(s => s.id === state.activeSheetId);
        }

        function getCellData(sheetId, addr) {
            const sheet = state.sheets.find(s => s.id === sheetId);
            return sheet && sheet.data[addr] ? sheet.data[addr] : { v: '', c: '', format: {} };
        }

        function setCellData(sheetId, addr, data) {
            const sheet = state.sheets.find(s => s.id === sheetId);
            if (!sheet.data[addr]) sheet.data[addr] = { v: '', c: '', format: {} };
            Object.assign(sheet.data[addr], data);
        }

        // --- Formula Engine ---
        function evaluateCell(sheetId, addr) {
            const globalId = getGlobalId(sheetId, addr);
            const cell = getCellData(sheetId, addr);
            
            // Clear old dependencies
            if (reverseDeps[globalId]) {
                reverseDeps[globalId].forEach(depOn => {
                    if (deps[depOn]) deps[depOn].delete(globalId);
                });
            }
            reverseDeps[globalId] = new Set();

            let val = cell.v.toString();
            if (val.startsWith('=')) {
                window._currentEvalGlobalId = globalId;
                window._currentEvalSheetId = sheetId;
                cell.c = resolveFormula(val.substring(1).toUpperCase());
                window._currentEvalGlobalId = null;
            } else {
                let num = Number(val);
                cell.c = (val !== '' && !isNaN(num)) ? num : val;
            }

            // Trigger updates for dependents
            if (deps[globalId]) {
                deps[globalId].forEach(depAddr => {
                    const [sId, a] = depAddr.split('!');
                    evaluateCell(sId, a);
                    if (sId === state.activeSheetId) updateCellDOM(a);
                });
            }
        }

        function resolveFormula(expr) {
            // Replace Ranges (e.g. A1:B2)
            expr = expr.replace(/\b([A-Z]+\d+):([A-Z]+\d+)\b/g, (match, start, end) => {
                const s = parseAddr(start);
                const e = parseAddr(end);
                if(!s || !e) return "[]";
                let cells = [];
                const cMin = Math.min(s.c, e.c), cMax = Math.max(s.c, e.c);
                const rMin = Math.min(s.r, e.r), rMax = Math.max(s.r, e.r);
                for(let r=rMin; r<=rMax; r++){
                    for(let c=cMin; c<=cMax; c++){
                        cells.push(`__VAL('${getAddr(c,r)}')`);
                    }
                }
                return `[${cells.join(',')}]`;
            });
            
            // Replace individual cells (e.g. A1)
            expr = expr.replace(/\b([A-Z]+\d+)\b/g, (match) => `__VAL('${match}')`);

            try {
                const fn = new Function('__VAL', 'FUNCS', `
                    const SUM = (arr) => FUNCS.SUM(arr);
                    const AVERAGE = (arr) => FUNCS.AVERAGE(arr);
                    const MIN = (arr) => FUNCS.MIN(arr);
                    const MAX = (arr) => FUNCS.MAX(arr);
                    const COUNT = (arr) => FUNCS.COUNT(arr);
                    return ${expr};
                `);

                return fn((depAddr) => {
                    // Dependency tracking
                    const callerGlobalId = window._currentEvalGlobalId;
                    const depGlobalId = getGlobalId(window._currentEvalSheetId, depAddr);
                    
                    if (callerGlobalId) {
                        if (!deps[depGlobalId]) deps[depGlobalId] = new Set();
                        deps[depGlobalId].add(callerGlobalId);
                        reverseDeps[callerGlobalId].add(depGlobalId);
                    }

                    const data = getCellData(window._currentEvalSheetId, depAddr);
                    return (data.c === '' || data.c == null) ? 0 : data.c;
                }, EXCEL_FUNCS);
            } catch (e) {
                return '#ERROR!';
            }
        }

        // --- DOM Building & Rendering ---
        function buildGridDOM() {
            // ColGroup for resizing
            elColGroup.innerHTML = '<col style="width: 40px;">'; // row header col
            for(let c=0; c<COLS; c++) {
                elColGroup.innerHTML += `<col id="col-${c}" style="width: 100px;">`;
            }

            // Head
            let headTr = document.createElement('tr');
            headTr.innerHTML = `<th class="corner-header" onclick="selectAll()"></th>`;
            for(let c=0; c<COLS; c++) {
                const th = document.createElement('th');
                th.className = 'col-header';
                th.innerHTML = `${colToLetter(c)}<div class="resizer" data-col="${c}"></div>`;
                headTr.appendChild(th);
            }
            elHead.appendChild(headTr);

            // Body
            let bodyHTML = '';
            for(let r=0; r<ROWS; r++) {
                bodyHTML += `<tr><th class="row-header">${r + 1}</th>`;
                for(let c=0; c<COLS; c++) {
                    bodyHTML += `<td id="cell-${c}-${r}" data-c="${c}" data-r="${r}"></td>`;
                }
                bodyHTML += `</tr>`;
            }
            elBody.innerHTML = bodyHTML;
            
            // Reattach Column Resizing events
            document.querySelectorAll('.resizer').forEach(resizer => {
                resizer.addEventListener('mousedown', initColResize);
            });
        }

        function renderActiveSheet() {
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    updateCellDOM(getAddr(c, r));
                }
            }
            updateSelectionVisuals();
        }

        function updateCellDOM(addr) {
            const pos = parseAddr(addr);
            if(!pos) return;
            const td = document.getElementById(`cell-${pos.c}-${pos.r}`);
            if(!td) return;
            
            const data = getCellData(state.activeSheetId, addr);
            
            // Only update text if not actively editing THIS cell
            if(!isEditing || state.selection.active.c !== pos.c || state.selection.active.r !== pos.r) {
                td.textContent = data.c;
            }

            // Apply formatting
            td.style.fontWeight = data.format.bold ? 'bold' : 'normal';
            td.style.fontStyle = data.format.italic ? 'italic' : 'normal';
            td.style.backgroundColor = data.format.bg || '';
        }

        function applyColWidths() {
            const widths = state.colWidths[state.activeSheetId] || {};
            for(let c=0; c<COLS; c++) {
                const colEl = document.getElementById(`col-${c}`);
                colEl.style.width = (widths[c] || 100) + 'px';
            }
        }

        function renderTabs() {
            elSheetTabs.innerHTML = state.sheets.map(s => `
                <div class="flex items-center px-4 py-2 cursor-pointer border-r border-gray-300 text-sm ${s.id === state.activeSheetId ? 'tab-active' : 'tab-inactive'}" 
                     onclick="switchSheet('${s.id}')" oncontextmenu="sheetContextMenu(event, '${s.id}')">
                    ${s.name}
                </div>
            `).join('');
        }

        // --- Interaction & Selection ---
        function setSelection(c, r, extend = false) {
            if(c < 0) c = 0; if(c >= COLS) c = COLS-1;
            if(r < 0) r = 0; if(r >= ROWS) r = ROWS-1;
            
            if (isEditing && formulaSelecting) {
                // Formula reference insertion logic
                const addr = getAddr(c, r);
                if (extend) {
                    const activeAddr = getAddr(state.selection.active.c, state.selection.active.r);
                    elFormulaInput.value = formulaBaseString + activeAddr + ":" + addr;
                } else {
                    elFormulaInput.value = formulaBaseString + addr;
                }
                syncEditorToFormulaBar();
                return;
            }

            if(isEditing) commitEdit();

            state.selection.end = {c, r};
            if(!extend) {
                state.selection.start = {c, r};
                state.selection.active = {c, r};
            }
            updateSelectionVisuals();
            updateUIState();
        }

        function updateSelectionVisuals() {
            // Clear old
            document.querySelectorAll('.cell-selected, .cell-active').forEach(el => {
                el.classList.remove('cell-selected', 'cell-active');
            });
            
            const cMin = Math.min(state.selection.start.c, state.selection.end.c);
            const cMax = Math.max(state.selection.start.c, state.selection.end.c);
            const rMin = Math.min(state.selection.start.r, state.selection.end.r);
            const rMax = Math.max(state.selection.start.r, state.selection.end.r);

            for(let r=rMin; r<=rMax; r++) {
                for(let c=cMin; c<=cMax; c++) {
                    const td = document.getElementById(`cell-${c}-${r}`);
                    if(td) {
                        td.classList.add('cell-selected');
                        if(c === state.selection.active.c && r === state.selection.active.r) {
                            td.classList.add('cell-active');
                            td.classList.remove('cell-selected');
                        }
                    }
                }
            }
        }

        function updateUIState() {
            const act = state.selection.active;
            const addr = getAddr(act.c, act.r);
            const data = getCellData(state.activeSheetId, addr);
            
            elActiveAddress.textContent = addr;
            if(!isEditing) {
                elFormulaInput.value = data.v;
            }

            // Update Toolbar
            const btnB = document.getElementById('btn-bold');
            const btnI = document.getElementById('btn-italic');
            const colorInd = document.getElementById('color-indicator');
            
            if(data.format.bold) btnB.classList.add('bg-gray-300'); else btnB.classList.remove('bg-gray-300');
            if(data.format.italic) btnI.classList.add('bg-gray-300'); else btnI.classList.remove('bg-gray-300');
            colorInd.style.backgroundColor = data.format.bg || '#ffffff';
        }

        function selectAll() {
            setSelection(0, 0);
            setSelection(COLS-1, ROWS-1, true);
        }

        // --- Editing ---
        function startEditing(initialValue = null) {
            if(isEditing) return;
            isEditing = true;
            const act = state.selection.active;
            const addr = getAddr(act.c, act.r);
            const data = getCellData(state.activeSheetId, addr);
            const td = document.getElementById(`cell-${act.c}-${act.r}`);
            
            // Create editor input
            elCellEditor = document.createElement('input');
            elCellEditor.type = 'text';
            elCellEditor.className = 'cell-editor active';
            elCellEditor.value = initialValue !== null ? initialValue : data.v;
            
            // Sync with formula bar
            elCellEditor.addEventListener('input', (e) => {
                elFormulaInput.value = e.target.value;
                checkFormulaSelectionMode();
            });
            elCellEditor.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') { e.preventDefault(); commitEdit(1, 0); }
                if(e.key === 'Tab') { e.preventDefault(); commitEdit(0, 1); }
                if(e.key === 'Escape') { cancelEdit(); }
            });
            
            td.textContent = '';
            td.appendChild(elCellEditor);
            elCellEditor.focus();
            
            // Move cursor to end
            elCellEditor.setSelectionRange(elCellEditor.value.length, elCellEditor.value.length);
            
            checkFormulaSelectionMode();
        }

        function commitEdit(moveRow = 0, moveCol = 0) {
            if(!isEditing) return;
            const act = state.selection.active;
            const addr = getAddr(act.c, act.r);
            const val = elCellEditor ? elCellEditor.value : elFormulaInput.value;
            
            setCellData(state.activeSheetId, addr, { v: val });
            evaluateCell(state.activeSheetId, addr);
            
            isEditing = false;
            formulaSelecting = false;
            if(elCellEditor) { elCellEditor.remove(); elCellEditor = null; }
            
            updateCellDOM(addr);
            
            if(moveRow !== 0 || moveCol !== 0) {
                setSelection(act.c + moveCol, act.r + moveRow);
            }
            updateUIState();
        }

        function cancelEdit() {
            if(!isEditing) return;
            isEditing = false;
            formulaSelecting = false;
            if(elCellEditor) { elCellEditor.remove(); elCellEditor = null; }
            const act = state.selection.active;
            updateCellDOM(getAddr(act.c, act.r));
            updateUIState();
        }

        function checkFormulaSelectionMode() {
            const val = elCellEditor ? elCellEditor.value : elFormulaInput.value;
            if (val.startsWith('=')) {
                formulaSelecting = false; // We only start selecting on explicit click away
            }
        }

        function syncEditorToFormulaBar() {
            if (elCellEditor) elCellEditor.value = elFormulaInput.value;
        }

        // --- Column Resizing ---
        let resizeData = null;
        function initColResize(e) {
            e.stopPropagation();
            const colIdx = e.target.getAttribute('data-col');
            const colEl = document.getElementById(`col-${colIdx}`);
            resizeData = {
                colIdx: colIdx,
                colEl: colEl,
                startX: e.pageX,
                startWidth: parseInt(colEl.style.width, 10)
            };
            e.target.classList.add('resizing');
            document.addEventListener('mousemove', doColResize);
            document.addEventListener('mouseup', stopColResize);
        }

        function doColResize(e) {
            if(!resizeData) return;
            const newWidth = Math.max(30, resizeData.startWidth + (e.pageX - resizeData.startX));
            resizeData.colEl.style.width = newWidth + 'px';
        }

        function stopColResize(e) {
            if(!resizeData) return;
            document.querySelector('.resizer.resizing')?.classList.remove('resizing');
            state.colWidths[state.activeSheetId][resizeData.colIdx] = parseInt(resizeData.colEl.style.width, 10);
            document.removeEventListener('mousemove', doColResize);
            document.removeEventListener('mouseup', stopColResize);
            resizeData = null;
        }

        // --- Events & Listeners ---
        function setupEventListeners() {
            // Grid Mouse Interactions
            elBody.addEventListener('mousedown', (e) => {
                const td = e.target.closest('td');
                if(!td) return;
                
                const c = parseInt(td.getAttribute('data-c'));
                const r = parseInt(td.getAttribute('data-r'));

                if (isEditing && (elCellEditor?.value.startsWith('=') || elFormulaInput.value.startsWith('='))) {
                    e.preventDefault(); // Prevent blur
                    formulaSelecting = true;
                    const val = elCellEditor ? elCellEditor.value : elFormulaInput.value;
                    // Auto-add + if ending with a reference or number and not operators
                    let base = val;
                    if (/[0-9A-Z]$/.test(base) && base.length > 1) base += '+'; 
                    formulaBaseString = base;
                    
                    const addr = getAddr(c, r);
                    elFormulaInput.value = formulaBaseString + addr;
                    syncEditorToFormulaBar();
                    
                    // Track drag for range selection in formula
                    isDragging = true;
                    state.selection.active = {c, r}; // temp set active for range calc
                    return;
                }

                if(e.button !== 0) return; // Only left click
                isDragging = true;
                setSelection(c, r, e.shiftKey);
            });

            elBody.addEventListener('mousemove', (e) => {
                if(!isDragging) return;
                const td = e.target.closest('td');
                if(!td) return;
                const c = parseInt(td.getAttribute('data-c'));
                const r = parseInt(td.getAttribute('data-r'));
                setSelection(c, r, true); // Extend selection
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
                if(formulaSelecting) {
                    formulaSelecting = false;
                    if(elCellEditor) elCellEditor.focus();
                    else elFormulaInput.focus();
                }
            });

            elBody.addEventListener('dblclick', (e) => {
                const td = e.target.closest('td');
                if(td) startEditing();
            });

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                if(isEditing) return; // handled by cell editor

                const act = state.selection.active;
                let c = act.c, r = act.r;

                switch(e.key) {
                    case 'ArrowUp': r--; e.preventDefault(); break;
                    case 'ArrowDown': r++; e.preventDefault(); break;
                    case 'ArrowLeft': c--; e.preventDefault(); break;
                    case 'ArrowRight': c++; e.preventDefault(); break;
                    case 'Enter': startEditing(); e.preventDefault(); return;
                    case 'Backspace': 
                    case 'Delete':
                        applyToSelection(addr => {
                            setCellData(state.activeSheetId, addr, { v: '', c: '' });
                            evaluateCell(state.activeSheetId, addr);
                        });
                        e.preventDefault();
                        return;
                    default:
                        if(e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                            startEditing(e.key);
                            e.preventDefault();
                        }
                        return;
                }
                setSelection(c, r, e.shiftKey);
            });

            // Formula Bar Edit
            elFormulaInput.addEventListener('focus', () => { if(!isEditing) isEditing = true; });
            elFormulaInput.addEventListener('keydown', (e) => {
                if(e.key === 'Enter') {
                    commitEdit(1, 0); // Move down like excel
                    elFormulaInput.blur();
                    // Return focus to grid
                    document.getElementById(`cell-${state.selection.active.c}-${state.selection.active.r}`)?.focus();
                }
            });
            elFormulaInput.addEventListener('input', () => {
                if(isEditing && elCellEditor) elCellEditor.value = elFormulaInput.value;
            });

            // Toolbar Events
            document.getElementById('btn-bold').addEventListener('click', () => {
                applyToSelection(addr => {
                    const format = getCellData(state.activeSheetId, addr).format;
                    format.bold = !format.bold;
                    setCellData(state.activeSheetId, addr, { format });
                    updateCellDOM(addr);
                });
                updateUIState();
            });
            document.getElementById('btn-italic').addEventListener('click', () => {
                applyToSelection(addr => {
                    const format = getCellData(state.activeSheetId, addr).format;
                    format.italic = !format.italic;
                    setCellData(state.activeSheetId, addr, { format });
                    updateCellDOM(addr);
                });
                updateUIState();
            });
            document.getElementById('btn-color').addEventListener('input', (e) => {
                const color = e.target.value;
                applyToSelection(addr => {
                    const format = getCellData(state.activeSheetId, addr).format;
                    format.bg = color;
                    setCellData(state.activeSheetId, addr, { format });
                    updateCellDOM(addr);
                });
                updateUIState();
            });
            document.getElementById('btn-clear').addEventListener('click', () => {
                applyToSelection(addr => {
                    setCellData(state.activeSheetId, addr, { v: '', c: '', format: {} });
                    evaluateCell(state.activeSheetId, addr);
                    updateCellDOM(addr);
                });
                updateUIState();
            });

            // Sheet Management
            document.getElementById('btn-add-sheet').addEventListener('click', () => {
                addSheet(`Sheet${state.sheets.length + 1}`);
            });

            // Export / Import CSV
            document.getElementById('btn-export').addEventListener('click', exportCSV);
            document.getElementById('import-csv').addEventListener('change', importCSV);
        }

        function applyToSelection(callback) {
            const s = state.selection.start;
            const e = state.selection.end;
            const cMin = Math.min(s.c, e.c), cMax = Math.max(s.c, e.c);
            const rMin = Math.min(s.r, e.r), rMax = Math.max(s.r, e.r);
            for(let r=rMin; r<=rMax; r++) {
                for(let c=cMin; c<=cMax; c++) {
                    callback(getAddr(c, r));
                }
            }
        }

        // Minimal sheet context menu for rename/delete
        window.sheetContextMenu = function(e, sheetId) {
            e.preventDefault();
            if (state.sheets.length <= 1) return alert("Cannot delete the only sheet.");
            const action = prompt(`Sheet: ${state.sheets.find(s=>s.id===sheetId).name}\n\nType 'rename' to rename, or 'delete' to remove:`);
            if (action === 'delete') {
                state.sheets = state.sheets.filter(s => s.id !== sheetId);
                if (state.activeSheetId === sheetId) switchSheet(state.sheets[0].id);
                else renderTabs();
            } else if (action === 'rename') {
                const newName = prompt("New name:");
                if (newName) {
                    state.sheets.find(s=>s.id===sheetId).name = newName;
                    renderTabs();
                }
            }
        };

        // --- CSV Export / Import ---
        function exportCSV() {
            let maxC = 0, maxR = 0;
            const sheetData = getActiveSheet().data;
            for(let addr in sheetData) {
                if(sheetData[addr].c !== '') {
                    const pos = parseAddr(addr);
                    if(pos.c > maxC) maxC = pos.c;
                    if(pos.r > maxR) maxR = pos.r;
                }
            }

            let csv = '';
            for(let r=0; r<=maxR; r++) {
                let row = [];
                for(let c=0; c<=maxC; c++) {
                    let val = String(getCellData(state.activeSheetId, getAddr(c, r)).c);
                    if(val.includes(',') || val.includes('"') || val.includes('\n')) {
                        val = `"${val.replace(/"/g, '""')}"`;
                    }
                    row.push(val);
                }
                csv += row.join(',') + '\n';
            }

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${getActiveSheet().name}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importCSV(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const rows = text.split(/\r?\n/);
                
                // Clear active sheet data
                getActiveSheet().data = {};
                
                rows.forEach((row, r) => {
                    if(!row) return;
                    // simple csv split ignoring quotes for basic use case
                    const cols = row.split(','); 
                    cols.forEach((val, c) => {
                        if(c < COLS && r < ROWS) {
                            val = val.replace(/^"|"$/g, ''); // remove wrap quotes
                            setCellData(state.activeSheetId, getAddr(c, r), { v: val });
                        }
                    });
                });
                
                // Evaluate all
                for(let r=0; r<ROWS; r++) {
                    for(let c=0; c<COLS; c++) {
                        evaluateCell(state.activeSheetId, getAddr(c, r));
                    }
                }
                renderActiveSheet();
            };
            reader.readAsText(file);
            e.target.value = ''; // reset
        }

        // Boot
        window.onload = init;
    </script>
</body>
</html>
