<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SheetCraft — Standalone Spreadsheet</title>
  <style>
    :root {
      --green: #217346;
      --green-dark: #185c37;
      --green-soft: #e7f4ec;
      --blue: #2563eb;
      --ink: #1f2937;
      --muted: #667085;
      --line: #d6dbe3;
      --line-dark: #b8c0cc;
      --panel: #ffffff;
      --canvas: #f3f5f7;
      --header: #f8fafc;
      --selected: rgba(33, 115, 70, 0.12);
      --shadow: 0 12px 34px rgba(15, 23, 42, 0.10);
      --row-header-width: 52px;
      --row-height: 28px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--canvas);
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 320px;
    }

    .titlebar {
      height: 54px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), #15915a);
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      font-weight: 750;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255,255,255,.18);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.24);
      font-weight: 900;
    }

    .workbook-name {
      min-width: 0;
      max-width: 360px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: rgba(255,255,255,.88);
      font-size: 13px;
    }

    .save-state {
      margin-left: auto;
      color: rgba(255,255,255,.78);
      font-size: 12px;
      white-space: nowrap;
    }

    .toolbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: thin;
      z-index: 8;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 10px;
      margin-right: 2px;
      border-right: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .tool-group:last-child {
      border-right: 0;
      padding-right: 0;
    }

    .tool-btn {
      height: 32px;
      min-width: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 9px;
      border-radius: 7px;
      color: #344054;
      background: transparent;
      transition: background .15s, color .15s, transform .1s;
      user-select: none;
      white-space: nowrap;
    }

    .tool-btn:hover { background: #eef2f6; }
    .tool-btn:active { transform: translateY(1px); }
    .tool-btn.active { color: var(--green); background: var(--green-soft); }
    .tool-btn.primary { color: #fff; background: var(--green); }
    .tool-btn.primary:hover { background: var(--green-dark); }
    .tool-btn.danger:hover { color: #b42318; background: #fff1f0; }
    .tool-btn svg { width: 16px; height: 16px; flex: 0 0 auto; }

    .color-control {
      position: relative;
      width: 38px;
      height: 32px;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: linear-gradient(#fff 0 60%, #fde68a 60%);
      cursor: pointer;
    }

    .color-control input {
      position: absolute;
      inset: -8px;
      width: 60px;
      height: 55px;
      opacity: 0;
      cursor: pointer;
    }

    .formula-strip {
      height: 42px;
      display: grid;
      grid-template-columns: minmax(72px, 116px) 34px 1fr;
      align-items: stretch;
      background: var(--panel);
      border-bottom: 1px solid var(--line-dark);
      z-index: 7;
    }

    .name-box {
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-right: 1px solid var(--line);
      color: #344054;
      font-size: 13px;
      font-weight: 650;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      background: #fbfcfd;
    }

    .fx {
      display: grid;
      place-items: center;
      color: #667085;
      border-right: 1px solid var(--line);
      font-family: Georgia, serif;
      font-style: italic;
      font-weight: 700;
      background: #fbfcfd;
    }

    #formulaBar {
      width: 100%;
      border: 0;
      outline: none;
      padding: 0 12px;
      color: #111827;
      background: #fff;
      font-size: 13px;
    }

    #formulaBar:focus {
      box-shadow: inset 0 0 0 2px rgba(33,115,70,.28);
    }

    .grid-shell {
      position: relative;
      flex: 1;
      min-height: 0;
      background: #fff;
    }

    .grid-scroll {
      width: 100%;
      height: 100%;
      overflow: auto;
      outline: none;
      scrollbar-color: #aab3bf #edf0f3;
      scrollbar-width: thin;
    }

    .grid-scroll::-webkit-scrollbar { width: 12px; height: 12px; }
    .grid-scroll::-webkit-scrollbar-track { background: #edf0f3; }
    .grid-scroll::-webkit-scrollbar-thumb { background: #aab3bf; border: 3px solid #edf0f3; border-radius: 9px; }

    table.sheet-grid {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      min-width: 100%;
      user-select: none;
    }

    .sheet-grid col.row-header-col { width: var(--row-header-width) !important; }

    .sheet-grid th,
    .sheet-grid td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .sheet-grid thead th {
      position: sticky;
      top: 0;
      height: 30px;
      z-index: 5;
      color: #475467;
      background: var(--header);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      overflow: hidden;
    }

    .sheet-grid thead th.corner {
      left: 0;
      z-index: 8;
      width: var(--row-header-width);
      min-width: var(--row-header-width);
      background:
        linear-gradient(135deg, transparent 0 48%, #c4ccd7 49% 51%, transparent 52%),
        var(--header);
      cursor: pointer;
    }

    .sheet-grid thead th.col-header {
      position: relative;
      cursor: pointer;
    }

    .sheet-grid thead th.col-header.active,
    .sheet-grid tbody th.row-header.active {
      color: #fff;
      background: var(--green);
    }

    .col-resizer {
      position: absolute;
      top: 0;
      right: -4px;
      width: 8px;
      height: 100%;
      cursor: col-resize;
      z-index: 9;
    }

    .col-resizer:hover::after,
    body.resizing .col-resizer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 3px;
      width: 2px;
      background: var(--green);
    }

    .sheet-grid tbody th.row-header {
      position: sticky;
      left: 0;
      z-index: 4;
      width: var(--row-header-width);
      min-width: var(--row-header-width);
      height: var(--row-height);
      color: #475467;
      background: var(--header);
      font-size: 12px;
      font-weight: 650;
      text-align: center;
      cursor: pointer;
    }

    .sheet-grid td.cell {
      position: relative;
      height: var(--row-height);
      padding: 0 6px;
      overflow: hidden;
      color: #111827;
      background: #fff;
      font-size: 13px;
      line-height: var(--row-height);
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: cell;
    }

    .sheet-grid td.cell.selected {
      background-image: linear-gradient(var(--selected), var(--selected));
      box-shadow: inset 0 0 0 1px rgba(33,115,70,.42);
    }

    .sheet-grid td.cell.active {
      box-shadow: inset 0 0 0 2px var(--green);
      z-index: 2;
    }

    .sheet-grid td.cell.ref-source {
      background-image: linear-gradient(rgba(37,99,235,.12), rgba(37,99,235,.12));
      box-shadow: inset 0 0 0 1px rgba(37,99,235,.55);
    }

    .sheet-grid td.cell.editing {
      padding: 0;
      overflow: visible;
      z-index: 10;
    }

    .cell-editor {
      position: absolute;
      inset: -1px;
      width: calc(100% + 2px);
      height: calc(100% + 2px);
      min-width: 80px;
      border: 2px solid var(--green);
      outline: none;
      padding: 0 5px;
      color: #111827;
      background: #fff;
      font-size: 13px;
      z-index: 12;
      box-shadow: 0 4px 14px rgba(15,23,42,.14);
    }

    .statusbar {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 14px;
      color: #667085;
      background: #fbfcfd;
      border-top: 1px solid var(--line);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
    }

    .statusbar strong { color: #344054; font-weight: 650; }

    .sheet-strip {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #f8fafc;
      border-top: 1px solid var(--line-dark);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .sheet-tab {
      height: 31px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 180px;
      padding: 0 8px 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px 8px 0 0;
      color: #475467;
      background: #fff;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    .sheet-tab.active {
      position: relative;
      color: var(--green-dark);
      border-color: var(--green);
      background: #fff;
      font-weight: 700;
      box-shadow: inset 0 3px 0 var(--green);
    }

    .sheet-tab .tab-name {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tab-close {
      width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #98a2b3;
      background: transparent;
      font-size: 15px;
      line-height: 1;
    }

    .tab-close:hover { color: #b42318; background: #fee4e2; }

    .sheet-action {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #475467;
      background: #fff;
      font-size: 18px;
    }

    .sheet-action:hover { color: var(--green); border-color: var(--green); background: var(--green-soft); }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 58px;
      z-index: 100;
      max-width: min(420px, calc(100vw - 36px));
      padding: 11px 14px;
      border-radius: 10px;
      color: #fff;
      background: rgba(17, 24, 39, .94);
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .2s, transform .2s;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    .hidden { display: none !important; }

    @media (max-width: 720px) {
      .titlebar { height: 48px; padding: 0 12px; }
      .workbook-name, .save-state { display: none; }
      .toolbar { padding: 6px 8px; }
      .tool-btn { min-width: 30px; padding: 0 7px; }
      .tool-btn .label { display: none; }
      .formula-strip { grid-template-columns: 76px 30px 1fr; }
      :root { --row-header-width: 42px; --row-height: 27px; }
      .statusbar { gap: 10px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand" aria-label="SheetCraft">
        <div class="brand-mark">S</div>
        <span>SheetCraft</span>
      </div>
      <div class="workbook-name" id="workbookName">Standalone Excel-style workbook</div>
      <div class="save-state" id="saveState">Ready</div>
    </header>

    <div class="toolbar" role="toolbar" aria-label="Spreadsheet toolbar">
      <div class="tool-group">
        <button class="tool-btn" id="boldBtn" title="Bold (Ctrl+B)" aria-label="Bold">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 4h6a3.5 3.5 0 0 1 0 7H7zM7 11h7a3.5 3.5 0 0 1 0 7H7z"/></svg>
        </button>
        <button class="tool-btn" id="italicBtn" title="Italic (Ctrl+I)" aria-label="Italic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M10 4h8M6 20h8M14 4l-4 16"/></svg>
        </button>
        <label class="color-control" title="Cell background color" aria-label="Cell background color">
          <input type="color" id="bgColor" value="#fff59d" />
        </label>
        <button class="tool-btn danger" id="clearBtn" title="Clear contents (Delete)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg>
          <span class="label">Clear</span>
        </button>
      </div>

      <div class="tool-group">
        <button class="tool-btn" id="downloadCsv" title="Download active sheet as CSV">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
          <span class="label">Download CSV</span>
        </button>
        <button class="tool-btn" id="uploadCsv" title="Upload CSV into active sheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>
          <span class="label">Upload CSV</span>
        </button>
        <input type="file" id="csvFile" class="hidden" accept=".csv,text/csv" />
      </div>

      <div class="tool-group">
        <button class="tool-btn" id="addSheetBtn" title="Add sheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span class="label">Sheet</span>
        </button>
        <button class="tool-btn" id="renameSheetBtn" title="Rename active sheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4l11-11-4-4L4 16v4zM13 7l4 4"/></svg>
          <span class="label">Rename</span>
        </button>
        <button class="tool-btn danger" id="deleteSheetBtn" title="Delete active sheet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M10 7V4h4v3M8 7l1 13h6l1-13"/></svg>
          <span class="label">Delete</span>
        </button>
      </div>
    </div>

    <div class="formula-strip">
      <div class="name-box" id="nameBox" title="Selected cell or range">A1</div>
      <div class="fx">fx</div>
      <input id="formulaBar" autocomplete="off" spellcheck="false" aria-label="Formula bar" />
    </div>

    <main class="grid-shell">
      <div class="grid-scroll" id="gridScroll" tabindex="0" aria-label="Spreadsheet grid">
        <table class="sheet-grid" id="sheetGrid" aria-label="Editable spreadsheet"></table>
      </div>
    </main>

    <div class="statusbar">
      <span id="selectionInfo">Cell A1</span>
      <span id="selectionStats">Ready</span>
      <span style="margin-left:auto">Formulas: =A1+B2, =SUM(A1:A10), =AVERAGE(A1:A10), =MIN(A1:A10), =MAX(A1:A10)</span>
    </div>

    <div class="sheet-strip" id="sheetStrip" aria-label="Workbook sheets"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      'use strict';

      const ROWS = 100;
      const COLS = 26;
      const DEFAULT_COL_WIDTH = 108;
      const STORAGE_KEY = 'sheetcraft-workbook-v1';

      const gridScroll = document.getElementById('gridScroll');
      const sheetGrid = document.getElementById('sheetGrid');
      const formulaBar = document.getElementById('formulaBar');
      const nameBox = document.getElementById('nameBox');
      const selectionInfo = document.getElementById('selectionInfo');
      const selectionStats = document.getElementById('selectionStats');
      const sheetStrip = document.getElementById('sheetStrip');
      const saveState = document.getElementById('saveState');
      const toast = document.getElementById('toast');
      const csvFile = document.getElementById('csvFile');

      const boldBtn = document.getElementById('boldBtn');
      const italicBtn = document.getElementById('italicBtn');
      const bgColor = document.getElementById('bgColor');
      const clearBtn = document.getElementById('clearBtn');
      const downloadCsvBtn = document.getElementById('downloadCsv');
      const uploadCsvBtn = document.getElementById('uploadCsv');
      const addSheetBtn = document.getElementById('addSheetBtn');
      const renameSheetBtn = document.getElementById('renameSheetBtn');
      const deleteSheetBtn = document.getElementById('deleteSheetBtn');

      let workbook = null;
      let activeSheetIndex = 0;
      let cellElements = [];
      let rowHeaderElements = [];
      let colHeaderElements = [];
      let colElements = [];
      let editing = null;
      let selectionDrag = null;
      let refSelection = null;
      let resizeState = null;
      let saveTimer = null;
      let toastTimer = null;
      let formulaCommitting = false;
      let suppressFormulaBlur = false;

      class FormulaError extends Error {
        constructor(code) {
          super(code);
          this.code = code;
        }
      }

      function makeSheet(name) {
        return {
          id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
          name,
          cells: new Map(),
          values: new Map(),
          active: { r: 0, c: 0 },
          selection: { r1: 0, c1: 0, r2: 0, c2: 0 },
          colWidths: Array(COLS).fill(DEFAULT_COL_WIDTH)
        };
      }

      function newWorkbook() {
        return { sheets: [makeSheet('Sheet1')] };
      }

      function sheet() {
        return workbook.sheets[activeSheetIndex];
      }

      function key(r, c) {
        return r + ',' + c;
      }

      function parseKey(k) {
        const [r, c] = k.split(',').map(Number);
        return { r, c };
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function colName(index) {
        let n = index + 1;
        let name = '';
        while (n > 0) {
          const rem = (n - 1) % 26;
          name = String.fromCharCode(65 + rem) + name;
          n = Math.floor((n - 1) / 26);
        }
        return name;
      }

      function parseColName(name) {
        let value = 0;
        for (const ch of name.toUpperCase()) {
          if (ch < 'A' || ch > 'Z') return -1;
          value = value * 26 + (ch.charCodeAt(0) - 64);
        }
        return value - 1;
      }

      function address(r, c) {
        return colName(c) + (r + 1);
      }

      function normalizeRange(range) {
        return {
          r1: Math.min(range.r1, range.r2),
          c1: Math.min(range.c1, range.c2),
          r2: Math.max(range.r1, range.r2),
          c2: Math.max(range.c1, range.c2)
        };
      }

      function rangeAddress(range) {
        const n = normalizeRange(range);
        return n.r1 === n.r2 && n.c1 === n.c2
          ? address(n.r1, n.c1)
          : address(n.r1, n.c1) + ':' + address(n.r2, n.c2);
      }

      function sameRange(a, b) {
        return a && b && a.r1 === b.r1 && a.c1 === b.c1 && a.r2 === b.r2 && a.c2 === b.c2;
      }

      function getCell(sh, r, c) {
        return sh.cells.get(key(r, c));
      }

      function ensureCell(sh, r, c) {
        const k = key(r, c);
        let cell = sh.cells.get(k);
        if (!cell) {
          cell = { raw: '', style: {} };
          sh.cells.set(k, cell);
        }
        return cell;
      }

      function setRaw(sh, r, c, raw) {
        const cell = ensureCell(sh, r, c);
        cell.raw = raw;
        if (!raw && !Object.keys(cell.style || {}).length) sh.cells.delete(key(r, c));
      }

      function isFormula(raw) {
        return typeof raw === 'string' && raw.startsWith('=');
      }

      function coerceNumber(value) {
        if (value == null || value === '') return 0;
        if (typeof value === 'number') return value;
        if (typeof value === 'boolean') return value ? 1 : 0;
        const n = Number(String(value).trim());
        if (Number.isFinite(n)) return n;
        throw new FormulaError('#VALUE!');
      }

      function flattenArgs(args) {
        const values = [];
        for (const arg of args) {
          if (arg && arg.__range) values.push(...arg.values);
          else values.push(arg);
        }
        return values;
      }

      function numericArgs(args) {
        return flattenArgs(args)
          .filter(v => v !== '' && v != null)
          .map(coerceNumber);
      }

      class FormulaParser {
        constructor(source, evaluator) {
          this.source = source;
          this.evaluator = evaluator;
          this.tokens = this.tokenize(source);
          this.pos = 0;
        }

        tokenize(src) {
          const tokens = [];
          let i = 0;
          while (i < src.length) {
            const ch = src[i];
            if (/\s/.test(ch)) { i++; continue; }
            if (/[0-9.]/.test(ch)) {
              let j = i;
              let dots = 0;
              while (j < src.length && /[0-9.]/.test(src[j])) {
                if (src[j] === '.') dots++;
                j++;
              }
              const text = src.slice(i, j);
              if (dots > 1 || text === '.') throw new FormulaError('#VALUE!');
              tokens.push({ type: 'number', value: Number(text) });
              i = j;
              continue;
            }
            if (/[A-Za-z_$]/.test(ch)) {
              let j = i;
              while (j < src.length && /[A-Za-z0-9_$]/.test(src[j])) j++;
              const word = src.slice(i, j);
              let k = j;
              while (k < src.length && /\s/.test(src[k])) k++;
              if (src[k] === '(') {
                tokens.push({ type: 'function', value: word.toUpperCase() });
              } else {
                const match = word.match(/^\$?([A-Za-z]+)\$?([0-9]+)$/);
                if (!match) throw new FormulaError('#NAME?');
                tokens.push({ type: 'reference', value: word.toUpperCase().replace(/\$/g, '') });
              }
              i = j;
              continue;
            }
            if ('+-*/^(),:'.includes(ch)) {
              tokens.push({ type: ch, value: ch });
              i++;
              continue;
            }
            throw new FormulaError('#VALUE!');
          }
          tokens.push({ type: 'eof' });
          return tokens;
        }

        peek() { return this.tokens[this.pos]; }
        take() { return this.tokens[this.pos++]; }
        match(type) {
          if (this.peek().type === type) { this.pos++; return true; }
          return false;
        }
        expect(type) {
          if (!this.match(type)) throw new FormulaError('#VALUE!');
        }

        parse() {
          const value = this.parseExpression();
          if (this.peek().type !== 'eof') throw new FormulaError('#VALUE!');
          return value;
        }

        parseExpression() {
          let left = this.parseTerm();
          while (this.peek().type === '+' || this.peek().type === '-') {
            const op = this.take().type;
            const right = this.parseTerm();
            left = op === '+' ? coerceNumber(left) + coerceNumber(right) : coerceNumber(left) - coerceNumber(right);
          }
          return left;
        }

        parseTerm() {
          let left = this.parseFactor();
          while (this.peek().type === '*' || this.peek().type === '/') {
            const op = this.take().type;
            const right = this.parseFactor();
            if (op === '*') left = coerceNumber(left) * coerceNumber(right);
            else {
              const divisor = coerceNumber(right);
              if (divisor === 0) throw new FormulaError('#DIV/0!');
              left = coerceNumber(left) / divisor;
            }
          }
          return left;
        }

        parseFactor() {
          let left = this.parseUnary();
          if (this.match('^')) {
            const right = this.parseFactor();
            left = Math.pow(coerceNumber(left), coerceNumber(right));
          }
          return left;
        }

        parseUnary() {
          if (this.match('+')) return coerceNumber(this.parseUnary());
          if (this.match('-')) return -coerceNumber(this.parseUnary());
          return this.parsePrimary();
        }

        parsePrimary() {
          const token = this.take();
          if (token.type === 'number') return token.value;
          if (token.type === '(') {
            const value = this.parseExpression();
            this.expect(')');
            return value;
          }
          if (token.type === 'reference') {
            const first = this.referenceToCoord(token.value);
            if (this.match(':')) {
              const endToken = this.take();
              if (endToken.type !== 'reference') throw new FormulaError('#REF!');
              const second = this.referenceToCoord(endToken.value);
              return { __range: true, values: this.evaluator.rangeValues(first, second) };
            }
            return this.evaluator.cellValue(first.r, first.c);
          }
          if (token.type === 'function') return this.parseFunction(token.value);
          throw new FormulaError('#VALUE!');
        }

        referenceToCoord(ref) {
          const match = ref.match(/^([A-Z]+)([0-9]+)$/);
          if (!match) throw new FormulaError('#REF!');
          const c = parseColName(match[1]);
          const r = Number(match[2]) - 1;
          if (r < 0 || r >= ROWS || c < 0 || c >= COLS) throw new FormulaError('#REF!');
          return { r, c };
        }

        parseFunction(name) {
          this.expect('(');
          const args = [];
          if (!this.match(')')) {
            do { args.push(this.parseExpression()); } while (this.match(','));
            this.expect(')');
          }
          switch (name) {
            case 'SUM': return numericArgs(args).reduce((a, b) => a + b, 0);
            case 'AVERAGE': {
              const nums = numericArgs(args);
              if (!nums.length) throw new FormulaError('#DIV/0!');
              return nums.reduce((a, b) => a + b, 0) / nums.length;
            }
            case 'MIN': {
              const nums = numericArgs(args);
              if (!nums.length) throw new FormulaError('#VALUE!');
              return Math.min(...nums);
            }
            case 'MAX': {
              const nums = numericArgs(args);
              if (!nums.length) throw new FormulaError('#VALUE!');
              return Math.max(...nums);
            }
            default: throw new FormulaError('#NAME?');
          }
        }
      }

      function recalculate(sh) {
        const values = new Map();
        const visiting = new Set();

        function evaluateCell(r, c) {
          const k = key(r, c);
          if (values.has(k)) return values.get(k);
          if (visiting.has(k)) throw new FormulaError('#CYCLE!');
          const cell = getCell(sh, r, c);
          const raw = cell ? cell.raw : '';
          if (!isFormula(raw)) {
            const value = raw === '' ? '' : (raw !== '' && !isNaN(Number(raw)) && raw.trim() !== '' ? Number(raw) : raw);
            values.set(k, value);
            return value;
          }
          visiting.add(k);
          try {
            const parser = new FormulaParser(raw.slice(1), { cellValue: evaluateCell, rangeValues });
            const value = parser.parse();
            values.set(k, value);
            return value;
          } catch (error) {
            const code = error instanceof FormulaError ? error.code : '#VALUE!';
            values.set(k, code);
            return code;
          } finally {
            visiting.delete(k);
          }
        }

        function rangeValues(a, b) {
          const r1 = Math.min(a.r, b.r), r2 = Math.max(a.r, b.r);
          const c1 = Math.min(a.c, b.c), c2 = Math.max(a.c, b.c);
          const out = [];
          for (let r = r1; r <= r2; r++) {
            for (let c = c1; c <= c2; c++) out.push(evaluateCell(r, c));
          }
          return out;
        }

        for (const k of sh.cells.keys()) {
          const { r, c } = parseKey(k);
          evaluateCell(r, c);
        }
        sh.values = values;
      }

      function displayValue(value) {
        if (value == null) return '';
        if (typeof value === 'number') {
          if (!Number.isFinite(value)) return '#NUM!';
          const rounded = Math.round(value * 1e10) / 1e10;
          return String(rounded);
        }
        return String(value);
      }

      function buildGrid() {
        const colgroup = document.createElement('colgroup');
        const rowCol = document.createElement('col');
        rowCol.className = 'row-header-col';
        colgroup.appendChild(rowCol);
        colElements = [];
        for (let c = 0; c < COLS; c++) {
          const col = document.createElement('col');
          col.style.width = DEFAULT_COL_WIDTH + 'px';
          colgroup.appendChild(col);
          colElements.push(col);
        }
        sheetGrid.appendChild(colgroup);

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        const corner = document.createElement('th');
        corner.className = 'corner';
        corner.title = 'Select all';
        corner.addEventListener('mousedown', e => {
          e.preventDefault();
          selectAll();
        });
        headRow.appendChild(corner);
        colHeaderElements = [];
        for (let c = 0; c < COLS; c++) {
          const th = document.createElement('th');
          th.className = 'col-header';
          th.dataset.c = c;
          th.innerHTML = '<span>' + colName(c) + '</span><div class="col-resizer" aria-hidden="true"></div>';
          th.addEventListener('mousedown', e => {
            if (e.target.classList.contains('col-resizer')) return;
            e.preventDefault();
            selectColumn(c, e.shiftKey);
          });
          th.querySelector('.col-resizer').addEventListener('mousedown', e => startColumnResize(e, c));
          headRow.appendChild(th);
          colHeaderElements.push(th);
        }
        thead.appendChild(headRow);
        sheetGrid.appendChild(thead);

        const tbody = document.createElement('tbody');
        cellElements = [];
        rowHeaderElements = [];
        for (let r = 0; r < ROWS; r++) {
          const tr = document.createElement('tr');
          const th = document.createElement('th');
          th.className = 'row-header';
          th.textContent = r + 1;
          th.dataset.r = r;
          th.addEventListener('mousedown', e => {
            e.preventDefault();
            selectRow(r, e.shiftKey);
          });
          tr.appendChild(th);
          rowHeaderElements.push(th);
          const rowCells = [];
          for (let c = 0; c < COLS; c++) {
            const td = document.createElement('td');
            td.className = 'cell';
            td.dataset.r = r;
            td.dataset.c = c;
            td.addEventListener('mousedown', onCellMouseDown);
            td.addEventListener('dblclick', onCellDoubleClick);
            tr.appendChild(td);
            rowCells.push(td);
          }
          tbody.appendChild(tr);
          cellElements.push(rowCells);
        }
        sheetGrid.appendChild(tbody);
      }

      function renderAll() {
        const sh = sheet();
        recalculate(sh);
        const selected = normalizeRange(sh.selection);
        const refRange = refSelection ? normalizeRange(refSelection.range) : null;

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const td = cellElements[r][c];
            const cell = getCell(sh, r, c);
            const raw = cell ? cell.raw : '';
            const value = sh.values.get(key(r, c));
            if (!editing || editing.r !== r || editing.c !== c) td.textContent = displayValue(value);
            const style = cell && cell.style ? cell.style : {};
            td.style.fontWeight = style.bold ? '700' : '';
            td.style.fontStyle = style.italic ? 'italic' : '';
            td.style.backgroundColor = style.bg || '';
            td.classList.toggle('selected', r >= selected.r1 && r <= selected.r2 && c >= selected.c1 && c <= selected.c2);
            td.classList.toggle('active', r === sh.active.r && c === sh.active.c);
            td.classList.toggle('ref-source', !!refRange && r >= refRange.r1 && r <= refRange.r2 && c >= refRange.c1 && c <= refRange.c2);
          }
          rowHeaderElements[r].classList.toggle('active', r >= selected.r1 && r <= selected.r2);
        }
        for (let c = 0; c < COLS; c++) {
          colHeaderElements[c].classList.toggle('active', c >= selected.c1 && c <= selected.c2);
          colElements[c].style.width = (sh.colWidths[c] || DEFAULT_COL_WIDTH) + 'px';
        }
        updateFormulaBar();
        updateStatus();
        renderSheetTabs();
        updateToolbarState();
      }

      function updateFormulaBar() {
        if (document.activeElement === formulaBar) return;
        const sh = sheet();
        const cell = getCell(sh, sh.active.r, sh.active.c);
        formulaBar.value = cell ? cell.raw : '';
        nameBox.textContent = rangeAddress(sh.selection);
      }

      function updateStatus() {
        const sh = sheet();
        const range = normalizeRange(sh.selection);
        const label = rangeAddress(range);
        nameBox.textContent = label;
        selectionInfo.textContent = (range.r1 === range.r2 && range.c1 === range.c2 ? 'Cell ' : 'Range ') + label;
        const values = [];
        for (let r = range.r1; r <= range.r2; r++) {
          for (let c = range.c1; c <= range.c2; c++) {
            const v = sh.values.get(key(r, c));
            if (typeof v === 'number' && Number.isFinite(v)) values.push(v);
          }
        }
        if (values.length) {
          const sum = values.reduce((a, b) => a + b, 0);
          selectionStats.textContent = 'Average: ' + displayValue(sum / values.length) + ' · Count: ' + values.length + ' · Sum: ' + displayValue(sum);
        } else {
          selectionStats.textContent = 'Ready';
        }
      }

      function updateToolbarState() {
        const sh = sheet();
        const cell = getCell(sh, sh.active.r, sh.active.c);
        boldBtn.classList.toggle('active', !!(cell && cell.style && cell.style.bold));
        italicBtn.classList.toggle('active', !!(cell && cell.style && cell.style.italic));
      }

      function renderSheetTabs() {
        sheetStrip.innerHTML = '';
        workbook.sheets.forEach((sh, index) => {
          const tab = document.createElement('div');
          tab.className = 'sheet-tab' + (index === activeSheetIndex ? ' active' : '');
          tab.title = sh.name + ' — double-click to rename';
          const name = document.createElement('span');
          name.className = 'tab-name';
          name.textContent = sh.name;
          tab.appendChild(name);
          tab.addEventListener('click', () => activateSheet(index));
          tab.addEventListener('dblclick', e => {
            e.stopPropagation();
            renameSheet(index);
          });
          if (workbook.sheets.length > 1) {
            const close = document.createElement('button');
            close.className = 'tab-close';
            close.title = 'Delete sheet';
            close.textContent = '×';
            close.addEventListener('click', e => {
              e.stopPropagation();
              deleteSheet(index);
            });
            tab.appendChild(close);
          }
          sheetStrip.appendChild(tab);
        });
        const add = document.createElement('button');
        add.className = 'sheet-action';
        add.title = 'Add sheet';
        add.textContent = '+';
        add.addEventListener('click', addSheet);
        sheetStrip.appendChild(add);
      }

      function activateSheet(index) {
        if (index === activeSheetIndex) return;
        commitEditing();
        commitFormulaBar();
        activeSheetIndex = clamp(index, 0, workbook.sheets.length - 1);
        renderAll();
        persistSoon();
        gridScroll.focus();
      }

      function addSheet() {
        commitEditing();
        commitFormulaBar();
        let n = workbook.sheets.length + 1;
        const existing = new Set(workbook.sheets.map(s => s.name));
        while (existing.has('Sheet' + n)) n++;
        workbook.sheets.push(makeSheet('Sheet' + n));
        activeSheetIndex = workbook.sheets.length - 1;
        renderAll();
        persistSoon();
        showToast('Added ' + sheet().name);
      }

      function renameSheet(index = activeSheetIndex) {
        const sh = workbook.sheets[index];
        const next = prompt('Rename sheet:', sh.name);
        if (next == null) return;
        const trimmed = next.trim();
        if (!trimmed) return showToast('Sheet name cannot be empty.');
        if (workbook.sheets.some((s, i) => i !== index && s.name.toLowerCase() === trimmed.toLowerCase())) {
          return showToast('A sheet with that name already exists.');
        }
        sh.name = trimmed.slice(0, 40);
        renderAll();
        persistSoon();
      }

      function deleteSheet(index = activeSheetIndex) {
        if (workbook.sheets.length <= 1) return showToast('A workbook must contain at least one sheet.');
        const sh = workbook.sheets[index];
        if (!confirm('Delete "' + sh.name + '"? This cannot be undone.')) return;
        workbook.sheets.splice(index, 1);
        activeSheetIndex = clamp(activeSheetIndex >= index ? activeSheetIndex - 1 : activeSheetIndex, 0, workbook.sheets.length - 1);
        renderAll();
        persistSoon();
        showToast('Deleted ' + sh.name);
      }

      function setSelection(r1, c1, r2, c2, activeR = r2, activeC = c2) {
        const sh = sheet();
        sh.selection = normalizeRange({ r1, c1, r2, c2 });
        sh.active = { r: clamp(activeR, 0, ROWS - 1), c: clamp(activeC, 0, COLS - 1) };
        renderAll();
      }

      function selectCell(r, c, extend = false) {
        const sh = sheet();
        if (extend) setSelection(sh.selection.r1, sh.selection.c1, r, c, r, c);
        else setSelection(r, c, r, c, r, c);
      }

      function selectRow(r, extend = false) {
        const sh = sheet();
        if (extend) setSelection(sh.selection.r1, 0, r, COLS - 1, r, sh.active.c);
        else setSelection(r, 0, r, COLS - 1, r, 0);
      }

      function selectColumn(c, extend = false) {
        const sh = sheet();
        if (extend) setSelection(0, sh.selection.c1, ROWS - 1, c, sh.active.r, c);
        else setSelection(0, c, ROWS - 1, c, 0, c);
      }

      function selectAll() {
        setSelection(0, 0, ROWS - 1, COLS - 1, 0, 0);
      }

      function onCellMouseDown(e) {
        if (e.button !== 0) return;
        const r = Number(e.currentTarget.dataset.r);
        const c = Number(e.currentTarget.dataset.c);
        const formulaInput = getFormulaInput();
        if (formulaInput) {
          e.preventDefault();
          beginReferenceSelection(formulaInput, r, c);
          return;
        }
        e.preventDefault();
        if (editing) commitEditing();
        if (document.activeElement === formulaBar) commitFormulaBar();
        gridScroll.focus();
        const sh = sheet();
        if (e.shiftKey) {
          setSelection(sh.selection.r1, sh.selection.c1, r, c, r, c);
        } else {
          setSelection(r, c, r, c, r, c);
        }
        selectionDrag = { r, c };
      }

      function onCellDoubleClick(e) {
        const r = Number(e.currentTarget.dataset.r);
        const c = Number(e.currentTarget.dataset.c);
        startEdit(r, c, null, true);
      }

      function getFormulaInput() {
        if (document.activeElement === formulaBar && formulaBar.value.trim().startsWith('=')) return formulaBar;
        if (editing && document.activeElement === editing.input && editing.input.value.trim().startsWith('=')) return editing.input;
        return null;
      }

      function beginReferenceSelection(input, r, c) {
        const start = input.selectionStart ?? input.value.length;
        const end = input.selectionEnd ?? start;
        refSelection = {
          input,
          base: input.value,
          insertStart: start,
          insertEnd: end,
          anchor: { r, c },
          range: { r1: r, c1: c, r2: r, c2: c }
        };
        updateReferenceSelection(r, c);
      }

      function updateReferenceSelection(r, c) {
        if (!refSelection) return;
        refSelection.range = { r1: refSelection.anchor.r, c1: refSelection.anchor.c, r2: r, c2: c };
        const ref = rangeAddress(refSelection.range);
        const input = refSelection.input;
        input.value = refSelection.base.slice(0, refSelection.insertStart) + ref + refSelection.base.slice(refSelection.insertEnd);
        refSelection.insertEnd = refSelection.insertStart + ref.length;
        const cursor = refSelection.insertEnd;
        input.setSelectionRange(cursor, cursor);
        renderAll();
      }

      function finishReferenceSelection() {
        if (!refSelection) return;
        const input = refSelection.input;
        const cursor = refSelection.insertEnd;
        refSelection = null;
        renderAll();
        input.focus();
        input.setSelectionRange(cursor, cursor);
      }

      function startEdit(r, c, initial = null, selectText = false) {
        commitEditing();
        commitFormulaBar();
        selectCell(r, c);
        const sh = sheet();
        const cell = getCell(sh, r, c);
        const td = cellElements[r][c];
        td.classList.add('editing');
        td.textContent = '';
        const input = document.createElement('input');
        input.className = 'cell-editor';
        input.autocomplete = 'off';
        input.spellcheck = false;
        input.value = initial != null ? initial : (cell ? cell.raw : '');
        td.appendChild(input);
        editing = { r, c, input, original: input.value };
        input.focus();
        if (selectText) input.select();
        else input.setSelectionRange(input.value.length, input.value.length);
      }

      function commitEditing(move = null) {
        if (!editing) return;
        const { r, c, input } = editing;
        const td = cellElements[r][c];
        setRaw(sheet(), r, c, input.value);
        editing = null;
        td.classList.remove('editing');
        td.textContent = '';
        renderAll();
        persistSoon();
        if (move) moveActive(move.dr, move.dc);
      }

      function cancelEditing() {
        if (!editing) return;
        const { r, c } = editing;
        const td = cellElements[r][c];
        editing = null;
        td.classList.remove('editing');
        renderAll();
      }

      function commitFormulaBar() {
        if (formulaCommitting) return;
        formulaCommitting = true;
        const sh = sheet();
        setRaw(sh, sh.active.r, sh.active.c, formulaBar.value);
        if (document.activeElement === formulaBar) formulaBar.blur();
        renderAll();
        persistSoon();
        formulaCommitting = false;
      }

      function cancelFormulaBar() {
        suppressFormulaBlur = true;
        formulaBar.blur();
        suppressFormulaBlur = false;
        renderAll();
        gridScroll.focus();
      }

      function moveActive(dr, dc, extend = false) {
        const sh = sheet();
        const r = clamp(sh.active.r + dr, 0, ROWS - 1);
        const c = clamp(sh.active.c + dc, 0, COLS - 1);
        if (extend) setSelection(sh.selection.r1, sh.selection.c1, r, c, r, c);
        else setSelection(r, c, r, c, r, c);
        ensureVisible(r, c);
      }

      function ensureVisible(r, c) {
        const td = cellElements[r][c];
        td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }

      function clearSelectionContents() {
        const sh = sheet();
        const range = normalizeRange(sh.selection);
        for (let r = range.r1; r <= range.r2; r++) {
          for (let c = range.c1; c <= range.c2; c++) {
            const cell = getCell(sh, r, c);
            if (cell) {
              cell.raw = '';
              if (!Object.keys(cell.style || {}).length) sh.cells.delete(key(r, c));
            }
          }
        }
        renderAll();
        persistSoon();
      }

      function applyStyle(property, value) {
        const sh = sheet();
        const range = normalizeRange(sh.selection);
        for (let r = range.r1; r <= range.r2; r++) {
          for (let c = range.c1; c <= range.c2; c++) {
            const cell = ensureCell(sh, r, c);
            cell.style = cell.style || {};
            if (property === 'bold' || property === 'italic') cell.style[property] = !cell.style[property];
            else cell.style[property] = value;
            if (!cell.raw && !Object.keys(cell.style).length) sh.cells.delete(key(r, c));
          }
        }
        renderAll();
        persistSoon();
      }

      function startColumnResize(e, c) {
        e.preventDefault();
        e.stopPropagation();
        const sh = sheet();
        resizeState = { c, startX: e.clientX, startWidth: sh.colWidths[c] || DEFAULT_COL_WIDTH };
        document.body.classList.add('resizing');
      }

      function onMouseMove(e) {
        if (resizeState) {
          const sh = sheet();
          const width = clamp(resizeState.startWidth + e.clientX - resizeState.startX, 48, 420);
          sh.colWidths[resizeState.c] = width;
          colElements[resizeState.c].style.width = width + 'px';
          return;
        }
        const target = e.target.closest ? e.target.closest('td.cell') : null;
        if (refSelection && target) {
          updateReferenceSelection(Number(target.dataset.r), Number(target.dataset.c));
          return;
        }
        if (selectionDrag && target) {
          const r = Number(target.dataset.r);
          const c = Number(target.dataset.c);
          setSelection(selectionDrag.r, selectionDrag.c, r, c, r, c);
        }
      }

      function onMouseUp() {
        if (resizeState) {
          resizeState = null;
          document.body.classList.remove('resizing');
          persistSoon();
        }
        if (selectionDrag) selectionDrag = null;
        finishReferenceSelection();
      }

      function handleGridKeydown(e) {
        if (editing || document.activeElement === formulaBar) return;
        const sh = sheet();
        const keyName = e.key;

        if ((e.ctrlKey || e.metaKey) && keyName.toLowerCase() === 'b') {
          e.preventDefault(); applyStyle('bold'); return;
        }
        if ((e.ctrlKey || e.metaKey) && keyName.toLowerCase() === 'i') {
          e.preventDefault(); applyStyle('italic'); return;
        }
        if (keyName === 'ArrowUp') { e.preventDefault(); moveActive(-1, 0, e.shiftKey); return; }
        if (keyName === 'ArrowDown') { e.preventDefault(); moveActive(1, 0, e.shiftKey); return; }
        if (keyName === 'ArrowLeft') { e.preventDefault(); moveActive(0, -1, e.shiftKey); return; }
        if (keyName === 'ArrowRight') { e.preventDefault(); moveActive(0, 1, e.shiftKey); return; }
        if (keyName === 'Enter') { e.preventDefault(); moveActive(e.shiftKey ? -1 : 1, 0); return; }
        if (keyName === 'Tab') { e.preventDefault(); moveActive(0, e.shiftKey ? -1 : 1); return; }
        if (keyName === 'F2') { e.preventDefault(); startEdit(sh.active.r, sh.active.c, null, false); return; }
        if (keyName === 'Delete' || keyName === 'Backspace') { e.preventDefault(); clearSelectionContents(); return; }
        if (keyName === 'Home') { e.preventDefault(); selectCell(sh.active.r, 0); ensureVisible(sh.active.r, 0); return; }
        if (keyName.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
          e.preventDefault();
          startEdit(sh.active.r, sh.active.c, keyName, false);
        }
      }

      function handleEditorKeydown(e) {
        if (!editing) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          commitEditing({ dr: e.shiftKey ? -1 : 1, dc: 0 });
        } else if (e.key === 'Tab') {
          e.preventDefault();
          commitEditing({ dr: 0, dc: e.shiftKey ? -1 : 1 });
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelEditing();
        } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && !e.altKey) {
          const input = editing.input;
          const atStart = input.selectionStart === 0;
          const atEnd = input.selectionStart === input.value.length;
          if ((e.key === 'ArrowUp') || (e.key === 'ArrowDown') || (e.key === 'ArrowLeft' && atStart) || (e.key === 'ArrowRight' && atEnd)) {
            e.preventDefault();
            const delta = { ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1] }[e.key];
            commitEditing({ dr: delta[0], dc: delta[1] });
          }
        }
      }

      function handleFormulaBarKeydown(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          commitFormulaBar();
          gridScroll.focus();
        } else if (e.key === 'Escape') {
          e.preventDefault();
          cancelFormulaBar();
        }
      }

      function serializeWorkbook() {
        return {
          activeSheetIndex,
          sheets: workbook.sheets.map(sh => ({
            id: sh.id,
            name: sh.name,
            active: sh.active,
            selection: sh.selection,
            colWidths: sh.colWidths,
            cells: Array.from(sh.cells.entries()).map(([k, cell]) => [k, cell])
          }))
        };
      }

      function loadWorkbook(data) {
        if (!data || !Array.isArray(data.sheets) || !data.sheets.length) return false;
        workbook = {
          sheets: data.sheets.map(raw => {
            const sh = makeSheet(raw.name || 'Sheet');
            sh.id = raw.id || sh.id;
            sh.active = raw.active || sh.active;
            sh.selection = raw.selection || sh.selection;
            sh.colWidths = Array.isArray(raw.colWidths) && raw.colWidths.length === COLS ? raw.colWidths : sh.colWidths;
            sh.cells = new Map(raw.cells || []);
            return sh;
          })
        };
        activeSheetIndex = clamp(data.activeSheetIndex || 0, 0, workbook.sheets.length - 1);
        return true;
      }

      function persistSoon() {
        saveState.textContent = 'Saving…';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeWorkbook()));
            saveState.textContent = 'Saved locally';
          } catch {
            saveState.textContent = 'Local save unavailable';
          }
        }, 250);
      }

      function restore() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw && loadWorkbook(JSON.parse(raw))) return true;
        } catch {}
        workbook = newWorkbook();
        activeSheetIndex = 0;
        return false;
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
      }

      function csvEscape(value) {
        const text = value == null ? '' : String(value);
        return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }

      function downloadCSV() {
        commitEditing();
        commitFormulaBar();
        const sh = sheet();
        let maxR = -1, maxC = -1;
        for (const k of sh.cells.keys()) {
          const { r, c } = parseKey(k);
          const cell = sh.cells.get(k);
          if (cell && (cell.raw !== '' || Object.keys(cell.style || {}).length)) {
            maxR = Math.max(maxR, r);
            maxC = Math.max(maxC, c);
          }
        }
        maxR = Math.max(maxR, 0);
        maxC = Math.max(maxC, 0);
        const lines = [];
        for (let r = 0; r <= maxR; r++) {
          const row = [];
          for (let c = 0; c <= maxC; c++) row.push(csvEscape(getCell(sh, r, c)?.raw || ''));
          lines.push(row.join(','));
        }
        const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = sh.name.replace(/[\\/:*?"<>|]/g, '_') + '.csv';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('Downloaded ' + a.download);
      }

      function parseCSV(text) {
        const rows = [];
        let row = [];
        let field = '';
        let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (inQuotes) {
            if (ch === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; }
              else inQuotes = false;
            } else field += ch;
          } else if (ch === '"') inQuotes = true;
          else if (ch === ',') { row.push(field); field = ''; }
          else if (ch === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else if (ch !== '\r') field += ch;
        }
        row.push(field);
        rows.push(row);
        while (rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
        return rows;
      }

      function uploadCSV(file) {
        const reader = new FileReader();
        reader.onload = () => {
          const rows = parseCSV(String(reader.result || '').replace(/^\ufeff/, ''));
          if (rows.length > ROWS) return showToast('CSV has more than ' + ROWS + ' rows.');
          const sh = sheet();
          sh.cells.clear();
          rows.forEach((row, r) => {
            row.slice(0, COLS).forEach((value, c) => {
              if (value !== '') setRaw(sh, r, c, value);
            });
          });
          sh.active = { r: 0, c: 0 };
          sh.selection = { r1: 0, c1: 0, r2: 0, c2: 0 };
          renderAll();
          persistSoon();
          showToast('Imported ' + rows.length + ' row' + (rows.length === 1 ? '' : 's') + ' into ' + sh.name);
        };
        reader.onerror = () => showToast('Could not read the CSV file.');
        reader.readAsText(file);
      }

      function bindEvents() {
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        gridScroll.addEventListener('keydown', handleGridKeydown);
        formulaBar.addEventListener('keydown', handleFormulaBarKeydown);
        formulaBar.addEventListener('input', () => {
          if (refSelection) refSelection = null;
        });
        formulaBar.addEventListener('blur', () => {
          if (!refSelection && !suppressFormulaBlur) commitFormulaBar();
        });

        sheetGrid.addEventListener('keydown', e => {
          if (editing && e.target === editing.input) handleEditorKeydown(e);
        });

        boldBtn.addEventListener('click', () => applyStyle('bold'));
        italicBtn.addEventListener('click', () => applyStyle('italic'));
        bgColor.addEventListener('input', () => applyStyle('bg', bgColor.value));
        clearBtn.addEventListener('click', clearSelectionContents);
        downloadCsvBtn.addEventListener('click', downloadCSV);
        uploadCsvBtn.addEventListener('click', () => csvFile.click());
        csvFile.addEventListener('change', () => {
          if (csvFile.files && csvFile.files[0]) uploadCSV(csvFile.files[0]);
          csvFile.value = '';
        });
        addSheetBtn.addEventListener('click', addSheet);
        renameSheetBtn.addEventListener('click', () => renameSheet());
        deleteSheetBtn.addEventListener('click', () => deleteSheet());

        window.addEventListener('beforeunload', () => {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeWorkbook())); } catch {}
        });
      }

      function init() {
        restore();
        buildGrid();
        bindEvents();
        renderAll();
        gridScroll.focus();
      }

      init();
    })();
  </script>
</body>
</html>
