<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSheet - Spreadsheet App</title>
    <style>
        :root {
            --bg-color: #f3f3f3;
            --border-color: #d4d4d4;
            --header-bg: #f8f9fa;
            --header-hover: #e9ecef;
            --selection-bg: rgba(25, 118, 210, 0.1);
            --selection-border: #1976d2;
            --text-color: #333;
            --toolbar-bg: #fff;
            --accent: #107c41; /* Excel Green */
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; background: var(--bg-color); }

        /* Toolbar */
        #toolbar {
            height: 40px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }
        .tool-btn {
            background: none;
            border: 1px solid transparent;
            padding: 4px 8px;
            cursor: pointer;
            border-radius: 2px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .tool-btn:hover { background: var(--header-hover); border-color: var(--border-color); }
        .tool-sep { width: 1px; height: 20px; background: var(--border-color); margin: 0 5px; }
        input[type="color"] { border: none; width: 24px; height: 24px; padding: 0; background: none; cursor: pointer; }

        /* Formula Bar */
        #formula-bar-container {
            height: 30px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }
        #selected-cell-id {
            width: 40px;
            text-align: center;
            font-weight: bold;
            color: #666;
            border-right: 1px solid var(--border-color);
            padding-right: 10px;
        }
        #formula-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            font-family: monospace;
        }

        /* Grid Area */
        #grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #fff;
        }
        #spreadsheet {
            display: grid;
            /* Grid template columns set via JS */
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 100%;
        }
        
        /* Headers */
        .header-col, .header-row {
            background: var(--header-bg);
            border: 1px solid var(--border-color);
            text-align: center;
            font-size: 12px;
            color: #666;
            user-select: none;
            position: sticky;
            z-index: 10;
        }
        .header-col { top: 0; height: 24px; }
        .header-row { left: 0; width: 40px; }
        .header-corner { top: 0; left: 0; z-index: 20; width: 40px; }
        
        /* Resize Handles */
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            cursor: col-resize;
            z-index: 30;
        }
        .resizer:hover { background: var(--accent); }

        /* Cells */
        .cell {
            border: 1px solid #e0e0e0;
            padding: 0 4px;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            cursor: cell;
            outline: none;
            height: 24px;
            line-height: 22px;
        }
        .cell:focus {
            outline: 2px solid var(--selection-border);
            z-index: 5;
            border-color: var(--selection-border);
        }
        .cell.selected {
            background-color: var(--selection-bg);
        }
        .cell.in-range {
            background-color: var(--selection-bg);
        }

        /* Sheet Tabs */
        #sheet-tabs {
            height: 30px;
            background: var(--toolbar-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding-left: 10px;
            overflow-x: auto;
        }
        .sheet-tab {
            padding: 4px 15px;
            background: #e0e0e0;
            margin-right: 2px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sheet-tab.active {
            background: #fff;
            color: var(--accent);
            font-weight: bold;
            border-top: 2px solid var(--accent);
        }
        .add-sheet {
            padding: 4px 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        /* Context Menu / Modal */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 300px;
        }
        .modal h3 { margin-top: 0; }
        .modal input { width: 100%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; }
        .modal-buttons { text-align: right; margin-top: 10px; }
        .btn { padding: 6px 12px; border: none; border-radius: 2px; cursor: pointer; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: #ccc; margin-right: 5px; }

    </style>
</head>
<body>

    <!-- Toolbar -->
    <div id="toolbar">
        <button class="tool-btn" onclick="app.format('bold')" title="Bold"><b>B</b></button>
        <button class="tool-btn" onclick="app.format('italic')" title="Italic"><i>I</i></button>
        <button class="tool-btn" onclick="app.format('underline')" title="Underline"><u>U</u></button>
        <div class="tool-sep"></div>
        <button class="tool-btn" title="Background Color">
            🎨 <input type="color" id="bg-color-picker" onchange="app.format('bg', this.value)">
        </button>
        <button class="tool-btn" title="Text Color">
            A <input type="color" id="text-color-picker" value="#000000" onchange="app.format('color', this.value)">
        </button>
        <div class="tool-sep"></div>
        <button class="tool-btn" onclick="app.clearCells()" title="Clear">🗑️ Clear</button>
        <div class="tool-sep"></div>
        <button class="tool-btn" onclick="app.downloadCSV()" title="Download CSV">⬇️ CSV</button>
        <button class="tool-btn" onclick="document.getElementById('csv-input').click()" title="Upload CSV">⬆️ CSV</button>
        <input type="file" id="csv-input" style="display:none" accept=".csv" onchange="app.uploadCSV(this)">
    </div>

    <!-- Formula Bar -->
    <div id="formula-bar-container">
        <div id="selected-cell-id">A1</div>
        <span style="color:#999; font-size:12px;">fx</span>
        <input type="text" id="formula-input" placeholder="Enter value or formula (e.g., =SUM(A1:A5))">
    </div>

    <!-- Grid -->
    <div id="grid-container">
        <table id="spreadsheet">
            <!-- Generated by JS -->
        </table>
    </div>

    <!-- Sheet Tabs -->
    <div id="sheet-tabs">
        <!-- Generated by JS -->
        <div class="add-sheet" onclick="app.addSheet()">+</div>
    </div>

    <!-- Rename Modal -->
    <div id="modal-overlay">
        <div class="modal">
            <h3 id="modal-title">Rename Sheet</h3>
            <input type="text" id="modal-input">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="app.closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="app.confirmModal()">OK</button>
            </div>
        </div>
    </div>

    <script>
        class SpreadsheetApp {
            constructor() {
                this.rows = 100;
                this.cols = 26; // A-Z
                this.sheets = [];
                this.activeSheetIndex = 0;
                this.selection = { start: null, end: null, active: null }; // {r, c}
                this.isSelecting = false;
                this.colWidths = new Array(this.cols).fill(100);
                
                this.init();
            }

            init() {
                this.addSheet("Sheet1");
                this.setupEventListeners();
                this.renderGrid();
                this.renderTabs();
                this.updateFormulaBar();
            }

            addSheet(name = null) {
                const sheetName = name || `Sheet${this.sheets.length + 1}`;
                const data = {}; // Map "A1": { value: "", formula: "", style: {} }
                this.sheets.push({ name: sheetName, data: data });
                this.activeSheetIndex = this.sheets.length - 1;
                this.renderTabs();
                this.renderGrid();
            }

            deleteSheet(index) {
                if (this.sheets.length === 1) return;
                if (confirm(`Delete ${this.sheets[index].name}?`)) {
                    this.sheets.splice(index, 1);
                    if (this.activeSheetIndex >= index) this.activeSheetIndex = Math.max(0, index - 1);
                    this.renderTabs();
                    this.renderGrid();
                }
            }

            renameSheet(index) {
                const sheet = this.sheets[index];
                document.getElementById('modal-title').innerText = "Rename Sheet";
                document.getElementById('modal-input').value = sheet.name;
                document.getElementById('modal-overlay').style.display = 'flex';
                document.getElementById('modal-input').focus();
                
                this.modalCallback = () => {
                    const newName = document.getElementById('modal-input').value.trim();
                    if (newName) sheet.name = newName;
                    this.renderTabs();
                };
            }

            getActiveSheet() {
                return this.sheets[this.activeSheetIndex];
            }

            getCellId(r, c) {
                const colLetter = String.fromCharCode(65 + c);
                return `${colLetter}${r + 1}`;
            }

            parseCellId(id) {
                const match = id.match(/([A-Z]+)([0-9]+)/);
                if (!match) return null;
                const c = match[1].charCodeAt(0) - 65;
                const r = parseInt(match[2]) - 1;
                return { r, c };
            }

            // --- Rendering ---
            renderGrid() {
                const table = document.getElementById('spreadsheet');
                table.innerHTML = '';
                
                // Set column widths
                let gridTemplate = `40px ${this.colWidths.map(w => `${w}px`).join(' ')}`;
                table.style.gridTemplateColumns = gridTemplate;

                // Corner
                const corner = document.createElement('div');
                corner.className = 'header-col header-corner';
                table.appendChild(corner);

                // Column Headers
                for (let c = 0; c < this.cols; c++) {
                    const header = document.createElement('div');
                    header.className = 'header-col';
                    header.innerText = String.fromCharCode(65 + c);
                    header.style.position = 'relative';
                    
                    // Resizer
                    const resizer = document.createElement('div');
                    resizer.className = 'resizer';
                    resizer.onmousedown = (e) => this.startResize(e, c);
                    header.appendChild(resizer);
                    
                    // Context Menu for Header
                    header.oncontextmenu = (e) => {
                        e.preventDefault();
                        // Simple rename prompt for demo
                        if(confirm(`Rename Column ${String.fromCharCode(65+c)}? (Not implemented in demo, just resize)`)) {}
                    };

                    table.appendChild(header);
                }

                // Rows
                for (let r = 0; r < this.rows; r++) {
                    // Row Header
                    const rowHeader = document.createElement('div');
                    rowHeader.className = 'header-row';
                    rowHeader.innerText = r + 1;
                    table.appendChild(rowHeader);

                    // Cells
                    for (let c = 0; c < this.cols; c++) {
                        const cellId = this.getCellId(r, c);
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        cell.dataset.id = cellId;
                        cell.contentEditable = true;
                        
                        // Load Data
                        this.updateCellVisuals(cell, cellId);

                        table.appendChild(cell);
                    }
                }
            }

            updateCellVisuals(cellEl, cellId) {
                const sheet = this.getActiveSheet();
                const cellData = sheet.data[cellId] || {};
                
                // Display Value (Result of formula or raw value)
                cellEl.innerText = cellData.displayValue || cellData.value || '';
                
                // Styles
                if (cellData.style) {
                    if (cellData.style.bold) cellEl.style.fontWeight = 'bold';
                    if (cellData.style.italic) cellEl.style.fontStyle = 'italic';
                    if (cellData.style.underline) cellEl.style.textDecoration = 'underline';
                    if (cellData.style.bg) cellEl.style.backgroundColor = cellData.style.bg;
                    if (cellData.style.color) cellEl.style.color = cellData.style.color;
                } else {
                    cellEl.style.fontWeight = '';
                    cellEl.style.fontStyle = '';
                    cellEl.style.textDecoration = '';
                    cellEl.style.backgroundColor = '';
                    cellEl.style.color = '';
                }
            }

            renderTabs() {
                const container = document.getElementById('sheet-tabs');
                // Keep the '+' button
                const addBtn = container.querySelector('.add-sheet');
                container.innerHTML = '';
                
                this.sheets.forEach((sheet, index) => {
                    const tab = document.createElement('div');
                    tab.className = `sheet-tab ${index === this.activeSheetIndex ? 'active' : ''}`;
                    tab.innerHTML = `<span>${sheet.name}</span>`;
                    tab.onclick = () => {
                        this.activeSheetIndex = index;
                        this.renderGrid();
                        this.updateFormulaBar();
                    };
                    tab.oncontextmenu = (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        if(confirm("Delete this sheet?")) this.deleteSheet(index);
                        else this.renameSheet(index);
                    };
                    container.appendChild(tab);
                });
                container.appendChild(addBtn);
            }

            // --- Logic & Formulas ---
            evaluateFormula(formula) {
                if (!formula.startsWith('=')) return formula;
                
                const expr = formula.substring(1).toUpperCase();
                
                try {
                    // Handle Functions
                    // SUM(A1:A5) -> sum(getRange('A1:A5'))
                    const funcRegex = /(SUM|AVERAGE|MIN|MAX)\(([A-Z]+[0-9]+:[A-Z]+[0-9]+)\)/g;
                    
                    let processedExpr = expr.replace(funcRegex, (match, func, range) => {
                        const values = this.getRangeValues(range);
                        if (values.length === 0) return 0;
                        switch(func) {
                            case 'SUM': return values.reduce((a,b) => a+b, 0);
                            case 'AVERAGE': return values.reduce((a,b) => a+b, 0) / values.length;
                            case 'MIN': return Math.min(...values);
                            case 'MAX': return Math.max(...values);
                        }
                    });

                    // Handle Cell References (A1)
                    // Replace A1 with value. Be careful not to replace inside strings if we had them.
                    // Simple regex for now: look for A-Z followed by numbers
                    processedExpr = processedExpr.replace(/[A-Z]+[0-9]+/g, (match) => {
                        const val = this.getCellRawValue(match);
                        return isNaN(val) ? 0 : val;
                    });

                    // Safe Eval (very basic)
                    // In production, use a math parser library.
                    // eslint-disable-next-line no-new-func
                    return new Function('return ' + processedExpr)();
                } catch (e) {
                    return "#ERROR";
                }
            }

            getCellRawValue(cellId) {
                const sheet = this.getActiveSheet();
                const cell = sheet.data[cellId];
                if (!cell) return 0;
                if (cell.formula) {
                    // Prevent infinite recursion in simple demo by not re-evaluating deeply here
                    // Ideally we have a dependency graph.
                    return this.evaluateFormula(cell.formula); 
                }
                const val = parseFloat(cell.value);
                return isNaN(val) ? 0 : val;
            }

            getRangeValues(rangeStr) {
                const [startId, endId] = rangeStr.split(':');
                const start = this.parseCellId(startId);
                const end = this.parseCellId(endId);
                
                const values = [];
                const minR = Math.min(start.r, end.r);
                const maxR = Math.max(start.r, end.r);
                const minC = Math.min(start.c, end.c);
                const maxC = Math.max(start.c, end.c);

                for (let r = minR; r <= maxR; r++) {
                    for (let c = minC; c <= maxC; c++) {
                        values.push(this.getCellRawValue(this.getCellId(r, c)));
                    }
                }
                return values;
            }

            recalculate() {
                const sheet = this.getActiveSheet();
                // Simple full recalculation pass
                // In a real app, we'd use a dependency graph (DAG)
                Object.keys(sheet.data).forEach(id => {
                    const cell = sheet.data[id];
                    if (cell && cell.formula) {
                        cell.displayValue = this.evaluateFormula(cell.formula);
                        const el = document.querySelector(`.cell[data-id="${id}"]`);
                        if (el) el.innerText = cell.displayValue;
                    }
                });
            }

            // --- Interaction ---
            setupEventListeners() {
                const grid = document.getElementById('grid-container');
                const formulaInput = document.getElementById('formula-input');

                // Grid Clicks
                grid.addEventListener('mousedown', (e) => {
                    if (e.target.classList.contains('cell')) {
                        this.isSelecting = true;
                        const r = parseInt(e.target.dataset.r);
                        const c = parseInt(e.target.dataset.c);
                        this.selection.start = { r, c };
                        this.selection.active = { r, c };
                        this.updateSelectionVisuals();
                        this.updateFormulaBar();
                        
                        // Focus cell for typing
                        // e.target.focus(); 
                    }
                });

                grid.addEventListener('mouseover', (e) => {
                    if (this.isSelecting && e.target.classList.contains('cell')) {
                        const r = parseInt(e.target.dataset.r);
                        const c = parseInt(e.target.dataset.c);
                        this.selection.end = { r, c };
                        this.updateSelectionVisuals();
                    }
                });

                window.addEventListener('mouseup', () => {
                    this.isSelecting = false;
                });

                // Cell Editing
                grid.addEventListener('keydown', (e) => {
                    if (e.target.classList.contains('cell')) {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            this.commitCellEdit(e.target);
                            // Move down
                            const next = document.querySelector(`.cell[data-r="${parseInt(e.target.dataset.r)+1}"][data-c="${e.target.dataset.c}"]`);
                            if(next) { next.focus(); this.selectCell(parseInt(next.dataset.r), parseInt(next.dataset.c)); }
                        } else if (e.key === 'Tab') {
                            e.preventDefault();
                            this.commitCellEdit(e.target);
                            // Move right
                            const next = document.querySelector(`.cell[data-r="${e.target.dataset.r}"][data-c="${parseInt(e.target.dataset.c)+1}"]`);
                            if(next) { next.focus(); this.selectCell(parseInt(next.dataset.r), parseInt(next.dataset.c)); }
                        } else if (e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                            // Allow navigation only if not editing text deeply? 
                            // For simplicity, let standard behavior happen but update selection on focus change
                        }
                    }
                });

                grid.addEventListener('focusin', (e) => {
                    if (e.target.classList.contains('cell')) {
                        const r = parseInt(e.target.dataset.r);
                        const c = parseInt(e.target.dataset.c);
                        this.selectCell(r, c);
                    }
                });

                // Formula Bar
                formulaInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        this.commitFormulaBar();
                    }
                });
                
                // Clicking cells while editing formula bar
                grid.addEventListener('click', (e) => {
                    if (document.activeElement === formulaInput && e.target.classList.contains('cell')) {
                        const id = e.target.dataset.id;
                        const start = formulaInput.selectionStart;
                        const end = formulaInput.selectionEnd;
                        const val = formulaInput.value;
                        formulaInput.value = val.substring(0, start) + id + val.substring(end);
                        formulaInput.focus();
                        formulaInput.selectionStart = formulaInput.selectionEnd = start + id.length;
                        e.preventDefault(); // Don't change selection focus away from formula bar
                    }
                });
            }

            selectCell(r, c) {
                this.selection.start = { r, c };
                this.selection.end = { r, c };
                this.selection.active = { r, c };
                this.updateSelectionVisuals();
                this.updateFormulaBar();
            }

            updateSelectionVisuals() {
                document.querySelectorAll('.cell').forEach(el => {
                    el.classList.remove('selected', 'in-range');
                });

                const r1 = Math.min(this.selection.start.r, this.selection.end ? this.selection.end.r : this.selection.start.r);
                const r2 = Math.max(this.selection.start.r, this.selection.end ? this.selection.end.r : this.selection.start.r);
                const c1 = Math.min(this.selection.start.c, this.selection.end ? this.selection.end.c : this.selection.start.c);
                const c2 = Math.max(this.selection.start.c, this.selection.end ? this.selection.end.c : this.selection.start.c);

                for (let r = r1; r <= r2; r++) {
                    for (let c = c1; c <= c2; c++) {
                        const el = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
                        if (el) {
                            if (r === this.selection.active.r && c === this.selection.active.c) {
                                el.classList.add('selected');
                                el.focus();
                            } else {
                                el.classList.add('in-range');
                            }
                        }
                    }
                }

                // Update Header ID
                const activeId = this.getCellId(this.selection.active.r, this.selection.active.c);
                document.getElementById('selected-cell-id').innerText = activeId;
            }

            updateFormulaBar() {
                const sheet = this.getActiveSheet();
                const id = this.getCellId(this.selection.active.r, this.selection.active.c);
                const cell = sheet.data[id];
                const input = document.getElementById('formula-input');
                
                if (cell && cell.formula) {
                    input.value = cell.formula;
                } else if (cell) {
                    input.value = cell.value || '';
                } else {
                    input.value = '';
                }
            }

            commitCellEdit(cellEl) {
                const id = cellEl.dataset.id;
                const text = cellEl.innerText;
                this.setCellData(id, text);
            }

            commitFormulaBar() {
                const id = this.getCellId(this.selection.active.r, this.selection.active.c);
                const text = document.getElementById('formula-input').value;
                this.setCellData(id, text);
                document.getElementById('formula-input').blur();
                // Refocus grid
                const cell = document.querySelector(`.cell[data-id="${id}"]`);
                if(cell) cell.focus();
            }

            setCellData(id, text) {
                const sheet = this.getActiveSheet();
                if (!sheet.data[id]) sheet.data[id] = { value: '', style: {} };
                
                const cell = sheet.data[id];
                
                if (text.startsWith('=')) {
                    cell.formula = text;
                    cell.value = ''; // Clear raw value
                    cell.displayValue = this.evaluateFormula(text);
                } else {
                    cell.formula = '';
                    cell.value = text;
                    cell.displayValue = text;
                }

                // Update Visual
                const el = document.querySelector(`.cell[data-id="${id}"]`);
                if (el) el.innerText = cell.displayValue;

                this.recalculate();
            }

            // --- Formatting ---
            format(type, value = null) {
                const sheet = this.getActiveSheet();
                const r1 = Math.min(this.selection.start.r, this.selection.end.r);
                const r2 = Math.max(this.selection.start.r, this.selection.end.r);
                const c1 = Math.min(this.selection.start.c, this.selection.end.c);
                const c2 = Math.max(this.selection.start.c, this.selection.end.c);

                for (let r = r1; r <= r2; r++) {
                    for (let c = c1; c <= c2; c++) {
                        const id = this.getCellId(r, c);
                        if (!sheet.data[id]) sheet.data[id] = { value: '', style: {} };
                        
                        const style = sheet.data[id].style;
                        if (type === 'bold') style.bold = !style.bold;
                        if (type === 'italic') style.italic = !style.italic;
                        if (type === 'underline') style.underline = !style.underline;
                        if (type === 'bg') style.bg = value;
                        if (type === 'color') style.color = value;

                        this.updateCellVisuals(document.querySelector(`.cell[data-id="${id}"]`), id);
                    }
                }
            }

            clearCells() {
                const sheet = this.getActiveSheet();
                const r1 = Math.min(this.selection.start.r, this.selection.end.r);
                const r2 = Math.max(this.selection.start.r, this.selection.end.r);
                const c1 = Math.min(this.selection.start.c, this.selection.end.c);
                const c2 = Math.max(this.selection.start.c, this.selection.end.c);

                for (let r = r1; r <= r2; r++) {
                    for (let c = c1; c <= c2; c++) {
                        const id = this.getCellId(r, c);
                        delete sheet.data[id];
                        const el = document.querySelector(`.cell[data-id="${id}"]`);
                        if(el) {
                            el.innerText = '';
                            el.style = '';
                        }
                    }
                }
                this.updateFormulaBar();
            }

            // --- Resizing ---
            startResize(e, colIndex) {
                e.preventDefault();
                const startX = e.clientX;
                const startWidth = this.colWidths[colIndex];
                
                const doResize = (e) => {
                    const newWidth = startWidth + (e.clientX - startX);
                    this.colWidths[colIndex] = Math.max(20, newWidth);
                    this.renderGrid(); // Re-render to apply width (inefficient but simple)
                };
                
                const stopResize = () => {
                    document.removeEventListener('mousemove', doResize);
                    document.removeEventListener('mouseup', stopResize);
                };
                
                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', stopResize);
            }

            // --- CSV ---
            downloadCSV() {
                const sheet = this.getActiveSheet();
                let csv = '';
                for (let r = 0; r < this.rows; r++) {
                    let row = [];
                    for (let c = 0; c < this.cols; c++) {
                        const id = this.getCellId(r, c);
                        const val = sheet.data[id] ? (sheet.data[id].displayValue || sheet.data[id].value) : '';
                        // Escape quotes
                        row.push(`"${val.replace(/"/g, '""')}"`);
                    }
                    csv += row.join(',') + '\n';
                }
                
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${sheet.name}.csv`;
                a.click();
            }

            uploadCSV(input) {
                const file = input.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    const rows = text.split('\n');
                    const sheet = this.getActiveSheet();
                    sheet.data = {}; // Clear current sheet
                    
                    rows.forEach((rowStr, r) => {
                        // Simple CSV parse (doesn't handle complex quotes perfectly but okay for demo)
                        const cols = rowStr.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                        cols.forEach((colStr, c) => {
                            if (c >= this.cols) return;
                            let val = colStr.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
                            if (val) {
                                const id = this.getCellId(r, c);
                                sheet.data[id] = { value: val, displayValue: val, style: {} };
                            }
                        });
                    });
                    this.renderGrid();
                    this.recalculate();
                };
                reader.readAsText(file);
                input.value = ''; // Reset
            }

            // --- Modal Helpers ---
            modalCallback = null;
            closeModal() {
                document.getElementById('modal-overlay').style.display = 'none';
                this.modalCallback = null;
            }
            confirmModal() {
                if (this.modalCallback) this.modalCallback();
                this.closeModal();
            }
        }

        const app = new SpreadsheetApp();
    </script>
</body>
</html>
