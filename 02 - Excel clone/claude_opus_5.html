<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gridwork — Spreadsheet</title>
<style>
:root{
  --bg:#eef0f2;
  --surface:#ffffff;
  --chrome:#f7f8f9;
  --line:#dcdfe3;
  --line-soft:#e8eaed;
  --line-strong:#c3c8cf;
  --text:#1c2024;
  --muted:#61686f;
  --accent:#0e7a53;
  --accent-ink:#0a5c3e;
  --accent-soft:#e4f2ec;
  --accent-line:#a9d6c3;
  --sel-fill:rgba(14,122,83,.09);
  --danger:#b4232a;
  --head-h:25px;
  --rowhead-w:48px;
  --radius:7px;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 6px 18px rgba(16,24,32,.08);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- app shell ---------- */
.app{display:flex;flex-direction:column;height:100dvh;background:var(--chrome)}

/* ---------- title bar ---------- */
.titlebar{
  display:flex;align-items:center;gap:10px;
  padding:7px 12px;background:var(--chrome);border-bottom:1px solid var(--line-soft);
}
.mark{
  width:22px;height:22px;border-radius:5px;background:var(--accent);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;letter-spacing:.02em;
  flex:none;
}
.wbname{
  font-weight:600;font-size:13.5px;border:1px solid transparent;border-radius:5px;
  padding:3px 7px;background:transparent;min-width:60px;max-width:min(46vw,320px);
}
.wbname:hover{border-color:var(--line)}
.wbname:focus{border-color:var(--accent);background:#fff;outline:none}
.titlebar .spacer{flex:1}
.hint{color:var(--muted);font-size:11.5px;white-space:nowrap}
@media (max-width:760px){.hint{display:none}}

/* ---------- toolbar ---------- */
.toolbar{
  display:flex;align-items:center;gap:2px;padding:5px 8px;
  background:var(--chrome);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:thin;
}
.toolbar::-webkit-scrollbar{height:6px}
.toolbar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.tb{
  height:28px;min-width:28px;padding:0 7px;border:1px solid transparent;border-radius:6px;
  background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;white-space:nowrap;flex:none;
}
.tb:hover{background:#e9ecef}
.tb:active{background:#dfe3e7}
.tb.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tb[disabled]{opacity:.38;pointer-events:none}
.tb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb .lbl{font-size:12px}
.tb.b{font-weight:700}
.tb.i{font-style:italic;font-family:Georgia,serif}
.tb.u{text-decoration:underline}
.sep{width:1px;height:19px;background:var(--line);margin:0 5px;flex:none}
.picker{position:relative;display:inline-flex}
.picker input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.swatch{width:14px;height:4px;border-radius:1px;border:1px solid rgba(0,0,0,.14);margin-top:1px}
.stack{display:flex;flex-direction:column;align-items:center;line-height:1}
.stack .glyph{font-size:12px;font-weight:700}
select.tb{padding-right:4px;-webkit-appearance:none;appearance:none;background-image:none}
select.tb:hover{background:#e9ecef}
@media (max-width:900px){.tb .lbl{display:none}.tb{padding:0 6px}}

/* ---------- formula bar ---------- */
.fxbar{display:flex;align-items:stretch;gap:0;background:var(--surface);border-bottom:1px solid var(--line)}
#nameBox{
  width:104px;flex:none;border:none;border-right:1px solid var(--line);padding:0 9px;
  font:inherit;font-variant-numeric:tabular-nums;background:var(--surface);
}
#nameBox:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.fxsigil{
  display:grid;place-items:center;width:34px;flex:none;color:var(--muted);
  font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:14px;
  border-right:1px solid var(--line);user-select:none;
}
#fxInput{
  flex:1;min-width:0;border:none;padding:6px 10px;font:inherit;background:var(--surface);
  font-variant-numeric:tabular-nums;
}
#fxInput:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:520px){#nameBox{width:74px}}

/* ---------- grid ---------- */
.gridwrap{flex:1;overflow:auto;position:relative;background:var(--surface);outline:none;overscroll-behavior:contain}
.gridinner{position:relative;width:max-content}
table.grid{border-collapse:separate;border-spacing:0;table-layout:fixed;background:var(--surface)}
.grid th,.grid td{
  height:var(--head-h);padding:0 5px;font-weight:400;
  border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  overflow:hidden;white-space:nowrap;vertical-align:middle;
}
.grid thead th{
  position:sticky;top:0;z-index:3;background:var(--chrome);color:var(--muted);
  text-align:center;font-size:11px;font-weight:500;letter-spacing:.04em;user-select:none;
  border-bottom:1px solid var(--line-strong);
}
.grid tbody th{
  position:sticky;left:0;z-index:2;background:var(--chrome);color:var(--muted);
  text-align:center;font-size:11px;font-weight:500;user-select:none;
  border-right:1px solid var(--line-strong);font-variant-numeric:tabular-nums;
}
.grid thead th.corner{left:0;z-index:5;border-right:1px solid var(--line-strong)}
.grid thead th.hl,.grid tbody th.hl{background:var(--accent-soft);color:var(--accent-ink)}
.grid thead th.full,.grid tbody th.full{background:var(--accent);color:#fff}
.grid td{background:var(--surface);cursor:cell;font-variant-numeric:tabular-nums;user-select:none}
.grid td.sel{box-shadow:inset 0 0 0 9999px var(--sel-fill)}
.grid td.anchor{box-shadow:none}
.grid td.num{text-align:right}
.grid td.ctr{text-align:center}
.grid td.err{color:var(--danger)}
.grid thead th,.grid tbody th{padding:0}
.rz,.rzr{position:absolute;display:block}
.rz{top:0;right:0;width:6px;height:100%;cursor:col-resize}
.rzr{left:0;bottom:0;height:5px;width:100%;cursor:row-resize}
.rz:hover,.rzr:hover{background:var(--accent);opacity:.6}

.selbox{position:absolute;z-index:1;border:2px solid var(--accent);border-radius:1px;pointer-events:none;display:none}
.handle{
  position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--accent);
  border:1px solid #fff;border-radius:1px;pointer-events:auto;cursor:crosshair;
}
.fillbox{position:absolute;z-index:1;border:1.5px dashed var(--accent);pointer-events:none;display:none}
.grid td.r0{box-shadow:inset 0 0 0 2px #1f6feb}
.grid td.r1{box-shadow:inset 0 0 0 2px #b4232a}
.grid td.r2{box-shadow:inset 0 0 0 2px #8a4ad6}
.grid td.r3{box-shadow:inset 0 0 0 2px #b8730b}
.grid td.r4{box-shadow:inset 0 0 0 2px #0f8ea3}

#editor{
  position:absolute;z-index:7;display:none;border:2px solid var(--accent);padding:0 4px;
  font:inherit;font-variant-numeric:tabular-nums;background:#fff;color:var(--text);
  box-shadow:0 2px 8px rgba(16,24,32,.16);border-radius:1px;
}
#editor:focus{outline:none}

/* ---------- sheet tabs ---------- */
.sheetbar{
  display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--chrome);
  border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;
}
.sheetbar::-webkit-scrollbar{height:6px}
.sheetbar::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:3px}
.tab{
  height:26px;padding:0 12px;border:1px solid transparent;border-radius:6px;background:transparent;
  cursor:pointer;white-space:nowrap;color:var(--muted);flex:none;font-size:12.5px;
}
.tab:hover{background:#e9ecef}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--accent-ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.addsheet{width:26px;height:26px;padding:0;font-size:16px;line-height:1;color:var(--muted)}

/* ---------- status bar ---------- */
.statusbar{
  display:flex;align-items:center;gap:14px;padding:5px 12px;background:var(--chrome);
  border-top:1px solid var(--line-soft);color:var(--muted);font-size:11.5px;
  font-variant-numeric:tabular-nums;overflow-x:auto;scrollbar-width:none;
}
.statusbar::-webkit-scrollbar{display:none}
.statusbar .spacer{flex:1}
.statusbar b{font-weight:600;color:var(--text)}
.grow{display:inline-flex;gap:4px}
.grow button{
  border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 8px;
  cursor:pointer;color:var(--muted);font-size:11.5px;
}
.grow button:hover{border-color:var(--line-strong);color:var(--text)}

/* ---------- menu ---------- */
.menu{
  position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:4px;min-width:168px;display:none;
}
.menu button{
  display:block;width:100%;text-align:left;padding:6px 10px;border:none;background:transparent;
  border-radius:5px;cursor:pointer;font-size:12.5px;
}
.menu button:hover{background:var(--accent-soft);color:var(--accent-ink)}
.menu button.warn:hover{background:#fbeaea;color:var(--danger)}
.menu hr{border:none;border-top:1px solid var(--line-soft);margin:4px 2px}

/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:64px;transform:translateX(-50%) translateY(8px);
  background:#1c2024;color:#fff;padding:8px 14px;border-radius:8px;font-size:12.5px;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:80;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">

  <div class="titlebar">
    <div class="mark">G</div>
    <input class="wbname" id="wbName" value="Untitled workbook" aria-label="Workbook name" spellcheck="false">
    <div class="spacer"></div>
    <div class="hint">Type <b>=</b> to start a formula. Click cells to add references.</div>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="tb" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo">
      <svg viewBox="0 0 20 20"><path d="M4 9h8a4 4 0 0 1 0 8H8"/><path d="M7.5 5.5 4 9l3.5 3.5"/></svg>
    </button>
    <button class="tb" data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo">
      <svg viewBox="0 0 20 20"><path d="M16 9H8a4 4 0 0 0 0 8h4"/><path d="M12.5 5.5 16 9l-3.5 3.5"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb b" data-act="bold" title="Bold (Ctrl+B)" aria-label="Bold">B</button>
    <button class="tb i" data-act="italic" title="Italic (Ctrl+I)" aria-label="Italic">I</button>
    <button class="tb u" data-act="underline" title="Underline (Ctrl+U)" aria-label="Underline">U</button>
    <div class="sep"></div>
    <label class="tb picker" title="Text color">
      <span class="stack"><span class="glyph">A</span><span class="swatch" id="swFg" style="background:#1c2024"></span></span>
      <input type="color" id="fgColor" value="#1c2024" aria-label="Text color">
    </label>
    <label class="tb picker" title="Fill color">
      <span class="stack">
        <svg viewBox="0 0 20 20" style="width:14px;height:11px"><path d="M4.5 10.5 10 5l5 5-5.5 5.5z"/><path d="M7.5 8 6 3.5"/></svg>
        <span class="swatch" id="swBg" style="background:#ffe58a"></span>
      </span>
      <input type="color" id="bgColor" value="#ffe58a" aria-label="Fill color">
    </label>
    <button class="tb" data-act="nofill" title="Remove fill" aria-label="Remove fill">
      <svg viewBox="0 0 20 20"><rect x="4" y="4" width="12" height="12" rx="2"/><path d="m5 15 10-10"/></svg>
    </button>
    <div class="sep"></div>
    <button class="tb" data-act="alignleft" title="Align left" aria-label="Align left">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h8M4 14h11"/></svg>
    </button>
    <button class="tb" data-act="aligncenter" title="Align center" aria-label="Align center">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M6 10h8M5 14h10"/></svg>
    </button>
    <button class="tb" data-act="alignright" title="Align right" aria-label="Align right">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M8 10h8M5 14h11"/></svg>
    </button>
    <div class="sep"></div>
    <select class="tb" id="numFmt" title="Number format" aria-label="Number format">
      <option value="">Automatic</option>
      <option value="int">1,235</option>
      <option value="num">1,234.57</option>
      <option value="cur">$1,234.57</option>
      <option value="pct">12.3%</option>
      <option value="sci">1.23E+3</option>
    </select>
    <div class="sep"></div>
    <button class="tb" data-act="clear" title="Clear contents (Delete)">
      <svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6.5 6l.7 10h5.6l.7-10"/></svg>
      <span class="lbl">Clear</span>
    </button>
    <div class="sep"></div>
    <button class="tb" data-act="csvDown" title="Download the active sheet as CSV">
      <svg viewBox="0 0 20 20"><path d="M10 3v9"/><path d="m6.5 8.5 3.5 3.5 3.5-3.5"/><path d="M4 15h12"/></svg>
      <span class="lbl">Download CSV</span>
    </button>
    <button class="tb" data-act="csvUp" title="Replace the active sheet from a CSV file">
      <svg viewBox="0 0 20 20"><path d="M10 12V3"/><path d="M6.5 6.5 10 3l3.5 3.5"/><path d="M4 15h12"/></svg>
      <span class="lbl">Upload CSV</span>
    </button>
    <input type="file" id="csvFile" accept=".csv,text/csv" hidden>
  </div>

  <div class="fxbar">
    <input id="nameBox" value="A1" spellcheck="false" aria-label="Cell address">
    <div class="fxsigil" aria-hidden="true">fx</div>
    <input id="fxInput" spellcheck="false" autocomplete="off" aria-label="Formula bar" placeholder="Enter a value or formula">
  </div>

  <div class="gridwrap" id="gridwrap" tabindex="0">
    <div class="gridinner" id="gridinner">
      <table class="grid" id="grid"></table>
      <div class="selbox" id="selbox"><div class="handle" id="handle"></div></div>
      <div class="fillbox" id="fillbox"></div>
      <input id="editor" spellcheck="false" autocomplete="off" aria-label="Cell editor">
    </div>
  </div>

  <div class="sheetbar" id="sheetbar"></div>

  <div class="statusbar">
    <span id="statSel">A1</span>
    <span class="spacer"></span>
    <span id="statAgg"></span>
    <span class="grow">
      <button id="addRows">+50 rows</button>
      <button id="addCols">+8 columns</button>
    </span>
  </div>
</div>

<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =======================================================================
   Gridwork — a small spreadsheet engine
   ======================================================================= */

/* ---------- tiny helpers ---------- */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

class Err extends Error {
  constructor(code) { super(code); this.code = code; }
}
const isErr = v => v instanceof Err;

function colName(n) {
  let s = '';
  n++;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}
function colIndex(s) {
  let n = 0;
  const u = s.toUpperCase();
  for (let i = 0; i < u.length; i++) n = n * 26 + (u.charCodeAt(i) - 64);
  return n - 1;
}
const addrOf = (r, c) => colName(c) + (r + 1);
const REF_RE = /^\$?([A-Za-z]{1,3})\$?([0-9]{1,7})$/;
function matchRef(w) {
  const m = REF_RE.exec(w);
  if (!m) return null;
  const c = colIndex(m[1]), r = parseInt(m[2], 10) - 1;
  if (c < 0 || c > 16383 || r < 0) return null;
  return { r, c };
}

/* ---------- workbook model ----------
   cell = { v:rawString, b,i,u:bool, bg,fg:string, al:'left'|'center'|'right', f:formatCode }
------------------------------------- */
let sheetSeq = 1;
function newSheet(name) {
  return { name: name || ('Sheet' + sheetSeq++), cells: {}, colW: {}, rowH: {}, rows: 100, cols: 26 };
}
const WB = { name: 'Untitled workbook', sheets: [newSheet()], active: 0 };
const S = () => WB.sheets[WB.active];
const DEF_W = 96, DEF_H = 25;
const colW = (sh, c) => sh.colW[c] || DEF_W;
const rowH = (sh, r) => sh.rowH[r] || DEF_H;

function cellAt(sh, r, c) { return sh.cells[addrOf(r, c)] || null; }
function cellMake(sh, r, c) {
  const k = addrOf(r, c);
  return sh.cells[k] || (sh.cells[k] = { v: '' });
}
function cellPrune(sh, r, c) {
  const k = addrOf(r, c), cell = sh.cells[k];
  if (!cell) return;
  const bare = (!cell.v) && !cell.b && !cell.i && !cell.u && !cell.bg && !cell.fg && !cell.al && !cell.f;
  if (bare) delete sh.cells[k];
}
function sheetIndexByName(name) {
  const t = String(name).trim().toLowerCase();
  return WB.sheets.findIndex(s => s.name.toLowerCase() === t);
}

/* =======================================================================
   Tokenizer
   ======================================================================= */
function tokenize(src) {
  const toks = [];
  let i = 0;
  const digit = c => c >= '0' && c <= '9';
  while (i < src.length) {
    const c = src[i];
    if (c === ' ' || c === '\t' || c === '\n' || c === '\r') { i++; continue; }
    if (digit(c) || (c === '.' && digit(src[i + 1]))) {
      let j = i;
      while (j < src.length && (digit(src[j]) || src[j] === '.')) j++;
      if (src[j] === 'e' || src[j] === 'E') {
        let k = j + 1;
        if (src[k] === '+' || src[k] === '-') k++;
        if (digit(src[k])) { j = k; while (j < src.length && digit(src[j])) j++; }
      }
      const n = parseFloat(src.slice(i, j));
      if (isNaN(n)) throw new Err('#ERROR!');
      toks.push({ t: 'num', v: n }); i = j; continue;
    }
    if (c === '"') {
      let j = i + 1, s = '';
      for (;;) {
        if (j >= src.length) throw new Err('#ERROR!');
        if (src[j] === '"') { if (src[j + 1] === '"') { s += '"'; j += 2; continue; } break; }
        s += src[j++];
      }
      toks.push({ t: 'str', v: s }); i = j + 1; continue;
    }
    if (c === "'") {                        // 'Sheet name'!A1
      let j = i + 1, s = '';
      while (j < src.length && src[j] !== "'") s += src[j++];
      if (j >= src.length) throw new Err('#ERROR!');
      toks.push({ t: 'sheet', v: s }); i = j + 1; continue;
    }
    if (/[A-Za-z_$]/.test(c)) {
      let j = i;
      while (j < src.length && /[A-Za-z0-9_$.]/.test(src[j])) j++;
      toks.push({ t: 'ident', v: src.slice(i, j) }); i = j; continue;
    }
    if (c === '#') {
      const m = /^#(REF!|DIV\/0!|VALUE!|NAME\?|N\/A|NUM!|CIRC!|ERROR!)/i.exec(src.slice(i));
      if (!m) throw new Err('#ERROR!');
      toks.push({ t: 'err', v: m[0].toUpperCase() });
      i += m[0].length;
      continue;
    }
    const two = src.substr(i, 2);
    if (two === '<=' || two === '>=' || two === '<>') { toks.push({ t: 'op', v: two }); i += 2; continue; }
    if ('+-*/^(),:%&=<>!'.indexOf(c) >= 0) { toks.push({ t: 'op', v: c }); i++; continue; }
    throw new Err('#ERROR!');
  }
  return toks;
}

/* =======================================================================
   Parser  ->  AST
   node kinds: num str bool ref range bin un pct fn
   ======================================================================= */
const astCache = new Map();

function parseFormula(src) {
  if (astCache.has(src)) {
    const hit = astCache.get(src);
    if (isErr(hit)) throw hit;
    return hit;
  }
  let ast;
  try {
    ast = buildAst(src);
  } catch (e) {
    const err = isErr(e) ? e : new Err('#ERROR!');
    astCache.set(src, err);
    throw err;
  }
  astCache.set(src, ast);
  return ast;
}

function buildAst(src) {
  const toks = tokenize(src);
  let p = 0;
  const peek = () => toks[p];
  const isOp = v => { const t = toks[p]; return t && t.t === 'op' && t.v === v; };
  const eat = v => { if (!isOp(v)) throw new Err('#ERROR!'); p++; };

  function expr() { return compare(); }
  function compare() {
    let a = concat();
    while (peek() && peek().t === 'op' && ['=', '<', '>', '<=', '>=', '<>'].indexOf(peek().v) >= 0) {
      const op = toks[p++].v; a = { k: 'bin', op, a, b: concat() };
    }
    return a;
  }
  function concat() {
    let a = add();
    while (isOp('&')) { p++; a = { k: 'bin', op: '&', a, b: add() }; }
    return a;
  }
  function add() {
    let a = mul();
    while (isOp('+') || isOp('-')) { const op = toks[p++].v; a = { k: 'bin', op, a, b: mul() }; }
    return a;
  }
  function mul() {
    let a = unary();
    while (isOp('*') || isOp('/')) { const op = toks[p++].v; a = { k: 'bin', op, a, b: unary() }; }
    return a;
  }
  // Excel quirks: -2^2 is 4 (unary minus binds tighter than ^) and ^ is left-associative
  function unary() {
    if (isOp('-') || isOp('+')) { const op = toks[p++].v; return expTail({ k: 'un', op, a: unaryNoExp() }); }
    return expTail(postfix());
  }
  function unaryNoExp() {
    if (isOp('-') || isOp('+')) { const op = toks[p++].v; return { k: 'un', op, a: unaryNoExp() }; }
    return postfix();
  }
  function expTail(a) {
    while (isOp('^')) { p++; a = { k: 'bin', op: '^', a, b: unaryNoExp() }; }
    return a;
  }
  function postfix() {
    let a = primary();
    while (isOp('%')) { p++; a = { k: 'pct', a }; }
    return a;
  }
  function primary() {
    const t = toks[p++];
    if (!t) throw new Err('#ERROR!');
    if (t.t === 'num') return { k: 'num', v: t.v };
    if (t.t === 'str') return { k: 'str', v: t.v };
    if (t.t === 'err') return { k: 'err', v: t.v };
    if (t.t === 'sheet') {
      eat('!');
      const id = toks[p++];
      if (!id || id.t !== 'ident') throw new Err('#REF!');
      return refOrRange(t.v, id.v);
    }
    if (t.t === 'ident') {
      if (isOp('(')) {
        p++;
        const args = [];
        if (!isOp(')')) { args.push(expr()); while (isOp(',')) { p++; args.push(expr()); } }
        eat(')');
        return { k: 'fn', name: t.v.toUpperCase(), args };
      }
      if (isOp('!')) {
        p++;
        const id = toks[p++];
        if (!id || id.t !== 'ident') throw new Err('#REF!');
        return refOrRange(t.v, id.v);
      }
      const up = t.v.toUpperCase();
      if (up === 'TRUE') return { k: 'bool', v: true };
      if (up === 'FALSE') return { k: 'bool', v: false };
      return refOrRange(null, t.v);
    }
    if (t.t === 'op' && t.v === '(') { const e = expr(); eat(')'); return e; }
    if (t.t === 'op' && t.v === '-') return { k: 'un', op: '-', a: unary() };
    throw new Err('#ERROR!');
  }
  function refOrRange(sheet, word) {
    const a = matchRef(word);
    if (isOp(':')) {
      p++;
      const t2 = toks[p++];
      if (!t2 || t2.t !== 'ident') throw new Err('#REF!');
      const b = matchRef(t2.v);
      if (a && b) return { k: 'range', sheet, r1: a.r, c1: a.c, r2: b.r, c2: b.c };
      if (/^[A-Za-z]{1,3}$/.test(word) && /^[A-Za-z]{1,3}$/.test(t2.v))       // whole columns A:C
        return { k: 'range', sheet, r1: 0, c1: colIndex(word), r2: -1, c2: colIndex(t2.v) };
      if (/^\d{1,7}$/.test(word) && /^\d{1,7}$/.test(t2.v))                   // whole rows 2:5
        return { k: 'range', sheet, r1: +word - 1, c1: 0, r2: +t2.v - 1, c2: -1 };
      throw new Err('#REF!');
    }
    if (a) return { k: 'ref', sheet, r: a.r, c: a.c };
    throw new Err('#NAME?');
  }

  const out = expr();
  if (p !== toks.length) throw new Err('#ERROR!');
  return out;
}

/* =======================================================================
   Evaluation
   ======================================================================= */
const RANGE = Symbol('range');
const isRange = v => v && typeof v === 'object' && v[RANGE] === true;

let calcCache = new Map();
let calcVisit = new Set();
const CUR = { r: 0, c: 0 };            // cell currently being evaluated (for ROW/COLUMN)
function invalidate() { calcCache = new Map(); }

function literalValue(raw) {
  const s = String(raw);
  if (s[0] === "'") return s.slice(1);
  const t = s.trim();
  if (t === '') return null;
  const up = t.toUpperCase();
  if (up === 'TRUE') return true;
  if (up === 'FALSE') return false;
  if (/^-?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(t)) return parseFloat(t);
  if (/^-?(\d+\.?\d*|\.\d+)%$/.test(t)) return parseFloat(t) / 100;
  return s;
}

function cellValue(si, r, c) {
  const sh = WB.sheets[si];
  if (!sh || r < 0 || c < 0) return new Err('#REF!');
  const key = si + ':' + r + ':' + c;
  if (calcCache.has(key)) return calcCache.get(key);
  if (calcVisit.has(key)) return new Err('#CIRC!');
  const cell = sh.cells[addrOf(r, c)];
  if (!cell || cell.v === '' || cell.v == null) { calcCache.set(key, null); return null; }
  const raw = String(cell.v);
  let out;
  if (raw[0] === '=') {
    calcVisit.add(key);
    const pr = CUR.r, pc = CUR.c;
    CUR.r = r; CUR.c = c;
    try {
      out = evalNode(parseFormula(raw.slice(1)), si);
      if (isRange(out)) out = rangeScalar(out);
    } catch (e) {
      out = isErr(e) ? e : new Err('#ERROR!');
    } finally {
      calcVisit.delete(key);
      CUR.r = pr; CUR.c = pc;
    }
    if (typeof out === 'number' && !isFinite(out)) out = new Err('#NUM!');
  } else {
    out = literalValue(raw);
  }
  calcCache.set(key, out);
  return out;
}

function resolveSheet(name, si) {
  if (name == null) return si;
  const idx = sheetIndexByName(name);
  if (idx < 0) throw new Err('#REF!');
  return idx;
}

function makeRange(n, si) {
  const s = resolveSheet(n.sheet, si);
  const sh = WB.sheets[s];
  let r1 = n.r1, r2 = n.r2 < 0 ? sh.rows - 1 : n.r2;
  let c1 = n.c1, c2 = n.c2 < 0 ? sh.cols - 1 : n.c2;
  if (r1 > r2) { const t = r1; r1 = r2; r2 = t; }
  if (c1 > c2) { const t = c1; c1 = c2; c2 = t; }
  return { [RANGE]: true, si: s, r1, c1, r2, c2 };
}
function rangeValues(rg) {
  const out = [];
  for (let r = rg.r1; r <= rg.r2; r++)
    for (let c = rg.c1; c <= rg.c2; c++) out.push(cellValue(rg.si, r, c));
  return out;
}
function rangeScalar(rg) {
  if (rg.r1 === rg.r2 && rg.c1 === rg.c2) {
    const v = cellValue(rg.si, rg.r1, rg.c1);
    if (isErr(v)) throw v;
    return v;
  }
  throw new Err('#VALUE!');
}

function num(v) {
  if (isErr(v)) throw v;
  if (isRange(v)) return num(rangeScalar(v));
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  const t = String(v).trim();
  if (t === '') return 0;
  const n = Number(t.replace(/,/g, ''));
  if (isNaN(n)) throw new Err('#VALUE!');
  return n;
}
function text(v) {
  if (isErr(v)) throw v;
  if (isRange(v)) return text(rangeScalar(v));
  if (v == null) return '';
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  if (typeof v === 'number') return general(v);
  return String(v);
}
function bool(v) {
  if (isErr(v)) throw v;
  if (isRange(v)) return bool(rangeScalar(v));
  if (v == null) return false;
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  const t = String(v).trim().toUpperCase();
  if (t === 'TRUE') return true;
  if (t === 'FALSE' || t === '') return false;
  throw new Err('#VALUE!');
}

function evalNode(n, si) {
  switch (n.k) {
    case 'num': case 'str': case 'bool': return n.v;
    case 'err': throw new Err(n.v);
    case 'ref': {
      const s = resolveSheet(n.sheet, si);
      const v = cellValue(s, n.r, n.c);
      if (isErr(v)) throw v;
      return v;
    }
    case 'range': return makeRange(n, si);
    case 'un': { const v = num(evalNode(n.a, si)); return n.op === '-' ? -v : v; }
    case 'pct': return num(evalNode(n.a, si)) / 100;
    case 'bin': return binop(n.op, n.a, n.b, si);
    case 'fn': return callFn(n, si);
  }
  throw new Err('#ERROR!');
}

function binop(op, an, bn, si) {
  const a = evalNode(an, si), b = evalNode(bn, si);
  if (op === '&') return text(a) + text(b);
  if (op === '=' || op === '<>' || op === '<' || op === '>' || op === '<=' || op === '>=') {
    const cmp = compareVals(a, b);
    switch (op) {
      case '=': return cmp === 0;
      case '<>': return cmp !== 0;
      case '<': return cmp < 0;
      case '>': return cmp > 0;
      case '<=': return cmp <= 0;
      case '>=': return cmp >= 0;
    }
  }
  const x = num(a), y = num(b);
  switch (op) {
    case '+': return x + y;
    case '-': return x - y;
    case '*': return x * y;
    case '/': if (y === 0) throw new Err('#DIV/0!'); return x / y;
    case '^': { const r = Math.pow(x, y); if (isNaN(r)) throw new Err('#NUM!'); return r; }
  }
  throw new Err('#ERROR!');
}

function compareVals(a, b) {
  if (isErr(a)) throw a;
  if (isErr(b)) throw b;
  if (isRange(a)) a = rangeScalar(a);
  if (isRange(b)) b = rangeScalar(b);
  const na = a == null || typeof a === 'number' || typeof a === 'boolean';
  const nb = b == null || typeof b === 'number' || typeof b === 'boolean';
  if (na && nb) { const x = num(a), y = num(b); return x < y ? -1 : x > y ? 1 : 0; }
  const x = text(a).toLowerCase(), y = text(b).toLowerCase();
  return x < y ? -1 : x > y ? 1 : 0;
}

/* ---------- argument helpers ---------- */
function flatVals(args) {
  const out = [];
  for (const a of args) {
    if (isRange(a)) { for (const v of rangeValues(a)) out.push(v); }
    else out.push(a);
  }
  return out;
}
function flatNums(args) {
  const out = [];
  for (const a of args) {
    if (isRange(a)) {
      for (const v of rangeValues(a)) {
        if (isErr(v)) throw v;
        if (typeof v === 'number') out.push(v);
      }
    } else {
      if (isErr(a)) throw a;
      if (a == null) continue;
      out.push(num(a));
    }
  }
  return out;
}
const need = (args, k) => { if (args.length < k) throw new Err('#N/A'); };
const sum = a => a.reduce((x, y) => x + y, 0);

function criterionTest(crit) {
  if (isRange(crit)) crit = rangeScalar(crit);
  if (typeof crit === 'string') {
    const m = /^\s*(<=|>=|<>|<|>|=)\s*(.*)$/.exec(crit);
    if (m) {
      const op = m[1], rhsRaw = m[2].trim();
      const rhs = /^-?\d*\.?\d+$/.test(rhsRaw) ? parseFloat(rhsRaw) : rhsRaw;
      return v => {
        try {
          const c = compareVals(v, rhs);
          return op === '=' ? c === 0 : op === '<>' ? c !== 0 : op === '<' ? c < 0
            : op === '>' ? c > 0 : op === '<=' ? c <= 0 : c >= 0;
        } catch (e) { return false; }
      };
    }
  }
  return v => { try { return compareVals(v, crit) === 0; } catch (e) { return false; } };
}

/* =======================================================================
   Function library
   ======================================================================= */
const FUNCS = {
  SUM: a => sum(flatNums(a)),
  PRODUCT: a => flatNums(a).reduce((x, y) => x * y, 1),
  AVERAGE: a => { const n = flatNums(a); if (!n.length) throw new Err('#DIV/0!'); return sum(n) / n.length; },
  MIN: a => { const n = flatNums(a); return n.length ? Math.min.apply(null, n) : 0; },
  MAX: a => { const n = flatNums(a); return n.length ? Math.max.apply(null, n) : 0; },
  COUNT: a => flatNums(a).length,
  COUNTA: a => flatVals(a).filter(v => v !== null && v !== '').length,
  COUNTBLANK: a => flatVals(a).filter(v => v === null || v === '').length,
  MEDIAN: a => {
    const n = flatNums(a).sort((x, y) => x - y);
    if (!n.length) throw new Err('#NUM!');
    const m = n.length >> 1;
    return n.length % 2 ? n[m] : (n[m - 1] + n[m]) / 2;
  },
  STDEV: a => {
    const n = flatNums(a);
    if (n.length < 2) throw new Err('#DIV/0!');
    const mu = sum(n) / n.length;
    return Math.sqrt(sum(n.map(x => (x - mu) * (x - mu))) / (n.length - 1));
  },
  VAR: a => {
    const n = flatNums(a);
    if (n.length < 2) throw new Err('#DIV/0!');
    const mu = sum(n) / n.length;
    return sum(n.map(x => (x - mu) * (x - mu))) / (n.length - 1);
  },
  ABS: a => Math.abs(num(a[0])),
  SIGN: a => Math.sign(num(a[0])),
  SQRT: a => { const v = num(a[0]); if (v < 0) throw new Err('#NUM!'); return Math.sqrt(v); },
  POWER: a => { need(a, 2); return Math.pow(num(a[0]), num(a[1])); },
  EXP: a => Math.exp(num(a[0])),
  LN: a => { const v = num(a[0]); if (v <= 0) throw new Err('#NUM!'); return Math.log(v); },
  LOG10: a => { const v = num(a[0]); if (v <= 0) throw new Err('#NUM!'); return Math.log10(v); },
  LOG: a => { const v = num(a[0]); const b = a.length > 1 ? num(a[1]) : 10; if (v <= 0) throw new Err('#NUM!'); return Math.log(v) / Math.log(b); },
  MOD: a => { need(a, 2); const d = num(a[1]); if (d === 0) throw new Err('#DIV/0!'); const n = num(a[0]); return n - d * Math.floor(n / d); },
  INT: a => Math.floor(num(a[0])),
  TRUNC: a => Math.trunc(num(a[0])),
  ROUND: a => { const d = a.length > 1 ? num(a[1]) : 0, f = Math.pow(10, d); const v = num(a[0]) * f; return (v < 0 ? -Math.round(-v) : Math.round(v)) / f; },
  ROUNDUP: a => { const d = a.length > 1 ? num(a[1]) : 0, f = Math.pow(10, d); const v = num(a[0]) * f; return (v < 0 ? -Math.ceil(-v) : Math.ceil(v)) / f; },
  ROUNDDOWN: a => { const d = a.length > 1 ? num(a[1]) : 0, f = Math.pow(10, d); const v = num(a[0]) * f; return (v < 0 ? -Math.floor(-v) : Math.floor(v)) / f; },
  CEILING: a => { const s = a.length > 1 ? num(a[1]) : 1; if (s === 0) return 0; return Math.ceil(num(a[0]) / s) * s; },
  FLOOR: a => { const s = a.length > 1 ? num(a[1]) : 1; if (s === 0) throw new Err('#DIV/0!'); return Math.floor(num(a[0]) / s) * s; },
  PI: () => Math.PI,
  RAND: () => Math.random(),
  RANDBETWEEN: a => { need(a, 2); const lo = Math.ceil(num(a[0])), hi = Math.floor(num(a[1])); return lo + Math.floor(Math.random() * (hi - lo + 1)); },
  SIN: a => Math.sin(num(a[0])), COS: a => Math.cos(num(a[0])), TAN: a => Math.tan(num(a[0])),
  ATAN: a => Math.atan(num(a[0])), ASIN: a => Math.asin(num(a[0])), ACOS: a => Math.acos(num(a[0])),
  ATAN2: a => { need(a, 2); return Math.atan2(num(a[1]), num(a[0])); },
  DEGREES: a => num(a[0]) * 180 / Math.PI,
  RADIANS: a => num(a[0]) * Math.PI / 180,

  AND: a => flatVals(a).every(v => v == null ? true : bool(v)),
  OR: a => flatVals(a).some(v => v == null ? false : bool(v)),
  NOT: a => !bool(a[0]),
  XOR: a => flatVals(a).filter(v => v != null && bool(v)).length % 2 === 1,
  ISBLANK: a => a[0] == null || (isRange(a[0]) && rangeScalar(a[0]) == null),
  ISNUMBER: a => typeof (isRange(a[0]) ? rangeScalar(a[0]) : a[0]) === 'number',
  ISTEXT: a => typeof (isRange(a[0]) ? rangeScalar(a[0]) : a[0]) === 'string',

  CONCAT: a => flatVals(a).map(text).join(''),
  CONCATENATE: a => a.map(text).join(''),
  LEN: a => text(a[0]).length,
  UPPER: a => text(a[0]).toUpperCase(),
  LOWER: a => text(a[0]).toLowerCase(),
  PROPER: a => text(a[0]).replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase()),
  TRIM: a => text(a[0]).trim().replace(/\s+/g, ' '),
  LEFT: a => text(a[0]).slice(0, a.length > 1 ? num(a[1]) : 1),
  RIGHT: a => { const n = a.length > 1 ? num(a[1]) : 1; const s = text(a[0]); return n <= 0 ? '' : s.slice(-n); },
  MID: a => { need(a, 3); const st = num(a[1]); if (st < 1) throw new Err('#VALUE!'); return text(a[0]).substr(st - 1, num(a[2])); },
  REPT: a => { need(a, 2); const n = num(a[1]); if (n < 0) throw new Err('#VALUE!'); return text(a[0]).repeat(Math.min(n, 5000)); },
  SUBSTITUTE: a => { need(a, 3); return text(a[0]).split(text(a[1])).join(text(a[2])); },
  FIND: a => { need(a, 2); const i = text(a[1]).indexOf(text(a[0])); if (i < 0) throw new Err('#VALUE!'); return i + 1; },
  VALUE: a => num(a[0]),

  SUMIF: a => {
    need(a, 2);
    if (!isRange(a[0])) throw new Err('#VALUE!');
    const test = criterionTest(a[1]);
    const src = rangeValues(a[0]);
    const tgt = a.length > 2 && isRange(a[2]) ? rangeValues(a[2]) : src;
    let t = 0;
    for (let i = 0; i < src.length; i++) {
      if (test(src[i])) { const v = tgt[i]; if (typeof v === 'number') t += v; }
    }
    return t;
  },
  COUNTIF: a => {
    need(a, 2);
    if (!isRange(a[0])) throw new Err('#VALUE!');
    const test = criterionTest(a[1]);
    return rangeValues(a[0]).filter(test).length;
  },
  AVERAGEIF: a => {
    need(a, 2);
    if (!isRange(a[0])) throw new Err('#VALUE!');
    const test = criterionTest(a[1]);
    const src = rangeValues(a[0]);
    const tgt = a.length > 2 && isRange(a[2]) ? rangeValues(a[2]) : src;
    let t = 0, n = 0;
    for (let i = 0; i < src.length; i++) {
      if (test(src[i])) { const v = tgt[i]; if (typeof v === 'number') { t += v; n++; } }
    }
    if (!n) throw new Err('#DIV/0!');
    return t / n;
  },
  VLOOKUP: a => {
    need(a, 3);
    if (!isRange(a[1])) throw new Err('#VALUE!');
    const rg = a[1], col = num(a[2]);
    if (col < 1 || rg.c1 + col - 1 > rg.c2) throw new Err('#REF!');
    for (let r = rg.r1; r <= rg.r2; r++) {
      if (compareVals(cellValue(rg.si, r, rg.c1), a[0]) === 0)
        return cellValue(rg.si, r, rg.c1 + col - 1);
    }
    throw new Err('#N/A');
  },
  INDEX: a => {
    need(a, 2);
    if (!isRange(a[0])) throw new Err('#VALUE!');
    const rg = a[0], row = num(a[1]), col = a.length > 2 ? num(a[2]) : 1;
    const r = rg.r1 + row - 1, c = rg.c1 + col - 1;
    if (row < 1 || col < 1 || r > rg.r2 || c > rg.c2) throw new Err('#REF!');
    return cellValue(rg.si, r, c);
  },
  MATCH: a => {
    need(a, 2);
    if (!isRange(a[1])) throw new Err('#VALUE!');
    const vals = rangeValues(a[1]);
    for (let i = 0; i < vals.length; i++) if (compareVals(vals[i], a[0]) === 0) return i + 1;
    throw new Err('#N/A');
  },

  TODAY: () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
  NOW: () => new Date().toLocaleString(),
  ROW: (a, si, node) => node.args.length ? (node.args[0].k === 'ref' ? node.args[0].r + 1 : node.args[0].r1 + 1) : CUR.r + 1,
  COLUMN: (a, si, node) => node.args.length ? (node.args[0].k === 'ref' ? node.args[0].c + 1 : node.args[0].c1 + 1) : CUR.c + 1
};

const LAZY = {
  IF: (node, si) => {
    if (node.args.length < 2) throw new Err('#N/A');
    const c = bool(evalNode(node.args[0], si));
    if (c) return evalNode(node.args[1], si);
    return node.args.length > 2 ? evalNode(node.args[2], si) : false;
  },
  IFERROR: (node, si) => {
    if (node.args.length < 2) throw new Err('#N/A');
    try {
      const v = evalNode(node.args[0], si);
      return isRange(v) ? rangeScalar(v) : v;
    } catch (e) {
      if (!isErr(e)) throw e;
      return evalNode(node.args[1], si);
    }
  },
  ISERROR: (node, si) => {
    try { const v = evalNode(node.args[0], si); if (isRange(v)) rangeScalar(v); return false; }
    catch (e) { if (!isErr(e)) throw e; return true; }
  }
};

function callFn(node, si) {
  const lazy = LAZY[node.name];
  if (lazy) return lazy(node, si);
  const fn = FUNCS[node.name];
  if (!fn) throw new Err('#NAME?');
  const args = node.args.map(a => evalNode(a, si));
  const out = fn(args, si, node);
  if (isErr(out)) throw out;
  if (isRange(out)) return rangeScalar(out);
  return out;
}

/* =======================================================================
   Number formatting
   ======================================================================= */
function general(n) {
  if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
  const r = Number(n.toPrecision(12));
  const abs = Math.abs(r);
  if (abs !== 0 && (abs >= 1e12 || abs < 1e-9)) return sci(r, 6);
  return String(r);
}
function sci(n, d) {
  return n.toExponential(d).replace(/e([+-])(\d)$/, 'e$10$2').toUpperCase();
}
const grp = (n, d) => n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });

function fmtNum(n, f) {
  switch (f) {
    case 'int': return grp(Math.round(n), 0);
    case 'num': return grp(n, 2);
    case 'cur': return (n < 0 ? '-$' : '$') + grp(Math.abs(n), 2);
    case 'pct': return grp(n * 100, 1) + '%';
    case 'sci': return sci(n, 2);
    default: return general(n);
  }
}

/* ---------- what a cell shows ---------- */
function displayOf(si, r, c) {
  const sh = WB.sheets[si];
  const cell = sh.cells[addrOf(r, c)];
  if (!cell || !cell.v) return { s: '', k: 'blank' };
  const v = cellValue(si, r, c);
  if (isErr(v)) return { s: v.code, k: 'err' };
  if (v === null) return { s: '', k: 'blank' };
  if (typeof v === 'number') return { s: fmtNum(v, cell.f), k: 'num' };
  if (typeof v === 'boolean') return { s: v ? 'TRUE' : 'FALSE', k: 'bool' };
  return { s: String(v), k: 'text' };
}
/* =======================================================================
   DOM wiring
   ======================================================================= */
const gridwrap = $('#gridwrap'), gridinner = $('#gridinner'), grid = $('#grid');
const selbox = $('#selbox'), fillbox = $('#fillbox'), handle = $('#handle');
const editor = $('#editor'), fxInput = $('#fxInput'), nameBox = $('#nameBox');
const sheetbar = $('#sheetbar'), menuEl = $('#menu'), toastEl = $('#toast');
const ROWHEAD = 48;

let cellEls = [];          // [r][c] -> <td>
let colEls = [];           // <col> elements
let rowEls = [];           // <tr> elements
let headEls = [];          // column header <th>
let sideEls = [];          // row header <th>

let sel = { ar: 0, ac: 0, fr: 0, fc: 0 };
const rect = () => ({
  r1: Math.min(sel.ar, sel.fr), r2: Math.max(sel.ar, sel.fr),
  c1: Math.min(sel.ac, sel.fc), c2: Math.max(sel.ac, sel.fc)
});

let editing = false, editFocus = 'cell', mirroring = false;
let refIns = null, refDrag = null;
let dragSel = false, fillDrag = null, resizing = null;
let painted = [], refPainted = [];

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => toastEl.classList.remove('show'), 2200);

/* =======================================================================
   Grid construction
   ======================================================================= */
function buildGrid() {
  const sh = S();
  const parts = [];
  parts.push('<colgroup><col style="width:' + ROWHEAD + 'px">');
  for (let c = 0; c < sh.cols; c++) parts.push('<col style="width:' + colW(sh, c) + 'px">');
  parts.push('</colgroup><thead><tr><th class="corner" data-corner="1"></th>');
  for (let c = 0; c < sh.cols; c++)
    parts.push('<th data-c="' + c + '">' + colName(c) + '<i class="rz"></i></th>');
  parts.push('</tr></thead><tbody>');
  for (let r = 0; r < sh.rows; r++) {
    parts.push('<tr style="height:' + rowH(sh, r) + 'px"><th data-r="' + r + '">' + (r + 1) + '<i class="rzr"></i></th>');
    for (let c = 0; c < sh.cols; c++) parts.push('<td data-r="' + r + '" data-c="' + c + '"></td>');
    parts.push('</tr>');
  }
  parts.push('</tbody>');
  grid.innerHTML = parts.join('');

  colEls = Array.prototype.slice.call(grid.querySelectorAll('col')).slice(1);
  headEls = Array.prototype.slice.call(grid.querySelectorAll('thead th')).slice(1);
  rowEls = Array.prototype.slice.call(grid.querySelectorAll('tbody tr'));
  sideEls = rowEls.map(tr => tr.firstElementChild);
  cellEls = rowEls.map(tr => Array.prototype.slice.call(tr.children).slice(1));
  painted = []; refPainted = [];
}

/* =======================================================================
   Painting
   ======================================================================= */
function renderAll() {
  invalidate();
  const sh = S(), si = WB.active;
  for (let r = 0; r < sh.rows; r++) {
    const row = cellEls[r];
    for (let c = 0; c < sh.cols; c++) paintCell(si, sh, r, c, row[c]);
  }
  painted = [];
  paintSelection();
  paintRefHints();
  updateStatus();
}

function paintCell(si, sh, r, c, td) {
  const cell = sh.cells[addrOf(r, c)];
  const d = displayOf(si, r, c);
  td.textContent = d.s;
  let cls = '';
  if (d.k === 'err') cls = 'err';
  const st = td.style;
  if (!cell) {
    if (st.cssText) st.cssText = '';
    if (d.k === 'num') cls += (cls ? ' ' : '') + 'num';
    td.className = cls;
    return;
  }
  st.fontWeight = cell.b ? '600' : '';
  st.fontStyle = cell.i ? 'italic' : '';
  st.textDecoration = cell.u ? 'underline' : '';
  st.backgroundColor = cell.bg || '';
  st.color = cell.fg || '';
  if (cell.al) st.textAlign = cell.al;
  else { st.textAlign = ''; if (d.k === 'num') cls += (cls ? ' ' : '') + 'num'; else if (d.k === 'bool') cls += (cls ? ' ' : '') + 'ctr'; }
  td.className = cls;
}

function repaintCell(r, c) {
  paintCell(WB.active, S(), r, c, cellEls[r][c]);
}

function paintSelection() {
  for (const td of painted) td.classList.remove('sel', 'anchor');
  painted = [];
  for (const th of headEls) th.classList.remove('hl', 'full');
  for (const th of sideEls) th.classList.remove('hl', 'full');

  const q = rect(), sh = S();
  const wholeCols = q.r1 === 0 && q.r2 >= sh.rows - 1;
  const wholeRows = q.c1 === 0 && q.c2 >= sh.cols - 1;
  for (let r = q.r1; r <= q.r2 && r < sh.rows; r++) {
    for (let c = q.c1; c <= q.c2 && c < sh.cols; c++) {
      const td = cellEls[r][c];
      if (!td) continue;
      td.classList.add('sel');
      if (r === sel.ar && c === sel.ac) td.classList.add('anchor');
      painted.push(td);
    }
  }
  for (let c = q.c1; c <= q.c2 && c < sh.cols; c++) headEls[c].classList.add(wholeCols ? 'full' : 'hl');
  for (let r = q.r1; r <= q.r2 && r < sh.rows; r++) sideEls[r].classList.add(wholeRows ? 'full' : 'hl');

  positionSelbox();
  nameBox.value = q.r1 === q.r2 && q.c1 === q.c2 ? addrOf(q.r1, q.c1)
    : addrOf(q.r1, q.c1) + ':' + addrOf(q.r2, q.c2);
  if (!editing) {
    const cell = S().cells[addrOf(sel.ar, sel.ac)];
    fxInput.value = cell ? String(cell.v) : '';
  }
  syncToolbar();
}

function positionSelbox() {
  const q = rect(), sh = S();
  const a = cellEls[q.r1] && cellEls[q.r1][q.c1];
  const b = cellEls[Math.min(q.r2, sh.rows - 1)] && cellEls[Math.min(q.r2, sh.rows - 1)][Math.min(q.c2, sh.cols - 1)];
  if (!a || !b) { selbox.style.display = 'none'; return; }
  selbox.style.display = 'block';
  selbox.style.left = a.offsetLeft + 'px';
  selbox.style.top = a.offsetTop + 'px';
  selbox.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft) + 'px';
  selbox.style.height = (b.offsetTop + b.offsetHeight - a.offsetTop) + 'px';
}

/* ---------- reference hints while editing a formula ---------- */
const REF_SCAN = /(?<![A-Za-z0-9_$!])(\$?[A-Za-z]{1,3}\$?\d{1,7})(?:\s*:\s*(\$?[A-Za-z]{1,3}\$?\d{1,7}))?(?![A-Za-z0-9_(])/g;

function paintRefHints() {
  for (const td of refPainted) td.classList.remove('r0', 'r1', 'r2', 'r3', 'r4');
  refPainted = [];
  if (!editing) return;
  const txt = activeEl().value;
  if (txt[0] !== '=') return;
  const body = txt.slice(1).replace(/"(?:[^"]|"")*"/g, m => ' '.repeat(m.length));
  const sh = S();
  let m, i = 0;
  REF_SCAN.lastIndex = 0;
  while ((m = REF_SCAN.exec(body))) {
    const a = matchRef(m[1]), b = m[2] ? matchRef(m[2]) : null;
    if (!a) continue;
    const r1 = Math.min(a.r, b ? b.r : a.r), r2 = Math.max(a.r, b ? b.r : a.r);
    const c1 = Math.min(a.c, b ? b.c : a.c), c2 = Math.max(a.c, b ? b.c : a.c);
    const cls = 'r' + (i++ % 5);
    for (let r = r1; r <= r2 && r < sh.rows; r++)
      for (let c = c1; c <= c2 && c < sh.cols; c++) {
        const td = cellEls[r] && cellEls[r][c];
        if (td) { td.classList.add(cls); refPainted.push(td); }
      }
    if (i > 12) break;
  }
}

/* ---------- status bar ---------- */
function updateStatus() {
  const q = rect(), si = WB.active;
  const one = q.r1 === q.r2 && q.c1 === q.c2;
  $('#statSel').textContent = one ? addrOf(q.r1, q.c1)
    : (q.r2 - q.r1 + 1) + 'R \u00d7 ' + (q.c2 - q.c1 + 1) + 'C  ' + addrOf(q.r1, q.c1) + ':' + addrOf(q.r2, q.c2);
  const nums = [];
  let filled = 0;
  const cap = 20000;
  let n = 0;
  for (let r = q.r1; r <= q.r2; r++) for (let c = q.c1; c <= q.c2; c++) {
    if (++n > cap) break;
    const v = cellValue(si, r, c);
    if (v === null || isErr(v)) continue;
    filled++;
    if (typeof v === 'number') nums.push(v);
  }
  if (nums.length >= 1 && !one) {
    const t = sum(nums);
    $('#statAgg').innerHTML = 'Count <b>' + filled + '</b> \u00b7 Sum <b>' + general(Number(t.toPrecision(12))) +
      '</b> \u00b7 Average <b>' + general(Number((t / nums.length).toPrecision(12))) +
      '</b> \u00b7 Min <b>' + general(Math.min.apply(null, nums)) +
      '</b> \u00b7 Max <b>' + general(Math.max.apply(null, nums)) + '</b>';
  } else {
    $('#statAgg').textContent = '';
  }
}

function syncToolbar() {
  const cell = S().cells[addrOf(sel.ar, sel.ac)] || {};
  setOn('bold', !!cell.b); setOn('italic', !!cell.i); setOn('underline', !!cell.u);
  setOn('alignleft', cell.al === 'left'); setOn('aligncenter', cell.al === 'center'); setOn('alignright', cell.al === 'right');
  $('#numFmt').value = cell.f || '';
  $('#toolbar').querySelector('[data-act=undo]').disabled = !undoStack.length;
  $('#toolbar').querySelector('[data-act=redo]').disabled = !redoStack.length;
}
function setOn(act, on) {
  const b = $('#toolbar').querySelector('[data-act=' + act + ']');
  if (b) b.classList.toggle('on', on);
}

/* =======================================================================
   Selection
   ======================================================================= */
function setSel(r, c, extend) {
  const sh = S();
  r = clamp(r, 0, sh.rows - 1); c = clamp(c, 0, sh.cols - 1);
  if (extend) { sel.fr = r; sel.fc = c; }
  else { sel.ar = sel.fr = r; sel.ac = sel.fc = c; }
  paintSelection();
  paintRefHints();
  updateStatus();
}
function moveSel(dr, dc, extend) {
  if (extend) setSel(sel.fr + dr, sel.fc + dc, true);
  else { setSel(sel.ar + dr, sel.ac + dc, false); ensureVisible(sel.ar, sel.ac); }
  if (extend) ensureVisible(sel.fr, sel.fc);
}
function ensureVisible(r, c) {
  const td = cellEls[r] && cellEls[r][c];
  if (!td) return;
  const padL = ROWHEAD, padT = 25;
  const l = td.offsetLeft, t = td.offsetTop, w = td.offsetWidth, h = td.offsetHeight;
  if (l - padL < gridwrap.scrollLeft) gridwrap.scrollLeft = Math.max(0, l - padL);
  else if (l + w > gridwrap.scrollLeft + gridwrap.clientWidth) gridwrap.scrollLeft = l + w - gridwrap.clientWidth;
  if (t - padT < gridwrap.scrollTop) gridwrap.scrollTop = Math.max(0, t - padT);
  else if (t + h > gridwrap.scrollTop + gridwrap.clientHeight) gridwrap.scrollTop = t + h - gridwrap.clientHeight;
}

/* =======================================================================
   Undo / redo
   ======================================================================= */
const undoStack = [], redoStack = [];
const LIMIT = 80;
function snapshot() {
  return JSON.stringify({ s: WB.sheets, a: WB.active, n: WB.name });
}
function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > LIMIT) undoStack.shift();
  redoStack.length = 0;
}
function restore(json) {
  const o = JSON.parse(json);
  WB.sheets = o.s; WB.active = o.a; WB.name = o.n;
  $('#wbName').value = WB.name;
  const sh = S();
  sel.ar = clamp(sel.ar, 0, sh.rows - 1); sel.ac = clamp(sel.ac, 0, sh.cols - 1);
  sel.fr = clamp(sel.fr, 0, sh.rows - 1); sel.fc = clamp(sel.fc, 0, sh.cols - 1);
  buildGrid(); renderTabs(); renderAll();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  restore(undoStack.pop());
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  restore(redoStack.pop());
}

/* =======================================================================
   Editing
   ======================================================================= */
const activeEl = () => editFocus === 'fx' ? fxInput : editor;

function beginEdit(seed, from, keepCaret) {
  const sh = S(), r = sel.ar, c = sel.ac;
  const td = cellEls[r][c];
  if (!td) return;
  editing = true;
  editFocus = from === 'fx' ? 'fx' : 'cell';
  refIns = null;
  const cell = sh.cells[addrOf(r, c)];
  const val = seed != null ? seed : (cell ? String(cell.v) : '');
  editor.style.display = 'block';
  editor.style.left = td.offsetLeft + 'px';
  editor.style.top = td.offsetTop + 'px';
  editor.style.minWidth = td.offsetWidth + 'px';
  editor.style.width = Math.max(td.offsetWidth, 120) + 'px';
  editor.style.height = td.offsetHeight + 'px';
  editor.style.textAlign = cell && cell.al ? cell.al : 'left';
  editor.value = val;
  if (fxInput.value !== val) fxInput.value = val;
  const el = activeEl();
  if (document.activeElement !== el) el.focus();
  if (!keepCaret) { const p = el.value.length; el.setSelectionRange(p, p); }
  paintRefHints();
}

function mirrorFrom(el) {
  if (mirroring) return;
  mirroring = true;
  (el === editor ? fxInput : editor).value = el.value;
  mirroring = false;
}

function commitEdit(dr, dc) {
  if (!editing) return;
  const val = activeEl().value;
  const r = sel.ar, c = sel.ac;
  const sh = S();
  const prev = sh.cells[addrOf(r, c)];
  if (!prev || String(prev.v) !== val) {
    pushUndo();
    const cell = cellMake(sh, r, c);
    cell.v = val;
    if (!val) cellPrune(sh, r, c);
  }
  endEdit();
  renderAll();
  if (dr || dc) { setSel(r + dr, c + dc, false); ensureVisible(sel.ar, sel.ac); }
  gridwrap.focus();
}
function cancelEdit() {
  if (!editing) return;
  endEdit();
  paintSelection();
  paintRefHints();
  gridwrap.focus();
}
function endEdit() {
  editing = false; refIns = null; refDrag = null;
  editor.style.display = 'none';
  editor.value = '';
}

/* ---------- reference picking inside a formula ---------- */
const OPEN_BEFORE = /[=+\-*/^(,:&<>%\s]$/;
function refTarget() {
  if (!editing) return null;
  const el = activeEl();
  if (el.value[0] !== '=') return null;
  const pos = el.selectionStart == null ? el.value.length : el.selectionStart;
  let start = pos, end = pos;
  if (refIns && pos === refIns.end && refIns.start <= pos) { start = refIns.start; end = refIns.end; }
  const before = el.value.slice(0, start);
  if (start > 0 && !OPEN_BEFORE.test(before)) return null;
  return { el, start, end };
}
function writeRef(t, str) {
  const el = t.el;
  const v = el.value;
  el.value = v.slice(0, t.start) + str + v.slice(t.end);
  const pos = t.start + str.length;
  el.setSelectionRange(pos, pos);
  refIns = { start: t.start, end: pos };
  mirroring = true;
  (el === editor ? fxInput : editor).value = el.value;
  mirroring = false;
  paintRefHints();
}

/* =======================================================================
   Cell mutation helpers
   ======================================================================= */
function eachSelected(fn) {
  const q = rect(), sh = S();
  for (let r = q.r1; r <= q.r2; r++) for (let c = q.c1; c <= q.c2; c++) fn(sh, r, c);
}
function styleSelection(mut) {
  pushUndo();
  const sh = S();
  eachSelected((s, r, c) => mut(cellMake(s, r, c), r, c));
  eachSelected((s, r, c) => { cellPrune(s, r, c); });
  renderAll();
}
function toggleStyle(key) {
  const cur = S().cells[addrOf(sel.ar, sel.ac)];
  const on = !(cur && cur[key]);
  styleSelection(cell => { if (on) cell[key] = true; else delete cell[key]; });
}
function clearSelection() {
  pushUndo();
  eachSelected((sh, r, c) => {
    const cell = sh.cells[addrOf(r, c)];
    if (cell) { cell.v = ''; cellPrune(sh, r, c); }
  });
  renderAll();
}

/* =======================================================================
   Autofill
   ======================================================================= */
function shiftFormula(f, dr, dc) {
  return f.replace(/"(?:[^"]|"")*"|(?<![A-Za-z0-9_$])(\$?)([A-Za-z]{1,3})(\$?)(\d{1,7})(?![A-Za-z0-9_(!])/g,
    (m, d1, col, d2, row) => {
      if (m[0] === '"') return m;
      let c = colIndex(col), r = parseInt(row, 10) - 1;
      if (!d1) c += dc;
      if (!d2) r += dr;
      if (c < 0 || r < 0) return '#REF!';
      return d1 + colName(c) + d2 + (r + 1);
    });
}
function fillFrom(base, ext) {
  pushUndo();
  const sh = S();
  const H = base.r2 - base.r1 + 1, W = base.c2 - base.c1 + 1;
  const mod = (n, m) => ((n % m) + m) % m;

  // linear series when the source is a single numeric row or column of 2+ cells
  let step = null, series = null;
  if ((W === 1 || H === 1) && H * W >= 2) {
    const vals = [];
    for (let r = base.r1; r <= base.r2; r++) for (let c = base.c1; c <= base.c2; c++) {
      const cell = sh.cells[addrOf(r, c)];
      const v = cell && String(cell.v)[0] !== '=' ? literalValue(cell.v) : null;
      vals.push(typeof v === 'number' ? v : null);
    }
    if (vals.every(v => v !== null)) {
      const diffs = [];
      for (let i = 1; i < vals.length; i++) diffs.push(vals[i] - vals[i - 1]);
      const d0 = diffs[0];
      if (diffs.every(d => Math.abs(d - d0) < 1e-9)) { step = d0; series = vals; }
    }
  }

  for (let r = ext.r1; r <= ext.r2; r++) {
    for (let c = ext.c1; c <= ext.c2; c++) {
      if (r >= base.r1 && r <= base.r2 && c >= base.c1 && c <= base.c2) continue;
      const sr = base.r1 + mod(r - base.r1, H), sc = base.c1 + mod(c - base.c1, W);
      const src = sh.cells[addrOf(sr, sc)];
      if (!src) { const k = addrOf(r, c); delete sh.cells[k]; continue; }
      const t = cellMake(sh, r, c);
      ['b', 'i', 'u', 'bg', 'fg', 'al', 'f'].forEach(k => { if (src[k]) t[k] = src[k]; else delete t[k]; });
      const raw = String(src.v);
      if (series) {
        const idx = (W === 1) ? (r - base.r1) : (c - base.c1);
        t.v = String(Number((series[0] + step * idx).toPrecision(12)));
      } else if (raw[0] === '=') {
        t.v = '=' + shiftFormula(raw.slice(1), r - sr, c - sc);
      } else {
        t.v = raw;
      }
      cellPrune(sh, r, c);
    }
  }
  renderAll();
}

/* =======================================================================
   Pointer interaction on the grid
   ======================================================================= */
function cellFromEvent(e) {
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const td = el && el.closest ? el.closest('td[data-r]') : null;
  if (!td) return null;
  return { r: +td.dataset.r, c: +td.dataset.c };
}

grid.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const rz = e.target.closest ? e.target.closest('.rz,.rzr') : null;
  if (rz) { startResize(e, rz); return; }

  const corner = e.target.closest('[data-corner]');
  if (corner) {
    const sh = S();
    sel.ar = 0; sel.ac = 0; sel.fr = sh.rows - 1; sel.fc = sh.cols - 1;
    paintSelection(); updateStatus(); gridwrap.focus();
    e.preventDefault(); return;
  }
  const th = e.target.closest('th');
  if (th) {
    const sh = S();
    if (th.dataset.c != null) {
      const c = +th.dataset.c;
      if (e.shiftKey) { sel.fc = c; sel.fr = sh.rows - 1; }
      else { sel.ar = 0; sel.ac = c; sel.fr = sh.rows - 1; sel.fc = c; }
      dragSel = 'col';
    } else if (th.dataset.r != null) {
      const r = +th.dataset.r;
      if (e.shiftKey) { sel.fr = r; sel.fc = sh.cols - 1; }
      else { sel.ar = r; sel.ac = 0; sel.fr = r; sel.fc = sh.cols - 1; }
      dragSel = 'row';
    }
    paintSelection(); updateStatus(); gridwrap.focus();
    e.preventDefault(); return;
  }

  const td = e.target.closest('td[data-r]');
  if (!td) return;
  const r = +td.dataset.r, c = +td.dataset.c;

  const t = refTarget();
  if (t) {                                   // picking a reference for the formula
    e.preventDefault();
    refDrag = { t, r, c };
    writeRef(t, addrOf(r, c));
    return;
  }
  if (editing) commitEdit(0, 0);

  e.preventDefault();
  gridwrap.focus();
  if (e.shiftKey) setSel(r, c, true);
  else setSel(r, c, false);
  dragSel = 'cell';
});

grid.addEventListener('dblclick', e => {
  const td = e.target.closest('td[data-r]');
  if (!td) return;
  setSel(+td.dataset.r, +td.dataset.c, false);
  beginEdit(null, 'cell');
});

handle.addEventListener('mousedown', e => {
  e.preventDefault(); e.stopPropagation();
  if (editing) commitEdit(0, 0);
  fillDrag = { base: rect(), ext: rect() };
  showFillbox(fillDrag.ext);
});

window.addEventListener('mousemove', e => {
  if (resizing) { doResize(e); return; }
  if (refDrag) {
    const p = cellFromEvent(e);
    if (!p) return;
    const a = refDrag, r1 = Math.min(a.r, p.r), r2 = Math.max(a.r, p.r);
    const c1 = Math.min(a.c, p.c), c2 = Math.max(a.c, p.c);
    const str = (r1 === r2 && c1 === c2) ? addrOf(r1, c1) : addrOf(r1, c1) + ':' + addrOf(r2, c2);
    writeRef({ el: a.t.el, start: a.t.start, end: refIns ? refIns.end : a.t.end }, str);
    return;
  }
  if (fillDrag) {
    const p = cellFromEvent(e);
    if (!p) return;
    const b = fillDrag.base;
    const dDown = p.r - b.r2, dUp = b.r1 - p.r, dRight = p.c - b.c2, dLeft = b.c1 - p.c;
    const v = Math.max(dDown, dUp), h = Math.max(dRight, dLeft);
    let ext = { r1: b.r1, r2: b.r2, c1: b.c1, c2: b.c2 };
    if (v <= 0 && h <= 0) { /* inside: no extension */ }
    else if (v >= h) { if (dDown >= dUp) ext.r2 = p.r; else ext.r1 = p.r; }
    else { if (dRight >= dLeft) ext.c2 = p.c; else ext.c1 = p.c; }
    fillDrag.ext = ext;
    showFillbox(ext);
    return;
  }
  if (dragSel) {
    const p = cellFromEvent(e);
    if (!p) return;
    const sh = S();
    if (dragSel === 'col') { sel.fc = p.c; sel.fr = sh.rows - 1; }
    else if (dragSel === 'row') { sel.fr = p.r; sel.fc = sh.cols - 1; }
    else { sel.fr = p.r; sel.fc = p.c; }
    paintSelection(); updateStatus();
    ensureVisible(p.r, p.c);
  }
});

window.addEventListener('mouseup', () => {
  if (resizing) endResize();
  if (fillDrag) {
    const { base, ext } = fillDrag;
    fillbox.style.display = 'none';
    fillDrag = null;
    if (ext.r1 !== base.r1 || ext.r2 !== base.r2 || ext.c1 !== base.c1 || ext.c2 !== base.c2) {
      fillFrom(base, ext);
      sel.ar = ext.r1; sel.ac = ext.c1; sel.fr = ext.r2; sel.fc = ext.c2;
      paintSelection(); updateStatus();
    }
  }
  refDrag = null;
  dragSel = false;
});

function showFillbox(q) {
  const a = cellEls[q.r1][q.c1], b = cellEls[q.r2][q.c2];

  fillbox.style.display = 'block';
  fillbox.style.left = a.offsetLeft + 'px';
  fillbox.style.top = a.offsetTop + 'px';
  fillbox.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft) + 'px';
  fillbox.style.height = (b.offsetTop + b.offsetHeight - a.offsetTop) + 'px';

/* ---------- column / row resizing ---------- */
function startResize(e, rz) {

  }

}

/* =======================================================================
   Keyboard
   ======================================================================= */
function onEditorKey(e) {
  if (e.key === 'Enter') {
    e.preventDefault();

  } else if (e.key === 'Tab') {
    e.preventDefault();
    commitEdit(0, e.shiftKey ? -1 : 1);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    cancelEdit();
  }
}
editor.addEventListener('keydown', onEditorKey);
fxInput.addEventListener('keydown', e => {
  if (!editing && e.key === 'Enter') beginEdit(fxInput.value, 'fx', true);
  if (editing) onEditorKey(e);
});
editor.addEventListener('input', () => { refIns = null; mirrorFrom(editor); paintRefHints(); });
fxInput.addEventListener('input', () => {
  if (!editing) { const p = fxInput.selectionStart; beginEdit(fxInput.value, 'fx', true); fxInput.setSelectionRange(p, p); }
  refIns = null; mirrorFrom(fxInput); paintRefHints();
});
fxInput.addEventListener('focus', () => {

});
editor.addEventListener('focus', () => { editFocus = 'cell'; });

document.addEventListener('keydown', e => {
  const t = e.target;
  if (t === editor || t === fxInput || t === nameBox || t === $('#wbName')) return;
  if (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA') return;
  if (menuEl.style.display === 'block' && e.key === 'Escape') { hideMenu(); return; }

  const mod = e.ctrlKey || e.metaKey;
  const sh = S();

  if (mod && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (k === 'y') { e.preventDefault(); redo(); return; }
    if (k === 'b') { e.preventDefault(); toggleStyle('b'); return; }
    if (k === 'i') { e.preventDefault(); toggleStyle('i'); return; }
    if (k === 'u') { e.preventDefault(); toggleStyle('u'); return; }
    if (k === 'a') { e.preventDefault(); sel.ar = 0; sel.ac = 0; sel.fr = sh.rows - 1; sel.fc = sh.cols - 1; paintSelection(); updateStatus(); return; }
    if (k === 'arrowdown' || k === 'arrowup' || k === 'arrowleft' || k === 'arrowright') {
      e.preventDefault();
      const dir = { arrowdown: [1, 0], arrowup: [-1, 0], arrowleft: [0, -1], arrowright: [0, 1] }[k];
      jump(dir[0], dir[1], e.shiftKey);
      return;
    }
    return;
  }

  switch (e.key) {
    case 'ArrowUp': e.preventDefault(); moveSel(-1, 0, e.shiftKey); break;
    case 'ArrowDown': e.preventDefault(); moveSel(1, 0, e.shiftKey); break;
    case 'ArrowLeft': e.preventDefault(); moveSel(0, -1, e.shiftKey); break;
    case 'ArrowRight': e.preventDefault(); moveSel(0, 1, e.shiftKey); break;
    case 'Tab': e.preventDefault(); moveSel(0, e.shiftKey ? -1 : 1, false); break;
    case 'Enter': e.preventDefault(); beginEdit(null, 'cell'); break;
    case 'F2': e.preventDefault(); beginEdit(null, 'cell'); break;
    case 'Escape': break;
    case 'Delete': case 'Backspace': e.preventDefault(); clearSelection(); break;
    case 'Home': e.preventDefault(); setSel(sel.ar, 0, e.shiftKey); ensureVisible(sel.ar, 0); break;
    case 'End': e.preventDefault(); setSel(sel.ar, sh.cols - 1, e.shiftKey); ensureVisible(sel.ar, sh.cols - 1); break;
    case 'PageDown': e.preventDefault(); moveSel(20, 0, e.shiftKey); break;
    case 'PageUp': e.preventDefault(); moveSel(-20, 0, e.shiftKey); break;
    default:
      if (e.key.length === 1 && !e.altKey) { e.preventDefault(); beginEdit(e.key, 'cell'); }
  }
});

function jump(dr, dc, extend) {
  const sh = S();
  let nr = extend ? sel.fr : sel.ar, nc = extend ? sel.fc : sel.ac;
  const filled = (r, c) => { const x = sh.cells[addrOf(r, c)]; return !!(x && x.v !== ''); };
  const inB = (r, c) => r >= 0 && c >= 0 && r < sh.rows && c < sh.cols;
  if (!inB(nr + dr, nc + dc)) return;
  if (filled(nr + dr, nc + dc)) {
    while (inB(nr + dr, nc + dc) && filled(nr + dr, nc + dc)) { nr += dr; nc += dc; }
  } else {
    while (inB(nr + dr, nc + dc) && !filled(nr + dr, nc + dc)) { nr += dr; nc += dc; }
    if (inB(nr + dr, nc + dc) && filled(nr + dr, nc + dc)) { nr += dr; nc += dc; }
  }
  setSel(nr, nc, extend);
  ensureVisible(nr, nc);
}

/* ---------- clipboard ---------- */
function selectionTSV() {
  const q = rect(), si = WB.active, out = [];
  for (let r = q.r1; r <= q.r2; r++) {
    const row = [];
    for (let c = q.c1; c <= q.c2; c++) row.push(displayOf(si, r, c).s.replace(/[\t\n]/g, ' '));
    out.push(row.join('\t'));
  }
  return out.join('\n');
}
let clip = null;                       // {q, data, tsv}
function grabSelection() {
  const q = rect(), sh = S(), data = [];
  for (let r = q.r1; r <= q.r2; r++) {
    const row = [];
    for (let c = q.c1; c <= q.c2; c++) {
      const cell = sh.cells[addrOf(r, c)];
      row.push(cell ? JSON.parse(JSON.stringify(cell)) : null);
    }
    data.push(row);
  }
  return { q, data, tsv: selectionTSV() };
}
const inField = () => {
  const a = document.activeElement;
  return a === fxInput || a === nameBox || a === editor || a === $('#wbName');
};
document.addEventListener('copy', e => {
  if (editing || inField()) return;
  e.preventDefault();
  clip = grabSelection();
  e.clipboardData.setData('text/plain', clip.tsv);
});
document.addEventListener('cut', e => {
  if (editing || inField()) return;
  e.preventDefault();
  clip = grabSelection();
  e.clipboardData.setData('text/plain', clip.tsv);
  clearSelection();
});
document.addEventListener('paste', e => {
  if (editing || inField()) return;
  e.preventDefault();
  const txt = e.clipboardData.getData('text/plain');
  const sh = S();
  pushUndo();
  if (clip && txt === clip.tsv) {                 // our own cells: keep formulas + formatting
    const data = clip.data;
    const dr = sel.ar - clip.q.r1, dc = sel.ac - clip.q.c1;
    for (let i = 0; i < data.length; i++) for (let j = 0; j < data[i].length; j++) {
      const r = sel.ar + i, c = sel.ac + j;
      if (r >= sh.rows || c >= sh.cols) continue;
      const src = data[i][j], k = addrOf(r, c);
      if (!src) { delete sh.cells[k]; continue; }
      const t = Object.assign({}, src);
      if (String(t.v)[0] === '=') t.v = '=' + shiftFormula(String(t.v).slice(1), dr, dc);
      sh.cells[k] = t;
    }
    sel.fr = Math.min(sh.rows - 1, sel.ar + data.length - 1);
    sel.fc = Math.min(sh.cols - 1, sel.ac + data[0].length - 1);
  } else {
    const rows = txt.replace(/\r/g, '').split('\n');
    if (rows.length && rows[rows.length - 1] === '') rows.pop();
    for (let i = 0; i < rows.length; i++) {
      const cols = rows[i].split('\t');
      for (let j = 0; j < cols.length; j++) {
        const r = sel.ar + i, c = sel.ac + j;
        if (r >= sh.rows || c >= sh.cols) continue;
        cellMake(sh, r, c).v = cols[j];
        cellPrune(sh, r, c);
      }
    }
    sel.fr = Math.min(sh.rows - 1, sel.ar + rows.length - 1);
    sel.fc = Math.min(sh.cols - 1, sel.ac + Math.max.apply(null, rows.map(x => x.split('\t').length)) - 1);
  }
  renderAll();
});

   ======================================================================= */
function renderTabs() {
  sheetbar.innerHTML = '';
  WB.sheets.forEach((s, i) => {

    b.className = 'tab' + (i === WB.active ? ' on' : '');

    b.dataset.i = i;

  });

    null,
    ['Delete sheet', () => deleteSheet(i), true]
  ]);

function uniqueName(base) {
  let n = base, k = 2;
  while (WB.sheets.some(s => s.name.toLowerCase() === n.toLowerCase())) n = base + ' ' + k++;
  return n;
}
function addSheet() {
  pushUndo();
  const s = newSheet(uniqueName('Sheet' + (WB.sheets.length + 1)));
  WB.sheets.push(s);
  switchSheet(WB.sheets.length - 1);
}
function switchSheet(i) {
  if (editing) commitEdit(0, 0);
  WB.active = i;
  sel = { ar: 0, ac: 0, fr: 0, fc: 0 };
  buildGrid(); renderTabs(); renderAll();
  gridwrap.scrollTop = 0; gridwrap.scrollLeft = 0;
  gridwrap.focus();
}
function renameSheet(i) {
  const cur = WB.sheets[i].name;
  const name = prompt('Rename sheet', cur);
  if (name == null) return;
  const t = name.trim();
  if (!t) { toast('Sheet names cannot be empty.'); return; }
  if (/[!:\\/?*\[\]]/.test(t)) { toast('Sheet names cannot contain ! : \\ / ? * [ ]'); return; }
  if (WB.sheets.some((s, j) => j !== i && s.name.toLowerCase() === t.toLowerCase())) {
    toast('Another sheet is already called ' + t + '.');
    return;
  }
  pushUndo();
  WB.sheets[i].name = t;
  renderTabs(); renderAll();
}
function duplicateSheet(i) {

  pushUndo();
  const [s] = WB.sheets.splice(i, 1);

  pushUndo();
  WB.sheets.splice(i, 1);
  switchSheet(clamp(WB.active >= i ? WB.active - 1 : WB.active, 0, WB.sheets.length - 1));

/* ---------- row / column insert & delete ---------- */
function adjustRefs(f, kind, at, delta) {
  return f.replace(/"(?:[^"]|"")*"|(?<![A-Za-z0-9_$])(\$?)([A-Za-z]{1,3})(\$?)(\d{1,7})(?![A-Za-z0-9_(!])/g,
    (m, d1, col, d2, row) => {
      if (m[0] === '"') return m;
      let c = colIndex(col), r = parseInt(row, 10) - 1;
      if (kind === 'row') {
        if (r === at && delta < 0) return '#REF!';
        if (r >= at) r += delta;
      } else {
        if (c === at && delta < 0) return '#REF!';
        if (c >= at) c += delta;
      }
      if (r < 0 || c < 0) return '#REF!';
      return d1 + colName(c) + d2 + (r + 1);
    });
}
function remapFormulas(sh, kind, at, delta) {
  for (const k in sh.cells) {
    const cell = sh.cells[k];
    if (typeof cell.v === 'string' && cell.v[0] === '=')
      cell.v = '=' + adjustRefs(cell.v.slice(1), kind, at, delta);
  }
}
function remapCells(sh, fn) {
  const out = {};
  for (const k in sh.cells) {
    const m = REF_RE.exec(k);
    const r = parseInt(m[2], 10) - 1, c = colIndex(m[1]);
    const t = fn(r, c);
    if (t) out[addrOf(t.r, t.c)] = sh.cells[k];
  }
  sh.cells = out;
}
function insertRow(at) {
  pushUndo();
  const sh = S();
  remapFormulas(sh, 'row', at, 1);
  remapCells(sh, (r, c) => r >= at ? { r: r + 1, c } : { r, c });
  sh.rows++;
  buildGrid(); renderAll();
}
function deleteRow(at) {
  pushUndo();
  const sh = S();
  remapFormulas(sh, 'row', at, -1);
  remapCells(sh, (r, c) => r === at ? null : (r > at ? { r: r - 1, c } : { r, c }));
  if (sh.rows > 1) sh.rows--;
  buildGrid(); renderAll();
}
function insertCol(at) {
  pushUndo();
  const sh = S();
  remapFormulas(sh, 'col', at, 1);
  remapCells(sh, (r, c) => c >= at ? { r, c: c + 1 } : { r, c });
  sh.cols++;
  buildGrid(); renderAll();
}
function deleteCol(at) {
  pushUndo();
  const sh = S();
  remapFormulas(sh, 'col', at, -1);
  remapCells(sh, (r, c) => c === at ? null : (c > at ? { r, c: c - 1 } : { r, c }));
  if (sh.cols > 1) sh.cols--;
  buildGrid(); renderAll();
}

/* =======================================================================
   CSV
   ======================================================================= */
function usedRange(sh) {
  let maxR = -1, maxC = -1;
  for (const k in sh.cells) {
    if (!sh.cells[k].v) continue;
    const m = REF_RE.exec(k);
    const r = parseInt(m[2], 10) - 1, c = colIndex(m[1]);
    if (r > maxR) maxR = r;
    if (c > maxC) maxC = c;
  }
  return { rows: maxR + 1, cols: maxC + 1 };
}
function csvEscape(s) {
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV() {
  const sh = S(), si = WB.active, u = usedRange(sh);
  if (!u.rows) { toast('This sheet is empty — nothing to download.'); return; }
  const lines = [];
  for (let r = 0; r < u.rows; r++) {
    const row = [];
    for (let c = 0; c < u.cols; c++) row.push(csvEscape(displayOf(si, r, c).s));
    lines.push(row.join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = sh.name.replace(/[^\w\- ]+/g, '_') + '.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast('Downloaded ' + a.download);
}
function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', q = false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); cur = ''; rows.push(row); row = []; }
    else if (ch !== '\r') cur += ch;
  }
  row.push(cur);
  rows.push(row);
  while (rows.length && rows[rows.length - 1].every(v => v === '')) rows.pop();
  return rows;
}
$('#csvFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(String(reader.result));
    if (!rows.length) { toast('That file had no rows.'); return; }
    pushUndo();
    const sh = S();
    sh.cells = {};
    sh.rows = Math.max(100, rows.length + 10);
    sh.cols = Math.max(26, Math.min(200, rows.reduce((m, r) => Math.max(m, r.length), 0) + 2));
    rows.forEach((row, r) => row.forEach((v, c) => {
      if (v !== '') cellMake(sh, r, c).v = v;
    }));
    sel = { ar: 0, ac: 0, fr: 0, fc: 0 };
    buildGrid(); renderAll();
    toast('Loaded ' + rows.length + ' rows into ' + sh.name);
  };
  reader.onerror = () => toast('That file could not be read.');
  reader.readAsText(file);
  e.target.value = '';
});
