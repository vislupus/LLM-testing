<script>
(function() {
'use strict';

// ==================== CONFIG ====================
const NUM_COLS = 78; // A to BD
const NUM_ROWS = 1000;
const DEFAULT_COL_WIDTH = 80;
const DEFAULT_ROW_HEIGHT = 24;
const MAX_UNDO = 50;

// ==================== STATE ====================
let sheets = {}; // { sheetName: { cells: { 'A1': { value, formula, format }, colWidths: {} }, ... }
let activeSheet = 'Sheet1';
let currentCell = { col: 0, row: 0 };
let selection = { startCol: 0, startRow: 0, endCol: 0, endRow: 0 };
let isSelecting = false;
let isEditing = false;
let formulaMode = false; // clicking to insert references into formula
let colWidths = {};
let undoStack = [];
let redoStack = [];
let clipboard = null;
let clipboardMode = null; // 'cut' or 'copy'
let isDraggingCol = false;
let dragColStart = 0;
let dragStartX = 0;

// ==================== UTILITIES ====================
function colName(c) {
  let s = '';
  c++;
  while (c > 0) {
    c--;
    s = String.fromCharCode(65 + (c % 26)) + s;
    c = Math.floor(c / 26);
  }
  return s;
}

function colIndex(name) {
  let idx = 0;
  for (let i = 0; i < name.length; i++) {
    idx = idx * 26 + (name.charCodeAt(i) - 64);
  }
  return idx - 1;
}

function cellKey(col, row) {
  return colName(col) + (row + 1);
}

function parseCellRef(ref) {
  ref = ref.trim().toUpperCase();
  const match = ref.match(/^([A-Z]+)(\d+)$/);
  if (!match) return null;
  return { col: colIndex(match[1]), row: parseInt(match[2]) - 1 };
}

function parseRange(rangeStr) {
  rangeStr = rangeStr.trim().toUpperCase();
  const parts = rangeStr.split(':');
  if (parts.length === 2) {
    const a = parseCellRef(parts[0]);
    const b = parseCellRef(parts[1]);
    if (!a || !b) return null;
    return {
      startCol: Math.min(a.col, b.col), startRow: Math.min(a.row, b.row),
      endCol: Math.max(a.col, b.col), endRow: Math.max(a.row, b.row)
    };
  }
  return null;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function getSheetData(name) {
  if (!sheets[name]) {
    sheets[name] = { cells: {}, colWidths: {} };
  }
  return sheets[name];
}

function getCell(sheetName, key) {
  const sd = getSheetData(sheetName || activeSheet);
  return sd.cells[key] || null;
}

function setCell(sheetName, key, data) {
  const sd = getSheetData(sheetName || activeSheet);
  sd.cells[key] = { ...sd.cells[key], ...data };
}

function getCellValue(sheetName, col, row) {
  const sd = getSheetData(sheetName || activeSheet);
  const cell = sd.cells[cellKey(col, row)];
  if (!cell || cell.value === undefined || cell.value === '') return '';
  return cell.value;
}

function getCellFormula(sheetName, col, row) {
  const sd = getSheetData(sheetName || activeSheet);
  const cell = sd.cells[cellKey(col, row)];
  return cell ? (cell.formula || '') : '';
}

// ==================== FORMULA ENGINE ====================
function tokenizeFormula(formula) {
  const tokens = [];
  let i = 0;
  while (i < formula.length) {
    const ch = formula[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      let num = '';
      while (i < formula.length && /[0-9.eE]/.test(formula[i])) num += formula[i++];
      tokens.push({ type: 'number', value: parseFloat(num) });
      continue;
    }
    if (/[a-zA-Z_]/.test(ch)) {
      let word = '';
      while (i < formula.length && /[a-zA-Z0-9_.]/.test(formula[i])) word += formula[i++];
      const upper = word.toUpperCase();
      if (['SUM','AVERAGE','AVG','MIN','MAX','COUNT','COUNTA','IF','ABS','ROUND','INT','MOD','POWER','SQRT','PI','CONCAT','LEN','UPPER','LOWER','TRIM','LEFT','RIGHT','MID','SEARCH','FIND','ISBLANK','AND','OR','NOT','TRUE','FALSE','SUMIF','SUMPRODUCT','VLOOKUP','HLOOKUP','INDEX','MATCH','IFERROR','CEILING','FLOOR','MEDIAN','MODE','STDEV','VAR','PRODUCT','SUBTOTAL'].includes(upper)) {
        tokens.push({ type: 'function', value: upper });
      } else {
        // Could be a cell reference
        const refMatch = word.match(/^([A-Z]+)(\d+)$/);
        if (refMatch) {
          tokens.push({ type: 'ref', value: word.toUpperCase() });
        } else {
          tokens.push({ type: 'ref', value: word.toUpperCase() });
        }
      }
      continue;
    }
    if (ch === '(') { tokens.push({ type: '(', value: '(' }); i++; continue; }
    if (ch === ')') { tokens.push({ type: ')', value: ')' }); i++; continue; }
    if (ch === ',') { tokens.push({ type: ',', value: ',' }); i++; continue; }
    if (ch === ':') { tokens.push({ type: ':', value: ':' }); i++; continue; }
    if (ch === '+') { tokens.push({ type: 'op', value: '+' }); i++; continue; }
    if (ch === '-') { tokens.push({ type: 'op', value: '-' }); i++; continue; }
    if (ch === '*') { tokens.push({ type: 'op', value: '*' }); i++; continue; }
    if (ch === '/') { tokens.push({ type: 'op', value: '/' }); i++; continue; }
    if (ch === '^') { tokens.push({ type: 'op', value: '^' }); i++; continue; }
    if (ch === '%') { tokens.push({ type: 'op', value: '%' }); i++; continue; }
    if (ch === '=') { tokens.push({ type: 'op', value: '=' }); i++; continue; }
    if (ch === '<') {
      if (formula[i+1] === '=') { tokens.push({ type: 'op', value: '<=' }); i += 2; }
      else if (formula[i+1] === '>') { tokens.push({ type: 'op', value: '<>' }); i += 2; }
      else { tokens.push({ type: 'op', value: '<' }); i++; }
      continue;
    }
    if (ch === '>') {
      if (formula[i+1] === '=') { tokens.push({ type: 'op', value: '>=' }); i += 2; }
      else { tokens.push({ type: 'op', value: '>' }); i++; }
      continue;
    }
    if (ch === '"') {
      let str = '';
      i++;
      while (i < formula.length && formula[i] !== '"') {
        if (formula[i] === '"' && formula[i+1] === '"') { str += '"'; i += 2; }
        else { str += formula[i]; i++; }
      }
      if (i < formula.length) i++;
      tokens.push({ type: 'string', value: str });
      continue;
    }
    if (ch === "'") {
      // Sheet reference or quoted reference
      let str = '';
      i++;
      while (i < formula.length && formula[i] !== "'") { str += formula[i]; i++; }
      if (i < formula.length) i++;
      tokens.push({ type: 'string', value: str });
      continue;
    }
    i++; // skip unknown
  }
  return tokens;
}

function evaluateFormula(formula, sheetName) {
  try {
    const tokens = tokenizeFormula(formula);
    if (tokens.length === 0) return '';
    const parser = new FormulaParser(tokens, sheetName);
    return parser.parse();
  } catch (e) {
    return '#ERROR!';
  }
}

class FormulaParser {
  constructor(tokens, sheetName) {
    this.tokens = tokens;
    this.pos = 0;
    this.sheetName = sheetName;
  }

  peek() { return this.tokens[this.pos] || null; }
  next() { return this.tokens[this.pos++]; }

  parse() {
    const result = this.parseExpression();
    return result;
  }

  parseExpression() {
    return this.parseConcat();
  }

  parseConcat() {
    let left = this.parseComparison();
    while (this.peek() && this.peek().value === '&') {
      this.next();
      const right = this.parseComparison();
      left = String(left || '') + String(right || '');
    }
    return left;
  }

  parseComparison() {
    let left = this.parseAddition();
    while (this.peek() && ['<', '>', '<=', '>=', '=', '<>'].includes(this.peek().value)) {
      const op = this.next().value;
      const right = this.parseAddition();
      const l = left !== null && left !== undefined ? (typeof left === 'number' ? left : parseFloat(left)) : 0;
      const r = right !== null && right !== undefined ? (typeof right === 'number' ? right : parseFloat(right)) : 0;
      switch (op) {
        case '<': left = l < r; break;
        case '>': left = l > r; break;
        case '<=': left = l <= r; break;
        case '>=': left = l >= r; break;
        case '=': left = l === r; break;
        case '<>': left = l !== r; break;
      }
    }
    return left;
  }

  parseAddition() {
    let left = this.parseMultiplication();
    while (this.peek() && this.peek().type === 'op' && ['+', '-'].includes(this.peek().value)) {
      const op = this.next().value;
      const right = this.parseMultiplication();
      if (typeof left === 'string' && op === '+') left += String(right);
      else {
        left = (left || 0) + (op === '-' ? -1 : 1) * (right || 0);
      }
    }
    return left;
  }

  parseMultiplication() {
    let left = this.parseExponent();
    while (this.peek() && this.peek().type === 'op' && ['*', '/', '%'].includes(this.peek().value)) {
      const op = this.next().value;
      const right = this.parseExponent();
      if (op === '*') left = (left || 0) * (right || 0);
      else if (op === '/') left = (right || 0) === 0 ? '#DIV/0!' : (left || 0) / (right || 0);
      else if (op === '%') left = (left || 0) / 100;
    }
    return left;
  }

  parseExponent() {
    let left = this.parseUnary();
    while (this.peek() && this.peek().type === 'op' && this.peek().value === '^') {
      this.next();
      const right = this.parseUnary();
      left = Math.pow(left || 0, right || 0);
    }
    return left;
  }

  parseUnary() {
    if (this.peek() && this.peek().type === 'op' && this.peek().value === '-') {
      this.next();
      const val = this.parseUnary();
      return -(val || 0);
    }
    if (this.peek() && this.peek().type === 'op' && this.peek().value === '+') {
      this.next();
      return this.parseUnary() || 0;
    }
    return this.parsePrimary();
  }

  parsePrimary() {
    const tok = this.peek();
    if (!tok) return 0;

    if (tok.type === 'number') {
      this.next();
      return tok.value;
    }

    if (tok.type === 'string') {
      this.next();
      return tok.value;
    }

    if (tok.type === 'function') {
      return this.parseFunctionCall();
    }

    if (tok.type === 'ref') {
      // Check if next is ':' for range
      const ref1 = tok.value.toUpperCase();
      this.next();
      if (this.peek() && this.peek().type === ':') {
        this.next(); // consume ':'
        if (this.peek() && this.peek().type === 'ref') {
          const ref2 = this.next().value.toUpperCase();
          return this.getRangeValues(ref1, ref2);
        }
      }
      return this.getCellValue(ref1);
    }

    if (tok.type === '(') {
      this.next();
      const val = this.parseExpression();
      if (this.peek() && this.peek().type === ')') this.next();
      return val;
    }

    // Handle TRUE/FALSE
    if (tok.type === 'function' && tok.value === 'TRUE') { this.next(); return true; }
    if (tok.type === 'function' && tok.value === 'FALSE') { this.next(); return false; }

    this.next();
    return 0;
  }

  parseFunctionCall() {
    const funcName = this.next().value;
    if (this.peek() && this.peek().type === '(') this.next();

    const args = [];
    if (this.peek() && this.peek().value !== ')') {
      args.push(this.parseExpression());
      while (this.peek() && this.peek().type === ',') {
        this.next();
        args.push(this.parseExpression());
      }
    }
    if (this.peek() && this.peek().type === ')') this.next();

    return this.executeFunction(funcName, args);
  }

  executeFunction(name, args) {
    const flatArgs = args.flat ? args.flat(Infinity) : args;

    switch (name) {
      case 'SUM':
        return this.sumArgs(args);
      case 'AVERAGE':
      case 'AVG':
        return this.avgArgs(args);
      case 'MIN':
        return this.minArgs(args);
      case 'MAX':
        return this.maxArgs(args);
      case 'COUNT':
        return this.countArgs(args);
      case 'COUNTA':
        return this.countaArgs(args);
      case 'IF': {
        const cond = args[0];
        return cond ? args[1] : (args[2] !== undefined ? args[2] : false);
      }
      case 'ABS':
        return Math.abs(args[0] || 0);
      case 'ROUND':
        return Math.round((args[0] || 0) * Math.pow(10, args[1] || 0)) / Math.pow(10, args[1] || 0);
      case 'INT':
        return Math.floor(args[0] || 0);
      case 'MOD':
        return (args[0] || 0) % (args[1] || 1);
      case 'POWER':
        return Math.pow(args[0] || 0, args[1] || 0);
      case 'SQRT':
        return Math.sqrt(args[0] || 0);
      case 'PI':
        return Math.PI;
      case 'CONCAT':
        return args.map(a => String(a || '')).join('');
      case 'LEN':
        return String(args[0] || '').length;
      case 'UPPER':
        return String(args[0] || '').toUpperCase();
      case 'LOWER':
        return String(args[0] || '').toLowerCase();
      case 'TRIM':
        return String(args[0] || '').trim();
      case 'LEFT':
        return String(args[0] || '').substring(0, args[1] || 1);
      case 'RIGHT':
        return String(args[0] || '').slice(-(args[1] || 1));
      case 'MID':
        return String(args[0] || '').substring((args[1] || 1) - 1, (args[1] || 1) - 1 + (args[2] || 1));
      case 'SEARCH':
      case 'FIND':
        const idx = String(args[1] || '').indexOf(args[0] || '');
        return idx >= 0 ? idx + 1 : '#VALUE!';
      case 'ISBLANK':
        return args[0] === '' || args[0] === null || args[0] === undefined;
      case 'AND':
        return args.every(a => a);
      case 'OR':
        return args.some(a => a);
      case 'NOT':
        return !args[0];
      case 'IFERROR':
        try { return args[0]; } catch { return args[1] !== undefined ? args[1] : ''; }
      case 'CEILING':
        return Math.ceil((args[0] || 0) / (args[1] || 1)) * (args[1] || 1);
      case 'FLOOR':
        return Math.floor((args[0] || 0) / (args[1] || 1)) * (args[1] || 1);
      case 'MEDIAN': {
        const nums = flatArgs.filter(a => typeof a === 'number').sort((a, b) => a - b);
        if (nums.length === 0) return 0;
        const mid = Math.floor(nums.length / 2);
        return nums.length % 2 !== 0 ? nums[mid] : (nums[mid - 1] + nums[mid]) / 2;
      }
      case 'MODE': {
        const freq = {};
        flatArgs.forEach(a => { if (typeof a === 'number') freq[a] = (freq[a] || 0) + 1; });
        let maxFreq = 0, modeVal = flatArgs[0] || 0;
        for (const k in freq) { if (freq[k] > maxFreq) { maxFreq = freq[k]; modeVal = parseFloat(k); } }
        return modeVal;
      }
      case 'STDEV': {
        const nums = flatArgs.filter(a => typeof a === 'number');
        if (nums.length < 2) return 0;
        const avg = nums.reduce((s, v) => s + v, 0) / nums.length;
        return Math.sqrt(nums.reduce((s, v) => s + (v - avg) ** 2, 0) / (nums.length - 1));
      }
      case 'VAR': {
        const nums = flatArgs.filter(a => typeof a === 'number');
        if (nums.length < 2) return 0;
        const avg = nums.reduce((s, v) => s + v, 0) / nums.length;
        return nums.reduce((s, v) => s + (v - avg) ** 2, 0) / (nums.length - 1);
      }
      case 'PRODUCT':
        return flatArgs.filter(a => typeof a === 'number').reduce((p, v) => p * v, 1);
      case 'SUBTOTAL':
        // Simplified: just SUM for now
        return this.sumArgs(args);
      default:
        return '#NAME?';
    }
  }

  sumArgs(args) {
    let sum = 0;
    const flat = args.flat ? args.flat(Infinity) : args;
    for (const a of flat) {
      if (typeof a === 'number') sum += a;
      else if (typeof a === 'string' && a !== '') sum += parseFloat(a) || 0;
    }
    return sum;
  }

  avgArgs(args) {
    let sum = 0, count = 0;
    const flat = args.flat ? args.flat(Infinity) : args;
    for (const a of flat) {
      if (typeof a === 'number') { sum += a; count++; }
      else if (typeof a === 'string' && a !== '' && !isNaN(parseFloat(a))) { sum += parseFloat(a); count++; }
    }
    return count === 0 ? 0 : sum / count;
  }

  minArgs(args) {
    const nums = (args.flat ? args.flat(Infinity) : args).filter(a => typeof a === 'number');
    return nums.length === 0 ? 0 : Math.min(...nums);
  }

  maxArgs(args) {
    const nums = (args.flat ? args.flat(Infinity) : args).filter(a => typeof a === 'number');
    return nums.length === 0 ? 0 : Math.max(...nums);
  }

  countArgs(args) {
    const flat = args.flat ? args.flat(Infinity) : args;
    return flat.filter(a => typeof a === 'number').length;
  }

  countaArgs(args) {
    const flat = args.flat ? args.flat(Infinity) : args;
    return flat.filter(a => a !== '' && a !== null && a !== undefined).length;
  }

  getCellValue(ref) {
    const parsed = parseCellRef(ref);
    if (!parsed) return 0;
    let sheetName = this.sheetName;
    let cellRef = ref;

    // Check for sheet reference like Sheet1!A1
    if (ref.includes('!')) {
      const parts = ref.split('!');
      sheetName = parts[0].replace(/['"]/g, '');
      cellRef = parts[1];
      const p = parseCellRef(cellRef);
      if (p) { parsed = p; }
      else return 0;
    }

    const sd = getSheetData(sheetName);
    const key = cellKey(parsed.col, parsed.row);
    const cell = sd.cells[key];
    if (!cell) return 0;
    if (cell.formula) {
      // Evaluate formula if not already computed
      if (cell.computedValue !== undefined) return cell.computedValue;
      return cell.formula;
    }
    return cell.value !== undefined ? cell.value : 0;
  }

  getRangeValues(ref1, ref2) {
    const a = parseCellRef(ref1);
    const b = parseCellRef(ref2);
    if (!a || !b) return [];
    const sc = Math.min(a.col, b.col), ec = Math.max(a.col, b.col);
    const sr = Math.min(a.row, b.row), er = Math.max(a.row, b.row);
    const values = [];
    for (let r = sr; r <= er; r++) {
      for (let c = sc; c <= ec; c++) {
        values.push(this.getCellValue(cellKey(c, r)));
      }
    }
    return values;
  }
}

// ==================== DEPENDENCY TRACKING ====================
function collectDependencies(formula) {
  const deps = new Set();
  const tokens = tokenizeFormula(formula);
  for (const tok of tokens) {
    if (tok.type === 'ref') {
      deps.add(tok.value.toUpperCase());
    }
  }
  return deps;
}

function recalculateAll(sheetName) {
  const sd = getSheetData(sheetName);
  // Simple approach: evaluate all formulas
  for (const key in sd.cells) {
    const cell = sd.cells[key];
    if (cell.formula) {
      cell.computedValue = evaluateFormula(cell.formula, sheetName);
      cell.displayValue = cell.computedValue;
    }
  }
  renderGrid();
}

function recalculateCell(key) {
  const sd = getSheetData(activeSheet);
  const cell = sd.cells[key];
  if (!cell || !cell.formula) return;

  cell.computedValue = evaluateFormula(cell.formula, activeSheet);
  cell.displayValue = cell.computedValue;

  // Find dependents
  for (const k in sd.cells) {
    if (k === key) continue;
    const dep = sd.cells[k];
    if (dep.formula) {
      const deps = collectDependencies(dep.formula);
      if (deps.has(key.toUpperCase())) {
        dep.computedValue = evaluateFormula(dep.formula, activeSheet);
        dep.displayValue = dep.computedValue;
      }
    }
  }
  renderGrid();
}

// ==================== GRID RENDERING ====================
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Calculate total width
  const totalWidth = NUM_COLS * DEFAULT_COL_WIDTH + 45;
  const totalHeight = NUM_ROWS * DEFAULT_ROW_HEIGHT;
  grid.style.width = totalWidth + 'px';

  // Header row
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');

  // Corner
  const corner = document.createElement('th');
  corner.className = 'corner-header';
  headerRow.appendChild(corner);

  for (let c = 0; c < NUM_COLS; c++) {
    const th = document.createElement('th');
    th.textContent = colName(c);
    th.setAttribute('data-col', c);
    th.style.width = (colWidths[c] || DEFAULT_COL_WIDTH) + 'px';
    th.style.minWidth = (colWidths[c] || DEFAULT_COL_WIDTH) + 'px';

    const resizeHandle = document.createElement('div');
    resizeHandle.className = 'col-resize-handle';
    th.appendChild(resizeHandle);

    thead.appendChild(th);
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);
  grid.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  for (let r = 0; r < NUM_ROWS; r++) {
    const tr = document.createElement('tr');
    tr.style.height = DEFAULT_ROW_HEIGHT + 'px';

    // Row header
    const rowTh = document.createElement('th');
    rowTh.textContent = r + 1;
    rowTh.setAttribute('data-row', r);
    tr.appendChild(rowTh);

    for (let c = 0; c < NUM_COLS; c++) {
      const td = document.createElement('td');
      td.className = 'cell';
      td.setAttribute('data-col', c);
      td.setAttribute('data-row', r);

      const content = document.createElement('div');
      content.className = 'cell-content';
      td.appendChild(content);

      const editor = document.createElement('input');
      editor.className = 'cell-editor';
      editor.type = 'text';
      td.appendChild(editor);

      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  grid.appendChild(tbody);
}

function renderGrid() {
  const sd = getSheetData(activeSheet);
  const table = document.getElementById('grid');
  const rows = table.tBodies[0].rows;

  for (let r = 0; r < NUM_ROWS; r++) {
    const cells = rows[r].cells;
    for (let c = 0; c < NUM_COLS; c++) {
      const td = cells[c + 1]; // +1 for row header
      const key = cellKey(c, r);
      const cellData = sd.cells[key];
      const content = td.querySelector('.cell-content');

      if (cellData && cellData.displayValue !== undefined) {
        content.textContent = cellData.displayValue;
      } else if (cellData && cellData.value !== undefined && cellData.value !== '') {
        content.textContent = cellData.value;
      } else {
        content.textContent = '';
      }

      // Apply formatting
      td.className = 'cell';
      if (cellData) {
        if (cellData.format) {
          if (cellData.format.bold) td.classList.add('bold');
          if (cellData.format.italic) td.classList.add('italic');
          if (cellData.format.underline) { content.style.textDecoration = 'underline'; }
          else { content.style.textDecoration = ''; }
          if (cellData.format.strike) td.classList.add('strike');
          if (cellData.format.bgColor) td.style.backgroundColor = cellData.format.bgColor;
          else td.style.backgroundColor = '';
          if (cellData.format.textColor) content.style.color = cellData.format.textColor;
          else content.style.color = '';
          if (cellData.format.align) content.style.textAlign = cellData.format.align;
          else content.style.textAlign = '';
          if (cellData.format.fontSize) content.style.fontSize = cellData.format.fontSize + 'px';
          else content.style.fontSize = '';
          if (cellData.format.fontFamily) content.style.fontFamily = cellData.format.fontFamily;
          else content.style.fontFamily = '';
        }
        // Numbers right-align
        if (!cellData.format && typeof cellData.displayValue === 'number') {
          content.style.textAlign = 'right';
        } else if (!cellData.format) {
          content.style.textAlign = '';
        }
      } else {
        td.style.backgroundColor = '';
        content.style.color = '';
        content.style.textAlign = '';
        content.style.textDecoration = '';
        content.style.fontSize = '';
        content.style.fontFamily = '';
      }
    }
  }

  updateSelectionVisuals();
  updateStatusBar();
}

function updateCellDisplay(col, row) {
  const table = document.getElementById('grid');
  const r = table.tBodies[0].rows[row];
  if (!r) return;
  const td = r.cells[col + 1];
  if (!td) return;

  const sd = getSheetData(activeSheet);
  const key = cellKey(col, row);
  const cellData = sd.cells[key];
  const content = td.querySelector('.cell-content');

  if (cellData) {
    content.textContent = cellData.displayValue !== undefined ? cellData.displayValue : (cellData.value || '');
    // Apply format
    if (cellData.format) {
      if (cellData.format.bold) td.classList.add('bold');
      else td.classList.remove('bold');
      if (cellData.format.italic) td.classList.add('italic');
      else td.classList.remove('italic');
      if (cellData.format.bgColor) td.style.backgroundColor = cellData.format.bgColor;
      else td.style.backgroundColor = '';
      if (cellData.format.textColor) content.style.color = cellData.format.textColor;
      else content.style.color = '';
      if (cellData.format.align) content.style.textAlign = cellData.format.align;
      else content.style.textAlign = '';
    }
    if (typeof cellData.displayValue === 'number' && (!cellData.format || !cellData.format.align)) {
      content.style.textAlign = 'right';
    }
  } else {
    content.textContent = '';
    td.style.backgroundColor = '';
    content.style.color = '';
    content.style.textAlign = '';
  }
}

function updateSelectionVisuals() {
  const table = document.getElementById('grid');
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);

  // Clear all
  document.querySelectorAll('.cell.selected, .cell.in-range').forEach(el => {
    el.classList.remove('selected', 'in-range');
  });
  document.querySelectorAll('thead th.sel-header, tbody th.sel-header').forEach(el => {
    el.classList.remove('sel-header');
  });

  // Mark in-range
  const tbody = table.tBodies[0];
  for (let r = sr; r <= er; r++) {
    if (r >= tbody.rows.length) break;
    const tr = tbody.rows[r];
    for (let c = sc; c <= ec; c++) {
      const td = tr.cells[c + 1];
      if (td) {
        if (c === currentCell.col && r === currentCell.row) {
          td.classList.add('selected');
        } else {
          td.classList.add('in-range');
        }
      }
    }
    // Row header
    const rowTh = tr.cells[0];
    if (rowTh && sr === er) rowTh.classList.add('sel-header');
    else if (rowTh) rowTh.classList.remove('sel-header');
  }

  // Column headers
  const theadRow = table.tHead.rows[0];
  for (let c = sc; c <= ec; c++) {
    const th = theadRow.cells[c + 1];
    if (th && sc === ec) th.classList.add('sel-header');
    else if (th) th.classList.remove('sel-header');
  }

  // Update address
  document.getElementById('cell-address').textContent = cellKey(currentCell.col, currentCell.row);
}

function updateStatusBar() {
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);

  let sum = 0, count = 0, numCount = 0;
  const sd = getSheetData(activeSheet);

  for (let r = sr; r <= er; r++) {
    for (let c = sc; c <= ec; c++) {
      const cell = sd.cells[cellKey(c, r)];
      if (cell) {
        const val = cell.displayValue !== undefined ? cell.displayValue : cell.value;
        if (val !== '' && val !== null && val !== undefined) count++;
        if (typeof val === 'number' || (typeof val === 'string' && !isNaN(parseFloat(val)) && val !== '')) {
          sum += parseFloat(val) || 0;
          numCount++;
        }
      }
    }
  }

  document.getElementById('status-sum').textContent = numCount > 0 ? `Sum: ${sum % 1 === 0 ? sum : sum.toFixed(2)}` : '';
  document.getElementById('status-avg').textContent = numCount > 0 ? `Average: ${(sum / numCount) % 1 === 0 ? (sum / numCount) : (sum / numCount).toFixed(2)}` : '';
  document.getElementById('status-count').textContent = count > 0 ? `Count: ${count}` : '';
}

// ==================== SHEET TABS ====================
function renderSheetTabs() {
  const container = document.getElementById('sheet-tabs');
  container.innerHTML = '';
  for (const name of Object.keys(sheets)) {
    const tab = document.createElement('div');
    tab.className = 'sheet-tab' + (name === activeSheet ? ' active' : '');
    tab.setAttribute('data-sheet', name);

    const label = document.createElement('span');
    label.textContent = name;
    label.style.flex = '1';
    tab.appendChild(label);

    if (Object.keys(sheets).length > 1) {
      const closeBtn = document.createElement('button');
      closeBtn.className = 'tab-close';
      closeBtn.innerHTML = '×';
      closeBtn.onclick = (e) => { e.stopPropagation(); deleteSheet(name); };
      tab.appendChild(closeBtn);
    }

    tab.addEventListener('click', () => switchSheet(name));
    tab.addEventListener('dblclick', (e) => {
      if (e.target.classList.contains('tab-close')) return;
      renameSheet(name);
    });

    container.appendChild(tab);
  }
}

function switchSheet(name) {
  if (isEditing) finishEditing();
  activeSheet = name;
  renderSheetTabs();
  renderGrid();
  updateFormulaBar();
}

function addSheet() {
  let i = 1;
  while (sheets['Sheet' + i]) i++;
  const name = 'Sheet' + i;
  sheets[name] = { cells: {}, colWidths: {} };
  switchSheet(name);
}

function deleteSheet(name) {
  if (Object.keys(sheets).length <= 1) return;
  delete sheets[name];
  if (activeSheet === name) {
    activeSheet = Object.keys(sheets)[0];
  }
  renderSheetTabs();
  renderGrid();
  updateFormulaBar();
}

function renameSheet(name) {
  const newName = prompt('Enter new sheet name:', name);
  if (newName && newName.trim() && newName !== name && !sheets[newName.trim()]) {
    sheets[newName.trim()] = sheets[name];
    delete sheets[name];
    if (activeSheet === name) activeSheet = newName.trim();
    renderSheetTabs();
  }
}

// ==================== FORMULA BAR ====================
function updateFormulaBar() {
  const sd = getSheetData(activeSheet);
  const key = cellKey(currentCell.col, currentCell.row);
  const cell = sd.cells[key];
  const input = document.getElementById('formula-input');
  if (cell && cell.formula) {
    input.value = cell.formula;
  } else {
    input.value = (cell && cell.value !== undefined) ? cell.value : '';
  }
}

// ==================== EDITING ====================
function startEditing() {
  if (isEditing) return;
  isEditing = true;

  const table = document.getElementById('grid');
  const r = table.tBodies[0].rows[currentCell.row];
  const td = r.cells[currentCell.col + 1];
  const editor = td.querySelector('.cell-editor');
  const sd = getSheetData(activeSheet);
  const key = cellKey(currentCell.col, currentCell.row);
  const cell = sd.cells[key];

  td.classList.add('editing');
  editor.value = cell && cell.formula ? cell.formula : (cell ? (cell.value || '') : '');
  editor.style.display = 'block';
  editor.focus();
  editor.select();

  document.getElementById('formula-input').value = editor.value;
}

function finishEditing() {
  if (!isEditing) return;
  isEditing = false;

  const table = document.getElementById('grid');
  const r = table.tBodies[0].rows[currentCell.row];
  const td = r.cells[currentCell.col + 1];
  const editor = td.querySelector('.cell-editor');
  td.classList.remove('editing');
  editor.style.display = 'none';

  const val = editor.value;
  const key = cellKey(currentCell.col, currentCell.row);
  const sd = getSheetData(activeSheet);

  // Save to undo
  const oldCell = sd.cells[key] ? { ...sd.cells[key] } : null;
  if (oldCell) {
    oldCell.format = oldCell.format ? { ...oldCell.format } : null;
  }

  if (val.startsWith('=')) {
    const formula = val.substring(1);
    const computed = evaluateFormula(formula, activeSheet);
    if (!sd.cells[key]) sd.cells[key] = {};
    sd.cells[key].formula = formula;
    sd.cells[key].computedValue = computed;
    sd.cells[key].displayValue = computed;
    sd.cells[key].value = computed;
  } else {
    if (!sd.cells[key]) sd.cells[key] = {};
    sd.cells[key].formula = '';
    sd.cells[key].value = val;
    sd.cells[key].displayValue = val;

    // Try to parse as number
    if (val !== '' && !isNaN(parseFloat(val))) {
      sd.cells[key].value = parseFloat(val);
      sd.cells[key].displayValue = parseFloat(val);
    }
  }

  // Undo
  pushUndo({ type: 'edit', sheet: activeSheet, key, oldCell, newCell: { ...sd.cells[key] } });

  // Recalculate dependents
  recalculateCell(key);
  updateFormulaBar();
}

// ==================== UNDO/REDO ====================
function pushUndo(action) {
  undoStack.push(action);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (undoStack.length === 0) return;
  const action = undoStack.pop();
  if (action.type === 'edit') {
    const sd = getSheetData(action.sheet);
    if (action.oldCell) {
      sd.cells[action.key] = { ...action.oldCell };
      sd.cells[action.key].format = action.oldCell.format ? { ...action.oldCell.format } : null;
    } else {
      delete sd.cells[action.key];
    }
    redoStack.push({ type: 'edit', sheet: action.sheet, key: action.key, oldCell: { ...sd.cells[action.key] }, newCell: action.newCell });
    renderGrid();
    updateFormulaBar();
  }
  document.getElementById('status-left').textContent = 'Undo';
  setTimeout(() => { document.getElementById('status-left').textContent = 'Ready'; }, 1000);
}

function redo() {
  if (redoStack.length === 0) return;
  const action = redoStack.pop();
  if (action.type === 'edit') {
    const sd = getSheetData(action.sheet);
    sd.cells[action.key] = { ...action.newCell };
    sd.cells[action.key].format = action.newCell.format ? { ...action.newCell.format } : null;
    undoStack.push({ type: 'edit', sheet: action.sheet, key: action.key, oldCell: { ...action.oldCell }, newCell: { ...sd.cells[action.key] } });
    renderGrid();
    updateFormulaBar();
  }
  document.getElementById('status-left').textContent = 'Redo';
  setTimeout(() => { document.getElementById('status-left').textContent = 'Ready'; }, 1000);
}

// ==================== CLIPBOARD ====================
function copyCells() {
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);
  const sd = getSheetData(activeSheet);

  clipboard = [];
  clipboardMode = 'copy';
  for (let r = sr; r <= er; r++) {
    const row = [];
    for (let c = sc; c <= ec; c++) {
      const cell = sd.cells[cellKey(c, r)];
      row.push(cell ? { ...cell, format: cell.format ? { ...cell.format } : null } : null);
    }
    clipboard.push(row);
  }
  showToast('Copied');
}

function cutCells() {
  copyCells();
  clipboardMode = 'cut';
  showToast('Cut');
}

function pasteCells() {
  if (!clipboard || clipboard.length === 0) {
    showToast('Nothing to paste');
    return;
  }

  const sd = getSheetData(activeSheet);
  const startCol = currentCell.col;
  const startRow = currentCell.row;

  for (let r = 0; r < clipboard.length; r++) {
    for (let c = 0; c < clipboard[r].length; c++) {
      const targetKey = cellKey(startCol + c, startRow + r);
      const srcCell = clipboard[r][c];
      if (srcCell) {
        if (!sd.cells[targetKey]) sd.cells[targetKey] = {};
        sd.cells[targetKey].value = srcCell.value;
        sd.cells[targetKey].formula = srcCell.formula || '';
        sd.cells[targetKey].displayValue = srcCell.displayValue !== undefined ? srcCell.displayValue : srcCell.value;
        sd.cells[targetKey].computedValue = srcCell.computedValue;
        if (srcCell.format) {
          sd.cells[targetKey].format = { ...srcCell.format };
        }
      } else {
        delete sd.cells[targetKey];
      }
    }
  }

  if (clipboardMode === 'cut') {
    clipboard = null;
    clipboardMode = null;
  }

  recalculateAll(activeSheet);
  pushUndo({ type: 'paste', sheet: activeSheet, cells: JSON.parse(JSON.stringify(sd.cells)) });
  showToast('Pasted');
}

// ==================== CLEAR CELLS ====================
function clearCells() {
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);
  const sd = getSheetData(activeSheet);

  for (let r = sr; r <= er; r++) {
    for (let c = sc; c <= ec; c++) {
      const key = cellKey(c, r);
      if (sd.cells[key]) {
        sd.cells[key].value = '';
        sd.cells[key].formula = '';
        sd.cells[key].displayValue = '';
        sd.cells[key].computedValue = undefined;
        sd.cells[key].format = null;
      }
    }
  }

  recalculateAll(activeSheet);
  updateFormulaBar();
}

// ==================== FORMATTING ====================
function applyFormat(prop, value) {
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);
  const sd = getSheetData(activeSheet);

  for (let r = sr; r <= er; r++) {
    for (let c = sc; c <= ec; c++) {
      const key = cellKey(c, r);
      if (!sd.cells[key]) sd.cells[key] = {};
      if (!sd.cells[key].format) sd.cells[key].format = {};
      sd.cells[key].format[prop] = value;
    }
  }

  renderGrid();
  pushUndo({ type: 'format', sheet: activeSheet, cells: JSON.parse(JSON.stringify(sd.cells)) });
}

function toggleFormat(prop) {
  const sd = getSheetData(activeSheet);
  const key = cellKey(currentCell.col, currentCell.row);
  const cell = sd.cells[key];
  let newVal = true;
  if (cell && cell.format && cell.format[prop] !== undefined) {
    newVal = !cell.format[prop];
  }
  applyFormat(prop, newVal);
  updateToolbarState();
}

function updateToolbarState() {
  const sd = getSheetData(activeSheet);
  const key = cellKey(currentCell.col, currentCell.row);
  const cell = sd.cells[key];
  const fmt = cell && cell.format;

  document.getElementById('btn-bold').classList.toggle('active', !!fmt && !!fmt.bold);
  document.getElementById('btn-italic').classList.toggle('active', !!fmt && !!fmt.italic);
  document.getElementById('btn-underline').classList.toggle('active', !!fmt && !!fmt.underline);
  document.getElementById('btn-strike').classList.toggle('active', !!fmt && !!fmt.strike);
  document.getElementById('btn-align-left').classList.toggle('active', !!fmt && fmt.align === 'left');
  document.getElementById('btn-align-center').classList.toggle('active', !!fmt && fmt.align === 'center');
  document.getElementById('btn-align-right').classList.toggle('active', !!fmt && fmt.align === 'right');

  if (fmt) {
    if (fmt.fontFamily) document.getElementById('font-family').value = fmt.fontFamily;
    if (fmt.fontSize) document.getElementById('font-size').value = fmt.fontSize;
    if (fmt.bgColor) document.getElementById('bg-color').value = fmt.bgColor;
    if (fmt.textColor) document.getElementById('text-color').value = fmt.textColor;
  }
}

// ==================== INSERT/DELETE ROWS/COLUMNS ====================
function insertRow() {
  const sd = getSheetData(activeSheet);
  const row = currentCell.row;

  // Shift all cells below down
  const newCells = {};
  for (const key in sd.cells) {
    const parsed = parseCellRef(key);
    if (parsed && parsed.row >= row) {
      const newKey = cellKey(parsed.col, parsed.row + 1);
      newCells[newKey] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    } else {
      newCells[key] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    }
  }
  sd.cells = newCells;
  recalculateAll(activeSheet);
  renderGrid();
  showToast('Row inserted');
}

function deleteRow() {
  const sd = getSheetData(activeSheet);
  const row = currentCell.row;

  // Remove cells in row, shift cells below up
  const newCells = {};
  for (const key in sd.cells) {
    const parsed = parseCellRef(key);
    if (parsed && parsed.row === row) {
      continue; // skip
    } else if (parsed && parsed.row > row) {
      const newKey = cellKey(parsed.col, parsed.row - 1);
      newCells[newKey] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    } else {
      newCells[key] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    }
  }
  sd.cells = newCells;
  recalculateAll(activeSheet);
  renderGrid();
  showToast('Row deleted');
}

function insertColumn() {
  const sd = getSheetData(activeSheet);
  const col = currentCell.col;

  const newCells = {};
  for (const key in sd.cells) {
    const parsed = parseCellRef(key);
    if (parsed && parsed.col >= col) {
      const newKey = cellKey(parsed.col + 1, parsed.row);
      newCells[newKey] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    } else {
      newCells[key] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    }
  }
  sd.cells = newCells;
  recalculateAll(activeSheet);
  renderGrid();
  showToast('Column inserted');
}

function deleteColumn() {
  const sd = getSheetData(activeSheet);
  const col = currentCell.col;

  const newCells = {};
  for (const key in sd.cells) {
    const parsed = parseCellRef(key);
    if (parsed && parsed.col === col) {
      continue;
    } else if (parsed && parsed.col > col) {
      const newKey = cellKey(parsed.col - 1, parsed.row);
      newCells[newKey] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    } else {
      newCells[key] = { ...sd.cells[key], format: sd.cells[key].format ? { ...sd.cells[key].format } : null };
    }
  }
  sd.cells = newCells;
  recalculateAll(activeSheet);
  renderGrid();
  showToast('Column deleted');
}

// ==================== CSV EXPORT/IMPORT ====================
function downloadCSV() {
  const sd = getSheetData(activeSheet);
  let maxRow = 0, maxCol = 0;
  for (const key in sd.cells) {
    if (sd.cells[key].value !== '' && sd.cells[key].value !== undefined) {
      const parsed = parseCellRef(key);
      if (parsed) {
        maxRow = Math.max(maxRow, parsed.row);
        maxCol = Math.max(maxCol, parsed.col);
      }
    }
  }

  let csv = '';
  for (let r = 0; r <= maxRow; r++) {
    const row = [];
    for (let c = 0; c <= maxCol; c++) {
      const cell = sd.cells[cellKey(c, r)];
      let val = cell ? (cell.displayValue !== undefined ? cell.displayValue : (cell.value || '')) : '';
      if (typeof val === 'string' && (val.includes(',') || val.includes('"') || val.includes('\n'))) {
        val = '"' + val.replace(/"/g, '""') + '"';
      }
      row.push(val !== undefined && val !== null ? val : '');
    }
    csv += row.join(',') + '\n';
  }

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'sheetpro_export.csv';
  link.click();
  URL.revokeObjectURL(link.href);
  showToast('CSV downloaded');
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  const data = [];
  for (const line of lines) {
    if (line.trim() === '') continue;
    const row = [];
    let i = 0;
    while (i < line.length) {
      if (line[i] === '"') {
        let val = '';
        i++;
        while (i < line.length) {
          if (line[i] === '"') {
            if (i + 1 < line.length && line[i + 1] === '"') {
              val += '"';
              i += 2;
            } else {
              i++;
              break;
            }
          } else {
            val += line[i];
            i++;
          }
        }
        row.push(val);
        if (i < line.length && line[i] === ',') i++;
      } else {
        let val = '';
        while (i < line.length && line[i] !== ',') {
          val += line[i];
          i++;
        }
        row.push(val);
        if (i < line.length && line[i] === ',') i++;
      }
    }
    data.push(row);
  }
  return data;
}

function uploadCSV(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = parseCSV(e.target.result);
    const sd = getSheetData(activeSheet);
    sd.cells = {};

    for (let r = 0; r < data.length; r++) {
      for (let c = 0; c < data[r].length; c++) {
        const val = data[r][c];
        if (val !== '') {
          const key = cellKey(c, r);
          sd.cells[key] = { value: val, formula: '', displayValue: val };
          if (!isNaN(parseFloat(val)) && val.trim() !== '') {
            sd.cells[key].value = parseFloat(val);
            sd.cells[key].displayValue = parseFloat(val);
          }
        }
      }
    }

    renderGrid();
    updateFormulaBar();
    showToast('CSV loaded');
  };
  reader.readAsText(file);
}

// ==================== KEYBOARD HANDLING ====================
function handleKeyDown(e) {
  const key = e.key;

  // Ctrl shortcuts
  if (e.ctrlKey || e.metaKey) {
    switch (key.toLowerCase()) {
      case 'z':
        e.preventDefault();
        undo();
        return;
      case 'y':
        e.preventDefault();
        redo();
        return;
      case 'b':
        e.preventDefault();
        toggleFormat('bold');
        return;
      case 'i':
        e.preventDefault();
        toggleFormat('italic');
        return;
      case 'u':
        e.preventDefault();
        toggleFormat('underline');
        return;
      case 'c':
        e.preventDefault();
        copyCells();
        return;
      case 'x':
        e.preventDefault();
        cutCells();
        return;
      case 'v':
        e.preventDefault();
        pasteCells();
        return;
      case 'a':
        e.preventDefault();
        selection.startCol = 0;
        selection.startRow = 0;
        selection.endCol = NUM_COLS - 1;
        selection.endRow = NUM_ROWS - 1;
        currentCell = { col: 0, row: 0 };
        updateSelectionVisuals();
        updateStatusBar();
        return;
      case 'd':
        // Ctrl+D: fill down
        e.preventDefault();
        fillDown();
        return;
    }
    return;
  }

  // If context menu is open, close it
  const cm = document.getElementById('context-menu');
  if (cm.classList.contains('show') && key !== 'Escape') {
    cm.classList.remove('show');
  }

  if (isEditing) {
    if (key === 'Enter') {
      e.preventDefault();
      finishEditing();
      if (!e.shiftKey) moveDown();
      else moveUp();
      return;
    }
    if (key === 'Tab') {
      e.preventDefault();
      finishEditing();
      if (!e.shiftKey) moveRight();
      else moveLeft();
      return;
    }
    if (key === 'Escape') {
      e.preventDefault();
      isEditing = false;
      const table = document.getElementById('grid');
      const r = table.tBodies[0].rows[currentCell.row];
      if (r) {
        const td = r.cells[currentCell.col + 1];
        if (td) {
          td.classList.remove('editing');
          td.querySelector('.cell-editor').style.display = 'none';
        }
      }
      updateFormulaBar();
      return;
    }
    // Sync formula bar
    const table = document.getElementById('grid');
    const r = table.tBodies[0].rows[currentCell.row];
    const td = r ? r.cells[currentCell.col + 1] : null;
    const editor = td ? td.querySelector('.cell-editor') : null;
    if (editor) {
      document.getElementById('formula-input').value = editor.value;
    }
    return;
  }

  if (formulaMode) {
    if (key === 'Escape') {
      formulaMode = false;
      document.body.classList.remove('formula-mode');
      // Clear formula references highlights
      document.querySelectorAll('.formula-ref, .formula-range').forEach(el => {
        el.classList.remove('formula-ref', 'formula-range');
      });
      return;
    }
    return;
  }

  switch (key) {
    case 'Enter':
      e.preventDefault();
      startEditing();
      return;
    case 'F2':
      e.preventDefault();
      startEditing();
      return;
    case 'Delete':
    case 'Backspace':
      e.preventDefault();
      clearCells();
      return;
    case 'Tab':
      e.preventDefault();
      if (!e.shiftKey) moveRight();
      else moveLeft();
      return;
    case 'ArrowUp':
      if (e.shiftKey) {
        e.preventDefault();
        extendSelection(0, -1);
      } else {
        e.preventDefault();
        moveUp();
      }
      return;
    case 'ArrowDown':
      if (e.shiftKey) {
        e.preventDefault();
        extendSelection(0, 1);
      } else {
        e.preventDefault();
        moveDown();
      }
      return;
    case 'ArrowLeft':
      if (e.shiftKey) {
        e.preventDefault();
        extendSelection(-1, 0);
      } else {
        e.preventDefault();
        moveLeft();
      }
      return;
    case 'ArrowRight':
      if (e.shiftKey) {
        e.preventDefault();
        extendSelection(1, 0);
      } else {
        e.preventDefault();
        moveRight();
      }
      return;
    case 'Home':
      e.preventDefault();
      if (e.ctrlKey) {
        currentCell = { col: 0, row: 0 };
      } else {
        currentCell.col = 0;
      }
      if (e.shiftKey) {
        selection.endCol = currentCell.col;
        selection.endRow = currentCell.row;
      } else {
        selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
      }
      scrollToCell();
      updateSelectionVisuals();
      updateStatusBar();
      updateFormulaBar();
      updateToolbarState();
      return;
    case 'End':
      e.preventDefault();
      if (e.ctrlKey) {
        currentCell = { col: NUM_COLS - 1, row: NUM_ROWS - 1 };
      } else {
        currentCell.col = NUM_COLS - 1;
      }
      if (e.shiftKey) {
        selection.endCol = currentCell.col;
        selection.endRow = currentCell.row;
      } else {
        selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
      }
      scrollToCell();
      updateSelectionVisuals();
      updateStatusBar();
      updateFormulaBar();
      updateToolbarState();
      return;
    case 'PageDown':
      e.preventDefault();
      moveDown(20);
      return;
    case 'PageUp':
      e.preventDefault();
      moveUp(20);
      return;
    default:
      // Single character input starts editing
      if (key.length === 1 && !e.ctrlKey && !e.metaKey) {
        startEditing();
        const table = document.getElementById('grid');
        const r = table.tBodies[0].rows[currentCell.row];
        const td = r.cells[currentCell.col + 1];
        const editor = td.querySelector('.cell-editor');
        editor.value = key;
        document.getElementById('formula-input').value = key;
      }
  }
}

function moveUp(n = 1) {
  currentCell.row = Math.max(0, currentCell.row - n);
  selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
  scrollToCell();
  updateSelectionVisuals();
  updateStatusBar();
  updateFormulaBar();
  updateToolbarState();
}

function moveDown(n = 1) {
  currentCell.row = Math.min(NUM_ROWS - 1, currentCell.row + n);
  selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
  scrollToCell();
  updateSelectionVisuals();
  updateStatusBar();
  updateFormulaBar();
  updateToolbarState();
}

function moveLeft(n = 1) {
  currentCell.col = Math.max(0, currentCell.col - n);
  selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
  scrollToCell();
  updateSelectionVisuals();
  updateStatusBar();
  updateFormulaBar();
  updateToolbarState();
}

function moveRight(n = 1) {
  currentCell.col = Math.min(NUM_COLS - 1, currentCell.col + n);
  selection = { startCol: currentCell.col, startRow: currentCell.row, endCol: currentCell.col, endRow: currentCell.row };
  scrollToCell();
  updateSelectionVisuals();
  updateStatusBar();
  updateFormulaBar();
  updateToolbarState();
}

function extendSelection(dc, dr) {
  currentCell.col = Math.max(0, Math.min(NUM_COLS - 1, currentCell.col + dc));
  currentCell.row = Math.max(0, Math.min(NUM_ROWS - 1, currentCell.row + dr));
  selection.endCol = currentCell.col;
  selection.endRow = currentCell.row;
  scrollToCell();
  updateSelectionVisuals();
  updateStatusBar();
}

function scrollToCell() {
  const gridScroll = document.getElementById('grid-scroll');
  const cellW = colWidths[currentCell.col] || DEFAULT_COL_WIDTH;
  const cellH = DEFAULT_ROW_HEIGHT;
  const left = currentCell.col * DEFAULT_COL_WIDTH; // approximate
  const top = currentCell.row * cellH;

  // More precise: find the actual cell and scroll to it
  const table = document.getElementById('grid');
  if (table.tBodies[0] && table.tBodies[0].rows[currentCell.row]) {
    const td = table.tBodies[0].rows[currentCell.row].cells[currentCell.col + 1];
    if (td) {
      const scrollLeft = td.offsetLeft - gridScroll.clientWidth / 3;
      const scrollTop = td.offsetTop - gridScroll.clientHeight / 3;
      gridScroll.scrollTo({ left: Math.max(0, scrollLeft), top: Math.max(0, scrollTop), behavior: 'smooth' });
    }
  }
}

function fillDown() {
  const sd = getSheetData(activeSheet);
  const sr = Math.min(selection.startRow, selection.endRow);
  const er = Math.max(selection.startRow, selection.endRow);
  const sc = Math.min(selection.startCol, selection.endCol);
  const ec = Math.max(selection.startCol, selection.endCol);

  if (sr === er) return;

  const topKey = cellKey(sc, sr);
  const topCell = sd.cells[topKey];
  if (!topCell && !topCell.value) return;

  for (let c = sc; c <= ec; c++) {
    for (let r = sr + 1; r <= er; r++) {
      const key = cellKey(c, r);
      if (!sd.cells[key]) sd.cells[key] = {};
      sd.cells[key].value = topCell.value;
      sd.cells[key].formula = topCell.formula || '';
      sd.cells[key].displayValue = topCell.displayValue !== undefined ? topCell.displayValue : topCell.value;
      sd.cells[key].computedValue = topCell.computedValue;
      if (topCell.format) sd.cells[key].format = { ...topCell.format };
    }
  }

  recalculateAll(activeSheet);
  showToast('Filled down');
}

// ==================== COLUMN RESIZE ====================
function handleMouseDownOnResizeHandle(e, colIndex) {
  if (e.button !== 0) return;
  e.preventDefault();
  e.stopPropagation();

  isDraggingCol = true;
  dragColStart = colIndex;
  dragStartX = e.clientX;
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';
}

function handleMouseMoveOnResize(e) {
  if (!isDraggingCol) return;
  const diff = e.clientX - dragStartX;
  const newWidth = Math.max(30, DEFAULT_COL_WIDTH + diff);
  colWidths[dragColStart] = newWidth;

  // Update header
  const theadRow = document.getElementById('grid').tHead.rows[0];
  const th = theadRow.cells[dragColStart + 1];
  if (th) {
    th.style.width = newWidth + 'px';
    th.style.minWidth = newWidth + 'px';
  }

  // Update all cells in column
  const tbody = document.getElementById('grid').tBodies[0];
  for (let r = 0; r < tbody.rows.length; r++) {
    const td = tbody.rows[r].cells[dragColStart + 1];
    if (td) {
      td.style.width = newWidth + 'px';
      td.style.minWidth = newWidth + 'px';
    }
  }
}

function handleMouseUpOnResize() {
  if (!isDraggingCol) return;
  isDraggingCol = false;
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
}

// ==================== EVENT BINDING ====================
function bindEvents() {
  const grid = document.getElementById('grid');
  const gridScroll = document.getElementById('grid-scroll');

  // Cell click / selection
  grid.addEventListener('mousedown', function(e) {
    const td = e.target.closest('td.cell');
    if (!td) return;

    const col = parseInt(td.getAttribute('data-col'));
    const row = parseInt(td.getAttribute('data-row'));

    if (e.button === 2) {
      // Right click - context menu
      if (!isEditing) {
        currentCell = { col, row };
        selection = { startCol: col, startRow: row, endCol: col, endRow: row };
        updateSelectionVisuals();
        updateStatusBar();
        updateFormulaBar();
        updateToolbarState();
        showContextMenu(e.clientX, e.clientY);
      }
      return;
    }

    if (formulaMode) {
      // Insert cell reference into formula
      const ref = cellKey(col, row);
      const formulaInput = document.getElementById('formula-input');
      const pos = formulaInput.selectionStart;
      formulaInput.value = formulaInput.value.substring(0, pos) + ref + formulaInput.value.substring(formulaInput.selectionEnd);
      formulaInput.focus();
      formulaInput.selectionStart = formulaInput.selectionEnd = pos + ref.length;

      // Highlight cell
      document.querySelectorAll('.formula-ref, .formula-range').forEach(el => {
        el.classList.remove('formula-ref', 'formula-range');
      });
      td.classList.add('formula-ref');

      return;
    }

    if (isEditing) {
      finishEditing();
    }

    currentCell = { col, row };
    selection = { startCol: col, startRow: row, endCol: col, endRow: row };

    if (e.shiftKey) {
      selection.endCol = col;
      selection.endRow = row;
    }

    isSelecting = true;
    updateSelectionVisuals();
    updateStatusBar();
    updateFormulaBar();
    updateToolbarState();
    scrollToCell();
  });

  // Cell double-click starts editing
  grid.addEventListener('dblclick', function(e) {
    const td = e.target.closest('td.cell');
    if (!td) return;
    startEditing();
  });

  // Mouse move for selection
  grid.addEventListener('mousemove', function(e) {
    if (!isSelecting) return;
    const td = e.target.closest('td.cell');
    if (!td) return;

    const col = parseInt(td.getAttribute('data-col'));
    const row = parseInt(td.getAttribute('data-row'));
    selection.endCol = col;
    selection.endRow = row;
    updateSelectionVisuals();
    updateStatusBar();
  });

  // Mouse up
  document.addEventListener('mouseup', function(e) {
    if (isDraggingCol) {
      handleMouseUpOnResize();
      return;
    }
    isSelecting = false;
  });

  // Column header click
  grid.addEventListener('click', function(e) {
    const th = e.target.closest('thead th[data-col]');
    if (th && !e.target.classList.contains('col-resize-handle')) {
      const col = parseInt(th.getAttribute('data-col'));
      currentCell = { col, row: 0 };
      selection = { startCol: col, startRow: 0, endCol: col, endRow: NUM_ROWS - 1 };
      updateSelectionVisuals();
      updateStatusBar();
      updateFormulaBar();
      return;
    }

    const rowTh = e.target.closest('tbody th[data-row]');
    if (rowTh) {
      const row = parseInt(rowTh.getAttribute('data-row'));
      currentCell = { col: 0, row: row };
      selection = { startCol: 0, startRow: row, endCol: NUM_COLS - 1, endRow: row };
      updateSelectionVisuals();
      updateStatusBar();
      updateFormulaBar();
    }
  });

  // Column resize handles
  grid.addEventListener('mousedown', function(e) {
    if (e.target.classList.contains('col-resize-handle')) {
      const th = e.target.closest('th[data-col]');
      if (th) {
        handleMouseDownOnResizeHandle(e, parseInt(th.getAttribute('data-col')));
      }
    }
  });

  document.addEventListener('mousemove', handleMouseMoveOnResize);
  document.addEventListener('mouseup', function() { handleMouseUpOnResize(); });

  // Keyboard
  document.addEventListener('keydown', handleKeyDown);

  // Formula bar
  const formulaInput = document.getElementById('formula-input');
  formulaInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = formulaInput.value;
      const key = cellKey(currentCell.col, currentCell.row);
      const sd = getSheetData(activeSheet);

      if (!sd.cells[key]) sd.cells[key] = {};

      if (val.startsWith('=')) {
        const formula = val.substring(1);
        const computed = evaluateFormula(formula, activeSheet);
        sd.cells[key].formula = formula;
        sd.cells[key].computedValue = computed;
        sd.cells[key].displayValue = computed;
        sd.cells[key].value = computed;
      } else {
        sd.cells[key].formula = '';
        sd.cells[key].value = val;
        sd.cells[key].displayValue = val;
        if (val !== '' && !isNaN(parseFloat(val))) {
          sd.cells[key].value = parseFloat(val);
          sd.cells[key].displayValue = parseFloat(val);
        }
      }

      pushUndo({ type: 'edit', sheet: activeSheet, key, oldCell: null, newCell: { ...sd.cells[key] } });
      recalculateCell(key);
      updateFormulaBar();

      moveDown();
    }
    if (e.key === 'Escape') {
      formulaInput.blur();
      updateFormulaBar();
    }
    if (e.key === 'Tab') {
      e.preventDefault();
      formulaInput.blur();
      if (e.shiftKey) moveLeft();
      else moveRight();
    }
  });

  formulaInput.addEventListener('focus', function() {
    if (!isEditing) {
      startEditing();
    }
  });

  // Toolbar buttons
  document.getElementById('btn-bold').addEventListener('click', () => toggleFormat('bold'));
  document.getElementById('btn-italic').addEventListener('click', () => toggleFormat('italic'));
  document.getElementById('btn-underline').addEventListener('click', () => toggleFormat('underline'));
  document.getElementById('btn-strike').addEventListener('click', () => toggleFormat('strike'));

  document.getElementById('btn-align-left').addEventListener('click', () => {
    applyFormat('align', 'left');
    updateToolbarState();
  });
  document.getElementById('btn-align-center').addEventListener('click', () => {
    applyFormat('align', 'center');
    updateToolbarState();
  });
  document.getElementById('btn-align-right').addEventListener('click', () => {
    applyFormat('align', 'right');
    updateToolbarState();
  });

  document.getElementById('btn-clear').addEventListener('click', clearCells);
  document.getElementById('btn-undo').addEventListener('click', undo);
  document.getElementById('btn-redo').addEventListener('click', redo);
  document.getElementById('btn-download').addEventListener('click', downloadCSV);

  document.getElementById('font-family').addEventListener('change', function() {
    applyFormat('fontFamily', this.value);
  });
  document.getElementById('font-size').addEventListener('change', function() {
    applyFormat('fontSize', parseInt(this.value));
  });
  document.getElementById('bg-color').addEventListener('input', function() {
    applyFormat('bgColor', this.value);
  });
  document.getElementById('text-color').addEventListener('input', function() {
    applyFormat('textColor', this.value);
  });

  // Sheet tabs
  document.getElementById('add-sheet-btn').addEventListener('click', addSheet);

  // File upload
  document.getElementById('btn-upload').addEventListener('click', function() {
    document.getElementById('file-input').click();
  });
  document.getElementById('file-input').addEventListener('change', function(e) {
    if (e.target.files.length > 0) {
      uploadCSV(e.target.files[0]);
      e.target.value = '';
    }
  });

  // Context menu
  document.addEventListener('contextmenu', function(e) {
    const td = e.target.closest('td.cell');
    if (td) {
      e.preventDefault();
      const col = parseInt(td.getAttribute('data-col'));
      const row = parseInt(td.getAttribute('data-row'));
      currentCell = { col, row };
      selection = { startCol: col, startRow: row, endCol: col, endRow: row };
      updateSelectionVisuals();
      updateStatusBar();
      updateFormulaBar();
      showContextMenu(e.clientX, e.clientY);
    } else {
      document.getElementById('context-menu').classList.remove('show');
    }
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('.context-menu')) {
      document.getElementById('context-menu').classList.remove('show');
    }
  });

  document.querySelectorAll('.context-menu-item').forEach(function(item) {
    item.addEventListener('click', function() {
      const action = this.getAttribute('data-action');
      document.getElementById('context-menu').classList.remove('show');
      switch (action) {
        case 'cut': cutCells(); break;
        case 'copy': copyCells(); break;
        case 'paste': pasteCells(); break;
        case 'clear': clearCells(); break;
        case 'insert-row': insertRow(); break;
        case 'delete-row': deleteRow(); break;
        case 'insert-col': insertColumn(); break;
        case 'delete-col': deleteColumn(); break;
      }
    });
  });

  // Formula mode - click to select cells while editing formula
  document.getElementById('formula-input').addEventListener('mousedown', function(e) {
    // Allow normal text selection in formula bar
  });
}

function showContextMenu(x, y) {
  const menu = document.getElementById('context-menu');
  menu.classList.add('show');

  // Position
  const menuWidth = menu.offsetWidth || 160;
  const menuHeight = menu.offsetHeight || 200;
  if (x + menuWidth > window.innerWidth) x = window.innerWidth - menuWidth - 5;
  if (y + menuHeight > window.innerHeight) y = window.innerHeight - menuHeight - 5;

  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}

// ==================== INITIALIZATION ====================
function init() {
  // Initialize first sheet
  sheets['Sheet1'] = { cells: {}, colWidths: {} };

  // Build the grid
  buildGrid();

  // Apply default column widths to cells
  const tbody = document.getElementById('grid').tBodies[0];
  for (let r = 0; r < tbody.rows.length; r++) {
    for (let c = 0; c < NUM_COLS; c++) {
      const td = tbody.rows[r].cells[c + 1];
      const w = colWidths[c] || DEFAULT_COL_WIDTH;
      td.style.width = w + 'px';
      td.style.minWidth = w + 'px';
    }
  }

  // Render tabs
  renderSheetTabs();

  // Bind events
  bindEvents();

  // Initial render
  renderGrid();
  updateFormulaBar();

  // Demo data
  loadDemoData();

  document.getElementById('status-left').textContent = 'Ready';
}

function loadDemoData() {
  const sd = getSheetData('Sheet1');

  // Header row
  const headers = ['Product', 'Q1 Sales', 'Q2 Sales', 'Q3 Sales', 'Q4 Sales', 'Total', 'Average'];
  headers.forEach((h, i) => {
    const key = cellKey(i, 0);
    sd.cells[key] = {
      value: h,
      formula: '',
      displayValue: h,
      format: { bold: true, bgColor: '#217346', textColor: '#ffffff', align: 'center', fontSize: 13 }
    };
  });

  // Sample data
  const products = ['Laptop', 'Phone', 'Tablet', 'Monitor', 'Keyboard', 'Mouse', 'Headphones', 'Webcam'];
  const salesData = [
    [12000, 15000, 13000, 18000],
    [8000, 9500, 11000, 14000],
    [5000, 6000, 7500, 8000],
    [3000, 3500, 4000, 4500],
    [2000, 2500, 2200, 2800],
    [1500, 1800, 2000, 2300],
    [4000, 4500, 5000, 6000],
    [1000, 1200, 1500, 1800]
  ];

  products.forEach((product, row) => {
    const dataRow = row + 1;

    // Product name
    sd.cells[cellKey(0, dataRow)] = {
      value: product,
      formula: '',
      displayValue: product,
      format: { align: 'left' }
    };

    // Sales data
    for (let c = 1; c <= 4; c++) {
      const key = cellKey(c, dataRow);
      const val = salesData[row][c - 1];
      sd.cells[key] = {
        value: val,
        formula: '',
        displayValue: val,
        format: { align: 'right' }
      };
    }

    // Total formula
    const totalKey = cellKey(5, dataRow);
    const totalFormula = `SUM(B${dataRow + 1}:E${dataRow + 1})`;
    sd.cells[totalKey] = {
      formula: totalFormula,
      value: 0,
      displayValue: 0,
      format: { bold: true, align: 'right' }
    };

    // Average formula
    const avgKey = cellKey(6, dataRow);
    const avgFormula = `AVERAGE(B${dataRow + 1}:E${dataRow + 1})`;
    sd.cells[avgKey] = {
      formula: avgFormula,
      value: 0,
      displayValue: 0,
      format: { align: 'right' }
    };
  });

  // Grand total row
  const grandRow = products.length + 2;
  sd.cells[cellKey(0, grandRow)] = {
    value: 'Grand Total',
    formula: '',
    displayValue: 'Grand Total',
    format: { bold: true, bgColor: '#e8f5e9', align: 'left' }
  };

  for (let c = 1; c <= 4; c++) {
    const key = cellKey(c, grandRow);
    const formula = `SUM(B${1}:B${products.length + 1})`.replace(/B/g, colName(c - 1)).replace(/\d/g, '');
    // Simpler approach
    const colLetter = colName(c - 1);
    const sumFormula = `SUM(${colLetter}1:${colLetter}${products.length + 1})`;
    sd.cells[key] = {
      formula: sumFormula,
      value: 0,
      displayValue: 0,
      format: { bold: true, bgColor: '#e8f5e9', align: 'right' }
    };
  }

  // Grand total
  const gtKey = cellKey(5, grandRow);
  sd.cells[gtKey] = {
    formula: `SUM(F1:F${products.length + 1})`,
    value: 0,
    displayValue: 0,
    format: { bold: true, bgColor: '#e8f5e9', align: 'right' }
  };

  // Set column widths
  colWidths[0] = 120; // Product column wider

  // Recalculate all formulas
  recalculateAll('Sheet1');

  // Set focus on A1
  currentCell = { col: 0, row: 0 };
  selection = { startCol: 0, startRow: 0, endCol: 0, endRow: 0 };
  updateSelectionVisuals();
  updateStatusBar();
  updateFormulaBar();
  updateToolbarState();
}

// ==================== START ====================
document.addEventListener('DOMContentLoaded', init);
})();
</script>
