<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SheetPro - Spreadsheet</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary: #217346;
  --primary-light: #33a06a;
  --primary-dark: #1a5c38;
  --toolbar-bg: #f3f3f3;
  --border: #c0c0c0;
  --header-bg: #f0f0f0;
  --header-hover: #e0e0e0;
  --selected-border: #217346;
  --selection-fill: rgba(33, 115, 70, 0.1);
  --cell-text: #000;
  --white: #fff;
  --hover-bg: #e8f5e9;
  --tab-bg: #e0e0e0;
  --tab-active: #fff;
  --font: 'Segoe UI', Calibri, Arial, sans-serif;
}

body {
  font-family: var(--font);
  font-size: 13px;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--white);
  color: var(--cell-text);
}

/* Title Bar */
.title-bar {
  display: flex;
  align-items: center;
  padding: 4px 12px;
  background: var(--primary);
  color: var(--white);
  gap: 12px;
  height: 36px;
  flex-shrink: 0;
}
.title-bar .logo {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.5px;
}
.title-bar .file-name {
  font-size: 13px;
  opacity: 0.9;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  padding: 4px 8px;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  gap: 2px;
  flex-shrink: 0;
  flex-wrap: wrap;
  min-height: 38px;
}
.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 4px;
  border-right: 1px solid var(--border);
}
.toolbar-group:last-child { border-right: none; }

.toolbar button, .toolbar select {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 3px;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font);
  color: #333;
  gap: 4px;
  white-space: nowrap;
}
.toolbar button:hover {
  background: var(--hover-bg);
  border-color: var(--border);
}
.toolbar button.active {
  background: #d0e8d8;
  border-color: var(--primary);
}
.toolbar button svg { width: 16px; height: 16px; flex-shrink: 0; }
.toolbar select {
  height: 26px;
  min-width: 60px;
  padding: 0 4px;
  font-size: 12px;
}
.toolbar input[type="color"] {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 3px;
  cursor: pointer;
  padding: 1px;
  background: var(--white);
}

/* Formula Bar */
.formula-bar {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  height: 28px;
}
.cell-address {
  width: 80px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  font-size: 12px;
  font-weight: 600;
  background: var(--header-bg);
  color: #333;
  flex-shrink: 0;
}
.fx-label {
  width: 30px;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-right: 1px solid var(--border);
  font-style: italic;
  font-weight: 700;
  font-size: 13px;
  color: #555;
  flex-shrink: 0;
  background: var(--header-bg);
}
.formula-input {
  flex: 1;
  height: 100%;
  border: none;
  outline: none;
  padding: 0 8px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--white);
}
.formula-input:focus {
  background: #fffef0;
}

/* Spreadsheet Grid Container */
.grid-container {
  flex: 1;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
}
.grid-scroll {
  flex: 1;
  overflow: auto;
  position: relative;
}

/* Grid Table */
.grid-wrapper {
  position: relative;
  display: inline-block;
}
table.grid {
  border-collapse: collapse;
  table-layout: fixed;
}
table.grid th, table.grid td {
  border: 1px solid #d4d4d4;
  padding: 0;
  margin: 0;
}

/* Column Headers */
table.grid thead th {
  background: var(--header-bg);
  font-weight: 400;
  font-size: 12px;
  color: #333;
  text-align: center;
  height: 22px;
  min-width: 80px;
  width: 80px;
  position: relative;
  user-select: none;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
}
table.grid thead th:hover {
  background: var(--header-hover);
}
table.grid thead th.col-selected {
  background: #d0e8d8;
  color: var(--primary);
  font-weight: 600;
}
table.grid thead th .col-resize-handle {
  position: absolute;
  right: -2px;
  top: 0;
  width: 5px;
  height: 100%;
  cursor: col-resize;
  z-index: 5;
}
table.grid thead th .col-resize-handle:hover {
  background: var(--primary);
  opacity: 0.4;
}

/* Row Headers */
table.grid tbody th {
  background: var(--header-bg);
  font-weight: 400;
  font-size: 12px;
  color: #333;
  text-align: center;
  width: 45px;
  min-width: 45px;
  height: 24px;
  user-select: none;
  cursor: pointer;
}
table.grid tbody th:hover {
  background: var(--header-hover);
}
table.grid tbody th.row-selected {
  background: #d0e8d8;
  color: var(--primary);
  font-weight: 600;
}

/* Top-left corner */
.corner-header {
  width: 45px;
  min-width: 45px;
  background: var(--header-bg);
}

/* Cells */
table.grid td.cell {
  height: 24px;
  padding: 0 4px;
  font-size: 13px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  cursor: cell;
  position: relative;
  vertical-align: middle;
  background: var(--white);
}
table.grid td.cell:hover {
  outline: 1px solid #ccc;
}
table.grid td.cell.selected {
  outline: 2px solid var(--selected-border);
  outline-offset: -1px;
  z-index: 3;
  background: var(--selection-fill);
}
table.grid td.cell.in-range {
  background: var(--selection-fill);
}
table.grid td.cell.editing {
  outline: 2px solid var(--selected-border);
  outline-offset: -1px;
  z-index: 4;
  padding: 0;
}
table.grid td.cell.editing .cell-editor {
  display: block;
}
table.grid td.cell .cell-content {
  display: block;
  width: 100%;
  height: 100%;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
table.grid td.cell .cell-editor {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  border: none;
  outline: none;
  padding: 0 4px;
  font-size: 13px;
  font-family: var(--font);
  background: var(--white);
  z-index: 10;
}

/* Cell formatting */
table.grid td.cell.bold .cell-content { font-weight: 700; }
table.grid td.cell.italic .cell-content { font-style: italic; }

/* Selection highlight on headers during range select */
table.grid thead th.sel-header {
  background: #b8d8c4;
  color: var(--primary-dark);
  font-weight: 600;
}
table.grid tbody th.sel-header {
  background: #b8d8c4;
  color: var(--primary-dark);
  font-weight: 600;
}

/* Sheet Tabs */
.sheet-tabs-bar {
  display: flex;
  align-items: center;
  height: 32px;
  background: var(--tab-bg);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  padding: 0 4px;
  gap: 2px;
}
.sheet-tabs-scroll {
  display: flex;
  flex: 1;
  overflow-x: auto;
  gap: 1px;
  scrollbar-width: none;
}
.sheet-tabs-scroll::-webkit-scrollbar { display: none; }
.sheet-tab {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 14px;
  height: 28px;
  background: transparent;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 4px 4px 0 0;
  cursor: pointer;
  font-size: 12px;
  font-family: var(--font);
  color: #555;
  white-space: nowrap;
  position: relative;
  user-select: none;
}
.sheet-tab:hover {
  background: rgba(255,255,255,0.5);
}
.sheet-tab.active {
  background: var(--tab-active);
  color: var(--primary);
  font-weight: 600;
  border-color: var(--border);
  border-bottom-color: var(--tab-active);
}
.sheet-tab .tab-close {
  display: none;
  width: 14px;
  height: 14px;
  border: none;
  background: transparent;
  cursor: pointer;
  border-radius: 50%;
  font-size: 10px;
  line-height: 1;
  color: #888;
  padding: 0;
}
.sheet-tab:hover .tab-close { display: flex; align-items: center; justify-content: center; }
.sheet-tab .tab-close:hover { background: #ccc; color: #333; }

.add-sheet-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--white);
  cursor: pointer;
  font-size: 16px;
  color: #555;
  flex-shrink: 0;
  margin-left: 4px;
}
.add-sheet-btn:hover { background: var(--hover-bg); border-color: var(--primary); color: var(--primary); }

/* Status Bar */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 24px;
  background: var(--header-bg);
  border-top: 1px solid var(--border);
  padding: 0 12px;
  font-size: 11px;
  color: #666;
  flex-shrink: 0;
}
.status-bar .status-info { display: flex; gap: 16px; }

/* Context Menu */
.context-menu {
  position: fixed;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  padding: 4px 0;
  z-index: 1000;
  display: none;
  min-width: 160px;
}
.context-menu.show { display: block; }
.context-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  cursor: pointer;
  font-size: 12px;
  color: #333;
}
.context-menu-item:hover { background: var(--hover-bg); }
.context-menu-sep {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}

/* Formula mode indicator */
body.formula-mode .grid-scroll {
  cursor: crosshair;
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #333;
  color: #fff;
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 13px;
  z-index: 2000;
  transition: transform 0.3s ease;
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* Hidden file input */
.hidden-input { display: none; }

/* Scrollbar styling */
.grid-scroll::-webkit-scrollbar { width: 14px; height: 14px; }
.grid-scroll::-webkit-scrollbar-track { background: #f0f0f0; }
.grid-scroll::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 7px; border: 3px solid #f0f0f0; }
.grid-scroll::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
.grid-scroll::-webkit-scrollbar-corner { background: #f0f0f0; }

/* Range highlight during formula editing */
table.grid td.cell.formula-ref {
  background: rgba(33, 115, 70, 0.2);
  outline: 2px solid var(--primary);
  outline-offset: -1px;
}
table.grid td.cell.formula-range {
  background: rgba(33, 115, 70, 0.15);
}

/* Print styles */
@media print {
  .toolbar, .formula-bar, .sheet-tabs-bar, .status-bar, .title-bar { display: none !important; }
  .grid-container { overflow: visible !important; }
  .grid-scroll { overflow: visible !important; }
}
</style>
</head>
