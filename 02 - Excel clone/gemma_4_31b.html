<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS-Excel Clone</title>
    <style>
        :root {
            --primary-green: #217346;
            --light-green: #e9f5ef;
            --border-color: #d1d1d1;
            --header-bg: #f8f9fa;
            --selection-bg: rgba(33, 115, 70, 0.1);
            --selection-border: #217346;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: #333;
        }

        /* Toolbar */
        .toolbar {
            background: #f3f3f3;
            border-bottom: 1px solid var(--border-color);
            padding: 5px 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar-group {
            display: flex;
            gap: 2px;
            border-right: 1px solid #ccc;
            padding-right: 10px;
            margin-right: 5px;
        }

        button {
            padding: 5px 10px;
            border: 1px solid transparent;
            background: transparent;
            cursor: pointer;
            border-radius: 3px;
            font-size: 13px;
        }

        button:hover { background: #ddd; }
        button.active { background: #ccc; border: 1px solid #999; }

        .color-picker {
            width: 30px;
            height: 25px;
            padding: 0;
            border: none;
            cursor: pointer;
        }

        /* Formula Bar */
        .formula-bar {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: white;
            height: 35px;
        }

        .cell-address {
            width: 60px;
            text-align: center;
            border-right: 1px solid var(--border-color);
            font-weight: bold;
            font-size: 13px;
        }

        .formula-input-container {
            display: flex;
            flex-grow: 1;
            align-items: center;
            padding: 0 10px;
        }

        .fx-label {
            font-style: italic;
            color: #888;
            margin-right: 10px;
            font-weight: bold;
        }

        #formula-input {
            width: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        /* Grid Area */
        .grid-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
            background: #fff;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid var(--border-color);
            position: relative;
            user-select: none;
            font-size: 13px;
            height: 25px;
            padding: 0;
        }

        th {
            background: var(--header-bg);
            font-weight: normal;
            color: #666;
            position: sticky;
            z-index: 2;
        }

        .row-header {
            position: sticky;
            left: 0;
            width: 40px;
            text-align: center;
            z-index: 3;
        }

        .col-header {
            height: 25px;
            z-index: 2;
        }

        .col-header .resizer {
            position: absolute;
            right: 0;
            top: 0;
            width: 5px;
            height: 100%;
            cursor: col-resize;
            z-index: 10;
        }

        .cell {
            background: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px;
            line-height: 25px;
            cursor: cell;
        }

        .cell.selected {
            outline: 2px solid var(--selection-border);
            z-index: 5;
        }

        .cell.range-selected {
            background-color: var(--selection-bg);
        }

        .cell-editor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--selection-border);
            z-index: 10;
            outline: none;
            padding: 0 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 13px;
        }

        /* Sheet Tabs */
        .sheet-tabs {
            background: #eee;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            height: 30px;
            overflow-x: auto;
        }

        .tab {
            padding: 5px 15px;
            border: 1px solid transparent;
            border-right: none;
            cursor: pointer;
            font-size: 12px;
            background: #ddd;
            margin-right: 2px;
            border-radius: 5px 5px 0 0;
            white-space: nowrap;
        }

        .tab.active {
            background: white;
            border: 1px solid var(--border-color);
            border-bottom: none;
            font-weight: bold;
        }

        .add-sheet {
            padding: 0 10px;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-green);
        }

        .tab-context {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="toolbar-group">
            <button onclick="applyStyle('fontWeight', 'bold')" id="btn-bold"><b>B</b></button>
            <button onclick="applyStyle('fontStyle', 'italic')" id="btn-italic"><i>I</i></button>
            <input type="color" class="color-picker" onchange="applyStyle('backgroundColor', this.value)" title="Fill Color">
        </div>
        <div class="toolbar-group">
            <button onclick="clearSelection()">Clear Contents</button>
        </div>
        <div class="toolbar-group">
            <button onclick="exportCSV()">Download CSV</button>
            <button onclick="triggerImport()">Upload CSV</button>
            <input type="file" id="csv-import" style="display:none" accept=".csv" onchange="importCSV(event)">
        </div>
    </div>

    <!-- Formula Bar -->
    <div class="formula-bar">
        <div class="cell-address" id="active-cell-id">A1</div>
        <div class="formula-input-container">
            <span class="fx-label">fx</span>
            <input type="text" id="formula-input" spellcheck="false">
        </div>
    </div>

    <!-- Main Grid -->
    <div class="grid-container" id="grid-container">
        <table id="spreadsheet">
            <thead id="grid-head"></thead>
            <tbody id="grid-body"></tbody>
        </table>
    </div>

    <!-- Sheet Tabs -->
    <div class="sheet-tabs" id="sheet-tabs">
        <!-- Tabs dynamic -->
        <div class="add-sheet" onclick="addNewSheet()">+</div>
    </div>

    <script>
        /**
         * CORE DATA MODEL
         */
        let state = {
            sheets: {
                'Sheet1': {
                    data: {}, // { 'A1': { raw: '=1+2', val: 3, style: {} } }
                    cols: 26,
                    rows: 100
                }
            },
            activeSheet: 'Sheet1',
            selection: {
                start: { r: 0, c: 0 },
                end: { r: 0, c: 0 },
                active: { r: 0, c: 0 }
            },
            isEditing: false,
            isDragging: false
        };

        const formulaInput = document.getElementById('formula-input');
        const activeCellDisplay = document.getElementById('active-cell-id');

        // Init
        window.onload = () => {
            renderTabs();
            initGrid();
            setupEventListeners();
        };

        /**
         * GRID RENDERING
         */
        function initGrid() {
            const sheet = state.sheets[state.activeSheet];
            const head = document.getElementById('grid-head');
            const body = document.getElementById('grid-body');
            
            head.innerHTML = '';
            body.innerHTML = '';

            // Header Row
            const headerRow = document.createElement('tr');
            headerRow.appendChild(document.createElement('th')); // Top-left empty
            for (let c = 0; c < sheet.cols; c++) {
                const th = document.createElement('th');
                th.className = 'col-header';
                th.innerText = colToLetter(c);
                
                const resizer = document.createElement('div');
                resizer.className = 'resizer';
                resizer.onmousedown = (e) => initResize(e, c);
                th.appendChild(resizer);
                
                headerRow.appendChild(th);
            }
            head.appendChild(headerRow);

            // Data Rows
            for (let r = 0; r < sheet.rows; r++) {
                const tr = document.createElement('tr');
                const rh = document.createElement('th');
                rh.className = 'row-header';
                rh.innerText = r + 1;
                tr.appendChild(rh);

                for (let c = 0; c < sheet.cols; c++) {
                    const td = document.createElement('td');
                    td.className = 'cell';
                    td.dataset.r = r;
                    td.dataset.c = c;
                    td.id = `cell-${getCoord(r, c)}`;
                    
                    const cellData = sheet.data[getCoord(r, c)];
                    if (cellData) {
                        td.innerText = cellData.val;
                        Object.assign(td.style, cellData.style);
                    }

                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
            updateSelectionUI();
        }

        /**
         * FORMULA ENGINE
         */
        function evaluateFormula(raw, sheetName) {
            if (!raw || raw === '') return '';
            if (!raw.startsWith('=')) return raw;

            const sheet = state.sheets[sheetName];
            let formula = raw.substring(1).toUpperCase();

            try {
                // 1. Handle Ranges (e.g., A1:B10)
                const rangeRegex = /([A-Z]+[0-9]+):([A-Z]+[0-9]+)/g;
                formula = formula.replace(rangeRegex, (match, start, end) => {
                    const cells = getCellsInRange(start, end);
                    const vals = cells.map(coord => parseFloat(sheet.data[coord]?.val || 0));
                    return `[${vals.join(',')}]`;
                });

                // 2. Handle Single Cell References (e.g., A1)
                const cellRegex = /\b([A-Z]+[0-9]+)\b/g;
                formula = formula.replace(cellRegex, (match) => {
                    const val = sheet.data[match]?.val;
                    return isNaN(parseFloat(val)) ? 0 : parseFloat(val);
                });

                // 3. Handle Functions
                formula = formula.replace(/SUM\(\s*([^)]+)\s*\)/g, (_, args) => {
                    const list = args.replace(/[\[\]]/g, '').split(',').map(Number);
                    return list.reduce((a, b) => a + b, 0);
                });
                formula = formula.replace(/AVERAGE\(\s*([^)]+)\s*\)/g, (_, args) => {
                    const list = args.replace(/[\[\]]/g, '').split(',').map(Number);
                    return list.reduce((a, b) => a + b, 0) / list.length;
                });
                formula = formula.replace(/MAX\(\s*([^)]+)\s*\)/g, (_, args) => {
                    const list = args.replace(/[\[\]]/g, '').split(',').map(Number);
                    return Math.max(...list);
                });
                formula = formula.replace(/MIN\(\s*([^)]+)\s*\)/g, (_, args) => {
                    const list = args.replace(/[\[\]]/g, '').split(',').map(Number);
                    return Math.min(...list);
                });

                // 4. Final Evaluation (Math)
                // We use a safer replacement for eval for basic arithmetic
                return Function(`'use strict'; return (${formula})`)();
            } catch (e) {
                return '#ERROR!';
            }
        }

        function recalculateAll() {
            const sheet = state.sheets[state.activeSheet];
            const keys = Object.keys(sheet.data);
            
            // To handle dependencies properly, we do a few passes or topological sort.
            // For this clone, we'll do 3 passes which covers most nested dependencies.
            for (let i = 0; i < 3; i++) {
                keys.forEach(coord => {
                    const cell = sheet.data[coord];
                    if (cell.raw && cell.raw.startsWith('=')) {
                        cell.val = evaluateFormula(cell.raw, state.activeSheet);
                        document.getElementById(`cell-${coord}`).innerText = cell.val;
                    }
                });
            }
        }

        /**
         * INTERACTION LOGIC
         */
        function setupEventListeners() {
            const grid = document.getElementById('grid-container');

            grid.addEventListener('mousedown', (e) => {
                if (e.target.classList.contains('cell')) {
                    state.isDragging = true;
                    const r = parseInt(e.target.dataset.r);
                    const c = parseInt(e.target.dataset.c);
                    state.selection.start = { r, c };
                    state.selection.end = { r, c };
                    state.selection.active = { r, c };
                    updateSelectionUI();
                }
            });

            grid.addEventListener('mousemove', (e) => {
                if (state.isDragging && e.target.classList.contains('cell')) {
                    state.selection.end = { 
                        r: parseInt(e.target.dataset.r), 
                        c: parseInt(e.target.dataset.c) 
                    };
                    updateSelectionUI();
                }
            });

            grid.addEventListener('mouseup', () => {
                state.isDragging = false;
            });

            grid.addEventListener('dblclick', (e) => {
                if (e.target.classList.contains('cell')) {
                    enterEditMode(e.target);
                }
            });

            // Formula bar interaction
            formulaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    commitEdit(formulaInput.value);
                    formulaInput.blur();
                }
            });

            // Range selection during formula editing
            grid.addEventListener('click', (e) => {
                if (document.activeElement === formulaInput && e.target.classList.contains('cell')) {
                    const coord = getCoord(parseInt(e.target.dataset.r), parseInt(e.target.dataset.c));
                    const start = formulaInput.selectionStart;
                    const end = formulaInput.selectionEnd;
                    const text = formulaInput.value;
                    formulaInput.value = text.slice(0, start) + coord + text.slice(end);
                    formulaInput.focus();
                    formulaInput.setSelectionRange(start + coord.length, start + coord.length);
                }
            });

            // Keyboard Nav
            window.addEventListener('keydown', (e) => {
                if (state.isEditing) return;
                const { r, c } = state.selection.active;
                if (e.key === 'ArrowUp' && r > 0) moveActiveCell(r - 1, c);
                if (e.key === 'ArrowDown' && r < state.sheets[state.activeSheet].rows - 1) moveActiveCell(r + 1, c);
                if (e.key === 'ArrowLeft' && c > 0) moveActiveCell(r, c - 1);
                if (e.key === 'ArrowRight' && c < state.sheets[state.activeSheet].cols - 1) moveActiveCell(r, c + 1);
                if (e.key === 'Enter') {
                    e.preventDefault();
                    enterEditMode(document.getElementById(`cell-${getCoord(r, c)}`));
                }
                if (e.key === 'Tab') {
                    e.preventDefault();
                    moveActiveCell(r, c + 1);
                }
            });
        }

        function moveActiveCell(r, c) {
            state.selection.active = { r, c };
            state.selection.start = { r, c };
            state.selection.end = { r, c };
            updateSelectionUI();
        }

        function enterEditMode(cellElement) {
            state.isEditing = true;
            const r = parseInt(cellElement.dataset.r);
            const c = parseInt(cellElement.dataset.c);
            const coord = getCoord(r, c);
            const cellData = state.sheets[state.activeSheet].data[coord] || { raw: '' };

            const editor = document.createElement('div');
            editor.className = 'cell-editor';
            editor.contentEditable = true;
            editor.innerText = cellData.raw || cellData.val || '';
            
            cellElement.appendChild(editor);
            editor.focus();

            editor.addEventListener('blur', () => {
                commitEdit(editor.innerText);
                cellElement.removeChild(editor);
                state.isEditing = false;
            });

            editor.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    editor.blur();
                }
            });
        }

        function commitEdit(value) {
            const { r, c } = state.selection.active;
            const coord = getCoord(r, c);
            const sheet = state.sheets[state.activeSheet];

            if (!sheet.data[coord]) sheet.data[coord] = { style: {} };
            
            sheet.data[coord].raw = value;
            sheet.data[coord].val = evaluateFormula(value, state.activeSheet);
            
            recalculateAll();
            updateSelectionUI();
        }

        function updateSelectionUI() {
            const { start, end, active } = state.selection;
            const sheet = state.sheets[state.activeSheet];
            
            // Clear previous
            document.querySelectorAll('.cell').forEach(el => {
                el.classList.remove('selected', 'range-selected');
            });

            const rMin = Math.min(start.r, end.r);
            const rMax = Math.max(start.r, end.r);
            const cMin = Math.min(start.c, end.c);
            const cMax = Math.max(start.c, end.c);

            for (let r = rMin; r <= rMax; r++) {
                for (let c = cMin; c <= cMax; c++) {
                    const el = document.getElementById(`cell-${getCoord(r, c)}`);
                    if (el) el.classList.add('range-selected');
                }
            }

            const activeEl = document.getElementById(`cell-${getCoord(active.r, active.c)}`);
            if (activeEl) activeEl.classList.add('selected');

            // Formula Bar
            const coord = getCoord(active.r, active.c);
            activeCellDisplay.innerText = coord;
            const cellData = sheet.data[coord];
            formulaInput.value = cellData ? (cellData.raw || cellData.val || '') : '';
        }

        /**
         * TOOLBAR ACTIONS
         */
        function applyStyle(prop, val) {
            const { start, end } = state.selection;
            for (let r = Math.min(start.r, end.r); r <= Math.max(start.r, end.r); r++) {
                for (let c = Math.min(start.c, end.c); c <= Math.max(start.c, end.c); c++) {
                    const coord = getCoord(r, c);
                    const sheet = state.sheets[state.activeSheet];
                    if (!sheet.data[coord]) sheet.data[coord] = { style: {} };
                    
                    // Toggle bold/italic
                    if (prop === 'fontWeight' || prop === 'fontStyle') {
                        const current = sheet.data[coord].style[prop];
                        sheet.data[coord].style[prop] = (current === val) ? 'normal' : val;
                    } else {
                        sheet.data[coord].style[prop] = val;
                    }
                    
                    const el = document.getElementById(`cell-${coord}`);
                    if (el) Object.assign(el.style, sheet.data[coord].style);
                }
            }
        }

        function clearSelection() {
            const { start, end } = state.selection;
            const sheet = state.sheets[state.activeSheet];
            for (let r = Math.min(start.r, end.r); r <= Math.max(start.r, end.r); r++) {
                for (let c = Math.min(start.c, end.c); c <= Math.max(start.c, end.c); c++) {
                    delete sheet.data[getCoord(r, c)];
                    document.getElementById(`cell-${getCoord(r, c)}`).innerText = '';
                }
            }
        }

        /**
         * SHEET MANAGEMENT
         */
        function renderTabs() {
            const container = document.getElementById('sheet-tabs');
            container.innerHTML = '';
            
            Object.keys(state.sheets).forEach(name => {
                const tab = document.createElement('div');
                tab.className = `tab ${name === state.activeSheet ? 'active' : ''}`;
                tab.innerText = name;
                tab.onclick = () => {
                    state.activeSheet = name;
                    renderTabs();
                    initGrid();
                };
                tab.oncontextmenu = (e) => {
                    e.preventDefault();
                    showTabMenu(e, name);
                };
                container.appendChild(tab);
            });
            
            const addBtn = document.createElement('div');
            addBtn.className = 'add-sheet';
            addBtn.innerText = '+';
            addBtn.onclick = addNewSheet;
            container.appendChild(addBtn);
        }

        function addNewSheet() {
            const name = 'Sheet' + (Object.keys(state.sheets).length + 1);
            state.sheets[name] = { data: {}, cols: 26, rows: 100 };
            state.activeSheet = name;
            renderTabs();
            initGrid();
        }

        function showTabMenu(e, name) {
            const menu = document.createElement('div');
            menu.className = 'tab-context';
            menu.style.display = 'block';
            menu.style.left = e.pageX + 'px';
            menu.style.top = e.pageY + 'px';
            
            const renameBtn = document.createElement('div');
            renameBtn.innerText = 'Rename';
            renameBtn.style.padding = '5px 10px';
            renameBtn.style.cursor = 'pointer';
            renameBtn.onclick = () => {
                const newName = prompt('Enter new name:', name);
                if (newName && newName !== name) {
                    state.sheets[newName] = state.sheets[name];
                    delete state.sheets[name];
                    if (state.activeSheet === name) state.activeSheet = newName;
                    renderTabs();
                }
                menu.remove();
            };

            const deleteBtn = document.createElement('div');
            deleteBtn.innerText = 'Delete';
            deleteBtn.style.padding = '5px 10px';
            deleteBtn.style.cursor = 'pointer';
            deleteBtn.onclick = () => {
                if (Object.keys(state.sheets).length > 1) {
                    delete state.sheets[name];
                    if (state.activeSheet === name) state.activeSheet = Object.keys(state.sheets)[0];
                    renderTabs();
                    initGrid();
                }
                menu.remove();
            };

            menu.appendChild(renameBtn);
            menu.appendChild(deleteBtn);
            document.body.appendChild(menu);
            
            window.onclick = () => menu.remove();
        }

        /**
         * CSV IMPORT/EXPORT
         */
        function exportCSV() {
            const sheet = state.sheets[state.activeSheet];
            let csv = '';
            for (let r = 0; r < sheet.rows; r++) {
                let row = [];
                for (let c = 0; c < sheet.cols; c++) {
                    const cell = sheet.data[getCoord(r, c)];
                    row.push(`"${cell ? cell.val : ''}"`);
                }
                csv += row.join(',') + '\n';
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `${state.activeSheet}.csv`);
            a.click();
        }

        function triggerImport() {
            document.getElementById('csv-import').click();
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const text = e.target.result;
                const lines = text.split('\n');
                const sheet = state.sheets[state.activeSheet];
                sheet.data = {};
                lines.forEach((line, r) => {
                    const cols = line.split(',');
                    cols.forEach((val, c) => {
                        const cleanVal = val.replace(/^"|"$/g, '');
                        const coord = getCoord(r, c);
                        sheet.data[coord] = { raw: cleanVal, val: cleanVal, style: {} };
                    });
                });
                initGrid();
                recalculateAll();
            };
            reader.readAsText(file);
        }

        /**
         * UTILITIES
         */
        function colToLetter(c) {
            let letter = '';
            while (c >= 0) {
                letter = String.fromCharCode((c % 26) + 65) + letter;
                c = Math.floor(c / 26) - 1;
            }
            return letter;
        }

        function getCoord(r, c) {
            return colToLetter(c) + (r + 1);
        }

        function getCellsInRange(startCoord, endCoord) {
            const start = parseCoord(startCoord);
            const end = parseCoord(endCoord);
            const cells = [];
            for (let r = Math.min(start.r, end.r); r <= Math.max(start.r, end.r); r++) {
                for (let c = Math.min(start.c, end.c); c <= Math.max(start.c, end.c); c++) {
                    cells.push(getCoord(r, c));
                }
            }
            return cells;
        }

        function parseCoord(coord) {
            const match = coord.match(/([A-Z]+)([0-9]+)/);
            let col = 0;
            const letters = match[1];
            for (let i = 0; i < letters.length; i++) {
                col = col * 26 + (letters.charCodeAt(i) - 64);
            }
            return { r: parseInt(match[2]) - 1, c: col - 1 };
        }

        function initResize(e, colIndex) {
            e.stopPropagation();
            const startX = e.pageX;
            const startWidth = document.querySelectorAll('.col-header')[colIndex + 1].offsetWidth;
            
            const onMouseMove = (moveEvent) => {
                const newWidth = startWidth + (moveEvent.pageX - startX);
                const cols = document.querySelectorAll('.col-header');
                const cells = document.querySelectorAll(`.cell[data-c="${colIndex}"]`);
                
                cols[colIndex + 1].style.width = newWidth + 'px';
                cells.forEach(cell => cell.style.width = (newWidth - 2) + 'px');
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        }

    </script>
</body>
