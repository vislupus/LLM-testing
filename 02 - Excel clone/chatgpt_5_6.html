<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gridline — Spreadsheet</title>
<style>
  :root {
    --green:#107c41;
    --green-dark:#0b5f31;
    --green-soft:#eaf4ee;
    --border:#d9dfdc;
    --header:#f4f6f5;
    --text:#1f2925;
    --muted:#66736d;
    --select:#217346;
    --select-fill:rgba(33,115,70,.12);
    --shadow:0 8px 28px rgba(24,42,33,.12);
    --row-head:54px;
    --font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#eef2ef;color:var(--text);font-family:var(--font);overflow:hidden}
  button,input,select{font:inherit}
  button{border:0;background:none;color:inherit}
  .app{height:100%;display:flex;flex-direction:column;background:#fff}
  .titlebar{height:42px;background:linear-gradient(90deg,var(--green-dark),var(--green));color:#fff;display:flex;align-items:center;padding:0 14px;gap:12px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.1px}
  .brand-mark{width:25px;height:25px;border-radius:6px;background:#fff;color:var(--green);display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
  .doc-title{font-size:14px;opacity:.95}
  .spacer{flex:1}
  .title-action{color:#fff;opacity:.9;padding:7px 9px;border-radius:6px;cursor:pointer}
  .title-action:hover{background:rgba(255,255,255,.13)}

  .ribbon{height:92px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:stretch;padding:8px 12px;gap:12px;flex:0 0 auto;box-shadow:0 2px 10px rgba(20,40,30,.05);z-index:5}
  .group{display:flex;align-items:center;gap:6px;padding:0 12px 16px 0;border-right:1px solid #e7ebe8;position:relative}
  .group:last-child{border-right:0}
  .group-label{position:absolute;bottom:0;left:0;right:12px;text-align:center;font-size:10px;color:#7b8781;letter-spacing:.3px;text-transform:uppercase}
  .tool{min-width:34px;height:34px;border:1px solid transparent;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;cursor:pointer;background:#fff}
  .tool:hover{background:#f1f6f3;border-color:#dce8e1}
  .tool.active{background:var(--green-soft);border-color:#bcd7c6;color:var(--green-dark)}
  .tool.wide{min-width:92px}
  .tool strong{font-size:18px}
  .color-wrap{display:flex;align-items:center;gap:7px;height:34px;padding:0 8px;border-radius:7px;border:1px solid transparent}
  .color-wrap:hover{background:#f1f6f3;border-color:#dce8e1}
  .color-wrap input{width:26px;height:24px;border:0;background:transparent;padding:0;cursor:pointer}
  .upload-label{cursor:pointer}
  .upload-label input{display:none}

  .formula-row{height:42px;display:grid;grid-template-columns:110px 38px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--border);background:#fff;flex:0 0 auto}
  .name-box{height:100%;border:0;border-right:1px solid var(--border);padding:0 12px;font-weight:650;color:#31423a;outline:none;background:#fafbfa}
  .fx{height:100%;display:grid;place-items:center;color:var(--muted);font-style:italic;font-weight:700;border-right:1px solid var(--border)}
  .formula-input{height:100%;border:0;outline:none;padding:0 12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px}
  .formula-input:focus{box-shadow:inset 0 -2px var(--green)}

  .workspace{min-height:0;flex:1;display:flex;flex-direction:column;background:#fff}
  .grid-shell{min-height:0;flex:1;position:relative;overflow:auto;background:#fff;scrollbar-color:#b8c3bd #f1f3f2;scrollbar-width:thin}
  table.sheet-grid{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:max-content;background:#fff}
  col.row-col{width:var(--row-head)}
  thead th{position:sticky;top:0;z-index:4;height:28px;background:var(--header);border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px;color:#4d5b55;text-align:center;font-weight:600;user-select:none}
  thead th.corner{left:0;z-index:6;width:var(--row-head);min-width:var(--row-head);box-shadow:1px 0 0 var(--border)}
  .select-all-corner{width:0;height:0;border-style:solid;border-width:0 0 12px 12px;border-color:transparent transparent #8e9994 transparent;position:absolute;right:4px;bottom:4px;transform:rotate(0deg)}
  .col-header{position:relative}
  .resize-handle{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:8}
  tbody th{position:sticky;left:0;z-index:3;width:var(--row-head);min-width:var(--row-head);height:24px;background:var(--header);border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:12px;color:#5d6963;text-align:center;font-weight:500;user-select:none}
  td.cell{height:24px;min-height:24px;border-right:1px solid #e1e5e2;border-bottom:1px solid #e1e5e2;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;line-height:19px;outline:none;position:relative;background:#fff;cursor:cell}
  td.cell.selected{background:var(--select-fill)}
  td.cell.primary{box-shadow:inset 0 0 0 2px var(--select);z-index:2}
  td.cell.range-top{border-top:2px solid var(--select)}
  td.cell.range-bottom{border-bottom:2px solid var(--select)}
  td.cell.range-left{border-left:2px solid var(--select)}
  td.cell.range-right{border-right:2px solid var(--select)}
  td.cell.editing{cursor:text;background:#fff;box-shadow:inset 0 0 0 2px var(--green);overflow:visible;z-index:10}
  td.cell.error{color:#b42318;font-weight:650}
  td.cell[data-type="number"]{text-align:right}
  td.cell[data-type="text"]{text-align:left}
  td.cell::selection{background:#bfe0ca}

  .statusbar{height:28px;border-top:1px solid var(--border);background:#f6f8f7;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#5f6c66;gap:18px;flex:0 0 auto}
  .statusbar .right{margin-left:auto}

  .sheetbar{height:42px;border-top:1px solid var(--border);display:flex;align-items:center;background:#f6f8f7;flex:0 0 auto;min-width:0}
  .sheet-controls{display:flex;align-items:center;padding:0 8px;gap:4px}
  .sheet-add{width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;color:var(--green)}
  .sheet-add:hover{background:#e6eee9}
  .sheet-tabs{display:flex;align-items:stretch;height:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  .sheet-tab{min-width:110px;max-width:180px;padding:0 18px;display:flex;align-items:center;justify-content:center;border-right:1px solid #dfe4e1;background:#f8faf9;color:#47544e;cursor:pointer;position:relative;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheet-tab:hover{background:#eef4f0}
  .sheet-tab.active{background:#fff;color:var(--green-dark);font-weight:700}
  .sheet-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--green)}

  .toast{position:fixed;right:20px;bottom:64px;background:#1f2f27;color:#fff;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:30}
  .toast.show{opacity:1;transform:none}

  .modal-backdrop{position:fixed;inset:0;background:rgba(15,29,21,.32);display:none;align-items:center;justify-content:center;z-index:40}
  .modal-backdrop.show{display:flex}
  .modal{width:min(420px,calc(100vw - 32px));background:white;border-radius:14px;box-shadow:var(--shadow);padding:22px}
  .modal h3{margin:0 0 14px;font-size:19px}
  .modal input{width:100%;height:40px;border:1px solid var(--border);border-radius:8px;padding:0 11px;outline:none}
  .modal input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(16,124,65,.12)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .modal-btn{height:36px;padding:0 14px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:#fff}
  .modal-btn.primary{background:var(--green);color:white;border-color:var(--green)}

  @media (max-width: 780px){
    .ribbon{height:auto;min-height:82px;overflow-x:auto;padding-bottom:8px}
    .group{flex:0 0 auto}
    .tool.wide span{display:none}
    .tool.wide{min-width:38px}
    .doc-title{display:none}
    .formula-row{grid-template-columns:82px 34px minmax(0,1fr)}
  }
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand"><div class="brand-mark">G</div><span>Gridline</span></div>
    <div class="doc-title">Browser Spreadsheet</div>
    <div class="spacer"></div>
    <button class="title-action" id="saveLocalBtn" title="Save workbook in this browser">Save</button>
    <button class="title-action" id="newBookBtn" title="Create a new workbook">New</button>
  </header>

  <section class="ribbon" aria-label="Spreadsheet toolbar">
    <div class="group">
      <button class="tool" id="boldBtn" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button class="tool" id="italicBtn" title="Italic (Ctrl+I)"><strong style="font-style:italic">I</strong></button>
      <label class="color-wrap" title="Cell background color"><span>Fill</span><input type="color" id="bgColor" value="#fff2cc" /></label>
      <div class="group-label">Formatting</div>
    </div>
    <div class="group">
      <button class="tool wide" id="clearBtn" title="Clear selected cells">⌫ <span>Clear</span></button>
      <button class="tool wide" id="fitBtn" title="Auto-fit selected columns">↔ <span>Auto-fit</span></button>
      <div class="group-label">Cells</div>
    </div>
    <div class="group">
      <button class="tool wide" id="downloadBtn" title="Download active sheet as CSV">⇩ <span>Download CSV</span></button>
      <label class="tool wide upload-label" title="Upload CSV">⇧ <span>Upload CSV</span><input type="file" id="uploadInput" accept=".csv,text/csv" /></label>
      <div class="group-label">Data</div>
    </div>
  </section>

  <div class="formula-row">
    <input class="name-box" id="nameBox" value="A1" aria-label="Selected cell address" />
    <div class="fx">fx</div>
    <input class="formula-input" id="formulaInput" placeholder="Enter a value or formula, for example =SUM(A1:A10)" aria-label="Formula bar" />
  </div>

  <main class="workspace">
    <div class="grid-shell" id="gridShell">
      <table class="sheet-grid" id="sheetGrid" aria-label="Spreadsheet grid">
        <colgroup id="colgroup"><col class="row-col" /></colgroup>
        <thead><tr id="columnHeaderRow"><th class="corner"><span class="select-all-corner"></span></th></tr></thead>
        <tbody id="gridBody"></tbody>
      </table>
    </div>
    <div class="statusbar"><span id="statusText">Ready</span><span id="selectionStats"></span><span class="right">100 rows × 30 columns</span></div>
    <div class="sheetbar">
      <div class="sheet-controls"><button class="sheet-add" id="addSheetBtn" title="Add sheet">＋</button></div>
      <div class="sheet-tabs" id="sheetTabs"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="renameModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="renameTitle">
    <h3 id="renameTitle">Rename sheet</h3>
    <input id="renameInput" maxlength="31" />
    <div class="modal-actions">
      <button class="modal-btn" id="renameCancel">Cancel</button>
      <button class="modal-btn primary" id="renameConfirm">Rename</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const ROWS = 100;
  const COLS = 30;
  const DEFAULT_COL_WIDTH = 96;
  const STORAGE_KEY = 'gridline-workbook-v1';

  const grid = document.getElementById('sheetGrid');
  const gridBody = document.getElementById('gridBody');
  const columnHeaderRow = document.getElementById('columnHeaderRow');
  const colgroup = document.getElementById('colgroup');
  const gridShell = document.getElementById('gridShell');
  const formulaInput = document.getElementById('formulaInput');
  const nameBox = document.getElementById('nameBox');
  const sheetTabs = document.getElementById('sheetTabs');
  const statusText = document.getElementById('statusText');
  const selectionStats = document.getElementById('selectionStats');
  const toast = document.getElementById('toast');
  const renameModal = document.getElementById('renameModal');
  const renameInput = document.getElementById('renameInput');

  const workbook = {
    sheets: [makeSheet('Sheet1')],
    active: 0,
    columnWidths: Array(COLS).fill(DEFAULT_COL_WIDTH)
  };

  let selection = { start: { r: 0, c: 0 }, end: { r: 0, c: 0 } };
  let dragging = false;
  let dragMode = 'select';
  let editingCell = null;
  let formulaRangeStart = null;
  let formulaEditTarget = { r: 0, c: 0 };
  let renameIndex = -1;

  function makeSheet(name) {
    return { name, cells: {} };
  }

  function activeSheet() {
    return workbook.sheets[workbook.active];
  }

  function colName(index) {
    let n = index + 1;
    let s = '';
    while (n > 0) {
      const rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function colIndex(name) {
    let n = 0;
    for (const ch of name.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
    return n - 1;
  }

  function addressOf(r, c) {
    return colName(c) + (r + 1);
  }

  function parseAddress(address) {
    const m = /^\$?([A-Z]+)\$?(\d+)$/i.exec(String(address).trim());
    if (!m) return null;
    const c = colIndex(m[1]);
    const r = Number(m[2]) - 1;
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r, c };
  }

  function normalizedSelection() {
    return {
      r1: Math.min(selection.start.r, selection.end.r),
      r2: Math.max(selection.start.r, selection.end.r),
      c1: Math.min(selection.start.c, selection.end.c),
      c2: Math.max(selection.start.c, selection.end.c)
    };
  }

  function eachSelected(callback) {
    const s = normalizedSelection();
    for (let r = s.r1; r <= s.r2; r++) {
      for (let c = s.c1; c <= s.c2; c++) callback(r, c);
    }
  }

  function getCellRecord(r, c, create = false) {
    const key = addressOf(r, c);
    const sheet = activeSheet();
    if (!sheet.cells[key] && create) sheet.cells[key] = { raw: '', value: '', format: {} };
    return sheet.cells[key] || null;
  }

  function buildGrid() {
    for (let c = 0; c < COLS; c++) {
      const col = document.createElement('col');
      col.style.width = workbook.columnWidths[c] + 'px';
      col.dataset.c = c;
      colgroup.appendChild(col);

      const th = document.createElement('th');
      th.className = 'col-header';
      th.dataset.c = c;
      th.textContent = colName(c);
      const handle = document.createElement('span');
      handle.className = 'resize-handle';
      handle.addEventListener('mousedown', startColumnResize);
      th.appendChild(handle);
      columnHeaderRow.appendChild(th);
    }

    const frag = document.createDocumentFragment();
    for (let r = 0; r < ROWS; r++) {
      const tr = document.createElement('tr');
      const rowHead = document.createElement('th');
      rowHead.textContent = r + 1;
      rowHead.dataset.r = r;
      rowHead.addEventListener('mousedown', () => selectWholeRow(r));
      tr.appendChild(rowHead);

      for (let c = 0; c < COLS; c++) {
        const td = document.createElement('td');
        td.className = 'cell';
        td.dataset.r = r;
        td.dataset.c = c;
        td.tabIndex = -1;
        td.addEventListener('mousedown', cellMouseDown);
        td.addEventListener('mouseenter', cellMouseEnter);
        td.addEventListener('dblclick', () => beginCellEdit(td));
        td.addEventListener('keydown', cellEditorKeyDown);
        td.addEventListener('blur', cellEditorBlur);
        tr.appendChild(td);
      }
      frag.appendChild(tr);
    }
    gridBody.appendChild(frag);

    [...columnHeaderRow.querySelectorAll('.col-header')].forEach(th => {
      th.addEventListener('mousedown', event => {
        if (event.target.classList.contains('resize-handle')) return;
        selectWholeColumn(Number(th.dataset.c));
      });
    });
  }

  function getCellElement(r, c) {
    return gridBody.rows[r]?.cells[c + 1] || null;
  }

  function refreshGrid() {
    const sheet = activeSheet();
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const td = getCellElement(r, c);
        const rec = sheet.cells[addressOf(r, c)];
        const value = rec?.value ?? '';
        td.textContent = displayValue(value);
        td.style.fontWeight = rec?.format?.bold ? '700' : '';
        td.style.fontStyle = rec?.format?.italic ? 'italic' : '';
        td.style.backgroundColor = rec?.format?.bg || '';
        td.dataset.type = typeof value === 'number' ? 'number' : 'text';
        td.classList.toggle('error', typeof value === 'string' && value.startsWith('#'));
      }
    }
    applySelectionVisuals();
    updateFormulaBar();
  }

  function displayValue(value) {
    if (typeof value === 'number') {
      if (!Number.isFinite(value)) return '#ERROR!';
      return Number.isInteger(value) ? String(value) : String(Number(value.toFixed(10)));
    }
    return value ?? '';
  }

  function cellMouseDown(event) {
    if (event.button !== 0) return;
    const td = event.currentTarget;
    const point = { r: Number(td.dataset.r), c: Number(td.dataset.c) };

    if (document.activeElement === formulaInput && formulaInput.value.trim().startsWith('=')) {
      event.preventDefault();
      dragging = true;
      dragMode = 'formula';
      formulaRangeStart = point;
      selection = { start: point, end: point };
      applySelectionVisuals();
      return;
    }

    if (document.activeElement === formulaInput) formulaInput.blur();
    commitActiveEditor();
    dragging = true;
    dragMode = 'select';
    selection = { start: point, end: point };
    applySelectionVisuals();
    updateFormulaBar();
    event.preventDefault();
  }

  function cellMouseEnter(event) {
    if (!dragging) return;
    const td = event.currentTarget;
    selection.end = { r: Number(td.dataset.r), c: Number(td.dataset.c) };
    applySelectionVisuals();
  }

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    if (dragMode === 'formula' && formulaRangeStart) insertSelectionReference();
    dragging = false;
    formulaRangeStart = null;
    dragMode = 'select';
    updateFormulaBar(false);
  });

  function insertSelectionReference() {
    const s = normalizedSelection();
    const ref = s.r1 === s.r2 && s.c1 === s.c2
      ? addressOf(s.r1, s.c1)
      : `${addressOf(s.r1, s.c1)}:${addressOf(s.r2, s.c2)}`;
    const start = formulaInput.selectionStart ?? formulaInput.value.length;
    const end = formulaInput.selectionEnd ?? start;
    const before = formulaInput.value.slice(0, start);
    const after = formulaInput.value.slice(end);
    const needsComma = /[A-Z0-9)]$/i.test(before) && !/[+\-*/(,]$/.test(before);
    const insertion = (needsComma ? ',' : '') + ref;
    formulaInput.value = before + insertion + after;
    const caret = before.length + insertion.length;
    formulaInput.focus();
    formulaInput.setSelectionRange(caret, caret);
    statusText.textContent = `Inserted ${ref}`;
  }

  function applySelectionVisuals() {
    document.querySelectorAll('td.cell.selected,td.cell.primary,td.cell.range-top,td.cell.range-bottom,td.cell.range-left,td.cell.range-right').forEach(el => {
      el.classList.remove('selected','primary','range-top','range-bottom','range-left','range-right');
    });
    const s = normalizedSelection();
    for (let r = s.r1; r <= s.r2; r++) {
      for (let c = s.c1; c <= s.c2; c++) {
        const td = getCellElement(r, c);
        td.classList.add('selected');
        if (r === s.r1) td.classList.add('range-top');
        if (r === s.r2) td.classList.add('range-bottom');
        if (c === s.c1) td.classList.add('range-left');
        if (c === s.c2) td.classList.add('range-right');
      }
    }
    getCellElement(selection.end.r, selection.end.c)?.classList.add('primary');
    updateSelectionStats();
  }

  function updateSelectionStats() {
    const nums = [];
    eachSelected((r, c) => {
      const v = getCellRecord(r, c)?.value;
      if (typeof v === 'number' && Number.isFinite(v)) nums.push(v);
    });
    const s = normalizedSelection();
    const count = (s.r2 - s.r1 + 1) * (s.c2 - s.c1 + 1);
    const parts = [`Count: ${count}`];
    if (nums.length) {
      parts.push(`Sum: ${displayValue(nums.reduce((a,b)=>a+b,0))}`);
      parts.push(`Average: ${displayValue(nums.reduce((a,b)=>a+b,0)/nums.length)}`);
    }
    selectionStats.textContent = parts.join('  ·  ');
  }

  function updateFormulaBar(updateValue = true) {
    const { r, c } = selection.end;
    const rec = getCellRecord(r, c);
    nameBox.value = addressOf(r, c);
    if (updateValue && document.activeElement !== formulaInput) formulaInput.value = rec?.raw ?? '';
    statusText.textContent = `${activeSheet().name} · ${addressOf(r, c)}`;
    updateToolbarState();
  }

  function beginCellEdit(td, initialText = null) {
    commitActiveEditor();
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    selection = { start: {r,c}, end: {r,c} };
    applySelectionVisuals();
    const rec = getCellRecord(r, c);
    td.contentEditable = 'true';
    td.classList.add('editing');
    td.textContent = initialText !== null ? initialText : (rec?.raw ?? '');
    td.focus();
    placeCaretAtEnd(td);
    editingCell = td;
  }

  function placeCaretAtEnd(el) {
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function commitActiveEditor() {
    if (!editingCell) return;
    const td = editingCell;
    const r = Number(td.dataset.r), c = Number(td.dataset.c);
    const raw = td.textContent.replace(/\n/g, '');
    td.contentEditable = 'false';
    td.classList.remove('editing');
    editingCell = null;
    setCellRaw(r, c, raw);
  }

  function cellEditorBlur(event) {
    if (event.currentTarget === editingCell) commitActiveEditor();
  }

  function cellEditorKeyDown(event) {
    if (!event.currentTarget.isContentEditable) return;
    if (event.key === 'Enter' || event.key === 'Tab') {
      event.preventDefault();
      const td = event.currentTarget;
      const r = Number(td.dataset.r), c = Number(td.dataset.c);
      commitActiveEditor();
      moveSelection(event.key === 'Enter' ? 1 : 0, event.key === 'Tab' ? (event.shiftKey ? -1 : 1) : 0);
      if (event.key === 'Enter') beginCellEdit(getCellElement(Math.min(ROWS - 1, r + 1), c));
    } else if (event.key === 'Escape') {
      event.preventDefault();
      const td = event.currentTarget;
      td.contentEditable = 'false';
      td.classList.remove('editing');
      editingCell = null;
      refreshGrid();
    }
  }

  function setCellRaw(r, c, raw) {
    const rec = getCellRecord(r, c, true);
    rec.raw = raw;
    if (raw === '' && !rec.format?.bold && !rec.format?.italic && !rec.format?.bg) {
      delete activeSheet().cells[addressOf(r,c)];
    }
    recalculateSheet();
    refreshGrid();
  }

  formulaInput.addEventListener('focus', () => {
    formulaEditTarget = { ...selection.end };
  });

  formulaInput.addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      const { r, c } = formulaEditTarget;
      setCellRaw(r, c, formulaInput.value);
      selection = { start: { r, c }, end: { r, c } };
      moveSelection(1, 0);
      formulaInput.blur();
      updateFormulaBar();
    } else if (event.key === 'Escape') {
      formulaInput.value = getCellRecord(formulaEditTarget.r, formulaEditTarget.c)?.raw ?? '';
      formulaInput.blur();
    }
  });

  formulaInput.addEventListener('blur', () => {
    if (dragMode === 'formula') return;
    const { r, c } = formulaEditTarget;
    const current = getCellRecord(r, c)?.raw ?? '';
    if (formulaInput.value !== current) setCellRaw(r, c, formulaInput.value);
  });

  nameBox.addEventListener('keydown', event => {
    if (event.key !== 'Enter') return;
    const pos = parseAddress(nameBox.value);
    if (!pos) {
      showToast('Enter a valid address such as A1 or AA20');
      updateFormulaBar();
      return;
    }
    selection = { start: pos, end: pos };
    applySelectionVisuals();
    updateFormulaBar();
    scrollCellIntoView(pos.r, pos.c);
  });

  document.addEventListener('keydown', event => {
    if (editingCell || document.activeElement === formulaInput || document.activeElement === nameBox || renameModal.classList.contains('show')) return;
    if (event.ctrlKey || event.metaKey) {
      if (event.key.toLowerCase() === 'b') { event.preventDefault(); toggleFormat('bold'); }
      if (event.key.toLowerCase() === 'i') { event.preventDefault(); toggleFormat('italic'); }
      if (event.key.toLowerCase() === 's') { event.preventDefault(); saveLocal(); }
      return;
    }
    const keyMap = {
      ArrowUp: [-1,0], ArrowDown: [1,0], ArrowLeft: [0,-1], ArrowRight: [0,1],
      Enter: [1,0], Tab: [0,event.shiftKey ? -1 : 1]
    };
    if (keyMap[event.key]) {
      event.preventDefault();
      moveSelection(...keyMap[event.key], event.shiftKey && event.key.startsWith('Arrow'));
      return;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      event.preventDefault();
      clearSelected();
      return;
    }
    if (event.key === 'F2') {
      event.preventDefault();
      beginCellEdit(getCellElement(selection.end.r, selection.end.c));
      return;
    }
    if (event.key.length === 1 && !event.altKey) {
      event.preventDefault();
      beginCellEdit(getCellElement(selection.end.r, selection.end.c), event.key);
    }
  });

  function moveSelection(dr, dc, extend = false) {
    const next = {
      r: Math.max(0, Math.min(ROWS - 1, selection.end.r + dr)),
      c: Math.max(0, Math.min(COLS - 1, selection.end.c + dc))
    };
    selection = extend ? { start: selection.start, end: next } : { start: next, end: next };
    applySelectionVisuals();
    updateFormulaBar();
    scrollCellIntoView(next.r, next.c);
  }

  function scrollCellIntoView(r, c) {
    getCellElement(r, c)?.scrollIntoView({block:'nearest', inline:'nearest'});
  }

  function selectWholeRow(r) {
    commitActiveEditor();
    selection = { start: {r, c:0}, end: {r, c:COLS-1} };
    applySelectionVisuals();
    updateFormulaBar();
  }

  function selectWholeColumn(c) {
    commitActiveEditor();
    selection = { start: {r:0, c}, end: {r:ROWS-1, c} };
    applySelectionVisuals();
    updateFormulaBar();
  }

  columnHeaderRow.querySelector('.corner').addEventListener('mousedown', () => {
    selection = { start:{r:0,c:0}, end:{r:ROWS-1,c:COLS-1} };
    applySelectionVisuals();
    updateFormulaBar();
  });

  function startColumnResize(event) {
    event.preventDefault();
    event.stopPropagation();
    const c = Number(event.currentTarget.parentElement.dataset.c);
    const startX = event.clientX;
    const startWidth = workbook.columnWidths[c];
    const move = e => {
      const width = Math.max(48, Math.min(420, startWidth + e.clientX - startX));
      workbook.columnWidths[c] = width;
      colgroup.children[c + 1].style.width = width + 'px';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }

  function toggleFormat(type) {
    eachSelected((r,c) => {
      const rec = getCellRecord(r,c,true);
      rec.format = rec.format || {};
      rec.format[type] = !rec.format[type];
    });
    refreshGrid();
  }

  function applyBackground(color) {
    eachSelected((r,c) => {
      const rec = getCellRecord(r,c,true);
      rec.format = rec.format || {};
      rec.format.bg = color;
    });
    refreshGrid();
  }

  function clearSelected() {
    eachSelected((r,c) => {
      const rec = getCellRecord(r,c);
      if (rec) rec.raw = '';
    });
    recalculateSheet();
    refreshGrid();
  }

  function updateToolbarState() {
    const rec = getCellRecord(selection.end.r, selection.end.c);
    document.getElementById('boldBtn').classList.toggle('active', !!rec?.format?.bold);
    document.getElementById('italicBtn').classList.toggle('active', !!rec?.format?.italic);
  }

  document.getElementById('boldBtn').addEventListener('click', () => toggleFormat('bold'));
  document.getElementById('italicBtn').addEventListener('click', () => toggleFormat('italic'));
  document.getElementById('bgColor').addEventListener('input', e => applyBackground(e.target.value));
  document.getElementById('clearBtn').addEventListener('click', clearSelected);
  document.getElementById('fitBtn').addEventListener('click', autoFitColumns);

  function autoFitColumns() {
    const s = normalizedSelection();
    for (let c = s.c1; c <= s.c2; c++) {
      let maxChars = colName(c).length;
      for (let r = 0; r < ROWS; r++) {
        const text = displayValue(getCellRecord(r,c)?.value ?? '');
        maxChars = Math.max(maxChars, Math.min(42, String(text).length));
      }
      const width = Math.max(54, Math.min(340, 18 + maxChars * 7.5));
      workbook.columnWidths[c] = width;
      colgroup.children[c + 1].style.width = width + 'px';
    }
  }

  // Formula engine ----------------------------------------------------------
  function recalculateSheet() {
    const sheet = activeSheet();
    const memo = new Map();
    for (const address of Object.keys(sheet.cells)) {
      const rec = sheet.cells[address];
      rec.value = evaluateCell(address, new Set(), memo);
    }
  }

  function evaluateCell(address, visiting, memo) {
    if (memo.has(address)) return memo.get(address);
    if (visiting.has(address)) return '#CYCLE!';
    visiting.add(address);
    const rec = activeSheet().cells[address];
    let value = '';
    if (!rec || rec.raw === '') {
      value = '';
    } else if (String(rec.raw).startsWith('=')) {
      try {
        const parser = new FormulaParser(String(rec.raw).slice(1), ref => {
          const v = evaluateCell(ref, new Set(visiting), memo);
          if (typeof v === 'string' && v.startsWith('#')) throw new Error(v);
          if (v === '' || v == null) return 0;
          const n = Number(v);
          return Number.isFinite(n) ? n : 0;
        });
        value = parser.parse();
        if (typeof value === 'number' && !Number.isFinite(value)) value = '#DIV/0!';
      } catch (err) {
        value = String(err.message || '').startsWith('#') ? String(err.message) : '#ERROR!';
      }
    } else {
      const n = Number(rec.raw);
      value = String(rec.raw).trim() !== '' && Number.isFinite(n) ? n : rec.raw;
    }
    visiting.delete(address);
    memo.set(address, value);
    return value;
  }

  class FormulaParser {
    constructor(source, resolveCell) {
      this.tokens = this.tokenize(source);
      this.i = 0;
      this.resolveCell = resolveCell;
    }
    tokenize(source) {
      const tokens = [];
      let i = 0;
      while (i < source.length) {
        const ch = source[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/[0-9.]/.test(ch)) {
          const m = source.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
          if (!m) throw new Error('#ERROR!');
          tokens.push({type:'number', value:Number(m[0])});
          i += m[0].length; continue;
        }
        if (/[A-Za-z_$]/.test(ch)) {
          const m = source.slice(i).match(/^\$?[A-Za-z]+\$?\d+|^[A-Za-z_][A-Za-z0-9_]*/);
          if (!m) throw new Error('#ERROR!');
          const text = m[0].toUpperCase();
          tokens.push({type:/^\$?[A-Z]+\$?\d+$/.test(text)?'cell':'ident', value:text.replace(/\$/g,'')});
          i += m[0].length; continue;
        }
        if ('+-*/(),:'.includes(ch)) { tokens.push({type:ch,value:ch}); i++; continue; }
        throw new Error('#ERROR!');
      }
      tokens.push({type:'eof'});
      return tokens;
    }
    peek(type){ return this.tokens[this.i].type === type; }
    take(type){ if(!this.peek(type)) throw new Error('#ERROR!'); return this.tokens[this.i++]; }
    parse(){ const v=this.expression(); if(!this.peek('eof')) throw new Error('#ERROR!'); return this.toNumber(v); }
    expression(){ let v=this.term(); while(this.peek('+')||this.peek('-')){ const op=this.tokens[this.i++].type; const b=this.term(); v=op==='+'?this.toNumber(v)+this.toNumber(b):this.toNumber(v)-this.toNumber(b);} return v; }
    term(){ let v=this.unary(); while(this.peek('*')||this.peek('/')){ const op=this.tokens[this.i++].type; const b=this.unary(); const n=this.toNumber(b); if(op==='/'&&n===0) throw new Error('#DIV/0!'); v=op==='*'?this.toNumber(v)*n:this.toNumber(v)/n;} return v; }
    unary(){ if(this.peek('+')){this.i++;return this.unary();} if(this.peek('-')){this.i++;return -this.toNumber(this.unary());} return this.primary(); }
    primary(){
      if(this.peek('number')) return this.take('number').value;
      if(this.peek('cell')){
        const start=this.take('cell').value;
        if(this.peek(':')){this.i++; const end=this.take('cell').value; return {range:true,start,end};}
        return this.resolveCell(start);
      }
      if(this.peek('ident')){
        const name=this.take('ident').value;
        this.take('(');
        const args=[];
        if(!this.peek(')')){ do{ args.push(this.expression()); if(!this.peek(',')) break; this.i++; }while(true); }
        this.take(')');
        return this.callFunction(name,args);
      }
      if(this.peek('(')){ this.i++; const v=this.expression(); this.take(')'); return v; }
      throw new Error('#ERROR!');
    }
    callFunction(name,args){
      const values=[];
      for(const arg of args){
        if(arg && arg.range){ values.push(...this.rangeValues(arg.start,arg.end)); }
        else values.push(this.toNumber(arg));
      }
      if(!['SUM','AVERAGE','MIN','MAX'].includes(name)) throw new Error('#NAME?');
      if(name==='SUM') return values.reduce((a,b)=>a+b,0);
      if(!values.length) return 0;
      if(name==='AVERAGE') return values.reduce((a,b)=>a+b,0)/values.length;
      if(name==='MIN') return Math.min(...values);
      if(name==='MAX') return Math.max(...values);
    }
    rangeValues(a,b){
      const p1=parseAddress(a), p2=parseAddress(b);
      if(!p1||!p2) throw new Error('#REF!');
      const out=[];
      for(let r=Math.min(p1.r,p2.r);r<=Math.max(p1.r,p2.r);r++){
        for(let c=Math.min(p1.c,p2.c);c<=Math.max(p1.c,p2.c);c++) out.push(this.toNumber(this.resolveCell(addressOf(r,c))));
      }
      return out;
    }
    toNumber(v){ if(v&&v.range) throw new Error('#VALUE!'); const n=Number(v); return Number.isFinite(n)?n:0; }
  }

  // Sheets ------------------------------------------------------------------
  function renderSheetTabs() {
    sheetTabs.innerHTML = '';
    workbook.sheets.forEach((sheet, index) => {
      const tab = document.createElement('div');
      tab.className = 'sheet-tab' + (index === workbook.active ? ' active' : '');
      tab.textContent = sheet.name;
      tab.title = 'Click to select · Double-click to rename · Right-click to delete';
      tab.addEventListener('click', () => switchSheet(index));
      tab.addEventListener('dblclick', () => openRename(index));
      tab.addEventListener('contextmenu', event => {
        event.preventDefault();
        deleteSheet(index);
      });
      sheetTabs.appendChild(tab);
    });
  }

  function switchSheet(index) {
    commitActiveEditor();
    workbook.active = index;
    selection = {start:{r:0,c:0},end:{r:0,c:0}};
    recalculateSheet();
    renderSheetTabs();
    refreshGrid();
  }

  document.getElementById('addSheetBtn').addEventListener('click', () => {
    const existing = new Set(workbook.sheets.map(s => s.name));
    let n = workbook.sheets.length + 1;
    while (existing.has(`Sheet${n}`)) n++;
    workbook.sheets.push(makeSheet(`Sheet${n}`));
    switchSheet(workbook.sheets.length - 1);
  });

  function openRename(index) {
    renameIndex = index;
    renameInput.value = workbook.sheets[index].name;
    renameModal.classList.add('show');
    setTimeout(() => { renameInput.focus(); renameInput.select(); }, 0);
  }

  function closeRename() {
    renameModal.classList.remove('show');
    renameIndex = -1;
  }

  function confirmRename() {
    const name = renameInput.value.trim();
    if (!name) return showToast('Sheet name cannot be empty');
    if (workbook.sheets.some((s,i) => i !== renameIndex && s.name.toLowerCase() === name.toLowerCase())) return showToast('That sheet name is already used');
    workbook.sheets[renameIndex].name = name;
    renderSheetTabs();
    closeRename();
  }

  document.getElementById('renameCancel').addEventListener('click', closeRename);
  document.getElementById('renameConfirm').addEventListener('click', confirmRename);
  renameInput.addEventListener('keydown', e => { if(e.key==='Enter') confirmRename(); if(e.key==='Escape') closeRename(); });
  renameModal.addEventListener('mousedown', e => { if(e.target===renameModal) closeRename(); });

  function deleteSheet(index) {
    if (workbook.sheets.length === 1) return showToast('A workbook must contain at least one sheet');
    if (!confirm(`Delete “${workbook.sheets[index].name}”? This cannot be undone.`)) return;
    workbook.sheets.splice(index,1);
    workbook.active = Math.max(0, Math.min(workbook.active, workbook.sheets.length - 1));
    renderSheetTabs();
    recalculateSheet();
    refreshGrid();
  }

  // CSV ---------------------------------------------------------------------
  document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
  document.getElementById('uploadInput').addEventListener('change', uploadCSV);

  function downloadCSV() {
    const sheet = activeSheet();
    let maxR = 0, maxC = 0;
    Object.keys(sheet.cells).forEach(addr => {
      const p = parseAddress(addr);
      if (p && sheet.cells[addr].raw !== '') { maxR = Math.max(maxR,p.r); maxC = Math.max(maxC,p.c); }
    });
    const lines=[];
    for(let r=0;r<=maxR;r++){
      const row=[];
      for(let c=0;c<=maxC;c++) row.push(csvEscape(sheet.cells[addressOf(r,c)]?.raw ?? ''));
      lines.push(row.join(','));
    }
    const blob = new Blob([lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sanitizeFilename(sheet.name) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV downloaded');
  }

  function csvEscape(value) {
    const s = String(value ?? '');
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }

  function parseCSV(text) {
    const rows=[]; let row=[]; let field=''; let quoted=false;
    for(let i=0;i<text.length;i++){
      const ch=text[i];
      if(quoted){
        if(ch==='"' && text[i+1]==='"'){field+='"';i++;}
        else if(ch==='"') quoted=false;
        else field+=ch;
      } else {
        if(ch==='"') quoted=true;
        else if(ch===','){row.push(field);field='';}
        else if(ch==='\n'){row.push(field.replace(/\r$/,''));rows.push(row);row=[];field='';}
        else field+=ch;
      }
    }
    row.push(field.replace(/\r$/,''));
    if(row.length>1 || row[0]!=='' || rows.length===0) rows.push(row);
    return rows;
  }

  async function uploadCSV(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    const text = await file.text();
    const rows = parseCSV(text);
    const sheet = activeSheet();
    sheet.cells = {};
    for(let r=0;r<Math.min(ROWS,rows.length);r++){
      for(let c=0;c<Math.min(COLS,rows[r].length);c++){
        const raw=rows[r][c];
        if(raw!=='') sheet.cells[addressOf(r,c)]={raw,value:'',format:{}};
      }
    }
    recalculateSheet();
    refreshGrid();
    showToast(`Imported ${Math.min(rows.length,ROWS)} rows from ${file.name}`);
  }

  function sanitizeFilename(name) { return name.replace(/[\\/:*?"<>|]+/g,'_') || 'sheet'; }

  // Persistence -------------------------------------------------------------
  document.getElementById('saveLocalBtn').addEventListener('click', saveLocal);
  document.getElementById('newBookBtn').addEventListener('click', () => {
    if (!confirm('Create a new workbook and clear the current one?')) return;
    workbook.sheets = [makeSheet('Sheet1')];
    workbook.active = 0;
    workbook.columnWidths = Array(COLS).fill(DEFAULT_COL_WIDTH);
    for(let c=0;c<COLS;c++) colgroup.children[c+1].style.width = DEFAULT_COL_WIDTH+'px';
    selection={start:{r:0,c:0},end:{r:0,c:0}};
    renderSheetTabs();
    refreshGrid();
    localStorage.removeItem(STORAGE_KEY);
  });

  function saveLocal() {
    commitActiveEditor();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(workbook));
    showToast('Workbook saved in this browser');
  }

  function loadLocal() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!saved || !Array.isArray(saved.sheets) || !saved.sheets.length) return;
      workbook.sheets = saved.sheets;
      workbook.active = Math.max(0, Math.min(saved.active || 0, saved.sheets.length - 1));
      workbook.columnWidths = Array.isArray(saved.columnWidths)
        ? saved.columnWidths.slice(0,COLS).concat(Array(COLS).fill(DEFAULT_COL_WIDTH)).slice(0,COLS)
        : Array(COLS).fill(DEFAULT_COL_WIDTH);
      for(let c=0;c<COLS;c++) colgroup.children[c+1].style.width = workbook.columnWidths[c]+'px';
    } catch (_) {}
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
  }

  buildGrid();
  loadLocal();
  const restoredActive = workbook.active;
  workbook.sheets.forEach((_, i) => { workbook.active = i; recalculateSheet(); });
  workbook.active = Math.max(0, Math.min(restoredActive, workbook.sheets.length - 1));
  renderSheetTabs();
  refreshGrid();
})();
</script>
</body>
</html>
