                    e.preventDefault();
                    const ref = td.dataset.ref;
                    const parsed = parseCellRef(ref);
                    if (parsed) {
                        selectedCell = parsed;
                        selectedRange = null;
                        updateSelectionVisuals();
                        updateFormulaBar();
                    }
                    contextMenu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
                    contextMenu.style.top = Math.min(e.clientY, window.innerHeight - 200) + 'px';
                    contextMenu.classList.add('visible');
                }
            });

            document.addEventListener('click', (e) => {
                if (!contextMenu.contains(e.target)) {
                    contextMenu.classList.remove('visible');
                }
            });

            contextMenu.addEventListener('click', (e) => {
                const item = e.target.closest('.context-menu-item');
                if (!item) return;
                const action = item.dataset.action;
                contextMenu.classList.remove('visible');
                switch (action) {
                    case 'clearContents':
                        clearSelectedCells();
                        break;
                    case 'cut':
                        clipboardData = getSelectedCellRefs();
                        clearSelectedCells();
                        showToast('Cut to clipboard');
                        break;
                    case 'copy':
                        clipboardData = getSelectedCellRefs();
                        showToast('Copied to clipboard');
                        break;
                    case 'paste':
                        if (clipboardData && selectedCell) {
                            pasteClipboard();
                        }
                        break;
                    case 'insertRow':
                        showToast('Row insertion simulated (shifts data down)');
                        break;
                    case 'deleteRow':
                        showToast('Row deletion simulated');
                        break;
                }
            });

            function pasteClipboard() {
                if (!clipboardData || !selectedCell) return;
                const sheet = getActiveSheet();
                const startRow = selectedCell.row;
                const startCol = selectedCell.col;
                const srcRefs = [...clipboardData].sort();
                if (srcRefs.length === 0) return;
                const firstParsed = parseCellRef(srcRefs[0]);
                const offsetRow = startRow - (firstParsed ? firstParsed.row : 1);
                const offsetCol = startCol - (firstParsed ? firstParsed.col : 1);
                for (const ref of srcRefs) {
                    const parsed = parseCellRef(ref);
                    if (!parsed) continue;
                    const newRow = parsed.row + offsetRow;
                    const newCol = parsed.col + offsetCol;
                    if (newRow < 1 || newRow > NUM_ROWS || newCol < 1 || newCol > NUM_COLS) continue;
                    const newRef = getCellRef(newRow, newCol);
                    const srcData = sheet.cells[ref];
                    if (srcData) {
                        const newCellData = ensureCellData(newRow, newCol, activeSheetName);
                        newCellData.value = srcData.value;
                        newCellData.formula = srcData.formula;
                        newCellData.display = srcData.display;
                        newCellData.bold = srcData.bold;
                        newCellData.italic = srcData.italic;
                        newCellData.bgColor = srcData.bgColor;
                        if (srcData.formula) {
                            updateDependenciesForCell(newRef, srcData.formula, activeSheetName);
                        }
                        updateCellDOM(newRef, activeSheetName);
                    }
                }
                recalculateAll(activeSheetName);
                refreshAllCellDOMs();
                showToast('Pasted');
            }

            // ============ TOAST ============
            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toast._timeout);
                toast._timeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 1800);
            }

            // ============ INITIALIZATION ============
            function init() {
                initDefaultSheets();
                initDependencyGraph();
                renderGrid();
                recalculateAll(activeSheetName);
                refreshAllCellDOMs();
                selectedCell = { row: 1, col: 1 };
                updateSelectionVisuals();
                updateFormulaBar();
                updateFormatButtonStates();

                // Update format buttons when selection changes
                const origUpdateSelection = updateSelectionVisuals;
                updateSelectionVisuals = function() {
                    origUpdateSelection();
                    updateFormatButtonStates();
                };
            }

            // ============ CLICK ON EMPTY SPACE ============
            spreadsheetScroll.addEventListener('mousedown', (e) => {
                if (e.target === spreadsheetScroll || e.target.closest('#spreadsheetTable') === null) {
                    // Clicked empty space - could deselect, but we'll keep selection
                }
            });

            // ============ WINDOW RESIZE ============
            window.addEventListener('resize', () => {
                // Re-render if needed
                if (colResizeInfo) {
                    colResizeInfo = null;
                    document.body.style.cursor = '';
                }
            });

            // ============ START ============
            init();
            console.log('📊 Excel Clone Ready');
            console.log('  • Click cells to select • Drag to select ranges');
            console.log('  • Double-click to edit • F2 to edit selected cell');
            console.log('  • Arrow keys / Enter / Tab to navigate');
            console.log('  • Start formulas with = (e.g. =A1+B2, =SUM(A1:A10))');
            console.log('  • Click cells while editing formula bar to insert references');
            console.log('  • Drag-select while formula bar focused to insert ranges');
            console.log('  • Right-click for context menu');
            console.log('  • Use sheet tabs to switch/add/rename/delete sheets');
            console.log('  • Toolbar: Bold, Italic, Fill Color, Clear, CSV Import/Export');

        })();
    </script>
</body>
</html>
