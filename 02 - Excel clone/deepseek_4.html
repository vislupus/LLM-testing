<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Clone - Spreadsheet</title>
    <style>
        :root {
            --toolbar-bg: #f0f4f0;
            --toolbar-border: #c8ccc8;
            --header-bg: #e8ece8;
            --header-border: #c0c4c0;
            --grid-line: #d4d8d4;
            --selected-bg: #d4e4f4;
            --selected-border: #2b7cd3;
            --active-cell-bg: #ffffff;
            --active-cell-border: #1a6cc4;
            --formula-bar-bg: #ffffff;
            --tab-bg: #dce0dc;
            --tab-active-bg: #ffffff;
            --tab-border: #b0b4b0;
            --cell-bg: #ffffff;
            --text-color: #1a1a1a;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.12);
            --radius-sm: 4px;
            --radius-md: 6px;
            --transition-fast: 0.1s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #e8ece8;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            color: var(--text-color);
        }

        /* ============ TOOLBAR ============ */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px 8px;
            background: var(--toolbar-bg);
            border-bottom: 1px solid var(--toolbar-border);
            flex-shrink: 0;
            flex-wrap: wrap;
            min-height: 36px;
            z-index: 20;
        }
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 1px;
            padding: 0 4px;
            border-right: 1px solid #d0d4d0;
            margin-right: 2px;
        }
        .toolbar-group:last-child {
            border-right: none;
        }
        .toolbar-btn {
            width: 30px;
            height: 28px;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast);
            color: #333;
            position: relative;
        }
        .toolbar-btn:hover {
            background: #d8dcd8;
        }
        .toolbar-btn:active {
            background: #c4c8c4;
        }
        .toolbar-btn.active-format {
            background: #c4d4e4;
            color: #1a5ca0;
            font-weight: bold;
        }
        .toolbar-btn.bold-btn {
            font-weight: bold;
        }
        .toolbar-btn.italic-btn {
            font-style: italic;
        }
        .toolbar-label {
            font-size: 11px;
            color: #555;
            padding: 0 3px;
            white-space: nowrap;
        }
        .toolbar-color-input {
            width: 24px;
            height: 24px;
            border: 1.5px solid #c0c4c0;
            border-radius: 3px;
            cursor: pointer;
            padding: 1px;
            background: #fff;
        }
        .toolbar-select {
            font-size: 12px;
            padding: 3px 6px;
            border-radius: 3px;
            border: 1.5px solid #c0c4c0;
            background: #fff;
            cursor: pointer;
            height: 26px;
        }

        /* ============ FORMULA BAR ============ */
        .formula-bar {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            background: #fafcfa;
            border-bottom: 1px solid var(--toolbar-border);
            flex-shrink: 0;
            z-index: 19;
            min-height: 32px;
        }
        .cell-address {
            width: 60px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            background: #f0f2f0;
            border: 1.5px solid #c8ccc8;
            border-radius: var(--radius-sm);
            padding: 4px 6px;
            color: #333;
            flex-shrink: 0;
        }
        .formula-icon {
            font-size: 14px;
            flex-shrink: 0;
            width: 20px;
            text-align: center;
            color: #666;
        }
        .formula-input {
            flex: 1;
            border: 1.5px solid #c8ccc8;
            border-radius: var(--radius-sm);
            padding: 4px 10px;
            font-size: 13px;
            font-family: 'Consolas', 'Courier New', monospace;
            outline: none;
            background: #fff;
            color: #1a1a1a;
            transition: border-color var(--transition-fast);
            min-width: 100px;
        }
        .formula-input:focus {
            border-color: #2b7cd3;
            box-shadow: 0 0 0 2px rgba(43, 124, 211, 0.12);
        }

        /* ============ SPREADSHEET CONTAINER ============ */
        .spreadsheet-wrapper {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #dce0dc;
            z-index: 10;
        }
        .spreadsheet-scroll {
            width: 100%;
            height: 100%;
            overflow: auto;
            position: relative;
            cursor: cell;
        }
        .spreadsheet-table {
            border-collapse: collapse;
            table-layout: fixed;
            min-width: 100%;
        }
        .spreadsheet-table th,
        .spreadsheet-table td {
            border: 1px solid var(--grid-line);
            padding: 0;
            position: relative;
            background: var(--cell-bg);
            height: 24px;
            min-width: 70px;
            max-width: 200px;
            transition: background var(--transition-fast);
        }
        .spreadsheet-table th {
            background: var(--header-bg);
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            color: #444;
            position: sticky;
            z-index: 5;
            cursor: default;
        }
        .spreadsheet-table thead th {
            top: 0;
            z-index: 8;
            border-bottom: 2px solid #b0b4b0;
        }
        .spreadsheet-table th.row-header {
            left: 0;
            z-index: 6;
            min-width: 40px;
            width: 40px;
            max-width: 40px;
            background: var(--header-bg);
            border-right: 2px solid #b0b4b0;
            font-size: 10px;
        }
        .spreadsheet-table thead th.corner-header {
            left: 0;
            top: 0;
            z-index: 10;
            min-width: 40px;
            width: 40px;
            max-width: 40px;
            background: #dce0dc;
        }
        .spreadsheet-table td .cell-display {
            display: block;
            width: 100%;
            height: 100%;
            padding: 2px 6px;
            font-size: 12px;
            line-height: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: cell;
            color: var(--text-color);
        }
        .spreadsheet-table td.selected-cell {
            background: var(--selected-bg) !important;
            outline: 2px solid var(--selected-border);
            outline-offset: -1px;
            z-index: 3;
        }
        .spreadsheet-table td.in-range {
            background: #e8f0f8 !important;
        }
        .spreadsheet-table td.active-edit {
            padding: 0 !important;
            z-index: 12;
        }
        .spreadsheet-table td.active-edit .cell-display {
            display: none;
        }
        .cell-edit-input {
            width: 100%;
            height: 100%;
            border: 2px solid #1a6cc4;
            outline: none;
            padding: 1px 5px;
            font-size: 12px;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #fff;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 12;
            box-shadow: var(--shadow-md);
        }
        .col-resize-handle {
            position: absolute;
            right: -3px;
            top: 0;
            bottom: 0;
            width: 7px;
            cursor: col-resize;
            z-index: 15;
            background: transparent;
        }
        .col-resize-handle:hover {
            background: rgba(43, 124, 211, 0.3);
        }
        .col-resize-handle:active {
            background: rgba(43, 124, 211, 0.6);
        }

        /* ============ SHEET TABS ============ */
        .sheet-tabs-bar {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 2px 6px;
            background: #dce0dc;
            border-top: 1px solid #b8bcb8;
            flex-shrink: 0;
            z-index: 20;
            min-height: 30px;
            overflow-x: auto;
        }
        .sheet-tab {
            padding: 5px 14px;
            font-size: 11px;
            background: var(--tab-bg);
            border: 1px solid var(--tab-border);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
            cursor: pointer;
            white-space: nowrap;
            transition: background var(--transition-fast);
            position: relative;
            color: #444;
            flex-shrink: 0;
        }
        .sheet-tab:hover {
            background: #e8ece8;
        }
        .sheet-tab.active-sheet {
            background: var(--tab-active-bg);
            font-weight: 600;
            color: #1a1a1a;
            border-bottom: 2px solid #fff;
            z-index: 2;
        }
        .sheet-tab .tab-delete {
            margin-left: 6px;
            font-size: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity var(--transition-fast);
            color: #888;
            font-weight: bold;
        }
        .sheet-tab:hover .tab-delete {
            opacity: 1;
        }
        .sheet-tab .tab-delete:hover {
            color: #d00;
        }
        .add-sheet-btn {
            width: 28px;
            height: 24px;
            border-radius: 50%;
            border: 1.5px solid #b0b4b0;
            background: #e8ece8;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--transition-fast);
            color: #555;
        }
        .add-sheet-btn:hover {
            background: #d0d8d0;
        }

        /* ============ CONTEXT MENU ============ */
        .context-menu {
            position: fixed;
            background: #fff;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            z-index: 200;
            min-width: 160px;
            padding: 4px 0;
            display: none;
            border: 1px solid #d0d4d0;
            font-size: 12px;
        }
        .context-menu.visible {
            display: block;
            animation: fadeIn 0.1s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .context-menu-item {
            padding: 7px 16px;
            cursor: pointer;
            transition: background var(--transition-fast);
            color: #333;
            white-space: nowrap;
        }
        .context-menu-item:hover {
            background: #e8f0f8;
            color: #1a5ca0;
        }
        .context-menu-divider {
            height: 1px;
            background: #e0e4e0;
            margin: 3px 8px;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #e8ece8;
        }
        ::-webkit-scrollbar-thumb {
            background: #b8bcb8;
            border-radius: 6px;
            border: 2px solid #e8ece8;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #999d99;
        }
        ::-webkit-scrollbar-corner {
            background: #e8ece8;
        }

        /* Hidden file input */
        #csvFileInput {
            display: none;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 300;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- ==================== TOOLBAR ==================== -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-group">
            <button class="toolbar-btn bold-btn" id="btnBold" title="Bold (Ctrl+B)"><b>B</b></button>
            <button class="toolbar-btn italic-btn" id="btnItalic" title="Italic (Ctrl+I)"><i>I</i></button>
        </div>
        <div class="toolbar-group">
            <span class="toolbar-label">Fill:</span>
            <input type="color" class="toolbar-color-input" id="bgColorPicker" value="#ffffff" title="Background Color">
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" id="btnClear" title="Clear Contents">🧹</button>
        </div>
        <div class="toolbar-group">
            <button class="toolbar-btn" id="btnDownloadCSV" title="Download as CSV">📥 CSV</button>
            <button class="toolbar-btn" id="btnUploadCSV" title="Upload CSV">📤 CSV</button>
            <input type="file" id="csvFileInput" accept=".csv">
        </div>
        <div class="toolbar-group" style="border-right:none;margin-left:auto;">
            <span class="toolbar-label" id="statusLabel" style="font-size:11px;color:#666;"></span>
        </div>
    </div>

    <!-- ==================== FORMULA BAR ==================== -->
    <div class="formula-bar" id="formulaBar">
        <div class="cell-address" id="cellAddress">A1</div>
        <span class="formula-icon">𝑓𝑥</span>
        <input type="text" class="formula-input" id="formulaInput" placeholder="Enter value or formula (e.g. =SUM(A1:A10))" spellcheck="false">
    </div>

    <!-- ==================== SPREADSHEET ==================== -->
    <div class="spreadsheet-wrapper" id="spreadsheetWrapper">
        <div class="spreadsheet-scroll" id="spreadsheetScroll">
            <table class="spreadsheet-table" id="spreadsheetTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ==================== SHEET TABS ==================== -->
    <div class="sheet-tabs-bar" id="sheetTabsBar">
        <!-- Dynamically filled -->
        <button class="add-sheet-btn" id="addSheetBtn" title="Add Sheet">+</button>
    </div>

    <!-- ==================== CONTEXT MENU ==================== -->
    <div class="context-menu" id="contextMenu">
        <div class="context-menu-item" data-action="cut">✂ Cut</div>
        <div class="context-menu-item" data-action="copy">📋 Copy</div>
        <div class="context-menu-item" data-action="paste">📄 Paste</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="clearContents">🧹 Clear Contents</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="insertRow">➕ Insert Row</div>
        <div class="context-menu-item" data-action="deleteRow">➖ Delete Row</div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            // ============ CONSTANTS ============
            const NUM_ROWS = 100;
            const NUM_COLS = 26;
            const DEFAULT_COL_WIDTH = 80;
            const DEFAULT_ROW_HEIGHT = 24;
            const COL_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

            // ============ STATE ============
            let sheets = {};
            let activeSheetName = 'Sheet1';
            let selectedCell = null; // {row, col} e.g. {row:1, col:1} for A1
            let selectedRange = null; // {startRow, startCol, endRow, endCol}
            let isDragging = false;
            let dragStartCell = null;
            let isEditing = false;
            let editCellRef = null;
            let isFormulaBarFocused = false;
            let isRangeSelectForFormula = false;
            let formulaRangeStart = null;
            let clipboardData = null;
            let colResizeInfo = null; // {col, startX, startWidth}

            // ============ INITIALIZE SHEETS ============
            function createEmptySheet(name) {
                const cells = {};
                const columnWidths = {};
                const rowHeights = {};
                for (let c = 1; c <= NUM_COLS; c++) columnWidths[c] = DEFAULT_COL_WIDTH;
                for (let r = 1; r <= NUM_ROWS; r++) rowHeights[r] = DEFAULT_ROW_HEIGHT;
                return {
                    name,
                    cells,
                    columnWidths,
                    rowHeights,
                };
            }

            function initDefaultSheets() {
                sheets = {};
                const s1 = createEmptySheet('Sheet1');
                // Add some sample data
                s1.cells['A1'] = { value: 'Item', formula: null, display: 'Item', bold: true, italic: false,
                    bgColor: '#e8f0e8' };
                s1.cells['B1'] = { value: 'Price', formula: null, display: 'Price', bold: true, italic: false,
                    bgColor: '#e8f0e8' };
                s1.cells['C1'] = { value: 'Qty', formula: null, display: 'Qty', bold: true, italic: false,
                    bgColor: '#e8f0e8' };
                s1.cells['D1'] = { value: 'Total', formula: null, display: 'Total', bold: true, italic: false,
                    bgColor: '#e8f0e8' };
                s1.cells['A2'] = { value: 'Apple', formula: null, display: 'Apple', bold: false, italic: false,
                    bgColor: null };
                s1.cells['B2'] = { value: '1.50', formula: null, display: '1.50', bold: false, italic: false,
                    bgColor: null };
                s1.cells['C2'] = { value: '10', formula: null, display: '10', bold: false, italic: false,
                bgColor: null };
                s1.cells['D2'] = { value: null, formula: '=B2*C2', display: '15', bold: false, italic: false,
                    bgColor: null };
                s1.cells['A3'] = { value: 'Banana', formula: null, display: 'Banana', bold: false, italic: false,
                    bgColor: null };
                s1.cells['B3'] = { value: '0.80', formula: null, display: '0.80', bold: false, italic: false,
                    bgColor: null };
                s1.cells['C3'] = { value: '20', formula: null, display: '20', bold: false, italic: false,
                bgColor: null };
                s1.cells['D3'] = { value: null, formula: '=B3*C3', display: '16', bold: false, italic: false,
                    bgColor: null };
                s1.cells['A5'] = { value: 'SUM Total:', formula: null, display: 'SUM Total:', bold: true, italic: false,
                    bgColor: null };
                s1.cells['B5'] = { value: null, formula: '=SUM(D2:D3)', display: '31', bold: true, italic: false,
                    bgColor: '#ffffe0' };
                sheets['Sheet1'] = s1;
                sheets['Sheet2'] = createEmptySheet('Sheet2');
                sheets['Sheet3'] = createEmptySheet('Sheet3');
                activeSheetName = 'Sheet1';
            }

            function getActiveSheet() {
                return sheets[activeSheetName];
            }

            function getCellRef(row, col) {
                return COL_LETTERS[col - 1] + row;
            }

            function parseCellRef(ref) {
                const match = ref.match(/^([A-Z]+)(\d+)$/i);
                if (!match) return null;
                const col = COL_LETTERS.indexOf(match[1].toUpperCase()) + 1;
                const row = parseInt(match[2]);
                if (col < 1 || col > NUM_COLS || row < 1 || row > NUM_ROWS) return null;
                return { row, col };
            }

            function getCellData(row, col, sheetName) {
                const sheet = sheets[sheetName || activeSheetName];
                const ref = getCellRef(row, col);
                return sheet.cells[ref] || null;
            }

            function getCellDisplay(row, col, sheetName) {
                const data = getCellData(row, col, sheetName);
                if (data && data.display !== null && data.display !== undefined && data.display !== '') {
                    return data.display;
                }
                return '';
            }

            function ensureCellData(row, col, sheetName) {
                const sheet = sheets[sheetName || activeSheetName];
                const ref = getCellRef(row, col);
                if (!sheet.cells[ref]) {
                    sheet.cells[ref] = { value: null, formula: null, display: '', bold: false, italic: false,
                        bgColor: null };
                }
                return sheet.cells[ref];
            }

            // ============ DEPENDENCY TRACKING ============
            let dependencyGraph = {}; // { 'Sheet1': { 'A1': { deps: Set, dependents: Set } } }

            function initDependencyGraph() {
                dependencyGraph = {};
                for (const [sName, sheet] of Object.entries(sheets)) {
                    dependencyGraph[sName] = {};
                    for (const [ref, cellData] of Object.entries(sheet.cells)) {
                        if (cellData.formula) {
                            updateDependenciesForCell(ref, cellData.formula, sName);
                        }
                    }
                }
            }

            function getGraphNode(sheetName, ref) {
                if (!dependencyGraph[sheetName]) dependencyGraph[sheetName] = {};
                if (!dependencyGraph[sheetName][ref]) {
                    dependencyGraph[sheetName][ref] = { deps: new Set(), dependents: new Set() };
                }
                return dependencyGraph[sheetName][ref];
            }

            function clearDependencies(sheetName, ref) {
                const node = getGraphNode(sheetName, ref);
                // Remove this cell from its dependencies' dependents lists
                for (const depRef of node.deps) {
                    const depNode = getGraphNode(sheetName, depRef);
                    depNode.dependents.delete(ref);
                }
                node.deps = new Set();
            }

            function extractReferences(formula) {
                if (!formula || !formula.startsWith('=')) return { cells: new Set(), ranges: [] };
                const expr = formula.substring(1);
                const cellRefs = new Set();
                const rangeRefs = [];
                // Match ranges like A1:B10 or A1:A10
                const rangeRegex = /([A-Z]+\d+):([A-Z]+\d+)/gi;
                let match;
                const processedExpr = expr.replace(rangeRegex, (m, start, end) => {
                    rangeRefs.push({ start, end, full: m });
                    return ' __RANGE__ ';
                });
                // Match individual cell references
                const cellRegex = /([A-Z]+\d+)/gi;
                let cellMatch;
                while ((cellMatch = cellRegex.exec(processedExpr)) !== null) {
                    if (!processedExpr.includes('__RANGE__') || processedExpr.indexOf(cellMatch[0]) < processedExpr
                        .indexOf('__RANGE__') || processedExpr.indexOf('__RANGE__') === -1) {
                        const ref = cellMatch[0].toUpperCase();
                        if (parseCellRef(ref)) cellRefs.add(ref);
                    }
                }
                // Add range start/end cells
                for (const r of rangeRefs) {
                    const s = parseCellRef(r.start);
                    const e = parseCellRef(r.end);
                    if (s && e) {
                        for (let rr = s.row; rr <= e.row; rr++) {
                            for (let cc = s.col; cc <= e.col; cc++) {
                                cellRefs.add(getCellRef(rr, cc));
                            }
                        }
                    }
                }
                return { cells: cellRefs, ranges: rangeRefs };
            }

            function updateDependenciesForCell(ref, formula, sheetName) {
                clearDependencies(sheetName, ref);
                const node = getGraphNode(sheetName, ref);
                const { cells } = extractReferences(formula);
                for (const depRef of cells) {
                    if (depRef === ref) continue; // Skip self-reference
                    node.deps.add(depRef);
                    const depNode = getGraphNode(sheetName, depRef);
                    depNode.dependents.add(ref);
                }
            }

            function recalculateCell(ref, sheetName) {
                const sheet = sheets[sheetName];
                const cellData = sheet.cells[ref];
                if (!cellData || !cellData.formula) return;
                const newDisplay = evaluateFormula(cellData.formula, sheetName);
                if (cellData.display !== newDisplay) {
                    cellData.display = newDisplay;
                    cellData.value = isNaN(parseFloat(newDisplay)) ? newDisplay : parseFloat(newDisplay);
                    updateCellDOM(ref, sheetName);
                    // Recalculate dependents
                    const node = getGraphNode(sheetName, ref);
                    const dependents = [...node.dependents];
                    for (const depRef of dependents) {
                        recalculateCell(depRef, sheetName);
                    }
                }
            }

            function recalculateAll(sheetName) {
                const sheet = sheets[sheetName];
                const visited = new Set();
                for (const [ref, cellData] of Object.entries(sheet.cells)) {
                    if (cellData.formula && !visited.has(ref)) {
                        recalculateCellWithVisited(ref, sheetName, visited, new Set());
                    }
                }
            }

            function recalculateCellWithVisited(ref, sheetName, visited, inStack) {
                if (inStack.has(ref)) {
                    // Circular reference detected
                    const sheet = sheets[sheetName];
                    if (sheet.cells[ref]) sheet.cells[ref].display = '#CIRC!';
                    updateCellDOM(ref, sheetName);
                    return;
                }
                if (visited.has(ref)) return;
                inStack.add(ref);
                const sheet = sheets[sheetName];
                const cellData = sheet.cells[ref];
                if (cellData && cellData.formula) {
                    // First recalculate dependencies
                    const node = getGraphNode(sheetName, ref);
                    for (const depRef of node.deps) {
                        recalculateCellWithVisited(depRef, sheetName, visited, inStack);
                    }
                    const newDisplay = evaluateFormula(cellData.formula, sheetName);
                    if (cellData.display !== newDisplay) {
                        cellData.display = newDisplay;
                        cellData.value = isNaN(parseFloat(newDisplay)) ? newDisplay : parseFloat(newDisplay);
                        updateCellDOM(ref, sheetName);
                    }
                }
                visited.add(ref);
                inStack.delete(ref);
            }

            // ============ FORMULA EVALUATION ============
            function getNumericValue(ref, sheetName) {
                const sheet = sheets[sheetName];
                const cellData = sheet.cells[ref];
                if (!cellData || cellData.display === '' || cellData.display === null || cellData.display === undefined)
                    return 0;
                const num = parseFloat(cellData.display);
                return isNaN(num) ? 0 : num;
            }

            function getCellsInRange(startRef, endRef, sheetName) {
                const s = parseCellRef(startRef);
                const e = parseCellRef(endRef);
                if (!s || !e) return [];
                const cells = [];
                const minRow = Math.min(s.row, e.row);
                const maxRow = Math.max(s.row, e.row);
                const minCol = Math.min(s.col, e.col);
                const maxCol = Math.max(s.col, e.col);
                for (let r = minRow; r <= maxRow; r++) {
                    for (let c = minCol; c <= maxCol; c++) {
                        cells.push(getCellRef(r, c));
                    }
                }
                return cells;
            }

            function evaluateFormula(formula, sheetName) {
                if (!formula || !formula.startsWith('=')) return formula || '';
                let expr = formula.substring(1).trim();
                if (expr === '') return '';

                // Handle functions: SUM, AVERAGE, MIN, MAX
                const funcRegex = /(SUM|AVERAGE|MIN|MAX)\s*\(([^)]+)\)/gi;
                let funcMatch;
                const funcResults = [];
                let funcCounter = 0;
                const processedExpr = expr.replace(funcRegex, (match, funcName, args) => {
                    const rangeMatch = args.trim().match(/^([A-Z]+\d+):([A-Z]+\d+)$/i);
                    if (rangeMatch) {
                        const cells = getCellsInRange(rangeMatch[1], rangeMatch[2], sheetName);
                        const values = cells.map(ref => getNumericValue(ref, sheetName));
                        let result;
                        switch (funcName.toUpperCase()) {
                            case 'SUM':
                                result = values.reduce((a, b) => a + b, 0);
                                break;
                            case 'AVERAGE':
                                result = values.length > 0 ? values.reduce((a, b) => a + b, 0) / values.length :
                                    0;
                                break;
                            case 'MIN':
                                result = values.length > 0 ? Math.min(...values) : 0;
                                break;
                            case 'MAX':
                                result = values.length > 0 ? Math.max(...values) : 0;
                                break;
                            default:
                                result = 0;
                        }
                        const placeholder = `__FUNC_${funcCounter}__`;
                        funcResults.push({ placeholder, value: result });
                        funcCounter++;
                        return placeholder;
                    }
                    return match;
                });

                let evalExpr = processedExpr;
                // Replace cell references with numeric values
                evalExpr = evalExpr.replace(/([A-Z]+\d+)/gi, (ref) => {
                    const parsed = parseCellRef(ref);
                    if (parsed) {
                        return getNumericValue(ref.toUpperCase(), sheetName).toString();
                    }
                    return ref;
                });

                // Replace function placeholders
                for (const fr of funcResults) {
                    evalExpr = evalExpr.replace(fr.placeholder, fr.value.toString());
                }

                // Sanitize: only allow digits, operators, parentheses, dots, whitespace
                const sanitized = evalExpr.replace(/[^0-9+\-*/().%\s]/g, '');
                if (sanitized.trim() === '') {
                    // If no numeric result, check if it's a string formula
                    if (funcResults.length === 0 && processedExpr.match(/^[A-Z]+\d+$/i)) {
                        const parsed = parseCellRef(processedExpr.trim());
                        if (parsed) {
                            return getCellDisplay(parsed.row, parsed.col, sheetName);
                        }
                    }
                    return formula;
                }

                try {
                    const result = Function('"use strict"; return (' + sanitized + ')')();
                    if (typeof result === 'number') {
                        // Format nicely
                        if (Number.isInteger(result)) return result.toString();
                        return parseFloat(result.toFixed(10)).toString();
                    }
                    return String(result);
                } catch (e) {
                    return '#ERROR!';
                }
            }

            // ============ DOM REFERENCES ============
            const spreadsheetScroll = document.getElementById('spreadsheetScroll');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const cellAddress = document.getElementById('cellAddress');
            const formulaInput = document.getElementById('formulaInput');
            const sheetTabsBar = document.getElementById('sheetTabsBar');
            const contextMenu = document.getElementById('contextMenu');
            const toast = document.getElementById('toast');
            const csvFileInput = document.getElementById('csvFileInput');
            const bgColorPicker = document.getElementById('bgColorPicker');
            const statusLabel = document.getElementById('statusLabel');

            // ============ RENDER GRID ============
            function renderGrid() {
                const sheet = getActiveSheet();
                // Build thead
                let theadHTML = '<tr>';
                theadHTML += '<th class="corner-header"></th>';
                for (let c = 1; c <= NUM_COLS; c++) {
                    const letter = COL_LETTERS[c - 1];
                    const width = sheet.columnWidths[c] || DEFAULT_COL_WIDTH;
                    theadHTML +=
                        `<th style="min-width:${width}px;width:${width}px;max-width:${width}px;position:relative;" data-col="${c}">${letter}<div class="col-resize-handle" data-col="${c}"></div></th>`;
                }
                theadHTML += '</tr>';
                tableHead.innerHTML = theadHTML;

                // Build tbody
                let tbodyHTML = '';
                for (let r = 1; r <= NUM_ROWS; r++) {
                    tbodyHTML += '<tr>';
                    tbodyHTML += `<th class="row-header" style="position:sticky;left:0;">${r}</th>`;
                    for (let c = 1; c <= NUM_COLS; c++) {
                        const ref = getCellRef(r, c);
                        const cellData = sheet.cells[ref];
                        const width = sheet.columnWidths[c] || DEFAULT_COL_WIDTH;
                        const display = cellData ? (cellData.display || '') : '';
                        const bold = cellData && cellData.bold ? 'font-weight:bold;' : '';
                        const italic = cellData && cellData.italic ? 'font-style:italic;' : '';
                        const bgColor = cellData && cellData.bgColor ? `background-color:${cellData.bgColor};` : '';
                        tbodyHTML +=
                            `<td data-ref="${ref}" data-row="${r}" data-col="${c}" style="min-width:${width}px;width:${width}px;max-width:${width}px;${bgColor}"><span class="cell-display" style="${bold}${italic}">${escapeHTML(display)}</span></td>`;
                    }
                    tbodyHTML += '</tr>';
                }
                tableBody.innerHTML = tbodyHTML;

                // Attach column resize handlers
                attachColumnResizeHandlers();
                // Attach cell event handlers
                attachCellEventHandlers();
                // Update selection visuals
                updateSelectionVisuals();
                // Update formula bar
                updateFormulaBar();
                // Render sheet tabs
                renderSheetTabs();
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateCellDOM(ref, sheetName) {
                if (sheetName !== activeSheetName) return;
                const td = document.querySelector(`td[data-ref="${ref}"]`);
                if (!td) return;
                const sheet = getActiveSheet();
                const cellData = sheet.cells[ref];
                const display = cellData ? (cellData.display || '') : '';
                const span = td.querySelector('.cell-display');
                if (span) {
                    span.textContent = display;
                    span.style.fontWeight = cellData && cellData.bold ? 'bold' : 'normal';
                    span.style.fontStyle = cellData && cellData.italic ? 'italic' : 'normal';
                }
                if (cellData && cellData.bgColor) {
                    td.style.backgroundColor = cellData.bgColor;
                } else {
                    td.style.backgroundColor = '';
                }
            }

            function refreshAllCellDOMs() {
                const sheet = getActiveSheet();
                const allTds = document.querySelectorAll('#tableBody td[data-ref]');
                allTds.forEach(td => {
                    const ref = td.dataset.ref;
                    const cellData = sheet.cells[ref];
                    const display = cellData ? (cellData.display || '') : '';
                    const span = td.querySelector('.cell-display');
                    if (span) {
                        span.textContent = display;
                        span.style.fontWeight = cellData && cellData.bold ? 'bold' : 'normal';
                        span.style.fontStyle = cellData && cellData.italic ? 'italic' : 'normal';
                    }
                    td.style.backgroundColor = cellData && cellData.bgColor ? cellData.bgColor : '';
                });
            }

            // ============ COLUMN RESIZE ============
            function attachColumnResizeHandlers() {
                const handles = document.querySelectorAll('.col-resize-handle');
                handles.forEach(handle => {
                    handle.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const col = parseInt(handle.dataset.col);
                        const sheet = getActiveSheet();
                        const startWidth = sheet.columnWidths[col] || DEFAULT_COL_WIDTH;
                        colResizeInfo = { col, startX: e.clientX, startWidth };
                        document.body.style.cursor = 'col-resize';
                        document.body.style.userSelect = 'none';
                    });
                });
            }

            document.addEventListener('mousemove', (e) => {
                if (colResizeInfo) {
                    const dx = e.clientX - colResizeInfo.startX;
                    const newWidth = Math.max(30, Math.min(400, colResizeInfo.startWidth + dx));
                    const sheet = getActiveSheet();
                    sheet.columnWidths[colResizeInfo.col] = newWidth;
                    // Update all cells in that column
                    const col = colResizeInfo.col;
                    const th = document.querySelector(`thead th[data-col="${col}"]`);
                    if (th) {
                        th.style.minWidth = newWidth + 'px';
                        th.style.width = newWidth + 'px';
                        th.style.maxWidth = newWidth + 'px';
                    }
                    const tds = document.querySelectorAll(`td[data-col="${col}"]`);
                    tds.forEach(td => {
                        td.style.minWidth = newWidth + 'px';
                        td.style.width = newWidth + 'px';
                        td.style.maxWidth = newWidth + 'px';
                    });
                }
            });

            document.addEventListener('mouseup', () => {
                if (colResizeInfo) {
                    colResizeInfo = null;
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });

            // ============ CELL EVENT HANDLERS ============
            function attachCellEventHandlers() {
                const allCells = document.querySelectorAll('#tableBody td[data-ref]');
                allCells.forEach(td => {
                    // Remove old listeners by cloning (simple approach)
                    const newTd = td.cloneNode(true);
                    td.parentNode.replaceChild(newTd, td);

                    newTd.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return;
                        if (colResizeInfo) return;
                        const ref = newTd.dataset.ref;
                        const parsed = parseCellRef(ref);
                        if (!parsed) return;

                        if (isFormulaBarFocused && document.activeElement === formulaInput) {
                            // In formula mode: start range selection for formula
                            isRangeSelectForFormula = true;
                            formulaRangeStart = ref;
                            selectedCell = parsed;
                            updateSelectionVisuals();
                            e.preventDefault();
                            return;
                        }

                        if (isEditing && editCellRef === ref) {
                            // Clicking the editing cell - let the input handle it
                            return;
                        }

                        // Start drag selection
                        isDragging = true;
                        dragStartCell = parsed;
                        selectedCell = parsed;
                        selectedRange = null;
                        if (isEditing) {
                            commitEdit();
                        }
                        updateSelectionVisuals();
                        updateFormulaBar();
                        e.preventDefault();
                    });

                    newTd.addEventListener('mouseenter', (e) => {
                        if (isDragging && dragStartCell && !isRangeSelectForFormula) {
                            const ref = newTd.dataset.ref;
                            const parsed = parseCellRef(ref);
                            if (parsed) {
                                selectedRange = {
                                    startRow: Math.min(dragStartCell.row, parsed.row),
                                    startCol: Math.min(dragStartCell.col, parsed.col),
                                    endRow: Math.max(dragStartCell.row, parsed.row),
                                    endCol: Math.max(dragStartCell.col, parsed.col),
                                };
                                selectedCell = dragStartCell;
                                updateSelectionVisuals();
                                updateFormulaBar();
                            }
                        }
                        if (isRangeSelectForFormula && formulaRangeStart) {
                            const ref = newTd.dataset.ref;
                            const parsed = parseCellRef(ref);
                            if (parsed) {
                                const sr = parseCellRef(formulaRangeStart);
                                if (sr) {
                                    selectedRange = {
                                        startRow: Math.min(sr.row, parsed.row),
                                        startCol: Math.min(sr.col, parsed.col),
                                        endRow: Math.max(sr.row, parsed.row),
                                        endCol: Math.max(sr.col, parsed.col),
                                    };
                                    selectedCell = sr;
                                    updateSelectionVisuals();
                                }
                            }
                        }
                    });

                    newTd.addEventListener('dblclick', (e) => {
                        const ref = newTd.dataset.ref;
                        startInPlaceEdit(ref);
                        e.preventDefault();
                    });
                });

                // Global mouseup
                document.addEventListener('mouseup', (e) => {
                    if (isDragging && isRangeSelectForFormula && formulaRangeStart && selectedRange) {
                        // Insert range into formula bar
                        const startRef = getCellRef(selectedRange.startRow, selectedRange.startCol);
                        const endRef = getCellRef(selectedRange.endRow, selectedRange.endCol);
                        const rangeStr = startRef === endRef ? startRef : `${startRef}:${endRef}`;
                        insertIntoFormulaInput(rangeStr);
                        isRangeSelectForFormula = false;
                        formulaRangeStart = null;
                        selectedRange = null;
                        updateSelectionVisuals();
                    }
                    if (isDragging && !isRangeSelectForFormula && dragStartCell && !selectedRange && !isEditing) {
                        // Single cell click - just select it
                        selectedCell = dragStartCell;
                        selectedRange = null;
                        updateSelectionVisuals();
                        updateFormulaBar();
                    }
                    isDragging = false;
                    dragStartCell = null;
                    if (!isFormulaBarFocused) {
                        isRangeSelectForFormula = false;
                        formulaRangeStart = null;
                    }
                });
            }

            function insertIntoFormulaInput(text) {
                const input = formulaInput;
                const start = input.selectionStart;
                const end = input.selectionEnd;
                const before = input.value.substring(0, start);
                const after = input.value.substring(end);
                input.value = before + text + after;
                input.focus();
                const newPos = start + text.length;
                input.setSelectionRange(newPos, newPos);
                // Trigger input event
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }

            function updateSelectionVisuals() {
                // Remove all selection classes
                document.querySelectorAll('#tableBody td.selected-cell').forEach(td => td.classList.remove(
                    'selected-cell'));
                document.querySelectorAll('#tableBody td.in-range').forEach(td => td.classList.remove('in-range'));

                // Highlight range
                if (selectedRange) {
                    const { startRow, startCol, endRow, endCol } = selectedRange;
                    for (let r = startRow; r <= endRow; r++) {
                        for (let c = startCol; c <= endCol; c++) {
                            const ref = getCellRef(r, c);
                            const td = document.querySelector(`td[data-ref="${ref}"]`);
                            if (td) td.classList.add('in-range');
                        }
                    }
                }

                // Highlight active cell
                if (selectedCell) {
                    const ref = getCellRef(selectedCell.row, selectedCell.col);
                    const td = document.querySelector(`td[data-ref="${ref}"]`);
                    if (td) {
                        td.classList.remove('in-range');
                        td.classList.add('selected-cell');
                    }
                }
            }

            function updateFormulaBar() {
                if (!selectedCell) {
                    cellAddress.textContent = '';
                    formulaInput.value = '';
                    return;
                }
                const ref = getCellRef(selectedCell.row, selectedCell.col);
                cellAddress.textContent = ref;
                const sheet = getActiveSheet();
                const cellData = sheet.cells[ref];
                if (cellData && cellData.formula) {
                    formulaInput.value = cellData.formula;
                } else if (cellData && cellData.value !== null && cellData.value !== undefined) {
                    formulaInput.value = String(cellData.value);
                } else {
                    formulaInput.value = '';
                }
            }

            // ============ IN-PLACE EDITING ============
            function startInPlaceEdit(ref) {
                if (isEditing) commitEdit();
                const td = document.querySelector(`td[data-ref="${ref}"]`);
                if (!td) return;
                const parsed = parseCellRef(ref);
                if (!parsed) return;
                selectedCell = parsed;
                selectedRange = null;
                updateSelectionVisuals();
                editCellRef = ref;
                isEditing = true;
                const sheet = getActiveSheet();
                const cellData = sheet.cells[ref];
                const currentValue = cellData && cellData.formula ? cellData.formula :
                    (cellData && cellData.value !== null && cellData.value !== undefined ? String(cellData.value) : '');
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'cell-edit-input';
                input.value = currentValue;
                input.spellcheck = false;
                td.classList.add('active-edit');
                td.appendChild(input);
                input.focus();
                input.select();

                input.addEventListener('blur', () => {
                    commitEdit();
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        commitEdit();
                        // Move to cell below
                        if (selectedCell && selectedCell.row < NUM_ROWS) {
                            selectedCell = { row: selectedCell.row + 1, col: selectedCell.col };
                            selectedRange = null;
                            updateSelectionVisuals();
                            updateFormulaBar();
                        }
                    } else if (e.key === 'Tab') {
                        e.preventDefault();
                        commitEdit();
                        // Move to next cell
                        if (selectedCell && selectedCell.col < NUM_COLS) {
                            selectedCell = { row: selectedCell.row, col: selectedCell.col + 1 };
                        } else if (selectedCell && selectedCell.row < NUM_ROWS) {
                            selectedCell = { row: selectedCell.row + 1, col: 1 };
                        }
                        selectedRange = null;
                        updateSelectionVisuals();
                        updateFormulaBar();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        input.value = currentValue;
                        commitEdit();
                    }
                });
                input.addEventListener('input', () => {
                    // Live update formula bar while editing
                    formulaInput.value = input.value;
                });
                formulaInput.value = input.value;
            }

            function commitEdit() {
                if (!isEditing || !editCellRef) return;
                const td = document.querySelector(`td[data-ref="${editCellRef}"]`);
                const input = td ? td.querySelector('.cell-edit-input') : null;
                if (!input || !td) {
                    cleanupEdit();
                    return;
                }
                const rawValue = input.value.trim();
                // Remove input
                if (input.parentNode) input.parentNode.removeChild(input);
                td.classList.remove('active-edit');
                isEditing = false;
                const ref = editCellRef;
                editCellRef = null;
                // Save to sheet
                setCellValue(ref, rawValue);
                updateFormulaBar();
                updateSelectionVisuals();
            }

            function cleanupEdit() {
                if (editCellRef) {
                    const td = document.querySelector(`td[data-ref="${editCellRef}"]`);
                    const input = td ? td.querySelector('.cell-edit-input') : null;
                    if (input && input.parentNode) input.parentNode.removeChild(input);
                    if (td) td.classList.remove('active-edit');
                }
                isEditing = false;
                editCellRef = null;
            }

            function setCellValue(ref, rawValue) {
                const sheet = getActiveSheet();
                const cellData = ensureCellData(parseCellRef(ref).row, parseCellRef(ref).col, activeSheetName);
                if (rawValue.startsWith('=')) {
                    cellData.formula = rawValue;
                    cellData.value = null;
                    // Update dependencies
                    updateDependenciesForCell(ref, rawValue, activeSheetName);
                    // Evaluate
                    const result = evaluateFormula(rawValue, activeSheetName);
                    cellData.display = result;
                    cellData.value = isNaN(parseFloat(result)) ? result : parseFloat(result);
                } else {
                    cellData.formula = null;
                    cellData.value = rawValue;
                    cellData.display = rawValue;
                    clearDependencies(activeSheetName, ref);
                }
                updateCellDOM(ref, activeSheetName);
                // Recalculate dependents
                const node = getGraphNode(activeSheetName, ref);
                const dependents = [...node.dependents];
                for (const depRef of dependents) {
                    recalculateCell(depRef, activeSheetName);
                }
                updateFormulaBar();
            }

            // ============ FORMULA BAR HANDLING ============
            formulaInput.addEventListener('focus', () => {
                isFormulaBarFocused = true;
                if (selectedCell && isEditing) {
                    commitEdit();
                }
            });

            formulaInput.addEventListener('blur', () => {
                // Small delay to allow cell click to register
                setTimeout(() => {
                    isFormulaBarFocused = false;
                    isRangeSelectForFormula = false;
                    formulaRangeStart = null;
                }, 150);
                if (selectedCell && !isEditing) {
                    const ref = getCellRef(selectedCell.row, selectedCell.col);
                    const rawValue = formulaInput.value.trim();
                    setCellValue(ref, rawValue);
                }
            });

            formulaInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (selectedCell) {
                        const ref = getCellRef(selectedCell.row, selectedCell.col);
                        const rawValue = formulaInput.value.trim();
                        setCellValue(ref, rawValue);
                    }
                    formulaInput.blur();
                    // Move to cell below
                    if (selectedCell && selectedCell.row < NUM_ROWS) {
                        selectedCell = { row: selectedCell.row + 1, col: selectedCell.col };
                        selectedRange = null;
                        updateSelectionVisuals();
                        updateFormulaBar();
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    updateFormulaBar();
                    formulaInput.blur();
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    if (selectedCell) {
                        const ref = getCellRef(selectedCell.row, selectedCell.col);
                        setCellValue(ref, formulaInput.value.trim());
                    }
                    formulaInput.blur();
                    if (selectedCell && selectedCell.col < NUM_COLS) {
                        selectedCell = { row: selectedCell.row, col: selectedCell.col + 1 };
                    } else if (selectedCell && selectedCell.row < NUM_ROWS) {
                        selectedCell = { row: selectedCell.row + 1, col: 1 };
                    }
                    selectedRange = null;
                    updateSelectionVisuals();
                    updateFormulaBar();
                }
            });

            // When clicking a cell while formula bar is focused, insert reference
            document.addEventListener('click', (e) => {
                if (isFormulaBarFocused && document.activeElement === formulaInput && !isDragging &&
                    !isRangeSelectForFormula) {
                    const td = e.target.closest('td[data-ref]');
                    if (td && !e.target.closest('.cell-edit-input')) {
                        const ref = td.dataset.ref;
                        insertIntoFormulaInput(ref);
                        e.preventDefault();
                        e.stopPropagation();
                    }
                }
            });

            // ============ KEYBOARD NAVIGATION ============
            document.addEventListener('keydown', (e) => {
                if (isEditing) return; // Let the edit input handle it
                if (document.activeElement === formulaInput) return; // Formula bar handles its own keys
                if (e.target.closest('input') || e.target.closest('textarea') || e.target.closest(
                        '[contenteditable="true"]')) return;

                if (!selectedCell) {
                    if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key ===
                        'ArrowLeft') {
                        selectedCell = { row: 1, col: 1 };
                        updateSelectionVisuals();
                        updateFormulaBar();
                        e.preventDefault();
                        return;
                    }
                    return;
                }

                let newRow = selectedCell.row;
                let newCol = selectedCell.col;

                switch (e.key) {
                    case 'ArrowUp':
                        newRow = Math.max(1, selectedCell.row - 1);
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        newRow = Math.min(NUM_ROWS, selectedCell.row + 1);
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        newCol = Math.max(1, selectedCell.col - 1);
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        newCol = Math.min(NUM_COLS, selectedCell.col + 1);
                        e.preventDefault();
                        break;
                    case 'Enter':
                        newRow = Math.min(NUM_ROWS, selectedCell.row + 1);
                        e.preventDefault();
                        break;
                    case 'Tab':
                        if (e.shiftKey) {
                            newCol = Math.max(1, selectedCell.col - 1);
                        } else {
                            newCol = Math.min(NUM_COLS, selectedCell.col + 1);
                        }
                        e.preventDefault();
                        break;
                    case 'Delete':
                    case 'Backspace':
                        // Clear selected cell(s)
                        clearSelectedCells();
                        e.preventDefault();
                        return;
                    case 'F2':
                        // Start editing
                        if (selectedCell) {
                            startInPlaceEdit(getCellRef(selectedCell.row, selectedCell.col));
                        }
                        e.preventDefault();
                        return;
                    default:
                        // If it's a printable character, start editing
                        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                            if (selectedCell) {
                                startInPlaceEdit(getCellRef(selectedCell.row, selectedCell.col));
                                // The input will receive this character
                                setTimeout(() => {
                                    const input = document.querySelector('.cell-edit-input');
                                    if (input) {
                                        input.value = e.key;
                                        input.setSelectionRange(1, 1);
                                        input.dispatchEvent(new Event('input', { bubbles: true }));
                                    }
                                }, 10);
                            }
                            e.preventDefault();
                            return;
                        }
                        return;
                }

                if (newRow !== selectedCell.row || newCol !== selectedCell.col) {
                    if (e.shiftKey && !['Enter', 'Tab'].includes(e.key)) {
                        // Extend selection
                        if (!selectedRange) {
                            selectedRange = {
                                startRow: Math.min(selectedCell.row, newRow),
                                startCol: Math.min(selectedCell.col, newCol),
                                endRow: Math.max(selectedCell.row, newRow),
                                endCol: Math.max(selectedCell.col, newCol),
                            };
                        } else {
                            selectedRange = {
                                startRow: Math.min(selectedRange.startRow, newRow),
                                startCol: Math.min(selectedRange.startCol, newCol),
                                endRow: Math.max(selectedRange.endRow, newRow),
                                endCol: Math.max(selectedRange.endCol, newCol),
                            };
                        }
                    } else {
                        selectedRange = null;
                    }
                    selectedCell = { row: newRow, col: newCol };
                    updateSelectionVisuals();
                    updateFormulaBar();
                    scrollToCell(newRow, newCol);
                }
            });

            function scrollToCell(row, col) {
                const td = document.querySelector(`td[data-ref="${getCellRef(row, col)}"]`);
                if (td) {
                    td.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }
            }

            function clearSelectedCells() {
                if (isEditing) return;
                const cellsToClear = [];
                if (selectedRange) {
                    for (let r = selectedRange.startRow; r <= selectedRange.endRow; r++) {
                        for (let c = selectedRange.startCol; c <= selectedRange.endCol; c++) {
                            cellsToClear.push(getCellRef(r, c));
                        }
                    }
                } else if (selectedCell) {
                    cellsToClear.push(getCellRef(selectedCell.row, selectedCell.col));
                }
                const sheet = getActiveSheet();
                for (const ref of cellsToClear) {
                    const parsed = parseCellRef(ref);
                    if (parsed && sheet.cells[ref]) {
                        sheet.cells[ref].value = null;
                        sheet.cells[ref].formula = null;
                        sheet.cells[ref].display = '';
                        clearDependencies(activeSheetName, ref);
                        updateCellDOM(ref, activeSheetName);
                    }
                }
                // Recalculate affected cells
                for (const ref of cellsToClear) {
                    const node = getGraphNode(activeSheetName, ref);
                    const deps = [...node.dependents];
                    for (const depRef of deps) {
                        recalculateCell(depRef, activeSheetName);
                    }
                }
                updateFormulaBar();
                showToast('Contents cleared');
            }

            // ============ SHEET TABS ============
            function renderSheetTabs() {
                const existingTabs = sheetTabsBar.querySelectorAll('.sheet-tab');
                existingTabs.forEach(t => t.remove());
                const addBtn = document.getElementById('addSheetBtn');
                for (const [name] of Object.entries(sheets)) {
                    const tab = document.createElement('span');
                    tab.className = 'sheet-tab' + (name === activeSheetName ? ' active-sheet' : '');
                    tab.textContent = name;
                    tab.addEventListener('click', (e) => {
                        if (e.target.closest('.tab-delete')) return;
                        if (isEditing) commitEdit();
                        activeSheetName = name;
                        selectedCell = { row: 1, col: 1 };
                        selectedRange = null;
                        renderGrid();
                        refreshAllCellDOMs();
                        updateFormulaBar();
                    });
                    tab.addEventListener('dblclick', (e) => {
                        if (e.target.closest('.tab-delete')) return;
                        renameSheet(name);
                    });
                    // Delete button
                    if (Object.keys(sheets).length > 1) {
                        const delSpan = document.createElement('span');
                        delSpan.className = 'tab-delete';
                        delSpan.textContent = '×';
                        delSpan.addEventListener('click', (e) => {
                            e.stopPropagation();
                            deleteSheet(name);
                        });
                        tab.appendChild(delSpan);
                    }
                    sheetTabsBar.insertBefore(tab, addBtn);
                }
            }

            function addNewSheet() {
                if (isEditing) commitEdit();
                let baseName = 'Sheet';
                let counter = Object.keys(sheets).length + 1;
                let newName = baseName + counter;
                while (sheets[newName]) {
                    counter++;
                    newName = baseName + counter;
                }
                sheets[newName] = createEmptySheet(newName);
                activeSheetName = newName;
                selectedCell = { row: 1, col: 1 };
                selectedRange = null;
                renderGrid();
                updateFormulaBar();
                showToast(`Added "${newName}"`);
            }

            function renameSheet(oldName) {
                const newName = prompt('Rename sheet:', oldName);
                if (!newName || newName === oldName || newName.trim() === '') return;
                const trimmed = newName.trim();
                if (sheets[trimmed] && trimmed !== oldName) {
                    showToast('Sheet name already exists!');
                    return;
                }
                sheets[trimmed] = sheets[oldName];
                sheets[trimmed].name = trimmed;
                delete sheets[oldName];
                if (activeSheetName === oldName) activeSheetName = trimmed;
                renderSheetTabs();
                showToast(`Renamed to "${trimmed}"`);
            }

            function deleteSheet(name) {
                const sheetNames = Object.keys(sheets);
                if (sheetNames.length <= 1) {
                    showToast('Cannot delete the last sheet');
                    return;
                }
                if (!confirm(`Delete sheet "${name}"?`)) return;
                if (isEditing) commitEdit();
                delete sheets[name];
                if (activeSheetName === name) {
                    activeSheetName = Object.keys(sheets)[0];
                }
                selectedCell = { row: 1, col: 1 };
                selectedRange = null;
                renderGrid();
                updateFormulaBar();
                showToast(`Deleted "${name}"`);
            }

            document.getElementById('addSheetBtn').addEventListener('click', addNewSheet);

            // ============ TOOLBAR ACTIONS ============
            document.getElementById('btnBold').addEventListener('click', () => {
                toggleFormat('bold');
                document.getElementById('btnBold').classList.toggle('active-format');
            });
            document.getElementById('btnItalic').addEventListener('click', () => {
                toggleFormat('italic');
                document.getElementById('btnItalic').classList.toggle('active-format');
            });
            document.getElementById('btnClear').addEventListener('click', clearSelectedCells);
            document.getElementById('btnDownloadCSV').addEventListener('click', downloadCSV);
            document.getElementById('btnUploadCSV').addEventListener('click', () => csvFileInput.click());
            csvFileInput.addEventListener('change', uploadCSV);
            bgColorPicker.addEventListener('input', () => {
                applyBgColor(bgColorPicker.value);
            });

            function toggleFormat(format) {
                if (isEditing) commitEdit();
                const cellsToFormat = getSelectedCellRefs();
                const sheet = getActiveSheet();
                for (const ref of cellsToFormat) {
                    const cellData = ensureCellData(parseCellRef(ref).row, parseCellRef(ref).col, activeSheetName);
                    cellData[format] = !cellData[format];
                    updateCellDOM(ref, activeSheetName);
                }
                updateFormatButtonStates();
            }

            function applyBgColor(color) {
                if (isEditing) commitEdit();
                const cellsToFormat = getSelectedCellRefs();
                const sheet = getActiveSheet();
                for (const ref of cellsToFormat) {
                    const cellData = ensureCellData(parseCellRef(ref).row, parseCellRef(ref).col, activeSheetName);
                    cellData.bgColor = color === '#ffffff' ? null : color;
                    updateCellDOM(ref, activeSheetName);
                }
            }

            function getSelectedCellRefs() {
                const refs = [];
                if (selectedRange) {
                    for (let r = selectedRange.startRow; r <= selectedRange.endRow; r++) {
                        for (let c = selectedRange.startCol; c <= selectedRange.endCol; c++) {
                            refs.push(getCellRef(r, c));
                        }
                    }
                } else if (selectedCell) {
                    refs.push(getCellRef(selectedCell.row, selectedCell.col));
                }
                return refs;
            }

            function updateFormatButtonStates() {
                if (!selectedCell) return;
                const ref = getCellRef(selectedCell.row, selectedCell.col);
                const sheet = getActiveSheet();
                const cellData = sheet.cells[ref];
                document.getElementById('btnBold').classList.toggle('active-format', cellData && cellData.bold);
                document.getElementById('btnItalic').classList.toggle('active-format', cellData && cellData.italic);
                if (cellData && cellData.bgColor) {
                    bgColorPicker.value = cellData.bgColor;
                } else {
                    bgColorPicker.value = '#ffffff';
                }
            }

            // ============ CSV IMPORT/EXPORT ============
            function downloadCSV() {
                const sheet = getActiveSheet();
                // Find data bounds
                let maxRow = 0;
                let maxCol = 0;
                for (const [ref, cellData] of Object.entries(sheet.cells)) {
                    if (cellData.display !== '' && cellData.display !== null && cellData.display !== undefined) {
                        const parsed = parseCellRef(ref);
                        if (parsed) {
                            maxRow = Math.max(maxRow, parsed.row);
                            maxCol = Math.max(maxCol, parsed.col);
                        }
                    }
                }
                if (maxRow === 0) {
                    showToast('No data to download');
                    return;
                }
                const lines = [];
                for (let r = 1; r <= maxRow; r++) {
                    const row = [];
                    for (let c = 1; c <= maxCol; c++) {
                        const ref = getCellRef(r, c);
                        const cellData = sheet.cells[ref];
                        let val = cellData ? (cellData.display || '') : '';
                        // Escape CSV
                        if (val.includes(',') || val.includes('"') || val.includes('\n')) {
                            val = '"' + val.replace(/"/g, '""') + '"';
                        }
                        row.push(val);
                    }
                    lines.push(row.join(','));
                }
                const csvContent = lines.join('\n');
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = activeSheetName + '.csv';
                link.click();
                URL.revokeObjectURL(url);
                showToast('CSV downloaded');
            }

            function uploadCSV(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const lines = text.split(/\r?\n/).filter(l => l.trim() !== '');
                    const sheet = getActiveSheet();
                    // Clear current sheet
                    for (const ref of Object.keys(sheet.cells)) {
                        const parsed = parseCellRef(ref);
                        if (parsed && parsed.row <= NUM_ROWS && parsed.col <= NUM_COLS) {
                            delete sheet.cells[ref];
                        }
                    }
                    // Also clear dependency graph for this sheet
                    dependencyGraph[activeSheetName] = {};

                    for (let r = 0; r < Math.min(lines.length, NUM_ROWS); r++) {
                        const cols = parseCSVLine(lines[r]);
                        for (let c = 0; c < Math.min(cols.length, NUM_COLS); c++) {
                            const ref = getCellRef(r + 1, c + 1);
                            const val = cols[c].trim();
                            const cellData = ensureCellData(r + 1, c + 1, activeSheetName);
                            if (val.startsWith('=')) {
                                cellData.formula = val;
                                cellData.value = null;
                                const result = evaluateFormula(val, activeSheetName);
                                cellData.display = result;
                                updateDependenciesForCell(ref, val, activeSheetName);
                            } else {
                                cellData.formula = null;
                                cellData.value = val;
                                cellData.display = val;
                            }
                        }
                    }
                    refreshAllCellDOMs();
                    recalculateAll(activeSheetName);
                    refreshAllCellDOMs();
                    updateFormulaBar();
                    showToast('CSV uploaded to ' + activeSheetName);
                };
                reader.readAsText(file);
                csvFileInput.value = '';
            }

            function parseCSVLine(line) {
                const result = [];
                let current = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const ch = line[i];
                    if (inQuotes) {
                        if (ch === '"') {
                            if (i + 1 < line.length && line[i + 1] === '"') {
                                current += '"';
                                i++;
                            } else {
                                inQuotes = false;
                            }
                        } else {
                            current += ch;
                        }
                    } else {
                        if (ch === '"') {
                            inQuotes = true;
                        } else if (ch === ',') {
                            result.push(current);
                            current = '';
                        } else {
                            current += ch;
                        }
                    }
                }
                result.push(current);
                return result;
            }

            // ============ CONTEXT MENU ============
            document.addEventListener('contextmenu', (e) => {
                const td = e.target.closest('td[data-ref]');
                if (td) {
