<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LiteSheet — Excel‑style Spreadsheet (Standalone)</title>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --muted:#64748b; --line:#e5e7eb; --accent:#2563eb;
    --accent-2:#1e40af; --text:#0f172a; --sel:#93c5fd66; --sel-border:#2563eb;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);}
  .toolbar{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  .toolbar .group{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
  .toolbar button,.toolbar select,.toolbar input[type="color"]{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
  .toolbar button:hover{background:#f3f4f6}
  .toolbar label{font-size:12px;color:var(--muted);margin:0 6px 0 2px}
  .name-bar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
  .cell-name{width:80px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px}
  .formula{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-family:ui-monospace,Consolas,Menlo,monospace}
  .sheetbar{position:sticky;bottom:0;display:flex;gap:6px;align-items:center;padding:8px;background:var(--panel);border-top:1px solid var(--line);z-index:4}
  .tab{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;user-select:none}
  .tab.active{background:#ebf2ff;border-color:#c7dafb;color:var(--accent);}
  .tab .close{margin-left:6px;color:#64748b}
  .grid-wrap{position:relative;height:calc(100% - 152px);display:flex;}
  .corner{width:48px;height:32px;position:sticky;left:0;top:0;background:#f3f4f6;border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:2}
  .col-headers{position:sticky;top:0;z-index:1;background:#f3f4f6;display:grid;border-bottom:1px solid var(--line)}
  .row-headers{position:sticky;left:0;z-index:1;background:#f3f4f6;display:flex;flex-direction:column;border-right:1px solid var(--line)}
  .col-h,.row-h{display:flex;align-items:center;justify-content:center;font-size:12px;color:#334155;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:relative;user-select:none}
  .col-h{height:32px}
  .row-h{width:48px;height:24px}
  .resize-handle{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize}
  .grid{overflow:auto;flex:1;}
  .cells{display:grid;grid-auto-rows:24px}
  .cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:2px 6px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;}
  .cell.bold{font-weight:700}
  .cell.italic{font-style:italic}
  .cell.sel{outline:2px solid var(--sel-border);outline-offset:-2px}
  .cell.in-range{background:linear-gradient(0deg,var(--sel),var(--sel))}
  .editor{position:absolute;border:2px solid var(--accent);padding:0;margin:0;font:inherit;line-height:20px;height:22px}
  .editor-input{width:100%;height:100%;border:none;outline:none;padding:0 4px;font:inherit;background:#fff}
  .hidden{display:none}
  .hint{font-size:12px;color:var(--muted);padding:6px 10px}
</style>
</head>
<body>
  <div class="toolbar" id="toolbar">
    <div class="group">
      <button id="boldBtn" title="Bold (Ctrl+B)"><strong>B</strong></button>
      <button id="italicBtn" title="Italic (Ctrl+I)"><em>I</em></button>
      <label for="bgColor">Fill</label><input type="color" id="bgColor" value="#ffffff" title="Background color" />
      <button id="clearBtn" title="Clear contents">Clear</button>
    </div>
    <div class="group">
      <button id="downloadCsv">Download CSV</button>
      <label for="uploadCsv" class="btn">Upload CSV</label>
      <input id="uploadCsv" type="file" accept=".csv,text/csv" class="hidden" />
    </div>
    <div class="hint">Double‑click a cell to edit • Type = to start a formula • Use arrow keys, Enter, and Tab to move</div>
  </div>

  <div class="name-bar">
    <input id="cellName" class="cell-name" value="A1" aria-label="Cell address" />
    <input id="formula" class="formula" placeholder="fx" aria-label="Formula bar" />
  </div>

  <div class="grid-wrap">
    <div class="corner"></div>
    <div id="colHeaders" class="col-headers"></div>
    <div id="rowHeaders" class="row-headers"></div>
    <div id="grid" class="grid">
      <div id="cells" class="cells"></div>
      <div id="cellEditor" class="editor hidden"><input id="cellEditorInput" class="editor-input" /></div>
    </div>
  </div>

  <div id="sheetbar" class="sheetbar">
    <button id="addSheet" class="tab" title="Add sheet">＋</button>
  </div>

<script>
(() => {
  // ===== Helpers for addresses and ranges =====
  const MAX_ROWS = 200;   // initial grid size (scrollable)
  const MAX_COLS = 26;    // A..Z by default

  const byId = id => document.getElementById(id);
  const formulaInput = byId('formula');
  const cellNameInput = byId('cellName');
  const cellsEl = byId('cells');
  const colHeadersEl = byId('colHeaders');
  const rowHeadersEl = byId('rowHeaders');
  const gridEl = byId('grid');
  const editor = byId('cellEditor');
  const editorInput = byId('cellEditorInput');
  const sheetbar = byId('sheetbar');
  const addSheetBtn = byId('addSheet');

  const boldBtn = byId('boldBtn');
  const italicBtn = byId('italicBtn');
  const bgColor = byId('bgColor');
  const clearBtn = byId('clearBtn');
  const downloadCsvBtn = byId('downloadCsv');
  const uploadCsvInput = byId('uploadCsv');

  function colToName(n){ // 0 -> A
    let s=''; n = n|0; do{ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n/26) - 1; } while(n>=0); return s; }
  function nameToCol(s){ let n=0; for(let i=0;i<s.length;i++){ n = n*26 + (s.charCodeAt(i)-64); } return n-1; }
  function addr(col,row){ return colToName(col) + row; }
  function parseAddr(a){ const m = /^([A-Z]+)(\d+)$/.exec(a.toUpperCase()); if(!m) return null; return { col:nameToCol(m[1]), row:parseInt(m[2],10) }; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max,v)); }

  // ===== Data model =====
  const wb = {
    sheets: [],
    active: 0
  };
  function makeSheet(name){
    return {
      name, cols: MAX_COLS, rows: MAX_ROWS,
      colWidths: {},
      cells: new Map(), // key: "A1" => {v:displayValue, f:formulaString|null, t:"n"|"s", b:false, i:false, bg:null}
      deps: new Map(), // cell -> Set(refs)
      rev: new Map()   // ref -> Set(dependents)
    };
  }

  // Init workbook with one sheet
  wb.sheets.push(makeSheet('Sheet1'));

  // ===== Rendering =====
  function buildHeaders(){
    // Column headers grid template
    const s = wb.sheets[wb.active];
    const cols = s.cols, rows = s.rows;
    colHeadersEl.style.gridTemplateColumns = `48px repeat(${cols}, var(--cwidth))`;
    rowHeadersEl.style.gridTemplateRows = `32px repeat(${rows}, 24px)`;
    // Set CSS variable for column width fallback
    document.documentElement.style.setProperty('--cwidth','100px');

    // Build col headers
    colHeadersEl.innerHTML = '';
    // leading empty cell space already .corner
    const hdrRow = document.createElement('div');
    hdrRow.style.gridColumn = `1 / span ${cols+1}`;
    hdrRow.style.display = 'grid';
    hdrRow.style.gridTemplateColumns = `48px ${Array.from({length: cols}).map((_,c)=> (s.colWidths[c]||100)+'px').join(' ')}`;
    for(let c=-1;c<cols;c++){
      if(c===-1){ const spacer = document.createElement('div'); spacer.style.width='48px'; spacer.style.height='32px'; spacer.className='col-h'; hdrRow.appendChild(spacer); continue; }
      const h = document.createElement('div'); h.className='col-h'; h.textContent = colToName(c); h.style.width = (s.colWidths[c]||100)+'px';
      const handle = document.createElement('div'); handle.className='resize-handle'; h.appendChild(handle);
      let startX, startW;
      handle.addEventListener('mousedown', (e)=>{
        startX = e.clientX; startW = s.colWidths[c] || 100; document.body.style.cursor='col-resize';
        function move(ev){ const w = clamp(startW + (ev.clientX - startX), 40, 500); s.colWidths[c]=w; h.style.width=w+'px'; updateColumnWidth(c,w); }
        function up(){ document.body.style.cursor=''; document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
        document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
        e.preventDefault();
      });
      hdrRow.appendChild(h);
    }
    colHeadersEl.appendChild(hdrRow);

    // Row headers
    rowHeadersEl.innerHTML='';
    const frag = document.createDocumentFragment();
    for(let r=0;r<=rows;r++){
      const h = document.createElement('div'); h.className='row-h'; h.textContent = r===0? '' : r; frag.appendChild(h);
    }
    rowHeadersEl.appendChild(frag);
  }

  function updateColumnWidth(col,w){
    // update all cells in that column
    const s = wb.sheets[wb.active];
    for(let r=1;r<=s.rows;r++){
      const d = byId(`c-${col}-${r}`); if(d) d.style.width = w+'px';
    }
  }

  function renderGrid(){
    const s = wb.sheets[wb.active];
    // Grid template
    cellsEl.style.gridTemplateColumns = `${Array.from({length: s.cols}).map((_,c)=> (s.colWidths[c]||100)+'px').join(' ')}`;
    cellsEl.innerHTML='';
    const frag = document.createDocumentFragment();
    for(let r=1;r<=s.rows;r++){
      for(let c=0;c<s.cols;c++){
        const d = document.createElement('div'); d.className='cell'; d.id = `c-${c}-${r}`; d.dataset.col=c; d.dataset.row=r; d.style.width = (s.colWidths[c]||100)+'px';
        applyCellDisplay(d, addr(c,r));
        frag.appendChild(d);
      }
    }
    cellsEl.appendChild(frag);
  }

  function applyCellDisplay(cellDiv, a){
    const s = wb.sheets[wb.active];
    const data = s.cells.get(a);
    cellDiv.textContent = data? displayString(data) : '';
    cellDiv.classList.toggle('bold', !!(data && data.b));
    cellDiv.classList.toggle('italic', !!(data && data.i));
    cellDiv.style.background = (data && data.bg) || '#fff';
  }
  function refreshAllDisplays(){
    const s = wb.sheets[wb.active];
    for(let r=1;r<=s.rows;r++) for(let c=0;c<s.cols;c++){
      const el = byId(`c-${c}-${r}`); if(el) applyCellDisplay(el, addr(c,r));
    }
  }

  // ===== Selection and editor =====
  let sel = { col:0, row:1, endCol:0, endRow:1 };
  let editing = false;
  function setSelection(col,row, endCol=col, endRow=row){
    const s = wb.sheets[wb.active];
    col = clamp(col,0,s.cols-1); row = clamp(row,1,s.rows); endCol = clamp(endCol,0,s.cols-1); endRow = clamp(endRow,1,s.rows);
    // clear prev
    $$('.cell.sel, .cell.in-range').forEach(e=>{ e.classList.remove('sel','in-range')});
    sel = {col,row,endCol,endRow};
    // mark new
    const [c1,c2] = [Math.min(col,endCol), Math.max(col,endCol)];
    const [r1,r2] = [Math.min(row,endRow), Math.max(row,endRow)];
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const el = byId(`c-${c}-${r}`);
      if(!el) continue; el.classList.add((r===row && c===col)?'sel':'in-range');
    }
    updateNameBar();
    scrollIntoViewIfNeeded();
  }
  function updateNameBar(){
    const a = addr(sel.col, sel.row);
    cellNameInput.value = a;
    const s = wb.sheets[wb.active];
    const data = s.cells.get(a);
    formulaInput.value = data? (data.f ?? displayString(data)) : '';
  }
  function scrollIntoViewIfNeeded(){
    const el = byId(`c-${sel.col}-${sel.row}`); if(!el) return;
    const rect = el.getBoundingClientRect(); const wrap = gridEl.getBoundingClientRect();
    if(rect.right > wrap.right) gridEl.scrollLeft += rect.right - wrap.right + 20;
    if(rect.left < wrap.left) gridEl.scrollLeft -= (wrap.left - rect.left) + 20;
    if(rect.bottom > wrap.bottom) gridEl.scrollTop += rect.bottom - wrap.bottom + 20;
    if(rect.top < wrap.top) gridEl.scrollTop -= (wrap.top - rect.top) + 20;
  }

  function openEditor(inPlace=false){
    const a = addr(sel.col, sel.row);
    const s = wb.sheets[wb.active];
    const data = s.cells.get(a);
    const cellEl = byId(`c-${sel.col}-${sel.row}`);
    const r = cellEl.getBoundingClientRect(); const g = gridEl.getBoundingClientRect();
    editor.style.left = (r.left - g.left + gridEl.scrollLeft) + 'px';
    editor.style.top  = (r.top  - g.top  + gridEl.scrollTop)  + 'px';
    editor.style.width = (s.colWidths[sel.col]||100) + 'px';
    editor.style.height = '24px';
    editor.classList.remove('hidden');
    editing = true;
    editorInput.value = data? (data.f ?? displayString(data)) : '';
    editorInput.focus(); editorInput.select();
  }
  function closeEditor(commit){
    if(!editing) return; editing=false; editor.classList.add('hidden');
    if(commit){ applyFromString(editorInput.value); }
  }

  function onCellDblClick(e){ openEditor(true); }
  function onGridMouseDown(e){
    const cell = e.target.closest('.cell');
    if(!cell) return;
    const startC = +cell.dataset.col, startR = +cell.dataset.row;
    setSelection(startC,startR);
    let dragging=true; function move(ev){
      const tgt = ev.target.closest('.cell'); if(!tgt) return; setSelection(startC,startR, +tgt.dataset.col, +tgt.dataset.row);
    }
    function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
  }

  // Keyboard nav
  document.addEventListener('keydown', (e)=>{
    if(document.activeElement === editorInput){
      if(e.key==='Enter'){ e.preventDefault(); closeEditor(true); return; }
      if(e.key==='Escape'){ e.preventDefault(); closeEditor(false); return; }
      return;
    }
    if(document.activeElement === formulaInput){
      if(e.key==='Enter'){ e.preventDefault(); applyFromString(formulaInput.value); return; }
      return;
    }
    const delta = (dx,dy)=>{ setSelection(sel.col+dx, sel.row+dy); };
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Enter','Tab'].includes(e.key)){
      e.preventDefault();
      if(e.key==='ArrowLeft') delta(-1,0);
      if(e.key==='ArrowRight') delta(1,0);
      if(e.key==='ArrowUp') delta(0,-1);
      if(e.key==='ArrowDown') delta(0,1);
      if(e.key==='Enter') delta(0,1);
      if(e.key==='Tab') delta(e.shiftKey?-1:1,0);
      return;
    }
    // start typing to edit
    if(e.key.length===1){ openEditor(); editorInput.value = e.key; }
    if(e.key==='F2'){ openEditor(true); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='b'){ toggleStyle('b'); }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='i'){ toggleStyle('i'); }
  });

  // Name/Formula bar interactions
  cellNameInput.addEventListener('change', ()=>{
    const p = parseAddr(cellNameInput.value); if(p){ setSelection(p.col, p.row); }
  });
  formulaInput.addEventListener('focus', ()=> formulaPickMode = true);
  formulaInput.addEventListener('blur', ()=> formulaPickMode = false);
  formulaInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); applyFromString(formulaInput.value); } });

  // Clicking while formula bar active inserts addresses/ranges
  let formulaPickMode = false;
  gridEl.addEventListener('mousedown', (e)=>{
    if(!formulaPickMode || !formulaInput.value.trim().startsWith('=')) return;
    const cell = e.target.closest('.cell'); if(!cell) return;
    const startC = +cell.dataset.col, startR = +cell.dataset.row;
    const startAddr = addr(startC,startR);
    insertIntoFormula(startAddr);
    setSelection(startC,startR);
    function move(ev){ const tgt = ev.target.closest('.cell'); if(!tgt) return; const endA = addr(+tgt.dataset.col, +tgt.dataset.row); const range = makeRangeString(startAddr, endA); replaceLastRange(range); setSelection(startC,startR, +tgt.dataset.col, +tgt.dataset.row); }
    function up(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); }
    document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    e.preventDefault();
  });
  function makeRangeString(a,b){ const p1=parseAddr(a), p2=parseAddr(b); const c1=Math.min(p1.col,p2.col), c2=Math.max(p1.col,p2.col); const r1=Math.min(p1.row,p2.row), r2=Math.max(p1.row,p2.row); return `${addr(c1,r1)}:${addr(c2,r2)}`; }
  function insertIntoFormula(text){ const v=formulaInput.value; const pos=formulaInput.selectionStart ?? v.length; const nv = v.slice(0,pos)+text+v.slice(pos); formulaInput.value=nv; const np = pos+text.length; formulaInput.setSelectionRange(np,np); formulaInput.focus(); }
  function replaceLastRange(text){ // replace last token that looks like A1 or A1:B9 at end
    const v=formulaInput.value; const m = /(.*?=.+?)([A-Z]+\d+(?::[A-Z]+\d+)?)$/i.exec(v); if(m){ formulaInput.value = m[1]+text; } else insertIntoFormula(text); }

  // ===== Formula engine =====
  function displayString(cell){
    if(cell.t==='n' && typeof cell.v==='number'){ return Number.isFinite(cell.v)? String(cell.v) : '#ERR'; }
    return cell.v ?? '';
  }
  function toNumber(x){ const n = (typeof x==='number')? x : parseFloat(x); return Number.isFinite(n)? n : 0; }

  function evalCell(a, sheet, stack=new Set(), memo=new Map()){
    if(memo.has(a)) return memo.get(a);
    const cell = sheet.cells.get(a);
    if(!cell || !cell.f){ const val = cell? cell.v : ''; memo.set(a,val); return val; }
    if(stack.has(a)) { memo.set(a,'#CYCLE!'); return '#CYCLE!'; }
    stack.add(a);
    const expr = cell.f.slice(1).toUpperCase();
    function get(ref){ return evalCell(ref, sheet, stack, memo); }
    function range(r){ const [a1,a2] = r.split(':'); const p1=parseAddr(a1), p2=parseAddr(a2); const out=[]; for(let r=Math.min(p1.row,p2.row); r<=Math.max(p1.row,p2.row); r++){ for(let c=Math.min(p1.col,p2.col); c<=Math.max(p1.col,p2.col); c++){ out.push(get(addr(c,r))); } } return out; }
    function sum(arr){ let t=0; for(const v of (Array.isArray(arr)?arr:[arr])){ const n=toNumber(v); t+=n; } return t; }
    function avg(arr){ const xs = (Array.isArray(arr)?arr:[arr]).map(toNumber); const nums = xs.filter(v=>!Number.isNaN(v)); return nums.length? nums.reduce((a,b)=>a+b,0)/nums.length : 0; }
    function minf(arr){ const xs=(Array.isArray(arr)?arr:[arr]).map(toNumber); return Math.min(...xs); }
    function maxf(arr){ const xs=(Array.isArray(arr)?arr:[arr]).map(toNumber); return Math.max(...xs); }

    // Build safe JS expression
    let js = expr
      .replace(/AVERAGE\s*\(/g,'avg(')
      .replace(/SUM\s*\(/g,'sum(')
      .replace(/MIN\s*\(/g,'minf(')
      .replace(/MAX\s*\(/g,'maxf(');
    // ranges -> range('A1:B3')
    js = js.replace(/([A-Z]+\d+):([A-Z]+\d+)/g, (m,a,b)=>`range('${a}:${b}')`);
    // single refs -> get('A1')
    js = js.replace(/\b([A-Z]+\d+)\b/g, (m,a)=>`get('${a}')`);
    // allow only safe chars
    if(/[^0-9+\-*/().,' _a-zA-Z:\[\]]/.test(js)){ stack.delete(a); memo.set(a,'#ERR'); return '#ERR'; }
    let val;
    try{
      // eslint-disable-next-line no-new-func
      val = Function('get','range','sum','avg','minf','maxf', `return (${js})`)(get,range,sum,avg,minf,maxf);
    }catch(err){ val = '#ERR'; }
    stack.delete(a); memo.set(a,val); return val;
  }

  function recalc(sheet){
    // Evaluate all cells with formulas; memoized for efficiency
    const memo = new Map();
    for(const [a,cell] of sheet.cells){ if(cell.f){ const v = evalCell(a, sheet, new Set(), memo); cell.v = (typeof v==='number' && Number.isFinite(v))? v : v; cell.t = (typeof v==='number' && Number.isFinite(v))? 'n' : 's'; } }
  }

  function extractRefs(formula){
    const refs = new Set(); if(!formula || formula[0] !== '=') return refs;
    const up = formula.toUpperCase();
    const rangeRe = /([A-Z]+\d+):([A-Z]+\d+)/g; let m;
    while((m=rangeRe.exec(up))){ const p1=parseAddr(m[1]), p2=parseAddr(m[2]); for(let r=Math.min(p1.row,p2.row); r<=Math.max(p1.row,p2.row); r++) for(let c=Math.min(p1.col,p2.col); c<=Math.max(p1.col,p2.col); c++) refs.add(addr(c,r)); }
    const singleRe = /\b([A-Z]+\d+)\b/g; while((m=singleRe.exec(up))){ refs.add(m[1]); }
    return refs;
  }

  function updateDeps(sheet, cellAddr, newRefs){
    const deps = sheet.deps; const rev = sheet.rev;
    const old = deps.get(cellAddr) || new Set();
    // remove old reverse links not in new
    for(const r of old){ if(!newRefs.has(r)){ const set = rev.get(r); if(set){ set.delete(cellAddr); if(!set.size) rev.delete(r); } } }
    // add new reverse links
    for(const r of newRefs){ if(!old.has(r)){ if(!rev.has(r)) rev.set(r, new Set()); rev.get(r).add(cellAddr); } }
    deps.set(cellAddr, newRefs);
  }

  function applyFromString(str){
    const s = wb.sheets[wb.active];
    const a = addr(sel.col, sel.row);
    let cell = s.cells.get(a) || {v:'',t:'s',f:null,b:false,i:false,bg:null};
    if(str.startsWith('=')){
      cell.f = str; // value will be set after recalc
    } else if(str===''){ cell = {v:'',t:'s',f:null,b:cell.b,i:cell.i,bg:cell.bg}; }
    else {
      const num = parseFloat(str); if(!Number.isNaN(num) && /^-?\d+(\.\d+)?$/.test(str.trim())){ cell.v = num; cell.t='n'; cell.f=null; }
      else { cell.v = str; cell.t='s'; cell.f=null; }
    }
    s.cells.set(a, cell);
    updateDeps(s, a, extractRefs(cell.f||''));
    recalc(s);
    refreshAllDisplays();
    updateNameBar();
  }

  // ===== Styles =====
  function toggleStyle(kind){ const s = wb.sheets[wb.active]; const [c1,c2] = [Math.min(sel.col,sel.endCol), Math.max(sel.col,sel.endCol)]; const [r1,r2] = [Math.min(sel.row,sel.endRow), Math.max(sel.row,sel.endRow)];
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const a = addr(c,r); const cell = s.cells.get(a) || {v:'',t:'s'}; if(kind==='b') cell.b = !cell.b; if(kind==='i') cell.i = !cell.i; s.cells.set(a, cell); applyCellDisplay(byId(`c-${c}-${r}`), a);
    }
  }
  function setBg(color){ const s = wb.sheets[wb.active]; const [c1,c2] = [Math.min(sel.col,sel.endCol), Math.max(sel.col,sel.endCol)]; const [r1,r2] = [Math.min(sel.row,sel.endRow), Math.max(sel.row,sel.endRow)];
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const a = addr(c,r); const cell = s.cells.get(a) || {v:'',t:'s'}; cell.bg = color; s.cells.set(a, cell); applyCellDisplay(byId(`c-${c}-${r}`), a);
    }
  }
  function clearContents(){ const s = wb.sheets[wb.active]; const [c1,c2] = [Math.min(sel.col,sel.endCol), Math.max(sel.col,sel.endCol)]; const [r1,r2] = [Math.min(sel.row,sel.endRow), Math.max(sel.row,sel.endRow)];
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){
      const a = addr(c,r); const cell = s.cells.get(a); if(cell){ cell.v=''; cell.t='s'; cell.f=null; s.cells.set(a,cell); applyCellDisplay(byId(`c-${c}-${r}`), a); updateDeps(s, a, new Set()); }
    }
  }

  // ===== CSV =====
  function downloadCsv(){ const s = wb.sheets[wb.active];
    // find bounds
    let maxC = 0, maxR = 0; for(const a of s.cells.keys()){ const p=parseAddr(a); if(s.cells.get(a)?.v || s.cells.get(a)?.f){ maxC = Math.max(maxC,p.col); maxR = Math.max(maxR,p.row); } }
    const rows=[]; for(let r=1;r<=Math.max(1,maxR);r++){ const row=[]; for(let c=0;c<=Math.max(0,maxC);c++){ const cell = s.cells.get(addr(c,r)); const text = cell? (cell.f? cell.f : displayString(cell)) : ''; row.push(csvEscape(text)); } rows.push(row.join(',')); }
    const blob = new Blob([rows.join('\n')], {type:'text/csv'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = s.name + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  }
  function csvEscape(text){ if(text==null) return ''; const t = String(text); if(/[",\n]/.test(t)){ return '"'+t.replace(/"/g,'""')+'"'; } return t; }
  function parseCsv(str){ const rows=[]; let i=0, cur=''; let row=[]; let inQ=false; while(i<str.length){ const ch=str[i++]; if(inQ){ if(ch==='"'){ if(str[i]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=ch; } else { if(ch==='"'){ inQ=true; } else if(ch===','){ row.push(cur); cur=''; } else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; } else if(ch==='\r'){ /* ignore */ } else cur+=ch; }} row.push(cur); rows.push(row); return rows; }
  function uploadCsv(file){ const reader = new FileReader(); reader.onload = () => { const rows = parseCsv(reader.result); const s = wb.sheets[wb.active]; for(let r=0;r<rows.length;r++){ for(let c=0;c<rows[r].length;c++){ const a = addr(c, r+1); const v = rows[r][c]; if(v.startsWith('=')) { setCellRaw(s,a,{f:v}); } else { const num=parseFloat(v); if(!Number.isNaN(num) && /^-?\d+(\.\d+)?$/.test(v.trim())) setCellRaw(s,a,{v:num,t:'n',f:null}); else setCellRaw(s,a,{v:v,t:'s',f:null}); } }} recalc(s); refreshAllDisplays(); }; reader.readAsText(file); }
  function setCellRaw(sheet, a, patch){ const old = sheet.cells.get(a) || {v:'',t:'s',f:null}; sheet.cells.set(a, {...old, ...patch}); updateDeps(sheet,a,extractRefs((patch.f!=null?patch.f:old.f)||'')); }

  // ===== Sheets UI =====
  function renderSheetTabs(){
    // keep + button at end
    [...sheetbar.querySelectorAll('.tab.s')].forEach(n=>n.remove());
    wb.sheets.forEach((sh, i)=>{
      const t = document.createElement('div'); t.className = 'tab s'+(i===wb.active?' active':''); t.textContent = sh.name; t.title = 'Double‑click to rename';
      const close = document.createElement('span'); close.textContent='×'; close.className='close'; close.title='Delete sheet'; t.appendChild(close);
      t.addEventListener('click', ()=>{ wb.active=i; buildHeaders(); renderGrid(); setSelection(0,1); renderSheetTabs(); });
      t.addEventListener('dblclick', ()=>{ const nv = prompt('Rename sheet', sh.name); if(nv){ sh.name=nv; renderSheetTabs(); }});
      close.addEventListener('click', (e)=>{ e.stopPropagation(); if(wb.sheets.length===1) return alert('Cannot delete last sheet'); if(confirm('Delete sheet "'+sh.name+'"?')){ wb.sheets.splice(i,1); if(wb.active>=wb.sheets.length) wb.active=wb.sheets.length-1; buildHeaders(); renderGrid(); setSelection(0,1); renderSheetTabs(); }});
      sheetbar.insertBefore(t, addSheetBtn);
    });
  }
  addSheetBtn.addEventListener('click', ()=>{ const n = 'Sheet'+(wb.sheets.length+1); wb.sheets.push(makeSheet(n)); wb.active = wb.sheets.length-1; buildHeaders(); renderGrid(); setSelection(0,1); renderSheetTabs(); });

  // ===== Toolbar actions =====
  boldBtn.addEventListener('click', ()=> toggleStyle('b'));
  italicBtn.addEventListener('click', ()=> toggleStyle('i'));
  bgColor.addEventListener('change', ()=> setBg(bgColor.value));
  clearBtn.addEventListener('click', clearContents);
  downloadCsvBtn.addEventListener('click', downloadCsv);
  uploadCsvInput.addEventListener('change', ()=>{ const f = uploadCsvInput.files[0]; if(f) uploadCsv(f); uploadCsvInput.value=''; });

  // Events
  cellsEl.addEventListener('dblclick', onCellDblClick);
  cellsEl.addEventListener('mousedown', onGridMouseDown);
  editorInput.addEventListener('blur', ()=> closeEditor(true));

  // ===== Initial render =====
  function $$(sel,root=document){ return Array.from(root.querySelectorAll(sel)); }
  buildHeaders(); renderGrid(); setSelection(0,1); renderSheetTabs();

})();
</script>
</body>
</html>
