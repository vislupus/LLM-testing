<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern Sheets</title>
<style>
  :root{
    --ink:#22312e;
    --ink-soft:#5f7370;
    --chrome:#f4f7f6;
    --line:#dde4e2;
    --grid-line:#e3e9e7;
    --accent:#107c5b;
    --accent-deep:#0b5f46;
    --accent-soft:rgba(16,124,91,.09);
    --accent-softer:rgba(16,124,91,.16);
    --bg:#ffffff;
    --danger:#b3402a;
    --hl0:#2f6fd0; --hl1:#c2571f; --hl2:#8a3fb8; --hl3:#0f8a8a;
    --row-h:26px;
    --shadow:0 1px 2px rgba(34,49,46,.08);
    font-size:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color:var(--ink); background:var(--chrome);
    overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100vh;}

  /* ---------- Toolbar ---------- */
  #toolbar{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    padding:7px 12px; background:var(--bg); border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:8px; margin-right:10px; user-select:none;}
  .brand .mark{
    width:20px; height:20px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:2px;
  }
  .brand .mark i{background:var(--line); border-radius:2px;}
  .brand .mark i.g{background:var(--accent);}
  .brand b{font-size:15px; letter-spacing:.2px; font-weight:650;}
  .brand b span{color:var(--accent); font-weight:650;}
  .tb-sep{width:1px; height:22px; background:var(--line); margin:0 4px;}
  .tb-btn{
    min-width:30px; height:28px; padding:0 9px;
    border:1px solid transparent; border-radius:6px; background:transparent;
    color:var(--ink); font:inherit; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .tb-btn:hover{background:var(--chrome); border-color:var(--line);}
  .tb-btn:active{background:var(--accent-soft);}
  .tb-btn.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep);}
  .tb-btn:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  .tb-btn b{font-weight:750;}
  .tb-btn .sw{width:16px; height:16px; border-radius:4px; border:1px solid var(--line); background:#fff3b0;}
  #fill-color{width:0; height:0; opacity:0; position:absolute;}
  .hint{margin-left:auto; color:var(--ink-soft); font-size:12px; user-select:none;}
  @media (max-width:760px){ .hint{display:none;} }

  /* ---------- Formula bar ---------- */
  #formula-row{
    display:flex; align-items:stretch; gap:0;
    background:var(--bg); border-bottom:1px solid var(--line); padding:5px 12px;
  }
  #name-box{
    width:92px; flex:none; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); border-radius:6px 0 0 6px; border-right:none;
    font-size:13px; font-weight:600; color:var(--ink); background:var(--chrome);
    letter-spacing:.3px; user-select:none; overflow:hidden; white-space:nowrap;
  }
  #fx{
    flex:none; display:flex; align-items:center; padding:0 10px;
    border:1px solid var(--line); border-right:none; color:var(--accent-deep);
    font-family:Georgia, "Times New Roman", serif; font-style:italic; font-weight:600;
    background:var(--bg); user-select:none;
  }
  #formula-input{
    flex:1; min-width:80px; height:30px; padding:0 10px;
    border:1px solid var(--line); border-radius:0 6px 6px 0;
    font-family:ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size:13px;
    color:var(--ink); background:var(--bg);
  }
  #formula-input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);}

  /* ---------- Grid ---------- */
  #grid-wrap{
    flex:1; overflow:auto; background:var(--bg); outline:none; position:relative;
    overscroll-behavior:contain;
  }
  table{border-collapse:separate; border-spacing:0; table-layout:fixed;}
  th, td{
    height:var(--row-h);
    border-right:1px solid var(--grid-line); border-bottom:1px solid var(--grid-line);
    font-size:13px; overflow:hidden; white-space:nowrap;
  }
  thead th{
    position:sticky; top:0; z-index:3;
    background:var(--chrome); color:var(--ink-soft); font-weight:600; font-size:12px;
    border-bottom:1px solid var(--line); user-select:none; text-align:center;
  }
  thead th.corner{left:0; z-index:5; border-right:1px solid var(--line);}
  tbody th{
    position:sticky; left:0; z-index:2;
    background:var(--chrome); color:var(--ink-soft); font-weight:600; font-size:12px;
    border-right:1px solid var(--line); user-select:none; text-align:center;
  }
  th.hl{background:var(--accent-softer); color:var(--accent-deep);}
  thead th{position:relative;}
  thead th.corner{position:sticky;}
  .rz{
    position:absolute; top:0; right:-4px; width:8px; height:100%;
    cursor:col-resize; z-index:6;
  }
  .rz:hover{background:var(--accent-soft);}
  td.cell{
    padding:0 6px; background:var(--bg); color:var(--ink);
    text-align:left; vertical-align:middle; cursor:cell; position:relative;
  }
  td.cell.num{text-align:right; font-variant-numeric:tabular-nums;}
  td.cell.err{color:var(--danger); font-weight:600; text-align:center;}
  td.cell.in-sel{background-image:linear-gradient(var(--accent-soft), var(--accent-soft));}
  td.cell.active{
    outline:2px solid var(--accent); outline-offset:-2px;
    background-image:none;
  }
  td.cell.rhl0{box-shadow:inset 0 0 0 2px var(--hl0); background-image:linear-gradient(rgba(47,111,208,.08),rgba(47,111,208,.08));}
  td.cell.rhl1{box-shadow:inset 0 0 0 2px var(--hl1); background-image:linear-gradient(rgba(194,87,31,.08),rgba(194,87,31,.08));}
  td.cell.rhl2{box-shadow:inset 0 0 0 2px var(--hl2); background-image:linear-gradient(rgba(138,63,184,.08),rgba(138,63,184,.08));}
  td.cell.rhl3{box-shadow:inset 0 0 0 2px var(--hl3); background-image:linear-gradient(rgba(15,138,138,.08),rgba(15,138,138,.08));}
  .cell-editor{
    position:absolute; inset:0; width:100%; height:100%;
    border:2px solid var(--accent); padding:0 4px;
    font:inherit; font-family:ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size:13px;
    background:var(--bg); color:var(--ink); z-index:1;
  }
  .cell-editor:focus{outline:none;}

  /* ---------- Sheet bar ---------- */
  #sheet-bar{
    display:flex; align-items:center; gap:4px;
    background:var(--bg); border-top:1px solid var(--line); padding:4px 8px;
    min-height:36px;
  }
  #btn-add-sheet{
    width:26px; height:26px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--accent-deep); font-size:16px; line-height:1;
    cursor:pointer; flex:none;
  }
  #btn-add-sheet:hover{background:var(--accent-soft); border-color:var(--accent);}
  #tabs{display:flex; align-items:center; gap:2px; overflow-x:auto; flex:1; min-width:0;}
  .tab{
    display:flex; align-items:center; gap:6px; flex:none;
    padding:4px 10px; border:1px solid transparent; border-radius:6px 6px 0 0;
    border-bottom:2px solid transparent;
    color:var(--ink-soft); font-size:13px; cursor:pointer; user-select:none;
    max-width:180px;
  }
  .tab:hover{background:var(--chrome);}
  .tab.on{
    color:var(--accent-deep); font-weight:600;
    border-color:var(--line); border-bottom:2px solid var(--accent); background:var(--bg);
  }
  .tab .x{
    display:none; width:14px; height:14px; line-height:12px; text-align:center;
    border-radius:3px; color:var(--ink-soft); font-size:12px;
  }
  .tab:hover .x{display:inline-block;}
  .tab .x:hover{background:var(--line); color:var(--danger);}
  .tab input{
    font:inherit; width:90px; border:1px solid var(--accent); border-radius:4px; padding:1px 4px;
  }
  #stats{
    margin-left:auto; flex:none; color:var(--ink-soft); font-size:12px;
    font-variant-numeric:tabular-nums; padding:0 6px; white-space:nowrap;
  }
  #stats b{color:var(--ink); font-weight:600;}

  @media (prefers-reduced-motion:no-preference){
    .tb-btn, .tab{transition:background .12s ease, border-color .12s ease;}
  }
</style>
</head>
<body>
<div id="app">

  <div id="toolbar">
    <div class="brand" title="Fern Sheets">
      <div class="mark"><i></i><i class="g"></i><i class="g"></i><i></i></div>
      <b>Fern<span>&nbsp;Sheets</span></b>
    </div>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-bold"   title="Bold (Ctrl+B)"><b>B</b></button>
    <button class="tb-btn" id="btn-italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-fill" title="Fill selected cells with this color">
      <span class="sw" id="fill-swatch"></span> Fill
    </button>
    <button class="tb-btn" id="btn-pick" title="Choose fill color">▾</button>
    <input type="color" id="fill-color" value="#fff3b0">
    <button class="tb-btn" id="btn-nofill" title="Remove fill color">No fill</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-clear" title="Clear contents of selected cells (Delete)">Clear</button>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="btn-download" title="Download the active sheet as CSV">Download CSV</button>
    <button class="tb-btn" id="btn-upload" title="Load a CSV file into the active sheet">Upload CSV</button>
    <input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden>
    <div class="hint">Double-click to edit · start with = for formulas · click cells while typing a formula to insert references</div>
  </div>

  <div id="formula-row">
    <div id="name-box">A1</div>
    <div id="fx">fx</div>
    <input id="formula-input" spellcheck="false" autocomplete="off"
           placeholder="Enter a value or a formula, e.g. =SUM(A1:A10)">
  </div>

  <div id="grid-wrap" tabindex="0">
    <table id="grid" aria-label="Spreadsheet grid">
      <colgroup id="cols"></colgroup>
      <thead><tr id="head-row"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>

  <div id="sheet-bar">
    <button id="btn-add-sheet" title="Add sheet">+</button>
    <div id="tabs"></div>
    <div id="stats"></div>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   Constants & helpers
   ========================================================= */
const COLS = 26;            // A..Z (bump this for more columns; AA, AB… are handled)
const ROWS = 100;
const DEFAULT_W = 96;
const HEADER_W  = 46;
const MIN_W     = 40;

function colName(i){
  let s = ""; i += 1;
  while (i > 0){ i -= 1; s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26); }
  return s;
}
function colIndex(letters){
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function refName(c, r){ return colName(c) + (r + 1); }
function refToRC(name){
  const m = /^([A-Z]+)([0-9]+)$/.exec(name);
  if (!m) return null;
  return { c: colIndex(m[1]), r: parseInt(m[2], 10) - 1 };
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function parseNumberStr(s){
  const t = String(s).trim();
  if (t === "") return null;
  if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?%?$/.test(t)) return null;
  if (t.endsWith("%")) return Number(t.slice(0, -1)) / 100;
  const n = Number(t);
  return Number.isFinite(n) ? n : null;
}
function fmtValue(v){
  if (v === "" || v == null) return "";
  if (typeof v === "number"){
    if (!Number.isFinite(v)) return "#NUM!";
    return String(parseFloat(v.toPrecision(12)));
  }
  return String(v);
}
function isErr(v){ return typeof v === "string" && v.charCodeAt(0) === 35; } /* '#' */

/* =========================================================
   Formula engine
   ========================================================= */
function lex(src){
  const toks = []; let i = 0;
  while (i < src.length){
    const ch = src[i];
    if (ch === " " || ch === "\t"){ i++; continue; }
    if ((ch >= "0" && ch <= "9") || (ch === "." && /\d/.test(src[i+1] || ""))){
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j++;
      if (src[j] === "e" || src[j] === "E"){
        let k = j + 1;
        if (src[k] === "+" || src[k] === "-") k++;
        if (/\d/.test(src[k] || "")){ while (/\d/.test(src[k] || "")) k++; j = k; }
      }
      const n = Number(src.slice(i, j));
      if (!Number.isFinite(n)) throw { code: "#VALUE!" };
      toks.push({ t: "num", v: n }); i = j; continue;
    }
    if (/[A-Za-z_$]/.test(ch)){
      let j = i;
      while (j < src.length && /[A-Za-z0-9_.$]/.test(src[j])) j++;
      toks.push({ t: "id", v: src.slice(i, j).toUpperCase().replace(/\$/g, "") });
      i = j; continue;
    }
    if (ch === '"'){
      let j = i + 1, s = "";
      let closed = false;
      while (j < src.length){
        if (src[j] === '"'){
          if (src[j+1] === '"'){ s += '"'; j += 2; }
          else { j++; closed = true; break; }
        } else { s += src[j]; j++; }
      }
      if (!closed) throw { code: "#VALUE!" };
      toks.push({ t: "str", v: s }); i = j; continue;
    }
    if ("+-*/^(),:&".includes(ch)){ toks.push({ t: "op", v: ch }); i++; continue; }
    throw { code: "#VALUE!" };
  }
  return toks;
}

const REF_RE = /^[A-Z]{1,3}[0-9]{1,7}$/;

function evalFormula(src, getVal){
  try{
    const toks = lex(src);
    let pos = 0;
    const peek = () => toks[pos] || null;
    const isOp = v => { const t = peek(); return !!t && t.t === "op" && t.v === v; };
    const fail = c => { throw { code: c }; };

    function toNum(v){
      if (typeof v === "number") return v;
      if (v === "" || v == null) return 0;
      if (typeof v === "string"){
        if (isErr(v)) fail(v);
        const n = parseNumberStr(v);
        if (n === null) fail("#VALUE!");
        return n;
      }
      fail("#VALUE!");
    }
    function toText(v){
      if (v == null || v === "") return "";
      if (isErr(v)) fail(v);
      return typeof v === "number" ? fmtValue(v) : String(v);
    }
    function cellVal(name){
      const v = getVal(name);
      if (isErr(v)) fail(v);
      return v;
    }
    function rangeKeys(a, b){
      const A = refToRC(a), B = refToRC(b);
      if (!A || !B) fail("#REF!");
      const c1 = Math.min(A.c, B.c), c2 = Math.max(A.c, B.c);
      const r1 = Math.min(A.r, B.r), r2 = Math.max(A.r, B.r);
      if ((c2 - c1 + 1) * (r2 - r1 + 1) > 20000) fail("#REF!");
      const out = [];
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++) out.push(refName(c, r));
      return out;
    }

    function parseArg(){
      const t = peek();
      if (t && t.t === "id" && REF_RE.test(t.v) &&
          toks[pos+1] && toks[pos+1].t === "op" && toks[pos+1].v === ":"){
        const b = toks[pos+2];
        if (!b || b.t !== "id" || !REF_RE.test(b.v)) fail("#REF!");
        const keys = rangeKeys(t.v, b.v);
        pos += 3;
        return { range: keys };
      }
      return { value: parseExpr() };
    }

    function applyFn(name, args){
      const nums = []; let nonEmpty = 0;
      const scalars = [];
      for (const a of args){
        if (a.range){
          for (const k of a.range){
            const v = cellVal(k);
            if (typeof v === "number") nums.push(v);
            if (v !== "" && v != null) nonEmpty++;
          }
        } else {
          scalars.push(a.value);
          if (a.value !== "" && a.value != null){
            nonEmpty++;
            const n = (typeof a.value === "number") ? a.value : parseNumberStr(a.value);
            if (n !== null && typeof a.value !== "boolean") nums.push(typeof a.value === "number" ? a.value : n);
          }
        }
      }
      switch (name){
        case "SUM":     return nums.reduce((s, x) => s + x, 0);
        case "AVERAGE": if (!nums.length) fail("#DIV/0!");
                        return nums.reduce((s, x) => s + x, 0) / nums.length;
        case "MIN":     return nums.length ? Math.min(...nums) : 0;
        case "MAX":     return nums.length ? Math.max(...nums) : 0;
        case "COUNT":   return nums.length;
        case "COUNTA":  return nonEmpty;
        case "ABS":     if (scalars.length !== 1) fail("#VALUE!"); return Math.abs(toNum(scalars[0]));
        case "SQRT": {  if (scalars.length !== 1) fail("#VALUE!");
                        const x = toNum(scalars[0]); if (x < 0) fail("#NUM!"); return Math.sqrt(x); }
        case "ROUND": { if (!scalars.length || scalars.length > 2) fail("#VALUE!");
                        const x = toNum(scalars[0]);
                        const d = scalars.length === 2 ? Math.trunc(toNum(scalars[1])) : 0;
                        const f = Math.pow(10, d); return Math.round(x * f) / f; }
        default:        fail("#NAME?");
      }
    }

    function parsePrimary(){
      const t = peek();
      if (!t) fail("#VALUE!");
      if (t.t === "num"){ pos++; return t.v; }
      if (t.t === "str"){ pos++; return t.v; }
      if (t.t === "op" && t.v === "("){
        pos++;
        const v = parseExpr();
        if (!isOp(")")) fail("#VALUE!");
        pos++; return v;
      }
      if (t.t === "op" && (t.v === "-" || t.v === "+")){
        pos++;
        const v = toNum(parsePrimary());
        return t.v === "-" ? -v : v;
      }
      if (t.t === "id"){
        const name = t.v;
        if (toks[pos+1] && toks[pos+1].t === "op" && toks[pos+1].v === "("){
          pos += 2;
          const args = [];
          if (!isOp(")")){
            args.push(parseArg());
            while (isOp(",")){ pos++; args.push(parseArg()); }
          }
          if (!isOp(")")) fail("#VALUE!");
          pos++;
          return applyFn(name, args);
        }
        if (REF_RE.test(name)){
          pos++;
          if (isOp(":")) fail("#VALUE!");   // bare range outside a function
          return cellVal(name);
        }
        if (name === "TRUE"){ pos++; return 1; }
        if (name === "FALSE"){ pos++; return 0; }
        fail("#NAME?");
      }
      fail("#VALUE!");
    }
    function parsePow(){
      let v = parsePrimary();
      while (isOp("^")){ pos++; v = Math.pow(toNum(v), toNum(parsePrimary())); }
      return v;
    }
    function parseTerm(){
      let v = parsePow();
      while (isOp("*") || isOp("/")){
        const op = peek().v; pos++;
        const b = toNum(parsePow()), a = toNum(v);
        if (op === "/"){ if (b === 0) fail("#DIV/0!"); v = a / b; }
        else v = a * b;
      }
      return v;
    }
    function parseAdd(){
      let v = parseTerm();
      while (isOp("+") || isOp("-")){
        const op = peek().v; pos++;
        const b = parseTerm();
        v = op === "+" ? toNum(v) + toNum(b) : toNum(v) - toNum(b);
      }
      return v;
    }
    function parseExpr(){
      let v = parseAdd();
      while (isOp("&")){ pos++; v = toText(v) + toText(parseAdd()); }
      return v;
    }

    const result = parseExpr();
    if (pos < toks.length) fail("#VALUE!");
    if (typeof result === "number" && !Number.isFinite(result)) return "#NUM!";
    return result;
  } catch (e){
    return (e && e.code) ? e.code : "#VALUE!";
  }
}

/* Recalculate every cell of a sheet. Formulas pull their dependencies
   on demand, with a "busy" set for cycle detection. */
function recalcSheet(sheet){
  const vals = Object.create(null);
  const busy = new Set();
  function val(key){
    if (key in vals) return vals[key];
    if (busy.has(key)) return "#CYCLE!";
    const cell = sheet.cells[key];
    if (!cell || cell.raw == null || cell.raw === ""){ vals[key] = ""; return ""; }
    let v;
    if (cell.raw.charCodeAt(0) === 61){ /* '=' */
      busy.add(key);
      v = evalFormula(cell.raw.slice(1), val);
      busy.delete(key);
    } else {
      const n = parseNumberStr(cell.raw);
      v = n !== null ? n : cell.raw;
    }
    vals[key] = v;
    return v;
  }
  for (const k in sheet.cells) val(k);
  return vals;
}

/* =========================================================
   State
   ========================================================= */
function newSheet(name){ return { name, cells: {}, widths: {} }; }

const sheets = [newSheet("Sheet1")];
let active = 0;

let sel = { a: { c: 0, r: 0 }, f: { c: 0, r: 0 } };   // anchor & focus
let values = {};                                      // computed values, active sheet
let renderedKeys = new Set();                         // keys currently painted
let selTds = [];                                      // tds tinted by selection
let hlTds = [];                                       // tds tinted by formula-ref highlight

let edit = null;      // { c, r, cellInput, src:'cell'|'bar', refTok:{start,end}|null }
let dragSel = false;  // selecting with mouse
let refDrag = null;   // { anchor:{c,r} } while picking a range for a formula
let colDrag = null;   // { c, startX, startW }

const tds = [];       // tds[r][c]
const colEls = [];    // <col> per data column
const headThs = [];   // header th per column
const rowThs = [];    // row-number th per row

/* DOM refs */
const $ = id => document.getElementById(id);
const gridWrap = $("grid-wrap"), tbody = $("body"), headRow = $("head-row"), colsEl = $("cols");
const nameBox = $("name-box"), formulaInput = $("formula-input");
const tabsEl = $("tabs"), statsEl = $("stats");
const fillColor = $("fill-color"), fillSwatch = $("fill-swatch");

function sheet(){ return sheets[active]; }
function getCell(key){
  let c = sheet().cells[key];
  if (!c){ c = { raw: "", bold: false, italic: false, bg: "" }; sheet().cells[key] = c; }
  return c;
}
function setCellRaw(key, raw){
  if (raw === ""){
    const c = sheet().cells[key];
    if (c){
      c.raw = "";
      if (!c.bold && !c.italic && !c.bg) delete sheet().cells[key];
    }
  } else {
    getCell(key).raw = raw;
  }
}

/* =========================================================
   Grid construction
   ========================================================= */
function buildGrid(){
  const cH = document.createElement("col");
  cH.style.width = HEADER_W + "px";
  colsEl.appendChild(cH);
  for (let c = 0; c < COLS; c++){
    const col = document.createElement("col");
    col.style.width = DEFAULT_W + "px";
    colsEl.appendChild(col);
    colEls.push(col);
  }

  const corner = document.createElement("th");
  corner.className = "corner";
  headRow.appendChild(corner);
  for (let c = 0; c < COLS; c++){
    const th = document.createElement("th");
    th.textContent = colName(c);
    th.dataset.c = c;
    const rz = document.createElement("div");
    rz.className = "rz";
    rz.dataset.c = c;
    th.appendChild(rz);
    headRow.appendChild(th);
    headThs.push(th);
  }

  const frag = document.createDocumentFragment();
  for (let r = 0; r < ROWS; r++){
    const tr = document.createElement("tr");
    const th = document.createElement("th");
    th.textContent = r + 1;
    tr.appendChild(th);
    rowThs.push(th);
    const row = [];
    for (let c = 0; c < COLS; c++){
      const td = document.createElement("td");
      td.className = "cell";
      td.dataset.c = c;
      td.dataset.r = r;
      tr.appendChild(td);
      row.push(td);
    }
    tds.push(row);
    frag.appendChild(tr);
  }
  tbody.appendChild(frag);
}

/* =========================================================
   Rendering
   ========================================================= */
function applyWidths(){
  for (let c = 0; c < COLS; c++){
    const w = sheet().widths[c] || DEFAULT_W;
    colEls[c].style.width = w + "px";
  }
}

function paintCell(key){
  const rc = refToRC(key);
  if (!rc || rc.c >= COLS || rc.r >= ROWS) return;
  const td = tds[rc.r][rc.c];
  const cell = sheet().cells[key];
  const v = values[key];
  if (!edit || edit.c !== rc.c || edit.r !== rc.r){
    td.textContent = fmtValue(v);
  }
  td.classList.toggle("num", typeof v === "number");
  td.classList.toggle("err", isErr(v));
  td.style.fontWeight = cell && cell.bold ? "700" : "";
  td.style.fontStyle  = cell && cell.italic ? "italic" : "";
  td.style.backgroundColor = cell && cell.bg ? cell.bg : "";
}

function recalcAndPaint(){
  values = recalcSheet(sheet());
  const keys = new Set(renderedKeys);
  for (const k in sheet().cells) keys.add(k);
  for (const k of keys) paintCell(k);
  renderedKeys = new Set(Object.keys(sheet().cells));
  updateFormulaBar();
  updateStats();
}

function selRect(){
  return {
    c1: Math.min(sel.a.c, sel.f.c), c2: Math.max(sel.a.c, sel.f.c),
    r1: Math.min(sel.a.r, sel.f.r), r2: Math.max(sel.a.r, sel.f.r)
  };
}
function selRangeName(){
  const { c1, c2, r1, r2 } = selRect();
  return (c1 === c2 && r1 === r2)
    ? refName(sel.a.c, sel.a.r)
    : refName(c1, r1) + ":" + refName(c2, r2);
}

function paintSelection(){
  for (const td of selTds) td.classList.remove("in-sel", "active");
  selTds = [];
  for (const th of headThs) th.classList.remove("hl");
  for (const th of rowThs)  th.classList.remove("hl");

  const { c1, c2, r1, r2 } = selRect();
  for (let r = r1; r <= r2; r++){
    rowThs[r].classList.add("hl");
    for (let c = c1; c <= c2; c++){
      const td = tds[r][c];
      td.classList.add("in-sel");
      selTds.push(td);
    }
  }
  for (let c = c1; c <= c2; c++) headThs[c].classList.add("hl");
  const a = tds[sel.a.r][sel.a.c];
  a.classList.add("active");

  nameBox.textContent = selRangeName();
  updateToolbarState();
  updateStats();
  if (!edit) updateFormulaBar();
}

function updateFormulaBar(){
  if (edit) return; // the editor owns the bar while editing
  const cell = sheet().cells[refName(sel.a.c, sel.a.r)];
  formulaInput.value = cell ? cell.raw : "";
}

function updateToolbarState(){
  const cell = sheet().cells[refName(sel.a.c, sel.a.r)];
  $("btn-bold").classList.toggle("on", !!(cell && cell.bold));
  $("btn-italic").classList.toggle("on", !!(cell && cell.italic));
}

function updateStats(){
  const { c1, c2, r1, r2 } = selRect();
  if (c1 === c2 && r1 === r2){ statsEl.textContent = ""; return; }
  let sum = 0, n = 0, filled = 0;
  for (let r = r1; r <= r2; r++){
    for (let c = c1; c <= c2; c++){
      const v = values[refName(c, r)];
      if (v !== "" && v != null) filled++;
      if (typeof v === "number"){ sum += v; n++; }
    }
  }
  statsEl.innerHTML = n
    ? `Sum: <b>${fmtValue(sum)}</b> &nbsp; Avg: <b>${fmtValue(sum / n)}</b> &nbsp; Count: <b>${filled}</b>`
    : (filled ? `Count: <b>${filled}</b>` : "");
}

/* Colored outlines on cells referenced by the formula being edited */
function clearRefHighlights(){
  for (const td of hlTds) td.classList.remove("rhl0", "rhl1", "rhl2", "rhl3");
  hlTds = [];
}
function updateRefHighlights(){
  clearRefHighlights();
  if (!edit) return;
  const text = edit.cellInput.value;
  if (text.charCodeAt(0) !== 61) return;
  const re = /([A-Z]{1,3}[0-9]{1,7})(?::([A-Z]{1,3}[0-9]{1,7}))?/g;
  let m, idx = 0;
  const up = text.toUpperCase();
  while ((m = re.exec(up)) && idx < 8){
    const A = refToRC(m[1]);
    const B = m[2] ? refToRC(m[2]) : A;
    if (!A || !B){ continue; }
    const c1 = Math.max(0, Math.min(A.c, B.c)), c2 = Math.min(COLS - 1, Math.max(A.c, B.c));
    const r1 = Math.max(0, Math.min(A.r, B.r)), r2 = Math.min(ROWS - 1, Math.max(A.r, B.r));
    if ((c2 - c1 + 1) * (r2 - r1 + 1) > 2000){ idx++; continue; }
    const cls = "rhl" + (idx % 4);
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++){
        const td = tds[r][c];
        td.classList.add(cls);
        hlTds.push(td);
      }
    idx++;
  }
}

/* =========================================================
   Editing
   ========================================================= */
function startEdit(c, r, initial, viaBar){
  if (edit) commitEdit(null);
  sel.a = { c, r }; sel.f = { c, r };
  paintSelection();

  const td = tds[r][c];
  const key = refName(c, r);
  const cell = sheet().cells[key];
  const text = initial != null ? initial : (cell ? cell.raw : "");

  td.textContent = "";
  const input = document.createElement("input");
  input.className = "cell-editor";
  input.value = text;
  input.spellcheck = false;
  td.appendChild(input);

  edit = { c, r, cellInput: input, src: viaBar ? "bar" : "cell", refTok: null };
  formulaInput.value = text;

  if (!viaBar){
    input.focus();
    input.setSelectionRange(text.length, text.length);
  }

  input.addEventListener("input", () => {
    formulaInput.value = input.value;
    edit.refTok = null;
    updateRefHighlights();
  });
  input.addEventListener("focus", () => { if (edit) edit.src = "cell"; });
  input.addEventListener("keydown", editorKeydown);
  input.addEventListener("blur", e => {
    if (!edit || refDrag) return;
    if (e.relatedTarget === formulaInput) return;
    commitEdit(null);
  });
  updateRefHighlights();
}

function activeEditor(){
  if (!edit) return null;
  return edit.src === "bar" ? formulaInput : edit.cellInput;
}

function teardownEditor(){
  if (!edit) return;
  const { c, r, cellInput } = edit;
  cellInput.remove();
  edit = null;
  clearRefHighlights();
  paintCell(refName(c, r));
}

function commitEdit(move){
  if (!edit) return;
  const { c, r } = edit;
  const raw = edit.cellInput.value;
  teardownEditor();
  setCellRaw(refName(c, r), raw);
  recalcAndPaint();
  if (move) moveSel(move.dc, move.dr, false);
  gridWrap.focus();
}

function cancelEdit(){
  if (!edit) return;
  teardownEditor();
  updateFormulaBar();
  gridWrap.focus();
}

function editorKeydown(e){
  if (!edit) return;
  if (e.key === "Enter"){
    e.preventDefault();
    commitEdit({ dc: 0, dr: e.shiftKey ? -1 : 1 });
  } else if (e.key === "Tab"){
    e.preventDefault();
    commitEdit({ dc: e.shiftKey ? -1 : 1, dr: 0 });
  } else if (e.key === "Escape"){
    e.preventDefault();
    cancelEdit();
  }
}

/* Should a click on the grid insert a cell reference into the formula? */
function wantsRef(){
  const inp = activeEditor();
  if (!inp) return false;
  const text = inp.value;
  if (text.charCodeAt(0) !== 61) return false;   // not a formula
  const caret = inp.selectionStart;
  if (edit.refTok && caret >= edit.refTok.start && caret <= edit.refTok.end) return true;
  let i = caret - 1;
  while (i >= 0 && text[i] === " ") i--;
  if (i < 0) return false;
  return "=+-*/^(,:&".includes(text[i]);
}

function insertRefText(refText){
  const inp = activeEditor();
  let s, epos;
  if (edit.refTok){ s = edit.refTok.start; epos = edit.refTok.end; }
  else { s = inp.selectionStart; epos = inp.selectionEnd; }
  const v = inp.value;
  inp.value = v.slice(0, s) + refText + v.slice(epos);
  edit.refTok = { start: s, end: s + refText.length };
  inp.setSelectionRange(edit.refTok.end, edit.refTok.end);
  // mirror to the other input
  if (inp === formulaInput) edit.cellInput.value = inp.value;
  else formulaInput.value = inp.value;
  updateRefHighlights();
}

function refDragUpdate(c, r){
  const a = refDrag.anchor;
  const text = (a.c === c && a.r === r)
    ? refName(c, r)
    : refName(Math.min(a.c, c), Math.min(a.r, r)) + ":" +
      refName(Math.max(a.c, c), Math.max(a.r, r));
  insertRefText(text);
  nameBox.textContent = text;
}

/* =========================================================
   Selection & keyboard
   ========================================================= */
function moveSel(dc, dr, extend){
  if (extend){
    sel.f = { c: clamp(sel.f.c + dc, 0, COLS - 1), r: clamp(sel.f.r + dr, 0, ROWS - 1) };
  } else {
    sel.a = { c: clamp(sel.a.c + dc, 0, COLS - 1), r: clamp(sel.a.r + dr, 0, ROWS - 1) };
    sel.f = { ...sel.a };
  }
  paintSelection();
  const t = extend ? sel.f : sel.a;
  tds[t.r][t.c].scrollIntoView({ block: "nearest", inline: "nearest" });
}

function clearSelectionContents(){
  const { c1, c2, r1, r2 } = selRect();
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) setCellRaw(refName(c, r), "");
  recalcAndPaint();
}

function applyStyle(fn){
  const { c1, c2, r1, r2 } = selRect();
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++){
      const key = refName(c, r);
      fn(getCell(key));
      const cc = sheet().cells[key];
      if (cc && cc.raw === "" && !cc.bold && !cc.italic && !cc.bg) delete sheet().cells[key];
    }
  recalcAndPaint();
  paintSelection();
}

/* =========================================================
   Sheets
   ========================================================= */
function renderTabs(){
  tabsEl.innerHTML = "";
  sheets.forEach((s, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === active ? " on" : "");
    const name = document.createElement("span");
    name.textContent = s.name;
    tab.appendChild(name);
    if (sheets.length > 1){
      const x = document.createElement("span");
      x.className = "x";
      x.textContent = "×";
      x.title = "Delete sheet";
      x.addEventListener("click", ev => {
        ev.stopPropagation();
        if (confirm(`Delete "${s.name}"? This cannot be undone.`)) deleteSheet(i);
      });
      tab.appendChild(x);
    }
    tab.addEventListener("click", () => { if (i !== active) switchSheet(i); });
    tab.addEventListener("dblclick", () => renameSheet(i, tab, name));
    tabsEl.appendChild(tab);
  });
}

function renameSheet(i, tab, nameSpan){
  const input = document.createElement("input");
  input.value = sheets[i].name;
  tab.replaceChild(input, nameSpan);
  input.focus(); input.select();
  const done = commitName => {
    if (commitName){
      let n = input.value.trim();
      if (n){
        let final = n, k = 2;
        while (sheets.some((s, j) => j !== i && s.name === final)) final = `${n} (${k++})`;
        sheets[i].name = final;
      }
    }
    renderTabs();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") done(true);
    else if (e.key === "Escape") done(false);
    e.stopPropagation();
  });
  input.addEventListener("blur", () => done(true));
}

function addSheet(){
  if (edit) commitEdit(null);
  let n = sheets.length + 1, name = "Sheet" + n;
  while (sheets.some(s => s.name === name)) name = "Sheet" + (++n);
  sheets.push(newSheet(name));
  switchSheet(sheets.length - 1);
}

function deleteSheet(i){
  if (sheets.length <= 1) return;
  if (edit) cancelEdit();
  sheets.splice(i, 1);
  if (active >= sheets.length) active = sheets.length - 1;
  else if (i < active) active--;
  switchSheet(active, true);
}

function switchSheet(i, force){
  if (edit) commitEdit(null);
  if (i === active && !force){ renderTabs(); return; }
  // wipe paint from the previous sheet
  for (const k of renderedKeys){
    const rc = refToRC(k);
    if (rc && rc.c < COLS && rc.r < ROWS){
      const td = tds[rc.r][rc.c];
      td.textContent = "";
      td.className = "cell";
      td.style.cssText = "";
    }
  }
  renderedKeys = new Set();
  active = i;
  sel = { a: { c: 0, r: 0 }, f: { c: 0, r: 0 } };
  applyWidths();
  recalcAndPaint();
  paintSelection();
  renderTabs();
  gridWrap.scrollTop = 0; gridWrap.scrollLeft = 0;
}

/* =========================================================
   CSV
   ========================================================= */
function usedBounds(){
  let mc = -1, mr = -1;
  for (const k in sheet().cells){
    const cell = sheet().cells[k];
    if (!cell.raw) continue;
    const rc = refToRC(k);
    if (rc){ mc = Math.max(mc, rc.c); mr = Math.max(mr, rc.r); }
  }
  return { mc, mr };
}

function downloadCSV(){
  if (edit) commitEdit(null);
  const { mc, mr } = usedBounds();
  const rows = [];
  for (let r = 0; r <= mr; r++){
    const cols = [];
    for (let c = 0; c <= mc; c++){
      let s = fmtValue(values[refName(c, r)]);
      if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
      cols.push(s);
    }
    rows.push(cols.join(","));
  }
  const blob = new Blob([rows.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = sheet().name.replace(/[\\/:*?"<>|]/g, "_") + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function parseCSV(text){
  const rows = [[]];
  let field = "", inQ = false, i = 0;
  const pushF = () => { rows[rows.length - 1].push(field); field = ""; };
  while (i < text.length){
    const ch = text[i];
    if (inQ){
      if (ch === '"'){
        if (text[i+1] === '"'){ field += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      field += ch; i++; continue;
    }
    if (ch === '"'){ inQ = true; i++; continue; }
    if (ch === ","){ pushF(); i++; continue; }
    if (ch === "\r"){ if (text[i+1] === "\n") i++; pushF(); rows.push([]); i++; continue; }
    if (ch === "\n"){ pushF(); rows.push([]); i++; continue; }
    field += ch; i++;
  }
  pushF();
  while (rows.length && rows[rows.length - 1].every(f => f === "")) rows.pop();
  return rows;
}

function loadCSV(text){
  if (edit) cancelEdit();
  const rows = parseCSV(text);
  const s = sheet();
  // clear painted cells, then replace contents
  for (const k of renderedKeys){
    const rc = refToRC(k);
    if (rc && rc.c < COLS && rc.r < ROWS){
      const td = tds[rc.r][rc.c];
      td.textContent = ""; td.className = "cell"; td.style.cssText = "";
    }
  }
  renderedKeys = new Set();
  s.cells = {};
  const nr = Math.min(rows.length, ROWS);
  for (let r = 0; r < nr; r++){
    const nc = Math.min(rows[r].length, COLS);
    for (let c = 0; c < nc; c++){
      if (rows[r][c] !== "") getCell(refName(c, r)).raw = rows[r][c];
    }
  }
  if (rows.length > ROWS || rows.some(rw => rw.length > COLS)){
    alert(`Note: the file was larger than the ${COLS}×${ROWS} grid, so extra rows/columns were skipped.`);
  }
  recalcAndPaint();
  paintSelection();
}

/* =========================================================
   Events
   ========================================================= */
function tdFromEvent(e){
  const td = e.target.closest && e.target.closest("td.cell");
  return (td && tbody.contains(td)) ? td : null;
}

gridWrap.addEventListener("mousedown", e => {
  // column resize
  const rz = e.target.closest && e.target.closest(".rz");
  if (rz){
    e.preventDefault();
    const c = +rz.dataset.c;
    colDrag = { c, startX: e.clientX, startW: sheet().widths[c] || DEFAULT_W };
    return;
  }
  const td = tdFromEvent(e);
  if (!td) return;
  const c = +td.dataset.c, r = +td.dataset.r;

  // picking references for a formula being edited
  if (edit && wantsRef()){
    e.preventDefault();
    refDrag = { anchor: { c, r } };
    refDragUpdate(c, r);
    return;
  }
  if (edit) commitEdit(null);

  e.preventDefault();
  if (e.shiftKey){
    sel.f = { c, r };
  } else {
    sel.a = { c, r }; sel.f = { c, r };
  }
  dragSel = true;
  paintSelection();
  gridWrap.focus();
});

gridWrap.addEventListener("dblclick", e => {
  const td = tdFromEvent(e);
  if (!td) return;
  startEdit(+td.dataset.c, +td.dataset.r, null, false);
});

document.addEventListener("mousemove", e => {
  if (colDrag){
    const w = Math.max(MIN_W, colDrag.startW + (e.clientX - colDrag.startX));
    sheet().widths[colDrag.c] = w;
    colEls[colDrag.c].style.width = w + "px";
    return;
  }
  if (!dragSel && !refDrag) return;
  const td = tdFromEvent(e);
  if (!td) return;
  const c = +td.dataset.c, r = +td.dataset.r;
  if (refDrag){ refDragUpdate(c, r); return; }
  if (sel.f.c !== c || sel.f.r !== r){
    sel.f = { c, r };
    paintSelection();
  }
});

document.addEventListener("mouseup", () => {
  if (colDrag){ colDrag = null; return; }
  if (refDrag){
    refDrag = null;
    const inp = activeEditor();
    if (inp) inp.focus();
    nameBox.textContent = edit ? refName(edit.c, edit.r) : selRangeName();
    return;
  }
  dragSel = false;
});

/* Keyboard on the grid */
document.addEventListener("keydown", e => {
  if (edit) return; // editors handle their own keys
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;

  const arrows = { ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0] };
  if (arrows[e.key]){
    e.preventDefault();
    const [dc, dr] = arrows[e.key];
    moveSel(dc, dr, e.shiftKey);
    return;
  }
  if (e.key === "Enter"){ e.preventDefault(); moveSel(0, e.shiftKey ? -1 : 1, false); return; }
  if (e.key === "Tab"){ e.preventDefault(); moveSel(e.shiftKey ? -1 : 1, 0, false); return; }
  if (e.key === "Delete" || e.key === "Backspace"){ e.preventDefault(); clearSelectionContents(); return; }
  if (e.key === "F2"){ e.preventDefault(); startEdit(sel.a.c, sel.a.r, null, false); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === "b" || e.key === "B")){
    e.preventDefault(); toggleBold(); return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === "i" || e.key === "I")){
    e.preventDefault(); toggleItalic(); return;
  }
  if (e.key === "Escape") return;
  // start typing → begin editing with the typed character
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey){
    e.preventDefault();
    startEdit(sel.a.c, sel.a.r, e.key, false);
  }
});

/* Formula bar */
formulaInput.addEventListener("focus", () => {
  if (edit){ edit.src = "bar"; return; }
  startEdit(sel.a.c, sel.a.r, null, true);
  edit.src = "bar";
});
formulaInput.addEventListener("input", () => {
  if (!edit) return;
  edit.cellInput.value = formulaInput.value;
  edit.refTok = null;
  updateRefHighlights();
});
formulaInput.addEventListener("keydown", e => {
  if (!edit) return;
  editorKeydown(e);
});
formulaInput.addEventListener("blur", e => {
  if (!edit || refDrag) return;
  if (edit.src !== "bar") return;
  if (e.relatedTarget === edit.cellInput) return;
  commitEdit(null);
});

/* Toolbar */
function toggleBold(){
  const key = refName(sel.a.c, sel.a.r);
  const cur = sheet().cells[key];
  const on = !(cur && cur.bold);
  applyStyle(c => { c.bold = on; });
}
function toggleItalic(){
  const key = refName(sel.a.c, sel.a.r);
  const cur = sheet().cells[key];
  const on = !(cur && cur.italic);
  applyStyle(c => { c.italic = on; });
}
$("btn-bold").addEventListener("click", toggleBold);
$("btn-italic").addEventListener("click", toggleItalic);
$("btn-fill").addEventListener("click", () => applyStyle(c => { c.bg = fillColor.value; }));
$("btn-pick").addEventListener("click", () => fillColor.click());
fillColor.addEventListener("input", () => {
  fillSwatch.style.background = fillColor.value;
});
fillColor.addEventListener("change", () => {
  fillSwatch.style.background = fillColor.value;
  applyStyle(c => { c.bg = fillColor.value; });
});
$("btn-nofill").addEventListener("click", () => applyStyle(c => { c.bg = ""; }));
$("btn-clear").addEventListener("click", () => { if (edit) cancelEdit(); clearSelectionContents(); });
$("btn-download").addEventListener("click", downloadCSV);
$("btn-upload").addEventListener("click", () => $("file-csv").click());
$("file-csv").addEventListener("change", e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => loadCSV(String(fr.result));
  fr.readAsText(f);
  e.target.value = "";
});
$("btn-add-sheet").addEventListener("click", addSheet);

/* Keep toolbar clicks from stealing focus mid-edit in a jarring way:
   commit happens via the editor's blur handler, which runs first. */

/* =========================================================
   Boot
   ========================================================= */
function seedDemo(){
  const s = sheets[0];
  const put = (k, raw, extra) => { s.cells[k] = Object.assign({ raw, bold:false, italic:false, bg:"" }, extra); };
  put("A1", "Item",  { bold: true, bg: "#e4f3ed" });
  put("B1", "Qty",   { bold: true, bg: "#e4f3ed" });
  put("C1", "Price", { bold: true, bg: "#e4f3ed" });
  put("D1", "Total", { bold: true, bg: "#e4f3ed" });
  put("A2", "Seeds");      put("B2", "12"); put("C2", "2.5");  put("D2", "=B2*C2");
  put("A3", "Pots");       put("B3", "8");  put("C3", "4");    put("D3", "=B3*C3");
  put("A4", "Soil (kg)");  put("B4", "20"); put("C4", "1.25"); put("D4", "=B4*C4");
  put("A6", "Total", { bold: true });
  put("D6", "=SUM(D2:D4)", { bold: true });
  put("A8", "Average price"); put("D8", "=AVERAGE(C2:C4)");
}

buildGrid();
seedDemo();
fillSwatch.style.background = fillColor.value;
applyWidths();
recalcAndPaint();
paintSelection();
renderTabs();
gridWrap.focus();
</script>
