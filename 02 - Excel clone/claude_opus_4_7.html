<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sheet — a spreadsheet</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --accent: #137b43;
  --accent-dark: #0e5c32;
  --accent-tint: rgba(19, 123, 67, 0.08);
  --accent-tint-strong: rgba(19, 123, 67, 0.18);

  --bg: #fafaf9;
  --panel: #ffffff;
  --panel-alt: #f4f3f1;
  --toolbar: #f7f6f4;
  --border: #d6d3cf;
  --border-soft: #e6e3df;
  --hover: #ecebe8;

  --text: #1d1d1b;
  --text-muted: #5e5c57;
  --text-faint: #8a8882;

  --header-bg: #f2f1ee;
  --header-bg-active: #e3e0d8;

  --cell-bg: #ffffff;
  --cell-bg-range: rgba(19, 123, 67, 0.07);

  --error: #b3261e;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);

  --font-ui: "Segoe UI", "SF Pro Text", -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
  --font-cell: "Segoe UI", "SF Pro Text", -apple-system, BlinkMacSystemFont, Helvetica, sans-serif;
  --font-num: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-ui);
  font-size: 13px;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ============================================================
   TOP BAR (title + toolbar)
   ============================================================ */
#topbar {
  display: flex;
  align-items: center;
  padding: 6px 12px;
  background: var(--toolbar);
  border-bottom: 1px solid var(--border-soft);
  gap: 6px;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 4px;
  border-right: 1px solid var(--border-soft);
  margin-right: 8px;
  height: 28px;
}
.brand-mark {
  width: 22px; height: 22px;
  background: var(--accent);
  border-radius: 4px;
  display: grid;
  place-items: center;
  color: white;
  font-weight: 700;
  font-size: 12px;
  font-family: var(--font-num);
  letter-spacing: -0.02em;
}
.brand-name {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
}

.tool {
  height: 28px;
  min-width: 28px;
  padding: 0 8px;
  border: 1px solid transparent;
  border-radius: 4px;
  background: transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font: inherit;
  color: var(--text);
  transition: background 90ms ease, border-color 90ms ease;
}
.tool:hover { background: var(--hover); }
.tool:active { background: #dedcd7; }
.tool.active { background: var(--accent-tint); border-color: var(--accent-tint-strong); color: var(--accent-dark); }
.tool svg { width: 14px; height: 14px; }
.tool .label { font-size: 12px; }

.tool-bold { font-weight: 700; font-size: 14px; }
.tool-italic { font-style: italic; font-size: 14px; font-family: "Georgia", serif; }

.sep {
  width: 1px;
  height: 20px;
  background: var(--border-soft);
  margin: 0 4px;
}

.color-swatch {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 0 4px 0 8px;
  border-radius: 4px;
}
.color-swatch:hover { background: var(--hover); }
.color-swatch label {
  cursor: pointer;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.color-swatch .swatch-chip {
  width: 16px; height: 16px;
  border: 1px solid var(--border);
  border-radius: 3px;
  background: #ffff00;
}
.color-swatch input[type=color] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.color-swatch .caret { color: var(--text-muted); font-size: 10px; margin-left: 2px; }

.spacer { flex: 1; }

/* ============================================================
   FORMULA BAR
   ============================================================ */
#formula-bar {
  display: flex;
  align-items: stretch;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  height: 30px;
  flex-shrink: 0;
}
#name-box {
  width: 120px;
  min-width: 120px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-right: 1px solid var(--border-soft);
  font-family: var(--font-num);
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
  letter-spacing: 0.02em;
}
#fx-label {
  width: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-style: italic;
  font-family: "Georgia", serif;
  font-size: 14px;
  border-right: 1px solid var(--border-soft);
}
#formula-input {
  flex: 1;
  border: none;
  outline: none;
  padding: 0 12px;
  font-family: var(--font-cell);
  font-size: 13px;
  color: var(--text);
  background: transparent;
  user-select: text;
}
#formula-input:focus { background: #fffef8; }

/* ============================================================
   GRID
   ============================================================ */
#grid-wrap {
  flex: 1;
  overflow: auto;
  background: var(--panel);
  position: relative;
}
#grid {
  border-collapse: separate;
  border-spacing: 0;
  table-layout: fixed;
  background: var(--panel);
}
#grid th, #grid td {
  border-right: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  padding: 0 6px;
  height: 22px;
  font-size: 13px;
  font-family: var(--font-cell);
  color: var(--text);
  vertical-align: middle;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
  box-sizing: border-box;
}

#grid thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--header-bg);
  color: var(--text-muted);
  font-weight: 500;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.02em;
  height: 24px;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
#grid thead th.col-active {
  background: var(--header-bg-active);
  color: var(--text);
  font-weight: 600;
}
#grid tbody th {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--header-bg);
  color: var(--text-muted);
  text-align: center;
  font-weight: 500;
  font-size: 11px;
  width: 44px;
  min-width: 44px;
  max-width: 44px;
  letter-spacing: 0.02em;
  border-right: 1px solid var(--border);
  user-select: none;
}
#grid tbody th.row-active {
  background: var(--header-bg-active);
  color: var(--text);
  font-weight: 600;
}
#grid thead th.corner {
  position: sticky;
  top: 0; left: 0;
  z-index: 3;
  width: 44px;
  min-width: 44px;
  max-width: 44px;
  background: var(--header-bg);
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

#grid td {
  background: var(--cell-bg);
  cursor: cell;
}
#grid td.num { font-family: var(--font-num); text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
#grid td.err { color: var(--error); font-family: var(--font-num); font-size: 12px; font-weight: 600; }
#grid td.bold { font-weight: 700; }
#grid td.italic { font-style: italic; }
#grid td.in-range { background: var(--cell-bg-range); }
#grid td.active-cell {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  z-index: 4;
  background: var(--cell-bg);
}
#grid td.picker-range {
  background: rgba(19, 123, 67, 0.15);
  outline: 1px dashed var(--accent);
  outline-offset: -1px;
}

/* Column resize handle */
#grid thead th .col-resize {
  position: absolute;
  top: 0; right: -4px;
  width: 8px; height: 100%;
  cursor: col-resize;
  z-index: 5;
}
#grid thead th .col-resize:hover {
  background: var(--accent-tint-strong);
}

/* Cell editor overlay input */
#cell-editor {
  position: absolute;
  display: none;
  border: 2px solid var(--accent);
  padding: 0 5px;
  font-family: var(--font-cell);
  font-size: 13px;
  background: white;
  outline: none;
  z-index: 20;
  box-sizing: border-box;
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
}
#cell-editor.visible { display: block; }

/* Range highlight shown INSIDE formulas — ghost border */
.formula-ref-highlight {
  position: absolute;
  border: 1.5px dashed var(--accent);
  background: var(--accent-tint);
  pointer-events: none;
  z-index: 10;
  box-sizing: border-box;
}

/* ============================================================
   SHEET TABS (bottom)
   ============================================================ */
#status-tabs {
  display: flex;
  align-items: stretch;
  background: var(--toolbar);
  border-top: 1px solid var(--border);
  min-height: 30px;
  padding: 0 8px;
  flex-shrink: 0;
  gap: 0;
}
.sheet-tab {
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  height: 100%;
  font-size: 12px;
  color: var(--text-muted);
  cursor: pointer;
  border-right: 1px solid var(--border-soft);
  position: relative;
  user-select: none;
  white-space: nowrap;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sheet-tab:hover { background: var(--hover); color: var(--text); }
.sheet-tab.active {
  background: var(--panel);
  color: var(--accent-dark);
  font-weight: 600;
  border-bottom: 2px solid var(--accent);
  margin-bottom: -1px;
  padding-bottom: 2px;
}
.sheet-tab[contenteditable] {
  background: white;
  outline: 1.5px solid var(--accent);
  outline-offset: -2px;
  cursor: text;
}
.sheet-add {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px; height: 100%;
  color: var(--text-muted);
  font-size: 18px;
  cursor: pointer;
  font-weight: 300;
}
.sheet-add:hover { color: var(--accent); background: var(--hover); }

.status-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 11px;
  color: var(--text-faint);
  gap: 14px;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   CONTEXT MENU
   ============================================================ */
#ctx-menu {
  position: fixed;
  background: white;
  border: 1px solid var(--border);
  border-radius: 6px;
  box-shadow: var(--shadow-md);
  padding: 4px;
  z-index: 1000;
  min-width: 160px;
  font-size: 12px;
  display: none;
}
#ctx-menu.visible { display: block; }
#ctx-menu .ctx-item {
  padding: 7px 12px;
  border-radius: 4px;
  cursor: pointer;
}
#ctx-menu .ctx-item:hover { background: var(--hover); }
#ctx-menu .ctx-item.danger:hover { background: #fdecea; color: var(--error); }
#ctx-menu .ctx-sep { height: 1px; background: var(--border-soft); margin: 4px 0; }

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position: fixed;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(29, 29, 27, 0.95);
  color: white;
  padding: 8px 14px;
  font-size: 12px;
  border-radius: 4px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 180ms, transform 180ms;
  z-index: 2000;
  letter-spacing: 0.01em;
}
#toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ============================================================
   HELP HINT (top-right)
   ============================================================ */
.hint {
  font-size: 11px;
  color: var(--text-faint);
  font-family: var(--font-num);
  padding: 0 10px;
}
.hint kbd {
  font-family: inherit;
  background: rgba(0,0,0,0.06);
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: 3px;
  padding: 0 4px;
  margin: 0 1px;
  font-size: 10px;
}

/* Hide file input */
.hidden-file { display: none; }

/* Scrollbars - subtle */
#grid-wrap::-webkit-scrollbar { width: 12px; height: 12px; }
#grid-wrap::-webkit-scrollbar-track { background: transparent; }
#grid-wrap::-webkit-scrollbar-thumb {
  background: rgba(0,0,0,0.2);
  border: 3px solid var(--panel);
  border-radius: 6px;
}
#grid-wrap::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.35); }
#grid-wrap::-webkit-scrollbar-corner { background: var(--panel); }
</style>
</head>
<body>
<div id="app">

  <!-- Top bar: brand + toolbar -->
  <div id="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-name">Sheet</div>
    </div>

    <button class="tool tool-bold"   id="btn-bold"    title="Bold (Ctrl+B)">B</button>
    <button class="tool tool-italic" id="btn-italic"  title="Italic (Ctrl+I)">I</button>

    <div class="sep"></div>

    <div class="color-swatch" title="Fill color">
      <label>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
          <path d="M3 8l5-5 5 5-5 5-5-5z"/><path d="M3 13h10"/>
        </svg>
        <span class="swatch-chip" id="swatch-chip"></span>
        <span class="caret">▾</span>
      </label>
      <input type="color" id="bg-picker" value="#fff8b5" />
    </div>
    <button class="tool" id="btn-clear-bg" title="Clear fill">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M3 3l10 10M13 3L3 13"/>
      </svg>
    </button>

    <div class="sep"></div>

    <button class="tool" id="btn-clear" title="Clear contents (Delete)">
      <span class="label">Clear</span>
    </button>

    <div class="sep"></div>

    <button class="tool" id="btn-download" title="Download active sheet as CSV">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M8 2v9m0 0l-3-3m3 3l3-3M3 13h10"/>
      </svg>
      <span class="label">CSV</span>
    </button>
    <button class="tool" id="btn-upload" title="Upload CSV to active sheet">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
        <path d="M8 13V4m0 0l-3 3m3-3l3 3M3 13h10" transform="rotate(180 8 8)"/>
      </svg>
      <span class="label">Import</span>
    </button>
    <input type="file" id="file-input" class="hidden-file" accept=".csv,text/csv" />

    <div class="spacer"></div>
    <div class="hint">
      <kbd>Enter</kbd> confirm · <kbd>Esc</kbd> cancel · <kbd>F2</kbd> edit · <kbd>Del</kbd> clear
    </div>
  </div>

  <!-- Formula bar -->
  <div id="formula-bar">
    <div id="name-box">A1</div>
    <div id="fx-label">fx</div>
    <input id="formula-input" type="text" spellcheck="false" placeholder="Enter value or =formula" />
  </div>

  <!-- Grid -->
  <div id="grid-wrap">
    <table id="grid"></table>
    <input id="cell-editor" type="text" spellcheck="false" />
  </div>

  <!-- Sheet tabs -->
  <div id="status-tabs">
    <div id="sheet-tabs-container" style="display:flex;"></div>
    <div class="sheet-add" id="sheet-add" title="Add sheet">+</div>
    <div class="status-right" id="status-right">Ready</div>
  </div>

  <!-- Floating elements -->
  <div id="ctx-menu"></div>
  <div id="toast"></div>

</div>

<script>
'use strict';
/* ============================================================================
   SPREADSHEET CORE
   ============================================================================ */

/* ---------- constants ---------- */
const COL_COUNT = 40;   // A ... AN
const ROW_COUNT = 200;
const DEFAULT_COL_WIDTH = 88;
const ROW_HEIGHT = 22;
const ROW_HEADER_WIDTH = 44;

/* ---------- column letter helpers ---------- */
function colToLetter(c) {
  let s = '', n = c;
  while (true) {
    s = String.fromCharCode(65 + (n % 26)) + s;
    n = Math.floor(n / 26) - 1;
    if (n < 0) break;
  }
  return s;
}
function letterToCol(s) {
  let n = 0;
  for (let i = 0; i < s.length; i++) {
    n = n * 26 + (s.charCodeAt(i) - 64);
  }
  return n - 1;
}
function cellId(r, c) { return colToLetter(c) + (r + 1); }
function parseCellRef(s) {
  const m = /^([A-Za-z]+)(\d+)$/.exec(s);
  if (!m) return null;
  const c = letterToCol(m[1].toUpperCase());
  const r = parseInt(m[2], 10) - 1;
  if (r < 0 || c < 0) return null;
  return { r, c };
}

/* ============================================================================
   WORKBOOK STATE
   ============================================================================ */
function makeSheet(name) {
  return {
    name,
    cells: {},            // id -> { raw, formula, ast, refs, value, error, bold, italic, bg }
    deps: {},             // id -> Set<id> of cells this cell references
    dependents: {},       // id -> Set<id> of cells that reference this cell
    colWidths: {},        // colIndex -> px
  };
}

const workbook = {
  sheets: [ makeSheet('Sheet1') ],
  active: 0,
};
function activeSheet() { return workbook.sheets[workbook.active]; }

/* ---------- cell get / set ---------- */
function getCell(sheet, id) { return sheet.cells[id]; }
function ensureCell(sheet, id) {
  if (!sheet.cells[id]) sheet.cells[id] = { raw: '', formula: null, ast: null,
    refs: null, value: null, error: null, bold: false, italic: false, bg: null };
  return sheet.cells[id];
}

/* ============================================================================
   FORMULA PARSER (recursive descent)
   AST nodes:
     { type: 'num',   value: number }
     { type: 'str',   value: string }
     { type: 'ref',   id: 'A1' }
     { type: 'range', from: 'A1', to: 'B5' }
     { type: 'bin',   op, left, right }
     { type: 'unary', op, arg }
     { type: 'call',  name, args: [ ... ] }
   ============================================================================ */

/* Tokenize: ['num', value], ['str', value], ['ident', name], ['op', '+'|'-'|'*'|'/'|':'|','|'('|')'|'=','>','<','>=','<=','<>'] */
function tokenize(src) {
  const tokens = [];
  let i = 0;
  while (i < src.length) {
    const ch = src[i];
    if (ch === ' ' || ch === '\t' || ch === '\n') { i++; continue; }
    if ((ch >= '0' && ch <= '9') || (ch === '.' && src[i+1] >= '0' && src[i+1] <= '9')) {
      let j = i;
      while (j < src.length && ((src[j] >= '0' && src[j] <= '9') || src[j] === '.')) j++;
      if (src[j] === 'e' || src[j] === 'E') {
        j++;
        if (src[j] === '+' || src[j] === '-') j++;
        while (j < src.length && src[j] >= '0' && src[j] <= '9') j++;
      }
      tokens.push(['num', parseFloat(src.slice(i, j))]);
      i = j;
      continue;
    }
    if (ch === '"') {
      let j = i + 1, s = '';
      while (j < src.length && src[j] !== '"') {
        if (src[j] === '\\' && j + 1 < src.length) { s += src[j+1]; j += 2; }
        else { s += src[j]; j++; }
      }
      tokens.push(['str', s]);
      i = j + 1;
      continue;
    }
    if ((ch >= 'A' && ch <= 'Z') || (ch >= 'a' && ch <= 'z') || ch === '_') {
      let j = i;
      while (j < src.length && (
        (src[j] >= 'A' && src[j] <= 'Z') || (src[j] >= 'a' && src[j] <= 'z') ||
        (src[j] >= '0' && src[j] <= '9') || src[j] === '_'
      )) j++;
      tokens.push(['ident', src.slice(i, j)]);
      i = j;
      continue;
    }
    /* multi-char ops */
    if ((ch === '<' && src[i+1] === '=') || (ch === '>' && src[i+1] === '=') || (ch === '<' && src[i+1] === '>')) {
      tokens.push(['op', src.slice(i, i+2)]); i += 2; continue;
    }
    if ('+-*/(),:=<>&^%'.includes(ch)) {
      tokens.push(['op', ch]); i++; continue;
    }
    throw new Error('Unexpected character: ' + ch);
  }
  return tokens;
}

function parseFormula(src) {
  /* src starts with '=' — strip and parse the expression */
  const body = src.slice(1);
  const tokens = tokenize(body);
  let pos = 0;

  function peek() { return tokens[pos]; }
  function eat(type, val) {
    const t = tokens[pos];
    if (!t) return null;
    if (t[0] !== type) return null;
    if (val !== undefined && t[1] !== val) return null;
    pos++;
    return t;
  }
  function expect(type, val) {
    const t = eat(type, val);
    if (!t) throw new Error('Expected ' + (val || type) + ' near position ' + pos);
    return t;
  }

  /* expr -> compare */
  function parseExpr() { return parseCompare(); }

  function parseCompare() {
    let left = parseAddSub();
    while (true) {
      const t = peek();
      if (!t || t[0] !== 'op') break;
      if (t[1] === '=' || t[1] === '<>' || t[1] === '<' || t[1] === '>' || t[1] === '<=' || t[1] === '>=') {
        pos++;
        const right = parseAddSub();
        left = { type: 'bin', op: t[1], left, right };
      } else break;
    }
    return left;
  }

  function parseAddSub() {
    let left = parseMulDiv();
    while (true) {
      const t = peek();
      if (!t || t[0] !== 'op') break;
      if (t[1] === '+' || t[1] === '-' || t[1] === '&') {
        pos++;
        const right = parseMulDiv();
        left = { type: 'bin', op: t[1], left, right };
      } else break;
    }
    return left;
  }

  function parseMulDiv() {
    let left = parseUnary();
    while (true) {
      const t = peek();
      if (!t || t[0] !== 'op') break;
      if (t[1] === '*' || t[1] === '/') {
        pos++;
        const right = parseUnary();
        left = { type: 'bin', op: t[1], left, right };
      } else break;
    }
    return left;
  }

  function parseUnary() {
    const t = peek();
    if (t && t[0] === 'op' && (t[1] === '-' || t[1] === '+')) {
      pos++;
      return { type: 'unary', op: t[1], arg: parseUnary() };
    }
    return parsePostfix();
  }

  function parsePostfix() {
    let node = parsePrimary();
    /* percentage */
    while (true) {
      const t = peek();
      if (t && t[0] === 'op' && t[1] === '%') {
        pos++;
        node = { type: 'unary', op: '%', arg: node };
      } else break;
    }
    return node;
  }

  function parsePrimary() {
    const t = peek();
    if (!t) throw new Error('Unexpected end of formula');

    if (t[0] === 'num') { pos++; return { type: 'num', value: t[1] }; }
    if (t[0] === 'str') { pos++; return { type: 'str', value: t[1] }; }

    if (t[0] === 'op' && t[1] === '(') {
      pos++;
      const inner = parseExpr();
      expect('op', ')');
      return inner;
    }

    if (t[0] === 'ident') {
      pos++;
      const name = t[1];
      const next = peek();
      /* function call? */
      if (next && next[0] === 'op' && next[1] === '(') {
        pos++; /* consume ( */
        const args = [];
        if (!(peek() && peek()[0] === 'op' && peek()[1] === ')')) {
          args.push(parseExpr());
          while (peek() && peek()[0] === 'op' && peek()[1] === ',') {
            pos++;
            args.push(parseExpr());
          }
        }
        expect('op', ')');
        return { type: 'call', name: name.toUpperCase(), args };
      }
      /* cell reference? */
      if (/^[A-Za-z]+\d+$/.test(name)) {
        const id = name.toUpperCase();
        /* range? */
        if (peek() && peek()[0] === 'op' && peek()[1] === ':') {
          pos++;
          const t2 = peek();
          if (!t2 || t2[0] !== 'ident' || !/^[A-Za-z]+\d+$/.test(t2[1])) {
            throw new Error('Expected cell reference after ":"');
          }
          pos++;
          return { type: 'range', from: id, to: t2[1].toUpperCase() };
        }
        return { type: 'ref', id };
      }
      /* treat lone identifiers (TRUE/FALSE/NA) */
      if (name.toUpperCase() === 'TRUE')  return { type: 'num', value: 1 };
      if (name.toUpperCase() === 'FALSE') return { type: 'num', value: 0 };
      throw new Error('Unknown name: ' + name);
    }

    throw new Error('Unexpected token: ' + JSON.stringify(t));
  }

  const ast = parseExpr();
  if (pos < tokens.length) throw new Error('Unexpected trailing tokens');
  return ast;
}

/* ---------- extract references from an AST ---------- */
function extractRefs(ast, refs) {
  if (!ast) return;
  switch (ast.type) {
    case 'ref':
      refs.add(ast.id);
      break;
    case 'range': {
      const a = parseCellRef(ast.from), b = parseCellRef(ast.to);
      if (!a || !b) return;
      const r1 = Math.min(a.r, b.r), r2 = Math.max(a.r, b.r);
      const c1 = Math.min(a.c, b.c), c2 = Math.max(a.c, b.c);
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++) refs.add(cellId(r, c));
      break;
    }
    case 'bin':
      extractRefs(ast.left, refs);
      extractRefs(ast.right, refs);
      break;
    case 'unary':
      extractRefs(ast.arg, refs);
      break;
    case 'call':
      for (const a of ast.args) extractRefs(a, refs);
      break;
  }
}

/* ============================================================================
   FORMULA EVALUATION
   ============================================================================ */

/* Custom error class so evaluator throws typed errors */
class FormulaError extends Error {
  constructor(code) { super(code); this.code = code; this.isFormulaError = true; }
}

function toNumber(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (typeof v === 'string') {
    const n = parseFloat(v);
    if (!isNaN(n) && /^\s*-?\d+(\.\d+)?(e[+-]?\d+)?\s*$/i.test(v)) return n;
    throw new FormulaError('#VALUE!');
  }
  if (v && v.isFormulaError) throw v;
  throw new FormulaError('#VALUE!');
}
function toString(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
  return String(v);
}
function toBoolean(v) {
  if (typeof v === 'boolean') return v;
  if (typeof v === 'number') return v !== 0;
  if (typeof v === 'string') {
    const s = v.toUpperCase();
    if (s === 'TRUE') return true;
    if (s === 'FALSE') return false;
    return v !== '';
  }
  return !!v;
}

/* Get value of a cell, respecting evaluation stack for circular detection */
function getCellValue(sheet, id, evalStack) {
  if (evalStack.has(id)) throw new FormulaError('#CIRCULAR');
  const cell = getCell(sheet, id);
  if (!cell) return 0;

  if (cell.formula === null) {
    /* plain value cell: parse raw as number if possible */
    if (cell.raw === '' || cell.raw === null) return 0;
    const n = parseFloat(cell.raw);
    if (!isNaN(n) && /^\s*-?\d+(\.\d+)?(e[+-]?\d+)?\s*$/i.test(cell.raw)) return n;
    /* plain string */
    return cell.raw;
  }

  /* formula */
  if (cell.cachedValue !== undefined) {
    if (cell.cachedValue && cell.cachedValue.isFormulaError) throw cell.cachedValue;
    return cell.cachedValue;
  }

  evalStack.add(id);
  try {
    cell.cachedValue = evaluateAST(cell.ast, sheet, evalStack);
    cell.error = null;
  } catch (e) {
    if (e && e.isFormulaError) {
      cell.cachedValue = e;
      cell.error = e.code;
    } else {
      cell.error = '#ERROR';
      cell.cachedValue = new FormulaError('#ERROR');
    }
    throw cell.cachedValue;
  } finally {
    evalStack.delete(id);
  }
  return cell.cachedValue;
}

/* Expand a range AST to list of cell ids (for functions) */
function expandRange(ast) {
  const a = parseCellRef(ast.from), b = parseCellRef(ast.to);
  if (!a || !b) throw new FormulaError('#REF!');
  const r1 = Math.min(a.r, b.r), r2 = Math.max(a.r, b.r);
  const c1 = Math.min(a.c, b.c), c2 = Math.max(a.c, b.c);
  const out = [];
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) out.push(cellId(r, c));
  return out;
}

function evaluateAST(ast, sheet, evalStack) {
  switch (ast.type) {
    case 'num': return ast.value;
    case 'str': return ast.value;

    case 'ref': {
      const cell = getCell(sheet, ast.id);
      if (!cell || (cell.raw === '' && cell.formula === null)) return 0;
      return getCellValue(sheet, ast.id, evalStack);
    }

    case 'range':
      /* Bare ranges outside function context are errors */
      throw new FormulaError('#VALUE!');

    case 'unary': {
      if (ast.op === '+') return +toNumber(evaluateAST(ast.arg, sheet, evalStack));
      if (ast.op === '-') return -toNumber(evaluateAST(ast.arg, sheet, evalStack));
      if (ast.op === '%') return toNumber(evaluateAST(ast.arg, sheet, evalStack)) / 100;
      throw new FormulaError('#VALUE!');
    }

    case 'bin': {
      if (ast.op === '&') {
        return toString(evaluateAST(ast.left, sheet, evalStack)) +
               toString(evaluateAST(ast.right, sheet, evalStack));
      }
      const l = evaluateAST(ast.left, sheet, evalStack);
      const r = evaluateAST(ast.right, sheet, evalStack);
      if (ast.op === '=')  return (typeof l === 'string' || typeof r === 'string') ? toString(l) === toString(r) : toNumber(l) === toNumber(r);
      if (ast.op === '<>') return (typeof l === 'string' || typeof r === 'string') ? toString(l) !== toString(r) : toNumber(l) !== toNumber(r);
      if (ast.op === '<')  return toNumber(l) <  toNumber(r);
      if (ast.op === '>')  return toNumber(l) >  toNumber(r);
      if (ast.op === '<=') return toNumber(l) <= toNumber(r);
      if (ast.op === '>=') return toNumber(l) >= toNumber(r);
      const ln = toNumber(l), rn = toNumber(r);
      if (ast.op === '+') return ln + rn;
      if (ast.op === '-') return ln - rn;
      if (ast.op === '*') return ln * rn;
      if (ast.op === '/') {
        if (rn === 0) throw new FormulaError('#DIV/0!');
        return ln / rn;
      }
      throw new FormulaError('#VALUE!');
    }

    case 'call': {
      const name = ast.name;
      const fn = FUNCTIONS[name];
      if (!fn) throw new FormulaError('#NAME?');
      return fn(ast.args, sheet, evalStack);
    }
  }
  throw new FormulaError('#ERROR');
}

/* ---------- Built-in functions ---------- */
/*
 Helpers: collectNumbers visits each arg; for ranges iterates and skips empties/strings.
          collectValues returns raw values (for IF etc.).
*/
function argValues(args, sheet, evalStack) {
  /* evaluate each, flattening ranges */
  const out = [];
  for (const a of args) {
    if (a.type === 'range') {
      for (const id of expandRange(a)) {
        try { out.push(getCellValue(sheet, id, evalStack)); }
        catch (e) { if (e && e.isFormulaError) out.push(e); else throw e; }
      }
    } else {
      out.push(evaluateAST(a, sheet, evalStack));
    }
  }
  return out;
}
function argNumbers(args, sheet, evalStack) {
  /* like argValues but numeric-only and skipping empty text; errors propagate */
  const out = [];
  for (const a of args) {
    if (a.type === 'range') {
      for (const id of expandRange(a)) {
        const cell = getCell(sheet, id);
        if (!cell || (cell.raw === '' && cell.formula === null)) continue;
        const v = getCellValue(sheet, id, evalStack);
        if (v && v.isFormulaError) throw v;
        if (typeof v === 'number') out.push(v);
        else if (typeof v === 'boolean') out.push(v ? 1 : 0);
        /* skip strings */
      }
    } else {
      const v = evaluateAST(a, sheet, evalStack);
      if (v && v.isFormulaError) throw v;
      if (typeof v === 'number') out.push(v);
      else if (typeof v === 'boolean') out.push(v ? 1 : 0);
      else if (typeof v === 'string') out.push(toNumber(v));
    }
  }
  return out;
}

const FUNCTIONS = {
  SUM(args, sheet, stack) {
    const nums = argNumbers(args, sheet, stack);
    return nums.reduce((a, b) => a + b, 0);
  },
  AVERAGE(args, sheet, stack) {
    const nums = argNumbers(args, sheet, stack);
    if (nums.length === 0) throw new FormulaError('#DIV/0!');
    return nums.reduce((a, b) => a + b, 0) / nums.length;
  },
  AVG(args, sheet, stack) { return FUNCTIONS.AVERAGE(args, sheet, stack); },
  MIN(args, sheet, stack) {
    const nums = argNumbers(args, sheet, stack);
    if (nums.length === 0) return 0;
    return Math.min(...nums);
  },
  MAX(args, sheet, stack) {
    const nums = argNumbers(args, sheet, stack);
    if (nums.length === 0) return 0;
    return Math.max(...nums);
  },
  COUNT(args, sheet, stack) {
    return argNumbers(args, sheet, stack).length;
  },
  COUNTA(args, sheet, stack) {
    /* count non-empty */
    let n = 0;
    for (const a of args) {
      if (a.type === 'range') {
        for (const id of expandRange(a)) {
          const c = getCell(sheet, id);
          if (c && (c.formula !== null || c.raw !== '')) n++;
        }
      } else {
        const v = evaluateAST(a, sheet, stack);
        if (v !== '' && v !== null && v !== undefined) n++;
      }
    }
    return n;
  },
  IF(args, sheet, stack) {
    if (args.length < 2) throw new FormulaError('#VALUE!');
    const cond = evaluateAST(args[0], sheet, stack);
    if (toBoolean(cond)) return evaluateAST(args[1], sheet, stack);
    if (args.length >= 3) return evaluateAST(args[2], sheet, stack);
    return false;
  },
  ABS(args, sheet, stack) {
    if (args.length !== 1) throw new FormulaError('#VALUE!');
    return Math.abs(toNumber(evaluateAST(args[0], sheet, stack)));
  },
  ROUND(args, sheet, stack) {
    const v = toNumber(evaluateAST(args[0], sheet, stack));
    const d = args[1] ? toNumber(evaluateAST(args[1], sheet, stack)) : 0;
    const p = Math.pow(10, d);
    return Math.round(v * p) / p;
  },
  SQRT(args, sheet, stack) {
    const v = toNumber(evaluateAST(args[0], sheet, stack));
    if (v < 0) throw new FormulaError('#NUM!');
    return Math.sqrt(v);
  },
  POWER(args, sheet, stack) {
    return Math.pow(
      toNumber(evaluateAST(args[0], sheet, stack)),
      toNumber(evaluateAST(args[1], sheet, stack))
    );
  },
  CONCAT(args, sheet, stack) {
    return argValues(args, sheet, stack).map(toString).join('');
  },
  CONCATENATE(args, sheet, stack) { return FUNCTIONS.CONCAT(args, sheet, stack); },
  LEN(args, sheet, stack) {
    return toString(evaluateAST(args[0], sheet, stack)).length;
  },
  UPPER(args, sheet, stack) { return toString(evaluateAST(args[0], sheet, stack)).toUpperCase(); },
  LOWER(args, sheet, stack) { return toString(evaluateAST(args[0], sheet, stack)).toLowerCase(); },
  NOW() { return new Date().toLocaleString(); },
  TODAY() { return new Date().toLocaleDateString(); },
  PI() { return Math.PI; },
};

/* ============================================================================
   DEPENDENCY GRAPH MAINTENANCE + RECALC
   ============================================================================ */
function updateDeps(sheet, id, newRefs) {
  /* newRefs is a Set<id> or null */
  const oldRefs = sheet.deps[id];
  if (oldRefs) {
    for (const r of oldRefs) {
      const set = sheet.dependents[r];
      if (set) { set.delete(id); if (set.size === 0) delete sheet.dependents[r]; }
    }
  }
  if (newRefs && newRefs.size > 0) {
    sheet.deps[id] = newRefs;
    for (const r of newRefs) {
      if (!sheet.dependents[r]) sheet.dependents[r] = new Set();
      sheet.dependents[r].add(id);
    }
  } else {
    delete sheet.deps[id];
  }
}

/* Invalidate cached value of a cell and all transitive dependents */
function invalidate(sheet, id, affected) {
  if (affected.has(id)) return;
  affected.add(id);
  const cell = getCell(sheet, id);
  if (cell) cell.cachedValue = undefined;
  const deps = sheet.dependents[id];
  if (deps) {
    for (const d of deps) invalidate(sheet, d, affected);
  }
}

/* Set a cell's raw contents. Handles parsing, dep-graph, invalidation, and DOM update of all affected cells. */
function setCellRaw(sheet, id, raw) {
  const cell = ensureCell(sheet, id);
  cell.raw = raw;

  if (typeof raw === 'string' && raw.startsWith('=')) {
    try {
      const ast = parseFormula(raw);
      const refs = new Set();
      extractRefs(ast, refs);
      cell.formula = raw;
      cell.ast = ast;
      cell.refs = refs;
      cell.error = null;
      cell.cachedValue = undefined; /* force recompute */
      updateDeps(sheet, id, refs);
    } catch (e) {
      cell.formula = raw;
      cell.ast = null;
      cell.refs = null;
      cell.error = '#SYNTAX';
      cell.cachedValue = new FormulaError('#SYNTAX');
      updateDeps(sheet, id, null);
    }
  } else {
    cell.formula = null;
    cell.ast = null;
    cell.refs = null;
    cell.error = null;
    cell.cachedValue = undefined;
    updateDeps(sheet, id, null);
  }

  /* prune empty cells (keep style-only ones) */
  if (cell.raw === '' && !cell.bold && !cell.italic && !cell.bg) {
    delete sheet.cells[id];
  }

  /* invalidate & recompute */
  const affected = new Set();
  invalidate(sheet, id, affected);
  for (const aid of affected) redrawCell(sheet, aid);
}

/* ============================================================================
   GRID RENDER + CELL UPDATES
   ============================================================================ */
const $ = sel => document.querySelector(sel);

/* DOM refs */
const gridWrap = $('#grid-wrap');
const gridEl = $('#grid');
const cellEditor = $('#cell-editor');
const formulaInput = $('#formula-input');
const nameBox = $('#name-box');
const statusRight = $('#status-right');

/* Maps from "r,c" -> td/th elements for fast lookup. */
const tdMap = new Map();
const thColMap = new Map();
const thRowMap = new Map();
const colEls = [];

function buildGrid() {
  let html = '<colgroup>';
  html += '<col style="width:' + ROW_HEADER_WIDTH + 'px;">';
  for (let c = 0; c < COL_COUNT; c++) {
    html += '<col data-col="' + c + '" style="width:' + DEFAULT_COL_WIDTH + 'px;">';
  }
  html += '</colgroup>';

  html += '<thead><tr><th class="corner"></th>';
  for (let c = 0; c < COL_COUNT; c++) {
    html += '<th data-col="' + c + '">' + colToLetter(c) +
      '<div class="col-resize" data-col-resize="' + c + '"></div></th>';
  }
  html += '</tr></thead><tbody>';

  for (let r = 0; r < ROW_COUNT; r++) {
    html += '<tr><th data-row="' + r + '">' + (r + 1) + '</th>';
    for (let c = 0; c < COL_COUNT; c++) {
      html += '<td data-r="' + r + '" data-c="' + c + '"></td>';
    }
    html += '</tr>';
  }
  html += '</tbody>';
  gridEl.innerHTML = html;

  /* build element maps */
  tdMap.clear(); thColMap.clear(); thRowMap.clear(); colEls.length = 0;
  gridEl.querySelectorAll('col[data-col]').forEach(col => { colEls[parseInt(col.dataset.col, 10)] = col; });
  gridEl.querySelectorAll('thead th[data-col]').forEach(th => { thColMap.set(parseInt(th.dataset.col, 10), th); });
  gridEl.querySelectorAll('tbody th[data-row]').forEach(th => { thRowMap.set(parseInt(th.dataset.row, 10), th); });
  gridEl.querySelectorAll('td[data-r]').forEach(td => {
    tdMap.set(td.dataset.r + ',' + td.dataset.c, td);
  });
}

function redrawCell(sheet, id) {
  const ref = parseCellRef(id);
  if (!ref) return;
  const td = tdMap.get(ref.r + ',' + ref.c);
  if (!td) return;
  const cell = getCell(sheet, id);

  /* reset */
  td.textContent = '';
  td.className = '';
  td.style.backgroundColor = '';
  td.style.color = '';

  if (!cell) return;

  /* content */
  let display = '', klass = [];
  if (cell.formula !== null) {
    /* evaluate lazily if not cached */
    let v;
    try {
      v = getCellValue(sheet, id, new Set());
    } catch (e) {
      v = e;
    }
    if (v && v.isFormulaError) {
      display = v.code;
      klass.push('err');
    } else if (typeof v === 'number') {
      display = formatNumber(v);
      klass.push('num');
    } else if (typeof v === 'boolean') {
      display = v ? 'TRUE' : 'FALSE';
    } else {
      display = String(v);
    }
  } else if (cell.raw !== '') {
    const n = parseFloat(cell.raw);
    if (!isNaN(n) && /^\s*-?\d+(\.\d+)?(e[+-]?\d+)?\s*$/i.test(cell.raw)) {
      display = formatNumber(n);
      klass.push('num');
    } else {
      display = cell.raw;
    }
  }
  td.textContent = display;

  /* styling */
  if (cell.bold) klass.push('bold');
  if (cell.italic) klass.push('italic');
  if (klass.length) td.className = klass.join(' ');
  if (cell.bg) td.style.backgroundColor = cell.bg;

  /* keep selection styles re-applied */
  applySelectionClasses();
}

function formatNumber(n) {
  if (!isFinite(n)) return n.toString();
  /* show short floats, up to 10 sig figs, strip trailing zeros */
  if (Number.isInteger(n)) return n.toString();
  const abs = Math.abs(n);
  if (abs < 1e-6 || abs >= 1e15) return n.toExponential(6);
  let s = n.toFixed(10);
  s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}

/* Full sheet redraw — iterate cells only */
function redrawSheet() {
  /* clear all tds */
  for (const td of tdMap.values()) {
    td.textContent = '';
    td.className = '';
    td.style.backgroundColor = '';
  }
  const sheet = activeSheet();
  for (const id of Object.keys(sheet.cells)) {
    redrawCell(sheet, id);
  }
  /* apply column widths */
  for (const [c, w] of Object.entries(sheet.colWidths)) {
    const col = colEls[parseInt(c, 10)];
    if (col) col.style.width = w + 'px';
  }
  applySelectionClasses();
}

/* ============================================================================
   SELECTION + ACTIVE CELL
   ============================================================================ */
let sel = { r: 0, c: 0, r2: 0, c2: 0 };    /* current selection rectangle */
let anchor = { r: 0, c: 0 };                /* anchor for shift-extend */
let prevSelectionTDs = [];                  /* cells currently in-range highlight */

function selRect() {
  return {
    r1: Math.min(sel.r, sel.r2), c1: Math.min(sel.c, sel.c2),
    r2: Math.max(sel.r, sel.r2), c2: Math.max(sel.c, sel.c2),
  };
}

function applySelectionClasses() {
  for (const t of prevSelectionTDs) {
    t.classList.remove('in-range', 'active-cell');
  }
  prevSelectionTDs.length = 0;
  for (const th of thColMap.values()) th.classList.remove('col-active');
  for (const th of thRowMap.values()) th.classList.remove('row-active');

  const { r1, c1, r2, c2 } = selRect();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const td = tdMap.get(r + ',' + c);
      if (td) { td.classList.add('in-range'); prevSelectionTDs.push(td); }
    }
  }
  const act = tdMap.get(sel.r + ',' + sel.c);
  if (act) { act.classList.add('active-cell'); prevSelectionTDs.push(act); }

  /* header highlight — only show active-cell col/row */
  const colTh = thColMap.get(sel.c); if (colTh) colTh.classList.add('col-active');
  const rowTh = thRowMap.get(sel.r); if (rowTh) rowTh.classList.add('row-active');

  updateNameBox();
  updateFormulaBar();
  scrollActiveIntoView();
}

function updateNameBox() {
  const { r1, c1, r2, c2 } = selRect();
  if (r1 === r2 && c1 === c2) {
    nameBox.textContent = cellId(sel.r, sel.c);
  } else {
    nameBox.textContent = (r2 - r1 + 1) + 'R × ' + (c2 - c1 + 1) + 'C';
  }
}

function updateFormulaBar() {
  if (isEditing) return; /* don't clobber while user is typing */
  const sheet = activeSheet();
  const cell = getCell(sheet, cellId(sel.r, sel.c));
  if (!cell) { formulaInput.value = ''; return; }
  formulaInput.value = cell.formula !== null ? cell.formula : cell.raw;
}

function scrollActiveIntoView() {
  const td = tdMap.get(sel.r + ',' + sel.c);
  if (!td) return;
  const wrap = gridWrap.getBoundingClientRect();
  const rect = td.getBoundingClientRect();
  if (rect.top < wrap.top + 24) gridWrap.scrollTop -= (wrap.top + 24 - rect.top);
  else if (rect.bottom > wrap.bottom) gridWrap.scrollTop += (rect.bottom - wrap.bottom + 2);
  if (rect.left < wrap.left + ROW_HEADER_WIDTH) gridWrap.scrollLeft -= (wrap.left + ROW_HEADER_WIDTH - rect.left);
  else if (rect.right > wrap.right) gridWrap.scrollLeft += (rect.right - wrap.right + 2);
}

function setSelection(r, c, extend = false) {
  r = Math.max(0, Math.min(ROW_COUNT - 1, r));
  c = Math.max(0, Math.min(COL_COUNT - 1, c));
  if (extend) {
    sel.r = anchor.r; sel.c = anchor.c;
    sel.r2 = r; sel.c2 = c;
    /* when extending, "active" stays at anchor visually but we treat it as r,c */
    /* match Excel: active stays at anchor, selection extends */
    sel.r = r; sel.c = c; /* active = new end */
  } else {
    sel = { r, c, r2: r, c2: c };
    anchor = { r, c };
  }
  applySelectionClasses();
}

/* Set the entire range explicitly (used by row/col header clicks) */
function setSelectionRect(r1, c1, r2, c2) {
  anchor = { r: r1, c: c1 };
  sel = { r: r1, c: c1, r2, c2 };
  applySelectionClasses();
}

/* ============================================================================
   EDITING
   ============================================================================ */
let isEditing = false;
let editInline = false;     /* true = floating overlay; false = formula bar */
let editStart = null;       /* {r,c} when editing started */
let editInitialRaw = '';    /* for Escape */

/* Picker: inserting refs into the formula by clicking cells */
let isPicking = false;
let pickInsertPos = 0;          /* caret position where refs get inserted */
let pickInsertLen = 0;          /* length of currently-inserted reference text */
let pickAnchor = null;          /* {r,c} of first picked cell */
let pickHoverTDs = [];          /* cells currently highlighted as picker-range */

function editorInput() {
  return editInline ? cellEditor : formulaInput;
}

function startEdit(mode, initialChar) {
  /* mode: 'inline' | 'formulabar' */
  const sheet = activeSheet();
  const id = cellId(sel.r, sel.c);
  const cell = getCell(sheet, id);
  editStart = { r: sel.r, c: sel.c };
  editInitialRaw = cell ? (cell.formula !== null ? cell.formula : cell.raw) : '';
  isEditing = true;
  editInline = (mode === 'inline');

  const inp = editorInput();
  if (mode === 'inline') {
    /* position overlay */
    const td = tdMap.get(sel.r + ',' + sel.c);
    if (!td) return;
    const rect = td.getBoundingClientRect();
    const wrapRect = gridWrap.getBoundingClientRect();
    cellEditor.style.left   = (gridWrap.scrollLeft + rect.left - wrapRect.left) + 'px';
    cellEditor.style.top    = (gridWrap.scrollTop  + rect.top  - wrapRect.top)  + 'px';
    cellEditor.style.width  = rect.width + 'px';
    cellEditor.style.height = rect.height + 'px';
    cellEditor.classList.add('visible');
    cellEditor.value = initialChar !== undefined ? initialChar : editInitialRaw;
    /* copy style hints */
    cellEditor.style.fontWeight = (cell && cell.bold) ? '700' : '400';
    cellEditor.style.fontStyle  = (cell && cell.italic) ? 'italic' : 'normal';
    setTimeout(() => {
      cellEditor.focus();
      if (initialChar !== undefined) {
        cellEditor.setSelectionRange(cellEditor.value.length, cellEditor.value.length);
      } else {
        cellEditor.select();
      }
    }, 0);
  } else {
    formulaInput.focus();
    if (initialChar !== undefined) {
      formulaInput.value = initialChar;
      formulaInput.setSelectionRange(formulaInput.value.length, formulaInput.value.length);
    } else {
      formulaInput.value = editInitialRaw;
      formulaInput.select();
    }
  }
}

function commitEdit(advance) {
  if (!isEditing) return;
  const inp = editorInput();
  const raw = inp.value;
  const sheet = activeSheet();
  const id = cellId(editStart.r, editStart.c);
  setCellRaw(sheet, id, raw);
  finishEdit();
  if (advance) {
    const { r, c } = advance;
    setSelection(sel.r + r, sel.c + c);
  }
}

function cancelEdit() {
  if (!isEditing) return;
  finishEdit();
  updateFormulaBar();
}

function finishEdit() {
  isEditing = false;
  editInline = false;
  editStart = null;
  cellEditor.classList.remove('visible');
  cellEditor.value = '';
  clearPickerHighlight();
  isPicking = false;
  pickAnchor = null;
  pickInsertLen = 0;
  gridWrap.focus();
}

/* ============================================================================
   PICKER MODE (insert cell/range refs into formula while editing)
   ============================================================================ */
function inPickingMode() {
  if (!isEditing) return false;
  const v = editorInput().value;
  return v.startsWith('=');
}

function clearPickerHighlight() {
  for (const t of pickHoverTDs) t.classList.remove('picker-range');
  pickHoverTDs.length = 0;
}
function showPickerHighlight(r1, c1, r2, c2) {
  clearPickerHighlight();
  const rr1 = Math.min(r1, r2), rr2 = Math.max(r1, r2);
  const cc1 = Math.min(c1, c2), cc2 = Math.max(c1, c2);
  for (let r = rr1; r <= rr2; r++) {
    for (let c = cc1; c <= cc2; c++) {
      const td = tdMap.get(r + ',' + c);
      if (td) { td.classList.add('picker-range'); pickHoverTDs.push(td); }
    }
  }
}

function startPick(r, c) {
  const inp = editorInput();
  const caret = inp.selectionStart;
  /* If chars just before caret look like a partial ref/range, replace them */
  const before = inp.value.slice(0, caret);
  const refTail = /([A-Z]+\d+(?::[A-Z]+\d+)?)$/i.exec(before);
  if (refTail) {
    pickInsertPos = caret - refTail[1].length;
    pickInsertLen = refTail[1].length;
  } else {
    pickInsertPos = caret;
    pickInsertLen = 0;
  }
  pickAnchor = { r, c };
  updatePick(r, c);
  isPicking = true;
}

function updatePick(r, c) {
  const a = pickAnchor;
  if (!a) return;
  let refStr;
  if (a.r === r && a.c === c) refStr = cellId(a.r, a.c);
  else {
    const r1 = Math.min(a.r, r), r2 = Math.max(a.r, r);
    const c1 = Math.min(a.c, c), c2 = Math.max(a.c, c);
    refStr = cellId(r1, c1) + ':' + cellId(r2, c2);
  }
  const inp = editorInput();
  const v = inp.value;
  const newVal = v.slice(0, pickInsertPos) + refStr + v.slice(pickInsertPos + pickInsertLen);
  inp.value = newVal;
  const newCaret = pickInsertPos + refStr.length;
  inp.setSelectionRange(newCaret, newCaret);
  pickInsertLen = refStr.length;
  showPickerHighlight(a.r, a.c, r, c);
}

function endPick() {
  isPicking = false;
  /* keep pickAnchor so a subsequent click can extend — actually, reset so next click starts over */
  /* we keep pickInsertPos/Len so typing continues after the ref */
}

/* ============================================================================
   EVENT WIRING — MOUSE
   ============================================================================ */
let mouseSelecting = false;  /* dragging to select cells (not picking) */

gridEl.addEventListener('mousedown', (e) => {
  /* col resize */
  if (e.target.classList && e.target.classList.contains('col-resize')) {
    startColResize(e, parseInt(e.target.dataset.colResize, 10));
    return;
  }

  const td = e.target.closest('td[data-r]');
  const thCol = e.target.closest('thead th[data-col]');
  const thRow = e.target.closest('tbody th[data-row]');
  const corner = e.target.closest('th.corner');

  /* Corner: select all */
  if (corner) {
    e.preventDefault();
    if (isEditing) commitEdit();
    setSelectionRect(0, 0, ROW_COUNT - 1, COL_COUNT - 1);
    sel.r = 0; sel.c = 0;
    applySelectionClasses();
    return;
  }

  /* Column header click: select entire column */
  if (thCol) {
    e.preventDefault();
    if (isEditing) commitEdit();
    const c = parseInt(thCol.dataset.col, 10);
    setSelectionRect(0, c, ROW_COUNT - 1, c);
    sel.r = 0; sel.c = c;
    applySelectionClasses();
    return;
  }

  /* Row header click: select entire row */
  if (thRow) {
    e.preventDefault();
    if (isEditing) commitEdit();
    const r = parseInt(thRow.dataset.row, 10);
    setSelectionRect(r, 0, r, COL_COUNT - 1);
    sel.r = r; sel.c = 0;
    applySelectionClasses();
    return;
  }

  if (!td) return;

  const r = parseInt(td.dataset.r, 10);
  const c = parseInt(td.dataset.c, 10);

  /* PICKING mode — editor is open with a formula */
  if (inPickingMode()) {
    e.preventDefault(); /* don't steal focus from editor */
    startPick(r, c);
    mouseSelecting = false;
    return;
  }

  /* If editing a non-formula, commit current edit before selecting new cell */
  if (isEditing) commitEdit();

  if (e.shiftKey) {
    setSelection(r, c, true);
  } else {
    setSelection(r, c, false);
  }
  mouseSelecting = true;
  gridWrap.focus();
  e.preventDefault();
});

gridEl.addEventListener('mousemove', (e) => {
  const td = e.target.closest('td[data-r]');
  if (!td) return;
  const r = parseInt(td.dataset.r, 10);
  const c = parseInt(td.dataset.c, 10);

  if (isPicking) {
    e.preventDefault();
    updatePick(r, c);
    return;
  }
  if (mouseSelecting) {
    if (r !== sel.r2 || c !== sel.c2) {
      setSelection(r, c, true);
    }
  }
});
window.addEventListener('mouseup', () => {
  if (isPicking) { endPick(); }
  mouseSelecting = false;
});

gridEl.addEventListener('dblclick', (e) => {
  const td = e.target.closest('td[data-r]');
  if (!td) return;
  /* If already editing, the preceding mousedown either picked a ref
     (we stay in picker mode) or committed the prior edit and moved
     selection — double-clicking the same target means "enter edit" on
     that target, after committing anything from picker mode.          */
  if (isEditing && inPickingMode()) return; /* stay in picker */
  const r = parseInt(td.dataset.r, 10);
  const c = parseInt(td.dataset.c, 10);
  if (isEditing) commitEdit();
  setSelection(r, c);
  startEdit('inline');
});

/* ============================================================================
   KEYBOARD
   ============================================================================ */
document.addEventListener('keydown', (e) => {
  /* If focus is in the formula input and user presses Enter/Tab, commit */
  if (document.activeElement === formulaInput) {
    if (e.key === 'Enter')       { e.preventDefault(); commitEdit({r: 1, c: 0}); }
    else if (e.key === 'Tab')    { e.preventDefault(); commitEdit({r: 0, c: e.shiftKey ? -1 : 1}); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    return;
  }
  if (document.activeElement === cellEditor) {
    if (e.key === 'Enter')       { e.preventDefault(); commitEdit({r: e.shiftKey ? -1 : 1, c: 0}); }
    else if (e.key === 'Tab')    { e.preventDefault(); commitEdit({r: 0, c: e.shiftKey ? -1 : 1}); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
    return;
  }

  /* If editing a sheet tab, let it be */
  if (document.activeElement && document.activeElement.isContentEditable) return;

  /* Global grid navigation */
  const k = e.key;

  if (e.ctrlKey || e.metaKey) {
    if (k === 'b' || k === 'B') { e.preventDefault(); toggleBold(); return; }
    if (k === 'i' || k === 'I') { e.preventDefault(); toggleItalic(); return; }
    if (k === 'a' || k === 'A') { e.preventDefault(); setSelectionRect(0, 0, ROW_COUNT - 1, COL_COUNT - 1); return; }
    if (k === 's' || k === 'S') { e.preventDefault(); downloadCSV(); return; }
  }

  if (k === 'ArrowUp')    { e.preventDefault(); setSelection(sel.r - 1, sel.c, e.shiftKey); return; }
  if (k === 'ArrowDown')  { e.preventDefault(); setSelection(sel.r + 1, sel.c, e.shiftKey); return; }
  if (k === 'ArrowLeft')  { e.preventDefault(); setSelection(sel.r, sel.c - 1, e.shiftKey); return; }
  if (k === 'ArrowRight') { e.preventDefault(); setSelection(sel.r, sel.c + 1, e.shiftKey); return; }
  if (k === 'Tab')        { e.preventDefault(); setSelection(sel.r, sel.c + (e.shiftKey ? -1 : 1)); return; }
  if (k === 'Enter')      { e.preventDefault(); setSelection(sel.r + (e.shiftKey ? -1 : 1), sel.c); return; }
  if (k === 'Home')       { e.preventDefault(); setSelection(sel.r, 0, e.shiftKey); return; }
  if (k === 'End')        { e.preventDefault(); setSelection(sel.r, COL_COUNT - 1, e.shiftKey); return; }
  if (k === 'PageUp')     { e.preventDefault(); setSelection(sel.r - 15, sel.c, e.shiftKey); return; }
  if (k === 'PageDown')   { e.preventDefault(); setSelection(sel.r + 15, sel.c, e.shiftKey); return; }

  if (k === 'F2') { e.preventDefault(); startEdit('inline'); return; }

  if (k === 'Delete' || k === 'Backspace') {
    e.preventDefault();
    clearSelectionContents();
    return;
  }

  /* Any printable character starts inline edit */
  if (k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    startEdit('inline', k);
    e.preventDefault();
  }
});

/* ============================================================================
   FORMULA BAR INPUT HANDLING
   ============================================================================ */
formulaInput.addEventListener('focus', () => {
  if (!isEditing) {
    /* user clicked into the formula bar — begin editing the current cell */
    const sheet = activeSheet();
    const id = cellId(sel.r, sel.c);
    const cell = getCell(sheet, id);
    isEditing = true;
    editInline = false;
    editStart = { r: sel.r, c: sel.c };
    editInitialRaw = cell ? (cell.formula !== null ? cell.formula : cell.raw) : '';
    formulaInput.value = editInitialRaw;
  }
});
formulaInput.addEventListener('blur', () => {
  /* blur happens on focus change (commit/cancel). Do nothing if already finished. */
  if (isEditing && !isPicking) {
    /* don't auto-commit on blur; explicit Enter/Tab commits. But if user clicks outside into a non-editable zone, we commit silently. */
  }
});

/* While typing in the formula, if picker was active, it may be stale */
formulaInput.addEventListener('input', () => {
  if (isEditing && !isPicking) {
    /* user modified manually — reset picker ref position to caret */
    pickAnchor = null;
    pickInsertLen = 0;
    clearPickerHighlight();
  }
});
cellEditor.addEventListener('input', () => {
  if (isEditing && !isPicking) {
    pickAnchor = null;
    pickInsertLen = 0;
    clearPickerHighlight();
  }
});

/* ============================================================================
   COLUMN RESIZE
   ============================================================================ */
function startColResize(e, c) {
  e.preventDefault();
  const startX = e.clientX;
  const col = colEls[c];
  const startW = col.offsetWidth;
  document.body.style.cursor = 'col-resize';
  function onMove(ev) {
    const w = Math.max(30, startW + ev.clientX - startX);
    col.style.width = w + 'px';
  }
  function onUp(ev) {
    const w = Math.max(30, startW + ev.clientX - startX);
    activeSheet().colWidths[c] = w;
    document.body.style.cursor = '';
    window.removeEventListener('mousemove', onMove);
    window.removeEventListener('mouseup', onUp);
  }
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
}

/* ============================================================================
   TOOLBAR ACTIONS
   ============================================================================ */
function forSelectionCells(fn) {
  const sheet = activeSheet();
  const { r1, c1, r2, c2 } = selRect();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const id = cellId(r, c);
      fn(ensureCell(sheet, id), id, sheet);
    }
  }
}

function toggleBold() {
  /* if any selected cell is NOT bold, make all bold; else unbold all */
  const sheet = activeSheet();
  const { r1, c1, r2, c2 } = selRect();
  let allBold = true;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const cell = getCell(sheet, cellId(r, c));
      if (!cell || !cell.bold) { allBold = false; break; }
    }
  const target = !allBold;
  forSelectionCells((cell, id, sh) => {
    cell.bold = target;
    if (cell.raw === '' && !cell.bold && !cell.italic && !cell.bg) delete sh.cells[id];
    redrawCell(sh, id);
  });
  $('#btn-bold').classList.toggle('active', target);
}
function toggleItalic() {
  const sheet = activeSheet();
  const { r1, c1, r2, c2 } = selRect();
  let allIt = true;
  for (let r = r1; r <= r2; r++)
    for (let c = c1; c <= c2; c++) {
      const cell = getCell(sheet, cellId(r, c));
      if (!cell || !cell.italic) { allIt = false; break; }
    }
  const target = !allIt;
  forSelectionCells((cell, id, sh) => {
    cell.italic = target;
    if (cell.raw === '' && !cell.bold && !cell.italic && !cell.bg) delete sh.cells[id];
    redrawCell(sh, id);
  });
  $('#btn-italic').classList.toggle('active', target);
}
function setBackground(color) {
  forSelectionCells((cell, id, sh) => {
    cell.bg = color;
    redrawCell(sh, id);
  });
  $('#swatch-chip').style.background = color;
}
function clearBackground() {
  forSelectionCells((cell, id, sh) => {
    cell.bg = null;
    if (cell.raw === '' && !cell.bold && !cell.italic && !cell.bg) delete sh.cells[id];
    redrawCell(sh, id);
  });
}
function clearSelectionContents() {
  const sheet = activeSheet();
  const { r1, c1, r2, c2 } = selRect();
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const id = cellId(r, c);
      if (sheet.cells[id]) setCellRaw(sheet, id, '');
    }
  }
  updateFormulaBar();
}

$('#btn-bold').addEventListener('click', toggleBold);
$('#btn-italic').addEventListener('click', toggleItalic);
$('#btn-clear').addEventListener('click', clearSelectionContents);
$('#btn-clear-bg').addEventListener('click', clearBackground);
$('#bg-picker').addEventListener('input', (e) => setBackground(e.target.value));

/* Keep bold/italic toggle buttons in sync with selection */
function syncToolbarState() {
  const sheet = activeSheet();
  const cell = getCell(sheet, cellId(sel.r, sel.c));
  $('#btn-bold').classList.toggle('active', !!(cell && cell.bold));
  $('#btn-italic').classList.toggle('active', !!(cell && cell.italic));
  if (cell && cell.bg) $('#swatch-chip').style.background = cell.bg;
}

/* ============================================================================
   CSV IMPORT / EXPORT
   ============================================================================ */
function csvEscape(s) {
  s = s == null ? '' : String(s);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function downloadCSV() {
  const sheet = activeSheet();
  /* find extents */
  let maxR = -1, maxC = -1;
  for (const id of Object.keys(sheet.cells)) {
    const cell = sheet.cells[id];
    const hasContent = cell.raw !== '' || cell.formula !== null;
    if (!hasContent) continue;
    const ref = parseCellRef(id);
    if (!ref) continue;
    if (ref.r > maxR) maxR = ref.r;
    if (ref.c > maxC) maxC = ref.c;
  }
  if (maxR < 0 || maxC < 0) {
    showToast('Sheet is empty'); return;
  }
  const lines = [];
  for (let r = 0; r <= maxR; r++) {
    const row = [];
    for (let c = 0; c <= maxC; c++) {
      const cell = getCell(sheet, cellId(r, c));
      let val = '';
      if (cell) {
        if (cell.formula !== null) {
          try {
            const v = getCellValue(sheet, cellId(r, c), new Set());
            if (v && v.isFormulaError) val = v.code;
            else if (typeof v === 'number') val = formatNumber(v);
            else val = toString(v);
          } catch (e) {
            val = (e && e.code) || '#ERROR';
          }
        } else {
          val = cell.raw || '';
        }
      }
      row.push(csvEscape(val));
    }
    lines.push(row.join(','));
  }
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (sheet.name || 'sheet').replace(/[\\/:*?"<>|]/g, '_') + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  showToast('Exported ' + a.download);
}

function parseCSV(text) {
  /* RFC 4180-ish parser */
  const rows = [];
  let cur = [''], inQ = false, i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur[cur.length-1] += '"'; i += 2; continue; }
        inQ = false; i++; continue;
      }
      cur[cur.length-1] += ch; i++; continue;
    }
    if (ch === '"') { inQ = true; i++; continue; }
    if (ch === ',') { cur.push(''); i++; continue; }
    if (ch === '\r') { i++; continue; }
    if (ch === '\n') { rows.push(cur); cur = ['']; i++; continue; }
    cur[cur.length-1] += ch; i++;
  }
  if (cur.length > 1 || cur[0] !== '') rows.push(cur);
  return rows;
}

$('#btn-download').addEventListener('click', downloadCSV);
$('#btn-upload').addEventListener('click', () => $('#file-input').click());
$('#file-input').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCSV(reader.result);
    const sheet = activeSheet();
    /* clear sheet */
    for (const id of Object.keys(sheet.cells)) delete sheet.cells[id];
    sheet.deps = {}; sheet.dependents = {};
    /* fill */
    const maxRows = Math.min(rows.length, ROW_COUNT);
    for (let r = 0; r < maxRows; r++) {
      const row = rows[r];
      const maxCols = Math.min(row.length, COL_COUNT);
      for (let c = 0; c < maxCols; c++) {
        const v = row[c];
        if (v === '' || v == null) continue;
        setCellRaw(sheet, cellId(r, c), v);
      }
    }
    redrawSheet();
    showToast('Imported ' + f.name + ' — ' + maxRows + ' rows');
  };
  reader.readAsText(f);
  e.target.value = '';
});

/* ============================================================================
   SHEET TABS
   ============================================================================ */
const sheetTabsContainer = $('#sheet-tabs-container');
function renderSheetTabs() {
  sheetTabsContainer.innerHTML = '';
  workbook.sheets.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'sheet-tab' + (i === workbook.active ? ' active' : '');
    el.textContent = s.name;
    el.dataset.index = String(i);
    sheetTabsContainer.appendChild(el);
  });
}

sheetTabsContainer.addEventListener('click', (e) => {
  const t = e.target.closest('.sheet-tab');
  if (!t) return;
  if (t.isContentEditable) return; /* don't switch during rename */
  const i = parseInt(t.dataset.index, 10);
  switchSheet(i);
});

sheetTabsContainer.addEventListener('dblclick', (e) => {
  const t = e.target.closest('.sheet-tab');
  if (!t) return;
  renameSheetTab(t);
});

sheetTabsContainer.addEventListener('contextmenu', (e) => {
  const t = e.target.closest('.sheet-tab');
  if (!t) return;
  e.preventDefault();
  openCtxMenu(e.clientX, e.clientY, [
    { label: 'Rename',  onClick: () => renameSheetTab(t) },
    { label: 'Duplicate', onClick: () => duplicateSheet(parseInt(t.dataset.index, 10)) },
    { sep: true },
    { label: 'Delete', danger: true, onClick: () => deleteSheet(parseInt(t.dataset.index, 10)) }
  ]);
});

function renameSheetTab(tabEl) {
  const i = parseInt(tabEl.dataset.index, 10);
  const original = workbook.sheets[i].name;
  tabEl.contentEditable = 'true';
  tabEl.focus();
  /* select text */
  const range = document.createRange(); range.selectNodeContents(tabEl);
  const selObj = window.getSelection(); selObj.removeAllRanges(); selObj.addRange(range);

  function finish(commit) {
    tabEl.contentEditable = 'false';
    tabEl.removeEventListener('keydown', onKey);
    tabEl.removeEventListener('blur', onBlur);
    const newName = tabEl.textContent.trim();
    if (commit && newName && !workbook.sheets.some((s, j) => j !== i && s.name === newName)) {
      workbook.sheets[i].name = newName;
    }
    renderSheetTabs();
  }
  function onKey(ev) {
    if (ev.key === 'Enter')   { ev.preventDefault(); finish(true); }
    if (ev.key === 'Escape')  { ev.preventDefault(); tabEl.textContent = original; finish(false); }
  }
  function onBlur() { finish(true); }
  tabEl.addEventListener('keydown', onKey);
  tabEl.addEventListener('blur', onBlur);
}

function switchSheet(i) {
  if (i < 0 || i >= workbook.sheets.length) return;
  if (isEditing) commitEdit();
  workbook.active = i;
  sel = { r: 0, c: 0, r2: 0, c2: 0 };
  anchor = { r: 0, c: 0 };
  redrawSheet();
  renderSheetTabs();
  syncToolbarState();
}
function addSheet() {
  let n = workbook.sheets.length + 1;
  while (workbook.sheets.some(s => s.name === 'Sheet' + n)) n++;
  workbook.sheets.push(makeSheet('Sheet' + n));
  switchSheet(workbook.sheets.length - 1);
}
function duplicateSheet(i) {
  const src = workbook.sheets[i];
  const copy = makeSheet(src.name + ' (copy)');
  for (const id of Object.keys(src.cells)) copy.cells[id] = JSON.parse(JSON.stringify({ ...src.cells[id], ast: null, cachedValue: undefined }));
  for (const id of Object.keys(copy.cells)) {
    const c = copy.cells[id];
    /* re-parse formulas for the copy */
    if (c.formula !== null) {
      try { c.ast = parseFormula(c.formula); c.refs = new Set(); extractRefs(c.ast, c.refs); }
      catch { c.ast = null; c.refs = null; }
    }
    c.cachedValue = undefined;
  }
  /* rebuild deps */
  for (const id of Object.keys(copy.cells)) {
    const c = copy.cells[id];
    if (c.refs) updateDeps(copy, id, c.refs);
  }
  copy.colWidths = { ...src.colWidths };
  workbook.sheets.splice(i + 1, 0, copy);
  switchSheet(i + 1);
}
function deleteSheet(i) {
  if (workbook.sheets.length <= 1) { showToast("Can't delete the last sheet"); return; }
  if (!confirm('Delete sheet "' + workbook.sheets[i].name + '"?')) return;
  workbook.sheets.splice(i, 1);
  if (workbook.active >= workbook.sheets.length) workbook.active = workbook.sheets.length - 1;
  else if (workbook.active > i) workbook.active -= 1;
  switchSheet(workbook.active);
}

$('#sheet-add').addEventListener('click', addSheet);

/* ============================================================================
   CONTEXT MENU
   ============================================================================ */
const ctxMenu = $('#ctx-menu');
function openCtxMenu(x, y, items) {
  ctxMenu.innerHTML = '';
  for (const it of items) {
    if (it.sep) {
      const d = document.createElement('div'); d.className = 'ctx-sep';
      ctxMenu.appendChild(d);
    } else {
      const d = document.createElement('div');
      d.className = 'ctx-item' + (it.danger ? ' danger' : '');
      d.textContent = it.label;
      d.addEventListener('click', () => { closeCtxMenu(); it.onClick(); });
      ctxMenu.appendChild(d);
    }
  }
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top  = y + 'px';
  ctxMenu.classList.add('visible');
}
function closeCtxMenu() { ctxMenu.classList.remove('visible'); }
document.addEventListener('mousedown', (e) => {
  if (!ctxMenu.contains(e.target)) closeCtxMenu();
});

/* ============================================================================
   TOAST
   ============================================================================ */
let toastTimer = null;
function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('visible'), 1800);
}

/* ============================================================================
   STATUS BAR
   ============================================================================ */
function updateStatusRight() {
  const sheet = activeSheet();
  const { r1, c1, r2, c2 } = selRect();
  const count = (r2 - r1 + 1) * (c2 - c1 + 1);
  if (count === 1) {
    statusRight.textContent = 'Ready · ' + cellId(sel.r, sel.c);
    return;
  }
  /* compute sum/avg/count of numeric cells in selection */
  let sum = 0, nums = 0, nonempty = 0;
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      const id = cellId(r, c);
      const cell = getCell(sheet, id);
      if (!cell) continue;
      nonempty++;
      try {
        const v = cell.formula !== null ? getCellValue(sheet, id, new Set()) : (() => {
          const n = parseFloat(cell.raw);
          return (!isNaN(n) && /^\s*-?\d+(\.\d+)?(e[+-]?\d+)?\s*$/i.test(cell.raw)) ? n : cell.raw;
        })();
        if (typeof v === 'number') { sum += v; nums++; }
      } catch (e) { /* ignore */ }
    }
  }
  const parts = ['Sel: ' + count];
  if (nums > 0) {
    parts.push('Sum ' + formatNumber(sum));
    parts.push('Avg ' + formatNumber(sum / nums));
    parts.push('n=' + nums);
  } else if (nonempty > 0) {
    parts.push('CountA ' + nonempty);
  }
  statusRight.textContent = parts.join(' · ');
}

/* Hook into selection changes */
const origApply = applySelectionClasses;
function decoratedApply() {
  origApply();
  syncToolbarState();
  updateStatusRight();
}
/* Replace all callers by reassignment in strict mode is tricky — just call directly */
/* we'll instead wrap at the end */

  const rows = [
    ['Product',    'Price',  'Qty',   'Total',            'Tax (8%)',        'With tax'],
    ['Coffee',     '3.50',   '12',    '=B2*C2',           '=D2*0.08',        '=D2+E2'],
    ['Tea',        '2.75',   '8',     '=B3*C3',           '=D3*0.08',        '=D3+E3'],
    ['Croissant',  '4.20',   '15',    '=B4*C4',           '=D4*0.08',        '=D4+E4'],
    ['Muffin',     '3.00',   '20',    '=B5*C5',           '=D5*0.08',        '=D5+E5'],
    ['Bagel',      '2.50',   '10',    '=B6*C6',           '=D6*0.08',        '=D6+E6'],
    ['',           '',       '',      '',                 '',                 ''],
    ['',           '',       'Sum',   '=SUM(D2:D6)',      '=SUM(E2:E6)',     '=SUM(F2:F6)'],
    ['',           '',       'Avg',   '=AVERAGE(D2:D6)',  '',                 ''],
    ['',           '',       'Min',   '=MIN(D2:D6)',      '',                 ''],
    ['',           '',       'Max',   '=MAX(D2:D6)',      '',                 ''],
  ];
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      if (rows[r][c] !== '') setCellRaw(s, cellId(r, c), rows[r][c]);
    }
  }
  /* style header row */
  for (let c = 0; c < 6; c++) {
    const cell = ensureCell(s, cellId(0, c));
    cell.bold = true;
    cell.bg = '#e9f3ec';
    redrawCell(s, cellId(0, c));
  }
  /* style summary labels */
  for (let r = 7; r <= 10; r++) {
    const cell = ensureCell(s, cellId(r, 2));
    cell.bold = true;
    redrawCell(s, cellId(r, 2));
  }
  /* widen first column */
  s.colWidths[0] = 110;
  colEls[0].style.width = '110px';
}

/* ============================================================================
   BOOT
   ============================================================================ */
buildGrid();
renderSheetTabs();
loadDemo();

/* set initial swatch + picker default */
$('#swatch-chip').style.background = '#fff8b5';

/* Wrap selection applier to also sync toolbar + status */
const realApply = applySelectionClasses;
applySelectionClasses = function() {
  realApply();
  syncToolbarState();
  updateStatusRight();
};

gridWrap.tabIndex = 0;
setSelection(0, 0);

/* Block default browser behaviour on backspace when grid has focus (history nav) */
window.addEventListener('keydown', (e) => {
  if (e.key === 'Backspace' && !(document.activeElement instanceof HTMLInputElement) &&
      !(document.activeElement && document.activeElement.isContentEditable)) {
    e.preventDefault();
  }
}, true);

/* Focus grid when clicking blank area */
gridWrap.addEventListener('click', (e) => {
  if (e.target === gridWrap) gridWrap.focus();
});
