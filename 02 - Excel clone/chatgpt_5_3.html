<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Excel Clone</title>
<style>
body { margin:0; font-family: Arial; }
.toolbar { padding:8px; background:#f3f3f3; border-bottom:1px solid #ccc; }
.toolbar button { margin-right:6px; }
.formula-bar { display:flex; border-bottom:1px solid #ccc; }
#cellName { width:80px; border-right:1px solid #ccc; padding:6px; }
#formulaInput { flex:1; padding:6px; border:none; outline:none; }
.grid { overflow:auto; height:70vh; }
table { border-collapse:collapse; }
th, td { border:1px solid #ddd; min-width:80px; height:24px; padding:2px; }
th { background:#f0f0f0; text-align:center; }
td { cursor:text; }
td.selected { outline:2px solid #4a90e2; }
.sheet-tabs { padding:5px; border-top:1px solid #ccc; }
.sheet-tabs button { margin-right:5px; }
</style>
</head>
<body>

<div class="toolbar">
<button onclick="formatCell('bold')">Bold</button>
<button onclick="formatCell('italic')">Italic</button>
<button onclick="clearCell()">Clear</button>
<input type="color" onchange="setBg(this.value)">
<button onclick="downloadCSV()">Download CSV</button>
<input type="file" onchange="uploadCSV(event)">
</div>

<div class="formula-bar">
<div id="cellName">A1</div>
<input id="formulaInput">
</div>

<div class="grid">
<table id="sheet"></table>
</div>

<div class="sheet-tabs" id="tabs"></div>

<script>
const ROWS = 50, COLS = 26;
let sheets = [{name:"Sheet1", cells:{}}];
let currentSheet = 0;
let selected = {row:0,col:0};
let selecting = false;
let selectionStart = null;

const sheetEl = document.getElementById("sheet");
const formulaInput = document.getElementById("formulaInput");
const cellNameEl = document.getElementById("cellName");

function colName(c){
    let s="";
    while(c>=0){ s=String.fromCharCode(65+(c%26))+s; c=Math.floor(c/26)-1;}
    return s;
}

function addr(r,c){ return colName(c)+(r+1); }

function parseAddr(a){
    const m = a.match(/([A-Z]+)(\d+)/);
    let col = 0;
    for(let i=0;i<m[1].length;i++) col = col*26 + (m[1].charCodeAt(i)-64);
    return {row:parseInt(m[2])-1, col:col-1};
}

function buildGrid(){
    sheetEl.innerHTML="";
    let tr = document.createElement("tr");
    tr.appendChild(document.createElement("th"));
    for(let c=0;c<COLS;c++){
        let th=document.createElement("th");
        th.textContent=colName(c);
        th.onmousedown = e=>startColResize(e,c);
        tr.appendChild(th);
    }
    sheetEl.appendChild(tr);

    for(let r=0;r<ROWS;r++){
        let tr=document.createElement("tr");
        let th=document.createElement("th");
        th.textContent=r+1;
        tr.appendChild(th);

        for(let c=0;c<COLS;c++){
            let td=document.createElement("td");
            td.contentEditable=true;

            td.onclick = ()=>selectCell(r,c);
            td.oninput = ()=>updateCell(r,c,td.textContent);
            td.onmousedown = ()=>startSelection(r,c);
            td.onmouseover = ()=>dragSelection(r,c);

            tr.appendChild(td);
        }
        sheetEl.appendChild(tr);
    }
}

function selectCell(r,c){
    selected={row:r,col:c};
    updateUI();
}

function updateUI(){
    document.querySelectorAll("td").forEach(td=>td.classList.remove("selected"));
    const td=getCellEl(selected.row,selected.col);
    td.classList.add("selected");

    const a=addr(selected.row,selected.col);
    cellNameEl.textContent=a;
    formulaInput.value = getCell(a)?.formula || getCell(a)?.value || "";
}

function getCellEl(r,c){
    return sheetEl.rows[r+1].cells[c+1];
}

function getCell(a){
    return sheets[currentSheet].cells[a];
}

function setCell(a, data){
    sheets[currentSheet].cells[a]=data;
}

function updateCell(r,c,value){
    const a=addr(r,c);
    if(value.startsWith("=")){
        setCell(a,{formula:value});
    } else {
        setCell(a,{value:value});
    }
    recalc();
}

function evalFormula(f){
    try{
        let expr=f.slice(1);

        expr = expr.replace(/([A-Z]+\d+):([A-Z]+\d+)/g,(m,a,b)=>{
            let s=parseAddr(a), e=parseAddr(b);
            let vals=[];
            for(let r=s.row;r<=e.row;r++)
                for(let c=s.col;c<=e.col;c++)
                    vals.push(Number(getValue(addr(r,c)))||0);
            return "["+vals.join(",")+"]";
        });

        expr = expr.replace(/SUM\((.*?)\)/g,"($1.reduce((a,b)=>a+b,0))");
        expr = expr.replace(/AVERAGE\((.*?)\)/g,"($1.reduce((a,b)=>a+b,0)/$1.length)");
        expr = expr.replace(/MIN\((.*?)\)/g,"Math.min(...$1)");
        expr = expr.replace(/MAX\((.*?)\)/g,"Math.max(...$1)");

        expr = expr.replace(/([A-Z]+\d+)/g,a=>Number(getValue(a))||0);

        return eval(expr);
    }catch{ return "ERR"; }
}

function getValue(a){
    const cell=getCell(a);
    if(!cell) return "";
    if(cell.formula) return evalFormula(cell.formula);
    return cell.value || "";
}

function recalc(){
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const a=addr(r,c);
            const td=getCellEl(r,c);
            td.textContent = getValue(a);
        }
    }
}

formulaInput.oninput = ()=>{
    updateCell(selected.row,selected.col,formulaInput.value);
};

function startSelection(r,c){
    selecting=true;
    selectionStart={row:r,col:c};
}

function dragSelection(r,c){
    if(!selecting) return;
    const start=selectionStart;
    selectRange(start.row,start.col,r,c);
}

document.body.onmouseup = ()=> selecting=false;

function selectRange(r1,c1,r2,c2){
    document.querySelectorAll("td").forEach(td=>td.classList.remove("selected"));
    for(let r=Math.min(r1,r2);r<=Math.max(r1,r2);r++){
        for(let c=Math.min(c1,c2);c<=Math.max(c1,c2);c++){
            getCellEl(r,c).classList.add("selected");
        }
    }

    if(formulaInput.value.startsWith("=")){
        const a1=addr(Math.min(r1,r2),Math.min(c1,c2));
        const a2=addr(Math.max(r1,r2),Math.max(c1,c2));
        formulaInput.value += a1===a2 ? a1 : `${a1}:${a2}`;
    }
}

document.addEventListener("keydown", e=>{
    let {row,col}=selected;
    if(e.key==="ArrowDown") row++;
    if(e.key==="ArrowUp") row--;
    if(e.key==="ArrowRight") col++;
    if(e.key==="ArrowLeft") col--;
    if(e.key==="Enter") row++;
    if(e.key==="Tab") col++;

    row=Math.max(0,Math.min(ROWS-1,row));
    col=Math.max(0,Math.min(COLS-1,col));
    selectCell(row,col);
});

function formatCell(type){
    const td=getCellEl(selected.row,selected.col);
    td.style[type] = td.style[type]==="bold"?"":"bold";
}

function setBg(color){
    getCellEl(selected.row,selected.col).style.background=color;
}

function clearCell(){
    const a=addr(selected.row,selected.col);
    delete sheets[currentSheet].cells[a];
    recalc();
}

function downloadCSV(){
    let csv="";
    for(let r=0;r<ROWS;r++){
        let row=[];
        for(let c=0;c<COLS;c++){
            row.push(getValue(addr(r,c)));
        }
        csv+=row.join(",")+"\n";
    }
    const blob=new Blob([csv]);
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="sheet.csv";
    a.click();
}

function uploadCSV(e){
    const file=e.target.files[0];
    const reader=new FileReader();
    reader.onload=()=>{
        const lines=reader.result.split("\n");
        lines.forEach((line,r)=>{
            line.split(",").forEach((val,c)=>{
                setCell(addr(r,c),{value:val});
            });
        });
        recalc();
    };
    reader.readAsText(file);
}

function renderTabs(){
    const tabs=document.getElementById("tabs");
    tabs.innerHTML="";
    sheets.forEach((s,i)=>{
        let b=document.createElement("button");
        b.textContent=s.name;
        b.onclick=()=>{currentSheet=i; buildGrid(); recalc();};
        tabs.appendChild(b);
    });
    let add=document.createElement("button");
    add.textContent="+";
    add.onclick=()=>{
        sheets.push({name:"Sheet"+(sheets.length+1),cells:{}});
        renderTabs();
    };
    tabs.appendChild(add);
}

buildGrid();
renderTabs();
selectCell(0,0);
</script>

</body>
</html>
