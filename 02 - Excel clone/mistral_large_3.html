                        this.grid.scrollTop -= gridRect.top - cellRect.top;
                    } else if (cellRect.bottom > gridRect.bottom) {
                        this.grid.scrollTop += cellRect.bottom - gridRect.bottom;
                    }
                }

                // Context menu actions
                performContextMenuAction(action) {
                    const selectionStart = this.contextMenu.dataset.selectionStart ?
                        this.contextMenu.dataset.selectionStart.split(',').map(Number) : null;
                    const selectionEnd = this.contextMenu.dataset.selectionEnd ?
                        this.contextMenu.dataset.selectionEnd.split(',').map(Number) : null;

                    if (!selectionStart) return;

                    const startRow = selectionStart[0];
                    const startCol = selectionStart[1];
                    const endRow = selectionEnd ? selectionEnd[0] : startRow;
                    const endCol = selectionEnd ? selectionEnd[1] : startCol;

                    switch (action) {
                        case 'cut':
                            this.cutSelection(startRow, startCol, endRow, endCol);
                            break;
                        case 'copy':
                            this.copySelection(startRow, startCol, endRow, endCol);
                            break;
                        case 'paste':
                            this.pasteSelection();
                            break;
                        case 'insert-row':
                            this.insertRow(startRow);
                            break;
                        case 'insert-column':
                            this.insertColumn(startCol);
                            break;
                        case 'delete-row':
                            this.deleteRow(startRow);
                            break;
                        case 'delete-column':
                            this.deleteColumn(startCol);
                            break;
                        case 'clear':
                            this.clearSelectedCells();
                            break;
                    }

                    this.hideContextMenu();
                }

                cutSelection(startRow, startCol, endRow, endCol) {
                    this.copySelection(startRow, startCol, endRow, endCol);
                    this.clearSelectedCells();
                }

                copySelection(startRow, startCol, endRow, endCol) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const data = [];

                    for (let row = startRow; row <= endRow; row++) {
                        const rowData = [];
                        for (let col = startCol; col <= endCol; col++) {
                            const cell = this.getCell(row, col);
                            const format = this.getCellFormat(row, col);
                            rowData.push({
                                value: cell ? cell.value : null,
                                formula: cell ? cell.formula : false,
                                format: format
                            });
                        }
                        data.push(rowData);
                    }

                    this.clipboard = {
                        data: data,
                        rows: endRow - startRow + 1,
                        cols: endCol - startCol + 1
                    };
                }

                pasteSelection() {
                    if (!this.clipboard) return;

                    const startRow = this.activeCell.row;
                    const startCol = this.activeCell.col;
                    const sheet = this.sheets[this.activeSheetIndex];

                    for (let row = 0; row < this.clipboard.rows && startRow + row < sheet.numRows; row++) {
                        for (let col = 0; col < this.clipboard.cols && startCol + col < sheet.numCols; col++) {
                            const cellData = this.clipboard.data[row][col];
                            if (cellData.value !== null) {
                                this.setCell(startRow + row, startCol + col, cellData.value, cellData.formula);
                                if (cellData.format) {
                                    this.setCellFormat(startRow + row, startCol + col, cellData.format);
                                }
                            } else {
                                this.setCell(startRow + row, startCol + col, null);
                                this.clearCellFormat(startRow + row, startCol + col);
                            }
                        }
                    }
                }
            }

            // Initialize the spreadsheet
            const spreadsheet = new Spreadsheet();

            // Handle context menu actions
            document.getElementById('context-menu').addEventListener('click', (e) => {
                const item = e.target.closest('.context-menu-item');
                if (item) {
                    const action = item.dataset.action;
                    spreadsheet.performContextMenuAction(action);
                }
            });
        });
    </script>
</body>
