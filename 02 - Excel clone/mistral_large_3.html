<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Clone</title>
    <style>
        :root {
            --primary-color: #2b579a;
            --primary-hover: #1a3e72;
            --secondary-color: #f1f1f1;
            --border-color: #d1d1d1;
            --text-color: #333;
            --formula-color: #217346;
            --error-color: #c00;
            --toolbar-height: 40px;
            --formula-bar-height: 30px;
            --cell-height: 25px;
            --header-height: 25px;
            --tab-height: 30px;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            background-color: #f5f5f5;
        }

        .toolbar {
            display: flex;
            height: var(--toolbar-height);
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0 5px;
            align-items: center;
            gap: 5px;
        }

        .toolbar-group {
            display: flex;
            gap: 2px;
            margin-right: 10px;
        }

        .toolbar button {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 14px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar button:hover {
            background-color: #e5e5e5;
        }

        .toolbar button.active {
            background-color: #d1d1d1;
        }

        .toolbar input[type="color"] {
            width: 30px;
            height: 28px;
            padding: 0;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .formula-bar {
            display: flex;
            height: var(--formula-bar-height);
            background-color: white;
            border-bottom: 1px solid var(--border-color);
            padding: 0 5px;
            align-items: center;
        }

        .cell-reference {
            width: 80px;
            padding: 0 5px;
            font-weight: bold;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .formula-input {
            flex: 1;
            height: 100%;
            padding: 0 5px;
            border: none;
            font-size: 14px;
        }

        .formula-input:focus {
            outline: none;
            border: 1px solid var(--primary-color);
        }

        .spreadsheet-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .sheets-container {
            display: flex;
            height: var(--tab-height);
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .sheet-tab {
            padding: 0 10px;
            height: 100%;
            display: flex;
            align-items: center;
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            background-color: #e0e0e0;
            position: relative;
        }

        .sheet-tab.active {
            background-color: white;
            border-top: 2px solid var(--primary-color);
        }

        .sheet-tab input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 10px;
            border: none;
            background: transparent;
            font-size: 14px;
        }

        .sheet-tab-buttons {
            display: flex;
            margin-left: auto;
        }

        .sheet-tab-button {
            width: 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-left: 1px solid var(--border-color);
        }

        .sheet-tab-button:hover {
            background-color: #d1d1d1;
        }

        .grid-container {
            display: flex;
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .column-headers {
            position: sticky;
            top: 0;
            z-index: 2;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
        }

        .row-header {
            position: sticky;
            left: 0;
            z-index: 2;
            background-color: var(--secondary-color);
            border-bottom: 1px solid var(--border-color);
        }

        .header-cell {
            width: 80px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            font-weight: bold;
            user-select: none;
            cursor: pointer;
        }

        .header-cell:hover {
            background-color: #d1d1d1;
        }

        .column-resizer {
            position: absolute;
            top: 0;
            right: 0;
            width: 5px;
            height: 100%;
            background-color: transparent;
            cursor: col-resize;
            z-index: 3;
        }

        .column-resizer.active {
            background-color: var(--primary-color);
        }

        .grid {
            display: grid;
            position: relative;
        }

        .cell {
            min-width: 80px;
            height: var(--cell-height);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            padding: 0 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            background-color: white;
        }

        .cell.selected {
            border: 2px solid var(--primary-color);
            z-index: 1;
        }

        .cell.editing {
            padding: 0;
        }

        .cell-input {
            width: 100%;
            height: 100%;
            padding: 0 5px;
            border: none;
            font-size: 14px;
        }

        .cell-input:focus {
            outline: none;
        }

        .cell.range-start {
            border-top: 2px solid var(--primary-color);
            border-left: 2px solid var(--primary-color);
        }

        .cell.range-end {
            border-bottom: 2px solid var(--primary-color);
            border-right: 2px solid var(--primary-color);
        }

        .cell.range-middle {
            border-top: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .cell.range-middle-left {
            border-top: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            border-left: 2px solid var(--primary-color);
        }

        .cell.range-middle-right {
            border-top: 2px solid var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            border-right: 2px solid var(--primary-color);
        }

        .selection-highlight {
            position: absolute;
            background-color: rgba(180, 210, 255, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        .formula-highlight {
            position: absolute;
            background-color: rgba(255, 210, 180, 0.3);
            pointer-events: none;
            z-index: 0;
        }

        .status-bar {
            height: 25px;
            background-color: var(--secondary-color);
            border-top: 1px solid var(--border-color);
            padding: 0 5px;
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .context-menu {
            position: absolute;
            background-color: white;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 100;
            display: none;
        }

        .context-menu-item {
            padding: 5px 10px;
            cursor: pointer;
        }

        .context-menu-item:hover {
            background-color: #e5e5e5;
        }

        .context-menu-divider {
            height: 1px;
            background-color: var(--border-color);
            margin: 2px 0;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .error {
            color: var(--error-color);
        }

        .formula {
            color: var(--formula-color);
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div class="toolbar-group">
            <button id="bold-btn" title="Bold (Ctrl+B)">
                <span class="bold">B</span>
            </button>
            <button id="italic-btn" title="Italic (Ctrl+I)">
                <span class="italic">I</span>
            </button>
        </div>
        <div class="toolbar-group">
            <input type="color" id="bg-color-picker" title="Background Color">
        </div>
        <div class="toolbar-group">
            <button id="clear-btn" title="Clear Contents (Delete)">Clear</button>
        </div>
        <div class="toolbar-group" style="margin-left: auto;">
            <button id="download-btn" title="Download as CSV">Download CSV</button>
            <button id="upload-btn" title="Upload CSV">
                Upload CSV
                <input type="file" id="file-input" accept=".csv" style="display: none;">
            </button>
        </div>
    </div>

    <div class="formula-bar">
        <div class="cell-reference" id="active-cell-ref">A1</div>
        <input type="text" class="formula-input" id="formula-input" placeholder="Enter formula or value">
    </div>

    <div class="spreadsheet-container">
        <div class="sheets-container" id="sheets-container">
            <div class="sheet-tab active" data-sheet-id="0">
                <span>Sheet1</span>
                <input type="text" style="display: none;">
            </div>
            <div class="sheet-tab-buttons">
                <div class="sheet-tab-button" id="add-sheet-btn" title="Add Sheet">+</div>
            </div>
        </div>

        <div class="grid-container">
            <div class="column-headers" id="column-headers"></div>
            <div class="row-header" id="row-header"></div>
            <div class="grid" id="grid"></div>
        </div>
    </div>

    <div class="status-bar" id="status-bar">Ready</div>

    <div class="context-menu" id="context-menu">
        <div class="context-menu-item" data-action="cut">Cut</div>
        <div class="context-menu-item" data-action="copy">Copy</div>
        <div class="context-menu-item" data-action="paste">Paste</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="insert-row">Insert Row</div>
        <div class="context-menu-item" data-action="insert-column">Insert Column</div>
        <div class="context-menu-item" data-action="delete-row">Delete Row</div>
        <div class="context-menu-item" data-action="delete-column">Delete Column</div>
        <div class="context-menu-divider"></div>
        <div class="context-menu-item" data-action="clear">Clear Contents</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Main spreadsheet application
            class Spreadsheet {
                constructor() {
                    this.sheets = [];
                    this.activeSheetIndex = 0;
                    this.activeCell = { row: 0, col: 0 };
                    this.selectionStart = null;
                    this.selectionEnd = null;
                    this.isSelecting = false;
                    this.isEditing = false;
                    this.isResizing = false;
                    this.resizeCol = null;
                    this.resizeStartX = 0;
                    this.resizeStartWidth = 0;
                    this.clipboard = null;
                    this.formulaMode = false;
                    this.formulaRangeSelect = false;
                    this.formulaRangeStart = null;
                    this.formulaRangeEnd = null;

                    this.initUI();
                    this.createSheet('Sheet1');
                    this.renderSheets();
                    this.renderGrid();
                    this.setupEventListeners();
                }

                initUI() {
                    this.columnHeaders = document.getElementById('column-headers');
                    this.rowHeader = document.getElementById('row-header');
                    this.grid = document.getElementById('grid');
                    this.sheetsContainer = document.getElementById('sheets-container');
                    this.activeCellRef = document.getElementById('active-cell-ref');
                    this.formulaInput = document.getElementById('formula-input');
                    this.statusBar = document.getElementById('status-bar');
                    this.contextMenu = document.getElementById('context-menu');
                    this.boldBtn = document.getElementById('bold-btn');
                    this.italicBtn = document.getElementById('italic-btn');
                    this.bgColorPicker = document.getElementById('bg-color-picker');
                    this.clearBtn = document.getElementById('clear-btn');
                    this.downloadBtn = document.getElementById('download-btn');
                    this.uploadBtn = document.getElementById('upload-btn');
                    this.fileInput = document.getElementById('file-input');
                    this.addSheetBtn = document.getElementById('add-sheet-btn');
                }

                setupEventListeners() {
                    // Toolbar buttons
                    this.boldBtn.addEventListener('click', () => this.toggleCellFormat('bold'));
                    this.italicBtn.addEventListener('click', () => this.toggleCellFormat('italic'));
                    this.bgColorPicker.addEventListener('input', (e) => this.setCellBackgroundColor(e.target.value));
                    this.clearBtn.addEventListener('click', () => this.clearSelectedCells());
                    this.downloadBtn.addEventListener('click', () => this.downloadCSV());
                    this.uploadBtn.addEventListener('click', () => this.fileInput.click());
                    this.fileInput.addEventListener('change', (e) => this.uploadCSV(e));
                    this.addSheetBtn.addEventListener('click', () => this.addSheet());

                    // Formula bar
                    this.formulaInput.addEventListener('keydown', (e) => this.handleFormulaInputKeydown(e));
                    this.formulaInput.addEventListener('input', () => this.updateActiveCellFromFormulaBar());
                    this.formulaInput.addEventListener('focus', () => {
                        this.isEditing = true;
                        this.updateActiveCellDisplay();
                    });
                    this.formulaInput.addEventListener('blur', () => {
                        this.isEditing = false;
                        this.updateActiveCellDisplay();
                    });

                    // Grid events
                    this.grid.addEventListener('mousedown', (e) => this.handleGridMouseDown(e));
                    this.grid.addEventListener('mousemove', (e) => this.handleGridMouseMove(e));
                    this.grid.addEventListener('mouseup', () => this.handleGridMouseUp());
                    this.grid.addEventListener('dblclick', (e) => this.handleCellDoubleClick(e));
                    this.grid.addEventListener('contextmenu', (e) => this.handleContextMenu(e));

                    // Column headers
                    this.columnHeaders.addEventListener('mousedown', (e) => this.handleColumnHeaderMouseDown(e));
                    this.columnHeaders.addEventListener('mousemove', (e) => this.handleColumnHeaderMouseMove(e));
                    this.columnHeaders.addEventListener('mouseup', () => this.handleColumnHeaderMouseUp());
                    this.columnHeaders.addEventListener('dblclick', (e) => this.autoResizeColumn(e));

                    // Row headers
                    this.rowHeader.addEventListener('mousedown', (e) => this.handleRowHeaderMouseDown(e));

                    // Document events
                    document.addEventListener('keydown', (e) => this.handleKeyDown(e));
                    document.addEventListener('click', () => this.hideContextMenu());

                    // Sheet tabs
                    this.sheetsContainer.addEventListener('click', (e) => this.handleSheetTabClick(e));
                    this.sheetsContainer.addEventListener('dblclick', (e) => this.handleSheetTabDoubleClick(e));
                }

                // Sheet management
                createSheet(name) {
                    const sheet = {
                        name: name,
                        cells: {},
                        columnWidths: {},
                        rowHeights: {},
                        formats: {},
                        defaultColumnWidth: 80,
                        defaultRowHeight: 25,
                        numRows: 100,
                        numCols: 26
                    };

                    // Initialize default column widths
                    for (let col = 0; col < sheet.numCols; col++) {
                        sheet.columnWidths[col] = sheet.defaultColumnWidth;
                    }

                    // Initialize default row heights
                    for (let row = 0; row < sheet.numRows; row++) {
                        sheet.rowHeights[row] = sheet.defaultRowHeight;
                    }

                    this.sheets.push(sheet);
                    this.activeSheetIndex = this.sheets.length - 1;
                }

                addSheet() {
                    const sheetNumber = this.sheets.length + 1;
                    this.createSheet(`Sheet${sheetNumber}`);
                    this.renderSheets();
                    this.renderGrid();
                }

                renameSheet(index, newName) {
                    if (index >= 0 && index < this.sheets.length) {
                        this.sheets[index].name = newName;
                        this.renderSheets();
                    }
                }

                deleteSheet(index) {
                    if (this.sheets.length > 1 && index >= 0 && index < this.sheets.length) {
                        this.sheets.splice(index, 1);
                        if (this.activeSheetIndex >= index) {
                            this.activeSheetIndex = Math.max(0, this.activeSheetIndex - 1);
                        }
                        this.renderSheets();
                        this.renderGrid();
                    }
                }

                renderSheets() {
                    this.sheetsContainer.innerHTML = '';

                    this.sheets.forEach((sheet, index) => {
                        const tab = document.createElement('div');
                        tab.className = `sheet-tab ${index === this.activeSheetIndex ? 'active' : ''}`;
                        tab.dataset.sheetId = index;
                        tab.innerHTML = `
                            <span>${sheet.name}</span>
                            <input type="text" style="display: none;" value="${sheet.name}">
                        `;
                        this.sheetsContainer.insertBefore(tab, this.sheetsContainer.lastChild);
                    });
                }

                // Grid rendering
                renderGrid() {
                    const sheet = this.sheets[this.activeSheetIndex];
                    this.columnHeaders.innerHTML = '';
                    this.rowHeader.innerHTML = '';
                    this.grid.innerHTML = '';

                    // Calculate total width and height
                    let totalWidth = 0;
                    for (let col = 0; col < sheet.numCols; col++) {
                        totalWidth += sheet.columnWidths[col];
                    }

                    let totalHeight = 0;
                    for (let row = 0; row < sheet.numRows; row++) {
                        totalHeight += sheet.rowHeights[row];
                    }

                    // Set grid dimensions
                    this.grid.style.gridTemplateColumns = `repeat(${sheet.numCols}, 1fr)`;
                    this.grid.style.width = `${totalWidth}px`;
                    this.grid.style.height = `${totalHeight}px`;

                    // Render column headers
                    for (let col = 0; col < sheet.numCols; col++) {
                        const header = document.createElement('div');
                        header.className = 'header-cell';
                        header.textContent = this.getColumnName(col);
                        header.dataset.col = col;
                        header.style.width = `${sheet.columnWidths[col]}px`;
                        this.columnHeaders.appendChild(header);

                        // Add resizer
                        const resizer = document.createElement('div');
                        resizer.className = 'column-resizer';
                        resizer.dataset.col = col;
                        header.appendChild(resizer);
                    }

                    // Render row headers
                    for (let row = 0; row < sheet.numRows; row++) {
                        const header = document.createElement('div');
                        header.className = 'header-cell';
                        header.textContent = row + 1;
                        header.dataset.row = row;
                        header.style.height = `${sheet.rowHeights[row]}px`;
                        this.rowHeader.appendChild(header);
                    }

                    // Render cells
                    for (let row = 0; row < sheet.numRows; row++) {
                        for (let col = 0; col < sheet.numCols; col++) {
                            const cell = document.createElement('div');
                            cell.className = 'cell';
                            cell.dataset.row = row;
                            cell.dataset.col = col;
                            cell.style.width = `${sheet.columnWidths[col]}px`;
                            cell.style.height = `${sheet.rowHeights[row]}px`;

                            // Set cell content and formatting
                            const cellKey = `${row},${col}`;
                            if (sheet.cells[cellKey]) {
                                const cellData = sheet.cells[cellKey];
                                cell.textContent = this.getCellDisplayValue(row, col);

                                // Apply formatting
                                if (sheet.formats[cellKey]) {
                                    const format = sheet.formats[cellKey];
                                    if (format.bold) cell.classList.add('bold');
                                    if (format.italic) cell.classList.add('italic');
                                    if (format.bgColor) cell.style.backgroundColor = format.bgColor;
                                }
                            }

                            this.grid.appendChild(cell);
                        }
                    }

                    this.updateSelection();
                    this.updateActiveCellDisplay();
                }

                // Cell operations
                getCellKey(row, col) {
                    return `${row},${col}`;
                }

                getCell(row, col) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const key = this.getCellKey(row, col);
                    return sheet.cells[key] || null;
                }

                setCell(row, col, value, formula = false) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const key = this.getCellKey(row, col);

                    if (value === null || value === '') {
                        delete sheet.cells[key];
                        delete sheet.formats[key];
                    } else {
                        if (!sheet.cells[key]) {
                            sheet.cells[key] = {};
                        }
                        sheet.cells[key].value = value;
                        sheet.cells[key].formula = formula;
                    }

                    this.recalculateDependents(row, col);
                    this.renderGrid();
                }

                getCellValue(row, col) {
                    const cell = this.getCell(row, col);
                    if (!cell) return null;

                    if (cell.formula) {
                        try {
                            return this.evaluateFormula(cell.value, row, col);
                        } catch (e) {
                            return `#ERROR! (${e.message})`;
                        }
                    }

                    return cell.value;
                }

                getCellDisplayValue(row, col) {
                    const value = this.getCellValue(row, col);

                    if (value === null || value === '') return '';

                    if (typeof value === 'number') {
                        // Format numbers with commas for thousands
                        return value.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
                    }

                    return value.toString();
                }

                getCellFormat(row, col) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const key = this.getCellKey(row, col);
                    return sheet.formats[key] || {};
                }

                setCellFormat(row, col, format) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const key = this.getCellKey(row, col);

                    if (!sheet.formats[key]) {
                        sheet.formats[key] = {};
                    }

                    Object.assign(sheet.formats[key], format);
                    this.renderGrid();
                }

                clearCellFormat(row, col) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const key = this.getCellKey(row, col);
                    delete sheet.formats[key];
                    this.renderGrid();
                }

                toggleCellFormat(format) {
                    if (this.selectionStart && this.selectionEnd) {
                        const startRow = Math.min(this.selectionStart.row, this.selectionEnd.row);
                        const endRow = Math.max(this.selectionStart.row, this.selectionEnd.row);
                        const startCol = Math.min(this.selectionStart.col, this.selectionEnd.col);
                        const endCol = Math.max(this.selectionStart.col, this.selectionEnd.col);

                        for (let row = startRow; row <= endRow; row++) {
                            for (let col = startCol; col <= endCol; col++) {
                                const currentFormat = this.getCellFormat(row, col);
                                const newFormat = { ...currentFormat, [format]: !currentFormat[format] };
                                this.setCellFormat(row, col, newFormat);
                            }
                        }
                    } else {
                        const currentFormat = this.getCellFormat(this.activeCell.row, this.activeCell.col);
                        const newFormat = { ...currentFormat, [format]: !currentFormat[format] };
                        this.setCellFormat(this.activeCell.row, this.activeCell.col, newFormat);
                    }
                }

                setCellBackgroundColor(color) {
                    if (this.selectionStart && this.selectionEnd) {
                        const startRow = Math.min(this.selectionStart.row, this.selectionEnd.row);
                        const endRow = Math.max(this.selectionStart.row, this.selectionEnd.row);
                        const startCol = Math.min(this.selectionStart.col, this.selectionEnd.col);
                        const endCol = Math.max(this.selectionStart.col, this.selectionEnd.col);

                        for (let row = startRow; row <= endRow; row++) {
                            for (let col = startCol; col <= endCol; col++) {
                                this.setCellFormat(row, col, { bgColor: color });
                            }
                        }
                    } else {
                        this.setCellFormat(this.activeCell.row, this.activeCell.col, { bgColor: color });
                    }
                }

                clearSelectedCells() {
                    if (this.selectionStart && this.selectionEnd) {
                        const startRow = Math.min(this.selectionStart.row, this.selectionEnd.row);
                        const endRow = Math.max(this.selectionStart.row, this.selectionEnd.row);
                        const startCol = Math.min(this.selectionStart.col, this.selectionEnd.col);
                        const endCol = Math.max(this.selectionStart.col, this.selectionEnd.col);

                        for (let row = startRow; row <= endRow; row++) {
                            for (let col = startCol; col <= endCol; col++) {
                                this.setCell(row, col, null);
                                this.clearCellFormat(row, col);
                            }
                        }
                    } else {
                        this.setCell(this.activeCell.row, this.activeCell.col, null);
                        this.clearCellFormat(this.activeCell.row, this.activeCell.col);
                    }
                }

                // Selection
                updateSelection() {
                    // Clear previous selection
                    document.querySelectorAll('.cell.selected').forEach(el => {
                        el.classList.remove('selected');
                    });

                    document.querySelectorAll('.cell.range-start, .cell.range-end, .cell.range-middle, .cell.range-middle-left, .cell.range-middle-right').forEach(el => {
                        el.classList.remove('range-start', 'range-end', 'range-middle', 'range-middle-left', 'range-middle-right');
                    });

                    // Remove previous selection highlight
                    document.querySelectorAll('.selection-highlight').forEach(el => el.remove());

                    if (this.selectionStart && this.selectionEnd) {
                        const startRow = Math.min(this.selectionStart.row, this.selectionEnd.row);
                        const endRow = Math.max(this.selectionStart.row, this.selectionEnd.row);
                        const startCol = Math.min(this.selectionStart.col, this.selectionEnd.col);
                        const endCol = Math.max(this.selectionStart.col, this.selectionEnd.col);

                        // Add selection classes to cells
                        for (let row = startRow; row <= endRow; row++) {
                            for (let col = startCol; col <= endCol; col++) {
                                const cell = this.getCellElement(row, col);
                                if (cell) {
                                    if (row === startRow && col === startCol) {
                                        cell.classList.add('range-start');
                                    } else if (row === endRow && col === endCol) {
                                        cell.classList.add('range-end');
                                    } else if (row === startRow) {
                                        cell.classList.add('range-middle');
                                    } else if (row === endRow) {
                                        cell.classList.add('range-middle');
                                    } else if (col === startCol) {
                                        cell.classList.add('range-middle-left');
                                    } else if (col === endCol) {
                                        cell.classList.add('range-middle-right');
                                    } else {
                                        cell.classList.add('range-middle');
                                    }
                                }
                            }
                        }

                        // Add selection highlight
                        const sheet = this.sheets[this.activeSheetIndex];
                        let top = 0;
                        for (let r = 0; r < startRow; r++) {
                            top += sheet.rowHeights[r];
                        }

                        let left = 0;
                        for (let c = 0; c < startCol; c++) {
                            left += sheet.columnWidths[c];
                        }

                        let width = 0;
                        for (let c = startCol; c <= endCol; c++) {
                            width += sheet.columnWidths[c];
                        }

                        let height = 0;
                        for (let r = startRow; r <= endRow; r++) {
                            height += sheet.rowHeights[r];
                        }

                        const highlight = document.createElement('div');
                        highlight.className = 'selection-highlight';
                        highlight.style.top = `${top}px`;
                        highlight.style.left = `${left}px`;
                        highlight.style.width = `${width}px`;
                        highlight.style.height = `${height}px`;
                        this.grid.appendChild(highlight);
                    } else {
                        // Single cell selection
                        const cell = this.getCellElement(this.activeCell.row, this.activeCell.col);
                        if (cell) {
                            cell.classList.add('selected');
                        }
                    }

                    // Update active cell reference
                    this.updateActiveCellDisplay();
                }

                getCellElement(row, col) {
                    return this.grid.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                }

                // Formula evaluation
                evaluateFormula(formula, currentRow, currentCol) {
                    // Remove the leading '='
                    const expr = formula.substring(1).trim();

                    // Replace cell references with their values
                    const processedExpr = expr.replace(/([A-Z]+)(\d+)(?::([A-Z]+)(\d+))?/gi, (match, startCol, startRow, endCol, endRow) => {
                        if (endCol && endRow) {
                            // Range reference (e.g., A1:B2)
                            const startColIndex = this.getColumnIndex(startCol);
                            const startRowIndex = parseInt(startRow) - 1;
                            const endColIndex = this.getColumnIndex(endCol);
                            const endRowIndex = parseInt(endRow) - 1;

                            const values = [];
                            for (let row = startRowIndex; row <= endRowIndex; row++) {
                                for (let col = startColIndex; col <= endColIndex; col++) {
                                    const value = this.getCellValue(row, col);
                                    if (value !== null && value !== '') {
                                        values.push(value);
                                    }
                                }
                            }

                            return `(${values.join(',')})`;
                        } else {
                            // Single cell reference (e.g., A1)
                            const colIndex = this.getColumnIndex(startCol);
                            const rowIndex = parseInt(startRow) - 1;
                            const value = this.getCellValue(rowIndex, colIndex);

                            if (value === null || value === '') return '0';
                            if (typeof value === 'string') return `"${value}"`;
                            return value;
                        }
                    });

                    // Handle functions
                    const funcMatch = processedExpr.match(/^([A-Z]+)\(([^)]*)\)$/i);
                    if (funcMatch) {
                        const funcName = funcMatch[1].toUpperCase();
                        const args = funcMatch[2].split(',').map(arg => arg.trim());

                        switch (funcName) {
                            case 'SUM':
                                return this.evaluateSum(args);
                            case 'AVERAGE':
                                return this.evaluateAverage(args);
                            case 'MIN':
                                return this.evaluateMin(args);
                            case 'MAX':
                                return this.evaluateMax(args);
                            default:
                                throw new Error(`Unknown function: ${funcName}`);
                        }
                    }

                    // Evaluate the expression
                    try {
                        // eslint-disable-next-line no-eval
                        return eval(processedExpr);
                    } catch (e) {
                        throw new Error(`Invalid formula: ${e.message}`);
                    }
                }

                evaluateSum(args) {
                    let sum = 0;
                    for (const arg of args) {
                        if (arg.startsWith('(') && arg.endsWith(')')) {
                            // Range of values
                            const values = arg.substring(1, arg.length - 1).split(',').map(v => parseFloat(v));
                            sum += values.reduce((a, b) => a + b, 0);
                        } else {
                            // Single value
                            sum += parseFloat(arg);
                        }
                    }
                    return sum;
                }

                evaluateAverage(args) {
                    let sum = 0;
                    let count = 0;
                    for (const arg of args) {
                        if (arg.startsWith('(') && arg.endsWith(')')) {
                            // Range of values
                            const values = arg.substring(1, arg.length - 1).split(',').map(v => parseFloat(v));
                            sum += values.reduce((a, b) => a + b, 0);
                            count += values.length;
                        } else {
                            // Single value
                            sum += parseFloat(arg);
                            count++;
                        }
                    }
                    return count === 0 ? 0 : sum / count;
                }

                evaluateMin(args) {
                    let min = Infinity;
                    for (const arg of args) {
                        if (arg.startsWith('(') && arg.endsWith(')')) {
                            // Range of values
                            const values = arg.substring(1, arg.length - 1).split(',').map(v => parseFloat(v));
                            const currentMin = Math.min(...values);
                            if (currentMin < min) min = currentMin;
                        } else {
                            // Single value
                            const value = parseFloat(arg);
                            if (value < min) min = value;
                        }
                    }
                    return min === Infinity ? 0 : min;
                }

                evaluateMax(args) {
                    let max = -Infinity;
                    for (const arg of args) {
                        if (arg.startsWith('(') && arg.endsWith(')')) {
                            // Range of values
                            const values = arg.substring(1, arg.length - 1).split(',').map(v => parseFloat(v));
                            const currentMax = Math.max(...values);
                            if (currentMax > max) max = currentMax;
                        } else {
                            // Single value
                            const value = parseFloat(arg);
                            if (value > max) max = value;
                        }
                    }
                    return max === -Infinity ? 0 : max;
                }

                recalculateDependents(row, col) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const dependents = new Set();

                    // Find all cells that reference this cell
                    for (const [key, cell] of Object.entries(sheet.cells)) {
                        if (cell.formula) {
                            const [r, c] = key.split(',').map(Number);
                            const formula = cell.value;

                            // Check if formula contains this cell reference
                            const cellRef = this.getColumnName(col) + (row + 1);
                            const rangeRefPattern = new RegExp(`(^|[^A-Z])${cellRef}(?::[A-Z]+\\d+)?([^0-9]|$)`, 'i');

                            if (rangeRefPattern.test(formula)) {
                                dependents.add(`${r},${c}`);
                            }
                        }
                    }

                    // Recalculate all dependents
                    for (const key of dependents) {
                        const [r, c] = key.split(',').map(Number);
                        const cell = sheet.cells[key];
                        if (cell && cell.formula) {
                            try {
                                const value = this.evaluateFormula(cell.value, r, c);
                                cell.value = value;
                            } catch (e) {
                                cell.value = `#ERROR! (${e.message})`;
                            }
                        }
                    }

                    // If there were dependents, check for more dependents
                    if (dependents.size > 0) {
                        for (const key of dependents) {
                            const [r, c] = key.split(',').map(Number);
                            this.recalculateDependents(r, c);
                        }
                    }
                }

                // Formula bar
                updateActiveCellFromFormulaBar() {
                    const value = this.formulaInput.value;
                    const sheet = this.sheets[this.activeSheetIndex];

                    if (value.startsWith('=')) {
                        this.setCell(this.activeCell.row, this.activeCell.col, value, true);
                    } else {
                        // Try to parse as number
                        const numValue = parseFloat(value);
                        if (!isNaN(numValue)) {
                            this.setCell(this.activeCell.row, this.activeCell.col, numValue, false);
                        } else {
                            this.setCell(this.activeCell.row, this.activeCell.col, value, false);
                        }
                    }
                }

                updateActiveCellDisplay() {
                    const cell = this.getCell(this.activeCell.row, this.activeCell.col);
                    const displayValue = this.getCellDisplayValue(this.activeCell.row, this.activeCell.col);

                    this.activeCellRef.textContent = this.getColumnName(this.activeCell.col) + (this.activeCell.row + 1);

                    if (this.isEditing) {
                        this.formulaInput.value = cell && cell.formula ? cell.value : displayValue;
                    } else {
                        this.formulaInput.value = cell && cell.formula ? cell.value : '';
                    }

                    // Update status bar
                    if (this.selectionStart && this.selectionEnd) {
                        const startRow = Math.min(this.selectionStart.row, this.selectionEnd.row);
                        const endRow = Math.max(this.selectionStart.row, this.selectionEnd.row);
                        const startCol = Math.min(this.selectionStart.col, this.selectionEnd.col);
                        const endCol = Math.max(this.selectionStart.col, this.selectionEnd.col);

                        if (startRow === endRow && startCol === endCol) {
                            this.statusBar.textContent = `Ready (${this.getColumnName(startCol)}${startRow + 1})`;
                        } else {
                            this.statusBar.textContent = `Ready (${this.getColumnName(startCol)}${startRow + 1}:${this.getColumnName(endCol)}${endRow + 1})`;
                        }
                    } else {
                        this.statusBar.textContent = `Ready (${this.getColumnName(this.activeCell.col)}${this.activeCell.row + 1})`;
                    }
                }

                // Column/Row operations
                getColumnName(index) {
                    let name = '';
                    while (index >= 0) {
                        name = String.fromCharCode(65 + (index % 26)) + name;
                        index = Math.floor(index / 26) - 1;
                    }
                    return name;
                }

                getColumnIndex(name) {
                    let index = 0;
                    for (let i = 0; i < name.length; i++) {
                        index = index * 26 + (name.charCodeAt(i) - 64);
                    }
                    return index - 1;
                }

                insertColumn(col) {
                    const sheet = this.sheets[this.activeSheetIndex];

                    // Shift all cells to the right of the column
                    const newCells = {};
                    const newFormats = {};

                    for (const [key, cell] of Object.entries(sheet.cells)) {
                        const [row, c] = key.split(',').map(Number);
                        if (c >= col) {
                            newCells[`${row},${c + 1}`] = cell;
                            if (sheet.formats[key]) {
                                newFormats[`${row},${c + 1}`] = sheet.formats[key];
                            }
                        } else {
                            newCells[key] = cell;
                            if (sheet.formats[key]) {
                                newFormats[key] = sheet.formats[key];
                            }
                        }
                    }

                    sheet.cells = newCells;
                    sheet.formats = newFormats;

                    // Shift column widths
                    const newColumnWidths = {};
                    for (let c = 0; c < sheet.numCols; c++) {
                        if (c < col) {
                            newColumnWidths[c] = sheet.columnWidths[c];
                        } else if (c === col) {
                            newColumnWidths[c] = sheet.defaultColumnWidth;
                        } else {
                            newColumnWidths[c] = sheet.columnWidths[c - 1];
                        }
                    }
                    sheet.columnWidths = newColumnWidths;
                    sheet.numCols++;

                    this.renderGrid();
                }

                insertRow(row) {
                    const sheet = this.sheets[this.activeSheetIndex];

                    // Shift all cells below the row
                    const newCells = {};
                    const newFormats = {};

                    for (const [key, cell] of Object.entries(sheet.cells)) {
                        const [r, col] = key.split(',').map(Number);
                        if (r >= row) {
                            newCells[`${r + 1},${col}`] = cell;
                            if (sheet.formats[key]) {
                                newFormats[`${r + 1},${col}`] = sheet.formats[key];
                            }
                        } else {
                            newCells[key] = cell;
                            if (sheet.formats[key]) {
                                newFormats[key] = sheet.formats[key];
                            }
                        }
                    }

                    sheet.cells = newCells;
                    sheet.formats = newFormats;

                    // Shift row heights
                    const newRowHeights = {};
                    for (let r = 0; r < sheet.numRows; r++) {
                        if (r < row) {
                            newRowHeights[r] = sheet.rowHeights[r];
                        } else if (r === row) {
                            newRowHeights[r] = sheet.defaultRowHeight;
                        } else {
                            newRowHeights[r] = sheet.rowHeights[r - 1];
                        }
                    }
                    sheet.rowHeights = newRowHeights;
                    sheet.numRows++;

                    this.renderGrid();
                }

                deleteColumn(col) {
                    const sheet = this.sheets[this.activeSheetIndex];

                    if (sheet.numCols <= 1) return;

                    // Remove all cells in the column
                    const newCells = {};
                    const newFormats = {};

                    for (const [key, cell] of Object.entries(sheet.cells)) {
                        const [row, c] = key.split(',').map(Number);
                        if (c !== col) {
                            newCells[`${row},${c > col ? c - 1 : c}`] = cell;
                            if (sheet.formats[key]) {
                                newFormats[`${row},${c > col ? c - 1 : c}`] = sheet.formats[key];
                            }
                        }
                    }

                    sheet.cells = newCells;
                    sheet.formats = newFormats;

                    // Shift column widths
                    const newColumnWidths = {};
                    for (let c = 0; c < sheet.numCols - 1; c++) {
                        newColumnWidths[c] = sheet.columnWidths[c < col ? c : c + 1];
                    }
                    sheet.columnWidths = newColumnWidths;
                    sheet.numCols--;

                    // Adjust active cell if needed
                    if (this.activeCell.col >= col) {
                        this.activeCell.col = Math.max(0, this.activeCell.col - 1);
                    }

                    this.renderGrid();
                }

                deleteRow(row) {
                    const sheet = this.sheets[this.activeSheetIndex];

                    if (sheet.numRows <= 1) return;

                    // Remove all cells in the row
                    const newCells = {};
                    const newFormats = {};

                    for (const [key, cell] of Object.entries(sheet.cells)) {
                        const [r, col] = key.split(',').map(Number);
                        if (r !== row) {
                            newCells[`${r > row ? r - 1 : r},${col}`] = cell;
                            if (sheet.formats[key]) {
                                newFormats[`${r > row ? r - 1 : r},${col}`] = sheet.formats[key];
                            }
                        }
                    }

                    sheet.cells = newCells;
                    sheet.formats = newFormats;

                    // Shift row heights
                    const newRowHeights = {};
                    for (let r = 0; r < sheet.numRows - 1; r++) {
                        newRowHeights[r] = sheet.rowHeights[r < row ? r : r + 1];
                    }
                    sheet.rowHeights = newRowHeights;
                    sheet.numRows--;

                    // Adjust active cell if needed
                    if (this.activeCell.row >= row) {
                        this.activeCell.row = Math.max(0, this.activeCell.row - 1);
                    }

                    this.renderGrid();
                }

                // Column resizing
                autoResizeColumn(e) {
                    const header = e.target.closest('.header-cell');
                    if (!header) return;

                    const col = parseInt(header.dataset.col);
                    const sheet = this.sheets[this.activeSheetIndex];

                    // Find the maximum content width in this column
                    let maxWidth = 50; // Minimum width

                    for (let row = 0; row < sheet.numRows; row++) {
                        const cell = this.getCell(row, col);
                        if (cell) {
                            const displayValue = this.getCellDisplayValue(row, col);
                            const tempDiv = document.createElement('div');
                            tempDiv.style.position = 'absolute';
                            tempDiv.style.visibility = 'hidden';
                            tempDiv.style.whiteSpace = 'nowrap';
                            tempDiv.style.fontSize = '14px';
                            tempDiv.textContent = displayValue;
                            document.body.appendChild(tempDiv);
                            const width = tempDiv.getBoundingClientRect().width + 10; // Add padding
                            document.body.removeChild(tempDiv);

                            if (width > maxWidth) {
                                maxWidth = width;
                            }
                        }
                    }

                    sheet.columnWidths[col] = maxWidth;
                    this.renderGrid();
                }

                // CSV import/export
                downloadCSV() {
                    const sheet = this.sheets[this.activeSheetIndex];
                    let csv = '';

                    // Add header row
                    for (let col = 0; col < sheet.numCols; col++) {
                        csv += this.getColumnName(col);
                        if (col < sheet.numCols - 1) csv += ',';
                    }
                    csv += '\n';

                    // Add data rows
                    for (let row = 0; row < sheet.numRows; row++) {
                        for (let col = 0; col < sheet.numCols; col++) {
                            const value = this.getCellValue(row, col);
                            if (value !== null && value !== '') {
                                // Escape quotes and commas
                                let strValue = value.toString();
                                if (strValue.includes('"') || strValue.includes(',')) {
                                    strValue = `"${strValue.replace(/"/g, '""')}"`;
                                }
                                csv += strValue;
                            }
                            if (col < sheet.numCols - 1) csv += ',';
                        }
                        csv += '\n';
                    }

                    // Create download link
                    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.setAttribute('href', url);
                    link.setAttribute('download', `${sheet.name}.csv`);
                    link.style.visibility = 'hidden';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }

                uploadCSV(e) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const csv = event.target.result;
                        this.importCSV(csv);
                    };
                    reader.readAsText(file);
                }

                importCSV(csv) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    const lines = csv.split('\n');
                    const maxCols = lines.reduce((max, line) => Math.max(max, line.split(',').length), 0);

                    // Clear existing data
                    sheet.cells = {};
                    sheet.formats = {};

                    // Process each line
                    for (let row = 0; row < lines.length && row < sheet.numRows; row++) {
                        const line = lines[row].trim();
                        if (!line) continue;

                        const values = this.parseCSVLine(line);
                        for (let col = 0; col < values.length && col < sheet.numCols; col++) {
                            const value = values[col];
                            if (value !== null && value !== '') {
                                // Try to parse as number
                                const numValue = parseFloat(value);
                                if (!isNaN(numValue)) {
                                    this.setCell(row, col, numValue, false);
                                } else {
                                    this.setCell(row, col, value, false);
                                }
                            }
                        }
                    }

                    this.renderGrid();
                }

                parseCSVLine(line) {
                    const values = [];
                    let currentValue = '';
                    let inQuotes = false;

                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];

                        if (char === '"') {
                            if (inQuotes && i < line.length - 1 && line[i + 1] === '"') {
                                // Escaped quote
                                currentValue += '"';
                                i++;
                            } else {
                                inQuotes = !inQuotes;
                            }
                        } else if (char === ',' && !inQuotes) {
                            values.push(currentValue.trim());
                            currentValue = '';
                        } else {
                            currentValue += char;
                        }
                    }

                    values.push(currentValue.trim());
                    return values;
                }

                // Event handlers
                handleGridMouseDown(e) {
                    const cell = e.target.closest('.cell');
                    if (!cell) return;

                    const row = parseInt(cell.dataset.row);
                    const col = parseInt(cell.dataset.col);

                    if (this.formulaMode && this.formulaRangeSelect) {
                        // Formula range selection
                        this.formulaRangeStart = { row, col };
                        this.formulaRangeEnd = { row, col };
                        this.updateFormulaRangeSelection();
                    } else {
                        // Regular cell selection
                        this.isSelecting = true;
                        this.selectionStart = { row, col };
                        this.selectionEnd = { row, col };
                        this.activeCell = { row, col };
                        this.updateSelection();

                        // Start editing if double click
                        if (e.detail === 2) {
                            this.startEditing();
                        }
                    }
                }

                handleGridMouseMove(e) {
                    if (this.isSelecting) {
                        const cell = e.target.closest('.cell');
                        if (cell) {
                            const row = parseInt(cell.dataset.row);
                            const col = parseInt(cell.dataset.col);
                            this.selectionEnd = { row, col };
                            this.updateSelection();
                        }
                    } else if (this.formulaMode && this.formulaRangeSelect && this.formulaRangeStart) {
                        // Update formula range selection
                        const cell = e.target.closest('.cell');
                        if (cell) {
                            const row = parseInt(cell.dataset.row);
                            const col = parseInt(cell.dataset.col);
                            this.formulaRangeEnd = { row, col };
                            this.updateFormulaRangeSelection();
                        }
                    }
                }

                handleGridMouseUp() {
                    this.isSelecting = false;

                    if (this.formulaMode && this.formulaRangeSelect && this.formulaRangeStart && this.formulaRangeEnd) {
                        // Insert range reference into formula
                        const startCol = this.getColumnName(this.formulaRangeStart.col);
                        const startRow = this.formulaRangeStart.row + 1;
                        const endCol = this.getColumnName(this.formulaRangeEnd.col);
                        const endRow = this.formulaRangeEnd.row + 1;

                        let rangeRef;
                        if (this.formulaRangeStart.row === this.formulaRangeEnd.row &&
                            this.formulaRangeStart.col === this.formulaRangeEnd.col) {
                            rangeRef = `${startCol}${startRow}`;
                        } else {
                            rangeRef = `${startCol}${startRow}:${endCol}${endRow}`;
                        }

                        this.insertIntoFormula(rangeRef);
                        this.formulaRangeSelect = false;
                        this.formulaRangeStart = null;
                        this.formulaRangeEnd = null;
                        this.clearFormulaRangeSelection();
                    }
                }

                handleCellDoubleClick(e) {
                    const cell = e.target.closest('.cell');
                    if (cell) {
                        this.startEditing();
                    }
                }

                handleColumnHeaderMouseDown(e) {
                    const header = e.target.closest('.header-cell');
                    if (!header) return;

                    const resizer = e.target.closest('.column-resizer');
                    if (resizer) {
                        // Start column resizing
                        this.isResizing = true;
                        this.resizeCol = parseInt(resizer.dataset.col);
                        this.resizeStartX = e.clientX;
                        this.resizeStartWidth = this.sheets[this.activeSheetIndex].columnWidths[this.resizeCol];
                        resizer.classList.add('active');
                    } else {
                        // Select entire column
                        const col = parseInt(header.dataset.col);
                        this.selectionStart = { row: 0, col };
                        this.selectionEnd = { row: this.sheets[this.activeSheetIndex].numRows - 1, col };
                        this.updateSelection();
                    }
                }

                handleColumnHeaderMouseMove(e) {
                    if (this.isResizing) {
                        const dx = e.clientX - this.resizeStartX;
                        const newWidth = Math.max(20, this.resizeStartWidth + dx);
                        this.sheets[this.activeSheetIndex].columnWidths[this.resizeCol] = newWidth;
                        this.renderGrid();
                    }
                }

                handleColumnHeaderMouseUp() {
                    if (this.isResizing) {
                        this.isResizing = false;
                        const resizer = this.columnHeaders.querySelector(`.column-resizer[data-col="${this.resizeCol}"]`);
                        if (resizer) resizer.classList.remove('active');
                        this.resizeCol = null;
                    }
                }

                handleRowHeaderMouseDown(e) {
                    const header = e.target.closest('.header-cell');
                    if (header) {
                        // Select entire row
                        const row = parseInt(header.dataset.row);
                        this.selectionStart = { row, col: 0 };
                        this.selectionEnd = { row, col: this.sheets[this.activeSheetIndex].numCols - 1 };
                        this.updateSelection();
                    }
                }

                handleKeyDown(e) {
                    if (this.isEditing) {
                        if (e.key === 'Enter') {
                            this.finishEditing();
                            e.preventDefault();
                        } else if (e.key === 'Escape') {
                            this.cancelEditing();
                            e.preventDefault();
                        }
                        return;
                    }

                    switch (e.key) {
                        case 'ArrowUp':
                            this.moveActiveCell(0, -1, e.shiftKey);
                            e.preventDefault();
                            break;
                        case 'ArrowDown':
                            this.moveActiveCell(0, 1, e.shiftKey);
                            e.preventDefault();
                            break;
                        case 'ArrowLeft':
                            this.moveActiveCell(-1, 0, e.shiftKey);
                            e.preventDefault();
                            break;
                        case 'ArrowRight':
                            this.moveActiveCell(1, 0, e.shiftKey);
                            e.preventDefault();
                            break;
                        case 'Tab':
                            this.moveActiveCell(e.shiftKey ? -1 : 1, 0, false);
                            e.preventDefault();
                            break;
                        case 'Enter':
                            this.startEditing();
                            e.preventDefault();
                            break;
                        case 'Delete':
                            this.clearSelectedCells();
                            e.preventDefault();
                            break;
                        case 'Backspace':
                            this.clearSelectedCells();
                            e.preventDefault();
                            break;
                        case 'b':
                            if (e.ctrlKey) {
                                this.toggleCellFormat('bold');
                                e.preventDefault();
                            }
                            break;
                        case 'i':
                            if (e.ctrlKey) {
                                this.toggleCellFormat('italic');
                                e.preventDefault();
                            }
                            break;
                        case '=':
                            if (!this.isEditing) {
                                this.startEditing();
                                this.formulaInput.value = '=';
                                this.formulaInput.setSelectionRange(1, 1);
                                e.preventDefault();
                            }
                            break;
                    }
                }

                handleFormulaInputKeydown(e) {
                    if (e.key === 'F2') {
                        // Toggle formula range selection mode
                        this.formulaRangeSelect = !this.formulaRangeSelect;
                        if (this.formulaRangeSelect) {
                            this.statusBar.textContent = 'Select range for formula...';
                        } else {
                            this.statusBar.textContent = 'Ready';
                            this.clearFormulaRangeSelection();
                        }
                        e.preventDefault();
                    } else if (e.key === 'Escape' && this.formulaRangeSelect) {
                        this.formulaRangeSelect = false;
                        this.clearFormulaRangeSelection();
                        this.statusBar.textContent = 'Ready';
                        e.preventDefault();
                    }
                }

                handleSheetTabClick(e) {
                    const tab = e.target.closest('.sheet-tab');
                    if (!tab) return;

                    const sheetId = parseInt(tab.dataset.sheetId);
                    if (sheetId !== this.activeSheetIndex) {
                        this.activeSheetIndex = sheetId;
                        this.renderSheets();
                        this.renderGrid();
                    }

                    // Check for rename
                    if (e.target.tagName === 'INPUT') {
                        const input = e.target;
                        if (e.type === 'blur' || e.key === 'Enter') {
                            const newName = input.value.trim();
                            if (newName) {
                                this.renameSheet(sheetId, newName);
                            }
                            input.style.display = 'none';
                            tab.querySelector('span').style.display = 'inline';
                        }
                    }
                }

                handleSheetTabDoubleClick(e) {
                    const tab = e.target.closest('.sheet-tab');
                    if (!tab) return;

                    const span = tab.querySelector('span');
                    const input = tab.querySelector('input');

                    span.style.display = 'none';
                    input.style.display = 'inline';
                    input.focus();
                    input.select();
                }

                handleContextMenu(e) {
                    e.preventDefault();
                    const cell = e.target.closest('.cell');
                    if (!cell) return;

                    const rect = this.contextMenu.getBoundingClientRect();
                    this.contextMenu.style.display = 'block';
                    this.contextMenu.style.left = `${Math.min(e.clientX, window.innerWidth - rect.width)}px`;
                    this.contextMenu.style.top = `${Math.min(e.clientY, window.innerHeight - rect.height)}px`;

                    // Store current selection for context menu actions
                    this.contextMenu.dataset.selectionStart = this.selectionStart ?
                        `${this.selectionStart.row},${this.selectionStart.col}` : null;
                    this.contextMenu.dataset.selectionEnd = this.selectionEnd ?
                        `${this.selectionEnd.row},${this.selectionEnd.col}` : null;
                }

                hideContextMenu() {
                    this.contextMenu.style.display = 'none';
                }

                // Cell editing
                startEditing() {
                    const cell = this.getCellElement(this.activeCell.row, this.activeCell.col);
                    if (!cell) return;

                    this.isEditing = true;
                    cell.classList.add('editing');

                    const cellValue = this.getCell(this.activeCell.row, this.activeCell.col);
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.className = 'cell-input';
                    input.value = cellValue && cellValue.formula ? cellValue.value : this.getCellDisplayValue(this.activeCell.row, this.activeCell.col);

                    // Position input correctly
                    const rect = cell.getBoundingClientRect();
                    input.style.width = `${rect.width}px`;
                    input.style.height = `${rect.height}px`;

                    cell.innerHTML = '';
                    cell.appendChild(input);
                    input.focus();

                    // Handle input events
                    input.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter') {
                            this.finishEditing();
                            e.preventDefault();
                        } else if (e.key === 'Escape') {
                            this.cancelEditing();
                            e.preventDefault();
                        }
                    });

                    input.addEventListener('blur', () => this.finishEditing());
                }

                finishEditing() {
                    const cell = this.getCellElement(this.activeCell.row, this.activeCell.col);
                    if (!cell || !cell.classList.contains('editing')) return;

                    const input = cell.querySelector('.cell-input');
                    const value = input.value;

                    this.setCell(this.activeCell.row, this.activeCell.col, value.startsWith('=') ? value : value);

                    cell.classList.remove('editing');
                    cell.innerHTML = this.getCellDisplayValue(this.activeCell.row, this.activeCell.col);
                    this.isEditing = false;
                    this.updateActiveCellDisplay();
                }

                cancelEditing() {
                    const cell = this.getCellElement(this.activeCell.row, this.activeCell.col);
                    if (!cell || !cell.classList.contains('editing')) return;

                    cell.classList.remove('editing');
                    cell.innerHTML = this.getCellDisplayValue(this.activeCell.row, this.activeCell.col);
                    this.isEditing = false;
                    this.updateActiveCellDisplay();
                }

                // Formula range selection
                updateFormulaRangeSelection() {
                    // Clear previous highlights
                    document.querySelectorAll('.formula-highlight').forEach(el => el.remove());

                    if (!this.formulaRangeStart || !this.formulaRangeEnd) return;

                    const startRow = Math.min(this.formulaRangeStart.row, this.formulaRangeEnd.row);
                    const endRow = Math.max(this.formulaRangeStart.row, this.formulaRangeEnd.row);
                    const startCol = Math.min(this.formulaRangeStart.col, this.formulaRangeEnd.col);
                    const endCol = Math.max(this.formulaRangeStart.col, this.formulaRangeEnd.col);

                    const sheet = this.sheets[this.activeSheetIndex];
                    let top = 0;
                    for (let r = 0; r < startRow; r++) {
                        top += sheet.rowHeights[r];
                    }

                    let left = 0;
                    for (let c = 0; c < startCol; c++) {
                        left += sheet.columnWidths[c];
                    }

                    let width = 0;
                    for (let c = startCol; c <= endCol; c++) {
                        width += sheet.columnWidths[c];
                    }

                    let height = 0;
                    for (let r = startRow; r <= endRow; r++) {
                        height += sheet.rowHeights[r];
                    }

                    const highlight = document.createElement('div');
                    highlight.className = 'formula-highlight';
                    highlight.style.top = `${top}px`;
                    highlight.style.left = `${left}px`;
                    highlight.style.width = `${width}px`;
                    highlight.style.height = `${height}px`;
                    this.grid.appendChild(highlight);
                }

                clearFormulaRangeSelection() {
                    document.querySelectorAll('.formula-highlight').forEach(el => el.remove());
                }

                insertIntoFormula(text) {
                    const start = this.formulaInput.selectionStart;
                    const end = this.formulaInput.selectionEnd;
                    const value = this.formulaInput.value;

                    this.formulaInput.value = value.substring(0, start) + text + value.substring(end);
                    this.formulaInput.focus();
                    this.formulaInput.setSelectionRange(start + text.length, start + text.length);
                    this.updateActiveCellFromFormulaBar();
                }

                // Navigation
                moveActiveCell(dx, dy, extendSelection) {
                    const sheet = this.sheets[this.activeSheetIndex];
                    let newRow = this.activeCell.row + dy;
                    let newCol = this.activeCell.col + dx;

                    // Clamp to grid bounds
                    newRow = Math.max(0, Math.min(newRow, sheet.numRows - 1));
                    newCol = Math.max(0, Math.min(newCol, sheet.numCols - 1));

                    if (extendSelection && this.selectionStart) {
                        this.selectionEnd = { row: newRow, col: newCol };
                    } else {
                        this.selectionStart = { row: newRow, col: newCol };
                        this.selectionEnd = { row: newRow, col: newCol };
                    }

                    this.activeCell = { row: newRow, col: newCol };
                    this.updateSelection();
                    this.scrollToActiveCell();
                }

                scrollToActiveCell() {
                    const cell = this.getCellElement(this.activeCell.row, this.activeCell.col);
                    if (!cell) return;

                    const gridRect = this.grid.getBoundingClientRect();
                    const cellRect = cell.getBoundingClientRect();

                    // Scroll horizontally if needed
                    if (cellRect.left < gridRect.left) {
                        this.grid.scrollLeft -= gridRect.left - cellRect.left;
                    } else if (cellRect.right > gridRect.right) {
                        this.grid.scrollLeft += cellRect.right - gridRect.right;
                    }

                    // Scroll vertically if needed
                    if (cellRect.top < gridRect.top) {
