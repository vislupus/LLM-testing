<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Spreadsheet</title>
  <style>
    :root {
      --excel-green: #107c41;
      --excel-green-dark: #0b582e;
      --border-color: #e1e1e1;
      --header-bg: #f3f2f1;
      --header-text: #323130;
      --selected-border: #107c41;
      --grid-line: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #fff;
    }

    /* Top Ribbon / Toolbar */
    .ribbon {
      background-color: #f3f2f1;
      border-bottom: 1px solid var(--border-color);
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ribbon-group {
      display: flex;
      gap: 4px;
      align-items: center;
      padding-right: 8px;
      border-right: 1px solid #ccc;
    }

    .btn {
      background: white;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 4px 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      min-width: 28px;
      height: 28px;
    }

    .btn:hover {
      background: #e1dfdd;
    }

    .btn.active {
      background: #c8c6c4;
      border-color: #a19f9d;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid #ccc;
      width: 28px;
      height: 28px;
      border-radius: 3px;
      cursor: pointer;
      padding: 2px;
      background: white;
    }

    /* Formula Bar */
    .formula-bar-container {
      display: flex;
      align-items: center;
      padding: 4px 8px;
      background: #fff;
      border-bottom: 1px solid var(--border-color);
      gap: 8px;
    }

    .cell-address {
      width: 60px;
      padding: 3px 6px;
      border: 1px solid #ccc;
      border-radius: 2px;
      text-align: center;
      font-weight: bold;
      background: #f9f9f9;
    }

    .formula-fx {
      font-weight: bold;
      font-style: italic;
      color: #666;
    }

    .formula-input {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 2px;
      outline: none;
    }

    .formula-input:focus {
      border-color: var(--excel-green);
    }

    /* Grid Container */
    .grid-container {
      flex: 1;
      overflow: auto;
      position: relative;
      background: #fff;
    }

    table.spreadsheet {
      border-collapse: collapse;
      table-layout: fixed;
      white-space: nowrap;
    }

    th, td {
      border: 1px solid var(--grid-line);
      height: 24px;
      padding: 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      position: relative;
    }

    /* Headers */
    th {
      background-color: var(--header-bg);
      color: var(--header-text);
      font-weight: normal;
      text-align: center;
      vertical-align: middle;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th.row-header {
      left: 0;
      z-index: 3;
      width: 40px;
      min-width: 40px;
    }

    th.corner-header {
      top: 0;
      left: 0;
      z-index: 4;
      width: 40px;
    }

    /* Column Resizer */
    .col-resizer {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      cursor: col-resize;
      z-index: 10;
    }

    /* Cells */
    td {
      background-color: #fff;
      cursor: cell;
    }

    td.selected {
      background-color: #e7f3ec;
    }

    td.active-cell {
      outline: 2px solid var(--excel-green);
      outline-offset: -2px;
      z-index: 1;
    }

    td input.cell-editor {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid var(--excel-green);
      padding: 0 3px;
      outline: none;
      font-family: inherit;
      font-size: inherit;
      box-sizing: border-box;
      z-index: 5;
      background: white;
    }

    /* Sheet Tabs */
    .sheet-bar {
      display: flex;
      align-items: center;
      background-color: var(--header-bg);
      border-top: 1px solid var(--border-color);
      padding: 0 8px;
      height: 32px;
    }

    .sheet-tabs {
      display: flex;
      gap: 2px;
      overflow-x: auto;
    }

    .sheet-tab {
      padding: 6px 16px;
      background: #e1dfdd;
      border: 1px solid #ccc;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-tab.active {
      background: white;
      font-weight: bold;
      color: var(--excel-green);
      border-top: 2px solid var(--excel-green);
    }

    .add-sheet-btn {
      font-size: 16px;
      cursor: pointer;
      padding: 2px 8px;
      border: none;
      background: transparent;
      font-weight: bold;
      color: #666;
    }

    .add-sheet-btn:hover {
      color: var(--excel-green);
    }

    .hidden-file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Ribbon / Toolbar -->
  <div class="ribbon">
    <div class="ribbon-group">
      <button class="btn" id="btn-bold" title="Bold">B</button>
      <button class="btn" id="btn-italic" title="Italic" style="font-style: italic;">I</button>
    </div>
    <div class="ribbon-group">
      <label style="font-size: 11px; color: #666;">Fill Color:</label>
      <input type="color" id="btn-bg-color" value="#ffffff" title="Background Color">
      <button class="btn" id="btn-clear" title="Clear Formatting & Content">Clear</button>
    </div>
    <div class="ribbon-group">
      <button class="btn" id="btn-export">Download CSV</button>
      <button class="btn" id="btn-import-trigger">Upload CSV</button>
      <input type="file" id="csv-file-input" class="hidden-file-input" accept=".csv">
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formula-bar-container">
    <input type="text" class="cell-address" id="cell-address" readonly value="A1">
    <span class="formula-fx">fx</span>
    <input type="text" class="formula-input" id="formula-input" placeholder="">
  </div>

  <!-- Grid Workspace -->
  <div class="grid-container" id="grid-container">
    <table class="spreadsheet" id="spreadsheet">
      <thead id="grid-head"></thead>
      <tbody id="grid-body"></tbody>
    </table>
  </div>

  <!-- Sheet Tabs Footer -->
  <div class="sheet-bar">
    <button class="add-sheet-btn" id="add-sheet-btn" title="Add Sheet">+</button>
    <div class="sheet-tabs" id="sheet-tabs"></div>
  </div>

  <script>
    // --- Constants & Defaults ---
    const DEFAULT_ROWS = 50;
    const DEFAULT_COLS = 26; // A-Z

    // --- State Management ---
    let sheets = {};
    let activeSheetId = null;
    let sheetCounter = 0;

    // Selection State
    let activeCell = { r: 0, c: 0 }; // Active focus cell
    let selectionRange = { startR: 0, startC: 0, endR: 0, endC: 0 };
    let isMouseDown = false;
    let isEditingFormulaBar = false;

    // References
    const gridContainer = document.getElementById('grid-container');
    const gridHead = document.getElementById('grid-head');
    const gridBody = document.getElementById('grid-body');
    const cellAddressInput = document.getElementById('cell-address');
    const formulaInput = document.getElementById('formula-input');
    const sheetTabsContainer = document.getElementById('sheet-tabs');

    // Utility: Convert Column Index (0-based) to Name (A, B, C... AA, AB...)
    function colToName(index) {
      let name = '';
      index++;
      while (index > 0) {
        let remainder = (index - 1) % 26;
        name = String.fromCharCode(65 + remainder) + name;
        index = Math.floor((index - 1) / 26);
      }
      return name;
    }

    // Utility: Convert Column Name to Index
    function nameToCol(name) {
      let index = 0;
      for (let i = 0; i < name.length; i++) {
        index = index * 26 + name.charCodeAt(i) - 64;
      }
      return index - 1;
    }

    // Parse Address String (e.g. "B3" -> {r: 2, c: 1})
    function parseAddress(addr) {
      const match = addr.match(/^([A-Z]+)(\d+)$/i);
      if (!match) return null;
      return {
        c: nameToCol(match[1].toUpperCase()),
        r: parseInt(match[2], 10) - 1
      };
    }

    function formatAddress(r, c) {
      return `${colToName(c)}${r + 1}`;
    }

    // --- Data Model ---
    function createNewSheetData(name) {
      return {
        id: 'sheet_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        name: name,
        cells: {}, // Key: "r,c", Value: { raw: '', computed: '', bold: false, italic: false, bg: '#ffffff' }
        colWidths: {} // Key: c, Value: px width
      };
    }

    function init() {
      addSheet("Sheet1");
      setupEventListeners();
      setupRibbon();
    }

    function addSheet(name) {
      sheetCounter++;
      const sheetName = name || `Sheet${sheetCounter}`;
      const newSheet = createNewSheetData(sheetName);
      sheets[newSheet.id] = newSheet;
      switchSheet(newSheet.id);
    }

    function switchSheet(id) {
      activeSheetId = id;
      renderSheetTabs();
      renderGrid();
      setActiveCell(0, 0);
    }

    function deleteSheet(id, e) {
      e.stopPropagation();
      if (Object.keys(sheets).length <= 1) {
        alert("Cannot delete the only sheet.");
        return;
      }
      delete sheets[id];
      if (activeSheetId === id) {
        activeSheetId = Object.keys(sheets)[0];
      }
      renderSheetTabs();
      renderGrid();
      setActiveCell(0, 0);
    }

    function getCellData(r, c) {
      const sheet = sheets[activeSheetId];
      const key = `${r},${c}`;
      return sheet.cells[key] || { raw: '', computed: '', bold: false, italic: false, bg: '#ffffff' };
    }

    function setCellData(r, c, updates) {
      const sheet = sheets[activeSheetId];
      const key = `${r},${c}`;
      if (!sheet.cells[key]) {
        sheet.cells[key] = { raw: '', computed: '', bold: false, italic: false, bg: '#ffffff' };
      }
      Object.assign(sheet.cells[key], updates);
    }

    // --- Formula Engine ---
    function evaluateFormula(expr, currentR, currentC, visited = new Set()) {
      if (!expr.startsWith('=')) return expr;

      const selfKey = `${currentR},${currentC}`;
      if (visited.has(selfKey)) return '#CIRCULAR!';
      visited.add(selfKey);

      let cleanExpr = expr.substring(1).toUpperCase();

      // Range Function Replacements (SUM, AVERAGE, MIN, MAX)
      const rangeFuncRegex = /(SUM|AVERAGE|MIN|MAX)\(([A-Z]+\d+):([A-Z]+\d+)\)/g;
      cleanExpr = cleanExpr.replace(rangeFuncRegex, (match, func, startStr, endStr) => {
        const start = parseAddress(startStr);
        const end = parseAddress(endStr);
        if (!start || !end) return '#REF!';

        const values = [];
        const minR = Math.min(start.r, end.r);
        const maxR = Math.max(start.r, end.r);
        const minC = Math.min(start.c, end.c);
        const maxC = Math.max(start.c, end.c);

        for (let r = minR; r <= maxR; r++) {
          for (let c = minC; c <= maxC; c++) {
            const val = getCellValueParsed(r, c, new Set(visited));
            if (typeof val === 'number' && !isNaN(val)) {
              values.push(val);
            }
          }
        }

        if (func === 'SUM') return values.reduce((a, b) => a + b, 0);
        if (func === 'AVERAGE') return values.length ? (values.reduce((a, b) => a + b, 0) / values.length) : 0;
        if (func === 'MIN') return values.length ? Math.min(...values) : 0;
        if (func === 'MAX') return values.length ? Math.max(...values) : 0;
        return 0;
      });

      // Single Cell Reference Replacements
      const cellRefRegex = /[A-Z]+\d+/g;
      cleanExpr = cleanExpr.replace(cellRefRegex, (match) => {
        const addr = parseAddress(match);
        if (!addr) return '#REF!';
        const val = getCellValueParsed(addr.r, addr.c, new Set(visited));
        return typeof val === 'number' ? val : `"${val}"`;
      });

      // Safe Evaluation of Standard Math Expressions
      try {
        // Disallow dangerous syntax
        if (/[^0-9+\-*/(). "]/g.test(cleanExpr)) return '#ERROR!';
        const result = Function(`"use strict"; return (${cleanExpr})`)();
        return (typeof result === 'number' && isNaN(result)) ? '#ERROR!' : result;
      } catch (err) {
        return '#ERROR!';
      }
    }

    function getCellValueParsed(r, c, visited) {
      const data = getCellData(r, c);
      if (!data.raw) return 0;
      if (typeof data.raw === 'string' && data.raw.startsWith('=')) {
        const res = evaluateFormula(data.raw, r, c, visited);
        return isNaN(res) ? res : Number(res);
      }
      return isNaN(data.raw) ? data.raw : Number(data.raw);
    }

    function recalculateAll() {
      const sheet = sheets[activeSheetId];
      for (let key in sheet.cells) {
        const [r, c] = key.split(',').map(Number);
        const data = sheet.cells[key];
        if (data.raw && data.raw.startsWith('=')) {
          data.computed = evaluateFormula(data.raw, r, c);
        } else {
          data.computed = data.raw;
        }
        updateCellDOM(r, c);
      }
    }

    // --- DOM Rendering ---
    function renderSheetTabs() {
      sheetTabsContainer.innerHTML = '';
      Object.values(sheets).forEach(sheet => {
        const tab = document.createElement('div');
        tab.className = `sheet-tab ${sheet.id === activeSheetId ? 'active' : ''}`;
        
        const title = document.createElement('span');
        title.textContent = sheet.name;
        tab.appendChild(title);

        // Double click tab to rename
        tab.addEventListener('dblclick', () => {
          const newName = prompt("Rename Sheet:", sheet.name);
          if (newName) {
            sheet.name = newName;
            renderSheetTabs();
          }
        });

        // Close button
        const closeBtn = document.createElement('span');
        closeBtn.innerHTML = '&times;';
        closeBtn.style.cursor = 'pointer';
        closeBtn.addEventListener('click', (e) => deleteSheet(sheet.id, e));
        tab.appendChild(closeBtn);

        tab.addEventListener('click', () => switchSheet(sheet.id));
        sheetTabsContainer.appendChild(tab);
      });
    }

    function renderGrid() {
      const sheet = sheets[activeSheetId];
      gridHead.innerHTML = '';
      gridBody.innerHTML = '';

      // Create Table Header
      const headerRow = document.createElement('tr');
      const cornerTh = document.createElement('th');
      cornerTh.className = 'corner-header';
      headerRow.appendChild(cornerTh);

      for (let c = 0; c < DEFAULT_COLS; c++) {
        const th = document.createElement('th');
        th.textContent = colToName(c);
        if (sheet.colWidths[c]) th.style.width = sheet.colWidths[c] + 'px';

        // Column Resizer
        const resizer = document.createElement('div');
        resizer.className = 'col-resizer';
        setupColumnResizer(resizer, c);
        th.appendChild(resizer);

        headerRow.appendChild(th);
      }
      gridHead.appendChild(headerRow);

      // Create Table Body
      for (let r = 0; r < DEFAULT_ROWS; r++) {
        const tr = document.createElement('tr');
        
        // Row Number Header
        const rowTh = document.createElement('th');
        rowTh.className = 'row-header';
        rowTh.textContent = r + 1;
        tr.appendChild(rowTh);

        for (let c = 0; c < DEFAULT_COLS; c++) {
          const td = document.createElement('td');
          td.dataset.r = r;
          td.dataset.c = c;
          updateTDStyleAndValue(td, r, c);
          tr.appendChild(td);
        }
        gridBody.appendChild(tr);
      }
    }

    function updateTDStyleAndValue(td, r, c) {
      const data = getCellData(r, c);
      td.textContent = data.computed !== undefined ? data.computed : data.raw;
      td.style.fontWeight = data.bold ? 'bold' : 'normal';
      td.style.fontStyle = data.italic ? 'italic' : 'normal';
      td.style.backgroundColor = data.bg || '#ffffff';
    }

    function updateCellDOM(r, c) {
      const td = gridBody.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
      if (td) updateTDStyleAndValue(td, r, c);
    }

    // --- Column Resizing ---
    function setupColumnResizer(resizer, colIndex) {
      let startX, startWidth;

      resizer.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startX = e.clientX;
        const th = resizer.parentElement;
        startWidth = th.offsetWidth;

        const onMouseMove = (moveEv) => {
          const newWidth = Math.max(30, startWidth + (moveEv.clientX - startX));
          sheets[activeSheetId].colWidths[colIndex] = newWidth;
          th.style.width = newWidth + 'px';
        };

        const onMouseUp = () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }

    // --- Selection Logic ---
    function setActiveCell(r, c, keepSelectionRange = false) {
      activeCell = { r, c };
      if (!keepSelectionRange) {
        selectionRange = { startR: r, startC: c, endR: r, endC: c };
      }
      highlightSelection();
      updateFormulaBar();
      updateToolbarState();
    }

    function highlightSelection() {
      const minR = Math.min(selectionRange.startR, selectionRange.endR);
      const maxR = Math.max(selectionRange.startR, selectionRange.endR);
      const minC = Math.min(selectionRange.startC, selectionRange.endC);
      const maxC = Math.max(selectionRange.startC, selectionRange.endC);

      const tds = gridBody.querySelectorAll('td');
      tds.forEach(td => {
        const r = parseInt(td.dataset.r, 10);
        const c = parseInt(td.dataset.c, 10);

        const inRange = r >= minR && r <= maxR && c >= minC && c <= maxC;
        const isActive = r === activeCell.r && c === activeCell.c;

        td.classList.toggle('selected', inRange);
        td.classList.toggle('active-cell', isActive);
      });
    }

    function updateFormulaBar() {
      cellAddressInput.value = formatAddress(activeCell.r, activeCell.c);
      const data = getCellData(activeCell.r, activeCell.c);
      if (!isEditingFormulaBar) {
        formulaInput.value = data.raw;
      }
    }

    function updateToolbarState() {
      const data = getCellData(activeCell.r, activeCell.c);
      document.getElementById('btn-bold').classList.toggle('active', !!data.bold);
      document.getElementById('btn-italic').classList.toggle('active', !!data.italic);
      document.getElementById('btn-bg-color').value = data.bg || '#ffffff';
    }

    // --- Cell Editing & Interactions ---
    function inlineEditCell(td) {
      if (td.querySelector('input')) return; // Already editing
      const r = parseInt(td.dataset.r, 10);
      const c = parseInt(td.dataset.c, 10);
      const data = getCellData(r, c);

      const input = document.createElement('input');
      input.className = 'cell-editor';
      input.value = data.raw;
      td.appendChild(input);
      input.focus();

      function finishEdit() {
        const newValue = input.value;
        td.removeChild(input);
        commitCellValue(r, c, newValue);
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          finishEdit();
          setActiveCell(Math.min(DEFAULT_ROWS - 1, r + 1), c);
        } else if (e.key === 'Escape') {
          td.removeChild(input);
        } else if (e.key === 'Tab') {
          e.preventDefault();
          finishEdit();
          setActiveCell(r, Math.min(DEFAULT_COLS - 1, c + 1));
        }
      });

      input.addEventListener('blur', finishEdit);
    }

    function commitCellValue(r, c, rawValue) {
      setCellData(r, c, { raw: rawValue });
      recalculateAll();
      updateFormulaBar();
    }

    // --- Formula Bar Mouse Selection Insertion ---
    function insertRangeIntoFormulaInput() {
      if (!isEditingFormulaBar) return;

      const minR = Math.min(selectionRange.startR, selectionRange.endR);
      const maxR = Math.max(selectionRange.startR, selectionRange.endR);
      const minC = Math.min(selectionRange.startC, selectionRange.endC);
      const maxC = Math.max(selectionRange.startC, selectionRange.endC);

      let refStr = "";
      if (minR === maxR && minC === maxC) {
        refStr = formatAddress(minR, minC);
      } else {
        refStr = `${formatAddress(minR, minC)}:${formatAddress(maxR, maxC)}`;
      }

      let val = formulaInput.value;
      // Append or replace reference trailing context
      if (val.endsWith('(') || val.endsWith('+') || val.endsWith('-') || val.endsWith('*') || val.endsWith('/') || val.endsWith('=')) {
        formulaInput.value = val + refStr;
      }
    }

    // --- Event Listeners ---
    function setupEventListeners() {
      // Grid Mouse Events
      gridBody.addEventListener('mousedown', (e) => {
        if (e.target.tagName !== 'TD') return;
        const r = parseInt(e.target.dataset.r, 10);
        const c = parseInt(e.target.dataset.c, 10);

        isMouseDown = true;
        selectionRange = { startR: r, startC: c, endR: r, endC: c };
        setActiveCell(r, c, true);

        if (isEditingFormulaBar) {
          insertRangeIntoFormulaInput();
        }
      });

      gridBody.addEventListener('mouseover', (e) => {
        if (!isMouseDown || e.target.tagName !== 'TD') return;
        const r = parseInt(e.target.dataset.r, 10);
        const c = parseInt(e.target.dataset.c, 10);

        selectionRange.endR = r;
        selectionRange.endC = c;
        highlightSelection();

        if (isEditingFormulaBar) {
          insertRangeIntoFormulaInput();
        }
      });

      document.addEventListener('mouseup', () => {
        isMouseDown = false;
      });

      gridBody.addEventListener('dblclick', (e) => {
        if (e.target.tagName === 'TD') {
          inlineEditCell(e.target);
        }
      });

      // Keyboard Navigation
      document.addEventListener('keydown', (e) => {
        // Avoid intercepting navigation when typing in inputs
        if (e.target.tagName === 'INPUT') return;

        let { r, c } = activeCell;
        if (e.key === 'ArrowUp') {
          r = Math.max(0, r - 1);
        } else if (e.key === 'ArrowDown') {
          r = Math.min(DEFAULT_ROWS - 1, r + 1);
        } else if (e.key === 'ArrowLeft') {
          c = Math.max(0, c - 1);
        } else if (e.key === 'ArrowRight') {
          c = Math.min(DEFAULT_COLS - 1, c + 1);
        } else if (e.key === 'Enter') {
          const td = gridBody.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
          if (td) inlineEditCell(td);
          return;
        } else if (e.key === 'Delete' || e.key === 'Backspace') {
          clearSelectedCells();
          return;
        } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
          // Direct typing opens editor
          const td = gridBody.querySelector(`td[data-r="${r}"][data-c="${c}"]`);
          if (td) {
            inlineEditCell(td);
            const input = td.querySelector('input');
            if (input) input.value = '';
          }
          return;
        } else {
          return;
        }

        e.preventDefault();
        setActiveCell(r, c);
      });

      // Formula Input Events
      formulaInput.addEventListener('focus', () => {
        isEditingFormulaBar = true;
      });

      formulaInput.addEventListener('blur', () => {
        // Slight delay to allow clicks to register
        setTimeout(() => { isEditingFormulaBar = false; }, 200);
      });

      formulaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          commitCellValue(activeCell.r, activeCell.c, formulaInput.value);
          formulaInput.blur();
        }
      });

      document.getElementById('add-sheet-btn').addEventListener('click', () => addSheet());
    }

    // --- Ribbon Actions ---
    function setupRibbon() {
      document.getElementById('btn-bold').addEventListener('click', () => {
        applyToSelection((r, c) => {
          const curr = getCellData(r, c).bold;
          setCellData(r, c, { bold: !curr });
        });
      });

      document.getElementById('btn-italic').addEventListener('click', () => {
        applyToSelection((r, c) => {
          const curr = getCellData(r, c).italic;
          setCellData(r, c, { italic: !curr });
        });
      });

      document.getElementById('btn-bg-color').addEventListener('input', (e) => {
        applyToSelection((r, c) => {
          setCellData(r, c, { bg: e.target.value });
        });
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        clearSelectedCells();
      });

      // Import / Export Setup
      document.getElementById('btn-export').addEventListener('click', exportCSV);
      const importInput = document.getElementById('csv-file-input');
      document.getElementById('btn-import-trigger').addEventListener('click', () => importInput.click());
      importInput.addEventListener('change', importCSV);
    }

    function applyToSelection(fn) {
      const minR = Math.min(selectionRange.startR, selectionRange.endR);
      const maxR = Math.max(selectionRange.startR, selectionRange.endR);
      const minC = Math.min(selectionRange.startC, selectionRange.endC);
      const maxC = Math.max(selectionRange.startC, selectionRange.endC);

      for (let r = minR; r <= maxR; r++) {
        for (let c = minC; c <= maxC; c++) {
          fn(r, c);
          updateCellDOM(r, c);
        }
      }
      updateToolbarState();
    }

    function clearSelectedCells() {
      applyToSelection((r, c) => {
        setCellData(r, c, { raw: '', computed: '', bold: false, italic: false, bg: '#ffffff' });
      });
      recalculateAll();
      updateFormulaBar();
    }

    // --- CSV Import & Export ---
    function exportCSV() {
      let csvContent = "";
      for (let r = 0; r < DEFAULT_ROWS; r++) {
        let rowData = [];
        for (let c = 0; c < DEFAULT_COLS; c++) {
          const data = getCellData(r, c);
          let val = data.computed !== undefined ? String(data.computed) : '';
          val = val.replace(/"/g, '""');
          if (val.includes(',') || val.includes('\n') || val.includes('"')) {
            val = `"${val}"`;
          }
          rowData.push(val);
        }
        csvContent += rowData.join(",") + "\n";
      }

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `${sheets[activeSheetId].name}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function importCSV(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        const lines = text.split(/\r\n|\n/);
        
        // Reset sheet
        sheets[activeSheetId].cells = {};

        lines.forEach((line, r) => {
          if (r >= DEFAULT_ROWS) return;
          // Simple CSV Split
          const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          cols.forEach((val, c) => {
            if (c >= DEFAULT_COLS) return;
            val = val.trim().replace(/^"|"$/g, '').replace(/""/g, '"');
            if (val) {
              setCellData(r, c, { raw: val });
            }
          });
        });

        recalculateAll();
        renderGrid();
        setActiveCell(0, 0);
      };
      reader.readAsText(file);
      e.target.value = ''; // Reset input
    }

    // Initialize application on load
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
