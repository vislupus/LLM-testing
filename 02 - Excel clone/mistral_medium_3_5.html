<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SheetClone - Excel-like Spreadsheet</title>
  <style>
    :root {
      --toolbar-bg: #f0f0f0;
      --toolbar-border: #ccc;
      --header-bg: #f0f0f0;
      --grid-bg: white;
      --selected-cell-bg: #d9d9d9;
      --selected-cell-border: #000;
      --formula-bar-bg: #f0f0f0;
      --sheet-tab-bg: #f0f0f0;
      --sheet-tab-active-bg: white;
      --text-color: #000;
      --border-color: #ccc;
      --highlight-color: #4f81bd;
      --error-color: #ff0000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 14px;
      user-select: none;
    }

    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #e8e8e8;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 2px 4px;
      background: var(--toolbar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      flex-wrap: wrap;
      gap: 4px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      border-right: 1px solid var(--toolbar-border);
      padding-right: 8px;
      margin-right: 4px;
    }

    .toolbar-button {
      padding: 4px 8px;
      border: 1px solid var(--toolbar-border);
      background: white;
      cursor: pointer;
      border-radius: 2px;
      min-width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .toolbar-button:hover {
      background: #e0e0e0;
    }

    .toolbar-button.active {
      background: #d0d0d0;
      border-bottom: 2px solid #444;
    }

    .toolbar-button[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .color-picker {
      width: 18px;
      height: 18px;
      display: inline-block;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .separator {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      margin: 0 4px;
    }

    /* Formula bar */
    .formula-bar {
      display: flex;
      align-items: center;
      padding: 2px 4px;
      background: var(--formula-bar-bg);
      border-bottom: 1px solid var(--toolbar-border);
      height: 30px;
    }

    .cell-ref {
      padding: 2px 8px;
      background: white;
      border: 1px solid var(--border-color);
      margin-right: 4px;
      min-width: 60px;
      text-align: center;
      font-weight: bold;
    }

    .formula-input {
      flex: 1;
      padding: 2px 8px;
      border: 1px solid var(--border-color);
      outline: none;
      height: 24px;
    }

    .formula-input:focus {
      border-color: var(--highlight-color);
    }

    /* Spreadsheet container */
    .spreadsheet-outer {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .row-header-container {
      width: 50px;
      min-width: 50px;
      background: var(--header-bg);
      border-right: 1px solid var(--border-color);
      overflow: hidden;
    }

    .column-header-container {
      height: 25px;
      min-height: 25px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }

    .corner {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 25px;
      background: #d0d0d0;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .spreadsheet-container {
      flex: 1;
      overflow: auto;
      position: relative;
    }

    .column-headers {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 10;
      display: flex;
      background: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .row-headers {
      position: sticky;
      left: 0;
      z-index: 10;
      background: var(--header-bg);
      border-right: 1px solid var(--border-color);
    }

    .grid {
      position: relative;
    }

    .row {
      display: flex;
    }

    .header-cell, .cell {
      width: 80px;
      min-width: 80px;
      height: 25px;
      line-height: 25px;
      text-align: left;
      padding: 0 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border-right: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }

    .header-cell {
      background: var(--header-bg);
      font-weight: bold;
      text-align: center;
      user-select: none;
      cursor: default;
    }

    .column-header {
      background: var(--header-bg);
      font-weight: bold;
      text-align: center;
      user-select: none;
      position: relative;
    }

    .row-header {
      background: var(--header-bg);
      font-weight: bold;
      text-align: right;
      padding-right: 8px;
      user-select: none;
      width: 50px;
      min-width: 50px;
    }

    .cell {
      background: var(--grid-bg);
      cursor: pointer;
      word-break: break-all;
    }

    .cell:hover {
      background: #f5f5f5;
    }

    .cell.selected {
      background: var(--selected-cell-bg);
      border: 1px solid var(--selected-cell-border);
      box-shadow: inset 0 0 0 1px var(--selected-cell-border);
    }

    .cell.editing {
      background: white;
      padding: 0;
    }

    .cell-input {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid var(--highlight-color);
      padding: 0;
      font: inherit;
      outline: none;
      background: white;
    }

    /* Resize handle */
    .resize-handle {
      position: absolute;
      right: 0;
      top: 0;
      width: 4px;
      height: 100%;
      background: var(--highlight-color);
      cursor: col-resize;
      opacity: 0;
    }

    .column-header:hover .resize-handle,
    .column-header.resizing .resize-handle {
      opacity: 1;
    }

    /* Sheet tabs */
    .sheet-tabs {
      display: flex;
      background: var(--sheet-tab-bg);
      border-top: 1px solid var(--border-color);
      padding: 0 4px;
      height: 30px;
      align-items: center;
    }

    .sheet-tab {
      padding: 4px 12px;
      margin: 0 2px;
      background: var(--sheet-tab-bg);
      border: 1px solid var(--border-color);
      border-bottom: none;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      height: 22px;
      display: flex;
      align-items: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sheet-tab.active {
      background: var(--sheet-tab-active-bg);
      border-bottom: 1px solid var(--sheet-tab-active-bg);
      margin-bottom: -1px;
    }

    .sheet-tab:hover {
      background: #d0d0d0;
    }

    .add-sheet {
      margin-left: auto;
      padding: 4px 8px;
      background: var(--sheet-tab-bg);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .add-sheet:hover {
      background: #d0d0d0;
    }

    /* Context menu */
    .context-menu {
      display: none;
      position: absolute;
      background: white;
      border: 1px solid var(--border-color);
      box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
      min-width: 150px;
    }

    .context-menu-item {
      padding: 6px 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .context-menu-item:hover {
      background: #e0e0e0;
    }

    .context-menu-item[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .context-menu-separator {
      height: 1px;
      background: var(--border-color);
      margin: 2px 0;
    }

    /* Status bar */
    .status-bar {
      background: var(--toolbar-bg);
      border-top: 1px solid var(--border-color);
      padding: 2px 8px;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }

    /* Modal dialog */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 4px;
      min-width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .modal input {
      width: 100%;
      padding: 8px;
      margin: 8px 0;
      border: 1px solid var(--border-color);
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-button {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      background: var(--toolbar-bg);
      cursor: pointer;
    }

    .modal-button.primary {
      background: #4f81bd;
      color: white;
      border-color: #4f81bd;
    }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: #333;
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      z-index: 1000;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    /* Selection rectangle */
    .selection-rectangle {
      position: absolute;
      border: 2px dashed var(--highlight-color);
      background: rgba(79, 129, 189, 0.2);
      pointer-events: none;
      z-index: 50;
      display: none;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="toolbar-button" data-action="bold" title="Bold (Ctrl+B)">B</button>
      <button class="toolbar-button" data-action="italic" title="Italic (Ctrl+I)">I</button>
      <button class="toolbar-button" data-action="underline" title="Underline (Ctrl+U)">U</button>
    </div>
    <div class="toolbar-group">
      <button class="toolbar-button" data-action="fill-color" title="Fill Color">
        <div class="color-picker" style="background: #ffff00;"></div>
      </button>
      <button class="toolbar-button" data-action="text-color" title="Text Color">
        <div class="color-picker" style="background: #000000;"></div>
      </button>
    </div>
    <div class="toolbar-group">
      <button class="toolbar-button" data-action="clear" title="Clear Contents">Clear</button>
    </div>
    <div class="toolbar-group">
      <button class="toolbar-button" data-action="download-csv" title="Download as CSV">Download CSV</button>
      <button class="toolbar-button" data-action="upload-csv" title="Upload CSV">Upload CSV</button>
      <input type="file" id="csv-upload" accept=".csv" style="display: none;">
    </div>
  </div>

  <div class="formula-bar">
    <div class="cell-ref">A1</div>
    <input type="text" class="formula-input" placeholder="Enter value or formula">
  </div>

  <div class="spreadsheet-outer">
    <div class="row-header-container">
      <div class="row-headers"></div>
    </div>
    <div class="spreadsheet-container">
      <div class="corner"></div>
      <div class="column-headers"></div>
      <div class="grid"></div>
      <div class="selection-rectangle"></div>
    </div>
  </div>

  <div class="sheet-tabs">
    <div class="sheet-tab active">Sheet1</div>
    <button class="add-sheet">+</button>
  </div>

  <div class="status-bar">
    <div class="status-left">Ready</div>
    <div class="status-right">Sheet1</div>
  </div>

  <div class="modal" id="rename-sheet-modal">
    <div class="modal-content">
      <h3>Rename Sheet</h3>
      <input type="text" id="sheet-name-input" placeholder="Enter sheet name">
      <div class="modal-buttons">
        <button class="modal-button" id="rename-cancel">Cancel</button>
        <button class="modal-button primary" id="rename-confirm">OK</button>
      </div>
    </div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    // ======================
    // UTILITY FUNCTIONS
    // ======================

    // Convert column index to Excel-style letter (0 -> A, 1 -> B, ..., 25 -> Z, 26 -> AA)
    function colToLetter(colIndex) {
      let letter = '';
      while (colIndex >= 0) {
        letter = String.fromCharCode(65 + (colIndex % 26)) + letter;
        colIndex = Math.floor(colIndex / 26) - 1;
      }
      return letter;
    }

    // Convert Excel-style letter to column index (A -> 0, B -> 1, ..., Z -> 25, AA -> 26)
    function letterToCol(letter) {
      let col = 0;
      for (let i = 0; i < letter.length; i++) {
        col = col * 26 + (letter.charCodeAt(i) - 64);
      }
      return col - 1;
    }

    // Parse cell address like "A1" to { col: 0, row: 0 }
    function parseCellAddress(addr) {
      const match = addr.match(/^([A-Z]+)([0-9]+)$/);
      if (!match) return null;
      const col = letterToCol(match[1]);
      const row = parseInt(match[2], 10) - 1; // Convert to 0-based
      return { col, row };
    }

    // Format cell address from col and row to "A1"
    function formatCellAddress(col, row) {
      return colToLetter(col) + (row + 1);
    }

    // Parse range address like "A1:B10" to { start: {col, row}, end: {col, row} }
    function parseRangeAddress(range) {
      const parts = range.split(':');
      if (parts.length !== 2) return null;
      return {
        start: parseCellAddress(parts[0]),
        end: parseCellAddress(parts[1])
      };
    }

    // Format range address from two cells
    function formatRangeAddress(startCol, startRow, endCol, endRow) {
      return `${formatCellAddress(startCol, startRow)}:${formatCellAddress(endCol, endRow)}`;
    }

    // Get all cell addresses in a range
    function getRangeCells(startCol, startRow, endCol, endRow) {
      const cells = [];
      const minCol = Math.min(startCol, endCol);
      const maxCol = Math.max(startCol, endCol);
      const minRow = Math.min(startRow, endRow);
      const maxRow = Math.max(startRow, endRow);

      for (let r = minRow; r <= maxRow; r++) {
        for (let c = minCol; c <= maxCol; c++) {
          cells.push({ col: c, row: r });
        }
      }
      return cells;
    }

    // ======================
    // FORMULA PARSER/EVALUATOR
    // ======================

    class FormulaEvaluator {
      constructor(sheet) {
        this.sheet = sheet;
      }

      evaluate(formula) {
        if (!formula || !formula.startsWith('=')) {
          return formula;
        }

        try {
          // Remove the leading '='
          formula = formula.substring(1).trim();

          // First, expand all ranges in the formula
          formula = this.expandRanges(formula);

          // Then, replace all cell references with their values
          formula = this.replaceCellReferences(formula);

          // Replace functions with our implementations
          formula = this.replaceFunctions(formula);

          // Evaluate the resulting expression
          return this.safeEval(formula);
        } catch (e) {
          console.error('Formula evaluation error:', e);
          return '#ERROR!';
        }
      }

      expandRanges(formula) {
        // Find all range references (A1:B10)
        const rangeRegex = /([A-Z]+\d+):([A-Z]+\d+)/g;
        let match;
        let lastIndex = 0;
        let result = '';

        while ((match = rangeRegex.exec(formula)) !== null) {
          // Add text before the match
          result += formula.substring(lastIndex, match.index);

          const startAddr = match[1];
          const endAddr = match[2];
          const start = parseCellAddress(startAddr);
          const end = parseCellAddress(endAddr);

          if (start && end) {
            const minCol = Math.min(start.col, end.col);
            const maxCol = Math.max(start.col, end.col);
            const minRow = Math.min(start.row, end.row);
            const maxRow = Math.max(start.row, end.row);

            const values = [];
            for (let r = minRow; r <= maxRow; r++) {
              for (let c = minCol; c <= maxCol; c++) {
                const cell = this.sheet.getCell(c, r);
                const value = cell.value;
                // Try to parse as number
                const num = parseFloat(value);
                values.push(isNaN(num) ? `"${value.replace(/"/g, '\\"')}"` : num);
              }
            }
            result += `[${values.join(',')}]`;
          } else {
            result += match[0];
          }

          lastIndex = rangeRegex.lastIndex;
        }

        // Add the remaining text
        result += formula.substring(lastIndex);

        return result;
      }

      replaceCellReferences(formula) {
        // Find all cell references (A1)
        const cellRegex = /([A-Z]+\d+)/g;
        let match;
        let lastIndex = 0;
        let result = '';

        while ((match = cellRegex.exec(formula)) !== null) {
          // Check if this is part of a range (we already handled ranges)
          if (formula[match.index + match[0].length] === ':') {
            // This is part of a range, skip it (should have been handled by expandRanges)
            result += formula.substring(lastIndex, match.index + match[0].length);
            lastIndex = match.index + match[0].length;
            continue;
          }

          // Add text before the match
          result += formula.substring(lastIndex, match.index);

          const addr = match[1];
          const cell = parseCellAddress(addr);
          if (cell) {
            const cellData = this.sheet.getCell(cell.col, cell.row);
            const value = cellData.value;
            // Try to parse as number
            const num = parseFloat(value);
            result += isNaN(num) ? `"${value.replace(/"/g, '\\"')}"` : num;
          } else {
            result += match[1];
          }

          lastIndex = match.index + match[0].length;
        }

        // Add the remaining text
        result += formula.substring(lastIndex);

        return result;
      }

      replaceFunctions(formula) {
        // Replace Excel functions with our JavaScript implementations
        const replacements = {
          'SUM': 'ourSum',
          'AVERAGE': 'ourAverage',
          'MIN': 'ourMin',
          'MAX': 'ourMax',
          'COUNT': 'ourCount',
          'COUNTA': 'ourCountA',
          'PRODUCT': 'ourProduct',
          'IF': 'ourIf',
          'AND': 'ourAnd',
          'OR': 'ourOr',
          'NOT': 'ourNot',
          'CONCATENATE': 'ourConcatenate',
          'LEN': 'ourLen',
          'LEFT': 'ourLeft',
          'RIGHT': 'ourRight',
          'MID': 'ourMid',
          'UPPER': 'ourUpper',
          'LOWER': 'ourLower',
          'ROUND': 'ourRound',
          'ROUNDUP': 'ourRoundUp',
          'ROUNDDOWN': 'ourRoundDown',
          'CEILING': 'ourCeiling',
          'FLOOR': 'ourFloor',
          'ABS': 'ourAbs',
          'SQRT': 'ourSqrt',
          'POWER': 'ourPower',
          'EXP': 'ourExp',
          'LN': 'ourLn',
          'LOG10': 'ourLog10',
          'SIN': 'ourSin',
          'COS': 'ourCos',
          'TAN': 'ourTan',
          'PI': 'Math.PI',
          'E': 'Math.E'
        };

        for (const [excelFunc, jsFunc] of Object.entries(replacements)) {
          // Match function names, being careful with case sensitivity and word boundaries
          const regex = new RegExp(`\\b${excelFunc}\\b`, 'gi');
          formula = formula.replace(regex, jsFunc);
        }

        return formula;
      }

      safeEval(expr) {
        // Create a safe evaluation context
        const ourSum = (...args) => {
          const flatArgs = args.flat(Infinity);
          return flatArgs.reduce((sum, val) => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return sum + (isNaN(num) ? 0 : num);
          }, 0);
        };

        const ourAverage = (...args) => {
          const flatArgs = args.flat(Infinity);
          const validNumbers = flatArgs.filter(val => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return !isNaN(num);
          }).map(val => typeof val === 'number' ? val : parseFloat(val));

          return validNumbers.length > 0 ?
            validNumbers.reduce((sum, num) => sum + num, 0) / validNumbers.length : 0;
        };

        const ourMin = (...args) => {
          const flatArgs = args.flat(Infinity);
          const validNumbers = flatArgs.filter(val => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return !isNaN(num);
          }).map(val => typeof val === 'number' ? val : parseFloat(val));

          return validNumbers.length > 0 ? Math.min(...validNumbers) : 0;
        };

        const ourMax = (...args) => {
          const flatArgs = args.flat(Infinity);
          const validNumbers = flatArgs.filter(val => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return !isNaN(num);
          }).map(val => typeof val === 'number' ? val : parseFloat(val));

          return validNumbers.length > 0 ? Math.max(...validNumbers) : 0;
        };

        const ourCount = (...args) => {
          const flatArgs = args.flat(Infinity);
          return flatArgs.filter(val => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return !isNaN(num);
          }).length;
        };

        const ourCountA = (...args) => {
          const flatArgs = args.flat(Infinity);
          return flatArgs.filter(val => val !== '').length;
        };

        const ourProduct = (...args) => {
          const flatArgs = args.flat(Infinity);
          return flatArgs.reduce((prod, val) => {
            const num = typeof val === 'number' ? val : parseFloat(val);
            return prod * (isNaN(num) ? 0 : num);
          }, 1);
        };

        const ourIf = (condition, trueValue, falseValue) => {
          // Evaluate condition as boolean
          if (typeof condition === 'boolean') return condition ? trueValue : falseValue;
          if (typeof condition === 'number') return condition !== 0 ? trueValue : falseValue;
          if (typeof condition === 'string') {
            if (condition.toLowerCase() === 'true') return trueValue;
            if (condition.toLowerCase() === 'false') return falseValue;
            const num = parseFloat(condition);
            return isNaN(num) ? falseValue : (num !== 0 ? trueValue : falseValue);
          }
          return condition ? trueValue : falseValue;
        };

        const ourAnd = (...args) => {
          for (const arg of args) {
            if (!this.toBoolean(arg)) return false;
          }
          return true;
        };

        const ourOr = (...args) => {
          for (const arg of args) {
            if (this.toBoolean(arg)) return true;
          }
          return false;
        };

        const ourNot = (arg) => !this.toBoolean(arg);

        const ourConcatenate = (...args) => args.join('');

        const ourLen = (str) => (str || '').toString().length;

        const ourLeft = (str, num) => (str || '').toString().substring(0, num);
        const ourRight = (str, num) => {
          const s = (str || '').toString();
          return num > s.length ? s : s.substring(s.length - num);
        };
        const ourMid = (str, start, length) => (str || '').toString().substring(start - 1, start - 1 + length);

        const ourUpper = (str) => (str || '').toString().toUpperCase();
        const ourLower = (str) => (str || '').toString().toLowerCase();

        const ourRound = (num, decimals) => Math.round(parseFloat(num) * Math.pow(10, decimals)) / Math.pow(10, decimals);
        const ourRoundUp = (num, decimals) => {
          const factor = Math.pow(10, decimals);
          return Math.ceil(parseFloat(num) * factor) / factor;
        };
        const ourRoundDown = (num, decimals) => {
          const factor = Math.pow(10, decimals);
          return Math.floor(parseFloat(num) * factor) / factor;
        };
        const ourCeiling = (num, significance) => {
          significance = significance || 1;
          return Math.ceil(parseFloat(num) / significance) * significance;
        };
        const ourFloor = (num, significance) => {
          significance = significance || 1;
          return Math.floor(parseFloat(num) / significance) * significance;
        };
        const ourAbs = (num) => Math.abs(parseFloat(num));
        const ourSqrt = (num) => Math.sqrt(parseFloat(num));
        const ourPower = (base, exponent) => Math.pow(parseFloat(base), parseFloat(exponent));
        const ourExp = (num) => Math.exp(parseFloat(num));
        const ourLn = (num) => Math.log(parseFloat(num));
        const ourLog10 = (num) => Math.log10(parseFloat(num));
        const ourSin = (num) => Math.sin(parseFloat(num));
        const ourCos = (num) => Math.cos(parseFloat(num));
        const ourTan = (num) => Math.tan(parseFloat(num));

        const toBoolean = (val) => {
          if (typeof val === 'boolean') return val;
          if (typeof val === 'number') return val !== 0;
          if (typeof val === 'string') {
            if (val.toLowerCase() === 'true') return true;
            if (val.toLowerCase() === 'false') return false;
            const num = parseFloat(val);
            return !isNaN(num) && num !== 0;
          }
          return Boolean(val);
        };

        // Create a function with all our functions in scope
        const funcBody = `
          with (Math) {
            return ${expr};
          }
        `;

        try {
          const func = new Function(
            'ourSum', 'ourAverage', 'ourMin', 'ourMax', 'ourCount', 'ourCountA',
            'ourProduct', 'ourIf', 'ourAnd', 'ourOr', 'ourNot', 'ourConcatenate',
            'ourLen', 'ourLeft', 'ourRight', 'ourMid', 'ourUpper', 'ourLower',
            'ourRound', 'ourRoundUp', 'ourRoundDown', 'ourCeiling', 'ourFloor',
            'ourAbs', 'ourSqrt', 'ourPower', 'ourExp', 'ourLn', 'ourLog10',
            'ourSin', 'ourCos', 'ourTan',
            funcBody
          );

          return func(
            ourSum, ourAverage, ourMin, ourMax, ourCount, ourCountA,
            ourProduct, ourIf, ourAnd, ourOr, ourNot, ourConcatenate,
            ourLen, ourLeft, ourRight, ourMid, ourUpper, ourLower,
            ourRound, ourRoundUp, ourRoundDown, ourCeiling, ourFloor,
            ourAbs, ourSqrt, ourPower, ourExp, ourLn, ourLog10,
            ourSin, ourCos, ourTan
          );
        } catch (e) {
          console.error('Error in formula evaluation:', e);
          return '#ERROR!';
        }
      }

      toBoolean(val) {
        if (typeof val === 'boolean') return val;
        if (typeof val === 'number') return val !== 0;
        if (typeof val === 'string') {
          if (val.toLowerCase() === 'true') return true;
          if (val.toLowerCase() === 'false') return false;
          const num = parseFloat(val);
          return !isNaN(num) && num !== 0;
        }
        return Boolean(val);
      }
    }

    class Sheet {
      constructor(name, rows = 100, cols = 26) {
        this.name = name;
        this.rows = rows;
        this.cols = cols;
        this.data = []; // 2D array: [row][col] = { value: string, formula: string|null, style: object }
        this.columnWidths = []; // Array of column widths
        this.rowHeights = []; // Array of row heights
        this.dependencies = new Map(); // cell address -> Set of cell addresses that depend on it
        this.dependents = new Map(); // cell address -> Set of cell addresses it depends on
        this.selectedCell = null; // { col, row }
        this.selection = null; // { start: {col, row}, end: {col, row} }
        this.activeEditCell = null; // { col, row } of cell being edited

        // Initialize data
        for (let r = 0; r < this.rows; r++) {
          this.data[r] = [];
          this.rowHeights[r] = 25;
          for (let c = 0; c < this.cols; c++) {
            this.data[r][c] = {
              value: '',
              formula: null,
              style: {}
            };
          }
        }

        // Initialize column widths
        for (let c = 0; c < this.cols; c++) {
          this.columnWidths[c] = 80;
        }

        // Initialize dependency maps
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const addr = formatCellAddress(c, r);
            this.dependencies.set(addr, new Set());
            this.dependents.set(addr, new Set());
          }
        }
      }

      getCell(col, row) {
        // Expand grid if needed
        while (row >= this.data.length) {
          this.expandRows(1);
        }
        while (col >= this.data[0].length) {
          this.expandCols(1);
        }
        return this.data[row][col];
      }

      setCellValue(col, row, value, formula = null) {
        // Expand grid if needed
        while (row >= this.data.length) {
          this.expandRows(1);
        }
        while (col >= this.data[0].length) {
          this.expandCols(1);
        }

        const addr = formatCellAddress(col, row);
        const cell = this.data[row][col];

        // If nothing has changed, return
        if (cell.value === value && cell.formula === formula) {
          return;
        }

        // Update the cell
        const oldFormula = cell.formula;
        cell.value = value;
        cell.formula = formula;

        // Update dependencies
        this.updateDependencies(addr, oldFormula, formula);

        // Recalculate dependents
        this.recalculateDependents(addr);
      }

      expandRows(count) {
        for (let i = 0; i < count; i++) {
          const newRow = [];
          this.rowHeights[this.data.length] = 25;
          for (let c = 0; c < this.cols; c++) {
            newRow[c] = { value: '', formula: null, style: {} };
            const addr = formatCellAddress(c, this.data.length);
            this.dependencies.set(addr, new Set());
            this.dependents.set(addr, new Set());
          }
          this.data.push(newRow);
        }
        this.rows = this.data.length;
      }

      expandCols(count) {
        for (let r = 0; r < this.data.length; r++) {
          for (let i = 0; i < count; i++) {
            const newCol = this.data[r].length;
            this.data[r][newCol] = { value: '', formula: null, style: {} };
            this.columnWidths[newCol] = 80;
            const addr = formatCellAddress(newCol, r);
            this.dependencies.set(addr, new Set());
            this.dependents.set(addr, new Set());
          }
        }
        this.cols = this.data[0].length;
      }

      updateDependencies(addr, oldFormula, newFormula) {
        // Remove old dependencies
        if (oldFormula) {
          const oldDeps = this.parseDependencies(oldFormula);
          for (const depAddr of oldDeps) {
            if (this.dependents.has(depAddr)) {
              this.dependents.get(depAddr).delete(addr);
            }
            if (this.dependencies.has(addr)) {
              this.dependencies.get(addr).delete(depAddr);
            }
          }
        }

        // Add new dependencies
        if (newFormula) {
          const newDeps = this.parseDependencies(newFormula);
          for (const depAddr of newDeps) {
            if (!this.dependents.has(depAddr)) {
              this.dependents.set(depAddr, new Set());
            }
            this.dependents.get(depAddr).add(addr);

            if (!this.dependencies.has(addr)) {
              this.dependencies.set(addr, new Set());
            }
            this.dependencies.get(addr).add(depAddr);
          }
        }
      }

      parseDependencies(formula) {
        const deps = new Set();
        // Find all cell references in the formula
        const cellRefRegex = /([A-Z]+[0-9]+)/g;
        let match;
        while ((match = cellRefRegex.exec(formula)) !== null) {
          const addr = match[1];
          // Check if this is part of a range
          const nextChar = formula[match.index + addr.length];
          if (nextChar !== ':') {
            deps.add(addr);
          }
        }

        // Find all range references
        const rangeRegex = /([A-Z]+[0-9]+):([A-Z]+[0-9]+)/g;
        while ((match = rangeRegex.exec(formula)) !== null) {
          const startAddr = match[1];
          const endAddr = match[2];
          deps.add(`${startAddr}:${endAddr}`);
        }

        return deps;
      }

      recalculateDependents(addr) {
        const queue = new Set([addr]);
        const visited = new Set();

        while (queue.size > 0) {
          const currentAddr = queue.values().next().value;
          queue.delete(currentAddr);

          if (visited.has(currentAddr)) continue;
          visited.add(currentAddr);

          // Recalculate this cell
          this.recalculateCell(currentAddr);

          // Add all dependents to the queue
          if (this.dependents.has(currentAddr)) {
            for (const dependentAddr of this.dependents.get(currentAddr)) {
              queue.add(dependentAddr);
            }
          }
        }
      }

      recalculateCell(addr) {
        const cell = parseCellAddress(addr);
        if (!cell) return;

        const cellData = this.getCell(cell.col, cell.row);

        if (!cellData.formula) {
          // No formula, value is already set
          return cellData.value;
        }

        try {
          const evaluator = new FormulaEvaluator(this);
          const value = evaluator.evaluate(cellData.formula);

          // Only update if the value has changed to avoid infinite loops
          if (cellData.value !== value) {
            cellData.value = value;
            // Trigger recalculation of dependents
            this.recalculateDependents(addr);
          }
        } catch (e) {
          cellData.value = '#ERROR!';
        }
      }

      getRangeValues(startCol, startRow, endCol, endRow) {
        const minCol = Math.min(startCol, endCol);
        const maxCol = Math.max(startCol, endCol);
        const minRow = Math.min(startRow, endRow);
        const maxRow = Math.max(startRow, endRow);

        const values = [];
        for (let r = minRow; r <= maxRow; r++) {
          const rowValues = [];
          for (let c = minCol; c <= maxCol; c++) {
            rowValues.push(this.getCell(c, r).value);
          }
          values.push(rowValues);
        }
        return values;
      }

      clearCell(col, row) {
        this.setCellValue(col, row, '', null);
        this.getCell(col, row).style = {};
      }

      clearRange(startCol, startRow, endCol, endRow) {
        const cells = getRangeCells(startCol, startRow, endCol, endRow);
        for (const cell of cells) {
          this.clearCell(cell.col, cell.row);
        }
      }

      copyRange(startCol, startRow, endCol, endRow) {
        const cells = getRangeCells(startCol, startRow, endCol, endRow);
        const clipboard = [];
        for (const cell of cells) {
          const cellData = this.getCell(cell.col, cell.row);
          clipboard.push({
            value: cellData.value,
            formula: cellData.formula,
            style: { ...cellData.style }
          });
        }
        return clipboard;
      }

      pasteRange(startCol, startRow, clipboardData) {
        let index = 0;
        for (let r = startRow; r < startRow + Math.ceil(Math.sqrt(clipboardData.length)) && index < clipboardData.length; r++) {
          for (let c = startCol; c < startCol + Math.floor(Math.sqrt(clipboardData.length)) && index < clipboardData.length; c++) {
            const data = clipboardData[index++];
            this.setCellValue(c, r, data.value, data.formula);
            this.getCell(c, r).style = { ...data.style };
          }
        }
      }
    }

    class SpreadsheetApp {
      constructor() {
        // DOM elements
        this.toolbar = document.querySelector('.toolbar');
        this.formulaBar = document.querySelector('.formula-bar');
        this.cellRefDisplay = document.querySelector('.cell-ref');
        this.formulaInput = document.querySelector('.formula-input');
        this.columnHeaders = document.querySelector('.column-headers');
        this.rowHeaders = document.querySelector('.row-headers');
        this.grid = document.querySelector('.grid');
        this.sheetTabs = document.querySelector('.sheet-tabs');
        this.statusBarLeft = document.querySelector('.status-left');
        this.statusBarRight = document.querySelector('.status-right');
        this.spreadsheetContainer = document.querySelector('.spreadsheet-container');
        this.selectionRectangle = document.querySelector('.selection-rectangle');
        this.csvUpload = document.getElementById('csv-upload');
        this.renameModal = document.getElementById('rename-sheet-modal');
        this.sheetNameInput = document.getElementById('sheet-name-input');
        this.renameCancel = document.getElementById('rename-cancel');
        this.renameConfirm = document.getElementById('rename-confirm');
        this.tooltip = document.getElementById('tooltip');

        // State
        this.sheets = [];
        this.activeSheetIndex = 0;
        this.isSelecting = false;
        this.dragStart = null;
        this.isDragging = false;
        this.isResizing = false;
        this.resizeStart = null;
        this.resizeHeader = null;
        this.clipboard = null;
        this.lastSelectedCell = null;
        this.formulaBarFocused = false;

        // Initialize
        this.addSheet('Sheet1');
        this.setupUI();
        this.setupEventListeners();
        this.updateStatusBar();
      }

      addSheet(name) {
        const sheet = new Sheet(name);
        this.sheets.push(sheet);
        this.renderSheetTabs();
        if (this.sheets.length === 1) {
          this.switchToSheet(0);
        }
        return sheet;
      }

      switchToSheet(index) {
        if (index < 0 || index >= this.sheets.length) return;

        // Save current sheet's state if needed
        this.activeSheetIndex = index;
        this.renderSheet();
        this.renderSheetTabs();
        this.updateFormulaBar();
        this.updateStatusBar();
      }

      renameSheet(index, newName) {
        if (index < 0 || index >= this.sheets.length) return;
        if (!newName || newName.trim() === '') return;

        this.sheets[index].name = newName.trim();
        this.renderSheetTabs();
        this.updateStatusBar();
      }

      deleteSheet(index) {
        if (this.sheets.length <= 1) {
          alert('Cannot delete the last sheet.');
          return false;
        }

        if (index === this.activeSheetIndex) {
          // Switch to another sheet before deleting
          this.switchToSheet(index > 0 ? index - 1 : index + 1);
        }

        this.sheets.splice(index, 1);
        this.renderSheetTabs();
        return true;
      }

      getActiveSheet() {
        return this.sheets[this.activeSheetIndex];
      }

      renderSheetTabs() {
        this.sheetTabs.innerHTML = '';

        this.sheets.forEach((sheet, index) => {
          const tab = document.createElement('div');
          tab.className = 'sheet-tab' + (index === this.activeSheetIndex ? ' active' : '');
          tab.textContent = sheet.name;
          tab.dataset.index = index;

          tab.addEventListener('click', (e) => {
            if (e.button === 0) { // Left click
              this.switchToSheet(index);
            }
          });

          tab.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            this.showSheetContextMenu(e.clientX, e.clientY, index);
          });

          tab.addEventListener('dblclick', (e) => {
            this.promptRenameSheet(index);
          });

          this.sheetTabs.insertBefore(tab, this.sheetTabs.lastChild);
        });
      }

      showSheetContextMenu(x, y, sheetIndex) {
        // Hide any existing context menu
        const existingMenu = document.querySelector('.context-menu');
        if (existingMenu) existingMenu.remove();

        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.style.left = `${x}px`;
        menu.style.top = `${y}px`;

        const renameItem = document.createElement('div');
        renameItem.className = 'context-menu-item';
        renameItem.textContent = 'Rename';
        renameItem.addEventListener('click', () => {
          this.promptRenameSheet(sheetIndex);
          menu.remove();
        });

        const deleteItem = document.createElement('div');
        deleteItem.className = 'context-menu-item';
        deleteItem.textContent = 'Delete';
        deleteItem.addEventListener('click', () => {
          this.deleteSheet(sheetIndex);
          menu.remove();
        });

        // Disable delete if it's the last sheet
        if (this.sheets.length <= 1) {
          deleteItem.setAttribute('disabled', 'true');
        }

        menu.appendChild(renameItem);
        menu.appendChild(deleteItem);
        document.body.appendChild(menu);

        // Close menu when clicking elsewhere
        const closeMenu = () => {
          menu.remove();
          document.removeEventListener('click', closeMenu);
        };
        setTimeout(() => {
          document.addEventListener('click', closeMenu);
        }, 10);
      }

      promptRenameSheet(index) {
        this.currentRenameIndex = index;
        this.sheetNameInput.value = this.sheets[index].name;
        this.renameModal.style.display = 'flex';
        this.sheetNameInput.focus();
        this.sheetNameInput.select();
      }

      confirmRenameSheet() {
        if (this.currentRenameIndex !== undefined) {
          this.renameSheet(this.currentRenameIndex, this.sheetNameInput.value);
          this.currentRenameIndex = undefined;
        }
        this.renameModal.style.display = 'none';
      }

      cancelRenameSheet() {
        this.currentRenameIndex = undefined;
        this.renameModal.style.display = 'none';
      }

      renderSheet() {
        const sheet = this.getActiveSheet();
        const fragment = document.createDocumentFragment();

        // Render column headers
        this.columnHeaders.innerHTML = '';
        for (let c = 0; c < sheet.cols; c++) {
          const header = document.createElement('div');
          header.className = 'header-cell column-header';
          header.textContent = colToLetter(c);
          header.dataset.col = c;
          header.style.width = `${sheet.columnWidths[c]}px`;
          header.style.minWidth = `${sheet.columnWidths[c]}px`;

          // Add resize handle
          const resizeHandle = document.createElement('div');
          resizeHandle.className = 'resize-handle';
          header.appendChild(resizeHandle);

          this.columnHeaders.appendChild(header);
        }

        // Render row headers
        this.rowHeaders.innerHTML = '';
        for (let r = 0; r < sheet.rows; r++) {
          const header = document.createElement('div');
          header.className = 'header-cell row-header';
          header.textContent = r + 1;
          header.dataset.row = r;
          header.style.height = `${sheet.rowHeights[r]}px`;
          this.rowHeaders.appendChild(header);
        }

        // Render grid
        this.grid.innerHTML = '';
        for (let r = 0; r < sheet.rows; r++) {
          const row = document.createElement('div');
          row.className = 'row';
          row.dataset.row = r;
          row.style.height = `${sheet.rowHeights[r]}px`;

          for (let c = 0; c < sheet.cols; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.dataset.col = c;
            cell.dataset.row = r;
            cell.style.width = `${sheet.columnWidths[c]}px`;
            cell.style.minWidth = `${sheet.columnWidths[c]}px`;
            cell.style.height = `${sheet.rowHeights[r]}px`;

            const cellData = sheet.data[r][c];
            cell.textContent = cellData.value;

            // Apply styles
            this.applyCellStyles(cell, cellData.style);

            row.appendChild(cell);
          }

          this.grid.appendChild(row);
        }

        // Set container sizes
        this.columnHeaders.style.width = `${sheet.columnWidths.slice(0, sheet.cols).reduce((a, b) => a + b, 0)}px`;
        this.columnHeaders.style.minWidth = this.columnHeaders.style.width;
        this.grid.style.width = this.columnHeaders.style.width;

        // Restore selection if any
        if (sheet.selectedCell) {
          this.selectCell(sheet.selectedCell.col, sheet.selectedCell.row, false);
        } else {
          // Select the first cell by default
          this.selectCell(0, 0, false);
        }

        // Update the scroll position if we had a previous scroll
        if (sheet.scrollTop) {
          this.spreadsheetContainer.scrollTop = sheet.scrollTop;
        }
        if (sheet.scrollLeft) {
          this.spreadsheetContainer.scrollLeft = sheet.scrollLeft;
        }
      }

      applyCellStyles(cellElement, style) {
        cellElement.style.fontWeight = style.bold ? 'bold' : '';
        cellElement.style.fontStyle = style.italic ? 'italic' : '';
        cellElement.style.textDecoration = style.underline ? 'underline' : '';
        cellElement.style.backgroundColor = style.backgroundColor || '';
        cellElement.style.color = style.textColor || '';
        cellElement.style.fontSize = style.fontSize || '';
        cellElement.style.textAlign = style.textAlign || '';
        cellElement.style.verticalAlign = style.verticalAlign || '';
      }

      selectCell(col, row, scrollIntoView = true) {
        const sheet = this.getActiveSheet();

        // Clear previous selection
        document.querySelectorAll('.cell.selected').forEach(el => {
          el.classList.remove('selected');
        });

        // Select the new cell
        const cell = document.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
        if (cell) {
          cell.classList.add('selected');
          if (scrollIntoView) {
            this.scrollCellIntoView(cell);
          }
        }

        // Update sheet's selected cell
        sheet.selectedCell = { col, row };
        sheet.selection = null; // Clear range selection

        // Update formula bar
        this.updateFormulaBar();

        // Update status bar
        this.updateStatusBar();

        // Store for potential range selection
        this.lastSelectedCell = { col, row };
      }

      selectRange(startCol, startRow, endCol, endRow) {
        const sheet = this.getActiveSheet();

        // Clear previous selection
        document.querySelectorAll('.cell.selected').forEach(el => {
          el.classList.remove('selected');
        });

        // Select all cells in the range
        const minCol = Math.min(startCol, endCol);
        const maxCol = Math.max(startCol, endCol);
        const minRow = Math.min(startRow, endRow);
        const maxRow = Math.max(startRow, endRow);

        for (let r = minRow; r <= maxRow; r++) {
          for (let c = minCol; c <= maxCol; c++) {
            const cell = document.querySelector(`.cell[data-col="${c}"][data-row="${r}"]`);
            if (cell) {
              cell.classList.add('selected');
            }
          }
        }

        // Update sheet's selection
        sheet.selection = {
          start: { col: minCol, row: minRow },
          end: { col: maxCol, row: maxRow }
        };
        sheet.selectedCell = { col: endCol, row: endRow };

        // Update formula bar (show the active cell)
        this.updateFormulaBar();

        // Update status bar
        this.updateStatusBar();
      }

      scrollCellIntoView(cellElement) {
        if (!cellElement) return;

        const container = this.spreadsheetContainer;
        const cellRect = cellElement.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();

        // Scroll horizontally if needed
        if (cellRect.left < containerRect.left) {
          container.scrollLeft += cellRect.left - containerRect.left - 10;
        } else if (cellRect.right > containerRect.right) {
          container.scrollLeft += cellRect.right - containerRect.right + 10;
        }

        // Scroll vertically if needed
        if (cellRect.top < containerRect.top) {
          container.scrollTop += cellRect.top - containerRect.top - 10;
        } else if (cellRect.bottom > containerRect.bottom) {
          container.scrollTop += cellRect.bottom - containerRect.bottom + 10;
        }
      }

      updateFormulaBar() {
        const sheet = this.getActiveSheet();
        if (!sheet.selectedCell) return;

        const { col, row } = sheet.selectedCell;
        const cell = sheet.getCell(col, row);

        // Update cell reference display
        this.cellRefDisplay.textContent = formatCellAddress(col, row);

        // Update formula input
        if (this.formulaBarFocused) return; // Don't update if user is typing
        if (cell.formula) {
          this.formulaInput.value = cell.formula;
        } else {
          this.formulaInput.value = cell.value;
        }
      }

      updateStatusBar() {
        const sheet = this.getActiveSheet();
        if (sheet.selectedCell) {
          this.statusBarLeft.textContent = `${formatCellAddress(sheet.selectedCell.col, sheet.selectedCell.row)} - Ready`;
        } else {
          this.statusBarLeft.textContent = 'Ready';
        }
        this.statusBarRight.textContent = sheet.name;
      }

      startEditing(cellElement) {
        const col = parseInt(cellElement.dataset.col);
        const row = parseInt(cellElement.dataset.row);
        const sheet = this.getActiveSheet();
        const cell = sheet.getCell(col, row);

        // Save the current edit cell
        sheet.activeEditCell = { col, row };

        // Create an input element
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'cell-input';
        input.value = cell.formula ? cell.formula : cell.value;

        // Position the input over the cell
        const rect = cellElement.getBoundingClientRect();
        input.style.width = `${rect.width}px`;
        input.style.height = `${rect.height}px`;
        input.style.left = `${cellElement.offsetLeft}px`;
        input.style.top = `${cellElement.offsetTop}px`;

        // Add to grid
        this.grid.appendChild(input);
        input.focus();
        input.select();

        // Store reference to clean up later
        this.editInput = input;

        // Handle input events
        const endEditing = () => this.endEditing();
        const cancelEditing = () => this.cancelEditing();

        input.addEventListener('blur', endEditing);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            endEditing();
          } else if (e.key === 'Escape') {
            cancelEditing();
          } else if (e.key === 'Tab') {
            e.preventDefault();
            endEditing();
            // Move to next cell
            const { col, row } = sheet.activeEditCell;
            if (e.shiftKey) {
              this.selectCell(Math.max(0, col - 1), row);
            } else {
              this.selectCell(Math.min(sheet.cols - 1, col + 1), row);
            }
          }
        });
      }

      endEditing() {
        if (!this.editInput) return;

        const sheet = this.getActiveSheet();
        if (!sheet.activeEditCell) return;

        const { col, row } = sheet.activeEditCell;
        const value = this.editInput.value;

        // Update the cell
        if (value.startsWith('=')) {
          sheet.setCellValue(col, row, '', value); // value will be calculated from formula
        } else {
          sheet.setCellValue(col, row, value, null);
        }

        // Clean up
        this.editInput.remove();
        this.editInput = null;
        sheet.activeEditCell = null;

        // Re-render the cell
        this.renderCell(col, row);

        // Update formula bar
        this.updateFormulaBar();
      }

      cancelEditing() {
        if (!this.editInput) return;

        this.editInput.remove();
        this.editInput = null;

        const sheet = this.getActiveSheet();
        if (sheet.activeEditCell) {
          sheet.activeEditCell = null;
        }
      }

      renderCell(col, row) {
        const sheet = this.getActiveSheet();
        const cellElement = document.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
        if (cellElement) {
          const cellData = sheet.getCell(col, row);
          cellElement.textContent = cellData.value;
          this.applyCellStyles(cellElement, cellData.style);
        }
      }

      showTooltip(text, x, y) {
        this.tooltip.textContent = text;
        this.tooltip.style.left = `${x + 10}px`;
        this.tooltip.style.top = `${y + 10}px`;
        this.tooltip.style.opacity = '1';
      }

      hideTooltip() {
        this.tooltip.style.opacity = '0';
      }

      setupUI() {
        // Initial render
        this.renderSheet();
        this.renderSheetTabs();
        this.updateStatusBar();
      }

      setupEventListeners() {
        // Toolbar actions
        this.toolbar.addEventListener('click', (e) => {
          if (e.target.classList.contains('toolbar-button')) {
            const action = e.target.dataset.action;
            this.handleToolbarAction(action);
          } else if (e.target.classList.contains('color-picker')) {
            const action = e.target.parentElement.dataset.action;
            this.handleToolbarAction(action);
          }
        });

        // Formula bar
        this.formulaInput.addEventListener('focus', () => {
          this.formulaBarFocused = true;
        });

        this.formulaInput.addEventListener('blur', () => {
          this.formulaBarFocused = false;
          this.updateFormulaBar();
        });

        this.formulaInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.formulaInput.blur();
          } else if (e.key === 'Escape') {
            this.formulaInput.value = '';
            this.formulaInput.blur();
          }
        });

        // Formula bar changes
        this.formulaInput.addEventListener('input', () => {
          const sheet = this.getActiveSheet();
          if (!sheet.selectedCell) return;

          const { col, row } = sheet.selectedCell;
          const cell = sheet.getCell(col, row);
          const value = this.formulaInput.value;

          // Temporarily update the cell for live preview
          if (value.startsWith('=')) {
            try {
              const evaluator = new FormulaEvaluator(sheet);
              const result = evaluator.evaluate(value);
              cell.value = result;
              this.renderCell(col, row);
            } catch (e) {
              // Don't update on error during typing
            }
          } else {
            cell.value = value;
            cell.formula = null;
            this.renderCell(col, row);
          }
        });

        // Add sheet button
        document.querySelector('.add-sheet').addEventListener('click', () => {
          const newName = `Sheet${this.sheets.length + 1}`;
          this.addSheet(newName);
          this.switchToSheet(this.sheets.length - 1);
        });

        // CSV upload
        this.csvUpload.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              this.importCSV(e.target.result);
            };
            reader.readAsText(file);
          }
          // Reset the input
          e.target.value = '';
        });

        // Download CSV button
        document.querySelector('[data-action="download-csv"]').addEventListener('click', () => {
          this.exportCSV();
        });

        // Upload CSV button
        document.querySelector('[data-action="upload-csv"]').addEventListener('click', () => {
          this.csvUpload.click();
        });

        // Modal dialogs
        this.renameCancel.addEventListener('click', () => this.cancelRenameSheet());
        this.renameConfirm.addEventListener('click', () => this.confirmRenameSheet());
        this.sheetNameInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.confirmRenameSheet();
          } else if (e.key === 'Escape') {
            this.cancelRenameSheet();
          }
        });

        // Grid events
        this.grid.addEventListener('click', (e) => {
          if (e.target.classList.contains('cell')) {
            const col = parseInt(e.target.dataset.col);
            const row = parseInt(e.target.dataset.row);

            if (document.activeElement === this.formulaInput) {
              // Insert the cell reference into the formula bar
              this.insertCellReference(col, row);
            } else {
              this.selectCell(col, row);
            }
          }
        });

        this.grid.addEventListener('dblclick', (e) => {
          if (e.target.classList.contains('cell')) {
            this.startEditing(e.target);
          }
        });

        // Mouse selection
        this.spreadsheetContainer.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('cell') ||
              e.target.parentElement.classList.contains('cell')) {
            const cell = e.target.classList.contains('cell') ? e.target : e.target.parentElement;
            const col = parseInt(cell.dataset.col);
            const row = parseInt(cell.dataset.row);

            this.isSelecting = true;
            this.dragStart = { col, row };
            this.selectCell(col, row, false);
            e.preventDefault();
          }
        });

        document.addEventListener('mousemove', (e) => {
          if (this.isSelecting) {
            // Find the cell under the mouse
            const cell = document.elementFromPoint(e.clientX, e.clientY);
            if (cell && (cell.classList.contains('cell') || cell.parentElement.classList.contains('cell'))) {
              const targetCell = cell.classList.contains('cell') ? cell : cell.parentElement;
              const col = parseInt(targetCell.dataset.col);
              const row = parseInt(targetCell.dataset.row);

              if (document.activeElement === this.formulaInput) {
                // For formula bar, we want to show the selection rectangle
                this.showSelectionRectangle(this.dragStart.col, this.dragStart.row, col, row);
              } else {
                this.selectRange(this.dragStart.col, this.dragStart.row, col, row);
              }
            }
          }

          // Tooltip for cells
          if (e.target.classList.contains('cell')) {
            const col = parseInt(e.target.dataset.col);
            const row = parseInt(e.target.dataset.row);
            const sheet = this.getActiveSheet();
            const cell = sheet.getCell(col, row);

            if (cell.formula) {
              this.showTooltip(cell.formula, e.clientX, e.clientY);
            } else if (cell.value) {
              this.showTooltip(cell.value, e.clientX, e.clientY);
            }
          } else {
            this.hideTooltip();
          }
        });

        document.addEventListener('mouseup', () => {
          if (this.isSelecting) {
            if (document.activeElement === this.formulaInput) {
              // Insert the range into the formula bar
              const sheet = this.getActiveSheet();
              if (this.dragStart) {
                const cell = document.elementFromPoint(event.clientX, event.clientY);
                if (cell && (cell.classList.contains('cell') || cell.parentElement.classList.contains('cell'))) {
                  const targetCell = cell.classList.contains('cell') ? cell : cell.parentElement;
                  const endCol = parseInt(targetCell.dataset.col);
                  const endRow = parseInt(targetCell.dataset.row);

                  this.insertRangeReference(
                    this.dragStart.col, this.dragStart.row,
                    endCol, endRow
                  );
                }
              }
              this.hideSelectionRectangle();
            }
            this.isSelecting = false;
            this.dragStart = null;
          }
        });

        // Column header resize
        this.columnHeaders.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('resize-handle')) {
            e.preventDefault();
            const header = e.target.parentElement;
            const col = parseInt(header.dataset.col);
            const sheet = this.getActiveSheet();
            const startX = e.clientX;
            const startWidth = sheet.columnWidths[col];

            this.isResizing = true;
            this.resizeHeader = header;
            this.resizeStart = { x: startX, width: startWidth };

            header.classList.add('resizing');

            const onMouseMove = (e) => {
              const width = this.resizeStart.width + e.clientX - this.resizeStart.x;
              const newWidth = Math.max(20, width);

              // Update header width
              header.style.width = `${newWidth}px`;
              header.style.minWidth = `${newWidth}px`;

              // Update all cells in this column
              document.querySelectorAll(`.cell[data-col="${col}"]`).forEach(cell => {
                cell.style.width = `${newWidth}px`;
                cell.style.minWidth = `${newWidth}px`;
              });

              // Update sheet's column width
              sheet.columnWidths[col] = newWidth;
              this.columnHeaders.style.width = `${sheet.columnWidths.slice(0, sheet.cols).reduce((a, b) => a + b, 0)}px`;
              this.columnHeaders.style.minWidth = this.columnHeaders.style.width;
              this.grid.style.width = this.columnHeaders.style.width;
            };

            const onMouseUp = () => {
              this.isResizing = false;
              header.classList.remove('resizing');
              this.resizeHeader = null;
              document.removeEventListener('mousemove', onMouseMove);
              document.removeEventListener('mouseup', onMouseUp);
            };

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
          }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
          const sheet = this.getActiveSheet();
          if (!sheet.selectedCell) return;

          // Don't handle keyboard if we're editing or formula bar is focused
          if (document.activeElement === this.formulaInput ||
              document.activeElement.classList.contains('cell-input')) {
            return;
          }

          let { col, row } = sheet.selectedCell;

          switch (e.key) {
            case 'ArrowUp':
              row = Math.max(0, row - 1);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'ArrowDown':
              row = Math.min(sheet.rows - 1, row + 1);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'ArrowLeft':
              col = Math.max(0, col - 1);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'ArrowRight':
              col = Math.min(sheet.cols - 1, col + 1);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'Tab':
              if (e.shiftKey) {
                col = col > 0 ? col - 1 : sheet.cols - 1;
                if (col === sheet.cols - 1 && row > 0) {
                  row--;
                }
              } else {
                col = col < sheet.cols - 1 ? col + 1 : 0;
                if (col === 0 && row < sheet.rows - 1) {
                  row++;
                }
              }
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'Enter':
              if (e.shiftKey) {
                // Move up
                row = Math.max(0, row - 1);
              } else {
                // Move down or to the beginning of next row
                if (col === sheet.cols - 1) {
                  col = 0;
                  row = Math.min(sheet.rows - 1, row + 1);
                } else {
                  col++;
                }
              }
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'Home':
              col = 0;
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'End':
              col = sheet.cols - 1;
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'PageUp':
              row = Math.max(0, row - 10);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'PageDown':
              row = Math.min(sheet.rows - 1, row + 10);
              this.selectCell(col, row);
              e.preventDefault();
              break;
            case 'F2':
              // Start editing the selected cell
              const cellElement = document.querySelector(`.cell[data-col="${col}"][data-row="${row}"]`);
              if (cellElement) {
                this.startEditing(cellElement);
              }
              e.preventDefault();
              break;
            case 'Delete':
            case 'Backspace':
              // Clear the selected cell(s)
              if (sheet.selection) {
                const { start, end } = sheet.selection;
                sheet.clearRange(start.col, start.row, end.col, end.row);
                this.renderSheet();
              } else if (sheet.selectedCell) {
                sheet.clearCell(sheet.selectedCell.col, sheet.selectedCell.row);
                this.renderCell(sheet.selectedCell.col, sheet.selectedCell.row);
              }
              e.preventDefault();
              break;
            case 'c':
              if (e.ctrlKey || e.metaKey) {
                // Copy
                this.copySelection();
                e.preventDefault();
              }
              break;
            case 'x':
              if (e.ctrlKey || e.metaKey) {
                // Cut
                this.copySelection();
                if (sheet.selection) {
                  const { start, end } = sheet.selection;
                  sheet.clearRange(start.col, start.row, end.col, end.row);
                  this.renderSheet();
                } else if (sheet.selectedCell) {
                  sheet.clearCell(sheet.selectedCell.col, sheet.selectedCell.row);
                  this.renderCell(sheet.selectedCell.col, sheet.selectedCell.row);
                }
                e.preventDefault();
              }
              break;
            case 'v':
              if (e.ctrlKey || e.metaKey) {
                // Paste
                this.pasteSelection();
                e.preventDefault();
              }
              break;
            case 'a':
              if (e.ctrlKey || e.metaKey) {
                // Select all
                const sheet = this.getActiveSheet();
                this.selectRange(0, 0, sheet.cols - 1, sheet.rows - 1);
                e.preventDefault();
              }
              break;
            case 'z':
              if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
                // Undo - not implemented yet
                e.preventDefault();
              }
              break;
            case 'y':
              if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
                // Redo - not implemented yet
                e.preventDefault();
              }
              break;
          }
        });

        // Handle window resize
        window.addEventListener('resize', () => {
          this.hideTooltip();
        });

        // Handle scroll to save scroll position
        this.spreadsheetContainer.addEventListener('scroll', () => {
          const sheet = this.getActiveSheet();
          sheet.scrollTop = this.spreadsheetContainer.scrollTop;
          sheet.scrollLeft = this.spreadsheetContainer.scrollLeft;
        });
      }

      showSelectionRectangle(startCol, startRow, endCol, endRow) {
        const minCol = Math.min(startCol, endCol);
        const maxCol = Math.max(startCol, endCol);
        const minRow = Math.min(startRow, endRow);
        const maxRow = Math.max(startRow, endRow);

        // Get the first and last cell elements
        const firstCell = document.querySelector(`.cell[data-col="${minCol}"][data-row="${minRow}"]`);
        const lastCell = document.querySelector(`.cell[data-col="${maxCol}"][data-row="${maxRow}"]`);

        if (firstCell && lastCell) {
          const firstRect = firstCell.getBoundingClientRect();
          const lastRect = lastCell.getBoundingClientRect();
          const containerRect = this.spreadsheetContainer.getBoundingClientRect();

          this.selectionRectangle.style.left = `${firstRect.left - containerRect.left}px`;
          this.selectionRectangle.style.top = `${firstRect.top - containerRect.top}px`;
          this.selectionRectangle.style.width = `${lastRect.right - firstRect.left}px`;
          this.selectionRectangle.style.height = `${lastRect.bottom - firstRect.top}px`;
          this.selectionRectangle.style.display = 'block';
        }
      }

      hideSelectionRectangle() {
        this.selectionRectangle.style.display = 'none';
      }

      insertCellReference(col, row) {
        const addr = formatCellAddress(col, row);
        const input = this.formulaInput;
        const start = input.selectionStart;
        const end = input.selectionEnd;
        const value = input.value;

        // Insert the address
        input.value = value.substring(0, start) + addr + value.substring(end);
        input.selectionStart = input.selectionEnd = start + addr.length;
        input.focus();
      }

      insertRangeReference(startCol, startRow, endCol, endRow) {
        if (startCol === endCol && startRow === endRow) {
          // Single cell
          this.insertCellReference(startCol, startRow);
        } else {
          const rangeAddr = formatRangeAddress(startCol, startRow, endCol, endRow);
          const input = this.formulaInput;
          const startPos = input.selectionStart;
          const endPos = input.selectionEnd;
          const value = input.value;

          input.value = value.substring(0, startPos) + rangeAddr + value.substring(endPos);
          input.selectionStart = input.selectionEnd = startPos + rangeAddr.length;
          input.focus();
        }
      }

      copySelection() {
        const sheet = this.getActiveSheet();
        if (!sheet.selection && !sheet.selectedCell) return;

        let startCol, startRow, endCol, endRow;

        if (sheet.selection) {
          startCol = sheet.selection.start.col;
          startRow = sheet.selection.start.row;
          endCol = sheet.selection.end.col;
          endRow = sheet.selection.end.row;
        } else {
          startCol = startRow = endCol = endRow = sheet.selectedCell.col;
          endRow = sheet.selectedCell.row;
        }

        this.clipboard = sheet.copyRange(startCol, startRow, endCol, endRow);
      }

      pasteSelection() {
        if (!this.clipboard) return;

        const sheet = this.getActiveSheet();
        if (!sheet.selectedCell) return;

        const { col, row } = sheet.selectedCell;
        sheet.pasteRange(col, row, this.clipboard);
        this.renderSheet();
      }

      handleToolbarAction(action) {
        const sheet = this.getActiveSheet();
        if (!sheet.selectedCell && !sheet.selection) return;

        const getSelectedCells = () => {
          if (sheet.selection) {
            return getRangeCells(
              sheet.selection.start.col, sheet.selection.start.row,
              sheet.selection.end.col, sheet.selection.end.row
            );
          } else if (sheet.selectedCell) {
            return [{ col: sheet.selectedCell.col, row: sheet.selectedCell.row }];
          }
          return [];
        };

        switch (action) {
          case 'bold':
            getSelectedCells().forEach(({ col, row }) => {
              const cell = sheet.getCell(col, row);
              cell.style.bold = !cell.style.bold;
              this.renderCell(col, row);
            });
            break;
          case 'italic':
            getSelectedCells().forEach(({ col, row }) => {
              const cell = sheet.getCell(col, row);
              cell.style.italic = !cell.style.italic;
              this.renderCell(col, row);
            });
            break;
          case 'underline':
            getSelectedCells().forEach(({ col, row }) => {
              const cell = sheet.getCell(col, row);
              cell.style.underline = !cell.style.underline;
              this.renderCell(col, row);
            });
            break;
          case 'fill-color':
            // For simplicity, toggle between yellow and no color
            getSelectedCells().forEach(({ col, row }) => {
              const cell = sheet.getCell(col, row);
              cell.style.backgroundColor = cell.style.backgroundColor === '#ffff00' ? '' : '#ffff00';
              this.renderCell(col, row);
            });
            break;
          case 'text-color':
            getSelectedCells().forEach(({ col, row }) => {
              const cell = sheet.getCell(col, row);
              cell.style.textColor = cell.style.textColor === '#ff0000' ? '' : '#ff0000';
              this.renderCell(col, row);
            });
            break;
          case 'clear':
            getSelectedCells().forEach(({ col, row }) => {
              sheet.clearCell(col, row);
              this.renderCell(col, row);
            });
            break;
          case 'download-csv':
            this.exportCSV();
            break;
          case 'upload-csv':
            this.csvUpload.click();
            break;
        }
      }

      exportCSV() {
        const sheet = this.getActiveSheet();
        let csv = '';

        // Add headers
        for (let c = 0; c < sheet.cols; c++) {
          csv += colToLetter(c) + (c < sheet.cols - 1 ? ',' : '\n');
        }

        // Add data
        for (let r = 0; r < sheet.rows; r++) {
          for (let c = 0; c < sheet.cols; c++) {
            const value = sheet.data[r][c].value;
            // Escape quotes and wrap in quotes if contains comma, newline, or quote
            let escaped = value.replace(/"/g, '""');
            if (escaped.includes(',') || escaped.includes('\n') || escaped.includes('"')) {
              escaped = `"${escaped}"`;
            }
            csv += escaped;
            if (c < sheet.cols - 1) {
              csv += ',';
            }
          }
          csv += '\n';
        }

        // Create download link
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${sheet.name}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      importCSV(csv) {
        const sheet = this.getActiveSheet();
        const lines = csv.split('\n');

        // Clear current sheet
        for (let r = 0; r < sheet.rows; r++) {
          for (let c = 0; c < sheet.cols; c++) {
            sheet.clearCell(c, r);
          }
        }

        // Parse CSV
        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (!line) continue;

          const values = this.parseCSVLine(line);
          for (let j = 0; j < values.length; j++) {
            if (i < sheet.rows && j < sheet.cols) {
              // Skip header row if it's letters
              if (i === 0 && /^[A-Z]+$/.test(values[j])) {
                continue;
              }
              sheet.setCellValue(j, i, values[j], null);
            }
          }
        }

        // Re-render the sheet
        this.renderSheet();
      }

      parseCSVLine(line) {
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
          const char = line[i];

          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++; // skip next quote
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === ',' && !inQuotes) {
            values.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current);

        return values;
      }
    }

    // Initialize the app when the DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      window.app = new SpreadsheetApp();
    });
  </script>
</body>
</html>
