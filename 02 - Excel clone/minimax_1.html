 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebExcel - Spreadsheet Application</title>
    <style>
        :root {
            --header-height: 35px;
            --toolbar-height: 40px;
            --grid-header-bg: #f3f2f1;
            --grid-border: #e1e1e1;
            --selected-border: #217346;
            --selection-bg: rgba(33, 115, 70, 0.1);
            --excel-green: #217346;
            --excel-light-green: #e6f2ea;
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none; /* Prevent text selection outside inputs */
        }

        /* --- TOOLBAR --- */
        #toolbar {
            height: var(--toolbar-height);
            background: #fff;
            border-bottom: 1px solid var(--grid-border);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 10px;
        }
        
        .btn {
            background: #fff;
            border: 1px solid #ccc;
            padding: 4px 10px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover { background: #f0f0f0; }
        .btn:active { background: #e1e1e1; }
        .btn-group { display: flex; gap: -1px; }
        .btn-group .btn { border-radius: 0; }
        .btn-group .btn:first-child { border-radius: 2px 0 0 2px; }
        .btn-group .btn:last-child { border-radius: 0 2px 2px 0; }

        /* --- FORMULA BAR --- */
        #formula-bar {
            height: var(--header-height);
            background: #fff;
            display: flex;
            align-items: center;
            padding: 0 10px;
            border-bottom: 1px solid var(--grid-border);
        }

        #cell-name {
            width: 60px;
            height: 24px;
            border: 1px solid var(--grid-border);
            text-align: center;
            font-weight: bold;
            margin-right: 5px;
            line-height: 24px;
            background: var(--grid-header-bg);
            color: #444;
        }

        #fx-label {
            width: 20px;
            color: #888;
            font-style: italic;
            font-size: 14px;
        }

        #formula-input {
            flex-grow: 1;
            height: 24px;
            border: 1px solid var(--grid-border);
            padding: 0 5px;
            font-family: monospace;
            outline: none;
        }
        #formula-input:focus { border-color: var(--excel-green); }

        /* --- SHEET TABS --- */
        #sheet-tabs {
            height: 30px;
            background: var(--grid-header-bg);
            display: flex;
            align-items: flex-end;
            padding-left: 10px;
            border-bottom: 1px solid var(--grid-border);
        }

        .sheet-tab {
            padding: 5px 15px;
            background: #ddd;
            border: 1px solid #ccc;
            border-bottom: none;
            margin-right: 2px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 3px 3px 0 0;
        }

        .sheet-tab.active {
            background: #fff;
            border-bottom: 1px solid #fff;
            font-weight: bold;
            color: var(--excel-green);
        }

        /* --- MAIN GRID --- */
        #grid-container {
            flex-grow: 1;
            overflow: auto;
            position: relative;
            background: #fff;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid var(--grid-border);
            height: 22px;
            min-width: 80px;
            padding: 0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Headers */
        th {
            background: var(--grid-header-bg);
            font-weight: normal;
            color: #444;
            position: sticky;
            top: 0;
            z-index: 10;
            text-align: center;
            user-select: none;
        }

        .row-header {
            width: 40px;
            min-width: 40px;
            text-align: center;
            color: #888;
            left: 0;
            z-index: 11; /* Higher than col headers */
            position: sticky;
            top: 0; /* Should move with vertical scroll logic if nested, but here we stick to top */
        }
        
        /* Fix for top-left corner */
        #corner-header {
            z-index: 20;
            background: var(--grid-header-bg);
        }

        /* Cells */
        td {
            background: #fff;
            cursor: cell;
        }
        
        td input {
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            padding: 0 4px;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            background: transparent;
            text-align: left;
        }
        td input:focus { border-color: var(--excel-green); }

        /* Selection Highlighting */
        .selected-cell {
            border: 2px solid var(--excel-green) !important;
            z-index: 5;
        }
        
        .selection-range {
            background: var(--selection-bg);
        }

        /* Context Colors */
        .bg-color-picker {
            width: 20px; 
            height: 20px; 
            border: 1px solid #ccc;
            display: inline-block;
        }

        /* Utility */
        .hidden-input {
            opacity: 0;
            position: absolute;
            width: 1px; 
            height: 1px;
        }

    </style>

<script>
/**
 * WebExcel - A simple functional Excel Clone
 */

// --- CONFIGURATION ---
const COLS = 26; // A-Z
const ROWS = 100;
const COL_LABELS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

// --- STATE MANAGEMENT ---
const state = {
    sheets: [
        { name: "Sheet1", data: {}, styles: {} } // data: { "A1": { value: "", formula: "", style: {} } }
    ],
    activeSheetIndex: 0,
    selectedCell: null, // "A1"
    selectionStart: null, // "A1" for drag selection
    isDragging: false,
    editingCell: null, // "A1" if currently typing directly in cell
};

// --- DOM ELEMENTS ---
const gridBody = document.getElementById('grid-body');
const headerRow = document.getElementById('header-row');
const cellNameLabel = document.getElementById('cell-name');
const formulaInput = document.getElementById('formula-input');
const sheetTabsContainer = document.getElementById('sheet-tabs');

// --- INITIALIZATION ---
function init() {
    createGrid();
    createHeaders();
    selectCell('A1');
    setupEventListeners();
    setupKeyboardNav();
}

// --- GRID GENERATION ---
function createHeaders() {
    // Corner
    const corner = document.getElementById('corner-header');
    corner.textContent = "";
    
    // Columns A-Z
    COL_LABELS.forEach(label => {
        const th = document.createElement('th');
        th.textContent = label;
        th.dataset.col = label;
        // Simple resize logic could go here
        headerRow.appendChild(th);
    });
}

function createGrid() {
    gridBody.innerHTML = "";
    for (let r = 1; r <= ROWS; r++) {
        const tr = document.createElement('tr');
        tr.dataset.row = r;

        // Row Number
        const th = document.createElement('th');
        th.className = "row-header";
        th.textContent = r;
        tr.appendChild(th);

        // Cells
        for (let c = 0; c < COLS; c++) {
            const colLabel = COL_LABELS[c];
            const cellId = `${colLabel}${r}`;
            
            const td = document.createElement('td');
            td.id = cellId;
            td.dataset.id = cellId;
            
            // Inner Input for editing
            const input = document.createElement('input');
            input.type = 'text';
            input.dataset.id = cellId;
            
            td.appendChild(input);
            tr.appendChild(td);
        }
        gridBody.appendChild(tr);
    }
}

// --- CORE LOGIC: CELL ACCESS ---
function getCellId(row, col) {
    return `${COL_LABELS[col]}${row}`;
}

function parseCellId(cellId) {
    const match = cellId.match(/^([A-Z]+)(\d+)$/);
    if (!match) return null;
    const colStr = match[1];
    const row = parseInt(match[2]);
    let col = 0;
    for (let i = 0; i < colStr.length; i++) {
        col = col * 26 + (colStr.charCodeAt(i) - 64);
    }
    return { col: col - 1, row: row, colStr: colStr, rowNum: row };
}

function getActiveSheetData() {
    return state.sheets[state.activeSheetIndex];
}

function getCellData(cellId) {
    const sheet = getActiveSheetData();
    return sheet.data[cellId] || { value: "", formula: "", style: {} };
}

function setCellData(cellId, { value, formula, style }) {
    const sheet = getActiveSheetData();
    if (!sheet.data[cellId]) sheet.data[cellId] = { value: "", formula: "", style: {} };
    
    if (value !== undefined) sheet.data[cellId].value = value;
    if (formula !== undefined) sheet.data[cellId].formula = formula;
    if (style !== undefined) sheet.data[cellId].style = style;

    renderCell(cellId);
}

// --- RENDERING ---
function renderCell(cellId) {
    const data = getCellData(cellId);
    const td = document.getElementById(cellId);
    const input = td.querySelector('input');
    
    if (!td || !input) return;

    // Display Logic:
    // If editing, show input value (formula or value depending on mode)
    // If not editing, show calculated value
    
    if (state.editingCell === cellId) {
        // If we are editing, we usually see the raw value (formula or number)
        // unless we pressed F2 to edit formula. 
        // For simplicity: Edit mode shows whatever is in the input currently
        input.value = input.value; 
    } else {
        // Display mode shows computed value
        input.value = data.value; // Already calculated
    }

    // Styles
    const style = data.style || {};
    input.style.fontWeight = style.bold ? 'bold' : 'normal';
    input.style.fontStyle = style.italic ? 'italic' : 'normal';
    input.style.textDecoration = style.underline ? 'underline' : 'none';
    input.style.backgroundColor = style.bgColor || 'transparent';
}

function updateSelectionUI() {
    // Clear previous selections
    document.querySelectorAll('.selected-cell').forEach(el => el.classList.remove('selected-cell'));
    document.querySelectorAll('.selection-range').forEach(el => el.classList.remove('selection-range'));

    if (!state.selectedCell) return;

    // Highlight current
    const td = document.getElementById(state.selectedCell);
    if(td) td.classList.add('selected-cell');

    // Highlight range if exists
    if (state.selectionStart && state.selectionStart !== state.selectedCell) {
        const start = parseCellId(state.selectionStart);
        const end = parseCellId(state.selectedCell);
        
        const r1 = Math.min(start.rowNum, end.rowNum);
        const r2 = Math.max(start.rowNum, end.rowNum);
        const c1 = Math.min(start.col, end.col);
        const c2 = Math.max(start.col, end.col);

        for(let r=r1; r<=r2; r++) {
            for(let c=c1; c<=c2; c++) {
                const id = getCellId(r, c);
                const el = document.getElementById(id);
                if(el) el.classList.add('selection-range');
            }
        }
    }

    // Update Name Box
    cellNameLabel.textContent = state.selectedCell;

    // Update Formula Bar
    const data = getCellData(state.selectedCell);
    // If editing, keep the input value, otherwise show formula
    if (state.editingCell !== state.selectedCell) {
        formulaInput.value = data.formula || data.value;
    }
}

// --- SELECTION LOGIC ---
function selectCell(cellId, isRangeStart = false) {
    if(isRangeStart) {
        state.selectionStart = cellId;
    }
    state.selectedCell = cellId;
    state.editingCell = null;
    updateSelectionUI();
}

function startEdit(cellId) {
    state.editingCell = cellId;
    const data = getCellData(cellId);
    const input = document.getElementById(cellId).querySelector('input');
    
    // When double clicked, show raw content (formula if exists)
    input.value = data.formula || data.value;
    input.focus();
    input.select();
}

// --- FORMULA ENGINE ---

function recalculateAll() {
    const sheet = getActiveSheetData();
    // Simple iteration approach. 
    // In a real app, we would use a dependency graph.
    // Here, we just loop a few times to let values propagate.
    // Or simply iterate over all cells.
    
    // 1. Identify all cells with formulas
    const formulaCells = Object.keys(sheet.data).filter(k => sheet.data[k].formula && sheet.data[k].formula.startsWith('='));
    
    // 2. Evaluate. Since simple references A1 might depend on B1, 
    // we might need to resolve order. Topological sort is best, 
    // but we will try a convergence method (calculate 3 passes).
    
    for(let pass=0; pass<5; pass++) {
        formulaCells.forEach(cellId => {
            const cell = sheet.data[cellId];
            try {
                const result = evaluate(cell.formula);
                cell.value = result;
            } catch (e) {
                cell.value = "#ERR";
            }
        });
    }

    // 3. Render all
    Object.keys(sheet.data).forEach(renderCell);
    
    // Also ensure pure values (no formulas) are rendered (in case of style updates or manual clear)
    document.querySelectorAll('td input').forEach(input => {
        const id = input.dataset.id;
        if(!sheet.data[id]) {
            input.value = "";
            input.style.backgroundColor = "transparent";
            input.style.fontWeight = "normal";
            input.style.fontStyle = "normal";
        }
    });
}

function evaluate(formula) {
    if (!formula || !formula.startsWith('=')) return formula;

    let expr = formula.substring(1).toUpperCase();

    // Replace Ranges (e.g., A1:A5) with arrays of values
    // Regex: Letter+Number:Letter+Number
    expr = expr.replace(/([A-Z]+\d+):([A-Z]+\d+)/g, (match, start, end) => {
        const vals = getRangeValues(start, end);
        return vals.join(","); // Convert to array for functions
    });

    // Replace Cell References (e.g., A1, B2) with values
    // Note: This is tricky because we don't want to replace inside function names.
    // We only replace words that look like A1, B2...
    // We assume standard A-Z columns (1 or 2 letters) + number
    const cellRefRegex = /\b([A-Z]{1,2})(\d{1,3})\b/g;
    
    // We iterate matches to replace them. 
    // Warning: This simplistic replacement can break if function names match cell refs (unlikely with 2 letters).
    // To be safer, we split by operators first? Too complex.
    // Let's replace known data references.
    
    let finalExpr = expr.replace(cellRefRegex, (match, c, r) => {
        // Check if it's a valid coordinate within grid
        if(parseInt(r) > ROWS) return 0;
        const val = getCellData(match).value;
        return isNaN(parseFloat(val)) ? `"${val}"` : val;
    });

    // Handle Functions
    // Replace SUM(...), AVERAGE(...), MIN(...), MAX(...) using eval
    // But we need to ensure the arguments are parsed.
    // We passed ranges as comma separated values above. So SUM receives "1,2,3,4".
    // We just need to map JS Math functions to window.
    
    try {
        // Security: Only allow math and specific words?
        // We rely on the fact that we construct the string.
        // Add helper functions to scope
        const scope = {
            SUM: (...args) => args.reduce((a, b) => a + (parseFloat(b)||0), 0),
            AVERAGE: (...args) => args.length ? args.reduce((a, b) => a + (parseFloat(b)||0), 0) / args.length : 0,
            MIN: (...args) => Math.min(...args.map(a => parseFloat(a)||0)),
            MAX: (...args) => Math.max(...args.map(a => parseFloat(a)||0)),
        };
        
        // Use Function constructor for sandboxing slightly
        const keys = Object.keys(scope);
        const values = Object.values(scope);
        
        // If simple arithmetic (no functions), just eval
        if (!/^[A-Z]/.test(finalExpr)) {
             return eval(finalExpr); // Safe enough here as we control input
        }
        
        // If functions, map them
        const func = new Function(...keys, "return " + finalExpr);
        return func(...values);

    } catch (e) {
        console.error("Calc Error", e);
        return "#ERR";
    }
}

function getRangeValues(startId, endId) {
    const start = parseCellId(startId);
    const end = parseCellId(endId);
    const vals = [];
    
    const r1 = Math.min(start.rowNum, end.rowNum);
    const r2 = Math.max(start.rowNum, end.rowNum);
    const c1 = Math.min(start.col, end.col);
    const c2 = Math.max(start.col, end.col);

    for(let r=r1; r<=r2; r++) {
        for(let c=c1; c<=c2; c++) {
            const id = getCellId(r, c);
            const data = getCellData(id);
            vals.push(data.value);
        }
    }
    return vals;
}


// --- EVENT LISTENERS ---

function setupEventListeners() {
    // Grid Clicks
    gridBody.addEventListener('mousedown', (e) => {
        const cell = e.target.closest('td');
        if (cell) {
            const id = cell.dataset.id;
            
            // Check if we are in formula edit mode
            if (document.activeElement === formulaInput) {
                // Insert Reference
                insertReferenceInFormula(id);
                return;
            }

            // Normal Selection
            if (e.shiftKey) {
                // Extend selection
                state.selectedCell = id;
            } else {
                selectCell(id, true);
            }
            state.isDragging = true;
        }
    });

    gridBody.addEventListener('mouseover', (e) => {
        if (state.isDragging) {
            const cell = e.target.closest('td');
            if (cell) {
                state.selectedCell = cell.dataset.id;
                updateSelectionUI();
            }
        }
    });

    window.addEventListener('mouseup', () => {
        state.isDragging = false;
    });

    // Input Changes (Cell)
    gridBody.addEventListener('input', (e) => {
        if (e.target.tagName === 'INPUT' && state.selectedCell === e.target.dataset.id) {
            // Update internal data immediately (for editing)
            const val = e.target.value;
            const current = getCellData(state.selectedCell);
            // We don't set formula unless it starts with =
            setCellData(state.selectedCell, { value: val, formula: val.startsWith('=') ? val : '' });
        }
    });

    gridBody.addEventListener('blur', (e) => {
        if (e.target.tagName === 'INPUT' && e.target.value !== "") {
            // Commit changes
            const id = e.target.dataset.id;
            state.editingCell = null;
            recalculateAll();
            updateSelectionUI();
        }
    });

    gridBody.addEventListener('dblclick', (e) => {
        const cell = e.target.closest('td');
        if (cell) {
            startEdit(cell.dataset.id);
        }
    });

    // Formula Bar
    formulaInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            commitFormulaFromBar();
        }
    });
    
    formulaInput.addEventListener('focus', () => {
        // If we click formula bar while a cell is selected, we want to edit the formula
        // Unless we are already editing
        if (state.editingCell !== state.selectedCell) {
             const data = getCellData(state.selectedCell);
             formulaInput.value = data.formula || data.value;
        }
    });
    
    formulaInput.addEventListener('blur', () => {
        // Auto commit on blur if value changed? 
        // Usually Enter is enough, but let's be safe
        // Actually, let's not auto-commit to allow checking values. 
        // User must press Enter.
    });

    // Toolbar
    document.getElementById('btn-bold').onclick = () => toggleStyle('bold');
    document.getElementById('btn-italic').onclick = () => toggleStyle('italic');
    document.getElementById('btn-underline').onclick = () => toggleStyle('underline');
    document.getElementById('btn-clear').onclick = () => {
        setCellData(state.selectedCell, { value: "", formula: "", style: {} });
        recalculateAll();
    };
    
    document.getElementById('btn-bgcolor').oninput = (e) => {
        setStyle('bgColor', e.target.value);
    };

    // CSV
    document.getElementById('btn-download').onclick = downloadCSV;
    document.getElementById('btn-upload').onclick = () => document.getElementById('csv-upload').click();
    document.getElementById('csv-upload').onchange = uploadCSV;
}

function setupKeyboardNav() {
    document.addEventListener('keydown', (e) => {
        // If focus is in an input, handle special keys
        const isInput = document.activeElement.tagName === 'INPUT';
        
        if (!state.selectedCell) return;
        
        const parsed = parseCellId(state.selectedCell);
        let r = parsed.rowNum;
        let c = parsed.col;
        
        // Navigation
        if (!isInput || (isInput && e.key === 'Tab' && !e.shiftKey)) {
            // If Tab used to move out of formula bar, handle normally
        }
        
        if (isInput && document.activeElement.dataset.id === state.selectedCell) {
            // Editing mode navigation
            if (e.key === 'Enter') {
                e.preventDefault();
                commitCellEdit(r + 1); // Move down
            } else if (e.key === 'Tab') {
                e.preventDefault();
                commitCellEdit(r, c + 1); // Move right
            } else if (e.key === 'Escape') {
                // Cancel edit
                state.editingCell = null;
                renderCell(state.selectedCell);
            }
            return;
        }

        // Selection Navigation
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            if (e.key === 'ArrowUp') r = Math.max(1, r - 1);
            if (e.key === 'ArrowDown') r = Math.min(ROWS, r + 1);
            if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
            if (e.key === 'ArrowRight') c = Math.min(COLS - 1, c + 1);
            
            const nextId = getCellId(r, c);
            
            if (e.shiftKey) {
                // Extend selection
                state.selectedCell = nextId;
            } else {
                selectCell(nextId, true);
            }
            updateSelectionUI();
            e.preventDefault();
        }
        
        // Editing
        if (e.key === 'F2' || (isInput && e.key.length === 1 && !e.ctrlKey && !e.metaKey)) {
            // F2 or typing starts edit
            if (document.activeElement !== formulaInput) {
                startEdit(state.selectedCell);
            }
        }
        
        // Deletion
        if (e.key === 'Delete' || e.key === 'Backspace') {
             setCellData(state.selectedCell, { value: "", formula: "" });
             recalculateAll();
        }
    });
}

// --- ACTIONS ---

function commitFormulaFromBar() {
    if (!state.selectedCell) return;
    const val = formulaInput.value;
    setCellData(state.selectedCell, { value: val, formula: val.startsWith('=') ? val : '' });
    recalculateAll();
    // Keep focus on grid? or stay in bar? Let's stay in bar to keep typing formulas
    // formulaInput.focus();
}

function commitCellEdit(r, c) {
    const id = state.selectedCell;
    state.editingCell = null;
    recalculateAll();
    updateSelectionUI();
    
    // Move selection
    if (r && c) {
        selectCell(getCellId(r, c), true);
    } else if (r) {
        selectCell(getCellId(r, parseCellId(id).col), true);
    }
}

function insertReferenceInFormula(id) {
    // Insert ID at cursor position
    const input = formulaInput;
    const start = input.selectionStart;
    const end = input.selectionEnd;
    const text = input.value;
    
    let insertText = id;
    
    // Check if we are dragging a range (selectionStart != selectedCell)
    // However, logic in insertReferenceInFormula only knows current click ID.
    // To handle ranges properly, we'd need more state.
    // Simplified: Just insert the clicked cell. 
    // For range, user can click start, shift-click end.
    // But inside formula input, shift-click doesn't work by default.
    // Let's assume simple click adds.
    
    const newText = text.substring(0, start) + insertText + text.substring(end);
    input.value = newText;
    input.focus();
    input.setSelectionRange(start + insertText.length, start + insertText.length);
}

function setStyle(prop, value) {
    if (!state.selectedCell) return;
    const data = getCellData(state.selectedCell);
    const newStyle = { ...data.style, [prop]: value };
    setCellData(state.selectedCell, { style: newStyle });
}

function toggleStyle(prop) {
    if (!state.selectedCell) return;
    const data = getCellData(state.selectedCell);
    const current = data.style[prop];
    const newStyle = { ...data.style, [prop]: !current };
    setCellData(state.selectedCell, { style: newStyle });
}

// --- SHEET MANAGEMENT ---
document.getElementById('add-sheet').onclick = () => {
    const newIndex = state.sheets.length;
    state.sheets.push({ name: `Sheet${newIndex+1}`, data: {}, styles: {} });
    renderSheetTabs();
    switchSheet(newIndex);
};

function renderSheetTabs() {
    // Keep the add button
    const addBtn = document.getElementById('add-sheet');
    sheetTabsContainer.innerHTML = '';
    
    state.sheets.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = `sheet-tab ${i === state.activeSheetIndex ? 'active' : ''}`;
        div.textContent = s.name;
        div.onclick = () => switchSheet(i);
        sheetTabsContainer.appendChild(div);
    });
    
    sheetTabsContainer.appendChild(addBtn);
}

function switchSheet(index) {
    state.activeSheetIndex = index;
    renderSheetTabs();
    // Clear UI
    document.querySelectorAll('td input').forEach(i => i.value = '');
    recalculateAll();
    updateSelectionUI();
}

// --- CSV I/O ---

function downloadCSV() {
    const sheet = getActiveSheetData();
    let csv = "";
    
    // Simple dump: Iterate rows 1-100, cols A-Z
    for(let r=1; r<=ROWS; r++) {
        let rowData = [];
        let hasData = false;
        for(let c=0; c<COLS; c++) {
            const id = getCellId(r, c);
            const val = sheet.data[id] ? sheet.data[id].value : "";
            if(val) hasData = true;
            // Escape quotes
            const cleanVal = String(val).replace(/"/g, '""');
            if (cleanVal.includes(',') || cleanVal.includes('"') || cleanVal.includes('\n')) {
                rowData.push(`"${cleanVal}"`);
            } else {
                rowData.push(cleanVal);
            }
        }
        if(hasData) csv += rowData.join(",") + "\r\n";
    }
    
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = window.URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${getActiveSheetData().name}.csv`;
    a.click();
}

function uploadCSV(e) {
    const file = e.target.files[0];
    if(!file) return;
    
    const reader = new FileReader();
    reader.onload = (evt) => {
        const text = evt.target.result;
        const lines = text.split(/\r\n|\n/);
        
        // Clear current sheet
        state.sheets[state.activeSheetIndex].data = {};
        
        lines.forEach((line, r) => {
            if(!line.trim()) return;
            // Basic CSV parser (does not handle quoted commas perfectly in all cases, but good enough for demo)
            const cols = line.split(",");
            cols.forEach((val, c) => {
                if(c < COLS) {
                    const id = getCellId(r+1, c);
                    setCellData(id, { value: val, formula: "" });
                }
            });
        });
        recalculateAll();
    };
    reader.readAsText(file);
    e.target.value = ''; // reset
}

// Start
init();
