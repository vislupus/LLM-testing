<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Spreadsheet - Excel Clone</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root {
      --toolbar-bg: #f5f7fa;
      --border: #e5e7eb;
      --header-bg: #f3f4f6;
      --header-text: #7a8194;
      --selected-cell: #60a5fa;
      --range-cell: #bae6fd;
      --formula-bar-bg: #fffbe7;
      --sheet-tab-bg: #ebedf0;
      --sheet-tab-active: #fff;
      --sheet-tab-border: #d1d5db;
      --col-resize-handle: #bababa;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f8fafc;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      min-height: 100vh;
    }
    #toolbar {
      background: var(--toolbar-bg);
      padding: 6px 0 6px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      z-index: 200;
    }
    #toolbar button, #toolbar label {
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 3px;
      font-size: 16px;
      color: #374151;
      transition: background .1s;
      outline: none;
    }
    #toolbar button.active { background: #e0e7ef; }
    #toolbar button:hover, #toolbar label:hover { background: #f0f2fd; }
    #toolbar input[type="color"] {
      border: none;
      background: none;
      width: 22px;
      height: 22px;
      padding: 0;
      vertical-align: middle;
    }
    #toolbar #uploadcsv {
      display: none;
    }
    #formula-bar {
      background: var(--formula-bar-bg);
      display: flex;
      align-items: center;
      padding: 4px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      min-height: 38px;
      gap: 9px;
      position:relative;
      z-index: 101;
    }
    #cell-addr {
      font-weight: bold;
      color: #3182ce;
      min-width: 45px;
      text-align: right;
    }
    #cell-formula {
      flex: 1;
      font-size: 15px;
      border: none;
      padding: 4px 10px;
      border-radius: 4px;
      background: #fff;
      outline: none;
      border: 1px solid #dbeafe;
      transition: border .1s;
    }
    #cell-formula:focus { border: 1.5px solid #60a5fa; }
    #spreadsheet-container {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }
    #sheet-tabs {
      display: flex;
      gap: 2px;
      background: #f1f3f6;
      border-top: 1px solid #ddd;
      flex-shrink: 0;
      padding: 2px 4px 2px 2px;
      align-items: center;
      min-height:32px;
      user-select:none;
    }
    .sheet-tab {
      display: flex; align-items: center;
      background: var(--sheet-tab-bg);
      padding: 0 16px 0 8px;
      height: 28px;
      border: 1px solid var(--sheet-tab-border);
      border-radius: 7px 7px 0 0;
      color: #444;
      font-weight: 500;
      cursor: pointer;
      margin-top: 3px;
      margin-right: 2px;
      user-select: none;
      position: relative;
    }
    .sheet-tab.active {
      background: var(--sheet-tab-active);
      border-bottom: 1px solid #fff;
      border-top: 2.5px solid #3779e0;
      font-weight: bold;
      color: #3167b7;
      z-index: 1;
    }
    .sheet-tab .rename {
      width: 75px;
      margin-right:4px;
      padding: 0 2px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius:3px;
      outline: none;
    }
    .sheet-tab .fa-x {
      font-size: 12px; color: #9fa3ab;
      margin-left: 5px; display: inline-block;
      opacity: 0.7;
      cursor: pointer;
      padding:2px;
      border-radius:3px;
      transition: background 0.07s;
    }
    .sheet-tab .fa-x:hover {
      background: #fde8e8;
      color: #b91c1c;
      opacity: 1;
    }
    .sheet-tab.add { border-style: dashed;
      color: #6b7280;
      background: none;
      padding: 0 10px;
    }
    .sheet-tab.add:hover {
      color:#1d4ed8; border-color: #60a5fa;
    }
    #ss-table-wrapper {
      flex: 1 1 0;
      min-height: 0;
      overflow: auto;
      position: relative;
      box-shadow: 0 2px 8px 0 #f3f4f6;
      background: #fff;
    }
    table.ss-table {
      border-collapse: separate;
      border-spacing: 0;
      width: max-content;
      user-select: none;
      font-size: 15px;
    }
    table.ss-table input, textarea { font-size: inherit; }
    .ss-th-col, .ss-th-row {
      background: var(--header-bg);
      color: var(--header-text);
      font-weight: 500;
      text-align: center;
      user-select: none;
      position: sticky;
      z-index: 3;
      border: 1px solid var(--border);
    }
    .ss-th-col {
      top: 0;
      height: 28px;
      box-sizing: border-box;
      border-bottom: 2px solid #e3e8ef;
      min-width: 90px;
      max-width: 380px;
    }
    .ss-th-row {
      left: 0;
      min-width: 38px;
      max-width: 42px;
      width: 38px;
      border-right: 2px solid #e3e8ef;
      position: sticky;
      text-align: right;
      padding-right: 6px;
      z-index: 4;
      background: linear-gradient(90deg, #f3f4f6, #f8fafc 55%);
    }
    .ss-th-corner {
      top: 0; left: 0; z-index: 5; position: sticky;
      background: #f5f6fa;
      border-right: 2px solid #e3e8ef; border-bottom: 2px solid #e3e8ef;
      min-width: 38px; max-width: 42px; width: 38px; height: 28px;
    }
    td.ss-cell {
      border: 1px solid var(--border);
      min-width: 90px; max-width: 380px;
      padding: 2.5px 6px;
      background: #fff;
      cursor: pointer;
      vertical-align: middle;
      overflow: hidden;
      white-space: pre;
      text-overflow: ellipsis;
      position: relative;
      transition: background .06s;
      font-size: 1em;
      line-height: 1.45em;
    }
    td.ss-cell.selected {
      outline: 2px solid var(--selected-cell);
      z-index: 100!important;
      background: #f0f6ff;
    }
    td.ss-cell.range {
      background: var(--range-cell);
    }
    td.ss-cell .cell-edit {
      width: 100%; min-width:10px; background: #eef6ff;
      box-sizing: border-box; border: none; outline: none;
      height: 100%; font-size:inherit; font-family:inherit;
      padding: 1.5px 1.5px;
      margin: -1px -2px;
      color: #18181b;
      z-index: 10;
      overflow: visible;
      border-radius: 3px;
      /* show when in editing mode */
    }
    td.ss-cell .cell-edit:focus { background: #e0ebfa; }
    td.ss-cell .cell-edit.formula-edit { background: #fffde8; }
    td.ss-cell .overflow {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
    td.ss-cell .fa-exclamation-triangle { color: #e57918; margin-right: 5px;}
    td.ss-cell.bold { font-weight: bold; }
    td.ss-cell.italic { font-style: italic; }
    td.ss-cell.bgcol { }
    .col-resizer {
      position: absolute;
      top: 0; right: -3.5px;
      width: 7px;
      height: 100%;
      cursor: ew-resize;
      z-index: 150;
      background: transparent;
    }
    th.ss-th-col:hover .col-resizer {
      background: #dde7f3;
    }
    ::selection {
      background: #bae6fd;
      color: #111;
    }
    @media (max-width: 900px) {
      #ss-table-wrapper { font-size: 14px; }
      td.ss-cell, .ss-th-col { min-width:74px; max-width:140px;}
    }
    @media (max-width:500px) {
      #toolbar, #formula-bar {
        font-size: 14px;
        gap: 4.5px;
        padding-left:2px; padding-right:2px;
      }
      td.ss-cell, .ss-th-col { min-width:46px; }
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button type="button" id="btn-bold" title="Bold (Ctrl+B)"><i class="fa fa-bold"></i></button>
    <button type="button" id="btn-italic" title="Italic (Ctrl+I)"><i class="fa fa-italic"></i></button>
    <label for="cell-bgcolor" title="Cell background color">
      <i class="fa fa-fill-drip"></i> <input type="color" id="cell-bgcolor" value="#fefefe" style="vertical-align:middle;">
    </label>
    <button type="button" id="btn-clear" title="Clear contents"><i class="fa fa-eraser"></i></button>
    <button type="button" id="btn-dn" title="Download as CSV"><i class="fa fa-download"></i></button>
    <label title="Upload CSV"><i class="fa fa-upload"></i>
      <input type="file" id="uploadcsv" accept=".csv,.txt">
    </label>
    <span style="margin-left:12px;font-size:16px;color:#8995ac;">Web Spreadsheet</span>
    <span style="margin-left:auto;font-size:13px;color: #a5acbc;letter-spacing:0.02em;margin-right:8px;">by <a href="https://openai.com/" target="_blank" style="color:#60a5fa;text-decoration:none;">GPT-4</a></span>
  </div>
  <div id="formula-bar">
    <span id="cell-addr">A1</span>
    <input id="cell-formula" spellcheck="false" autocomplete="off" />
  </div>
  <div id="spreadsheet-container">
    <div id="ss-table-wrapper">
      <!-- Spreadsheet table renders here -->
    </div>
    <div id="sheet-tabs">
      <!-- Sheet tabs render here -->
    </div>
  </div>
<script>
(function(){

// --- Spreadsheet config ---
const COLS = 26; // A-Z, you can change
const ROWS = 100; // 100 rows; you can change
const COL_MIN_WIDTH = 74, COL_DEF_WIDTH = 95, COL_MAX_WIDTH=380;

// ========== DATA STRUCTURE & STATE ===========
function makeEmptySheet() {
  // Each cell: { v: value, f: formula, s: {bold,bool} etc, bg: color }
  return {
    data: {}, // "A1": { v, f, s, bg }
    colWidths: Array(COLS).fill(COL_DEF_WIDTH),
    name: '',
    r: ROWS,
    c: COLS,
  }
}
let sheets = [
  { ...makeEmptySheet(), name: "Sheet1" }
];
let currentSheetIdx = 0;
function getSheet() { return sheets[currentSheetIdx]; }

let selection = { // UI: top-left and bottom-right (inclusive), { row, col }
  start: { row:0, col:0 }, end: { row:0, col:0 }
};
let selEditing = false; // is any cell in-grid in edit mode
let selFormulaEditing = false; // is formula bar currently being edited
let editingCell = null; // {row, col} if editing in cell
let formulaBarCache = ""; // Hold text for formula bar during edit
let depGraph = {}; // Dependency graph: "A1": Set of cells depending on it

// ========== UTILITIES ===========
// Address <=> row,col
function toA1(col,row){ return String.fromCharCode(65+col)+(row+1);}
function fromA1(addr) {
  const m = /^([A-Z]+)([0-9]+)$/.exec(addr);
  if(!m)return null;
  let col=0;
  for(let i=0;i<m[1].length;++i)col=col*26+(m[1].charCodeAt(i)-64);
  return { col:col-1, row:parseInt(m[2],10)-1 };
}
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function addrInRange(col,row,s,e){
  let r0=Math.min(s.row,e.row), r1=Math.max(s.row,e.row);
  let c0=Math.min(s.col,e.col), c1=Math.max(s.col,e.col);
  return row>=r0 && row<=r1 && col>=c0 && col<=c1;
}

// Excel ranges: A1, B2:D5
function parseRange(rangeStr){
  let [a,b]=rangeStr.split(':');
  let s1=fromA1(a), s2=b?fromA1(b):s1;
  if(!s1 || !s2)return null;
  return {
    c1: Math.min(s1.col,s2.col), c2: Math.max(s1.col,s2.col),
    r1: Math.min(s1.row,s2.row), r2: Math.max(s1.row,s2.row)
  };
}

// ========== FORMULA ENGINE ===========
function recalcAll(sheet=getSheet()){
  depGraph = {};
  for(let addr in sheet.data) sheet.data[addr]._value = undefined;
  for(let addr in sheet.data)
    sheet.data[addr]._value = evalCell(sheet, addr, new Set());
}
function getCellVal(addr){
  let d=getSheet().data[addr];
  return d ? (d._value!==undefined ? d._value : d.v) : undefined;
}
function evalCell(sheet, addr, stack){ // handles cycles, too
  if(!sheet.data[addr])return '';
  let cell=sheet.data[addr];
  if(cell.f && cell.f[0] === '='){
    try {
      if(stack.has(addr)) throw '#CIRC!';
      stack.add(addr);
      let v = evalFormula(sheet, cell.f.slice(1), addr, stack);
      cell._value = v;
      return v;
    } catch(e) {
      return (typeof e==='string')?e:'#ERR!';
    }
  }
  return cell.v||'';
}
function evalFormula(sheet, fstr, self, stack){
  // supported: numbers, +,-,*,/, (), cell refs (A1), SUM, AVERAGE, MIN, MAX, ranges (A1:B2)
  let tokens = tokenizeFormula(fstr);
  let i = 0;
  function peek(){return tokens[i];}
  function next(){return tokens[i++];}
  function parsePrimary() {
    let t = peek();
    if(t && t.type === 'num') return parseFloat(next().val);
    if(t && t.type === 'cell') {
      depGraph[t.val] = depGraph[t.val]||new Set();
      depGraph[t.val].add(self);
      let cell=sheet.data[t.val];
      return evalCell(sheet, t.val, stack);
    }
    if(t && t.type === 'func') {
      let fn=next().val;
      expect('paren','(');
      let args = [];
      if(peek() && peek().type!=='paren' || peek().val!==')'){
        while(1){
          args.push(parseExpr());
          if(peek() && peek().type==='comma') { next(); continue;}
          break;
        }
      }
      expect('paren',')');
      fn=fn.toUpperCase();
      if(args.length==0) return '';
      if(fn==="SUM") return list2Num(args).reduce((a,b)=>a+b,0);
      if(fn==="AVERAGE") return list2Num(args).reduce((a,b)=>a+b,0)/args.length;
      if(fn==="MIN") return Math.min(...list2Num(args));
      if(fn==="MAX") return Math.max(...list2Num(args));
      throw '#FN!';
    }
    if(t && t.type==='paren' && t.val==='('){
      next();
      let v=parseExpr();
      expect('paren',')');
      return v;
    }
    throw '#SYNTAX!';
  }
  function list2Num(arr){
    // range entries can be arrays or single values
    return arr.flatMap(e=>Array.isArray(e)?e:[e]).map(x=>+x||0);
  }
  function expect(type,val){
    let t=next();
    if(!t || t.type!==type||(val&&t.val!==val))
      throw '#SYNTAX!';
  }
  function parseRangeOrCell(){
    let a=next();
    if(peek() && peek().type==='colon')
    {
      next(); // ':'
      let b=next();
      let p1=fromA1(a.val),p2=fromA1(b.val);
      if(!p1||!p2) throw '#RANGE!';
      // Add dependencies:
      let c1=Math.min(p1.col,p2.col), c2=Math.max(p1.col,p2.col);
      let r1=Math.min(p1.row,p2.row), r2=Math.max(p1.row,p2.row);
      let vals=[];
      for(let ri=r1;ri<=r2;++ri)for(let ci=c1;ci<=c2;++ci){
        let k=toA1(ci,ri);
        depGraph[k]=depGraph[k]||new Set();
        depGraph[k].add(self);
        vals.push(evalCell(sheet,k,stack));
      }
      return vals;
    }else{
      depGraph[a.val]=depGraph[a.val]||new Set();
      depGraph[a.val].add(self);
      return evalCell(sheet,a.val,stack);
    }
  }
  function parseFactor(){
    // range/cell: (A1:B2) or func
    let t=peek();
    if(t && t.type==='cell') return parseRangeOrCell();
    if(t && t.type==='func') return parsePrimary();
    return parsePrimary();
  }
  function parseTerm(){
    let val=parseFactor();
    while(peek() && ['*','/'].includes(peek().val)){
      let op=next().val, b=parseFactor();
      val=op==='*'?(+val)*(+b):(+val)/(+b);
    }
    return val;
  }
  function parseExpr(){
    let val=parseTerm();
    while(peek() && ['+','-'].includes(peek().val)){
      let op=next().val, b=parseTerm();
      val=op==='+'?(+val)+(+b):(+val)-(+b);
    }
    return val;
  }
  let result=parseExpr();
  if(i!==tokens.length) throw '#SYNTAX!';
  return result;
}
// Simple formula tokenizer.
function tokenizeFormula(s){
  let out=[], i=0;
  while(i<s.length){
    let c=s[i];
    if(/\d|\./.test(c)){
      let m=s.slice(i).match(/^\d+(\.\d*)?/);
      out.push({type:'num',val:m[0]}); i+=m[0].length;
    }else if(/[A-Z]/i.test(c)){
      let m=s.slice(i).match(/^[A-Z]+[0-9]*/);
      if(m[0].match(/^[A-Z]+$/) && /^[A-Z]+$/.test(s.slice(i,i+m[0].length))) {
        out.push({type:'func',val:m[0]}); i+=m[0].length;
      } else {
        out.push({type:'cell',val:m[0]}); i+=m[0].length;
      }
    }else if(c==':'){ out.push({type:'colon',val:':' }); i++; }
    else if(c==','){ out.push({type:'comma',val:','}); i++; }
    else if('+-*/()'.includes(c)){
      let type = {'(': 'paren', ')':'paren'}[c]||'op';
      out.push({type:type,val:c}); i++;
    }
    else if(/\s/.test(c)){ ++i; }
    else throw '#SYNTAX!';
  }
  return out;
}

// ========== UI RENDER ===========

function renderSheetTabs(){
  let d=document.getElementById('sheet-tabs');
  d.innerHTML="";
  sheets.forEach((sheet,i)=>{
    let div=document.createElement('div');
    div.className='sheet-tab'+(i===currentSheetIdx?' active':'');
    div.tabIndex=0;
    div.setAttribute('data-sidx',i);
    if(sheet._renaming) {
      let inp=document.createElement('input');
      inp.className='rename';
      inp.value=sheet.name;
      inp.onblur=inp.onkeydown=(ev)=>{
        if(ev.type==='blur'||ev.key==='Enter'){
          let v=inp.value.trim().slice(0,32)||('Sheet'+(i+1));
          sheet.name=v;
          delete sheet._renaming;
          renderSheetTabs();
        }
      }
      div.append(inp);
    }else{
      div.innerText=sheet.name;
    }
    if(sheet.name.match(/^Sheet\d+$/) && sheets.length>1){
      let x=document.createElement('i');
      x.className="fa fa-x";
      x.title="Delete sheet";
      x.onclick=(ev)=>{
        ev.stopPropagation();
        if(confirm("Delete this sheet?")){
          sheets.splice(i,1);
          if(currentSheetIdx>=sheets.length) currentSheetIdx=sheets.length-1;
          renderSheetTabs(); renderSheet();
        }
      }
      div.appendChild(x);
    }
    div.ondblclick=()=>{
      sheet._renaming=true;
      renderSheetTabs();
      // focus input after paint:
      setTimeout(()=>div.querySelector('.rename')?.focus(), 0);
    }
    div.onclick=()=>{
      if(currentSheetIdx!==i) {
        currentSheetIdx=i;
        selection={start:{row:0,col:0},end:{row:0,col:0}};
        recalcAll();
        renderSheetTabs(); renderSheet();
      }
    }
    d.append(div);
  });
  // Add new sheet
  let add=document.createElement('div');
  add.className='sheet-tab add';
  add.innerHTML='<i class="fa fa-plus-circle"></i> Add';
  add.onclick=()=>{
    let n=1;
    while(sheets.some(s=>s.name==='Sheet'+n))n++;
    sheets.push({...makeEmptySheet(),name:'Sheet'+n});
    currentSheetIdx=sheets.length-1;
    renderSheetTabs(); renderSheet();
  }
  d.append(add);
}
function renderSheet(){
  let sheet=getSheet();
  let wrap=document.getElementById('ss-table-wrapper');
  wrap.innerHTML="";
  let table=document.createElement('table');
  table.className='ss-table'; table.tabIndex=0;
  let thead=document.createElement('thead');
  let tr=document.createElement('tr');
  // Top-left corner cell
  let th=document.createElement('th');
  th.className='ss-th-corner';
  tr.appendChild(th);
  // Column headers
  for(let c=0;c<sheet.c;++c){
    let th=document.createElement('th'); th.className='ss-th-col';
    th.innerHTML=tcol2label(c);
    th.style.width=sheet.colWidths[c]+"px";
    th.style.position="relative";
    // Column resize handle
    let resize=document.createElement('div');
    resize.className="col-resizer";
    resize.onmousedown=(ev)=>startColResize(ev, c);
    th.append(resize);
    tr.appendChild(th);
  }
  thead.appendChild(tr); table.appendChild(thead);

  let tbody=document.createElement('tbody');
  for(let r=0;r<sheet.r;++r){
    let tr=document.createElement('tr');
    // Row header
    let th=document.createElement('th');
    th.className='ss-th-row';
    th.innerText=""+(r+1);
    tr.appendChild(th);
    for(let c=0;c<sheet.c;++c){
      let td=document.createElement('td');
      td.className='ss-cell';
      td.setAttribute('data-row', r);
      td.setAttribute('data-col', c);
      let addr=toA1(c,r);
      // Selection state
      if(addrInRange(c,r,selection.start,selection.end)){
        td.classList.add('selected');
        td.tabIndex=0;
      }else if(selEditing && addrInRange(c,r,editStart,editEnd)){
        td.classList.add('range');
      }
      // Style: font, color from cell.s
      let cell=sheet.data[addr];
      if(cell){
        if(cell.s && cell.s.bold) td.classList.add('bold');
        if(cell.s && cell.s.italic) td.classList.add('italic');
        if(cell.bg) td.style.background=cell.bg;
      }
      // Value/formula/error
      let v, showIcon=false;
      if(cell&&cell.f&&cell.f[0]=='='){
        v=cell._value;
        if(typeof v==='string'&&v[0]=='#'){
          showIcon=true;
        }
      }else{
        v=cell?cell.v:"";
      }
      if(editingCell && editingCell.row===r&&editingCell.col===c){
        // In-cell editing
        let input=document.createElement('input');
        input.className='cell-edit';
        input.autocomplete="off"; input.type='text';
        input.spellcheck="false";
        input.value=cell&&(cell.f!==undefined?cell.f:cell.v)||"";
        if(selFormulaEditing) input.classList.add("formula-edit");
        input.onkeydown=(ev)=>{
          if(ev.key==="Enter"||ev.key==='Tab'){commitEdit(ev.key==='Tab'?1:0);}
          else if(ev.key==="Escape"){cancelEdit();}
        };
        input.onblur=()=>{setTimeout(cancelEdit,50);};
        input.oninput=()=>{formulaBarCache=input.value;setFormulaBar(input.value);}
        // Autofocus input:
        setTimeout(()=>input.focus(),0);
        td.appendChild(input);
      } else {
        if(showIcon) td.innerHTML='<i class="fa fa-exclamation-triangle"></i>';
        let sp=document.createElement('span');
        sp.className="overflow";
        sp.innerText=v!==undefined?v:"";
        td.appendChild(sp);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  setFormulaBar(getCellFormulaValue(selection.start));
}
// --- UI: formula bar
function setFormulaBar({addr, v, f}) {
  document.getElementById('cell-addr').innerText=addr||"";
  let bar=document.getElementById('cell-formula');
  if(bar!==document.activeElement){
    bar.value=(f!==undefined?f:v)||"";
    formulaBarCache=bar.value;
  }
}
function getCellFormulaValue(sel=selection.start){
  let addr=toA1(sel.col,sel.row), cell=getSheet().data[addr];
  return { addr,
    v: (cell && cell._value!==undefined)?cell._value:(cell?cell.v:''),
    f: cell && cell.f!==undefined ? cell.f : undefined
  };
}
// --- UI: toolbar
function renderToolbar(){
  let sheet=getSheet();
  let {col,row}=selection.start;
  let addr=toA1(col,row), cell=sheet.data[addr];
  document.getElementById('btn-bold').classList.toggle('active',cell?.s?.bold);
  document.getElementById('btn-italic').classList.toggle('active',cell?.s?.italic);
  document.getElementById('cell-bgcolor').value = cell?.bg||"#ffffff";
}

// ========== UI INTERACTIONS ==========

// Address-to label
function tcol2label(c){
  let str=""; ++c;
  while(c>0){
    let m=(c-1)%26;
    str=String.fromCharCode(65+m)+str;
    c=Math.floor((c-1)/26);
  }
  return str;
}

// --- Cell selection
let isDragging=false, dragSelStart=null, editStart=null, editEnd=null;
function onCellMouseDown(ev){
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  selection.start=selection.end={row:r,col:c};
  isDragging=true; dragSelStart={row:r,col:c};
  editingCell=null; selEditing=false; renderSheet();
}
function onCellMouseOver(ev){
  if(!isDragging) return;
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  selection.end={row:r,col:c}; renderSheet();
}
function onCellMouseUp(){ isDragging=false; }
function onTableDblClick(ev){
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  editingCell={row:r,col:c}; selEditing=false;
  formulaBarCache = getCellFormulaValue({row:r,col:c}).f||getCellFormulaValue({row:r,col:c}).v||"";
  renderSheet();
}
function onCellClick(ev){
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  selection.start=selection.end={row:r,col:c};
  editingCell=null; selEditing=false;
  formulaBarCache = getCellFormulaValue({row:r,col:c}).f||getCellFormulaValue({row:r,col:c}).v||"";
  renderSheet();
}
function selectRange(s,e){selection.start=s;selection.end=e;}
function startFormulaRangeSelect(){
  // When user drags to select in formula bar
  selEditing=true; editStart=null; editEnd=null;
}
function onTableMouseDownFormula(ev){
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  editStart={row:r,col:c}; editEnd={row:r,col:c}; selEditing=true;
  renderSheet();
}
function onTableMouseOverFormula(ev){
  if(!selEditing||editStart===null)return;
  let td=ev.target.closest("td.ss-cell");
  if(!td)return;
  let r=+td.getAttribute('data-row'),c=+td.getAttribute('data-col');
  editEnd={row:r,col:c}; renderSheet();
}
function onTableMouseUpFormula(ev){
  if(editStart && editEnd){
    let s=editStart,e=editEnd;
    let r0=Math.min(s.row,e.row), r1=Math.max(s.row,e.row);
    let c0=Math.min(s.col,e.col), c1=Math.max(s.col,e.col);
    let range = (c0===c1&&r0===r1)?
      toA1(c0,r0) : toA1(c0,r0)+":"+toA1(c1,r1);
    let fb=document.getElementById('cell-formula');
    let val=fb.value, sel=fb.selectionStart;
    // Insert at caret position
    let newVal = val.slice(0,sel)+range+val.slice(sel);
    fb.value=newVal; formulaBarCache=newVal;
    setTimeout(()=>{ fb.focus(); fb.selectionStart=sel+range.length; fb.selectionEnd=sel+range.length; },0);
  }
  selEditing=false; editStart=editEnd=null; renderSheet();
}
// --- Keyboard nav
function onTableKeyDown(ev){
  if(editingCell) return; // handled by input
  // Only process in spreadsheet area
  let {col,row}=selection.end;
  let ncol=col, nrow=row, handled=false;
  if(ev.key==='ArrowDown'){ nrow=clamp(row+1,0,getSheet().r-1);handled=true;}
  if(ev.key==='ArrowUp'){ nrow=clamp(row-1,0,getSheet().r-1);handled=true;}
  if(ev.key==='ArrowLeft'){ ncol=clamp(col-1,0,getSheet().c-1);handled=true;}
  if(ev.key==='ArrowRight'){ ncol=clamp(col+1,0,getSheet().c-1);handled=true;}
  if(ev.key==='Tab'){ ncol=clamp(col+1,0,getSheet().c-1); handled=true;}
  if(ev.key==='Enter'){ nrow=clamp(row+1,0,getSheet().r-1);handled=true;}
  if(ev.key==='Backspace'||ev.key==='Delete'){
    clearSelection();
    handled=true;
  }
  if(ev.key==='F2'){
    editingCell={row:row,col:col}; formulaBarCache = getCellFormulaValue({row,col}).f || getCellFormulaValue({row,col}).v || ""; renderSheet();
    handled=true;
  }
  if(handled){ev.preventDefault();
    selection.start=selection.end={row:nrow, col:ncol};
    editingCell=null; selEditing=false; renderSheet();
  }
}

// --- Toolbar actions
function toggleBold(){ formatCell('bold');}
function toggleItalic(){ formatCell('italic');}
function setBgColor(val){ formatCell('bg',val);}
function formatCell(type,val){
  let sh=getSheet();
  let {row:rs,col:cs}=selection.start, {row:re,col:ce}=selection.end;
  let r0=Math.min(rs,re), r1=Math.max(rs,re);
  let c0=Math.min(cs,ce), c1=Math.max(cs,ce);
  for(let r=r0;r<=r1;++r)for(let c=c0;c<=c1;++c){
    let addr=toA1(c,r);
    let cell=sh.data[addr]=sh.data[addr]||{};
    cell.s=cell.s||{};
    if(type==='bold'){cell.s.bold=!cell.s.bold;}
    if(type==='italic'){cell.s.italic=!cell.s.italic;}
    if(type==='bg'){cell.bg=val;}
  }
  renderSheet(); renderToolbar();
}
function clearSelection(){
  let sh=getSheet();
  let {row:rs,col:cs}=selection.start, {row:re,col:ce}=selection.end;
  let r0=Math.min(rs,re), r1=Math.max(rs,re);
  let c0=Math.min(cs,ce), c1=Math.max(cs,ce);
  for(let r=r0;r<=r1;++r)for(let c=c0;c<=c1;++c){
    let addr=toA1(c,r);
    delete sh.data[addr];
  }
  renderSheet();
}

// --- Formula bar input
document.getElementById('cell-formula').addEventListener('focus', ()=>{
  selFormulaEditing=true;
  document.getElementById('ss-table-wrapper').addEventListener('mousedown', onTableMouseDownFormula);
  document.getElementById('ss-table-wrapper').addEventListener('mouseover', onTableMouseOverFormula);
  document.getElementById('ss-table-wrapper').addEventListener('mouseup', onTableMouseUpFormula);
});
document.getElementById('cell-formula').addEventListener('blur', ()=>{
  selFormulaEditing=false;
  document.getElementById('ss-table-wrapper').removeEventListener('mousedown', onTableMouseDownFormula);
  document.getElementById('ss-table-wrapper').removeEventListener('mouseover', onTableMouseOverFormula);
  document.getElementById('ss-table-wrapper').removeEventListener('mouseup', onTableMouseUpFormula);
});
document.getElementById('cell-formula').addEventListener('input', function(ev){
  formulaBarCache=this.value;
});
document.getElementById('cell-formula').addEventListener('keydown', function(ev){
  if(ev.key==="Enter"||ev.key==="Tab"){
    commitFormulaBar();
    ev.preventDefault();
  }
});

function commitFormulaBar(){
  let {col,row}=selection.start;
  let addr=toA1(col,row), sh=getSheet();
  if(formulaBarCache.trim()!==""){
    let cell=sh.data[addr]=sh.data[addr]||{};
    if(formulaBarCache.trim()[0]==='=') cell.f=formulaBarCache.trim();
    else delete cell.f, cell.v=formulaBarCache.trim();
  }else{
    delete sh.data[addr];
  }
  recalcAll(); editingCell=null; renderSheet();
}
function cancelFormulaBar(){
  editingCell=null; renderSheet();
}
function startEditInCell(){
  let {col,row}=selection.start;
  editingCell={col,row}; selEditing=false;
  formulaBarCache = getCellFormulaValue({col,row}).f || getCellFormulaValue({col,row}).v || "";
  renderSheet();
}
function commitEdit(tab){
  let {col,row}=editingCell, sheet=getSheet();
  let addr=toA1(col,row);
  let val=formulaBarCache.trim();
  if(val!==""){
    let cell=sheet.data[addr]=sheet.data[addr]||{};
    if(val[0]==='=') cell.f=val;
    else delete cell.f, cell.v=val;
  }else delete sheet.data[addr];
  editingCell=null; recalcAll(); renderSheet();
  // Move focus/tab
  if(tab){ selection.start=selection.end={row:row,col:clamp(col+1,0,sheet.c-1)}; }
}
function cancelEdit(){
  editingCell=null; renderSheet();
}
// Table events
function attachTableEvents(){
  let wrap=document.getElementById('ss-table-wrapper');
  wrap.removeEventListener('mousedown', onCellMouseDown);
  wrap.removeEventListener('mouseover', onCellMouseOver);
  wrap.removeEventListener('mouseup', onCellMouseUp);
  wrap.removeEventListener('dblclick', onTableDblClick);
  wrap.removeEventListener('keydown', onTableKeyDown);
  wrap.removeEventListener('click', onCellClick);
  wrap.addEventListener('mousedown', onCellMouseDown);
  wrap.addEventListener('mouseover', onCellMouseOver);
  wrap.addEventListener('mouseup', onCellMouseUp);
  wrap.addEventListener('dblclick', onTableDblClick);
  wrap.addEventListener('keydown', onTableKeyDown);
  wrap.addEventListener('click', onCellClick);
}
function attachToolbarEvents(){
  document.getElementById('btn-bold').onclick=toggleBold;
  document.getElementById('btn-italic').onclick=toggleItalic;
  document.getElementById('cell-bgcolor').onchange=ev=>setBgColor(ev.target.value);
  document.getElementById('btn-clear').onclick=clearSelection;
  document.getElementById('btn-dn').onclick=downloadCSV;
  document.getElementById('uploadcsv').onchange=handleUploadCSV;
}
function downloadCSV(){
  let sh=getSheet(), rows=[];
  for(let r=0;r<sh.r;++r){
    let row=[];
    for(let c=0;c<sh.c;++c){
      let cell=sh.data[toA1(c,r)];
      let val=cell?(cell.f!==undefined?cell.f:cell.v):'';
      if(val===undefined)val="";
      if(typeof val==='string' && /[",\n]/.test(val))
        val='"'+val.replace(/"/g,'""')+'"';
      row.push(val);
    }
    rows.push(row.join(","));
  }
  let blob=new Blob([rows.join("\r\n")],{type:'text/csv'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=(getSheet().name||'sheet')+'.csv';
  a.click();
}
function handleUploadCSV(ev){
  let file=ev.target.files[0]; if(!file)return;
  let reader=new FileReader();
  reader.onload=function(e){
    let text=e.target.result;
    let rows=text.replace(/\r/g,'').split('\n');
    let sh=getSheet();
    for(let r=0;r<sh.r;++r)for(let c=0;c<sh.c;++c) delete sh.data[toA1(c,r)];
    for(let r=0;r<Math.min(rows.length,sh.r);++r){
      let cols=parseCSVLine(rows[r]);
      for(let c=0;c<Math.min(cols.length,sh.c);++c){
        let v=cols[c]; if(v==="")continue;
        let cell=sh.data[toA1(c,r)]={};
        if(v[0]==='=')cell.f=v; else cell.v=v;
      }
    }
    recalcAll(); renderSheet();
  };
  reader.readAsText(file);
}
function parseCSVLine(line){
  let res=[], cur="", inq=0; for(let i=0;i<line.length;++i){
    let c=line[i];
    if(c==','&&!inq){res.push(cur);cur="";}
    else if(c=='"')inq=!inq;
    else cur+=c;
  } res.push(cur); return res;
}

// --- Column resize
let colResizeData=null;
function startColResize(ev, c){
  ev.stopPropagation();
  document.body.style.cursor="ew-resize";
  colResizeData={col:c, sx:ev.pageX, w:getSheet().colWidths[c]};
  window.addEventListener('mousemove', onColResizeMove);
  window.addEventListener('mouseup', onColResizeStop);
}
function onColResizeMove(ev){
  let {col,sx,w}=colResizeData;
  let dx=ev.pageX-sx, neww=clamp(w+dx,COL_MIN_WIDTH,COL_MAX_WIDTH);
  getSheet().colWidths[col]=neww;
  renderSheet();
}
function onColResizeStop(){
  colResizeData=null;
  document.body.style.cursor="";
  window.removeEventListener('mousemove', onColResizeMove);
  window.removeEventListener('mouseup', onColResizeStop);
}
// === Main render
function mainRender(){
  renderSheetTabs();
  recalcAll();
  renderSheet();
  renderToolbar();
  attachTableEvents();
  attachToolbarEvents();
}
mainRender();
