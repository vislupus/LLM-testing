<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet — Spreadsheet</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; font-size: 13px; color: #202124; background: #f8f9fa; user-select: none; }

  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ===== Toolbar ===== */
  #toolbar {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px; background: #fff; border-bottom: 1px solid #e0e0e0;
    height: 44px; flex-shrink: 0; overflow-x: auto;
  }
  .tool-group { display: flex; gap: 2px; align-items: center; padding: 0 4px; border-right: 1px solid #e8eaed; }
  .tool-group:last-child { border-right: none; }
  .tool-btn {
    background: transparent; border: 1px solid transparent; padding: 5px 8px;
    border-radius: 4px; cursor: pointer; color: #5f6368; font-size: 13px;
    display: inline-flex; align-items: center; gap: 4px; min-height: 28px;
    transition: background .12s;
    font-family: inherit;
  }
  .tool-btn:hover { background: #f1f3f4; border-color: #dadce0; color: #202124; }
  .tool-btn:active { background: #e8eaed; }
  .tool-btn.active { background: #e8f0fe; color: #1a73e8; border-color: #dadce0; }
  .tool-btn.bold-btn { font-weight: 700; }
  .tool-btn.italic-btn { font-style: italic; }
  .tool-btn.icon { padding: 5px; }
  .tool-btn svg { width: 16px; height: 16px; }
  .color-swatch {
    width: 18px; height: 18px; border-radius: 3px; border: 1px solid #5f6368; cursor: pointer;
    display: inline-block;
  }
  .color-input { width: 0; height: 0; opacity: 0; }

  /* ===== Formula Bar ===== */
  #formulaBar {
    display: flex; align-items: center; background: #fff;
    border-bottom: 1px solid #e0e0e0; padding: 4px 8px; gap: 8px; height: 32px; flex-shrink: 0;
  }
  #cellName {
    width: 70px; padding: 4px 8px; background: #fff;
    border: 1px solid #dadce0; border-radius: 4px;
    text-align: center; font-size: 12px; color: #202124; font-weight: 500;
  }
  #cellDivider {
    width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    color: #5f6368; font-size: 14px; font-style: italic; font-weight: 700; font-family: Georgia, serif;
  }
  #formulaInput {
    flex: 1; height: 26px; padding: 4px 8px; border: 1px solid transparent;
    border-radius: 4px; outline: none; font-family: inherit; font-size: 13px;
    background: transparent; color: #202124;
  }
  #formulaInput:focus { border-color: #1a73e8; background: #fff; }

  /* ===== Grid ===== */
  #grid { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #fff; position: relative; }
  #gridHeaderRow { display: flex; height: 24px; flex-shrink: 0; background: #f8f9fa; border-bottom: 1px solid #d0d0d0; }
  #cornerCell { width: 46px; flex-shrink: 0; background: #f8f9fa; border-right: 1px solid #d0d0d0; border-bottom: 1px solid #d0d0d0; position: relative; z-index: 3; }
  #colHeadersScroll { flex: 1; overflow: hidden; position: relative; }
  #colHeaders { display: flex; height: 100%; will-change: transform; }
  .col-header {
    flex-shrink: 0; height: 100%; display: flex; align-items: center; justify-content: center;
    background: #f8f9fa; border-right: 1px solid #e0e0e0; border-bottom: 1px solid #d0d0d0;
    font-size: 11px; color: #5f6368; font-weight: 500; position: relative;
    box-sizing: border-box;
  }
  .col-resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 2; }
  .col-resize:hover { background: #1a73e8; opacity: 0.4; }

  #gridBody { flex: 1; display: flex; overflow: hidden; }
  #rowHeadersScroll { width: 46px; flex-shrink: 0; background: #f8f9fa; border-right: 1px solid #d0d0d0; overflow: hidden; position: relative; z-index: 2; }
  #rowHeaders { will-change: transform; }
  .row-header {
    height: 24px; width: 100%; display: flex; align-items: center; justify-content: center;
    background: #f8f9fa; border-bottom: 1px solid #e0e0e0; border-right: 1px solid #d0d0d0;
    font-size: 11px; color: #5f6368; font-weight: 500;
    box-sizing: border-box;
  }

  #cellsScroll { flex: 1; overflow: auto; position: relative; }
  #cellsContent { position: relative; }
  .cell {
    position: absolute; box-sizing: border-box; padding: 0 4px;
    display: flex; align-items: center; overflow: hidden;
    border-right: 1px solid #e0e0e0; border-bottom: 1px solid #e0e0e0;
    background: #fff; color: #202124;
    font-size: 13px; line-height: 1; white-space: nowrap; text-overflow: ellipsis;
    cursor: cell;
  }
  .cell.right { justify-content: flex-end; }
  .cell.center { justify-content: center; }
  .cell.bold { font-weight: 700; }
  .cell.italic { font-style: italic; }
  .cell.input-mode {
    padding: 0; background: #fff;
  }
  .cell.input-mode input {
    width: 100%; height: 100%; border: 2px solid #1a73e8; outline: none;
    padding: 0 4px; font: inherit; background: #fff; color: #202124;
    text-align: inherit; box-sizing: border-box;
  }
  .selection-rect {
    position: absolute; border: 2px solid #1a73e8; pointer-events: none;
    background: rgba(26,115,232,0.08); z-index: 4;
  }
  .active-cell-outline {
    position: absolute; border: 2px solid #1a73e8; pointer-events: none;
    background: transparent; z-index: 5;
  }

  /* ===== Sheet Tabs ===== */
  #sheetTabs {
    display: flex; align-items: center; background: #f8f9fa;
    border-top: 1px solid #d0d0d0; height: 30px; padding: 0 4px; gap: 2px; flex-shrink: 0;
  }
  .sheet-tab {
    padding: 4px 12px; background: #fff; border: 1px solid #d0d0d0; border-bottom: none;
    border-radius: 4px 4px 0 0; cursor: pointer; font-size: 12px; color: #5f6368;
    display: flex; align-items: center; gap: 6px; max-width: 150px;
  }
  .sheet-tab.active { background: #fff; color: #1a73e8; font-weight: 500; border-bottom: 1px solid #fff; margin-bottom: -1px; }
  .sheet-tab:hover:not(.active) { background: #f1f3f4; }
  .sheet-tab .rename-icon { font-size: 10px; opacity: 0; transition: opacity .15s; }
  .sheet-tab:hover .rename-icon { opacity: 0.6; }
  .add-sheet-btn {
    width: 26px; height: 22px; border: 1px solid transparent; border-radius: 4px;
    background: transparent; cursor: pointer; color: #5f6368; font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .add-sheet-btn:hover { background: #e8eaed; }

  .context-menu {
    position: fixed; background: #fff; border: 1px solid #dadce0; border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15); padding: 4px 0; z-index: 1000; min-width: 140px;
  }
  .context-menu-item {
    padding: 6px 16px; cursor: pointer; font-size: 13px; color: #202124;
  }
  .context-menu-item:hover { background: #f1f3f4; }
  .context-menu-item.disabled { color: #9aa0a6; cursor: not-allowed; }

  /* Drag-select highlight during formula editing */
  .formula-range-preview {
    position: absolute; border: 1px solid #1a73e8; pointer-events: none;
    background: rgba(26,115,232,0.15); z-index: 3;
  }

  /* Scrollbars */
  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: #f8f9fa; }
  ::-webkit-scrollbar-thumb { background: #dadce0; border-radius: 6px; border: 2px solid #f8f9fa; }
  ::-webkit-scrollbar-thumb:hover { background: #bdc1c6; }
  ::-webkit-scrollbar-corner { background: #f8f9fa; }

  /* Toast */
  #toast {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    background: #323232; color: #fff; padding: 10px 20px; border-radius: 4px;
    font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 2000;
  }
  #toast.show { opacity: 0.92; }
</style>
</head>
<body>
<div id="app">
  <!-- TOOLBAR -->
  <div id="toolbar">
    <div class="tool-group">
      <span style="font-weight:700;color:#1a73e8;padding:0 8px;font-size:14px;letter-spacing:.5px">⊞ Sheet</span>
    </div>
    <div class="tool-group">
      <button class="tool-btn" id="btnNew" title="New spreadsheet">＋ New</button>
      <button class="tool-btn" id="btnDownload" title="Download as CSV">⬇ CSV</button>
      <button class="tool-btn" id="btnUpload" title="Upload CSV">⬆ CSV</button>
      <input type="file" id="csvFileInput" accept=".csv,text/csv" style="display:none">
    </div>
    <div class="tool-group">
      <button class="tool-btn bold-btn" id="btnBold" title="Bold (Ctrl+B)">B</button>
      <button class="tool-btn italic-btn" id="btnItalic" title="Italic (Ctrl+I)"><span style="font-family:Georgia">I</span></button>
      <button class="tool-btn" id="btnAlignLeft" title="Align left">⇤</button>
      <button class="tool-btn" id="btnAlignCenter" title="Align center">≡</button>
      <button class="tool-btn" id="btnAlignRight" title="Align right">⇥</button>
    </div>
    <div class="tool-group">
      <label class="tool-btn" title="Fill color">
        <span style="font-size:11px;">Fill</span>
        <span class="color-swatch" id="bgSwatch" style="background:#ffff00"></span>
        <input type="color" class="color-input" id="bgColorPicker" value="#ffff00">
      </label>
      <label class="tool-btn" title="Font color">
        <span style="font-size:11px;">Font</span>
        <span class="color-swatch" id="fgSwatch" style="background:#202124"></span>
        <input type="color" class="color-input" id="fgColorPicker" value="#202124">
      </label>
    </div>
    <div class="tool-group">
      <button class="tool-btn" id="btnClear" title="Clear contents (Delete)">✕ Clear</button>
    </div>
  </div>

  <!-- FORMULA BAR -->
  <div id="formulaBar">
    <div id="cellName">A1</div>
    <div id="cellDivider">fx</div>
    <input id="formulaInput" type="text" placeholder="Enter value or formula (start with =)" autocomplete="off" spellcheck="false">
  </div>

  <!-- GRID -->
  <div id="grid">
    <div id="gridHeaderRow">
      <div id="cornerCell"></div>
      <div id="colHeadersScroll"><div id="colHeaders"></div></div>
    </div>
    <div id="gridBody">
      <div id="rowHeadersScroll"><div id="rowHeaders"></div></div>
      <div id="cellsScroll">
        <div id="cellsContent"></div>
      </div>
    </div>
  </div>

  <!-- SHEET TABS -->
  <div id="sheetTabs">
    <div id="tabsContainer"></div>
    <button class="add-sheet-btn" id="addSheetBtn" title="Add sheet">+</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  'use strict';

  // ============================================================
  // CONSTANTS
  // ============================================================
  const ROW_HEIGHT = 24;
  const DEFAULT_COL_WIDTH = 80;
  const NUM_COLS = 52;          // A..Z, AA..AZ
  const NUM_ROWS = 500;
  const SCROLL_BUFFER = 6;
  const DEFAULT_BG = '#ffffff';
  const DEFAULT_FG = '#202124';

  // ============================================================
  // STATE
  // ============================================================
  function makeSheet(name) {
    return {
      name,
      cells: {},           // key like "A1" -> { value, display, formula, style }
      colWidths: {},       // 'A' -> width (px), default DEFAULT_COL_WIDTH
      rowHeights: {},      // rowNum -> height (px), default ROW_HEIGHT
      activeCell: 'A1',
      selectionStart: 'A1',
      selectionEnd: 'A1'
    };
  }

  const state = {
    sheets: [makeSheet('Sheet1')],
    activeSheetIdx: 0,
    editingCell: null,         // { ref, originalValue } while in cell edit
    editingFormula: false,     // true while formula bar is being edited with '='
    formulaDragStart: null,    // cell ref where formula drag started
    bgColor: '#ffff00',
    fgColor: '#202124',
    colResizeDrag: null,       // { col, startX, startWidth }
    lastSelectionRange: null,
    contextMenuTarget: null
  };

  // ============================================================
  // UTIL: column / row conversions
  // ============================================================
  function numToCol(n) {
    let s = '';
    while (n > 0) {
      const r = (n - 1) % 26;
      s = String.fromCharCode(65 + r) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }
  function colToNum(s) {
    let n = 0;
    for (let i = 0; i < s.length; i++) {
      n = n * 26 + (s.charCodeAt(i) - 64);
    }
    return n;
  }
  function isCellRef(s) {
    return /^\$?[A-Za-z]+\$?\d+$/.test(s);
  }
  function refToParts(ref) {
    const m = ref.match(/^\$?([A-Za-z]+)\$?(\d+)$/);
    return m ? { col: colToNum(m[1].toUpperCase()), row: parseInt(m[2], 10) } : null;
  }
  function partsToRef(col, row) {
    return numToCol(col) + row;
  }

  // ============================================================
  // CELL ACCESSORS
  // ============================================================
  const sheet = () => state.sheets[state.activeSheetIdx];

  function getCellRaw(ref) {
    return sheet().cells[ref.toUpperCase()];
  }
  function ensureCell(ref) {
    ref = ref.toUpperCase();
    if (!sheet().cells[ref]) {
      sheet().cells[ref] = { value: '', display: '', formula: null, style: {} };
    }
    return sheet().cells[ref];
  }
  function getCellValue(ref) {
    const c = getCellRaw(ref);
    if (!c) return '';
    return c.display !== undefined ? c.display : c.value;
  }
  function setCellValue(ref, val, opts) {
    opts = opts || {};
    ref = ref.toUpperCase();
    const cell = ensureCell(ref);
    if (typeof val === 'string' && val.startsWith('=') && !opts.forceValue) {
      cell.formula = val;
      cell.value = val;
      const result = evaluateFormula(val);
      cell.display = result;
    } else {
      cell.formula = null;
      // Try to convert to number if possible
      if (typeof val === 'string' && val !== '' && !isNaN(val) && !isNaN(parseFloat(val)) && /^-?\d+(\.\d+)?$/.test(val.trim())) {
        cell.value = parseFloat(val);
      } else {
        cell.value = val;
      }
      cell.display = val;
    }
    recalcDependents(ref);
  }
  function clearCell(ref) {
    ref = ref.toUpperCase();
    delete sheet().cells[ref];
    recalcDependents(ref);
  }
  function getCellStyle(ref) {
    const c = getCellRaw(ref);
    return (c && c.style) ? c.style : {};
  }

  // ============================================================
  // FORMULA EVALUATION
  // ============================================================
  function evaluateFormula(formula) {
    if (!formula.startsWith('=')) return formula;
    let expr = formula.slice(1);
    try {
      // Replace functions
      expr = expr.replace(/\b(SUM|AVERAGE|MIN|MAX|COUNT)\s*\(/gi, (m, fn) => {
        const f = { SUM: '((a)=>a.reduce((x,y)=>x+y,0))',
                    AVERAGE: '((a)=>a.reduce((x,y)=>x+y,0)/a.length)',
                    MIN: '((a)=>Math.min(...a))',
                    MAX: '((a)=>Math.max(...a))',
                    COUNT: '((a)=>a.filter(x=>typeof x==="number").length)' }[fn.toUpperCase()];
        return f + '(';
      });

      // Replace ranges (with array literal)
      expr = expr.replace(/\b([A-Za-z]+)(\d+)\s*:\s*([A-Za-z]+)(\d+)\b/g, (m, c1, r1, c2, r2) => {
        const arr = getRangeNumericValues(c1, parseInt(r1), c2, parseInt(r2));
        return '[' + arr.join(',') + ']';
      });

      // Replace single cell refs
      expr = expr.replace(/\b([A-Za-z]+)(\d+)\b/g, (m, col, row) => {
        const v = getCellValue(col.toUpperCase() + row);
        if (v === '' || v === null || v === undefined) return '0';
        if (typeof v === 'number') return v;
        const n = parseFloat(v);
        if (!isNaN(n) && /^-?\d+(\.\d+)?$/.test(String(v).trim())) return n;
        return '"' + String(v).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
      });

      // Avoid `new Function` for security; still allow it for trusted local code
      const fn = new Function('return (' + expr + ');');
      const result = fn();
      if (result === undefined || result === null) return '';
      if (typeof result === 'number') {
        if (!isFinite(result)) return '#DIV/0!';
        // Round very long floats
        return Math.abs(result) < 1e-12 ? 0 : result;
      }
      return String(result);
    } catch (e) {
      return '#ERROR!';
    }
  }

  function getRangeNumericValues(c1, r1, c2, r2) {
    const col1 = colToNum(c1.toUpperCase());
    const col2 = colToNum(c2.toUpperCase());
    const cStart = Math.min(col1, col2);
    const cEnd = Math.max(col1, col2);
    const rStart = Math.min(r1, r2);
    const rEnd = Math.max(r1, r2);
    const arr = [];
    for (let r = rStart; r <= rEnd; r++) {
      for (let c = cStart; c <= cEnd; c++) {
        const v = getCellValue(numToCol(c) + r);
        const n = parseFloat(v);
        if (!isNaN(n) && v !== '' && v !== null) arr.push(n);
      }
    }
    return arr.length ? arr : [0];
  }

  // ============================================================
  // DEPENDENCY GRAPH & RECALC
  // ============================================================
  function extractRefs(formula) {
    const refs = new Set();
    if (!formula || !formula.startsWith('=')) return refs;
    const f = formula.slice(1);
    // ranges first
    const rangeRe = /\b([A-Za-z]+)(\d+)\s*:\s*([A-Za-z]+)(\d+)\b/g;
    let m;
    while ((m = rangeRe.exec(f)) !== null) {
      const col1 = colToNum(m[1].toUpperCase());
      const col2 = colToNum(m[3].toUpperCase());
      const r1 = parseInt(m[2], 10), r2 = parseInt(m[4], 10);
      for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) {
        for (let c = Math.min(col1, col2); c <= Math.max(col1, col2); c++) {
          refs.add(numToCol(c) + r);
        }
      }
    }
    // single refs
    const singleRe = /\b([A-Za-z]+)(\d+)\b/g;
    while ((m = singleRe.exec(f)) !== null) {
      refs.add(m[1].toUpperCase() + m[2]);
    }
    return refs;
  }

  function recalcDependents(changedRef) {
    const queue = [changedRef.toUpperCase()];
    const visited = new Set();
    while (queue.length) {
      const r = queue.shift();
      if (visited.has(r)) continue;
      visited.add(r);
      // Find all cells that reference r
      for (const ref in sheet().cells) {
        const cell = sheet().cells[ref];
        if (!cell.formula) continue;
        const refs = extractRefs(cell.formula);
        if (refs.has(r)) {
          const result = evaluateFormula(cell.formula);
          cell.display = result;
          queue.push(ref);
        }
      }
    }
  }

  function fullRecalculate() {
    // Recalc all formula cells. Simple approach: iterate multiple times to handle dependencies.
    for (let pass = 0; pass < 5; pass++) {
      for (const ref in sheet().cells) {
        const cell = sheet().cells[ref];
        if (cell.formula) {
          cell.display = evaluateFormula(cell.formula);
        }
      }
    }
  }

  // ============================================================
  // COLUMN WIDTH TRACKING
  // ============================================================
  function getColWidth(colLetter) {
    return sheet().colWidths[colLetter] || DEFAULT_COL_WIDTH;
  }
  function setColWidth(colLetter, w) {
    sheet().colWidths[colLetter] = Math.max(20, w);
  }
  function getColOffset(colIdx) {
    // 1-indexed col -> x offset
    let off = 0;
    for (let i = 1; i < colIdx; i++) off += getColWidth(numToCol(i));
    return off;
  }
  function getTotalWidth() {
    let w = 0;
    for (let i = 1; i <= NUM_COLS; i++) w += getColWidth(numToCol(i));
    return w;
  }

  // ============================================================
  // GRID RENDERING
  // ============================================================
  const cellsScroll = document.getElementById('cellsScroll');
  const cellsContent = document.getElementById('cellsContent');
  const colHeaders = document.getElementById('colHeaders');
  const colHeadersScroll = document.getElementById('colHeadersScroll');
  const rowHeaders = document.getElementById('rowHeaders');
  const rowHeadersScroll = document.getElementById('rowHeadersScroll');
  const cellNameEl = document.getElementById('cellName');
  const formulaInput = document.getElementById('formulaInput');

  // Render column headers
  function renderColHeaders() {
    colHeaders.innerHTML = '';
    for (let c = 1; c <= NUM_COLS; c++) {
      const col = numToCol(c);
      const div = document.createElement('div');
      div.className = 'col-header';
      div.style.width = getColWidth(col) + 'px';
      div.style.minWidth = getColWidth(col) + 'px';
      div.dataset.col = c;
      div.textContent = col;
      const resize = document.createElement('div');
      resize.className = 'col-resize';
      resize.dataset.col = col;
      div.appendChild(resize);
      colHeaders.appendChild(div);
    }
  }

  // Render visible cells (virtualized)
  function renderCells() {
    const scrollTop = cellsScroll.scrollTop;
    const scrollLeft = cellsScroll.scrollLeft;
    const viewportH = cellsScroll.clientHeight;
    const viewportW = cellsScroll.clientWidth;

    const totalW = getTotalWidth();
    const totalH = NUM_ROWS * ROW_HEIGHT;
    cellsContent.style.width = totalW + 'px';
    cellsContent.style.height = totalH + 'px';

    const firstRow = Math.floor(scrollTop / ROW_HEIGHT);
    const lastRow = Math.min(NUM_ROWS, Math.ceil((scrollTop + viewportH) / ROW_HEIGHT));
    const startRow = Math.max(1, firstRow - SCROLL_BUFFER);
    const endRow = Math.min(NUM_ROWS, lastRow + SCROLL_BUFFER);

    // Determine visible columns
    let acc = 0;
    let firstCol = 1;
    for (let c = 1; c <= NUM_COLS; c++) {
      acc += getColWidth(numToCol(c));
      if (acc > scrollLeft) { firstCol = c; break; }
    }
    acc = 0;
    let lastCol = NUM_COLS;
    for (let c = 1; c <= NUM_COLS; c++) {
      acc += getColWidth(numToCol(c));
      if (acc > scrollLeft + viewportW) { lastCol = c; break; }
    }
    const startCol = Math.max(1, firstCol - 1);
    const endCol = Math.min(NUM_COLS, lastCol + 1);

    // Build cells
    let html = '';
    let colOff = getColOffset(startCol);
    const colOffsets = [];
    for (let c = startCol; c <= endCol; c++) {
      colOffsets.push(colOff);
      colOff += getColWidth(numToCol(c));
    }

    for (let r = startRow; r <= endRow; r++) {
      for (let ci = 0; ci < colOffsets.length; ci++) {
        const c = startCol + ci;
        const ref = numToCol(c) + r;
        const cell = sheet().cells[ref];
        const x = colOffsets[ci];
        const y = (r - 1) * ROW_HEIGHT;
        const w = getColWidth(numToCol(c));
        const style = cell ? cell.style : null;

        let cls = 'cell';
        let styles = `left:${x}px;top:${y}px;width:${w}px;height:${ROW_HEIGHT}px;`;
        let text = '';
        if (cell) {
          if (style) {
            if (style.bold) cls += ' bold';
            if (style.italic) cls += ' italic';
            if (style.align === 'right') cls += ' right';
            else if (style.align === 'center') cls += ' center';
            if (style.bg) styles += `background:${style.bg};`;
            if (style.fg) styles += `color:${style.fg};`;
          }
          // Display number-formatted for numbers
          text = cell.display === undefined || cell.display === null ? '' : String(cell.display);
        }
        // Truncate display to ~25 chars
        if (text.length > 100) text = text.slice(0, 100) + '…';
        // Escape for HTML
        text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `<div class="${cls}" data-ref="${ref}" style="${styles}">${text}</div>`;
      }
    }

    cellsContent.innerHTML = html;

    // Render selection rect
    renderSelectionRect();
    renderRowHeaders(startRow, endRow);
  }

  function renderRowHeaders(startRow, endRow) {
    const scrollTop = cellsScroll.scrollTop;
    const totalH = NUM_ROWS * ROW_HEIGHT;
    rowHeaders.style.height = totalH + 'px';
    let html = '';
    for (let r = startRow; r <= endRow; r++) {
      const y = (r - 1) * ROW_HEIGHT;
      html += `<div class="row-header" data-row="${r}" style="position:absolute;top:${y}px;left:0;right:0;height:${ROW_HEIGHT}px;">${r}</div>`;
    }
    rowHeaders.innerHTML = html;
  }

  function renderSelectionRect() {
    // Remove old overlays
    document.querySelectorAll('.selection-rect, .active-cell-outline').forEach(e => e.remove());

    const startP = refToParts(sheet().selectionStart);
    const endP = refToParts(sheet().selectionEnd);
    if (!startP || !endP) return;

    const cStart = Math.min(startP.col, endP.col);
    const cEnd = Math.max(startP.col, endP.col);
    const rStart = Math.min(startP.row, endP.row);
    const rEnd = Math.max(startP.row, endP.row);

    const x1 = getColOffset(cStart);
    const x2 = getColOffset(cEnd + 1);
    const y1 = (rStart - 1) * ROW_HEIGHT;
    const y2 = rEnd * ROW_HEIGHT;
    const w = x2 - x1, h = y2 - y1;

    const rect = document.createElement('div');
    rect.className = 'selection-rect';
    rect.style.left = x1 + 'px';
    rect.style.top = y1 + 'px';
    rect.style.width = w + 'px';
    rect.style.height = h + 'px';
    cellsContent.appendChild(rect);

    // Active cell outline (always visible, even when scrolling)
    const activeP = refToParts(sheet().activeCell);
    if (activeP) {
      const ax1 = getColOffset(activeP.col);
      const ax2 = getColOffset(activeP.col + 1);
      const ay1 = (activeP.row - 1) * ROW_HEIGHT;
      const ay2 = activeP.row * ROW_HEIGHT;
      const act = document.createElement('div');
      act.className = 'active-cell-outline';
      act.style.left = ax1 + 'px';
      act.style.top = ay1 + 'px';
      act.style.width = (ax2 - ax1) + 'px';
      act.style.height = (ay2 - ay1) + 'px';
      cellsContent.appendChild(act);
    }
  }

  // Sync header scroll
  function syncHeaderScroll() {
    colHeaders.style.transform = `translateX(${-cellsScroll.scrollLeft}px)`;
    rowHeaders.style.transform = `translateY(${-cellsScroll.scrollTop}px)`;
  }

  // Make active cell visible
  function scrollToCell(ref) {
    const p = refToParts(ref);
    if (!p) return;
    const x = getColOffset(p.col);
    const y = (p.row - 1) * ROW_HEIGHT;
    const w = getColWidth(numToCol(p.col));
    if (x < cellsScroll.scrollLeft + 46) {
      cellsScroll.scrollLeft = Math.max(0, x - 46);
    } else if (x + w > cellsScroll.scrollLeft + cellsScroll.clientWidth) {
      cellsScroll.scrollLeft = x + w - cellsScroll.clientWidth + 10;
    }
    if (y < cellsScroll.scrollTop) {
      cellsScroll.scrollTop = y;
    } else if (y + ROW_HEIGHT > cellsScroll.scrollTop + cellsScroll.clientHeight) {
      cellsScroll.scrollTop = y + ROW_HEIGHT - cellsScroll.clientHeight;
    }
  }

  // ============================================================
  // FORMULA BAR
  // ============================================================
  function updateFormulaBar() {
    const ref = sheet().activeCell;
    cellNameEl.textContent = ref;
    const cell = getCellRaw(ref);
    if (cell && cell.formula) {
      formulaInput.value = cell.formula;
    } else if (cell) {
      formulaInput.value = cell.value === null || cell.value === undefined ? '' : String(cell.value);
    } else {
      formulaInput.value = '';
    }
  }

  function commitFormulaBar() {
    const ref = sheet().activeCell;
    const val = formulaInput.value;
    if (val === '') {
      clearCell(ref);
    } else {
      setCellValue(ref, val);
    }
    renderCells();
    syncHeaderScroll();
  }

  // ============================================================
  // CELL INTERACTION
  // ============================================================
  let isSelecting = false;
  let selectionAnchor = null;

  function setSelection(start, end, activeCell) {
    sheet().selectionStart = start.toUpperCase();
    sheet().selectionEnd = end.toUpperCase();
    sheet().activeCell = (activeCell || end).toUpperCase();
    updateFormulaBar();
    renderSelectionRect();
    syncHeaderScroll();
  }

  // Click on cell
  cellsContent.addEventListener('mousedown', (e) => {
    const cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    const ref = cellEl.dataset.ref;

    if (state.editingFormula) {
      // Insert cell reference at cursor
      insertRefIntoFormula(ref);
      return;
    }

    isSelecting = true;
    selectionAnchor = ref;
    setSelection(ref, ref, ref);

    // Bring cell into view
    scrollToCell(ref);
  });

  // Drag selection
  cellsContent.addEventListener('mouseover', (e) => {
    if (!isSelecting) {
      // If editing formula and dragging, update preview
      if (state.editingFormula && state.formulaDragStart) {
        const cellEl = e.target.closest('.cell');
        if (cellEl) {
          const ref = cellEl.dataset.ref;
          updateFormulaRangePreview(state.formulaDragStart, ref);
        }
      }
      return;
    }
    const cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    const ref = cellEl.dataset.ref;
    setSelection(selectionAnchor, ref, ref);
  });

  document.addEventListener('mouseup', (e) => {
    if (state.editingFormula && state.formulaDragStart) {
      // Commit range into formula
      const cellEl = e.target.closest('.cell') || (state.lastFormulaDragEnd ? null : null);
      const endRef = state.lastFormulaDragEnd || state.formulaDragStart;
      const rangeStr = formatRange(state.formulaDragStart, endRef);
      insertTextIntoFormula(rangeStr);
      clearFormulaRangePreview();
      state.formulaDragStart = null;
      state.lastFormulaDragEnd = null;
      return;
    }
    isSelecting = false;
  });

  // Double-click to edit
  cellsContent.addEventListener('dblclick', (e) => {
    if (state.editingFormula) return;
    const cellEl = e.target.closest('.cell');
    if (!cellEl) return;
    startCellEdit(cellEl.dataset.ref);
  });

  // ===== Formula range preview during formula editing =====
  let previewEl = null;
  function updateFormulaRangePreview(startRef, endRef) {
    state.lastFormulaDragEnd = endRef;
    if (!previewEl) {
      previewEl = document.createElement('div');
      previewEl.className = 'formula-range-preview';
      cellsContent.appendChild(previewEl);
    }
    const sp = refToParts(startRef);
    const ep = refToParts(endRef);
    const cStart = Math.min(sp.col, ep.col);
    const cEnd = Math.max(sp.col, ep.col);
    const rStart = Math.min(sp.row, ep.row);
    const rEnd = Math.max(sp.row, ep.row);
    previewEl.style.left = getColOffset(cStart) + 'px';
    previewEl.style.top = ((rStart - 1) * ROW_HEIGHT) + 'px';
    previewEl.style.width = (getColOffset(cEnd + 1) - getColOffset(cStart)) + 'px';
    previewEl.style.height = ((rEnd - rStart + 1) * ROW_HEIGHT) + 'px';
  }
  function clearFormulaRangePreview() {
    if (previewEl) {
      previewEl.remove();
      previewEl = null;
    }
  }
  function formatRange(a, b) {
    const ap = refToParts(a), bp = refToParts(b);
    if (ap.col === bp.col && ap.row === bp.row) return a;
    const cStart = numToCol(Math.min(ap.col, bp.col));
    const cEnd = numToCol(Math.max(ap.col, bp.col));
    const rStart = Math.min(ap.row, bp.row);
    const rEnd = Math.max(ap.row, bp.row);
    if (ap.col === bp.col && ap.row !== bp.row) return cStart + rStart + ':' + cEnd + rEnd;
    if (ap.row === bp.row && ap.col !== bp.col) return cStart + rStart + ':' + cEnd + rEnd;
    return cStart + rStart + ':' + cEnd + rEnd;
  }

  function insertRefIntoFormula(ref) {
    insertTextIntoFormula(ref);
  }

  function insertTextIntoFormula(text) {
    const start = formulaInput.selectionStart || 0;
    const end = formulaInput.selectionEnd || 0;
    const before = formulaInput.value.slice(0, start);
    const after = formulaInput.value.slice(end);
    formulaInput.value = before + text + after;
    const pos = start + text.length;
    formulaInput.selectionStart = formulaInput.selectionEnd = pos;
    formulaInput.focus();
    // Also begin tracking drag for range
    state.formulaDragStart = refFromText(text) || null;
  }

  function refFromText(t) {
    // Return upper-case ref if text is a single cell ref
    if (/^[A-Za-z]+\d+$/.test(t)) return t.toUpperCase();
    return null;
  }

  // ===== Cell edit mode =====
  function startCellEdit(ref) {
    if (state.editingCell) return;
    const cellEl = cellsContent.querySelector(`.cell[data-ref="${ref}"]`);
    if (!cellEl) return;
    state.editingCell = { ref, originalValue: getCellValue(ref) };
    cellEl.classList.add('input-mode');
    const cell = getCellRaw(ref);
    const val = cell && cell.formula ? cell.formula : (cell ? String(cell.value) : '');
    cellEl.innerHTML = `<input type="text" value="${val.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;')}" autocomplete="off" spellcheck="false">`;
    const input = cellEl.querySelector('input');
    input.focus();
    input.setSelectionRange(val.length, val.length);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        commitCellEdit(input.value, e.shiftKey ? 'up' : 'down');
      } else if (e.key === 'Tab') {
        e.preventDefault();
        commitCellEdit(input.value, e.shiftKey ? 'left' : 'right');
      } else if (e.key === 'Escape') {
        cancelCellEdit();
      }
    });
    input.addEventListener('blur', () => {
      if (state.editingCell) commitCellEdit(input.value, null);
    });
  }

  function commitCellEdit(val, moveDir) {
    if (!state.editingCell) return;
    const ref = state.editingCell.ref;
    if (val === '') clearCell(ref);
    else setCellValue(ref, val);
    state.editingCell = null;
    renderCells();
    // Move selection
    if (moveDir) {
      const p = refToParts(ref);
      let nc = p.col, nr = p.row;
      if (moveDir === 'down') nr = Math.min(NUM_ROWS, nr + 1);
      else if (moveDir === 'up') nr = Math.max(1, nr - 1);
      else if (moveDir === 'right') nc = Math.min(NUM_COLS, nc + 1);
      else if (moveDir === 'left') nc = Math.max(1, nc - 1);
      const newRef = numToCol(nc) + nr;
      setSelection(newRef, newRef, newRef);
      scrollToCell(newRef);
    }
    syncHeaderScroll();
  }

  function cancelCellEdit() {
    if (!state.editingCell) return;
    state.editingCell = null;
    renderCells();
  }

  // ============================================================
  // KEYBOARD NAVIGATION
  // ============================================================
  document.addEventListener('keydown', (e) => {
    // While editing formula bar, allow arrow keys etc to work normally
    if (document.activeElement === formulaInput && state.editingFormula) {
      // Allow Esc to exit formula mode
      if (e.key === 'Escape') {
        formulaInput.blur();
        state.editingFormula = false;
        e.preventDefault();
      } else if (e.key === 'Enter') {
        commitFormulaBar();
        formulaInput.blur();
        state.editingFormula = false;
        // Move selection down
        const p = refToParts(sheet().activeCell);
        const newRef = numToCol(p.col) + Math.min(NUM_ROWS, p.row + 1);
        setSelection(newRef, newRef, newRef);
        scrollToCell(newRef);
        e.preventDefault();
      } else if (e.key === 'Tab') {
        e.preventDefault();
        commitFormulaBar();
        formulaInput.blur();
        state.editingFormula = false;
        const p = refToParts(sheet().activeCell);
        const newRef = numToCol(Math.min(NUM_COLS, p.col + 1)) + p.row;
        setSelection(newRef, newRef, newRef);
        scrollToCell(newRef);
      }
      return;
    }

    // While cell input is active, ignore document keydowns
    if (state.editingCell) return;

    // While focused on formula input but not in formula mode (showing value)
    if (document.activeElement === formulaInput) {
      return;
    }

    const p = refToParts(sheet().activeCell);
    if (!p) return;

    let handled = true;
    if (e.key === 'ArrowDown') {
      const nr = Math.min(NUM_ROWS, p.row + 1);
      setSelection(numToCol(p.col) + nr, numToCol(p.col) + nr, numToCol(p.col) + nr);
      scrollToCell(numToCol(p.col) + nr);
    } else if (e.key === 'ArrowUp') {
      const nr = Math.max(1, p.row - 1);
      setSelection(numToCol(p.col) + nr, numToCol(p.col) + nr, numToCol(p.col) + nr);
      scrollToCell(numToCol(p.col) + nr);
    } else if (e.key === 'ArrowRight') {
      const nc = Math.min(NUM_COLS, p.col + 1);
      setSelection(numToCol(nc) + p.row, numToCol(nc) + p.row, numToCol(nc) + p.row);
      scrollToCell(numToCol(nc) + p.row);
    } else if (e.key === 'ArrowLeft') {
      const nc = Math.max(1, p.col - 1);
      setSelection(numToCol(nc) + p.row, numToCol(nc) + p.row, numToCol(nc) + p.row);
      scrollToCell(numToCol(nc) + p.row);
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const nc = p.col + (e.shiftKey ? -1 : 1);
      const cc = Math.max(1, Math.min(NUM_COLS, nc));
      const newRef = numToCol(cc) + p.row;
      setSelection(newRef, newRef, newRef);
      scrollToCell(newRef);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const nr = p.row + (e.shiftKey ? -1 : 1);
      const rr = Math.max(1, Math.min(NUM_ROWS, nr));
      const newRef = numToCol(p.col) + rr;
      setSelection(newRef, newRef, newRef);
      scrollToCell(newRef);
    } else if (e.key === 'F2' || e.key === 'Enter' && !e.metaKey && !e.ctrlKey) {
      // ignore — handled above
    } else if (e.key === 'Delete' || e.key === 'Backspace') {
      e.preventDefault();
      // Clear all cells in selection range
      clearSelection();
    } else if (e.key === 'F2') {
      e.preventDefault();
      startCellEdit(sheet().activeCell);
    } else if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      // Start typing directly into cell
      e.preventDefault();
      startCellEdit(sheet().activeCell);
      const cellEl = cellsContent.querySelector(`.cell[data-ref="${sheet().activeCell}"] input`);
      if (cellEl) {
        cellEl.value = e.key;
        cellEl.setSelectionRange(1, 1);
      }
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
      e.preventDefault();
      toggleBold();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'i') {
      e.preventDefault();
      toggleItalic();
    } else {
      handled = false;
    }
    if (handled) e.preventDefault();
  });

  function clearSelection() {
    const startP = refToParts(sheet().selectionStart);
    const endP = refToParts(sheet().selectionEnd);
    if (!startP || !endP) return;
    const cStart = Math.min(startP.col, endP.col);
    const cEnd = Math.max(startP.col, endP.col);
    const rStart = Math.min(startP.row, endP.row);
    const rEnd = Math.max(startP.row, endP.row);
    for (let r = rStart; r <= rEnd; r++) {
      for (let c = cStart; c <= cEnd; c++) {
        clearCell(numToCol(c) + r);
      }
    }
    renderCells();
    updateFormulaBar();
  }

  // ============================================================
  // FORMULA BAR EVENTS
  // ============================================================
  formulaInput.addEventListener('focus', () => {
    if (formulaInput.value.startsWith('=')) state.editingFormula = true;
  });
  formulaInput.addEventListener('input', () => {
    if (formulaInput.value.startsWith('=')) state.editingFormula = true;
    else state.editingFormula = false;
  });
  formulaInput.addEventListener('blur', () => {
    if (state.editingCell) return;
    commitFormulaBar();
    state.editingFormula = false;
  });
  formulaInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commitFormulaBar();
      formulaInput.blur();
      // Move down
      const p = refToParts(sheet().activeCell);
      const nr = Math.min(NUM_ROWS, p.row + 1);
      const newRef = numToCol(p.col) + nr;
      setSelection(newRef, newRef, newRef);
      scrollToCell(newRef);
    } else if (e.key === 'Escape') {
      formulaInput.blur();
      state.editingFormula = false;
    }
  });

  // ============================================================
  // SCROLL LISTENERS
  // ============================================================
  cellsScroll.addEventListener('scroll', () => {
    syncHeaderScroll();
    renderCells();
  });
  window.addEventListener('resize', () => {
    renderColHeaders();
    renderCells();
    syncHeaderScroll();
  });

  // ============================================================
  // COLUMN RESIZE
  // ============================================================
  colHeaders.addEventListener('mousedown', (e) => {
    if (!e.target.classList.contains('col-resize')) return;
    e.preventDefault();
    e.stopPropagation();
    const col = e.target.dataset.col;
    state.colResizeDrag = { col, startX: e.clientX, startWidth: getColWidth(col) };
    document.body.style.cursor = 'col-resize';
  });
  document.addEventListener('mousemove', (e) => {
    if (!state.colResizeDrag) return;
    const dx = e.clientX - state.colResizeDrag.startX;
    setColWidth(state.colResizeDrag.col, state.colResizeDrag.startWidth + dx);
    renderColHeaders();
    renderCells();
    syncHeaderScroll();
  });
  document.addEventListener('mouseup', () => {
    if (state.colResizeDrag) {
      state.colResizeDrag = null;
      document.body.style.cursor = '';
    }
  });

  // ============================================================
  // TOOLBAR ACTIONS
  // ============================================================
  function applyStyleToSelection(prop, value) {
    const startP = refToParts(sheet().selectionStart);
    const endP = refToParts(sheet().selectionEnd);
    if (!startP || !endP) return;
    const cStart = Math.min(startP.col, endP.col);
    const cEnd = Math.max(startP.col, endP.col);
    const rStart = Math.min(startP.row, endP.row);
    const rEnd = Math.max(startP.row, endP.row);
    for (let r = rStart; r <= rEnd; r++) {
      for (let c = cStart; c <= cEnd; c++) {
        const ref = numToCol(c) + r;
        const cell = ensureCell(ref);
        cell.style[prop] = value;
      }
    }
    renderCells();
    updateToolbarState();
  }

  function toggleBold() {
    const ref = sheet().activeCell;
    const cell = getCellRaw(ref);
    const current = cell && cell.style && cell.style.bold;
    applyStyleToSelection('bold', !current);
  }
  function toggleItalic() {
    const ref = sheet().activeCell;
    const cell = getCellRaw(ref);
    const current = cell && cell.style && cell.style.italic;
    applyStyleToSelection('italic', !current);
  }
  function setAlign(align) {
    applyStyleToSelection('align', align);
  }
  function setBgColor(color) {
    state.bgColor = color;
    document.getElementById('bgSwatch').style.background = color;
    applyStyleToSelection('bg', color);
  }
  function setFgColor(color) {
    state.fgColor = color;
    document.getElementById('fgSwatch').style.background = color;
    applyStyleToSelection('fg', color);
  }

  function updateToolbarState() {
    const ref = sheet().activeCell;
    const cell = getCellRaw(ref);
    const style = cell && cell.style ? cell.style : {};
    document.getElementById('btnBold').classList.toggle('active', !!style.bold);
    document.getElementById('btnItalic').classList.toggle('active', !!style.italic);
    document.getElementById('btnAlignLeft').classList.toggle('active', style.align === undefined || style.align === 'left');
    document.getElementById('btnAlignCenter').classList.toggle('active', style.align === 'center');
    document.getElementById('btnAlignRight').classList.toggle('active', style.align === 'right');
  }

  document.getElementById('btnBold').addEventListener('click', toggleBold);
  document.getElementById('btnItalic').addEventListener('click', toggleItalic);
  document.getElementById('btnAlignLeft').addEventListener('click', () => setAlign('left'));
  document.getElementById('btnAlignCenter').addEventListener('click', () => setAlign('center'));
  document.getElementById('btnAlignRight').addEventListener('click', () => setAlign('right'));
  document.getElementById('btnClear').addEventListener('click', clearSelection);
  document.getElementById('bgColorPicker').addEventListener('input', (e) => setBgColor(e.target.value));
  document.getElementById('fgColorPicker').addEventListener('input', (e) => setFgColor(e.target.value));

  // ============================================================
  // CSV IMPORT / EXPORT
  // ============================================================
  function parseCSV(text) {
    const rows = [];
    let cur = [];
    let field = '';
    let inQuote = false;
    let i = 0;
    while (i < text.length) {
      const c = text[i];
      if (inQuote) {
        if (c === '"' && text[i + 1] === '"') { field += '"'; i += 2; continue; }
        if (c === '"') { inQuote = false; i++; continue; }
        field += c; i++;
      } else {
        if (c === '"') { inQuote = true; i++; continue; }
        if (c === ',') { cur.push(field); field = ''; i++; continue; }
        if (c === '\r') { i++; continue; }
        if (c === '\n') {
          cur.push(field); field = '';
          if (cur.length > 1 || cur[0] !== '') rows.push(cur);
          cur = [];
          i++;
          continue;
        }
        field += c; i++;
      }
    }
    if (field !== '' || cur.length > 0) {
      cur.push(field);
      rows.push(cur);
    }
    return rows;
  }

  function toCSV() {
    const s = sheet();
    let maxR = 0, maxC = 0;
    for (const ref in s.cells) {
      const p = refToParts(ref);
      if (p.row > maxR) maxR = p.row;
      if (p.col > maxC) maxC = p.col;
    }
    if (maxR === 0 || maxC === 0) return '';
    const rows = [];
    for (let r = 1; r <= maxR; r++) {
      const row = [];
      for (let c = 1; c <= maxC; c++) {
        const ref = numToCol(c) + r;
        const cell = s.cells[ref];
        let val = '';
        if (cell) {
          val = cell.display === undefined || cell.display === null ? '' : String(cell.display);
          if (cell.formula) val = cell.value; // export formula string for round-trip
        }
        if (val.includes(',') || val.includes('"') || val.includes('\n') || val.includes('\r')) {
          val = '"' + val.replace(/"/g, '""') + '"';
        }
        row.push(val);
      }
      rows.push(row.join(','));
    }
    return rows.join('\n');
  }

  function downloadCSV() {
    const csv = toCSV();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = sheet().name + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Downloaded ' + sheet().name + '.csv');
  }

  function uploadCSV(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      const text = e.target.result;
      const rows = parseCSV(text);
      // Replace current sheet contents
      sheet().cells = {};
      for (let r = 0; r < rows.length; r++) {
        for (let c = 0; c < rows[r].length; c++) {
          const ref = numToCol(c + 1) + (r + 1);
          const v = rows[r][c];
          if (v !== '') setCellValue(ref, v);
        }
      }
      renderCells();
      updateFormulaBar();
      showToast('CSV imported: ' + rows.length + ' rows');
    };
    reader.readAsText(file);
  }

  document.getElementById('btnDownload').addEventListener('click', downloadCSV);
  document.getElementById('btnUpload').addEventListener('click', () => {
    document.getElementById('csvFileInput').click();
  });
  document.getElementById('csvFileInput').addEventListener('change', (e) => {
    if (e.target.files && e.target.files[0]) {
      uploadCSV(e.target.files[0]);
      e.target.value = '';
    }
  });
  document.getElementById('btnNew').addEventListener('click', () => {
    if (confirm('Create a new spreadsheet? Current data will be replaced.')) {
      state.sheets = [makeSheet('Sheet1')];
      state.activeSheetIdx = 0;
      renderSheetTabs();
      renderColHeaders();
      renderCells();
      updateFormulaBar();
      syncHeaderScroll();
      showToast('New spreadsheet created');
    }
  });

  // ============================================================
  // SHEET TABS
  // ============================================================
  const tabsContainer = document.getElementById('tabsContainer');

  function renderSheetTabs() {
    tabsContainer.innerHTML = '';
    state.sheets.forEach((s, idx) => {
      const tab = document.createElement('div');
      tab.className = 'sheet-tab' + (idx === state.activeSheetIdx ? ' active' : '');
      tab.dataset.idx = idx;
      tab.textContent = s.name;
      tab.title = s.name + ' (right-click for options)';
      tab.addEventListener('click', (e) => {
        if (e.button === 2) return; // right click handled separately
        switchToSheet(idx);
      });
      tab.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showSheetContextMenu(e.clientX, e.clientY, idx);
      });
      tab.addEventListener('dblclick', (e) => {
        e.preventDefault();
        startRenameSheet(idx);
      });
      tabsContainer.appendChild(tab);
    });
  }

  function switchToSheet(idx) {
    if (idx === state.activeSheetIdx) return;
    state.activeSheetIdx = idx;
    renderSheetTabs();
    renderColHeaders();
    renderCells();
    updateFormulaBar();
    syncHeaderScroll();
  }

  function addSheet() {
    const used = new Set(state.sheets.map(s => s.name));
    let i = state.sheets.length + 1;
    let name = 'Sheet' + i;
    while (used.has(name)) { i++; name = 'Sheet' + i; }
    state.sheets.push(makeSheet(name));
    state.activeSheetIdx = state.sheets.length - 1;
    renderSheetTabs();
    renderColHeaders();
    renderCells();
    updateFormulaBar();
    syncHeaderScroll();
    showToast('Added ' + name);
  }

  function deleteSheet(idx) {
    if (state.sheets.length <= 1) {
      showToast('Cannot delete the only sheet');
      return;
    }
    if (!confirm('Delete sheet "' + state.sheets[idx].name + '"?')) return;
    state.sheets.splice(idx, 1);
    state.activeSheetIdx = Math.max(0, state.activeSheetIdx - (idx <= state.activeSheetIdx ? 1 : 0));
    state.activeSheetIdx = Math.min(state.activeSheetIdx, state.sheets.length - 1);
    renderSheetTabs();
    renderColHeaders();
    renderCells();
    updateFormulaBar();
    syncHeaderScroll();
  }

  function startRenameSheet(idx) {
    const tab = tabsContainer.children[idx];
    if (!tab) return;
    const origName = state.sheets[idx].name;
    tab.innerHTML = `<input type="text" value="${origName}" style="width:100px;font-size:12px;border:1px solid #1a73e8;padding:2px;border-radius:2px;outline:none">`;
    const inp = tab.querySelector('input');
    inp.focus();
    inp.select();
    const finish = (commit) => {
      if (commit) {
        const newName = inp.value.trim();
        if (newName && newName !== origName) {
          state.sheets[idx].name = newName;
        }
      }
      renderSheetTabs();
    };
    inp.addEventListener('blur', () => finish(true));
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
  }

  document.getElementById('addSheetBtn').addEventListener('click', addSheet);

  // ============================================================
  // CONTEXT MENU (sheet tabs)
  // ============================================================
  let activeMenu = null;
  function showSheetContextMenu(x, y, sheetIdx) {
    hideContextMenu();
    const menu = document.createElement('div');
    menu.className = 'context-menu';
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';

    const items = [
      { label: 'Rename', action: () => startRenameSheet(sheetIdx) },
      { label: 'Delete', action: () => deleteSheet(sheetIdx), disabled: state.sheets.length <= 1 },
      { label: 'Insert new', action: () => {
          state.sheets.splice(sheetIdx, 0, makeSheet('Sheet' + (state.sheets.length + 1)));
          renderSheetTabs();
          switchToSheet(sheetIdx);
        }
      },
      { label: 'Move left', action: () => {
          if (sheetIdx === 0) return;
          [state.sheets[sheetIdx - 1], state.sheets[sheetIdx]] = [state.sheets[sheetIdx], state.sheets[sheetIdx - 1]];
          renderSheetTabs();
        }, disabled: sheetIdx === 0 },
      { label: 'Move right', action: () => {
          if (sheetIdx >= state.sheets.length - 1) return;
          [state.sheets[sheetIdx + 1], state.sheets[sheetIdx]] = [state.sheets[sheetIdx], state.sheets[sheetIdx + 1]];
          renderSheetTabs();
        }, disabled: sheetIdx >= state.sheets.length - 1 }
    ];

    for (const it of items) {
      const div = document.createElement('div');
      div.className = 'context-menu-item' + (it.disabled ? ' disabled' : '');
      div.textContent = it.label;
      div.addEventListener('click', () => {
        if (!it.disabled) it.action();
        hideContextMenu();
      });
      menu.appendChild(div);
    }
    document.body.appendChild(menu);
    activeMenu = menu;
  }
  function hideContextMenu() {
    if (activeMenu) { activeMenu.remove(); activeMenu = null; }
  }
  document.addEventListener('click', hideContextMenu);
  document.addEventListener('contextmenu', (e) => {
    if (!e.target.classList.contains('sheet-tab')) hideContextMenu();
  });

  // ============================================================
  // TOAST
  // ============================================================
  let toastTimer = null;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    // Set initial col widths for A,B
    setColWidth('A', 100);

    // Seed with sample data to demonstrate features
    setCellValue('A1', 'Item');
    setCellValue('B1', 'Q1');
    setCellValue('C1', 'Q2');
    setCellValue('D1', 'Q3');
    setCellValue('E1', 'Q4');
    setCellValue('F1', 'Total');
    [['Apples', 120, 150, 130, 140], ['Oranges', 80, 95, 110, 100], ['Bananas', 60, 70, 65, 75], ['Grapes', 45, 50, 55, 60]].forEach((row, i) => {
      const r = i + 2;
      setCellValue('A' + r, row[0]);
      setCellValue('B' + r, row[1]);
      setCellValue('C' + r, row[2]);
      setCellValue('D' + r, row[3]);
      setCellValue('E' + r, row[4]);
      setCellValue('F' + r, '=SUM(B' + r + ':E' + r + ')');
    });
    setCellValue('A7', 'Total');
    setCellValue('B7', '=SUM(B2:B5)');
    setCellValue('C7', '=SUM(C2:C5)');
    setCellValue('D7', '=SUM(D2:D5)');
    setCellValue('E7', '=SUM(E2:E5)');
    setCellValue('F7', '=SUM(F2:F5)');
    setCellValue('A8', 'Average');
    setCellValue('B8', '=AVERAGE(B2:E5)');
    setCellValue('F8', '=AVERAGE(F2:F5)');

    // Style header row
    for (const col of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const cell = ensureCell(col + '1');
      cell.style.bold = true;
      cell.style.bg = '#e8eaed';
      cell.style.align = 'center';
    }

    // Style totals
    for (const col of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const cell = ensureCell(col + '7');
      if (!cell.style) cell.style = {};
      cell.style.bold = true;
      cell.style.bg = '#fff3cd';
    }
    for (const col of ['A', 'B', 'C', 'D', 'E', 'F']) {
      const cell = ensureCell(col + '8');
      if (!cell.style) cell.style = {};
      cell.style.italic = true;
      cell.style.fg = '#5f6368';
    }

    fullRecalculate();

    renderColHeaders();
    renderCells();
    renderSheetTabs();
    updateFormulaBar();
    updateToolbarState();
    syncHeaderScroll();
  }

  init();
})();
</script>
</body>
</html>
