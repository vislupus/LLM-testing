<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sheets — Workbook</title>
  <style>
    :root {
      --accent: #107c41;
      --accent-2: #0e6b38;
      --accent-soft: #e8f5ee;
      --accent-sel: rgba(16, 124, 65, 0.14);
      --header-bg: #f3f3f3;
      --header-hi: #c9e6d4;
      --line: #d4d4d4;
      --line-soft: #e8e8e8;
      --text: #242424;
      --muted: #616161;
      --danger: #c50f1f;
      --app: #f3f2f1;
      --white: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
      --cell-h: 22px;
      --rowhead-w: 46px;
      --font-ui: "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-cell: Calibri, Carlito, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-ui);
      color: var(--text);
      background: var(--app);
      overflow: hidden;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      min-width: 640px;
    }

    /* Title */
    #titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 4px;
      background: linear-gradient(180deg, #217346 0%, #1a5c37 100%);
      color: #fff;
      user-select: none;
    }
    .logo-mark {
      width: 22px; height: 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 2px;
      flex-shrink: 0;
    }
    .logo-mark i { background: #fff; border-radius: 1px; }
    .logo-mark i:nth-child(1) { opacity: .95; }
    .logo-mark i:nth-child(2) { opacity: .7; }
    .logo-mark i:nth-child(3) { opacity: .7; }
    .logo-mark i:nth-child(4) { opacity: .5; }
    .brand { font-weight: 600; font-size: 13px; letter-spacing: .2px; opacity: .9; }
    #doc-name {
      background: transparent;
      border: 1px solid transparent;
      color: #fff;
      font: 600 14px/1.2 var(--font-ui);
      padding: 3px 8px;
      border-radius: 3px;
      min-width: 80px;
      max-width: 360px;
    }
    #doc-name:hover { border-color: rgba(255,255,255,.35); }
    #doc-name:focus { outline: none; background: rgba(0,0,0,.15); border-color: #fff; }

    /* Toolbar */
    #toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      padding: 6px 10px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
      z-index: 20;
    }
    .tb-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 6px;
      border-right: 1px solid var(--line-soft);
    }
    .tb-group:last-child { border-right: none; }
    .tb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 28px;
      min-width: 28px;
      padding: 0 8px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 3px;
      color: var(--text);
      font: 12px var(--font-ui);
      cursor: pointer;
    }
    .tb-btn:hover { background: #f3f3f3; border-color: #e5e5e5; }
    .tb-btn:active, .tb-btn.on { background: var(--accent-soft); border-color: #b7dcc6; color: var(--accent-2); }
    .tb-btn svg { display: block; }
    .tb-btn.danger:hover { background: #fde7e9; border-color: #f1b3b8; color: var(--danger); }
    .swatch-wrap { position: relative; display: inline-flex; }
    .swatch-wrap input[type="color"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
      pointer-events: none;
    }
    .fill-ico { position: relative; }
    .fill-ico .bar {
      position: absolute;
      left: 2px; right: 2px; bottom: 0;
      height: 4px;
      background: var(--swatch, #ffeb3b);
      border-radius: 1px;
    }

    /* Formula bar */
    #formulabar {
      display: flex;
      align-items: stretch;
      height: 28px;
      background: var(--white);
      border-bottom: 1px solid var(--line);
      z-index: 15;
    }
    #name-box {
      width: 96px;
      border: none;
      border-right: 1px solid var(--line);
      text-align: center;
      font: 12px var(--font-ui);
      color: var(--text);
      background: var(--white);
    }
    #name-box:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
    .fx {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      border-right: 1px solid var(--line-soft);
      color: var(--muted);
      user-select: none;
    }
    .fx-btns { display: flex; align-items: center; }
    .fx-btns button {
      width: 24px; height: 24px;
      border: none; background: transparent;
      cursor: pointer;
      border-radius: 3px;
      color: var(--muted);
      display: flex; align-items: center; justify-content: center;
    }
    .fx-btns button:hover { background: #f3f3f3; }
    .fx-btns .ok:hover { color: var(--accent); }
    .fx-btns .cancel:hover { color: var(--danger); }
    #formula-input {
      flex: 1;
      border: none;
      padding: 0 10px;
      font: 13px/28px var(--font-cell);
      outline: none;
      background: transparent;
      min-width: 0;
    }
    .fx-label {
      font: italic 14px Georgia, serif;
      color: #6b6b6b;
      font-weight: 700;
    }

    /* Grid */
    #main { flex: 1; min-height: 0; position: relative; background: #fff; }
    #grid-container {
      position: absolute;
      inset: 0;
      overflow: auto;
      user-select: none;
    }
    #grid-inner { position: relative; display: inline-block; min-width: 100%; }
    #sheet {
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      font-family: var(--font-cell);
      font-size: 13px;
    }
    #sheet col.rh { width: var(--rowhead-w); }
    #sheet th, #sheet td {
      height: var(--cell-h);
      border-right: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      padding: 0 4px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
      vertical-align: middle;
    }
    #sheet thead th {
      position: sticky;
      top: 0;
      z-index: 4;
      background: var(--header-bg);
      font: 600 11px var(--font-ui);
      color: var(--muted);
      text-align: center;
      height: 22px;
      border-bottom: 1px solid #bdbdbd;
    }
    #sheet thead th.hi { background: var(--header-hi); color: var(--accent-2); }
    #sheet th.rowh {
      position: sticky;
      left: 0;
      z-index: 3;
      background: var(--header-bg);
      font: 600 11px var(--font-ui);
      color: var(--muted);
      text-align: center;
      width: var(--rowhead-w);
      min-width: var(--rowhead-w);
      border-right: 1px solid #bdbdbd;
    }
    #sheet th.rowh.hi { background: var(--header-hi); color: var(--accent-2); }
    #sheet th.corner {
      position: sticky;
      top: 0; left: 0;
      z-index: 6;
      background: var(--header-bg);
      cursor: pointer;
    }
    #sheet th.corner::after {
      content: "";
      position: absolute;
      right: 5px; bottom: 4px;
      border: 5px solid transparent;
      border-right-color: #9a9a9a;
      border-bottom-color: #9a9a9a;
    }
    #sheet td {
      background: #fff;
      cursor: cell;
      position: relative;
    }
    #sheet td.rng {
      background-image: linear-gradient(var(--accent-sel), var(--accent-sel));
    }
    #sheet td.err { color: var(--danger) !important; font-weight: 600; text-align: center; }
    #sheet thead th { position: sticky; }
    .col-resizer {
      position: absolute;
      top: 0; right: -3px;
      width: 6px; height: 100%;
      cursor: col-resize;
      z-index: 5;
    }
    #sheet thead th { position: sticky; overflow: visible; }

    #sel-box {
      position: absolute;
      border: 2px solid var(--accent);
      pointer-events: none;
      z-index: 8;
      box-sizing: border-box;
    }
    #sel-box.point {
      border-style: dashed;
      border-color: #1a73c7;
    }
    #cell-editor {
      position: absolute;
      z-index: 10;
      display: none;
      border: 2px solid var(--accent);
      padding: 0 4px;
      margin: 0;
      font: 13px var(--font-cell);
      outline: none;
      background: #fff;
      height: var(--cell-h);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }

    /* Bottom */
    #bottom {
      display: flex;
      align-items: stretch;
      height: 30px;
      background: #f3f2f1;
      border-top: 1px solid var(--line);
      z-index: 20;
    }
    #sheet-bar {
      display: flex;
      align-items: stretch;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .sheet-nav {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 4px;
      color: var(--muted);
    }
    .sheet-nav button {
      border: none; background: transparent;
      width: 22px; height: 22px;
      cursor: pointer;
      border-radius: 3px;
      color: var(--muted);
    }
    .sheet-nav button:hover { background: #e5e5e5; }
    #sheet-tabs {
      display: flex;
      align-items: stretch;
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      min-width: 0;
    }
    #sheet-tabs::-webkit-scrollbar { height: 0; }
    .stab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 14px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      border-right: 1px solid var(--line);
      white-space: nowrap;
      background: transparent;
      user-select: none;
    }
    .stab:hover { background: #eaeaea; }
    .stab.active {
      background: #fff;
      color: var(--accent);
      font-weight: 600;
      border-bottom: 2px solid var(--accent);
    }
    .stab .x {
      display: none;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      padding: 0 2px;
      border-radius: 2px;
      line-height: 1;
    }
    .stab:hover .x, .stab.active .x { display: inline; }
    .stab .x:hover { color: var(--danger); background: #fde7e9; }
    .stab input {
      width: 90px;
      font: 12px var(--font-ui);
      border: 1px solid var(--accent);
      padding: 1px 4px;
    }
    #add-sheet {
      border: none;
      background: transparent;
      width: 28px;
      font-size: 18px;
      cursor: pointer;
      color: var(--muted);
      flex-shrink: 0;
    }
    #add-sheet:hover { color: var(--accent); background: #e8f5ee; }
    #statusbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 12px;
      font-size: 11px;
      color: var(--muted);
      border-left: 1px solid var(--line);
      min-width: 220px;
      justify-content: flex-end;
      background: #fff;
    }
    #statusbar b { color: var(--text); font-weight: 600; }

    .ctx {
      position: fixed;
      z-index: 100;
      background: #fff;
      border: 1px solid #e1e1e1;
      box-shadow: 0 4px 16px rgba(0,0,0,.14);
      padding: 4px 0;
      min-width: 140px;
      display: none;
    }
    .ctx button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      padding: 6px 14px;
      font: 12px var(--font-ui);
      cursor: pointer;
    }
    .ctx button:hover { background: var(--accent-soft); }

    #toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: #323130;
      color: #fff;
      padding: 8px 14px;
      border-radius: 4px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 200;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 800px) {
      #name-box { width: 70px; }
      #statusbar { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="titlebar">
      <div class="logo-mark"><i></i><i></i><i></i><i></i></div>
      <span class="brand">Sheets</span>
      <input id="doc-name" value="Workbook 1" spellcheck="false" />
    </div>
    <div id="toolbar">
      <div class="tb-group">
        <button class="tb-btn" id="btn-bold" title="Bold (Ctrl+B)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2.2 1.2h4.1c1.7 0 2.8.9 2.8 2.2 0 1-.6 1.7-1.5 2 .12.2 2.1 1.1 2.1 2.5 0 1.6-1.3 2.6-3.2 2.6H2.2V1.2zm1.8 3.8h2c.8 0 1.2-.4 1.2-1s-.4-1-1.2-1h-2v2zm0 4.3h2.3c.9 0 1.4-.4 1.4-1.1s-.5-1.1-1.4-1.1H4V9.3z" fill="currentColor"/></svg></button>
        <button class="tb-btn" id="btn-italic" title="Italic (Ctrl+I)"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M5 1.2h5.2v1.6H8.4l-2.2 6.4h1.8v1.6H2.8V9.2h1.8L6.8 2.8H5V1.2z" fill="currentColor"/></svg></button>
        <span class="swatch-wrap" title="Fill color">
          <button class="tb-btn" id="btn-fill">
            <span class="fill-ico">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 10.2l4.4-4.4 3.2 3.2-4.4 4.4c-.4.4-1 .4-1.4 0L2 11.6c-.4-.4-.4-1 0-1.4zM10.2 2.2c.6-.6 1.5-.6 2.1 0 .6.6.6 1.5 0 2.1l-1.5 1.5-2.1-2.1 1.5-1.5z" fill="currentColor"/></svg>
              <span class="bar" id="fill-bar"></span>
            </span>
          </button>
          <input type="color" id="fill-color" value="#fff2cc" />
        </span>
      </div>
      <div class="tb-group">
        <button class="tb-btn danger" id="btn-clear" title="Clear contents (Delete)">Clear</button>
      </div>
      <div class="tb-group">
        <button class="tb-btn" id="btn-download" title="Download active sheet as CSV">
          <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 1.2v7.2M3.6 5.8L6.5 9l2.9-3.2M2 11.5h9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
          Download CSV
        </button>
        <button class="tb-btn" id="btn-upload" title="Upload CSV into active sheet">
          <svg width="13" height="13" viewBox="0 0 13 13"><path d="M6.5 9.2V2M3.6 4.6L6.5 1.4l2.9 3.2M2 11.5h9" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
          Upload CSV
        </button>
        <input type="file" id="file-csv" accept=".csv,text/csv,text/plain" hidden />
      </div>
    </div>
    <div id="formulabar">
      <input id="name-box" spellcheck="false" title="Name box" />
      <div class="fx">
        <div class="fx-btns">
          <button class="cancel" id="btn-fx-cancel" title="Cancel (Esc)">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="#c50f1f" stroke-width="1.6" fill="none"/></svg>
          </button>
          <button class="ok" id="btn-fx-ok" title="Confirm (Enter)">
            <svg width="11" height="10" viewBox="0 0 11 10"><path d="M1.2 5.2l2.8 2.8 5.8-6" stroke="#107c41" stroke-width="1.6" fill="none"/></svg>
          </button>
        </div>
        <span class="fx-label">fx</span>
      </div>
      <input id="formula-input" spellcheck="false" autocomplete="off" />
    </div>
    <div id="main">
      <div id="grid-container">
        <div id="grid-inner">
          <table id="sheet"></table>
          <div id="sel-box"></div>
          <input id="cell-editor" spellcheck="false" autocomplete="off" />
        </div>
      </div>
    </div>
    <div id="bottom">
      <div id="sheet-bar">
        <div class="sheet-nav">
          <button id="tab-prev" title="Previous sheet">‹</button>
          <button id="tab-next" title="Next sheet">›</button>
        </div>
        <div id="sheet-tabs"></div>
        <button id="add-sheet" title="Add sheet">+</button>
      </div>
      <div id="statusbar">
        <span>Ready</span>
        <span id="stats"></span>
      </div>
    </div>
  </div>
  <div class="ctx" id="sheet-ctx">
    <button data-act="rename">Rename</button>
    <button data-act="delete">Delete</button>
  </div>
  <div id="toast"></div>

  <script>
  (function () {
    const COLS = 26;
    const ROWS = 100;
    const DEFAULT_W = 88;

    /* ---------- addressing ---------- */
    function colLetter(n) {
      let s = "";
      n += 1;
      while (n > 0) {
        n--;
        s = String.fromCharCode(65 + (n % 26)) + s;
        n = Math.floor(n / 26);
      }
      return s;
    }
    function parseCol(letters) {
      let n = 0;
      for (const c of letters.toUpperCase()) n = n * 26 + (c.charCodeAt(0) - 64);
      return n - 1;
    }
    function parseAddr(addr) {
      if (!addr) return null;
      const m = String(addr).toUpperCase().trim().match(/^([A-Z]+)(\d+)$/);
      if (!m) return null;
      const col = parseCol(m[1]);
      const row = parseInt(m[2], 10) - 1;
      if (col < 0 || col >= COLS || row < 0 || row >= ROWS) return null;
      return { col, row };
    }
    function makeAddr(col, row) { return colLetter(col) + (row + 1); }
    function inBounds(c, r) { return c >= 0 && c < COLS && r >= 0 && r < ROWS; }
    function expandRange(a, b) {
      const p1 = parseAddr(a), p2 = parseAddr(b);
      if (!p1 || !p2) return [];
      const c1 = Math.min(p1.col, p2.col), c2 = Math.max(p1.col, p2.col);
      const r1 = Math.min(p1.row, p2.row), r2 = Math.max(p1.row, p2.row);
      const out = [];
      for (let r = r1; r <= r2; r++)
        for (let c = c1; c <= c2; c++) out.push(makeAddr(c, r));
      return out;
    }
    function rangeStr(a, b) {
      const p1 = parseAddr(a), p2 = parseAddr(b);
      if (!p1 || !p2) return a;
      const c1 = Math.min(p1.col, p2.col), c2 = Math.max(p1.col, p2.col);
      const r1 = Math.min(p1.row, p2.row), r2 = Math.max(p1.row, p2.row);
      const s = makeAddr(c1, r1);
      const e = makeAddr(c2, r2);
      return s === e ? s : s + ":" + e;
    }
    function parseNumber(s) {
      if (typeof s === "number") return s;
      if (typeof s !== "string") return null;
      const t = s.trim();
      if (t === "") return null;
      if (!/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?$/.test(t)) return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : null;
    }
    function formatNum(n) {
      if (!Number.isFinite(n)) return "#NUM!";
      if (Object.is(n, -0)) n = 0;
      if (Number.isInteger(n) && Math.abs(n) < 1e15) return String(n);
      const s = parseFloat(n.toPrecision(12));
      return String(s);
    }

    /* ---------- state ---------- */
    function emptySheet(name) {
      return { name, cells: Object.create(null), colWidths: {} };
    }
    const state = {
      sheets: [emptySheet("Sheet1")],
      active: 0,
      activeCell: "A1",
      selA: "A1",
      selB: "A1",
      editing: false,
      editSource: null,
      editOrig: "",
      insertTok: null,
      selecting: false,
      selectMode: "select",
      resizing: null,
      clipboard: null,
      undo: [],
      redo: [],
      ctxSheet: -1
    };
    const tdMap = new Map();
    const thCol = [];
    const thRow = [];
    let colEls = [];
    let memo = Object.create(null);
    let dependents = Object.create(null);

    function sheet() { return state.sheets[state.active]; }
    function getCell(addr) { return sheet().cells[addr]; }
    function rawOf(addr) { return sheet().cells[addr]?.raw ?? ""; }
    function styleOf(addr) { return sheet().cells[addr]?.style || {}; }

    /* ---------- formula engine ---------- */
    function tokenize(src) {
      const t = [];
      let i = 0;
      const s = src;
      const two = { ">=": 1, "<=": 1, "<>": 1 };
      while (i < s.length) {
        const c = s[i];
        if (c <= " ") { i++; continue; }
        if (two[s.substr(i, 2)]) { t.push({ type: s.substr(i, 2) }); i += 2; continue; }
        if ("+-*/(),:^&=<>".indexOf(c) >= 0) { t.push({ type: c }); i++; continue; }
        if (c === '"') {
          let j = i + 1, str = "";
          while (j < s.length) {
            if (s[j] === '"') {
              if (s[j + 1] === '"') { str += '"'; j += 2; continue; }
              break;
            }
            str += s[j++];
          }
          if (j >= s.length) throw new Error("#ERROR!");
          t.push({ type: "STR", value: str });
          i = j + 1;
          continue;
        }
        if (c === "." || (c >= "0" && c <= "9")) {
          let j = i;
          while (j < s.length && s[j] >= "0" && s[j] <= "9") j++;
          if (s[j] === ".") { j++; while (j < s.length && s[j] >= "0" && s[j] <= "9") j++; }
          if (s[j] === "e" || s[j] === "E") {
            let k = j + 1;
            if (s[k] === "+" || s[k] === "-") k++;
            if (s[k] >= "0" && s[k] <= "9") {
              j = k;
              while (j < s.length && s[j] >= "0" && s[j] <= "9") j++;
            }
          }
          t.push({ type: "NUM", value: parseFloat(s.slice(i, j)) });
          i = j;
          continue;
        }
        if ((c >= "A" && c <= "Z") || (c >= "a" && c <= "z") || c === "_") {
          let j = i;
          while (j < s.length && /[A-Za-z_]/.test(s[j])) j++;
          const letters = s.slice(i, j);
          if (j < s.length && s[j] >= "0" && s[j] <= "9") {
            while (j < s.length && s[j] >= "0" && s[j] <= "9") j++;
            t.push({ type: "CELL", value: (letters + s.slice(i + letters.length, j)).toUpperCase() });
          } else {
            t.push({ type: "ID", value: letters.toUpperCase() });
          }
          i = j;
          continue;
        }
        throw new Error("#ERROR!");
      }
      t.push({ type: "EOF" });
      return t;
    }

    function parseFormula(src) {
      const tokens = tokenize(src);
      let p = 0;
      const peek = () => tokens[p];
      const eat = (type) => {
        const tok = tokens[p];
        if (type && tok.type !== type) throw new Error("#ERROR!");
        p++;
        return tok;
      };
      function parseComparison() {
        let left = parseConcat();
        const op = peek().type;
        if (op === ">" || op === "<" || op === ">=" || op === "<=" || op === "=" || op === "<>") {
          eat();
          return { type: "cmp", op, left, right: parseConcat() };
        }
        return left;
      }
      function parseConcat() {
        let left = parseAdd();
        while (peek().type === "&") { eat(); left = { type: "concat", left, right: parseAdd() }; }
        return left;
      }
      function parseAdd() {
        let left = parseMul();
        while (peek().type === "+" || peek().type === "-") {
          const op = eat().type;
          left = { type: "bin", op, left, right: parseMul() };
        }
        return left;
      }
      function parseMul() {
        let left = parseUnary();
        while (peek().type === "*" || peek().type === "/") {
          const op = eat().type;
          left = { type: "bin", op, left, right: parseUnary() };
        }
        return left;
      }
      function parseUnary() {
        if (peek().type === "-") { eat(); return { type: "una", op: "-", expr: parseUnary() }; }
        if (peek().type === "+") { eat(); return parseUnary(); }
        return parsePower();
      }
      function parsePower() {
        let left = parsePrimary();
        if (peek().type === "^") { eat(); return { type: "bin", op: "^", left, right: parseUnary() }; }
        return left;
      }
      function parsePrimary() {
        const tok = peek();
        if (tok.type === "NUM") { eat(); return { type: "num", value: tok.value }; }
        if (tok.type === "STR") { eat(); return { type: "str", value: tok.value }; }
        if (tok.type === "CELL") {
          eat();
          if (peek().type === ":") {
            eat();
            const t2 = eat("CELL");
            return { type: "range", a: tok.value, b: t2.value };
          }
          return { type: "cell", addr: tok.value };
        }
        if (tok.type === "ID") {
          eat();
          if (tok.value === "TRUE") return { type: "bool", value: true };
          if (tok.value === "FALSE") return { type: "bool", value: false };
          eat("(");
          const args = [];
          if (peek().type !== ")") {
            args.push(parseComparison());
            while (peek().type === ",") { eat(); args.push(parseComparison()); }
          }
          eat(")");
          return { type: "fn", name: tok.value, args };
        }
        if (tok.type === "(") {
          eat();
          const e = parseComparison();
          eat(")");
          return e;
        }
        throw new Error("#ERROR!");
      }
      const ast = parseComparison();
      if (peek().type !== "EOF") throw new Error("#ERROR!");
      return ast;
    }

    function errOf(v) { return v && v.error ? v : null; }

    function toNum(v) {
      if (v.error) return v;
      if (v.empty) return { value: 0 };
      if (typeof v.value === "boolean") return { value: v.value ? 1 : 0 };
      if (typeof v.value === "number") return { value: v.value };
      const n = parseNumber(String(v.value));
      if (n === null) return { error: "#VALUE!" };
      return { value: n };
    }

    function flattenNums(args, ev, ignoreText) {
      const nums = [];
      for (const a of args) {
        if (a.type === "range") {
          for (const addr of expandRange(a.a, a.b)) {
            const v = computeCell(addr);
            if (v.error) return v;
            if (v.empty) continue;
            if (typeof v.value === "number") nums.push(v.value);
            else if (!ignoreText) {
              const n = parseNumber(String(v.value));
              if (n === null) return { error: "#VALUE!" };
              nums.push(n);
            }
          }
        } else {
          const v = ev(a);
          if (v.error) return v;
          if (v.empty) continue;
          if (typeof v.value === "number") nums.push(v.value);
          else if (typeof v.value === "boolean") nums.push(v.value ? 1 : 0);
          else if (!ignoreText) {
            const n = parseNumber(String(v.value));
            if (n === null) return { error: "#VALUE!" };
            nums.push(n);
          } else {
            const n = parseNumber(String(v.value));
            if (n !== null) nums.push(n);
          }
        }
      }
      return { nums };
    }

    function evalAst(ast, visiting) {
      const ev = (n) => evalAst(n, visiting);
      switch (ast.type) {
        case "num": return { value: ast.value };
        case "str": return { value: ast.value, text: true };
        case "bool": return { value: ast.value };
        case "cell": {
          const p = parseAddr(ast.addr);
          if (!p) return { error: "#REF!" };
          return computeCell(ast.addr, visiting);
        }
        case "range": return { error: "#VALUE!" };
        case "una": {
          const v = toNum(ev(ast.expr));
          if (v.error) return v;
          return { value: -v.value };
        }
        case "concat": {
          const l = ev(ast.left), r = ev(ast.right);
          if (l.error) return l;
          if (r.error) return r;
          const ls = l.empty ? "" : (typeof l.value === "number" ? formatNum(l.value) : String(l.value === true ? "TRUE" : l.value === false ? "FALSE" : l.value));
          const rs = r.empty ? "" : (typeof r.value === "number" ? formatNum(r.value) : String(r.value === true ? "TRUE" : r.value === false ? "FALSE" : r.value));
          return { value: ls + rs, text: true };
        }
        case "bin": {
          const l = toNum(ev(ast.left)); if (l.error) return l;
          const r = toNum(ev(ast.right)); if (r.error) return r;
          let n;
          switch (ast.op) {
            case "+": n = l.value + r.value; break;
            case "-": n = l.value - r.value; break;
            case "*": n = l.value * r.value; break;
            case "/":
              if (r.value === 0) return { error: "#DIV/0!" };
              n = l.value / r.value; break;
            case "^": n = Math.pow(l.value, r.value); break;
          }
          if (!Number.isFinite(n)) return { error: "#NUM!" };
          return { value: n };
        }
        case "cmp": {
          const l = ev(ast.left), r = ev(ast.right);
          if (l.error) return l;
          if (r.error) return r;
          const lv = l.empty ? 0 : l.value;
          const rv = r.empty ? 0 : r.value;
          let ok;
          switch (ast.op) {
            case ">": ok = lv > rv; break;
            case "<": ok = lv < rv; break;
            case ">=": ok = lv >= rv; break;
            case "<=": ok = lv <= rv; break;
            case "=": ok = lv === rv || (typeof lv === "number" && typeof rv === "number" && lv === rv); break;
            case "<>": ok = lv !== rv; break;
          }
          return { value: !!ok };
        }
        case "fn": return evalFn(ast.name, ast.args, visiting);
        default: return { error: "#ERROR!" };
      }
    }

    function truthy(v) {
      if (v.error) return v;
      if (v.empty) return false;
      if (typeof v.value === "boolean") return v.value;
      if (typeof v.value === "number") return v.value !== 0;
      return String(v.value).length > 0;
    }

    function evalFn(name, args, visiting) {
      const ev = (n) => evalAst(n, visiting);
      const collect = (ignoreText) => flattenNums(args, ev, ignoreText);
      switch (name) {
        case "SUM": {
          const x = collect(true); if (x.error) return x;
          return { value: x.nums.reduce((a, b) => a + b, 0) };
        }
        case "AVERAGE":
        case "AVG": {
          const x = collect(true); if (x.error) return x;
          if (!x.nums.length) return { error: "#DIV/0!" };
          return { value: x.nums.reduce((a, b) => a + b, 0) / x.nums.length };
        }
        case "MIN": {
          const x = collect(true); if (x.error) return x;
          if (!x.nums.length) return { error: "#VALUE!" };
          return { value: Math.min.apply(null, x.nums) };
        }
        case "MAX": {
          const x = collect(true); if (x.error) return x;
          if (!x.nums.length) return { error: "#VALUE!" };
          return { value: Math.max.apply(null, x.nums) };
        }
        case "COUNT": {
          const x = collect(true); if (x.error) return x;
          return { value: x.nums.length };
        }
        case "COUNTA": {
          let n = 0;
          for (const a of args) {
            if (a.type === "range") {
              for (const addr of expandRange(a.a, a.b)) {
                const v = computeCell(addr);
                if (v.error) return v;
                if (!v.empty) n++;
              }
            } else {
              const v = ev(a);
              if (v.error) return v;
              if (!v.empty) n++;
            }
          }
          return { value: n };
        }
        case "IF": {
          if (args.length < 2) return { error: "#N/A" };
          const c = ev(args[0]);
          if (c.error) return c;
          return ev(truthy(c) ? args[1] : (args[2] || { type: "bool", value: false }));
        }
        case "ABS": {
          if (!args[0]) return { error: "#N/A" };
          const v = toNum(ev(args[0])); if (v.error) return v;
          return { value: Math.abs(v.value) };
        }
        case "ROUND": {
          if (!args[0]) return { error: "#N/A" };
          const v = toNum(ev(args[0])); if (v.error) return v;
          const d = args[1] ? toNum(ev(args[1])) : { value: 0 };
          if (d.error) return d;
          const f = Math.pow(10, d.value);
          return { value: Math.round(v.value * f) / f };
        }
        case "SQRT": {
          if (!args[0]) return { error: "#N/A" };
          const v = toNum(ev(args[0])); if (v.error) return v;
          if (v.value < 0) return { error: "#NUM!" };
          return { value: Math.sqrt(v.value) };
        }
        case "LEN": {
          if (!args[0]) return { value: 0 };
          const v = ev(args[0]); if (v.error) return v;
          if (v.empty) return { value: 0 };
          return { value: String(v.value).length };
        }
        case "AND": {
          for (const a of args) {
            const v = ev(a); if (v.error) return v;
            if (!truthy(v)) return { value: false };
          }
          return { value: true };
        }
        case "OR": {
          for (const a of args) {
            const v = ev(a); if (v.error) return v;
            if (truthy(v)) return { value: true };
          }
          return { value: false };
        }
        case "NOT": {
          if (!args[0]) return { error: "#N/A" };
          const v = ev(args[0]); if (v.error) return v;
          return { value: !truthy(v) };
        }
        default: return { error: "#NAME?" };
      }
    }

    function computeCell(addr, visiting) {
      const key = state.active + "!" + addr;
      if (memo[key]) return memo[key];
      visiting = visiting || new Set();
      if (visiting.has(key)) return { error: "#CIRCULAR!" };
      const raw = rawOf(addr);
      if (raw === "") {
        const r = { value: 0, empty: true, display: "" };
        memo[key] = r;
        return r;
      }
      if (raw[0] !== "=") {
        const n = parseNumber(raw);
        const r = n !== null
          ? { value: n, display: raw, isNum: true }
          : { value: raw, display: raw, text: true };
        memo[key] = r;
        return r;
      }
      visiting.add(key);
      let r;
      try {
        const ast = parseFormula(raw.slice(1));
        r = evalAst(ast, visiting);
        if (r.error) r.display = r.error;
        else if (typeof r.value === "boolean") r.display = r.value ? "TRUE" : "FALSE";
        else if (typeof r.value === "number") { r.display = formatNum(r.value); r.isNum = true; }
        else r.display = r.value == null ? "" : String(r.value);
      } catch (e) {
        r = { error: e.message || "#ERROR!", display: e.message || "#ERROR!" };
      }
      visiting.delete(key);
      memo[key] = r;
      return r;
    }

    function extractDeps(raw) {
      const deps = [];
      if (!raw || raw[0] !== "=") return deps;
      const re = /\$?([A-Za-z]+)\$?(\d+)(?::\$?([A-Za-z]+)\$?(\d+))?/g;
      let m;
      while ((m = re.exec(raw))) {
        const a = m[1].toUpperCase() + m[2];
        if (m[3]) {
          const b = m[3].toUpperCase() + m[4];
          for (const addr of expandRange(a, b)) deps.push(addr);
        } else if (parseAddr(a)) deps.push(a);
      }
      return deps;
    }

    function rebuildDeps() {
      dependents = Object.create(null);
      const cells = sheet().cells;
      for (const addr in cells) {
        for (const d of extractDeps(cells[addr].raw || "")) {
          if (!dependents[d]) dependents[d] = [];
          dependents[d].push(addr);
        }
      }
    }

    function affected(start) {
      const out = [];
      const seen = Object.create(null);
      const q = [start];
      while (q.length) {
        const a = q.pop();
        if (seen[a]) continue;
        seen[a] = 1;
        out.push(a);
        const ds = dependents[a];
        if (ds) for (const d of ds) q.push(d);
      }
      return out;
    }

    /* ---------- render ---------- */
    const $sheet = document.getElementById("sheet");
    const $inner = document.getElementById("grid-inner");
    const $wrap = document.getElementById("grid-container");
    const $sel = document.getElementById("sel-box");
    const $editor = document.getElementById("cell-editor");
    const $fx = document.getElementById("formula-input");
    const $name = document.getElementById("name-box");
    const $tabs = document.getElementById("sheet-tabs");
    const $stats = document.getElementById("stats");
    const $fillBar = document.getElementById("fill-bar");
    const $fillColor = document.getElementById("fill-color");

    function buildGrid() {
      const cg = document.createElement("colgroup");
      const crh = document.createElement("col");
      crh.className = "rh";
      cg.appendChild(crh);
      colEls = [];
      for (let c = 0; c < COLS; c++) {
        const col = document.createElement("col");
        col.style.width = DEFAULT_W + "px";
        cg.appendChild(col);
        colEls.push(col);
      }
      const thead = document.createElement("thead");
      const hr = document.createElement("tr");
      const corner = document.createElement("th");
      corner.className = "corner";
      corner.title = "Select all";
      hr.appendChild(corner);
      thCol.length = 0;
      for (let c = 0; c < COLS; c++) {
        const th = document.createElement("th");
        th.textContent = colLetter(c);
        th.dataset.col = c;
        const rz = document.createElement("div");
        rz.className = "col-resizer";
        rz.dataset.col = c;
        th.appendChild(rz);
        hr.appendChild(th);
        thCol.push(th);
      }
      thead.appendChild(hr);
      const tbody = document.createElement("tbody");
      tdMap.clear();
      thRow.length = 0;
      for (let r = 0; r < ROWS; r++) {
        const tr = document.createElement("tr");
        const rh = document.createElement("th");
        rh.className = "rowh";
        rh.textContent = r + 1;
        rh.dataset.row = r;
        tr.appendChild(rh);
        thRow.push(rh);
        for (let c = 0; c < COLS; c++) {
          const td = document.createElement("td");
          const addr = makeAddr(c, r);
          td.dataset.addr = addr;
          td.dataset.col = c;
          td.dataset.row = r;
          tr.appendChild(td);
          tdMap.set(addr, td);
        }
        tbody.appendChild(tr);
      }
      $sheet.innerHTML = "";
      $sheet.appendChild(cg);
      $sheet.appendChild(thead);
      $sheet.appendChild(tbody);
    }

    function applyColWidths() {
      const w = sheet().colWidths;
      for (let c = 0; c < COLS; c++) {
        colEls[c].style.width = (w[c] || DEFAULT_W) + "px";
      }
    }

    function paintTd(addr) {
      const td = tdMap.get(addr);
      if (!td) return;
      const cell = getCell(addr);
      const st = cell?.style || {};
      const computed = computeCell(addr);
      const editingThis = state.editing && state.activeCell === addr;
      td.textContent = editingThis ? "" : (computed.display || "");
      td.classList.toggle("err", !!(computed.error && !editingThis));
      td.style.fontWeight = st.bold ? "700" : "";
      td.style.fontStyle = st.italic ? "italic" : "";
      td.style.backgroundColor = st.bg || "";
      td.style.color = computed.error ? "" : (st.color || "");
      if (st.align) td.style.textAlign = st.align;
      else if (computed.error) td.style.textAlign = "center";
      else if (computed.isNum || typeof computed.value === "boolean") td.style.textAlign = "right";
      else td.style.textAlign = "left";
    }

    function paintAll() {
      memo = Object.create(null);
      rebuildDeps();
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) paintTd(makeAddr(c, r));
    }

    function recalcFrom(addr) {
      memo = Object.create(null);
      rebuildDeps();
      const list = affected(addr);
      for (const a of list) paintTd(a);
    }

    function selRange() {
      return expandRange(state.selA, state.selB);
    }

    function updateOverlay() {
      const p1 = parseAddr(state.selA), p2 = parseAddr(state.selB);
      if (!p1 || !p2) return;
      const c1 = Math.min(p1.col, p2.col), c2 = Math.max(p1.col, p2.col);
      const r1 = Math.min(p1.row, p2.row), r2 = Math.max(p1.row, p2.row);
      const a0 = tdMap.get(makeAddr(c1, r1));
      const a1 = tdMap.get(makeAddr(c2, r2));
      if (!a0 || !a1) return;
      const left = a0.offsetLeft;
      const top = a0.offsetTop;
      const right = a1.offsetLeft + a1.offsetWidth;
      const bottom = a1.offsetTop + a1.offsetHeight;
      $sel.style.display = "block";
      $sel.style.left = left + "px";
      $sel.style.top = top + "px";
      $sel.style.width = (right - left) + "px";
      $sel.style.height = (bottom - top) + "px";
      $sel.classList.toggle("point", state.selectMode === "insert");

      for (const th of thCol) th.classList.remove("hi");
      for (const th of thRow) th.classList.remove("hi");
      for (let c = c1; c <= c2; c++) thCol[c].classList.add("hi");
      for (let r = r1; r <= r2; r++) thRow[r].classList.add("hi");

      document.querySelectorAll("#sheet td.rng").forEach((el) => el.classList.remove("rng"));
      const active = state.activeCell;
      if (!(c1 === c2 && r1 === r2)) {
        for (let r = r1; r <= r2; r++)
          for (let c = c1; c <= c2; c++) {
            const addr = makeAddr(c, r);
            if (addr !== active) tdMap.get(addr).classList.add("rng");
          }
      }

      $name.value = rangeStr(state.selA, state.selB);
      if (!state.editing) $fx.value = rawOf(state.activeCell);
      updateToolbar();
      updateStats();
    }

    function updateToolbar() {
      const st = styleOf(state.activeCell);
      document.getElementById("btn-bold").classList.toggle("on", !!st.bold);
      document.getElementById("btn-italic").classList.toggle("on", !!st.italic);
      $fillBar.style.setProperty("--swatch", st.bg || "#ffeb3b");
      if (st.bg) $fillColor.value = st.bg;
    }

    function updateStats() {
      const addrs = selRange();
      let count = 0, sum = 0, n = 0;
      for (const a of addrs) {
        const v = computeCell(a);
        if (!v.empty) count++;
        if (typeof v.value === "number" && !v.empty && !v.error) { sum += v.value; n++; }
      }
      if (addrs.length <= 1) { $stats.textContent = ""; return; }
      const parts = ["Count: " + count];
      if (n) {
        parts.push("Sum: " + formatNum(sum));
        parts.push("Avg: " + formatNum(sum / n));
      }
      $stats.innerHTML = parts.map((p) => "<b>" + p + "</b>").join("  ");
    }

    function placeEditor() {
      const td = tdMap.get(state.activeCell);
      if (!td) return;
      $editor.style.display = "block";
      $editor.style.left = td.offsetLeft + "px";
      $editor.style.top = td.offsetTop + "px";
      $editor.style.width = Math.max(td.offsetWidth, 80) + "px";
      $editor.style.minHeight = td.offsetHeight + "px";
      const st = styleOf(state.activeCell);
      $editor.style.fontWeight = st.bold ? "700" : "400";
      $editor.style.fontStyle = st.italic ? "italic" : "normal";
      $editor.style.fontSize = "13px";
    }

    function hideEditor() {
      $editor.style.display = "none";
    }

    function scrollActiveIntoView() {
      const td = tdMap.get(state.activeCell);
      if (!td) return;
      const cr = $wrap.getBoundingClientRect();
      const tr = td.getBoundingClientRect();
      const headH = 22, headW = 46;
      if (tr.left < cr.left + headW) $wrap.scrollLeft -= (cr.left + headW - tr.left + 4);
      else if (tr.right > cr.right) $wrap.scrollLeft += (tr.right - cr.right + 4);
      if (tr.top < cr.top + headH) $wrap.scrollTop -= (cr.top + headH - tr.top + 4);
      else if (tr.bottom > cr.bottom) $wrap.scrollTop += (tr.bottom - cr.bottom + 4);
    }

    /* ---------- sheets UI ---------- */
    function renderTabs() {
      $tabs.innerHTML = "";
      state.sheets.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "stab" + (i === state.active ? " active" : "");
        el.dataset.i = i;
        const lab = document.createElement("span");
        lab.textContent = s.name;
        el.appendChild(lab);
        const x = document.createElement("button");
        x.className = "x";
        x.title = "Delete sheet";
        x.textContent = "×";
        x.addEventListener("click", (e) => { e.stopPropagation(); deleteSheet(i); });
        el.appendChild(x);
        el.addEventListener("click", () => switchSheet(i));
        el.addEventListener("dblclick", (e) => { e.stopPropagation(); startRename(i, el); });
        el.addEventListener("contextmenu", (e) => {
          e.preventDefault();
          state.ctxSheet = i;
          const ctx = document.getElementById("sheet-ctx");
          ctx.style.display = "block";
          ctx.style.left = e.clientX + "px";
          ctx.style.top = (e.clientY - 60) + "px";
        });
        $tabs.appendChild(el);
      });
    }

    function startRename(i, el) {
      const s = state.sheets[i];
      const input = document.createElement("input");
      input.value = s.name;
      el.innerHTML = "";
      el.appendChild(input);
      input.focus();
      input.select();
      const done = () => {
        let name = input.value.trim() || s.name;
        const used = new Set(state.sheets.map((x, idx) => idx === i ? "" : x.name.toLowerCase()));
        if (used.has(name.toLowerCase())) name = s.name;
        s.name = name.slice(0, 31);
        renderTabs();
      };
      input.addEventListener("blur", done);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { input.value = s.name; input.blur(); }
      });
    }

    function switchSheet(i) {
      if (i === state.active || i < 0 || i >= state.sheets.length) return;
      if (state.editing) commitEdit();
      state.active = i;
      state.activeCell = "A1";
      state.selA = "A1";
      state.selB = "A1";
      applyColWidths();
      paintAll();
      renderTabs();
      updateOverlay();
    }

    function addSheet() {
      if (state.editing) commitEdit();
      let n = state.sheets.length + 1;
      let name = "Sheet" + n;
      const names = new Set(state.sheets.map((s) => s.name.toLowerCase()));
      while (names.has(name.toLowerCase())) { n++; name = "Sheet" + n; }
      state.sheets.push(emptySheet(name));
      switchSheet(state.sheets.length - 1);
    }

    function deleteSheet(i) {
      if (state.sheets.length <= 1) { toast("A workbook must have at least one sheet"); return; }
      if (!confirm("Delete sheet \"" + state.sheets[i].name + "\"?")) return;
      state.sheets.splice(i, 1);
      if (state.active >= state.sheets.length) state.active = state.sheets.length - 1;
      else if (state.active > i) state.active--;
      else if (state.active === i) { /* stay on same index now pointing at next */ }
      applyColWidths();
      paintAll();
      renderTabs();
      updateOverlay();
    }

    /* ---------- editing / selection ---------- */
    function selectCell(addr, extend) {
      const p = parseAddr(addr);
      if (!p) return;
      addr = makeAddr(p.col, p.row);
      if (!extend) {
        state.activeCell = addr;
        state.selA = addr;
      }
      state.selB = addr;
      updateOverlay();
      scrollActiveIntoView();
    }

    function isFormulaEdit() {
      const ed = activeEditor();
      return state.editing && ed && ed.value.charAt(0) === "=";
    }
    function activeEditor() {
      return state.editSource === "bar" ? $fx : $editor;
    }

    function beginEdit(source, seed, replace) {
      state.editing = true;
      state.editSource = source;
      state.editOrig = rawOf(state.activeCell);
      state.insertTok = null;
      const val = replace ? (seed || "") : (seed != null ? seed : state.editOrig);
      $fx.value = val;
      $editor.value = val;
      if (source === "cell") {
        placeEditor();
        $editor.focus();
        if (replace) $editor.setSelectionRange(val.length, val.length);
        else $editor.setSelectionRange(val.length, val.length);
      } else {
        hideEditor();
        $fx.focus();
        $fx.setSelectionRange(val.length, val.length);
      }
      paintTd(state.activeCell);
    }

    function syncEditors(from) {
      const v = from.value;
      if (from !== $fx) $fx.value = v;
      if (from !== $editor) $editor.value = v;
    }

    function commitEdit() {
      if (!state.editing) return;
      const val = activeEditor().value;
      state.editing = false;
      state.editSource = null;
      state.insertTok = null;
      state.selectMode = "select";
      hideEditor();
      setRaw(state.activeCell, val);
      updateOverlay();
    }

    function cancelEdit() {
      if (!state.editing) return;
      state.editing = false;
      state.editSource = null;
      state.insertTok = null;
      state.selectMode = "select";
      hideEditor();
      $fx.value = state.editOrig;
      paintTd(state.activeCell);
      updateOverlay();
    }

    function insertRef(ref) {
      const ed = activeEditor();
      if (!ed) return;
      let val = ed.value;
      let start;
      if (state.insertTok) {
        val = val.slice(0, state.insertTok.start) + ref + val.slice(state.insertTok.end);
        start = state.insertTok.start;
      } else {
        start = ed.selectionStart != null ? ed.selectionStart : val.length;
        const end = ed.selectionEnd != null ? ed.selectionEnd : start;
        val = val.slice(0, start) + ref + val.slice(end);
      }
      const end2 = start + ref.length;
      ed.value = val;
      syncEditors(ed);
      state.insertTok = { start, end: end2 };
      try { ed.setSelectionRange(end2, end2); } catch (e) {}
    }

    /* ---------- mutations ---------- */
    function cloneCell(c) {
      if (!c) return { raw: "", style: {} };
      return { raw: c.raw || "", style: Object.assign({}, c.style || {}) };
    }

    function pushUndo(changes) {
      if (!changes.length) return;
      state.undo.push(changes);
      if (state.undo.length > 80) state.undo.shift();
      state.redo = [];
    }

    function applyChanges(changes, invert) {
      const seen = Object.create(null);
      for (const ch of changes) {
        if (ch.kind === "cell") {
          const sh = state.sheets[ch.si];
          const next = invert ? ch.before : ch.after;
          if (!next || (next.raw === "" && (!next.style || !Object.keys(next.style).length)))
            delete sh.cells[ch.addr];
          else sh.cells[ch.addr] = cloneCell(next);
          seen[ch.addr] = 1;
        } else if (ch.kind === "width") {
          const sh = state.sheets[ch.si];
          sh.colWidths[ch.col] = invert ? ch.before : ch.after;
        }
      }
      applyColWidths();
      memo = Object.create(null);
      rebuildDeps();
      paintAll();
      updateOverlay();
    }

    function setRaw(addr, raw, batch) {
      const cells = sheet().cells;
      const before = cloneCell(cells[addr]);
      raw = String(raw);
      if (!cells[addr]) cells[addr] = { raw: "", style: {} };
      if (raw === "") {
        if (!cells[addr].style || !Object.keys(cells[addr].style).some((k) => cells[addr].style[k]))
          delete cells[addr];
        else cells[addr].raw = "";
      } else {
        cells[addr].raw = raw;
      }
      const after = cloneCell(cells[addr]);
      const ch = { kind: "cell", si: state.active, addr, before, after };
      if (batch) batch.push(ch);
      else pushUndo([ch]);
      recalcFrom(addr);
    }

    function applyStyle(patch) {
      const batch = [];
      for (const addr of selRange()) {
        const cells = sheet().cells;
        const before = cloneCell(cells[addr]);
        if (!cells[addr]) cells[addr] = { raw: "", style: {} };
        if (!cells[addr].style) cells[addr].style = {};
        Object.assign(cells[addr].style, patch);
        const after = cloneCell(cells[addr]);
        batch.push({ kind: "cell", si: state.active, addr, before, after });
        paintTd(addr);
      }
      pushUndo(batch);
      updateToolbar();
    }

    function clearContents() {
      const batch = [];
      for (const addr of selRange()) {
        if (rawOf(addr) !== "") setRaw(addr, "", batch);
      }
      pushUndo(batch);
      if (!state.editing) $fx.value = rawOf(state.activeCell);
    }

    function undo() {
      if (state.editing) { cancelEdit(); return; }
      const ch = state.undo.pop();
      if (!ch) return;
      applyChanges(ch, true);
      state.redo.push(ch);
    }
    function redo() {
      const ch = state.redo.pop();
      if (!ch) return;
      applyChanges(ch, false);
      state.undo.push(ch);
    }

    /* ---------- copy / paste ---------- */
    function copySelection(cut) {
      const p1 = parseAddr(state.selA), p2 = parseAddr(state.selB);
      const c1 = Math.min(p1.col, p2.col), c2 = Math.max(p1.col, p2.col);
      const r1 = Math.min(p1.row, p2.row), r2 = Math.max(p1.row, p2.row);
      const grid = [];
      const lines = [];
      for (let r = r1; r <= r2; r++) {
        const row = [];
        const vals = [];
        for (let c = c1; c <= c2; c++) {
          const addr = makeAddr(c, r);
          row.push(cloneCell(getCell(addr)));
          vals.push((computeCell(addr).display || "").replace(/\t/g, " "));
        }
        grid.push(row);
        lines.push(vals.join("\t"));
      }
      state.clipboard = { grid, origin: makeAddr(c1, r1), cut };
      try { navigator.clipboard.writeText(lines.join("\n")); } catch (e) {}
      if (cut) clearContents();
    }

    function shiftFormula(raw, dc, dr) {
      if (!raw || raw[0] !== "=") return raw;
      return raw.replace(/(\$?)([A-Za-z]+)(\$?)(\d+)/g, (m, d1, col, d2, row) => {
        let c = parseCol(col);
        let r = parseInt(row, 10) - 1;
        if (!d1) c += dc;
        if (!d2) r += dr;
        if (!inBounds(c, r)) return m;
        return d1 + colLetter(c) + d2 + (r + 1);
      });
    }

    function pasteInternal(at) {
      const clip = state.clipboard;
      if (!clip) return;
      const dest = parseAddr(at || state.activeCell);
      const origin = parseAddr(clip.origin);
      const dc = dest.col - origin.col;
      const dr = dest.row - origin.row;
      const batch = [];
      for (let r = 0; r < clip.grid.length; r++) {
        for (let c = 0; c < clip.grid[r].length; c++) {
          const nc = dest.col + c, nr = dest.row + r;
          if (!inBounds(nc, nr)) continue;
          const addr = makeAddr(nc, nr);
          const src = clip.grid[r][c];
          const raw = shiftFormula(src.raw || "", dest.col - origin.col, dest.row - origin.row);
          const cells = sheet().cells;
          const before = cloneCell(cells[addr]);
          cells[addr] = { raw, style: Object.assign({}, src.style || {}) };
          if (!raw && !Object.keys(cells[addr].style).length) delete cells[addr];
          batch.push({ kind: "cell", si: state.active, addr, before, after: cloneCell(cells[addr]) });
        }
      }
      pushUndo(batch);
      memo = Object.create(null);
      rebuildDeps();
      paintAll();
      const end = makeAddr(
        Math.min(COLS - 1, dest.col + clip.grid[0].length - 1),
        Math.min(ROWS - 1, dest.row + clip.grid.length - 1)
      );
      state.selA = makeAddr(dest.col, dest.row);
      state.selB = end;
      state.activeCell = state.selA;
      updateOverlay();
    }

    function pasteTSV(text) {
      const rows = text.replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
      while (rows.length && rows[rows.length - 1] === "") rows.pop();
      const dest = parseAddr(state.activeCell);
      const batch = [];
      rows.forEach((line, ri) => {
        const cols = line.split("\t");
        cols.forEach((val, ci) => {
          const nc = dest.col + ci, nr = dest.row + ri;
          if (!inBounds(nc, nr)) return;
          const addr = makeAddr(nc, nr);
          const cells = sheet().cells;
          const before = cloneCell(cells[addr]);
          if (!cells[addr]) cells[addr] = { raw: "", style: {} };
          cells[addr].raw = val;
          batch.push({ kind: "cell", si: state.active, addr, before, after: cloneCell(cells[addr]) });
        });
      });
      pushUndo(batch);
      memo = Object.create(null);
      rebuildDeps();
      paintAll();
      updateOverlay();
    }

    /* ---------- CSV ---------- */
    function usedBounds() {
      let c1 = COLS, r1 = ROWS, c2 = 0, r2 = 0, any = false;
      const cells = sheet().cells;
      for (const addr in cells) {
        const p = parseAddr(addr);
        if (!p) continue;
        if (!(cells[addr].raw || (cells[addr].style && Object.keys(cells[addr].style).length))) continue;
        any = true;
        c1 = Math.min(c1, p.col); c2 = Math.max(c2, p.col);
        r1 = Math.min(r1, p.row); r2 = Math.max(r2, p.row);
      }
      if (!any) return { c1: 0, r1: 0, c2: 0, r2: 0 };
      return { c1, r1, c2, r2 };
    }

    function escapeCSV(s) {
      s = String(s ?? "");
      if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }

    function downloadCSV() {
      const b = usedBounds();
      const lines = [];
      for (let r = b.r1; r <= b.r2; r++) {
        const row = [];
        for (let c = b.c1; c <= b.c2; c++) {
          row.push(escapeCSV(rawOf(makeAddr(c, r))));
        }
        lines.push(row.join(","));
      }
      const blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      const doc = document.getElementById("doc-name").value.trim() || "Workbook";
      a.href = URL.createObjectURL(blob);
      a.download = doc + " - " + sheet().name + ".csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 500);
      toast("Downloaded " + a.download);
    }

    function parseCSV(text) {
      const rows = [];
      let row = [], field = "", i = 0, q = false;
      text = text.replace(/^\uFEFF/, "");
      while (i < text.length) {
        const c = text[i];
        if (q) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
            q = false; i++; continue;
          }
          field += c; i++; continue;
        }
        if (c === '"') { q = true; i++; continue; }
        if (c === ",") { row.push(field); field = ""; i++; continue; }
        if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(field); field = "";
          rows.push(row); row = []; i++; continue;
        }
        field += c; i++;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    function uploadCSV(text) {
      const rows = parseCSV(text);
      const batch = [];
      const cells = sheet().cells;
      for (const addr of Object.keys(cells)) {
        batch.push({ kind: "cell", si: state.active, addr, before: cloneCell(cells[addr]), after: { raw: "", style: {} } });
        delete cells[addr];
      }
      for (let r = 0; r < rows.length && r < ROWS; r++) {
        for (let c = 0; c < rows[r].length && c < COLS; c++) {
          const val = rows[r][c];
          if (val === "") continue;
          const addr = makeAddr(c, r);
          cells[addr] = { raw: val, style: {} };
          batch.push({ kind: "cell", si: state.active, addr, before: { raw: "", style: {} }, after: cloneCell(cells[addr]) });
        }
      }
      pushUndo(batch);
      memo = Object.create(null);
      paintAll();
      state.activeCell = "A1";
      state.selA = "A1";
      state.selB = "A1";
      updateOverlay();
      toast("Imported " + Math.min(rows.length, ROWS) + " rows");
    }

    /* ---------- events ---------- */
    function cellFromEvent(e) {
      const el = e.target.closest && e.target.closest("td[data-addr]");
      return el ? el.dataset.addr : null;
    }

    $sheet.addEventListener("mousedown", (e) => {
      if (e.button !== 0) return;
      const rz = e.target.closest(".col-resizer");
      if (rz) {
        e.preventDefault();
        e.stopPropagation();
        if (state.editing) commitEdit();
        const col = +rz.dataset.col;
        state.resizing = { col, x: e.clientX, w: sheet().colWidths[col] || DEFAULT_W };
        return;
      }
      const corner = e.target.closest("th.corner");
      if (corner) {
        if (state.editing && !isFormulaEdit()) commitEdit();
        if (isFormulaEdit()) return;
        state.activeCell = "A1";
        state.selA = "A1";
        state.selB = makeAddr(COLS - 1, ROWS - 1);
        updateOverlay();
        return;
      }
      const ch = e.target.closest("thead th[data-col]");
      if (ch && !e.target.classList.contains("col-resizer")) {
        if (state.editing && !isFormulaEdit()) commitEdit();
        if (isFormulaEdit()) {
          e.preventDefault();
          const c = +ch.dataset.col;
          const ref = colLetter(c) + "1:" + colLetter(c) + ROWS;
          state.selectMode = "insert";
          insertRef(ref);
          return;
        }
        const c = +ch.dataset.col;
        state.activeCell = makeAddr(c, 0);
        state.selA = makeAddr(c, 0);
        state.selB = makeAddr(c, ROWS - 1);
        state.selecting = true;
        state.selectMode = "col";
        updateOverlay();
        return;
      }
      const rh = e.target.closest("th.rowh");
      if (rh) {
        if (state.editing && !isFormulaEdit()) commitEdit();
        if (isFormulaEdit()) {
          e.preventDefault();
          const r = +rh.dataset.row;
          insertRef("A" + (r + 1) + ":" + colLetter(COLS - 1) + (r + 1));
          return;
        }
        const r = +rh.dataset.row;
        state.activeCell = makeAddr(0, r);
        state.selA = makeAddr(0, r);
        state.selB = makeAddr(COLS - 1, r);
        state.selecting = true;
        state.selectMode = "row";
        updateOverlay();
        return;
      }
      const addr = cellFromEvent(e);
      if (!addr) return;

      if (isFormulaEdit()) {
        e.preventDefault();
        state.selecting = true;
        state.selectMode = "insert";
        state.selA = addr;
        state.selB = addr;
        insertRef(addr);
        updateOverlay();
        return;
      }
      if (state.editing) commitEdit();
      selectCell(addr, e.shiftKey);
      state.selecting = true;
      state.selectMode = "select";
    });

    $sheet.addEventListener("dblclick", (e) => {
      const addr = cellFromEvent(e);
      if (!addr) return;
      if (state.editing) commitEdit();
      selectCell(addr, false);
      beginEdit("cell");
    });

    document.addEventListener("mousemove", (e) => {
      if (state.resizing) {
        const w = Math.max(36, Math.min(480, state.resizing.w + (e.clientX - state.resizing.x)));
        sheet().colWidths[state.resizing.col] = w;
        colEls[state.resizing.col].style.width = w + "px";
        updateOverlay();
        if (state.editing && state.editSource === "cell") placeEditor();
        return;
      }
      if (!state.selecting) return;
      if (state.selectMode === "col") {
        const th = document.elementFromPoint(e.clientX, e.clientY);
        const h = th && th.closest && th.closest("th[data-col]");
        if (h) {
          state.selB = makeAddr(+h.dataset.col, ROWS - 1);
          updateOverlay();
        }
        return;
      }
      if (state.selectMode === "row") {
        const th = document.elementFromPoint(e.clientX, e.clientY);
        const h = th && th.closest && th.closest("th.rowh");
        if (h) {
          state.selB = makeAddr(COLS - 1, +h.dataset.row);
          updateOverlay();
        }
        return;
      }
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const td = el && el.closest && el.closest("td[data-addr]");
      if (!td) return;
      const addr = td.dataset.addr;
      if (addr === state.selB) return;
      state.selB = addr;
      if (state.selectMode === "insert") insertRef(rangeStr(state.selA, state.selB));
      updateOverlay();
    });

    document.addEventListener("mouseup", () => {
      if (state.resizing) {
        const col = state.resizing.col;
        const after = sheet().colWidths[col] || DEFAULT_W;
        const before = state.resizing.w;
        if (after !== before)
          pushUndo([{ kind: "width", si: state.active, col, before, after }]);
        state.resizing = null;
      }
      state.selecting = false;
      if (state.selectMode === "insert") {
        /* keep dashed until edit ends */
      } else {
        state.selectMode = "select";
      }
    });

    function moveActive(dc, dr, extend) {
      const p = parseAddr(state.activeCell);
      let c = p.col, r = p.row;
      if (!extend) {
        const p2 = parseAddr(state.selB);
        /* from the edge of selection when not extending? use active */
      }
      c = Math.max(0, Math.min(COLS - 1, c + dc));
      r = Math.max(0, Math.min(ROWS - 1, r + dr));
      const addr = makeAddr(c, r);
      if (extend) {
        state.selB = addr;
        updateOverlay();
        scrollActiveIntoView();
      } else {
        selectCell(addr, false);
      }
    }

    document.addEventListener("keydown", (e) => {
      const inEd = state.editing && (e.target === $editor || e.target === $fx);
      const inChrome = e.target === $name || e.target === document.getElementById("doc-name") || (e.target.tagName === "INPUT" && e.target !== $editor && e.target !== $fx);

      if ((e.ctrlKey || e.metaKey) && !inChrome) {
        const k = e.key.toLowerCase();
        if (k === "b") { e.preventDefault(); if (state.editing) commitEdit(); applyStyle({ bold: !styleOf(state.activeCell).bold }); return; }
        if (k === "i") { e.preventDefault(); if (state.editing) commitEdit(); applyStyle({ italic: !styleOf(state.activeCell).italic }); return; }
        if (k === "z") { e.preventDefault(); undo(); return; }
        if (k === "y") { e.preventDefault(); redo(); return; }
        if (k === "c") { if (!inEd) { e.preventDefault(); copySelection(false); } return; }
        if (k === "x") { if (!inEd) { e.preventDefault(); copySelection(true); } return; }
        if (k === "v") { if (!inEd && state.clipboard) { e.preventDefault(); pasteInternal(); } return; }
        if (k === "a") { if (!inEd) { e.preventDefault(); state.selA = "A1"; state.selB = makeAddr(COLS - 1, ROWS - 1); updateOverlay(); } return; }
      }

      if (e.target === $name) {
        if (e.key === "Enter") {
          e.preventDefault();
          const v = $name.value.toUpperCase().trim();
          if (v.includes(":")) {
            const [a, b] = v.split(":");
            if (parseAddr(a) && parseAddr(b)) {
              state.activeCell = parseAddr(a) && makeAddr(parseAddr(a).col, parseAddr(a).row);
              state.selA = a; state.selB = b; updateOverlay(); scrollActiveIntoView();
            }
          } else if (parseAddr(v)) selectCell(v, false);
          $name.blur();
        }
        return;
      }
      if (inChrome) return;

      if (state.editing) {
        if (e.key === "Escape") { e.preventDefault(); cancelEdit(); return; }
        if (e.key === "Enter" && !e.altKey) {
          e.preventDefault();
          commitEdit();
          moveActive(0, e.shiftKey ? -1 : 1, false);
          return;
        }
        if (e.key === "Tab") {
          e.preventDefault();
          commitEdit();
          moveActive(e.shiftKey ? -1 : 1, 0, false);
          return;
        }
        if (e.key.length === 1 && !e.ctrlKey && !e.metaKey) state.insertTok = null;
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key) && isFormulaEdit() && e.altKey) {
          /* keep caret movement default */
        }
        return;
      }

      if (e.key === "F2") { e.preventDefault(); beginEdit("cell"); return; }
      if (e.key === "Enter") { e.preventDefault(); moveActive(0, e.shiftKey ? -1 : 1, false); return; }
      if (e.key === "Tab") { e.preventDefault(); moveActive(e.shiftKey ? -1 : 1, 0, false); return; }
      if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); clearContents(); return; }
      if (e.key === "Escape") { selectCell(state.activeCell, false); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); moveActive(0, -1, e.shiftKey); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); moveActive(0, 1, e.shiftKey); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); moveActive(-1, 0, e.shiftKey); return; }
      if (e.key === "ArrowRight") { e.preventDefault(); moveActive(1, 0, e.shiftKey); return; }
      if (e.key === "Home") {
        e.preventDefault();
        if (e.ctrlKey) selectCell("A1", false);
        else selectCell(makeAddr(0, parseAddr(state.activeCell).row), e.shiftKey);
        return;
      }
      if (e.key === "End") {
        e.preventDefault();
        selectCell(makeAddr(COLS - 1, parseAddr(state.activeCell).row), e.shiftKey);
        return;
      }
      if (e.key === "PageDown") { e.preventDefault(); moveActive(0, 20, e.shiftKey); return; }
      if (e.key === "PageUp") { e.preventDefault(); moveActive(0, -20, e.shiftKey); return; }

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        beginEdit("cell", e.key, true);
      }
    });

    $fx.addEventListener("focus", () => {
      if (!state.editing) beginEdit("bar");
      else if (state.editSource !== "bar") {
        state.editSource = "bar";
        hideEditor();
      }
    });
    $fx.addEventListener("input", () => { syncEditors($fx); state.insertTok = null; });
    $editor.addEventListener("input", () => { syncEditors($editor); });

    $wrap.addEventListener("scroll", () => {
      if (state.editing && state.editSource === "cell") placeEditor();
    });

    document.getElementById("btn-fx-ok").addEventListener("click", () => {
      if (state.editing) { commitEdit(); } else beginEdit("bar");
    });
    document.getElementById("btn-fx-cancel").addEventListener("click", () => {
      if (state.editing) cancelEdit();
    });

    document.getElementById("btn-bold").addEventListener("click", () => {
      if (state.editing) commitEdit();
      applyStyle({ bold: !styleOf(state.activeCell).bold });
    });
    document.getElementById("btn-italic").addEventListener("click", () => {
      if (state.editing) commitEdit();
      applyStyle({ italic: !styleOf(state.activeCell).italic });
    });
    document.getElementById("btn-fill").addEventListener("click", () => $fillColor.click());
    $fillColor.addEventListener("input", () => {
      if (state.editing) commitEdit();
      applyStyle({ bg: $fillColor.value });
      $fillBar.style.setProperty("--swatch", $fillColor.value);
    });
    document.getElementById("btn-clear").addEventListener("click", () => {
      if (state.editing) commitEdit();
      clearContents();
    });
    document.getElementById("btn-download").addEventListener("click", () => {
      if (state.editing) commitEdit();
      downloadCSV();
    });
    document.getElementById("btn-upload").addEventListener("click", () => {
      document.getElementById("file-csv").click();
    });
    document.getElementById("file-csv").addEventListener("change", (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => uploadCSV(String(reader.result || ""));
      reader.readAsText(f);
      e.target.value = "";
    });

    document.getElementById("add-sheet").addEventListener("click", addSheet);
    document.getElementById("tab-prev").addEventListener("click", () => switchSheet(state.active - 1));
    document.getElementById("tab-next").addEventListener("click", () => switchSheet(state.active + 1));

    document.getElementById("sheet-ctx").addEventListener("click", (e) => {
      const act = e.target.dataset.act;
      const i = state.ctxSheet;
      document.getElementById("sheet-ctx").style.display = "none";
      if (act === "delete") deleteSheet(i);
      if (act === "rename") {
        const el = $tabs.querySelector('.stab[data-i="' + i + '"]');
        if (el) startRename(i, el);
      }
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#sheet-ctx")) document.getElementById("sheet-ctx").style.display = "none";
    });

    document.addEventListener("paste", (e) => {
      if (state.editing) return;
      if (e.target.tagName === "INPUT") return;
      const text = e.clipboardData && e.clipboardData.getData("text/plain");
      if (!text) return;
      e.preventDefault();
      if (state.clipboard && !text.includes("\t") && !text.includes("\n") && state.clipboard.grid) {
        pasteInternal();
      } else if (text.includes("\t") || text.includes("\n")) {
        pasteTSV(text);
      } else {
        setRaw(state.activeCell, text);
        updateOverlay();
      }
    });

    document.addEventListener("copy", (e) => {
      if (state.editing || e.target.tagName === "INPUT") return;
      const p1 = parseAddr(state.selA), p2 = parseAddr(state.selB);
      const c1 = Math.min(p1.col, p2.col), c2 = Math.max(p1.col, p2.col);
      const r1 = Math.min(p1.row, p2.row), r2 = Math.max(p1.row, p2.row);
      const lines = [];
      const grid = [];
      for (let r = r1; r <= r2; r++) {
        const vals = [], row = [];
        for (let c = c1; c <= c2; c++) {
          const addr = makeAddr(c, r);
          vals.push(computeCell(addr).display || "");
          row.push(cloneCell(getCell(addr)));
        }
        lines.push(vals.join("\t"));
        grid.push(row);
      }
      state.clipboard = { grid, origin: makeAddr(c1, r1), cut: false };
      e.clipboardData.setData("text/plain", lines.join("\n"));
      e.preventDefault();
    });

    document.getElementById("doc-name").addEventListener("input", () => {
      document.title = (document.getElementById("doc-name").value || "Workbook") + " — Sheets";
    });

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 1800);
    }

    /* ---------- boot ---------- */
    buildGrid();
    applyColWidths();
    paintAll();
    renderTabs();
    updateOverlay();
  })();
  </script>
</body>
</html>
