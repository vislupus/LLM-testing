<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Web</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;font-size:13px;user-select:none}
:root{--tb:#2b2b30;--fb:#f0f0f0;--grid:#f8f8f8;--hdr:#e2e2e2;--sel:#d4e6fa;--brd:#c8c8c8;--accent:#217346;--cellw:80px;--cellh:24px}

/* ── TOOLBAR ── */
#tb{height:36px;background:var(--tb);display:flex;align-items:center;padding:0 6px;gap:3px}
#tb button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:#ddd;
  padding:3px 8px;border-radius:3px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
#tb button:hover{background:rgba(255,255,255,.14)}
#tb .sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 2px}
#tb label{color:#999;font-size:11px;margin:0 1px}
#tb select{background:rgba(255,255,255,.08);color:#ccc;border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:2px 4px;font-size:12px;cursor:pointer}
#tb input[type=color]{width:22px;height:18px;border:1px solid rgba(255,255,255,.15);border-radius:2px;
  padding:0;cursor:pointer;background:none;vertical-align:middle}
#tb input[type=color]::-webkit-color-swatch-wrapper{padding:1px}
#tb input[type=color]::-webkit-color-swatch{border:none;border-radius:1px}

/* ── FORMULA BAR ── */
#fb{height:28px;background:var(--fb);display:flex;align-items:center;border-bottom:1px solid var(--brd)}
#cell-addr{width:76px;height:100%;border-right:1px solid var(--brd);display:flex;align-items:center;
  justify-content:center;font-size:12px;color:#333;background:#fff;font-weight:600}
#fx-label{width:28px;height:100%;border-right:1px solid var(--brd);display:flex;align-items:center;
  justify-content:center;font-size:12px;font-style:italic;color:#555;background:#fff;font-weight:700}
#formula-input{flex:1;height:100%;border:none;padding:0 8px;font-size:13px;font-family:inherit;outline:none;background:#fff}

/* ── GRID ── */
#grid-wrap{flex:1;overflow:hidden;position:relative}
#grid-scroll{width:100%;height:100%;overflow:auto;position:relative}
#corner{position:absolute;left:0;top:0;width:40px;height:25px;background:var(--hdr);
  border-right:1px solid #999;border-bottom:1px solid #999;z-index:30}
#grid-canvas{position:relative}
.cell{position:absolute;border-right:1px solid #e0e0e0;border-bottom:1px solid #e0e0e0;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:1px 4px;font-size:12px;line-height:22px;background:#fff}
.cell.rhdr{background:var(--hdr);text-align:center;font-weight:500;color:#555;border-right:1px solid #999;font-size:11px;z-index:15}
.cell.chdr{background:var(--hdr);text-align:center;font-weight:600;color:#555;border-bottom:1px solid #999;font-size:11px;z-index:15;cursor:default}
.cell.chdr:hover{background:#d8d8d8}
.cell.sel-cell{outline:2px solid var(--accent);outline-offset:-1px;z-index:12!important}
.cell.in-range{background:var(--sel)!important}
.cell.editing{outline:2px solid var(--accent);outline-offset:-1px;z-index:20}
.cell-editor{position:absolute;z-index:25;border:2px solid var(--accent);padding:1px 4px;font-size:13px;
  font-family:inherit;outline:none;background:#fff;resize:none;overflow:hidden;line-height:22px}
.cell.chdr .col-resize-handle{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize;z-index:20}
.cell.selection-handle{position:absolute;width:7px;height:7px;background:var(--accent);border:1px solid #fff;
  cursor:crosshair;z-index:22;right:-3px;bottom:-3px}

/* ── SHEET TABS ── */
#sheet-bar{height:28px;background:#f0f0f0;display:flex;align-items:center;border-top:1px solid var(--brd);padding:0 4px}
#sheet-tabs{display:flex;align-items:flex-end;gap:0;flex:1;overflow-x:auto}
.stab{padding:4px 14px;background:#e8e8e8;border:1px solid #ccc;border-bottom:none;
  border-radius:4px 4px 0 0;cursor:pointer;font-size:11px;color:#555;position:relative;white-space:nowrap;
  max-width:140px;overflow:hidden;text-overflow:ellipsis;margin-right:-1px}
.stab.active{background:#fff;color:#217346;font-weight:600;border-bottom:1px solid #fff;margin-bottom:-1px;padding-bottom:5px}
.stab .stab-x{margin-left:6px;font-size:9px;opacity:.4;cursor:pointer}
.stab .stab-x:hover{opacity:1}
.stab:hover:not(.active){background:#e0e0e0}
#add-sheet{width:24px;height:22px;background:none;border:1px solid #ccc;border-radius:3px;cursor:pointer;
  font-size:14px;color:#555;margin-left:4px;display:flex;align-items:center;justify-content:center}
#add-sheet:hover{background:#e0e0e0}

/* ── STATUS BAR ── */
#sb{height:22px;background:#217346;color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;font-size:11px}
#sb-info{opacity:.9}
#sb-stats{opacity:.85}

/* ── Context Menu ── */
#ctx{position:fixed;z-index:9000;background:#fff;border:1px solid #ccc;border-radius:4px;
  box-shadow:0 3px 12px rgba(0,0,0,.18);padding:4px 0;display:none;min-width:160px}
#ctx.show{display:block}
#ctx div{padding:5px 16px;font-size:12px;color:#333;cursor:pointer}
#ctx div:hover{background:#e8f0fd}
#ctx .csep{height:1px;background:#e0e0e0;margin:3px 0;padding:0;cursor:default}

/* ── Rename Input ── */
.stab-rename{background:#fff;color:#333;border:1px solid var(--accent);padding:2px 6px;
  font-size:11px;font-family:inherit;outline:none;width:90px;border-radius:2px}

/* ── Misc ── */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#f0f0f0}
::-webkit-scrollbar-thumb{background:#c0c0c0;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#a0a0a0}
.hidden-file{display:none}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="tb">
  <select id="font-fam" title="Font"><option>Calibri</option><option>Arial</option><option>Times New Roman</option><option>Consolas</option><option>Georgia</option><option>Verdana</option><option>Courier New</option></select>
  <select id="font-sz" title="Font Size"><option>8</option><option>9</option><option>10</option><option selected>11</option><option>12</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option></select>
  <div class="sep"></div>
  <button id="btn-b" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="btn-i" title="Italic (Ctrl+I)"><i>I</i></button>
  <div class="sep"></div>
  <button id="btn-al" title="Align Left">≡←</button>
  <button id="btn-ac" title="Align Center">≡↔</button>
  <button id="btn-ar" title="Align Right">≡→</button>
  <div class="sep"></div>
  <label>Bg</label><input type="color" id="inp-bg" value="#ffffff" title="Background Color">
  <label>Fg</label><input type="color" id="inp-fg" value="#000000" title="Text Color">
  <div class="sep"></div>
  <button id="btn-clr" title="Clear Contents">🧹 Clear</button>
  <div class="sep"></div>
  <button id="btn-csv-dl" title="Download CSV">⬇ CSV</button>
  <button id="btn-csv-ul" title="Upload CSV">⬆ CSV</button>
  <input type="file" id="csv-file" class="hidden-file" accept=".csv">
</div>

<!-- FORMULA BAR -->
<div id="fb">
  <div id="cell-addr">A1</div>
  <div id="fx-label">fx</div>
  <input id="formula-input" spellcheck="false" autocomplete="off">
</div>

<!-- GRID -->
<div id="grid-wrap">
  <div id="grid-scroll">
    <div id="corner"></div>
    <div id="grid-canvas"></div>
  </div>
</div>

<!-- SHEET TABS -->
<div id="sheet-bar">
  <div id="sheet-tabs"></div>
  <button id="add-sheet" title="New Sheet">+</button>
</div>

<!-- STATUS BAR -->
<div id="sb">
  <span id="sb-info">Ready</span>
  <span id="sb-stats"></span>
</div>

<!-- CONTEXT MENU -->
<div id="ctx"></div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════
   CONSTANTS
   ══════════════════════════════════════ */
var ROWS=100, COLS=26, DH=24, DW=80, HDRW=40, HDRH=25;

/* ══════════════════════════════════════
   STATE
   ══════════════════════════════════════ */
var sheets=[], activeSheet=0;
var sel={r:0,c:0}, selEnd={r:0,c:0}, anchor={r:0,c:0};
var editing=false, editCell=null, cellEditor=null;
var colWidths=[];

function makeCell(){return{raw:'',val:'',bold:false,italic:false,bg:'',color:'',align:'left',err:false};}

function makeSheet(name){
  var cells={};
  for(var r=0;r<ROWS;r++){cells[r]={};for(var c=0;c<COLS;c++)cells[r][c]=makeCell();}
  return{name:name,cells:cells};
}

function init(){
  sheets=[makeSheet('Sheet1'),makeSheet('Sheet2'),makeSheet('Sheet3')];
  activeSheet=0;
  colWidths=[];
  for(var c=0;c<COLS;c++) colWidths[c]=DW;
}

/* ══════════════════════════════════════
   UTILITIES
   ══════════════════════════════════════ */
function colName(c){
  var s='';c+=1;
  while(c>0){c--;s=String.fromCharCode(65+c%26)+s;c=Math.floor(c/26);}
  return s;
}
function parseColName(s){
  var n=0; s=s.toUpperCase();
  for(var i=0;i<s.length;i++) n=n*26+(s.charCodeAt(i)-64);
  return n-1;
}
function cellAddr(r,c){return colName(c)+(r+1);}
function parseAddr(s){
  var m=s.toUpperCase().match(/^([A-Z]+)(\d+)$/);
  if(!m)return null;
  var c=parseColName(m[1]),r=parseInt(m[2])-1;
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  return{r:r,c:c};
}

function colX(c){var x=HDRW;for(var i=0;i<c;i++)x+=colWidths[i];return x;}
function rowY(r){return HDRH+r*DH;}
function gridW(){return HDRW+colWidths.reduce(function(a,b){return a+b;},0);}
function gridH(){return HDRH+ROWS*DH;}
function sheet(){return sheets[activeSheet];}
function gc(r,c){return sheet().cells[r]&&sheet().cells[r][c];}
function ensureSize(r,c){
  var s=sheet();
  var mx=Math.max(r+1,ROWS),mc=Math.max(c+1,COLS);
  while(Object.keys(s.cells).length<mx){var nr=Object.keys(s.cells).length;s.cells[nr]={};for(var cc=0;cc<mc;cc++)s.cells[nr][cc]=makeCell();}
  for(var rr in s.cells) while(Object.keys(s.cells[rr]).length<mc){s.cells[rr][Object.keys(s.cells[rr]).length]=makeCell();}
}

function valToNum(v){
  if(typeof v==='number')return v;
  if(typeof v==='string'){var n=parseFloat(v);if(!isNaN(n))return n;}
  return NaN;
}

/* ══════════════════════════════════════
   FORMULA ENGINE
   ══════════════════════════════════════ */
var evalStack=[];

function computeCell(r,c){
  var cell=gc(r,c);
  if(!cell)return'';
  if(!cell.raw){cell.val='';cell.err=false;return'';}
  if(cell.raw[0]==='='){
    evalStack.push(r+','+c);
    try{cell.val=evalFormula(cell.raw.substring(1),r,c);cell.err=false;}
    catch(e){cell.val='#'+String(e).replace(/^Error:\s*/i,'');cell.err=true;}
    evalStack.pop();
  } else {
    cell.val=parseFloat(cell.raw)||cell.raw;
    cell.err=false;
  }
  return cell.val;
}

function evalFormula(expr,selfR,selfC){
  var pos=0; expr=expr.trim();

  function err(m){throw new Error(m);}
  function ch(){return pos<expr.length?expr[pos]:null;}
  function adv(){pos++;}
  function skip(){while(pos<expr.length&&/\s/.test(expr[pos]))pos++;}

  function parseExpr(){
    var v=parseTerm();skip();
    while(ch()==='+'||ch()==='-'){
      var op=ch();adv();
      var r=parseTerm();
      if(op==='+')v=valToNum(v)+valToNum(r);else v=valToNum(v)-valToNum(r);
      skip();
    }
    return v;
  }

  function parseTerm(){
    var v=parseUnary();skip();
    while(ch()==='*'||ch()==='/'){
      var op=ch();adv();
      var r=parseUnary();
      if(op==='*')v=valToNum(v)*valToNum(r);
      else{var d=valToNum(r);if(d===0)err('#DIV/0!');v=valToNum(v)/d;}
      skip();
    }
    return v;
  }

  function parseUnary(){
    skip();
    if(ch()==='-'){adv();return -valToNum(parseUnary());}
    if(ch()==='+'){adv();return valToNum(parseUnary());}
    return parsePrimary();
  }

  function readInt(){var s='';while(pos<expr.length&&/\d/.test(expr[pos]))s+=expr[pos++];return s;}
  function readAlpha(){var s='';while(pos<expr.length&&/[A-Za-z]/.test(expr[pos]))s+=expr[pos++];return s.toUpperCase();}

  function parsePrimary(){
    skip(); var c=ch(); if(c===null)err('#VALUE!');
    if((c>='0'&&c<='9')||c==='.'){return parseNum();}
    if(c==='('){adv();var v=parseExpr();skip();if(ch()!==')')err('Missing )');adv();return v;}
    if(c>='A'&&c<='Z'||c>='a'&&c<='z'){return parseFuncOrCell();}
    err('#VALUE!');
  }

  function parseNum(){
    var s='';
    while(pos<expr.length&&/\d/.test(expr[pos]))s+=expr[pos++];
    if(pos<expr.length&&expr[pos]==='.'){s+='.';pos++;while(pos<expr.length&&/\d/.test(expr[pos]))s+=expr[pos++];}
    if(pos<expr.length&&/[eE]/.test(expr[pos])){s+=expr[pos++];if(pos<expr.length&&/[+-]/.test(expr[pos]))s+=expr[pos++];while(pos<expr.length&&/\d/.test(expr[pos]))s+=expr[pos++];}
    return parseFloat(s);
  }

  function parseFuncOrCell(){
    var start=pos, name=readAlpha();
    // Check if cell ref: after letters there must be a digit
    var hasDigit=false,p2=pos;
    while(p2<expr.length&&/\d/.test(expr[p2])){hasDigit=true;p2++;}
    // If next is a letter (not digit), it's part of a function name
    if(!hasDigit){
      pos=start;name=readAlpha();
      // Must be function: next is (
      skip();if(ch()!=='(')err('#NAME?');
      return parseFunc(name);
    }
    // It's a cell reference
    var digits=readInt();
    var col=parseColName(name), row=parseInt(digits)-1;
    if(row<0||col<0)err('#REF!');
    ensureSize(row,col);
    // Check for range A1:B5
    skip();
    if(ch()===':'){
      adv();
      var rn=readAlpha(), rd=readInt();
      if(!rd)err('#REF!');
      var col2=parseColName(rn), row2=parseInt(rd)-1;
      if(row2<0||col2<0)err('#REF!');
      ensureSize(row2,col2);
      return[r,col,row2,col2]; // Return range tuple
    }
    // Check self-reference
    if(row===selfR&&col===selfC)err('#REF!');
    if(evalStack.indexOf(row+','+col)>=0)err('#CIRC!');
    return computeCell(row,col);
  }

  function parseFunc(fname){
    adv(); // skip (
    var args=[];
    skip();
    if(ch()!==')'){
      args.push(parseExpr());
      skip();
      while(ch()===','){adv();args.push(parseExpr());skip();}
    }
    if(ch()!==')')err('Missing ) for '+fname);
    adv();
    return callFunc(fname,args);
  }

  function flattenArgs(args){
    var vals=[];
    args.forEach(function(a){
      if(Array.isArray(a)){
        var r1=a[0],c1=a[1],r2=a[2],c2=a[3];
        var minR=Math.min(r1,r2),maxR=Math.max(r1,r2);
        var minC=Math.min(c1,c2),maxC=Math.max(c1,c2);
        for(var r=minR;r<=maxR;r++)for(var c=minC;c<=maxC;c++){
          var v=computeCell(r,c);
          if(v!==''&&v!==null&&v!==undefined)vals.push(v);
        }
      } else if(a!==''&&a!==null&&a!==undefined){vals.push(a);}
    });
    return vals;
  }

  function numVals(args){
    return flattenArgs(args).map(valToNum).filter(function(n){return !isNaN(n);});
  }

  function callFunc(fname,args){
    var nums;
    switch(fname){
      case 'SUM': nums=numVals(args);return nums.reduce(function(a,b){return a+b;},0);
      case 'AVERAGE': nums=numVals(args);if(!nums.length)err('#DIV/0!');return nums.reduce(function(a,b){return a+b;},0)/nums.length;
      case 'MIN': nums=numVals(args);if(!nums.length)return 0;return Math.min.apply(null,nums);
      case 'MAX': nums=numVals(args);if(!nums.length)return 0;return Math.max.apply(null,nums);
      case 'COUNT': return numVals(args).length;
      case 'COUNTA': return flattenArgs(args).length;
      case 'ABS': return Math.abs(valToNum(args[0]));
      case 'SQRT': var sv=valToNum(args[0]);if(sv<0)err('#NUM!');return Math.sqrt(sv);
      case 'ROUND': return Math.round(valToNum(args[0])*Math.pow(10,valToNum(args[1]||0)))/Math.pow(10,valToNum(args[1]||0));
      case 'POWER': return Math.pow(valToNum(args[0]),valToNum(args[1]));
      case 'INT': return Math.floor(valToNum(args[0]));
      case 'MOD': var md=valToNum(args[1]);if(md===0)err('#DIV/0!');return valToNum(args[0])%md;
      case 'IF': return args[0]&&args[0]!==0&&args[0]!==''?args[1]:args[2];
      case 'LEN': return String(args[0]).length;
      case 'CONCAT': case 'CONCATENATE': return args.map(function(a){return String(a);}).join('');
      case 'LEFT': return String(args[0]).substring(0,valToNum(args[1]||1));
      case 'RIGHT': var st=String(args[0]),n2=valToNum(args[1]||1);return st.substring(st.length-n2);
      case 'MID': return String(args[0]).substring(valToNum(args[1])-1,valToNum(args[1])-1+valToNum(args[2]));
      case 'UPPER': return String(args[0]).toUpperCase();
      case 'LOWER': return String(args[0]).toLowerCase();
      case 'TRIM': return String(args[0]).trim();
      case 'PI': return Math.PI;
      case 'NOW': return new Date().toLocaleString();
      case 'TODAY': return new Date().toLocaleDateString();
      default: err('#NAME?');
    }
  }

  return parseExpr();
}

/* ══════════════════════════════════════
   RECALCULATION
   ══════════════════════════════════════ */
function recalcAll(){
  var s=sheet();
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var cell=s.cells[r]&&s.cells[r][c];
    if(cell&&cell.raw) computeCell(r,c);
  }
}

function recalcDependents(r,c){
  recalcAll(); // Simple approach: recalc everything
}

/* ══════════════════════════════════════
   GRID RENDERING
   ══════════════════════════════════════ */
var gc_el=document.getElementById('grid-canvas');
var gs_el=document.getElementById('grid-scroll');
var rendered={};
var activeEditor=null;

function renderGrid(){
  // Update canvas size
  gc_el.style.width=gridW()+'px';
  gc_el.style.height=gridH()+'px';

  var sv=gs_el.scrollTop, sh=gs_el.scrollLeft;
  var vw=gs_el.clientWidth, vh=gs_el.clientHeight;

  // Compute visible range
  var startR=0,endR=ROWS-1,startC=0,endC=COLS-1;
  var cumY=HDRH;
  for(var r=0;r<ROWS;r++){if(cumY+DH>sv&&startR===0)startR=r;cumY+=DH;if(cumY>sv+vh){endR=r;break;}}
  var cumX=HDRW;
  for(var c=0;c<COLS;c++){if(cumX+colWidths[c]>sh&&startC===0)startC=c;cumX+=colWidths[c];if(cumX>sh+vw){endC=c;break;}}
  endR=Math.min(endR+2,ROWS-1);endC=Math.min(endC+1,COLS-1);

  // Build new render map
  var need={};

  // Corner
  need['corner']=true;
  if(!rendered['corner']){
    var el=document.createElement('div');
    el.className='cell';el.id='r-corner';
    el.style.cssText='left:0;top:0;width:'+HDRW+'px;height:'+HDRH+'px;';
    el.classList.add('chdr');el.classList.add('rhdr');
    gc_el.appendChild(el);
    rendered['corner']=el;
  }

  // Column headers
  for(var c=startC;c<=endC;c++){
    var key='ch'+c; need[key]=true;
    if(!rendered[key]){
      var el=document.createElement('div');
      el.className='cell chdr';
      el.style.cssText='left:'+colX(c)+'px;top:0;width:'+colWidths[c]+'px;height:'+HDRH+'px;';
      el.textContent=colName(c);
      el.dataset.col=c;
      // Resize handle
      var handle=document.createElement('div');
      handle.className='col-resize-handle';
      handle.dataset.col=c;
      el.appendChild(handle);
      gc_el.appendChild(el);
      rendered[key]=el;
    } else {
      var el=rendered[key];
      el.style.left=colX(c)+'px';
      el.style.width=colWidths[c]+'px';
    }
  }

  // Row headers
  for(var r=startR;r<=endR;r++){
    var key='rh'+r; need[key]=true;
    if(!rendered[key]){
      var el=document.createElement('div');
      el.className='cell rhdr';
      el.style.cssText='left:0;top:'+rowY(r)+'px;width:'+HDRW+'px;height:'+DH+'px;';
      el.textContent=r+1;
      gc_el.appendChild(el);
      rendered[key]=el;
    } else {
      rendered[key].style.top=rowY(r)+'px';
    }
  }

  // Data cells
  var s=sheet();
  for(var r=startR;r<=endR;r++){
    for(var c=startC;c<=endC;c++){
      var key='c'+r+'_'+c; need[key]=true;
      var cell=s.cells[r]&&s.cells[r][c];
      if(!cell) continue;

      var el;
      if(!rendered[key]){
        el=document.createElement('div');
        el.className='cell';
        el.dataset.row=r;el.dataset.col=c;
        gc_el.appendChild(el);
        rendered[key]=el;
      } else {
        el=rendered[key];
      }

      // Position
      el.style.left=colX(c)+'px';
      el.style.top=rowY(r)+'px';
      el.style.width=colWidths[c]+'px';
      el.style.height=DH+'px';

      // Content
      var display='';
      if(cell.val!==undefined&&cell.val!==null){
        display=typeof cell.val==='number'?formatNum(cell.val):String(cell.val);
      }
      if(display!==el.textContent) el.textContent=display;

      // Styles
      el.style.fontWeight=cell.bold?'bold':'';
      el.style.fontStyle=cell.italic?'italic':'';
      el.style.background=cell.bg||'';
      el.style.color=cell.color||'';
      el.style.textAlign=cell.align||'left';
      if(cell.err) el.style.color='#cc0000';

      // Selection highlight
      var inSel=isInSelection(r,c);
      var isCurrent=(r===sel.r&&c===sel.c);
      el.classList.toggle('in-range',inSel&&!isCurrent&&!editing);
      el.classList.toggle('sel-cell',isCurrent&&!editing);
    }
  }

  // Remove old elements
  for(var key in rendered){
    if(!need[key]){
      rendered[key].remove();
      delete rendered[key];
    }
  }

  // Update selection handle
  updateSelHandle();
  updateFormulaBar();
  updateStatusBar();
}

function formatNum(n){
  if(n===0)return'0';
  if(Number.isInteger(n))return n.toString();
  return parseFloat(n.toPrecision(10)).toString();
}

function isInSelection(r,c){
  var minR=Math.min(sel.r,selEnd.r),maxR=Math.max(sel.r,selEnd.r);
  var minC=Math.min(sel.c,selEnd.c),maxC=Math.max(sel.c,selEnd.c);
  return r>=minR&&r<=maxR&&c>=minC&&c<=maxC;
}

function updateSelHandle(){
  // Remove old handle
  var old=document.getElementById('sel-handle');
  if(old) old.remove();

  if(editing) return;

  var el=rendered['c'+sel.r+'_'+sel.c];
  if(!el) return;

  var handle=document.createElement('div');
  handle.className='selection-handle';
  handle.id='sel-handle';
  el.appendChild(handle);
}

/* ══════════════════════════════════════
   FORMULA BAR
   ══════════════════════════════════════ */
var addrEl=document.getElementById('cell-addr');
var formulaEl=document.getElementById('formula-input');

function updateFormulaBar(){
  addrEl.textContent=cellAddr(sel.r,sel.c);
  if(!editing){
    var cell=gc(sel.r,sel.c);
    formulaEl.value=cell?cell.raw:'';
  }
}

formulaEl.addEventListener('focus',function(){
  if(!editing) startEdit();
});

formulaEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    e.preventDefault();
    commitEdit();
    moveTo(sel.r+1,sel.c);
    renderGrid();
  } else if(e.key==='Escape'){
    cancelEdit();
  } else if(e.key==='Tab'){
    e.preventDefault();
    commitEdit();
    moveTo(sel.r,sel.c+(e.shiftKey?-1:1));
    renderGrid();
  }
});

formulaEl.addEventListener('input',function(){
  if(!editing) startEdit();
  if(activeEditor) activeEditor.value=formulaEl.value;
});

/* ══════════════════════════════════════
   CELL EDITING
   ══════════════════════════════════════ */
function startEdit(clearContent){
  if(editing) return;
  editing=true;
  editCell={r:sel.r,c:sel.c};
  var cell=gc(sel.r,sel.c);

  // Create inline editor
  var el=rendered['c'+sel.r+'_'+sel.c];
  if(el){
    el.classList.add('editing');
    el.classList.remove('sel-cell');
    el.classList.remove('in-range');

    var editor=document.createElement('textarea');
    editor.className='cell-editor';
    editor.style.left=el.style.left;
    editor.style.top=el.style.top;
    editor.style.width=Math.max(colWidths[sel.c],100)+'px';
    editor.style.height=DH+'px';
    editor.value=clearContent?'':(cell?cell.raw:'');
    editor.style.fontWeight=cell&&cell.bold?'bold':'normal';
    editor.style.fontStyle=cell&&cell.italic?'italic':'normal';
    editor.style.textAlign=cell?cell.align:'left';

    editor.addEventListener('input',function(){
      formulaEl.value=editor.value;
      autoResizeEditor(editor);
    });
    editor.addEventListener('keydown',function(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitEdit();moveTo(sel.r+1,sel.c);renderGrid();}
      else if(e.key==='Escape'){cancelEdit();}
      else if(e.key==='Tab'){e.preventDefault();commitEdit();moveTo(sel.r,sel.c+(e.shiftKey?-1:1));renderGrid();}
      e.stopPropagation();
    });

    gc_el.appendChild(editor);
    activeEditor=editor;
    editor.focus();
    if(!clearContent) editor.select();
  }

  formulaEl.value=clearContent?'':(cell?cell.raw:'');
  document.getElementById('sb-info').textContent='Edit';
}

function autoResizeEditor(editor){
  editor.style.height='1px';
  editor.style.height=Math.max(DH,editor.scrollHeight)+'px';
}

function commitEdit(){
  if(!editing) return;
  var r=editCell.r, c=editCell.c;
  var cell=gc(r,c);
  var val=activeEditor?activeEditor.value:formulaEl.value;

  if(cell){
    cell.raw=val;
    computeCell(r,c);
    recalcDependents(r,c);
  }

  cleanupEditor();
  editing=false;
  editCell=null;
  updateFormulaBar();
  renderGrid();
  document.getElementById('sb-info').textContent='Ready';
}

function cancelEdit(){
  cleanupEditor();
  editing=false;
  editCell=null;
  updateFormulaBar();
  renderGrid();
  document.getElementById('sb-info').textContent='Ready';
}

function cleanupEditor(){
  if(activeEditor){activeEditor.remove();activeEditor=null;}
  var el=rendered['c'+sel.r+'_'+sel.c];
  if(el) el.classList.remove('editing');
}

/* ══════════════════════════════════════
   NAVIGATION
   ══════════════════════════════════════ */
function moveTo(r,c){
  r=Math.max(0,Math.min(ROWS-1,r));
  c=Math.max(0,Math.min(COLS-1,c));
  sel.r=r;sel.c=c;selEnd.r=r;selEnd.c=c;anchor.r=r;anchor.c=c;
  scrollTo(r,c);
}

function scrollTo(r,c){
  var y=rowY(r), x=colX(c);
  var vh=gs_el.clientHeight-HDRH, vw=gs_el.clientWidth-HDRW;
  if(y+DH>gs_el.scrollTop+vh) gs_el.scrollTop=y+DH-vh;
  if(y<gs_el.scrollTop+HDRH) gs_el.scrollTop=y;
  if(x+colWidths[c]>gs_el.scrollLeft+vw) gs_el.scrollLeft=x+colWidths[c]-vw;
  if(x<gs_el.scrollLeft+HDRW) gs_el.scrollLeft=x;
}

/* ══════════════════════════════════════
   STATUS BAR
   ══════════════════════════════════════ */
function updateStatusBar(){
  var minR=Math.min(sel.r,selEnd.r),maxR=Math.max(sel.r,selEnd.r);
  var minC=Math.min(sel.c,selEnd.c),maxC=Math.max(sel.c,selEnd.c);
  var count=(maxR-minR+1)*(maxC-minC+1);
  var info=count+' cell'+(count>1?'s':'');
  var sum=0,cnt=0;
  for(var r=minR;r<=maxR;r++)for(var c=minC;c<=maxC;c++){
    var cell=gc(r,c);
    if(cell&&cell.val!==''&&cell.val!==undefined){
      var n=valToNum(cell.val);
      if(!isNaN(n)){sum+=n;cnt++;}
    }
  }
  var stats='';
  if(cnt>0){stats='Average: '+formatNum(sum/cnt)+'    Count: '+cnt+'    Sum: '+formatNum(sum);}
  else if(count===1){var cell=gc(sel.r,sel.c);stats=cell&&cell.val!==''?'Value: '+cell.val:'';}
  document.getElementById('sb-stats').textContent=stats;
}

/* ══════════════════════════════════════
   SHEET TABS
   ══════════════════════════════════════ */
function renderSheetTabs(){
  var cont=document.getElementById('sheet-tabs');
  cont.innerHTML='';
  sheets.forEach(function(s,i){
    var tab=document.createElement('div');
    tab.className='stab'+(i===activeSheet?' active':'');
    tab.textContent=s.name;
    tab.addEventListener('click',function(){
      if(editing) commitEdit();
      activeSheet=i;
      renderSheetTabs();
      renderGrid();
    });
    tab.addEventListener('dblclick',function(e){
      e.stopPropagation();
      renameSheet(i,tab);
    });
    if(sheets.length>1){
      var x=document.createElement('span');
      x.className='stab-x';x.textContent='×';
      x.addEventListener('click',function(e){
        e.stopPropagation();
        deleteSheet(i);
      });
      tab.appendChild(x);
    }
    cont.appendChild(tab);
  });
}

document.getElementById('add-sheet').addEventListener('click',function(){
  var name='Sheet'+(sheets.length+1);
  sheets.push(makeSheet(name));
  activeSheet=sheets.length-1;
  renderSheetTabs();
  renderGrid();
});

function renameSheet(idx,tabEl){
  var inp=document.createElement('input');
  inp.className='stab-rename';inp.value=sheets[idx].name;
  tabEl.textContent='';tabEl.appendChild(inp);
  inp.focus();inp.select();
  function done(){
    var name=inp.value.trim()||sheets[idx].name;
    sheets[idx].name=name;
    renderSheetTabs();
  }
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter') done();
    if(e.key==='Escape'){renderSheetTabs();}
    e.stopPropagation();
  });
}

function deleteSheet(idx){
  if(sheets.length<=1) return;
  sheets.splice(idx,1);
  if(activeSheet>=sheets.length) activeSheet=sheets.length-1;
  renderSheetTabs();
  renderGrid();
}

/* ══════════════════════════════════════
   MOUSE EVENTS
   ══════════════════════════════════════ */
var selecting=false, resizingCol=-1, resizeStartX=0, resizeStartW=0;

gc_el.addEventListener('mousedown',function(e){
  var t=e.target;

  // Column resize
  if(t.classList.contains('col-resize-handle')){
    resizingCol=parseInt(t.dataset.col);
    resizeStartX=e.clientX;
    resizeStartW=colWidths[resizingCol];
    e.preventDefault();
    return;
  }

  // Cell click
  var cellEl=t.classList.contains('cell')?t:t.closest&&t.closest('.cell');
  if(cellEl&&cellEl.dataset.row!==undefined){
    var r=parseInt(cellEl.dataset.row), c=parseInt(cellEl.dataset.col);
    if(editing) commitEdit();
    if(e.shiftKey){
      selEnd.r=r;selEnd.c=c;
    } else {
      sel.r=r;sel.c=c;selEnd.r=r;selEnd.c=c;anchor.r=r;anchor.c=c;
    }
    selecting=true;
    renderGrid();
    e.preventDefault();
    return;
  }
});

document.addEventListener('mousemove',function(e){
  // Column resize
  if(resizingCol>=0){
    var dx=e.clientX-resizeStartX;
    colWidths[resizingCol]=Math.max(30,resizeStartW+dx);
    renderGrid();
    e.preventDefault();
    return;
  }

  // Cell selection drag
  if(selecting){
    var rect=gc_el.getBoundingClientRect();
    var x=e.clientX-rect.left+gs_el.scrollLeft-HDRW;
    var y=e.clientY-rect.top+gs_el.scrollTop-HDRH;
    var c=colAtX(x), r=rowAtY(y);
    if(c>=0&&r>=0&&c<COLS&&r<ROWS){
      selEnd.r=r;selEnd.c=c;
      renderGrid();
    }
    e.preventDefault();
  }
});

document.addEventListener('mouseup',function(){
  selecting=false;
  resizingCol=-1;
});

function colAtX(x){
  var cum=0;
  for(var c=0;c<COLS;c++){
    cum+=colWidths[c];
    if(x<cum) return c;
  }
  return COLS-1;
}

function rowAtY(y){
  var r=Math.floor(y/DH);
  return Math.max(0,Math.min(ROWS-1,r));
}

// Double-click to edit
gc_el.addEventListener('dblclick',function(e){
  var cellEl=e.target.classList.contains('cell')?e.target:e.target.closest&&e.target.closest('.cell');
  if(cellEl&&cellEl.dataset.row!==undefined){
    var r=parseInt(cellEl.dataset.row), c=parseInt(cellEl.dataset.col);
    sel.r=r;sel.c=c;selEnd.r=r;selEnd.c=c;
    startEdit();
    renderGrid();
  }
});

/* ══════════════════════════════════════
   KEYBOARD EVENTS
   ══════════════════════════════════════ */
document.addEventListener('keydown',function(e){
  // Don't capture when editing in formula bar
  if(document.activeElement===formulaEl&&!editing){
    if(e.key==='Enter'){e.preventDefault();startEdit();return;}
    if(e.key==='Escape'){formulaEl.blur();return;}
    return;
  }

  if(editing) return; // Let editor handle keys

  var ctrl=e.ctrlKey||e.metaKey;

  // Navigation
  if(e.key==='ArrowUp'){e.preventDefault();moveTo(sel.r-1,sel.c);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='ArrowDown'){e.preventDefault();moveTo(sel.r+1,sel.c);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='ArrowLeft'){e.preventDefault();moveTo(sel.r,sel.c-1);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='ArrowRight'){e.preventDefault();moveTo(sel.r,sel.c+1);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='Tab'){e.preventDefault();moveTo(sel.r,sel.c+(e.shiftKey?-1:1));selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='Enter'){e.preventDefault();moveTo(sel.r+1,sel.c);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='Home'){e.preventDefault();if(ctrl)moveTo(0,0);else moveTo(sel.r,0);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='End'){e.preventDefault();moveTo(sel.r,COLS-1);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='PageDown'){e.preventDefault();moveTo(sel.r+20,sel.c);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='PageUp'){e.preventDefault();moveTo(sel.r-20,sel.c);selEnd.r=sel.r;selEnd.c=sel.c;renderGrid();}
  else if(e.key==='Delete'||e.key==='Backspace'){
    e.preventDefault();
    clearSelection();
    renderGrid();
  }
  else if(e.key==='F2'){e.preventDefault();startEdit();renderGrid();}
  // Ctrl shortcuts
  else if(ctrl&&e.key==='b'){e.preventDefault();toggleBold();}
  else if(ctrl&&e.key==='i'){e.preventDefault();toggleItalic();}
  else if(ctrl&&e.key==='c'){/* Let browser handle copy */}
  else if(ctrl&&e.key==='v'){/* Let browser handle paste */}
  else if(ctrl&&e.key==='z'){/* Could add undo */}
  else if(e.key.length===1&&!ctrl){
    startEdit(true);
    // The character will be typed into the editor
    if(activeEditor) activeEditor.value=e.key;
    formulaEl.value=e.key;
  }
});

/* ══════════════════════════════════════
   TOOLBAR
   ══════════════════════════════════════ */
function applyToSelection(fn){
  var minR=Math.min(sel.r,selEnd.r),maxR=Math.max(sel.r,selEnd.r);
  var minC=Math.min(sel.c,selEnd.c),maxC=Math.max(sel.c,selEnd.c);
  for(var r=minR;r<=maxR;r++) for(var c=minC;c<=maxC;c++){
    var cell=gc(r,c);if(cell) fn(cell);
  }
  renderGrid();
}

function toggleBold(){applyToSelection(function(c){c.bold=!c.bold;});}
function toggleItalic(){applyToSelection(function(c){c.italic=!c.italic;});}
function clearSelection(){
  applyToSelection(function(c){c.raw='';c.val='';c.err=false;});
  recalcAll();
}

document.getElementById('btn-b').addEventListener('click',toggleBold);
document.getElementById('btn-i').addEventListener('click',toggleItalic);
document.getElementById('btn-al').addEventListener('click',function(){applyToSelection(function(c){c.align='left';});});
document.getElementById('btn-ac').addEventListener('click',function(){applyToSelection(function(c){c.align='center';});});
document.getElementById('btn-ar').addEventListener('click',function(){applyToSelection(function(c){c.align='right';});});
document.getElementById('btn-clr').addEventListener('click',clearSelection);
document.getElementById('inp-bg').addEventListener('input',function(e){applyToSelection(function(c){c.bg=e.target.value;});});
document.getElementById('inp-fg').addEventListener('input',function(e){applyToSelection(function(c){c.color=e.target.value;});});
document.getElementById('font-fam').addEventListener('change',function(e){
  // Store font in a custom property (rendering doesn't apply it per-cell easily, but we track it)
  applyToSelection(function(c){c.fontFamily=e.target.value;});
});
document.getElementById('font-sz').addEventListener('change',function(e){
  applyToSelection(function(c){c.fontSize=e.target.value+'px';});
});

/* ══════════════════════════════════════
   CSV EXPORT / IMPORT
   ══════════════════════════════════════ */
document.getElementById('btn-csv-dl').addEventListener('click',function(){
  var s=sheet();
  var maxR=0,maxC=0;
  for(var r=0;r<ROWS;r++) for(var c=0;c<COLS;c++){
    var cell=s.cells[r]&&s.cells[r][c];
    if(cell&&cell.raw){maxR=Math.max(maxR,r);maxC=Math.max(maxC,c);}
  }
  var lines=[];
  for(var r=0;r<=maxR;r++){
    var row=[];
    for(var c=0;c<=maxC;c++){
      var cell=s.cells[r]&&s.cells[r][c];
      var v=cell?cell.val:'';
      if(typeof v==='string'&&(v.includes(',')||v.includes('"')||v.includes('\n'))){
        v='"'+v.replace(/"/g,'""')+'"';
      }
      row.push(v);
    }
    lines.push(row.join(','));
  }
  var csv=lines.join('\n');
  var blob=new Blob([csv],{type:'text/csv'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=s.name+'.csv';a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-csv-ul').addEventListener('click',function(){
  document.getElementById('csv-file').click();
});

document.getElementById('csv-file').addEventListener('change',function(e){
  var file=e.target.files[0]; if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var text=ev.target.result;
    var lines=text.split('\n');
    var s=sheet();
    for(var r=0;r<lines.length&&r<ROWS;r++){
      var cols=parseCSVLine(lines[r]);
      for(var c=0;c<cols.length&&c<COLS;c++){
        if(!s.cells[r]) s.cells[r]={};
        if(!s.cells[r][c]) s.cells[r][c]=makeCell();
        s.cells[r][c].raw=cols[c];
        computeCell(r,c);
      }
    }
    recalcAll();
    renderGrid();
  };
  reader.readAsText(file);
  e.target.value='';
});

function parseCSVLine(line){
  var result=[], current='', inQuote=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(inQuote){
      if(c==='"'&&line[i+1]==='"'){current+='"';i++;}
      else if(c==='"'){inQuote=false;}
      else{current+=c;}
    } else {
      if(c==='"'){inQuote=true;}
      else if(c===','){result.push(current);current='';}
      else{current+=c;}
    }
  }
  result.push(current);
  return result;
}

/* ══════════════════════════════════════
   CONTEXT MENU (for grid)
   ══════════════════════════════════════ */
var ctxEl=document.getElementById('ctx');
gc_el.addEventListener('contextmenu',function(e){
  e.preventDefault();
  var cellEl=e.target.classList.contains('cell')?e.target:e.target.closest&&e.target.closest('.cell');
  if(cellEl&&cellEl.dataset.row!==undefined){
    var r=parseInt(cellEl.dataset.row),c=parseInt(cellEl.dataset.col);
    if(!isInSelection(r,c)){sel.r=r;sel.c=c;selEnd.r=r;selEnd.c=c;anchor.r=r;anchor.c=c;renderGrid();}
  }
  ctxEl.innerHTML=
    '<div onclick="ctxCut()">Cut</div>'+
    '<div onclick="ctxCopy()">Copy</div>'+
    '<div onclick="ctxPaste()">Paste</div>'+
    '<div class="csep"></div>'+
    '<div onclick="ctxInsertRow()">Insert Row</div>'+
    '<div onclick="ctxInsertCol()">Insert Column</div>'+
    '<div class="csep"></div>'+
    '<div onclick="ctxDeleteRow()">Delete Row</div>'+
    '<div onclick="ctxDeleteCol()">Delete Column</div>'+
    '<div class="csep"></div>'+
    '<div onclick="clearSelection();renderGrid();hideCtx();">Clear Contents</div>';
  ctxEl.style.left=Math.min(e.clientX,innerWidth-180)+'px';
  ctxEl.style.top=Math.min(e.clientY,innerHeight-200)+'px';
  ctxEl.classList.add('show');
});

function hideCtx(){ctxEl.classList.remove('show');}
document.addEventListener('click',hideCtx);
document.addEventListener('contextmenu',function(e){
  if(!e.target.closest('#grid-canvas')) hideCtx();
});

window.ctxCut=function(){ctxCopy();clearSelection();renderGrid();hideCtx();};
window.ctxCopy=function(){
  var minR=Math.min(sel.r,selEnd.r),maxR=Math.max(sel.r,selEnd.r);
  var minC=Math.min(sel.c,selEnd.c),maxC=Math.max(sel.c,selEnd.c);
  var lines=[];
  for(var r=minR;r<=maxR;r++){
    var row=[];
    for(var c=minC;c<=maxC;c++){
      var cell=gc(r,c);
      row.push(cell?String(cell.val):'');
    }
    lines.push(row.join('\t'));
  }
  navigator.clipboard.writeText(lines.join('\n')).catch(function(){});
  hideCtx();
};
window.ctxPaste=function(){
  navigator.clipboard.readText().then(function(text){
    var lines=text.split('\n');
    for(var r=0;r<lines.length;r++){
      var cols=lines[r].split('\t');
      for(var c=0;c<cols.length;c++){
        var tr=sel.r+r,tc=sel.c+c;
        if(tr<ROWS&&tc<COLS){
          var cell=gc(tr,tc);
          if(cell){cell.raw=cols[c];computeCell(tr,tc);}
        }
      }
    }
    recalcAll();renderGrid();
  }).catch(function(){});
  hideCtx();
};
window.ctxInsertRow=function(){
  var s=sheet();
  var insR=sel.r;
  for(var r=ROWS-1;r>insR;r--){
    s.cells[r]={};
    for(var c=0;c<COLS;c++){
      s.cells[r][c]=s.cells[r-1]&&s.cells[r-1][c]?Object.assign({},s.cells[r-1][c]):makeCell();
    }
  }
  s.cells[insR]={};
  for(var c=0;c<COLS;c++) s.cells[insR][c]=makeCell();
  recalcAll();renderGrid();hideCtx();
};
window.ctxDeleteRow=function(){
  var s=sheet();
  var delR=sel.r;
  for(var r=delR;r<ROWS-1;r++){
    s.cells[r]={};
    for(var c=0;c<COLS;c++){
      s.cells[r][c]=s.cells[r+1]&&s.cells[r+1][c]?Object.assign({},s.cells[r+1][c]):makeCell();
    }
  }
  s.cells[ROWS-1]={};
  for(var c=0;c<COLS;c++) s.cells[ROWS-1][c]=makeCell();
  recalcAll();renderGrid();hideCtx();
};
window.ctxInsertCol=function(){
  var s=sheet();
  var insC=sel.c;
  for(var r=0;r<ROWS;r++){
    for(var c=COLS-1;c>insC;c--){
      if(!s.cells[r]) s.cells[r]={};
      s.cells[r][c]=s.cells[r]&&s.cells[r][c-1]?Object.assign({},s.cells[r][c-1]):makeCell();
    }
    s.cells[r][insC]=makeCell();
  }
  colWidths.splice(insC,0,DW);
  recalcAll();renderGrid();hideCtx();
};
window.ctxDeleteCol=function(){
  var s=sheet();
  var delC=sel.c;
  for(var r=0;r<ROWS;r++){
    for(var c=delC;c<COLS-1;c++){
      s.cells[r][c]=s.cells[r]&&s.cells[r][c+1]?Object.assign({},s.cells[r][c+1]):makeCell();
    }
    s.cells[r][COLS-1]=makeCell();
  }
  recalcAll();renderGrid();hideCtx();
};
