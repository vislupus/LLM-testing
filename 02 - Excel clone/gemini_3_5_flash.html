<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spreadsheet - Advanced Web Application</title>
    <style>
        :root {
            --primary-color: #107c41; /* Excel Green */
            --primary-hover: #0ea652;
            --border-color: #d1d1d1;
            --grid-border-color: #e1e1e1;
            --header-bg: #f3f3f3;
            --header-selected: #e2e2e2;
            --cell-selected: #e9f5ed;
            --selection-border: #107c41;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 13px;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            color: var(--text-color);
            background-color: #ffffff;
            user-select: none;
        }

        /* Toolbar styles */
        .toolbar {
            background-color: #f9f9f9;
            border-bottom: 1px solid var(--border-color);
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            height: 26px;
        }

        .btn:hover {
            background-color: #f0f0f0;
        }

        .btn.active {
            background-color: #d7ebd9;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .toolbar-divider {
            width: 1px;
            height: 20px;
            background-color: var(--border-color);
            margin: 0 4px;
        }

        .color-picker-wrapper {
            position: relative;
            display: inline-block;
        }

        .color-picker-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            cursor: pointer;
        }

        /* Formula Bar styles */
        .formula-zone {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
            padding: 4px 8px;
            gap: 6px;
            height: 34px;
        }

        #cell-address {
            width: 60px;
            height: 26px;
            border: 1px solid var(--border-color);
            background-color: var(--header-bg);
            text-align: center;
            font-weight: 600;
            line-height: 24px;
            border-radius: 3px;
        }

        .formula-fx {
            font-style: italic;
            font-weight: bold;
            color: #777;
            padding: 0 4px;
            font-size: 14px;
        }

        #formula-input {
            flex: 1;
            height: 26px;
            border: 1px solid var(--border-color);
            padding: 0 8px;
            border-radius: 3px;
            outline: none;
        }

        #formula-input:focus {
            border-color: var(--primary-color);
        }

        /* Grid Containment Engine */
        .grid-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background-color: #f8f9fa;
        }

        table {
            border-collapse: collapse;
            table-layout: fixed;
            background-color: white;
        }

        th, td {
            border: 1px solid var(--grid-border-color);
            position: relative;
        }

        /* Headers */
        th {
            background-color: var(--header-bg);
            font-weight: normal;
            color: #555;
            text-align: center;
            vertical-align: middle;
            font-size: 12px;
        }

        .row-header {
            width: 40px;
            text-align: center;
            border-right: 1px solid var(--border-color);
            position: sticky;
            left: 0;
            z-index: 3;
        }

        .col-header {
            height: 25px;
            position: sticky;
            top: 0;
            z-index: 3;
        }

        .corner-header {
            position: sticky;
            top: 0;
            left: 0;
            z-index: 5;
            background-color: var(--border-color);
            width: 40px;
            height: 25px;
        }

        .col-header.selected-header, .row-header.selected-header {
            background-color: var(--header-selected);
            color: var(--primary-color);
            font-weight: bold;
        }

        /* Column Resizing Handles */
        .col-resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            z-index: 4;
        }
        .col-resize-handle:hover {
            background-color: var(--primary-color);
        }

        /* Cellular Grid Entities */
        .cell {
            padding: 2px 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: clip;
            vertical-align: bottom;
            outline: none;
            cursor: cell;
        }

        .cell.selected {
            background-color: var(--cell-selected);
        }

        /* Visual Selection Outlines via borders */
        .cell.sel-top { border-top: 2px solid var(--selection-border) !important; }
        .cell.sel-bottom { border-bottom: 2px solid var(--selection-border) !important; }
        .cell.sel-left { border-left: 2px solid var(--selection-border) !important; }
        .cell.sel-right { border-right: 2px solid var(--selection-border) !important; }

        .cell.edit-mode {
            background-color: #ffffff !important;
            border: 2px solid var(--primary-color) !important;
            color: #000000 !important;
            cursor: text;
            user-select: text;
        }

        /* Sheet Tab Zone */
        .sheet-bar {
            height: 32px;
            background-color: #f3f3f3;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 4px;
            z-index: 10;
        }

        .tabs-container {
            display: flex;
            align-items: center;
            height: 100%;
            overflow-x: auto;
        }

        .sheet-tab {
            padding: 0 16px;
            height: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #e1e1e1;
            border-right: 1px solid var(--border-color);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .sheet-tab:hover {
            background-color: #eaeaea;
        }

        .sheet-tab.active {
            background-color: #ffffff;
            border-bottom: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: 600;
        }

        .tab-close {
            font-size: 11px;
            color: #888;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tab-close:hover {
            background-color: #ddd;
            color: #333;
        }

        .add-tab-btn {
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-tab-btn:hover {
            color: var(--primary-color);
        }

        /* Hide native file selector */
        #upload-file {
            display: none;
        }
    </style>
</head>
<body>

    <!-- Toolbar Elements -->
    <div class="toolbar">
        <button class="btn btn-primary" id="btn-upload" onclick="document.getElementById('upload-file').click()">Upload CSV</button>
        <input type="file" id="upload-file" accept=".csv" onchange="Spreadsheet.importCSV(this)">
        <button class="btn btn-primary" id="btn-download" onclick="Spreadsheet.exportCSV()">Download as CSV</button>
        
        <div class="toolbar-divider"></div>
        
        <button class="btn" id="btn-bold" onclick="Spreadsheet.toggleFormat('bold')"><b>B</b></button>
        <button class="btn" id="btn-italic" onclick="Spreadsheet.toggleFormat('italic')"><i>I</i></button>
        
        <div class="color-picker-wrapper">
            <button class="btn" id="btn-bg-color">Fill Color</button>
            <input type="color" class="color-picker-input" id="bg-color-picker" onchange="Spreadsheet.applyBgColor(this.value)" value="#ffffff">
        </div>

        <button class="btn" id="btn-clear" onclick="Spreadsheet.clearSelectionData()">Clear Contents</button>
    </div>

    <!-- Formula Controller Bar -->
    <div class="formula-zone">
        <div id="cell-address">A1</div>
        <div class="formula-fx">fx</div>
        <input type="text" id="formula-input" placeholder="" autocomplete="off">
    </div>

    <!-- Main Active Matrix Grid Window -->
    <div class="grid-container" id="grid-wrapper">
        <table id="spreadsheet-table">
            <thead id="grid-header"></thead>
            <tbody id="grid-body"></tbody>
        </table>
    </div>

    <!-- Tab Strip Container -->
    <div class="sheet-bar">
        <div class="tabs-container" id="tabs-box"></div>
        <button class="add-tab-btn" onclick="Spreadsheet.addNewSheet()" title="Add new sheet">+</button>
    </div>

    <script>
        /**
         * Core Spreadsheet Architecture Definition Object
         */
        const Spreadsheet = {
            config: {
                initialRows: 100,
                initialCols: 26,
                defaultColWidth: 100,
                defaultRowHeight: 22
            },
            
            // Global Operational Data State Matrix
            sheets: {}, 
            activeSheetId: null,
            
            // Interaction State Registries
            selectedRange: { startRow: 0, startCol: 0, endRow: 0, endCol: 0 },
            activeCell: { row: 0, col: 0 },
            isMouseDown: false,
            isEditing: false,
            isFormulaFocus: false,
            
            // Column Resize Trackers
            resizeState: { colIdx: null, startX: 0, startWidth: 0 },

            init() {
                this.bindGlobalEvents();
                this.addNewSheet("Sheet1");
                this.setActiveCell(0, 0);
            },

            // --- DATA STRUCTURE GENERATORS ---
            createBlankSheetState() {
                const data = {};
                const metadata = {
                    styles: {},
                    colWidths: {}
                };
                for(let r = 0; r < this.config.initialRows; r++) {
                    data[r] = {};
                }
                return { data, metadata };
            },

            addNewSheet(name = null) {
                const id = 'sheet_' + Date.now() + Math.random().toString(36).substr(2, 5);
                if (!name) {
                    const count = Object.keys(this.sheets).length + 1;
                    name = "Sheet" + count;
                }
                
                this.sheets[id] = {
                    name: name,
                    state: this.createBlankSheetState()
                };
                
                this.renderTabs();
                this.switchSheet(id);
            },

            switchSheet(id) {
                if (!this.sheets[id]) return;
                
                // Save out dynamic tracking states if turning over
                if (this.isEditing) this.commitCellEdit();
                
                this.activeSheetId = id;
                this.renderTabs();
                this.buildDOMGrid();
                this.recalculateSheet();
                this.renderGridData();
                this.setActiveCell(0, 0);
            },

            renameSheet(id) {
                const currentName = this.sheets[id].name;
                const newName = prompt("Rename sheet to:", currentName);
                if (newName && newName.trim() !== "") {
                    this.sheets[id].name = newName.trim();
                    this.renderTabs();
                }
            },

            deleteSheet(id, event) {
                if (event) event.stopPropagation();
                
                if (Object.keys(this.sheets).length <= 1) {
                    alert("A workbook must contain at least one visible worksheet.");
                    return;
                }
                if (confirm(`Are you sure you want to delete ${this.sheets[id].name}?`)) {
                    delete this.sheets[id];
                    if (this.activeSheetId === id) {
                        this.switchSheet(Object.keys(this.sheets)[0]);
                    } else {
                        this.renderTabs();
                    }
                }
            },

            // --- DOM RENDER ENGINES ---
            renderTabs() {
                const box = document.getElementById("tabs-box");
                box.innerHTML = "";
                
                Object.keys(this.sheets).forEach(id => {
                    const tab = document.createElement("div");
                    tab.className = `sheet-tab ${id === this.activeSheetId ? 'active' : ''}`;
                    tab.onclick = () => this.switchSheet(id);
                    tab.ondblclick = () => this.renameSheet(id);
                    
                    const span = document.createElement("span");
                    span.innerText = this.sheets[id].name;
                    tab.appendChild(span);
                    
                    const close = document.createElement("span");
                    close.className = "tab-close";
                    close.innerHTML = "&#10006;";
                    close.onclick = (e) => this.deleteSheet(id, e);
                    tab.appendChild(close);
                    
                    box.appendChild(tab);
                });
            },

            buildDOMGrid() {
                const head = document.getElementById("grid-header");
                const body = document.getElementById("grid-body");
                head.innerHTML = "";
                body.innerHTML = "";

                const currentMeta = this.sheets[this.activeSheetId].state.metadata;

                // Build Column Header Row
                const hRow = document.createElement("tr");
                const corner = document.createElement("th");
                corner.className = "corner-header";
                hRow.appendChild(corner);

                for (let c = 0; c < this.config.initialCols; c++) {
                    const th = document.createElement("th");
                    th.className = "col-header";
                    th.id = `col-hdr-${c}`;
                    th.innerText = this.getColLabel(c);
                    
                    // Column width configuration loading
                    const w = currentMeta.colWidths[c] || this.config.defaultColWidth;
                    th.style.width = `${w}px`;

                    // Injection of custom resize handles
                    const handle = document.createElement("div");
                    handle.className = "col-resize-handle";
                    handle.onmousedown = (e) => this.initColumnResize(e, c);
                    th.appendChild(handle);

                    hRow.appendChild(th);
                }
                head.appendChild(hRow);

                // Build Matrix Data Rows
                for (let r = 0; r < this.config.initialRows; r++) {
                    const tr = document.createElement("tr");
                    
                    const rHead = document.createElement("th");
                    rHead.className = "row-header";
                    rHead.id = `row-hdr-${r}`;
                    rHead.innerText = r + 1;
                    tr.appendChild(rHead);

                    for (let c = 0; c < this.config.initialCols; c++) {
                        const td = document.createElement("td");
                        td.className = "cell";
                        td.id = `cell-${r}-${c}`;
                        
                        // Event plumbing assignments
                        td.onmousedown = (e) => this.handleCellMouseDown(e, r, c);
                        td.onmouseenter = () => this.handleCellMouseEnter(r, c);
                        td.ondblclick = () => this.enterEditMode();

                        tr.appendChild(td);
                    }
                    body.appendChild(tr);
                }
            },

            renderGridData() {
                const sheetState = this.sheets[this.activeSheetId].state;
                for (let r = 0; r < this.config.initialRows; r++) {
                    for (let c = 0; c < this.config.initialCols; c++) {
                        const cellDom = document.getElementById(`cell-${r}-${c}`);
                        const cellData = sheetState.data[r][c] || {};
                        
                        // Update visual rendered fields unless currently tracking an open input stream edit window
                        if (!(this.isEditing && this.activeCell.row === r && this.activeCell.col === c)) {
                            cellDom.innerText = cellData.computed !== undefined ? cellData.computed : (cellData.value || "");
                        }

                        // Apply cell custom structural stylings styles from state matrices cache
                        const styleKey = `${r},${c}`;
                        const styles = sheetState.metadata.styles[styleKey] || {};
                        cellDom.style.fontWeight = styles.bold ? 'bold' : 'normal';
                        cellDom.style.fontStyle = styles.italic ? 'italic' : 'normal';
                        cellDom.style.backgroundColor = styles.bgColor || '';
                    }
                }
                this.updateToolbarUIStyles();
            },

            // --- NAVIGATION & DOM HIGHLIGHT ENGINE ---
            setActiveCell(r, c, expandRange = false) {
                if (r < 0 || r >= this.config.initialRows || c < 0 || c >= this.config.initialCols) return;

                if (this.isEditing) this.commitCellEdit();

                this.activeCell = { row: r, col: c };
                if (!expandRange) {
                    this.selectedRange = { startRow: r, startCol: c, endRow: r, endCol: c };
                } else {
                    this.selectedRange.endRow = r;
                    this.selectedRange.endCol = c;
                }

                this.updateSelectionBordersDOM();
                
                // Map values up into display panels
                const addr = this.getColLabel(c) + (r + 1);
                document.getElementById("cell-address").innerText = addr;
                
                const cellData = this.sheets[this.activeSheetId].state.data[r][c] || {};
                const fInput = document.getElementById("formula-input");
                
                if (!this.isFormulaFocus) {
                    fInput.value = cellData.value || "";
                }
            },

            updateSelectionBordersDOM() {
                // Clear out legacy tracking selection tokens safely
                document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected"));
                document.querySelectorAll(".cell.sel-top").forEach(el => el.classList.remove("sel-top"));
                document.querySelectorAll(".cell.sel-bottom").forEach(el => el.classList.remove("sel-bottom"));
                document.querySelectorAll(".cell.sel-left").forEach(el => el.classList.remove("sel-left"));
                document.querySelectorAll(".cell.sel-right").forEach(el => el.classList.remove("sel-right"));
                document.querySelectorAll(".selected-header").forEach(el => el.classList.remove("selected-header"));

                const rMin = Math.min(this.selectedRange.startRow, this.selectedRange.endRow);
                const rMax = Math.max(this.selectedRange.startRow, this.selectedRange.endRow);
                const cMin = Math.min(this.selectedRange.startCol, this.selectedRange.endCol);
                const cMax = Math.max(this.selectedRange.startCol, this.selectedRange.endCol);

                for (let r = rMin; r <= rMax; r++) {
                    document.getElementById(`row-hdr-${r}`).classList.add("selected-header");
                    for (let c = cMin; c <= cMax; c++) {
                        const cell = document.getElementById(`cell-${r}-${c}`);
                        cell.classList.add("selected");

                        if (r === rMin) cell.classList.add("sel-top");
                        if (r === rMax) cell.classList.add("sel-bottom");
                        if (c === cMin) cell.classList.add("sel-left");
                        if (c === cMax) cell.classList.add("sel-right");
                    }
                }

                for (let c = cMin; c <= cMax; c++) {
                    document.getElementById(`col-hdr-${c}`).classList.add("selected-header");
                }
            },

            // --- SELECTION MOUSE EVENTS ---
            handleCellMouseDown(e, r, c) {
                if (this.isEditing && (this.activeCell.row !== r || this.activeCell.col !== c)) {
                    this.commitCellEdit();
                }

                if (this.isFormulaFocus) {
                    // Inject clicked references target into active editing calculation buffer strings
                    e.preventDefault();
                    this.injectRangeIntoFormula(r, c);
                    return;
                }

                this.isMouseDown = true;
                if (e.shiftKey) {
                    this.setActiveCell(r, c, true);
                } else {
                    this.selectedRange.startRow = r;
                    this.selectedRange.startCol = c;
                    this.setActiveCell(r, c, false);
                }
            },

            handleCellMouseEnter(r, c) {
                if (!this.isMouseDown) return;
                
                if (this.isFormulaFocus) {
                    this.injectRangeIntoFormula(r, c, true);
                    return;
                }

                this.setActiveCell(r, c, true);
            },

            injectRangeIntoFormula(r, c, dragExtend = false) {
                const fInput = document.getElementById("formula-input");
                let token = this.getColLabel(c) + (r + 1);
                
                if (dragExtend) {
                    const startToken = this.getColLabel(this.selectedRange.startCol) + (this.selectedRange.startRow + 1);
                    token = `${startToken}:${token}`;
                    
                    // Back out previous window stream text inputs
                    if (this._prevToken) {
                        const idx = fInput.value.lastIndexOf(this._prevToken);
                        if (idx !== -1) {
                            fInput.value = fInput.value.substring(0, idx) + token;
                            this._prevToken = token;
                            return;
                        }
                    }
                } else {
                    this.selectedRange.startRow = r;
                    this.selectedRange.startCol = c;
                    this._prevToken = token;
                }

                fInput.value += token;
                this._prevToken = token;
            },

            // --- INLINE CELL EDIT MODES ---
            enterEditMode() {
                if (this.isEditing) return;
                this.isEditing = true;
                
                const r = this.activeCell.row;
                const c = this.activeCell.col;
                const cellDom = document.getElementById(`cell-${r}-${c}`);
                const cellData = this.sheets[this.activeSheetId].state.data[r][c] || {};

                cellDom.classList.add("edit-mode");
                cellDom.contentEditable = "true";
                cellDom.innerText = cellData.value || "";
                cellDom.focus();
                
                // Position text cursor at the end
                const range = document.createRange();
                const sel = window.getSelection();
                range.selectNodeContents(cellDom);
                range.collapse(false);
                sel.removeAllRanges();
                sel.addRange(range);
            },

            commitCellEdit() {
                if (!this.isEditing) return;
                
                const r = this.activeCell.row;
                const c = this.activeCell.col;
                const cellDom = document.getElementById(`cell-${r}-${c}`);
                
                cellDom.classList.remove("edit-mode");
                cellDom.contentEditable = "false";
                this.isEditing = false;

                const newVal = cellDom.innerText.trim();
                this.setCellValue(r, c, newVal);
            },

            setCellValue(r, c, val) {
                const sheet = this.sheets[this.activeSheetId].state;
                if (!sheet.data[r][c]) sheet.data[r][c] = {};
                
                sheet.data[r][c].value = val;
                
                this.recalculateSheet();
                this.renderGridData();
                
                // Synchronize top tracking panel metrics
                if (this.activeCell.row === r && this.activeCell.col === c) {
                    document.getElementById("formula-input").value = val;
                }
            },

            // --- STYLING & FORMAT BAR ACTIONS ---
            toggleFormat(style) {
                const sheetMeta = this.sheets[this.activeSheetId].state.metadata;
                const rMin = Math.min(this.selectedRange.startRow, this.selectedRange.endRow);
                const rMax = Math.max(this.selectedRange.startRow, this.selectedRange.endRow);
                const cMin = Math.min(this.selectedRange.startCol, this.selectedRange.endCol);
                const cMax = Math.max(this.selectedRange.startCol, this.selectedRange.endCol);

                // Sample baseline vector state evaluation check toggle mapping rules
                const pivotKey = `${this.activeCell.row},${this.activeCell.col}`;
                const currentPivotStyles = sheetMeta.styles[pivotKey] || {};
                const nextState = !currentPivotStyles[style];

                for (let r = rMin; r <= rMax; r++) {
                    for (let c = cMin; c <= cMax; c++) {
                        const key = `${r},${c}`;
                        if (!sheetMeta.styles[key]) sheetMeta.styles[key] = {};
                        sheetMeta.styles[key][style] = nextState;
                    }
                }
                this.renderGridData();
            },

            applyBgColor(color) {
                const sheetMeta = this.sheets[this.activeSheetId].state.metadata;
                const rMin = Math.min(this.selectedRange.startRow, this.selectedRange.endRow);
                const rMax = Math.max(this.selectedRange.startRow, this.selectedRange.endRow);
                const cMin = Math.min(this.selectedRange.startCol, this.selectedRange.endCol);
                const cMax = Math.max(this.selectedRange.startCol, this.selectedRange.endCol);

                for (let r = rMin; r <= rMax; r++) {
                    for (let c = cMin; c <= cMax; c++) {
                        const key = `${r},${c}`;
                        if (!sheetMeta.styles[key]) sheetMeta.styles[key] = {};
                        sheetMeta.styles[key].bgColor = color;
                    }
                }
                this.renderGridData();
            },

            clearSelectionData() {
                const rMin = Math.min(this.selectedRange.startRow, this.selectedRange.endRow);
                const rMax = Math.max(this.selectedRange.startRow, this.selectedRange.endRow);
                const cMin = Math.min(this.selectedRange.startCol, this.selectedRange.endCol);
                const cMax = Math.max(this.selectedRange.startCol, this.selectedRange.endCol);

                for (let r = rMin; r <= rMax; r++) {
                    for (let c = cMin; c <= cMax; c++) {
                        this.setCellValue(r, c, "");
                    }
                }
            },

            updateToolbarUIStyles() {
                const sheetMeta = this.sheets[this.activeSheetId].state.metadata;
                const key = `${this.activeCell.row},${this.activeCell.col}`;
                const styles = sheetMeta.styles[key] || {};

                document.getElementById("btn-bold").classList.toggle("active", !!styles.bold);
                document.getElementById("btn-italic").classList.toggle("active", !!styles.italic);
            },

            // --- COLUMN RESIZE MECHANICS ---
            initColumnResize(e, colIdx) {
                e.preventDefault();
                e.stopPropagation();
                
                const th = document.getElementById(`col-hdr-${colIdx}`);
                this.resizeState = {
                    colIdx: colIdx,
                    startX: e.clientX,
                    startWidth: th.offsetWidth
                };

                document.body.style.cursor = 'col-resize';
                
                const doResize = (moveEvent) => {
                    const deltaX = moveEvent.clientX - this.resizeState.startX;
                    const newW = Math.max(40, this.resizeState.startWidth + deltaX);
                    
                    // Write out width directly to elements cache
                    th.style.width = `${newW}px`;
                    this.sheets[this.activeSheetId].state.metadata.colWidths[colIdx] = newW;
                    
                    // Flush alignment adjustments downstream into columns array elements
                    for (let r = 0; r < this.config.initialRows; r++) {
                        document.getElementById(`cell-${r}-${colIdx}`).style.width = `${newW}px`;
                    }
                };

                const endResize = () => {
                    document.removeEventListener('mousemove', doResize);
                    document.removeEventListener('mouseup', endResize);
                    document.body.style.cursor = '';
                };

                document.addEventListener('mousemove', doResize);
                document.addEventListener('mouseup', endResize);
            },

            // --- GLOBAL EVENT BINDINGS ---
            bindGlobalEvents() {
                // Global mouseup handles cleanup selection processes
                document.addEventListener("mouseup", () => {
                    this.isMouseDown = false;
                });

                // Top Formula text inputs event listeners
                const fInput = document.getElementById("formula-input");
                fInput.onfocus = () => {
                    this.isFormulaFocus = true;
                    this._prevToken = null;
                };
                fInput.onblur = () => {
                    // Stagger clearing out states slightly to allow mouse targeting clicks intercept paths
                    setTimeout(() => { this.isFormulaFocus = false; }, 200);
                };
                fInput.onkeydown = (e) => {
                    if (e.key === "Enter") {
                        this.setCellValue(this.activeCell.row, this.activeCell.col, fInput.value);
                        fInput.blur();
                        this.moveSelection("Down", false);
                    }
                };

                // Hotkey navigation listener matrices
                document.addEventListener("keydown", (e) => {
                    if (this.isEditing) {
                        if (e.key === "Enter" && !e.shiftKey) {
                            e.preventDefault();
                            this.commitCellEdit();
                            this.moveSelection("Down", false);
                        } else if (e.key === "Tab") {
                            e.preventDefault();
                            this.commitCellEdit();
                            this.moveSelection("Right", false);
                        }
                        return;
                    }

                    // Block tracking if focusing external browser interfaces
                    if (document.activeElement.tagName === "INPUT") return;

                    let targetDir = null;
                    switch (e.key) {
                        case "ArrowUp":    targetDir = "Up"; break;
                        case "ArrowDown":  targetDir = "Down"; break;
                        case "ArrowLeft":  targetDir = "Left"; break;
                        case "ArrowRight": targetDir = "Right"; break;
                        case "Tab":
                            targetDir = e.shiftKey ? "Left" : "Right";
                            break;
                        case "Enter":
                            if (!this.isEditing) {
                                e.preventDefault();
                                this.enterEditMode();
                            }
                            return;
                        case "Backspace":
                        case "Delete":
                            this.clearSelectionData();
                            e.preventDefault();
                            return;
                        default:
                            // Pass typing characters directly down into running open edit cells lines
                            if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
                                this.enterEditMode();
                                const r = this.activeCell.row;
                                const c = this.activeCell.col;
                                document.getElementById(`cell-${r}-${c}`).innerText = "";
                            }
                            return;
                    }

                    if (targetDir) {
                        e.preventDefault();
                        this.moveSelection(targetDir, e.shiftKey);
                    }
                });
            },

            moveSelection(dir, shiftKey) {
                let r = shiftKey ? this.selectedRange.endRow : this.activeCell.row;
                let c = shiftKey ? this.selectedRange.endCol : this.activeCell.col;

                if (dir === "Up") r--;
                if (dir === "Down") r++;
                if (dir === "Left") c--;
                if (dir === "Right") c++;

                this.setActiveCell(r, c, shiftKey);
                
                // Keep selected cell visible in view screen window viewport frame
                const cellDom = document.getElementById(`cell-${this.activeCell.row}-${this.activeCell.col}`);
                if (cellDom) cellDom.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            },

            // --- COMPUTATION ENGINE & EVALUATORS ---
            recalculateSheet() {
                const sheet = this.sheets[this.activeSheetId].state;
                
                // Clear out legacy circular dependency structures evaluation checks caches
                for (let r = 0; r < this.config.initialRows; r++) {
                    for (let c = 0; c < this.config.initialCols; c++) {
                        if (sheet.data[r][c]) {
                            sheet.data[r][c].computed = undefined;
                        }
                    }
                }

                // Fire computation iterations across system cells array
                for (let r = 0; r < this.config.initialRows; r++) {
                    for (let c = 0; c < this.config.initialCols; c++) {
                        this.evaluateCell(r, c, new Set());
                    }
                }
            },

            evaluateCell(r, c, evaluationStack) {
                const sheet = this.sheets[this.activeSheetId].state;
                const cell = sheet.data[r][c];
                
                if (!cell || !cell.value) return "";
                if (cell.computed !== undefined) return cell.computed;

                const valStr = cell.value.toString();
                if (!valStr.startsWith("=")) {
                    cell.computed = valStr;
                    return valStr;
                }

                // Detect circular reference loops
                const cellAddr = `${r},${c}`;
                if (evaluationStack.has(cellAddr)) {
                    cell.computed = "#REF!";
                    return "#REF!";
                }

                evaluationStack.add(cellAddr);
                try {
                    let formulaExpr = valStr.substring(1).toUpperCase();
                    
                    // 1. Process Function Calls (SUM, AVERAGE, MIN, MAX)
                    formulaExpr = this.processFormulaFunctions(formulaExpr, evaluationStack);
                    
                    // 2. Resolve remaining Cell References
                    formulaExpr = this.resolveCellReferences(formulaExpr, evaluationStack);

                    // 3. Mathematical Evaluation Pass
                    if (formulaExpr.includes("#REF!")) {
                        cell.computed = "#REF!";
                    } else {
                        const result = this.safeEvaluateMathExpression(formulaExpr);
                        cell.computed = isNaN(result) ? "#VALUE!" : result;
                    }
                } catch (err) {
                    cell.computed = "#ERROR!";
                }
                evaluationStack.delete(cellAddr);
                
                return cell.computed;
            },

            processFormulaFunctions(expr, stack) {
                const funcRegex = /(SUM|AVERAGE|MIN|MAX)\(([^)]+)\)/g;
                
                return expr.replace(funcRegex, (match, funcName, rangeStr) => {
                    const coords = this.parseRange(rangeStr);
                    if (!coords) return "#REF!";

                    const values = [];
                    for (let r = coords.rStart; r <= coords.rEnd; r++) {
                        for (let c = coords.cStart; c <= coords.cEnd; c++) {
                            const val = this.evaluateCell(r, c, stack);
                            if (val === "#REF!") return "#REF!";
                            const num = parseFloat(val);
                            if (!isNaN(num)) values.push(num);
                        }
                    }

                    if (values.length === 0) return "0";

                    switch (funcName) {
                        case "SUM":
                            return values.reduce((a, b) => a + b, 0).toString();
                        case "AVERAGE":
                            return (values.reduce((a, b) => a + b, 0) / values.length).toString();
                        case "MIN":
                            return Math.min(...values).toString();
                        case "MAX":
                            return Math.max(...values).toString();
                        default:
                            return "0";
                    }
                });
            },

            resolveCellReferences(expr, stack) {
                // Match cell references like A1, B12,AA33 (excluding trailing function parenthesis patterns)
                const refRegex = /\b([A-Z]+)([1-9][0-9]*)\b/g;
                
                return expr.replace(refRegex, (match, colStr, rowStr) => {
                    const c = this.parseColLabel(colStr);
                    const r = parseInt(rowStr, 10) - 1;

                    if (r < 0 || r >= this.config.initialRows || c < 0 || c >= this.config.initialCols) {
                        return "#REF!";
                    }

                    const val = this.evaluateCell(r, c, stack);
                    if (val === "#REF!") return "#REF!";
                    const num = parseFloat(val);
                    return !isNaN(num) ? num.toString() : `"${val}"`;
                });
            },

            safeEvaluateMathExpression(str) {
                // Strip out characters outside validation matrices boundaries
                const sanitized = str.replace(/[^0-9.+-/*()]/g, '');
                try {
                    // Evaluate sanitized arithmetic expression safely
                    const res = new Function(`return (${sanitized});`)();
                    return res !== undefined ? res : "";
                } catch {
                    return "#VALUE!";
                }
            },

            // --- UTILITY DATA TRANSFORMS ---
            getColLabel(idx) {
                let label = "";
                let temp = idx;
                while (temp >= 0) {
                    label = String.fromCharCode((temp % 26) + 65) + label;
                    temp = Math.floor(temp / 26) - 1;
                }
                return label;
            },

            parseColLabel(str) {
                let idx = 0;
                for (let i = 0; i < str.length; i++) {
                    idx = idx * 26 + (str.charCodeAt(i) - 64);
                }
                return idx - 1;
            },

            parseAddress(str) {
                const match = str.trim().match(/^([A-Z]+)([1-9][0-9]*)$/i);
                if (!match) return null;
                return {
                    c: this.parseColLabel(match[1].toUpperCase()),
                    r: parseInt(match[2], 10) - 1
                };
            },

            parseRange(str) {
                const parts = str.split(":");
                if (parts.length === 1) {
                    const addr = this.parseAddress(parts[0]);
                    if (!addr) return null;
                    return { rStart: addr.r, cStart: addr.c, rEnd: addr.r, cEnd: addr.c };
                } else if (parts.length === 2) {
                    const addr1 = this.parseAddress(parts[0]);
                    const addr2 = this.parseAddress(parts[1]);
                    if (!addr1 || !addr2) return null;
                    return {
                        rStart: Math.min(addr1.r, addr2.r),
                        cStart: Math.min(addr1.c, addr2.c),
                        rEnd: Math.max(addr1.r, addr2.r),
                        cEnd: Math.max(addr1.c, addr2.c)
                    };
                }
                return null;
            },

            // --- CSV DATA IMPORT EXPORT ENGINES ---
            exportCSV() {
                const sheet = this.sheets[this.activeSheetId];
                let csvRows = [];

                // Determine effective dimensions bounds limits dynamically
                let maxR = 0, maxC = 0;
                for (let r = 0; r < this.config.initialRows; r++) {
                    for (let c = 0; c < this.config.initialCols; c++) {
                        const cell = sheet.state.data[r][c];
                        if (cell && cell.value) {
                            if (r > maxR) maxR = r;
                            if (c > maxC) maxC = c;
                        }
                    }
                }

                for (let r = 0; r <= maxR; r++) {
                    let rVals = [];
                    for (let c = 0; c <= maxC; c++) {
                        const cell = sheet.state.data[r][c];
                        let valStr = cell && cell.value !== undefined ? cell.value.toString() : "";
                        
                        // Escape quotes and wrap in quotes if spaces/commas are present
                        if (valStr.includes(",") || valStr.includes('"') || valStr.includes("\n")) {
                            valStr = '"' + valStr.replace(/"/g, '""') + '"';
                        }
                        rVals.push(valStr);
                    }
                    csvRows.push(rVals.join(","));
                }

                const csvBlob = new Blob([csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
                const blobUrl = URL.createObjectURL(csvBlob);
                
                const dLink = document.createElement("a");
                dLink.href = blobUrl;
                dLink.setAttribute("download", `${sheet.name}_Export.csv`);
                document.body.appendChild(dLink);
                dLink.click();
                document.body.removeChild(dLink);
            },

            importCSV(inputEl) {
                const file = inputEl.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const text = e.target.result;
                    this.parseAndLoadCSVData(text);
                    inputEl.value = ""; // Clear file selector string buffer
                };
                reader.readAsText(file);
            },

            parseAndLoadCSVData(text) {
                const rows = [];
                let currRow = [];
                let currCell = "";
                let inQuotes = false;

                // Handle basic escaping logic states matrices rules explicitly
                for (let i = 0; i < text.length; i++) {
                    const char = text[i];
                    const nextChar = text[i + 1];

                    if (inQuotes) {
                        if (char === '"') {
                            if (nextChar === '"') {
                                currCell += '"';
                                i++; // Skip lookahead escape quote
                            } else {
                                inQuotes = false;
                            }
                        } else {
                            currCell += char;
                        }
                    } else {
                        if (char === '"') {
                            inQuotes = true;
                        } else if (char === ',') {
                            currRow.push(currCell);
                            currCell = "";
                        } else if (char === '\r' || char === '\n') {
                            currRow.push(currCell);
                            currCell = "";
                            if (char === '\r' && nextChar === '\n') i++;
                            rows.push(currRow);
                            currRow = [];
                        } else {
                            currCell += char;
                        }
                    }
                }
                if (currCell || currRow.length > 0) {
                    currRow.push(currCell);
                    rows.push(currRow);
                }

                // Inject array values parsed back into operational sheet models cache
                const sheetState = this.sheets[this.activeSheetId].state;
                
                // Clear out historical row data allocations safely
                for (let r = 0; r < this.config.initialRows; r++) {
                    sheetState.data[r] = {};
                }

                const limitR = Math.min(rows.length, this.config.initialRows);
                for (let r = 0; r < limitR; r++) {
                    const limitC = Math.min(rows[r].length, this.config.initialCols);
                    for (let c = 0; c < limitC; c++) {
                        sheetState.data[r][c] = { value: rows[r][c].trim() };
                    }
                }

                this.recalculateSheet();
                this.renderGridData();
                this.setActiveCell(0, 0);
            }
        };

        // Initialize Application Core Framework Instance on page load
        window.onload = () => Spreadsheet.init();
    </script>
</body>
