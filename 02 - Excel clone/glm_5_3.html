<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadrille — Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161d18; --ink-soft:#3a423c; --grid-fg:#22271f;
  --paper:#faf9f6; --bar:#f1efe9; --line:#e4e1d8; --line-strong:#d5d1c6;
  --header-bg:#f5f3ee; --header-ink:#8a877d; --header-hover:#ebe8e0;
  --accent:#0f7a51; --accent-deep:#0b5c3d; --accent-soft:rgba(15,122,81,.09); --accent-mid:#d9ece2;
  --err:#b3261e;
  --hl0:#0f7a51; --hl1:#a86a2a; --hl2:#1d6c85; --hl3:#a04a33; --hl4:#5c6b52;
  --shadow:0 10px 30px rgba(18,24,18,.18);
  --font:'Instrument Sans',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);color:var(--grid-fg);font-family:var(--font)}
.app{display:flex;flex-direction:column;height:100%}

/* ---------- title bar ---------- */
.titlebar{height:48px;flex:none;background:var(--ink);display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;color:#e8ece8}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:.2px;user-select:none}
.docname{color:#9fb0a4;font-size:12.5px;padding-left:12px;border-left:1px solid rgba(255,255,255,.14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}
.tb-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.tbtn{width:32px;height:32px;border:none;background:transparent;color:#c4cfc6;border-radius:7px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.tbtn:hover{background:rgba(255,255,255,.1);color:#fff}
.tbtn:active{transform:translateY(1px)}
.tsep{width:1px;height:18px;background:rgba(255,255,255,.15);margin:0 6px}

/* ---------- toolbar ---------- */
.toolbar{height:46px;flex:none;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 10px;user-select:none}
.tgroup{display:flex;gap:2px;align-items:center}
.osep{width:1px;height:20px;background:var(--line-strong);margin:0 8px;flex:none}
.obtn{height:32px;min-width:32px;border:none;background:transparent;color:var(--ink-soft);border-radius:7px;cursor:pointer;display:grid;place-items:center;padding:0 7px;font-family:var(--font);position:relative}
.obtn:hover{background:#e9e6dd;color:var(--ink)}
.obtn:active{transform:translateY(1px)}
.obtn.pressed{background:var(--accent-mid);color:var(--accent-deep)}
.glyph{font-size:14px;line-height:1}
.g-b{font-weight:700}.g-i{font-style:italic}.g-u{text-decoration:underline}
.colorbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.swatch-bar{width:15px;height:3.5px;border-radius:2px;border:1px solid rgba(0,0,0,.1)}

/* tooltips */
[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);background:var(--ink);color:#eef1ec;font:500 11px var(--font);padding:5px 9px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s ease .35s;z-index:100}
[data-tip]:hover::after{opacity:1}

/* ---------- formula row ---------- */
.frow{display:flex;align-items:stretch;height:36px;flex:none;border-bottom:1px solid var(--line-strong);background:#fff}
.namebox{width:112px;flex:none;border:none;border-right:1px solid var(--line);font:500 12.5px var(--mono);text-align:center;outline:none;color:var(--ink);background:transparent}
.namebox:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.fxlabel{display:flex;align-items:center;padding:0 12px;color:#98958a;font:italic 500 13px var(--mono);border-right:1px solid var(--line);user-select:none}
#fx{flex:1;border:none;outline:none;font:13px var(--mono);padding:0 12px;color:var(--ink);background:transparent;min-width:40px}

/* ---------- grid ---------- */
.scroller{flex:1;overflow:auto;background:#fff;position:relative}
.scroller::-webkit-scrollbar{width:12px;height:12px}
.scroller::-webkit-scrollbar-thumb{background:#cfccc2;border:3px solid #fff;border-radius:8px}
.scroller::-webkit-scrollbar-corner{background:#fff}
.grid-stack{position:relative;width:max-content}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;user-select:none;font-variant-numeric:tabular-nums}
.sheet th,.sheet td{height:27px;padding:0 7px;font-size:13px;line-height:26px;font-weight:400;white-space:nowrap;overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheet td{cursor:cell;background:#fff}
.sheet td.ta-c{text-align:center}
.sheet td.ta-r{text-align:right}
.sheet td.b{font-weight:700}.sheet td.i{font-style:italic}.sheet td.u{text-decoration:underline}
.sheet td.err{color:var(--err);font-weight:500}
.sheet thead th{position:sticky;top:0;z-index:3;background:var(--header-bg);color:var(--header-ink);font:600 11px var(--font);text-align:center;overflow:visible;border-bottom:1px solid var(--line-strong)}
.sheet .rh{position:sticky;left:0;z-index:2;background:var(--header-bg);color:var(--header-ink);font:500 11px var(--font);text-align:center;cursor:pointer;border-right:1px solid var(--line-strong)}
.sheet .corner{left:0;z-index:4}
.sheet thead th.ch{cursor:pointer}
th.ch:hover,th.rh:hover{background:var(--header-hover)}
th.on{background:var(--accent-mid)!important;color:var(--accent-deep)!important}
.rz{position:absolute;top:0;right:-4px;width:9px;height:100%;cursor:col-resize;z-index:5}
.rz::after{content:'';position:absolute;top:4px;bottom:4px;right:4px;width:2px;border-radius:1px;background:transparent}
.rz:hover::after,.rz.drag::after{background:var(--accent)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}

/* overlays */
.ovl{position:absolute;inset:0;pointer-events:none;z-index:6}
#selBox{position:absolute;border:2px solid var(--accent);border-radius:2px}
#selBox.range{background:rgba(15,122,81,.07)}
.hlbox{position:absolute;border:2px solid;border-radius:3px;animation:hlIn .18s ease}
.hb0{border-color:var(--hl0);background:rgba(15,122,81,.06)}
.hb1{border-color:var(--hl1);background:rgba(168,106,42,.07)}
.hb2{border-color:var(--hl2);background:rgba(29,108,133,.07)}
.hb3{border-color:var(--hl3);background:rgba(160,74,51,.07)}
.hb4{border-color:var(--hl4);background:rgba(92,107,82,.09)}
@keyframes hlIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#cellEditor{position:absolute;z-index:7;display:none;font:13px var(--font);padding:0 6px;border:none;outline:2px solid var(--accent);outline-offset:-1px;background:#fff;box-shadow:0 4px 14px rgba(18,24,18,.14)}

/* ---------- tab bar ---------- */
.tabbar{height:40px;flex:none;background:var(--bar);border-top:1px solid var(--line-strong);display:flex;align-items:flex-end;padding:0 10px 0 4px;gap:2px;user-select:none}
.tabs{display:flex;align-items:flex-end;gap:1px;overflow-x:auto;flex:1;min-width:0;padding-top:5px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;height:31px;padding:0 10px;font:500 12.5px var(--font);color:#75726a;border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px;background:transparent}
.tab:hover{color:var(--ink);background:#e9e6de}
.tab.active{background:#fff;color:var(--accent-deep);border-color:var(--line-strong);box-shadow:inset 0 2px 0 var(--accent);font-weight:600}
.tab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;opacity:0;color:#8a877d;flex:none}
.tab:hover .x,.tab.active .x{opacity:.75}
.tab .x:hover{background:rgba(0,0,0,.09);opacity:1}
.tabrename{width:92px;height:22px;font:500 12.5px var(--font);border:1px solid var(--accent);border-radius:5px;padding:0 6px;outline:none;background:#fff}
.addtab{flex:none;width:30px;height:28px;margin:0 0 1px 3px;border:none;background:transparent;color:#77746a;border-radius:7px;display:grid;place-items:center;cursor:pointer}
.addtab:hover{background:#e4e1d8;color:var(--accent-deep)}
.stats{display:flex;gap:6px;align-items:center;font:11.5px var(--mono);color:#7b786e;padding:0 2px 8px 14px;white-space:nowrap;flex:none}
.stats b{color:var(--ink);font-weight:600}
.stats .dot{opacity:.4;padding:0 4px}

/* ---------- toast & confirm ---------- */
#toasts{position:fixed;right:16px;bottom:52px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:var(--ink);color:#eef1ec;font:500 12.5px var(--font);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);animation:tIn .22s ease;max-width:320px}
.toast.out{opacity:0;transform:translateY(6px);transition:all .25s}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}}
#confirmPop{position:fixed;z-index:90;background:#fff;border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px;display:none;width:250px}
#confirmPop.show{display:block;animation:tIn .18s ease}
#confirmPop h4{margin:0 0 4px;font-size:13px}
#confirmPop p{margin:0 0 12px;font-size:12px;color:#77746a;line-height:1.45}
.cbtns{display:flex;gap:8px;justify-content:flex-end}
.btn{border:none;border-radius:7px;padding:6px 14px;font:600 12.5px var(--font);cursor:pointer}
.btn.danger{background:var(--err);color:#fff}
.btn.danger:hover{background:#9c1f18}
.btn.ghost{background:transparent;color:#5c594f;border:1px solid var(--line-strong)}
.btn.ghost:hover{background:#f1efe9}

@media(max-width:860px){
  .docname{display:none}
  .stats{display:none}
  .toolbar{flex-wrap:wrap;height:auto;padding:6px 8px;row-gap:6px}
}
</style>
</head>
<body>
<div class="app">

  <header class="titlebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <rect x="1.5" y="1.5" width="17" height="17" rx="3.5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>
        <rect x="3.5" y="3.5" width="5.4" height="5.4" rx="1" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3"/>
        <rect x="11.1" y="3.5" width="5.4" height="5.4" rx="1" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3"/>
        <rect x="3.5" y="11.1" width="5.4" height="5.4" rx="1" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.3"/>
        <rect x="11.1" y="11.1" width="5.4" height="5.4" rx="1" fill="#37c98f"/>
      </svg>
      <span>Quadrille</span>
    </div>
    <div class="docname">Untitled workbook — runs entirely in your browser</div>
    <div class="tb-actions">
      <button class="tbtn" id="tbUndo" data-tip="Undo (Ctrl+Z)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h6a3.5 3.5 0 1 1 0 7H6"/><path d="M6 3.5 3 6.5l3 3"/></svg>
      </button>
      <button class="tbtn" id="tbRedo" data-tip="Redo (Ctrl+Y)">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 6.5h-6a3.5 3.5 0 1 0 0 7H10"/><path d="m10 3.5 3 3-3 3"/></svg>
      </button>
      <span class="tsep"></span>
      <button class="tbtn" id="tbDownload" data-tip="Download active sheet as CSV">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7m0 0 3-3m-3 3-3-3"/><path d="M3 13.5h10"/></svg>
      </button>
      <button class="tbtn" id="tbUpload" data-tip="Upload CSV into active sheet">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.5v-7m0 0 3 3m-3-3-3 3"/><path d="M3 13.5h10"/></svg>
      </button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tgroup">
      <button class="obtn" id="tbBold" data-tip="Bold (Ctrl+B)"><span class="glyph g-b">B</span></button>
      <button class="obtn" id="tbItalic" data-tip="Italic (Ctrl+I)"><span class="glyph g-i">I</span></button>
      <button class="obtn" id="tbUnder" data-tip="Underline (Ctrl+U)"><span class="glyph g-u">U</span></button>
    </div>
    <span class="osep"></span>
    <div class="tgroup">
      <button class="obtn colorbtn" id="tbText" data-tip="Text color"><span class="glyph">A</span><span class="swatch-bar" id="swText"></span></button>
      <button class="obtn colorbtn" id="tbFill" data-tip="Cell fill color">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2.5s4.2 4.7 4.2 7.6a4.2 4.2 0 0 1-8.4 0C3.8 7.2 8 2.5 8 2.5z"/></svg>
        <span class="swatch-bar" id="swFill"></span>
      </button>
    </div>
    <span class="osep"></span>
    <div class="tgroup">
      <button class="obtn" id="tbAlignL" data-tip="Align left">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h7M2.5 12h9"/></svg>
      </button>
      <button class="obtn" id="tbAlignC" data-tip="Align center">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M3.5 12h9"/></svg>
      </button>
      <button class="obtn" id="tbAlignR" data-tip="Align right">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M6.5 8h7M4.5 12h9"/></svg>
      </button>
    </div>
    <span class="osep"></span>
    <button class="obtn" id="tbClear" data-tip="Clear contents &amp; formatting (Del)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5v-1a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1"/><path d="m5 4.5.6 8a1 1 0 0 0 1 .9h2.8a1 1 0 0 0 1-.9l.6-8"/></svg>
    </button>
    <input type="color" id="pickText" value="#22271f" hidden>
    <input type="color" id="pickFill" value="#e2efe7" hidden>
  </div>

  <div class="frow">
    <input id="nameBox" class="namebox" spellcheck="false" autocomplete="off" aria-label="Cell address">
    <span class="fxlabel">fx</span>
    <input id="fx" spellcheck="false" autocomplete="off" aria-label="Formula">
  </div>

  <div class="scroller" id="scroller">
    <div class="grid-stack" id="gridStack">
      <table class="sheet" id="sheet"></table>
      <div class="ovl" id="hlLayer"></div>
      <div class="ovl"><div id="selBox"></div></div>
      <input id="cellEditor" spellcheck="false" autocomplete="off">
    </div>
  </div>

  <footer class="tabbar">
    <div class="tabs" id="tabs"></div>
    <div class="stats" id="stats"></div>
  </footer>
</div>

<div id="toasts"></div>
<div id="confirmPop">
  <h4>Delete sheet</h4>
  <p>Delete <b id="cpName"></b>? Its contents will be removed (Ctrl+Z brings it back).</p>
  <div class="cbtns">
    <button class="btn ghost" id="cpNo">Cancel</button>
    <button class="btn danger" id="cpYes">Delete</button>
  </div>
</div>
<input type="file" id="fileIn" accept=".csv,text/csv" hidden>

<script>
'use strict';
/* ============================== constants & helpers ============================== */
const COLS=26, ROWS=200, DEF_W=100, HW=48;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const colL=c=>String.fromCharCode(65+c);
const keyName=(r,c)=>colL(c)+(r+1);
const parseKey=k=>{const m=/^([A-Z])(\d+)$/.exec(k);return m?{c:m[1].charCodeAt(0)-65,r:+m[2]-1}:null;};
const esc=s=>s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const ERR={DIV:'#DIV/0!',NAME:'#NAME?',VAL:'#VALUE!',CYC:'#CYCLE!',NUM:'#NUM!'};
const fmtNum=v=>String(parseFloat(v.toPrecision(12)));

/* ============================== formula engine ============================== */
function tokenize(s){
  const T=[];let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\t'){i++;continue;}
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      const v=parseFloat(s.slice(i,j));if(!isFinite(v))throw{err:ERR.VAL};
      T.push({t:'num',v});i=j;continue;
    }
    if(c==='"'){
      let j=i+1,out='';
      while(j<s.length){if(s[j]==='"'){if(s[j+1]==='"'){out+='"';j+=2;}else break;}else out+=s[j++];}
      if(j>=s.length)throw{err:ERR.VAL};
      T.push({t:'str',v:out});i=j+1;continue;
    }
    if(/[A-Za-z$]/.test(c)){
      let j=i;while(j<s.length&&/[A-Za-z0-9_]/.test(s[j]))j++;
      const w=s.slice(i,j);
      const m=/^\$?([A-Za-z])\$?([0-9]+)$/.exec(w);
      if(m){T.push({t:'ref',c:m[1].toUpperCase().charCodeAt(0)-65,r:+m[2]-1});i=j;continue;}
      const lw=w.toLowerCase();
      if(lw==='true'||lw==='false'){T.push({t:'num',v:lw==='true'?1:0});i=j;continue;}
      T.push({t:'name',v:lw});i=j;continue;
    }
    if('+-*/^%(),:'.includes(c)){T.push({t:c});i++;continue;}
    throw{err:ERR.NAME};
  }
  return T;
}
function parse(toks){
  let p=0;
  const peek=()=>toks[p],next=()=>toks[p++];
  const expect=t=>{const k=next();if(!k||k.t!==t)throw{err:ERR.VAL};return k;};
  function expr(){let n=term();while(peek()&&(peek().t==='+'||peek().t==='-')){const op=next().t;n={t:'bin',op,a:n,b:term()};}return n;}
  function term(){let n=unary();while(peek()&&(peek().t==='*'||peek().t==='/')){const op=next().t;n={t:'bin',op,a:n,b:unary()};}return n;}
  function unary(){if(peek()&&peek().t==='-'){next();return{t:'neg',a:unary()};}if(peek()&&peek().t==='+'){next();return unary();}return power();}
  function power(){const a=postfix();if(peek()&&peek().t==='^'){next();return{t:'bin',op:'^',a,b:unary()};}return a;}
  function postfix(){let a=prim();while(peek()&&peek().t==='%'){next();a={t:'pct',a};}return a;}
  function prim(){
    const k=next();if(!k)throw{err:ERR.VAL};
    if(k.t==='num')return{t:'lit',v:k.v};
    if(k.t==='str')return{t:'lit',v:k.v};
    if(k.t==='('){const n=expr();expect(')');return n;}
    if(k.t==='ref'){
      if(peek()&&peek().t===':'){next();const k2=expect('ref');return{t:'range',r1:k.row,c1:k.col,r2:k2.row,c2:k2.col};}
      return{t:'ref',r:k.row,c:k.col};
    }
    if(k.t==='name'){
      if(peek()&&peek().t==='('){
        next();const args=[];
        if(peek()&&peek().t!==')'){args.push(expr());while(peek()&&peek().t===','){next();args.push(expr());}}
        expect(')');return{t:'fn',name:k.v,args};
      }
      throw{err:ERR.NAME};
    }
    throw{err:ERR.VAL};
  }
  const n=expr();
  if(p<toks.length)throw{err:ERR.VAL};
  return n;
}
function collectDeps(n,out){
  if(!n)return out;
  if(n.t==='ref'){out.push(keyName(n.r,n.c));return out;}
  if(n.t==='range'){forRange(n,(r,c)=>out.push(keyName(r,c)));return out;}
  if(n.t==='bin'){collectDeps(n.a,out);collectDeps(n.b,out);return out;}
  if(n.t==='neg'||n.t==='pct'){collectDeps(n.a,out);return out;}
  if(n.t==='fn'){for(const a of n.args)collectDeps(a,out);return out;}
  return out;
}
function forRange(n,fn){
  const r1=Math.min(n.r1,n.r2),r2=Math.max(n.r1,n.r2),c1=Math.min(n.c1,n.c2),c2=Math.max(n.c1,n.c2);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)fn(r,c);
}
function cellAt(sh,r,c){
  if(r<0||c<0||r>=ROWS||c>=COLS)return null;
  const cell=sh.cells[keyName(r,c)];
  return cell&&cell.raw!==''?cell:null;
}
function literalVal(raw){const t=raw.trim();if(t==='')return 0;const x=Number(t);return isNaN(x)?t:x;}
function cellScalar(sh,r,c,vis){
  const cell=cellAt(sh,r,c);if(!cell)return 0;
  if(cell.raw[0]==='='){
    recalcCell(sh,keyName(r,c),vis);
    if(cell.err)throw{err:cell.err};
    return cell.val;
  }
  return literalVal(cell.raw);
}
function num(v){
  if(v&&v.__range)throw{err:ERR.VAL};
  if(typeof v==='number'){if(!isFinite(v))throw{err:ERR.NUM};return v;}
  if(typeof v==='string'&&v.trim()!==''){const x=Number(v);if(!isNaN(x))return x;}
  throw{err:ERR.VAL};
}
function evalNode(n,sh,vis){
  switch(n.t){
    case 'lit':return n.v;
    case 'neg':return -num(evalNode(n.a,sh,vis));
    case 'pct':return num(evalNode(n.a,sh,vis))/100;
    case 'ref':return cellScalar(sh,n.r,n.c,vis);
    case 'range':{
      const vals=[];
      forRange(n,(r,c)=>{
        const cell=cellAt(sh,r,c);if(!cell)return;
        if(cell.raw[0]==='='){recalcCell(sh,keyName(r,c),vis);if(cell.err)throw{err:cell.err};vals.push(cell.val);}
        else vals.push(literalVal(cell.raw));
      });
      return{__range:1,vals};
    }
    case 'bin':{
      const a=num(evalNode(n.a,sh,vis)),b=num(evalNode(n.b,sh,vis));
      switch(n.op){
        case '+':return a+b;case '-':return a-b;case '*':return a*b;
        case '/':if(b===0)throw{err:ERR.DIV};return a/b;
        case '^':{const p=Math.pow(a,b);if(!isFinite(p))throw{err:ERR.NUM};return p;}
      }
      throw{err:ERR.VAL};
    }
    case 'fn':return evalFn(n,sh,vis);
  }
  throw{err:ERR.VAL};
}
const AGG={sum:1,average:1,min:1,max:1,count:1,counta:1,median:1,product:1};
function evalFn(n,sh,vis){
  const name=n.name;
  if(name==='round'||name==='abs'||name==='sqrt'||name==='power'){
    const a=n.args.map(x=>num(evalNode(x,sh,vis)));
    if(name==='round'){const[x,d]=a;const m=Math.pow(10,d===undefined?0:Math.trunc(d));return Math.sign(x)*Math.round(Math.abs(x)*m)/m;}
    if(name==='abs')return Math.abs(a[0]);
    if(name==='sqrt'){if(a[0]<0)throw{err:ERR.NUM};return Math.sqrt(a[0]);}
    const p=Math.pow(a[0],a[1]);if(!isFinite(p))throw{err:ERR.NUM};return p;
  }
  if(AGG[name]){
    const nums=[],all=[];
    for(const arg of n.args){
      const v=evalNode(arg,sh,vis);
      if(v&&v.__range){for(const x of v.vals){all.push(x);if(typeof x==='number'&&isFinite(x))nums.push(x);}}
      else{all.push(v);nums.push(num(v));}
    }
    switch(name){
      case 'sum':return nums.reduce((a,b)=>a+b,0);
      case 'product':return nums.length?nums.reduce((a,b)=>a*b,1):0;
      case 'average':if(!nums.length)throw{err:ERR.DIV};return nums.reduce((a,b)=>a+b,0)/nums.length;
      case 'min':return nums.length?Math.min(...nums):0;
      case 'max':return nums.length?Math.max(...nums):0;
      case 'count':return nums.length;
      case 'counta':return all.length;
      case 'median':{
        if(!nums.length)throw{err:ERR.DIV};
        const s=[...nums].sort((a,b)=>a-b),m=s.length>>1;
        return s.length%2?s[m]:(s[m-1]+s[m])/2;
      }
    }
  }
  throw{err:ERR.NAME};
}
/* dependency-aware recalculation */
function recalcCell(sh,ref,vis){
  const cell=sh.cells[ref];
  if(!cell||cell.raw[0]!=='=')return;
  if('val' in cell||cell.err)return;
  if(vis.has(ref))throw{err:ERR.CYC};
  vis.add(ref);
  try{
    const v=evalNode(parse(tokenize(cell.raw.slice(1))),sh,vis);
    if(v&&v.__range)throw{err:ERR.VAL};
    if(typeof v==='number'&&!isFinite(v))throw{err:ERR.NUM};
    cell.val=v;
  }catch(e){cell.err=(e&&e.err)||ERR.VAL;}
  vis.delete(ref);
}
function setRaw(sh,ref,raw){
  const old=sh.cells[ref];
  if(old&&old.deps){
    for(const d of old.deps){const s=sh.rdeps[d];if(s){s.delete(ref);if(!s.size)delete sh.rdeps[d];}}
  }
  if(raw===''||raw==null){if(old)delete sh.cells[ref];return;}
  const c=old||(sh.cells[ref]={});
  c.raw=raw;delete c.val;delete c.err;c.deps=null;
  if(raw[0]==='='){
    try{c.deps=collectDeps(parse(tokenize(raw.slice(1))),[]);}catch(e){c.deps=[];}
    for(const d of c.deps)(sh.rdeps[d]||(sh.rdeps[d]=new Set())).add(ref);
  }
}
function invalidateRecalc(sh,roots){
  const dirty=new Set(),st=[...roots];
  while(st.length){
    const x=st.pop();
    if(dirty.has(x))continue;
    dirty.add(x);
    const rd=sh.rdeps[x];
    if(rd)rd.forEach(d=>{if(!dirty.has(d))st.push(d);});
  }
  for(const ref of dirty){const c=sh.cells[ref];if(c){delete c.val;delete c.err;}}
  for(const ref of dirty)recalcCell(sh,ref,new Set());
  if(sh===cur())for(const ref of dirty){const p=parseKey(ref);if(p)paintCell(p.r,p.c);}
}
function recalcAll(sh){for(const k in sh.cells)recalcCell(sh,k,new Set());}

/* ============================== state & DOM ============================== */
let sheets=[],activeIdx=0,sel=null,editing=null,dragging=null,refGesture=null,colDrag=null,pendingDelete=-1;
let undoStack=[],redoStack=[],sheetSeq=2;
const cur=()=>sheets[activeIdx];
const scroller=$('scroller'),table=$('sheet'),hlLayer=$('hlLayer'),selBox=$('selBox'),editor=$('cellEditor'),
      fx=$('fx'),nameBox=$('nameBox'),tabsEl=$('tabs'),statsEl=$('stats'),pop=$('confirmPop'),fileIn=$('fileIn');
let colEls=[],colHeadEls=[];

/* ============================== grid rendering ============================== */
const colW=c=>cur().colW[c]||DEF_W;
function tableWidth(){let w=HW;for(const el of colEls)w+=parseFloat(el.style.width);return w;}
function buildGrid(){
  let cols='<colgroup><col style="width:'+HW+'px">';
  for(let c=0;c<COLS;c++)cols+='<col style="width:'+colW(c)+'px">';
  cols+='</colgroup>';
  let head='<thead><tr><th class="corner"></th>';
  for(let c=0;c<COLS;c++)head+='<th class="ch" data-c="'+c+'">'+colL(c)+'<div class="rz" data-c="'+c+'"></div></th>';
  head+='</tr></thead>';
  const rows=[];
  for(let r=0;r<ROWS;r++){
    let row='<tr><th class="rh" data-r="'+r+'">'+(r+1)+'</th>';
    for(let c=0;c<COLS;c++)row+='<td data-r="'+r+'" data-c="'+c+'"></td>';
    rows.push(row+'</tr>');
  }
  table.innerHTML=cols+head+'<tbody>'+rows.join('')+'</tbody>';
  colEls=[...table.querySelectorAll('colgroup col')].slice(1);
  colHeadEls=[...table.querySelectorAll('th.ch')];
  table.style.width=tableWidth()+'px';
  paintAll();
}
function getTd(r,c){const row=table.tBodies[0].rows[r];return row?row.cells[c+1]:null;}
function displayOf(cell){
  if(cell.err)return{text:cell.err,err:true};
  if(cell.raw[0]==='='){
    if(cell.val===undefined)return{text:''};
    return typeof cell.val==='number'?{text:fmtNum(cell.val),num:true}:{text:String(cell.val)};
  }
  const t=cell.raw.trim();
  if(t!==''){const x=Number(t);if(!isNaN(x))return{text:fmtNum(x),num:true};}
  return{text:cell.raw};
}
function numValOf(cell){
  if(cell.raw[0]==='=')return typeof cell.val==='number'?cell.val:null;
  const t=cell.raw.trim();
  if(t!==''){const x=Number(t);if(!isNaN(x))return x;}
  return null;
}
function paintCell(r,c){
  const td=getTd(r,c);if(!td)return;
  const cell=cur().cells[keyName(r,c)];
  let cls='ta-l',txt='';
  if(cell){
    const d=displayOf(cell);txt=d.text;
    if(d.err)cls+=' err';
    if(cell.bold)cls+=' b';if(cell.italic)cls+=' i';if(cell.underline)cls+=' u';
    const eff=cell.align||(d.num?'r':'l');
    cls=cls.replace('ta-l','')+(eff==='c'?' ta-c':eff==='r'?' ta-r':' ta-l');
    td.style.background=cell.bg||'';
    td.style.color=cell.color||'';
  }else{td.style.background='';td.style.color='';}
  td.className=cls.trim();td.textContent=txt;
}
function paintAll(){const sh=cur();for(const k in sh.cells){const p=parseKey(k);if(p)paintCell(p.r,p.c);}}

/* ============================== selection UI ============================== */
function normSel(){return{r1:Math.min(sel.ar,sel.fr),c1:Math.min(sel.ac,sel.fc),r2:Math.max(sel.ar,sel.fr),c2:Math.max(sel.ac,sel.fc)};}
let hdrMarked=[];
function rectOf(r,c){
  const td=getTd(r,c),tb=table.getBoundingClientRect(),b=td.getBoundingClientRect();
  return{l:b.left-tb.left,t:b.top-tb.top,w:b.width,h:b.height};
}
function placeBox(el,r1,c1,r2,c2){
  const a=rectOf(r1,c1),b=rectOf(r2,c2);
  el.style.left=(a.l-1)+'px';el.style.top=(a.t-1)+'px';
  el.style.width=(b.l+b.w-a.l+2)+'px';el.style.height=(b.t+b.h-a.t+2)+'px';
}
function updateSelUI(){
  const n=normSel();
  hdrMarked.forEach(el=>el.classList.remove('on'));hdrMarked=[];
  for(let c=n.c1;c<=n.c2;c++){colHeadEls[c].classList.add('on');hdrMarked.push(colHeadEls[c]);}
  for(let r=n.r1;r<=n.r2;r++){const th=table.tBodies[0].rows[r].cells[0];th.classList.add('on');hdrMarked.push(th);}
  const single=n.r1===n.r2&&n.c1===n.c2;
  placeBox(selBox,n.r1,n.c1,n.r2,n.c2);
  selBox.classList.toggle('range',!single);
  if(document.activeElement!==nameBox)
    nameBox.value=single?keyName(n.r1,n.c1):keyName(n.r1,n.c1)+':'+keyName(n.r2,n.c2);
  const ac=cur().cells[keyName(sel.ar,sel.ac)];
  if(!editing&&document.activeElement!==fx)fx.value=ac?ac.raw:'';
  updateToolbar();updateStats();
}
function activeCell(){return cur().cells[keyName(sel.ar,sel.ac)];}
function updateToolbar(){
  const a=activeCell();
  $('tbBold').classList.toggle('pressed',!!(a&&a.bold));
  $('tbItalic').classList.toggle('pressed',!!(a&&a.italic));
  $('tbUnder').classList.toggle('pressed',!!(a&&a.underline));
  const eff=a&&a.align?a.align:(a&&displayOf(a).num?'r':'l');
  $('tbAlignL').classList.toggle('pressed',eff==='l');
  $('tbAlignC').classList.toggle('pressed',eff==='c');
  $('tbAlignR').classList.toggle('pressed',eff==='r');
  $('swText').style.background=(a&&a.color)||'#22271f';
  $('swFill').style.background=(a&&a.bg)||'#ffffff';
}
const fmtStat=v=>(Math.round(v*100)/100).toLocaleString('en-US');
function updateStats(){
  const n=normSel(),cells=cur().cells;
  let cnt=0,sum=0,nonEmpty=0;
  for(let r=n.r1;r<=n.r2;r++)for(let c=n.c1;c<=n.c2;c++){
    const cell=cells[keyName(r,c)];if(!cell||!cell.raw)continue;
    nonEmpty++;
    const v=numValOf(cell);if(v!==null){cnt++;sum+=v;}
  }
  if(n.r1===n.r2&&n.c1===n.c2&&nonEmpty===0){statsEl.innerHTML='';return;}
  const parts=[];
  if(cnt>0){parts.push('Sum <b>'+fmtStat(sum)+'</b>');if(cnt>1)parts.push('Avg <b>'+fmtStat(sum/cnt)+'</b>');}
  parts.push('Count <b>'+cnt+'</b>');
  statsEl.innerHTML=parts.join('<span class="dot">·</span>');
}

/* ============================== formula range highlighting ============================== */
function updateFormulaHighlights(){
  hlLayer.innerHTML='';
  if(!editing)return;
  const t=currentEditText().trim();
  if(t[0]!=='=')return;
  const pr=s=>{
    const m=/^\$?([A-Za-z]{1,2})\$?(\d+)$/.exec(s.trim());if(!m)return null;
    const L=m[1].toUpperCase();let col=L.charCodeAt(0)-65;
    if(L.length===2)col=26*(col+1)+(L.charCodeAt(1)-65);
    return{c:col,r:+m[2]-1};
  };
  const re=/\$?[A-Za-z]{1,2}\$?\d{1,4}(\s*:\s*\$?[A-Za-z]{1,2}\$?\d{1,4})?/g;
  const seen=new Set();let m,found=0;
  while((m=re.exec(t))&&found<6){
    if(m.index>0&&/[A-Za-z0-9_$]/.test(t[m.index-1]))continue;   // skip things like LOG10
    const parts=m[0].split(':');
    const a=pr(parts[0]),b=parts[1]?pr(parts[1]):a;
    if(!a||!b)continue;
    if(a.r<0||b.r<0||a.r>=ROWS||b.r>=ROWS||a.c<0||b.c<0||a.c>=COLS||b.c>=COLS)continue;
    const kk=keyName(Math.min(a.r,b.r),Math.min(a.c,b.c))+':'+keyName(Math.max(a.r,b.r),Math.max(a.c,b.c));
    if(seen.has(kk))continue;seen.add(kk);
    const box=document.createElement('div');
    box.className='hlbox hb'+(found%5);
    placeBox(box,Math.min(a.r,b.r),Math.min(a.c,b.c),Math.max(a.r,b.r),Math.max(a.c,b.c));
    hlLayer.appendChild(box);found++;
  }
}

/* ============================== editing ============================== */
function currentEditText(){return editing&&editing.via==='bar'?fx.value:editor.value;}
function currentEditInput(){return editing&&editing.via==='bar'?fx:editor;}
function isFormulaMode(){return !!editing&&currentEditText().trim().charAt(0)==='=';}
function placeEditor(r,c){
  const cell=cur().cells[keyName(r,c)],d=displayOf(cell||{raw:''});
  const rc=rectOf(r,c);
  editor.style.left=rc.l+'px';editor.style.top=rc.t+'px';editor.style.height=rc.h+'px';
  const eff=(cell&&cell.align)||(d.num?'r':'l');
  editor.style.textAlign=eff==='r'?'right':eff==='c'?'center':'left';
  editor.style.fontWeight=cell&&cell.bold?'700':'400';
  editor.style.fontStyle=cell&&cell.italic?'italic':'normal';
  editor.dataset.min=rc.w;
  editor.style.width=rc.w+'px';
  editor.style.display='block';
}
function growEditor(){
  if(!(editing&&editing.via==='cell'))return;
  editor.style.width=Math.max(+editor.dataset.min||100,editor.scrollWidth+16)+'px';
}
function startEdit(r,c,opt={}){
  commitEdit(null);
  sel.ar=sel.fr=r;sel.ac=sel.fc=c;
  editing={r,c,via:opt.via||'cell'};
  const cell=cur().cells[keyName(r,c)];
  if(editing.via==='cell'){
    placeEditor(r,c);
    editor.value=opt.initial!=null?opt.initial:(cell?cell.raw:'');
    editor.focus();
    editor.setSelectionRange(editor.value.length,editor.value.length);
    fx.value=editor.value;
  }else{
    fx.value=cell?cell.raw:'';
    fx.focus();
    fx.setSelectionRange(fx.value.length,fx.value.length);
  }
  updateSelUI();updateFormulaHighlights();
}
function commitEdit(move){
  if(!editing)return;
  const ed=editing;editing=null;
  const txt=(ed.via==='bar'?fx:editor).value;
  editor.style.display='none';editor.value='';
  hlLayer.innerHTML='';
  const sh=cur(),ref=keyName(ed.r,ed.c),old=sh.cells[ref];
  if(txt!==(old?old.raw:'')){pushUndo();setRaw(sh,ref,txt);invalidateRecalc(sh,[ref]);}
  if(move){
    sel.ar=sel.fr=clamp(ed.r+move.dr,0,ROWS-1);
    sel.ac=sel.fc=clamp(ed.c+move.dc,0,COLS-1);
    scrollTd();
  }
  updateSelUI();
}
function cancelEdit(){
  if(!editing)return;
  editing=null;
  editor.style.display='none';editor.value='';
  hlLayer.innerHTML='';
  fx.blur();
  updateSelUI();
}
editor.addEventListener('input',()=>{fx.value=editor.value;growEditor();updateFormulaHighlights();});
editor.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();commitEdit({dr:e.shiftKey?-1:1,dc:0});}
  else if(e.key==='Tab'){e.preventDefault();commitEdit({dr:0,dc:e.shiftKey?-1:1});}
  else if(e.key==='Escape'){e.preventDefault();cancelEdit();}
});
editor.addEventListener('blur',()=>{if(editing&&editing.via==='cell'&&!refGesture&&!colDrag)commitEdit(null);});
fx.addEventListener('focus',()=>{if(!editing){editing={r:sel.ar,c:sel.ac,via:'bar'};updateFormulaHighlights();}});
fx.addEventListener('input',()=>{if(editing&&editing.via==='cell')editor.value=fx.value;updateFormulaHighlights();});
fx.addEventListener('keydown',e=>{
  if(!editing)return;
  if(e.key==='Enter'){e.preventDefault();commitEdit({dr:e.shiftKey?-1:1,dc:0});}
  else if(e.key==='Tab'){e.preventDefault();commitEdit({dr:0,dc:e.shiftKey?-1:1});}
  else if(e.key==='Escape'){e.preventDefault();cancelEdit();}
});
fx.addEventListener('blur',()=>{if(editing&&editing.via==='bar'&&!refGesture)commitEdit(null);});

/* reference insertion by clicking / dragging the grid while editing a formula */
function refText(r0,c0,r1,c1){
  return r0===r1&&c0===c1?keyName(r0,c0)
    :keyName(Math.min(r0,r1),Math.min(c0,c1))+':'+keyName(Math.max(r0,r1),Math.max(c0,c1));
}
function insertRefToken(r1,c1){
  const inp=currentEditInput();if(!inp)return;
  const txt=refText(refGesture.r0,refGesture.c0,r1,c1);
  let s,e;
  if(refGesture.span){[s,e]=refGesture.span;}
  else{s=inp.selectionStart;e=inp.selectionEnd;}
  inp.value=inp.value.slice(0,s)+txt+inp.value.slice(e);
  const ns=s+txt.length;
  inp.setSelectionRange(ns,ns);
  refGesture.span=[s,ns];
  if(editing.via==='cell'){fx.value=editor.value;growEditor();}
  updateFormulaHighlights();
}

/* ============================== mouse: select / drag / resize ============================== */
function scrollTd(r=sel.fr,c=sel.fc){const td=getTd(r,c);if(td)td.scrollIntoView({block:'nearest',inline:'nearest'});}
scroller.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  const rz=e.target.closest('.rz');
  if(rz){startColDrag(rz,e);return;}
  const tdEl=e.target.closest('td[data-r]');
  if(editing&&isFormulaMode()){
    e.preventDefault();               // keep focus in the formula input
    if(tdEl){refGesture={r0:+tdEl.dataset.r,c0:+tdEl.dataset.c,span:null};insertRefToken(refGesture.r0,refGesture.c0);}
    return;
  }
  if(editing)commitEdit(null);
  e.preventDefault();
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  const ch=e.target.closest('th.ch');
  if(ch){
    const c=+ch.dataset.c;
    if(e.shiftKey){sel.ac=Math.min(sel.fc,c);sel.fc=Math.max(sel.fc,c);}
    else{sel.ac=sel.fc=c;dragging={mode:'cols',c0:c};}
    sel.ar=0;sel.fr=ROWS-1;updateSelUI();return;
  }
  if(e.target.closest('th.corner')){sel.ar=sel.ac=0;sel.fr=ROWS-1;sel.fc=COLS-1;updateSelUI();return;}
  const rh=e.target.closest('th.rh');
  if(rh){
    const r=+rh.dataset.r;
    if(e.shiftKey){sel.ar=Math.min(sel.fr,r);sel.fr=Math.max(sel.fr,r);}
    else{sel.ar=sel.fr=r;dragging={mode:'rows',r0:r};}
    sel.ac=0;sel.fc=COLS-1;updateSelUI();return;
  }
  if(tdEl){
    const r=+tdEl.dataset.r,c=+tdEl.dataset.c;
    if(e.shiftKey){sel.fr=r;sel.fc=c;}
    else{sel.ar=sel.fr=r;sel.ac=sel.fc=c;dragging={mode:'cells'};}
    updateSelUI();
  }
});
window.addEventListener('mousemove',e=>{
  if(colDrag){
    const w=Math.round(clamp(colDrag.w0+e.clientX-colDrag.x0,44,600));
    if(w!==colDrag.w0&&!colDrag.pushed){pushUndo();colDrag.pushed=true;}
    colEls[colDrag.c].style.width=w+'px';
    table.style.width=tableWidth()+'px';
    updateSelUI();
    if(editing&&editing.via==='cell')placeEditor(editing.r,editing.c);
    return;
  }
  if(refGesture){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tdEl=el&&el.closest?el.closest('td[data-r]'):null;
    if(tdEl)insertRefToken(+tdEl.dataset.r,+tdEl.dataset.c);
    return;
  }
  if(dragging){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el)return;
    if(dragging.mode==='cells'){
      const tdEl=el.closest('td[data-r]');
      if(tdEl){sel.fr=+tdEl.dataset.r;sel.fc=+tdEl.dataset.c;}
    }else if(dragging.mode==='cols'){
      const h=el.closest('th.ch'),tdEl=el.closest('td[data-r]');
      const c=h?+h.dataset.c:(tdEl?+tdEl.dataset.c:null);
      if(c!=null){sel.ac=Math.min(dragging.c0,c);sel.fc=Math.max(dragging.c0,c);sel.ar=0;sel.fr=ROWS-1;}
    }else{
      const h=el.closest('th.rh'),tdEl=el.closest('td[data-r]');
      const r=h?+h.dataset.r:(tdEl?+tdEl.dataset.r:null);
      if(r!=null){sel.ar=Math.min(dragging.r0,r);sel.fr=Math.max(dragging.r0,r);sel.ac=0;sel.fc=COLS-1;}
    }
    updateSelUI();
  }
});
window.addEventListener('mouseup',()=>{
  if(colDrag){
    colHeadEls[colDrag.c].querySelector('.rz').classList.remove('drag');
    document.body.classList.remove('resizing');
    if(colDrag.pushed)cur().colW[colDrag.c]=parseInt(colEls[colDrag.c].style.width);
    colDrag=null;updateSelUI();
  }
  refGesture=null;dragging=null;
});
scroller.addEventListener('dblclick',e=>{
  const tdEl=e.target.closest('td[data-r]');
  if(tdEl){startEdit(+tdEl.dataset.r,+tdEl.dataset.c);return;}
});

/* column resizing & autofit */
const meas=document.createElement('canvas').getContext('2d');
function startColDrag(rz,e){
  e.preventDefault();e.stopPropagation();
  const c=+rz.dataset.c;
  if(e.detail>=2){autofit(c);return;}        // dblclick → fit
  colDrag={c,x0:e.clientX,w0:colW(c),moved:false,pushed:false};
  rz.classList.add('drag');
  document.body.classList.add('resizing');
}
function autofit(c){
  meas.font='13px "Instrument Sans", sans-serif';
  let w=0;
  const test=s=>{const x=meas.measureText(s).width;if(x>w)w=x;};
  test(colL(c));
  for(let r=0;r<ROWS;r++){const cell=cur().cells[keyName(r,c)];if(cell)test(displayOf(cell).text);}
  const nw=Math.round(clamp(w+30,52,520));
  pushUndo();
  colEls[c].style.width=nw+'px';table.style.width=tableWidth()+'px';
  cur().colW[c]=nw;updateSelUI();
  if(editing&&editing.via==='cell')placeEditor(editing.r,editing.c);
}

/* ============================== keyboard navigation ============================== */
function jumpEdge(dr,dc){
  const sh=cur(),has=(r,c)=>!!cellAt(sh,r,c);
  let r=sel.fr,c=sel.fc;
  if(has(r,c)){
    while(true){const r2=r+dr,c2=c+dc;if(r2<0||r2>=ROWS||c2<0||c2>=COLS||!has(r2,c2))break;r=r2;c=c2;}
  }else{
    while(true){
      r+=dr;c+=dc;
      if(r<0){r=0;break;}if(r>=ROWS){r=ROWS-1;break;}
      if(c<0){c=0;break;}if(c>=COLS){c=COLS-1;break;}
      if(has(r,c))break;
    }
  }
  return[r,c];
}
window.addEventListener('keydown',e=>{
  if($('confirmPop').classList.contains('show')){if(e.key==='Escape')hidePop();return;}
  const tgt=e.target;
  if(tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA'||tgt.isContentEditable))return;
  if(editing)return;                                  // editor owns its own keys
  const k=e.key,mod=e.ctrlKey||e.metaKey,kl=k.toLowerCase();
  if(mod&&kl==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(mod&&((kl==='y')||(kl==='z'&&e.shiftKey))){e.preventDefault();redo();return;}
  if(mod&&kl==='b'){e.preventDefault();toggleFmt('bold');return;}
  if(mod&&kl==='i'){e.preventDefault();toggleFmt('italic');return;}
  if(mod&&kl==='u'){e.preventDefault();toggleFmt('underline');return;}
  if(mod&&kl==='a'){e.preventDefault();sel.ar=0;sel.ac=0;sel.fr=ROWS-1;sel.fc=COLS-1;updateSelUI();return;}
  const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(dirs[k]){
    e.preventDefault();
    const[dr,dc]=dirs[k];
    if(mod){const[nr,nc]=jumpEdge(dr,dc);sel.fr=nr;sel.fc=nc;if(!e.shiftKey){sel.ar=nr;sel.ac=nc;}}
    else{sel.fr=clamp(sel.fr+dr,0,ROWS-1);sel.fc=clamp(sel.fc+dc,0,COLS-1);if(!e.shiftKey){sel.ar=sel.fr;sel.ac=sel.fc;}}
    scrollTd();updateSelUI();return;
  }
  if(k==='Enter'){e.preventDefault();sel.fr=clamp(sel.fr+(e.shiftKey?-1:1),0,ROWS-1);sel.ar=sel.fr;scrollTd();updateSelUI();return;}
  if(k==='Tab'){e.preventDefault();sel.fc=clamp(sel.fc+(e.shiftKey?-1:1),0,COLS-1);sel.ac=sel.fc;scrollTd();updateSelUI();return;}
  if(k==='F2'){e.preventDefault();startEdit(sel.ar,sel.ac);return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();clearRange();return;}
  if(k==='Home'){e.preventDefault();if(mod){sel.ar=sel.fr=0;}sel.ac=sel.fc=0;scrollTd();updateSelUI();return;}
  if(k==='PageDown'||k==='PageUp'){e.preventDefault();sel.fr=clamp(sel.fr+(k==='PageDown'?20:-20),0,ROWS-1);sel.ar=sel.fr;scrollTd();updateSelUI();return;}
  if(k.length===1&&!mod&&!e.altKey){e.preventDefault();startEdit(sel.ar,sel.ac,{initial:k});}
});

/* ============================== formatting & clearing ============================== */
function applyToRange(fn,snapshot=true){
  const n=normSel(),sh=cur();
  if(snapshot)pushUndo();
  for(let r=n.r1;r<=n.r2;r++)for(let c=n.c1;c<=n.c2;c++){
    const ref=keyName(r,c);
    const cell=sh.cells[ref]||(sh.cells[ref]={raw:''});
    fn(cell);
  }
  for(let r=n.r1;r<=n.r2;r++)for(let c=n.c1;c<=n.c2;c++)paintCell(r,c);
  updateToolbar();updateStats();
}
function toggleFmt(prop){
  const on=!(activeCell()&&activeCell()[prop]);
  applyToRange(cell=>{if(on)cell[prop]=true;else delete cell[prop];});
}
function setStyle(prop,val){applyToRange(cell=>{if(val)cell[prop]=val;else delete cell[prop];});}
function clearRange(){
  const n=normSel(),sh=cur();
  const refs=[];
  for(let r=n.r1;r<=n.r2;r++)for(let c=n.c1;c<=n.c2;c++){
    const ref=keyName(r,c);if(sh.cells[ref])refs.push(ref);
  }
  if(!refs.length)return;
  pushUndo();
  for(const ref of refs)setRaw(sh,ref,'');
  invalidateRecalc(sh,refs);
  updateStats();
}

/* ============================== toolbar wiring ============================== */
 $('tbBold').onclick=()=>toggleFmt('bold');
 $('tbItalic').onclick=()=>toggleFmt('italic');
 $('tbUnder').onclick=()=>toggleFmt('underline');
 $('tbAlignL').onclick=()=>setStyle('align','l');
 $('tbAlignC').onclick=()=>setStyle('align','c');
 $('tbAlignR').onclick=()=>setStyle('align','r');
 $('tbClear').onclick=()=>clearRange();
 $('tbText').onclick=()=>$('pickText').click();
 $('tbFill').onclick=()=>$('pickFill').click();
 $('pickText').oninput=e=>setStyle('color',e.target.value);
 $('pickFill').oninput=e=>setStyle('bg',e.target.value);
 $('tbUndo').onclick=undo;
 $('tbRedo').onclick=redo;
 $('tbDownload').onclick=downloadCSV;
 $('tbUpload').onclick=()=>fileIn.click();

/* ============================== copy / paste (TSV) ============================== */
window.addEventListener('copy',e=>{
  if(editing)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.isContentEditable))return;
  const n=normSel(),rows=[];
  for(let r=n.r1;r<=n.r2;r++){const row=[];for(let c=n.c1;c<=n.c2;c++){const cell=cur().cells[keyName(r,c)];row.push(cell?displayOf(cell).text:'');}rows.push(row.join('\t'));}
  e.clipboardData.setData('text/plain',rows.join('\n'));e.preventDefault();
});
window.addEventListener('paste',e=>{
  if(editing)return;
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.isContentEditable))return;
  const txt=e.clipboardData.getData('text/plain');if(!txt)return;
  e.preventDefault();
  const rows=txt.replace(/\r/g,'').split('\n');if(rows.length&&rows[rows.length-1]==='')rows.pop();
  const sh=cur(),roots=[];
  pushUndo();
  rows.forEach((row,r)=>{
    const cells=row.split('\t');
    cells.forEach((v,c)=>{
      const rr=sel.ar+r,cc=sel.ac+c;
      if(rr>=ROWS||cc>=COLS)return;
      const ref=keyName(rr,cc);setRaw(sh,ref,v);roots.push(ref);
    });
  });
  invalidateRecalc(sh,roots);updateStats();
  toast('Pasted '+rows.length+' row'+(rows.length!==1?'s':''));
});

/* ============================== CSV download / upload ============================== */
const csvEsc=v=>(/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v);
function downloadCSV(){
  const sh=cur();let maxR=-1,maxC=-1;
  for(const[k,cell]of Object.entries(sh.cells)){if(!cell.raw)continue;const p=parseKey(k);if(p){maxR=Math.max(maxR,p.r);maxC=Math.max(maxC,p.c);}}
  if(maxR<0){toast('This sheet is empty');return;}
  const rows=[];
  for(let r=0;r<=maxR;r++){const row=[];for(let c=0;c<=maxC;c++){const cell=sh.cells[keyName(r,c)];row.push(cell?displayOf(cell).text:'');}rows.push(row.map(csvEsc).join(','));}
  const blob=new Blob([rows.join('\r\n')],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(sh.name.replace(/[^\w\- ]+/g,'').trim()||'sheet')+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Exported '+a.download);
}
function parseCSV(text){
  const rows=[];let row=[],field='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(field);field='';}
    else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
    else if(c==='\r'){/* ignore */}
    else field+=c;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
fileIn.addEventListener('change',()=>{
  const f=fileIn.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    const rows=parseCSV(String(rd.result));
    if(!rows.length){toast('Could not read any rows');fileIn.value='';return;}
    pushUndo();
    const sh=cur();sh.cells={};sh.rdeps={};
    const roots=[];let clipped=false;
    rows.forEach((row,r)=>{
      if(r>=ROWS){clipped=true;return;}
      row.forEach((v,c)=>{
        if(c>=COLS){clipped=true;return;}
        if(v!==''){const ref=keyName(r,c);setRaw(sh,ref,v);roots.push(ref);}
      });
    });
    recalcAll(sh);buildGrid();updateSelUI();
    toast('Imported '+rows.length+' row'+(rows.length!==1?'s':'')+(clipped?' (clipped to grid)':''));
    fileIn.value='';
  };
  rd.readAsText(f);
});

/* ============================== name box jump ============================== */
nameBox.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'){
    const m=/^\s*\$?([A-Za-z])\$?(\d+)(\s*:\s*\$?([A-Za-z])\$?(\d+))?\s*$/.exec(nameBox.value);
    if(m){
      const c1=m[1].toUpperCase().charCodeAt(0)-65,r1=+m[2]-1;
      const c2=m[4]?m[4].toUpperCase().charCodeAt(0)-65:c1,r2=m[4]?+m[5]-1:r1;
      if(r1>=0&&r1<ROWS&&c1>=0&&c1<COLS&&r2>=0&&r2<ROWS&&c2>=0&&c2<COLS){
        sel.ar=r1;sel.ac=c1;sel.fr=clamp(r2,0,ROWS-1);sel.fc=clamp(c2,0,COLS-1);
        scrollTd();updateSelUI();nameBox.blur();return;
      }
    }
    toast('Not a valid address');
    nameBox.value=keyName(sel.fr,sel.fc);
  }
  if(e.key==='Escape'){nameBox.value=keyName(sel.fr,sel.fc);nameBox.blur();}
});

/* ============================== sheets UI ============================== */
function renderTabs(){
  tabsEl.innerHTML='';
  sheets.forEach((s,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===activeIdx?' active':'');
    b.innerHTML='<span class="tname">'+esc(s.name)+'</span>'+
      '<span class="x" data-i="'+i+'" title="Delete"><svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 2l6 6M8 2l-6 6"/></svg></span>';
    b.addEventListener('click',e=>{if(e.target.closest('.x')){askDelete(i);return;}if(i!==activeIdx)switchSheet(i);});
    b.addEventListener('dblclick',()=>renameTab(i,b));
    tabsEl.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='addtab';add.setAttribute('data-tip','New sheet');
  add.innerHTML='<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>';
  add.onclick=addSheet;tabsEl.appendChild(add);
}
function switchSheet(i){
  commitEdit(null);
  activeIdx=i;sel=cur().sel;
  buildGrid();renderTabs();updateSelUI();
}
function addSheet(){
  pushUndo();
  const name='Sheet'+(++sheetSeq);
  sheets.splice(activeIdx+1,0,{id:Date.now(),name,colW:{},cells:{},rdeps:{},sel:{ar:0,ac:0,fr:0,fc:0}});
  activeIdx++;
  sel=cur().sel;buildGrid();renderTabs();updateSelUI();
  toast('Added '+name);
}
function renameTab(i,btn){
  const span=btn.querySelector('.tname');
  const inp=document.createElement('input');
  inp.className='tabrename';inp.value=sheets[i].name;
  span.replaceWith(inp);inp.focus();inp.select();
  const done=ok=>{
    const v=inp.value.trim();
    if(ok&&v&&v!==sheets[i].name){pushUndo();sheets[i].name=v;}
    renderTabs();
  };
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')done(true);else if(e.key==='Escape')done(false);});
  inp.addEventListener('blur',()=>done(true));
  inp.addEventListener('mousedown',e=>e.stopPropagation());
  inp.addEventListener('click',e=>e.stopPropagation());
}
function askDelete(i){
  if(sheets.length<=1){toast('A workbook needs at least one sheet');return;}
  pendingDelete=i;
  const tab=tabsEl.children[i].getBoundingClientRect();
  pop.style.left=clamp(tab.left,8,innerWidth-258)+'px';
  pop.style.top=(tab.bottom+8)+'px';
  $('cpName').textContent=sheets[i].name;
  pop.classList.add('show');
}
function hidePop(){pop.classList.remove('show');pendingDelete=-1;}
 $('cpYes').onclick=()=>{
  if(pendingDelete>=0&&pendingDelete<sheets.length){
    pushUndo();
    const wasActive=pendingDelete===activeIdx;
    sheets.splice(pendingDelete,1);
    if(wasActive){activeIdx=Math.min(activeIdx,sheets.length-1);sel=cur().sel;buildGrid();}
    else if(pendingDelete<activeIdx)activeIdx--;
    renderTabs();updateSelUI();
    toast('Sheet deleted');
  }
  hidePop();
};
 $('cpNo').onclick=hidePop;
window.addEventListener('mousedown',e=>{
  if(pop.classList.contains('show')&&!pop.contains(e.target))hidePop();
});

/* ============================== undo / redo ============================== */
function serialize(){
  return JSON.stringify({
    i:activeIdx,sel:{ar:sel.ar,ac:sel.ac,fr:sel.fr,fc:sel.fc},
    sheets:sheets.map(s=>({
      id:s.id,name:s.name,colW:s.colW,
      cells:Object.fromEntries(Object.entries(s.cells).map(([k,c])=>{
        const o={raw:c.raw};for(const p of['bold','italic','underline','color','bg','align'])if(c[p])o[p]=c[p];
        return[k,o];
      }))
    }))
  });
}
function restore(json){
  const d=JSON.parse(json);
  sheets=d.sheets.map(sd=>{
    const sh={id:sd.id,name:sd.name,colW:sd.colW||{},cells:{},rdeps:{},sel:{ar:0,ac:0,fr:0,fc:0}};
    for(const[k,c]of Object.entries(sd.cells)){
      const cell={raw:c.raw||''};
      for(const p of['bold','italic','underline','color','bg','align'])if(c[p])cell[p]=c[p];
      sh.cells[k]=cell;
    }
    return sh;
  });
  activeIdx=clamp(d.i,0,sheets.length-1);
  sel=cur().sel;Object.assign(sel,d.sel);
  for(const sh of sheets){
    for(const[k,cell]of Object.entries(sh.cells)){
      if(cell.raw[0]==='='){
        try{cell.deps=collectDeps(parse(tokenize(cell.raw.slice(1))),[]);}catch(e){cell.deps=[];}
        for(const dd of cell.deps)(sh.rdeps[dd]||(sh.rdeps[dd]=new Set())).add(k);
      }
    }
    recalcAll(sh);
  }
  buildGrid();renderTabs();updateSelUI();
}
function pushUndo(){undoStack.push(serialize());if(undoStack.length>60)undoStack.shift();redoStack.length=0;}
function undo(){if(!undoStack.length){toast('Nothing to undo');return;}redoStack.push(serialize());restore(undoStack.pop());}
function redo(){if(!redoStack.length){toast('Nothing to redo');return;}undoStack.push(serialize());restore(redoStack.pop());}

/* ============================== toast ============================== */
function toast(msg){
  const d=document.createElement('div');
  d.className='toast';d.textContent=msg;
  $('toasts').appendChild(d);
  setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300);},2400);
}

/* ============================== seed data ============================== */
function seed(){
  const sh={id:1,name:'Budget',cells:{},colW:{0:128},rdeps:{},sel:{ar:0,ac:0,fr:0,fc:0}};
  const data=[
    ['Category','Jan','Feb','Mar','Total','Share %'],
    ['Rent',1240,1240,1265],
    ['Groceries',342,361,318],
    ['Transport',96,118,84],
    ['Utilities',141,158,150],
    ['Dining out',205,189,236],
    ['Subscriptions',45,45,45]
  ];
  const put=(r,c,raw,style)=>{
    const cell={raw:String(raw)};if(style)Object.assign(cell,style);
    sh.cells[keyName(r,c)]=cell;
  };
  data.forEach((row,r)=>row.forEach((v,c)=>put(r,c,v)));
  for(let r=1;r<=6;r++){
    put(r,4,'=SUM(B'+(r+1)+':D'+(r+1)+')');
    put(r,5,'=ROUND(E'+(r+1)+'/E8*100,1)');
  }
  put(7,0,'Total',{bold:true});
  for(let c=1;c<=3;c++)put(7,c,'=SUM('+colL(c)+'2:'+colL(c)+'7)',{bold:true});
  put(7,4,'=SUM(E2:E7)',{bold:true});
  put(8,0,'Average',{bold:true});
  for(let c=1;c<=3;c++)put(8,c,'=AVERAGE('+colL(c)+'2:'+colL(c)+'7)',{bold:true});
  put(8,4,'=ROUND(AVERAGE(E2:E7),1)',{bold:true});
  put(9,0,'Lowest',{italic:true});
  for(let c=1;c<=4;c++)put(9,c,'=MIN('+colL(c)+'2:'+colL(c)+'7)');
  put(10,0,'Highest',{italic:true});
  for(let c=1;c<=4;c++)put(10,c,'=MAX('+colL(c)+'2:'+colL(c)+'7)');
  for(let c=0;c<6;c++){const cell=sh.cells[keyName(0,c)];cell.bold=true;cell.bg='#e2efe7';cell.align='c';}
  sheets.push(sh);
  sheets.push({id:2,name:'Sheet2',cells:{},colW:{},rdeps:{},sel:{ar:0,ac:0,fr:0,fc:0}});
  activeIdx=0;sel=sh.sel;
  for(const s of sheets){
    for(const[k,cell]of Object.entries(s.cells)){
      if(cell.raw[0]==='='){
        try{cell.deps=collectDeps(parse(tokenize(cell.raw.slice(1))),[]);}catch(e){cell.deps=[];}
        for(const dd of cell.deps)(s.rdeps[dd]||(s.rdeps[dd]=new Set())).add(k);
      }
    }
    recalcAll(s);
  }
}

/* ============================== init ============================== */
seed();
buildGrid();
renderTabs();
updateSelUI();
setTimeout(()=>toast('Tip: edit a cell starting with =, then drag on the grid to insert ranges'),900);
