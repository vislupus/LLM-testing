<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Clone</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }

    .toolbar {
        background-color: #f1f1f1;
        padding: 5px;
    }

    .sheet {
        display: grid;
        grid-template-columns: repeat(26, 100px);
    }

    .cell {
        border: 1px solid #ccc;
        padding: 5px;
    }

    .selected {
        background-color: lightblue;
    }

    .formula-bar {
        background-color: #f1f1f1;
        padding: 5px;
    }
</style>
</head>
<body>
<div class="toolbar">
    <button onclick="applyBold()">Bold</button>
    <button onclick="applyItalic()">Italic</button>
    <input type="color" id="bgColorPicker" onchange="applyBackgroundColor(event)">
</div>

<div class="sheet">
    <div></div>
    <div>A</div>
    <div>B</div>
    <!-- Add more column headers as needed -->

    <!-- Sample cells for demonstration -->
    <div>1</div>
    <div class="cell" data-cell="A1" contenteditable></div>
    <div class="cell" data-cell="B1" contenteditable></div>
    <!-- Add more row numbers and cells as needed -->
</div>

<div class="formula-bar">
    Formula: <span id="formula"></span>
</div>

<script>
const cells = document.querySelectorAll('.cell');
let selectedCell = null;

cells.forEach(cell => {
    cell.addEventListener('click', () => {
        if (selectedCell) {
            selectedCell.classList.remove('selected');
        }
        cell.classList.add('selected');
        selectedCell = cell;

        const cellAddress = cell.getAttribute('data-cell');
        const cellFormula = getCellFormula(cellAddress);
        document.getElementById('formula').innerText = cellFormula;
    });

    cell.addEventListener('keyup', () => {
        // Implement formula parsing and calculation here
    });
});

function getCellFormula(cellAddress) {
    // Implement getting cell formula logic here
    return '';
}

function applyBold() {
    if (selectedCell) {
        selectedCell.style.fontWeight = selectedCell.style.fontWeight === 'bold' ? 'normal' : 'bold';
    }
}

function applyItalic() {
    if (selectedCell) {
        selectedCell.style.fontStyle = selectedCell.style.fontStyle === 'italic' ? 'normal' : 'italic';
    }
}

function applyBackgroundColor(event) {
    const color = event.target.value;
    if (selectedCell) {
        selectedCell.style.backgroundColor = color;
    }
}
</script>
</body>
</html>
