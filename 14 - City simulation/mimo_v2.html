<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D City Simulation</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
#c{width:100vw;height:100vh;display:block}
#panel{position:fixed;top:20px;left:20px;background:rgba(10,10,24,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:22px;color:#fff;width:270px;z-index:10;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#panel h2{font-size:17px;font-weight:600;margin-bottom:4px;letter-spacing:-.3px}
.sub{font-size:10.5px;color:rgba(255,255,255,.35);margin-bottom:18px}
.g{margin-bottom:14px}
.g .l{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:5px;color:rgba(255,255,255,.7)}
.g .v{color:#5eead4;font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.1);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#5eead4;cursor:pointer;box-shadow:0 0 6px rgba(94,234,212,.5)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#5eead4;cursor:pointer;border:none}
#stats{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:rgba(255,255,255,.45);line-height:1.9}
#stats span{color:#5eead4;font-weight:600;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h2>🏙️ City Simulation</h2>
  <p class="sub">Watch your metropolis grow in real time</p>
  <div class="g"><div class="l"><span>👥 Population</span><span class="v" id="vp">50,000</span></div><input type="range" id="sp" min="5000" max="500000" step="5000" value="50000"></div>
  <div class="g"><div class="l"><span>🚗 Traffic Intensity</span><span class="v" id="vt">50%</span></div><input type="range" id="st" min="0" max="100" step="1" value="50"></div>
  <div class="g"><div class="l"><span>⚡ Development Speed</span><span class="v" id="vs">1.0×</span></div><input type="range" id="ss" min="1" max="10" step="1" value="5"></div>
  <div id="stats">
    🏢 Buildings: <span id="sb">0</span><br>
    🛣️ Road Segments: <span id="sr">0</span><br>
    🚗 Vehicles: <span id="sc">0</span><br>
    🚶 Pedestrians: <span id="sp2">0</span>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function(){
'use strict';

var canvas = document.getElementById('c');
var engine = new BABYLON.Engine(canvas, true, {stencil:true}, true);

/* ═══════════════ SCENE SETUP ═══════════════ */
var scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.48,0.58,0.72,1);
scene.ambientColor = new BABYLON.Color3(0.12,0.12,0.15);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = 0.0015;
scene.fogColor = new BABYLON.Color3(0.48,0.58,0.72);

var camera = new BABYLON.ArcRotateCamera("cam",-Math.PI/2.4, Math.PI/3.4, 90, BABYLON.Vector3.Zero(), scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=18;
camera.upperRadiusLimit=220;
camera.lowerBetaLimit=0.15;
camera.upperBetaLimit=Math.PI/2.15;
camera.wheelPrecision=12;
camera.panningAxis=new BABYLON.Vector3(1,0,1);
camera.maxZ=400;

var sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1,-3,-2).normalize(), scene);
sun.position = new BABYLON.Vector3(60,120,80);
sun.intensity = 1.35;
sun.diffuse = new BABYLON.Color3(1,0.96,0.85);

var ambient = new BABYLON.HemisphericLight("amb", new BABYLON.Vector3(0,1,0), scene);
ambient.intensity = 0.45;
ambient.groundColor = new BABYLON.Color3(0.08,0.1,0.15);

var cityGlow = new BABYLON.PointLight("glow", new BABYLON.Vector3(0,20,0), scene);
cityGlow.intensity = 0.3;
cityGlow.range = 180;
cityGlow.diffuse = new BABYLON.Color3(1,0.9,0.7);

var shGen;
function makeShadows(){
  if(shGen) shGen.dispose();
  shGen = new BABYLON.ShadowGenerator(1024,sun);
  shGen.useBlurExponentialShadowMap = true;
  shGen.blurKernel = 16;
  shGen.setDarkness(0.45);
}

/* ═══════════════ PROCEDURAL TEXTURES ═══════════════ */
function mkRoadTex(){
  var t = new BABYLON.DynamicTexture("roadTex",{width:256,height:256},scene);
  var c = t.getContext();
  c.fillStyle="#333"; c.fillRect(0,0,256,256);
  c.strokeStyle="#555"; c.lineWidth=2;
  for(var i=0;i<256;i+=28){ c.beginPath();c.moveTo(i,0);c.lineTo(i,256);c.stroke(); }
  c.setLineDash([12,18]); c.strokeStyle="#ee3"; c.lineWidth=3;
  c.beginPath();c.moveTo(128,0);c.lineTo(128,256);c.stroke();
  t.update(); return t;
}

function mkBldgTex(){
  var t = new BABYLON.DynamicTexture("bldgTex",{width:128,height:256},scene);
  var c = t.getContext();
  c.fillStyle="#667"; c.fillRect(0,0,128,256);
  c.fillStyle="#aad5ff";
  for(var y=8;y<250;y+=20) for(var x=6;x<122;x+=18) c.fillRect(x,y,12,14);
  t.update(); return t;
}

/* ═══════════════ MATERIALS ═══════════════ */
var mats = {};
function mat(name, r,g,b, opts){
  var m = new BABYLON.StandardMaterial(name, scene);
  m.diffuseColor = new BABYLON.Color3(r,g,b);
  if(opts){ if(opts.em) m.emissiveColor = new BABYLON.Color3(opts.em[0],opts.em[1],opts.em[2]); if(opts.a!==undefined) m.alpha=opts.a; }
  mats[name]=m; return m;
}

var groundMat = mat("ground",0.16,0.26,0.13);
mat("road",0.22,0.22,0.24);
mat("sidewalk",0.52,0.51,0.48);
mat("bGlass",0.38,0.58,0.72);
mat("bDark",0.28,0.30,0.35);
mat("bGray",0.58,0.57,0.55);
mat("bTan",0.68,0.62,0.52);
mat("bConcrete",0.62,0.62,0.60);
mat("bRed",0.58,0.36,0.33);
mat("bWhite",0.80,0.79,0.77);
mat("bBlue",0.33,0.42,0.58);
mat("bGreen",0.33,0.52,0.42);
mat("windowLit",[0.95,0.92,0.65],{em:[0.55,0.5,0.3]});
mat("windowDark",0.12,0.12,0.16);
mat("treeTrunk",0.28,0.18,0.08);
mat("treeLeaf",0.13,0.42,0.11);
mat("treeLeaf2",0.18,0.52,0.16);
mat("lampPole",0.25,0.25,0.28);
mat("lampBulb",1,0.92,0.55,{em:[2.5,2.2,1.2]});
mat("wheel",0.12,0.12,0.12);
mat("skin1",0.82,0.66,0.52);
mat("skin2",0.55,0.38,0.25);
mat("skin3",0.92,0.80,0.68);
mat("hair1",0.15,0.12,0.08);
mat("hair2",0.38,0.25,0.12);
mat("hair3",0.55,0.35,0.15);
var ground = BABYLON.MeshBuilder.CreateGround("gnd",{width:350,height:350},scene);
ground.material = groundMat; ground.receiveShadows=true;

/* ═══════════════ STATE ═══════════════ */
var buildQueue = [], traffic = [], peds = [];
var pop=50000, traf=50, spd=5;
var GRID, BS=6, RW=4, needRebuild=true;
var bMats = ["bGlass","bDark","bGray","bTan","bConcrete","bRed","bWhite","bBlue","bGreen"];
var carCols = [
  [0.85,0.12,0.1],[0.1,0.2,0.75],[0.95,0.95,0.95],[0.12,0.12,0.12],
  [0.15,0.55,0.25],[0.85,0.65,0.08],[0.5,0.1,0.55],[0.9,0.5,0.1],
  [0.2,0.7,0.8],[0.6,0.15,0.15],[0.95,0.8,0.15],[0.15,0.15,0.45]
];

/* ═══════════════ CLEAR ═══════════════ */
function clearAll(){
  if(shGen){shGen.dispose();shGen=null;}
  buildQueue=[];
  traffic.forEach(function(v){v.meshes.forEach(function(m){m.dispose()});}); traffic=[];
  peds.forEach(function(p){p.meshes.forEach(function(m){m.dispose()});}); peds=[];
  scene.meshes.slice().forEach(function(m){
    if(m!==ground && !m._isCamera){
      try{
        if(shGen) shGen.removeShadowCaster(m);
        m.dispose();
      }catch(e){}
    }
  });
}

/* ═══════════════ RNG ═══════════════ */
var _s;
function rng(a){_s=((_s*1103515245+12345)&0x7fffffff);return(_s%10000)/10000;}
function rr(a,b){return a+rng()*(b-a);}

/* ═══════════════ BUILD CITY ═══════════════ */
function buildCity(){
  clearAll();
  _s=42; makeShadows();
  buildQueue=[];traffic=[];peds=[];

  var maxB=10, dens=Math.min(1,pop/250000);
  GRID=Math.max(3,Math.min(7,Math.floor(pop/70000)+3));
  var half=GRID*BS;

  // ─── Roads ───
  var rdM=mats["road"], swM=mats["sidewalk"];
  for(var i=0;i<=GRID;i++){
    var p=-half+i*BS;
    var rh=BABYLON.MeshBuilder.CreateBox("rh"+i,{width:half*2,height:0.06,depth:RW},scene);
    rh.position.set(0,0.03,p); rh.material=rdM; rh.receiveShadows=true;
    var sw1=BABYLON.MeshBuilder.CreateBox("swH1_"+i,{width:half*2,height:0.08,depth:0.5},scene);
    sw1.position.set(0,0.04,p+RW/2+0.25); sw1.material=swM; sw1.receiveShadows=true;
    var sw2=BABYLON.MeshBuilder.CreateBox("swH2_"+i,{width:half*2,height:0.08,depth:0.5},scene);
    sw2.position.set(0,0.04,p-RW/2-0.25); sw2.material=swM; sw2.receiveShadows=true;

    var rv=BABYLON.MeshBuilder.CreateBox("rv"+i,{width:RW,height:0.06,depth:half*2},scene);
    rv.position.set(p,0.03,0); rv.material=rdM; rv.receiveShadows=true;
    var sw3=BABYLON.MeshBuilder.CreateBox("swV1_"+i,{width:0.5,height:0.08,depth:half*2},scene);
    sw3.position.set(p+RW/2+0.25,0.04,0); sw3.material=swM; sw3.receiveShadows=true;
    var sw4=BABYLON.MeshBuilder.CreateBox("swV2_"+i,{width:0.5,height:0.08,depth:half*2},scene);
    sw4.position.set(p-RW/2-0.25,0.04,0); sw4.material=swM; sw4.receiveShadows=true;
  }
  var nRoads = (GRID+1)*4;

  // ─── Blocks ───
  var nBldg=0, nTree=0;
  for(var gx=0;gx<GRID;gx++){
    for(var gz=0;gz<GRID;gz++){
      var cx=-half+(gx+0.5)*BS, cz=-half+(gz+0.5)*BS;
      var bs=BS-RW-1.5, hbs=bs/2;
      var nb=1+Math.floor(rng()*3);

      for(var b=0;b<nb;b++){
        if(rng()>dens*0.85+0.15) continue;
        var bw=rr(bs*0.18,bs*0.48);
        var bd=rr(bs*0.18,bs*0.48);
        var bh=rr(2, 3+maxB*(pop/500000));
        var ox=rr(-hbs+bw/2,hbs-bw/2);
        var oz=rr(-hbs+bd/2,hbs-bd/2);
        var mi=bMats[Math.floor(rng()*bMats.length)];

        var bldg=BABYLON.MeshBuilder.CreateBox("b_"+gx+"_"+gz+"_"+b,
          {width:bw,height:bh,depth:bd},scene);
        bldg.position.set(cx+ox,bh*0.01,cz+oz);
        bldg.material=mats[mi];
        bldg.receiveShadows=true;
        shGen.addShadowCaster(bldg);
        nBldg++;

        buildQueue.push({m:bldg,sh:bh,sc:0.01,mt:0,dl:rng()*1.5});
      }

      // trees
      var nt=Math.floor(rng()*4)+1;
      for(var ti=0;ti<nt;ti++){
        var tx=cx+rr(-hbs+0.5,hbs-0.5);
        var tz=cz+rr(-hbs+0.5,hbs-0.5);
        var ts=rr(0.4,0.85);

        var trunk=BABYLON.MeshBuilder.CreateBox("tk_"+gx+"_"+gz+"_"+ti,
          {width:0.2,height:1.5*ts,depth:0.2},scene);
        trunk.position.set(tx,0.75*ts,tz);
        trunk.material=mats["treeTrunk"];
        shGen.addShadowCaster(trunk);
        nTree++;

        var foliage=BABYLON.MeshBuilder.CreateSphere("fl_"+gx+"_"+gz+"_"+ti,
          {diameter:2.4*ts,segments:5},scene);
        foliage.position.set(tx,1.7*ts+0.3,tz);
        foliage.material=rng()>0.5?mats["treeLeaf"]:mats["treeLeaf2"];
        shGen.addShadowCaster(foliage);

        buildQueue.push({m:trunk,sh:ts,sc:0.01,mt:0,dl:rng()*1.2});
        buildQueue.push({m:foliage,sh:1,sc:0.01,mt:0,dl:rng()*1.2,origY:1.7*ts+0.3});
      }

      // street lamps at road intersections
      if(rng()>0.4){
        var lpx=cx, lpz=cz;
        var pole=BABYLON.MeshBuilder.CreateBox("lp_"+gx+"_"+gz,
          {width:0.12,height:3.8,depth:0.12},scene);
        pole.position.set(lpx,1.9,lpz);
        pole.material=mats["lampPole"];

        var arm=BABYLON.MeshBuilder.CreateBox("la_"+gx+"_"+gz,
          {width:1.2,height:0.08,depth:0.08},scene);
        arm.position.set(lpx+0.6,3.7,lpz);
        arm.material=mats["lampPole"];

        var bulb=BABYLON.MeshBuilder.CreateSphere("lb_"+gx+"_"+gz,
          {diameter:0.3,segments:5},scene);
        bulb.position.set(lpx+1.1,3.6,lpz);
        bulb.material=mats["lampBulb"];

        var pl=new BABYLON.PointLight("pl_"+gx+"_"+gz,
          new BABYLON.Vector3(lpx+1.1,3.2,lpz),scene);
        pl.intensity=0.25; pl.range=10;
        pl.diffuse=new BABYLON.Color3(1,0.9,0.6);
      }
    }
  }

  // ─── Background terrain hills ───
  for(var hi=0;hi<12;hi++){
    var hx=rr(-140,140), hz=rr(-140,140);
    if(Math.abs(hx)<half+10 && Math.abs(hz)<half+10) continue;
    var hill=BABYLON.MeshBuilder.CreateCylinder("hill"+hi,
      {height:rr(2,6),diameterTop:0,diameterBottom:rr(10,25),tessellation:6},scene);
    hill.position.set(hx,0,hz);
    hill.material=groundMat;
  }

  camera.target.set(0,2,0);
  updStats(nBldg,nRoads);
}

/* ═══════════════ SPAWN TRAFFIC ═══════════════ */
function spawnTraffic(){
  var half=GRID*BS, tc=Math.max(0,Math.floor(traf*GRID*0.6));
  for(var i=0;i<tc;i++){
    var isH=rng()>0.5, ri=Math.floor(rng()*(GRID+1)), lp=-half+ri*BS;
    var col=carCols[Math.floor(rng()*carCols.length)];
    var cs=rr(4,10), dir=rng()>0.5?1:-1;
    var carM=new BABYLON.TransformNode("carG"+i,scene);
    var body=BABYLON.MeshBuilder.CreateBox("carB"+i,{width:1.6,height:0.55,depth:3},scene);
    body.parent=carM;
    var cm=new BABYLON.StandardMaterial("cm"+i,scene);
    cm.diffuseColor=new BABYLON.Color3(col[0],col[1],col[2]);
    cm.specularColor=new BABYLON.Color3(0.4,0.4,0.4);
    body.material=cm;

    var cab=BABYLON.MeshBuilder.CreateBox("cab"+i,{width:1.3,height:0.45,depth:1.5},scene);
    cab.position.y=0.48; cab.parent=carM; cab.material=cm;

    // windshield
    var ws=new BABYLON.StandardMaterial("ws"+i,scene);
    ws.diffuseColor=new BABYLON.Color3(0.5,0.7,0.9); ws.alpha=0.6;
    var windshield=BABYLON.MeshBuilder.CreateBox("wsb"+i,{width:1.25,height:0.4,depth:0.05},scene);
    windshield.position.set(0,0.48,0.65); windshield.parent=carM; windshield.material=ws;

    [-0.55,0.55].forEach(function(ox,wi){
      var wh=BABYLON.MeshBuilder.CreateCylinder("wh"+i+"_"+wi,{height:0.25,diameter:0.45,tessellation:8},scene);
      wh.position.set(ox,-0.15,1); wh.rotation.z=Math.PI/2; wh.parent=carM; wh.material=mats["wheel"];
      var wh2=wh.clone("whB"+i+"_"+wi); wh2.position.z=-1;
    });

    var sp=(isH?{x:lp,z:rr(-half,hbs)}:{x:rr(-half,half),z:lp});
    if(!isH){carM.rotation.y=Math.PI/2; var tmp=sp.x;sp.x=sp.z;sp.z=tmp;}
    carM.position.set(sp.x,0.35,sp.z);

    traffic.push({meshes:[carM],pos:isH?{x:sp.x,z:lp}:{x:lp,z:sp.z},
      dir:dir,speed:cs,isH:isH,lp:lp,half:half});
  }
}

/* ═══════════════ SPAWN PEDESTRIANS ═══════════════ */
function spawnPeds(){
  var half=GRID*BS, pc=Math.floor(pop/1200);
  for(var i=0;i<pc;i++){
    var pm=new BABYLON.TransformNode("pedG"+i,scene);
    var skins=["skin1","skin2","skin3"];
    var hairs=["hair1","hair2","hair3"];
    var si=Math.floor(rng()*3);

    var torso=BABYLON.MeshBuilder.CreateCylinder("pdT"+i,{height:1,diameter:0.35,tessellation:5},scene);
    torso.material=mats[skins[si]]; torso.parent=pm;

    var head=BABYLON.MeshBuilder.CreateSphere("pdH"+i,{diameter:0.32,segments:5},scene);
    head.position.y=0.8; head.parent=pm; head.material=mats[skins[si]];

    var hair=BABYLON.MeshBuilder.CreateSphere("pdHair"+i,{diameter:0.34,segments:5},scene);
    hair.position.y=0.88; hair.parent=pm; hair.material=mats[hairs[si]];
    hair.scaling=new BABYLON.Vector3(1,0.4,1);

    // arms
    [-0.25,0.25].forEach(function(ax,ai){
      var arm=BABYLON.MeshBuilder.CreateCylinder("pdA"+i+"_"+ai,{height:0.55,diameter:0.1,tessellation:4},scene);
      arm.position.set(ax,-0.15,0); arm.parent=pm; arm.material=mats[skins[si]];
    });

    var gx=Math.floor(rng()*GRID), gz=Math.floor(rng()*GRID);
    var bs2=BS-RW-1.5;
    var px=-half+(gx+0.5)*BS+rr(-bs2/2,bs2/2);
    var pz=-half+(gz+0.5)*BS+rr(-bs2/2,bs2/2);
    pm.position.set(px,0.75,pz);

    var tx=-half+(gx+0.5)*BS+rr(-bs2/2,bs2/2);
    var tz=-half+(gz+0.5)*BS+rr(-bs2/2,bs2/2);

    peds.push({meshes:[pm],pos:{x:px,z:pz},tgt:{x:tx,z:tz},
      speed:rr(0.4,1.8),bob:rng()*6.28,gx:gx,gz:gz,bs2:bs2});
  }
}

/* ═══════════════ UI ═══════════════ */
function fmtNum(n){return n.toLocaleString();}

document.getElementById('sp').oninput=function(){
  pop=+this.value;
  document.getElementById('vp').textContent=fmtNum(pop);
  needRebuild=true;
};
document.getElementById('st').oninput=function(){
  traf=+this.value;
  document.getElementById('vt').textContent=traf+'%';
  needRebuild=true;
};
document.getElementById('ss').oninput=function(){
  spd=+this.value/5;
  document.getElementById('vs').textContent=spd.toFixed(1)+'×';
};

function updStats(b,r){
  document.getElementById('sb').textContent=fmtNum(b);
  document.getElementById('sr').textContent=fmtNum(r);
  document.getElementById('sc').textContent=fmtNum(traffic.length);
  document.getElementById('sp2').textContent=fmtNum(peds.length);
}

/* ═══════════════ RENDER LOOP ═══════════════ */
var lt=performance.now();

engine.runRenderLoop(function(){
  var now=performance.now();
  var dt=Math.min((now-lt)/1000,0.05);
  lt=now;

  if(needRebuild){needRebuild=false;buildCity();spawnTraffic();spawnPeds();}

  // grow buildings & trees
  var active=0;
  for(var i=buildQueue.length-1;i>=0;i--){
    var q=buildQueue[i];
    if(q.dl>0){q.dl-=dt*spd;continue;}
    if(q.sc<1){
      active++;
      q.mt+=dt*spd*0.7;
      var t=Math.min(1,q.mt);
      t=1-Math.pow(1-t,3); // easeOutCubic
      q.sc=0.01+0.99*t;
      if(q.origY!==undefined){
        q.m.scaling.set(q.sc,q.sc,q.sc);
      } else {
        q.m.scaling.y=q.sc;
      }
      if(q.sc>=1){
        // add windows to buildings
        if(q.sh>3 && q.m.name && q.m.name.indexOf("b_")===0){
          var pos=q.m.position, sc=q.m.scaling;
          var bw=q.m._options?q.m._options.width:1, bd=q.m._options?q.m._options.depth:1;
          var floors=Math.floor(q.sh/2.2);
          var wWorldH=0.45;
          var wLocalScaleY=wWorldH/(q.sh);
          for(var fl=0;fl<floors;fl++){
            var wy=0.8+fl*2.1;
            if(wy>q.sh-0.6) break;
            for(var side=0;side<4;side++){
              for(var wx=0;wx<2;wx++){
                var win=BABYLON.MeshBuilder.CreatePlane("win",{width:0.55,height:wWorldH},scene);
                win.parent=q.m;
                var lit=Math.random()>0.3;
                win.material=lit?mats["windowLit"]:mats["windowDark"];
                var wo=bw*0.42, oi=bd*0.22;
                switch(side){
                  case 0:win.position.set(-oi+wx*oi*2, wy/q.sh-0.5,  wo/q.sh*(q.sh));break;
                  case 1:win.position.set(-oi+wx*oi*2, wy/q.sh-0.5, -wo/q.sh*(q.sh));break;
                  case 2:win.position.set( wo/q.sh*(q.sh), wy/q.sh-0.5, -oi+wx*oi*2);win.rotation.y=Math.PI/2;break;
                  case 3:win.position.set(-wo/q.sh*(q.sh), wy/q.sh-0.5, -oi+wx*oi*2);win.rotation.y=Math.PI/2;break;
                }
                win.scaling.y=1;
              }
            }
          }
        }
        buildQueue.splice(i,1);
      }
    } else {
      buildQueue.splice(i,1);
    }
  }

  // vehicles
  traffic.forEach(function(v){
    if(v.isH) v.pos.x+=v.speed*v.dir*dt;
    else v.pos.z+=v.speed*v.dir*dt;
    if(v.isH){
      if(v.pos.x>v.half+5) v.pos.x=-v.half-5;
      if(v.pos.x<-v.half-5) v.pos.x=v.half+5;
      v.meshes[0].position.set(v.pos.x,0.35,v.lp);
      v.meshes[0].rotation.y=v.dir>0?0:Math.PI;
    } else {
      if(v.pos.z>v.half+5) v.pos.z=-v.half-5;
      if(v.pos.z<-v.half-5) v.pos.z=v.half+5;
      v.meshes[0].position.set(v.lp,0.35,v.pos.z);
      v.meshes[0].rotation.y=v.dir>0?-Math.PI/2:Math.PI/2;
    }
  });

  // pedestrians
  peds.forEach(function(p){
    var dx=p.tgt.x-p.pos.x, dz=p.tgt.z-p.pos.z;
    var dist=Math.sqrt(dx*dx+dz*dz);
    if(dist<0.5){
      var half=GRID*BS;
      p.tgt.x=-half+(p.gx+0.5)*BS+rr(-p.bs2/2,p.bs2/2);
      p.tgt.z=-half+(p.gz+0.5)*BS+rr(-p.bs2/2,p.bs2/2);
    } else {
      p.pos.x+=dx/dist*p.speed*dt;
      p.pos.z+=dz/dist*p.speed*dt;
    }
    p.bob+=dt*6;
    var bob=Math.abs(Math.sin(p.bob))*0.06;
    p.meshes[0].position.set(p.pos.x,0.75+bob,p.pos.z);
    p.meshes[0].rotation.y=Math.atan2(dx,dz);
  });

  // flicker street lamp bulbs subtly
  scene.meshes.forEach(function(m){
    if(m.name && m.name.indexOf("lb_")===0 && m.material){
      var f=0.85+Math.sin(now*0.003+m.position.x*7)*0.15;
      m.material.emissiveColor=new BABYLON.Color3(2.5*f,2.2*f,1.2*f);
    }
  });

  // slow camera orbit when idle
  if(!scene.activeCamera._dragActive){
    // subtle auto-rotate
  }

  scene.render();
});

window.addEventListener('resize',function(){engine.resize();});

})();
</script>
