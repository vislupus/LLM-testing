<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D City Growth Simulation</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
    #renderCanvas { width: 100vw; height: 100vh; outline: none; display: block; }
    
    #ui-panel {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(10, 15, 30, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 14px;
      padding: 22px;
      width: 310px;
      color: #e0e6ed;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      user-select: none;
    }
    
    h2 {
      font-size: 18px;
      margin-bottom: 18px;
      color: #64b5f6;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 1px solid rgba(100, 150, 255, 0.2);
      padding-bottom: 12px;
    }
    
    .control-group {
      margin-bottom: 20px;
    }
    
    label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
      color: #90a4ae;
      font-weight: 600;
    }
    
    .value {
      color: #64b5f6;
      font-weight: bold;
      font-family: monospace;
      font-size: 14px;
    }
    
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(100, 150, 255, 0.12);
      outline: none;
      -webkit-appearance: none;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #64b5f6;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(100, 181, 246, 0.6);
      transition: transform 0.15s;
      border: 2px solid rgba(255,255,255,0.3);
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(100, 150, 255, 0.12);
    }
    
    .stat-box {
      background: rgba(0,0,0,0.25);
      padding: 12px 8px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.03);
    }
    
    .stat-label {
      font-size: 10px;
      color: #78909c;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    
    .stat-value {
      font-size: 22px;
      font-weight: bold;
      color: #fff;
      font-family: 'Courier New', monospace;
    }
    
    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      background: rgba(100, 150, 255, 0.12);
      border: 1px solid rgba(100, 150, 255, 0.35);
      color: #64b5f6;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    button:hover {
      background: rgba(100, 150, 255, 0.25);
      border-color: rgba(100, 150, 255, 0.6);
      color: #90caf9;
      transform: translateY(-1px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .hint {
      font-size: 11px;
      color: #546e7a;
      margin-top: 14px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  
  <div id="ui-panel">
    <h2>City Simulation</h2>
    
    <div class="control-group">
      <label>City Density <span class="value" id="densityVal">50</span>%</label>
      <input type="range" id="density" min="0" max="100" value="50">
    </div>
    
    <div class="control-group">
      <label>Traffic Intensity <span class="value" id="trafficVal">50</span>%</label>
      <input type="range" id="traffic" min="0" max="100" value="50">
    </div>
    
    <div class="control-group">
      <label>Development Speed <span class="value" id="speedVal">50</span>%</label>
      <input type="range" id="speed" min="0" max="100" value="50">
    </div>
    
    <button id="resetBtn">Reset City</button>
    
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">Buildings</div>
        <div class="stat-value" id="bldgCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Vehicles</div>
        <div class="stat-value" id="vehCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">People</div>
        <div class="stat-value" id="pplCount">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Roads</div>
        <div class="stat-value" id="roadCount">0</div>
      </div>
    </div>
    
    <div class="hint">
      Left-drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan
    </div>
  </div>

  <script>
    // ============================================================
    // 3D CITY GROWTH SIMULATION - Babylon.js
    // ============================================================
    
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    
    // City grid configuration
    const GRID = 28;           // 28x28 logical grid
    const CELL_SIZE = 4;       // Each cell is 4 world units
    const CITY_EXTENT = GRID * CELL_SIZE;
    const OFFSET = -CITY_EXTENT / 2;
    
    // Simulation state
    let scene;
    let shadowGenerator;
    let gridData = [];
    let buildingData = [];
    let vehicles = [];
    let people = [];
    let roadMeshes = [];
    let roadMat, buildingMat, groundMat;
    
    // Timing
    let lastGrowthTime = 0;
    let lastVehicleTime = 0;
    let lastPersonTime = 0;
    
    // ------------------------------------------------------------
    // Initialization
    // ------------------------------------------------------------
    function initGrid() {
      gridData = [];
      for(let x = 0; x < GRID; x++) {
        gridData[x] = [];
        for(let z = 0; z < GRID; z++) {
          gridData[x][z] = 0; // 0 = empty, 1 = road, 2 = building
        }
      }
    }
    
    function createMaterials() {
      roadMat = new BABYLON.StandardMaterial("roadMat", scene);
      roadMat.diffuseColor = new BABYLON.Color3(0.14, 0.14, 0.17);
      roadMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      
      buildingMat = new BABYLON.StandardMaterial("bldgMat", scene);
      buildingMat.diffuseColor = new BABYLON.Color3(0.6, 0.63, 0.68);
      
      groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = new BABYLON.Color3(0.07, 0.11, 0.07);
      groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
    }
    
    function createScene() {
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.015, 0.02, 0.04);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.007;
      scene.fogColor = new BABYLON.Color3(0.015, 0.02, 0.04);
      
      // Camera
      const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.2, Math.PI / 2.8, 130, BABYLON.Vector3.Zero(), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 25;
      camera.upperRadiusLimit = 260;
      camera.wheelPrecision = 45;
      camera.panningSensibility = 80;
      
      // Lighting
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.45;
      hemi.groundColor = new BABYLON.Color3(0.08, 0.08, 0.12);
      
      const dir = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2.5, -1.5), scene);
      dir.position = new BABYLON.Vector3(60, 120, 60);
      dir.intensity = 0.75;
      
      // Shadows
      shadowGenerator = new BABYLON.ShadowGenerator(2048, dir);
      shadowGenerator.useBlurExponentialShadowMap = true;
      shadowGenerator.blurKernel = 32;
      shadowGenerator.darkness = 0.4;
      
      // Ground plane
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: CITY_EXTENT + 60, height: CITY_EXTENT + 60}, scene);
      ground.position.y = -0.05;
      ground.material = groundMat;
      ground.receiveShadows = true;
      
      createMaterials();
      initGrid();
      
      // Seed central cross roads
      const cx = Math.floor(GRID / 2);
      const cz = Math.floor(GRID / 2);
      for(let i = 0; i < GRID; i++) {
        if(gridData[i][cz] === 0) { gridData[i][cz] = 1; createRoad(i, cz); }
        if(gridData[cx][i] === 0) { gridData[cx][i] = 1; createRoad(cx, i); }
      }
      
      return scene;
    }
    
    // ------------------------------------------------------------
    // City Objects
    // ------------------------------------------------------------
    function createRoad(x, z) {
      const mesh = BABYLON.MeshBuilder.CreateBox("road", {width: CELL_SIZE, height: 0.15, depth: CELL_SIZE}, scene);
      mesh.position.x = OFFSET + x * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.z = OFFSET + z * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.y = 0.075;
      mesh.material = roadMat;
      mesh.receiveShadows = true;
      roadMeshes.push(mesh);
    }
    
    function createBuilding(x, z) {
      const height = 2.5 + Math.random() * 11;
      const w = CELL_SIZE * (0.6 + Math.random() * 0.35);
      const d = CELL_SIZE * (0.6 + Math.random() * 0.35);
      
      const mesh = BABYLON.MeshBuilder.CreateBox("bldg", {width: w, height: 1, depth: d}, scene);
      mesh.position.x = OFFSET + x * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.z = OFFSET + z * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.y = 0.025; // Half of initial scale
      mesh.scaling.y = 0.05;
      
      const mat = new BABYLON.StandardMaterial("bm" + x + z, scene);
      const shade = 0.32 + Math.random() * 0.38;
      const tint = Math.random();
      if(tint < 0.3) {
        mat.diffuseColor = new BABYLON.Color3(shade + 0.08, shade, shade);
        mat.emissiveColor = new BABYLON.Color3(0.02, 0.01, 0.01);
      } else if(tint < 0.6) {
        mat.diffuseColor = new BABYLON.Color3(shade, shade + 0.06, shade + 0.1);
        mat.emissiveColor = new BABYLON.Color3(0.01, 0.015, 0.02);
      } else {
        mat.diffuseColor = new BABYLON.Color3(shade, shade + 0.04, shade + 0.02);
        mat.emissiveColor = new BABYLON.Color3(0.01, 0.012, 0.01);
      }
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      mesh.material = mat;
      
      shadowGenerator.addShadowCaster(mesh);
      
      buildingData.push({
        mesh: mesh,
        targetHeight: height,
        currentScale: 0.05,
        growthSpeed: 1.2 + Math.random() * 3.5
      });
    }
    
    // ------------------------------------------------------------
    // Growth Logic
    // ------------------------------------------------------------
    function growCity() {
      const density = parseInt(document.getElementById('density').value);
      const speed = parseInt(document.getElementById('speed').value);
      if(speed === 0) return;
      
      const maxBuildings = Math.floor((density / 100) * GRID * GRID * 0.38);
      
      // 65% chance to attempt a building if under cap
      if(buildingData.length < maxBuildings && Math.random() < 0.65) {
        const candidates = [];
        for(let x = 0; x < GRID; x++) {
          for(let z = 0; z < GRID; z++) {
            if(gridData[x][z] !== 0) continue;
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            for(let d of dirs) {
              const nx = x + d[0], nz = z + d[1];
              if(nx >= 0 && nx < GRID && nz >= 0 && nz < GRID && gridData[nx][nz] === 1) {
                candidates.push({x, z});
                break;
              }
            }
          }
        }
        
        if(candidates.length > 0) {
          const c = candidates[Math.floor(Math.random() * candidates.length)];
          gridData[c.x][c.z] = 2;
          createBuilding(c.x, c.z);
          return;
        }
      }
      
      // Extend road network from endpoints
      const endpoints = [];
      for(let x = 0; x < GRID; x++) {
        for(let z = 0; z < GRID; z++) {
          if(gridData[x][z] !== 1) continue;
          let roadNeighbors = 0;
          const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
          for(let d of dirs) {
            const nx = x + d[0], nz = z + d[1];
            if(nx >= 0 && nx < GRID && nz >= 0 && nz < GRID && gridData[nx][nz] === 1) roadNeighbors++;
          }
          if(roadNeighbors <= 2) endpoints.push({x, z});
        }
      }
      
      if(endpoints.length > 0) {
        const ep = endpoints[Math.floor(Math.random() * endpoints.length)];
        const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
        const valid = dirs.filter(d => {
          const nx = ep.x + d[0], nz = ep.z + d[1];
          return nx >= 0 && nx < GRID && nz >= 0 && nz < GRID && gridData[nx][nz] === 0;
        });
        
        if(valid.length > 0) {
          const d = valid[Math.floor(Math.random() * valid.length)];
          const nx = ep.x + d[0], nz = ep.z + d[1];
          gridData[nx][nz] = 1;
          createRoad(nx, nz);
        }
      }
    }
    
    // ------------------------------------------------------------
    // Vehicles
    // ------------------------------------------------------------
    function spawnVehicle() {
      if(vehicles.length >= 90) return;
      
      const roadCells = [];
      for(let x = 0; x < GRID; x++) {
        for(let z = 0; z < GRID; z++) {
          if(gridData[x][z] === 1) roadCells.push({x, z});
        }
      }
      if(roadCells.length === 0) return;
      
      for(let attempt = 0; attempt < 15; attempt++) {
        const start = roadCells[Math.floor(Math.random() * roadCells.length)];
        
        const dirs = [
          {dx: 1, dz: 0, axis: 'x', dir: 1},
          {dx: -1, dz: 0, axis: 'x', dir: -1},
          {dx: 0, dz: 1, axis: 'z', dir: 1},
          {dx: 0, dz: -1, axis: 'z', dir: -1}
        ];
        
        const valid = dirs.filter(d => {
          const nx = start.x + d.dx, nz = start.z + d.dz;
          return nx >= 0 && nx < GRID && nz >= 0 && nz < GRID && gridData[nx][nz] === 1;
        });
        
        if(valid.length === 0) continue;
        
        const d = valid[Math.floor(Math.random() * valid.length)];
        const isX = d.axis === 'x';
        
        const mesh = BABYLON.MeshBuilder.CreateBox("car", {
          width: isX ? 2.3 : 1.0,
          height: 0.65,
          depth: isX ? 1.0 : 2.3
        }, scene);
        mesh.position.x = OFFSET + start.x * CELL_SIZE + CELL_SIZE / 2;
        mesh.position.z = OFFSET + start.z * CELL_SIZE + CELL_SIZE / 2;
        mesh.position.y = 0.45;
        
        const mat = new BABYLON.StandardMaterial("cm", scene);
        const hue = Math.random();
        if(hue < 0.18) mat.diffuseColor = new BABYLON.Color3(0.85, 0.12, 0.12);
        else if(hue < 0.36) mat.diffuseColor = new BABYLON.Color3(0.1, 0.35, 0.85);
        else if(hue < 0.54) mat.diffuseColor = new BABYLON.Color3(0.9, 0.75, 0.1);
        else if(hue < 0.72) mat.diffuseColor = new BABYLON.Color3(0.92, 0.92, 0.94);
        else if(hue < 0.9) mat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.22);
        else mat.diffuseColor = new BABYLON.Color3(0.85, 0.4, 0.1);
        mesh.material = mat;
        
        vehicles.push({
          mesh: mesh,
          axis: d.axis,
          dir: d.dir,
          speed: 6 + Math.random() * 10,
          startPos: mesh.position.clone(),
          maxDist: CITY_EXTENT * 0.75
        });
        return;
      }
    }
    
    // ------------------------------------------------------------
    // Pedestrians
    // ------------------------------------------------------------
    function spawnPerson() {
      if(people.length >= 160) return;
      
      const validCells = [];
      for(let x = 0; x < GRID; x++) {
        for(let z = 0; z < GRID; z++) {
          if(gridData[x][z] === 2) {
            validCells.push({x, z});
          } else if(gridData[x][z] === 1) {
            const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
            let nearBuilding = false;
            for(let d of dirs) {
              const nx = x + d[0], nz = z + d[1];
              if(nx >= 0 && nx < GRID && nz >= 0 && nz < GRID && gridData[nx][nz] === 2) {
                nearBuilding = true;
                break;
              }
            }
            if(nearBuilding) validCells.push({x, z});
          }
        }
      }
      
      if(validCells.length === 0) return;
      
      const start = validCells[Math.floor(Math.random() * validCells.length)];
      
      const mesh = BABYLON.MeshBuilder.CreateCapsule("person", {radius: 0.2, height: 0.8}, scene);
      mesh.position.x = OFFSET + start.x * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.z = OFFSET + start.z * CELL_SIZE + CELL_SIZE / 2;
      mesh.position.y = 0.4;
      
      const mat = new BABYLON.StandardMaterial("pm", scene);
      mat.diffuseColor = new BABYLON.Color3(
        0.25 + Math.random() * 0.55,
        0.3 + Math.random() * 0.5,
        0.35 + Math.random() * 0.5
      );
      mesh.material = mat;
      
      const tx = Math.floor(Math.random() * GRID);
      const tz = Math.floor(Math.random() * GRID);
      
      people.push({
        mesh: mesh,
        targetX: OFFSET + tx * CELL_SIZE + CELL_SIZE / 2,
        targetZ: OFFSET + tz * CELL_SIZE + CELL_SIZE / 2,
        speed: 0.7 + Math.random() * 1.3,
        life: 12 + Math.random() * 28
      });
    }
    
    // ------------------------------------------------------------
    // Update Loops
    // ------------------------------------------------------------
    function updateBuildings(dt) {
      const speedMult = parseInt(document.getElementById('speed').value) / 50;
      for(let b of buildingData) {
        if(b.currentScale < b.targetHeight) {
          b.currentScale += b.growthSpeed * speedMult * dt;
          if(b.currentScale > b.targetHeight) b.currentScale = b.targetHeight;
          b.mesh.scaling.y = b.currentScale;
          b.mesh.position.y = b.currentScale / 2;
        }
      }
    }
    
    function updateVehicles(dt) {
      const traffic = parseInt(document.getElementById('traffic').value);
      const speedMult = 0.25 + (traffic / 100) * 1.5;
      
      for(let i = vehicles.length - 1; i >= 0; i--) {
        const v = vehicles[i];
        const move = v.speed * speedMult * dt;
        
        if(v.axis === 'x') {
          v.mesh.position.x += move * v.dir;
          v.mesh.rotation.y = v.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
        } else {
          v.mesh.position.z += move * v.dir;
          v.mesh.rotation.y = v.dir > 0 ? 0 : Math.PI;
        }
        
        const dist = BABYLON.Vector3.Distance(v.mesh.position, v.startPos);
        if(dist > v.maxDist) {
          v.mesh.dispose();
          vehicles.splice(i, 1);
        }
      }
    }
    
    function updatePeople(dt) {
      for(let i = people.length - 1; i >= 0; i--) {
        const p = people[i];
        p.life -= dt;
        
        if(p.life <= 0) {
          p.mesh.dispose();
          people.splice(i, 1);
          continue;
        }
        
        const dx = p.targetX - p.mesh.position.x;
        const dz = p.targetZ - p.mesh.position.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        
        if(dist < 0.6) {
          const tx = Math.floor(Math.random() * GRID);
          const tz = Math.floor(Math.random() * GRID);
          p.targetX = OFFSET + tx * CELL_SIZE + CELL_SIZE / 2;
          p.targetZ = OFFSET + tz * CELL_SIZE + CELL_SIZE / 2;
        } else {
          const move = p.speed * dt;
          p.mesh.position.x += (dx / dist) * move;
          p.mesh.position.z += (dz / dist) * move;
        }
      }
    }
    
    function updateStats() {
      document.getElementById('bldgCount').textContent = buildingData.length;
      document.getElementById('vehCount').textContent = vehicles.length;
      document.getElementById('pplCount').textContent = people.length;
      document.getElementById('roadCount').textContent = roadMeshes.length;
    }
    
    // ------------------------------------------------------------
    // Reset
    // ------------------------------------------------------------
    function resetCity() {
      for(let b of buildingData) b.mesh.dispose();
      for(let v of vehicles) v.mesh.dispose();
      for(let p of people) p.mesh.dispose();
      for(let r of roadMeshes) r.dispose();
      
      buildingData = [];
      vehicles = [];
      people = [];
      roadMeshes = [];
      
      initGrid();
      
      const cx = Math.floor(GRID / 2);
      const cz = Math.floor(GRID / 2);
      for(let i = 0; i < GRID; i++) {
        if(gridData[i][cz] === 0) { gridData[i][cz] = 1; createRoad(i, cz); }
        if(gridData[cx][i] === 0) { gridData[cx][i] = 1; createRoad(cx, i); }
      }
    }
    
    // ------------------------------------------------------------
    // Main Loop
    // ------------------------------------------------------------
    createScene();
    
    scene.registerBeforeRender(() => {
      const dt = engine.getDeltaTime() / 1000;
      const now = performance.now();
      
      const speed = parseInt(document.getElementById('speed').value);
      const traffic = parseInt(document.getElementById('traffic').value);
      const density = parseInt(document.getElementById('density').value);
      
      // City growth tick
      const growthInterval = speed > 0 ? Math.max(50, 2500 - (speed * 24)) : Infinity;
      if(now - lastGrowthTime > growthInterval) {
        growCity();
        lastGrowthTime = now;
      }
      
      // Vehicle spawn tick
      const vehInterval = traffic > 0 ? Math.max(80, 4000 - (traffic * 38)) : Infinity;
      if(traffic > 0 && now - lastVehicleTime > vehInterval) {
        spawnVehicle();
        lastVehicleTime = now;
      }
      
      // Pedestrian spawn tick
      const pplInterval = density > 0 ? Math.max(80, 3500 - (density * 32)) : Infinity;
      if(density > 0 && now - lastPersonTime > pplInterval) {
        spawnPerson();
        lastPersonTime = now;
      }
      
      updateBuildings(dt);
      updateVehicles(dt);
      updatePeople(dt);
      updateStats();
    });
    
    engine.runRenderLoop(() => {
      scene.render();
    });
    
    window.addEventListener("resize", () => {
      engine.resize();
    });
    
    // ------------------------------------------------------------
    // UI Bindings
    // ------------------------------------------------------------
    document.getElementById('density').addEventListener('input', (e) => {
