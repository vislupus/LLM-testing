<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Growing City Simulation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #renderCanvas { width: 100vw; height: 100vh; display: block; }

  #controls {
    position: fixed; top: 16px; left: 16px; z-index: 100;
    background: rgba(10, 14, 26, 0.88);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(100, 160, 255, 0.18);
    border-radius: 14px; padding: 20px 24px;
    color: #c8daf0; width: 280px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #controls h2 {
    font-size: 16px; margin-bottom: 16px; color: #7aafff;
    letter-spacing: 1px; text-transform: uppercase;
    border-bottom: 1px solid rgba(100,160,255,0.15);
    padding-bottom: 10px;
  }
  .slider-group { margin-bottom: 14px; }
  .slider-group label {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 5px; color: #9ab;
  }
  .slider-group label span { color: #7aafff; font-weight: 600; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 6px;
    border-radius: 3px; background: rgba(100,160,255,0.15);
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #5a9fff;
    box-shadow: 0 0 8px rgba(90,159,255,0.5);
    cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border: none;
    border-radius: 50%; background: #5a9fff;
    box-shadow: 0 0 8px rgba(90,159,255,0.5);
    cursor: pointer;
  }
  #stats {
    margin-top: 14px; padding-top: 12px;
    border-top: 1px solid rgba(100,160,255,0.15);
    font-size: 11px; line-height: 1.8; color: #8a9ab0;
  }
  #stats .val { color: #7aafff; font-weight: 600; }
  #legend {
    margin-top: 12px; padding-top: 10px;
    border-top: 1px solid rgba(100,160,255,0.15);
    font-size: 11px; line-height: 2;
  }
  .legend-item { display: flex; align-items: center; gap: 8px; }
  .legend-dot {
    width: 10px; height: 10px; border-radius: 3px;
    display: inline-block; flex-shrink: 0;
  }
  #resetBtn {
    margin-top: 14px; width: 100%; padding: 8px;
    background: rgba(90,159,255,0.15); border: 1px solid rgba(90,159,255,0.3);
    color: #7aafff; border-radius: 8px; cursor: pointer;
    font-size: 12px; letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  #resetBtn:hover { background: rgba(90,159,255,0.3); }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="controls">
  <h2>🏙️ City Controls</h2>

  <div class="slider-group">
    <label>City Size <span id="citySizeVal">8</span></label>
    <input type="range" id="citySize" min="4" max="16" value="8" step="1">
  </div>

  <div class="slider-group">
    <label>Population Density <span id="densityVal">50%</span></label>
    <input type="range" id="density" min="10" max="100" value="50">
  </div>

  <div class="slider-group">
    <label>Traffic Intensity <span id="trafficVal">40%</span></label>
    <input type="range" id="traffic" min="0" max="100" value="40">
  </div>

  <div class="slider-group">
    <label>Development Speed <span id="speedVal">50%</span></label>
    <input type="range" id="speed" min="5" max="100" value="50">
  </div>

  <div class="slider-group">
    <label>Time of Day <span id="timeVal">Day</span></label>
    <input type="range" id="timeOfDay" min="0" max="100" value="30">
  </div>

  <button id="resetBtn">⟳ Reset City</button>

  <div id="stats">
    Buildings: <span class="val" id="statBuildings">0</span><br>
    Vehicles: <span class="val" id="statVehicles">0</span><br>
    People: <span class="val" id="statPeople">0</span><br>
    Roads: <span class="val" id="statRoads">0</span>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="legend-dot" style="background:#4a8fff"></span> Residential</div>
    <div class="legend-item"><span class="legend-dot" style="background:#3ecf6a"></span> Commercial</div>
    <div class="legend-item"><span class="legend-dot" style="background:#f0a030"></span> Industrial</div>
    <div class="legend-item"><span class="legend-dot" style="background:#e05050"></span> Vehicles</div>
    <div class="legend-item"><span class="legend-dot" style="background:#ffe066"></span> People</div>
  </div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
(function() {
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { stencil: true });

  // --- State ---
  let scene, camera, ground;
  let citySize = 8, density = 50, trafficIntensity = 40, devSpeed = 50, timeOfDay = 30;
  let buildings = [], vehicles = [], people = [], roadMeshes = [];
  let buildingInstances = [], vehicleMeshes = [], peopleMeshes = [];
  let buildQueue = [];
  let simTime = 0;
  let directionalLight, hemiLight, ambientLight;
  let skybox;
  let roadMaterial, sidewalkMaterial;

  // Colors
  const COLORS = {
    residential: new BABYLON.Color3(0.29, 0.56, 1.0),
    commercial: new BABYLON.Color3(0.24, 0.81, 0.42),
    industrial: new BABYLON.Color3(0.94, 0.63, 0.19),
    vehicle: new BABYLON.Color3(0.88, 0.31, 0.31),
    person: new BABYLON.Color3(1.0, 0.88, 0.4),
    road: new BABYLON.Color3(0.2, 0.2, 0.22),
    sidewalk: new BABYLON.Color3(0.45, 0.45, 0.48),
    ground: new BABYLON.Color3(0.15, 0.22, 0.12),
    roadLine: new BABYLON.Color3(0.9, 0.85, 0.3)
  };

  const BLOCK_SIZE = 6;
  const ROAD_WIDTH = 2.5;
  const CELL = BLOCK_SIZE + ROAD_WIDTH;

  // --- Scene Setup ---
  function createScene() {
    scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.05, 0.08, 0.15, 1);
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
    scene.fogDensity = 0.003;
    scene.fogColor = new BABYLON.Color3(0.15, 0.2, 0.3);

    // Camera
    camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3.5, citySize * CELL * 1.2,
      new BABYLON.Vector3(citySize * CELL / 2, 0, citySize * CELL / 2), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 10;
    camera.upperRadiusLimit = 300;
    camera.wheelPrecision = 20;
    camera.panningSensibility = 800;

    // Lights
    hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.5;
    hemiLight.diffuse = new BABYLON.Color3(0.6, 0.7, 0.9);
    hemiLight.groundColor = new BABYLON.Color3(0.2, 0.25, 0.15);

    directionalLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, 1), scene);
    directionalLight.position = new BABYLON.Vector3(citySize * CELL, 80, -citySize * CELL);
    directionalLight.intensity = 1.2;
    directionalLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
    directionalLight.specular = new BABYLON.Color3(0.3, 0.3, 0.4);

    // Shadows
    const shadowGen = new BABYLON.ShadowGenerator(1024, directionalLight);
    shadowGen.useBlurExponentialShadowMap = true;
    shadowGen.blurKernel = 16;
    shadowGen.darkness = 0.4;

    ambientLight = new BABYLON.PointLight("ambient", new BABYLON.Vector3(0, 5, 0), scene);
    ambientLight.intensity = 0.15;
    ambientLight.diffuse = new BABYLON.Color3(0.4, 0.5, 0.7);

    // Materials
    roadMaterial = new BABYLON.StandardMaterial("roadMat", scene);
    roadMaterial.diffuseColor = COLORS.road;
    roadMaterial.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    roadMaterial.alpha = 0.95;

    sidewalkMaterial = new BABYLON.StandardMaterial("sidewalkMat", scene);
    sidewalkMaterial.diffuseColor = COLORS.sidewalk;
    sidewalkMaterial.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);

    // Ground
    const groundSize = citySize * CELL + 20;
    ground = BABYLON.MeshBuilder.CreateGround("ground", { width: groundSize, height: groundSize, subdivisions: 4 }, scene);
    ground.position.x = citySize * CELL / 2;
    ground.position.z = citySize * CELL / 2;
    const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
    groundMat.diffuseColor = COLORS.ground;
    groundMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
    ground.material = groundMat;
    ground.receiveShadows = true;

    // Skybox
    createSkybox();

    // Glow layer for night
    const gl = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 32, mainTextureFixedSize: 512 });
    gl.intensity = 0.3;

    return { shadowGen };
  }

  function createSkybox() {
    const skyMat = new BABYLON.StandardMaterial("skyMat", scene);
    skyMat.backFaceCulling = false;
    skyMat.disableLighting = true;
    skyMat.emissiveColor = new BABYLON.Color3(0.3, 0.45, 0.7);
    skyMat.alpha = 1;

    const sky = BABYLON.MeshBuilder.CreateBox("sky", { size: 500 }, scene);
    sky.material = skyMat;
    sky.infiniteDistance = true;
    skybox = sky;
  }

  // --- Building Types ---
  function getBuildingType() {
    const r = Math.random();
    if (r < 0.5) return 'residential';
    if (r < 0.8) return 'commercial';
    return 'industrial';
  }

  function getBuildingColor(type) {
    switch(type) {
      case 'residential': return COLORS.residential;
      case 'commercial': return COLORS.commercial;
      case 'industrial': return COLORS.industrial;
    }
  }

  function getBuildingDimensions(type) {
    switch(type) {
      case 'residential': return { w: 2 + Math.random() * 2, h: 3 + Math.random() * 12, d: 2 + Math.random() * 2 };
      case 'commercial': return { w: 3 + Math.random() * 2, h: 5 + Math.random() * 18, d: 3 + Math.random() * 2 };
      case 'industrial': return { w: 3 + Math.random() * 2, h: 2 + Math.random() * 5, d: 3 + Math.random() * 2 };
    }
  }

  // --- City Generation ---
  function clearCity() {
    buildings.forEach(b => { if (b.mesh) b.mesh.dispose(); if (b.mat) b.mat.dispose(); });
    vehicles.forEach(v => { if (v.mesh) v.mesh.dispose(); });
    people.forEach(p => { if (p.mesh) p.mesh.dispose(); });
    roadMeshes.forEach(r => r.dispose());

    buildings = [];
    vehicles = [];
    people = [];
    roadMeshes = [];
    buildQueue = [];
    simTime = 0;
  }

  function generateRoads() {
    const totalSize = citySize * CELL;

    // Horizontal roads
    for (let i = 0; i <= citySize; i++) {
      const z = i * CELL;
      const road = BABYLON.MeshBuilder.CreateGround("roadH" + i, {
        width: totalSize, height: ROAD_WIDTH, subdivisions: 1
      }, scene);
      road.position.set(totalSize / 2, 0.01, z);
      road.material = roadMaterial;
      road.receiveShadows = true;
      roadMeshes.push(road);

      // Road lines
      for (let lx = ROAD_WIDTH; lx < totalSize; lx += ROAD_WIDTH * 2) {
        const line = BABYLON.MeshBuilder.CreateGround("line", { width: 0.15, height: ROAD_WIDTH * 0.6 }, scene);
        line.position.set(lx, 0.02, z);
        const lineMat = new BABYLON.StandardMaterial("lineMat", scene);
        lineMat.diffuseColor = COLORS.roadLine;
        lineMat.emissiveColor = COLORS.roadLine.scale(0.3);
        line.material = lineMat;
        roadMeshes.push(line);
      }
    }

    // Vertical roads
    for (let i = 0; i <= citySize; i++) {
      const x = i * CELL;
      const road = BABYLON.MeshBuilder.CreateGround("roadV" + i, {
        width: ROAD_WIDTH, height: totalSize, subdivisions: 1
      }, scene);
      road.position.set(x, 0.01, totalSize / 2);
      road.material = roadMaterial;
      road.receiveShadows = true;
      roadMeshes.push(road);
    }

    // Sidewalks at intersections
    for (let i = 0; i <= citySize; i++) {
      for (let j = 0; j <= citySize; j++) {
        const sw = BABYLON.MeshBuilder.CreateBox("sw", {
          width: ROAD_WIDTH + 0.5, height: 0.15, depth: ROAD_WIDTH + 0.5
        }, scene);
        sw.position.set(i * CELL, 0.075, j * CELL);
        sw.material = sidewalkMaterial;
        sw.receiveShadows = true;
        roadMeshes.push(sw);
      }
    }

    document.getElementById('statRoads').textContent = (citySize + 1) * 2;
  }

  function queueBuildings() {
    buildQueue = [];
    const densityFactor = density / 100;

    for (let bx = 0; bx < citySize; bx++) {
      for (let bz = 0; bz < citySize; bz++) {
        if (Math.random() > densityFactor) continue;

        const baseX = bx * CELL + ROAD_WIDTH;
        const baseZ = bz * CELL + ROAD_WIDTH;

        // Multiple buildings per block
        const numBuildings = Math.floor(1 + Math.random() * 3) * (density > 70 ? 2 : 1);
        for (let n = 0; n < numBuildings; n++) {
          const type = getBuildingType();
          const dims = getBuildingDimensions(type);
          const ox = (Math.random() * (BLOCK_SIZE - dims.w)) * 0.6;
          const oz = (Math.random() * (BLOCK_SIZE - dims.d)) * 0.6;

          buildQueue.push({
            x: baseX + ox,
            z: baseZ + oz,
            type, dims,
            spawnTime: simTime + Math.random() * 200 / (devSpeed / 50),
            built: false,
            animProgress: 0
          });
        }
      }
    }

    buildQueue.sort((a, b) => a.spawnTime - b.spawnTime);
  }

  function createBuildingMesh(bData) {
    const { x, z, type, dims } = bData;
    const color = getBuildingColor(type);

    const mat = new BABYLON.StandardMaterial("bMat_" + buildings.length, scene);
    mat.diffuseColor = color;
    mat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.2);
    mat.emissiveColor = color.scale(0.05);

    const mesh = BABYLON.MeshBuilder.CreateBox("bldg_" + buildings.length, {
      width: dims.w, height: 0.1, depth: dims.d
    }, scene);
    mesh.position.set(x + dims.w / 2, 0.05, z + dims.d / 2);
    mesh.material = mat;
    mesh.receiveShadows = true;

    // Windows (emissive strips)
    const windowMat = new BABYLON.StandardMaterial("winMat", scene);
    windowMat.emissiveColor = new BABYLON.Color3(0.9, 0.85, 0.5);
    windowMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.35);

    if (dims.h > 4) {
      const numFloors = Math.floor(dims.h / 2.5);
      for (let f = 0; f < numFloors; f++) {
        const wy = 1.5 + f * 2.5;
        // Front windows
        const win = BABYLON.MeshBuilder.CreateBox("win", {
          width: dims.w * 0.7, height: 0.6, depth: 0.05
        }, scene);
        win.position.set(x + dims.w / 2, wy, z + dims.d + 0.025);
        win.material = windowMat;
        win.parent = mesh;
      }
    }

    bData.mesh = mesh;
    bData.mat = mat;
    bData.targetHeight = dims.h;
    bData.built = true;
    bData.animProgress = 0;
    buildings.push(bData);
  }

  // --- Vehicles ---
  function spawnVehicle() {
    const roadIndex = Math.floor(Math.random() * (citySize + 1));
    const isHorizontal = Math.random() > 0.5;
    const direction = Math.random() > 0.5 ? 1 : -1;

    const vehicleColors = [
      new BABYLON.Color3(0.9, 0.25, 0.25),
      new BABYLON.Color3(0.25, 0.5, 0.9),
      new BABYLON.Color3(0.9, 0.8, 0.2),
      new BABYLON.Color3(0.3, 0.8, 0.3),
      new BABYLON.Color3(0.8, 0.8, 0.8),
      new BABYLON.Color3(0.2, 0.2, 0.25),
      new BABYLON.Color3(0.9, 0.5, 0.15),
    ];
    const vColor = vehicleColors[Math.floor(Math.random() * vehicleColors.length)];

    const mat = new BABYLON.StandardMaterial("vMat_" + vehicles.length, scene);
    mat.diffuseColor = vColor;
    mat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.5);
    mat.emissiveColor = vColor.scale(0.08);

    // Car body
    const body = BABYLON.MeshBuilder.CreateBox("car", { width: 1.8, height: 0.6, depth: 0.9 }, scene);
    body.material = mat;

    // Car top
    const top = BABYLON.MeshBuilder.CreateBox("carTop", { width: 1.0, height: 0.5, depth: 0.8 }, scene);
    top.material = mat;
    top.position.y = 0.55;
    top.parent = body;

    // Headlights
    const hlMat = new BABYLON.StandardMaterial("hlMat", scene);
    hlMat.emissiveColor = new BABYLON.Color3(1, 0.95, 0.7);
    const hl1 = BABYLON.MeshBuilder.CreateSphere("hl", { diameter: 0.15 }, scene);
    hl1.material = hlMat;
    hl1.position.set(0.9, 0, 0.3);
    hl1.parent = body;
    const hl2 = hl1.clone("hl2");
    hl2.position.z = -0.3;

    const totalSize = citySize * CELL;

    if (isHorizontal) {
      body.position.set(
        direction > 0 ? -2 : totalSize + 2,
        0.4,
        roadIndex * CELL + (direction > 0 ? -0.4 : 0.4)
      );
    } else {
      body.position.set(
        roadIndex * CELL + (direction > 0 ? 0.4 : -0.4),
        0.4,
        direction > 0 ? -2 : totalSize + 2
      );
    }

    const speed = 0.03 + Math.random() * 0.06;
    vehicles.push({
      mesh: body,
      isHorizontal,
      direction,
      speed,
      roadIndex,
      alive: true
    });
  }

  // --- People ---
  function spawnPerson() {
    const bx = Math.floor(Math.random() * citySize);
    const bz = Math.floor(Math.random() * citySize);

    const mat = new BABYLON.StandardMaterial("pMat_" + people.length, scene);
    const skinTones = [
      new BABYLON.Color3(1.0, 0.85, 0.65),
      new BABYLON.Color3(0.85, 0.65, 0.45),
      new BABYLON.Color3(0.65, 0.45, 0.3),
      new BABYLON.Color3(0.95, 0.8, 0.6),
    ];
    const clothColors = [
      new BABYLON.Color3(0.2, 0.4, 0.8),
      new BABYLON.Color3(0.8, 0.2, 0.3),
      new BABYLON.Color3(0.2, 0.7, 0.3),
      new BABYLON.Color3(0.9, 0.6, 0.1),
      new BABYLON.Color3(0.5, 0.2, 0.7),
      new BABYLON.Color3(0.3, 0.3, 0.35),
    ];
    mat.diffuseColor = clothColors[Math.floor(Math.random() * clothColors.length)];
    mat.emissiveColor = mat.diffuseColor.scale(0.05);

    // Body
    const body = BABYLON.MeshBuilder.CreateCylinder("person", {
      height: 0.5, diameter: 0.2, tessellation: 6
    }, scene);
    body.material = mat;

    // Head
    const headMat = new BABYLON.StandardMaterial("headMat", scene);
    headMat.diffuseColor = skinTones[Math.floor(Math.random() * skinTones.length)];
    const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.2, segments: 4 }, scene);
    head.material = headMat;
    head.position.y = 0.35;
    head.parent = body;

    const baseX = bx * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;
    const baseZ = bz * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;
    body.position.set(baseX, 0.35, baseZ);

    const targetX = bx * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;
    const targetZ = bz * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;

    people.push({
      mesh: body,
      x: baseX, z: baseZ,
      targetX, targetZ,
      speed: 0.008 + Math.random() * 0.015,
      alive: true,
      waitTime: 0
    });
  }

  // --- Update Loop ---
  function updateSimulation() {
    const dt = engine.getDeltaTime() / 1000;
    const speedMult = devSpeed / 50;
    simTime += dt * speedMult;

    // Build queued buildings
    while (buildQueue.length > 0 && buildQueue[0].spawnTime <= simTime) {
      const bData = buildQueue.shift();
      createBuildingMesh(bData);
    }

    // Animate building growth
    buildings.forEach(b => {
      if (b.animProgress < 1) {
        b.animProgress = Math.min(1, b.animProgress + dt * speedMult * 0.5);
        const eased = 1 - Math.pow(1 - b.animProgress, 3);
        const h = b.targetHeight * eased;
        b.mesh.scaling.y = h / 0.1;
        b.mesh.position.y = h / 2;

        // Emissive glow during construction
        const glowAmount = (1 - b.animProgress) * 0.3;
        b.mat.emissiveColor = getBuildingColor(b.type).scale(glowAmount + 0.05);
      }
    });

    // Update vehicles
    const totalSize = citySize * CELL;
    const maxVehicles = Math.floor(trafficIntensity / 100 * citySize * 8);

    vehicles.forEach(v => {
      if (!v.alive) return;
      const move = v.speed * dt * speedMult * 60;

      if (v.isHorizontal) {
        v.mesh.position.x += move * v.direction;
        v.mesh.rotation.y = v.direction > 0 ? 0 : Math.PI;
        if (v.mesh.position.x > totalSize + 5 || v.mesh.position.x < -5) v.alive = false;
      } else {
        v.mesh.position.z += move * v.direction;
        v.mesh.rotation.y = v.direction > 0 ? Math.PI / 2 : -Math.PI / 2;
        if (v.mesh.position.z > totalSize + 5 || v.mesh.position.z < -5) v.alive = false;
      }

      // Slight bobbing
      v.mesh.position.y = 0.4 + Math.sin(simTime * 8 + v.roadIndex) * 0.02;
    });

    // Remove dead vehicles and spawn new ones
    vehicles = vehicles.filter(v => {
      if (!v.alive) { v.mesh.dispose(); return false; }
      return true;
    });

    if (vehicles.length < maxVehicles && Math.random() < 0.05 * speedMult * (trafficIntensity / 50)) {
      spawnVehicle();
    }

    // Update people
    const maxPeople = Math.floor(density / 100 * citySize * 6);

    people.forEach(p => {
      if (!p.alive) return;

      if (p.waitTime > 0) {
        p.waitTime -= dt;
        return;
      }

      const dx = p.targetX - p.x;
      const dz = p.targetZ - p.z;
      const dist = Math.sqrt(dx * dx + dz * dz);

      if (dist < 0.2) {
        // Pick new target
        p.waitTime = 1 + Math.random() * 3;
        const bx = Math.floor(Math.random() * citySize);
        const bz = Math.floor(Math.random() * citySize);
        p.targetX = bx * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;
        p.targetZ = bz * CELL + ROAD_WIDTH + Math.random() * BLOCK_SIZE;
        return;
      }

      const move = p.speed * dt * speedMult * 60;
      p.x += (dx / dist) * move;
      p.z += (dz / dist) * move;
      p.mesh.position.x = p.x;
      p.mesh.position.z = p.z;

      // Walking bob
      p.mesh.position.y = 0.35 + Math.abs(Math.sin(simTime * 10 + p.x * 3)) * 0.05;

      // Face direction
      p.mesh.rotation.y = Math.atan2(dx, dz);
    });

    people = people.filter(p => {
      if (!p.alive) { p.mesh.dispose(); return false; }
      return true;
    });

    if (people.length < maxPeople && Math.random() < 0.03 * speedMult) {
      spawnPerson();
    }

    // Update stats
    document.getElementById('statBuildings').textContent = buildings.length;
    document.getElementById('statVehicles').textContent = vehicles.length;
    document.getElementById('statPeople').textContent = people.length;

    // Time of day
    updateTimeOfDay();
  }

  function updateTimeOfDay() {
    const t = timeOfDay / 100;

    // 0 = dawn, 0.3 = day, 0.6 = dusk, 0.8 = night
    let sunIntensity, hemiIntensity, skyR, skyG, skyB, fogR, fogG, fogB;

    if (t < 0.15) {
      // Dawn
      const f = t / 0.15;
      sunIntensity = 0.2 + f * 1.0;
      hemiIntensity = 0.2 + f * 0.3;
      skyR = 0.1 + f * 0.3; skyG = 0.08 + f * 0.35; skyB = 0.15 + f * 0.45;
      fogR = 0.1 + f * 0.1; fogG = 0.08 + f * 0.12; fogB = 0.15 + f * 0.15;
      directionalLight.diffuse = new BABYLON.Color3(1, 0.7 + f * 0.25, 0.5 + f * 0.3);
    } else if (t < 0.5) {
      // Day
      sunIntensity = 1.2;
      hemiIntensity = 0.5;
      skyR = 0.35; skyG = 0.55; skyB = 0.85;
      fogR = 0.15; fogG = 0.2; fogB = 0.3;
      directionalLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
    } else if (t < 0.7) {
      // Dusk
      const f = (t - 0.5) / 0.2;
      sunIntensity = 1.2 - f * 0.8;
      hemiIntensity = 0.5 - f * 0.25;
      skyR = 0.35 - f * 0.15; skyG = 0.55 - f * 0.35; skyB = 0.85 - f * 0.45;
      fogR = 0.15 - f * 0.05; fogG = 0.2 - f * 0.1; fogB = 0.3 - f * 0.1;
      directionalLight.diffuse = new BABYLON.Color3(1, 0.7 - f * 0.3, 0.4 - f * 0.2);
    } else {
      // Night
      const f = (t - 0.7) / 0.3;
      sunIntensity = 0.4 - f * 0.3;
      hemiIntensity = 0.25 - f * 0.1;
      skyR = 0.2 - f * 0.15; skyG = 0.2 - f * 0.15; skyB = 0.4 - f * 0.25;
      fogR = 0.1 - f * 0.05; fogG = 0.1 - f * 0.05; fogB = 0.2 - f * 0.1;
      directionalLight.diffuse = new BABYLON.Color3(0.4, 0.45, 0.6);
    }

    directionalLight.intensity = sunIntensity;
    hemiLight.intensity = hemiIntensity;

    if (skybox && skybox.material) {
      skybox.material.emissiveColor = new BABYLON.Color3(skyR, skyG, skyB);
    }
    scene.clearColor = new BABYLON.Color4(fogR, fogG, fogB, 1);
    scene.fogColor = new BABYLON.Color3(fogR, fogG, fogB);

    // Building window glow at night
    const nightFactor = t > 0.6 ? Math.min(1, (t - 0.6) / 0.2) : 0;
    buildings.forEach(b => {
      if (b.animProgress >= 1) {
        b.mat.emissiveColor = getBuildingColor(b.type).scale(0.03 + nightFactor * 0.12);
      }
    });

    const timeLabel = t < 0.15 ? 'Dawn' : t < 0.5 ? 'Day' : t < 0.7 ? 'Dusk' : 'Night';
    document.getElementById('timeVal').textContent = timeLabel;
  }

  // --- Rebuild city when size changes ---
  let rebuildTimeout = null;
  function scheduleRebuild() {
    clearTimeout(rebuildTimeout);
    rebuildTimeout = setTimeout(() => {
      clearCity();
      generateRoads();
      queueBuildings();
      // Update camera target
      camera.target.set(citySize * CELL / 2, 0, citySize * CELL / 2);
      camera.radius = citySize * CELL * 1.2;
      directionalLight.position.set(citySize * CELL, 80, -citySize * CELL);

      // Resize ground
      const groundSize = citySize * CELL + 20;
      ground.dispose();
      ground = BABYLON.MeshBuilder.CreateGround("ground", { width: groundSize, height: groundSize, subdivisions: 4 }, scene);
      ground.position.x = citySize * CELL / 2;
      ground.position.z = citySize * CELL / 2;
      const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
      groundMat.diffuseColor = COLORS.ground;
      groundMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      ground.material = groundMat;
      ground.receiveShadows = true;
    }, 300);
  }

  // --- UI Bindings ---
  document.getElementById('citySize').addEventListener('input', function() {
    citySize = parseInt(this.value);
    document.getElementById('citySizeVal').textContent = citySize;
    scheduleRebuild();
  });

  document.getElementById('density').addEventListener('input', function() {
    density = parseInt(this.value);
    document.getElementById('densityVal').textContent = density + '%';
    scheduleRebuild();
  });

  document.getElementById('traffic').addEventListener('input', function() {
    trafficIntensity = parseInt(this.value);
    document.getElementById('trafficVal').textContent = trafficIntensity + '%';
  });

  document.getElementById('speed').addEventListener('input', function() {
    devSpeed = parseInt(this.value);
    document.getElementById('speedVal').textContent = devSpeed + '%';
  });

  document.getElementById('timeOfDay').addEventListener('input', function() {
    timeOfDay = parseInt(this.value);
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    clearCity();
    generateRoads();
    queueBuildings();
  });

  // --- Init ---
  const { shadowGen } = createScene();
  generateRoads();
  queueBuildings();

  // Register render loop
  engine.runRenderLoop(() => {
    updateSimulation();
    scene.render();
  });

  window.addEventListener('resize', () => engine.resize());

})();
</script>
