<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growing City 3D Simulation</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(16, 24, 40, 0.92);
      --text: #e2e8f0;
      --accent: #38bdf8;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #container {
      display: flex;
      height: 100vh;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }
    #sidebar {
      width: 300px;
      background: var(--panel);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      overflow-y: auto;
      box-shadow: -4px 0 30px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px 0;
      color: var(--accent);
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .control-group {
      margin-bottom: 18px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .button-row {
      display: flex;
      gap: 8px;
      margin: 16px 0;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #334155;
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    button:hover { background: #475569; }
    button.primary { background: #0284c7; }
    button.primary:hover { background: #0ea5e9; }
    .stats {
      background: rgba(11, 16, 32, 0.6);
      border-radius: 10px;
      padding: 14px;
      margin-top: 18px;
    }
    .stats h2 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .stat-line {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin: 5px 0;
    }
    .keys {
      font-size: 11px;
      color: #64748b;
      margin-top: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-wrap">
      <canvas id="renderCanvas"></canvas>
    </div>
    <div id="sidebar">
      <h1>🏙️ Growing City</h1>
      <div class="subtitle">A procedural 3D city that builds itself. Watch buildings rise, roads connect, and traffic flow.</div>

      <div class="button-row">
        <button id="btn-regen" class="primary">Regenerate City</button>
        <button id="btn-pause">Pause</button>
      </div>

      <div class="control-group">
        <label>City Size <span id="val-size">40</span></label>
        <input type="range" id="sl-size" min="20" max="80" step="4" value="40">
      </div>

      <div class="control-group">
        <label>Population Density <span id="val-density">0.6</span></label>
        <input type="range" id="sl-density" min="0.1" max="1.0" step="0.05" value="0.6">
      </div>

      <div class="control-group">
        <label>Development Speed <span id="val-dev">1.0</span></label>
        <input type="range" id="sl-dev" min="0.1" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group">
        <label>Traffic Intensity <span id="val-traffic">0.5</span></label>
        <input type="range" id="sl-traffic" min="0" max="1.0" step="0.05" value="0.5">
      </div>

      <div class="control-group">
        <label>Time of Day <span id="val-time">12:00</span></label>
        <input type="range" id="sl-time" min="0" max="24" step="0.1" value="12">
      </div>

      <div class="stats">
        <h2>City Statistics</h2>
        <div class="stat-line"><span>Buildings</span><b id="st-buildings">0</b></div>
        <div class="stat-line"><span>Road segments</span><b id="st-roads">0</b></div>
        <div class="stat-line"><span>Cars</span><b id="st-cars">0</b></div>
        <div class="stat-line"><span>Pedestrians</span><b id="st-people">0</b></div>
        <div class="stat-line"><span>Development</span><b id="st-progress">0%</b></div>
      </div>

      <div class="keys">
        <strong>Controls:</strong><br>
        Left drag = rotate camera<br>
        Right drag = pan<br>
        Scroll = zoom<br>
        P = pause/resume
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Simulation parameters
    // ============================================================
    const params = {
      gridSize: 40,
      density: 0.6,
      devSpeed: 1.0,
      traffic: 0.5,
      timeOfDay: 12,
      blockSize: 2.4,
      roadWidth: 0.6,
      maxBuildings: 0,
      maxCars: 120,
      maxPeople: 80
    };

    // ============================================================
    // Babylon setup
    // ============================================================
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.05, 0.08, 0.14, 1);

    // Camera
    const cityExtent = params.gridSize * params.blockSize;
    const camera = new BABYLON.ArcRotateCamera('camera', -Math.PI / 2.5, Math.PI / 3, cityExtent * 0.8,
      new BABYLON.Vector3(0, 0, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 10;
    camera.upperRadiusLimit = cityExtent * 2;
    camera.upperBetaLimit = Math.PI / 2 - 0.05;
    camera.wheelPrecision = 50;

    // Lighting
    const hemiLight = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
    hemiLight.intensity = 0.6;
    hemiLight.groundColor = new BABYLON.Color3(0.12, 0.12, 0.15);

    const dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.6, -1, -0.4), scene);
    dirLight.position = new BABYLON.Vector3(cityExtent * 0.4, cityExtent * 0.6, cityExtent * 0.4);
    dirLight.intensity = 1.2;
    const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
    shadowGenerator.useBlurExponentialShadowMap = true;
    shadowGenerator.blurKernel = 16;

    // Ground
    const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
    groundMat.diffuseColor = new BABYLON.Color3(0.08, 0.1, 0.12);
    groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    const ground = BABYLON.MeshBuilder.CreateGround('ground', {
      width: cityExtent * 1.6,
      height: cityExtent * 1.6
    }, scene);
    ground.material = groundMat;
    ground.receiveShadows = true;

    // Glow layer for windows/lights
    const gl = new BABYLON.GlowLayer('glow', scene);
    gl.intensity = 0.4;

    // ============================================================
    // Materials
    // ============================================================
    const roadMat = new BABYLON.StandardMaterial('roadMat', scene);
    roadMat.diffuseColor = new BABYLON.Color3(0.18, 0.2, 0.22);
    roadMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);

    const sidewalkMat = new BABYLON.StandardMaterial('sidewalkMat', scene);
    sidewalkMat.diffuseColor = new BABYLON.Color3(0.55, 0.55, 0.58);

    const buildingMats = [
      makeBuildingMat(0.85, 0.88, 0.92),
      makeBuildingMat(0.75, 0.78, 0.85),
      makeBuildingMat(0.92, 0.82, 0.72),
      makeBuildingMat(0.65, 0.72, 0.78),
      makeBuildingMat(0.78, 0.75, 0.82)
    ];

    // Source meshes for instancing (hidden)
    const buildingSources = buildingMats.map((mat, i) => {
      const box = BABYLON.MeshBuilder.CreateBox('bSource' + i, { size: 1 }, scene);
      box.material = mat;
      box.isVisible = false;
      return box;
    });

    const winMat = makeBuildingMat(0.85, 0.88, 0.92);
    winMat.emissiveColor = new BABYLON.Color3(0.9, 0.75, 0.3);
    winMat.emissiveFresnelParameters = new BABYLON.FresnelParameters();
    winMat.emissiveFresnelParameters.bias = 0.6;
    winMat.emissiveFresnelParameters.power = 2;
    winMat.emissiveFresnelParameters.leftColor = BABYLON.Color3.Black();
    winMat.emissiveFresnelParameters.rightColor = BABYLON.Color3.White();
    const windowSource = BABYLON.MeshBuilder.CreateBox('winSource', { size: 1 }, scene);
    windowSource.material = winMat;
    windowSource.isVisible = false;

    let windowMats = [winMat];

    function makeBuildingMat(r, g, b) {
      const mat = new BABYLON.StandardMaterial('bmat', scene);
      mat.diffuseColor = new BABYLON.Color3(r, g, b);
      mat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      mat.emissiveColor = new BABYLON.Color3(0, 0, 0);
      return mat;
    }

    const carMat = new BABYLON.StandardMaterial('carMat', scene);
    carMat.diffuseColor = new BABYLON.Color3(0.9, 0.2, 0.2);
    carMat.emissiveColor = new BABYLON.Color3(0.05, 0, 0);

    const carMat2 = new BABYLON.StandardMaterial('carMat2', scene);
    carMat2.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.9);

    const peopleMat = new BABYLON.StandardMaterial('peopleMat', scene);
    peopleMat.diffuseColor = new BABYLON.Color3(0.95, 0.7, 0.4);

    // ============================================================
    // City data
    // ============================================================
    let grid = []; // 2D array: 0=empty/lot, 1=road
    let lots = []; // {x, z, width, depth, height, mesh, built, targetScale}
    let cars = []; // {mesh, x, z, dirX, dirZ, speed}
    let people = []; // {mesh, x, z, tx, tz, speed}
    let roadMeshes = [];
    let sidewalkMeshes = [];
    let paused = false;
    let lastSpawnCar = 0;
    let lastSpawnPerson = 0;

    // ============================================================
    // City generation
    // ============================================================
    function generateCity() {
      // Cleanup old meshes
      lots.forEach(l => l.mesh.dispose());
      cars.forEach(c => c.mesh.dispose());
      people.forEach(p => p.mesh.dispose());
      roadMeshes.forEach(m => m.dispose());
      sidewalkMeshes.forEach(m => m.dispose());
      lots = [];
      cars = [];
      people = [];
      roadMeshes = [];
      sidewalkMeshes = [];

      const N = params.gridSize;
      const bs = params.blockSize;
      const rw = params.roadWidth;
      const half = (N * bs) / 2;

      grid = Array.from({ length: N }, () => Array(N).fill(0));

      // Road spacing: larger cities have slightly wider road spacing, but every ~6-10 blocks
      const roadSpacing = N <= 30 ? 6 : (N <= 50 ? 8 : 10);
      const roadsX = new Set([0, N - 1]);
      const roadsZ = new Set([0, N - 1]);
      for (let i = roadSpacing; i < N; i += roadSpacing) {
        roadsX.add(i);
        roadsZ.add(i);
      }

      // Mark roads in grid
      for (let z = 0; z < N; z++) {
        for (let x = 0; x < N; x++) {
          if (roadsX.has(x) || roadsZ.has(z)) grid[z][x] = 1;
        }
      }

      // Build roads and sidewalks
      for (let z = 0; z < N; z++) {
        for (let x = 0; x < N; x++) {
          const px = x * bs - half + bs / 2;
          const pz = z * bs - half + bs / 2;

          if (grid[z][x] === 1) {
            const road = BABYLON.MeshBuilder.CreateBox('road', { width: bs, height: 0.08, depth: bs }, scene);
            road.position = new BABYLON.Vector3(px, 0.04, pz);
            road.material = roadMat;
            road.receiveShadows = true;
            roadMeshes.push(road);
          } else {
            // Sidewalk / lot base
            const sw = BABYLON.MeshBuilder.CreateBox('sw', { width: bs - 0.1, height: 0.1, depth: bs - 0.1 }, scene);
            sw.position = new BABYLON.Vector3(px, 0.05, pz);
            sw.material = sidewalkMat;
            sw.receiveShadows = true;
            sidewalkMeshes.push(sw);

            // Decide if this lot will become a building based on density & distance from center
            const dx = x - N / 2;
            const dz = z - N / 2;
            const dist = Math.sqrt(dx * dx + dz * dz) / (N / 2);
            const centerBoost = Math.max(0, 1 - dist);
            const buildProb = params.density * (0.3 + 0.7 * centerBoost);

            if (Math.random() < buildProb) {
              const height = 1 + Math.random() * 3 + centerBoost * 8 + params.density * 4;
              const lot = {
                x: px,
                z: pz,
                width: bs - rw - 0.3,
                depth: bs - rw - 0.3,
                height: height,
                mesh: null,
                built: false,
                targetScale: 1,
                currentScale: 0,
                emissive: Math.random() < 0.3
              };
              lots.push(lot);
            }
          }
        }
      }

      params.maxBuildings = lots.length;
      updateStats();

      // Sort lots so central buildings tend to grow first
      lots.sort((a, b) => {
        const da = a.x * a.x + a.z * a.z;
        const db = b.x * b.x + b.z * b.z;
        return da - db;
      });
    }

    // ============================================================
    // Building growth
    // ============================================================
    function updateBuildings(dt) {
      const growthRate = 0.8 * params.devSpeed;
      const buildRate = 0.15 * params.devSpeed;

      // Start new buildings
      const targetBuilt = Math.floor(params.maxBuildings * Math.min(1, stepCount * 0.002 * params.devSpeed + 0.05));
      for (let i = 0; i < lots.length; i++) {
        const lot = lots[i];
        if (!lot.built && i < targetBuilt && Math.random() < buildRate) {
          // Create building instance for performance
          const source = lot.emissive ? windowSource : buildingSources[Math.floor(Math.random() * buildingSources.length)];
          const box = source.createInstance('building');
          box.position = new BABYLON.Vector3(lot.x, 0, lot.z);
          box.scaling = new BABYLON.Vector3(lot.width, lot.height * 0.001, lot.depth);
          box.receiveShadows = true;
          shadowGenerator.addShadowCaster(box);

          lot.mesh = box;
          lot.built = true;
        }

        if (lot.built && lot.mesh) {
          if (lot.currentScale < lot.targetScale) {
            lot.currentScale = Math.min(lot.targetScale, lot.currentScale + growthRate * dt);
            lot.mesh.scaling.y = lot.height * lot.currentScale;
            lot.mesh.position.y = lot.height * lot.currentScale / 2;
          }
        }
      }
    }

    // ============================================================
    // Traffic system
    // ============================================================
    function getRoadCells() {
      const cells = [];
      for (let z = 0; z < params.gridSize; z++) {
        for (let x = 0; x < params.gridSize; x++) {
          if (grid[z][x] === 1) cells.push({ x, z });
        }
      }
      return cells;
    }

    function spawnCar() {
      if (cars.length >= params.maxCars * params.traffic) return;

      const N = params.gridSize;
      const bs = params.blockSize;
      const half = (N * bs) / 2;

      // Pick a random road edge
      const edge = Math.floor(Math.random() * 4);
      let x, z, dirX, dirZ;
      switch (edge) {
        case 0: x = 0; z = Math.floor(Math.random() * N); dirX = 1; dirZ = 0; break;
        case 1: x = N - 1; z = Math.floor(Math.random() * N); dirX = -1; dirZ = 0; break;
        case 2: x = Math.floor(Math.random() * N); z = 0; dirX = 0; dirZ = 1; break;
        case 3: x = Math.floor(Math.random() * N); z = N - 1; dirX = 0; dirZ = -1; break;
      }

      const car = BABYLON.MeshBuilder.CreateBox('car', { width: 0.5, height: 0.35, depth: 0.9 }, scene);
      car.position.x = x * bs - half + bs / 2;
      car.position.z = z * bs - half + bs / 2;
      car.position.y = 0.25;
      car.material = Math.random() < 0.5 ? carMat : carMat2;
      shadowGenerator.addShadowCaster(car);

      // Rotate car to face direction
      if (dirX !== 0) car.rotation.y = dirX > 0 ? Math.PI / 2 : -Math.PI / 2;
      else car.rotation.y = dirZ > 0 ? 0 : Math.PI;

      cars.push({
        mesh: car,
        gx: x,
        gz: z,
        dirX,
        dirZ,
        px: car.position.x,
        pz: car.position.z,
        speed: (4 + Math.random() * 4) * (0.7 + params.traffic)
      });
    }

    function updateCars(dt) {
      const N = params.gridSize;
      const bs = params.blockSize;
      const half = (N * bs) / 2;

      for (let i = cars.length - 1; i >= 0; i--) {
        const c = cars[i];
        c.px += c.dirX * c.speed * dt;
        c.pz += c.dirZ * c.speed * dt;
        c.mesh.position.x = c.px;
        c.mesh.position.z = c.pz;

        // Check if reached next grid cell center
        const targetX = c.gx * bs - half + bs / 2 + c.dirX * bs;
        const targetZ = c.gz * bs - half + bs / 2 + c.dirZ * bs;

        const reached = (c.dirX !== 0 && (c.dirX > 0 ? c.px >= targetX : c.px <= targetX)) ||
                        (c.dirZ !== 0 && (c.dirZ > 0 ? c.pz >= targetZ : c.pz <= targetZ));

        if (reached) {
          c.gx += c.dirX;
          c.gz += c.dirZ;
          c.px = c.gx * bs - half + bs / 2;
          c.pz = c.gz * bs - half + bs / 2;

          // Out of bounds -> despawn
          if (c.gx < 0 || c.gx >= N || c.gz < 0 || c.gz >= N) {
            c.mesh.dispose();
            cars.splice(i, 1);
            continue;
          }

          // At intersection, possibly turn
          if (grid[c.gz][c.gx] === 1) {
            const choices = [];
            if (c.dirX === 0) { choices.push({ x: 1, z: 0 }, { x: -1, z: 0 }); }
            if (c.dirZ === 0) { choices.push({ x: 0, z: 1 }, { x: 0, z: -1 }); }
            // Also keep straight
            choices.push({ x: c.dirX, z: c.dirZ });

            const valid = choices.filter(d => {
              const nx = c.gx + d.x;
              const nz = c.gz + d.z;
              return nx >= 0 && nx < N && nz >= 0 && nz < N && grid[nz][nx] === 1;
            });

            if (valid.length > 0) {
              const choice = valid[Math.floor(Math.random() * valid.length)];
              c.dirX = choice.x;
              c.dirZ = choice.z;
              if (c.dirX !== 0) c.mesh.rotation.y = c.dirX > 0 ? Math.PI / 2 : -Math.PI / 2;
              else c.mesh.rotation.y = c.dirZ > 0 ? 0 : Math.PI;
            }
          }
        }
      }
    }

    // ============================================================
    // Pedestrians
    // ============================================================
    function spawnPerson() {
      if (people.length >= params.maxPeople * (0.4 + params.density * 0.6)) return;

      const N = params.gridSize;
      const bs = params.blockSize;
      const half = (N * bs) / 2;

      // Spawn on a sidewalk (non-road cell)
      let x, z;
      let attempts = 0;
      do {
        x = Math.floor(Math.random() * N);
        z = Math.floor(Math.random() * N);
        attempts++;
      } while (grid[z][x] === 1 && attempts < 100);
      if (grid[z][x] === 1) return;

      const person = BABYLON.MeshBuilder.CreateCapsule('person', { radius: 0.12, height: 0.55 }, scene);
      person.position.x = x * bs - half + bs / 2 + (Math.random() - 0.5) * (bs - 0.8);
      person.position.z = z * bs - half + bs / 2 + (Math.random() - 0.5) * (bs - 0.8);
      person.position.y = 0.35;
      person.material = peopleMat;
      shadowGenerator.addShadowCaster(person);

      people.push({
        mesh: person,
        x: person.position.x,
        z: person.position.z,
        tx: person.position.x + (Math.random() - 0.5) * 10,
        tz: person.position.z + (Math.random() - 0.5) * 10,
        speed: 0.8 + Math.random() * 0.8
      });
    }

    function updatePeople(dt) {
      for (let i = people.length - 1; i >= 0; i--) {
        const p = people[i];
        const dx = p.tx - p.x;
        const dz = p.tz - p.z;
        const dist = Math.sqrt(dx * dx + dz * dz);

        if (dist < 0.3) {
          // New random target within city bounds
          const N = params.gridSize;
          const bs = params.blockSize;
          const half = (N * bs) / 2;
          p.tx = (Math.random() - 0.5) * N * bs * 0.8;
          p.tz = (Math.random() - 0.5) * N * bs * 0.8;
        } else {
          p.x += (dx / dist) * p.speed * dt;
          p.z += (dz / dist) * p.speed * dt;
          p.mesh.position.x = p.x;
          p.mesh.position.z = p.z;
          p.mesh.rotation.y = Math.atan2(dx, dz);
        }

        if (Math.random() < 0.002) {
          p.mesh.dispose();
          people.splice(i, 1);
        }
      }
    }

    // ============================================================
    // Time of day
    // ============================================================
    function updateTimeOfDay() {
      const t = params.timeOfDay;
      // Sun angle: 6am -> -60deg, 12pm -> 90deg, 18pm -> 240deg
      const angle = ((t - 6) / 12) * Math.PI;
      const r = cityExtent * 0.7;
      dirLight.position.x = Math.cos(angle) * r;
      dirLight.position.y = Math.sin(angle) * r * 0.8 + 20;
      dirLight.position.z = Math.sin(angle) * r * 0.3;
      dirLight.intensity = Math.max(0.1, Math.sin(angle));

      // Night windows glow more
      const night = Math.max(0, 1 - Math.sin(angle) * 2);
      windowMats.forEach(m => {
        m.emissiveColor = new BABYLON.Color3(0.9 * night, 0.75 * night, 0.3 * night);
      });

      // Sky color
      const day = Math.max(0, Math.sin(angle));
      scene.clearColor = new BABYLON.Color4(0.02 + day * 0.1, 0.03 + day * 0.15, 0.06 + day * 0.2, 1);
      hemiLight.intensity = 0.3 + day * 0.5;
      hemiLight.groundColor = new BABYLON.Color3(0.05 + day * 0.1, 0.05 + day * 0.1, 0.08 + day * 0.1);
    }

    // ============================================================
    // Main loop
    // ============================================================
    let stepCount = 0;
    scene.registerBeforeRender(() => {
      if (paused) return;
      const dt = engine.getDeltaTime() / 1000;
      stepCount++;

      updateBuildings(dt);

      // Spawn traffic/pedestrians periodically
      if (params.traffic > 0 && stepCount % Math.max(1, Math.floor(20 / (params.traffic + 0.1))) === 0) {
        spawnCar();
      }
      if (stepCount % 40 === 0) spawnPerson();

      updateCars(dt);
      updatePeople(dt);
      updateTimeOfDay();
      updateStats();
    });

    engine.runRenderLoop(() => scene.render());
    window.addEventListener('resize', () => engine.resize());

    // ============================================================
    // UI bindings
    // ============================================================
    function bindSlider(id, key, displayId, callback) {
      const el = document.getElementById(id);
      el.addEventListener('input', () => {
        params[key] = parseFloat(el.value);
        if (displayId) {
          const disp = document.getElementById(displayId);
          if (key === 'timeOfDay') {
            const h = Math.floor(params.timeOfDay);
            const m = Math.floor((params.timeOfDay - h) * 60);
            disp.textContent = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
          } else {
            disp.textContent = params[key];
          }
        }
        if (callback) callback();
      });
    }

    bindSlider('sl-density', 'density', 'val-density');
    bindSlider('sl-dev', 'devSpeed', 'val-dev');
    bindSlider('sl-traffic', 'traffic', 'val-traffic');
    bindSlider('sl-time', 'timeOfDay', 'val-time');

    document.getElementById('sl-size').addEventListener('input', (e) => {
      params.gridSize = parseInt(e.target.value);
      document.getElementById('val-size').textContent = params.gridSize;
      generateCity();
      resetCamera();
    });

    document.getElementById('btn-regen').addEventListener('click', () => {
      generateCity();
    });

    document.getElementById('btn-pause').addEventListener('click', () => {
      paused = !paused;
      document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'p' || e.key === 'P') {
        paused = !paused;
        document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
      }
    });

    function resetCamera() {
      const ext = params.gridSize * params.blockSize;
      camera.setTarget(BABYLON.Vector3.Zero());
      camera.radius = ext * 0.8;
      camera.upperRadiusLimit = ext * 2;
      dirLight.position = new BABYLON.Vector3(ext * 0.4, ext * 0.6, ext * 0.4);
      const currentWidth = ground.getBoundingInfo().boundingBox.extendSize.x * 2;
      const currentDepth = ground.getBoundingInfo().boundingBox.extendSize.z * 2;
      ground.scaling.x = (ext * 1.6) / currentWidth;
      ground.scaling.z = (ext * 1.6) / currentDepth;
    }

    function updateStats() {
      const built = lots.filter(l => l.built).length;
      const progress = params.maxBuildings > 0 ? Math.round((built / params.maxBuildings) * 100) : 0;
      document.getElementById('st-buildings').textContent = built;
      document.getElementById('st-roads').textContent = roadMeshes.length;
      document.getElementById('st-cars').textContent = cars.length;
      document.getElementById('st-people').textContent = people.length;
      document.getElementById('st-progress').textContent = progress + '%';
    }

    // Initial generation
    generateCity();
  </script>
</body>
</html>
