<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Growth Simulation</title>
    <!-- Babylon.js core library -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* UI Panel Styling */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(20, 25, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            color: #ecf0f1;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            user-select: none;
        }

        #ui-panel h2 {
            margin: 0 0 20px 0;
            font-size: 20px;
            font-weight: 600;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .control-value {
            color: #f1c40f;
            font-weight: bold;
        }

        input[type=range] {
            width: 100%;
            appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3498db;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #7f8c8d;
            border-radius: 2px;
        }

        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 13px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="renderCanvas"></canvas>

    <div id="ui-panel">
        <h2>City Simulator</h2>
        
        <div class="control-group">
            <div class="control-header">
                <span>City Size Limit</span>
                <span class="control-value" id="val-size">20</span>
            </div>
            <input type="range" id="slider-size" min="2" max="35" value="20">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Traffic Intensity</span>
                <span class="control-value" id="val-traffic">50</span>
            </div>
            <input type="range" id="slider-traffic" min="0" max="200" value="50">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Development Speed</span>
                <span class="control-value" id="val-speed">5</span>
            </div>
            <input type="range" id="slider-speed" min="0" max="20" value="5" step="0.5">
        </div>
    </div>

    <div id="stats">
        Buildings: <span id="stat-buildings">0</span> | Population: <span id="stat-pop">0</span>
    </div>

    <script>
        // --- CONFIGURATION ---
        const GRID_SIZE = 70; // 70x70 grid
        const CENTER = Math.floor(GRID_SIZE / 2);
        const CELL_SIZE = 3;
        
        // --- SIMULATION STATE ---
        let config = {
            maxRadius: 20,
            trafficMax: 50,
            devSpeed: 5
        };

        let simulatedRadius = 0; // Gradually grows to maxRadius
        let grid = new Array(GRID_SIZE).fill(null).map(() => new Array(GRID_SIZE).fill(null));
        let activeRoads = [];
        let growingMeshes = []; // Meshes currently animating scale
        let vehicles = [];
        let totalBuildings = 0;
        let totalPopulation = 0;

        // UI Elements
        const uiSize = document.getElementById("slider-size");
        const uiTraffic = document.getElementById("slider-traffic");
        const uiSpeed = document.getElementById("slider-speed");
        const valSize = document.getElementById("val-size");
        const valTraffic = document.getElementById("val-traffic");
        const valSpeed = document.getElementById("val-speed");
        const statBuildings = document.getElementById("stat-buildings");
        const statPop = document.getElementById("stat-pop");

        // --- SETUP BABYLON.JS ---
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.55, 0.75, 0.9, 1); // Sky blue
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = scene.clearColor;
            scene.fogDensity = 0.005;

            // Camera (Isometric angle)
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3, 100, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 20;
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 200;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.4;
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.3, 0.2);

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.position = new BABYLON.Vector3(50, 100, 50);
            dirLight.intensity = 0.8;

            const shadowGen = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGen.useBlurExponentialShadowMap = true;
            shadowGen.blurKernel = 32;

            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: GRID_SIZE*CELL_SIZE, height: GRID_SIZE*CELL_SIZE}, scene);
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.15, 0.25, 0.15); // Dark grass
            ground.material = groundMat;
            ground.receiveShadows = true;

            // --- MATERIALS PREPARATION ---
            const materials = {
                road: new BABYLON.StandardMaterial("roadMat", scene),
                buildings: [],
                vehicles: []
            };
            
            materials.road.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            materials.road.specularColor = new BABYLON.Color3(0, 0, 0);

            // Building Palettes
            const buildingColors = ["#ecf0f1", "#bdc3c7", "#95a5a6", "#34495e", "#2980b9", "#d35400"];
            buildingColors.forEach(c => {
                let m = new BABYLON.StandardMaterial("bMat", scene);
                m.diffuseColor = BABYLON.Color3.FromHexString(c);
                m.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                materials.buildings.push(m);
            });

            // Vehicle Palettes (Emissive for bright look)
            const vehicleColors = ["#e74c3c", "#f1c40f", "#ffffff", "#2ecc71"];
            vehicleColors.forEach(c => {
                let m = new BABYLON.StandardMaterial("vMat", scene);
                m.diffuseColor = BABYLON.Color3.FromHexString(c);
                m.emissiveColor = BABYLON.Color3.FromHexString(c).scale(0.5);
                materials.vehicles.push(m);
            });

            return { scene, shadowGen, materials };
        };

        const { scene, shadowGen, materials } = createScene();

        // --- SIMULATION LOGIC ---

        function isRoadPlan(x, z) {
            // Grid-like city pattern: roads every 4 cells
            return (x % 4 === 0 || z % 4 === 0);
        }

        function buildCell(x, z) {
            if (grid[x][z]) return; // Already built

            let worldX = (x - CENTER) * CELL_SIZE;
            let worldZ = (z - CENTER) * CELL_SIZE;
            let isRoad = isRoadPlan(x, z);
            let distFromCenter = Math.sqrt((x-CENTER)**2 + (z-CENTER)**2);

            let mesh;
            let targetHeight = 1;
            let type = "";

            if (isRoad) {
                // Build Road
                mesh = BABYLON.MeshBuilder.CreateBox(`road_${x}_${z}`, {size: CELL_SIZE}, scene);
                // Shift vertices so origin is at bottom
                mesh.bakeTransformIntoVertices(BABYLON.Matrix.Translation(0, 0.5, 0));
                mesh.position = new BABYLON.Vector3(worldX, 0.01, worldZ);
                mesh.scaling.y = 0.05; // Flat
                mesh.material = materials.road;
                mesh.receiveShadows = true;
                
                type = "ROAD";
                activeRoads.push({x, z, pos: mesh.position.clone()});
            } else {
                // Build Building
                // Make it slightly smaller than cell to leave gaps
                mesh = BABYLON.MeshBuilder.CreateBox(`bldg_${x}_${z}`, {width: CELL_SIZE * 0.85, depth: CELL_SIZE * 0.85, height: 1}, scene);
                mesh.bakeTransformIntoVertices(BABYLON.Matrix.Translation(0, 0.5, 0)); // origin at bottom
                mesh.position = new BABYLON.Vector3(worldX, 0, worldZ);
                
                // Height based on distance to center (downtown has skyscrapers)
                let maxH = Math.max(1, 15 - (distFromCenter / 25) * 12);
                targetHeight = Math.random() * maxH + Math.random() * 2 + 0.5;

                mesh.material = materials.buildings[Math.floor(Math.random() * materials.buildings.length)];
                shadowGen.addShadowCaster(mesh);
                mesh.receiveShadows = true;

                type = "BUILDING";
                totalBuildings++;
                totalPopulation += Math.floor(targetHeight * 10); // Rough population estimation
            }

            // Animation start
            mesh.scaling.y = 0.01;
            growingMeshes.push({ mesh, targetHeight, speed: Math.random() * 2 + 1 });

            grid[x][z] = { mesh, type, x, z };
        }

        function destroyCell(x, z) {
            let cell = grid[x][z];
            if (!cell) return;

            cell.mesh.dispose();
            
            if (cell.type === "ROAD") {
                activeRoads = activeRoads.filter(r => r.x !== x || r.z !== z);
            } else if (cell.type === "BUILDING") {
                totalBuildings--;
                // Clean up animation queue just in case
                growingMeshes = growingMeshes.filter(gm => gm.mesh !== cell.mesh);
            }
            grid[x][z] = null;
        }

        function updateCityGrowth(dt) {
            // Shrink simulated radius if user lowered the slider
            if (simulatedRadius > config.maxRadius) {
                simulatedRadius -= dt * 10;
                if (simulatedRadius < config.maxRadius) simulatedRadius = config.maxRadius;
            } else {
                // Grow simulated radius based on devSpeed
                simulatedRadius += (config.devSpeed * 0.5) * dt;
                if (simulatedRadius > config.maxRadius) simulatedRadius = config.maxRadius;
            }

            let growthOccurred = false;

            // Scan the grid and apply building/destruction
            for (let x = 0; x < GRID_SIZE; x++) {
                for (let z = 0; z < GRID_SIZE; z++) {
                    let dist = Math.sqrt((x-CENTER)**2 + (z-CENTER)**2);
                    
                    if (dist <= simulatedRadius) {
                        // Add some organic noise to the growth edge
                        if (!grid[x][z] && dist + Math.random()*2 <= simulatedRadius) {
                            buildCell(x, z);
                            growthOccurred = true;
                        }
                    } else if (dist > config.maxRadius) {
                        // Destroy if outside the absolute max radius
                        if (grid[x][z]) {
                            destroyCell(x, z);
                            growthOccurred = true;
                        }
                    }
                }
            }

            // Update Statistics UI
            if(growthOccurred) {
                statBuildings.innerText = totalBuildings;
                statPop.innerText = Math.max(0, totalPopulation); // Population roughly scales with buildings destroyed/created, re-calc might drift so simplified here.
            }

            // Animate growing meshes
            for (let i = growingMeshes.length - 1; i >= 0; i--) {
                let gm = growingMeshes[i];
                gm.mesh.scaling.y += gm.speed * dt * config.devSpeed;
                
                if (gm.mesh.scaling.y >= gm.targetHeight) {
                    gm.mesh.scaling.y = gm.targetHeight;
                    gm.mesh.freezeWorldMatrix(); // Optimize performance once fully grown
                    growingMeshes.splice(i, 1);
                }
            }
        }

        function spawnVehicle() {
            if (activeRoads.length === 0) return;
            
            let startRoad = activeRoads[Math.floor(Math.random() * activeRoads.length)];
            let mesh = BABYLON.MeshBuilder.CreateBox("v", {width: 0.6, depth: 1.2, height: 0.6}, scene);
            mesh.position = startRoad.pos.clone();
            mesh.position.y = 0.4;
            mesh.material = materials.vehicles[Math.floor(Math.random() * materials.vehicles.length)];

            vehicles.push({
                mesh: mesh,
                currentRoad: startRoad,
                targetRoad: startRoad,
                progress: 1, // Ready to pick next target
                speed: Math.random() * 5 + 5 // 5 to 10 units per second
            });
        }

        function getAdjacentRoads(road) {
            let neighbors = [];
            const dirs = [[0,1], [0,-1], [1,0], [-1,0]];
            for (let d of dirs) {
                let nx = road.x + d[0];
                let nz = road.z + d[1];
                if (nx >= 0 && nx < GRID_SIZE && nz >= 0 && nz < GRID_SIZE) {
                    let cell = grid[nx][nz];
                    if (cell && cell.type === "ROAD") {
                        // Find the corresponding object in activeRoads to get position
                        let activeMatch = activeRoads.find(r => r.x === nx && r.z === nz);
                        if(activeMatch) neighbors.push(activeMatch);
                    }
                }
            }
            return neighbors;
        }

        function updateTraffic(dt) {
            // Spawn/Despawn based on intensity
            if (vehicles.length < config.trafficMax && Math.random() < 0.1) {
                spawnVehicle();
            } else if (vehicles.length > config.trafficMax) {
                let v = vehicles.pop();
                v.mesh.dispose();
            }

            for (let i = vehicles.length - 1; i >= 0; i--) {
                let v = vehicles[i];

                if (v.progress >= 1) {
                    // Reached target intersection, pick next
                    v.currentRoad = v.targetRoad;
                    let neighbors = getAdjacentRoads(v.currentRoad);
                    
                    if (neighbors.length === 0) {
                        // Road destroyed under it
                        v.mesh.dispose();
                        vehicles.splice(i, 1);
                        continue;
                    }

                    // Try not to turn around 180 degrees immediately unless it's a dead end
                    let forwardNeighbors = neighbors.filter(n => v.prevRoad ? (n.x !== v.prevRoad.x || n.z !== v.prevRoad.z) : true);
                    if (forwardNeighbors.length === 0) forwardNeighbors = neighbors; // Allow U-turn

                    v.prevRoad = v.currentRoad;
                    v.targetRoad = forwardNeighbors[Math.floor(Math.random() * forwardNeighbors.length)];
                    v.progress = 0;

                    // Orient vehicle
                    v.mesh.lookAt(new BABYLON.Vector3(v.targetRoad.pos.x, v.mesh.position.y, v.targetRoad.pos.z));
                }

                // Move vehicle
                let dist = BABYLON.Vector3.Distance(v.currentRoad.pos, v.targetRoad.pos);
                if (dist > 0) {
                    v.progress += (v.speed * dt) / dist;
                    v.progress = Math.min(v.progress, 1);
                    
                    v.mesh.position = BABYLON.Vector3.Lerp(
                        new BABYLON.Vector3(v.currentRoad.pos.x, 0.4, v.currentRoad.pos.z),
                        new BABYLON.Vector3(v.targetRoad.pos.x, 0.4, v.targetRoad.pos.z),
                        v.progress
                    );
                } else {
                    v.progress = 1; // Failsafe
                }
            }
        }

        // --- RENDER LOOP ---
        scene.onBeforeRenderObservable.add(() => {
            let dt = engine.getDeltaTime() / 1000;
            updateCityGrowth(dt);
            updateTraffic(dt);
        });

        engine.runRenderLoop(() => {
            scene.render();
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });

        // --- UI BINDINGS ---
        uiSize.addEventListener("input", (e) => {
            config.maxRadius = parseInt(e.target.value);
            valSize.innerText = config.maxRadius;
        });

        uiTraffic.addEventListener("input", (e) => {
            config.trafficMax = parseInt(e.target.value);
            valTraffic.innerText = config.trafficMax;
        });

        uiSpeed.addEventListener("input", (e) => {
            config.devSpeed = parseFloat(e.target.value);
            valSpeed.innerText = config.devSpeed;
        });

    </script>
</body>
</html>
