<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D City Growth Simulation</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 50%, #C0E8FF 100%);
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 320px;
            z-index: 100;
        }

        .control-panel h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-panel h2::before {
            content: "🏙️";
            font-size: 28px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
        }

        .control-value {
            color: #3498db;
            font-weight: bold;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #e0e0e0;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }

        .stats-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            z-index: 100;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-label {
            color: #7f8c8d;
            font-weight: 500;
        }

        .stat-value {
            color: #2c3e50;
            font-weight: bold;
        }

        .time-display {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .info-tooltip {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 13px;
            max-width: 250px;
            z-index: 100;
        }

        .info-tooltip h4 {
            margin-bottom: 10px;
            color: #3498db;
        }

        .legend {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            margin-right: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div class="stats-panel">
        <h3 style="margin-bottom: 15px; color: #2c3e50;">City Statistics</h3>
        <div class="stat-item">
            <span class="stat-label">Buildings:</span>
            <span class="stat-value" id="buildingCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Population:</span>
            <span class="stat-value" id="population">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Vehicles:</span>
            <span class="stat-value" id="vehicleCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Roads:</span>
            <span class="stat-value" id="roadCount">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">City Age:</span>
            <span class="stat-value" id="cityAge">0 days</span>
        </div>
    </div>

    <div class="control-panel">
        <h2>City Controls</h2>
        
        <div class="control-group">
            <div class="control-label">
                <span>City Size</span>
                <span class="control-value" id="sizeValue">50</span>
            </div>
            <input type="range" class="slider" id="citySize" min="10" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Population Density</span>
                <span class="control-value" id="densityValue">50%</span>
            </div>
            <input type="range" class="slider" id="populationDensity" min="10" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Traffic Intensity</span>
                <span class="control-value" id="trafficValue">50%</span>
            </div>
            <input type="range" class="slider" id="trafficIntensity" min="0" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Development Speed</span>
                <span class="control-value" id="speedValue">1x</span>
            </div>
            <input type="range" class="slider" id="developmentSpeed" min="0" max="200" value="100">
        </div>

        <div class="button-group">
            <button class="btn" onclick="toggleSimulation()">Pause/Resume</button>
            <button class="btn secondary" onclick="resetCity()">Reset City</button>
        </div>

        <div class="legend">
            <h4 style="margin-bottom: 10px; color: #2c3e50;">Building Types</h4>
            <div class="legend-item">
                <div class="legend-color" style="background: #4CAF50;"></div>
                <span>Residential</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #2196F3;"></div>
                <span>Commercial</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FF9800;"></div>
                <span>Office</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #9C27B0;"></div>
                <span>Industrial</span>
            </div>
        </div>
    </div>

    <div class="time-display" id="timeDisplay">
        Day 1 | 12:00 PM
    </div>

    <script>
        let scene, engine, camera;
        let cityGrid = [];
        let buildings = [];
        let vehicles = [];
        let pedestrians = [];
        let roads = [];
        let trees = [];
        
        // City parameters
        let citySize = 50;
        let populationDensity = 50;
        let trafficIntensity = 50;
        let developmentSpeed = 100;
        let isPaused = false;
        let cityTime = 0;
        let dayCount = 0;
        
        // Grid settings
        const BLOCK_SIZE = 10;
        const ROAD_WIDTH = 3;
        const BUILDING_MARGIN = 0.5;
        
        // Building types
        const BUILDING_TYPES = {
            RESIDENTIAL: { color: [0.27, 0.69, 0.31], minHeight: 5, maxHeight: 15 },
            COMMERCIAL: { color: [0.13, 0.59, 0.95], minHeight: 10, maxHeight: 30 },
            OFFICE: { color: [1, 0.6, 0], minHeight: 20, maxHeight: 50 },
            INDUSTRIAL: { color: [0.61, 0.15, 0.69], minHeight: 5, maxHeight: 20 }
        };

        // Initialize Babylon.js
        function initBabylon() {
            const canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
            
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);
            
            // Enable fog for depth
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.002;
            scene.fogColor = new BABYLON.Color3(0.8, 0.9, 1);
            
            createCamera();
            createLighting();
            createGround();
            initializeCity();
            
            // Start render loop
            engine.runRenderLoop(() => {
                if (!isPaused) {
                    updateSimulation();
                }
                scene.render();
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            setupControls();
        }

        // Create camera
        function createCamera() {
            camera = new BABYLON.ArcRotateCamera('camera', 
                -Math.PI / 2, Math.PI / 3, 200, 
                new BABYLON.Vector3(0, 0, 0), scene);
            
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 500;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.wheelPrecision = 20;
            camera.panningSensibility = 50;
            
            // Smooth camera movement
            camera.inertia = 0.7;
            camera.speed = 0.5;
        }

        // Create lighting
        function createLighting() {
            // Ambient light
            const hemisphericLight = new BABYLON.HemisphericLight('hemiLight',
                new BABYLON.Vector3(0, 1, 0), scene);
            hemisphericLight.intensity = 0.7;
            hemisphericLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
            hemisphericLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);
            hemisphericLight.groundColor = new BABYLON.Color3(0.3, 0.3, 0.4);
            
            // Sun light
            const sunLight = new BABYLON.DirectionalLight('sunLight',
                new BABYLON.Vector3(-1, -2, -1), scene);
            sunLight.intensity = 0.5;
            sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
        }

        // Create ground
        function createGround() {
            const ground = BABYLON.MeshBuilder.CreateGround('ground', 
                { width: 500, height: 500, subdivisions: 50 }, scene);
            
            const groundMaterial = new BABYLON.StandardMaterial('groundMat', scene);
            groundMaterial.diffuseColor = new BABYLON.Color3(0.9, 0.9, 0.9);
            groundMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            ground.material = groundMaterial;
            ground.position.y = -0.1;
        }

        // Initialize city grid
        function initializeCity() {
            const gridSize = Math.floor(citySize / 10);
            cityGrid = [];
            
            for (let x = 0; x < gridSize; x++) {
                cityGrid[x] = [];
                for (let z = 0; z < gridSize; z++) {
                    cityGrid[x][z] = {
                        type: null,
                        building: null,
                        developed: false
                    };
                }
            }
            
            // Create initial roads
            createRoadNetwork(gridSize);
        }

        // Create road network
        function createRoadNetwork(gridSize) {
            // Main arterial roads
            for (let i = 0; i < gridSize; i++) {
                // Horizontal main road
                if (i % 3 === 0) {
                    for (let x = 0; x < gridSize; x++) {
                        createRoad(x * BLOCK_SIZE, i * BLOCK_SIZE, true);
                    }
                }
                // Vertical main road
                if (i % 3 === 0) {
                    for (let z = 0; z < gridSize; z++) {
                        createRoad(i * BLOCK_SIZE, z * BLOCK_SIZE, false);
                    }
                }
            }
        }

        // Create road segment
        function createRoad(x, z, isHorizontal) {
            const road = BABYLON.MeshBuilder.CreateBox('road', {
                width: isHorizontal ? BLOCK_SIZE : ROAD_WIDTH,
                height: 0.1,
                depth: isHorizontal ? ROAD_WIDTH : BLOCK_SIZE
            }, scene);
            
            road.position.x = x - citySize * BLOCK_SIZE / 20;
            road.position.z = z - citySize * BLOCK_SIZE / 20;
            road.position.y = 0;
            
            const roadMaterial = new BABYLON.StandardMaterial('roadMat', scene);
            roadMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            roadMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
            road.material = roadMaterial;
            
            roads.push(road);
            
            // Add road markings
            if (Math.random() > 0.5) {
                const marking = BABYLON.MeshBuilder.CreateBox('marking', {
                    width: isHorizontal ? BLOCK_SIZE * 0.8 : 0.2,
                    height: 0.01,
                    depth: isHorizontal ? 0.2 : BLOCK_SIZE * 0.8
                }, scene);
                
                marking.position = road.position.clone();
                marking.position.y = 0.11;
                
                const markingMat = new BABYLON.StandardMaterial('markingMat', scene);
                markingMat.diffuseColor = new BABYLON.Color3(1, 1, 1);
                markingMat.emissiveColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                marking.material = markingMat;
            }
        }

        // Create building
        function createBuilding(x, z) {
            const types = Object.keys(BUILDING_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];
            const buildingData = BUILDING_TYPES[type];
            
            const height = buildingData.minHeight + 
                Math.random() * (buildingData.maxHeight - buildingData.minHeight) * 
                (populationDensity / 100);
            
            const width = BLOCK_SIZE - BUILDING_MARGIN * 2;
            const depth = BLOCK_SIZE - BUILDING_MARGIN * 2;
            
            // Building base
            const building = BABYLON.MeshBuilder.CreateBox('building', {
                width: width,
                height: height,
                depth: depth
            }, scene);
            
            building.position.x = x * BLOCK_SIZE - citySize * BLOCK_SIZE / 20;
            building.position.z = z * BLOCK_SIZE - citySize * BLOCK_SIZE / 20;
            building.position.y = height / 2;
            
            // Building material
            const buildingMaterial = new BABYLON.StandardMaterial('buildingMat', scene);
            buildingMaterial.diffuseColor = new BABYLON.Color3(...buildingData.color);
            buildingMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            building.material = buildingMaterial;
            
            // Add windows
            createWindows(building, width, height, depth);
            
            // Animate building appearance
            building.scaling.y = 0;
            const animationSpeed = 0.05 * (developmentSpeed / 100);
            
            scene.registerBeforeRender(function animateBuilding() {
                if (building.scaling.y < 1) {
                    building.scaling.y += animationSpeed;
                    building.position.y = (height / 2) * building.scaling.y;
                } else {
                    scene.unregisterBeforeRender(animateBuilding);
                }
            });
            
            buildings.push({
                mesh: building,
                type: type,
                population: Math.floor(height * 10)
            });
            
            return building;
        }

        // Create windows on building
        function createWindows(building, width, height, depth) {
            const windowRows = Math.floor(height / 3);
            const windowCols = Math.floor(width / 2);
            
            for (let row = 0; row < windowRows; row++) {
                for (let col = 0; col < windowCols; col++) {
                    if (Math.random() > 0.3) {
                        const window = BABYLON.MeshBuilder.CreatePlane('window', {
                            width: 1.2,
                            height: 1.5
                        }, scene);
                        
                        window.position.x = (col - windowCols / 2 + 0.5) * 2;
                        window.position.y = (row - windowRows / 2 + 0.5) * 3;
                        window.position.z = depth / 2 + 0.01;
                        window.parent = building;
                        
                        const windowMat = new BABYLON.StandardMaterial('windowMat', scene);
                        const isLit = Math.random() > 0.3 && row > windowRows / 2;
                        windowMat.emissiveColor = isLit ? 
                            new BABYLON.Color3(1, 0.9, 0.5) : 
                            new BABYLON.Color3(0.1, 0.1, 0.2);
                        windowMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.3);
                        window.material = windowMat;
                    }
                }
            }
        }

        // Create vehicle
        function createVehicle() {
            const vehicle = BABYLON.MeshBuilder.CreateBox('vehicle', {
                width: 2,
                height: 1,
                depth: 1
            }, scene);
            
            // Random starting position on road
            const startX = (Math.random() - 0.5) * citySize * BLOCK_SIZE / 10;
            const startZ = (Math.random() - 0.5) * citySize * BLOCK_SIZE / 10;
            
            vehicle.position.x = startX;
            vehicle.position.y = 0.5;
            vehicle.position.z = startZ;
            
            // Vehicle material
            const vehicleMat = new BABYLON.StandardMaterial('vehicleMat', scene);
            const colors = [
                [1, 0, 0],    // Red
                [0, 0, 1],    // Blue
                [1, 1, 0],    // Yellow
                [0, 1, 0],    // Green
                [1, 0.5, 0]   // Orange
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            vehicleMat.diffuseColor = new BABYLON.Color3(...randomColor);
            vehicleMat.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
            vehicle.material = vehicleMat;
            
            // Add wheels
            for (let i = 0; i < 4; i++) {
                const wheel = BABYLON.MeshBuilder.CreateCylinder('wheel', {
                    diameter: 0.5,
                    height: 0.2
                }, scene);
                
                wheel.rotation.z = Math.PI / 2;
                wheel.position.x = (i < 2 ? -0.7 : 0.7);
                wheel.position.y = -0.3;
                wheel.position.z = (i % 2 === 0 ? -0.5 : 0.5);
                wheel.parent = vehicle;
                
                const wheelMat = new BABYLON.StandardMaterial('wheelMat', scene);
                wheelMat.diffuseColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                wheel.material = wheelMat;
            }
            
            vehicles.push({
                mesh: vehicle,
                speed: 0.1 + Math.random() * 0.2,
                direction: Math.random() * Math.PI * 2,
                targetX: 0,
                targetZ: 0
            });
        }

        // Create pedestrian
        function createPedestrian() {
            const pedestrian = BABYLON.MeshBuilder.CreateCylinder('pedestrian', {
                diameter: 0.5,
                height: 1.8
            }, scene);
            
            const startX = (Math.random() - 0.5) * citySize * BLOCK_SIZE / 10;
            const startZ = (Math.random() - 0.5) * citySize * BLOCK_SIZE / 10;
            
            pedestrian.position.x = startX;
            pedestrian.position.y = 0.9;
            pedestrian.position.z = startZ;
            
            const pedMat = new BABYLON.StandardMaterial('pedMat', scene);
            pedMat.diffuseColor = new BABYLON.Color3(
                0.5 + Math.random() * 0.5,
                0.3 + Math.random() * 0.5,
                0.2 + Math.random() * 0.5
            );
            pedestrian.material = pedMat;
            
            pedestrians.push({
                mesh: pedestrian,
                speed: 0.02 + Math.random() * 0.03,
                direction: Math.random() * Math.PI * 2,
                targetX: 0,
                targetZ: 0
            });
        }

        // Create tree
        function createTree(x, z) {
            const tree = new BABYLON.Mesh('tree', scene);
            
            // Trunk
            const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', {
                diameter: 0.5,
                height: 2
            }, scene);
            trunk.position.y = 1;
            trunk.parent = tree;
            
            const trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
            trunkMat.diffuseColor = new BABYLON.Color3(0.4, 0.3, 0.2);
            trunk.material = trunkMat;
            
            // Leaves
            const leaves = BABYLON.MeshBuilder.CreateSphere('leaves', {
                diameter: 3,
                segments: 8
            }, scene);
            leaves.position.y = 3;
            leaves.parent = tree;
            
            const leavesMat = new BABYLON.StandardMaterial('leavesMat', scene);
            leavesMat.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
            leaves.material = leavesMat;
            
            tree.position.x = x;
            tree.position.z = z;
            
            trees.push(tree);
        }

        // Update simulation
        function updateSimulation() {
            cityTime += 0.016 * (developmentSpeed / 100); // ~60fps
            
            // Update day/time
            const hours = Math.floor((cityTime / 10) % 24);
            const minutes = Math.floor(((cityTime / 10) % 1) * 60);
            dayCount = Math.floor(cityTime / 240);
            
            const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            const period = hours >= 12 ? 'PM' : 'AM';
            document.getElementById('timeDisplay').textContent = 
                `Day ${dayCount + 1} | ${timeString} ${period}`;
            
            // Develop city
            if (Math.random() < 0.01 * (developmentSpeed / 100)) {
                developCity();
            }
            
            // Spawn vehicles
            if (vehicles.length < trafficIntensity / 5 && Math.random() < 0.02) {
                createVehicle();
            }
            
            // Spawn pedestrians
            if (pedestrians.length < populationDensity / 10 && Math.random() < 0.02) {
                createPedestrian();
            }
            
            // Move vehicles
            vehicles.forEach(vehicle => {
                // Simple movement with boundary checking
                vehicle.mesh.position.x += Math.sin(vehicle.direction) * vehicle.speed;
                vehicle.mesh.position.z += Math.cos(vehicle.direction) * vehicle.speed;
                vehicle.mesh.rotation.y = -vehicle.direction;
                
                // Boundary bounce
                const boundary = citySize * BLOCK_SIZE / 20;
                if (Math.abs(vehicle.mesh.position.x) > boundary) {
                    vehicle.direction = Math.PI - vehicle.direction;
                }
                if (Math.abs(vehicle.mesh.position.z) > boundary) {
                    vehicle.direction = -vehicle.direction;
                }
                
                // Random direction change
                if (Math.random() < 0.01) {
                    vehicle.direction += (Math.random() - 0.5) * Math.PI / 2;
                }
            });
            
            // Move pedestrians
            pedestrians.forEach(pedestrian => {
                pedestrian.mesh.position.x += Math.sin(pedestrian.direction) * pedestrian.speed;
                pedestrian.mesh.position.z += Math.cos(pedestrian.direction) * pedestrian.speed;
                
                // Boundary bounce
                const boundary = citySize * BLOCK_SIZE / 20;
                if (Math.abs(pedestrian.mesh.position.x) > boundary) {
                    pedestrian.direction = Math.PI - pedestrian.direction;
                }
                if (Math.abs(pedestrian.mesh.position.z) > boundary) {
                    pedestrian.direction = -pedestrian.direction;
                }
                
                // Random direction change
                if (Math.random() < 0.02) {
                    pedestrian.direction += (Math.random() - 0.5) * Math.PI;
                }
                
                // Bob animation
                pedestrian.mesh.position.y = 0.9 + Math.sin(cityTime * 5) * 0.05;
            });
            
            // Update statistics
            updateStats();
            
            // Day/night cycle
            updateDayNightCycle(hours);
        }

        // Develop city
        function developCity() {
            const gridSize = Math.floor(citySize / 10);
            
            // Find undeveloped spot
            let attempts = 0;
            while (attempts < 10) {
                const x = Math.floor(Math.random() * gridSize);
                const z = Math.floor(Math.random() * gridSize);
                
                if (!cityGrid[x][z].developed && Math.abs(x % 3) > 0 && Math.abs(z % 3) > 0) {
                    cityGrid[x][z].developed = true;
                    
                    // Decide what to build
                    if (Math.random() < 0.8) {
                        cityGrid[x][z].building = createBuilding(x, z);
                        cityGrid[x][z].type = 'building';
                    } else {
                        // Create park/tree
                        createTree(
                            x * BLOCK_SIZE - citySize * BLOCK_SIZE / 20,
                            z * BLOCK_SIZE - citySize * BLOCK_SIZE / 20
                        );
                        cityGrid[x][z].type = 'park';
                    }
                    break;
                }
                attempts++;
            }
        }

        // Update day/night cycle
        function updateDayNightCycle(hours) {
            // Adjust lighting based on time
            const sunIntensity = Math.sin((hours / 24) * Math.PI);
            const lights = scene.lights;
            
            if (lights.length > 0) {
                lights[0].intensity = 0.3 + sunIntensity * 0.5;
                
                // Sky color
                const skyColor = BABYLON.Color3.Lerp(
                    new BABYLON.Color3(0.1, 0.1, 0.3), // Night
                    new BABYLON.Color3(0.53, 0.81, 0.92), // Day
                    sunIntensity
                );
                scene.clearColor = skyColor;
                scene.fogColor = skyColor;
            }
            
            // Turn on/off building lights
            buildings.forEach(building => {
                const windows = building.mesh.getChildren();
                windows.forEach(window => {
                    if (window.material && window.material.emissiveColor) {
                        const shouldLight = hours < 6 || hours > 18;
                        window.material.emissiveColor = shouldLight ?
                            new BABYLON.Color3(1, 0.9, 0.5) :
                            new BABYLON.Color3(0.1, 0.1, 0.2);
                    }
                });
            });
        }

        // Update statistics
        function updateStats() {
            document.getElementById('buildingCount').textContent = buildings.length;
            document.getElementById('vehicleCount').textContent = vehicles.length;
            document.getElementById('roadCount').textContent = roads.length;
            document.getElementById('cityAge').textContent = `${dayCount} days`;
            
            // Calculate population
            let totalPopulation = 0;
            buildings.forEach(building => {
                totalPopulation += building.population;
            });
            document.getElementById('population').textContent = totalPopulation.toLocaleString();
        }

        // Setup controls
        function setupControls() {
            // City size
            document.getElementById('citySize').addEventListener('input', (e) => {
                citySize = parseInt(e.target.value);
                document.getElementById('sizeValue').textContent = citySize;
                resetCity();
            });
            
            // Population density
            document.getElementById('populationDensity').addEventListener('input', (e) => {
                populationDensity = parseInt(e.target.value);
                document.getElementById('densityValue').textContent = populationDensity + '%';
            });
            
            // Traffic intensity
            document.getElementById('trafficIntensity').addEventListener('input', (e) => {
                trafficIntensity = parseInt(e.target.value);
                document.getElementById('trafficValue').textContent = trafficIntensity + '%';
                
                // Adjust vehicle count
                while (vehicles.length > trafficIntensity / 5 && vehicles.length > 0) {
                    const vehicle = vehicles.pop();
                    vehicle.mesh.dispose();
                }
            });
            
            // Development speed
            document.getElementById('developmentSpeed').addEventListener('input', (e) => {
                developmentSpeed = parseInt(e.target.value);
                const speedText = developmentSpeed === 0 ? 'Paused' : 
                    `${(developmentSpeed / 100).toFixed(1)}x`;
                document.getElementById('speedValue').textContent = speedText;
            });
        }

        // Toggle simulation
        function toggleSimulation() {
            isPaused = !isPaused;
        }

        // Reset city
        function resetCity() {
            // Clear existing city
            buildings.forEach(b => b.mesh.dispose());
            vehicles.forEach(v => v.mesh.dispose());
            pedestrians.forEach(p => p.mesh.dispose());
            roads.forEach(r => r.dispose());
            trees.forEach(t => t.dispose());
            
            buildings = [];
            vehicles = [];
            pedestrians = [];
            roads = [];
            trees = [];
            cityTime = 0;
            dayCount = 0;
            
            // Reinitialize
            initializeCity();
            updateStats();
        }

        // Start the application
        window.addEventListener('DOMContentLoaded', () => {
            initBabylon();
        });
    </script>
</body>
</html>
