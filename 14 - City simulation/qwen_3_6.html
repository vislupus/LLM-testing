<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D City Growth Simulator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #0a0c14; font-family: 'Segoe UI', system-ui, sans-serif; }
    #renderCanvas { width: 100vw; height: 100vh; outline: none; display: block; }
    
    #ui-panel {
      position: absolute; top: 15px; left: 15px;
      background: rgba(15, 20, 35, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 150, 255, 0.2);
      border-radius: 12px; padding: 18px; width: 300px;
      color: #e0e8ff; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    #ui-panel h2 { font-size: 1.3rem; margin-bottom: 12px; color: #6ec6ff; letter-spacing: 1px; }
    .control { margin-bottom: 14px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
    input[type="range"] { width: 100%; height: 6px; -webkit-appearance: none; appearance: none; background: #2a3550; border-radius: 4px; outline: none; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #6ec6ff; border-radius: 50%; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: #6ec6ff; border-radius: 50%; cursor: pointer; border: none; }
    
    .stats { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px; font-size: 0.85rem; line-height: 1.6; }
    .stats div { display: flex; justify-content: space-between; }
    .stats span { color: #88aaff; font-weight: bold; }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #0a0c14; display: flex; align-items: center; justify-content: center;
      color: #6ec6ff; font-size: 1.2rem; z-index: 100; transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
  <!-- Babylon.js CDN -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  
  <div id="ui-panel">
    <h2>🏙️ City Growth Simulator</h2>
    <div class="control">
      <label><span>📐 Population Density</span><span id="val-density">50%</span></label>
      <input type="range" id="slider-density" min="10" max="100" value="50">
    </div>
    <div class="control">
      <label><span>🚗 Traffic Intensity</span><span id="val-traffic">50%</span></label>
      <input type="range" id="slider-traffic" min="0" max="100" value="50">
    </div>
    <div class="control">
      <label><span>⚡ Development Speed</span><span id="val-speed">50%</span></label>
      <input type="range" id="slider-speed" min="10" max="100" value="50">
    </div>
    <div class="stats">
      <div>Buildings: <span id="stat-buildings">0</span></div>
      <div>Vehicles: <span id="stat-cars">0</span></div>
      <div>Citizens: <span id="stat-people">0</span></div>
      <div>Time Elapsed: <span id="stat-time">00:00</span></div>
    </div>
  </div>

  <div id="loading">🌆 Initializing City Simulation...</div>

  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);
    
    // Simulation State
    const SIM = {
      grid: [],
      buildings: [],
      cars: [],
      people: [],
      plots: [],
      density: 0.5,
      traffic: 0.5,
      devSpeed: 0.5,
      startTime: Date.now(),
      lastBuild: 0,
      lastCar: 0,
      lastPerson: 0,
      maxBuildings: 64,
      maxCars: 40,
      maxPeople: 120
    };

    const GRID_SIZE = 12;
    const CELL_SIZE = 9;
    const ROAD_WIDTH = 2.5;
    const COLORS = {
      ground: new BABYLON.Color3(0.15, 0.25, 0.12),
      road: new BABYLON.Color3(0.18, 0.18, 0.22),
      roadLine: new BABYLON.Color3(0.4, 0.4, 0.45),
      buildings: [
        new BABYLON.Color3(0.25, 0.35, 0.5),
        new BABYLON.Color3(0.4, 0.45, 0.55),
        new BABYLON.Color3(0.5, 0.4, 0.35),
        new BABYLON.Color3(0.35, 0.5, 0.6),
        new BABYLON.Color3(0.6, 0.55, 0.5)
      ]
    };

    const createScene = function() {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.08, 0.1, 0.15, 1);
      scene.ambientColor = new BABYLON.Color3(0.2, 0.25, 0.3);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.004;
      scene.fogColor = new BABYLON.Color3(0.08, 0.1, 0.15);

      // Camera
      const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3.5, 85, new BABYLON.Vector3(0, 5, 0), scene);
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 30;
      camera.upperRadiusLimit = 140;
      camera.lowerBetaLimit = 0.15;
      camera.upperBetaLimit = Math.PI / 2.05;
      camera.wheelPrecision = 20;
      camera.panningSensibility = 250;

      // Lighting
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemi.intensity = 0.6;
      hemi.groundColor = new BABYLON.Color3(0.1, 0.15, 0.1);
      
      const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1, -2, -1.2), scene);
      sun.position = new BABYLON.Vector3(30, 60, 25);
      sun.intensity = 0.75;
      sun.diffuse = new BABYLON.Color3(1, 0.95, 0.8);

      const fill = new BABYLON.PointLight("fill", new BABYLON.Vector3(-25, 15, 25), scene);
      fill.intensity = 0.2;
      fill.diffuse = new BABYLON.Color3(0.6, 0.8, 1.0);

      // Ground Base
      const groundSize = (GRID_SIZE * CELL_SIZE) + 10;
      const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: groundSize, height: groundSize, subdivisions: 4}, scene);
      ground.position.y = -0.1;
      const gMat = new BABYLON.StandardMaterial("gMat", scene);
      gMat.diffuseColor = COLORS.ground;
      ground.material = gMat;

      // City Grid & Roads
      initGrid();
      
      return scene;
    };

    function initGrid() {
      const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
      roadMat.diffuseColor = COLORS.road;
      roadMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      
      const lineMat = new BABYLON.StandardMaterial("lineMat", scene);
      lineMat.diffuseColor = COLORS.roadLine;
      lineMat.emissiveColor = new BABYLON.Color3(0.1, 0.1, 0.1);

      const offset = (GRID_SIZE * CELL_SIZE) / 2;

      // Create roads and identify plots
      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = (i * CELL_SIZE) - offset;
        const isRoad = i % 3 === 0;

        // Horizontal road
        if (isRoad) {
          const hRoad = BABYLON.MeshBuilder.CreateGround("hRoad_" + i, {width: groundSize, height: ROAD_WIDTH}, scene);
          hRoad.position.z = pos;
          hRoad.material = roadMat;
          
          // Dashed lines
          for(let d = -5; d <= 5; d++) {
            if(d === 0) continue;
            const dash = BABYLON.MeshBuilder.CreatePlane("dash_h_" + i + "_" + d, {width: 2.5, height: 0.2}, scene);
            dash.position.set(d * CELL_SIZE * 1.2, 0.02, pos);
            dash.rotation.x = Math.PI / 2;
            dash.material = lineMat;
          }
        }

        // Vertical road
        if (isRoad) {
          const vRoad = BABYLON.MeshBuilder.CreateGround("vRoad_" + i, {width: ROAD_WIDTH, height: groundSize}, scene);
          vRoad.position.x = pos;
          vRoad.material = roadMat;
          
          for(let d = -5; d <= 5; d++) {
            if(d === 0) continue;
            const dash = BABYLON.MeshBuilder.CreatePlane("dash_v_" + i + "_" + d, {width: 0.2, height: 2.5}, scene);
            dash.position.set(pos, 0.02, d * CELL_SIZE * 1.2);
            dash.material = lineMat;
          }
        }

        // Plot tracking
        if (!isRoad) {
          for (let j = 0; j < GRID_SIZE; j++) {
            if (j % 3 === 0) continue; // Skip if crossing road
            const x = (i * CELL_SIZE) - offset + (CELL_SIZE/2);
            const z = (j * CELL_SIZE) - offset + (CELL_SIZE/2);
            SIM.plots.push({x, z, occupied: false, building: null});
          }
        }
      }
      SIM.maxBuildings = SIM.plots.length;
    }

    // ===== BUILDINGS =====
    function spawnBuilding() {
      const available = SIM.plots.filter(p => !p.occupied);
      if (available.length === 0) return;

      // Density affects spawn chance
      if (Math.random() > SIM.density * 1.5) return;

      const plot = available[Math.floor(Math.random() * available.length)];
      plot.occupied = true;

      const height = 3 + Math.random() * 14 + (SIM.density * 8);
      const w = 4.5 + Math.random() * 2;
      const d = 4.5 + Math.random() * 2;
      const color = COLORS.buildings[Math.floor(Math.random() * COLORS.buildings.length)];

      const b = BABYLON.MeshBuilder.CreateBox("b_" + SIM.buildings.length, {width: w, height: 1, depth: d}, scene);
      b.position.set(plot.x, 0, plot.z);
      b.metadata = { targetHeight: height, currentHeight: 0, growing: true };

      const mat = new BABYLON.StandardMaterial("bMat_" + SIM.buildings.length, scene);
      mat.diffuseColor = color;
      mat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
      mat.ambientColor = new BABYLON.Color3(0.2, 0.2, 0.2);
      b.material = mat;

      // Add simple windows using emissive planes
      const winCount = Math.floor(height / 3);
      for(let i=0; i<winCount; i++) {
        const winY = (i * 3) + 1.5;
        for(let side=0; side<4; side++) {
          if(Math.random() > 0.7) continue;
          const win = BABYLON.MeshBuilder.CreatePlane("win", {width: 0.6, height: 0.8}, scene);
          win.position.y = winY;
          const wMat = new BABYLON.StandardMaterial("wMat", scene);
          wMat.diffuseColor = new BABYLON.Color3(0.8, 0.9, 1.0);
          wMat.emissiveColor = new BABYLON.Color3(0.6, 0.8, 1.0);
          wMat.alpha = 0.9;
          win.material = wMat;
          
          if(side === 0) win.position.z = d/2 + 0.01;
          else if(side === 1) { win.position.z = -d/2 - 0.01; win.rotation.y = Math.PI; }
          else if(side === 2) { win.position.x = w/2 + 0.01; win.rotation.y = Math.PI/2; }
          else { win.position.x = -w/2 - 0.01; win.rotation.y = -Math.PI/2; }
          
          win.parent = b;
        }
      }

      SIM.buildings.push(b);
      plot.building = b;
    }

    // ===== TRAFFIC =====
    function spawnCar() {
      if (SIM.cars.length >= SIM.maxCars * SIM.traffic) return;
      if (Math.random() > SIM.traffic * 0.8) return;

      // Pick random road coordinate
      const roadCoords = [];
      for(let i=0; i<=GRID_SIZE; i++) {
        if(i%3===0) roadCoords.push((i * CELL_SIZE) - (GRID_SIZE * CELL_SIZE / 2));
      }
      
      const startX = roadCoords[Math.floor(Math.random() * roadCoords.length)];
      const startZ = roadCoords[Math.floor(Math.random() * roadCoords.length)];
      const isXAxis = Math.random() > 0.5;

      const car = BABYLON.MeshBuilder.CreateBox("car_" + SIM.cars.length, {width: 1.2, height: 0.6, depth: 2.5}, scene);
      const colors = [new BABYLON.Color3(0.8,0.2,0.2), new BABYLON.Color3(0.9,0.9,0.9), new BABYLON.Color3(0.1,0.2,0.8), new BABYLON.Color3(0.1,0.6,0.2), new BABYLON.Color3(0.9,0.7,0.1)];
      const cMat = new BABYLON.StandardMaterial("cMat", scene);
      cMat.diffuseColor = colors[Math.floor(Math.random() * colors.length)];
      cMat.specularColor = new BABYLON.Color3(0.4,0.4,0.4);
      car.material = cMat;
      
      car.position.set(isXAxis ? startX - 30 : startX, 0.5, isXAxis ? startZ : startZ - 30);
      car.metadata = { dir: isXAxis ? 1 : 0, speed: 8 + Math.random() * 6, active: true };
      
      if(!isXAxis) car.rotation.y = Math.PI/2;
      SIM.cars.push(car);
    }

    // ===== CITIZENS =====
    function spawnPerson() {
      if (SIM.people.length >= SIM.maxPeople * SIM.density) return;
      if (SIM.buildings.length === 0 || Math.random() > SIM.density * 0.6) return;

      // Spawn near random building
      const b = SIM.buildings[Math.floor(Math.random() * SIM.buildings.length)];
      if(!b) return;

      const p = BABYLON.MeshBuilder.CreateCylinder("p_" + SIM.people.length, {height: 1.4, diameterTop: 0.4, diameterBottom: 0.5, tessellation: 8}, scene);
      const colors = [new BABYLON.Color3(0.9,0.3,0.3), new BABYLON.Color3(0.2,0.7,0.8), new BABYLON.Color3(0.8,0.6,0.1), new BABYLON.Color3(0.9,0.9,0.9)];
      const pMat = new BABYLON.StandardMaterial("pMat", scene);
      pMat.diffuseColor = colors[Math.floor(Math.random() * colors.length)];
      p.material = pMat;

      const angle = Math.random() * Math.PI * 2;
      const dist = 4 + Math.random() * 4;
      p.position.set(b.position.x + Math.cos(angle)*dist, 0.7, b.position.z + Math.sin(angle)*dist);
      p.metadata = { targetX: p.position.x, targetZ: p.position.z, wait: Math.random() * 2, speed: 1 + Math.random() * 1.5 };
      SIM.people.push(p);
    }

    // ===== MAIN LOOP =====
    function updateSimulation() {
      const now = Date.now();
      const dt = engine.getDeltaTime() / 1000;
      const time = (now - SIM.startTime) / 1000;

      // Update Stats UI
      document.getElementById("stat-buildings").textContent = SIM.buildings.length;
      document.getElementById("stat-cars").textContent = SIM.cars.length;
      document.getElementById("stat-people").textContent = SIM.people.length;
      document.getElementById("stat-time").textContent = 
        `${String(Math.floor(time/60)).padStart(2,'0')}:${String(Math.floor(time%60)).padStart(2,'0')}`;

      // 1. Building Growth
      SIM.buildings.forEach(b => {
        if (b.metadata.growing) {
          const growRate = SIM.devSpeed * 4;
          b.metadata.currentHeight += growRate * dt;
          if (b.metadata.currentHeight >= b.metadata.targetHeight) {
            b.metadata.currentHeight = b.metadata.targetHeight;
            b.metadata.growing = false;
          }
          b.scaling.y = b.metadata.currentHeight / b.metadata.targetHeight;
          b.position.y = b.metadata.currentHeight / 2;
        }
      });

      // Spawn new buildings
      if (now - SIM.lastBuild > (1200 / SIM.devSpeed)) {
        spawnBuilding();
        SIM.lastBuild = now;
      }

      // 2. Traffic Movement & Spawning
      SIM.cars = SIM.cars.filter(c => {
        if (!c.metadata.active) return false;
        
        const move = c.metadata.speed * SIM.devSpeed * dt;
        if (c.metadata.dir === 1) { // X axis
          c.position.x += move;
          if (c.position.x > 60) c.metadata.active = false;
        } else { // Z axis
          c.position.z += move;
          if (c.position.z > 60) c.metadata.active = false;
        }
        return c.metadata.active;
      });

      if (now - SIM.lastCar > (800 / SIM.traffic)) {
        spawnCar();
        SIM.lastCar = now;
      }

      // 3. Citizen Movement
      SIM.people.forEach(p => {
        if (p.metadata.wait > 0) {
          p.metadata.wait -= dt;
          return;
        }

        const dx = p.metadata.targetX - p.position.x;
        const dz = p.metadata.targetZ - p.position.y; // Note: position.y is 0.7, use x/z for movement
        const dist = Math.sqrt((p.metadata.targetX - p.position.x)**2 + (p.metadata.targetZ - p.position.z)**2);
        
        if (dist < 0.3) {
          // Pick new target near current position
          const angle = Math.random() * Math.PI * 2;
          const d = 2 + Math.random() * 5;
          p.metadata.targetX = p.position.x + Math.cos(angle) * d;
          p.metadata.targetZ = p.position.z + Math.sin(angle) * d;
          p.metadata.wait = 0.5 + Math.random() * 2;
          p.rotation.y = angle;
        } else {
          const move = p.metadata.speed * dt;
          p.position.x += (dx / dist) * move;
          p.position.z += (dz / dist) * move;
        }
      });

      if (now - SIM.lastPerson > (1500 / SIM.density)) {
        spawnPerson();
        SIM.lastPerson = now;
      }
    }

    // Initialize and Run
    const scene = createScene();
    engine.runRenderLoop(() => {
      updateSimulation();
      scene.render();
    });

    window.addEventListener("resize", () => engine.resize());
    document.getElementById("loading").classList.add("hidden");

    // UI Bindings
    document.getElementById("slider-density").addEventListener("input", (e) => {
      SIM.density = e.target.value / 100;
      document.getElementById("val-density").textContent = e.target.value + "%";
    });
    document.getElementById("slider-traffic").addEventListener("input", (e) => {
      SIM.traffic = e.target.value / 100;
      document.getElementById("val-traffic").textContent = e.target.value + "%";
    });
    document.getElementById("slider-speed").addEventListener("input", (e) => {
      SIM.devSpeed = e.target.value / 100;
      document.getElementById("val-speed").textContent = e.target.value + "%";
    });
  </script>
</body>
</html>
