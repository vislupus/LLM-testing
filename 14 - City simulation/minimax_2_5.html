<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityGenesis - 3D City Growth Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Segoe UI', 'Consolas', monospace;
        }

        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            display: block;
        }

        /* Control Panel */
        #controlPanel {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 280px;
            background: linear-gradient(145deg, rgba(20, 25, 35, 0.95), rgba(10, 15, 25, 0.98));
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .panel-title {
            color: #00d2ff;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        .control-group {
            margin-bottom: 18px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #a0a8b8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .control-value {
            color: #00d2ff;
            font-weight: bold;
            font-size: 13px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, rgba(0, 210, 255, 0.2), rgba(0, 210, 255, 0.1));
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(145deg, #00d2ff, #0099cc);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(145deg, #00d2ff, #0099cc);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(145deg, rgba(255, 70, 70, 0.2), rgba(200, 50, 50, 0.3));
            border: 1px solid rgba(255, 70, 70, 0.4);
            border-radius: 8px;
            color: #ff6b6b;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: linear-gradient(145deg, rgba(255, 70, 70, 0.4), rgba(200, 50, 50, 0.5));
            box-shadow: 0 0 20px rgba(255, 70, 70, 0.3);
        }

        /* Stats Panel */
        #statsPanel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(145deg, rgba(20, 25, 35, 0.9), rgba(10, 15, 25, 0.95));
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 10px;
            padding: 15px 20px;
            z-index: 100;
            min-width: 180px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .stat-label {
            color: #6a7280;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: #00ff88;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Consolas', monospace;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .stat-value.buildings { color: #ffd93d; text-shadow: 0 0 8px rgba(255, 217, 61, 0.4); }
        .stat-value.roads { color: #6c5ce7; text-shadow: 0 0 8px rgba(108, 92, 231, 0.4); }
        .stat-value.vehicles { color: #ff7675; text-shadow: 0 0 8px rgba(255, 118, 117, 0.4); }
        .stat-value.fps { color: #00d2ff; text-shadow: 0 0 8px rgba(0, 210, 255, 0.4); }

        /* Loading */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: #00d2ff;
            font-size: 24px;
            letter-spacing: 4px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(0, 210, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00d2ff, #00ff88);
            animation: load 2s ease-in-out infinite;
        }

        @keyframes load {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 0%; margin-left: 100%; }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loading-text">CITYGENESIS</div>
        <div class="loading-bar"><div class="loading-progress"></div></div>
    </div>

    <canvas id="renderCanvas"></canvas>

    <!-- Control Panel -->
    <div id="controlPanel">
        <div class="panel-title">City Controls</div>

        <div class="control-group">
            <div class="control-label">
                <span>City Size</span>
                <span class="control-value" id="sizeValue">50</span>
            </div>
            <input type="range" id="sizeSlider" min="10" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Development Speed</span>
                <span class="control-value" id="speedValue">5</span>
            </div>
            <input type="range" id="speedSlider" min="0" max="10" value="5">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Traffic Intensity</span>
                <span class="control-value" id="trafficValue">150</span>
            </div>
            <input type="range" id="trafficSlider" min="0" max="300" value="150">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Building Density</span>
                <span class="control-value" id="densityValue">70</span>
            </div>
            <input type="range" id="densitySlider" min="20" max="100" value="70">
        </div>

        <button class="btn" id="resetBtn">Reset City</button>
    </div>

    <!-- Stats Panel -->
    <div id="statsPanel">
        <div class="stat-row">
            <span class="stat-label">FPS</span>
            <span class="stat-value fps" id="fpsValue">60</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Buildings</span>
            <span class="stat-value buildings" id="buildingCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Roads</span>
            <span class="stat-value roads" id="roadCount">0</span>
        </div>
        <div class="stat-row">
            <span class="stat-label">Vehicles</span>
            <span class="stat-value vehicles" id="vehicleCount">0</span>
        </div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script>
        // ============================================
        // CITYGENESIS - 3D City Growth Simulation
        // ============================================

        const canvas = document.getElementById('renderCanvas');
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        // Configuration
        const CELL_SIZE = 2;
        const GRID_SIZE = 50;
        const BUILDING_TYPES = {
            RESIDENTIAL: 'residential',
            COMMERCIAL: 'commercial',
            INDUSTRIAL: 'industrial',
            ROAD: 'road'
        };

        // Color palettes
        const COLORS = {
            ground: new BABYLON.Color3(0.12, 0.14, 0.18),
            road: new BABYLON.Color3(0.25, 0.27, 0.3),
            roadLine: new BABYLON.Color3(0.9, 0.9, 0.85),
            residential: [
                new BABYLON.Color3(0.55, 0.75, 0.85),
                new BABYLON.Color3(0.65, 0.8, 0.7),
                new BABYLON.Color3(0.85, 0.75, 0.65),
                new BABYLON.Color3(0.7, 0.65, 0.8)
            ],
            commercial: [
                new BABYLON.Color3(0.45, 0.5, 0.6),
                new BABYLON.Color3(0.35, 0.45, 0.55),
                new BABYLON.Color3(0.5, 0.55, 0.6)
            ],
            industrial: [
                new BABYLON.Color3(0.6, 0.55, 0.4),
                new BABYLON.Color3(0.5, 0.45, 0.35)
            ],
            vehicles: [
                new BABYLON.Color3(0.9, 0.3, 0.3),
                new BABYLON.Color3(0.3, 0.7, 0.9),
                new BABYLON.Color3(0.9, 0.8, 0.3),
                new BABYLON.Color3(0.4, 0.9, 0.5),
                new BABYLON.Color3(0.9, 0.5, 0.7)
            ],
            people: new BABYLON.Color3(0.85, 0.7, 0.6)
        };

        // Simulation State
        let cityState = {
            grid: [],
            buildings: [],
            roads: [],
            vehicles: [],
            pedestrians: [],
            frameCount: 0,
            lastGrowthTime: 0
        };

        // UI Controls
        let controls = {
            citySize: 50,
            developmentSpeed: 5,
            trafficIntensity: 150,
            buildingDensity: 70
        };

        // ============================================
        // SCENE SETUP
        // ============================================

        function createScene() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.04, 0.05, 0.08, 1);

            // Camera
            const camera = new BABYLON.ArcRotateCamera(
                'camera',
                -Math.PI / 4,
                Math.PI / 3.5,
                80,
                new BABYLON.Vector3(0, 0, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 30;
            camera.upperRadiusLimit = 150;
            camera.lowerBetaLimit = 0.3;
            camera.upperBetaLimit = Math.PI / 2.3;
            camera.wheelPrecision = 20;
            camera.panningSensibility = 50;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight(
                'hemiLight',
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemiLight.intensity = 0.5;
            hemiLight.diffuse = new BABYLON.Color3(0.9, 0.95, 1);
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.25);

            const sunLight = new BABYLON.DirectionalLight(
                'sunLight',
                new BABYLON.Vector3(-1, -2, -1),
                scene
            );
            sunLight.position = new BABYLON.Vector3(50, 80, 50);
            sunLight.intensity = 1.0;
            sunLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 16;
            shadowGenerator.darkness = 0.4;

            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround('ground', {
                width: GRID_SIZE * CELL_SIZE * 2,
                height: GRID_SIZE * CELL_SIZE * 2
            }, scene);
            const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
            groundMat.diffuseColor = COLORS.ground;
            groundMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            ground.material = groundMat;
            ground.receiveShadows = true;

            // Initialize grid
            initializeGrid();

            // Create initial city center
            createCityCenter();

            return scene;
        }

        // ============================================
        // GRID & CITY LOGIC
        // ============================================

        function initializeGrid() {
            const size = GRID_SIZE * 2 + 1;
            cityState.grid = [];
            for (let x = 0; x < size; x++) {
                cityState.grid[x] = [];
                for (let z = 0; z < size; z++) {
                    cityState.grid[x][z] = null;
                }
            }
        }

        function gridToWorld(gridX, gridZ) {
            return {
                x: (gridX - GRID_SIZE) * CELL_SIZE,
                z: (gridZ - GRID_SIZE) * CELL_SIZE
            };
        }

        function worldToGrid(worldX, worldZ) {
            return {
                x: Math.round(worldX / CELL_SIZE + GRID_SIZE),
                z: Math.round(worldZ / CELL_SIZE + GRID_SIZE)
            };
        }

        function isValidCell(gridX, gridZ) {
            const size = GRID_SIZE * 2 + 1;
            return gridX >= 0 && gridX < size && gridZ >= 0 && gridZ < size;
        }

        function createCityCenter() {
            const cx = GRID_SIZE;
            const cz = GRID_SIZE;

            // Create central road cross
            for (let i = -2; i <= 2; i++) {
                createRoad(cx + i, cz);
                createRoad(cx, cz + i);
            }

            // Create initial buildings around center
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const dist = 3;
                const bx = Math.round(cx + Math.cos(angle) * dist);
                const bz = Math.round(cz + Math.sin(angle) * dist);
                createBuilding(bx, bz, BUILDING_TYPES.COMMERCIAL);
            }
        }

        // ============================================
        // BUILDING CREATION
        // ============================================

        function createBuilding(gridX, gridZ, type) {
            if (!isValidCell(gridX, gridZ)) return;
            if (cityState.grid[gridX][gridZ] !== null) return;

            const pos = gridToWorld(gridX, gridZ);
            let height, colorSet;

            switch (type) {
                case BUILDING_TYPES.RESIDENTIAL:
                    height = 2 + Math.random() * 4;
                    colorSet = COLORS.residential;
                    break;
                case BUILDING_TYPES.COMMERCIAL:
                    height = 4 + Math.random() * 8;
                    colorSet = COLORS.commercial;
                    break;
                case BUILDING_TYPES.INDUSTRIAL:
                    height = 2 + Math.random() * 3;
                    colorSet = COLORS.industrial;
                    break;
                default:
                    height = 3;
                    colorSet = COLORS.residential;
            }

            const width = CELL_SIZE * 0.7;
            const depth = CELL_SIZE * 0.7;

            const building = BABYLON.MeshBuilder.CreateBox('building', {
                width: width,
                height: height,
                depth: depth
            }, scene);

            building.position = new BABYLON.Vector3(pos.x, height / 2, pos.z);

            // Create material
            const mat = new BABYLON.StandardMaterial('buildingMat' + gridX + '_' + gridZ, scene);
            const color = colorSet[Math.floor(Math.random() * colorSet.length)];
            mat.diffuseColor = color;
            mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
            building.material = mat;

            // Add windows using emissive texture
            const windowMat = createWindowTexture(scene, color, width, height, depth);
            if (windowMat) {
                building.material = windowMat;
            }

            // Growth animation
            building.scaling.y = 0;
            animateBuildingGrowth(building, height);

            // Shadows
            shadowGenerator.addShadowCaster(building);
            building.receiveShadows = true;

            // Store in grid
            cityState.grid[gridX][gridZ] = {
                type: type,
                mesh: building,
                height: height
            };
            cityState.buildings.push({ gridX, gridZ, type, mesh: building });
        }

        function createWindowTexture(scene, baseColor, width, height, depth) {
            const textureSize = 128;
            const dynamicTexture = new BABYLON.DynamicTexture('windowTex', textureSize, scene);
            const ctx = dynamicTexture.getContext();

            // Base color
            ctx.fillStyle = `rgb(${baseColor.r * 255}, ${baseColor.g * 255}, ${baseColor.b * 255})`;
            ctx.fillRect(0, 0, textureSize, textureSize);

            // Windows
            const windowSize = 12;
            const spacing = 20;
            const litColor = `rgba(255, 250, 200, ${0.3 + Math.random() * 0.5})`;
            const darkColor = `rgba(30, 40, 50, 0.8)`;

            for (let y = spacing / 2; y < textureSize; y += spacing) {
                for (let x = spacing / 2; x < textureSize; x += spacing) {
                    ctx.fillStyle = Math.random() > 0.4 ? litColor : darkColor;
                    ctx.fillRect(x - windowSize / 2, y - windowSize / 2, windowSize, windowSize);
                }
            }

            dynamicTexture.update();

            const mat = new BABYLON.StandardMaterial('windowMat', scene);
            mat.diffuseTexture = dynamicTexture;
            mat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            mat.emissiveColor = baseColor.scale(0.2);

            return mat;
        }

        function animateBuildingGrowth(mesh, targetHeight) {
            const animation = new BABYLON.Animation(
                'growAnimation',
                'scaling.y',
                60,
                BABYLON.Animation.ANIMATIONTYPE_FLOAT,
                BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT
            );

            const keys = [
                { frame: 0, value: 0 },
                { frame: 30, value: 1.1 },
                { frame: 40, value: 1 }
            ];

            animation.setKeys(keys);

            const easingFunction = new BABYLON.ElasticEase();
            easingFunction.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEOUT);
            animation.setEasingFunction(easingFunction);

            mesh.animations = [animation];
            scene.beginAnimation(mesh, 0, 40, false);
        }

        // ============================================
        // ROAD CREATION
        // ============================================

        function createRoad(gridX, gridZ) {
            if (!isValidCell(gridX, gridZ)) return;
            if (cityState.grid[gridX][gridZ] !== null &&
                cityState.grid[gridX][gridZ].type === BUILDING_TYPES.ROAD) return;

            // Remove existing building if any
            if (cityState.grid[gridX][gridZ] && cityState.grid[gridX][gridZ].mesh) {
                cityState.grid[gridX][gridZ].mesh.dispose();
            }

            const pos = gridToWorld(gridX, gridZ);

            const road = BABYLON.MeshBuilder.CreateBox('road', {
                width: CELL_SIZE,
                height: 0.1,
                depth: CELL_SIZE
            }, scene);

            road.position = new BABYLON.Vector3(pos.x, 0.05, pos.z);

            const roadMat = new BABYLON.StandardMaterial('roadMat', scene);
            roadMat.diffuseColor = COLORS.road;
            roadMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            road.material = roadMat;
            road.receiveShadows = true;

            // Road markings
            createRoadMarkings(pos.x, pos.z);

            cityState.grid[gridX][gridZ] = {
                type: BUILDING_TYPES.ROAD,
                mesh: road
            };
            cityState.roads.push({ gridX, gridZ, mesh: road });
        }

        function createRoadMarkings(x, z) {
            const line = BABYLON.MeshBuilder.CreateBox('roadLine', {
                width: CELL_SIZE * 0.6,
                height: 0.02,
                depth: 0.15
            }, scene);
            line.position = new BABYLON.Vector3(x, 0.12, z);

            const lineMat = new BABYLON.StandardMaterial('lineMat', scene);
            lineMat.diffuseColor = COLORS.roadLine;
            lineMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.28);
            line.material = lineMat;
        }

        // ============================================
        // TRAFFIC & PEDESTRIAN SYSTEM
        // ============================================

        function createVehicle() {
            if (cityState.roads.length < 2) return null;

            // Find random road
            const road = cityState.roads[Math.floor(Math.random() * cityState.roads.length)];
            const pos = gridToWorld(road.gridX, road.gridZ);

            // Determine direction
            const directions = [
                { dx: 1, dz: 0 },
                { dx: -1, dz: 0 },
                { dx: 0, dz: 1 },
                { dx: 0, dz: -1 }
            ];
            const dir = directions[Math.floor(Math.random() * directions.length)];

            // Create vehicle mesh (box + smaller box on top)
            const vehicle = new BABYLON.TransformNode('vehicle', scene);

            const body = BABYLON.MeshBuilder.CreateBox('carBody', {
                width: 0.8,
                height: 0.4,
                depth: 1.4
            }, scene);
            body.parent = vehicle;
            body.position.y = 0.25;

            const top = BABYLON.MeshBuilder.CreateBox('carTop', {
                width: 0.7,
                height: 0.3,
                depth: 0.7
            }, scene);
            top.parent = vehicle;
            top.position.y = 0.55;
            top.position.z = -0.1;

            // Color
            const color = COLORS.vehicles[Math.floor(Math.random() * COLORS.vehicles.length)];
            const carMat = new BABYLON.StandardMaterial('carMat', scene);
            carMat.diffuseColor = color;
            carMat.specularColor = new BABYLON.Color3(0.4, 0.4, 0.4);
            body.material = carMat;
            top.material = carMat;

            vehicle.position = new BABYLON.Vector3(pos.x, 0, pos.z);

            // Face direction
            const angle = Math.atan2(dir.dx, dir.dz);
            vehicle.rotation.y = angle;

            const vehicleData = {
                node: vehicle,
                body: body,
                gridX: road.gridX,
                gridZ: road.gridZ,
                dirX: dir.dx,
                dirZ: dir.dz,
                speed: 0.03 + Math.random() * 0.02
            };

            cityState.vehicles.push(vehicleData);
            return vehicleData;
        }

        function createPedestrian() {
            if (cityState.roads.length < 2) return null;

            const road = cityState.roads[Math.floor(Math.random() * cityState.roads.length)];
            const pos = gridToWorld(road.gridX, road.gridZ);

            // Create pedestrian (small cylinder)
            const pedestrian = BABYLON.MeshBuilder.CreateCylinder('pedestrian', {
                height: 1.2,
                diameter: 0.3
            }, scene);

            const pedMat = new BABYLON.StandardMaterial('pedMat', scene);
            pedMat.diffuseColor = COLORS.people;
            pedestrian.material = pedMat;

            // Random offset from road center
            const offset = (Math.random() - 0.5) * 0.6;
            pedestrian.position = new BABYLON.Vector3(pos.x + offset, 0.6, pos.z + offset);

            const pedData = {
                mesh: pedestrian,
                offset: offset,
                gridX: road.gridX,
                gridZ: road.gridZ,
                speed: 0.01 + Math.random() * 0.01,
                dirX: Math.random() > 0.5 ? 1 : -1,
                dirZ: Math.random() > 0.5 ? 1 : -1
            };

            cityState.pedestrians.push(pedData);
            return pedData;
        }

        function updateVehicles() {
            const toRemove = [];

            cityState.vehicles.forEach((vehicle, index) => {
                // Move vehicle

    document.addEventListener("click", handleClick, true);
    highlightEnabled = true;
    overlay.style.display = "block";
  }

  // 禁用高亮功能
  function disableHighlight() {
    console.log("Disabling highlight");
    highlightEnabled = false;
    // 保持事件监听器，但通过 highlightEnabled 变量控制行为
    // 这样可以保留选中状态的显示
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    // 不隐藏 selectedBox 和 selectedLabel，保留选中状态
  }

  // 完全禁用高亮功能（移除所有监听器）
  function fullyDisableHighlight() {
    console.log("Fully disabling highlight");
    highlightEnabled = false;
    document.removeEventListener("mouseover", handleMouseOver, true);
    document.removeEventListener("mouseout", handleMouseOut, true);
    document.removeEventListener("click", handleClick, true);
    overlay.style.display = "none";
    highlightBox.style.display = "none";
    tagLabel.style.display = "none";
    selectedBox.style.display = "none";
    selectedLabel.style.display = "none";
  }

  // 添加事件监听
  enableHighlight();
  window.addEventListener("message", handleParentMessage);

  // 暴露全局函数供外部调用
  window.__iframeHighlightControl = {
    enable: enableHighlight,
    disable: disableHighlight,
    fullyDisable: fullyDisableHighlight,
    isEnabled: function isEnabled() {
      return highlightEnabled;
    },
    getSelectedElement: function getSelectedElement() {
      return selectedElement;
    },
    updateSelected: updateSelectedHighlight,
    // 通过消息发送开关控制
    sendToggleMessage: function sendToggleMessage(enabled) {
      window.parent.postMessage({
        type: 'iframe-highlight-status',
        enabled: enabled || highlightEnabled,
        source: 'iframe-highlight-injector'
      }, '*');
    }
  };

  // 通知父窗口脚本已加载
  try {
    window.parent.postMessage({
      type: "iframe-highlight-ready",
      data: {
        url: window.location.href,
        userAgent: navigator.userAgent,
        timestamp: Date.now()
      },
      source: "iframe-highlight-injector"
    }, "*");
  } catch (error) {
    console.warn("无法发送就绪消息到父窗口:", error);
  }

  // 清理函数
  window.__iframeHighlightCleanup = function () {
    fullyDisableHighlight();
    window.removeEventListener("message", handleParentMessage);
    if (overlay.parentElement) {
      overlay.parentElement.removeChild(overlay);
    }
    delete window.__iframeHighlightInitialized;
    delete window.__iframeHighlightCleanup;
  };
})();

</script>
</body>
</html>
