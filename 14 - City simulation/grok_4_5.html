<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growing City — Babylon.js</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap');

    :root {
      --bg: #0b1220;
      --panel: rgba(12, 20, 36, 0.88);
      --line: rgba(120, 160, 220, 0.22);
      --text: #e8eef8;
      --muted: #8fa3bf;
      --accent: #5b9dff;
      --good: #3dd68c;
      --warn: #f0c14b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .top-left {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 14px 16px;
      max-width: min(340px, calc(100vw - 32px));
    }

    .top-left h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .top-left p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }

    .brand-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8, #06b6d4 60%, #22c55e);
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 16px;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px 20px;
      max-width: 920px;
      margin: 0 auto;
    }

    @media (max-width: 720px) {
      .bottom { grid-template-columns: 1fr; }
    }

    .ctrl label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #c9d7ea;
    }

    .ctrl .val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #5b9dff;
      cursor: pointer;
    }

    .stats {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 12px 14px;
      min-width: 160px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .stat:last-child { margin-bottom: 0; }

    .stat span { color: var(--muted); }
    .stat strong {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      color: var(--text);
    }

    .actions {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: calc(100vw - 32px);
    }

    .btn {
      pointer-events: auto;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font: 600 12px 'DM Sans', sans-serif;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: 0.12s ease;
    }

    .btn:hover { border-color: rgba(120, 180, 255, 0.45); background: rgba(30, 50, 80, 0.9); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      border-color: #60a5fa;
    }

    .hint {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      background: rgba(10, 16, 28, 0.65);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 12px;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 720px) {
      .hint { display: none; }
      .stats { top: auto; bottom: auto; right: 16px; top: 90px; }
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>

  <div id="hud">
    <div class="panel top-left">
      <div class="brand-row">
        <div class="logo">🏙</div>
        <div>
          <h1>Growing City</h1>
          <p>Watch blocks fill, roads connect, and traffic swarm as the skyline evolves.</p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPause" type="button">Pause growth</button>
      <button class="btn" id="btnBoost" type="button">Growth burst</button>
      <button class="btn" id="btnReset" type="button">Rebuild</button>
    </div>

    <div class="panel stats">
      <div class="stat"><span>Buildings</span><strong id="sBuild">0</strong></div>
      <div class="stat"><span>Roads</span><strong id="sRoads">0</strong></div>
      <div class="stat"><span>Vehicles</span><strong id="sCars">0</strong></div>
      <div class="stat"><span>People</span><strong id="sPeople">0</strong></div>
      <div class="stat"><span>Population</span><strong id="sPop">0</strong></div>
      <div class="stat"><span>Year</span><strong id="sYear">2026</strong></div>
    </div>

    <div class="hint">Drag to orbit · Scroll to zoom · Right-drag to pan</div>

    <div class="panel bottom">
      <div class="ctrl">
        <label>City size / density <span class="val" id="vSize">0.55</span></label>
        <input type="range" id="sSize" min="0.15" max="1" step="0.01" value="0.55" />
      </div>
      <div class="ctrl">
        <label>Traffic intensity <span class="val" id="vTraffic">0.50</span></label>
        <input type="range" id="sTraffic" min="0" max="1" step="0.01" value="0.50" />
      </div>
      <div class="ctrl">
        <label>Development speed <span class="val" id="vSpeed">0.60</span></label>
        <input type="range" id="sSpeed" min="0.05" max="1" step="0.01" value="0.60" />
      </div>
    </div>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
    (function () {
      'use strict';

      // ── Parameters ──────────────────────────────────────────────────────
      const GRID = 18;           // city blocks along one axis
      const CELL = 8;            // world units per block
      const ROAD_W = 2.2;
      const MAX_BUILDINGS = GRID * GRID;
      const MAX_CARS = 120;
      const MAX_PEOPLE = 160;

      const params = {
        size: 0.55,      // target density / city footprint
        traffic: 0.5,
        speed: 0.6,
        growing: true
      };

      // ── DOM ─────────────────────────────────────────────────────────────
      const canvas = document.getElementById('renderCanvas');
      const $ = (id) => document.getElementById(id);

      function bindSlider(id, vid, key) {
        const el = $(id);
        const out = $(vid);
        const sync = () => {
          params[key] = parseFloat(el.value);
          out.textContent = params[key].toFixed(2);
        };
        el.addEventListener('input', sync);
        sync();
      }
      bindSlider('sSize', 'vSize', 'size');
      bindSlider('sTraffic', 'vTraffic', 'traffic');
      bindSlider('sSpeed', 'vSpeed', 'speed');

      if (typeof BABYLON === 'undefined') {
        document.body.innerHTML = '<p style="color:white;padding:2rem">Failed to load Babylon.js CDN.</p>';
        return;
      }

      // ── Engine / scene ──────────────────────────────────────────────────
      const engine = new BABYLON.Engine(canvas, true, {
        preserveDrawingBuffer: true,
        stencil: true,
        adaptToDeviceRatio: true
      });

      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.08, 0.14, 1);
      scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
      scene.fogDensity = 0.006;
      scene.fogColor = new BABYLON.Color3(0.12, 0.16, 0.24);
      scene.ambientColor = new BABYLON.Color3(0.35, 0.38, 0.45);

      // Camera
      const cityHalf = (GRID * CELL) / 2;
      const camera = new BABYLON.ArcRotateCamera(
        'cam',
        -Math.PI / 3.2,
        1.05,
        95,
        new BABYLON.Vector3(0, 0, 0),
        scene
      );
      camera.lowerBetaLimit = 0.25;
      camera.upperBetaLimit = Math.PI / 2.15;
      camera.lowerRadiusLimit = 25;
      camera.upperRadiusLimit = 220;
      camera.wheelPrecision = 8;
      camera.panningSensibility = 60;
      camera.attachControl(canvas, true);

      // Lights
      const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.2, 1, 0.3), scene);
      hemi.intensity = 0.55;
      hemi.groundColor = new BABYLON.Color3(0.15, 0.18, 0.22);

      const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.55, -1.1, 0.4), scene);
      sun.position = new BABYLON.Vector3(60, 100, -40);
      sun.intensity = 1.05;
      sun.diffuse = new BABYLON.Color3(1, 0.96, 0.9);

      const fill = new BABYLON.DirectionalLight('fill', new BABYLON.Vector3(0.6, -0.3, -0.5), scene);
      fill.intensity = 0.25;
      fill.diffuse = new BABYLON.Color3(0.5, 0.6, 0.85);

      // Soft shadows
      const shadowGen = new BABYLON.ShadowGenerator(1024, sun);
      shadowGen.useBlurExponentialShadowMap = true;
      shadowGen.blurKernel = 16;
      shadowGen.darkness = 0.35;

      // ── Materials ───────────────────────────────────────────────────────
      function mat(name, color, opts = {}) {
        const m = new BABYLON.StandardMaterial(name, scene);
        m.diffuseColor = color;
        m.specularColor = opts.specular || new BABYLON.Color3(0.08, 0.08, 0.08);
        m.emissiveColor = opts.emissive || new BABYLON.Color3(0, 0, 0);
        m.ambientColor = opts.ambient || color.scale(0.35);
        return m;
      }

      const groundMat = mat('ground', new BABYLON.Color3(0.18, 0.28, 0.18));
      groundMat.specularColor = new BABYLON.Color3(0.02, 0.02, 0.02);

      const roadMat = mat('road', new BABYLON.Color3(0.16, 0.17, 0.2));
      const roadLineMat = mat('roadLine', new BABYLON.Color3(0.85, 0.78, 0.35), {
        emissive: new BABYLON.Color3(0.15, 0.12, 0.02)
      });
      const sidewalkMat = mat('sidewalk', new BABYLON.Color3(0.42, 0.44, 0.48));
      const parkMat = mat('park', new BABYLON.Color3(0.2, 0.45, 0.22));
      const waterMat = mat('water', new BABYLON.Color3(0.15, 0.35, 0.55), {
        specular: new BABYLON.Color3(0.3, 0.35, 0.4),
        emissive: new BABYLON.Color3(0.02, 0.05, 0.08)
      });

      const buildingPalette = [
        new BABYLON.Color3(0.55, 0.58, 0.65),
        new BABYLON.Color3(0.72, 0.68, 0.6),
        new BABYLON.Color3(0.45, 0.55, 0.7),
        new BABYLON.Color3(0.65, 0.55, 0.5),
        new BABYLON.Color3(0.5, 0.5, 0.55),
        new BABYLON.Color3(0.6, 0.7, 0.75),
        new BABYLON.Color3(0.75, 0.72, 0.7)
      ];

      const windowMat = mat('window', new BABYLON.Color3(0.55, 0.75, 0.95), {
        emissive: new BABYLON.Color3(0.25, 0.4, 0.55),
        specular: new BABYLON.Color3(0.4, 0.5, 0.6)
      });

      const carColors = [
        new BABYLON.Color3(0.9, 0.25, 0.2),
        new BABYLON.Color3(0.2, 0.45, 0.9),
        new BABYLON.Color3(0.95, 0.9, 0.2),
        new BABYLON.Color3(0.15, 0.15, 0.18),
        new BABYLON.Color3(0.95, 0.95, 0.95),
        new BABYLON.Color3(0.2, 0.7, 0.4),
        new BABYLON.Color3(0.85, 0.45, 0.15)
      ];

      // ── Ground ───────────────────────────────────────────────────────────
      const groundSize = GRID * CELL + 40;
      const ground = BABYLON.MeshBuilder.CreateGround('ground', {
        width: groundSize,
        height: groundSize
      }, scene);
      ground.material = groundMat;
      ground.receiveShadows = true;
      ground.position.y = 0;

      // Outer ring / water edge for polish
      const water = BABYLON.MeshBuilder.CreateGround('water', {
        width: groundSize + 80,
        height: groundSize + 80
      }, scene);
      water.position.y = -0.15;
      water.material = waterMat;
      water.receiveShadows = true;

      // ── City data ───────────────────────────────────────────────────────
      // Grid cells: 0 empty, 1 road, 2 building plot, 3 park
      const cells = new Uint8Array(GRID * GRID);
      const buildingMeshes = []; // { mesh, targetH, age, gx, gz, pop }
      const roadMeshes = [];
      const parks = [];

      // Network of road centerlines for traffic (list of segments)
      // segments: { ax, az, bx, bz, dir } in world coords
      let roadGraph = []; // nodes and edges for pathing
      let roadNodes = []; // {x,z, edges:[{to, len}]}
      let roadSegments = []; // flat list for spawning

      // Vehicles & people pools
      const cars = [];
      const people = [];

      // Root containers
      const cityRoot = new BABYLON.TransformNode('cityRoot', scene);
      const roadRoot = new BABYLON.TransformNode('roadRoot', scene);
      roadRoot.parent = cityRoot;
      const buildRoot = new BABYLON.TransformNode('buildRoot', scene);
      buildRoot.parent = cityRoot;
      const agentRoot = new BABYLON.TransformNode('agentRoot', scene);
      agentRoot.parent = cityRoot;

      // Shared base meshes for instancing-like reuse via clones
      const carBodyProto = BABYLON.MeshBuilder.CreateBox('carProto', {
        width: 0.9, height: 0.35, depth: 1.8
      }, scene);
      carBodyProto.isVisible = false;

      const carCabinProto = BABYLON.MeshBuilder.CreateBox('cabinProto', {
        width: 0.75, height: 0.28, depth: 0.9
      }, scene);
      carCabinProto.isVisible = false;

      const personProto = BABYLON.MeshBuilder.CreateCapsule('personProto', {
        radius: 0.18,
        height: 0.85,
        tessellation: 6
      }, scene);
      personProto.isVisible = false;

      // ── RNG ─────────────────────────────────────────────────────────────
      let seed = 123456789;
      function rand() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }
      function randRange(a, b) { return a + rand() * (b - a); }
      function irand(n) { return (rand() * n) | 0; }
      function choice(arr) { return arr[irand(arr.length)]; }

      function cellIndex(gx, gz) { return gz * GRID + gx; }
      function inBounds(gx, gz) { return gx >= 0 && gz >= 0 && gx < GRID && gz < GRID; }

      function cellToWorld(gx, gz) {
        return {
          x: (gx - GRID / 2 + 0.5) * CELL,
          z: (gz - GRID / 2 + 0.5) * CELL
        };
      }

      // ── Road system ─────────────────────────────────────────────────────
      function clearRoads() {
        for (const m of roadMeshes) m.dispose();
        roadMeshes.length = 0;
        roadSegments = [];
        roadNodes = [];
      }

      function rebuildRoadNetwork() {
        // Build graph from road cells
        const nodeMap = new Map(); // key "x,z" -> index
        roadNodes = [];
        roadSegments = [];

        function nodeAt(x, z) {
          const k = x.toFixed(2) + ',' + z.toFixed(2);
          if (nodeMap.has(k)) return nodeMap.get(k);
          const id = roadNodes.length;
          roadNodes.push({ x, z, edges: [] });
          nodeMap.set(k, id);
          return id;
        }

        function addSeg(ax, az, bx, bz) {
          const a = nodeAt(ax, az);
          const b = nodeAt(bx, bz);
          const len = Math.hypot(bx - ax, bz - az);
          if (len < 0.01) return;
          roadNodes[a].edges.push({ to: b, len });
          roadNodes[b].edges.push({ to: a, len });
          roadSegments.push({ ax, az, bx, bz, len });
        }

        // For each road cell, connect to orthogonal road neighbors through centers
        for (let gz = 0; gz < GRID; gz++) {
          for (let gx = 0; gx < GRID; gx++) {
            if (cells[cellIndex(gx, gz)] !== 1) continue;
            const w = cellToWorld(gx, gz);
            // right neighbor
            if (inBounds(gx + 1, gz) && cells[cellIndex(gx + 1, gz)] === 1) {
              const w2 = cellToWorld(gx + 1, gz);
              addSeg(w.x, w.z, w2.x, w2.z);
            }
            // up neighbor (+z)
            if (inBounds(gx, gz + 1) && cells[cellIndex(gx, gz + 1)] === 1) {
              const w2 = cellToWorld(gx, gz + 1);
              addSeg(w.x, w.z, w2.x, w2.z);
            }
          }
        }
      }

      function createRoadMesh(gx, gz) {
        const w = cellToWorld(gx, gz);
        // asphalt
        const road = BABYLON.MeshBuilder.CreateBox('road_' + gx + '_' + gz, {
          width: CELL * 0.92,
          height: 0.08,
          depth: CELL * 0.92
        }, scene);
        road.position.set(w.x, 0.04, w.z);
        road.material = roadMat;
        road.receiveShadows = true;
        road.parent = roadRoot;
        roadMeshes.push(road);

        // center lines (cross)
        const lineH = BABYLON.MeshBuilder.CreateBox('lh', {
          width: CELL * 0.5, height: 0.02, depth: 0.12
        }, scene);
        lineH.position.set(w.x, 0.09, w.z);
        lineH.material = roadLineMat;
        lineH.parent = roadRoot;
        roadMeshes.push(lineH);

        const lineV = BABYLON.MeshBuilder.CreateBox('lv', {
          width: 0.12, height: 0.02, depth: CELL * 0.5
        }, scene);
        lineV.position.set(w.x, 0.09, w.z);
        lineV.material = roadLineMat;
        lineV.parent = roadRoot;
        roadMeshes.push(lineV);

        // sidewalks as thin rings (4 edges)
        const sw = 0.45;
        const sides = [
          { w: CELL * 0.95, d: sw, x: 0, z: CELL * 0.42 },
          { w: CELL * 0.95, d: sw, x: 0, z: -CELL * 0.42 },
          { w: sw, d: CELL * 0.95, x: CELL * 0.42, z: 0 },
          { w: sw, d: CELL * 0.95, x: -CELL * 0.42, z: 0 }
        ];
        for (const s of sides) {
          const m = BABYLON.MeshBuilder.CreateBox('sw', {
            width: s.w, height: 0.12, depth: s.d
          }, scene);
          m.position.set(w.x + s.x, 0.06, w.z + s.z);
          m.material = sidewalkMat;
          m.receiveShadows = true;
          m.parent = roadRoot;
          roadMeshes.push(m);
        }
      }

      function createPark(gx, gz) {
        const w = cellToWorld(gx, gz);
        const park = BABYLON.MeshBuilder.CreateBox('park', {
          width: CELL * 0.85,
          height: 0.1,
          depth: CELL * 0.85
        }, scene);
        park.position.set(w.x, 0.05, w.z);
        park.material = parkMat;
        park.receiveShadows = true;
        park.parent = buildRoot;
        parks.push(park);

        // simple trees
        const treeCount = 2 + irand(3);
        for (let i = 0; i < treeCount; i++) {
          const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', {
            height: 1.2, diameter: 0.25, tessellation: 6
          }, scene);
          const canopy = BABYLON.MeshBuilder.CreateSphere('canopy', {
            diameter: 1.1 + rand() * 0.5, segments: 6
          }, scene);
          const tx = w.x + randRange(-CELL * 0.3, CELL * 0.3);
          const tz = w.z + randRange(-CELL * 0.3, CELL * 0.3);
          trunk.position.set(tx, 0.6, tz);
          canopy.position.set(tx, 1.5, tz);
          trunk.material = mat('trunk' + i + gx + gz, new BABYLON.Color3(0.4, 0.28, 0.15));
          canopy.material = mat('leaf' + i + gx + gz, new BABYLON.Color3(0.15 + rand() * 0.15, 0.5 + rand() * 0.2, 0.18));
          trunk.parent = buildRoot;
          canopy.parent = buildRoot;
          parks.push(trunk, canopy);
          shadowGen.addShadowCaster(trunk);
          shadowGen.addShadowCaster(canopy);
        }
      }

      function createBuilding(gx, gz) {
        const w = cellToWorld(gx, gz);
        const dist = Math.hypot(gx - GRID / 2, gz - GRID / 2) / (GRID * 0.5);
        // taller near center
        const maxFloors = Math.max(2, Math.round(18 * (1 - dist * 0.75) * (0.6 + params.size * 0.7)));
        const floors = 2 + irand(Math.max(1, maxFloors));
        const targetH = floors * 1.15;
        const bw = CELL * randRange(0.45, 0.72);
        const bd = CELL * randRange(0.45, 0.72);

        const color = choice(buildingPalette).clone();
        // slight variation
        color.r = Math.min(1, color.r + randRange(-0.05, 0.05));
        color.g = Math.min(1, color.g + randRange(-0.05, 0.05));
        color.b = Math.min(1, color.b + randRange(-0.05, 0.05));

        const bmat = mat('bmat_' + gx + '_' + gz, color, {
          specular: new BABYLON.Color3(0.12, 0.12, 0.14)
        });

        // start flat, grow up
        const mesh = BABYLON.MeshBuilder.CreateBox('bld_' + gx + '_' + gz, {
          width: bw,
          height: 0.2,
          depth: bd
        }, scene);
        mesh.position.set(w.x + randRange(-0.4, 0.4), 0.1, w.z + randRange(-0.4, 0.4));
        mesh.material = bmat;
        mesh.parent = buildRoot;
        mesh.receiveShadows = true;
        shadowGen.addShadowCaster(mesh);

        // window strip emissive plane on one face (simple)
        const win = BABYLON.MeshBuilder.CreatePlane('win', {
          width: bw * 0.7,
          height: 0.15
        }, scene);
        win.material = windowMat;
        win.parent = mesh;
        win.position.set(0, 0, bd / 2 + 0.02);
        // will scale with parent growth via parenting... height is fixed; update each frame optionally
        win.isVisible = false; // enable once tall enough

        // rooftop accent for tall buildings
        let roof = null;
        if (floors > 8) {
          roof = BABYLON.MeshBuilder.CreateBox('roof', {
            width: bw * 0.3,
            height: 0.15,
            depth: bd * 0.3
          }, scene);
          roof.material = mat('roof', new BABYLON.Color3(0.3, 0.32, 0.38), {
            emissive: new BABYLON.Color3(0.4, 0.15, 0.1)
          });
          roof.parent = mesh;
          roof.position.y = 0.2;
        }

        const entry = {
          mesh,
          win,
          roof,
          targetH,
          height: 0.2,
          age: 0,
          gx, gz,
          pop: Math.round(floors * randRange(8, 22)),
          growing: true,
          baseY: 0
        };
        buildingMeshes.push(entry);
        return entry;
      }

      // ── Growth algorithm ────────────────────────────────────────────────
      // Start with a cross of roads through the center, grow outward.

      function resetCity() {
        // dispose buildings
        for (const b of buildingMeshes) {
          b.mesh.dispose();
        }
        buildingMeshes.length = 0;

        for (const p of parks) p.dispose();
        parks.length = 0;

        clearRoads();

        // dispose agents
        for (const c of cars) {
          if (c.root) c.root.dispose();
        }
        cars.length = 0;
        for (const pe of people) {
          if (pe.mesh) pe.mesh.dispose();
        }
        people.length = 0;

        cells.fill(0);
        seed = (Date.now() ^ (Math.random() * 1e9)) >>> 0;

        // seed center roads (cross)
        const mid = (GRID / 2) | 0;
        for (let i = 0; i < GRID; i++) {
          // leave edges empty initially for organic growth - only center stretch
          if (Math.abs(i - mid) <= 2) {
            setRoad(mid, i);
            setRoad(i, mid);
          }
        }
        // a few more seed roads
        setRoad(mid - 1, mid - 1);
        setRoad(mid + 1, mid + 1);

        rebuildRoadNetwork();
        year = 2026;
        growthAcc = 0;
        updateStats();
      }

      function setRoad(gx, gz) {
        if (!inBounds(gx, gz)) return false;
        const i = cellIndex(gx, gz);
        if (cells[i] === 1) return false;
        // remove building if somehow there
        cells[i] = 1;
        createRoadMesh(gx, gz);
        return true;
      }

      function tryGrow() {
        // Target number of developed cells based on size slider
        const footprint = 0.15 + params.size * 0.85;
        const targetDeveloped = Math.floor(GRID * GRID * footprint * 0.85);
        let developed = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] !== 0) developed++;

        if (developed >= targetDeveloped && buildingMeshes.length >= targetDeveloped * 0.45) {
          // still allow densification: grow taller buildings near center occasionally
          densifyHeights();
          return;
        }

        // Prefer expanding from existing roads
        const roadCells = [];
        const emptyNearRoad = [];
        for (let gz = 0; gz < GRID; gz++) {
          for (let gx = 0; gx < GRID; gx++) {
            const i = cellIndex(gx, gz);
            if (cells[i] === 1) roadCells.push({ gx, gz });
            else if (cells[i] === 0 && hasRoadNeighbor(gx, gz)) emptyNearRoad.push({ gx, gz });
          }
        }

        if (!roadCells.length) {
          const mid = (GRID / 2) | 0;
          setRoad(mid, mid);
          rebuildRoadNetwork();
          return;
        }

        // Decide action: extend road or place building/park
        const r = rand();
        if (r < 0.42 || emptyNearRoad.length < 2) {
          // extend road from a random road cell
          const rc = choice(roadCells);
          const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
          // shuffle
          for (let i = dirs.length - 1; i > 0; i--) {
            const j = irand(i + 1);
            const t = dirs[i]; dirs[i] = dirs[j]; dirs[j] = t;
          }
          for (const [dx, dz] of dirs) {
            const nx = rc.gx + dx, nz = rc.gz + dz;
            if (!inBounds(nx, nz)) continue;
            if (cells[cellIndex(nx, nz)] !== 0) continue;
            // bias expansion based on size: don't go too far if size small
            const dist = Math.hypot(nx - GRID / 2, nz - GRID / 2) / (GRID * 0.5);
            if (dist > 0.2 + params.size * 0.95 && rand() > 0.15) continue;
            setRoad(nx, nz);
            // sometimes continue one more step for arterial feel
            if (rand() < 0.35) {
              const nx2 = nx + dx, nz2 = nz + dz;
              if (inBounds(nx2, nz2) && cells[cellIndex(nx2, nz2)] === 0) {
                const d2 = Math.hypot(nx2 - GRID / 2, nz2 - GRID / 2) / (GRID * 0.5);
                if (d2 < 0.25 + params.size) setRoad(nx2, nz2);
              }
            }
            rebuildRoadNetwork();
            return;
          }
        }

        // place building or park near road
        if (emptyNearRoad.length) {
          // pick candidates closer to center more often when density high
          emptyNearRoad.sort((a, b) => {
            const da = Math.hypot(a.gx - GRID / 2, a.gz - GRID / 2);
            const db = Math.hypot(b.gx - GRID / 2, b.gz - GRID / 2);
            return da - db;
          });
          const pickRange = Math.max(1, Math.floor(emptyNearRoad.length * (0.3 + params.size * 0.5)));
          const pick = emptyNearRoad[irand(pickRange)];
          const i = cellIndex(pick.gx, pick.gz);
          if (cells[i] !== 0) return;

          if (rand() < 0.12) {
            cells[i] = 3;
            createPark(pick.gx, pick.gz);
          } else {
            cells[i] = 2;
            createBuilding(pick.gx, pick.gz);
          }
        }
      }

      function hasRoadNeighbor(gx, gz) {
        const d = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        for (const [dx, dz] of d) {
          const nx = gx + dx, nz = gz + dz;
          if (inBounds(nx, nz) && cells[cellIndex(nx, nz)] === 1) return true;
        }
        return false;
      }

      function densifyHeights() {
        if (!buildingMeshes.length || rand() > 0.4) return;
        const b = choice(buildingMeshes);
        if (b.growing) return;
        const boost = randRange(1.5, 4.5) * params.size;
        b.targetH = Math.min(28, b.targetH + boost);
        b.growing = true;
        b.pop += Math.round(boost * 6);
      }

      // ── Animate building growth ─────────────────────────────────────────
      function updateBuildings(dt) {
        for (const b of buildingMeshes) {
          if (!b.growing) continue;
          const rate = 2.5 + params.speed * 8;
          b.height += rate * dt;
          if (b.height >= b.targetH) {
            b.height = b.targetH;
            b.growing = false;
          }
          // scale mesh from bottom
          const h = Math.max(0.15, b.height);
          // Babylon boxes are centered; reposition so base stays on ground
          const prevH = b.mesh.scaling.y * 0.2; // original height 0.2
          // Better: set absolute scaling from unit box - recreate approach:
          // Our box created with height 0.2; scale.y = h/0.2
          b.mesh.scaling.y = h / 0.2;
          b.mesh.position.y = h / 2;

          if (b.win) {
            b.win.isVisible = h > 1.2;
            b.win.scaling.y = Math.max(0.5, h / 0.5);
            b.win.position.y = 0; // center of parent
          }
          if (b.roof) {
            b.roof.position.y = 0.5; // relative mid; with parent scale it goes up
            b.roof.isVisible = h > 3;
          }
          b.age += dt;
        }
      }

      // ── Traffic (cars) ──────────────────────────────────────────────────
      function spawnCar() {
        if (!roadNodes.length || roadSegments.length === 0) return;
        if (cars.length >= maxCarsDesired()) return;

        const start = irand(roadNodes.length);
        const node = roadNodes[start];
        if (!node.edges.length) return;

        const color = choice(carColors);
        const root = new BABYLON.TransformNode('carRoot', scene);
        root.parent = agentRoot;

        const body = carBodyProto.createInstance('carB' + cars.length);
        body.isVisible = true;
        body.parent = root;
        body.position.y = 0.28;
        // per-instance color not available on standard instances easily —
        // use thin instances alternative: clone instead for color variety
        body.dispose();
        const bodyMesh = BABYLON.MeshBuilder.CreateBox('carBody', {
          width: 0.9, height: 0.35, depth: 1.8
        }, scene);
        bodyMesh.material = mat('carM' + cars.length, color, {
          specular: new BABYLON.Color3(0.3, 0.3, 0.3)
        });
        bodyMesh.parent = root;
        bodyMesh.position.y = 0.28;

        const cabin = BABYLON.MeshBuilder.CreateBox('cabin', {
          width: 0.72, height: 0.28, depth: 0.85
        }, scene);
        cabin.material = windowMat;
        cabin.parent = root;
        cabin.position.set(0, 0.55, -0.1);

        root.position.set(node.x, 0, node.z);

        const edge = choice(node.edges);
        const car = {
          root,
          body: bodyMesh,
          cabin,
          nodeId: start,
          targetId: edge.to,
          t: 0,
          speed: randRange(4.5, 9.5) * (0.55 + params.traffic * 0.9),
          wait: 0
        };
        cars.push(car);
        orientCar(car);
      }

      function maxCarsDesired() {
        const roadFactor = Math.max(1, roadSegments.length);
        return Math.min(MAX_CARS, Math.floor(params.traffic * (8 + roadFactor * 1.8)));
      }

      function maxPeopleDesired() {
        const popFactor = buildingMeshes.reduce((s, b) => s + (b.growing ? b.height / b.targetH : 1) * 0.3, 0);
        return Math.min(MAX_PEOPLE, Math.floor(params.traffic * 20 + popFactor * params.size * 25 + buildingMeshes.length * 0.8));
      }

      function orientCar(car) {
        const a = roadNodes[car.nodeId];
        const b = roadNodes[car.targetId];
        if (!a || !b) return;
        const ang = Math.atan2(b.x - a.x, b.z - a.z);
        car.root.rotation.y = ang;
      }

      function updateCars(dt) {
        // spawn / despawn toward target count
        const want = maxCarsDesired();
        if (cars.length < want && rand() < 0.15 + params.traffic * 0.35) spawnCar();
        while (cars.length > want + 2) {
          const c = cars.pop();
          c.root.dispose();
        }

        for (let i = cars.length - 1; i >= 0; i--) {
          const car = cars[i];
          if (car.wait > 0) {
            car.wait -= dt;
            continue;
          }
          const a = roadNodes[car.nodeId];
          const b = roadNodes[car.targetId];
          if (!a || !b) {
            car.root.dispose();
            cars.splice(i, 1);
            continue;
          }
          const len = Math.hypot(b.x - a.x, b.z - a.z) || 0.001;
          car.t += (car.speed * dt) / len;
          if (car.t >= 1) {
            car.t = 0;
            car.nodeId = car.targetId;
            const node = roadNodes[car.nodeId];
            if (!node || !node.edges.length) {
              car.root.dispose();
              cars.splice(i, 1);
              continue;
            }
            // prefer continuing straight
            let next = choice(node.edges);
            if (node.edges.length > 1 && rand() < 0.7) {
              // try not to reverse
              const prev = a;
              const candidates = node.edges.filter(e => {
                const t = roadNodes[e.to];
                return Math.hypot(t.x - prev.x, t.z - prev.z) > 0.5;
              });
              if (candidates.length) next = choice(candidates);
            }
            car.targetId = next.to;
            orientCar(car);
            // occasional stop
            if (rand() < 0.05) car.wait = randRange(0.2, 1.2);
          }
          const aa = roadNodes[car.nodeId];
          const bb = roadNodes[car.targetId];
          if (!aa || !bb) continue;
          const x = aa.x + (bb.x - aa.x) * car.t;
          const z = aa.z + (bb.z - aa.z) * car.t;
          // lane offset
          const dx = bb.x - aa.x, dz = bb.z - aa.z;
          const inv = 1 / (Math.hypot(dx, dz) || 1);
          const ox = -dz * inv * 0.55;
          const oz = dx * inv * 0.55;
          car.root.position.x = x + ox;
          car.root.position.z = z + oz;
          car.root.position.y = 0;
        }
      }

      // ── People ──────────────────────────────────────────────────────────
      function spawnPerson() {
        if (!roadNodes.length) return;
        if (people.length >= maxPeopleDesired()) return;
        const node = choice(roadNodes);
        const mesh = BABYLON.MeshBuilder.CreateCapsule('p', {
          radius: 0.16 + rand() * 0.05,
          height: 0.75 + rand() * 0.25,
          tessellation: 5
        }, scene);
        const c = new BABYLON.Color3(randRange(0.2, 0.9), randRange(0.2, 0.9), randRange(0.2, 0.9));
        mesh.material = mat('pm' + people.length, c);
        mesh.parent = agentRoot;
        mesh.position.set(
          node.x + randRange(-1.5, 1.5),
          0.45,
          node.z + randRange(-1.5, 1.5)
        );
        shadowGen.addShadowCaster(mesh);

        const target = choice(roadNodes);
        people.push({
          mesh,
          x: mesh.position.x,
          z: mesh.position.z,
          tx: target.x + randRange(-1.2, 1.2),
          tz: target.z + randRange(-1.2, 1.2),
          speed: randRange(1.1, 2.4) * (0.7 + params.traffic * 0.5),
          wait: rand() * 2
        });
      }

      function updatePeople(dt) {
        const want = maxPeopleDesired();
        if (people.length < want && rand() < 0.2) spawnPerson();
        while (people.length > want + 3) {
          const p = people.pop();
          p.mesh.dispose();
        }

        for (let i = people.length - 1; i >= 0; i--) {
          const pe = people[i];
          if (pe.wait > 0) {
            pe.wait -= dt;
            // idle bob
            pe.mesh.position.y = 0.45 + Math.sin(performance.now() * 0.005 + i) * 0.02;
            continue;
          }
          const dx = pe.tx - pe.x;
          const dz = pe.tz - pe.z;
          const dist = Math.hypot(dx, dz);
          if (dist < 0.3) {
            // new target
            if (roadNodes.length) {
              const n = choice(roadNodes);
              pe.tx = n.x + randRange(-1.8, 1.8);
              pe.tz = n.z + randRange(-1.8, 1.8);
            }
            if (rand() < 0.3) pe.wait = randRange(0.5, 3);
            continue;
          }
          const step = pe.speed * dt;
          pe.x += (dx / dist) * step;
          pe.z += (dz / dist) * step;
          pe.mesh.position.x = pe.x;
          pe.mesh.position.z = pe.z;
          pe.mesh.position.y = 0.45 + Math.sin(performance.now() * 0.01 + i) * 0.03;
          pe.mesh.rotation.y = Math.atan2(dx, dz);
        }
      }

      // ── Stats / year ────────────────────────────────────────────────────
      let year = 2026;
      let growthAcc = 0;

      function updateStats() {
        const bCount = buildingMeshes.length;
        let roads = 0;
        for (let i = 0; i < cells.length; i++) if (cells[i] === 1) roads++;
        let pop = 0;
        for (const b of buildingMeshes) {
          const prog = Math.min(1, b.height / Math.max(0.2, b.targetH));
          pop += Math.round(b.pop * prog);
        }
        pop += people.length;
        $('sBuild').textContent = bCount;
        $('sRoads').textContent = roads;
        $('sCars').textContent = cars.length;
        $('sPeople').textContent = people.length;
        $('sPop').textContent = pop.toLocaleString();
        $('sYear').textContent = String(year | 0);
      }

      // ── Buttons ─────────────────────────────────────────────────────────
      $('btnPause').onclick = () => {
        params.growing = !params.growing;
        $('btnPause').textContent = params.growing ? 'Pause growth' : 'Resume growth';
      };
      $('btnBoost').onclick = () => {
        for (let i = 0; i < 12; i++) tryGrow();
        updateStats();
      };
      $('btnReset').onclick = () => resetCity();

      // ── Main loop ───────────────────────────────────────────────────────
      resetCity();

      // seed a bit of initial city
      for (let i = 0; i < 20; i++) tryGrow();

      let statsTimer = 0;

      scene.onBeforeRenderObservable.add(() => {
        const dt = Math.min(0.05, engine.getDeltaTime() / 1000);

        // growth
        if (params.growing) {
          growthAcc += dt * (0.4 + params.speed * 4.5);
          const events = Math.min(8, growthAcc | 0);
          growthAcc -= events;
          for (let i = 0; i < events; i++) tryGrow();
          year += dt * (0.8 + params.speed * 6);
        }

        updateBuildings(dt);
        updateCars(dt);
        updatePeople(dt);

        // gentle camera auto-rotate when idle-ish
        // (keep subtle)
        camera.alpha += dt * 0.02 * (0.3 + params.speed * 0.2);

        statsTimer += dt;
        if (statsTimer > 0.25) {
          statsTimer = 0;
          updateStats();
        }
      });

      // ── Decorative sky gradient via clear + fog already set ─────────────
      // Street lamps along some roads (spawned lazily)
      const lampMat = mat('lamp', new BABYLON.Color3(0.3, 0.3, 0.32));
      const lampGlow = mat('lampGlow', new BABYLON.Color3(1, 0.9, 0.5), {
        emissive: new BABYLON.Color3(0.8, 0.65, 0.25)
      });
      let lampsBuilt = 0;

      function maybeBuildLamps() {
        if (lampsBuilt > 40) return;
        if (rand() > 0.02) return;
        const roadCells = [];
        for (let gz = 0; gz < GRID; gz++) {
          for (let gx = 0; gx < GRID; gx++) {
            if (cells[cellIndex(gx, gz)] === 1) roadCells.push({ gx, gz });
          }
        }
        if (!roadCells.length) return;
        const rc = choice(roadCells);
        const w = cellToWorld(rc.gx, rc.gz);
        const pole = BABYLON.MeshBuilder.CreateCylinder('pole', {
          height: 2.4, diameter: 0.1, tessellation: 6
        }, scene);
        pole.position.set(w.x + CELL * 0.35, 1.2, w.z + CELL * 0.35);
        pole.material = lampMat;
        pole.parent = roadRoot;
        const bulb = BABYLON.MeshBuilder.CreateSphere('bulb', { diameter: 0.28, segments: 6 }, scene);
        bulb.position.set(pole.position.x, 2.45, pole.position.z);
        bulb.material = lampGlow;
        bulb.parent = roadRoot;
        // point light (limit count for performance)
        if (lampsBuilt < 12) {
          const pl = new BABYLON.PointLight('pl' + lampsBuilt, bulb.position.clone(), scene);
          pl.intensity = 0.35;
          pl.range = 12;
          pl.diffuse = new BABYLON.Color3(1, 0.9, 0.65);
        }
        lampsBuilt++;
        roadMeshes.push(pole, bulb);
      }

      scene.onBeforeRenderObservable.add(() => {
        if (params.growing) maybeBuildLamps();
      });

      // ── Render ──────────────────────────────────────────────────────────
      engine.runRenderLoop(() => scene.render());
      window.addEventListener('resize', () => engine.resize());
    })();
  </script>
</body>
</html>
