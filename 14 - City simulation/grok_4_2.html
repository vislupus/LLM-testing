<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CITYGEN • Growing Metropolis</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { margin:0; overflow:hidden; background:#0a0a1f; font-family:'Inter', system-ui; color:#fff; }
        canvas { display:block; }
        #ui {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .top {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            font-weight: 600;
            text-shadow: 0 2px 8px #000;
        }
        .panel {
            background: rgba(0,0,0,0.75);
            padding: 14px 22px;
            border-radius: 12px;
            pointer-events: all;
            backdrop-filter: blur(8px);
        }
        label { display:block; margin:12px 0 6px; font-size:13px; color:#88ffdd; }
        input[type="range"] {
            width: 100%;
            accent-color: #00ffcc;
        }
        .value {
            float: right;
            font-family: monospace;
            color: #00ffcc;
        }
        #stats {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <!-- Top bar -->
        <div class="top">
            <div class="panel" style="min-width:240px">
                <div style="font-size:22px;font-weight:700;color:#00ffcc;margin-bottom:8px">CITYGEN</div>
                <div style="font-size:13px;opacity:0.8">Population: <span id="pop">12,450</span></div>
            </div>
            
            <div class="panel">
                <div style="margin-bottom:8px">DEVELOPMENT SPEED <span id="speedVal" class="value">5</span></div>
                <input type="range" id="speedSlider" min="1" max="10" value="5">
                
                <div style="margin:18px 0 8px">CITY DENSITY <span id="densityVal" class="value">48</span></div>
                <input type="range" id="densitySlider" min="10" max="90" value="48">
                
                <div style="margin:18px 0 8px">TRAFFIC INTENSITY <span id="trafficVal" class="value">62</span></div>
                <input type="range" id="trafficSlider" min="10" max="100" value="62">
            </div>
        </div>
        
        <!-- Bottom stats -->
        <div id="stats" class="panel">
            BUILDINGS: <span id="buildings">42</span> | 
            VEHICLES: <span id="vehicles">18</span> | 
            TIME: <span id="time">00:00</span>
        </div>
    </div>

    <script>
        // ================================================
        // CITYGEN - Real-time Growing City Simulation
        // Babylon.js • Single standalone HTML file
        // Procedural buildings, roads, traffic, people
        // Real-time sliders • Beautiful stylized look
        // ================================================

        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let scene, camera;
        let buildings = [];
        let cars = [];
        let people = [];
        let roads = [];
        
        let targetBuildings = 48;
        let targetCars = 18;
        let developmentSpeed = 5; // 1-10
        
        let lastSpawnTime = 0;
        let simTime = 0;
        
        const CITY_SIZE = 480;
        const BLOCK_SIZE = 52;
        const ROAD_WIDTH = 14;
        
        let occupiedBlocks = new Set();

        function createScene() {
            scene = new BABYLON.Scene(engine);
            
            // Camera
            camera = new BABYLON.ArcRotateCamera("cam", Math.PI/2, Math.PI/3.8, 680, new BABYLON.Vector3(0, 35, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 180;
            camera.upperRadiusLimit = 920;
            camera.lowerBetaLimit = 0.3;
            camera.upperBetaLimit = 1.35;
            
            // Lighting
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.5, 1, -0.4), scene);
            hemi.intensity = 0.9;
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -0.9, -0.5), scene);
            sun.intensity = 1.3;
            
            // Ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: CITY_SIZE*1.6, height: CITY_SIZE*1.6}, scene);
            const groundMat = new BABYLON.StandardMaterial("gMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.12, 0.18, 0.08);
            groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            ground.material = groundMat;
            
            // Create initial road grid
            createRoadGrid();
            
            // Initial buildings
            for (let i = 0; i < 12; i++) spawnBuilding(true);
            
            // Initial cars
            for (let i = 0; i < 8; i++) spawnCar();
            
            // Gentle wind animation on trees later
            
            return scene;
        }

        function createRoadGrid() {
            const matRoad = new BABYLON.StandardMaterial("road", scene);
            matRoad.diffuseColor = new BABYLON.Color3(0.18, 0.18, 0.22);
            
            const matLine = new BABYLON.StandardMaterial("line", scene);
            matLine.diffuseColor = new BABYLON.Color3(1, 0.95, 0.6);
            
            // Horizontal roads
            for (let i = -4; i <= 4; i++) {
                const z = i * BLOCK_SIZE;
                const road = BABYLON.MeshBuilder.CreateBox("hRoad", {
                    width: CITY_SIZE * 1.4, height: 0.8, depth: ROAD_WIDTH
                }, scene);
                road.position.set(0, 0.4, z);
                road.material = matRoad;
                roads.push(road);
                
                // White lines
                const line = BABYLON.MeshBuilder.CreateBox("line", {
                    width: CITY_SIZE * 1.4, height: 0.1, depth: 1.2
                }, scene);
                line.position.set(0, 1.1, z);
                line.material = matLine;
            }
            
            // Vertical roads
            for (let i = -4; i <= 4; i++) {
                const x = i * BLOCK_SIZE;
                const road = BABYLON.MeshBuilder.CreateBox("vRoad", {
                    width: ROAD_WIDTH, height: 0.8, depth: CITY_SIZE * 1.4
                }, scene);
                road.position.set(x, 0.4, 0);
                road.material = matRoad;
                roads.push(road);
                
                const line = BABYLON.MeshBuilder.CreateBox("line", {
                    width: 1.2, height: 0.1, depth: CITY_SIZE * 1.4
                }, scene);
                line.position.set(x, 1.1, 0);
                line.material = matLine;
            }
        }

        function spawnBuilding(instant = false) {
            if (buildings.length >= targetBuildings) return;
            
            // Find random empty block
            let attempts = 0;
            let x, z;
            do {
                x = (Math.floor(Math.random() * 9) - 4) * BLOCK_SIZE + (Math.random()*20 - 10);
                z = (Math.floor(Math.random() * 9) - 4) * BLOCK_SIZE + (Math.random()*20 - 10);
                attempts++;
            } while (attempts < 30 && occupiedBlocks.has(Math.floor(x/40) + "," + Math.floor(z/40)));
            
            if (attempts >= 30) return;
            
            occupiedBlocks.add(Math.floor(x/40) + "," + Math.floor(z/40));
            
            const height = 18 + Math.random() * 72;
            const width = 14 + Math.random() * 12;
            const depth = 14 + Math.random() * 12;
            
            const building = BABYLON.MeshBuilder.CreateBox("building", {
                width: width, height: height, depth: depth
            }, scene);
            building.position.set(x, height/2, z);
            
            const mat = new BABYLON.StandardMaterial("bMat", scene);
            const hue = Math.random();
            mat.diffuseColor = new BABYLON.Color3(
                0.3 + hue*0.5,
                0.35 + Math.random()*0.4,
                0.4 + Math.random()*0.3
            );
            building.material = mat;
            
            // Roof
            const roof = BABYLON.MeshBuilder.CreateBox("roof", {
                width: width*1.1, height: 4, depth: depth*1.1
            }, scene);
            roof.position.set(x, height + 2, z);
            roof.material = new BABYLON.StandardMaterial("", scene);
            roof.material.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.22);
            
            buildings.push({mesh: building, roof: roof, heightTarget: height, currentHeight: instant ? height : 2});
            
            if (!instant) {
                building.scaling.y = 0.05;
            }
        }

        function spawnCar() {
            if (cars.length >= targetCars) return;
            
            const car = BABYLON.MeshBuilder.CreateBox("car", {width: 9, height: 5, depth: 18}, scene);
            const isHorizontal = Math.random() > 0.5;
            
            if (isHorizontal) {
                car.position.set(-CITY_SIZE*0.6, 4, (Math.random()*7 - 3.5) * BLOCK_SIZE);
                car.rotation.y = Math.random() > 0.5 ? 0 : Math.PI;
            } else {
                car.position.set((Math.random()*7 - 3.5) * BLOCK_SIZE, 4, -CITY_SIZE*0.6);
                car.rotation.y = Math.PI / 2;
            }
            
            const mat = new BABYLON.StandardMaterial("", scene);
            mat.diffuseColor = new BABYLON.Color3(Math.random(), Math.random()*0.6, Math.random()*0.4);
            car.material = mat;
            
            car.userData = {
                speed: 1.8 + Math.random() * 1.2,
                isHorizontal: isHorizontal,
                direction: Math.random() > 0.5 ? 1 : -1
            };
            
            cars.push(car);
        }

        function updateSimulation() {
            const now = Date.now();
            
            // Spawn new buildings based on development speed
            if (now - lastSpawnTime > (1200 / developmentSpeed)) {
                spawnBuilding();
                lastSpawnTime = now;
            }
            
            // Update buildings growth
            for (let i = 0; i < buildings.length; i++) {
                const b = buildings[i];
                if (b.currentHeight < b.heightTarget) {
                    b.currentHeight += 2.8;
                    b.mesh.scaling.y = b.currentHeight / b.heightTarget;
                    b.roof.position.y = b.currentHeight + 2;
                }
            }
            
            // Update cars
            for (let i = cars.length - 1; i >= 0; i--) {
                const car = cars[i];
                const data = car.userData;
                
                if (data.isHorizontal) {
                    car.position.x += data.speed * data.direction;
                    if (Math.abs(car.position.x) > CITY_SIZE * 0.7) {
                        car.dispose();
                        cars.splice(i, 1);
                        spawnCar();
                    }
                } else {
                    car.position.z += data.speed * data.direction;
                    if (Math.abs(car.position.z) > CITY_SIZE * 0.7) {
                        car.dispose();
                        cars.splice(i, 1);
                        spawnCar();
                    }
                }
            }
            
            // Update UI
            document.getElementById("buildings").textContent = buildings.length;
            document.getElementById("vehicles").textContent = cars.length;
            document.getElementById("pop").textContent = (buildings.length * 320 + cars.length * 8).toLocaleString();
        }

        function gameLoop() {
            updateSimulation();
            scene.render();
        }

        // Slider handlers
        function setupSliders() {
            const densitySlider = document.getElementById("densitySlider");
            const trafficSlider = document.getElementById("trafficSlider");
            const speedSlider = document.getElementById("speedSlider");
            
            densitySlider.oninput = () => {
                targetBuildings = parseInt(densitySlider.value);
                document.getElementById("densityVal").textContent = targetBuildings;
                // Spawn missing buildings instantly
                while (buildings.length < targetBuildings) spawnBuilding(true);
            };
            
            trafficSlider.oninput = () => {
                targetCars = Math.floor(parseInt(trafficSlider.value) / 5);
                document.getElementById("trafficVal").textContent = parseInt(trafficSlider.value);
                while (cars.length < targetCars) spawnCar();
            };
            
            speedSlider.oninput = () => {
                developmentSpeed = parseInt(speedSlider.value);
                document.getElementById("speedVal").textContent = developmentSpeed;
            };
        }

        window.onload = () => {
            scene = createScene();
            
            setupSliders();
            
            // Start spawning cars and buildings
            for (let i = 0; i < 14; i++) spawnBuilding(true);
            for (let i = 0; i < 12; i++) spawnCar();
            
            lastSpawnTime = Date.now();
            
            engine.runRenderLoop(gameLoop);
            
            window.addEventListener("resize", () => engine.resize());
        };
    </script>
</body>
</html>
