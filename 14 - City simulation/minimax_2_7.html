<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing City Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            overflow: hidden;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            outline: none;
        }

        .control-panel {
            position: absolute;
            top: 24px;
            left: 24px;
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.95), rgba(15, 15, 25, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            width: 280px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .panel-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #6b7280;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .control-label span {
            font-size: 13px;
            font-weight: 400;
            color: #d1d5db;
        }

        .control-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 3px 8px;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: linear-gradient(90deg, #1f2937 0%, #374151 100%);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
            transition: transform 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: linear-gradient(145deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.5);
        }

        .stats-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            background: linear-gradient(145deg, rgba(20, 20, 30, 0.95), rgba(15, 15, 25, 0.98));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 180px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-size: 12px;
            color: #9ca3af;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            color: #f0f9ff;
        }

        .stat-icon {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .stat-icon.buildings { background: #fbbf24; }
        .stat-icon.vehicles { background: #34d399; }
        .stat-icon.density { background: #f472b6; }

        .title-overlay {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
        }

        .title-overlay h1 {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .title-overlay p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>

    <div class="control-panel">
        <div class="panel-title">Simulation Controls</div>

        <div class="control-group">
            <div class="control-label">
                <span>City Size</span>
                <span class="control-value" id="sizeValue">50</span>
            </div>
            <input type="range" id="citySize" min="10" max="100" value="50">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Traffic Intensity</span>
                <span class="control-value" id="trafficValue">40</span>
            </div>
            <input type="range" id="trafficIntensity" min="0" max="100" value="40">
        </div>

        <div class="control-group">
            <div class="control-label">
                <span>Development Speed</span>
                <span class="control-value" id="speedValue">1.0x</span>
            </div>
            <input type="range" id="devSpeed" min="1" max="50" value="10">
        </div>
    </div>

    <div class="stats-panel">
        <div class="stat-row">
            <div style="display: flex; align-items: center;">
                <div class="stat-icon buildings"></div>
                <span class="stat-label">Buildings</span>
            </div>
            <span class="stat-value" id="buildingCount">0</span>
        </div>
        <div class="stat-row">
            <div style="display: flex; align-items: center;">
                <div class="stat-icon vehicles"></div>
                <span class="stat-label">Vehicles</span>
            </div>
            <span class="stat-value" id="vehicleCount">0</span>
        </div>
        <div class="stat-row">
            <div style="display: flex; align-items: center;">
                <div class="stat-icon density"></div>
                <span class="stat-label">City Progress</span>
            </div>
            <span class="stat-value" id="cityProgress">0%</span>
        </div>
    </div>

    <div class="title-overlay">
        <h1>Growing City</h1>
        <p>Procedural Urban Simulation</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>

    <script>
        const CONFIG = {
            gridSize: 20,
            blockSize: 4,
            roadWidth: 1,
            maxBuildings: 200,
            maxVehicles: 100
        };

        const BUILDING_TYPES = {
            residential: { color: [0.91, 0.72, 0.49], heightRange: [2, 6] },
            commercial: { color: [0.42, 0.55, 0.62], heightRange: [4, 12] },
            industrial: { color: [0.41, 0.41, 0.41], heightRange: [2, 5] },
            tower: { color: [0.53, 0.81, 0.92], heightRange: [10, 20] }
        };

        const VEHICLE_COLORS = [
            [0.85, 0.3, 0.3], [0.3, 0.5, 0.85], [0.3, 0.75, 0.4],
            [0.9, 0.7, 0.2], [0.7, 0.4, 0.8], [0.95, 0.6, 0.3]
        ];

        class GrowingCity {
            constructor() {
                this.buildings = [];
                this.vehicles = [];
                this.occupiedCells = new Set();
                this.roadCells = new Set();
                this.cityProgress = 0;
                this.lastBuildingSpawn = 0;
                this.lastVehicleSpawn = 0;
                this.citySize = 50;
                this.trafficIntensity = 40;
                this.devSpeed = 1.0;
                this.init();
            }

            init() {
                const canvas = document.getElementById("renderCanvas");
                this.engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });
                this.scene = this.createScene();
                this.setupControls();
                this.engine.runRenderLoop(() => this.update());
                window.addEventListener("resize", () => this.engine.resize());
            }

            createScene() {
                const scene = new BABYLON.Scene(this.engine);
                scene.clearColor = new BABYLON.Color4(0.06, 0.06, 0.1, 1);

                this.canvas = document.getElementById("renderCanvas");
                this.camera = new BABYLON.ArcRotateCamera(
                    "camera", -Math.PI / 3, Math.PI / 4, 80,
                    new BABYLON.Vector3(0, 0, 0), scene
                );
                this.camera.attachControl(this.canvas, true);
                this.camera.lowerRadiusLimit = 30;
                this.camera.upperRadiusLimit = 150;
                this.camera.lowerBetaLimit = 0.2;
                this.camera.upperBetaLimit = Math.PI / 2.5;
                this.camera.inertia = 0.9;

                const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
                hemiLight.intensity = 0.5;
                hemiLight.diffuse = new BABYLON.Color3(0.9, 0.85, 0.8);

                const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
                dirLight.position = new BABYLON.Vector3(40, 60, 40);
                dirLight.intensity = 0.8;

                const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 120, height: 120 }, scene);
                ground.material = new BABYLON.StandardMaterial("gm", scene);
                ground.material.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.25);

                this.materials = this.createMaterials(scene);
                this.createRoadGrid(scene);
                return scene;
            }

            createMaterials(scene) {
                const mats = {};
                for (const [type, cfg] of Object.entries(BUILDING_TYPES)) {
                    const mat = new BABYLON.StandardMaterial(`${type}Mat`, scene);
                    mat.diffuseColor = new BABYLON.Color3(...cfg.color);
                    mats[type] = mat;
                }

                mats.road = new BABYLON.StandardMaterial("roadMat", scene);
                mats.road.diffuseColor = new BABYLON.Color3(0.25, 0.25, 0.28);

                mats.marking = new BABYLON.StandardMaterial("markingMat", scene);
                mats.marking.diffuseColor = new BABYLON.Color3(0.9, 0.8, 0.2);

                mats.vehicles = VEHICLE_COLORS.map((c, i) => {
                    const mat = new BABYLON.StandardMaterial(`v${i}`, scene);
                    mat.diffuseColor = new BABYLON.Color3(...c);
                    mat.emissiveColor = new BABYLON.Color3(...c.map(x => x * 0.3));
                    return mat;
                });
                return mats;
            }

            createRoadGrid(scene) {
                const totalSize = CONFIG.gridSize * (CONFIG.blockSize + CONFIG.roadWidth);
                const half = totalSize / 2;

                for (let i = 0; i <= CONFIG.gridSize; i++) {
                    const z = i * (CONFIG.blockSize + CONFIG.roadWidth) - half + CONFIG.blockSize / 2;
                    const road = BABYLON.MeshBuilder.CreateBox(`rh${i}`, {
                        width: totalSize, height: 0.05, depth: CONFIG.roadWidth
                    }, scene);
                    road.position = new BABYLON.Vector3(0, 0.025, z);
                    road.material = this.materials.road;
                }

                for (let i = 0; i <= CONFIG.gridSize; i++) {
                    const x = i * (CONFIG.blockSize + CONFIG.roadWidth) - half + CONFIG.blockSize / 2;
                    const road = BABYLON.MeshBuilder.CreateBox(`rv${i}`, {
                        width: CONFIG.roadWidth, height: 0.05, depth: totalSize
                    }, scene);
                    road.position = new BABYLON.Vector3(x, 0.025, 0);
                    road.material = this.materials.road;
                }
            }

            getRandomBuildingType() {
                const r = Math.random();
                if (r < 0.5) return 'residential';
                if (r < 0.75) return 'commercial';
                if (r < 0.9) return 'industrial';
                return 'tower';
            }

            spawnBuilding() {
                if (this.buildings.length >= Math.min(CONFIG.maxBuildings, this.citySize * 2)) return;

                const totalSize = CONFIG.gridSize * (CONFIG.blockSize + CONFIG.roadWidth);
                const half = totalSize / 2;

                for (let att = 0; att < 50; att++) {
                    const gx = Math.floor(Math.random() * CONFIG.gridSize);
                    const gz = Math.floor(Math.random() * CONFIG.gridSize);
                    const key = `${gx}_${gz}`;

                    if (!this.occupiedCells.has(key)) {
                        const x = gx * (CONFIG.blockSize + CONFIG.roadWidth) - half + CONFIG.blockSize / 2;
                        const z = gz * (CONFIG.blockSize + CONFIG.roadWidth) - half + CONFIG.blockSize / 2;

                        const dist = Math.sqrt(gx * gx + gz * gz) / (CONFIG.gridSize / 2);
                        const type = (dist < 0.3 && Math.random() < 0.3) ? 'tower' : this.getRandomBuildingType();
                        const cfg = BUILDING_TYPES[type];
                        const height = cfg.heightRange[0] + Math.random() * (cfg.heightRange[1] - cfg.heightRange[0]);

                        const w = 1.5 + Math.random() * 1.5;
                        const d = 1.5 + Math.random() * 1.5;
                        const bld = BABYLON.MeshBuilder.CreateBox(`b${this.buildings.length}`, {
                            width: w, height: height, depth: d
                        }, this.scene);
                        bld.position = new BABYLON.Vector3(x, height / 2, z);
                        bld.material = this.materials[type];

                        this.buildings.push({ mesh: bld, gridX: gx, gridZ: gz, type, height });
                        this.occupiedCells.add(key);
                        return;
                    }
                }
            }

            spawnVehicle() {
                if (this.vehicles.length >= Math.min(CONFIG.maxVehicles, this.trafficIntensity * 0.8)) return;

                const totalSize = CONFIG.gridSize * (CONFIG.blockSize + CONFIG.roadWidth);
                const half = totalSize / 2;

                const roadIdx = () => {
                    const i = Math.floor(Math.random() * (CONFIG.gridSize + 1));
                    return i * (CONFIG.blockSize + CONFIG.roadWidth) - half + CONFIG.blockSize / 2;
                };

                const sx = roadIdx(), sz = roadIdx();
                const ex = roadIdx(), ez = roadIdx();

                const isBus = Math.random() < 0.15;
                const v = BABYLON.MeshBuilder.CreateBox(`v${this.vehicles.length}`, {
                    width: isBus ? 0.4 : 0.3,
                    height: isBus ? 0.5 : 0.3,
                    depth: isBus ? 0.9 : 0.5
                }, this.scene);
                v.position = new BABYLON.Vector3(sx, 0.3, sz);
                v.material = this.materials.vehicles[Math.floor(Math.random() * this.materials.vehicles.length)];

                this.vehicles.push({
                    mesh: v,
                    start: new BABYLON.Vector3(sx, 0.3, sz),
                    end: new BABYLON.Vector3(ex, 0.3, ez),
                    progress: 0,
                    speed: 0.005 + Math.random() * 0.01
                });
            }

            updateVehicles(dt) {
                for (let i = this.vehicles.length - 1; i >= 0; i--) {
                    const v = this.vehicles[i];
                    v.progress += v.speed * dt * 0.05;

                    if (v.progress >= 1) {
                        v.mesh.dispose();
                        this.vehicles.splice(i, 1);
                    } else {
                        v.mesh.position.x = BABYLON.Scalar.Lerp(v.start.x, v.end.x, v.progress);
                        v.mesh.position.z = BABYLON.Scalar.Lerp(v.start.z, v.end.z, v.progress);
                        const dx = v.end.x - v.start.x, dz = v.end.z - v.start.z;
                        if (dx !== 0 || dz !== 0) {
                            v.mesh.rotation.y = Math.atan2(dx, dz);
                        }
                    }
                }
            }

            updateUI() {
                document.getElementById('buildingCount').textContent = this.buildings.length;
                document.getElementById('vehicleCount').textContent = this.vehicles.length;
                const prog = Math.min(100, Math.round((this.buildings.length / (this.citySize * 2)) * 100));
                this.cityProgress = prog;
                document.getElementById('cityProgress').textContent = prog + '%';
                document.getElementById('progressFill').style.width = prog + '%';
            }

            setupControls() {
                document.getElementById('citySize').addEventListener('input', e => {
                    this.citySize = parseInt(e.target.value);
                    document.getElementById('sizeValue').textContent = this.citySize;
                });
                document.getElementById('trafficIntensity').addEventListener('input', e => {
                    this.trafficIntensity = parseInt(e.target.value);
                    document.getElementById('trafficValue').textContent = this.trafficIntensity;
                });
                document.getElementById('devSpeed').addEventListener('input', e => {
                    const v = parseInt(e.target.value);
                    this.devSpeed = v / 10;
                    document.getElementById('speedValue').textContent = this.devSpeed.toFixed(1) + 'x';
                });
            }

            update() {
                const now = performance.now();
                const dt = this.engine.getDeltaTime();

                if (now - this.lastBuildingSpawn > 1000 / (this.devSpeed * 2)) {
                    this.spawnBuilding();
                    this.lastBuildingSpawn = now;
                }

                const vSpawnRate = 2000 / (1 + this.trafficIntensity / 20);
                if (now - this.lastVehicleSpawn > vSpawnRate) {
                    this.spawnVehicle();
                    this.lastVehicleSpawn = now;
                }

                this.updateVehicles(dt);
                this.updateUI();
                this.scene.render();
            }
        }

        new GrowingCity();
    </script>
</body>
</html>
