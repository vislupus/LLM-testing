<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbis — Real-Time City Growth Simulation</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0e1a;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
    color: #e2e8f0;
    -webkit-font-smoothing: antialiased;
  }
  #renderCanvas {
    width: 100%; height: 100%;
    display: block;
    outline: none;
    touch-action: none;
  }

  /* ---------- Loading screen ---------- */
  #loading {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #1a2238 0%, #0a0e1a 70%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100;
    transition: opacity 0.6s ease;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  .loading-logo {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.4em;
    color: #22d3ee;
    margin-bottom: 4px;
    text-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
  }
  .loading-tag {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #475569;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .loading-bar {
    width: 220px; height: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .loading-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; height: 100%;
    width: 40%;
    background: linear-gradient(90deg, transparent, #22d3ee, transparent);
    animation: scan 1.4s ease-in-out infinite;
  }
  @keyframes scan {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  /* ---------- Common panel style ---------- */
  .panel {
    position: absolute;
    background: rgba(13, 18, 30, 0.78);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid rgba(148, 163, 184, 0.08);
    border-radius: 14px;
    box-shadow:
      0 12px 40px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* ---------- Controls panel ---------- */
  #controls {
    top: 22px; left: 22px;
    width: 308px;
    padding: 22px 22px 20px;
    user-select: none;
  }
  .brand {
    display: flex; align-items: baseline; gap: 8px;
    margin-bottom: 4px;
  }
  .brand-mark {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: #22d3ee;
  }
  .brand-rev {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 9px;
    color: #475569;
    letter-spacing: 0.2em;
  }
  .brand-tag {
    font-size: 10px;
    color: #64748b;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.08);
  }

  .ctrl-section-label {
    font-size: 9px;
    color: #475569;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .ctrl-section-label::before {
    content: '';
    width: 4px; height: 4px;
    background: #22d3ee;
    border-radius: 50%;
    box-shadow: 0 0 8px #22d3ee;
  }

  .control { margin-bottom: 14px; }
  .control:last-child { margin-bottom: 0; }
  .control-row {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 7px;
  }
  .control-name {
    font-size: 12px;
    font-weight: 500;
    color: #cbd5e1;
    letter-spacing: 0.01em;
  }
  .control-value {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 12px;
    font-weight: 600;
    color: #22d3ee;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    background: linear-gradient(
      to right,
      #22d3ee 0%, #22d3ee var(--p, 50%),
      rgba(148, 163, 184, 0.15) var(--p, 50%), rgba(148, 163, 184, 0.15) 100%
    );
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    transition: filter 0.2s;
  }
  input[type=range]:hover { filter: brightness(1.1); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: #f8fafc;
    border: 2px solid #22d3ee;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12), 0 2px 6px rgba(0,0,0,0.35);
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
  input[type=range]::-webkit-slider-thumb:active { transform: scale(0.92); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: #f8fafc;
    border: 2px solid #22d3ee;
    border-radius: 50%;
    cursor: pointer;
  }

  .btn-row {
    display: flex; gap: 8px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(148, 163, 184, 0.08);
  }
  .btn {
    flex: 1;
    padding: 9px 12px;
    background: rgba(148, 163, 184, 0.06);
    border: 1px solid rgba(148, 163, 184, 0.12);
    color: #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  .btn:hover {
    background: rgba(148, 163, 184, 0.1);
    border-color: rgba(148, 163, 184, 0.22);
    color: #f8fafc;
  }
  .btn-primary {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(34, 211, 238, 0.06));
    border-color: rgba(34, 211, 238, 0.35);
    color: #67e8f9;
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.28), rgba(34, 211, 238, 0.12));
    border-color: rgba(34, 211, 238, 0.55);
    color: #a5f3fc;
  }
  .btn-icon { font-size: 13px; margin-right: 4px; }

  /* ---------- Stats panel ---------- */
  #stats {
    bottom: 22px; left: 22px;
    padding: 14px 18px;
    display: flex; gap: 22px;
  }
  .stat {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 56px;
  }
  .stat-label {
    font-size: 9px;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 600;
  }
  .stat-value {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    font-size: 19px;
    font-weight: 700;
    color: #f1f5f9;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .stat-value.accent { color: #22d3ee; }
  .stat-divider {
    width: 1px;
    background: rgba(148, 163, 184, 0.1);
    margin: 2px 0;
  }

  /* ---------- Hint badge ---------- */
  #hint {
    position: absolute;
    top: 22px; right: 22px;
    background: rgba(13, 18, 30, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(148, 163, 184, 0.08);
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 10.5px;
    color: #94a3b8;
    letter-spacing: 0.05em;
    user-select: none;
  }
  #hint kbd {
    font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
    background: rgba(148, 163, 184, 0.1);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    color: #cbd5e1;
    margin: 0 1px;
  }

  /* ---------- Compass ---------- */
  #compass {
    position: absolute;
    bottom: 22px; right: 22px;
    width: 64px; height: 64px;
    background: rgba(13, 18, 30, 0.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(148, 163, 184, 0.08);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #compass svg { width: 100%; height: 100%; }

  @media (max-width: 720px) {
    #controls { width: calc(100vw - 44px); top: 12px; left: 12px; right: 12px; padding: 18px; }
    #stats { bottom: 12px; left: 12px; right: 12px; gap: 14px; padding: 12px 14px; }
    .stat-value { font-size: 16px; }
    #hint, #compass { display: none; }
  }
</style>
</head>
<body>
  <div id="loading">
    <div class="loading-logo">URBIS</div>
    <div class="loading-tag">City Synthesis Engine</div>
    <div class="loading-bar"></div>
  </div>

  <canvas id="renderCanvas"></canvas>

  <div id="controls" class="panel">
    <div class="brand">
      <div class="brand-mark">URBIS</div>
      <div class="brand-rev">v1.0</div>
    </div>
    <div class="brand-tag">City Growth Simulation</div>

    <div class="ctrl-section-label">Parameters</div>

    <div class="control">
      <div class="control-row">
        <span class="control-name">Population Density</span>
        <span class="control-value" id="sizeVal">120</span>
      </div>
      <input type="range" id="sizeSlider" min="0" max="320" value="120">
    </div>

    <div class="control">
      <div class="control-row">
        <span class="control-name">Traffic Intensity</span>
        <span class="control-value" id="trafficVal">40</span>
      </div>
      <input type="range" id="trafficSlider" min="0" max="140" value="40">
    </div>

    <div class="control">
      <div class="control-row">
        <span class="control-name">Development Speed</span>
        <span class="control-value" id="speedVal">1.0×</span>
      </div>
      <input type="range" id="speedSlider" min="0" max="500" value="100">
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="resetBtn"><span class="btn-icon">↻</span>Reset</button>
      <button class="btn" id="dayNightBtn"><span class="btn-icon">☾</span>Night</button>
    </div>
  </div>

  <div id="hint">
    <kbd>drag</kbd> orbit · <kbd>scroll</kbd> zoom · <kbd>right-drag</kbd> pan
  </div>

  <div id="stats" class="panel">
    <div class="stat">
      <div class="stat-label">Buildings</div>
      <div class="stat-value accent" id="statBuildings">0</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-label">Vehicles</div>
      <div class="stat-value" id="statVehicles">0</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-label">Citizens</div>
      <div class="stat-value" id="statPedestrians">0</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-label">Frame</div>
      <div class="stat-value" id="statFps">--</div>
    </div>
  </div>

  <div id="compass">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(148,163,184,0.18)" stroke-width="1"/>
      <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(148,163,184,0.1)" stroke-width="1"/>
      <g id="compassRotor">
        <polygon points="50,16 46,52 50,48 54,52" fill="#22d3ee"/>
        <polygon points="50,84 46,52 50,56 54,52" fill="#94a3b8" opacity="0.4"/>
        <text x="50" y="13" text-anchor="middle" fill="#22d3ee" font-family="SF Mono, monospace" font-size="9" font-weight="700">N</text>
      </g>
    </svg>
  </div>

  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script>
  (() => {
  'use strict';

  /* =========================================================
     CONFIGURATION
     ========================================================= */
  const GRID_SIZE = 22;          // city is GRID_SIZE x GRID_SIZE cells
  const CELL_SIZE = 5.2;         // world units per cell
  const ROAD_WIDTH = 1.55;       // width of road
  const HALF_GRID = (GRID_SIZE * CELL_SIZE) / 2;

  /* =========================================================
     ENGINE & SCENE
     ========================================================= */
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, {
    antialias: true,
    preserveDrawingBuffer: true,
    stencil: false,
    powerPreference: 'high-performance'
  });
  engine.setHardwareScalingLevel(1 / Math.min(window.devicePixelRatio || 1, 1.5));

  const scene = new BABYLON.Scene(engine);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.ambientColor = new BABYLON.Color3(0.4, 0.45, 0.55);

  const skyDay = new BABYLON.Color3(0.55, 0.72, 0.88);
  const skyNight = new BABYLON.Color3(0.025, 0.04, 0.09);
  const fogDay = new BABYLON.Color3(0.72, 0.82, 0.92);
  const fogNight = new BABYLON.Color3(0.04, 0.05, 0.11);

  scene.clearColor = skyDay.toColor4(1);
  scene.fogColor = fogDay;
  scene.fogDensity = 0.0042;

  /* =========================================================
     CAMERA
     ========================================================= */
  const camera = new BABYLON.ArcRotateCamera(
    'camera',
    -Math.PI / 3,
    Math.PI / 3.4,
    115,
    new BABYLON.Vector3(0, 4, 0),
    scene
  );
  camera.attachControl(canvas, true);
  camera.lowerRadiusLimit = 30;
  camera.upperRadiusLimit = 220;
  camera.upperBetaLimit = Math.PI / 2.05;
  camera.lowerBetaLimit = 0.18;
  camera.wheelDeltaPercentage = 0.012;
  camera.pinchDeltaPercentage = 0.012;
  camera.panningSensibility = 80;
  camera.inertia = 0.85;
  camera.angularSensibilityX = 800;
  camera.angularSensibilityY = 800;

  /* =========================================================
     LIGHTS
     ========================================================= */
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0.3, 1, 0.2), scene);
  hemi.intensity = 0.55;
  hemi.diffuse = new BABYLON.Color3(1, 0.97, 0.92);
  hemi.groundColor = new BABYLON.Color3(0.32, 0.35, 0.42);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.55, -1, -0.4), scene);
  sun.intensity = 0.78;
  sun.diffuse = new BABYLON.Color3(1, 0.96, 0.86);
  sun.position = new BABYLON.Vector3(70, 110, 50);

  /* =========================================================
     OUTER GRASS GROUND (surrounding terrain)
     ========================================================= */
  const outerGround = BABYLON.MeshBuilder.CreateGround('outerGround', {
    width: 460, height: 460, subdivisions: 2
  }, scene);
  const outerMat = new BABYLON.StandardMaterial('outerMat', scene);
  outerMat.diffuseColor = new BABYLON.Color3(0.30, 0.42, 0.26);
  outerMat.specularColor = new BABYLON.Color3(0, 0, 0);
  outerGround.material = outerMat;
  outerGround.position.y = -0.02;

  /* =========================================================
     CITY GROUND TEXTURE (procedural roads + sidewalks)
     ========================================================= */
  function createCityGroundTexture() {
    const texSize = 2048;
    const tex = new BABYLON.DynamicTexture('cityTex', { width: texSize, height: texSize }, scene, true);
    const ctx = tex.getContext();

    // Grass base with variation
    ctx.fillStyle = '#4f7340';
    ctx.fillRect(0, 0, texSize, texSize);
    for (let i = 0; i < 6500; i++) {
      const x = Math.random() * texSize;
      const y = Math.random() * texSize;
      const r = Math.random() * 9 + 2;
      const v = 0.35 + Math.random() * 0.4;
      ctx.fillStyle = `rgba(${Math.floor(60 * v + 30)},${Math.floor(110 * v + 50)},${Math.floor(50 * v + 25)},0.5)`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    const cellPx = texSize / GRID_SIZE;
    const roadPx = (ROAD_WIDTH / CELL_SIZE) * cellPx;
    const sidewalkPx = roadPx * 0.32;

    // ---- Plot interiors (concrete/lot color) ----
    ctx.fillStyle = '#7a7a78';
    for (let cx = 0; cx < GRID_SIZE; cx++) {
      for (let cz = 0; cz < GRID_SIZE; cz++) {
        const x = cx * cellPx + roadPx / 2 + sidewalkPx;
        const y = cz * cellPx + roadPx / 2 + sidewalkPx;
        const sz = cellPx - roadPx - 2 * sidewalkPx;
        ctx.fillRect(x, y, sz, sz);
      }
    }

    // ---- Sidewalks (lighter strips bordering roads) ----
    ctx.fillStyle = '#a8a9a7';
    for (let i = 0; i <= GRID_SIZE; i++) {
      const tx = i * cellPx;
      ctx.fillRect(tx - roadPx / 2 - sidewalkPx, 0, sidewalkPx, texSize);
      ctx.fillRect(tx + roadPx / 2, 0, sidewalkPx, texSize);
    }
    for (let j = 0; j <= GRID_SIZE; j++) {
      const ty = j * cellPx;
      ctx.fillRect(0, ty - roadPx / 2 - sidewalkPx, texSize, sidewalkPx);
      ctx.fillRect(0, ty + roadPx / 2, texSize, sidewalkPx);
    }

    // Sidewalk panel lines
    ctx.fillStyle = 'rgba(120,120,120,0.4)';
    const swStep = 18;
    for (let i = 0; i <= GRID_SIZE; i++) {
      const tx = i * cellPx;
      for (let s = 0; s < texSize; s += swStep) {
        ctx.fillRect(tx - roadPx / 2 - sidewalkPx, s, sidewalkPx, 1);
        ctx.fillRect(tx + roadPx / 2, s, sidewalkPx, 1);
      }
    }
    for (let j = 0; j <= GRID_SIZE; j++) {
      const ty = j * cellPx;
      for (let s = 0; s < texSize; s += swStep) {
        ctx.fillRect(s, ty - roadPx / 2 - sidewalkPx, 1, sidewalkPx);
        ctx.fillRect(s, ty + roadPx / 2, 1, sidewalkPx);
      }
    }

    // ---- Roads ----
    const roadGrad = ctx.createLinearGradient(0, 0, 0, texSize);
    roadGrad.addColorStop(0, '#21232a');
    roadGrad.addColorStop(1, '#1a1c22');
    ctx.fillStyle = roadGrad;
    for (let i = 0; i <= GRID_SIZE; i++) {
      const tx = i * cellPx;
      ctx.fillRect(tx - roadPx / 2, 0, roadPx, texSize);
    }
    for (let j = 0; j <= GRID_SIZE; j++) {
      const ty = j * cellPx;
      ctx.fillRect(0, ty - roadPx / 2, texSize, roadPx);
    }

    // Road noise (asphalt grain)
    for (let i = 0; i < 4000; i++) {
      const x = Math.random() * texSize;
      const y = Math.random() * texSize;
      const onRoadX = Math.abs(x % cellPx - 0) < roadPx / 2 || Math.abs(x % cellPx - cellPx) < roadPx / 2;
      const onRoadY = Math.abs(y % cellPx - 0) < roadPx / 2 || Math.abs(y % cellPx - cellPx) < roadPx / 2;
      if (onRoadX || onRoadY) {
        ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.04})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }
    }

    // ---- Center dashed lane lines on roads ----
    ctx.fillStyle = '#e8d878';
    const dashLen = 7;
    const gapLen = 8;
    const lineW = 1.5;
    for (let i = 0; i <= GRID_SIZE; i++) {
      const tx = i * cellPx;
      let y = 0;
      while (y < texSize) {
        ctx.fillRect(tx - lineW / 2, y, lineW, dashLen);
        y += dashLen + gapLen;
      }
    }
    for (let j = 0; j <= GRID_SIZE; j++) {
      const ty = j * cellPx;
      let x = 0;
      while (x < texSize) {
        ctx.fillRect(x, ty - lineW / 2, dashLen, lineW);
        x += dashLen + gapLen;
      }
    }

    // ---- Crosswalks at intersections ----
    ctx.fillStyle = '#e8e8e0';
    for (let i = 0; i <= GRID_SIZE; i++) {
      for (let j = 0; j <= GRID_SIZE; j++) {
        const tx = i * cellPx;
        const ty = j * cellPx;
        // Horizontal crosswalks (above/below intersection)
        for (let stripe = 0; stripe < 4; stripe++) {
          const off = (stripe - 1.5) * 2.5;
          // top
          ctx.fillRect(tx + roadPx / 2 + 1, ty - roadPx / 2 - sidewalkPx - 5 + off, 1.5, 4);
          // bottom
          ctx.fillRect(tx + roadPx / 2 + 1, ty + roadPx / 2 + sidewalkPx + 1 + off, 1.5, 4);
          // left
          ctx.fillRect(tx - roadPx / 2 - sidewalkPx - 5 + off, ty + roadPx / 2 + 1, 4, 1.5);
          // right
          ctx.fillRect(tx + roadPx / 2 + sidewalkPx + 1 + off, ty + roadPx / 2 + 1, 4, 1.5);
        }
      }
    }

    tex.update(false);
    return tex;
  }

  const cityGroundTex = createCityGroundTexture();
  const cityGroundMat = new BABYLON.StandardMaterial('cityGroundMat', scene);
  cityGroundMat.diffuseTexture = cityGroundTex;
  cityGroundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
  cityGroundMat.specularPower = 32;
  const cityGround = BABYLON.MeshBuilder.CreateGround('cityGround', {
    width: GRID_SIZE * CELL_SIZE,
    height: GRID_SIZE * CELL_SIZE
  }, scene);
  cityGround.material = cityGroundMat;
  cityGround.position.y = 0.005;

  /* =========================================================
     BUILDING TEXTURES & MATERIALS
     ========================================================= */
  const palettes = [
    { base: '#bcb5a8', mortar: '#9a9385', windowFrame: '#5a5345', name: 'Stone' },
    { base: '#7e8a99', mortar: '#5e6975', windowFrame: '#3a4350', name: 'SteelBlue' },
    { base: '#98785f', mortar: '#765a44', windowFrame: '#3e2d1f', name: 'Brick' },
    { base: '#5d6c7d', mortar: '#404e5e', windowFrame: '#252e3a', name: 'Slate' },
    { base: '#a8967a', mortar: '#8a785c', windowFrame: '#48402c', name: 'Sandstone' },
    { base: '#828f80', mortar: '#5e6c5e', windowFrame: '#2c352c', name: 'Olive' },
    { base: '#4f5e72', mortar: '#384459', windowFrame: '#1c2632', name: 'Midnight' },
    { base: '#c2ad8b', mortar: '#a08c6c', windowFrame: '#4d4029', name: 'Beige' },
    { base: '#d8d3c8', mortar: '#b5b0a4', windowFrame: '#5a554a', name: 'Cream' },
    { base: '#647888', mortar: '#475968', windowFrame: '#1f2a35', name: 'Steel' },
  ];

  function createBuildingMaterial(palette, idx) {
    const W = 256, H = 512;

    // ---- Diffuse (base + dark windows) ----
    const diff = new BABYLON.DynamicTexture('bd_' + idx, { width: W, height: H }, scene, true);
    const dc = diff.getContext();

    // Subtle vertical gradient on base
    const grad = dc.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, palette.base);
    grad.addColorStop(1, palette.mortar);
    dc.fillStyle = grad;
    dc.fillRect(0, 0, W, H);

    // Mortar/seam lines (very subtle)
    dc.fillStyle = palette.mortar;
    dc.globalAlpha = 0.4;
    for (let y = 0; y < H; y += 32) dc.fillRect(0, y, W, 1);
    for (let x = 0; x < W; x += 64) dc.fillRect(x, 0, 1, H);
    dc.globalAlpha = 1;

    // Speckle noise
    for (let i = 0; i < 800; i++) {
      dc.fillStyle = `rgba(0,0,0,${Math.random() * 0.06})`;
      dc.fillRect(Math.random() * W, Math.random() * H, 2, 2);
    }

    // Window grid
    const wW = 14, wH = 18;
    const stepX = 32, stepY = 38;
    const startX = (W - Math.floor((W - 16) / stepX) * stepX) / 2;
    const startY = 22;

    const litMap = []; // remember which windows are lit
    for (let y = startY, row = 0; y < H - 30; y += stepY, row++) {
      litMap[row] = [];
      for (let x = startX, col = 0; x < W - 14; x += stepX, col++) {
        // Window opening (dark)
        dc.fillStyle = '#0d0e12';
        dc.fillRect(x, y, wW, wH);
        // Window frame
        dc.fillStyle = palette.windowFrame;
        dc.fillRect(x - 1, y - 1, wW + 2, 1);
        dc.fillRect(x - 1, y + wH, wW + 2, 1);
        dc.fillRect(x - 1, y - 1, 1, wH + 2);
        dc.fillRect(x + wW, y - 1, 1, wH + 2);
        // Decide if lit
        litMap[row][col] = Math.random() > 0.32;
      }
    }
    diff.update(false);

    // ---- Emissive (only the lit windows glow at night) ----
    const emis = new BABYLON.DynamicTexture('be_' + idx, { width: W, height: H }, scene, true);
    const ec = emis.getContext();
    ec.fillStyle = '#000000';
    ec.fillRect(0, 0, W, H);
    for (let y = startY, row = 0; y < H - 30; y += stepY, row++) {
      for (let x = startX, col = 0; x < W - 14; x += stepX, col++) {
        if (litMap[row][col]) {
          // Vary window color slightly (warm yellows / cool whites)
          const warmth = Math.random();
          let r, g, b;
          if (warmth > 0.85) {
            // Cool white office light
            r = 220 + Math.random() * 20;
            g = 230 + Math.random() * 20;
            b = 240 + Math.random() * 15;
          } else {
            // Warm yellow lamp
            r = 245 + Math.random() * 10;
            g = 215 + Math.random() * 25;
            b = 130 + Math.random() * 50;
          }
          ec.fillStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
          ec.fillRect(x, y, wW, wH);
        }
      }
    }
    emis.update(false);

    const mat = new BABYLON.StandardMaterial('bmat_' + idx, scene);
    mat.diffuseTexture = diff;
    mat.emissiveTexture = emis;
    mat.specularColor = new BABYLON.Color3(0.08, 0.08, 0.1);
    mat.specularPower = 64;
    mat.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);
    mat.ambientColor = new BABYLON.Color3(0.6, 0.6, 0.6);
    return mat;
  }

  const buildingMats = palettes.map((p, i) => createBuildingMaterial(p, i));

  // Roof material
  const roofMat = new BABYLON.StandardMaterial('roofMat', scene);
  roofMat.diffuseColor = new BABYLON.Color3(0.22, 0.22, 0.24);
  roofMat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);

  // Roof accessory color variants (for AC units, water towers etc)
  const roofAccessoryMat = new BABYLON.StandardMaterial('roofAccMat', scene);
  roofAccessoryMat.diffuseColor = new BABYLON.Color3(0.45, 0.42, 0.4);
  roofAccessoryMat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);

  // Tree materials
  const trunkMat = new BABYLON.StandardMaterial('trunkMat', scene);
  trunkMat.diffuseColor = new BABYLON.Color3(0.32, 0.21, 0.12);
  trunkMat.specularColor = new BABYLON.Color3(0, 0, 0);
  const foliageMat = new BABYLON.StandardMaterial('foliageMat', scene);
  foliageMat.diffuseColor = new BABYLON.Color3(0.22, 0.45, 0.22);
  foliageMat.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);
  const foliageMat2 = new BABYLON.StandardMaterial('foliageMat2', scene);
  foliageMat2.diffuseColor = new BABYLON.Color3(0.30, 0.52, 0.25);
  foliageMat2.specularColor = new BABYLON.Color3(0.05, 0.1, 0.05);

  // Vehicle paints
  const vehicleColors = [
    [0.85, 0.18, 0.20],  // candy red
    [0.16, 0.36, 0.78],  // royal blue
    [0.95, 0.96, 0.97],  // arctic white
    [0.10, 0.10, 0.12],  // jet black
    [0.96, 0.78, 0.18],  // taxi yellow
    [0.18, 0.52, 0.32],  // forest green
    [0.65, 0.66, 0.70],  // silver
    [0.88, 0.45, 0.10],  // burnt orange
    [0.42, 0.18, 0.55],  // deep purple
    [0.90, 0.90, 0.90],  // pearl
  ];
  const vehicleMats = vehicleColors.map((c, i) => {
    const m = new BABYLON.StandardMaterial('vmat_' + i, scene);
    m.diffuseColor = new BABYLON.Color3(c[0], c[1], c[2]);
    m.specularColor = new BABYLON.Color3(0.45, 0.45, 0.45);
    m.specularPower = 96;
    return m;
  });
  const glassMat = new BABYLON.StandardMaterial('glassMat', scene);
  glassMat.diffuseColor = new BABYLON.Color3(0.15, 0.18, 0.22);
  glassMat.specularColor = new BABYLON.Color3(0.7, 0.7, 0.8);
  glassMat.specularPower = 256;
  glassMat.alpha = 0.85;
  const wheelMat = new BABYLON.StandardMaterial('wheelMat', scene);
  wheelMat.diffuseColor = new BABYLON.Color3(0.06, 0.06, 0.08);
  wheelMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
  const headlightMat = new BABYLON.StandardMaterial('headlightMat', scene);
  headlightMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.85);
  headlightMat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.25);

  // Pedestrian colors (jacket / shirt color)
  const pedColors = [
    [0.85, 0.32, 0.28],
    [0.22, 0.40, 0.78],
    [0.85, 0.70, 0.28],
    [0.42, 0.28, 0.62],
    [0.25, 0.65, 0.55],
    [0.78, 0.42, 0.65],
    [0.18, 0.18, 0.20],
    [0.92, 0.92, 0.88],
    [0.55, 0.62, 0.32],
    [0.92, 0.55, 0.20],
  ];
  const pedTopMats = pedColors.map((c, i) => {
    const m = new BABYLON.StandardMaterial('pmat_' + i, scene);
    m.diffuseColor = new BABYLON.Color3(c[0], c[1], c[2]);
    m.specularColor = new BABYLON.Color3(0, 0, 0);
    return m;
  });
  const pedBottomMat = new BABYLON.StandardMaterial('pBottomMat', scene);
  pedBottomMat.diffuseColor = new BABYLON.Color3(0.15, 0.18, 0.25);
  pedBottomMat.specularColor = new BABYLON.Color3(0, 0, 0);
  const skinMat = new BABYLON.StandardMaterial('skinMat', scene);
  skinMat.diffuseColor = new BABYLON.Color3(0.78, 0.62, 0.52);
  skinMat.specularColor = new BABYLON.Color3(0, 0, 0);

  /* =========================================================
     COORDINATE HELPERS
     ========================================================= */
  // Intersection (i, j) where i, j ∈ [0, GRID_SIZE]
  function intersectionToWorld(i, j) {
    return {
      x: -HALF_GRID + i * CELL_SIZE,
      z: -HALF_GRID + j * CELL_SIZE
    };
  }
  // Cell (cx, cz) where cx, cz ∈ [0, GRID_SIZE-1]
  function cellToWorld(cx, cz) {
    return {
      x: -HALF_GRID + (cx + 0.5) * CELL_SIZE,
      z: -HALF_GRID + (cz + 0.5) * CELL_SIZE
    };
  }
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
  function easeInCubic(t) { return t * t * t; }
  function easeOutBack(t) {
    const c1 = 1.4, c3 = c1 + 1;
    return 1 + c1 * Math.pow(t - 1, 3) + c3 * Math.pow(t - 1, 2);
  }

  /* =========================================================
     BUILDING
     ========================================================= */
  class Building {
    constructor(cx, cz) {
      this.cx = cx;
      this.cz = cz;
      const center = cellToWorld(cx, cz);

      // Distance from city center → drives downtown skyline effect
      const dx = cx - (GRID_SIZE - 1) / 2;
      const dz = cz - (GRID_SIZE - 1) / 2;
      this.distFromCenter = Math.sqrt(dx * dx + dz * dz);
      const maxDist = Math.sqrt(2) * GRID_SIZE / 2;
      const downtown = Math.max(0, 1 - this.distFromCenter / maxDist * 1.3);

      // Footprint
      const innerSize = CELL_SIZE - ROAD_WIDTH - 0.55;
      const w = innerSize * (0.62 + Math.random() * 0.32);
      const d = innerSize * (0.62 + Math.random() * 0.32);
      this.w = w; this.d = d;

      // Height: tall in center, low at periphery
      const baseHeight = 1.4 + Math.random() * 2.2;
      const downtownBoost = downtown * downtown * (4 + Math.random() * 16);
      this.targetHeight = baseHeight + downtownBoost + (Math.random() < 0.1 ? 6 : 0);

      // Building style: occasional "podium + tower" for tall buildings
      const isTall = this.targetHeight > 12;
      const isPodium = isTall && Math.random() < 0.45;

      this.parts = [];

      // Main mesh (we scale Y over time, so build at unit height = 1)
      const matIdx = Math.floor(Math.random() * buildingMats.length);
      this.mainMat = buildingMats[matIdx];

      const main = BABYLON.MeshBuilder.CreateBox('bldg', {
        width: w, height: 1, depth: d,
        faceUV: this._buildFaceUV()
      }, scene);
      main.position.set(center.x, 0.5, center.z);
      main.material = this.mainMat;
      this.parts.push(main);
      this.main = main;

      // Roof cap
      const roof = BABYLON.MeshBuilder.CreateBox('roof', {
        width: w + 0.06, height: 0.12, depth: d + 0.06
      }, scene);
      roof.material = roofMat;
      roof.parent = main;
      roof.position.set(0, 0.5, 0); // local: top of unit cube
      this.parts.push(roof);

      // Optional podium (wider lower section)
      if (isPodium) {
        const podW = w + 0.5;
        const podD = d + 0.5;
        const podH = 1.2 + Math.random() * 1.2;
        const podium = BABYLON.MeshBuilder.CreateBox('podium', {
          width: podW, height: 1, depth: podD,
          faceUV: this._buildFaceUV()
        }, scene);
        podium.material = this.mainMat;
        podium.position.set(center.x, 0.5, center.z);
        podium.scaling.y = podH;
        podium.position.y = podH / 2;
        this.parts.push(podium);
        this.podiumHeight = podH;

        const podRoof = BABYLON.MeshBuilder.CreateBox('podRoof', {
          width: podW + 0.05, height: 0.08, depth: podD + 0.05
        }, scene);
        podRoof.material = roofMat;
        podRoof.position.set(center.x, podH + 0.04, center.z);
        this.parts.push(podRoof);
      } else {
        this.podiumHeight = 0;
      }

      // Roof accessories (water tower / AC) for tall buildings
      if (isTall && Math.random() < 0.7) {
        // Water tower
        const tower = BABYLON.MeshBuilder.CreateCylinder('tower', {
          diameter: Math.min(w, d) * 0.25, height: 0.5
        }, scene);
        tower.material = roofAccessoryMat;
        tower.parent = main;
        tower.position.set((Math.random() - 0.5) * w * 0.4, 0.75, (Math.random() - 0.5) * d * 0.4);
        this.parts.push(tower);

        // Tower legs
        const legSize = 0.04;
        for (let lx of [-1, 1]) for (let lz of [-1, 1]) {
          const leg = BABYLON.MeshBuilder.CreateBox('leg', {
            width: legSize, height: 0.25, depth: legSize
          }, scene);
          leg.material = roofMat;
          leg.parent = tower;
          leg.position.set(lx * (Math.min(w, d) * 0.1), -0.38, lz * (Math.min(w, d) * 0.1));
          this.parts.push(leg);
        }
      }
      if (this.targetHeight > 6 && Math.random() < 0.6) {
        // AC unit
        const ac = BABYLON.MeshBuilder.CreateBox('ac', {
          width: Math.min(w, d) * 0.18,
          height: 0.18,
          depth: Math.min(w, d) * 0.22
        }, scene);
        ac.material = roofAccessoryMat;
        ac.parent = main;
        ac.position.set((Math.random() - 0.5) * w * 0.4, 0.59, (Math.random() - 0.5) * d * 0.4);
        this.parts.push(ac);
      }

      // Antenna spire on very tall buildings
      if (this.targetHeight > 16 && Math.random() < 0.5) {
        const spire = BABYLON.MeshBuilder.CreateCylinder('spire', {
          diameterTop: 0.04, diameterBottom: 0.12, height: 1.5 + Math.random()
        }, scene);
        spire.material = roofMat;
        spire.parent = main;
        spire.position.set(0, 0.5 + spire.scaling.y * 0.75, 0);
        this.parts.push(spire);
      }

      // Animate growth
      main.scaling.y = 0.001;
      main.position.y = 0.0005;
      this.growing = true;
      this.growProgress = 0;
      this.shrinking = false;
      this.shrinkProgress = 0;
    }

    _buildFaceUV() {
      // Box has 6 faces. Default ordering: front(0), back(1), right(2), left(3), top(4), bottom(5)
      const sides = new BABYLON.Vector4(0, 0, 1, 1);
      const cap = new BABYLON.Vector4(0, 0, 0.04, 0.04); // tiny corner: solid base color, no windows
      return [sides, sides, sides, sides, cap, cap];
    }

    update(dt) {
      if (this.shrinking) {
        this.shrinkProgress += dt * 1.4;
        const t = clamp(this.shrinkProgress, 0, 1);
        const eased = easeInCubic(1 - t);
        const h = this.targetHeight * eased;
        this.main.scaling.y = Math.max(0.001, h);
        this.main.position.y = Math.max(0.0005, h / 2);
        if (t >= 1) {
          for (const p of this.parts) p.dispose();
          this.parts = [];
          this.disposed = true;
          return true;
        }
        return false;
      }
      if (this.growing) {
        this.growProgress += dt * 0.85;
        const t = clamp(this.growProgress, 0, 1);
        const eased = easeOutCubic(t);
        const h = this.targetHeight * eased;
        this.main.scaling.y = Math.max(0.001, h);
        this.main.position.y = Math.max(0.0005, h / 2);
        if (t >= 1) this.growing = false;
      }
      return false;
    }

    startShrink() {
      if (this.shrinking) return;
      this.shrinking = true;
      this.shrinkProgress = 0;
    }
  }

  /* =========================================================
     PARK (small green plot with trees)
     ========================================================= */
  class Park {
    constructor(cx, cz) {
      this.cx = cx; this.cz = cz;
      const center = cellToWorld(cx, cz);
      const innerSize = CELL_SIZE - ROAD_WIDTH - 0.4;

      this.parts = [];

      // Grass plot
      const plotMat = new BABYLON.StandardMaterial('plot_' + cx + '_' + cz, scene);
      plotMat.diffuseColor = new BABYLON.Color3(0.30, 0.50, 0.26);
      plotMat.specularColor = new BABYLON.Color3(0, 0, 0);

      const plot = BABYLON.MeshBuilder.CreateGround('plot', {
        width: innerSize, height: innerSize
      }, scene);
      plot.material = plotMat;
      plot.position.set(center.x, 0.025, center.z);
      this.parts.push(plot);

      // Trees
      const treeCount = 2 + Math.floor(Math.random() * 4);
      this.trees = [];
      for (let i = 0; i < treeCount; i++) {
        const tx = center.x + (Math.random() - 0.5) * innerSize * 0.7;
        const tz = center.z + (Math.random() - 0.5) * innerSize * 0.7;
        const tree = this._createTree(tx, tz);
        this.trees.push(tree);
      }

      this.growing = true;
      this.growProgress = 0;
      this.shrinking = false;
      this.shrinkProgress = 0;
    }

    _createTree(x, z) {
      const root = new BABYLON.TransformNode('treeRoot', scene);
      root.position.set(x, 0, z);

      const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', {
        diameterTop: 0.13, diameterBottom: 0.18, height: 0.55
      }, scene);
      trunk.material = trunkMat;
      trunk.position.y = 0.275;
      trunk.parent = root;

      const foliage = BABYLON.MeshBuilder.CreateSphere('foliage', {
        diameter: 0.85 + Math.random() * 0.4
      }, scene);
      foliage.material = Math.random() > 0.5 ? foliageMat : foliageMat2;
      foliage.position.y = 0.85;
      foliage.scaling.y = 1.15 + Math.random() * 0.2;
      foliage.parent = root;

      root.scaling.setAll(0.001);
      this.parts.push(trunk, foliage);
      return root;
    }

    update(dt) {
      if (this.shrinking) {
        this.shrinkProgress += dt * 1.6;
        const t = clamp(this.shrinkProgress, 0, 1);
        const s = (1 - easeInCubic(t));
        for (const tree of this.trees) tree.scaling.setAll(s);
        if (t >= 1) {
          for (const tree of this.trees) tree.dispose();
          for (const p of this.parts) p.dispose();
          this.disposed = true;
          return true;
        }
        return false;
      }
      if (this.growing) {
        this.growProgress += dt * 0.7;
        const t = clamp(this.growProgress, 0, 1);
        const eased = easeOutBack(t);
        for (const tree of this.trees) tree.scaling.setAll(eased);
        if (t >= 1) this.growing = false;
      }
      return false;
    }

    startShrink() {
      if (this.shrinking) return;
      this.shrinking = true;
      this.shrinkProgress = 0;
    }
  }

  /* =========================================================
     VEHICLE — drives along a road grid path
     ========================================================= */
  class Vehicle {
    constructor() {
      this.from = this._randomEdgeIntersection();
      this.to = this._pickNeighbor(this.from, null);
      this.progress = Math.random();
      this.speed = 2.4 + Math.random() * 1.6;

      // Build vehicle mesh (parented to root)
      this.root = new BABYLON.TransformNode('v_root', scene);

      const colorIdx = Math.floor(Math.random() * vehicleMats.length);
      const paintMat = vehicleMats[colorIdx];

      // Lower body
      this.body = BABYLON.MeshBuilder.CreateBox('vBody', {
        width: 0.7, height: 0.32, depth: 1.45
      }, scene);
      this.body.position.y = 0.20;
      this.body.material = paintMat;
      this.body.parent = this.root;

      // Cabin
      this.cabin = BABYLON.MeshBuilder.CreateBox('vCabin', {
        width: 0.62, height: 0.30, depth: 0.78
      }, scene);
      this.cabin.position.set(0, 0.51, -0.08);
      this.cabin.material = paintMat;
      this.cabin.parent = this.root;

      // Windshield
      const windshield = BABYLON.MeshBuilder.CreateBox('windshield', {
        width: 0.61, height: 0.27, depth: 0.74
      }, scene);
      windshield.position.set(0, 0.515, -0.06);
      windshield.scaling.set(0.99, 0.95, 0.95);
      windshield.material = glassMat;
      windshield.parent = this.root;

      // Wheels
      const wheelGeom = { diameter: 0.22, height: 0.12 };
      this.wheels = [];
      for (const [wx, wz] of [[0.32, 0.45], [-0.32, 0.45], [0.32, -0.45], [-0.32, -0.45]]) {
        const w = BABYLON.MeshBuilder.CreateCylinder('wheel', wheelGeom, scene);
        w.material = wheelMat;
        w.parent = this.root;
        w.position.set(wx, 0.11, wz);
        w.rotation.z = Math.PI / 2;
        this.wheels.push(w);
      }

      // Headlights (small emissive nubs at front)
      for (const lx of [-0.22, 0.22]) {
        const hl = BABYLON.MeshBuilder.CreateBox('hl', {
          width: 0.10, height: 0.07, depth: 0.04
        }, scene);
        hl.material = headlightMat;
        hl.parent = this.root;
        hl.position.set(lx, 0.22, 0.74);
      }

      this.update(0);
    }

    _randomEdgeIntersection() {
      const edge = Math.floor(Math.random() * 4);
      if (edge === 0) return { i: 0, j: Math.floor(Math.random() * (GRID_SIZE + 1)) };
      if (edge === 1) return { i: GRID_SIZE, j: Math.floor(Math.random() * (GRID_SIZE + 1)) };
      if (edge === 2) return { i: Math.floor(Math.random() * (GRID_SIZE + 1)), j: 0 };
      return { i: Math.floor(Math.random() * (GRID_SIZE + 1)), j: GRID_SIZE };
    }

    _pickNeighbor(from, exclude) {
      const dirs = [];
      if (from.i > 0) dirs.push({ i: from.i - 1, j: from.j });
      if (from.i < GRID_SIZE) dirs.push({ i: from.i + 1, j: from.j });
      if (from.j > 0) dirs.push({ i: from.i, j: from.j - 1 });
      if (from.j < GRID_SIZE) dirs.push({ i: from.i, j: from.j + 1 });
      const valid = exclude
        ? dirs.filter(d => d.i !== exclude.i || d.j !== exclude.j)
        : dirs;

      // Bias toward continuing forward (60%) over turning
      if (exclude) {
        const fwd = { i: 2 * from.i - exclude.i, j: 2 * from.j - exclude.j };
        const continuing = valid.find(d => d.i === fwd.i && d.j === fwd.j);
        if (continuing && Math.random() < 0.6) return continuing;
      }
      if (valid.length === 0) return dirs[Math.floor(Math.random() * dirs.length)];
      return valid[Math.floor(Math.random() * valid.length)];
    }

    update(dt) {
      // Advance progress (segment length = CELL_SIZE)
      this.progress += this.speed * dt / CELL_SIZE;
      if (this.progress >= 1) {
        const newFrom = this.to;
        const newTo = this._pickNeighbor(newFrom, this.from);
        this.from = newFrom;
        this.to = newTo;
        this.progress = this.progress - 1;
      }

      const a = intersectionToWorld(this.from.i, this.from.j);
      const b = intersectionToWorld(this.to.i, this.to.j);
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz) || 1;
      const ndx = dx / len, ndz = dz / len;

      // Right-side lane offset
      const laneOffset = ROAD_WIDTH * 0.26;
      const ox = -ndz * laneOffset;
      const oz = ndx * laneOffset;

      this.root.position.x = a.x + dx * this.progress + ox;
      this.root.position.z = a.z + dz * this.progress + oz;
      this.root.position.y = 0;

      // Heading (atan2 of forward vector); wheels spin
      this.root.rotation.y = Math.atan2(ndx, ndz);
      const wheelSpin = this.speed * dt * 6;
      for (const w of this.wheels) w.rotation.x += wheelSpin;
    }

    destroy() {
      if (this.root) this.root.dispose(false, true);
    }
  }

  /* =========================================================
     PEDESTRIAN — walks along sidewalks
     ========================================================= */
  class Pedestrian {
    constructor() {
      this.from = this._randomEdgeIntersection();
      this.to = this._pickNeighbor(this.from, null);
      this.progress = Math.random();
      this.speed = 0.55 + Math.random() * 0.40;
      this.bobPhase = Math.random() * Math.PI * 2;
      this.sideOffset = Math.random() < 0.5 ? 1 : -1; // walk on either sidewalk

      this.root = new BABYLON.TransformNode('pedRoot', scene);

      const colorIdx = Math.floor(Math.random() * pedTopMats.length);

      // Pants
      const pants = BABYLON.MeshBuilder.CreateBox('pants', {
        width: 0.18, height: 0.30, depth: 0.16
      }, scene);
      pants.material = pedBottomMat;
      pants.position.y = 0.15;
      pants.parent = this.root;

      // Torso
      const torso = BABYLON.MeshBuilder.CreateBox('torso', {
        width: 0.22, height: 0.30, depth: 0.16
      }, scene);
      torso.material = pedTopMats[colorIdx];
      torso.position.y = 0.45;
      torso.parent = this.root;

      // Head
      const head = BABYLON.MeshBuilder.CreateSphere('head', {
        diameter: 0.16
      }, scene);
      head.material = skinMat;
      head.position.y = 0.69;
      head.parent = this.root;

      this.update(0);
    }

    _randomEdgeIntersection() {
      return {
        i: Math.floor(Math.random() * (GRID_SIZE + 1)),
        j: Math.floor(Math.random() * (GRID_SIZE + 1))
      };
    }

    _pickNeighbor(from, exclude) {
      const dirs = [];
      if (from.i > 0) dirs.push({ i: from.i - 1, j: from.j });
      if (from.i < GRID_SIZE) dirs.push({ i: from.i + 1, j: from.j });
      if (from.j > 0) dirs.push({ i: from.i, j: from.j - 1 });
      if (from.j < GRID_SIZE) dirs.push({ i: from.i, j: from.j + 1 });
      const valid = exclude
        ? dirs.filter(d => d.i !== exclude.i || d.j !== exclude.j)
        : dirs;
      if (valid.length === 0) return dirs[Math.floor(Math.random() * dirs.length)];
      return valid[Math.floor(Math.random() * valid.length)];
    }

    update(dt) {
      this.progress += this.speed * dt / CELL_SIZE;
      if (this.progress >= 1) {
        const newFrom = this.to;
        const newTo = this._pickNeighbor(newFrom, this.from);
        this.from = newFrom;
        this.to = newTo;
        this.progress = this.progress - 1;
        this.sideOffset = Math.random() < 0.5 ? 1 : -1;
      }

      const a = intersectionToWorld(this.from.i, this.from.j);
      const b = intersectionToWorld(this.to.i, this.to.j);
      const dx = b.x - a.x, dz = b.z - a.z;
      const len = Math.hypot(dx, dz) || 1;
      const ndx = dx / len, ndz = dz / len;

      // Sidewalk offset (further from road centerline than vehicle lane)
      const sidewalkOffset = ROAD_WIDTH * 0.55 + 0.18;
      const ox = -ndz * sidewalkOffset * this.sideOffset;
      const oz = ndx * sidewalkOffset * this.sideOffset;

      this.root.position.x = a.x + dx * this.progress + ox;
      this.root.position.z = a.z + dz * this.progress + oz;

      // Walking bob
      this.bobPhase += dt * this.speed * 12;
      this.root.position.y = Math.abs(Math.sin(this.bobPhase)) * 0.04;
      this.root.rotation.y = Math.atan2(ndx, ndz);
    }

    destroy() {
      if (this.root) this.root.dispose(false, true);
    }
  }

  /* =========================================================
     CITY — orchestrator
     ========================================================= */
  class City {
    constructor() {
      this.buildings = [];
      this.parks = [];
      this.vehicles = [];
      this.pedestrians = [];
      this.shrinking = []; // both buildings & parks pending dispose
      this.occupied = new Map();

      this.params = {
        maxBuildings: 120,
        vehicleCount: 40,
        pedestrianCount: 32,
        developmentSpeed: 1.0
      };

      this.spawnAccumulator = 0;
    }

    setMaxBuildings(n) {
      this.params.maxBuildings = Math.max(0, Math.floor(n));
      this._enforceBuildingCount();
    }

    setVehicleCount(n) {
      const target = Math.max(0, Math.floor(n));
      this.params.vehicleCount = target;
      while (this.vehicles.length < target) this.vehicles.push(new Vehicle());
      while (this.vehicles.length > target) this.vehicles.pop().destroy();
    }

    setPedestrianCount(n) {
      const target = Math.max(0, Math.floor(n));
      this.params.pedestrianCount = target;
      while (this.pedestrians.length < target) this.pedestrians.push(new Pedestrian());
      while (this.pedestrians.length > target) this.pedestrians.pop().destroy();
    }

    setDevSpeed(v) {
      this.params.developmentSpeed = Math.max(0, v);
    }

    _enforceBuildingCount() {
      // Total occupied structures (buildings + parks combined make population)
      const total = this.buildings.length + this.parks.length;
      if (total <= this.params.maxBuildings) return;

      // Sort all by distance from center descending → remove farthest first
      const all = [
        ...this.buildings.map(b => ({ kind: 'b', obj: b, d: b.distFromCenter })),
        ...this.parks.map(p => {
          const dx = p.cx - (GRID_SIZE - 1) / 2;
          const dz = p.cz - (GRID_SIZE - 1) / 2;
          return { kind: 'p', obj: p, d: Math.hypot(dx, dz) };
        })
      ];
      all.sort((a, b) => b.d - a.d);

      let toRemove = total - this.params.maxBuildings;
      for (const item of all) {
        if (toRemove <= 0) break;
        if (item.obj.shrinking) continue;
        item.obj.startShrink();
        const key = item.obj.cx + ',' + item.obj.cz;
        this.occupied.delete(key);
        if (item.kind === 'b') this.buildings = this.buildings.filter(b => b !== item.obj);
        else this.parks = this.parks.filter(p => p !== item.obj);
        this.shrinking.push(item.obj);
        toRemove--;
      }
    }

    _findEmptyCell() {
      // Bias toward center using two random samples (prefers central cells)
      for (let attempt = 0; attempt < 25; attempt++) {
        const center = (GRID_SIZE - 1) / 2;
        // Two-sample averaging gives a triangular distribution centered on middle
        const r1 = Math.random(), r2 = Math.random();
        const cx = clamp(Math.floor(center + (r1 + r2 - 1) * GRID_SIZE * 0.55), 0, GRID_SIZE - 1);
        const cz = clamp(Math.floor(center + (Math.random() + Math.random() - 1) * GRID_SIZE * 0.55), 0, GRID_SIZE - 1);
        const key = cx + ',' + cz;
        if (!this.occupied.has(key)) return { cx, cz };
      }
      // Fallback: linear scan
      for (let cx = 0; cx < GRID_SIZE; cx++) {
        for (let cz = 0; cz < GRID_SIZE; cz++) {
          if (!this.occupied.has(cx + ',' + cz)) return { cx, cz };
        }
      }
      return null;
    }

    _spawnOne() {
      const total = this.buildings.length + this.parks.length;
      if (total >= this.params.maxBuildings) return;
      const cell = this._findEmptyCell();
      if (!cell) return;
      this.occupied.set(cell.cx + ',' + cell.cz, true);

      // 13% chance of being a park
      if (Math.random() < 0.13) {
        this.parks.push(new Park(cell.cx, cell.cz));
      } else {
        this.buildings.push(new Building(cell.cx, cell.cz));
      }
    }

    reset() {
      for (const b of this.buildings) { b.startShrink(); this.shrinking.push(b); }
      for (const p of this.parks)     { p.startShrink(); this.shrinking.push(p); }
      this.buildings = [];
      this.parks = [];
      this.occupied.clear();
      this.spawnAccumulator = 0;
    }

    update(dt) {
      // Update all dynamic entities
      for (const v of this.vehicles) v.update(dt);
      for (const p of this.pedestrians) p.update(dt);
      for (const b of this.buildings) b.update(dt);
      for (const p of this.parks) p.update(dt);

      // Update shrinking entities, remove disposed ones
      for (let i = this.shrinking.length - 1; i >= 0; i--) {
        if (this.shrinking[i].update(dt)) this.shrinking.splice(i, 1);
      }

      // Spawn new structures based on dev speed
      this.spawnAccumulator += dt * this.params.developmentSpeed * 2.2;
      while (this.spawnAccumulator >= 1) {
        this.spawnAccumulator -= 1;
        if ((this.buildings.length + this.parks.length) < this.params.maxBuildings) {
          this._spawnOne();
        } else {
          this.spawnAccumulator = 0;
          break;
        }
      }
    }
  }

  /* =========================================================
     INSTANTIATE CITY
     ========================================================= */
  const city = new City();
  city.setVehicleCount(40);
  city.setPedestrianCount(32);

  // Seed initial growth so the city isn't empty on load
  for (let i = 0; i < 18; i++) city._spawnOne();
  // Mark initial buildings as already-grown (skip animation for initial seed)
  for (const b of city.buildings) {
    b.growProgress = 1;
    b.growing = false;
    b.main.scaling.y = b.targetHeight;
    b.main.position.y = b.targetHeight / 2;
  }
  for (const p of city.parks) {
    p.growProgress = 1;
    p.growing = false;
    for (const t of p.trees) t.scaling.setAll(1);
  }

  /* =========================================================
     DAY/NIGHT TOGGLE
     ========================================================= */
  let isNight = false;
  function setMode(night) {
    isNight = night;
    if (night) {
      scene.clearColor = skyNight.toColor4(1);
      scene.fogColor = fogNight;
      scene.fogDensity = 0.0058;
      hemi.intensity = 0.18;
      hemi.diffuse = new BABYLON.Color3(0.5, 0.55, 0.78);
      hemi.groundColor = new BABYLON.Color3(0.06, 0.07, 0.12);
      sun.intensity = 0.10;
      sun.diffuse = new BABYLON.Color3(0.5, 0.6, 0.85);
      outerMat.diffuseColor = new BABYLON.Color3(0.07, 0.10, 0.08);
      cityGroundMat.emissiveColor = new BABYLON.Color3(0.04, 0.04, 0.06);
      for (const m of buildingMats) m.emissiveColor = new BABYLON.Color3(1.05, 0.95, 0.78);
      headlightMat.emissiveColor = new BABYLON.Color3(0.95, 0.92, 0.78);
      foliageMat.diffuseColor = new BABYLON.Color3(0.10, 0.18, 0.10);
      foliageMat2.diffuseColor = new BABYLON.Color3(0.12, 0.20, 0.12);
    } else {
      scene.clearColor = skyDay.toColor4(1);
      scene.fogColor = fogDay;
      scene.fogDensity = 0.0042;
      hemi.intensity = 0.55;
      hemi.diffuse = new BABYLON.Color3(1, 0.97, 0.92);
      hemi.groundColor = new BABYLON.Color3(0.32, 0.35, 0.42);
      sun.intensity = 0.78;
      sun.diffuse = new BABYLON.Color3(1, 0.96, 0.86);
      outerMat.diffuseColor = new BABYLON.Color3(0.30, 0.42, 0.26);
      cityGroundMat.emissiveColor = new BABYLON.Color3(0, 0, 0);
      for (const m of buildingMats) m.emissiveColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      headlightMat.emissiveColor = new BABYLON.Color3(0.30, 0.30, 0.25);
      foliageMat.diffuseColor = new BABYLON.Color3(0.22, 0.45, 0.22);
      foliageMat2.diffuseColor = new BABYLON.Color3(0.30, 0.52, 0.25);
    }
  }

  /* =========================================================
     UI BINDING
     ========================================================= */
  const sizeSlider = document.getElementById('sizeSlider');
  const trafficSlider = document.getElementById('trafficSlider');
  const speedSlider = document.getElementById('speedSlider');
  const sizeVal = document.getElementById('sizeVal');
  const trafficVal = document.getElementById('trafficVal');
  const speedVal = document.getElementById('speedVal');
  const resetBtn = document.getElementById('resetBtn');
  const dayNightBtn = document.getElementById('dayNightBtn');

  const statBuildings = document.getElementById('statBuildings');
  const statVehicles = document.getElementById('statVehicles');
  const statPedestrians = document.getElementById('statPedestrians');
  const statFps = document.getElementById('statFps');

  function updateSliderTrack(slider) {
    const min = +slider.min, max = +slider.max, val = +slider.value;
    const p = ((val - min) / (max - min)) * 100;
    slider.style.setProperty('--p', p + '%');
  }

  sizeSlider.addEventListener('input', () => {
    const v = +sizeSlider.value;
    sizeVal.textContent = v;
    // Pedestrians scale proportionally with population (40% of building count)
    city.setMaxBuildings(v);
    city.setPedestrianCount(Math.max(8, Math.floor(v * 0.40)));
    updateSliderTrack(sizeSlider);
  });

  trafficSlider.addEventListener('input', () => {
    const v = +trafficSlider.value;
    trafficVal.textContent = v;
    city.setVehicleCount(v);
    updateSliderTrack(trafficSlider);
  });

  speedSlider.addEventListener('input', () => {
    const raw = +speedSlider.value;
    const speed = raw / 100;
    speedVal.textContent = speed.toFixed(1) + '×';
    city.setDevSpeed(speed);
    updateSliderTrack(speedSlider);
  });

  resetBtn.addEventListener('click', () => {
    city.reset();
  });

  dayNightBtn.addEventListener('click', () => {
    setMode(!isNight);
    dayNightBtn.innerHTML = isNight
      ? '<span class="btn-icon">☀</span>Day'
      : '<span class="btn-icon">☾</span>Night';
  });

  // Initial slider track fills
  updateSliderTrack(sizeSlider);
  updateSliderTrack(trafficSlider);
  updateSliderTrack(speedSlider);

  // Apply initial defaults
  city.setMaxBuildings(+sizeSlider.value);
  city.setPedestrianCount(Math.max(8, Math.floor(+sizeSlider.value * 0.40)));
  city.setDevSpeed(+speedSlider.value / 100);

  /* =========================================================
     COMPASS ROTATION (follows camera alpha)
     ========================================================= */
  const compassRotor = document.getElementById('compassRotor');

  /* =========================================================
     RENDER LOOP
     ========================================================= */
  const fpsHistory = [];
  let lastStatUpdate = 0;
  let lastTime = performance.now();

  engine.runRenderLoop(() => {
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    dt = Math.min(dt, 0.05); // clamp to avoid jumps when tab unfocused

    city.update(dt);
    scene.render();

    // Compass: ArcRotateCamera alpha=−PI/2 puts camera looking +Z (south);
    // we rotate the rotor to indicate camera heading
    if (compassRotor) {
      const deg = -(camera.alpha * 180 / Math.PI) - 90;
      compassRotor.setAttribute('transform', `rotate(${deg.toFixed(1)} 50 50)`);
    }

    // Stats throttled to 4 Hz
    if (now - lastStatUpdate > 250) {
      lastStatUpdate = now;
      const fps = engine.getFps();
      fpsHistory.push(fps);
      if (fpsHistory.length > 8) fpsHistory.shift();
      const avgFps = fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length;

      statBuildings.textContent = city.buildings.length + city.parks.length;
      statVehicles.textContent = city.vehicles.length;
      statPedestrians.textContent = city.pedestrians.length;
      statFps.textContent = avgFps.toFixed(0);
    }
  });

  window.addEventListener('resize', () => engine.resize());

  // Hide loading screen after first render
  scene.executeWhenReady(() => {
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 350);
  });

  })();
  </script>
</body>
