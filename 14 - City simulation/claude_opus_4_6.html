<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metropolis — City Growth Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/7.3.2/babylon.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0f14;--panel:rgba(13,15,20,0.92);--border:rgba(255,255,255,0.06);
  --text:#c8cdd8;--text2:#5a6070;--accent:#4ecdc4;
  --warm:#ff6b6b;--gold:#feca57;--blue:#54a0ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Azeret Mono',monospace;color:var(--text)}
canvas#c{width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none;z-index:10}

/* ═══ Stats ═══ */
#top-bar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.st{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 13px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(8px)}
.st-i{font-size:13px;opacity:.65}.st-l{font-size:7.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text2)}
.st-v{font-family:'Sora',sans-serif;font-size:15px;font-weight:700}
.st-v.c1{color:var(--accent)}.st-v.c2{color:var(--gold)}.st-v.c3{color:var(--blue)}

/* ═══ Controls ═══ */
#ctrl{position:absolute;top:14px;right:14px;width:215px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 15px;pointer-events:all;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:12px}
.ct{font-family:'Sora',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}
.cg{display:flex;flex-direction:column;gap:7px}
.cr{display:flex;flex-direction:column;gap:2px}
.cl{display:flex;justify-content:space-between;font-size:8.5px;color:var(--text2);letter-spacing:.8px;text-transform:uppercase}
.cv{font-family:'Sora',sans-serif;font-weight:600;color:var(--text);font-size:9.5px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.06);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
.br{display:flex;gap:5px}
.cb{flex:1;padding:6px 0;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:5px;color:var(--text2);font-family:'Azeret Mono',monospace;font-size:8.5px;letter-spacing:1px;cursor:pointer;transition:.15s;text-align:center}
.cb:hover{border-color:var(--accent);color:var(--accent)}
.cb.on{background:rgba(78,205,196,.1);border-color:var(--accent);color:var(--accent)}

/* ═══ Title ═══ */
#ttl{position:absolute;top:14px;left:14px}
.tn{font-family:'Sora',sans-serif;font-size:17px;font-weight:800;letter-spacing:1px}
.ts{font-size:8.5px;color:var(--text2);letter-spacing:2px;margin-top:2px;text-transform:uppercase}

#hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:8.5px;color:rgba(90,96,112,.35);letter-spacing:1px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="ttl"><div class="tn">Metropolis</div><div class="ts">City Growth Simulation</div></div>
  <div id="top-bar">
    <div class="st"><span class="st-i">👥</span><div><div class="st-l">Population</div><div class="st-v c1" id="s-pop">0</div></div></div>
    <div class="st"><span class="st-i">🏢</span><div><div class="st-l">Buildings</div><div class="st-v c2" id="s-bld">0</div></div></div>
    <div class="st"><span class="st-i">🚗</span><div><div class="st-l">Vehicles</div><div class="st-v c3" id="s-veh">0</div></div></div>
    <div class="st"><span class="st-i">📅</span><div><div class="st-l">Year</div><div class="st-v" id="s-yr">2025</div></div></div>
  </div>
  <div id="ctrl">
    <div class="ct">Simulation</div>
    <div class="cg">
      <div class="cr"><div class="cl">Density <span class="cv" id="vd">50%</span></div><input type="range" min="10" max="100" value="50" id="sd"></div>
      <div class="cr"><div class="cl">Traffic <span class="cv" id="vt">50%</span></div><input type="range" min="5" max="100" value="50" id="st2"></div>
      <div class="cr"><div class="cl">Dev Speed <span class="cv" id="vs">1.0×</span></div><input type="range" min="1" max="50" value="10" id="ss"></div>
      <div class="cr"><div class="cl">Max Height <span class="cv" id="vh">30</span></div><input type="range" min="4" max="60" value="30" id="sh"></div>
    </div>
    <div class="ct" style="margin-top:2px">View</div>
    <div class="br">
      <div class="cb on" id="bd" onclick="setDayNight(false)">☀ Day</div>
      <div class="cb" id="bn" onclick="setDayNight(true)">🌙 Night</div>
    </div>
    <div class="br">
      <div class="cb" onclick="resetCity()">↺ Reset</div>
      <div class="cb" id="bp" onclick="togglePause()">⏸ Pause</div>
    </div>
  </div>
  <div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  METROPOLIS — 3D Growing City Simulation
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, true, {stencil:true});
const scene  = new BABYLON.Scene(engine);

const rr = (a,b) => a+Math.random()*(b-a);
const ri = (a,b) => Math.floor(rr(a,b+.999));
const pick = a => a[ri(0,a.length-1)];
const TAU = Math.PI*2;

// ┌──────────────────────────────┐
// │  GRID LAYOUT                 │
// └──────────────────────────────┘
const G     = 22;          // grid size G×G blocks
const BLK   = 4.0;         // world-units per block
const RD_W  = 0.9;         // road width
const PLOT  = BLK - RD_W;  // buildable plot
const HALF  = (G*BLK)/2;

// ┌──────────────────────────────┐
// │  SCENE                       │
// └──────────────────────────────┘
scene.clearColor = new BABYLON.Color4(.44,.60,.80,1);
scene.ambientColor = new BABYLON.Color3(.22,.24,.28);
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
scene.fogDensity = .005;
scene.fogColor = new BABYLON.Color3(.48,.60,.74);

const cam = new BABYLON.ArcRotateCamera('c',-Math.PI*.6,Math.PI/3.5,70,BABYLON.Vector3.Zero(),scene);
cam.attachControl(canvas,true);
cam.lowerRadiusLimit=15; cam.upperRadiusLimit=180;
cam.lowerBetaLimit=.15; cam.upperBetaLimit=Math.PI/2.1;
cam.wheelPrecision=3; cam.panningSensibility=60;
cam.panningAxis=new BABYLON.Vector3(1,0,1);

// Lights
const sun = new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.4,-.85,.3).normalize(),scene);
sun.intensity=1.4; sun.diffuse=new BABYLON.Color3(1,.95,.85);
const hemi = new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);
hemi.intensity=.5; hemi.diffuse=new BABYLON.Color3(.65,.72,.85);
hemi.groundColor=new BABYLON.Color3(.18,.16,.14);

const shG = new BABYLON.ShadowGenerator(1024,sun);
shG.useBlurExponentialShadowMap=true; shG.blurKernel=16; shG.darkness=.35;

// ┌──────────────────────────────┐
// │  MATERIALS                   │
// └──────────────────────────────┘
function mkM(n,r,g,b,sp){
  const m=new BABYLON.StandardMaterial(n,scene);
  m.diffuseColor=new BABYLON.Color3(r,g,b);
  m.specularColor=new BABYLON.Color3(sp||.04,sp||.04,sp||.04);
  m.specularPower=10; return m;
}

const mGnd   = mkM('gnd',.30,.38,.24);
const mRoad  = mkM('rd',.17,.17,.19);
const mSide  = mkM('sw',.52,.50,.48);
const mLane  = mkM('ln',.60,.55,.28); mLane.emissiveColor=new BABYLON.Color3(.12,.11,.04);
const mTrunk = mkM('tk',.35,.25,.15);
const mPed   = mkM('pd',.75,.60,.48);

// Building palette
const BC = [
  [.75,.72,.68],[.62,.60,.58],[.50,.52,.58],[.68,.55,.45],[.55,.48,.42],
  [.45,.50,.58],[.72,.68,.62],[.58,.62,.68],[.48,.55,.62],[.65,.60,.55],
  [.52,.56,.62],[.42,.48,.56],[.35,.42,.55],[.78,.75,.70],[.60,.58,.55],
];
const bMats = BC.map((c,i) => mkM('b'+i,c[0],c[1],c[2],.12));

// Window glow
const mWin = mkM('wn',.95,.88,.55,.08);
mWin.emissiveColor=new BABYLON.Color3(.55,.48,.25);

// Car colors
const CC = [[.85,.25,.25],[.25,.45,.85],[.90,.90,.88],[.20,.20,.22],[.85,.70,.15],[.30,.65,.35],[.55,.25,.65],[.85,.50,.20],[.40,.40,.42]];
const cMats = CC.map((c,i) => mkM('c'+i,c[0],c[1],c[2],.25));

const mHL = mkM('hl',1,.95,.7);
mHL.emissiveColor = new BABYLON.Color3(.8,.7,.3);

// Streetlamp
const mPole = mkM('pole',.32,.32,.34,.1);
const mLamp = mkM('lamp',.95,.9,.7);
mLamp.emissiveColor = new BABYLON.Color3(0,0,0); // Set at night

// Park grass
const mPark = mkM('park',.28,.52,.22);

// ┌──────────────────────────────┐
// │  GROUND                      │
// └──────────────────────────────┘
const gnd = BABYLON.MeshBuilder.CreateGround('g',{width:G*BLK+40,height:G*BLK+40},scene);
gnd.position.y=-.05; gnd.material=mGnd; gnd.receiveShadows=true;

// ┌──────────────────────────────┐
// │  STATE                       │
// └──────────────────────────────┘
let buildings=[], vehicles=[], peds=[], treeMeshes=[], lampMeshes=[], roadMeshes=[];
let plotBuilt=[], plotZone=[];
let simTime=0, simYear=2025, paused=false, nightMode=false;
let devTimer=0, popDisplay=0;

// Params
let pDens=50, pTraffic=50, pSpeed=1.0, pMaxH=30;

// ┌──────────────────────────────┐
// │  ZONING                      │
// └──────────────────────────────┘
// Downtown center, commercial ring, residential outer, parks scattered
function zone(r,c){
  const d = Math.sqrt((r-G/2)**2+(c-G/2)**2)/(G/2);
  if(d<.25) return 'downtown';
  if(d<.55) return 'commercial';
  return 'residential';
}

function initPlots(){
  plotBuilt=[]; plotZone=[];
  for(let r=0;r<G;r++){
    plotBuilt[r]=[]; plotZone[r]=[];
    for(let c=0;c<G;c++){
      plotBuilt[r][c]=false;
      plotZone[r][c]=zone(r,c);
    }
  }
  // Designate ~8% as parks
  for(let i=0;i<Math.floor(G*G*.08);i++){
    const r=ri(0,G-1),c=ri(0,G-1);
    if(plotZone[r][c]!=='downtown') plotZone[r][c]='park';
  }
}

function plotCenter(r,c){
  return { x:-HALF+c*BLK+BLK/2, z:-HALF+r*BLK+BLK/2 };
}

function distC(r,c){ return Math.sqrt((r-G/2)**2+(c-G/2)**2)/(G/2); }

// ┌──────────────────────────────┐
// │  ROADS                       │
// └──────────────────────────────┘
function buildRoads(){
  roadMeshes.forEach(m=>m.dispose()); roadMeshes=[];

  // Horizontal
  for(let r=0;r<=G;r++){
    const z=-HALF+r*BLK;
    const rd=BABYLON.MeshBuilder.CreateBox('rh',{width:G*BLK,height:.06,depth:RD_W},scene);
    rd.position.set(0,.01,z); rd.material=mRoad; rd.receiveShadows=true; roadMeshes.push(rd);
    // Dashes
    for(let i=0;i<G;i++){
      if(i%2===0){
        const d=BABYLON.MeshBuilder.CreateBox('dh',{width:BLK*.35,height:.005,depth:.04},scene);
        d.position.set(-HALF+i*BLK+BLK/2,.045,z); d.material=mLane; roadMeshes.push(d);
      }
    }
  }
  // Vertical
  for(let c=0;c<=G;c++){
    const x=-HALF+c*BLK;
    const rd=BABYLON.MeshBuilder.CreateBox('rv',{width:RD_W,height:.06,depth:G*BLK},scene);
    rd.position.set(x,.01,0); rd.material=mRoad; rd.receiveShadows=true; roadMeshes.push(rd);
    for(let i=0;i<G;i++){
      if(i%2===0){
        const d=BABYLON.MeshBuilder.CreateBox('dv',{width:.04,height:.005,depth:BLK*.35},scene);
        d.position.set(x,.045,-HALF+i*BLK+BLK/2); d.material=mLane; roadMeshes.push(d);
      }
    }
  }
  // Intersection pads
  for(let r=0;r<=G;r++) for(let c=0;c<=G;c++){
    const p=BABYLON.MeshBuilder.CreateBox('ip',{width:RD_W+.08,height:.065,depth:RD_W+.08},scene);
    p.position.set(-HALF+c*BLK,.012,-HALF+r*BLK); p.material=mRoad; roadMeshes.push(p);
  }
  // Sidewalks
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    const {x:cx,z:cz}=plotCenter(r,c);
    const ps=PLOT/2, sw=.18;
    for(const [sx,sz,w,d] of [
      [cx,cz-ps-sw/2,PLOT,sw],[cx,cz+ps+sw/2,PLOT,sw],
      [cx-ps-sw/2,cz,sw,PLOT],[cx+ps+sw/2,cz,sw,PLOT]
    ]){
      const s=BABYLON.MeshBuilder.CreateBox('s',{width:w,height:.08,depth:d},scene);
      s.position.set(sx,.035,sz); s.material=mSide; s.receiveShadows=true; roadMeshes.push(s);
    }
  }
}

// ┌──────────────────────────────┐
// │  STREETLAMPS                 │
// └──────────────────────────────┘
function placeStreetlamps(){
  lampMeshes.forEach(l=>{l.pole.dispose();l.bulb.dispose();}); lampMeshes=[];
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    if((r+c)%3!==0) continue;
    const {x,z}=plotCenter(r,c);
    const off=PLOT/2+.35;
    // Place on one corner
    const px=x-off, pz=z-off;
    const pole=BABYLON.MeshBuilder.CreateCylinder('lp',{diameter:.06,height:2.2,tessellation:5},scene);
    pole.position.set(px,1.1,pz); pole.material=mPole;
    const bulb=BABYLON.MeshBuilder.CreateSphere('lb',{diameter:.2,segments:4},scene);
    bulb.position.set(px,2.25,pz); bulb.material=mLamp;
    lampMeshes.push({pole,bulb});
  }
}

// ┌──────────────────────────────┐
// │  BUILDINGS                   │
// └──────────────────────────────┘
function createBuilding(r,c){
  const {x:cx,z:cz}=plotCenter(r,c);
  const d=distC(r,c);
  const z_type=plotZone[r][c];

  let maxH;
  if(z_type==='downtown') maxH = pMaxH * rr(.6,1);
  else if(z_type==='commercial') maxH = pMaxH * rr(.25,.55);
  else maxH = pMaxH * rr(.08,.25);

  const h = Math.max(1.5, maxH);
  const fw = rr(PLOT*.45, PLOT*.82);
  const fd = rr(PLOT*.45, PLOT*.82);

  // Main body
  const body = BABYLON.MeshBuilder.CreateBox('bl',{width:fw,height:h,depth:fd},scene);
  body.position.set(cx+rr(-.15,.15), 0, cz+rr(-.15,.15));
  body.material = pick(bMats);
  body.receiveShadows=true;
  shG.addShadowCaster(body);
  body.scaling.y=.001; // Grow from ground

  // Window strips
  const wins=[];
  if(h>2.5){
    const floors=Math.min(Math.floor(h/1.1),20);
    for(let f=0;f<floors;f++){
      for(const [ox,oz,ww,wd] of [
        [0,-fd/2-.008,fw*.65,.008],
        [0,fd/2+.008,fw*.65,.008],
        [-fw/2-.008,0,.008,fd*.65],
        [fw/2+.008,0,.008,fd*.65],
      ]){
        const w=BABYLON.MeshBuilder.CreateBox('w',{width:ww,height:.22,depth:wd},scene);
        w.parent=body;
        w.position.set(ox, (-h/2+.7+f*1.1)/h, oz);
        w.material=mWin;
        w.isVisible=nightMode;
        wins.push(w);
      }
    }
  }

  // Roof structure on tall buildings
  if(h>10 && Math.random()<.6){
    const rf=BABYLON.MeshBuilder.CreateBox('rf',{width:fw*.35,height:h*.12,depth:fd*.35},scene);
    rf.parent=body; rf.position.y=.5+(h*.06)/h; rf.material=body.material;
    shG.addShadowCaster(rf);
  }
  // Antenna
  if(h>18 && Math.random()<.5){
    const a=BABYLON.MeshBuilder.CreateCylinder('an',{diameter:.05,height:1.5,tessellation:4},scene);
    a.parent=body; a.position.y=.5+.75/h; a.material=mPole;
  }

  // Foundation
  const base=BABYLON.MeshBuilder.CreateBox('fb',{width:fw+.15,height:.15,depth:fd+.15},scene);
  base.position.set(body.position.x,.08,body.position.z);
  base.material=mkM('fb_m',.42,.40,.38);
  base.receiveShadows=true;

  const bldg={mesh:body,base,r,c,targetH:h,curH:0,growing:true,wins,alive:true};
  buildings.push(bldg);
  return bldg;
}

function updateBuildings(dt){
  const spd=pSpeed*3.5;
  for(const b of buildings){
    if(!b.growing||!b.alive) continue;
    b.curH += spd*dt;
    if(b.curH>=b.targetH){ b.curH=b.targetH; b.growing=false; }
    const s=b.curH/b.targetH;
    b.mesh.scaling.y=Math.max(.001,s);
    b.mesh.position.y=(b.targetH*s)/2;
  }
}

// ┌──────────────────────────────┐
// │  PARKS & TREES               │
// └──────────────────────────────┘
function plantTree(x,z){
  const t=BABYLON.MeshBuilder.CreateCylinder('t',{diameterTop:.05,diameterBottom:.1,height:rr(.6,.9),tessellation:5},scene);
  t.position.set(x,.45,z); t.material=mTrunk; shG.addShadowCaster(t);
  const lm=mkM('lf',rr(.15,.25),rr(.38,.55),rr(.1,.18));
  const c=BABYLON.MeshBuilder.CreateSphere('lf',{diameter:rr(.6,1),segments:5},scene);
  c.position.set(x,rr(.9,1.2),z); c.scaling.y=.7; c.material=lm; shG.addShadowCaster(c);
  treeMeshes.push({trunk:t,canopy:c});
}

function buildParks(){
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    if(plotZone[r][c]!=='park') continue;
    const {x,z}=plotCenter(r,c);
    // Green lawn
    const lawn=BABYLON.MeshBuilder.CreateBox('pk',{width:PLOT-.2,height:.08,depth:PLOT-.2},scene);
    lawn.position.set(x,.04,z); lawn.material=mPark; lawn.receiveShadows=true;
    roadMeshes.push(lawn);
    // Trees
    for(let i=0;i<ri(3,6);i++){
      plantTree(x+rr(-1.1,1.1), z+rr(-1.1,1.1));
    }
  }
}

function plantStreetTrees(){
  for(let r=0;r<G;r++) for(let c=0;c<G;c++){
    if(plotZone[r][c]==='park') continue;
    if(Math.random()>.3) continue;
    const {x,z}=plotCenter(r,c);
    const off=PLOT/2+.3;
    const side=ri(0,3);
    const tx = side<2 ? x+rr(-.8,.8) : x + (side===2?-off:off);
    const tz = side>=2 ? z+rr(-.8,.8) : z + (side===0?-off:off);
    plantTree(tx,tz);
  }
}

// ┌──────────────────────────────┐
// │  VEHICLES                    │
// └──────────────────────────────┘
function spawnVehicle(){
  const horiz=Math.random()<.5;
  const lane=ri(0,G);
  const dir=Math.random()<.5?1:-1;
  const speed=rr(3.5,8);
  const offset=rr(-.18,.18);

  let x,z,vx,vz;
  if(horiz){
    z=-HALF+lane*BLK+offset; x=dir>0?-HALF-3:HALF+3; vx=dir*speed; vz=0;
  } else {
    x=-HALF+lane*BLK+offset; z=dir>0?-HALF-3:HALF+3; vx=0; vz=dir*speed;
  }

  const isBus=Math.random()<.06, isTruck=!isBus&&Math.random()<.08;
  const ln=isBus?1.6:isTruck?1.3:rr(.6,.95);
  const w=isBus?.55:isTruck?.5:rr(.35,.48);
  const h=isBus?.5:isTruck?.48:rr(.28,.38);

  const mesh=BABYLON.MeshBuilder.CreateBox('v',{width:w,height:h,depth:ln},scene);
  mesh.position.set(x,h/2+.06,z);
  if(isBus) mesh.material=mkM('bs',.85,.75,.15,.15);
  else if(isTruck) mesh.material=mkM('tr',.58,.56,.53,.08);
  else mesh.material=pick(cMats);

  mesh.rotation.y = horiz ? (dir>0?Math.PI/2:-Math.PI/2) : (dir>0?0:Math.PI);

  // Headlights
  const hls=[];
  for(const sx of [-.3,.3]){
    const hl=BABYLON.MeshBuilder.CreateBox('hl',{width:.07,height:.05,depth:.015},scene);
    hl.parent=mesh; hl.position.set(sx*w,0,ln/2+.008); hl.material=mHL;
    hl.isVisible=nightMode; hls.push(hl);
  }
  // Tail lights (red)
  const mTail=mkM('tl',.85,.1,.1); mTail.emissiveColor=new BABYLON.Color3(.4,.02,.02);
  for(const sx of [-.3,.3]){
    const tl=BABYLON.MeshBuilder.CreateBox('tl',{width:.06,height:.04,depth:.01},scene);
    tl.parent=mesh; tl.position.set(sx*w,-.02,-ln/2-.005); tl.material=mTail;
  }

  shG.addShadowCaster(mesh);
  vehicles.push({mesh,x,z,vx,vz,speed,horiz,dir,alive:true,hls,wait:0});
}

function updateVehicles(dt){
  for(let i=vehicles.length-1;i>=0;i--){
    const v=vehicles[i];
    if(v.wait>0){ v.wait-=dt; continue; }

    // Check for vehicle ahead — simple distance check to prevent pile-ups
    let blocked=false;
    for(let j=0;j<vehicles.length;j++){
      if(i===j) continue;
      const o=vehicles[j];
      const dx=o.x-v.x, dz=o.z-v.z;
      const dist=Math.sqrt(dx*dx+dz*dz);
      if(dist<1.8){
        // Check if other vehicle is ahead of us
        const dot=dx*v.vx+dz*v.vz;
        if(dot>0){ blocked=true; break; }
      }
    }

    if(!blocked){
      // Intersection pause
      const gx=(v.x+HALF)/BLK, gz=(v.z+HALF)/BLK;
      const nearInt=Math.abs(gx-Math.round(gx))<.12 && Math.abs(gz-Math.round(gz))<.12;
      if(nearInt && Math.random()<.002) v.wait=rr(.4,1.8);

      v.x+=v.vx*dt; v.z+=v.vz*dt;
      v.mesh.position.x=v.x; v.mesh.position.z=v.z;
    }

    if(v.x<-HALF-12||v.x>HALF+12||v.z<-HALF-12||v.z>HALF+12){
      v.mesh.dispose(); vehicles.splice(i,1);
    }
  }
}

// ┌──────────────────────────────┐
// │  PEDESTRIANS                 │
// └──────────────────────────────┘
function spawnPed(){
  const r=ri(0,G-1),c=ri(0,G-1);
  const {x:cx,z:cz}=plotCenter(r,c);
  const off=PLOT/2+.1;
  const s=ri(0,3);
  const x=s<2?cx+rr(-off,off):(s===2?cx-off:cx+off);
  const z=s>=2?cz+rr(-off,off):(s===0?cz-off:cz+off);

  const mesh=BABYLON.MeshBuilder.CreateCylinder('p',{diameter:.10,height:.32,tessellation:5},scene);
  mesh.position.set(x,.2,z);
  // Varied skin/clothing
  mesh.material=mkM('pm',rr(.5,.85),rr(.35,.65),rr(.25,.55));
  const head=BABYLON.MeshBuilder.CreateSphere('ph',{diameter:.1,segments:3},scene);
  head.parent=mesh; head.position.y=.2; head.material=mPed;

  const speed=rr(.4,1.3), angle=rr(0,TAU);
  peds.push({mesh,x,z,vx:Math.cos(angle)*speed,vz:Math.sin(angle)*speed,alive:true,life:rr(10,30),ct:rr(1,4)});
}

function updatePeds(dt){
  for(let i=peds.length-1;i>=0;i--){
    const p=peds[i];
    p.life-=dt;
    if(p.life<=0){ p.mesh.dispose(); peds.splice(i,1); continue; }
    p.ct-=dt;
    if(p.ct<=0){
      const a=rr(0,TAU), s=rr(.4,1.3);
      p.vx=Math.cos(a)*s; p.vz=Math.sin(a)*s; p.ct=rr(1,4);
    }
    p.x+=p.vx*dt; p.z+=p.vz*dt;
    p.x=Math.max(-HALF+1,Math.min(HALF-1,p.x));
    p.z=Math.max(-HALF+1,Math.min(HALF-1,p.z));
    p.mesh.position.x=p.x; p.mesh.position.z=p.z;
  }
}

// ┌──────────────────────────────┐
// │  DEVELOPMENT ENGINE          │
// └──────────────────────────────┘
function getTargetBldgs(){ return Math.floor((pDens/100)*G*G*.92); } // 92% since parks take ~8%
function getTargetVeh(){ return Math.floor((pTraffic/100)*70); }
function getTargetPed(){ return Math.floor((pTraffic/100)*100); }

function develop(dt){
  devTimer+=dt*pSpeed;
  const target=getTargetBldgs();
  const cur=buildings.filter(b=>b.alive).length;

  // Build toward target
  if(devTimer>.25 && cur<target){
    devTimer=0;
    let cands=[];
    for(let r=0;r<G;r++) for(let c=0;c<G;c++){
      if(!plotBuilt[r][c] && plotZone[r][c]!=='park')
        cands.push({r,c,d:distC(r,c)});
    }
    if(cands.length===0) return;
    cands.sort((a,b)=>a.d-b.d);
    const pool=cands.slice(0,Math.max(3,Math.floor(cands.length*.25)));
    const ch=pick(pool);
    plotBuilt[ch.r][ch.c]=true;
    createBuilding(ch.r,ch.c);
  }

  // Remove if over
  if(cur>target+5){
    const b=buildings[buildings.length-1];
    if(b){ b.mesh.dispose(); b.base.dispose(); b.alive=false; plotBuilt[b.r][b.c]=false; buildings.pop(); }
  }

  // Vehicles
  if(vehicles.length<getTargetVeh() && Math.random()<.12) spawnVehicle();

  // Peds
  if(peds.length<getTargetPed() && Math.random()<.10) spawnPed();

  simTime+=dt*pSpeed*.5;
  simYear=2025+Math.floor(simTime);
}

// ┌──────────────────────────────┐
// │  DAY / NIGHT                 │
// └──────────────────────────────┘
function setDayNight(night){
  nightMode=night;
  document.getElementById('bd').classList.toggle('on',!night);
  document.getElementById('bn').classList.toggle('on',night);

  if(night){
    scene.clearColor=new BABYLON.Color4(.03,.04,.09,1);
    scene.fogColor=new BABYLON.Color3(.04,.05,.10);
    sun.intensity=.12; sun.diffuse=new BABYLON.Color3(.25,.30,.45);
    hemi.intensity=.10; hemi.diffuse=new BABYLON.Color3(.12,.15,.28);
    hemi.groundColor=new BABYLON.Color3(.02,.02,.04);
    shG.darkness=.7;
    mLamp.emissiveColor=new BABYLON.Color3(.7,.6,.35);
  } else {
    scene.clearColor=new BABYLON.Color4(.44,.60,.80,1);
    scene.fogColor=new BABYLON.Color3(.48,.60,.74);
    sun.intensity=1.4; sun.diffuse=new BABYLON.Color3(1,.95,.85);
    hemi.intensity=.5; hemi.diffuse=new BABYLON.Color3(.65,.72,.85);
    hemi.groundColor=new BABYLON.Color3(.18,.16,.14);
    shG.darkness=.35;
    mLamp.emissiveColor=new BABYLON.Color3(0,0,0);
  }
  // Windows
  for(const b of buildings) for(const w of b.wins) w.isVisible=night;
  // Headlights
  for(const v of vehicles) for(const h of v.hls) h.isVisible=night;
  // Lamp glow — add point lights in night mode would be too expensive,
  // so we use emissive material which we already toggled above
}
window.setDayNight=setDayNight;

// ┌──────────────────────────────┐
// │  HUD                         │
// └──────────────────────────────┘
let hudT=0;
function updateHUD(){
  const bc=buildings.filter(b=>b.alive).length;
  const targetPop=bc*ri(18,42);
  // Smooth population counter
  popDisplay+=(targetPop-popDisplay)*.1;
  document.getElementById('s-pop').textContent=Math.round(popDisplay).toLocaleString();
  document.getElementById('s-bld').textContent=bc;
  document.getElementById('s-veh').textContent=vehicles.length;
  document.getElementById('s-yr').textContent=simYear;
}

// ┌──────────────────────────────┐
// │  SLIDERS                     │
// └──────────────────────────────┘
function bind(sid,vid,fmt,fn){
  const s=document.getElementById(sid),v=document.getElementById(vid);
  const up=()=>{const n=parseFloat(s.value);v.textContent=fmt(n);fn(n);};
  s.addEventListener('input',up); up();
}
bind('sd','vd',v=>v+'%',v=>{pDens=v;});
bind('st2','vt',v=>v+'%',v=>{pTraffic=v;});
bind('ss','vs',v=>(v/10).toFixed(1)+'×',v=>{pSpeed=v/10;});
bind('sh','vh',v=>v,v=>{pMaxH=v;});

// ┌──────────────────────────────┐
// │  CONTROLS                    │
// └──────────────────────────────┘
function togglePause(){
  paused=!paused;
  const b=document.getElementById('bp');
  b.textContent=paused?'▶ Play':'⏸ Pause';
  b.classList.toggle('on',paused);
}
window.togglePause=togglePause;

function resetCity(){
  buildings.forEach(b=>{b.mesh.dispose();b.base.dispose();});
  vehicles.forEach(v=>v.mesh.dispose());
  peds.forEach(p=>p.mesh.dispose());
  treeMeshes.forEach(t=>{t.trunk.dispose();t.canopy.dispose();});
  lampMeshes.forEach(l=>{l.pole.dispose();l.bulb.dispose();});
  buildings=[]; vehicles=[]; peds=[]; treeMeshes=[]; lampMeshes=[];
  simTime=0; simYear=2025; devTimer=0; popDisplay=0;
  initPlots(); buildParks(); plantStreetTrees(); placeStreetlamps();
}
window.resetCity=resetCity;

// ┌──────────────────────────────┐
// │  INIT & LOOP                 │
// └──────────────────────────────┘
buildRoads();
initPlots();
buildParks();
plantStreetTrees();
placeStreetlamps();

scene.registerBeforeRender(()=>{
  const dt=Math.min(engine.getDeltaTime()/1000,.05);
  if(!paused){
    develop(dt);
    updateBuildings(dt);
    updateVehicles(dt);
    updatePeds(dt);
  }
  // Tree sway
  for(const t of treeMeshes){
    if(t.baseY===undefined) t.baseY=t.canopy.position.y;
    t.canopy.position.y=t.baseY+Math.sin(simTime*2+t.canopy.position.x*.5)*.02;
  }

  hudT+=dt;
  if(hudT>.25){ hudT=0; updateHUD(); }
});

engine.runRenderLoop(()=>scene.render());
window.addEventListener('resize',()=>engine.resize());
</script>
