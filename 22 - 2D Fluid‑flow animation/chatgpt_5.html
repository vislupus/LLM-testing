<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>p5.js — Von Kármán Vortex Street (Lattice Boltzmann)</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { margin: 0; background: #0a0d12; color: #e2eef6; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    canvas { display: block; }
    #hud{position:fixed; left:10px; top:10px; background:rgba(12,16,22,.6); border:1px solid rgba(255,255,255,.08); padding:10px 12px; border-radius:12px; backdrop-filter: blur(6px); font-size:13px; line-height:1.35; max-width:min(760px,52vw)}
    #hud b{color:#fff}
    .kbd{display:inline-block; padding:0 6px; border-radius:7px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06); font-weight:700; font-size:12px}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
</head>
<body>
  <div id="hud"></div>
  <script>
    // --------------------------------------------------------------
    // 2D Lattice Boltzmann (D2Q9) vortex street in a channel
    // Periodic in x, no-slip walls on top/bottom, obstacle via bounce-back.
    // Body-force drives the flow; obstacle can be moved, resized, reshaped,
    // and rotated; visualize vorticity or speed, plus optional velocity arrows.
    // --------------------------------------------------------------

    // Grid / resolution ------------------------------------------------
    const cellSizeOptions = [7, 6, 5, 4, 3]; // px per cell
    let resIndex = 2; // default medium
    let nx=0, ny=0, N=0;

    // LBM fields (separate arrays for speed)
    let f0,f1,f2,f3,f4,f5,f6,f7,f8;     // distributions
    let g0,g1,g2,g3,g4,g5,g6,g7,g8;     // streamed (next)
    let ux, uy, rho;                     // macroscopic fields (for viz)
    let solid;                           // uint8 mask: 1 = solid

    // Constants for D2Q9
    const cx = new Int8Array([0, 1, 0,-1, 0, 1,-1,-1, 1]);
    const cy = new Int8Array([0, 0, 1, 0,-1, 1, 1,-1,-1]);
    const w  = new Float32Array([4/9, 1/9,1/9,1/9,1/9, 1/36,1/36,1/36,1/36]);
    const opp= new Int8Array([0,3,4,1,2,7,8,5,6]);

    // Physical parameters ---------------------------------------------
    let nu = 0.02;                 // kinematic viscosity (LB units)
    let tau = 3*nu + 0.5;          // relaxation time
    let omega = 1.0 / tau;         // relaxation rate
    let ax = 1.5e-5;               // constant acceleration in +x (body force)

    // Obstacle parameters ---------------------------------------------
    let obs = {
      cx: 0, cy: 0,  // center in grid coords
      rx: 8, ry: 16, // radii/half-sizes
      angle: 0.0,    // radians
      shape: 'ellipse', // 'circle' | 'ellipse' | 'rect'
      followMouse: false,
      dragging: false
    };

    // Rendering --------------------------------------------------------
    let img;                  // p5.Image for heatmap
    let showVectors = false;  // velocity arrows overlay
    let vizMode = 0;          // 0=vorticity, 1=speed, 2=pressure

    let paused=false;
    let uiEl;

    // Helpers ----------------------------------------------------------
    function computeGridForCanvas(){
      const cell = cellSizeOptions[resIndex];
      const nx_ = Math.max(160, Math.floor(windowWidth / cell));
      const ny_ = Math.max( 80, Math.floor(windowHeight/ cell));
      return {nx: nx_, ny: ny_};
    }
    function idx(i,j){ return i + nx*j; }

    function allocate(){
      const g = computeGridForCanvas(); nx = g.nx; ny = g.ny; N = nx*ny;
      f0=new Float32Array(N); f1=new Float32Array(N); f2=new Float32Array(N); f3=new Float32Array(N); f4=new Float32Array(N); f5=new Float32Array(N); f6=new Float32Array(N); f7=new Float32Array(N); f8=new Float32Array(N);
      g0=new Float32Array(N); g1=new Float32Array(N); g2=new Float32Array(N); g3=new Float32Array(N); g4=new Float32Array(N); g5=new Float32Array(N); g6=new Float32Array(N); g7=new Float32Array(N); g8=new Float32Array(N);
      ux=new Float32Array(N); uy=new Float32Array(N); rho=new Float32Array(N);
      solid=new Uint8Array(N);
      img = createImage(nx, ny);
      initFields();
      initChannelAndObstacle();
    }

    function initFields(){
      // Initialize at rest with rho=1
      for (let k=0;k<N;k++){
        const r=1.0; rho[k]=r; ux[k]=0; uy[k]=0;
        f0[k]=w[0]*r; f1[k]=w[1]*r; f2[k]=w[2]*r; f3[k]=w[3]*r; f4[k]=w[4]*r; f5[k]=w[5]*r; f6[k]=w[6]*r; f7[k]=w[7]*r; f8[k]=w[8]*r;
      }
      // Seed slight noise to break symmetry
      for (let i=0;i<Math.min(500, N);i++){
        const k=(Math.random()*N)|0; const eps=(Math.random()-0.5)*1e-4; f1[k]+=eps; f3[k]-=eps;
      }
    }

    function initChannelAndObstacle(){
      solid.fill(0);
      // Top/bottom walls = solid no-slip
      for (let i=0;i<nx;i++){ solid[idx(i,0)]=1; solid[idx(i,ny-1)]=1; }
      // Place obstacle initially near 1/3 width
      obs.cx = Math.floor(nx*0.33); obs.cy = Math.floor(ny*0.5);
      obs.rx = Math.max(6, Math.floor(ny*0.08));
      obs.ry = Math.max(10, Math.floor(ny*0.16));
      obs.angle = 0.0; obs.shape='ellipse';
      rasterizeObstacle();
    }

    function rasterizeObstacle(){
      // Clear inner solids but keep walls
      for (let j=1;j<ny-1;j++){
        for (let i=0;i<nx;i++) solid[idx(i,j)] = 0;
      }
      // Re-mark walls
      for (let i=0;i<nx;i++){ solid[idx(i,0)]=1; solid[idx(i,ny-1)]=1; }
      // Fill obstacle pixels
      const cxg=obs.cx, cyg=obs.cy; const cosA=Math.cos(obs.angle), sinA=Math.sin(obs.angle);
      const rx=obs.rx, ry=obs.ry;
      const minI=Math.max(0, cxg - rx - 2), maxI=Math.min(nx-1, cxg + rx + 2);
      const minJ=Math.max(1, cyg - ry - 2), maxJ=Math.min(ny-2, cyg + ry + 2);
      for (let j=minJ;j<=maxJ;j++){
        for (let i=minI;i<=maxI;i++){
          const x=i - cxg, y=j - cyg; // local coords
          const xr =  x*cosA + y*sinA;
          const yr = -x*sinA + y*cosA;
          let inside=false;
          if (obs.shape==='circle'){
            inside = (xr*xr + yr*yr) <= (rx*rx);
          } else if (obs.shape==='ellipse'){
            inside = (xr*xr)/(rx*rx) + (yr*yr)/(ry*ry) <= 1.0;
          } else { // rect
            inside = (Math.abs(xr) <= rx && Math.abs(yr) <= ry);
          }
          if (inside) solid[idx(i,j)] = 1;
        }
      }
    }

    // LBM step ---------------------------------------------------------
    function stepLBM(){
      // Precompute omega based on nu (could be changed live)
      tau = 3*nu + 0.5; omega = 1.0/tau;

      // Collision + macroscopic update
      for (let j=1;j<ny-1;j++){
        for (let i=0;i<nx;i++){
          const k = idx(i,j);
          if (solid[k]) continue; // skip solid nodes

          // Macros
          const f0k=f0[k], f1k=f1[k], f2k=f2[k], f3k=f3[k], f4k=f4[k], f5k=f5[k], f6k=f6[k], f7k=f7[k], f8k=f8[k];
          const r = f0k+f1k+f2k+f3k+f4k+f5k+f6k+f7k+f8k;
          let uxk = (f1k - f3k + f5k - f6k - f7k + f8k) / r;
          let uyk = (f2k - f4k + f5k + f6k - f7k - f8k) / r;

          // Guo forcing: F=(ax,0)
          const axLocal = ax;
          const uDotF = uxk*axLocal; // + uy*0
          const u2 = uxk*uxk + uyk*uyk;

          // Equilibrium and collision with forcing
          for (let dir=0; dir<9; dir++){
            const cux = cx[dir]*uxk + cy[dir]*uyk;
            const feq = w[dir] * r * (1 + 3*cux + 4.5*cux*cux - 1.5*u2);
            const cF  = cx[dir]*axLocal; // + cy*0
            const Fk  = (1 - 0.5*omega) * w[dir] * (3*cF + 9*cux*cF - 3*uDotF);
            // Write back in-place: small unroll for speed
            switch(dir){
              case 0: f0[k] = f0k - omega*(f0k - feq) + Fk; break;
              case 1: f1[k] = f1k - omega*(f1k - feq) + Fk; break;
              case 2: f2[k] = f2k - omega*(f2k - feq) + Fk; break;
              case 3: f3[k] = f3k - omega*(f3k - feq) + Fk; break;
              case 4: f4[k] = f4k - omega*(f4k - feq) + Fk; break;
              case 5: f5[k] = f5k - omega*(f5k - feq) + Fk; break;
              case 6: f6[k] = f6k - omega*(f6k - feq) + Fk; break;
              case 7: f7[k] = f7k - omega*(f7k - feq) + Fk; break;
              case 8: f8[k] = f8k - omega*(f8k - feq) + Fk; break;
            }
          }
        }
      }

      // Streaming with bounce-back against solids and walls; periodic in x
      // Clear g* arrays
      g0.fill(0); g1.fill(0); g2.fill(0); g3.fill(0); g4.fill(0); g5.fill(0); g6.fill(0); g7.fill(0); g8.fill(0);

      for (let j=0;j<ny;j++){
        for (let i=0;i<nx;i++){
          const k = idx(i,j);
          if (solid[k]) continue; // solids handled implicitly by neighbor bounce

          // For each direction, stream to neighbor or bounce back
          // dir 0 (rest) stays
          g0[k] += f0[k];

          // Precompute neighbor rows
          // dir 1: (i+1, j)
          let inb = (i+1<nx ? i+1 : 0); let jnb=j; let kn = idx(inb, jnb);
          if (solid[kn] || jnb===0 || jnb===ny-1) { g3[k] += f1[k]; } else { g1[kn] += f1[k]; }

          // dir 2: (i, j+1)
          inb = i; jnb = j+1; if (jnb>=ny) { /*outside top -> treated as wall*/ jnb = ny-1; }
          kn = idx(inb, jnb);
          if (j+1>=ny || solid[kn]) { g4[k] += f2[k]; } else { g2[kn] += f2[k]; }

          // dir 3: (i-1, j)
          inb = (i-1>=0 ? i-1 : nx-1); jnb=j; kn = idx(inb, jnb);
          if (solid[kn] || jnb===0 || jnb===ny-1) { g1[k] += f3[k]; } else { g3[kn] += f3[k]; }

          // dir 4: (i, j-1)
          inb = i; jnb = j-1; if (jnb<0) { jnb = 0; }
          kn = idx(inb, jnb);
          if (j-1<0 || solid[kn]) { g2[k] += f4[k]; } else { g4[kn] += f4[k]; }

          // dir 5: (i+1, j+1)
          inb = (i+1<nx ? i+1 : 0); jnb = j+1; if (jnb>=ny) jnb=ny-1; kn = idx(inb, jnb);
          if (j+1>=ny || solid[kn]) { g7[k] += f5[k]; } else { g5[kn] += f5[k]; }

          // dir 6: (i-1, j+1)
          inb = (i-1>=0 ? i-1 : nx-1); jnb=j+1; if (jnb>=ny) jnb=ny-1; kn = idx(inb, jnb);
          if (j+1>=ny || solid[kn]) { g8[k] += f6[k]; } else { g6[kn] += f6[k]; }

          // dir 7: (i-1, j-1)
          inb = (i-1>=0 ? i-1 : nx-1); jnb=j-1; if (jnb<0) jnb=0; kn = idx(inb, jnb);
          if (j-1<0 || solid[kn]) { g5[k] += f7[k]; } else { g7[kn] += f7[k]; }

          // dir 8: (i+1, j-1)
          inb = (i+1<nx ? i+1 : 0); jnb=j-1; if (jnb<0) jnb=0; kn = idx(inb, jnb);
          if (j-1<0 || solid[kn]) { g6[k] += f8[k]; } else { g8[kn] += f8[k]; }
        }
      }

      // Swap buffers: g* -> f*
      let t;
      t=f0; f0=g0; g0=t;
      t=f1; f1=g1; g1=t;
      t=f2; f2=g2; g2=t;
      t=f3; f3=g3; g3=t;
      t=f4; f4=g4; g4=t;
      t=f5; f5=g5; g5=t;
      t=f6; f6=g6; g6=t;
      t=f7; f7=g7; g7=t;
      t=f8; f8=g8; g8=t;
    }

    // Visualization ----------------------------------------------------
    function computeMacros(){
      for (let j=0;j<ny;j++){
        for (let i=0;i<nx;i++){
          const k=idx(i,j);
          const r = f0[k]+f1[k]+f2[k]+f3[k]+f4[k]+f5[k]+f6[k]+f7[k]+f8[k];
          rho[k]=r;
          ux[k] = (f1[k]-f3[k]+f5[k]-f6[k]-f7[k]+f8[k]) / r;
          uy[k] = (f2[k]-f4[k]+f5[k]+f6[k]-f7[k]-f8[k]) / r;
          if (solid[k]) { ux[k]=0; uy[k]=0; }
        }
      }
    }

    function renderField(){
      // vorticity via central differences on u (skip walls)
      img.loadPixels();
      let p=0;
      let vmax=0; // for adaptive scale (speed)
      let wmax=1e-6;
      // precompute some extremes for scaling
      for (let j=1;j<ny-1;j++){
        for (let i=0;i<nx;i++){
          const k=idx(i,j);
          const s = Math.hypot(ux[k], uy[k]); if (s>vmax) vmax=s;
        }
      }
      // compute and draw
      for (let j=0;j<ny;j++){
        for (let i=0;i<nx;i++){
          const k=idx(i,j);
          let r=0,g=0,b=0;
          if (solid[k]){ r=40; g=52; b=68; }
          else if (vizMode===0){
            const ip=(i+1<nx)?i+1:0, im=(i-1>=0)?i-1:nx-1;
            const jp=j+1, jm=j-1;
            const dudy = (jp<ny? ux[idx(i,jp)] : 0) - (jm>=0? ux[idx(i,jm)] : 0);
            const dvdx = ux[idx(ip,j)]?0:0; // placeholder to keep structure
            const dudx = (ux[idx(ip,j)] - ux[idx(im,j)]);
            const dvdy = (jp<ny? uy[idx(i,jp)] : 0) - (jm>=0? uy[idx(i,jm)] : 0);
            const dvdx2 = (uy[idx(ip,j)] - uy[idx(im,j)]);
            const w = dvdx2 - dudy; // ωz = dv/dx - du/dy
            const aw = Math.abs(w); if (aw>wmax) wmax=aw;
            // color map: blue (neg) -> black -> red (pos)
            const t = Math.max(-1, Math.min(1, w / (1e-6 + wmax)));
            if (t>=0){ r = 30 + Math.round(225*t); g = 40; b = 60 + Math.round(60*(1-t)); }
            else { const u = -t; r = 60; g = 40; b = 30 + Math.round(225*u); }
          } else if (vizMode===1){
            const s = Math.min(1, (Math.hypot(ux[k], uy[k])) / (1e-6 + vmax));
            // blue -> cyan -> green -> yellow -> red
            const col = heatColor(s);
            r=col[0]; g=col[1]; b=col[2];
          } else {
            // pressure ~ rho deviation
            const t = 0.5 + 3.0*(rho[k]-1.0); // scale for contrast
            const col = heatColor(Math.max(0, Math.min(1, t)));
            r=col[0]; g=col[1]; b=col[2];
          }
          img.pixels[p++] = r;
          img.pixels[p++] = g;
          img.pixels[p++] = b;
          img.pixels[p++] = 255;
        }
      }
      img.updatePixels();
      noSmooth(); image(img, 0, 0, width, height);

      // Overlay velocity vectors
      if (showVectors){
        const skip = Math.max(6, (nx/80)|0);
        const sx = width/nx, sy = height/ny;
        stroke(255, 160); strokeWeight(1);
        for (let j=1;j<ny-1;j+=skip){
          for (let i=0;i<nx;i+=skip){
            const k=idx(i,j); if (solid[k]) continue;
            const x=(i+0.5)*sx, y=(j+0.5)*sy;
            const vx=ux[k]*12*sx, vy=uy[k]*12*sy;
            line(x, y, x+vx, y+vy);
          }
        }
        noStroke();
      }

      // Obstacle outline
      drawObstacleOutline();
    }

    function heatColor(t){
      t=Math.max(0, Math.min(1, t));
      const stops=[[0,[0,0,130]],[.25,[0,120,255]],[.5,[0,200,0]],[.75,[255,220,0]],[1,[255,50,0]]];
      for (let s=1;s<stops.length;s++){
        if (t<=stops[s][0]){ const t0=stops[s-1][0], t1=stops[s][0]; const c0=stops[s-1][1], c1=stops[s][1]; const u=(t-t0)/(t1-t0); return [
          Math.round(c0[0]*(1-u)+c1[0]*u),
          Math.round(c0[1]*(1-u)+c1[1]*u),
          Math.round(c0[2]*(1-u)+c1[2]*u)
        ]; }
      }
      return [255,50,0];
    }

    function drawObstacleOutline(){
      const sx=width/nx, sy=height/ny; const cxp=obs.cx*sx, cyp=obs.cy*sy;
      push(); translate(cxp, cyp); rotate(obs.angle);
      noFill(); stroke('#9ad1ff'); strokeWeight(2);
      if (obs.shape==='circle'){
        ellipse(0,0, obs.rx*2*sx, obs.rx*2*sy);
      } else if (obs.shape==='ellipse'){
        ellipse(0,0, obs.rx*2*sx, obs.ry*2*sy);
      } else {
        rectMode(CENTER); rect(0,0, obs.rx*2*sx, obs.ry*2*sy, 3);
      }
      pop(); noStroke();
    }

    // p5 lifecycle -----------------------------------------------------
    function setup(){
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      allocate();
      uiEl=document.getElementById('hud');
      updateHUD();
    }

    function windowResized(){
      resizeCanvas(windowWidth, windowHeight);
      allocate();
    }

    function draw(){
      background('#06090f');

      // User interaction: drag / follow mouse
      if (obs.followMouse || obs.dragging){
        const gx = Math.max(2, Math.min(nx-3, Math.floor(mouseX/width*nx)));
        const gy = Math.max(2, Math.min(ny-3, Math.floor(mouseY/height*ny)));
        if (obs.cx!==gx || obs.cy!==gy){ obs.cx=gx; obs.cy=gy; rasterizeObstacle(); }
      }

      if (!paused){
        // Run multiple small steps per frame for stability if needed
        const steps = 1;
        for (let s=0;s<steps;s++) stepLBM();
      }

      computeMacros();
      renderField();

      if (frameCount%2===0) updateHUD();
    }

    // Interaction ------------------------------------------------------
    function mousePressed(){
      // Toggle dragging if near obstacle
      const sx=width/nx, sy=height/ny; const dx=(mouseX - obs.cx*sx)/sx; const dy=(mouseY - obs.cy*sy)/sy;
      // Transform into obstacle frame
      const cosA=Math.cos(-obs.angle), sinA=Math.sin(-obs.angle);
      const xr= dx*cosA + dy*sinA; const yr= -dx*sinA + dy*cosA;
      let inside=false;
      if (obs.shape==='circle') inside = (xr*xr + yr*yr) <= (obs.rx*obs.rx + 4);
      else if (obs.shape==='ellipse') inside = (xr*xr)/(obs.rx*obs.rx) + (yr*yr)/(obs.ry*obs.ry) <= 1.1;
      else inside = (Math.abs(xr)<=obs.rx+1 && Math.abs(yr)<=obs.ry+1);
      if (inside) obs.dragging = true;
    }
    function mouseReleased(){ obs.dragging=false; }
    window.addEventListener('contextmenu', e=>e.preventDefault());

    function mouseWheel(e){
      const d = e.deltaY>0 ? -1 : 1; // scroll up enlarge
      const s = (obs.shape==='circle'? 'uniform' : 'y');
      let scale = 1 + d*0.08;
      obs.rx = Math.max(3, Math.min(Math.floor(ny*0.4), Math.round(obs.rx*scale)));
      if (obs.shape!=='circle') obs.ry = Math.max(3, Math.min(Math.floor(ny*0.45), Math.round(obs.ry*scale)));
      if (obs.shape==='circle') obs.ry=obs.rx;
      rasterizeObstacle();
    }

    function keyPressed(){
      if (key===' ') paused=!paused;
      if (key==='V' || key==='v') showVectors=!showVectors;
      if (key==='H' || key==='h'){ resIndex=(resIndex+1)%cellSizeOptions.length; allocate(); }
      if (key==='F' || key==='f') obs.followMouse=!obs.followMouse;
      if (key==='R' || key==='r'){ initFields(); }

      if (key==='1') vizMode=0; if (key==='2') vizMode=1; if (key==='3') vizMode=2;

      if (key==='S' || key==='s'){ // cycle shape
        obs.shape = (obs.shape==='circle')?'ellipse':(obs.shape==='ellipse')?'rect':'circle';
        if (obs.shape==='circle'){ obs.ry=obs.rx; }
        rasterizeObstacle();
      }
      if (key==='A' || key==='a') { obs.angle -= 0.08; rasterizeObstacle(); }
      if (key==='D' || key==='d') { obs.angle += 0.08; rasterizeObstacle(); }
      if (key==='W' || key==='w') { obs.ry = Math.min(Math.floor(ny*0.45), obs.ry+1); rasterizeObstacle(); }
      if (key==='X' || key==='x') { obs.ry = Math.max(3, obs.ry-1); rasterizeObstacle(); }
      if (key==='Q' || key==='q') { obs.rx = Math.max(3, obs.rx-1); if (obs.shape==='circle') obs.ry=obs.rx; rasterizeObstacle(); }
      if (key==='E' || key==='e') { obs.rx = Math.min(Math.floor(ny*0.45), obs.rx+1); if (obs.shape==='circle') obs.ry=obs.rx; rasterizeObstacle(); }

      if (key==='+') { ax *= 1.4; }
      if (key==='-') { ax /= 1.4; }
      if (key===']') { nu *= 1.15; }
      if (key==='[') { nu /= 1.15; if (nu<0.002) nu=0.002; }

      updateHUD();
    }

    // HUD --------------------------------------------------------------
    function updateHUD(){
      const fps=(frameRate()||0).toFixed(0);
      const resLut=['L','M','H','U','X'];
      const ReEst = (1/nu) * 0.25 * (obs.ry*2) * Math.abs(ax)/Math.max(1e-6, omega); // informal indicator
      document.getElementById('hud').innerHTML = `
        <div><b>Von Kármán Vortex Street</b> — ${fps} FPS</div>
        <div>Grid <b>${nx}×${ny}</b> (${resLut[resIndex]}) · ν <b>${nu.toFixed(4)}</b> · τ <b>${(3*nu+0.5).toFixed(3)}</b> · accel <b>${ax.toExponential(2)}</b></div>
        <div>Obstacle: <b>${obs.shape}</b> · size <b>${obs.rx}×${obs.shape==='circle'?obs.rx:obs.ry}</b> · angle <b>${(obs.angle*180/Math.PI|0)}°</b> · follow <b>${obs.followMouse?'On':'Off'}</b></div>
        <div>Viz: <b>${['Vorticity','Speed','Pressure'][vizMode]}</b> · Vectors <b>${showVectors?'On':'Off'}</b></div>
        <div style="margin-top:6px; opacity:.95">
          Drag the shape to move it. <span class="kbd">Scroll</span> to scale. <span class="kbd">S</span> shape • <span class="kbd">A/D</span> rotate • <span class="kbd">Q/E</span> width • <span class="kbd">W/X</span> height • <span class="kbd">F</span> follow mouse
        </div>
        <div>
          <span class="kbd">1</span>/<span class="kbd">2</span>/<span class="kbd">3</span> viz · <span class="kbd">V</span> vectors · <span class="kbd">[</span>/<span class="kbd">]</span> viscosity · <span class="kbd">-</span>/<span class="kbd">+</span> drive · <span class="kbd">H</span> resolution · <span class="kbd">Space</span> pause · <span class="kbd">R</span> reset flow
        </div>
      `;
    }
  </script>
</body>
