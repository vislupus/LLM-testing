<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Von Kármán Vortex Street Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #c0d0e0;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 25, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(100, 200, 255, 0.12);
            border-radius: 14px;
            padding: 22px;
            width: 260px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        #controls::-webkit-scrollbar {
            width: 4px;
        }

        #controls::-webkit-scrollbar-thumb {
            background: rgba(100, 200, 255, 0.3);
            border-radius: 2px;
        }

        #controls h1 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #64b5f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #controls .subtitle {
            font-size: 10px;
            color: #556;
            margin-bottom: 18px;
        }

        .section {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 10px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .control-row {
            margin-bottom: 14px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 6px;
        }

        .control-row label span.value {
            color: #64ffda;
            font-weight: 600;
            font-size: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #64b5f6, #a78bfa);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(100, 181, 246, 0.4);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .toggle-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 6px;
            border: 1px solid rgba(100, 200, 255, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899aa;
            font-size: 9px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-btn:hover {
            background: rgba(100, 200, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.4);
        }

        .toggle-btn.active {
            background: rgba(100, 200, 255, 0.2);
            border-color: #64c8ff;
            color: #64ffda;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #64b5f6, #a78bfa);
            color: #1a1a1a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(100, 181, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #aabbcc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .instructions {
            font-size: 9px;
            color: #667788;
            line-height: 1.7;
        }

        .instructions .key {
            display: inline-block;
            background: rgba(100, 200, 255, 0.15);
            border: 1px solid rgba(100, 200, 255, 0.25);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 8px;
            color: #64ffda;
            margin: 0 2px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .stat {
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #64ffda;
        }

        .stat-label {
            font-size: 8px;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        #info {
            margin-top: 14px;
            padding: 10px;
            border-radius: 6px;
            font-size: 10px;
            text-align: center;
            background: rgba(100, 200, 255, 0.1);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }

        .hint {
            font-size: 8px;
            color: #556;
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="controls">
        <h1>VON KÁRMÁN VORTEX</h1>
        <div class="subtitle">Interactive Fluid Dynamics</div>

        <div class="section">
            <div class="section-title">Obstacle Shape</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="shapeCircle" onclick="setShape('circle')">Circle</button>
                <button class="toggle-btn" id="shapeEllipse" onclick="setShape('ellipse')">Ellipse</button>
                <button class="toggle-btn" id="shapeRect" onclick="setShape('rectangle')">Rect</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Obstacle Controls</div>
            <div class="control-row">
                <label>Size <span class="value" id="sizeVal">40</span></label>
                <input type="range" id="obstacleSize" min="15" max="100" value="40">
            </div>
            <div class="control-row">
                <label>Rotation <span class="value" id="rotationVal">0°</span></label>
                <input type="range" id="obstacleRotation" min="0" max="360" value="0">
            </div>
            <div class="control-row">
                <label>Aspect Ratio <span class="value" id="aspectVal">1.0</span></label>
                <input type="range" id="aspectRatio" min="1" max="40" value="10">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Flow Parameters</div>
            <div class="control-row">
                <label>Flow Speed <span class="value" id="flowVal">3.0</span></label>
                <input type="range" id="flowSpeed" min="1" max="15" value="3">
            </div>
            <div class="control-row">
                <label>Viscosity <span class="value" id="viscVal">0.0001</span></label>
                <input type="range" id="viscosity" min="0" max="20" value="0">
            </div>
            <div class="control-row">
                <label>Iterations <span class="value" id="iterVal">8</span></label>
                <input type="range" id="solverIter" min="2" max="20" value="8">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Visualization</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="vizVorticity" onclick="setViz('vorticity')">Curl</button>
                <button class="toggle-btn" id="vizVelocity" onclick="setViz('velocity')">Velocity</button>
                <button class="toggle-btn" id="vizDye" onclick="setViz('dye')">Dye</button>
            </div>
            <div class="control-row" style="margin-top: 12px;">
                <label>Field Density <span class="value" id="densityVal">2</span></label>
                <input type="range" id="fieldDensity" min="1" max="5" value="2">
            </div>
        </div>

        <div class="section">
            <button class="btn btn-secondary" onclick="togglePause()">Pause / Resume</button>
            <button class="btn btn-primary" onclick="resetSimulation()">Reset Flow</button>
        </div>

        <div class="section">
            <div class="instructions">
                <span class="key">Drag</span> Move obstacle<br>
                <span class="key">Scroll</span> Resize obstacle<br>
                <span class="key">Space</span> Pause/Resume<br>
                <span class="key">R</span> Reset
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="fps">60</div>
                <div class="stat-label">FPS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="reynolds">0</div>
                <div class="stat-label">Reynolds</div>
            </div>
        </div>

        <div id="info">Drag the obstacle to create vortices!</div>
        <div class="hint">Lower viscosity = more vortex shedding</div>
    </div>

    <script>
        // ============================================
        // NAVIER-STOKES FLUID SOLVER
        // ============================================

        // Grid parameters
        const N = 150;  // Grid size
        const SCALE = 4; // Visual scale
        const ITER = 8;  // Solver iterations

        // Fluid arrays
        let size = (N + 2) * (N + 2);
        let u, v, u0, v0;      // Velocity fields
        let dens, dens0;        // Dye/density
        let curl;              // Vorticity

        // Simulation parameters
        let dt = 0.1;
        let diffusion = 0.0001;
        let viscosity = 0.0001;
        let flowSpeed = 3.0;
        let iterations = 8;
        let vizMode = 'vorticity';
        let fieldDensity = 2;

        // Obstacle
        let obstacle = {
            x: 0,
            y: 0,
            size: 40,
            rotation: 0,
            shape: 'circle',
            aspectRatio: 1.0,
            dragging: false
        };

        // State
        let isPaused = false;
        let canvasWidth, canvasHeight;

        function setup() {
            canvasWidth = windowWidth;
            canvasHeight = windowHeight;

            let canvas = createCanvas(canvasWidth, canvasHeight);
            canvas.parent('canvas-container');
            pixelDensity(1);

            // Initialize obstacle position
            obstacle.x = width * 0.3;
            obstacle.y = height / 2;

            // Initialize arrays
            initArrays();

            // Set up UI
            setupUI();
        }

        function initArrays() {
            size = (N + 2) * (N + 2);
            u = new Float32Array(size);
            v = new Float32Array(size);
            u0 = new Float32Array(size);
            v0 = new Float32Array(size);
            dens = new Float32Array(size);
            dens0 = new Float32Array(size);
            curl = new Float32Array(size);

            // Add initial dye
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    if (i < 10) {
                        dens[IX(i, j)] = 1.0;
                    }
                }
            }
        }

        function IX(x, y) {
            return x + (N + 2) * y;
        }

        // ============================================
        // FLUID SOLVER FUNCTIONS
        // ============================================

        function addSource(x, x0, dt) {
            for (let i = 0; i < size; i++) {
                x[i] = x0[i];
            }
        }

        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
                x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
            }

            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
            x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
            x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
        }

        function lin_solve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;
            for (let k = 0; k < iterations; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        // Skip obstacle cells
                        if (isObstacle(i, j)) continue;

                        x[IX(i, j)] = (x0[IX(i, j)] + a * (
                            x[IX(i + 1, j)] + x[IX(i - 1, j)] +
                            x[IX(i, j + 1)] + x[IX(i, j - 1)]
                        )) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff) {
            let a = dt * diff * N * N;
            lin_solve(b, x, x0, a, 1 + 4 * a);
        }

        function advect(b, d, d0, velocX, velocY) {
            let i0, j0, i1, j1;
            let x, y, s0, t0, s1, t1;
            let dt0 = dt * N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    // Skip obstacle cells
                    if (isObstacle(i, j)) continue;

                    x = i - dt0 * velocX[IX(i, j)];
                    y = j - dt0 * velocY[IX(i, j)];

                    if (x < 0.5) x = 0.5;
                    if (x > N + 0.5) x = N + 0.5;
                    i0 = Math.floor(x);
                    i1 = i0 + 1;

                    if (y < 0.5) y = 0.5;
                    if (y > N + 0.5) y = N + 0.5;
                    j0 = Math.floor(y);
                    j1 = j0 + 1;

                    s1 = x - i0;
                    s0 = 1 - s1;
                    t1 = y - j0;
                    t0 = 1 - t1;

                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                                  s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function project(velocX, velocY, p, div) {
            let h = 1.0 / N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    // Skip obstacle cells
                    if (isObstacle(i, j)) continue;

                    div[IX(i, j)] = -0.5 * h * (
                        velocX[IX(i + 1, j)] - velocX[IX(i - 1, j)] +
                        velocY[IX(i, j + 1)] - velocY[IX(i, j - 1)]
                    );
                    p[IX(i, j)] = 0;
                }
            }

            set_bnd(0, div);
            set_bnd(0, p);
            lin_solve(0, p, div, 1, 4);

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    // Skip obstacle cells
                    if (isObstacle(i, j)) continue;

                    velocX[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h;
                    velocY[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h;
                }
            }

            set_bnd(1, velocX);
            set_bnd(2, velocY);
        }

        function calculateCurl() {
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let dv_dx = (v[IX(i + 1, j)] - v[IX(i - 1, j)]) * 0.5;
                    let du_dy = (u[IX(i, j + 1)] - u[IX(i, j - 1)]) * 0.5;
                    curl[IX(i, j)] = dv_dx - du_dy;
                }
            }
        }

        // ============================================
        // OBSTACLE HANDLING
        // ============================================

        function isObstacle(gridX, gridY) {
            // Convert grid to screen coordinates
            let sx = gridX * SCALE;
            let sy = gridY * SCALE;

            // Transform point to obstacle's local coordinate system
            let dx = sx - obstacle.x;
            let dy = sy - obstacle.y;

            // Apply inverse rotation
            let rad = -obstacle.rotation * Math.PI / 180;
            let localX = dx * Math.cos(rad) - dy * Math.sin(rad);
            let localY = dx * Math.sin(rad) + dy * Math.cos(rad);

            let halfSize = obstacle.size / 2;
            let halfAspect = halfSize * obstacle.aspectRatio;

            if (obstacle.shape === 'circle') {
                let dist = Math.sqrt(localX * localX + localY * localY);
                return dist < halfSize;
            } else if (obstacle.shape === 'ellipse') {
                let dist = (localX * localX) / (halfSize * halfSize) +
                           (localY * localY) / (halfAspect * halfAspect);
                return dist < 1;
            } else { // rectangle
                return Math.abs(localX) < halfSize && Math.abs(localY) < halfAspect;
            }
        }

        function applyObstacleBoundary() {
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    if (isObstacle(i, j)) {
                        u[IX(i, j)] = 0;
                        v[IX(i, j)] = 0;
                        dens[IX(i, j)] = 0;
                    }
                }
            }
        }

        function addInletFlow() {
            let inletWidth = N * 0.15;
            for (let j = 1; j <= N; j++) {
                // Add velocity at inlet (left side)
                let vx = flowSpeed;
                let vy = 0;

                // Add slight perturbation for vortex generation
                vy = (Math.random() - 0.5) * 0.3;

                u[IX(1, j)] = vx;
                v[IX(1, j)] = vy;

                // Add dye at inlet
                dens[IX(1, j)] = 1.0;
            }
        }

        // ============================================
        // SIMULATION STEP
        // ============================================

        function fluidStep() {
            // Update iterations from slider
            iterations = parseInt(document.getElementById('solverIter').value);

            // Add inlet flow
            addInletFlow();

            // Velocity step
            diffuse(1, u0, u, viscosity);
            diffuse(2, v0, v, viscosity);
            project(u0, v0, u, v);
            advect(1, u, u0, u0, v0);
            advect(2, v, v0, u0, v0);
            project(u, v, u0, v0);

            // Density/dye step
            diffuse(0, dens0, dens, diffusion);
            advect(0, dens, dens0, u, v);

            // Apply obstacle boundary conditions
            applyObstacleBoundary();

            // Calculate curl for visualization
            calculateCurl();
        }

        // ============================================
        // RENDERING
        // ============================================

        function draw() {
            background(10, 12, 18);

            if (!isPaused) {
                fluidStep();
            }

            // Render based on visualization mode
            if (vizMode === 'vorticity') {
                renderVorticity();
            } else if (vizMode === 'velocity') {
                renderVelocity();
            } else {
                renderDye();
            }

            // Draw obstacle
            drawObstacle();

            // Update stats
            if (frameCount % 10 === 0) {
                updateStats();
            }
        }

        function renderVorticity() {
            loadPixels();

            let maxCurl = 5.0;

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    let gx = Math.floor(px / SCALE);
                    let gy = Math.floor(py / SCALE);
                    gx = constrain(gx, 1, N);
                    gy = constrain(gy, 1, N);

                    let c = curl[IX(gx, gy)];
                    let t = constrain(c / maxCurl, -1, 1);

                    let r, g, b;
                    if (t > 0) {
                        // Positive curl (clockwise) - red/orange
                        r = Math.floor(255 * t);
                        g = Math.floor(80 * t);
                        b = 0;
                    } else {
                        // Negative curl (counter-clockwise) - blue/cyan
                        t = -t;
                        r = 0;
                        g = Math.floor(100 * t);
                        b = Math.floor(255 * t);
                    }

                    // Add some base darkness
                    r = Math.floor(r * 0.7 + 10);
                    g = Math.floor(g * 0.7 + 12);
                    b = Math.floor(b * 0.7 + 18);

                    let idx = (px + py * width) * 4;
                    pixels[idx] = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                }
            }

            updatePixels();
        }

        function renderVelocity() {
            background(10, 12, 18);

            stroke(100, 150, 200, 80);
            strokeWeight(1);

            let step = fieldDensity;
            let maxVel = 15;

            for (let j = 1; j <= N; j += step) {
                for (let i = 1; i <= N; i += step) {
                    if (isObstacle(i, j)) continue;

                    let vx = u[IX(i, j)];
                    let vy = v[IX(i, j)];
                    let speed = Math.sqrt(vx * vx + vy * vy);

                    if (speed > 0.5) {
                        let x = i * SCALE;
                        let y = j * SCALE;
                        let len = (speed / maxVel) * step * SCALE * 1.5;
                        len = Math.min(len, step * SCALE * 1.5);

                        let nx = vx / speed;
                        let ny = vy / speed;

                        // Color based on speed
                        let c = map(speed, 0, maxVel, 80, 255);
                        stroke(c, c + 50, 255, 150);

                        line(x, y, x + nx * len, y + ny * len);
                    }
                }
            }
        }

        function renderDye() {
            loadPixels();

            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    let gx = Math.floor(px / SCALE);
                    let gy = Math.floor(py / SCALE);
                    gx = constrain(gx, 1, N);
                    gy = constrain(gy, 1, N);

                    let d = dens[IX(gx, gy)];
                    d = constrain(d, 0, 1);

                    // Cyan dye with darkness
                    let r = Math.floor(10 + d * 20);
                    let g = Math.floor(20 + d * 200);
                    let b = Math.floor(40 + d * 220);

                    let idx = (px + py * width) * 4;
                    pixels[idx] = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                }
            }

            updatePixels();
        }

        function drawObstacle() {
            push();
            translate(obstacle.x, obstacle.y);
            rotate(obstacle.rotation * Math.PI / 180);

            // Draw obstacle with glow
            noStroke();

            // Glow effect
            for (let i = 3; i > 0; i--) {
                fill(100, 150, 255, 30 / i);
                if (obstacle.shape === 'circle') {
                    ellipse(0, 0, obstacle.size + i * 10);
                } else if (obstacle.shape === 'ellipse') {
                    ellipse(0, 0, obstacle.size + i * 10, obstacle.size * obstacle.aspectRatio + i * 10);
                } else {
                    rectMode(CENTER);
                    rect(0, 0, obstacle.size + i * 10, obstacle.size * obstacle.aspectRatio + i * 10, 3);
                }
            }

            // Main obstacle
            fill(220, 230, 255);
            if (obstacle.shape === 'circle') {
                ellipse(0, 0, obstacle.size);
            } else if (obstacle.shape === 'ellipse') {
                ellipse(0, 0, obstacle.size, obstacle.size * obstacle.aspectRatio);
            } else {
                rectMode(CENTER);
                rect(0, 0, obstacle.size, obstacle.size * obstacle.aspectRatio, 2);
            }

            // Center dot
            fill(100, 150, 255);
            ellipse(0, 0, 6);

            pop();
        }

        function updateStats() {
            document.getElementById('fps').textContent = Math.round(frameRate());

            // Calculate approximate Reynolds number
            let reynolds = Math.floor((flowSpeed * obstacle.size) / (viscosity + 0.0001));
            document.getElementById('reynolds').textContent = reynolds > 10000 ? '10000+' : reynolds;
        }

        // ============================================
        // INTERACTION
        // ============================================

        function mousePressed() {
            // Check if clicking on obstacle
            let d = dist(mouseX, mouseY, obstacle.x, obstacle.y);
            if (d < obstacle.size) {
                obstacle.dragging = true;
            }
        }

        function mouseDragged() {
            if (obstacle.dragging) {
                obstacle.x = constrain(mouseX, obstacle.size, width - obstacle.size);
                obstacle.y = constrain(mouseY, obstacle.size, height - obstacle.size);
            }
        }

        function mouseReleased() {
            obstacle.dragging = false;
        }

        function mouseWheel(event) {
            // Resize obstacle with scroll
            obstacle.size = constrain(obstacle.size - event.delta * 0.05, 15, 100);
            document.getElementById('obstacleSize').value = obstacle.size;
            document.getElementById('sizeVal').textContent = Math.round(obstacle.size);
            return false;
        }

        function keyPressed() {
            if (key === ' ') {
                togglePause();
            } else if (key === 'r' || key === 'R') {
                resetSimulation();
            }
        }

        // ============================================
        // UI CONTROLS
        // ============================================

        function setupUI() {
            // Obstacle size
            document.getElementById('obstacleSize').addEventListener('input', (e) => {
                obstacle.size = parseInt(e.target.value);
                document.getElementById('sizeVal').textContent = obstacle.size;
            });

            // Obstacle rotation
            document.getElementById('obstacleRotation').addEventListener('input', (e) => {
                obstacle.rotation = parseInt(e.target.value);
                document.getElementById('rotationVal').textContent = obstacle.rotation + '°';
            });

            // Aspect ratio
            document.getElementById('aspectRatio').addEventListener('input', (e) => {
                obstacle.aspectRatio = parseInt(e.target.value) / 10;
                document.getElementById('aspectVal').textContent = obstacle.aspectRatio.toFixed(1);
            });

            // Flow speed
            document.getElementById('flowSpeed').addEventListener('input', (e) => {
                flowSpeed = parseInt(e.target.value);
                document.getElementById('flowVal').textContent = flowSpeed.toFixed(1);
            });

            // Viscosity
            document.getElementById('viscosity').addEventListener('input', (e) => {
                let v = parseInt(e.target.value);
                viscosity = v / 100000;
                document.getElementById('viscVal').textContent = viscosity.toFixed(5);
            });

            // Solver iterations
            document.getElementById('solverIter').addEventListener('input', (e) => {
                iterations = parseInt(e.target.value);
                document.getElementById('iterVal').textContent = iterations;
            });

            // Field density
            document.getElementById('fieldDensity').addEventListener('input', (e) => {
                fieldDensity = parseInt(e.target.value);
                document.getElementById('densityVal').textContent = fieldDensity;
            });
        }

        function setShape(shape) {
            obstacle.shape = shape;
            document.getElementById('shapeCircle').classList.toggle('active', shape === 'circle');
            document.getElementById('shapeEllipse').classList.toggle('active', shape === 'ellipse');
            document.getElementById('shapeRect').classList.toggle('active', shape === 'rectangle');

            // Show/hide aspect ratio control
            document.getElementById('aspectRatio').parentElement.style.display =
                (shape === 'ellipse' || shape === 'rectangle') ? 'block' : 'none';
        }

        function setViz(mode) {
            vizMode = mode;
            document.getElementById('vizVorticity').classList.toggle('active', mode === 'vorticity');
            document.getElementById('vizVelocity').classList.toggle('active', mode === 'velocity');
            document.getElementById('vizDye').classList.toggle('active', mode === 'dye');
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('info').textContent = isPaused ? 'Paused' : 'Drag the obstacle to create vortices!';
        }

        function resetSimulation() {
            initArrays();
            obstacle.x = width * 0.3;
            obstacle.y = height / 2;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            canvasWidth = windowWidth;
            canvasHeight = windowHeight;
        }
    </script>
</body>
</html>
