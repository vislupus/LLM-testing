<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>von Kármán Vortex Street - p5.js LBM</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#0a0e14;color:#cbd5e1;font-family:ui-sans-system,system-ui,Segoe UI,Roboto,Helvetica,Arial;overflow:hidden}
  #canvasWrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 120% at 20% 10%,#14202e 0%,#0a0e14 70%)}
  canvas{display:block;box-shadow:0 20px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06)}
  #controls{
    position:absolute;top:14px;left:14px;
    background:rgba(14,22,33,0.92);backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.1);border-radius:16px;
    padding:14px 14px 12px; width:300px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6);
    font-size:12px;line-height:1.4;
  }
  #controls h2{margin:0 0 10px;font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:#7dd3fc}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:7px 0}
  .row label{flex:1;color:#94a3b8;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.06em}
  .row input[type=range]{flex:1.6;accent-color:#38bdf8}
  .row select{flex:1.6;background:#0f1a27;color:#e2e8f0;border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:5px 8px;font-size:12px}
  .checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .checks label{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,0.06);padding:4px 8px;border-radius:99px;font-size:11px;cursor:pointer}
  .btns{display:flex;gap:8px;margin-top:12px}
  button{background:#132233;border:1px solid rgba(125,211,252,0.25);color:#7dd3fc;border-radius:10px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:0.15s}
  button:hover{background:#1a2f45;color:white;transform:translateY(-1px)}
  button.primary{background:linear-gradient(180deg,#7dd3fc,#0ea5e9);color:#04293f;border:none;box-shadow:0 4px 14px rgba(14,165,233,0.4)}
  #stats{position:absolute;top:14px;right:14px;background:rgba(14,22,33,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:11px;color:#94a3b8;min-width:160px}
  #stats b{color:#e2f8ff}
  #hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(14,22,33,0.85);border:1px solid rgba(255,255,255,0.08);border-radius:99px;padding:6px 14px;font-size:11px;color:#8db8d8;letter-spacing:0.02em}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
</style>
</head>
<body>
<div id="canvasWrap"></div>
<div id="controls">
  <h2>🌊 Vortex Lab — LBM D2Q9</h2>
  <div class="row"><label>Shape</label><select id="shapeSel"><option value="circle">Circle</option><option value="ellipse">Ellipse</option><option value="rect">Rectangle</option></select></div>
  <div class="row"><label>Size <span id="sizeVal">12</span></label><input type="range" id="sizeSl" min="5" max="28" value="12" step="1"></div>
  <div class="row"><label>Rotate <span id="rotVal">0°</span></label><input type="range" id="rotSl" min="0" max="360" value="0" step="2"></div>
  <div class="row"><label>Inlet U <span id="speedVal">0.08</span></label><input type="range" id="speedSl" min="0.02" max="0.18" value="0.08" step="0.01"></div>
  <div class="row"><label>Viscosity ν <span id="viscVal">0.04</span></label><input type="range" id="viscSl" min="0.02" max="0.10" value="0.04" step="0.005"></div>
  <div class="row"><label>Steps/Frame <span id="stepsVal">3</span></label><input type="range" id="stepsSl" min="1" max="6" value="3" step="1"></div>
  <div class="checks">
    <label><input type="checkbox" id="chkVort" checked> Vorticity</label>
    <label><input type="checkbox" id="chkVec"> Vectors</label>
    <label><input type="checkbox" id="chkPart" checked> Tracers</label>
    <label><input type="checkbox" id="chkObstacle" checked> Show Obstacle</label>
  </div>
  <div class="btns">
    <button id="btnReset">Reset Flow</button>
    <button id="btnPause">Pause</button>
    <button id="btnClear" class="primary">Clear Wake</button>
  </div>
  <div style="margin-top:10px;color:#64748b;font-size:10px;line-height:1.5">Drag obstacle with mouse. Vortex shedding appears at Re ≈ 50–200. Re = U·D/ν. Try ellipse rotated 30° for stronger street.</div>
</div>
<div id="stats"></div>
<div id="hint">Drag obstacle • Scroll to change size • Hold Shift to rotate</div>

<script>
let NX = 320, NY = 120; // grid resolution - tune for performance
let f, f_next, solid, rhoArr, uxArr, uyArr, vortArr;
let tau = 0.6;
let Umax = 0.08;
let nu = 0.04;
let stepsPerFrame = 3;
let showVort = true, showVec = false, showPart = true, showObs = true;
let paused = false;

let obstacle = {x: Math.floor(NX*0.28), y: Math.floor(NY*0.5), size:12, angle:0, shape:'circle'};
let dragging = false, dragOffset = {x:0,y:0};

const cx = [0,1,0,-1,0,1,-1,-1,1];
const cy = [0,0,1,0,-1,1,1,-1,-1];
const w = [4/9,1/9,1/9,1/9,1/9,1/36,1/36,1/36,1/36];
const opp = [0,3,4,1,2,7,8,5,6];

let flowImg;
let tracerParts = [];

function idxCell(x,y){ return y*NX + x; }
function fIdx(x,y,i){ return (y*NX + x)*9 + i; }

function inletProfile(y){
  // parabolic Poiseuille
  let yy = y / (NY-1);
  return 4*Umax*yy*(1-yy);
}

function initArrays(){
  const N = NX*NY;
  f = new Float32Array(N*9);
  f_next = new Float32Array(N*9);
  solid = new Uint8Array(N);
  rhoArr = new Float32Array(N);
  uxArr = new Float32Array(N);
  uyArr = new Float32Array(N);
  vortArr = new Float32Array(N);
  // walls
  for(let x=0;x<NX;x++){
    solid[idxCell(x,0)]=1;
    solid[idxCell(x,NY-1)]=1;
  }
  updateObstacleMask(true);
  initFlow();
  initTracers();
}

function initFlow(){
  for(let y=0;y<NY;y++){
    let ux0 = inletProfile(y);
    for(let x=0;x<NX;x++){
      let id = idxCell(x,y);
      if(solid[id]) continue;
      let rho=1;
      let uy0=0;
      // small random perturbation to seed vortices
      if(x>NX*0.25 && x<NX*0.4 && Math.random()<0.02) uy0 = (Math.random()-0.5)*0.02;
      let usqr = ux0*ux0 + uy0*uy0;
      for(let i=0;i<9;i++){
        let cu = 3*(cx[i]*ux0 + cy[i]*uy0);
        let feq = w[i]*rho*(1+cu+0.5*cu*cu - 1.5*usqr);
        f[id*9 + i] = feq;
      }
      rhoArr[id]=rho; uxArr[id]=ux0; uyArr[id]=uy0;
    }
  }
  f_next.set(f);
}

function isInsideObstacle(px,py,obs){
  let dx = px - obs.x;
  let dy = py - obs.y;
  let ca = Math.cos(-obs.angle), sa = Math.sin(-obs.angle);
  let rx = dx*ca - dy*sa;
  let ry = dx*sa + dy*ca;
  if(obs.shape==='circle'){
    return rx*rx + ry*ry <= obs.size*obs.size;
  }else if(obs.shape==='ellipse'){
    let a = obs.size, b = obs.size*0.62;
    return (rx*rx)/(a*a) + (ry*ry)/(b*b) <= 1;
  }else if(obs.shape==='rect'){
    let hw = obs.size*1.1, hh = obs.size*0.7;
    return Math.abs(rx) <= hw && Math.abs(ry) <= hh;
  }
  return false;
}

function updateObstacleMask(forceFull=false){
  // clear previous obstacle except walls
  if(forceFull){
    for(let i=0;i<NX*NY;i++){
      let y = Math.floor(i/NX);
      if(y===0 || y===NY-1) solid[i]=1; else solid[i]=0;
    }
  }else{
    // only clear near old position - for simplicity full clear of non-wall
    for(let y=1;y<NY-1;y++){
      for(let x=0;x<NX;x++){
        let id=idxCell(x,y);
        if(solid[id]===1){
          // check if it was wall? walls are y=0,NY-1 only, so interior solids are obstacle
          solid[id]=0;
        }
      }
    }
  }
  // set new obstacle
  let r = Math.ceil(obstacle.size*2+2);
  let x0 = Math.max(1, Math.floor(obstacle.x - r));
  let x1 = Math.min(NX-2, Math.floor(obstacle.x + r));
  let y0 = Math.max(1, Math.floor(obstacle.y - r));
  let y1 = Math.min(NY-2, Math.floor(obstacle.y + r));
  for(let y=y0;y<=y1;y++){
    for(let x=x0;x<=x1;x++){
      if(isInsideObstacle(x,y,obstacle)){
        solid[idxCell(x,y)]=1;
      }
    }
  }
  // re-init fluid that became solid->fluid? For cells that just became fluid, set to equilibrium
  for(let y=y0-1;y<=y1+1;y++){
    for(let x=x0-1;x<=x1+1;x++){
      if(x<0||x>=NX||y<0||y>=NY) continue;
      let id=idxCell(x,y);
      if(!solid[id]){
        // if f is zero (was solid), init
        let sum=0;
        for(let i=0;i<9;i++) sum+=f[id*9+i];
        if(sum<1e-6){
          let ux0 = inletProfile(y)*0.6;
          let rho=1;
          let usqr=ux0*ux0;
          for(let i=0;i<9;i++){
            let cu=3*(cx[i]*ux0);
            f[id*9+i]=w[i]*rho*(1+cu+0.5*cu*cu -1.5*usqr);
          }
        }
      }else{
        // clear f in solid
        for(let i=0;i<9;i++) f[id*9+i]=0;
      }
    }
  }
}

function lbmStep(){
  const N = NX*NY;
  // COLLISION
  for(let y=1;y<NY-1;y++){
    for(let x=1;x<NX-1;x++){
      let id = idxCell(x,y);
      if(solid[id]) continue;
      let base = id*9;
      let f0=f[base], f1=f[base+1], f2=f[base+2], f3=f[base+3], f4=f[base+4], f5=f[base+5], f6=f[base+6], f7=f[base+7], f8=f[base+8];
      let rho = f0+f1+f2+f3+f4+f5+f6+f7+f8;
      if(rho<0.2) rho=1;
      let ux = (f1 - f3 + f5 - f6 - f7 + f8)/rho;
      let uy = (f2 - f4 + f5 + f6 - f7 - f8)/rho;
      // clamp
      if(ux>0.35) ux=0.35; if(ux<-0.1) ux=-0.1;
      if(Math.abs(uy)>0.2) uy*=0.95;
      rhoArr[id]=rho; uxArr[id]=ux; uyArr[id]=uy;
      let usqr = ux*ux + uy*uy;
      // relax
      for(let i=0;i<9;i++){
        let cu = 3*(cx[i]*ux + cy[i]*uy);
        let feq = w[i]*rho*(1+cu+0.5*cu*cu - 1.5*usqr);
        f[base+i] = f[base+i] - (f[base+i]-feq)/tau;
      }
    }
  }
  // STREAMING + BOUNCE-BACK
  f_next.fill(0);
  for(let y=1;y<NY-1;y++){
    for(let x=1;x<NX-1;x++){
      let id = idxCell(x,y);
      if(solid[id]) continue;
      let base = id*9;
      for(let i=0;i<9;i++){
        let x2 = x + cx[i];
        let y2 = y + cy[i];
        if(x2<0 || x2>=NX || y2<0 || y2>=NY) continue;
        let id2 = idxCell(x2,y2);
        if(solid[id2]){
          // bounce back to opposite in current cell
          f_next[base + opp[i]] += f[base + i];
        }else{
          f_next[id2*9 + i] = f[base + i];
        }
      }
    }
  }
  // swap
  let tmp=f; f=f_next; f_next=tmp;

  // INLET (west) Zou/He
  for(let y=1;y<NY-1;y++){
    let id = idxCell(0,y);
    if(solid[id]) continue;
    let base=id*9;
    let ux0 = inletProfile(y);
    // compute rho from known
    let f0=f[base], f2=f[base+2], f3=f[base+3], f4=f[base+4], f6=f[base+6], f7=f[base+7];
    let rho = (f0+f2+f4 + 2*(f3+f6+f7)) / (1 - ux0 + 1e-6);
    f[base+1] = f[base+3] + (2/3)*rho*ux0;
    f[base+5] = f[base+7] + 0.5*(f[base+4]-f[base+2]) + (1/6)*rho*ux0;
    f[base+8] = f[base+6] + 0.5*(f[base+2]-f[base+4]) + (1/6)*rho*ux0;
    rhoArr[id]=rho; uxArr[id]=ux0; uyArr[id]=0;
  }
  // OUTLET (east) zero gradient
  for(let y=1;y<NY-1;y++){
    let idSrc = idxCell(NX-2,y);
    let idDst = idxCell(NX-1,y);
    if(solid[idDst]) continue;
    for(let i=0;i<9;i++) f[idDst*9+i]=f[idSrc*9+i];
  }
}

function computeVorticity(){
  for(let y=1;y<NY-1;y++){
    for(let x=1;x<NX-1;x++){
      let id=idxCell(x,y);
      if(solid[id]){ vortArr[id]=0; continue; }
      let id_xp=idxCell(x+1,y), id_xm=idxCell(x-1,y), id_yp=idxCell(x,y+1), id_ym=idxCell(x,y-1);
      let duy_dx = (uyArr[id_xp]-uyArr[id_xm])*0.5;
      let dux_dy = (uxArr[id_yp]-uxArr[id_ym])*0.5;
      vortArr[id]=duy_dx - dux_dy;
    }
  }
}

function initTracers(){
  tracerParts=[];
  for(let i=0;i<420;i++){
    tracerParts.push({x: Math.random()*NX*0.2, y: 2+Math.random()*(NY-4), life: Math.random()});
  }
}

function updateTracers(){
  for(let p of tracerParts){
    // bilinear interp
    let x=p.x, y=p.y;
    let x0=Math.floor(x), y0=Math.floor(y);
    let x1=x0+1, y1=y0+1;
    if(x0<0||x1>=NX||y0<0||y1>=NY){ p.x=1+Math.random()*4; p.y=2+Math.random()*(NY-4); continue; }
    let id00=idxCell(x0,y0), id10=idxCell(x1,y0), id01=idxCell(x0,y1), id11=idxCell(x1,y1);
    if(solid[id00]||solid[id10]||solid[id01]||solid[id11]){ p.x=1+Math.random()*4; p.y=2+Math.random()*(NY-4); continue; }
    let wx=x-x0, wy=y-y0;
    let ux = (1-wx)*(1-wy)*uxArr[id00] + wx*(1-wy)*uxArr[id10] + (1-wx)*wy*uxArr[id01] + wx*wy*uxArr[id11];
    let uy = (1-wx)*(1-wy)*uyArr[id00] + wx*(1-wy)*uyArr[id10] + (1-wx)*wy*uyArr[id01] + wx*wy*uyArr[id11];
    p.x+=ux*1.2;
    p.y+=uy*1.2;
    if(p.x>=NX-2 || p.x<0 || p.y<=1 || p.y>=NY-1 || solid[idxCell(Math.floor(p.x), Math.floor(p.y))]){
      p.x=1+Math.random()*4;
      p.y=2+Math.random()*(NY-4);
    }
  }
}

let sketch = function(p){
  let canvas;
  p.setup = function(){
    let cw = Math.min(window.innerWidth*0.96, 1100);
    let ch = Math.floor(cw * NY / NX);
    if(ch> window.innerHeight*0.88) { ch = Math.floor(window.innerHeight*0.88); cw = Math.floor(ch * NX / NY); }
    canvas = p.createCanvas(cw, ch);
    canvas.parent('canvasWrap');
    flowImg = p.createImage(NX,NY);
    flowImg.loadPixels();
    initArrays();
    // UI listeners
    document.getElementById('shapeSel').addEventListener('change', e=>{ obstacle.shape=e.target.value; updateObstacleMask(); });
    document.getElementById('sizeSl').addEventListener('input', e=>{ obstacle.size=parseInt(e.target.value); document.getElementById('sizeVal').textContent=e.target.value; updateObstacleMask(); });
    document.getElementById('rotSl').addEventListener('input', e=>{ obstacle.angle=parseInt(e.target.value)*Math.PI/180; document.getElementById('rotVal').textContent=e.target.value+'°'; updateObstacleMask(); });
    document.getElementById('speedSl').addEventListener('input', e=>{ Umax=parseFloat(e.target.value); document.getElementById('speedVal').textContent=Umax.toFixed(2); });
    document.getElementById('viscSl').addEventListener('input', e=>{ nu=parseFloat(e.target.value); tau=3*nu+0.5; document.getElementById('viscVal').textContent=nu.toFixed(3); });
    document.getElementById('stepsSl').addEventListener('input', e=>{ stepsPerFrame=parseInt(e.target.value); document.getElementById('stepsVal').textContent=e.target.value; });
    document.getElementById('chkVort').addEventListener('change', e=> showVort=e.target.checked);
    document.getElementById('chkVec').addEventListener('change', e=> showVec=e.target.checked);
    document.getElementById('chkPart').addEventListener('change', e=> showPart=e.target.checked);
    document.getElementById('chkObstacle').addEventListener('change', e=> showObs=e.target.checked);
    document.getElementById('btnReset').addEventListener('click', ()=>{ initFlow(); });
    document.getElementById('btnPause').addEventListener('click', e=>{ paused=!paused; e.target.textContent=paused?'Resume':'Pause'; });
    document.getElementById('btnClear').addEventListener('click', ()=>{ initFlow(); initTracers(); });
  };

  p.draw = function(){
    if(!paused){
      for(let s=0;s<stepsPerFrame;s++) lbmStep();
      computeVorticity();
      if(showPart) updateTracers();
    }

    // render flowImg
    flowImg.loadPixels();
    for(let y=0;y<NY;y++){
      for(let x=0;x<NX;x++){
        let id=idxCell(x,y);
        let pixIdx = (y*NX + x)*4;
        if(solid[id]){
          flowImg.pixels[pixIdx]=28; flowImg.pixels[pixIdx+1]=32; flowImg.pixels[pixIdx+2]=38; flowImg.pixels[pixIdx+3]=255;
          continue;
        }
        if(showVort){
          let vort = vortArr[id];
          // clamp -0.12..0.12
          let t = (vort+0.12)/0.24; t=Math.max(0,Math.min(1,t));
          let r,g,b;
          if(t<0.5){
            // blue to white
            let k=t/0.5;
            r = 220 + k*(240-220); g = 235 + k*(240-235); b = 255 - k*15;
            // actually blue: low t = blue, high t of lower half = white
            // invert: t=0 => deep blue, t=0.5=>white
            r = p.lerp(30,240,t*2); g = p.lerp(90,240,t*2); b = p.lerp(255,240,t*2);
          }else{
            // white to red
            let k=(t-0.5)/0.5;
            r = p.lerp(240,255,k); g = p.lerp(240,40,k); b = p.lerp(240,40,k);
          }
          flowImg.pixels[pixIdx]=r; flowImg.pixels[pixIdx+1]=g; flowImg.pixels[pixIdx+2]=b; flowImg.pixels[pixIdx+3]=255;
        }else{
          let ux=uxArr[id], uy=uyArr[id];
          let mag = Math.sqrt(ux*ux+uy*uy);
          let t = Math.min(1, mag / (Umax*1.8+0.02));
          // jet colormap approx
          let r,g,b;
          if(t<0.25){ r=0; g=t*4*200; b=180+ t*4*75; }
          else if(t<0.5){ r=0; g=200 + (t-0.25)*4*55; b=255 - (t-0.25)*4*100; }
          else if(t<0.75){ r=(t-0.5)*4*255; g=255; b=(0.75-t)*4*150; }
          else { r=255; g=255 - (t-0.75)*4*180; b=0; }
          flowImg.pixels[pixIdx]=r; flowImg.pixels[pixIdx+1]=g; flowImg.pixels[pixIdx+2]=b; flowImg.pixels[pixIdx+3]=255;
        }
      }
    }
    flowImg.updatePixels();
    p.image(flowImg,0,0,p.width,p.height);

    // velocity vectors
    if(showVec){
      p.stroke(0,0,0,60); p.strokeWeight(0.6);
      let step=8;
      for(let y=4;y<NY;y+=step){
        for(let x=8;x<NX;x+=step){
          let id=idxCell(x,y);
          if(solid[id]) continue;
          let ux=uxArr[id], uy=uyArr[id];
          let sx = (x/NX)*p.width;
          let sy = (y/NY)*p.height;
          let scale= (p.width/NX)*18;
          p.line(sx,sy, sx+ux*scale, sy+uy*scale);
        }
      }
    }

    // tracer particles
    if(showPart){
      p.noStroke(); p.fill(255,255,255,180);
      for(let pt of tracerParts){
        let sx=(pt.x/NX)*p.width;
        let sy=(pt.y/NY)*p.height;
        p.circle(sx,sy, 2.2);
      }
    }

    // obstacle outline for clarity
    if(showObs){
      p.noFill(); p.stroke(255,255,255,90); p.strokeWeight(1.2);
      p.push(); p.translate((obstacle.x/NX)*p.width, (obstacle.y/NY)*p.height); p.rotate(obstacle.angle);
      if(obstacle.shape==='circle'){ p.ellipse(0,0, (obstacle.size*2/NX)*p.width*2, (obstacle.size*2/NY)*p.height*2); }
      else if(obstacle.shape==='ellipse'){ p.ellipse(0,0, (obstacle.size*2/NX)*p.width*2, (obstacle.size*1.24/NY)*p.height*2); }
      else { p.rectMode(p.CENTER); p.rect(0,0, (obstacle.size*2.2/NX)*p.width*2, (obstacle.size*1.4/NY)*p.height*2); }
      p.pop();
    }

    // stats
    let D = obstacle.size*2;
    let Re = (Umax*D/nu).toFixed(0);
    document.getElementById('stats').innerHTML = `<b>Re ≈ ${Re}</b> (U·D/ν)<br><span style="color:#7dd3fc">τ=${tau.toFixed(3)}</span> | ${Math.round(p.frameRate())} fps<br><span class="dot" style="background:${showVort?'#f87171':'#38bdf8'}"></span> ${showVort?'Vorticity ω':'Velocity |U|'}<br>Obstacle: ${obstacle.shape} @ ${Math.round(obstacle.angle*180/Math.PI)}°`;
  };

  p.mousePressed = function(){
    if(p.mouseX<0||p.mouseX>p.width||p.mouseY<0||p.mouseY>p.height) return;
    let gx = p.mouseX / p.width * NX;
    let gy = p.mouseY / p.height * NY;
    let dx = gx - obstacle.x, dy = gy - obstacle.y;
    if(Math.hypot(dx,dy) < obstacle.size*2.2){
      dragging=true;
      dragOffset.x=dx; dragOffset.y=dy;
    }
  };
  p.mouseDragged = function(){
    if(!dragging) return;
    let gx = p.mouseX / p.width * NX;
    let gy = p.mouseY / p.height * NY;
    if(p.keyIsDown(p.SHIFT)){
      // rotate
      let ang = Math.atan2(gy - obstacle.y, gx - obstacle.x);
      obstacle.angle = ang;
      document.getElementById('rotSl').value = Math.round(ang*180/Math.PI);
      document.getElementById('rotVal').textContent = Math.round(ang*180/Math.PI)+'°';
    }else{
      obstacle.x = gx - dragOffset.x;
      obstacle.y = gy - dragOffset.y;
      obstacle.x = Math.max(10, Math.min(NX-20, obstacle.x));
      obstacle.y = Math.max(5, Math.min(NY-5, obstacle.y));
    }
    updateObstacleMask();
  };
  p.mouseReleased = function(){ dragging=false; };
  p.mouseWheel = function(e){
    if(p.mouseX<0||p.mouseX>p.width||p.mouseY<0||p.mouseY>p.height) return;
    let delta = e.delta>0 ? -1 : 1;
    obstacle.size = Math.max(5, Math.min(28, obstacle.size + delta));
    document.getElementById('sizeSl').value=obstacle.size;
    document.getElementById('sizeVal').textContent=obstacle.size;
    updateObstacleMask();
    return false;
  };
};

new p5(sketch, document.getElementById('canvasWrap'));
</script>
</body>
