<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Von Kármán Vortex Street – Interactive Fluid Flow</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js">
    </script>
    <style>
        :root {
            --bg: #0a0a16;
            --panel-bg: rgba(16, 16, 32, 0.94);
            --text: #d0d0e0;
            --accent: #5b9cf5;
            --accent2: #f5708a;
            --gold: #f5b642;
            --border: rgba(255, 255, 255, 0.12);
            --radius: 8px;
            --font: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            cursor: grab;
            min-height: 400px;
        }
        #canvasContainer:active {
            cursor: grabbing;
        }
        canvas {
            display: block;
        }
        #uiBar {
            background: var(--panel-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--border);
            padding: 8px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            z-index: 20;
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
        }
        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .ctrl-group label {
            font-size: 9px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .ctrl-group input[type="range"] {
            width: 65px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .ctrl-group input[type="number"] {
            width: 40px;
            padding: 3px 4px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 10px;
            text-align: center;
            font-family: var(--font);
        }
        .val {
            font-size: 10px;
            color: #bbb;
            min-width: 22px;
            text-align: center;
        }
        button {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 10px;
            font-weight: 500;
            font-family: var(--font);
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.2px;
            background: rgba(255, 255, 255, 0.05);
            color: #ccc;
        }
        button:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }
        button.active-btn {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        button.accent {
            background: var(--accent2);
            border-color: var(--accent2);
            color: #fff;
            font-weight: 600;
        }
        .divider {
            width: 1px;
            height: 20px;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }
        .hint-overlay {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #bbb;
            font-size: 10px;
            padding: 6px 14px;
            border-radius: 14px;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 0.2px;
        }
        @media (max-width: 700px) {
            #uiBar {
                gap: 4px;
                padding: 6px 8px;
            }
            .ctrl-group input[type="range"] {
                width: 44px;
            }
            button {
                padding: 4px 7px;
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <div class="hint-overlay" id="hintOverlay">
            🖱 Drag obstacle · Scroll = resize · <b>R</b> rotate · <b>S</b> shape · <b>F</b> faster · <b>G</b> slower
        </div>
    </div>
    <div id="uiBar">
        <div class="ctrl-group">
            <label>Flow speed</label>
            <input type="range" id="speedSlider" min="0.3" max="4" step="0.1" value="1.6">
            <span class="val" id="speedVal">1.6</span>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <label>Obstacle size</label>
            <input type="range" id="sizeSlider" min="15" max="90" step="1" value="38">
            <span class="val" id="sizeVal">38</span>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <label>Viscosity</label>
            <input type="range" id="viscSlider" min="0" max="0.8" step="0.01" value="0.06">
            <span class="val" id="viscVal">0.06</span>
        </div>
        <div class="divider"></div>
        <button id="btnShape" title="Cycle shape: Circle → Ellipse → Rounded Rect → Diamond">🔷 Shape</button>
        <button id="btnRotate" title="Rotate obstacle 45°">↻ Rotate</button>
        <button id="btnReset" title="Reset simulation">↺ Reset</button>
    </div>

    <script>
        // ==================== p5.js SKETCH (instance mode) ====================
        const sketch = (p) => {
            // ---- FLOW DOMAIN ----
            let W, H;

            // ---- OBSTACLE STATE ----
            let obsX, obsY;
            let obsSize = 38; // base size (diameter for circle)
            let obsRotation = 0; // radians
            let obsShape = 0; // 0=circle, 1=ellipse, 2=rounded rect, 3=diamond
            const shapeNames = ['circle', 'ellipse', 'rounded rect', 'diamond'];
            let flowSpeed = 1.6;
            let viscosity = 0.06; // vortex decay rate

            // ---- VORTEX PARTICLES ----
            let vortices = []; // {x, y, circ, age, maxAge}
            let sheddingTimer = 0;
            let sheddingSide = 1; // +1 or -1 for alternating
            const maxVortices = 120;
            const strouhal = 0.19;

            // ---- TRACER PARTICLES ----
            let tracers = [];
            const numTracers = 550;

            // ---- DRAG STATE ----
            let dragging = false;
            let dragOffsetX = 0;
            let dragOffsetY = 0;

            // ---- VORTICITY GRID for visualization ----
            const vortGridCols = 64;
            const vortGridRows = 40;
            let vorticityField = new Array(vortGridCols * vortGridRows).fill(0);

            function init() {
                W = p.width;
                H = p.height;
                obsX = W * 0.28;
                obsY = H * 0.5;
                obsRotation = 0;
                vortices = [];
                sheddingTimer = 0;
                sheddingSide = 1;
                initTracers();
            }

            function initTracers() {
                tracers = [];
                for (let i = 0; i < numTracers; i++) {
                    tracers.push({
                        x: Math.random() * W * 0.12,
                        y: Math.random() * H,
                        age: Math.random() * 200
                    });
                }
            }

            // ---- OBSTACLE SHAPE CHECK ----
            function isInsideObstacle(px, py) {
                const dx = px - obsX;
                const dy = py - obsY;
                const cosR = Math.cos(-obsRotation);
                const sinR = Math.sin(-obsRotation);
                const lx = dx * cosR - dy * sinR;
                const ly = dx * sinR + dy * cosR;
                const s = obsSize;
                switch (obsShape) {
                    case 0: // circle
                        return (lx * lx + ly * ly) < (s / 2) * (s / 2);
                    case 1: // ellipse (wider horizontally)
                        return (lx * lx) / ((s * 0.7) * (s * 0.7)) + (ly * ly) / ((s * 0.45) * (s * 0.45)) < 1;
                    case 2: // rounded rect
                        const hw = s * 0.55;
                        const hh = s * 0.38;
                        const cr = s * 0.18;
                        const rx = Math.max(0, Math.abs(lx) - hw + cr);
                        const ry = Math.max(0, Math.abs(ly) - hh + cr);
                        return (rx * rx + ry * ry) < cr * cr || (Math.abs(lx) < hw && Math.abs(ly) < hh);
                    case 3: // diamond
                        return Math.abs(lx) / (s * 0.55) + Math.abs(ly) / (s * 0.4) < 1;
                    default:
                        return (lx * lx + ly * ly) < (s / 2) * (s / 2);
                }
            }

            function getObstacleRadius() {
                return obsSize * 0.5;
            }

            // ---- BACKGROUND POTENTIAL FLOW (around circle, mapped for shape) ----
            function bgVelocity(px, py) {
                const dx = px - obsX;
                const dy = py - obsY;
                const cosR = Math.cos(-obsRotation);
                const sinR = Math.sin(-obsRotation);
                let lx = dx * cosR - dy * sinR;
                let ly = dx * sinR + dy * cosR;
                const a = getObstacleRadius() * 0.85;
                const r2 = lx * lx + ly * ly;
                const r = Math.sqrt(r2);
                if (r < a * 0.55) {
                    // Inside obstacle region: return zero velocity (no flow inside)
                    return { vx: 0, vy: 0 };
                }
                const a2 = a * a;
                const r4 = r2 * r2;
                const cosT = r > 0.001 ? lx / r : 1;
                const sinT = r > 0.001 ? ly / r : 0;
                const U = flowSpeed;
                // Potential flow around cylinder: vr = U(1-a²/r²)cosθ, vθ = -U(1+a²/r²)sinθ
                const vr = U * (1 - a2 / r2) * cosT;
                const vt = -U * (1 + a2 / r2) * sinT;
                let vxLocal = vr * cosT - vt * sinT;
                let vyLocal = vr * sinT + vt * cosT;
                // Rotate back to global
                const cosR2 = Math.cos(obsRotation);
                const sinR2 = Math.sin(obsRotation);
                const vx = vxLocal * cosR2 - vyLocal * sinR2;
                const vy = vxLocal * sinR2 + vyLocal * cosR2;
                return { vx, vy };
            }

            // ---- BIOT-SAVART: velocity induced by a vortex ----
            function vortexVelocity(vx, vy, circ, px, py) {
                const dx = px - vx;
                const dy = py - vy;
                const r2 = dx * dx + dy * dy;
                if (r2 < 0.25) return { vx: 0, vy: 0 }; // avoid singularity
                const r2Clamped = Math.max(r2, 0.25);
                const factor = circ / (2 * Math.PI * r2Clamped);
                return { vx: -factor * dy, vy: factor * dx };
            }

            // ---- TOTAL VELOCITY at a point ----
            function totalVelocity(px, py) {
                let bg = bgVelocity(px, py);
                let vx = bg.vx;
                let vy = bg.vy;
                for (const v of vortices) {
                    const ind = vortexVelocity(v.x, v.y, v.circ, px, py);
                    vx += ind.vx;
                    vy += ind.vy;
                }
                // Clamp to prevent extreme values
                const speed = Math.sqrt(vx * vx + vy * vy);
                const maxSpeed = flowSpeed * 4;
                if (speed > maxSpeed) {
                    const scale = maxSpeed / speed;
                    vx *= scale;
                    vy *= scale;
                }
                return { vx, vy };
            }

            // ---- SHED VORTEX ----
            function shedVortex() {
                const a = getObstacleRadius();
                const cosR = Math.cos(obsRotation);
                const sinR = Math.sin(obsRotation);
                // Shed from the trailing edge (right side of obstacle in flow direction)
                const localShedX = a * 1.15;
                const localShedY = sheddingSide * a * 0.65;
                const sx = obsX + localShedX * cosR - localShedY * sinR;
                const sy = obsY + localShedX * sinR + localShedY * cosR;
                const circMag = flowSpeed * a * 1.3;
                const circ = sheddingSide * circMag;
                const vor = {
                    x: sx,
                    y: sy,
                    circ: circ,
                    age: 0,
                    maxAge: 180 + Math.random() * 120
                };
                vortices.push(vor);
                sheddingSide *= -1;
                if (vortices.length > maxVortices) {
                    vortices.shift();
                }
            }

            // ---- UPDATE ----
            function update() {
                // Shedding logic based on Strouhal number
                const a = getObstacleRadius();
                const D = a * 2;
                const shedPeriod = D / (strouhal * Math.max(0.3, flowSpeed));
                const dt = 1.0; // normalized time step per frame
                sheddingTimer += dt;
                const periodFrames = Math.max(8, Math.floor(shedPeriod / dt));
                if (sheddingTimer >= periodFrames) {
                    sheddingTimer = 0;
                    shedVortex();
                }

                // Update vortex positions
                for (const v of vortices) {
                    const vel = totalVelocity(v.x, v.y);
                    v.x += vel.vx * 0.8;
                    v.y += vel.vy * 0.8;
                    v.age += 1;
                    // Decay circulation
                    v.circ *= (1 - viscosity * 0.25);
                }

                // Remove old or out-of-bounds vortices
                vortices = vortices.filter(v => {
                    if (v.age > v.maxAge) return false;
                    if (Math.abs(v.circ) < 0.05) return false;
                    if (v.x < -100 || v.x > W + 200 || v.y < -150 || v.y > H + 150) return false;
                    if (isInsideObstacle(v.x, v.y)) return false;
                    return true;
                });

                // Update tracer particles
                for (const t of tracers) {
                    if (isInsideObstacle(t.x, t.y)) {
                        // Nudge outside
                        const dx = t.x - obsX;
                        const dy = t.y - obsY;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const a2 = getObstacleRadius() * 0.9;
                        if (dist < a2 && dist > 0.001) {
                            t.x = obsX + (dx / dist) * a2;
                            t.y = obsY + (dy / dist) * a2;
                        } else if (dist < 1) {
                            t.x = obsX + a2;
                            t.y = obsY;
                        }
                    }
                    const vel = totalVelocity(t.x, t.y);
                    t.x += vel.vx * 0.7;
                    t.y += vel.vy * 0.7;
                    t.age += 1;
                    // Respawn if out of bounds or too old
                    if (t.x < -20 || t.x > W + 20 || t.y < -30 || t.y > H + 30 || t.age > 350) {
                        t.x = Math.random() * W * 0.1;
                        t.y = Math.random() * H;
                        t.age = 0;
                    }
                    // Keep in vertical bounds loosely
                    if (t.y < -30) t.y = H + 20;
                    if (t.y > H + 30) t.y = -20;
                }
            }

            // ---- COMPUTE VORTICITY FIELD ----
            function computeVorticityField() {
                const dx = W / vortGridCols;
                const dy = H / vortGridRows;
                for (let iy = 0; iy < vortGridRows; iy++) {
                    for (let ix = 0; ix < vortGridCols; ix++) {
                        const cx = ix * dx + dx / 2;
                        const cy = iy * dy + dy / 2;
                        // Compute vorticity = dv/dx - du/dy using finite differences
                        const eps = 3;
                        const vRight = totalVelocity(cx + eps, cy);
                        const vLeft = totalVelocity(cx - eps, cy);
                        const vTop = totalVelocity(cx, cy - eps);
                        const vBot = totalVelocity(cx, cy + eps);
                        const dvdx = (vRight.vy - vLeft.vy) / (2 * eps);
                        const dudy = (vBot.vx - vTop.vx) / (2 * eps);
                        let vort = dvdx - dudy;
                        // Clamp for visualization
                        vort = Math.max(-0.4, Math.min(0.4, vort));
                        vorticityField[iy * vortGridCols + ix] = vort;
                    }
                }
            }

            // ---- RENDER ----
            function render() {
                p.background(8, 9, 20);

                // Compute and draw vorticity colormap
                computeVorticityField();
                const dx = W / vortGridCols;
                const dy = H / vortGridRows;
                p.noStroke();
                for (let iy = 0; iy < vortGridRows; iy++) {
                    for (let ix = 0; ix < vortGridCols; ix++) {
                        const vort = vorticityField[iy * vortGridCols + ix];
                        const px = ix * dx;
                        const py = iy * dy;
                        // Color map: blue (negative) → white (zero) → red (positive)
                        const t = p.constrain((vort + 0.4) / 0.8, 0, 1); // map [-0.4,0.4] to [0,1]
                        let r, g, b;
                        if (t < 0.5) {
                            const s = t * 2;
                            r = p.lerp(30, 220, s);
                            g = p.lerp(100, 220, s);
                            b = p.lerp(220, 180, s);
                        } else {
                            const s = (t - 0.5) * 2;
                            r = p.lerp(220, 240, s);
                            g = p.lerp(220, 80, s);
                            b = p.lerp(180, 60, s);
                        }
                        const alpha = p.constrain(Math.abs(vort) * 2.2, 0.08, 0.7);
                        p.fill(r, g, b, alpha * 255);
                        p.rect(px, py, dx + 0.5, dy + 0.5);
                    }
                }

                // Draw velocity vectors (sparse)
                const vecSpacing = 16;
                p.strokeWeight(1);
                for (let vx = vecSpacing; vx < W; vx += vecSpacing) {
                    for (let vy = vecSpacing; vy < H; vy += vecSpacing) {
                        if (isInsideObstacle(vx, vy)) continue;
                        const vel = totalVelocity(vx, vy);
                        const speed = Math.sqrt(vel.vx * vel.vx + vel.vy * vel.vy);
                        if (speed < 0.1) continue;
                        const scale = p.map(speed, 0, flowSpeed * 2.5, 0.3, 8);
                        const ex = vx + vel.vx * scale;
                        const ey = vy + vel.vy * scale;
                        const alpha = p.map(speed, 0.1, flowSpeed * 3, 30, 140);
                        p.stroke(200, 210, 240, alpha);
                        p.line(vx, vy, ex, ey);
                    }
                }

                // Draw tracer particles
                p.noStroke();
                for (const t of tracers) {
                    if (isInsideObstacle(t.x, t.y)) continue;
                    const vel = totalVelocity(t.x, t.y);
                    const speed = Math.sqrt(vel.vx * vel.vx + vel.vy * vel.vy);
                    const alpha = p.map(speed, 0, flowSpeed * 3, 70, 210);
                    p.fill(255, 240, 200, alpha);
                    p.circle(t.x, t.y, 1.6);
                }

                // Draw vortex cores
                for (const v of vortices) {
                    const alpha = p.constrain(Math.abs(v.circ) * 0.6, 40, 200);
                    if (v.circ > 0) {
                        p.fill(255, 100, 70, alpha);
                    } else {
                        p.fill(70, 140, 255, alpha);
                    }
                    const r = p.map(Math.abs(v.circ), 0.3, 5, 2.5, 8);
                    p.noStroke();
                    p.circle(v.x, v.y, r);
                }

                // Draw obstacle
                p.push();
                p.translate(obsX, obsY);
                p.rotate(obsRotation);
                p.strokeWeight(2.5);
                p.stroke(255, 220, 140, 220);
                const s = obsSize;
                switch (obsShape) {
                    case 0:
                        p.fill(40, 45, 60, 200);
                        p.circle(0, 0, s);
                        break;
                    case 1:
                        p.fill(40, 45, 60, 200);
                        p.ellipse(0, 0, s * 1.4, s * 0.9);
                        break;
                    case 2:
                        p.fill(40, 45, 60, 200);
                        p.rect(-s * 0.55, -s * 0.38, s * 1.1, s * 0.76, s * 0.18);
                        break;
                    case 3:
                        p.fill(40, 45, 60, 200);
                        p.quad(0, -s * 0.45, s * 0.55, 0, 0, s * 0.45, -s * 0.55, 0);
                        break;
                }
                // Highlight border
                p.stroke(255, 240, 180, 180);
                p.strokeWeight(2);
                p.noFill();
                switch (obsShape) {
                    case 0:
                        p.circle(0, 0, s);
                        break;
                    case 1:
                        p.ellipse(0, 0, s * 1.4, s * 0.9);
                        break;
                    case 2:
                        p.rect(-s * 0.55, -s * 0.38, s * 1.1, s * 0.76, s * 0.18);
                        break;
                    case 3:
                        p.quad(0, -s * 0.45, s * 0.55, 0, 0, s * 0.45, -s * 0.55, 0);
                        break;
                }
                p.pop();

                // Draw flow direction indicator
                p.fill(200, 200, 220, 60);
                p.noStroke();
                p.textAlign(p.CENTER);
                p.textSize(10);
                p.text('Flow →', 50, 16);

                // Info
                p.fill(180, 180, 200, 140);
                p.textSize(10);
                p.textAlign(p.RIGHT);
                p.text(`Vortices: ${vortices.length} | Tracers: ${tracers.length}`, W - 14, 18);
            }

            // ---- P5 LIFECYCLE ----
            p.setup = function() {
                const container = document.getElementById('canvasContainer');
                const cw = container.clientWidth;
                const ch = container.clientHeight;
                p.createCanvas(cw, ch);
                p.colorMode(p.RGB, 255, 255, 255, 255);
                p.frameRate(55);
                W = cw;
                H = ch;
                init();
            };

            p.draw = function() {
                W = p.width;
                H = p.height;
                for (let i = 0; i < 2; i++) update();
                render();
            };

            p.windowResized = function() {
                const container = document.getElementById('canvasContainer');
                p.resizeCanvas(container.clientWidth, container.clientHeight);
                W = p.width;
                H = p.height;
                obsX = p.constrain(obsX, 50, W - 50);
                obsY = p.constrain(obsY, 50, H - 50);
                initTracers();
            };

            // ---- MOUSE ----
            p.mousePressed = function() {
                if (p.mouseY > p.height - 50 && p.mouseY < p.height) return; // UI bar area
                const mx = p.mouseX;
                const my = p.mouseY;
                if (isInsideObstacle(mx, my)) {
                    dragging = true;
                    dragOffsetX = obsX - mx;
                    dragOffsetY = obsY - my;
                }
            };

            p.mouseDragged = function() {
                if (dragging) {
                    obsX = p.constrain(p.mouseX + dragOffsetX, 30, W - 30);
                    obsY = p.constrain(p.mouseY + dragOffsetY, 30, H - 30);
                }
            };

            p.mouseReleased = function() {
                dragging = false;
            };

            p.mouseWheel = function(event) {
                if (event.deltaY < 0) {
                    obsSize = Math.min(90, obsSize + 4);
                } else {
                    obsSize = Math.max(12, obsSize - 4);
                }
                updateSizeSlider();
                return false;
            };

            // ---- KEYBOARD ----
            p.keyPressed = function() {
                const key = p.key.toLowerCase();
                if (key === 'r') {
                    obsRotation += Math.PI / 4;
                }
                if (key === 's') {
                    obsShape = (obsShape + 1) % 4;
                    updateShapeButton();
                }
                if (key === 'f') {
                    flowSpeed = Math.min(4, flowSpeed + 0.2);
                    updateSpeedSlider();
                }
                if (key === 'g') {
                    flowSpeed = Math.max(0.3, flowSpeed - 0.2);
                    updateSpeedSlider();
                }
                if (key === 'arrowleft') {
                    obsX -= 5;
                }
                if (key === 'arrowright') {
                    obsX += 5;
                }
                if (key === 'arrowup') {
                    obsY -= 5;
                }
                if (key === 'arrowdown') {
                    obsY += 5;
                }
                obsX = p.constrain(obsX, 30, W - 30);
                obsY = p.constrain(obsY, 30, H - 30);
                return false;
            };
        };

        // ==================== INSTANTIATE P5 ====================
        const myP5 = new p5(sketch);

        // ==================== UI BINDINGS ====================
        function updateSpeedSlider() {
            document.getElementById('speedSlider').value = myP5.flowSpeed || 1.6;
            document.getElementById('speedVal').textContent = (myP5.flowSpeed || 1.6).toFixed(1);
        }

        function updateSizeSlider() {
            document.getElementById('sizeSlider').value = myP5.obsSize || 38;
            document.getElementById('sizeVal').textContent = myP5.obsSize || 38;
        }

        function updateShapeButton() {
            const btn = document.getElementById('btnShape');
            const shapeIdx = myP5.obsShape || 0;
            const names = ['● Circle', '⬭ Ellipse', '▣ Rounded', '◆ Diamond'];
            btn.textContent = names[shapeIdx] || 'Shape';
        }

        function updateViscSlider() {
            document.getElementById('viscSlider').value = myP5.viscosity || 0.06;
            document.getElementById('viscVal').textContent = (myP5.viscosity || 0.06).toFixed(2);
        }

        document.getElementById('speedSlider').addEventListener('input', function() {
            const val = parseFloat(this.value);
            myP5.flowSpeed = val;
            document.getElementById('speedVal').textContent = val.toFixed(1);
        });
        document.getElementById('sizeSlider').addEventListener('input', function() {
            const val = parseInt(this.value);
            myP5.obsSize = val;
            document.getElementById('sizeVal').textContent = val;
        });
        document.getElementById('viscSlider').addEventListener('input', function() {
            const val = parseFloat(this.value);
            myP5.viscosity = val;
            document.getElementById('viscVal').textContent = val.toFixed(2);
        });
        document.getElementById('btnShape').addEventListener('click', function() {
            myP5.obsShape = ((myP5.obsShape || 0) + 1) % 4;
            updateShapeButton();
        });
        document.getElementById('btnRotate').addEventListener('click', function() {
            myP5.obsRotation = (myP5.obsRotation || 0) + Math.PI / 4;
        });
        document.getElementById('btnReset').addEventListener('click', function() {
            myP5.obsX = myP5.width * 0.28;
            myP5.obsY = myP5.height * 0.5;
            myP5.obsSize = 38;
            myP5.obsRotation = 0;
            myP5.obsShape = 0;
            myP5.flowSpeed = 1.6;
            myP5.viscosity = 0.06;
            myP5.vortices = [];
            myP5.sheddingTimer = 0;
            myP5.sheddingSide = 1;
            myP5.initTracers();
            updateSpeedSlider();
            updateSizeSlider();
            updateShapeButton();
            updateViscSlider();
        });

        // Initial UI sync
        setTimeout(() => {
            updateSpeedSlider();
            updateSizeSlider();
            updateShapeButton();
            updateViscSlider();
        }, 300);

        console.log('🌊 Von Kármán Vortex Street Simulation Ready');
        console.log('  🖱 Drag obstacle · Scroll resize · R rotate · S shape');
        console.log('  F/G adjust speed · Arrow keys nudge');
        console.log('  Vorticity: blue = CW, red = CCW');
        console.log('  Vortex cores shown as colored circles');
        console.log('  Tracer particles follow the flow');
    </script>
</body>
</html>
