<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Von Kármán Vortex Street Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.75);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,200,255,0.2);
            z-index: 100;
            max-width: 280px;
            line-height: 1.7;
        }
        #info h2 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #88ccff;
            font-weight: 600;
        }
        #info .key {
            display: inline-block;
            background: rgba(100,200,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            margin: 0 2px;
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.75);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,200,255,0.2);
            z-index: 100;
            width: 220px;
        }
        #controls h3 {
            font-size: 13px;
            color: #88ccff;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .slider-group {
            margin: 10px 0;
        }
        .slider-group label {
            display: block;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
        }
        .slider-value {
            float: right;
            color: #88ccff;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(100,200,255,0.2);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #88ccff;
            border-radius: 50%;
            cursor: pointer;
        }
        .shape-buttons {
            display: flex;
            gap: 6px;
            margin: 10px 0;
        }
        .shape-btn {
            flex: 1;
            background: rgba(100,200,255,0.15);
            border: 1px solid rgba(100,200,255,0.3);
            color: #fff;
            padding: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .shape-btn:hover, .shape-btn.active {
            background: rgba(100,200,255,0.4);
            border-color: #88ccff;
        }
        .btn {
            background: rgba(100,200,255,0.15);
            border: 1px solid rgba(100,200,255,0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            margin: 5px 3px 0 0;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(100,200,255,0.35);
        }
        #vizMode {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(100,200,255,0.2);
        }
        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Von Kármán Vortex Street</h2>
        <p><span class="key">Drag</span> Move obstacle</p>
        <p><span class="key">Scroll</span> Resize obstacle</p>
        <p><span class="key">R</span> Rotate obstacle</p>
        <p><span class="key">1-3</span> Change shape</p>
        <p><span class="key">V</span> Toggle visualization</p>
        <p><span class="key">P</span> Toggle particles</p>
        <p><span class="key">Space</span> Pause/Resume</p>
    </div>

    <div id="controls">
        <h3>Parameters</h3>
        <div class="slider-group">
            <label>Flow Speed<span class="slider-value" id="flowVal">0.08</span></label>
            <input type="range" id="flowSlider" min="0.01" max="0.15" step="0.01" value="0.08">
        </div>
        <div class="slider-group">
            <label>Viscosity<span class="slider-value" id="viscVal">0.015</span></label>
            <input type="range" id="viscSlider" min="0.005" max="0.05" step="0.001" value="0.015">
        </div>
        <div class="slider-group">
            <label>Vortex Visibility<span class="slider-value" id="vortVal">0.5</span></label>
            <input type="range" id="vortSlider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <div class="shape-buttons">
            <button class="shape-btn active" id="circleBtn" onclick="setShape('circle')">Circle</button>
            <button class="shape-btn" id="ellipseBtn" onclick="setShape('ellipse')">Ellipse</button>
            <button class="shape-btn" id="rectBtn" onclick="setShape('rectangle')">Rect</button>
        </div>

        <div id="vizMode">
            <span style="color:rgba(255,255,255,0.7);font-size:11px;">Visualization:</span>
            <button class="btn" onclick="setViz('velocity')">Velocity</button>
            <button class="btn" onclick="setViz('vorticity')">Vorticity</button>
            <button class="btn" onclick="setViz('density')">Density</button>
        </div>

        <div style="margin-top:10px;">
            <button class="btn" onclick="resetSimulation()">Reset</button>
        </div>
    </div>

    <div id="stats">
        <span id="fps">FPS: 60</span> | <span id="reynolds">Re: 0</span> | <span id="status">Running</span>
    </div>

    <script>
        // ============================================
        // LATTICE BOLTZMANN SIMULATION (D2Q9)
        // For von Kármán vortex street
        // ============================================

        const NX = 400;  // Grid width
        const NY = 200;  // Grid height
        const Q = 9;     // D2Q9 model

        // Lattice weights
        const w = [4/9, 1/9, 1/9, 1/9, 1/9, 1/36, 1/36, 1/36, 1/36];

        // Directions: 0=center, 1-4=cardinals, 5-8=diagonals
        const ex = [0, 1, -1, 0, 0, 1, -1, -1, 1];
        const ey = [0, 0, 0, 1, -1, 1, 1, -1, -1];

        // Opposite directions
        const opposite = [0, 2, 1, 4, 3, 6, 5, 8, 7];

        // Fluid arrays
        let f = [];
        let fNew = [];
        let rho = [];
        let ux = [];
        let uy = [];
        let obstacle = [];
        let vorticity = [];

        // Obstacle properties
        let obsX, obsY, obsRadius, obsRotation;
        let obsShape = 'circle'; // circle, ellipse, rectangle
        let obsWidth = 1.5;  // For ellipse/rectangle width
        let obsHeight = 1.0; // For ellipse height

        // Simulation parameters
        let flowSpeed = 0.08;
        let viscosity = 0.015;
        let vortexScale = 0.5;
        let isPaused = false;
        let vizMode = 'vorticity'; // velocity, vorticity, density

        // Display
        let scale;
        let offsetX, offsetY;
        let canvasWidth, canvasHeight;

        // ============================================
        // INITIALIZATION
        // ============================================
        function setup() {
            canvasWidth = windowWidth;
            canvasHeight = windowHeight;
            createCanvas(canvasWidth, canvasHeight);

            scale = min(canvasWidth * 0.75 / NX, canvasHeight * 0.85 / NY);
            offsetX = (canvasWidth - NX * scale) / 2;
            offsetY = (canvasHeight - NY * scale) / 2;

            initializeSimulation();
            setupEventListeners();
            frameRate(60);
        }

        function initializeSimulation() {
            // Initialize arrays
            f = new Array(NX * NY * Q).fill(0);
            fNew = new Array(NX * NY * Q).fill(0);
            rho = new Array(NX * NY).fill(1);
            ux = new Array(NX * NY).fill(0);
            uy = new Array(NX * NY).fill(0);
            obstacle = new Array(NX * NY).fill(false);
            vorticity = new Array(NX * NY).fill(0);

            // Obstacle position (center-ish, slightly upstream)
            obsX = NX * 0.35;
            obsY = NY * 0.5;
            obsRadius = 12;
            obsRotation = 0;

            // Set obstacle cells
            updateObstacleCells();

            // Initialize equilibrium
            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    const idx = IX(i, j);
                    if (!obstacle[idx]) {
                        initializeEquilibrium(idx, flowSpeed, 0);
                    }
                }
            }
        }

        function initializeEquilibrium(idx, ux0, uy0) {
            const u2 = ux0 * ux0 + uy0 * uy0;
            for (let k = 0; k < Q; k++) {
                const edotu = ex[k] * ux0 + ey[k] * uy0;
                f[idx * Q + k] = w[k] * rho[idx] * (
                    1 + 3 * edotu + 4.5 * edotu * edotu - 1.5 * u2
                );
            }
        }

        function updateObstacleCells() {
            obstacle.fill(false);
            const cosR = cos(obsRotation);
            const sinR = sin(obsRotation);

            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    // Transform to obstacle local coordinates
                    const dx = i - obsX;
                    const dy = j - obsY;
                    const rx = dx * cosR + dy * sinR;
                    const ry = -dx * sinR + dy * cosR;

                    let inObstacle = false;
                    if (obsShape === 'circle') {
                        inObstacle = (rx * rx + ry * ry) <= obsRadius * obsRadius;
                    } else if (obsShape === 'ellipse') {
                        const a = obsRadius * obsWidth;
                        const b = obsRadius * obsHeight;
                        inObstacle = (rx * rx) / (a * a) + (ry * ry) / (b * b) <= 1;
                    } else if (obsShape === 'rectangle') {
                        const hw = obsRadius * obsWidth;
                        const hh = obsRadius * obsHeight;
                        inObstacle = abs(rx) <= hw && abs(ry) <= hh;
                    }

                    obstacle[IX(i, j)] = inObstacle;
                }
            }
        }

        function IX(i, j) {
            return i + j * NX;
        }

        // ============================================
        // LATTICE BOLTZMANN STEP
        // ============================================
        function simulate() {
            if (isPaused) return;

            const omega = 1 / (3 * viscosity + 0.5); // Relaxation time

            // Streaming step
            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    const idx = IX(i, j);

                    if (obstacle[idx]) {
                        // Bounce-back at obstacle
                        for (let k = 0; k < Q; k++) {
                            fNew[idx * Q + k] = f[idx * Q + opposite[k]];
                        }
                    } else {
                        // Stream from neighbors
                        for (let k = 0; k < Q; k++) {
                            const i2 = (i - ex[k] + NX) % NX;
                            const j2 = (j - ey[k] + NY) % NY;
                            fNew[idx * Q + k] = f[IX(i2, j2) * Q + k];
                        }
                    }
                }
            }

            // Collision step
            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    const idx = IX(i, j);

                    if (obstacle[idx]) continue;

                    // Compute macroscopic variables
                    let rhoSum = 0, uxSum = 0, uySum = 0;
                    for (let k = 0; k < Q; k++) {
                        rhoSum += fNew[idx * Q + k];
                        uxSum += fNew[idx * Q + k] * ex[k];
                        uySum += fNew[idx * Q + k] * ey[k];
                    }

                    rho[idx] = rhoSum;
                    if (rhoSum > 0) {
                        ux[idx] = uxSum / rhoSum;
                        uy[idx] = uySum / rhoSum;
                    }

                    // Equilibrium
                    const u2 = ux[idx] * ux[idx] + uy[idx] * uy[idx];
                    const feq = [];
                    for (let k = 0; k < Q; k++) {
                        const edotu = ex[k] * ux[idx] + ey[k] * uy[idx];
                        feq[k] = w[k] * rho[idx] * (
                            1 + 3 * edotu + 4.5 * edotu * edotu - 1.5 * u2
                        );
                    }

                    // Collision
                    for (let k = 0; k < Q; k++) {
                        f[idx * Q + k] = fNew[idx * Q + k] + omega * (feq[k] - fNew[idx * Q + k]);
                    }
                }
            }

            // Compute vorticity
            computeVorticity();

            // Apply boundary conditions (inlet/outlet)
            applyBoundaryConditions();
        }

        function computeVorticity() {
            for (let i = 1; i < NX - 1; i++) {
                for (let j = 1; j < NY - 1; j++) {
                    const idx = IX(i, j);
                    if (!obstacle[idx]) {
                        vorticity[idx] = (uy[IX(i+1, j)] - uy[IX(i-1, j)]) -
                                        (ux[IX(i, j+1)] - ux[IX(i, j-1)]);
                    } else {
                        vorticity[idx] = 0;
                    }
                }
            }
        }

        function applyBoundaryConditions() {
            // Inlet (left side) - constant flow
            const jMin = 1, jMax = NY - 2;
            for (let j = jMin; j < jMax; j++) {
                const idx = IX(1, j);
                if (!obstacle[idx]) {
                    initializeEquilibrium(idx, flowSpeed, 0);
                }
            }

            // Outlet (right side) - copy from previous
            for (let j = 0; j < NY; j++) {
                const idx1 = IX(NX - 1, j);
                const idx2 = IX(NX - 2, j);
                if (!obstacle[idx1]) {
                    rho[idx1] = rho[idx2];
                    ux[idx1] = ux[idx2];
                    uy[idx1] = uy[idx2];
                    for (let k = 0; k < Q; k++) {
                        f[idx1 * Q + k] = f[idx2 * Q + k];
                    }
                }
            }

            // Top and bottom - no-slip
            for (let i = 0; i < NX; i++) {
                // Top
                const idxT = IX(i, NY - 1);
                const idxTAbove = IX(i, NY - 2);
                if (!obstacle[idxT] && !obstacle[idxTAbove]) {
                    ux[idxT] = -ux[idxTAbove];
                    uy[idxT] = -uy[idxTAbove];
                }
                // Bottom
                const idxB = IX(i, 0);
                const idxBBelow = IX(i, 1);
                if (!obstacle[idxB] && !obstacle[idxBBelow]) {
                    ux[idxB] = -ux[idxBBelow];
                    uy[idxB] = -uy[idxBBelow];
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            // Run simulation multiple times for better visualization
            for (let i = 0; i < 3; i++) {
                simulate();
            }

            background(8, 8, 15);

            push();
            translate(offsetX, offsetY);

            // Draw based on visualization mode
            if (vizMode === 'velocity') {
                drawVelocityField();
            } else if (vizMode === 'vorticity') {
                drawVorticityField();
            } else {
                drawDensityField();
            }

            // Draw obstacle
            drawObstacle();

            // Draw streamlines / flow indicators
            drawFlowIndicators();

            pop();

            // Update stats
            document.getElementById('fps').textContent = `FPS: ${floor(frameRate())}`;
            const reynolds = (flowSpeed * obsRadius * 2) / viscosity;
            document.getElementById('reynolds').textContent = `Re: ${floor(reynolds)}`;
            document.getElementById('status').textContent = isPaused ? 'Paused' : 'Running';
        }

        function drawVelocityField() {
            noStroke();
            const step = 4;

            for (let i = 0; i < NX; i += step) {
                for (let j = 0; j < NY; j += step) {
                    const idx = IX(i, j);
                    if (obstacle[idx]) {
                        fill(50, 50, 60);
                    } else {
                        const speed = sqrt(ux[idx] * ux[idx] + uy[idx] * uy[idx]);
                        const hue = map(speed, 0, flowSpeed * 3, 0, 200);

                        colorMode(HSB, 360, 100, 100);
                        fill(hue, 80, min(speed * 800, 100));
                        colorMode(RGB, 255);
                    }

                    rect(i * scale, j * scale, step * scale, step * scale);
                }
            }
        }

        function drawVorticityField() {
            noStroke();

            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    const idx = IX(i, j);
                    if (obstacle[idx]) {
                        fill(60, 60, 70);
                    } else {
                        const vort = vorticity[idx] * vortexScale;
                        const absVort = abs(vort);

                        if (absVort > 0.01) {
                            // Positive vorticity (counterclockwise) = warm colors
                            // Negative vorticity (clockwise) = cool colors
                            const intensity = min(absVort * 5, 1);

                            if (vort > 0) {
                                fill(intensity * 255, 150, 255 - intensity * 100);
                            } else {
                                fill(100 - intensity * 100, 150 + intensity * 105, intensity * 255);
                            }
                        } else {
                            fill(15, 15, 25);
                        }
                    }

                    rect(i * scale, j * scale, scale + 0.5, scale + 0.5);
                }
            }
        }

        function drawDensityField() {
            noStroke();

            for (let i = 0; i < NX; i++) {
                for (let j = 0; j < NY; j++) {
                    const idx = IX(i, j);
                    if (obstacle[idx]) {
                        fill(80, 80, 90);
                    } else {
                        const d = rho[idx];
                        const brightness = map(d, 0.8, 1.2, 20, 80);
                        fill(brightness * 0.5, brightness * 0.8, brightness);
                    }

                    rect(i * scale, j * scale, scale + 0.5, scale + 0.5);
                }
            }
        }

        function drawObstacle() {
            push();
            translate(obsX * scale, obsY * scale);
            rotate(-obsRotation);

            // Glow effect
            noStroke();
            for (let i = 5; i > 0; i--) {
                fill(100, 150, 200, 10);
                if (obsShape === 'circle') {
                    ellipse(0, 0, (obsRadius + i * 2) * 2 * scale);
                } else if (obsShape === 'ellipse') {
                    ellipse(0, 0, obsRadius * obsWidth * 2 * scale + i * 4, obsRadius * obsHeight * 2 * scale + i * 4);
                } else {
                    rectMode(CENTER);
                    rect(0, 0, obsRadius * obsWidth * 2 * scale + i * 4, obsRadius * obsHeight * 2 * scale + i * 4);
                }
            }

            // Main obstacle
            fill(100, 120, 140);
            stroke(150, 180, 220);
            strokeWeight(2);

            if (obsShape === 'circle') {
                ellipse(0, 0, obsRadius * 2 * scale);
            } else if (obsShape === 'ellipse') {
                ellipse(0, 0, obsRadius * obsWidth * 2 * scale, obsRadius * obsHeight * 2 * scale);
            } else {
                rectMode(CENTER);
                rect(0, 0, obsRadius * obsWidth * 2 * scale, obsRadius * obsHeight * 2 * scale);
            }

            pop();
        }

        function drawFlowIndicators() {
            // Draw small arrows to show flow direction
            stroke(255, 255, 255, 30);
            strokeWeight(1);

            const step = 20;
            for (let i = 50; i < NX - 20; i += step) {
                for (let j = step; j < NY - step; j += step) {
                    const idx = IX(i, j);
                    if (!obstacle[idx]) {
                        const u = ux[idx];
                        const v = uy[idx];
                        const mag = sqrt(u * u + v * v);

                        if (mag > 0.001) {
                            const x = i * scale;
                            const y = j * scale;
                            const len = min(mag * 200, 8);

                            line(x, y, x + (u / mag) * len, y + (v / mag) * len);
                        }
                    }
                }
            }
        }

        // ============================================
        // INTERACTION
        // ============================================
        function mousePressed() {
            handleMouse();
        }

        function mouseDragged() {
            handleMouse();
        }

        function handleMouse() {
            const gridX = (mouseX - offsetX) / scale;
            const gridY = (mouseY - offsetY) / scale;

            // Check if clicking near obstacle
            const dist = sqrt((gridX - obsX) * (gridX - obsX) + (gridY - obsY) * (gridY - obsY));

            if (dist < obsRadius * 3) {
                obsX = constrain(gridX, obsRadius + 5, NX - obsRadius - 5);
                obsY = constrain(gridY, obsRadius + 5, NY - obsRadius - 5);
                updateObstacleCells();
            }
        }

        function mouseWheel(event) {
            const gridX = (mouseX - offsetX) / scale;
            const gridY = (mouseY - offsetY) / scale;

            const dist = sqrt((gridX - obsX) * (gridX - obsX) + (gridY - obsY) * (gridY - obsY));

            if (dist < obsRadius * 3) {
                obsRadius = constrain(obsRadius - event.delta * 0.05, 5, 40);
                updateObstacleCells();
            }

            return false;
        }

        function keyPressed() {
            if (key === 'r' || key === 'R') {
                // Rotate obstacle
                obsRotation += PI / 12;
                updateObstacleCells();
            }

            if (key === '1') setShape('circle');
            if (key === '2') setShape('ellipse');
            if (key === '3') setShape('rectangle');

            if (key === 'v' || key === 'V') {
                if (vizMode === 'velocity') vizMode = 'vorticity';
                else if (vizMode === 'vorticity') vizMode = 'density';
                else vizMode = 'velocity';
            }

            if (key === ' ') {
                isPaused = !isPaused;
            }

            if (key === 'p' || key === 'P') {
                // Toggle obstacle width/height for ellipse/rectangle
                if (obsShape === 'ellipse') {
                    obsWidth = obsWidth === 1.5 ? 0.6 : 1.5;
                } else if (obsShape === 'rectangle') {
                    obsWidth = obsWidth === 1.5 ? 0.5 : 1.5;
                }
                updateObstacleCells();
            }
        }

        // ============================================
        // CONTROL FUNCTIONS
        // ============================================
        window.setShape = function(shape) {
            obsShape = shape;
            document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(shape + 'Btn').classList.add('active');

            // Reset aspect ratio
            if (shape === 'circle') {
                obsWidth = 1;
                obsHeight = 1;
            } else if (shape === 'ellipse') {
                obsWidth = 1.5;
                obsHeight = 1.0;
            } else {
                obsWidth = 1.5;
                obsHeight = 1.0;
            }

            updateObstacleCells();
        };

        window.setViz = function(mode) {
            vizMode = mode;
        };

        window.resetSimulation = function() {
            initializeSimulation();
        };

        function setupEventListeners() {
            document.getElementById('flowSlider').addEventListener('input', (e) => {
                flowSpeed = parseFloat(e.target.value);
                document.getElementById('flowVal').textContent = flowSpeed.toFixed(2);
            });

            document.getElementById('viscSlider').addEventListener('input', (e) => {
                viscosity = parseFloat(e.target.value);
                document.getElementById('viscVal').textContent = viscosity.toFixed(3);
            });

            document.getElementById('vortSlider').addEventListener('input', (e) => {
                vortexScale = parseFloat(e.target.value);
                document.getElementById('vortVal').textContent = vortexScale.toFixed(2);
            });
        }

        function windowResized() {
            canvasWidth = windowWidth;
            canvasHeight = windowHeight;
            resizeCanvas(canvasWidth, canvasHeight);

            scale = min(canvasWidth * 0.75 / NX, canvasHeight * 0.85 / NY);
            offsetX = (canvasWidth - NX * scale) / 2;
            offsetY = (canvasHeight - NY * scale) / 2;
        }
    </script>
