<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Von Kármán Vortex Street Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            width: 280px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.2);
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            font-size: 16px;
        }
        
        .control-group {
            margin: 12px 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #66ddff;
            font-weight: 500;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
            accent-color: #00ffff;
        }
        
        select {
            width: 100%;
            background: rgba(0, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 5px;
            border-radius: 5px;
            margin: 5px 0;
        }
        
        button {
            background: linear-gradient(135deg, #0088cc, #00ccff);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #00aaff, #00eeff);
            box-shadow: 0 2px 15px rgba(0, 255, 255, 0.5);
        }
        
        .value-display {
            color: #00ffff;
            float: right;
            font-weight: bold;
        }
        
        .key {
            display: inline-block;
            background: rgba(0, 255, 255, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            border: 1px solid rgba(0, 255, 255, 0.4);
        }
        
        #stats {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-family: monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>🌊 Von Kármán Vortex Street</h3>
        
        <div class="control-group">
            <strong>🖱️ Mouse Controls:</strong><br>
            • Drag obstacle to move<br>
            • Scroll wheel to resize<br>
            • Shift + drag to rotate
        </div>
        
        <div class="control-group">
            <strong>⌨️ Keyboard:</strong><br>
            <span class="key">R</span> Reset flow<br>
            <span class="key">Space</span> Pause/Resume<br>
            <span class="key">V</span> Toggle vectors<br>
            <span class="key">S</span> Cycle shapes<br>
            <span class="key">C</span> Toggle color mode
        </div>
        
        <div class="control-group">
            <label>Flow Speed:
                <span class="value-display" id="speedVal">0.08</span>
            </label>
            <input type="range" id="flowSpeed" min="0.02" max="0.15" value="0.08" step="0.01">
        </div>
        
        <div class="control-group">
            <label>Reynolds Number:
                <span class="value-display" id="reynoldsVal">150</span>
            </label>
            <input type="range" id="reynolds" min="50" max="500" value="150" step="10">
        </div>
        
        <div class="control-group">
            <label>Obstacle Size:
                <span class="value-display" id="sizeVal">20</span>
            </label>
            <input type="range" id="obstacleSize" min="10" max="40" value="20" step="2">
        </div>
        
        <div class="control-group">
            <label>Obstacle Shape:</label>
            <select id="obstacleShape">
                <option value="circle">Circle</option>
                <option value="ellipse">Ellipse</option>
                <option value="square">Square</option>
                <option value="diamond">Diamond</option>
                <option value="airfoil">Airfoil</option>
            </select>
        </div>
        
        <div class="control-group">
            <label>Visualization:</label>
            <select id="vizMode">
                <option value="vorticity">Vorticity</option>
                <option value="velocity">Velocity Magnitude</option>
                <option value="pressure">Pressure</option>
                <option value="stream">Streamlines</option>
            </select>
        </div>
        
        <div class="control-group">
            <button onclick="resetFlow()">Reset Flow</button>
            <button onclick="togglePause()">Pause</button>
            <button onclick="toggleVectors()">Vectors</button>
        </div>
    </div>
    
    <div id="stats">
        FPS: <span id="fps">60</span> | 
        Grid: <span id="gridSize">200×100</span> | 
        Time: <span id="simTime">0</span>s |
        Vortices: <span id="vortexCount">0</span>
    </div>

    <script>
        // Lattice-Boltzmann D2Q9 model
        class LatticeBoltzmann {
            constructor(width, height) {
                this.width = width;
                this.height = height;
                this.viscosity = 0.02;
                
                // D2Q9 lattice directions
                this.ex = [0, 1, 0, -1, 0, 1, -1, -1, 1];
                this.ey = [0, 0, 1, 0, -1, 1, 1, -1, -1];
                this.w = [4/9, 1/9, 1/9, 1/9, 1/9, 1/36, 1/36, 1/36, 1/36];
                
                // Distribution functions
                this.f = new Array(9);
                this.ftemp = new Array(9);
                for (let i = 0; i < 9; i++) {
                    this.f[i] = new Float32Array(width * height);
                    this.ftemp[i] = new Float32Array(width * height);
                }
                
                // Macroscopic variables
                this.rho = new Float32Array(width * height);
                this.ux = new Float32Array(width * height);
                this.uy = new Float32Array(width * height);
                
                // Obstacle map
                this.obstacle = new Uint8Array(width * height);
                
                this.inletVelocity = 0.08;
                this.omega = 1.0 / (3.0 * this.viscosity + 0.5);
                
                this.initialize();
            }
            
            idx(x, y) {
                return x + y * this.width;
            }
            
            initialize() {
                // Initialize with uniform flow
                let rho0 = 1.0;
                let ux0 = this.inletVelocity;
                let uy0 = 0.0;
                
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        let idx = this.idx(x, y);
                        this.rho[idx] = rho0;
                        this.ux[idx] = ux0;
                        this.uy[idx] = uy0;
                        
                        // Initialize distribution functions at equilibrium
                        for (let i = 0; i < 9; i++) {
                            this.f[i][idx] = this.equilibrium(i, rho0, ux0, uy0);
                        }
                    }
                }
            }
            
            equilibrium(i, rho, ux, uy) {
                let eu = this.ex[i] * ux + this.ey[i] * uy;
                let u2 = ux * ux + uy * uy;
                return this.w[i] * rho * (1.0 + 3.0 * eu + 4.5 * eu * eu - 1.5 * u2);
            }
            
            setObstacle(cx, cy, radius, shape, rotation) {
                // Clear obstacle map
                this.obstacle.fill(0);
                
                let cos_r = Math.cos(rotation);
                let sin_r = Math.sin(rotation);
                
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        // Transform to local coordinates
                        let dx = x - cx;
                        let dy = y - cy;
                        
                        // Apply rotation
                        let local_x = dx * cos_r + dy * sin_r;
                        let local_y = -dx * sin_r + dy * cos_r;
                        
                        let isInside = false;
                        
                        switch(shape) {
                            case 'circle':
                                isInside = (local_x * local_x + local_y * local_y) < radius * radius;
                                break;
                                
                            case 'ellipse':
                                let a = radius * 1.5; // Semi-major axis
                                let b = radius * 0.7; // Semi-minor axis
                                isInside = (local_x * local_x) / (a * a) + (local_y * local_y) / (b * b) < 1;
                                break;
                                
                            case 'square':
                                isInside = Math.abs(local_x) < radius && Math.abs(local_y) < radius;
                                break;
                                
                            case 'diamond':
                                isInside = Math.abs(local_x) + Math.abs(local_y) < radius * 1.4;
                                break;
                                
                            case 'airfoil':
                                // NACA 0012-like airfoil
                                let chord = radius * 2;
                                let t = 0.12; // Thickness
                                if (Math.abs(local_x) < chord/2 && Math.abs(local_y) < chord/2) {
                                    let xn = (local_x + chord/2) / chord;
                                    let thickness = 5 * t * chord * (0.2969 * Math.sqrt(xn) - 0.1260 * xn - 
                                                  0.3516 * xn*xn + 0.2843 * xn*xn*xn - 0.1015 * xn*xn*xn*xn);
                                    isInside = Math.abs(local_y) < thickness;
                                }
                                break;
                        }
                        
                        if (isInside) {
                            this.obstacle[this.idx(x, y)] = 1;
                        }
                    }
                }
            }
            
            collide() {
                for (let idx = 0; idx < this.width * this.height; idx++) {
                    if (this.obstacle[idx]) continue;
                    
                    // Calculate macroscopic quantities
                    let rho = 0, ux = 0, uy = 0;
                    for (let i = 0; i < 9; i++) {
                        rho += this.f[i][idx];
                        ux += this.f[i][idx] * this.ex[i];
                        uy += this.f[i][idx] * this.ey[i];
                    }
                    ux /= rho;
                    uy /= rho;
                    
                    this.rho[idx] = rho;
                    this.ux[idx] = ux;
                    this.uy[idx] = uy;
                    
                    // Collision step (BGK)
                    for (let i = 0; i < 9; i++) {
                        let feq = this.equilibrium(i, rho, ux, uy);
                        this.f[i][idx] = this.f[i][idx] - this.omega * (this.f[i][idx] - feq);
                    }
                }
            }
            
            stream() {
                // Copy to temp
                for (let i = 0; i < 9; i++) {
                    this.ftemp[i].set(this.f[i]);
                }
                
                // Streaming step
                for (let y = 0; y < this.height; y++) {
                    for (let x = 0; x < this.width; x++) {
                        let idx = this.idx(x, y);
                        
                        if (this.obstacle[idx]) {
                            // Bounce-back boundary condition
                            for (let i = 0; i < 9; i++) {
                                let xn = x - this.ex[i];
                                let yn = y - this.ey[i];
                                
                                if (xn >= 0 && xn < this.width && yn >= 0 && yn < this.height) {
                                    let idxn = this.idx(xn, yn);
                                    if (!this.obstacle[idxn]) {
                                        // Opposite direction indices
                                        let opp = [0, 3, 4, 1, 2, 7, 8, 5, 6];
                                        this.f[opp[i]][idxn] = this.ftemp[i][idx];
                                    }
                                }
                            }
                        } else {
                            // Normal streaming
                            for (let i = 0; i < 9; i++) {
                                let xn = x - this.ex[i];
                                let yn = y - this.ey[i];
                                
                                if (xn >= 0 && xn < this.width && yn >= 0 && yn < this.height) {
                                    let idxn = this.idx(xn, yn);
                                    if (!this.obstacle[idxn]) {
                                        this.f[i][idx] = this.ftemp[i][idxn];
                                    }
                                }
                            }
                        }
                    }
                }
            }
            
            boundaries() {
                // Inlet (left boundary) - constant velocity
                for (let y = 1; y < this.height - 1; y++) {
                    let idx = this.idx(0, y);
                    let rho = 1.0;
                    let ux = this.inletVelocity;
                    let uy = 0.0;
                    
                    for (let i = 0; i < 9; i++) {
                        this.f[i][idx] = this.equilibrium(i, rho, ux, uy);
                    }
                }
                
                // Outlet (right boundary) - zero gradient
                for (let y = 1; y < this.height - 1; y++) {
                    for (let i = 0; i < 9; i++) {
                        this.f[i][this.idx(this.width - 1, y)] = this.f[i][this.idx(this.width - 2, y)];
                    }
                }
                
                // Top and bottom - slip boundary
                for (let x = 0; x < this.width; x++) {
                    // Top
                    this.f[4][this.idx(x, this.height - 1)] = this.f[2][this.idx(x, this.height - 1)];
                    this.f[7][this.idx(x, this.height - 1)] = this.f[5][this.idx(x, this.height - 1)];
                    this.f[8][this.idx(x, this.height - 1)] = this.f[6][this.idx(x, this.height - 1)];
                    
                    // Bottom
                    this.f[2][this.idx(x, 0)] = this.f[4][this.idx(x, 0)];
                    this.f[5][this.idx(x, 0)] = this.f[7][this.idx(x, 0)];
                    this.f[6][this.idx(x, 0)] = this.f[8][this.idx(x, 0)];
                }
            }
            
            step() {
                this.collide();
                this.stream();
                this.boundaries();
            }
            
            getVorticity(x, y) {
                if (x <= 0 || x >= this.width - 1 || y <= 0 || y >= this.height - 1) return 0;
                
                let idx_right = this.idx(x + 1, y);
                let idx_left = this.idx(x - 1, y);
                let idx_top = this.idx(x, y + 1);
                let idx_bottom = this.idx(x, y - 1);
                
                let dvx_dy = (this.ux[idx_top] - this.ux[idx_bottom]) / 2;
                let dvy_dx = (this.uy[idx_right] - this.uy[idx_left]) / 2;
                
                return dvy_dx - dvx_dy;
            }
        }
        
        let lbm;
        let gridWidth = 200;
        let gridHeight = 100;
        let cellSize = 5;
        
        let obstacle = {
            x: 50,
            y: 50,
            size: 20,
            shape: 'circle',
            rotation: 0,
            isDragging: false,
            isRotating: false
        };
        
        let isPaused = false;
        let showVectors = false;
        let vizMode = 'vorticity';
        let simTime = 0;
        
        function setup() {
            createCanvas(gridWidth * cellSize, gridHeight * cellSize);
            
            lbm = new LatticeBoltzmann(gridWidth, gridHeight);
            lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
            
            setupControls();
        }
        
        function draw() {
            if (!isPaused) {
                // Multiple steps per frame for better stability
                for (let i = 0; i < 2; i++) {
                    lbm.step();
                }
                simTime += 0.016;
            }
            
            // Render fluid field
            renderField();
            
            // Draw obstacle
            drawObstacle();
            
            // Draw velocity vectors if enabled
            if (showVectors) {
                drawVelocityVectors();
            }
            
            // Handle mouse interaction
            handleMouse();
            
            // Update stats
            if (frameCount % 10 === 0) {
                updateStats();
            }
        }
        
        function renderField() {
            loadPixels();
            
            for (let y = 0; y < gridHeight; y++) {
                for (let x = 0; x < gridWidth; x++) {
                    let idx = lbm.idx(x, y);
                    let col;
                    
                    if (lbm.obstacle[idx]) {
                        col = color(50, 50, 50);
                    } else {
                        switch(vizMode) {
                            case 'vorticity':
                                let vort = lbm.getVorticity(x, y);
                                vort = constrain(vort, -0.1, 0.1);
                                if (vort > 0) {
                                    col = lerpColor(color(0, 0, 0), color(255, 0, 0), vort * 10);
                                } else {
                                    col = lerpColor(color(0, 0, 0), color(0, 0, 255), -vort * 10);
                                }
                                break;
                                
                            case 'velocity':
                                let speed = Math.sqrt(lbm.ux[idx] * lbm.ux[idx] + lbm.uy[idx] * lbm.uy[idx]);
                                speed = constrain(speed * 5, 0, 1);
                                col = lerpColor(color(0, 0, 50), color(0, 255, 255), speed);
                                break;
                                
                            case 'pressure':
                                let pressure = (lbm.rho[idx] - 1.0) * 100;
                                pressure = constrain(pressure + 0.5, 0, 1);
                                col = lerpColor(color(0, 0, 100), color(255, 255, 0), pressure);
                                break;
                                
                            case 'stream':
                                // Simple streamline visualization based on flow angle
                                let angle = atan2(lbm.uy[idx], lbm.ux[idx]);
                                let hue = map(angle, -PI, PI, 0, 360);
                                colorMode(HSB);
                                col = color(hue, 100, 50);
                                colorMode(RGB);
                                break;
                        }
                    }
                    
                    // Draw pixels for each cell
                    for (let py = 0; py < cellSize; py++) {
                        for (let px = 0; px < cellSize; px++) {
                            let pixelIdx = 4 * ((y * cellSize + py) * width + (x * cellSize + px));
                            pixels[pixelIdx] = red(col);
                            pixels[pixelIdx + 1] = green(col);
                            pixels[pixelIdx + 2] = blue(col);
                            pixels[pixelIdx + 3] = 255;
                        }
                    }
                }
            }
            
            updatePixels();
        }
        
        function drawObstacle() {
            push();
            fill(100, 100, 100, 200);
            stroke(255, 255, 255, 100);
            strokeWeight(2);
            
            translate(obstacle.x * cellSize, obstacle.y * cellSize);
            rotate(obstacle.rotation);
            
            switch(obstacle.shape) {
                case 'circle':
                    ellipse(0, 0, obstacle.size * 2, obstacle.size * 2);
                    break;
                case 'ellipse':
                    ellipse(0, 0, obstacle.size * 3, obstacle.size * 1.4);
                    break;
                case 'square':
                    rectMode(CENTER);
                    rect(0, 0, obstacle.size * 2, obstacle.size * 2);
                    break;
                case 'diamond':
                    beginShape();
                    vertex(0, -obstacle.size * 1.4);
                    vertex(obstacle.size * 1.4, 0);
                    vertex(0, obstacle.size * 1.4);
                    vertex(-obstacle.size * 1.4, 0);
                    endShape(CLOSE);
                    break;
                case 'airfoil':
                    // Simplified airfoil shape
                    beginShape();
                    for (let t = 0; t <= TWO_PI; t += 0.1) {
                        let x = obstacle.size * 2 * (cos(t) + 0.3);
                        let y = obstacle.size * 0.5 * sin(t);
                        vertex(x, y);
                    }
                    endShape(CLOSE);
                    break;
            }
            pop();
        }
        
        function drawVelocityVectors() {
            stroke(255, 255, 0, 100);
            strokeWeight(1);
            
            let step = 5;
            for (let y = 0; y < gridHeight; y += step) {
                for (let x = 0; x < gridWidth; x += step) {
                    let idx = lbm.idx(x, y);
                    if (!lbm.obstacle[idx]) {
                        let px = x * cellSize + cellSize/2;
                        let py = y * cellSize + cellSize/2;
                        let vx = lbm.ux[idx] * 50;
                        let vy = lbm.uy[idx] * 50;
                        
                        line(px, py, px + vx, py + vy);
                        
                        // Arrowhead
                        push();
                        translate(px + vx, py + vy);
                        rotate(atan2(vy, vx));
                        line(0, 0, -3, -2);
                        line(0, 0, -3, 2);
                        pop();
                    }
                }
            }
        }
        
        function handleMouse() {
            let gridX = mouseX / cellSize;
            let gridY = mouseY / cellSize;
            
            if (mouseIsPressed) {
                if (!obstacle.isDragging && !obstacle.isRotating) {
                    let dist = sqrt(pow(gridX - obstacle.x, 2) + pow(gridY - obstacle.y, 2));
                    if (dist < obstacle.size / cellSize) {
                        if (keyIsDown(SHIFT)) {
                            obstacle.isRotating = true;
                        } else {
                            obstacle.isDragging = true;
                        }
                    }
                }
                
                if (obstacle.isDragging) {
                    obstacle.x = constrain(gridX, 10, gridWidth - 10);
                    obstacle.y = constrain(gridY, 10, gridHeight - 10);
                    lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
                } else if (obstacle.isRotating) {
                    let angle = atan2(gridY - obstacle.y, gridX - obstacle.x);
                    obstacle.rotation = angle;
                    lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
                }
            } else {
                obstacle.isDragging = false;
                obstacle.isRotating = false;
            }
        }
        
        function mouseWheel(event) {
            // Resize obstacle with mouse wheel
            obstacle.size = constrain(obstacle.size - event.delta * 0.01, 10, 40);
            document.getElementById('obstacleSize').value = obstacle.size;
            document.getElementById('sizeVal').textContent = Math.round(obstacle.size);
            lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
            return false;
        }
        
        function setupControls() {
            // Flow speed control
            document.getElementById('flowSpeed').addEventListener('input', function(e) {
                lbm.inletVelocity = parseFloat(e.target.value);
                document.getElementById('speedVal').textContent = lbm.inletVelocity.toFixed(2);
            });
            
            // Reynolds number control (adjusts viscosity)
            document.getElementById('reynolds').addEventListener('input', function(e) {
                let Re = parseInt(e.target.value);
                document.getElementById('reynoldsVal').textContent = Re;
                // Re = U*L/ν, so ν = U*L/Re
                lbm.viscosity = lbm.inletVelocity * obstacle.size / Re;
                lbm.omega = 1.0 / (3.0 * lbm.viscosity + 0.5);
            });
            
            // Obstacle size control
            document.getElementById('obstacleSize').addEventListener('input', function(e) {
                obstacle.size = parseInt(e.target.value);
                document.getElementById('sizeVal').textContent = obstacle.size;
                lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
            });
            
            // Shape selector
            document.getElementById('obstacleShape').addEventListener('change', function(e) {
                obstacle.shape = e.target.value;
                lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
            });
            
            // Visualization mode
            document.getElementById('vizMode').addEventListener('change', function(e) {
                vizMode = e.target.value;
            });
        }
        
        function updateStats() {
            document.getElementById('fps').textContent = Math.round(frameRate());
            document.getElementById('simTime').textContent = simTime.toFixed(1);
            
            // Count vortices (simplified - counts high vorticity regions)
            let vortexCount = 0;
            for (let y = 1; y < gridHeight - 1; y++) {
                for (let x = 1; x < gridWidth - 1; x++) {
                    if (Math.abs(lbm.getVorticity(x, y)) > 0.05) {
                        vortexCount++;
                    }
                }
            }
            document.getElementById('vortexCount').textContent = Math.floor(vortexCount / 10);
        }
        
        function keyPressed() {
            switch(key.toLowerCase()) {
                case 'r':
                    resetFlow();
                    break;
                case ' ':
                    togglePause();
                    break;
                case 'v':
                    toggleVectors();
                    break;
                case 's':
                    // Cycle through shapes
                    let shapes = ['circle', 'ellipse', 'square', 'diamond', 'airfoil'];
                    let currentIdx = shapes.indexOf(obstacle.shape);
                    obstacle.shape = shapes[(currentIdx + 1) % shapes.length];
                    document.getElementById('obstacleShape').value = obstacle.shape;
                    lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
                    break;
                case 'c':
                    // Cycle visualization modes
                    let modes = ['vorticity', 'velocity', 'pressure', 'stream'];
                    let modeIdx = modes.indexOf(vizMode);
                    vizMode = modes[(modeIdx + 1) % modes.length];
                    document.getElementById('vizMode').value = vizMode;
                    break;
            }
        }
        
        function resetFlow() {
            lbm.initialize();
            lbm.setObstacle(obstacle.x, obstacle.y, obstacle.size / cellSize, obstacle.shape, obstacle.rotation);
            simTime = 0;
        }
        
        function togglePause() {
            isPaused = !isPaused;
        }
        
        function toggleVectors() {
            showVectors = !showVectors;
        }
    </script>
</body>
</html>
