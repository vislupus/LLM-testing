<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Vortex Street Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(20, 20, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            z-index: 100;
            max-width: 280px;
        }
        #controls h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #4fc3f7;
        }
        .control-group {
            margin-bottom: 10px;
        }
        .control-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 3px;
            color: #aaa;
        }
        .control-group input[type="range"] {
            width: 100%;
        }
        .control-group select {
            width: 100%;
            padding: 4px;
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .info {
            font-size: 11px;
            color: #666;
            margin-top: 8px;
            line-height: 1.4;
        }
        .fps {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
            color: #4fc3f7;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="controls">
        <h2>Vortex Street Simulation</h2>
        <div class="control-group">
            <label>Obstacle Shape</label>
            <select id="shapeSelect">
                <option value="circle">Circle</option>
                <option value="ellipse">Ellipse</option>
                <option value="rectangle">Rectangle</option>
            </select>
        </div>
        <div class="control-group">
            <label>Size: <span id="sizeVal">40</span></label>
            <input type="range" id="sizeSlider" min="15" max="80" value="40">
        </div>
        <div class="control-group">
            <label>Aspect Ratio: <span id="aspectVal">1.0</span></label>
            <input type="range" id="aspectSlider" min="0.3" max="3.0" step="0.1" value="1.0">
        </div>
        <div class="control-group">
            <label>Inflow Speed: <span id="speedVal">0.15</span></label>
            <input type="range" id="speedSlider" min="0.02" max="0.4" step="0.01" value="0.15">
        </div>
        <div class="control-group">
            <label>Viscosity: <span id="viscVal">0.0001</span></label>
            <input type="range" id="viscSlider" min="0.00001" max="0.001" step="0.00001" value="0.0001">
        </div>
        <div class="control-group">
            <label>Particle Count: <span id="particleVal">2000</span></label>
            <input type="range" id="particleSlider" min="500" max="5000" step="100" value="2000">
        </div>
        <div class="info">
            <strong>Controls:</strong><br>
            • Drag obstacle with mouse<br>
            • <strong>R</strong> key to rotate<br>
            • <strong>Space</strong> to reset flow<br>
            • <strong>V</strong> to toggle vectors<br>
            • <strong>C</strong> to toggle color mode
        </div>
    </div>
    <div class="fps" id="fps">FPS: --</div>

    <script>
        // Simulation parameters
        let N = 120; // Grid resolution
        let iter = 4; // Solver iterations
        let dt = 0.2;
        let diff = 0.0001; // Viscosity
        let inflowSpeed = 0.15;

        // Fluid arrays
        let size;
        let u, v, u_prev, v_prev;
        let dens, dens_prev;

        // Obstacle
        let obs = {
            x: 0, y: 0,
            size: 40,
            aspect: 1.0,
            angle: 0,
            shape: 'circle',
            dragging: false,
            dragOffsetX: 0,
            dragOffsetY: 0
        };

        // Particles
        let particles = [];
        let numParticles = 2000;

        // Display
        let showVectors = false;
        let colorMode = true; // true = vorticity, false = speed
        let vectorSkip = 6;

        // Canvas
        let canvas;
        let cellSize;

        function setup() {
            canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent(document.body);

            obs.x = width * 0.35;
            obs.y = height * 0.5;

            initFluid();
            initParticles();

            // UI bindings
            document.getElementById('shapeSelect').addEventListener('change', (e) => {
                obs.shape = e.target.value;
                resetFluid();
            });
            document.getElementById('sizeSlider').addEventListener('input', (e) => {
                obs.size = parseInt(e.target.value);
                document.getElementById('sizeVal').textContent = obs.size;
            });
            document.getElementById('aspectSlider').addEventListener('input', (e) => {
                obs.aspect = parseFloat(e.target.value);
                document.getElementById('aspectVal').textContent = obs.aspect;
            });
            document.getElementById('speedSlider').addEventListener('input', (e) => {
                inflowSpeed = parseFloat(e.target.value);
                document.getElementById('speedVal').textContent = inflowSpeed;
            });
            document.getElementById('viscSlider').addEventListener('input', (e) => {
                diff = parseFloat(e.target.value);
                document.getElementById('viscVal').textContent = diff;
            });
            document.getElementById('particleSlider').addEventListener('input', (e) => {
                numParticles = parseInt(e.target.value);
                document.getElementById('particleVal').textContent = numParticles;
                initParticles();
            });
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            initFluid();
            initParticles();
        }

        function initFluid() {
            size = (N + 2) * (N + 2);
            u = new Float32Array(size);
            v = new Float32Array(size);
            u_prev = new Float32Array(size);
            v_prev = new Float32Array(size);
            dens = new Float32Array(size);
            dens_prev = new Float32Array(size);
            cellSize = width / N;
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: random(width),
                    y: random(height),
                    life: random(100, 300),
                    maxLife: 300,
                    age: 0
                });
            }
        }

        function resetFluid() {
            for (let i = 0; i < size; i++) {
                u[i] = v[i] = u_prev[i] = v_prev[i] = dens[i] = dens_prev[i] = 0;
            }
            initParticles();
        }

        function IX(x, y) {
            x = constrain(floor(x), 0, N + 1);
            y = constrain(floor(y), 0, N + 1);
            return x + (N + 2) * y;
        }

        function add_source(x, s, dt) {
            for (let i = 0; i < size; i++) {
                x[i] += dt * s[i];
            }
        }

        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
                x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
            }
            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
            x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
            x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
        }

        function lin_solve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;
            for (let k = 0; k < iter; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (
                            x[IX(i + 1, j)] +
                            x[IX(i - 1, j)] +
                            x[IX(i, j + 1)] +
                            x[IX(i, j - 1)]
                        )) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff, dt) {
            let a = dt * diff * N * N;
            lin_solve(b, x, x0, a, 1 + 4 * a);
        }

        function project(u, v, p, div) {
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    div[IX(i, j)] = -0.5 * (
                        u[IX(i + 1, j)] - u[IX(i - 1, j)] +
                        v[IX(i, j + 1)] - v[IX(i, j - 1)]
                    ) / N;
                    p[IX(i, j)] = 0;
                }
            }
            set_bnd(0, div);
            set_bnd(0, p);
            lin_solve(0, p, div, 1, 4);

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    u[IX(i, j)] -= 0.5 * N * (p[IX(i + 1, j)] - p[IX(i - 1, j)]);
                    v[IX(i, j)] -= 0.5 * N * (p[IX(i, j + 1)] - p[IX(i, j - 1)]);
                }
            }
            set_bnd(1, u);
            set_bnd(2, v);
        }

        function advect(b, d, d0, u, v, dt) {
            let i0, j0, i1, j1;
            let x, y, s0, t0, s1, t1;
            let dt0 = dt * N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    x = i - dt0 * u[IX(i, j)];
                    y = j - dt0 * v[IX(i, j)];

                    if (x < 0.5) x = 0.5;
                    if (x > N + 0.5) x = N + 0.5;
                    i0 = floor(x);
                    i1 = i0 + 1;

                    if (y < 0.5) y = 0.5;
                    if (y > N + 0.5) y = N + 0.5;
                    j0 = floor(y);
                    j1 = j0 + 1;

                    s1 = x - i0;
                    s0 = 1.0 - s1;
                    t1 = y - j0;
                    t0 = 1.0 - t1;

                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                                   s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        function stepFluid() {
            // Add inflow
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= 3; i++) {
                    u[IX(i, j)] = inflowSpeed;
                    v[IX(i, j)] = 0;
                }
            }

            // Velocity step
            diffuse(1, u_prev, u, diff, dt);
            diffuse(2, v_prev, v, diff, dt);
            project(u_prev, v_prev, u, v);
            advect(1, u, u_prev, u_prev, v_prev, dt);
            advect(2, v, v_prev, u_prev, v_prev, dt);
            project(u, v, u_prev, v_prev);

            // Density step (for dye visualization)
            diffuse(0, dens_prev, dens, diff, dt);
            advect(0, dens, dens_prev, u, v, dt);

            // Fade density
            for (let i = 0; i < size; i++) {
                dens[i] *= 0.995;
            }

            // Add dye at inflow
            for (let j = N * 0.3; j <= N * 0.7; j++) {
                dens[IX(2, floor(j))] += 0.5;
            }

            applyObstacle();
        }

        function applyObstacle() {
            let gx = obs.x / cellSize;
            let gy = obs.y / cellSize;
            let gSize = obs.size / cellSize;
            let gAspect = obs.aspect;
            let cosA = cos(obs.angle);
            let sinA = sin(obs.angle);

            let range = ceil(gSize * max(gAspect, 1.0 / gAspect) * 1.5);

            for (let j = max(1, floor(gy - range)); j <= min(N, floor(gy + range)); j++) {
                for (let i = max(1, floor(gx - range)); i <= min(N, floor(gx + range)); i++) {
                    let dx = i - gx;
                    let dy = j - gy;

                    // Rotate to obstacle local space
                    let lx = dx * cosA + dy * sinA;
                    let ly = -dx * sinA + dy * cosA;

                    let inside = false;

                    if (obs.shape === 'circle') {
                        inside = (lx * lx + ly * ly) < (gSize * gSize * 0.25);
                    } else if (obs.shape === 'ellipse') {
                        inside = ((lx * lx) / (gSize * gSize * 0.25) + (ly * ly) / (gSize * gSize * gAspect * gAspect * 0.25)) < 1;
                    } else if (obs.shape === 'rectangle') {
                        inside = abs(lx) < gSize * 0.5 && abs(ly) < gSize * gAspect * 0.5;
                    }

                    if (inside) {
                        u[IX(i, j)] = 0;
                        v[IX(i, j)] = 0;
                        dens[IX(i, j)] = 0;
                    }
                }
            }
        }

        function getVelocity(px, py) {
            let i = px / cellSize;
            let j = py / cellSize;
            i = constrain(i, 0.5, N + 0.5);
            j = constrain(j, 0.5, N + 0.5);

            let i0 = floor(i);
            let i1 = i0 + 1;
            let j0 = floor(j);
            let j1 = j0 + 1;

            let s1 = i - i0;
            let s0 = 1 - s1;
            let t1 = j - j0;
            let t0 = 1 - t1;

            let vx = s0 * (t0 * u[IX(i0, j0)] + t1 * u[IX(i0, j1)]) +
                     s1 * (t0 * u[IX(i1, j0)] + t1 * u[IX(i1, j1)]);
            let vy = s0 * (t0 * v[IX(i0, j0)] + t1 * v[IX(i0, j1)]) +
                     s1 * (t0 * v[IX(i1, j0)] + t1 * v[IX(i1, j1)]);

            return { x: vx, y: vy };
        }

        function getVorticity(i, j) {
            if (i < 1 || i > N || j < 1 || j > N) return 0;
            return (v[IX(i + 1, j)] - v[IX(i - 1, j)]) - (u[IX(i, j + 1)] - u[IX(i, j - 1)]);
        }

        function getSpeed(i, j) {
            if (i < 1 || i > N || j < 1 || j > N) return 0;
            return sqrt(u[IX(i, j)] * u[IX(i, j)] + v[IX(i, j)] * v[IX(i, j)]);
        }

        function draw() {
            stepFluid();

            background(5, 5, 15);

            // Draw flow field
            loadPixels();
            let d = pixelDensity();

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let vort = getVorticity(i, j);
                    let spd = getSpeed(i, j);

                    let r, g, b_val;

                    if (colorMode) {
                        // Vorticity coloring: blue for clockwise, red for counter-clockwise
                        let intensity = constrain(abs(vort) * 800, 0, 255);
                        if (vort > 0) {
                            r = intensity;
                            g = intensity * 0.3;
                            b_val = 0;
                        } else {
                            r = 0;
                            g = intensity * 0.3;
                            b_val = intensity;
                        }
                        // Add speed brightness
                        let brightness = constrain(spd * 500, 30, 100);
                        r = min(255, r + brightness);
                        g = min(255, g + brightness);
                        b_val = min(255, b_val + brightness);
                    } else {
                        // Speed coloring
                        let t = constrain(spd * 400, 0, 255);
                        r = t;
                        g = t * 0.7;
                        b_val = t * 0.3 + 50;
                    }

                    let px = floor(i * cellSize);
                    let py = floor(j * cellSize);
                    let pw = floor(cellSize);
                    let ph = floor(cellSize);

                    for (let dy = 0; dy < ph; dy++) {
                        for (let dx = 0; dx < pw; dx++) {
                            let idx = 4 * ((py + dy) * width * d + (px + dx)) * d;
                            if (idx < pixels.length - 3) {
                                pixels[idx] = r;
                                pixels[idx + 1] = g;
                                pixels[idx + 2] = b_val;
                                pixels[idx + 3] = 255;
                            }
                        }
                    }
                }
            }
            updatePixels();

            // Draw particles
            noStroke();
            for (let p of particles) {
                let vel = getVelocity(p.x, p.y);

                // Check collision with obstacle
                let dx = p.x - obs.x;
                let dy = p.y - obs.y;
                let lx = dx * cos(obs.angle) + dy * sin(obs.angle);
                let ly = -dx * sin(obs.angle) + dy * cos(obs.angle);

                let inside = false;
                if (obs.shape === 'circle') {
                    inside = (lx * lx + ly * ly) < (obs.size * obs.size * 0.25);
                } else if (obs.shape === 'ellipse') {
                    inside = ((lx * lx) / (obs.size * obs.size * 0.25) + (ly * ly) / (obs.size * obs.size * obs.aspect * obs.aspect * 0.25)) < 1;
                } else if (obs.shape === 'rectangle') {
                    inside = abs(lx) < obs.size * 0.5 && abs(ly) < obs.size * obs.aspect * 0.5;
                }

                if (inside) {
                    p.x = random(width);
                    p.y = random(height);
                    p.age = 0;
                    continue;
                }

                p.x += vel.x * cellSize * dt * 5;
                p.y += vel.y * cellSize * dt * 5;
                p.age++;

                // Wrap or reset
                if (p.x > width || p.x < 0 || p.y > height || p.y < 0 || p.age > p.life) {
                    p.x = random(5, 20);
                    p.y = random(height);
                    p.age = 0;
                    p.life = random(100, 300);
                }

                let alpha = map(p.age, 0, p.life, 255, 0);
                let speed = sqrt(vel.x * vel.x + vel.y * vel.y);

                fill(255, 255, 255, alpha * 0.6);
                ellipse(p.x, p.y, 2, 2);
            }

            // Draw velocity vectors
            if (showVectors) {
                stroke(255, 255, 255, 80);
                strokeWeight(0.5);
                for (let j = 1; j < N; j += vectorSkip) {
                    for (let i = 1; i < N; i += vectorSkip) {
                        let x = i * cellSize;
                        let y = j * cellSize;
                        let vx = u[IX(i, j)] * cellSize * 2;
                        let vy = v[IX(i, j)] * cellSize * 2;
                        line(x, y, x + vx, y + vy);
                        // Arrowhead
                        let angle = atan2(vy, vx);
                        let headSize = 3;
                        line(x + vx, y + vy, 
                             x + vx - headSize * cos(angle - PI/6), 
                             y + vy - headSize * sin(angle - PI/6));
                        line(x + vx, y + vy, 
                             x + vx - headSize * cos(angle + PI/6), 
                             y + vy - headSize * sin(angle + PI/6));
                    }
                }
            }

            // Draw obstacle
            push();
            translate(obs.x, obs.y);
            rotate(obs.angle);

            // Glow effect
            noFill();
            stroke(100, 200, 255, 100);
            strokeWeight(3);
            if (obs.shape === 'circle') {
                ellipse(0, 0, obs.size + 6, obs.size + 6);
            } else if (obs.shape === 'ellipse') {
                ellipse(0, 0, obs.size + 6, obs.size * obs.aspect + 6);
            } else if (obs.shape === 'rectangle') {
                rectMode(CENTER);
                rect(0, 0, obs.size + 6, obs.size * obs.aspect + 6, 4);
            }

            // Main body
            fill(40, 60, 100, 200);
            stroke(100, 180, 255, 200);
            strokeWeight(2);
            if (obs.shape === 'circle') {
                ellipse(0, 0, obs.size, obs.size);
            } else if (obs.shape === 'ellipse') {
                ellipse(0, 0, obs.size, obs.size * obs.aspect);
            } else if (obs.shape === 'rectangle') {
                rectMode(CENTER);
                rect(0, 0, obs.size, obs.size * obs.aspect, 3);
            }

            // Rotation indicator
            stroke(255, 255, 255, 150);
            strokeWeight(2);
            line(0, 0, obs.size * 0.4, 0);
            ellipse(obs.size * 0.4, 0, 5, 5);

            pop();

            // Draw drag hint
            if (obs.dragging) {
                noFill();
                stroke(255, 255, 0, 150);
                strokeWeight(2);
                ellipse(obs.x, obs.y, obs.size * 1.5, obs.size * 1.5);
            }

            // Update FPS
            if (frameCount % 10 === 0) {
                document.getElementById('fps').textContent = 'FPS: ' + floor(frameRate());
            }
        }

        function mousePressed() {
            let d = dist(mouseX, mouseY, obs.x, obs.y);
            if (d < obs.size * 0.8) {
                obs.dragging = true;
                obs.dragOffsetX = obs.x - mouseX;
                obs.dragOffsetY = obs.y - mouseY;
            }
        }

        function mouseDragged() {
            if (obs.dragging) {
                obs.x = mouseX + obs.dragOffsetX;
                obs.y = mouseY + obs.dragOffsetY;
                obs.x = constrain(obs.x, obs.size, width - obs.size);
                obs.y = constrain(obs.y, obs.size, height - obs.size);
            }
        }

        function mouseReleased() {
            obs.dragging = false;
        }

        function keyPressed() {
            if (key === 'r' || key === 'R') {
                obs.angle += PI / 8;
            }
            if (key === ' ') {
                resetFluid();
            }
            if (key === 'v' || key === 'V') {
                showVectors = !showVectors;
            }
            if (key === 'c' || key === 'C') {
                colorMode = !colorMode;
            }
        }
    </script>
</body>
</html>
