<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Von Kármán Vortex Street Simulator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #050810; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    
    #ui {
      position: absolute; top: 15px; left: 15px;
      background: rgba(12, 15, 25, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 160, 255, 0.2);
      border-radius: 10px; padding: 14px; width: 260px;
      color: #d0e0ff; box-shadow: 0 6px 20px rgba(0,0,0,0.6);
      pointer-events: auto; user-select: none;
    }
    #ui h2 { font-size: 14px; color: #88ccff; margin-bottom: 8px; letter-spacing: 0.5px; }
    .ctrl { margin-bottom: 8px; }
    .ctrl label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; color: #8899bb; }
    .ctrl input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(100,150,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .ctrl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #88ccff; border-radius: 50%; cursor: pointer; }
    .ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: #88ccff; border-radius: 50%; cursor: pointer; border: none; }
    .ctrl select { width: 100%; padding: 4px; background: rgba(20,25,40,0.9); border: 1px solid rgba(100,150,255,0.3); color: #ccc; border-radius: 4px; font-size: 12px; cursor: pointer; }
    .info { font-size: 10px; color: #667799; margin: 6px 0; line-height: 1.4; }
    .stat { display: flex; justify-content: space-between; font-size: 11px; margin: 4px 0; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); }
    .stat span { color: #88ccff; font-weight: bold; }
    .legend { height: 10px; margin: 6px 0 2px 0; border-radius: 3px; background: linear-gradient(90deg, #0000aa, #00aaff, #000, #ffaa00, #ff0000); }
    .legend-labels { display: flex; justify-content: space-between; font-size: 9px; color: #556688; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>🌊 Fluid Dynamics Lab</h2>
    <div class="info">🖱️ Drag to move obstacle<br>⌨️ <kbd>R</kbd> reset flow • <kbd>Space</kbd> pause</div>
    
    <div class="ctrl">
      <label>Shape</label>
      <select id="shape-select" onchange="updateObstacle()">
        <option value="circle">Circle</option>
        <option value="ellipse">Ellipse</option>
        <option value="rect">Rectangle</option>
        <option value="triangle">Triangle</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Size <span id="val-size">12</span></label>
      <input type="range" id="slider-size" min="6" max="20" step="1" value="12">
    </div>
    <div class="ctrl">
      <label>Rotation <span id="val-rot">0°</span></label>
      <input type="range" id="slider-rot" min="0" max="360" step="1" value="0">
    </div>
    <div class="ctrl">
      <label>Flow Speed <span id="val-speed">0.06</span></label>
      <input type="range" id="slider-speed" min="0.02" max="0.12" step="0.01" value="0.06">
    </div>
    <div class="ctrl">
      <label>Viscosity <span id="val-visc">0.050</span></label>
      <input type="range" id="slider-visc" min="0.01" max="0.15" step="0.005" value="0.05">
    </div>
    <div class="ctrl">
      <label>Visualization</label>
      <select id="viz-select">
        <option value="vorticity">Vorticity (Curl)</option>
        <option value="speed">Flow Speed</option>
        <option value="density">Density</option>
      </select>
    </div>
    
    <div class="stat">Reynolds #: <span id="stat-re">--</span></div>
    <div class="stat">FPS: <span id="stat-fps">--</span></div>
    
    <div class="legend"></div>
    <div class="legend-labels"><span>-ω</span><span>0</span><span>+ω</span></div>
  </div>

  <script>
    /* ===== LATTICE BOLTZMANN METHOD (D2Q9) ===== 
       Simulates incompressible Navier-Stokes equations.
       Grid: Nx * Ny. 9 discrete velocity directions.
       BGK collision model + bounce-back boundaries. */
    
    const Q = 9;
    const cx = [0, 1, 0, -1, 0, 1, -1, -1, 1];
    const cy = [0, 0, 1, 0, -1, 1, 1, -1, -1];
    const w  = [4/9, 1/9, 1/9, 1/9, 1/9, 1/36, 1/36, 1/36, 1/36];
    const opp = [0, 3, 4, 1, 2, 7, 8, 5, 6];

    let N = 200, M = 80; // Grid dimensions
    let f = Array.from({length: Q}, () => new Float32Array(N * M));
    let fNew = Array.from({length: Q}, () => new Float32Array(N * M));
    let solid = new Uint8Array(N * M);
    let ux = new Float32Array(N * M);
    let uy = new Float32Array(N * M);
    let rho = new Float32Array(N * M);
    let field = new Float32Array(N * M); // For visualization

    let tau = 0.65; // Relaxation time (controls viscosity: nu = (tau-0.5)/3)
    let uIn = 0.06; // Inlet velocity
    let isPaused = false;
    let frameCounter = 0;

    // Obstacle properties
    let obs = { x: 40, y: M/2, size: 12, angle: 0, shape: 'circle' };
    let dragging = false, dragOffX = 0, dragOffY = 0;

    // Visualization buffer
    let vizCanvas;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      vizCanvas = createGraphics(N, M);
      vizCanvas.pixelDensity(1);
      
      resetFlow();
      updateObstacle();
      
      // UI bindings
      document.getElementById('slider-size').addEventListener('input', e => { obs.size = parseInt(e.target.value); document.getElementById('val-size').textContent = e.target.value; updateObstacle(); });
      document.getElementById('slider-rot').addEventListener('input', e => { obs.angle = parseInt(e.target.value); document.getElementById('val-rot').textContent = e.target.value + '°'; updateObstacle(); });
      document.getElementById('slider-speed').addEventListener('input', e => { uIn = parseFloat(e.target.value); document.getElementById('val-speed').textContent = e.target.value; });
      document.getElementById('slider-visc').addEventListener('input', e => { tau = parseFloat(e.target.value) * 3 + 0.5; document.getElementById('val-visc').textContent = e.target.value; });
    }

    function resetFlow() {
      // Initialize to rest
      for (let k=0; k<Q; k++) f[k].fill(0);
      for (let k=0; k<Q; k++) fNew[k].fill(0);
      solid.fill(0);
      ux.fill(0); uy.fill(0); rho.fill(1.0);
      frameCounter = 0;
      isPaused = false;
      
      // Top/Bottom walls
      for (let i=0; i<N; i++) { solid[i] = 1; solid[i + (M-1)*N] = 1; }
    }

    function updateObstacle() {
      obs.shape = document.getElementById('shape-select').value;
      solid.fill(0);
      
      // Re-mark walls
      for (let i=0; i<N; i++) { solid[i] = 1; solid[i + (M-1)*N] = 1; }
      
      // Rasterize obstacle
      const cosA = Math.cos(obs.angle * Math.PI / 180);
      const sinA = Math.sin(obs.angle * Math.PI / 180);
      const cx = obs.x, cy = obs.y, s = obs.size;
      
      for (let j=0; j<M; j++) {
        for (let i=0; i<N; i++) {
          if (solid[i + j*N]) continue; // Skip walls
          
          // Transform to obstacle local space
          let dx = i - cx, dy = j - cy;
          let lx = dx * cosA + dy * sinA;
          let ly = -dx * sinA + dy * cosA;
          
          let inside = false;
          if (obs.shape === 'circle') {
            inside = (lx*lx + ly*ly < s*s);
          } else if (obs.shape === 'ellipse') {
            inside = ((lx*lx)/(s*s) + (ly*ly)/((s*0.6)**2) < 1);
          } else if (obs.shape === 'rect') {
            inside = (Math.abs(lx) < s*0.8 && Math.abs(ly) < s*0.5);
          } else if (obs.shape === 'triangle') {
            // Simple upright triangle approximation
            let h = s * 1.5;
            let halfW = (s * 0.8) * (1 - (ly + h/2)/h);
            inside = (ly > -h/2 && ly < h/2 && Math.abs(lx) < halfW);
          }
          
          if (inside) {
            solid[i + j*N] = 1;
            ux[i + j*N] = 0; uy[i + j*N] = 0;
          }
        }
      }
      updateStats();
    }

    function lbmStep() {
      // 1. Collision
      const invTau = 1.0 / tau;
      for (let j=1; j<M-1; j++) {
        for (let i=1; i<N-1; i++) {
          const idx = i + j*N;
          if (solid[idx]) continue;
          
          let sumRho = 0, sumUx = 0, sumUy = 0;
          for (let k=0; k<Q; k++) {
            const val = f[k][idx];
            sumRho += val;
            sumUx += cx[k] * val;
            sumUy += cy[k] * val;
          }
          rho[idx] = sumRho;
          ux[idx] = sumUx / sumRho;
          uy[idx] = sumUy / sumRho;
          
          const uSq = ux[idx]*ux[idx] + uy[idx]*uy[idx];
          for (let k=0; k<Q; k++) {
            const cu = 3.0 * (cx[k]*ux[idx] + cy[k]*uy[idx]);
            const feq = sumRho * w[k] * (1.0 + cu + 0.5*cu*cu - 1.5*uSq);
            f[k][idx] -= (f[k][idx] - feq) * invTau;
          }
        }
      }

      // 2. Streaming + Boundaries
      for (let j=1; j<M-1; j++) {
        for (let i=1; i<N-1; i++) {
          const idx = i + j*N;
          if (solid[idx]) {
            for (let k=0; k<Q; k++) fNew[k][idx] = f[opp[k]][idx];
          } else {
            for (let k=0; k<Q; k++) {
              const pi = i - cx[k], pj = j - cy[k];
              const pidx = pi + pj*N;
              fNew[k][idx] = solid[pidx] ? f[opp[k]][idx] : f[k][pidx];
            }
          }
        }
      }

      // Inlet BC (fixed velocity)
      for (let j=0; j<M; j++) {
        const idx = j*N;
        const uSq = uIn*uIn;
        for (let k=0; k<Q; k++) {
          const cu = 3.0 * cx[k] * uIn;
          fNew[k][idx] = w[k] * (1.0 + cu + 0.5*cu*cu - 1.5*uSq);
        }
        rho[idx] = 1.0; ux[idx] = uIn; uy[idx] = 0;
      }

      // Outlet BC (convective/extrapolation)
      for (let j=0; j<M; j++) {
        for (let k=0; k<Q; k++) {
          fNew[k][(N-1)+j*N] = fNew[k][(N-2)+j*N];
        }
      }

      // Swap
      const temp = f; f = fNew; fNew = temp;
    }

    function computeVisualization() {
      const mode = document.getElementById('viz-select').value;
      
      if (mode === 'vorticity') {
        // Curl = dux/dy - duy/dx
        for (let j=1; j<M-1; j++) {
          for (let i=1; i<N-1; i++) {
            const idx = i + j*N;
            if (solid[idx]) { field[idx] = 0; continue; }
            const duxdy = 0.5 * (ux[i + (j+1)*N] - ux[i + (j-1)*N]);
            const duydx = 0.5 * (uy[(i+1) + j*N] - uy[(i-1) + j*N]);
            let curl = duxdy - duydx;
            // Scale for visualization
            field[idx] = constrain(curl * 8, -1, 1);
          }
        }
      } else if (mode === 'speed') {
        for (let j=0; j<M; j++) {
          for (let i=0; i<N; i++) {
            const idx = i + j*N;
            field[idx] = constrain(Math.sqrt(ux[idx]**2 + uy[idx]**2) / uIn, 0, 1);
          }
        }
      } else {
        for (let j=0; j<M; j++) {
          for (let i=0; i<N; i++) {
            const idx = i + j*N;
            field[idx] = constrain(rho[idx] / 1.05, 0, 1);
          }
        }
      }
    }

    function render() {
      vizCanvas.loadPixels();
      const p = vizCanvas.pixels;
      
      for (let i=0; i<N*M; i++) {
        const v = field[i];
        let r, g, b;
        if (v < 0) { // Blue to black
          const t = -v;
          r = 0; g = t * 40; b = 40 + t * 160;
        } else if (v < 0.1) { // Black to dark
          const t = v * 10;
          r = t * 20; g = 4 + t * 30; b = 4 + t * 30;
        } else if (v < 0.3) { // Dark to yellow
          const t = (v - 0.1) * 5;
          r = 20 + t * 200; g = 34 + t * 200; b = 34 + t * 30;
        } else { // Yellow to red
          const t = (v - 0.3) / 0.7;
          r = 220 + t * 35; g = 234 - t * 130; b = 4 - t * 4;
        }
        
        const idx = i * 4;
        p[idx] = r; p[idx+1] = g; p[idx+2] = b; p[idx+3] = 255;
      }
      vizCanvas.updatePixels();
      
      // Draw obstacle outline
      if (!solid[0]) {
        // Since solid is binary mask, we just draw it as a semi-transparent overlay
        // Actually, p5 image() with mask is slow. We'll just draw the shape directly.
      }
      
      // Scale to window
      image(vizCanvas, 0, 0, width, height);
      
      // Draw obstacle
      push();
      translate(obs.x * width/N, obs.y * height/M);
      rotate(obs.angle * PI/180);
      noFill();
      stroke(255, 180, 80, 200);
      strokeWeight(2.5);
      const sc = obs.size * min(width, height) / M;
      
      if (obs.shape === 'circle') ellipse(0, 0, sc*2, sc*2);
      else if (obs.shape === 'ellipse') ellipse(0, 0, sc*2, sc*1.2);
      else if (obs.shape === 'rect') rect(-sc*0.8, -sc*0.5, sc*1.6, sc);
      else triangle(0, -sc*0.8, sc*0.7, sc*0.5, -sc*0.7, sc*0.5);
      pop();
    }

    function draw() {
      if (!isPaused) {
        lbmStep();
        frameCounter++;
        if (frameCounter % 2 === 0) computeVisualization();
      }
      render();
      
      if (frameCount % 15 === 0) {
        updateStats();
      }
    }

    function updateStats() {
      const D = obs.size * 2;
      const nu = (tau - 0.5) / 3.0;
      const Re = (uIn * D) / nu;
      document.getElementById('stat-re').textContent = Re.toFixed(0);
      document.getElementById('stat-fps').textContent = Math.round(frameRate());
    }

    function mousePressed() {
      const gx = mouseX * N / width;
      const gy = mouseY * M / height;
      const dx = gx - obs.x, dy = gy - obs.y;
      if (dx*dx + dy*dy < (obs.size + 5)**2) {
        dragging = true;
        dragOffX = dx; dragOffY = dy;
      }
    }

    function mouseDragged() {
      if (dragging) {
        obs.x = constrain(mouseX * N / width - dragOffX, obs.size + 5, N - obs.size - 5);
        obs.y = constrain(mouseY * M / height - dragOffY, obs.size + 5, M - obs.size - 5);
        updateObstacle();
      }
    }

    function mouseReleased() { dragging = false; }

    function keyPressed() {
      if (key === ' ') isPaused = !isPaused;
      if (key === 'r' || key === 'R') resetFlow();
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }
  </script>
</body>
</html>
