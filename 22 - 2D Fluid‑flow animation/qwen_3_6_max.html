<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Von Kármán Vortex Street – 2D Fluid Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #060610; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
  #controls {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(8,8,20,0.94); border-top: 1px solid rgba(100,140,255,0.15);
    padding: 10px 20px; font-size: 11px; z-index: 10;
    display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
    backdrop-filter: blur(10px);
  }
  #controls h4 { color: #6ea8fe; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; margin-bottom: 2px; }
  .ctrl-group { display: flex; align-items: center; gap: 6px; }
  .ctrl-group label { color: #889; white-space: nowrap; }
  .ctrl-group input[type=range] { width: 80px; accent-color: #6ea8fe; }
  .ctrl-group .val { color: #6ea8fe; font-family: 'Consolas', monospace; min-width: 32px; text-align: right; }
  .ctrl-group select { background: #1a1a2e; color: #c8d0e0; border: 1px solid #2a2a4a; border-radius: 4px; padding: 2px 6px; font-size: 11px; }
  .btn {
    padding: 4px 12px; border-radius: 5px; border: 1px solid rgba(100,140,255,0.3);
    background: rgba(40,60,120,0.2); color: #6ea8fe; font-size: 11px; cursor: pointer;
  }
  .btn:hover { background: rgba(40,60,120,0.4); }
  .btn.active { background: rgba(100,140,255,0.25); border-color: #6ea8fe; color: #fff; }
  #info { position: fixed; top: 10px; left: 10px; font-size: 10px; color: #445; z-index: 10; }
  #stats { position: fixed; top: 10px; right: 10px; font-size: 11px; color: #6ea8fe; z-index: 10; font-family: 'Consolas', monospace; text-align: right; }
</style>
</head>
<body>

<div id="stats">
  <div id="fps-display">60 fps</div>
  <div id="re-display">Re: —</div>
</div>

<div id="info">
  Drag obstacle to move · Scroll to resize · R=rotate · S=shape · Space=pause
</div>

<div id="controls">
  <h4>⚙️ Flow & Obstacle Controls</h4>
  <div class="ctrl-group"><label>Flow Speed</label><input type="range" id="c-speed" min="1" max="50" value="15"><span class="val" id="v-speed">1.5</span></div>
  <div class="ctrl-group"><label>Viscosity</label><input type="range" id="c-visc" min="1" max="100" value="12"><span class="val" id="v-visc">0.012</span></div>
  <div class="ctrl-group"><label>Obstacle Size</label><input type="range" id="c-size" min="5" max="40" value="15"><span class="val" id="v-size">15</span></div>
  <div class="ctrl-group"><label>Shape</label>
    <select id="c-shape"><option value="circle">Circle</option><option value="ellipse">Ellipse</option><option value="rect">Rectangle</option><option value="airfoil">Airfoil</option></select>
  </div>
  <div class="ctrl-group"><label>Rotation</label><input type="range" id="c-rot" min="0" max="360" value="0"><span class="val" id="v-rot">0°</span></div>
  <div class="ctrl-group"><label>Particles</label><input type="range" id="c-particles" min="0" max="3000" value="1500"><span class="val" id="v-particles">1500</span></div>
  <div class="ctrl-group">
    <label>Viz</label>
    <select id="c-viz"><option value="vorticity">Vorticity</option><option value="speed">Speed</option><option value="pressure">Pressure</option><option value="xvel">X-Velocity</option></select>
  </div>
  <div class="ctrl-group">
    <button class="btn" id="btn-pause" onclick="togglePause()">⏸ Pause</button>
    <button class="btn" onclick="resetSim()">↺ Reset</button>
    <button class="btn" id="btn-vectors" onclick="toggleVectors()">→ Vectors</button>
  </div>
</div>

<script>
// ===== GRID PARAMETERS =====
const NX = 256, NY = 128;
let cellW, cellH;

// ===== FLOW FIELDS =====
let u, v, u_prev, v_prev;      // velocity components
let p;                           // pressure
let vort;                        // vorticity
let obstacle;                    // boolean grid: true = solid

// ===== OBSTACLE STATE =====
let obsX, obsY;                  // obstacle center in grid coords
let obsSize = 15;                // characteristic size
let obsShape = 'circle';
let obsRotation = 0;
let dragging = false;
let dragOffX = 0, dragOffY = 0;

// ===== SIMULATION STATE =====
let flowSpeed = 1.5;
let viscosity = 0.012;
let paused = false;
let showVectors = false;
let vizMode = 'vorticity';
let particles = [];
let targetParticleCount = 1500;

// ===== COLOR PALETTE =====
let paletteImg;

function setup() {
  createCanvas(windowWidth, windowHeight);
  frameRate(60);
  pixelDensity(1);

  cellW = width / NX;
  cellH = (height - 60) / NY;

  // Allocate fields
  const n = NX * NY;
  u = new Float32Array(n);
  v = new Float32Array(n);
  u_prev = new Float32Array(n);
  v_prev = new Float32Array(n);
  p = new Float32Array(n);
  vort = new Float32Array(n);
  obstacle = new Uint8Array(n);

  // Build color palette
  buildPalette();

  // Init obstacle position
  obsX = NX * 0.3;
  obsY = NY * 0.5;

  resetSim();
  readControls();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  cellW = width / NX;
  cellH = (height - 60) / NY;
}

// ===== COLOR PALETTE =====
function buildPalette() {
  // Diverging colormap: blue (negative vorticity) → black (zero) → red (positive)
  paletteImg = createImage(512, 1);
  paletteImg.loadPixels();
  for (let i = 0; i < 512; i++) {
    const t = (i / 511) * 2 - 1; // -1 to 1
    let r, g, b;
    if (t < 0) {
      // Blue to black
      const s = -t;
      r = lerp(0, 30, s);
      g = lerp(0, 80, s);
      b = lerp(20, 220, s);
    } else {
      // Black to red/yellow
      const s = t;
      r = lerp(30, 255, s);
      g = lerp(80, 100, s * s);
      b = lerp(20, 30, s);
    }
    const idx = i * 4;
    paletteImg.pixels[idx] = r;
    paletteImg.pixels[idx + 1] = g;
    paletteImg.pixels[idx + 2] = b;
    paletteImg.pixels[idx + 3] = 255;
  }
  paletteImg.updatePixels();
}

function getColorFromPalette(val, maxVal) {
  const t = constrain(val / maxVal, -1, 1);
  const idx = floor((t + 1) * 0.5 * 511);
  const i = constrain(idx, 0, 511) * 4;
  return [paletteImg.pixels[i], paletteImg.pixels[i+1], paletteImg.pixels[i+2]];
}

// ===== OBSTACLE RASTERIZATION =====
function rasterizeObstacle() {
  obstacle.fill(0);

  const cx = obsX, cy = obsY;
  const sz = obsSize;
  const aspect = obsShape === 'ellipse' ? 1.8 : 1;
  const angle = obsRotation * PI / 180;
  const cosA = cos(angle), sinA = sin(angle);

  const searchR = sz * max(aspect, 1) + 4;
  const x0 = max(1, floor(cx - searchR));
  const x1 = min(NX - 2, ceil(cx + searchR));
  const y0 = max(1, floor(cy - searchR));
  const y1 = min(NY - 2, ceil(cy + searchR));

  for (let j = y0; j <= y1; j++) {
    for (let i = x0; i <= x1; i++) {
      // Transform to obstacle-local coords
      let dx = i - cx, dy = j - cy;
      let lx = dx * cosA + dy * sinA;
      let ly = -dx * sinA + dy * cosA;

      let inside = false;
      if (obsShape === 'circle') {
        inside = (lx * lx + ly * ly) < sz * sz;
      } else if (obsShape === 'ellipse') {
        inside = (lx * lx) / (sz * aspect * sz * aspect) + (ly * ly) / (sz * sz) < 1;
      } else if (obsShape === 'rect') {
        inside = abs(lx) < sz * aspect * 0.7 && abs(ly) < sz * 0.7;
      } else if (obsShape === 'airfoil') {
        // Simple airfoil shape
        const ax = lx / (sz * aspect);
        const ay = ly / sz;
        const t = 0.3;
        const yt = 5 * t * (0.2969 * sqrt(max(0, ax + 1)) - 0.1260 * (ax + 1) - 0.3516 * pow(ax + 1, 2) + 0.2843 * pow(ax + 1, 3) - 0.1015 * pow(ax + 1, 4));
        inside = (ax >= -1 && ax <= 1 && abs(ay) < yt);
      }

      if (inside) {
        obstacle[i + j * NX] = 1;
      }
    }
  }
}

// ===== BOUNDARY CONDITIONS =====
function applyBoundaryConditions() {
  // Inlet (left wall): uniform flow
  for (let j = 1; j < NY - 1; j++) {
    u[0 + j * NX] = flowSpeed;
    u[1 + j * NX] = flowSpeed;
    v[0 + j * NX] = 0;
    v[1 + j * NX] = 0;
  }

  // Outlet (right wall): zero gradient
  for (let j = 1; j < NY - 1; j++) {
    u[(NX - 1) + j * NX] = u[(NX - 2) + j * NX];
    u[(NX - 2) + j * NX] = u[(NX - 3) + j * NX];
    v[(NX - 1) + j * NX] = v[(NX - 2) + j * NX];
  }

  // Top and bottom walls: free-slip
  for (let i = 0; i < NX; i++) {
    u[i + 0 * NX] = u[i + 1 * NX];
    v[i + 0 * NX] = 0;
    u[i + (NY - 1) * NX] = u[i + (NY - 2) * NX];
    v[i + (NY - 1) * NX] = 0;
  }

  // Obstacle: no-slip
  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < NX - 1; i++) {
      if (obstacle[i + j * NX]) {
        u[i + j * NX] = 0;
        v[i + j * NX] = 0;
        // Also zero out neighbors that point into obstacle
        if (!obstacle[(i-1) + j * NX]) u[(i-1) + j * NX] *= 0.5;
        if (!obstacle[(i+1) + j * NX]) u[(i+1) + j * NX] *= 0.5;
        if (!obstacle[i + (j-1) * NX]) v[i + (j-1) * NX] *= 0.5;
        if (!obstacle[i + (j+1) * NX]) v[i + (j+1) * NX] *= 0.5;
      }
    }
  }
}

// ===== NAVIER-STOKES SOLVER =====
// Based on Jos Stam's Stable Fluids with obstacle handling

function idx(i, j) { return i + j * NX; }

function simulate(dt) {
  // 1. Add forces (inlet driving force)
  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < 4; i++) {
      const id = idx(i, j);
      if (!obstacle[id]) {
        u[id] += dt * 0.5 * (flowSpeed - u[id]);
      }
    }
  }

  // 2. Diffuse (implicit Gauss-Seidel)
  diffuse(u, u_prev, viscosity, dt);
  diffuse(v, v_prev, viscosity, dt);

  // 3. Advect (semi-Lagrangian)
  advect(u, u_prev, u_prev, v_prev, dt);
  advect(v, v_prev, u_prev, v_prev, dt);

  // 4. Project (make divergence-free)
  project(u, v, p);

  // 5. Apply boundary conditions
  applyBoundaryConditions();

  // 6. Compute vorticity
  computeVorticity();
}

function diffuse(field, prev, visc, dt) {
  const a = dt * visc * NX * NY;
  const invDenom = 1 / (1 + 4 * a);

  // Copy current to prev
  prev.set(field);

  // Gauss-Seidel iterations
  for (let iter = 0; iter < 4; iter++) {
    for (let j = 1; j < NY - 1; j++) {
      for (let i = 1; i < NX - 1; i++) {
        const id = idx(i, j);
        if (obstacle[id]) { field[id] = 0; continue; }
        field[id] = (prev[id] + a * (
          field[idx(i-1,j)] + field[idx(i+1,j)] +
          field[idx(i,j-1)] + field[idx(i,j+1)]
        )) * invDenom;
      }
    }
  }
}

function advect(field, prev, velU, velV, dt) {
  const dtX = dt * NX;
  const dtY = dt * NY;

  // Copy current to prev
  prev.set(field);

  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < NX - 1; i++) {
      const id = idx(i, j);
      if (obstacle[id]) { field[id] = 0; continue; }

      // Trace back
      let x = i - dtX * velU[id];
      let y = j - dtY * velV[id];

      // Clamp
      x = constrain(x, 0.5, NX - 1.5);
      y = constrain(y, 0.5, NY - 1.5);

      const i0 = floor(x), i1 = i0 + 1;
      const j0 = floor(y), j1 = j0 + 1;
      const s1 = x - i0, s0 = 1 - s1;
      const t1 = y - j0, t0 = 1 - t1;

      field[id] =
        s0 * (t0 * prev[idx(i0,j0)] + t1 * prev[idx(i0,j1)]) +
        s1 * (t0 * prev[idx(i1,j0)] + t1 * prev[idx(i1,j1)]);
    }
  }
}

function project(velU, velV, pressure) {
  const h = 1.0 / max(NX, NY);
  const div = new Float32Array(NX * NY);

  // Compute divergence
  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < NX - 1; i++) {
      const id = idx(i, j);
      if (obstacle[id]) { div[id] = 0; pressure[id] = 0; continue; }
      div[id] = -0.5 * h * (
        velU[idx(i+1,j)] - velU[idx(i-1,j)] +
        velV[idx(i,j+1)] - velV[idx(i,j-1)]
      );
      pressure[id] = 0;
    }
  }

  // Solve for pressure (Gauss-Seidel)
  for (let iter = 0; iter < 20; iter++) {
    for (let j = 1; j < NY - 1; j++) {
      for (let i = 1; i < NX - 1; i++) {
        const id = idx(i, j);
        if (obstacle[id]) continue;
        pressure[id] = (div[id] +
          pressure[idx(i-1,j)] + pressure[idx(i+1,j)] +
          pressure[idx(i,j-1)] + pressure[idx(i,j+1)]
        ) * 0.25;
      }
    }
  }

  // Subtract pressure gradient
  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < NX - 1; i++) {
      const id = idx(i, j);
      if (obstacle[id]) continue;
      velU[id] -= 0.5 * (pressure[idx(i+1,j)] - pressure[idx(i-1,j)]) / h * h;
      velV[id] -= 0.5 * (pressure[idx(i,j+1)] - pressure[idx(i,j-1)]) / h * h;
    }
  }
}

function computeVorticity() {
  for (let j = 1; j < NY - 1; j++) {
    for (let i = 1; i < NX - 1; i++) {
      const id = idx(i, j);
      if (obstacle[id]) { vort[id] = 0; continue; }
      vort[id] = 0.5 * (
        (v[idx(i+1,j)] - v[idx(i-1,j)]) -
        (u[idx(i,j+1)] - u[idx(i,j-1)])
      );
    }
  }
}

// ===== PARTICLES =====
function initParticles() {
  particles = [];
  for (let i = 0; i < targetParticleCount; i++) {
    particles.push(createParticle());
  }
}

function createParticle() {
  return {
    x: random(0, NX),
    y: random(1, NY - 1),
    age: 0,
    maxAge: random(80, 250),
    hue: random(180, 280)
  };
}

function updateParticles(dt) {
  for (let k = particles.length - 1; k >= 0; k--) {
    const pt = particles[k];
    pt.age++;

    if (pt.age > pt.maxAge || pt.x < 0 || pt.x >= NX || pt.y < 0 || pt.y >= NY) {
      particles[k] = createParticle();
      continue;
    }

    // Check obstacle
    const gi = floor(pt.x), gj = floor(pt.y);
    if (gi >= 0 && gi < NX && gj >= 0 && gj < NY && obstacle[gi + gj * NX]) {
      particles[k] = createParticle();
      continue;
    }

    // Interpolate velocity
    const i0 = constrain(floor(pt.x), 0, NX - 2);
    const j0 = constrain(floor(pt.y), 0, NY - 2);
    const i1 = i0 + 1, j1 = j0 + 1;
    const sx = pt.x - i0, sy = pt.y - j0;

    const velX = (1-sx)*(1-sy)*u[idx(i0,j0)] + sx*(1-sy)*u[idx(i1,j0)] +
                 (1-sx)*sy*u[idx(i0,j1)] + sx*sy*u[idx(i1,j1)];
    const velY = (1-sx)*(1-sy)*v[idx(i0,j0)] + sx*(1-sy)*v[idx(i1,j0)] +
                 (1-sx)*sy*v[idx(i0,j1)] + sx*sy*v[idx(i1,j1)];

    pt.x += velX * dt * NX * 0.5;
    pt.y += velY * dt * NY * 0.5;
  }

  // Adjust particle count
  while (particles.length < targetParticleCount) particles.push(createParticle());
  while (particles.length > targetParticleCount) particles.pop();
}

// ===== VISUALIZATION =====
function drawFlowField() {
  const img = createImage(NX, NY);
  img.loadPixels();

  let maxVal;
  switch (vizMode) {
    case 'vorticity': maxVal = 2.0; break;
    case 'speed': maxVal = flowSpeed * 2.5; break;
    case 'pressure': maxVal = 0.5; break;
    case 'xvel': maxVal = flowSpeed * 2; break;
    default: maxVal = 2.0;
  }

  for (let j = 0; j < NY; j++) {
    for (let i = 0; i < NX; i++) {
      const id = idx(i, j);
      const pixIdx = (i + j * NX) * 4;

      if (obstacle[id]) {
        img.pixels[pixIdx] = 60;
        img.pixels[pixIdx + 1] = 60;
        img.pixels[pixIdx + 2] = 80;
        img.pixels[pixIdx + 3] = 255;
        continue;
      }

      let val;
      switch (vizMode) {
        case 'vorticity':
          val = vort[id];
          break;
        case 'speed':
          val = sqrt(u[id] * u[id] + v[id] * v[id]);
          // Map to 0-1 range for a sequential colormap
          {
            const t = constrain(val / maxVal, 0, 1);
            // Viridis-like: dark blue → teal → green → yellow
            let r, g, b;
            if (t < 0.25) {
              const s = t / 0.25;
              r = lerp(10, 30, s); g = lerp(10, 100, s); b = lerp(50, 160, s);
            } else if (t < 0.5) {
              const s = (t - 0.25) / 0.25;
              r = lerp(30, 40, s); g = lerp(100, 180, s); b = lerp(160, 140, s);
            } else if (t < 0.75) {
              const s = (t - 0.5) / 0.25;
              r = lerp(40, 160, s); g = lerp(180, 220, s); b = lerp(140, 80, s);
            } else {
              const s = (t - 0.75) / 0.25;
              r = lerp(160, 250, s); g = lerp(220, 240, s); b = lerp(80, 40, s);
            }
            img.pixels[pixIdx] = r;
            img.pixels[pixIdx + 1] = g;
            img.pixels[pixIdx + 2] = b;
            img.pixels[pixIdx + 3] = 255;
            continue;
          }
        case 'pressure':
          val = p[id];
          break;
        case 'xvel':
          val = u[id];
          break;
      }

      const [r, g, b] = getColorFromPalette(val, maxVal);
      img.pixels[pixIdx] = r;
      img.pixels[pixIdx + 1] = g;
      img.pixels[pixIdx + 2] = b;
      img.pixels[pixIdx + 3] = 255;
    }
  }

  img.updatePixels();
  image(img, 0, 0, width, height - 60);
}

function drawVectors() {
  if (!showVectors) return;

  const spacing = 8;
  const scale = 12;

  stroke(255, 100);
  strokeWeight(0.5);

  for (let j = spacing; j < NY - spacing; j += spacing) {
    for (let i = spacing; i < NX - spacing; i += spacing) {
      const id = idx(i, j);
      if (obstacle[id]) continue;

      const speed = sqrt(u[id] * u[id] + v[id] * v[id]);
      if (speed < 0.05) continue;

      const px = i * cellW + cellW / 2;
      const py = j * cellH + cellH / 2;
      const dx = u[id] * scale;
      const dy = v[id] * scale;

      const alpha = constrain(map(speed, 0, flowSpeed * 2, 40, 200), 40, 200);
      stroke(255, 255, 255, alpha);
      line(px, py, px + dx, py + dy);

      // Arrowhead
      const angle = atan2(dy, dx);
      const headLen = 3;
      line(px + dx, py + dy, px + dx - headLen * cos(angle - 0.5), py + dy - headLen * sin(angle - 0.5));
    }
  }
}

function drawParticles() {
  if (targetParticleCount === 0) return;

  noStroke();
  for (const pt of particles) {
    const px = pt.x * cellW;
    const py = pt.y * cellH;
    const alpha = constrain(map(pt.age, 0, pt.maxAge, 180, 0), 0, 180);
    const sz = constrain(map(pt.age, 0, pt.maxAge, 2.5, 0.5), 0.5, 2.5);

    // Color based on local speed
    const gi = constrain(floor(pt.x), 0, NX - 1);
    const gj = constrain(floor(pt.y), 0, NY - 1);
    const speed = sqrt(u[idx(gi,gj)] ** 2 + v[idx(gi,gj)] ** 2);
    const t = constrain(speed / (flowSpeed * 2), 0, 1);

    fill(
      lerp(100, 255, t),
      lerp(180, 150, t),
      lerp(255, 80, t),
      alpha
    );
    ellipse(px, py, sz, sz);
  }
}

function drawObstacle() {
  // Draw obstacle outline on top
  noFill();
  stroke(200, 200, 255, 180);
  strokeWeight(1.5);

  const cx = obsX * cellW, cy = obsY * cellH;
  const sz = obsSize * cellW;
  const angle = obsRotation * PI / 180;

  push();
  translate(cx, cy);
  rotate(angle);

  if (obsShape === 'circle') {
    ellipse(0, 0, sz * 2, sz * 2);
  } else if (obsShape === 'ellipse') {
    ellipse(0, 0, sz * 2 * 1.8, sz * 2);
  } else if (obsShape === 'rect') {
    rect(-sz * 0.7, -sz * 0.7, sz * 1.4, sz * 1.4, 2);
  } else if (obsShape === 'airfoil') {
    // Draw airfoil outline
    beginShape();
    for (let t = 0; t <= 1; t += 0.02) {
      const x = (t * 2 - 1) * sz * 1.8;
      const ax = t * 2 - 1;
      const yt = 5 * 0.3 * (0.2969 * sqrt(max(0, ax + 1)) - 0.1260 * (ax + 1) - 0.3516 * pow(ax + 1, 2) + 0.2843 * pow(ax + 1, 3) - 0.1015 * pow(ax + 1, 4)) * sz;
      vertex(x, -yt);
    }
    for (let t = 1; t >= 0; t -= 0.02) {
      const x = (t * 2 - 1) * sz * 1.8;
      const ax = t * 2 - 1;
      const yt = 5 * 0.3 * (0.2969 * sqrt(max(0, ax + 1)) - 0.1260 * (ax + 1) - 0.3516 * pow(ax + 1, 2) + 0.2843 * pow(ax + 1, 3) - 0.1015 * pow(ax + 1, 4)) * sz;
      vertex(x, yt);
    }
    endShape(CLOSE);
  }

  pop();

  // Draw drag handle indicator
  if (dragging) {
    noStroke();
    fill(110, 168, 254, 100);
    ellipse(cx, cy, 10, 10);
  }
}

// ===== CONTROLS =====
function readControls() {
  flowSpeed = +document.getElementById('c-speed').value / 10;
  viscosity = +document.getElementById('c-visc').value / 1000;
  obsSize = +document.getElementById('c-size').value;
  obsShape = document.getElementById('c-shape').value;
  obsRotation = +document.getElementById('c-rot').value;
  targetParticleCount = +document.getElementById('c-particles').value;
  vizMode = document.getElementById('c-viz').value;

  document.getElementById('v-speed').textContent = flowSpeed.toFixed(1);
  document.getElementById('v-visc').textContent = viscosity.toFixed(3);
  document.getElementById('v-size').textContent = obsSize;
  document.getElementById('v-rot').textContent = obsRotation + '°';
  document.getElementById('v-particles').textContent = targetParticleCount;
}

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause';
  document.getElementById('btn-pause').classList.toggle('active', paused);
}

function toggleVectors() {
  showVectors = !showVectors;
  document.getElementById('btn-vectors').classList.toggle('active', showVectors);
}

function resetSim() {
  u.fill(0); v.fill(0);
  u_prev.fill(0); v_prev.fill(0);
  p.fill(0); vort.fill(0);

  // Initialize with uniform flow
  for (let j = 0; j < NY; j++) {
    for (let i = 0; i < NX; i++) {
      u[idx(i, j)] = flowSpeed;
    }
  }

  rasterizeObstacle();
  applyBoundaryConditions();
  initParticles();
}

// ===== MOUSE INTERACTION =====
function mousePressed() {
  const mx = mouseX / cellW;
  const my = mouseY / cellH;
  const dx = mx - obsX, dy = my - obsY;

  // Check if clicking near obstacle
  const dist = sqrt(dx * dx + dy * dy);
  if (dist < obsSize * 2) {
    dragging = true;
    dragOffX = dx;
    dragOffY = dy;
  }
}

function mouseDragged() {
  if (dragging) {
    obsX = constrain(mouseX / cellW - dragOffX, obsSize + 2, NX - obsSize - 2);
    obsY = constrain(mouseY / cellH - dragOffY, obsSize + 2, NY - obsSize - 2);
    rasterizeObstacle();
  }
}

function mouseReleased() {
  dragging = false;
}

function mouseWheel(e) {
  if (mouseY < height - 60) {
    obsSize = constrain(obsSize - e.delta * 0.02, 3, 40);
    document.getElementById('c-size').value = round(obsSize);
    document.getElementById('v-size').textContent = round(obsSize);
    rasterizeObstacle();
  }
  return false;
}

function keyPressed() {
  if (key === ' ') { togglePause(); return false; }
  if (key === 'r' || key === 'R') {
    obsRotation = (obsRotation + 15) % 360;
    document.getElementById('c-rot').value = obsRotation;
    document.getElementById('v-rot').textContent = obsRotation + '°';
    rasterizeObstacle();
  }
  if (key === 's' || key === 'S') {
    const shapes = ['circle', 'ellipse', 'rect', 'airfoil'];
    const idx = (shapes.indexOf(obsShape) + 1) % shapes.length;
    obsShape = shapes[idx];
    document.getElementById('c-shape').value = obsShape;
    rasterizeObstacle();
  }
  if (key === 'v' || key === 'V') toggleVectors();
  return false;
}

// ===== CONTROL EVENT LISTENERS =====
document.addEventListener('DOMContentLoaded', () => {
  ['c-speed','c-visc','c-size','c-rot','c-particles'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      readControls();
      rasterizeObstacle();
    });
  });
  document.getElementById('c-shape').addEventListener('change', () => { readControls(); rasterizeObstacle(); });
  document.getElementById('c-viz').addEventListener('change', readControls);
});

// ===== MAIN DRAW =====
let frameCount_ = 0;
function draw() {
  readControls();

  // Run simulation
  if (!paused) {
    const dt = 0.1;
    const substeps = 2;
    for (let s = 0; s < substeps; s++) {
      simulate(dt / substeps);
    }
    updateParticles(dt);
    frameCount_++;
  }

  // Draw
  background(6, 6, 16);
  drawFlowField();
  drawVectors();
  drawParticles();
  drawObstacle();

  // Stats
  const D = obsSize * 2;
  const Re = flowSpeed * D / max(viscosity, 0.0001);
  document.getElementById('fps-display').textContent = nf(frameRate(), 2, 0) + ' fps';
  document.getElementById('re-display').textContent = 'Re ≈ ' + nf(Re, 1, 0);
}
</script>
