<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX LAB • von Kármán Street</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1f;
            font-family: 'Inter', system-ui;
            color: #ddd;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15,15,35,0.92);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            user-select: none;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 21px;
            text-align: center;
            color: #6cf;
        }
        .control {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #88ffdd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #6cf;
        }
        .val {
            float: right;
            font-family: monospace;
            color: #6cf;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6cf;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        #info {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>VORTEX LAB</h1>
        
        <div class="control">
            <label>VISCOSITY <span id="viscVal" class="val">0.0008</span></label>
            <input type="range" id="viscSlider" min="0" max="50" value="8">
        </div>
        
        <div class="control">
            <label>INFLOW SPEED <span id="inflowVal" class="val">4.2</span></label>
            <input type="range" id="inflowSlider" min="1" max="12" value="4.2" step="0.2">
        </div>
        
        <div class="control">
            <label>OBSTACLE SIZE <span id="sizeVal" class="val">48</span></label>
            <input type="range" id="sizeSlider" min="20" max="110" value="48">
        </div>
        
        <button onclick="changeShape()">CHANGE SHAPE (C/E/R)</button>
        <button onclick="resetSimulation()">RESET</button>
    </div>
    
    <div id="info">
        DRAG = move obstacle<br>
        SCROLL = resize<br>
        1/2/3 = rotate (±15°)<br>
        C/E/R = circle / ellipse / rect
    </div>

    <script>
        // ================================================
        // VORTEX LAB — von Kármán Vortex Street Simulator
        // Jos Stam Stable Fluids • Interactive rotatable obstacle
        // Real-time shape change • Clear vortex shedding
        // Single standalone HTML file
        // ================================================

        let N = 120;                    // grid resolution (wide tube)
        let size = 920;                 // canvas size
        let scale;
        
        let u = [], v = [], uPrev = [], vPrev = [];
        let dens = [];
        
        let visc = 0.0008;
        let inflowSpeed = 4.2;
        
        let obstacle = {
            x: 460,
            y: 310,
            size: 48,
            shape: 'circle', // circle, ellipse, rect
            angle: 0
        };
        
        let fluidImage;
        
        function IX(x, y) { return x + y * N; }
        
        function setup() {
            createCanvas(size, size * 0.68);
            scale = width / N;
            fluidImage = createImage(N, N);
            
            // Initialize arrays
            for (let i = 0; i < N*N; i++) {
                u[i] = v[i] = uPrev[i] = vPrev[i] = dens[i] = 0;
            }
            
            resetSimulation();
        }
        
        function resetSimulation() {
            u.fill(0); v.fill(0); uPrev.fill(0); vPrev.fill(0); dens.fill(0);
            // Initial left-to-right flow
            for (let j = 0; j < N; j++) {
                let idx = IX(1, j);
                u[idx] = inflowSpeed;
            }
        }
        
        function setBnd(b, x) {
            for (let i = 1; i < N-1; i++) {
                x[IX(i, 0)]    = b === 2 ? -x[IX(i, 1)]    : x[IX(i, 1)];
                x[IX(i, N-1)]  = b === 2 ? -x[IX(i, N-2)]  : x[IX(i, N-2)];
            }
            for (let j = 1; j < N-1; j++) {
                x[IX(0, j)]    = b === 1 ? -x[IX(1, j)]    : x[IX(1, j)];
                x[IX(N-1, j)]  = b === 1 ? -x[IX(N-2, j)]  : x[IX(N-2, j)];
            }
            x[IX(0,0)] = 0.5*(x[IX(1,0)] + x[IX(0,1)]);
            x[IX(0,N-1)] = 0.5*(x[IX(1,N-1)] + x[IX(0,N-2)]);
            x[IX(N-1,0)] = 0.5*(x[IX(N-2,0)] + x[IX(N-1,1)]);
            x[IX(N-1,N-1)] = 0.5*(x[IX(N-2,N-1)] + x[IX(N-1,N-2)]);
        }
        
        function diffuse(b, x, x0, diff, dt) {
            let a = dt * diff * N * N;
            for (let k = 0; k < 12; k++) {
                for (let j = 1; j < N-1; j++) {
                    for (let i = 1; i < N-1; i++) {
                        let idx = IX(i,j);
                        x[idx] = (x0[idx] + a * (
                            x[IX(i-1,j)] + x[IX(i+1,j)] +
                            x[IX(i,j-1)] + x[IX(i,j+1)]
                        )) / (1 + 4*a);
                    }
                }
                setBnd(b, x);
            }
        }
        
        function advect(b, d, d0, u, v, dt) {
            let dt0 = dt * N;
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    let x = i - dt0 * u[idx];
                    let y = j - dt0 * v[idx];
                    x = constrain(x, 0.5, N-1.5);
                    y = constrain(y, 0.5, N-1.5);
                    let i0 = Math.floor(x);
                    let i1 = i0 + 1;
                    let j0 = Math.floor(y);
                    let j1 = j0 + 1;
                    let s1 = x - i0;
                    let s0 = 1 - s1;
                    let t1 = y - j0;
                    let t0 = 1 - t1;
                    d[idx] = s0*(t0*d0[IX(i0,j0)] + t1*d0[IX(i0,j1)]) +
                             s1*(t0*d0[IX(i1,j0)] + t1*d0[IX(i1,j1)]);
                }
            }
            setBnd(b, d);
        }
        
        function project(u, v, p, div) {
            let h = 1.0 / N;
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    div[idx] = -0.5*h*(u[IX(i+1,j)] - u[IX(i-1,j)] + v[IX(i,j+1)] - v[IX(i,j-1)]);
                    p[idx] = 0;
                }
            }
            setBnd(0, div); setBnd(0, p);
            
            for (let k = 0; k < 20; k++) {
                for (let j = 1; j < N-1; j++) {
                    for (let i = 1; i < N-1; i++) {
                        let idx = IX(i,j);
                        p[idx] = (div[idx] + p[IX(i-1,j)] + p[IX(i+1,j)] + p[IX(i,j-1)] + p[IX(i,j+1)]) / 4;
                    }
                }
                setBnd(0, p);
            }
            
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    u[idx] -= 0.5*(p[IX(i+1,j)] - p[IX(i-1,j)])/h;
                    v[idx] -= 0.5*(p[IX(i,j+1)] - p[IX(i,j-1)])/h;
                }
            }
            setBnd(1, u);
            setBnd(2, v);
        }
        
        function fluidStep(dt) {
            // Velocity
            for (let i = 0; i < N*N; i++) {
                uPrev[i] = u[i];
                vPrev[i] = v[i];
            }
            
            diffuse(1, u, uPrev, visc, dt);
            diffuse(2, v, vPrev, visc, dt);
            project(u, v, uPrev, vPrev);
            
            advect(1, u, uPrev, uPrev, vPrev, dt);
            advect(2, v, vPrev, uPrev, vPrev, dt);
            project(u, v, uPrev, vPrev);
            
            // Density (dye)
            for (let i = 0; i < N*N; i++) {
                dens[i] = dens[i] * 0.985; // fade
            }
            
            // Add inflow dye on left
            for (let j = N*0.3; j < N*0.7; j++) {
                let idx = IX(2, j);
                dens[idx] = 255;
            }
            
            diffuse(0, dens, dens, 0.1, dt);
            advect(0, dens, dens, u, v, dt);
        }
        
        function applyObstacle() {
            let ox = obstacle.x / scale;
            let oy = obstacle.y / scale;
            let s = obstacle.size / scale;
            
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i, j);
                    let px = i;
                    let py = j;
                    
                    let inside = false;
                    
                    if (obstacle.shape === 'circle') {
                        let dx = px - ox;
                        let dy = py - oy;
                        inside = dx*dx + dy*dy < s*s;
                    } else if (obstacle.shape === 'rect') {
                        // Rotate point around obstacle center
                        let dx = px - ox;
                        let dy = py - oy;
                        let cosA = cos(obstacle.angle);
                        let sinA = sin(obstacle.angle);
                        let rx = dx * cosA + dy * sinA;
                        let ry = -dx * sinA + dy * cosA;
                        inside = Math.abs(rx) < s*0.7 && Math.abs(ry) < s*1.4;
                    } else if (obstacle.shape === 'ellipse') {
                        let dx = (px - ox) / (s*1.4);
                        let dy = (py - oy) / s;
                        inside = dx*dx + dy*dy < 1;
                    }
                    
                    if (inside) {
                        u[idx] = 0;
                        v[idx] = 0;
                    }
                }
            }
        }
        
        function drawFluid() {
            fluidImage.loadPixels();
            for (let j = 0; j < N; j++) {
                for (let i = 0; i < N; i++) {
                    let idx = IX(i, j);
                    let speed = sqrt(u[idx]*u[idx] + v[idx]*v[idx]);
                    let hue = map(speed, 0, 8, 200, 360);
                    let c = color(`hsl(${hue}, 90%, 65%)`);
                    let px = (i + j * N) * 4;
                    fluidImage.pixels[px] = red(c);
                    fluidImage.pixels[px+1] = green(c);
                    fluidImage.pixels[px+2] = blue(c);
                    fluidImage.pixels[px+3] = 255;
                }
            }
            fluidImage.updatePixels();
            image(fluidImage, 0, 0, width, height);
        }
        
        function drawObstacle() {
            push();
            translate(obstacle.x, obstacle.y);
            rotate(obstacle.angle);
            fill(255, 80);
            stroke(255);
            strokeWeight(4);
            
            if (obstacle.shape === 'circle') {
                circle(0, 0, obstacle.size);
            } else if (obstacle.shape === 'rect') {
                rectMode(CENTER);
                rect(0, 0, obstacle.size*1.4, obstacle.size*0.7);
            } else if (obstacle.shape === 'ellipse') {
                ellipse(0, 0, obstacle.size*1.8, obstacle.size);
            }
            pop();
        }
        
        function draw() {
            let dt = 0.16;
            
            // Add constant left inflow
            for (let j = 0; j < N; j++) {
                let idx = IX(1, j);
                u[idx] = inflowSpeed;
            }
            
            applyObstacle();
            fluidStep(dt);
            drawFluid();
            drawObstacle();
        }
        
        function mouseDragged() {
            obstacle.x = mouseX;
            obstacle.y = mouseY;
        }
        
        function mouseWheel(e) {
            obstacle.size = constrain(obstacle.size + e.delta * 0.6, 20, 140);
            document.getElementById('sizeVal').textContent = Math.floor(obstacle.size);
            return false;
        }
        
        function keyPressed() {
            if (key === 'r' || key === 'R') resetSimulation();
            if (key === 'c' || key === 'C') obstacle.shape = 'circle';
            if (key === 'e' || key === 'E') obstacle.shape = 'ellipse';
            if (key === 'q' || key === 'Q') obstacle.shape = 'rect';
            if (key === 'ArrowLeft') obstacle.angle -= 0.26;
            if (key === 'ArrowRight') obstacle.angle += 0.26;
        }
        
        function setupUI() {
            const viscSlider = document.getElementById('viscSlider');
            const inflowSlider = document.getElementById('inflowSlider');
            const sizeSlider = document.getElementById('sizeSlider');
            
            viscSlider.oninput = () => {
                visc = parseFloat(viscSlider.value) / 10000;
                document.getElementById('viscVal').textContent = visc.toFixed(5);
            };
            
            inflowSlider.oninput = () => {
                inflowSpeed = parseFloat(inflowSlider.value);
                document.getElementById('inflowVal').textContent = inflowSpeed.toFixed(1);
            };
            
            sizeSlider.oninput = () => {
                obstacle.size = parseFloat(sizeSlider.value);
                document.getElementById('sizeVal').textContent = Math.floor(obstacle.size);
            };
        }
        
        window.onload = () => {
            setupUI();
        };
    </script>
</body>
</html>
