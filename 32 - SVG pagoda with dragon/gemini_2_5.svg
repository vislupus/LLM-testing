<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1200" viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg" style="background-color: #f0f4f8;">
  <title>Chinese Pagoda with Dragon in a Garden</title>
  <desc>A complex SVG illustration of a 7-story Chinese pagoda, a coiling dragon, and a serene garden. Created using gradients, patterns, and filters.</desc>

  <!-- ===================================================================== -->
  <!-- DEFINITIONS: Gradients, Patterns, and Filters                         -->
  <!-- ===================================================================== -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a4c8d4"/>
      <stop offset="50%" stop-color="#d4e4e9"/>
      <stop offset="100%" stop-color="#e8f0f4"/>
    </linearGradient>
    <linearGradient id="pagodaColumnGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a13333"/>
      <stop offset="50%" stop-color="#c94c4c"/>
      <stop offset="100%" stop-color="#a13333"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="#ffdd77" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f56565" stop-opacity="0.8"/>
    </radialGradient>
    <linearGradient id="roofGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3a5a40"/>
      <stop offset="100%" stop-color="#2a402d"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fde488"/>
      <stop offset="50%" stop-color="#d4a237"/>
      <stop offset="100%" stop-color="#b88a2e"/>
    </linearGradient>
    <linearGradient id="dragonBodyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#588157"/>
      <stop offset="40%" stop-color="#3a5a40"/>
      <stop offset="60%" stop-color="#3a5a40"/>
      <stop offset="100%" stop-color="#a3b18a"/>
    </linearGradient>
    <linearGradient id="dragonManeGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9534f"/>
      <stop offset="100%" stop-color="#f0ad4e"/>
    </linearGradient>
    <linearGradient id="pondGradient" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a9d6e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#61a5c2" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Patterns -->
    <pattern id="roofTilePattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 0 10 C 5 0, 15 0, 20 10 L 20 20 L 0 20 Z" fill="#4a7c59" stroke="#3a5a40" stroke-width="1"/>
      <path d="M -10 10 C -5 0, 5 0, 10 10" fill="none" stroke="#3a5a40" stroke-width="1"/>
    </pattern>
    <pattern id="dragonScalePattern" patternUnits="userSpaceOnUse" width="15" height="15">
      <path d="M 0 7.5 C 3.75 0, 11.25 0, 15 7.5 C 11.25 15, 3.75 15, 0 7.5 Z" 
            fill="url(#dragonBodyGradient)" stroke="#283f28" stroke-width="0.5" />
    </pattern>

    <!-- Filters -->
    <filter id="softMist" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15"/>
    </filter>
    <filter id="gentleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Reusable Symbols -->
    <symbol id="lantern" viewBox="-15 -25 30 50">
      <g>
        <path d="M-10 -20 Q0 -25 10 -20" stroke="url(#goldGradient)" stroke-width="3" fill="none"/>
        <path d="M-12 -18 L 12 -18" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
        <rect x="-12" y="-18" width="24" height="28" rx="5" fill="url(#lanternGlow)" stroke="#c94c4c" stroke-width="1"/>
        <path d="M-10 10 Q0 15 10 10" stroke="url(#goldGradient)" stroke-width="3" fill="none"/>
        <path d="M-12 8 L 12 8" stroke="url(#goldGradient)" stroke-width="1.5" fill="none"/>
        <!-- Tassel -->
        <path d="M 0 13 L 0 20" stroke="#d9534f" stroke-width="1.5"/>
        <path d="M -4 22 L 4 22" stroke="#d9534f" stroke-width="1.5"/>
      </g>
    </symbol>

    <symbol id="pagodaFloor" viewBox="-150 -100 300 200">
      <!-- Roof Structure -->
      <g class="roof">
        <path d="M-140 0 C-120 -50, 120 -50, 140 0 L 130 10 L -130 10 Z" fill="url(#roofTilePattern)" stroke="#2a402d" stroke-width="1"/>
        <path d="M-145 -5 C-125 -55, 125 -55, 145 -5 L 140 0 C 120 -50, -120 -50, -140 0 Z" fill="url(#goldGradient)"/>
        <!-- Eave details -->
        <path d="M-150 10 L 150 10 L 145 15 L -145 15 Z" fill="#6f4e37"/>
        <circle cx="-142" cy="-2" r="4" fill="#d4a237"/>
        <circle cx="142" cy="-2" r="4" fill="#d4a237"/>
      </g>
      <!-- Walls and Balcony -->
      <g class="walls">
        <polygon points="-100 15, 100 15, 110 90, -110 90" fill="#f4e1d2"/>
        <polygon points="-100 15, 100 15, 110 90, -110 90" fill="black" fill-opacity="0.1" transform="translate(5, 5)"/>
        <!-- Window -->
        <rect x="-30" y="30" width="60" height="40" fill="#a13333" rx="5"/>
        <path d="M-30 50 H 30 M 0 30 V 70 M-15 30 V 70 M 15 30 V 70" stroke="#fde488" stroke-width="2"/>
        <!-- Columns -->
        <rect x="-105" y="15" width="10" height="75" fill="url(#pagodaColumnGradient)"/>
        <rect x="95" y="15" width="10" height="75" fill="url(#pagodaColumnGradient)"/>
      </g>
      <!-- Balcony Railing -->
      <g class="balcony" transform="translate(0, 90)">
        <rect x="-120" y="0" width="240" height="10" fill="#a13333"/>
        <path d="M-120 0 H 120 M-120 5 H 120" stroke="#6f4e37" stroke-width="1"/>
        <g stroke="#6f4e37" stroke-width="2">
            <path d="M-110 0 V 10" /> <path d="M-90 0 V 10" /> <path d="M-70 0 V 10" />
            <path d="M-50 0 V 10" /> <path d="M-30 0 V 10" /> <path d="M-10 0 V 10" />
            <path d="M10 0 V 10" /> <path d="M30 0 V 10" /> <path d="M50 0 V 10" />
            <path d="M70 0 V 10" /> <path d="M90 0 V 10" /> <path d="M110 0 V 10" />
        </g>
      </g>
    </symbol>
  </defs>

  <!-- ===================================================================== -->
  <!-- SCENE BACKGROUND                                                      -->
  <!-- ===================================================================== -->
  <g id="background">
    <rect x="0" y="0" width="1000" height="1200" fill="url(#skyGradient)" />
    <!-- Mist and Clouds -->
    <g filter="url(#softMist)" opacity="0.7">
      <circle cx="150" cy="300" r="100" fill="#ffffff" />
      <circle cx="850" cy="400" r="120" fill="#ffffff" />
      <ellipse cx="500" cy="1150" rx="400" ry="100" fill="#ffffff" />
      <ellipse cx="200" cy="600" rx="150" ry="60" fill="#f0f8ff" />
      <ellipse cx="750" cy="750" rx="180" ry="70" fill="#f0f8ff" />
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- GARDEN - Mid-ground Elements                                          -->
  <!-- ===================================================================== -->
  <g id="garden-midground">
    <!-- Ground and Pond -->
    <path d="M 0 1200 L 0 950 C 100 920, 300 900, 500 920 C 700 940, 900 930, 1000 950 L 1000 1200 Z" fill="#d8e2dc"/>
    <path id="pond" d="M 550 1050 C 400 1020, 200 1080, 150 1150 L 850 1180 C 800 1100, 700 1080, 550 1050 Z" fill="url(#pondGradient)" />
    
    <!-- Stylized Rocks -->
    <g id="rocks" fill="#8d99ae" stroke="#2b2d42" stroke-width="1">
      <path d="M 800 1000 C 780 960, 850 950, 880 970 C 920 950, 940 980, 930 1020 C 950 1050, 900 1080, 870 1060 C 830 1090, 820 1030, 800 1000 Z" />
      <path d="M 80 1020 C 60 990, 120 980, 150 1000 C 180 990, 200 1030, 180 1060 C 200 1080, 150 1120, 130 1100 C 100 1130, 90 1060, 80 1020 Z" />
    </g>
    
    <!-- Pine Tree -->
    <g id="pine-tree" transform="translate(800, 980) scale(1.2)">
        <path d="M 0 0 C 10 -50, -10 -80, 5 -130 C 20 -160, -5 -200, 10 -250" stroke="#5C3D2E" stroke-width="12" fill="none" stroke-linecap="round"/>
        <g fill="#3a5a40" opacity="0.9">
          <path d="M -60 -120 C -20 -135, 20 -135, 60 -120 C 30 -110, -30 -110, -60 -120 Z" />
          <path d="M -50 -180 C -15 -195, 15 -195, 50 -180 C 25 -170, -25 -170, -50 -180 Z" />
          <path d="M -40 -240 C -10 -255, 10 -255, 40 -240 C 20 -230, -20 -230, -40 -240 Z" />
        </g>
    </g>
    
    <!-- Bamboo -->
    <g id="bamboo" transform="translate(150, 1080) scale(1, -1)">
        <g stroke="#6a994e" stroke-width="8" stroke-linecap="round">
            <path d="M 0 0 V 250" />
            <path d="M 30 0 V 200" transform="skewX(-5)" />
            <path d="M -20 0 V 180" transform="skewX(5)" />
        </g>
        <g stroke="#386641" stroke-width="2">
            <path d="M-5 50 H 5" /> <path d="M-5 100 H 5" /> <path d="M-5 150 H 5" /> <path d="M-5 200 H 5" />
            <path d="M 24 40 H 36" transform="skewX(-5)"/> <path d="M 24 80 H 36" transform="skewX(-5)"/> <path d="M 24 120 H 36" transform="skewX(-5)"/>
        </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- DRAGON - Parts behind the pagoda                                      -->
  <!-- ===================================================================== -->
  <g id="dragon-behind" filter="url(#gentleShadow)">
    <!-- Lower Tail -->
    <path d="M 800 900 C 650 850, 600 750, 620 650" 
          stroke="url(#dragonScalePattern)" stroke-width="40" fill="none" stroke-linecap="round"/>
    <path d="M 800 900 C 650 850, 600 750, 620 650" 
          stroke="url(#dragonManeGradient)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="1 15" stroke-dashoffset="5"/>
  </g>

  <!-- ===================================================================== -->
  <!-- PAGODA STRUCTURE                                                      -->
  <!-- ===================================================================== -->
  <g id="pagoda" transform="translate(500, 1000)" filter="url(#gentleShadow)">
    
    <!-- Pagoda Base -->
    <g id="pagoda-base" transform="translate(0, 0)">
      <polygon points="-220 50, 220 50, 250 0, -250 0" fill="#6c757d"/>
      <polygon points="-250 0, 250 0, 240 10, -240 10" fill="#495057"/>
      <rect x="-220" y="10" width="440" height="40" fill="#adb5bd" stroke="#6c757d" stroke-width="2"/>
    </g>

    <!-- Floor 1 -->
    <g id="floor-1" transform="translate(0, -60) scale(1.2)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 2 -->
    <g id="floor-2" transform="translate(0, -170) scale(1.1)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 3 -->
    <g id="floor-3" transform="translate(0, -270) scale(1.0)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 4 -->
    <g id="floor-4" transform="translate(0, -360) scale(0.9)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 5 -->
    <g id="floor-5" transform="translate(0, -440) scale(0.8)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 6 -->
    <g id="floor-6" transform="translate(0, -510) scale(0.7)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Floor 7 -->
    <g id="floor-7" transform="translate(0, -570) scale(0.6)">
      <use href="#pagodaFloor"/>
    </g>

    <!-- Pagoda Finial (Top) -->
    <g id="finial" transform="translate(0, -660)">
      <path d="M 0,0 L -50,0 Q -40 -40 0 -50 Q 40 -40 50 0 Z" fill="#6f4e37"/>
      <path d="M 0 -50 L 0 -130" stroke="url(#goldGradient)" stroke-width="8" stroke-linecap="round"/>
      <circle cx="0" cy="-70" r="12" fill="url(#goldGradient)"/>
      <circle cx="0" cy="-95" r="10" fill="url(#goldGradient)"/>
      <circle cx="0" cy="-115" r="8" fill="url(#goldGradient)"/>
      <path d="M 0 -130 Q 10 -140, 0 -150 Q -10 -140, 0 -130" fill="url(#goldGradient)"/>
    </g>

    <!-- Lanterns hanging from eaves -->
    <use href="#lantern" x="330" y="440" width="30" height="50"/>
    <use href="#lantern" x="670" y="440" width="30" height="50"/>
    <use href="#lantern" x="290" y="555" width="25" height="40"/>
    <use href="#lantern" x="710" y="555" width="25" height="40"/>
  </g>
  
  <!-- ===================================================================== -->
  <!-- DRAGON - Parts in front of the pagoda                                 -->
  <!-- ===================================================================== -->
  <g id="dragon-front" filter="url(#gentleShadow)">
    <!-- Mid Body -->
    <path d="M 380 650 C 350 550, 500 500, 650 520 C 800 540, 750 400, 600 350"
          stroke="url(#dragonScalePattern)" stroke-width="45" fill="none" stroke-linecap="round"/>
    <path d="M 380 650 C 350 550, 500 500, 650 520 C 800 540, 750 400, 600 350"
          stroke="url(#dragonManeGradient)" stroke-width="12" fill="none" stroke-linecap="round" stroke-dasharray="1 15" stroke-dashoffset="5"/>
          
    <!-- Dragon Head and Upper Body -->
    <g id="dragon-head-section" transform="translate(350, 320)">
        <!-- Neck/Body -->
        <path d="M 0 0 C -150 -50, -100 -200, 50 -180" 
            stroke="url(#dragonScalePattern)" stroke-width="50" fill="none" stroke-linecap="round"/>
        <path d="M 0 0 C -150 -50, -100 -200, 50 -180"
            stroke="url(#dragonManeGradient)" stroke-width="15" fill="none" stroke-linecap="round" stroke-dasharray="1 15" stroke-dashoffset="5"/>
        
        <!-- Head -->
        <g id="dragon-head" transform="translate(50, -180) rotate(15)">
            <!-- Jaw and Snout -->
            <path d="M 0 0 C 40 -5, 60 10, 80 5 C 90 -10, 70 -30, 50 -35 C 20 -45, -10 -25, 0 0 Z" fill="#3a5a40"/>
            <path d="M 10 5 C 40 10, 60 20, 75 15 C 60 25, 30 20, 10 5 Z" fill="#a3b18a"/>
            
            <!-- Eye -->
            <path d="M 25 -25 C 40 -35, 50 -30, 45 -20 Z" fill="#fde488"/>
            <circle cx="38" cy="-26" r="3" fill="#a13333"/>
            
            <!-- Horns -->
            <path d="M 0 -10 C -30 -50, -20 -80, -10 -75 Z" fill="#d4a237" stroke="#b88a2e" stroke-width="2"/>
            <path d="M -10 -15 C -40 -60, -30 -90, -20 -85 Z" fill="#d4a237" stroke="#b88a2e" stroke-width="2"/>

            <!-- Whiskers and Mane -->
            <g stroke="url(#dragonManeGradient)" stroke-width="3" fill="none" stroke-linecap="round">
                <path d="M 75 0 C 120 10, 130 -30, 100 -40"/>
                <path d="M 80 5 C 130 20, 140 -20, 110 -30"/>
            </g>
            <g stroke="#fde488" stroke-width="4" fill="none" stroke-linecap="round">
                <path d="M-5 -30 C -50 -40, -80 0, -60 20"/>
                <path d="M-15 -35 C -70 -50, -100 -10, -80 10"/>
            </g>

            <!-- Claws -->
            <g transform="translate(-140, 80) rotate(-40)">
                 <path d="M 0 0 C 20 20, 30 50, 10 60" stroke="#3a5a40" stroke-width="10" fill="none" stroke-linecap="round"/>
                 <g stroke="#2b2d42" stroke-width="3" fill="none" stroke-linecap="round">
                    <path d="M 10 60 C 20 75, 5 80, 15 85"/>
                    <path d="M 10 60 C 0 75, -10 70, 0 82"/>
                 </g>
            </g>
        </g>
    </g>
  </g>

  <!-- ===================================================================== -->
  <!-- FOREGROUND Elements                                                   -->
  <!-- ===================================================================== -->
  <g id="foreground">
    <!-- Lotus flower on pond -->
    <g transform="translate(400, 1120)">
        <path d="M 0 0 C -20 -30, 20 -30, 0 0 M -10 -5 C -30 -35, 0 -40, -10 -5 M 10 -5 C 30 -35, 0 -40, 10 -5" fill="#ffc2d1" stroke="#e07a91" stroke-width="1"/>
        <circle cx="0" cy="-20" r="5" fill="#fde488"/>
    </g>
    <!-- Foreground mist -->
    <g filter="url(#softMist)" opacity="0.4">
       <ellipse cx="500" cy="1220" rx="600" ry="80" fill="#ffffff" />
    </g>
  </g>

</svg>