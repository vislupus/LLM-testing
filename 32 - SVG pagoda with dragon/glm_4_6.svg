<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bbdefb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pagodaRoofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d32f2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b71c1c;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="pagodaWoodGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8d6e63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d4c41;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="dragonScaleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#29b6f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#03a9f4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffeb3b;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="lanternGlow">
      <stop offset="0%" style="stop-color:#ffeb3b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0.3" />
    </radialGradient>
    
    <filter id="pagodaShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="dragonGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <pattern id="tilePattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#b71c1c"/>
      <path d="M0,10 L20,10 M10,0 L10,20" stroke="#8b0000" stroke-width="1" opacity="0.3"/>
    </pattern>
    
    <pattern id="dragonScalePattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="3" fill="url(#dragonScaleGradient)" opacity="0.8"/>
    </pattern>
  </defs>
  
  <!-- Sky Background -->
  <rect width="1200" height="1200" fill="url(#skyGradient)"/>
  
  <!-- Mist/Clouds -->
  <ellipse cx="300" cy="150" rx="200" ry="80" fill="white" opacity="0.3"/>
  <ellipse cx="900" cy="200" rx="250" ry="90" fill="white" opacity="0.25"/>
  <ellipse cx="150" cy="300" rx="180" ry="70" fill="white" opacity="0.2"/>
  <ellipse cx="1050" cy="350" rx="220" ry="80" fill="white" opacity="0.25"/>
  
  <!-- Garden Ground -->
  <rect x="0" y="800" width="1200" height="400" fill="#8bc34a" opacity="0.3"/>
  
  <!-- Pathway -->
  <path d="M200,850 Q400,830 600,850 T1000,840" stroke="#d7ccc8" stroke-width="40" fill="none" opacity="0.6"/>
  <path d="M200,850 Q400,830 600,850 T1000,840" stroke="#a1887f" stroke-width="35" fill="none" opacity="0.4"/>
  
  <!-- Rocks -->
  <ellipse cx="150" cy="900" rx="60" ry="40" fill="#757575" opacity="0.8"/>
  <ellipse cx="180" cy="910" rx="50" ry="35" fill="#616161" opacity="0.7"/>
  <ellipse cx="1000" cy="920" rx="70" ry="45" fill="#757575" opacity="0.8"/>
  <ellipse cx="1030" cy="930" rx="60" ry="40" fill="#616161" opacity="0.7"/>
  
  <!-- Bamboo -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="8" height="150" fill="#2e7d32"/>
    <rect x="12" y="10" width="8" height="140" fill="#388e3c"/>
    <rect x="24" y="5" width="8" height="145" fill="#2e7d32"/>
    <rect x="36" y="0" width="8" height="150" fill="#388e3c"/>
    <rect x="48" y="10" width="8" height="140" fill="#2e7d32"/>
    
    <!-- Bamboo leaves -->
    <path d="M0,0 L-15,-20 L0,-15 Z" fill="#1b5e20"/>
    <path d="M12,10 L-3,-10 L12,-5 Z" fill="#1b5e20"/>
    <path d="M24,5 L9,-15 L24,-10 Z" fill="#1b5e20"/>
    <path d="M36,0 L21,-20 L36,-15 Z" fill="#1b5e20"/>
    <path d="M48,10 L33,-10 L48,-5 Z" fill="#1b5e20"/>
  </g>
  
  <!-- Pine Trees -->
  <g transform="translate(1000, 700)">
    <path d="M0,0 L0,-100 L-40,-80 L-20,-60 L-50,-40 L-30,-20 L-60,0 L0,20 L60,0 L30,-20 L50,-40 L20,-60 L40,-80 Z" fill="#4caf50"/>
    <rect x="-5" y="0" width="10" height="80" fill="#795548"/>
  </g>
  
  <!-- Flowers -->
  <g transform="translate(300, 850)">
    <circle cx="0" cy="0" r="8" fill="#ffeb3b"/>
    <circle cx="20" cy="10" r="6" fill="#ff9800"/>
    <circle cx="-15" cy="15" r="7" fill="#e91e63"/>
    <circle cx="30" cy="25" r="5" fill="#9c27b0"/>
    <circle cx="-25" cy="30" r="6" fill="#f44336"/>
  </g>
  
  <!-- Pond -->
  <ellipse cx="800" cy="950" rx="120" ry="60" fill="#4fc3f7" opacity="0.6"/>
  <ellipse cx="800" cy="950" rx="100" ry="50" fill="#29b6f6" opacity="0.5"/>
  
  <!-- Chinese Dragon -->
  <g transform="translate(600, 600)" filter="url(#dragonGlow)">
    <!-- Dragon Body -->
    <path d="M-400,0 Q-350,-50 -300,0 Q-250,50 -200,0 Q-150,-50 -100,0 Q-50,50 0,0 Q50,-50 100,0 Q150,50 200,0 Q250,-50 300,0 Q350,50 400,0" 
          fill="url(#dragonScalePattern)" stroke="#0277bd" stroke-width="2"/>
    
    <!-- Dragon Head -->
    <ellipse cx="400" cy="0" rx="60" ry="50" fill="url(#dragonScaleGradient)" stroke="#0277bd" stroke-width="2"/>
    <ellipse cx="430" cy="-10" rx="15" ry="10" fill="#ffeb3b"/>
    <ellipse cx="370" cy="-10" rx="15" ry="10" fill="#ffeb3b"/>
    <ellipse cx="400" cy="10" rx="20" ry="15" fill="#ff5722"/>
    <path d="M370,-30 L380,-40 L390,-30" stroke="#ffeb3b" stroke-width="3" fill="none"/>
    <path d="M430,-30 L420,-40 L410,-30" stroke="#ffeb3b" stroke-width="3" fill="none"/>
    <path d="M400,-40 L400,-50" stroke="#ffeb3b" stroke-width="3" fill="none"/>
    <path d="M360,-10 L340,-20 M440,-10 L460,-20" stroke="#ffeb3b" stroke-width="2" fill="none"/>
    
    <!-- Dragon Horns -->
    <path d="M380,-50 Q370,-70 360,-80" stroke="#ffeb3b" stroke-width="4" fill="none"/>
    <path d="M420,-50 Q430,-70 440,-80" stroke="#ffeb3b" stroke-width="4" fill="none"/>
    
    <!-- Dragon Claws -->
    <path d="M350,20 L330,40 L340,30 Z" fill="#ffeb3b" stroke="#0277bd" stroke-width="1"/>
    <path d="M450,20 L470,40 L460,30 Z" fill="#ffeb3b" stroke="#0277bd" stroke-width="1"/>
  </g>
  
  <!-- Pagoda -->
  <g transform="translate(600, 700)" filter="url(#pagodaShadow)">
    <!-- Base -->
    <rect x="-100" y="0" width="200" height="100" fill="url(#pagodaWoodGradient)" stroke="#5d4037" stroke-width="2"/>
    
    <!-- Floors 1-8 -->
    <g id="floors">
      <!-- Floor 1 -->
      <rect x="-80" y="20" width="160" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-75" y="25" width="150" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 2 -->
      <rect x="-70" y="100" width="140" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-65" y="105" width="130" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 3 -->
      <rect x="-60" y="180" width="120" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-55" y="185" width="110" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 4 -->
      <rect x="-50" y="260" width="100" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-45" y="265" width="90" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 5 -->
      <rect x="-40" y="340" width="80" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-35" y="345" width="70" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 6 -->
      <rect x="-30" y="420" width="60" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-25" y="425" width="50" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 7 -->
      <rect x="-20" y="500" width="40" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-15" y="505" width="30" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
      
      <!-- Floor 8 (Top) -->
      <rect x="-10" y="580" width="20" height="80" fill="#8d6e63" stroke="#5d4037" stroke-width="2"/>
      <rect x="-5" y="585" width="10" height="70" fill="#a1887f" stroke="#5d4037" stroke-width="1"/>
    </g>
    
    <!-- Roofs -->
    <g id="roofs">
      <!-- Roof 1 -->
      <path d="M-100,20 L0,-40 L100,20 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-90,25 L0,-30 L90,25 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 2 -->
      <path d="M-80,100 L0,-20 L80,100 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-70,105 L0,-15 L70,105 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 3 -->
      <path d="M-70,180 L0,-10 L70,180 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-60,185 L0,-5 L60,185 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 4 -->
      <path d="M-60,260 L0,0 L60,260 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-50,265 L0,5 L50,265 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 5 -->
      <path d="M-50,340 L0,10 L50,340 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-40,345 L0,15 L40,345 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 6 -->
      <path d="M-40,420 L0,20 L40,420 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-30,425 L0,25 L30,425 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 7 -->
      <path d="M-30,500 L0,30 L30,500 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-20,505 L0,35 L20,505 Z" fill="url(#tilePattern)"/>
      
      <!-- Roof 8 (Top) -->
      <path d="M-20,580 L0,40 L20,580 Z" fill="url(#pagodaRoofGradient)" stroke="#8b0000" stroke-width="2"/>
      <path d="M-10,585 L0,45 L10,585 Z" fill="url(#tilePattern)"/>
    </g>
    
    <!-- Decorative Elements -->
    <g id="decorations">
      <!-- Lanterns -->
      <g transform="translate(-60, 50)">
        <rect x="-5" y="-10" width="10" height="20" fill="#ffeb3b" stroke="#ff9800" stroke-width="1"/>
        <rect x="-7" y="-12" width="14" height="4" fill="#ff9800"/>
        <circle cx="0" cy="10" r="3" fill="#ff5722"/>
        <circle cx="0" cy="10" r="2" fill="#ffeb3b"/>
      </g>
      
      <g transform="translate(60, 50)">
        <rect x="-5" y="-10" width="10" height="20" fill="#ffeb3b" stroke="#ff9800" stroke-width="1"/>
        <rect x="-7" y="-12" width="14" height="4" fill="#ff9800"/>
        <circle cx="0" cy="10" r="3" fill="#ff5722"/>
        <circle cx="0" cy="10" r="2" fill="#ffeb3b"/>
      </g>
      
      <!-- Windows -->
      <rect x="-30" y="40" width="20" height="20" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
      <rect x="10" y="40" width="20" height="20" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
      
      <rect x="-25" y="120" width="15" height="15" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
      <rect x="10" y="120" width="15" height="15" fill="#87ceeb" stroke="#4682b4" stroke-width="2"/>
      
      <!-- Carved Ornaments -->
      <circle cx="0" cy="30" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">福</text>
      
      <circle cx="0" cy="110" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="115" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">寿</text>
      
      <circle cx="0" cy="190" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">喜</text>
      
      <circle cx="0" cy="270" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="275" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">财</text>
      
      <circle cx="0" cy="350" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="355" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">安</text>
      
      <circle cx="0" cy="430" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="435" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">康</text>
      
      <circle cx="0" cy="510" r="8" fill="gold" stroke="#b8860b" stroke-width="1"/>
      <text x="0" y="515" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#b8860b">乐</text>
    </g>
    
    <!-- Dragon Coiling Around Pagoda -->
    <g transform="translate(600, 700)" opacity="0.7">
      <path d="M-50,50 Q0,30 50,50 Q100,70 150,50 Q200,30 250,50 Q300,70 350,50 Q400,30 450,50" 
            fill="none" stroke="#0277bd" stroke-width="8" stroke-linecap="round"/>
      <path d="M-50,70 Q0,50 50,70 Q100,90 150,70 Q200,50 250,70 Q300,90 350,70 Q400,50 450,70" 
            fill="none" stroke="#0277bd" stroke-width="8" stroke-linecap="round"/>
      <path d="M-50,90 Q0,70 50,90 Q100,110 150,90 Q200,70 250,90 Q300,110 350,90 Q400,70 450,90" 
            fill="none" stroke="#0277bd" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
  
  <!-- Title -->
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#d32f2f">Chinese Pagoda</text>
  <text x="600" y="85" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#6d4c41">Dragon's Sanctuary</text>
  
  <!-- Decorative Border -->
  <rect x="20" y="20" width="1160" height="1160" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="10,5" opacity="0.5"/>
</svg>
