<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="100%" height="100%">
<title>Eight-Tiered Pagoda of the Azure Dragon</title>
<desc>A classical Chinese pagoda wrapped by a celestial dragon in a peaceful garden — vector art.</desc>
<defs>
  <!-- ========== gradients ========== -->
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#f7e5c8"/>
    <stop offset="55%"  stop-color="#efd3a7"/>
    <stop offset="100%" stop-color="#d8b17f"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="820" cy="260" r="260">
    <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.9"/>
    <stop offset="60%" stop-color="#fce1a3" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#fce1a3" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>

  <!-- Roof gradients: dark glazed tiles -->
  <linearGradient id="roofA" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3a2626"/>
    <stop offset="55%" stop-color="#6b2a28"/>
    <stop offset="100%" stop-color="#2b1314"/>
  </linearGradient>
  <linearGradient id="roofB" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2d1d1e"/>
    <stop offset="50%" stop-color="#5a2322"/>
    <stop offset="100%" stop-color="#1e0f10"/>
  </linearGradient>
  <linearGradient id="roofEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f5d26a"/>
    <stop offset="100%" stop-color="#b4802a"/>
  </linearGradient>
  <linearGradient id="roofUnder" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8a2d26"/>
    <stop offset="100%" stop-color="#c44a3a"/>
  </linearGradient>

  <!-- Body / wood walls -->
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b43a34"/>
    <stop offset="15%" stop-color="#e05448"/>
    <stop offset="50%" stop-color="#cd433b"/>
    <stop offset="85%" stop-color="#e05448"/>
    <stop offset="100%" stop-color="#9e2f29"/>
  </linearGradient>
  <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8b231c"/>
    <stop offset="50%" stop-color="#c7352b"/>
    <stop offset="100%" stop-color="#8b231c"/>
  </linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4a2e1d"/>
    <stop offset="100%" stop-color="#2d1a0f"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffe48a"/>
    <stop offset="50%" stop-color="#e2b044"/>
    <stop offset="100%" stop-color="#8e6220"/>
  </linearGradient>
  <linearGradient id="goldBright" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff0b3"/>
    <stop offset="50%" stop-color="#f3c24b"/>
    <stop offset="100%" stop-color="#a97a1f"/>
  </linearGradient>
  <linearGradient id="stoneBase" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#d6d0c2"/>
    <stop offset="100%" stop-color="#7c7262"/>
  </linearGradient>
  <linearGradient id="stoneDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9e9382"/>
    <stop offset="100%" stop-color="#4f483d"/>
  </linearGradient>

  <!-- Dragon gradients -->
  <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"  stop-color="#2e6b51"/>
    <stop offset="35%" stop-color="#3f8b68"/>
    <stop offset="70%" stop-color="#74b081"/>
    <stop offset="100%" stop-color="#214c37"/>
  </linearGradient>
  <linearGradient id="dragonBelly" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#f5ddb0"/>
    <stop offset="100%" stop-color="#c89c5c"/>
  </linearGradient>
  <linearGradient id="dragonFin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e7c06a"/>
    <stop offset="100%" stop-color="#9a6a1f"/>
  </linearGradient>
  <linearGradient id="dragonMane" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffd784"/>
    <stop offset="100%" stop-color="#b97426"/>
  </linearGradient>
  <radialGradient id="pearl" cx="0.5" cy="0.4" r="0.6">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="50%" stop-color="#ffe38a"/>
    <stop offset="100%" stop-color="#c77e1a"/>
  </radialGradient>

  <!-- Pond / water -->
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7fb6c6"/>
    <stop offset="100%" stop-color="#3f6d81"/>
  </linearGradient>
  <!-- Ground -->
  <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6e8f4a"/>
    <stop offset="100%" stop-color="#4b6a31"/>
  </linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#e8ddbd"/>
    <stop offset="100%" stop-color="#b8a580"/>
  </linearGradient>
  <linearGradient id="pine" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#355c35"/>
    <stop offset="100%" stop-color="#1d3a21"/>
  </linearGradient>
  <linearGradient id="bamboo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#668c3e"/>
    <stop offset="50%" stop-color="#94bb5c"/>
    <stop offset="100%" stop-color="#4b6b2b"/>
  </linearGradient>
  <linearGradient id="flowerPink" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffc5d2"/>
    <stop offset="100%" stop-color="#d77a97"/>
  </linearGradient>

  <!-- ========== patterns ========== -->
  <!-- roof tiles pattern -->
  <pattern id="roofTiles" patternUnits="userSpaceOnUse" width="22" height="16">
    <rect width="22" height="16" fill="url(#roofA)"/>
    <path d="M0 0 Q 11 10 22 0" stroke="#2a1010" stroke-width="1" fill="none"/>
    <path d="M11 0 L 11 16" stroke="#2a1010" stroke-width="0.6" opacity="0.5"/>
    <circle cx="11" cy="0" r="1.2" fill="#e2b04a"/>
  </pattern>
  <pattern id="roofTilesDark" patternUnits="userSpaceOnUse" width="22" height="16">
    <rect width="22" height="16" fill="url(#roofB)"/>
    <path d="M0 0 Q 11 10 22 0" stroke="#1a0707" stroke-width="1" fill="none"/>
    <circle cx="11" cy="0" r="1.1" fill="#c89a38"/>
  </pattern>

  <!-- Lattice window pattern -->
  <pattern id="lattice" patternUnits="userSpaceOnUse" width="14" height="14">
    <rect width="14" height="14" fill="#1a1108"/>
    <path d="M0 7 L14 7 M7 0 L7 14" stroke="#d8b05a" stroke-width="1"/>
    <rect x="0" y="0" width="14" height="14" fill="none" stroke="#7a5a20" stroke-width="0.6"/>
  </pattern>
  <!-- Wooden door pattern -->
  <pattern id="door" patternUnits="userSpaceOnUse" width="30" height="40">
    <rect width="30" height="40" fill="#5a231c"/>
    <rect x="2" y="2" width="26" height="36" fill="none" stroke="#2a0f0b" stroke-width="1"/>
    <line x1="15" y1="2" x2="15" y2="38" stroke="#2a0f0b" stroke-width="0.8"/>
    <circle cx="12" cy="20" r="1.5" fill="#f3c24b"/>
    <circle cx="18" cy="20" r="1.5" fill="#f3c24b"/>
  </pattern>

  <!-- Dragon scales pattern (used along body) -->
  <pattern id="scales" patternUnits="userSpaceOnUse" width="16" height="12" patternTransform="skewX(-8)">
    <path d="M0 12 Q 8 -2 16 12 Z" fill="none" stroke="#0f2a1d" stroke-width="1.2"/>
    <path d="M0 12 Q 8 -2 16 12 Z" fill="#4a8c66" fill-opacity="0.45"/>
    <path d="M0 6 Q 8 12 16 6" stroke="#0f2a1d" stroke-width="0.6" fill="none"/>
  </pattern>

  <!-- Brick pattern for base -->
  <pattern id="bricks" patternUnits="userSpaceOnUse" width="40" height="18">
    <rect width="40" height="18" fill="#7e7465"/>
    <rect x="0" y="0" width="19" height="8" fill="#9a8f7e" stroke="#4e483d"/>
    <rect x="20" y="0" width="19" height="8" fill="#8c8272" stroke="#4e483d"/>
    <rect x="-10" y="9" width="19" height="8" fill="#8b8072" stroke="#4e483d"/>
    <rect x="10" y="9" width="19" height="8" fill="#9a8f7e" stroke="#4e483d"/>
    <rect x="30" y="9" width="19" height="8" fill="#8b8072" stroke="#4e483d"/>
  </pattern>

  <!-- Ripple pattern for pond -->
  <pattern id="ripples" patternUnits="userSpaceOnUse" width="80" height="40">
    <rect width="80" height="40" fill="url(#water)"/>
    <path d="M-10 12 Q 10 4 30 12 T 70 12 T 110 12" stroke="#ffffff" stroke-width="0.6" fill="none" opacity="0.35"/>
    <path d="M-10 28 Q 10 20 30 28 T 70 28 T 110 28" stroke="#ffffff" stroke-width="0.5" fill="none" opacity="0.25"/>
  </pattern>

  <!-- ========== filters ========== -->
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1.4"/>
  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
    <feOffset dx="0" dy="6" result="b"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
    <feOffset dx="2" dy="3"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- ========== Reusable elements ========== -->
  <!-- Lantern -->
  <g id="lantern">
    <rect x="-3" y="-24" width="6" height="6" fill="#2a1010"/>
    <path d="M-12 -20 Q 0 -10 12 -20 L 10 -6 Q 0 2 -10 -6 Z" fill="#d82b2b" stroke="#4a0b0b" stroke-width="1"/>
    <path d="M-10 -6 Q 0 2 10 -6" stroke="#4a0b0b" stroke-width="1" fill="none"/>
    <rect x="-11" y="-22" width="22" height="3" fill="#f3c24b"/>
    <rect x="-10" y="-7" width="20" height="2" fill="#f3c24b"/>
    <path d="M-3 2 L3 2 L2 10 L-2 10 Z" fill="#2a1010"/>
    <ellipse cx="0" cy="-12" rx="4" ry="6" fill="#ffd062" opacity="0.6" filter="url(#glow)"/>
  </g>

  <!-- Small bell/wind chime -->
  <g id="windBell">
    <path d="M-3 -2 L3 -2 L2 6 L-2 6 Z" fill="url(#gold)"/>
    <circle cx="0" cy="7" r="1.5" fill="#8e6220"/>
    <line x1="0" y1="-8" x2="0" y2="-2" stroke="#8e6220" stroke-width="0.6"/>
  </g>

  <!-- Single fence post & panel -->
  <g id="fence">
    <rect x="-1" y="-30" width="3" height="30" fill="#8b4b1d"/>
    <rect x="-2" y="-28" width="5" height="3" fill="#b26127"/>
    <rect x="-2" y="-15" width="5" height="3" fill="#b26127"/>
  </g>

</defs>

<!-- ========== BACKGROUND ========== -->
<rect width="1200" height="1600" fill="url(#sky)"/>
<rect width="1200" height="1600" fill="url(#sunGlow)"/>

<!-- Distant misty mountain silhouettes -->
<g opacity="0.45">
  <path d="M0 780 Q 120 680 240 720 Q 360 660 500 720 Q 620 670 760 720 Q 880 650 1000 720 Q 1100 680 1200 740 L 1200 820 L 0 820 Z" fill="#b08e66"/>
  <path d="M0 830 Q 160 760 320 800 Q 460 730 620 800 Q 780 760 900 810 Q 1040 770 1200 820 L 1200 900 L 0 900 Z" fill="#93724f" opacity="0.75"/>
</g>

<!-- Ground (garden base) -->
<path d="M0 1080 Q 300 1050 600 1060 Q 900 1050 1200 1080 L1200 1600 L0 1600 Z" fill="url(#grass)"/>
<!-- Foreground earth -->
<path d="M0 1380 Q 400 1350 600 1360 Q 900 1350 1200 1380 L1200 1600 L0 1600 Z" fill="#3a5225"/>

<!-- Pond -->
<g id="pond">
  <ellipse cx="260" cy="1300" rx="180" ry="70" fill="url(#ripples)"/>
  <ellipse cx="260" cy="1300" rx="180" ry="70" fill="none" stroke="#4d6749" stroke-width="3"/>
  <!-- Lilly pads -->
  <g fill="#5a8a3e" stroke="#2d4520" stroke-width="1">
    <ellipse cx="190" cy="1280" rx="22" ry="12"/>
    <path d="M190 1280 L 200 1272"/>
    <ellipse cx="300" cy="1315" rx="20" ry="11"/>
    <ellipse cx="240" cy="1330" rx="16" ry="9"/>
  </g>
  <g fill="#ffb6c1" stroke="#a33e5f">
    <circle cx="195" cy="1273" r="4"/>
    <circle cx="205" cy="1275" r="4"/>
    <circle cx="199" cy="1268" r="3"/>
  </g>
  <!-- Stone edging -->
  <g fill="url(#stoneDark)" stroke="#2c2821" stroke-width="1">
    <ellipse cx="90" cy="1295" rx="22" ry="10"/>
    <ellipse cx="380" cy="1260" rx="26" ry="11"/>
    <ellipse cx="420" cy="1310" rx="20" ry="9"/>
    <ellipse cx="130" cy="1350" rx="20" ry="9"/>
  </g>
</g>

<!-- Stone pathway leading to pagoda -->
<g id="pathway">
  <path d="M600 1480 L 600 1240 Q 580 1200 600 1180 Q 620 1160 600 1140 L 600 1080" stroke="url(#path)" stroke-width="42" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Stepping stones -->
  <g fill="url(#stoneDark)" stroke="#2a261d">
    <ellipse cx="600" cy="1460" rx="28" ry="10"/>
    <ellipse cx="600" cy="1400" rx="28" ry="10"/>
    <ellipse cx="580" cy="1340" rx="28" ry="10"/>
    <ellipse cx="620" cy="1280" rx="28" ry="10"/>
    <ellipse cx="580" cy="1220" rx="28" ry="10"/>
  </g>
</g>

<!-- ========== PAGODA BASE PLATFORM ========== -->
<g id="platform" filter="url(#shadow)">
  <!-- Lowest stone terrace -->
  <ellipse cx="600" cy="1135" rx="330" ry="48" fill="url(#stoneDark)"/>
  <path d="M280 1135 Q 600 1085 920 1135 L 920 1080 Q 600 1040 280 1080 Z" fill="url(#bricks)" stroke="#2a261d" stroke-width="2"/>
  <rect x="280" y="1080" width="640" height="55" fill="#8a7f6e" stroke="#2a261d" stroke-width="2"/>
  <!-- Top balustrade -->
  <path d="M300 1080 L 900 1080" stroke="#2a1c10" stroke-width="4"/>
  <path d="M300 1066 L 900 1066" stroke="#e2b04a" stroke-width="2"/>
  <!-- Vertical balusters -->
  <g fill="#2a1c10">
    <g id="baluster">
      <rect x="-5" y="0" width="10" height="18" rx="2"/>
      <circle cx="0" cy="-2" r="3" fill="#e2b04a"/>
    </g>
    <use href="#baluster" x="330" y="1060"/>
    <use href="#baluster" x="400" y="1060"/>
    <use href="#baluster" x="470" y="1060"/>
    <use href="#baluster" x="540" y="1060"/>
    <use href="#baluster" x="600" y="1060"/>
    <use href="#baluster" x="660" y="1060"/>
    <use href="#baluster" x="730" y="1060"/>
    <use href="#baluster" x="800" y="1060"/>
    <use href="#baluster" x="870" y="1060"/>
  </g>
  <!-- Steps leading up -->
  <path d="M560 1135 L 560 1150 L 640 1150 L 640 1135" fill="#8a7f6e" stroke="#2a261d"/>
  <path d="M540 1150 L 540 1165 L 660 1165 L 660 1150" fill="#756a59" stroke="#2a261d"/>
  <!-- Carved stone lions at steps (simple) -->
  <g fill="url(#stoneDark)" stroke="#2a261d" stroke-width="1.2">
    <g transform="translate(520 1120)">
      <path d="M-18 20 Q -22 0 -14 -8 L -6 -12 L 6 -12 L 14 -8 Q 22 0 18 20 Z"/>
      <circle cx="-4" cy="-10" r="2" fill="#1a1712"/>
      <circle cx="4" cy="-10" r="2" fill="#1a1712"/>
      <path d="M-3 -4 L 3 -4" stroke="#1a1712" stroke-width="0.8"/>
      <rect x="-20" y="18" width="40" height="6"/>
    </g>
    <g transform="translate(680 1120)">
      <path d="M-18 20 Q -22 0 -14 -8 L -6 -12 L 6 -12 L 14 -8 Q 22 0 18 20 Z"/>
      <circle cx="-4" cy="-10" r="2" fill="#1a1712"/>
      <circle cx="4" cy="-10" r="2" fill="#1a1712"/>
      <path d="M-3 -4 L 3 -4" stroke="#1a1712" stroke-width="0.8"/>
      <rect x="-20" y="18" width="40" height="6"/>
    </g>
  </g>
</g>

<!-- ========== PAGODA: multi-tiered ========== -->
<!-- tiers: 8 levels. Roof spans decrease as we go up.
     Each tier has: base wall (red, with pillar and door/windows), balcony, then curved roof with upturned eaves.
     Dimensions (half width at bottom):
       T8 lowest? We'll build bottom-up, 8 tiers above platform (plus 1 ground-floor hall? 8 tiers of roofs)
     Use Y from platform top ~1080 upward, Y decreases as we go up. -->
<g id="pagoda" filter="url(#softshadow)">

  <!-- ====== Helper macro per tier, drawn bottom-up (we will write explicit groups for control) ====== -->

  <!-- ========== TIER 1 (largest, bottom hall) ========== -->
  <g id="tier1" transform="translate(600 1080)">
    <!-- Wall box (pillars and red walls) -->
    <!-- Back wall (darker, implied) -->
    <rect x="-190" y="-90" width="380" height="90" fill="#8b231c" stroke="#3a0f0b" stroke-width="1.5"/>
    <!-- Pillars -->
    <g fill="url(#pillar)" stroke="#3a0f0b" stroke-width="1">
      <rect x="-190" y="-90" width="14" height="90"/>
      <rect x="-130" y="-90" width="14" height="90"/>
      <rect x="-70"  y="-90" width="14" height="90"/>
      <rect x="56"   y="-90" width="14" height="90"/>
      <rect x="116"  y="-90" width="14" height="90"/>
      <rect x="176"  y="-90" width="14" height="90"/>
    </g>
    <!-- Front open panels -->
    <rect x="-176" y="-88" width="46" height="86" fill="#c7352b"/>
    <rect x="-116" y="-88" width="46" height="86" fill="#c7352b"/>
    <rect x="-56"  y="-88" width="112" height="86" fill="#c7352b"/>
    <rect x="70"   y="-88" width="46" height="86" fill="#c7352b"/>
    <rect x="130"  y="-88" width="46" height="86" fill="#c7352b"/>
    <!-- Lattice windows -->
    <rect x="-168" y="-66" width="30" height="38" fill="url(#lattice)"/>
    <rect x="-108" y="-66" width="30" height="38" fill="url(#lattice)"/>
    <rect x="78"   y="-66" width="30" height="38" fill="url(#lattice)"/>
    <rect x="138"  y="-66" width="30" height="38" fill="url(#lattice)"/>
    <!-- Central double door -->
    <rect x="-32" y="-64" width="64" height="62" fill="url(#door)" stroke="#1a0707" stroke-width="1.5"/>
    <path d="M-32 -64 L 32 -64" stroke="#f3c24b" stroke-width="2"/>
    <!-- Lanterns hanging -->
    <use href="#lantern" x="-130" y="-92"/>
    <use href="#lantern" x="-70" y="-94"/>
    <use href="#lantern" x="70" y="-94"/>
    <use href="#lantern" x="130" y="-92"/>
    <!-- Decorative beam under balcony -->
    <rect x="-200" y="-96" width="400" height="8" fill="url(#gold)" stroke="#6b4b17" stroke-width="1"/>
    <!-- Balcony / white railing -->
    <rect x="-210" y="-104" width="420" height="10" fill="#f5efe0" stroke="#8a7043" stroke-width="1"/>
    <g fill="#b34137" stroke="#4a0f0b" stroke-width="0.8">
      <g id="railpost">
        <rect x="-2.5" y="-104" width="5" height="14" rx="1"/>
        <circle cx="0" cy="-108" r="2" fill="#f3c24b"/>
      </g>
      <use href="#railpost" x="-190"/>
      <use href="#railpost" x="-150"/>
      <use href="#railpost" x="-110"/>
      <use href="#railpost" x="-70"/>
      <use href="#railpost" x="-30"/>
      <use href="#railpost" x="30"/>
      <use href="#railpost" x="70"/>
      <use href="#railpost" x="110"/>
      <use href="#railpost" x="150"/>
      <use href="#railpost" x="190"/>
    </g>
    <rect x="-210" y="-104" width="420" height="3" fill="#f3c24b"/>

    <!-- ===== ROOF tier 1 ===== -->
    <g transform="translate(0 -112)">
      <path d="M-250 0 Q -230 20 -180 22 L 180 22 Q 230 20 250 0 Q 260 -12 230 -22 L -230 -22 Q -260 -12 -250 0 Z"
            fill="url(#roofUnder)" stroke="#2a0b09" stroke-width="1"/>
      <!-- Tile top surface -->
      <path d="M-250 -4 Q -240 -14 0 -18 Q 240 -14 250 -4 L 250 0 Q 220 14 0 18 Q -220 14 -250 0 Z"
            fill="url(#roofTiles)" stroke="#2a0b09" stroke-width="1.2"/>
      <!-- Upturned eave tips (curled) -->
      <path d="M-250 -4 Q -280 -20 -290 -40 Q -285 -30 -250 -14" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round"/>
      <path d="M250 -4 Q 280 -20 290 -40 Q 285 -30 250 -14" fill="none" stroke="#e2b04a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-290" cy="-40" r="4" fill="#f3c24b" stroke="#6b4b17"/>
      <circle cx="290"  cy="-40" r="4" fill="#f3c24b" stroke="#6b4b17"/>
      <!-- Gold ridge ornament -->
      <rect x="-12" y="-22" width="24" height="8" rx="2" fill="url(#gold)" stroke="#6b4b17"/>
      <circle cx="0" cy="-22" r="5" fill="#f3c24b"/>
      <!-- hanging wind bells -->
      <use href="#windBell" x="-240" y="14"/>
      <use href="#windBell" x="-120" y="18"/>
      <use href="#windBell" x="0"    y="20"/>
      <use href="#windBell" x="120" y="18"/>
      <use href="#windBell" x="240" y="14"/>
    </g>
  </g>
