<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#eaf4ff"/>
<stop offset="100%" stop-color="#f7f9fc"/>
</linearGradient>
<linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#e53935"/>
<stop offset="100%" stop-color="#8b1a1a"/>
</linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffd86b"/>
<stop offset="100%" stop-color="#b8860b"/>
</linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#8b5a2b"/>
<stop offset="100%" stop-color="#5c3a21"/>
</linearGradient>
<linearGradient id="dragon" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#d4a017"/>
<stop offset="100%" stop-color="#8c4a0f"/>
</linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
<feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.12"/>
</filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect width="1200" height="1600" fill="url(#sky)"/>

<!-- Mist & clouds -->
<g opacity="0.6" fill="#ffffff">
<ellipse cx="300" cy="220" rx="140" ry="50"/>
<ellipse cx="500" cy="180" rx="110" ry="42"/>
<ellipse cx="850" cy="260" rx="160" ry="58"/>
<ellipse cx="1000" cy="200" rx="90" ry="36"/>
</g>
<g opacity="0.25" fill="#ffffff">
<ellipse cx="600" cy="350" rx="320" ry="80"/>
<ellipse cx="600" cy="420" rx="260" ry="60"/>
</g>

<!-- Pond -->
<ellipse cx="320" cy="1380" rx="180" ry="90" fill="#a8d0f0" opacity="0.7" filter="url(#soft)"/>
<ellipse cx="320" cy="1380" rx="120" ry="45" fill="#d9eaff" opacity="0.5"/>
<path d="M220 1380 Q320 1360 420 1380 T520 1380" fill="none" stroke="#cfe8ff" stroke-width="2" opacity="0.6"/>

<!-- Garden ground -->
<path d="M0 1200 Q300 1150 600 1220 T1200 1180 L1200 1600 L0 1600 Z" fill="#e8e6d8" stroke="#d8d4c4"/>

<!-- Rocks -->
<g fill="#c9c2b0" stroke="#b8b0a0" stroke-width="1">
<ellipse cx="180" cy="1320" rx="50" ry="22"/>
<ellipse cx="240" cy="1350" rx="70" ry="30"/>
<ellipse cx="900" cy="1340" rx="60" ry="28"/>
<ellipse cx="1020" cy="1300" rx="45" ry="20"/>
</g>

<!-- Bamboo -->
<g stroke="#3a7d44" stroke-width="6" stroke-linecap="round" fill="none">
<line x1="150" y1="1450" x2="150" y2="1180"/>
<line x1="190" y1="1470" x2="190" y2="1200"/>
<line x1="220" y1="1490" x2="220" y2="1220"/>
</g>
<g fill="#4a9c5a">
<ellipse cx="130" cy="1240" rx="40" ry="12" transform="rotate(-20 130 1240)"/>
<ellipse cx="170" cy="1260" rx="40" ry="12" transform="rotate(20 170 1260)"/>
<ellipse cx="200" cy="1280" rx="40" ry="12" transform="rotate(-15 200 1280)"/>
</g>

<!-- Pine trees -->
<g fill="#2e5d34" stroke="#1f3f24" stroke-width="1">
<polygon points="950,1350 920,1200 980,1200"/>
<polygon points="950,1320 920,1180 980,1180"/>
<polygon points="950,1290 920,1160 980,1160"/>
<polygon points="800,1380 770,1230 830,1230"/>
<polygon points="800,1350 770,1210 830,1210"/>
</g>

<!-- Flowers -->
<g fill="#e53935">
<circle cx="380" cy="1440" r="8"/><circle cx="380" cy="1440" r="4" fill="#fff"/>
<circle cx="420" cy="1420" r="7"/><circle cx="500" cy="1410" r="9"/>
</g>
<g fill="#f9a825">
<circle cx="1050" cy="1450" r="7"/><circle cx="1080" cy="1460" r="6"/>
</g>

<!-- Decorative path -->
<path d="M150 1350 Q350 1320 550 1380 T950 1360" fill="none" stroke="#d4cbb5" stroke-width="28" stroke-linecap="round" opacity="0.8"/>
<path d="M150 1350 Q350 1320 550 1380 T950 1360" fill="none" stroke="#e9e0c9" stroke-width="6"/>

<!-- Pagoda platform -->
<polygon points="420,1300 780,1300 820,1330 380,1330" fill="#d8cbb8" stroke="#bfae9a" stroke-width="2" filter="url(#soft)"/>
<rect x="500" y="1260" width="200" height="40" fill="url(#gold)" opacity="0.9"/>

<!-- Pagoda body and roofs -->
<g id="pagoda">
<!-- walls -->
<rect x="540" y="780" width="120" height="480" fill="#f0e6d2" stroke="#c9b89a" stroke-width="2"/>
<g fill="none" stroke="#8b5a2b" stroke-width="8">
<line x1="540" y1="900" x2="660" y2="900"/>
<line x1="540" y1="1020" x2="660" y2="1020"/>
<line x1="540" y1="1140" x2="660" y2="1140"/>
</g>
<!-- windows -->
<g fill="#e8dcc8" stroke="#a68a6a" stroke-width="1">
<rect x="560" y="860" width="30" height="30"/>
<rect x="610" y="860" width="30" height="30"/>
<rect x="560" y="980" width="30" height="30"/>
<rect x="610" y="980" width="30" height="30"/>
<rect x="560" y="1100" width="30" height="30"/>
<rect x="610" y="1100" width="30" height="30"/>
</g>

<!-- 8 tiered roofs -->
<g fill="url(#roof)" stroke="#5a0f0f" stroke-width="2" filter="url(#soft)">
<ellipse cx="600" cy="580" rx="90" ry="45"/>
<ellipse cx="600" cy="640" rx="115" ry="50"/>
<ellipse cx="600" cy="700" rx="140" ry="55"/>
<ellipse cx="600" cy="760" rx="165" ry="60"/>
<ellipse cx="600" cy="820" rx="190" ry="65"/>
<ellipse cx="600" cy="880" rx="215" ry="70"/>
<ellipse cx="600" cy="940" rx="240" ry="75"/>
<ellipse cx="600" cy="1000" rx="265" ry="80"/>
</g>
<!-- roof eaves -->
<g fill="none" stroke="#8b1a1a" stroke-width="3">
<path d="M510 580 Q600 540 690 580"/>
<path d="M485 640 Q600 590 715 640"/>
<path d="M460 700 Q600 640 740 700"/>
<path d="M435 760 Q600 690 765 760"/>
<path d="M410 820 Q600 740 790 820"/>
<path d="M385 880 Q600 790 815 880"/>
<path d="M360 940 Q600 840 840 940"/>
<path d="M335 1000 Q600 890 865 1000"/>
</g>
<!-- roof tiles ridge ornaments -->
<g fill="url(#gold)">
<rect x="585" y="500" width="30" height="80" rx="4"/>
<rect x="570" y="560" width="60" height="20" rx="4"/>
<rect x="565" y="620" width="70" height="20" rx="4"/>
</g>
<!-- beams -->
<g stroke="url(#wood)" stroke-width="6" stroke-linecap="round">
<line x1="520" y1="640" x2="680" y2="640"/>
<line x1="500" y1="700" x2="700" y2="700"/>
<line x1="480" y1="760" x2="720" y2="760"/>
</g>
<!-- lanterns -->
<g fill="#b71c1c" stroke="#5a0f0f" stroke-width="2">
<circle cx="480" cy="700" r="14"/>
<circle cx="720" cy="700" r="14"/>
<circle cx="460" cy="760" r="12"/>
<circle cx="740" cy="760" r="12"/>
</g>
</g>

<!-- Dragon coiling around pagoda -->
<g id="dragon" filter="url(#glow)">
<path d="M250 1280 C350 1150 420 1080 500 1000 S560 850 600 720 S750 640 900 680" fill="none" stroke="url(#dragon)" stroke-width="52" stroke-linecap="round"/>
<path d="M250 1280 C350 1150 420 1080 500 1000 S560 850 600 720 S750 640 900 680" fill="none" stroke="#ffd86b" stroke-width="6" opacity="0.6"/>
<!-- scales -->
<g fill="#c97a1a" opacity="0.8">
<circle cx="320" cy="1220" r="8"/><circle cx="400" cy="1120" r="8"/><circle cx="480" cy="1030" r="8"/><circle cx="560" cy="900" r="8"/><circle cx="640" cy="780" r="8"/><circle cx="760" cy="690" r="8"/><circle cx="860" cy="670" r="8"/>
</g>
<!-- head -->
<g transform="translate(900,680)">
<ellipse cx="0" cy="0" rx="55" ry="45" fill="url(#dragon)" stroke="#5a2a00" stroke-width="3"/>
<path d="M-30 -10 C-50 -40 -20 -70 0 -60" fill="none" stroke="#ffd86b" stroke-width="6"/>
<path d="M30 -10 C50 -40 20 -70 0 -60" fill="none" stroke="#ffd86b" stroke-width="6"/>
<circle cx="-12" cy="5" r="7" fill="#1a0a00"/>
<circle cx="12" cy="5" r="7" fill="#1a0a00"/>
<ellipse cx="0" cy="-25" rx="12" ry="6" fill="#ffd86b"/>
<path d="M0 35 C-20 55 -40 70 -45 55" fill="none" stroke="#c97a1a" stroke-width="4"/>
<path d="M0 35 C20 55 40 70 45 55" fill="none" stroke="#c97a1a" stroke-width="4"/>
</g>
<!-- whiskers -->
<g stroke="#ffd86b" stroke-width="3" stroke-linecap="round">
<line x1="900" y1="680" x2="940" y2="660"/>
<line x1="900" y1="700" x2="945" y2="700"/>
<line x1="900" y1="720" x2="940" y2="740"/>
</g>
<!-- claws -->
<g fill="#c97a1a" stroke="#5a2a00" stroke-width="2">
<polygon points="680,750 660,790 700,790"/>
<polygon points="700,820 680,860 720,860"/>
</g>
<!-- mane -->
<g fill="none" stroke="#ffd86b" stroke-width="4" opacity="0.7">
<path d="M900 680 C880 630 860 600 820 620"/>
<path d="M900 680 C920 620 940 580 980 600"/>
</g>
</g>

<!-- Additional ornaments -->
<g fill="url(#gold)" opacity="0.9">
<circle cx="600" cy="530" r="10"/>
<circle cx="600" cy="610" r="10"/>
</g>

</svg>