<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

<div class="container">

  <defs>
    <!-- Background gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87ceeb"/>

      <stop offset="0%" stop-color="#d4b996"/>
      <stop offset="50%" stop-color="#c1a375"/>
      <stop offset="100%" stop-color="#a88a55"/>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="50%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#a93226"/>

      <stop offset="50%" stop-color="#ffc107"/>
      <stop offset="100%" stop-color="#d4af37"/>

      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#d4af37"/>

      <stop offset="70%" stop-color="#229954"/>

      <stop offset="100%" stop-color="#166a3c"/>

      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a88a3a"/>

      <stop offset="50%" stop-color="#228b22"/>
      <stop offset="100%" stop-color="#006400"/>

    <path d="M460,200 C480,220 500,240 520,260 C540,280 560,300 580,320 C600,340 620,360 640,380"
