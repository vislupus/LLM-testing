<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c9dbe9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7fcfd;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="woodGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2c1a12;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a2c20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c1a12;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pillarGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#600000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#600000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d2b2b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffec8b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#daa520;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#006400;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#228b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffaa;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffaa00;stop-opacity:0" />
    </radialGradient>

    <!-- Patterns -->
    <pattern id="tilePattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="18" height="8" fill="#163434" stroke="#0f2424" stroke-width="1"/>
    </pattern>
    
    <pattern id="scalePattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
       <circle cx="5" cy="5" r="4" fill="none" stroke="#2e8b57" stroke-width="1" opacity="0.6"/>
    </pattern>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#skyGradient)" />
  
  <!-- Distant Mountains -->
  <path d="M0,800 Q200,600 400,750 T800,700 V1000 H0 Z" fill="#dcdcdc" opacity="0.5" />
  <path d="M-50,1000 Q150,700 400,800 T850,1000 Z" fill="#e0e0e0" opacity="0.7" />

  <!-- Clouds/Mist -->
  <g fill="#fff" opacity="0.4">
    <ellipse cx="100" cy="150" rx="80" ry="30" />
    <ellipse cx="250" cy="100" rx="100" ry="40" />
    <ellipse cx="600" cy="200" rx="120" ry="50" />
    <ellipse cx="700" cy="50" rx="80" ry="30" />
  </g>

  <!-- Ground & Pond -->
  <rect x="0" y="850" width="800" height="150" fill="#4a5d23" /> <!-- Grass -->
  <path d="M50,900 Q200,850 350,920 T650,900 L800,950 V1000 H0 Z" fill="#5f9ea0" /> <!-- Pond -->
  <path d="M50,900 Q200,850 350,920 T650,900" fill="none" stroke="#fff" stroke-width="2" opacity="0.3" />

  <!-- Rocks -->
  <g fill="#696969" stroke="#404040" stroke-width="2">
    <path d="M80,900 L100,850 L140,880 L160,910 Z" />
    <path d="M600,920 L630,860 L680,890 L700,930 Z" />
    <path d="M300,950 L320,920 L360,950 Z" />
  </g>

  <!-- Bamboo (Background) -->
  <g stroke="#2e8b57" stroke-width="4" fill="none">
    <line x1="60" y1="900" x2="60" y2="600" />
    <line x1="80" y1="900" x2="80" y2="650" />
    <line x1="720" y1="900" x2="720" y2="620" />
  </g>
  <g fill="#3cb371">
     <path d="M60,600 Q50,580 40,600 Q50,620 60,600" />
     <path d="M60,630 Q70,610 80,630 Q70,650 60,630" />
     <path d="M720,620 Q710,600 700,620 Q710,640 720,620" />
     <path d="M720,650 Q730,630 740,650 Q730,670 720,650" />
  </g>

  <!-- Pine Trees -->
  <g transform="translate(650, 800)">
    <path d="M0,0 L-20,50 L20,50 Z" fill="#0f3d0f" />
    <path d="M0,-20 L-25,30 L25,30 Z" fill="#145214" />
    <path d="M0,-40 L-30,10 L30,10 Z" fill="#1a6b1a" />
    <rect x="-2" y="50" width="4" height="30" fill="#3e2723" />
  </g>
   <g transform="translate(150, 820) scale(0.8)">
    <path d="M0,0 L-20,50 L20,50 Z" fill="#0f3d0f" />
    <path d="M0,-20 L-25,30 L25,30 Z" fill="#145214" />
    <path d="M0,-40 L-30,10 L30,10 Z" fill="#1a6b1a" />
    <rect x="-2" y="50" width="4" height="30" fill="#3e2723" />
  </g>

  <!-- PAGODA CONSTRUCTION -->
  <g transform="translate(400, 850)"> <!-- Center Base -->
    
    <!-- Base Platform -->
    <path d="M-180,0 L180,0 L160,-30 L-160,-30 Z" fill="#9e9e9e" stroke="#555" />
    <rect x="-160" y="-50" width="320" height="20" fill="#757575" />

    <!-- Helper for Levels -->
    <defs>
        <g id="pagodaLevel">
            <!-- Floor -->
            <rect x="-width/2" y="0" width="width" height="height" fill="url(#pillarGradient)" />
            <!-- Pillars -->
            <line x1="-width/2 + 10" y1="0" x2="-width/2 + 10" y2="height" stroke="#300" />
            <line x1="width/2 - 10" y1="0" x2="width/2 - 10" y2="height" stroke="#300" />
            <!-- Windows/Doors -->
            <rect x="-20" y="10" width="40" height="30" fill="#222" stroke="gold" stroke-width="1"/>
            <!-- Beams -->
            <rect x="-width/2" y="height-5" width="width" height="5" fill="url(#woodGradient)" />
        </g>
        
        <g id="pagodaRoof">
            <!-- Roof Structure -->
            <path d="M- roofW / 2,0 Q- roofW / 2 - 20,-20 - roofW / 2, -30 L0, -80 L roofW / 2, -30 Q roofW / 2 - 20, -20 roofW / 2, 0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
            <!-- Tile Details -->
            <path d="M- roofW / 2 + 10, -5 L roofW / 2 - 10, -5" stroke="#goldGradient" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>
            <!-- Eave Details -->
            <path d="M- roofW / 2, -30 Q - roofW / 2 - 25, -30 - roofW / 2 - 20, -20" fill="none" stroke="gold" stroke-width="3" />
            <path d="M roofW / 2, -30 Q roofW / 2 + 25, -30 roofW / 2 + 20, -20" fill="none" stroke="gold" stroke-width="3" />
        </g>
    </defs>

    <!-- Level 1 -->
    <g transform="translate(0, -30)">
      <use href="#pagodaLevel" width="280" height="60" x="-140" />
      <rect x="-140" y="-5" width="280" height="5" fill="#333" /> <!-- Base trim -->
      <g>
        <script>
            var roofW = 340; var roofH = 60;
        </script>
      </g>
      <!-- Roof 1 -->
      <path d="M-170,-5 Q-190,-35 -150,-60 L0,-100 L150,-60 Q190,-35 170,-5 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
      <path d="M-170,-5 Q-190,-35 -150,-60 L0,-100 L150,-60 Q190,-35 170,-5" fill="none" stroke="gold" stroke-width="4" />
      <!-- Eave tips -->
      <path d="M-170,-5 Q-190,-10 -200,-25" fill="none" stroke="#goldGradient" stroke-width="3"/>
      <path d="M170,-5 Q190,-10 200,-25" fill="none" stroke="#goldGradient" stroke-width="3"/>
    </g>

    <!-- Level 2 -->
    <g transform="translate(0, -130)">
      <use href="#pagodaLevel" width="240" height="60" x="-120" />
      <path d="M-140,0 Q-160,-30 -120,-50 L0,-90 L120,-50 Q160,-30 140,0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
      <path d="M-140,0 Q-160,-30 -120,-50 L0,-90 L120,-50 Q160,-30 140,0" fill="none" stroke="gold" stroke-width="4" />
      <path d="M-140,0 Q-160,5 -170,-10" fill="none" stroke="gold" stroke-width="3"/>
      <path d="M140,0 Q160,5 170,-10" fill="none" stroke="gold" stroke-width="3"/>
    </g>

    <!-- Level 3 -->
    <g transform="translate(0, -230)">
      <use href="#pagodaLevel" width="200" height="60" x="-100" />
      <path d="M-110,0 Q-130,-25 -100,-45 L0,-80 L100,-45 Q130,-25 110,0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
      <path d="M-110,0 Q-130,-25 -100,-45 L0,-80 L100,-45 Q130,-25 110,0" fill="none" stroke="gold" stroke-width="4" />
    </g>

    <!-- Level 4 -->
    <g transform="translate(0, -330)">
      <use href="#pagodaLevel" width="160" height="60" x="-80" />
      <path d="M-80,0 Q-100,-20 -80,-40 L0,-70 L80,-40 Q100,-20 80,0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
    </g>

    <!-- Level 5 -->
    <g transform="translate(0, -430)">
      <use href="#pagodaLevel" width="120" height="60" x="-60" />
      <path d="M-60,0 Q-75,-15 -55,-30 L0,-60 L55,-30 Q75,-15 60,0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
    </g>

    <!-- Level 6 -->
    <g transform="translate(0, -530)">
      <use href="#pagodaLevel" width="80" height="60" x="-40" />
      <path d="M-40,0 Q-50,-10 -35,-20 L0,-45 L35,-20 Q50,-10 40,0 Z" fill="url(#roofGradient)" stroke="url(#goldGradient)" stroke-width="3" />
    </g>

    <!-- Level 7 (Top) -->
    <g transform="translate(0, -630)">
      <use href="#pagodaLevel" width="50" height="60" x="-25" />
      <!-- Spire -->
      <rect x="-3" y="-50" width="6" height="50" fill="url(#goldGradient)" />
      <circle cx="0" cy="-50" r="5" fill="red" />
      <path d="M-25,0 Q-30,-5 -25,-15 L0,-40 L25,-15 Q30,-5 25,0 Z" fill="url(#roofGradient)" stroke="gold" stroke-width="2" />
    </g>
    
    <!-- Lanterns -->
    <g transform="translate(-150, -30)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#333" />
        <rect x="-5" y="20" width="10" height="15" fill="#b22222" />
        <circle cx="0" cy="40" r="8" fill="url(#lanternGlow)" />
    </g>
    <g transform="translate(150, -30)">
        <line x1="0" y1="0" x2="0" y2="20" stroke="#333" />
        <rect x="-5" y="20" width="10" height="15" fill="#b22222" />
        <circle cx="0" cy="40" r="8" fill="url(#lanternGlow)" />
    </g>

  </g> <!-- End Pagoda Group -->

  <!-- DRAGON -->
  <!-- The dragon coils around the tower. We simulate depth by drawing segments. -->
  <g filter="url(#dropShadow)">
      <!-- Tail (Bottom Right) -->
      <path d="M600,950 Q650,900 600,850 T500,800" 
            fill="none" stroke="url(#dragonBody)" stroke-width="35" stroke-linecap="round" />
      
      <!-- Scales Overlay Tail -->
      <path d="M600,950 Q650,900 600,850 T500,800" 
            fill="none" stroke="url(#scalePattern)" stroke-width="35" opacity="0.5" />

      <!-- Body Winding Up Behind (simulated by drawing a segment then the tower, but here we are layering on top. 
           To make it look like it wraps, we'll draw the "front" part of the loop here.) -->
      
      <!-- Loop around Middle -->
      <path d="M500,800 Q350,750 350,650" 
            fill="none" stroke="url(#dragonBody)" stroke-width="40" stroke-linecap="round" />
       <path d="M500,800 Q350,750 350,650" 
            fill="none" stroke="url(#scalePattern)" stroke-width="40" opacity="0.5" />

      <!-- Front Body Segment (Crossing over the front of the tower) -->
      <path d="M350,650 Q450,600 400,500 T450,350" 
            fill="none" stroke="url(#dragonBody)" stroke-width="45" stroke-linecap="round" />
      <!-- Scales -->
      <path d="M350,650 Q450,600 400,500 T450,350" 
            fill="none" stroke="url(#scalePattern)" stroke-width="45" opacity="0.5" />
      
      <!-- Claws gripping the building -->
      <g stroke="gold" stroke-width="3" fill="none">
         <path d="M380,620 L370,640 M400,620 L400,645 M420,620 L430,640" />
         <path d="M420,520 L440,530 M400,520 L400,535 M380,520 L360,530" />
      </g>

      <!-- Head and Neck (Top Left) -->
      <path d="M450,350 Q500,250 400,200 T300,250" 
            fill="none" stroke="url(#dragonBody)" stroke-width="50" stroke-linecap="round" />
       <path d="M450,350 Q500,250 400,200 T300,250" 
            fill="none" stroke="url(#scalePattern)" stroke-width="50" opacity="0.5" />

      <!-- Dragon Head -->
      <g transform="translate(280, 240) rotate(-20)">
          <!-- Mane -->
          <path d="M-20,-20 Q0,-40 30,-30" stroke="#ffd700" stroke-width="4" fill="none"/>
          <path d="M-20,0 Q0,-20 30,-10" stroke="#ffd700" stroke-width="4" fill="none"/>
          <path d="M-20,20 Q0,0 30,10" stroke="#ffd700" stroke-width="4" fill="none"/>
          
          <!-- Head Shape -->
          <path d="M0,0 C-20,-30 50,-40 60,-10 C70,20 40,40 0,30 C-20,20 -10,10 0,0" fill="#2e8b57" stroke="gold" stroke-width="2"/>
          
          <!-- Snout -->
          <path d="M60,-10 Q80,-5 85,10 Q70,30 50,20" fill="#3cb371" />
          <!-- Nostril -->
          <circle cx="75" cy="5" r="2" fill="black" />
          
          <!-- Eye -->
          <path d="M30,-10 Q40,-25 50,-10" fill="none" stroke="gold" stroke-width="2" />
          <circle cx="40" cy="-10" r="5" fill="#ffcc00" />
          <circle cx="42" cy="-10" r="2" fill="black" />
          
          <!-- Horn -->
          <path d="M30,-20 Q20,-50 0,-40" fill="none" stroke="#gold" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Whiskers -->
          <path d="M50,20 Q70,40 90,35" fill="none" stroke="red" stroke-width="2" />
          <path d="M45,25 Q65,45 85,50" fill="none" stroke="red" stroke-width="2" />
          
          <!-- Teeth -->
          <path d="M50,20 L55,28 L60,20" fill="white" />
      </g>
  </g>

  <!-- Foreground Mist -->
  <rect x="0" y="850" width="800" height="150" fill="url(#skyGradient)" opacity="0.2" pointer-events="none"/>
  
  <!-- Decorative Pathway -->
  <g fill="#d2b48c">
     <circle cx="200" cy="950" r="15" />
     <circle cx="240" cy="970" r="15" />
     <circle cx="180" cy="980" r="15" />
     <circle cx="280" cy="960" r="15" />
  </g>

</svg>