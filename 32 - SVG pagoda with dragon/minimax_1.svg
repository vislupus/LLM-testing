<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <title>Chinese Pagoda and Dragon in Garden</title>
  <desc>A detailed vector illustration of a 7-story pagoda surrounded by a Chinese dragon and garden.</desc>

  <!-- DEFINITIONS: Gradients, Patterns, and Reusable Symbols -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF3E0;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B71C1C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D32F2F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFCA28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6F00;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#004D40;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00695C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004D40;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#80DEEA;stop-opacity:0.9" />
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#FFF;stop-opacity:0" />
    </radialGradient>

    <!-- Patterns -->
    <pattern id="roofTiles" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 Q5,0 10,10 T20,10" fill="none" stroke="#8B0000" stroke-width="1" opacity="0.3"/>
    </pattern>
    
    <pattern id="lattice" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,0 L0,10 M0,5 L10,5 M10,0 L10,10" stroke="#5D4037" stroke-width="1"/>
    </pattern>

    <!-- Symbol: Single Pagoda Floor -->
    <symbol id="pagodaFloor" viewBox="-60 -10 120 100">
      <!-- Eaves -->
      <path d="M-65,10 Q-75,-5 0,-15 Q75,-5 65,10 L60,15 L-60,15 Z" fill="url(#roofGrad)" stroke="#8B0000" stroke-width="1"/>
      <path d="M-60,12 Q-65,5 0,0 Q65,5 60,12" fill="url(#goldGrad)" /> <!-- Ridge -->
      
      <!-- Balcony Railing -->
      <rect x="-50" y="15" width="100" height="10" fill="#3E2723" />
      <path d="M-50,15 L-50,25 M-30,15 L-30,25 M-10,15 L-10,25 M10,15 L10,25 M30,15 L30,25 M50,15 L50,25" stroke="#FFCA28" stroke-width="2"/>
      
      <!-- Walls -->
      <rect x="-45" y="25" width="90" height="50" fill="#8D6E63" />
      
      <!-- Door/Window -->
      <rect x="-20" y="35" width="40" height="40" fill="#3E2723" />
      <rect x="-20" y="35" width="40" height="40" fill="url(#lattice)" />
      <rect x="-20" y="35" width="40" height="5" fill="#FFCA28" /> <!-- Lintel -->
      
      <!-- Pillars -->
      <rect x="-50" y="25" width="5" height="50" fill="#B71C1C" />
      <rect x="45" y="25" width="5" height="50" fill="#B71C1C" />
    </symbol>

    <!-- Symbol: Lantern -->
    <symbol id="lantern" viewBox="0 0 20 30">
      <line x1="10" y1="0" x2="10" y2="5" stroke="#3E2723" stroke-width="2"/>
      <ellipse cx="10" cy="20" rx="10" ry="12" fill="#D32F2F" stroke="#8B0000"/>
      <ellipse cx="10" cy="20" rx="8" ry="10" fill="#FFECB3" opacity="0.6"/>
      <path d="M5,28 L15,28 L10,35 Z" fill="#FF6F00" /> <!-- Tassel -->
    </symbol>
  </defs>

  <!-- LAYER 1: Sky and Background -->
  <rect width="800" height="1000" fill="url(#skyGrad)" />
  
  <!-- Moon/Sun -->
  <circle cx="650" cy="150" r="60" fill="#FFF" opacity="0.8" />
  <circle cx="650" cy="150" r="60" fill="url(#moonGlow)" />

  <!-- Misty Mountains -->
  <path d="M0,800 Q150,600 300,750 T600,700 T800,800 V1000 H0 Z" fill="#90A4AE" opacity="0.5" />
  <path d="M0,850 Q200,750 400,850 T800,900 V1000 H0 Z" fill="#78909C" opacity="0.6" />

  <!-- LAYER 2: The Garden Environment -->
  
  <!-- Pond -->
  <ellipse cx="400" cy="920" rx="350" ry="60" fill="url(#waterGrad)" stroke="#4DD0E1" stroke-width="2"/>
  <!-- Reflection of Pagoda in water -->
  <g transform="translate(400, 920) scale(1, -0.3) translate(-400, -920)" opacity="0.3">
     <use href="#pagodaFloor" x="400" y="200" width="120" height="100" />
  </g>

  <!-- Pathways -->
  <path d="M200,1000 Q400,950 600,1000" fill="none" stroke="#D7CCC8" stroke-width="40" stroke-dasharray="10,5"/>

  <!-- Rocks -->
  <g fill="#5D4037" stroke="#3E2723" stroke-width="2">
    <path d="M100,900 Q120,850 150,900 T200,920 Z" />
    <path d="M650,880 Q680,820 720,880 T780,920 Z" />
    <path d="M50,950 Q70,920 100,950 T150,970 Z" />
  </g>

  <!-- LAYER 3: The Pagoda -->
  <g transform="translate(400, 250)"> <!-- Centered horizontally, pushed down -->
    <!-- Foundation/Steps -->
    <rect x="-80" y="600" width="160" height="30" fill="#5D4037" stroke="#3E2723"/>
    <rect x="-90" y="570" width="180" height="30" fill="#4E342E" />
    <rect x="-100" y="540" width="200" height="30" fill="#3E2723" />
    
    <!-- 7 Floors (Stacking up) -->
    <!-- Using scale and translate to create perspective -->
    
    <!-- Floor 1 (Base) -->
    <use href="#pagodaFloor" x="-70" y="480" width="140" height="100" />
    <!-- Lanterns L1 -->
    <use href="#lantern" x="-75" y="490" width="10" height="15" transform="scale(1.5)"/>
    <use href="#lantern" x="65" y="490" width="10" height="15" transform="scale(1.5)"/>

    <!-- Floor 2 -->
    <use href="#pagodaFloor" x="-60" y="395" width="120" height="85" />
    
    <!-- Floor 3 -->
    <use href="#pagodaFloor" x="-50" y="315" width="100" height="70" />

    <!-- Floor 4 -->
    <use href="#pagodaFloor" x="-42" y="245" width="84" height="60" />

    <!-- Floor 5 -->
    <use href="#pagodaFloor" x="-34" y="185" width="68" height="50" />

    <!-- Floor 6 -->
    <use href="#pagodaFloor" x="-26" y="135" width="52" height="40" />

    <!-- Floor 7 (Top) -->
    <use href="#pagodaFloor" x="-18" y="95" width="36" height="30" />

    <!-- Spire -->
    <rect x="-5" y="50" width="10" height="45" fill="#FFCA28" />
    <circle cx="0" cy="50" r="8" fill="#FF6F00" />
    <path d="M-10,50 L0,30 L10,50 Z" fill="#D32F2F" />
  </g>

  <!-- LAYER 4: The Dragon -->
  <!-- The dragon winds around the front, obscuring parts of the pagoda -->
  <g id="dragon">
    <!-- Tail -->
    <path d="M150,950 Q200,900 250,920 T350,850" fill="none" stroke="url(#dragonBody)" stroke-width="25" stroke-linecap="round"/>
    <!-- Scales texture on tail (simplified) -->
    <path d="M150,950 Q200,900 250,920 T350,850" fill="none" stroke="#004D40" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>

    <!-- Lower Coil (In front of Pagoda) -->
    <path d="M350,850 Q400,800 450,850 Q500,900 450,950" fill="none" stroke="url(#dragonBody)" stroke-width="30" />
    <path d="M350,850 Q400,800 450,850 Q500,900 450,950" fill="none" stroke="#E0F2F1" stroke-width="2" stroke-dasharray="10,20" opacity="0.3"/> <!-- Highlight -->

    <!-- Upper Body (Winding) -->
    <path d="M450,950 Q550,900 500,800 Q450,700 380,720" fill="none" stroke="url(#dragonBody)" stroke-width="35" />
    
    <!-- Front Crossing (The Wrap) -->
    <path d="M380,720 Q300,750 250,700 Q200,650 250,550" fill="none" stroke="url(#dragonBody)" stroke-width="30" />

    <!-- Head and Neck -->
    <g transform="translate(250, 520)">
      <!-- Neck -->
      <path d="M0,30 Q20,50 0,70" fill="none" stroke="url(#dragonBody)" stroke-width="35" />
      
      <!-- Head Shape -->
      <path d="M0,0 C-20,-20 -40,-10 -50,10 C-60,30 -40,50 -20,60 C0,70 20,50 30,30 C40,10 20,-10 0,0 Z" fill="#00695C" stroke="#004D40" stroke-width="2"/>
      
      <!-- Snout -->
      <path d="M-40,30 Q-60,30 -70,35 Q-60,40 -40,40" fill="#004D40" />
      
      <!-- Eye -->
      <circle cx="-20" cy="20" r="5" fill="#FFEB3B" />
      <circle cx="-20" cy="20" r="2" fill="#000" />
      
      <!-- Horns -->
      <path d="M-10,0 Q-20,-20 0,-30" fill="none" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>
      <path d="M5,0 Q20,-20 10,-30" fill="none" stroke="#FFCA28" stroke-width="4" stroke-linecap="round"/>

      <!-- Whiskers -->
      <path d="M-50,35 C-70,30 -90,40 -100,20" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>
      <path d="M-50,40 C-70,50 -90,60 -110,50" fill="none" stroke="#FFF" stroke-width="2" opacity="0.8"/>

      <!-- Mane/Flowing Hair -->
      <path d="M10,-10 Q30,-30 20,-50" fill="none" stroke="#D32F2F" stroke-width="3"/>
      <path d="M15,0 Q40,-10 30,-30" fill="none" stroke="#D32F2F" stroke-width="3"/>
      <path d="M20,10 Q50,10 40,-10" fill="none" stroke="#D32F2F" stroke-width="3"/>
      
      <!-- Claws (Gripping the air/building) -->
      <path d="M10,60 L5,80 L15,80 Z" fill="#FFCA28" />
      <path d="M20,60 L25,80 L35,80 Z" fill="#FFCA28" />
    </g>
  </g>

  <!-- LAYER 5: Foreground Vegetation -->
  
  <!-- Bamboo (Left) -->
  <g transform="translate(0, 200)">
    <path d="M50,800 Q55,600 40,400" stroke="#2E7D32" stroke-width="8" fill="none"/>
    <path d="M60,700 Q70,680 65,660" stroke="#2E7D32" stroke-width="5" fill="none"/>
    <path d="M50,600 Q40,580 45,560" stroke="#2E7D32" stroke-width="5" fill="none"/>
    <!-- Leaves -->
    <path d="M40,400 Q20,380 30,360 Q50,380 40,400" fill="#43A047"/>
    <path d="M60,650 Q80,630 70,610 Q50,630 60,650" fill="#43A047"/>
    <path d="M50,550 Q30,530 40,510 Q60,530 50,550" fill="#43A047"/>
  </g>

  <!-- Bamboo (Right) -->
  <g transform="translate(700, 200)">
    <path d="M-50,800 Q-55,600 -40,400" stroke="#2E7D32" stroke-width="8" fill="none"/>
    <path d="M-60,700 Q-70,680 -65,660" stroke="#2E7D32" stroke-width="5" fill="none"/>
    <!-- Leaves -->
    <path d="M-40,400 Q-20,380 -30,360 Q-50,380 -40,400" fill="#43A047"/>
    <path d="M-60,650 Q-80,630 -70,610 Q-50,630 -60,650" fill="#43A047"/>
  </g>

  <!-- Pine Tree (Foreground Left) -->
  <g transform="translate(100, 800)">
    <path d="M0,0 L-10,50 L10,50 Z" fill="#3E2723"/> <!-- Trunk -->
    <!-- Branches -->
    <path d="M0,20 L-60,40 L-30,45 Z" fill="#1B5E20"/>
    <path d="M0,20 L60,40 L30,45 Z" fill="#1B5E20"/>
    <path d="M0,10 L-50,10 L-20,15 Z" fill="#2E7D32"/>
    <path d="M0,10 L50,10 L20,15 Z" fill="#2E7D32"/>
    <path d="M0,0 L-40,-20 L-10,-10 Z" fill="#4CAF50"/>
    <path d="M0,0 L40,-20 L10,-10 Z" fill="#4CAF50"/>
  </g>
  
  <!-- Mist Overlay -->
  <rect x="0" y="800" width="800" height="200" fill="url(#skyGrad)" opacity="0.3" style="mix-blend-mode: screen;" />
  
  <!-- Final Glow Effect for Lanterns/Moon -->
  <circle cx="325" cy="770" r="20" fill="#FF6F00" opacity="0.3" filter="blur(5px)" />
  <circle cx="475" cy="770" r="20" fill="#FF6F00" opacity="0.3" filter="blur(5px)" />

</svg>