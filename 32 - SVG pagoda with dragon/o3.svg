<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="1200" viewBox="0 0 800 1200"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- =========  DEFINITIONS  ========= -->
  <defs>
    <!-- Drop-shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Roof tile gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b51912"/>
      <stop offset="60%" stop-color="#7d0e08"/>
      <stop offset="100%" stop-color="#470503"/>
    </linearGradient>

    <!-- Gold details -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fceabb"/>
      <stop offset="50%" stop-color="#f8b500"/>
      <stop offset="100%" stop-color="#b37d00"/>
    </linearGradient>

    <!-- Wooden beams -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#7a3b04"/>
      <stop offset="100%" stop-color="#3e1e02"/>
    </linearGradient>

    <!-- Dragon scale gradient -->
    <linearGradient id="dragonGrad" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#ffdf8e"/>
      <stop offset="40%" stop-color="#d8331d"/>
      <stop offset="100%" stop-color="#82150e"/>
    </linearGradient>

    <!-- Water gradient -->
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a6d8f2"/>
      <stop offset="80%" stop-color="#3085c3"/>
      <stop offset="100%" stop-color="#1e4c78"/>
    </linearGradient>

    <!-- Simple cloud -->
    <symbol id="cloudSym" viewBox="0 0 120 60">
      <ellipse cx="30" cy="40" rx="30" ry="20" fill="white" opacity="0.7"/>
      <ellipse cx="60" cy="30" rx="35" ry="25" fill="white" opacity="0.7"/>
      <ellipse cx="95" cy="40" rx="25" ry="18" fill="white" opacity="0.7"/>
    </symbol>

    <!-- Simple pine tree -->
    <symbol id="pineSym" viewBox="0 0 60 120">
      <rect x="25" y="90" width="10" height="30" fill="#5b3818"/>
      <polygon points="30,0 0,60 60,60" fill="#0d522d"/>
      <polygon points="30,30 5,85 55,85" fill="#144a27"/>
    </symbol>

    <!-- Scale pattern for dragon -->
    <pattern id="scalePattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 Q2 0 4 4 T8 4 V8 H0 Z" fill="url(#dragonGrad)"/>
    </pattern>
  </defs>

  <!-- =========  BACKGROUND SKY & CLOUDS  ========= -->
  <rect width="800" height="1200" fill="#cce6ff"/>
  <!-- Far clouds -->
  <use xlink:href="#cloudSym" x="80" y="100" width="180" height="90"/>
  <use xlink:href="#cloudSym" x="500" y="130" width="220" height="110" opacity="0.85"/>
  <use xlink:href="#cloudSym" x="300" y="60" width="130" height="70" opacity="0.6"/>

  <!-- =========  GARDEN (ground, rocks, pond, plants)  ========= -->
  <!-- Distant mountains silhouette -->
  <path d="M0 650 L0 550 Q150 450 300 550 T800 500 L800 650 Z" fill="#aac4cf"/>

  <!-- Ground -->
  <rect y="650" width="800" height="550" fill="#8bc34a"/>

  <!-- Rocks -->
  <g id="rocks" fill="#5d6d70" filter="url(#shadow)">
    <ellipse cx="140" cy="740" rx="60" ry="25"/>
    <ellipse cx="180" cy="725" rx="40" ry="18"/>
    <ellipse cx="620" cy="780" rx="70" ry="30"/>
  </g>

  <!-- Pond -->
  <ellipse cx="400" cy="900" rx="160" ry="60" fill="url(#waterGrad)" stroke="#1a5d8f" stroke-width="3"/>

  <!-- Bamboo and pines -->
  <g id="plants">
    <!-- Bamboo stalks -->
    <g stroke="#2b7d3b" stroke-width="6" stroke-linecap="round">
      <line x1="100" y1="800" x2="100" y2="680"/>
      <line x1="120" y1="810" x2="120" y2="690"/>
      <line x1="680" y1="820" x2="680" y2="700"/>
    </g>
    <!-- Pine trees -->
    <use xlink:href="#pineSym" x="50"  y="760" width="120" height="240"/>
    <use xlink:href="#pineSym" x="640" y="780" width="120" height="240"/>
    <use xlink:href="#pineSym" x="700" y="720" width="90"  height="180"/>
  </g>

  <!-- Decorative winding pathway -->
  <path d="M400 650 Q380 720 420 780 T360 880 T440 980"
        fill="none" stroke="#d9c5a4" stroke-width="14" stroke-linecap="round"
        stroke-opacity="0.95"/>

  <!-- =========  PAGODA  ========= -->
  <g id="pagoda" transform="translate(400, 600) scale(1.15)">
    <!-- Foundation base -->
    <rect x="-110" y="0" width="220" height="30" fill="#9e7f5f" stroke="#5f4b36" stroke-width="2" filter="url(#shadow)"/>
    <!-- 7 floors -->
    <g id="floors">
      <!-- Generator for floors: we’ll manually draw decreasing roofs -->
      <!-- Floor 1 (bottom) -->
      <g id="floor1">
        <polygon points="-140 0 140 0 160 -20 -160 -20" fill="url(#roofGrad)" stroke="#280000" stroke-width="2"/>
        <rect x="-80" y="-120" width="160" height="100" fill="url(#woodGrad)" stroke="#3c2105" stroke-width="3"/>
        <!-- Balcony railing -->
        <rect x="-90" y="-20" width="180" height="10" fill="url(#goldGrad)"/>
        <!-- Lanterns -->
        <circle cx="-60" cy="-10" r="6" fill="#ffbf00"/>
        <circle cx="60"  cy="-10" r="6" fill="#ffbf00"/>
      </g>

      <!-- Reusable group for upper floors -->
      <g id="upperFloorTemplate">
        <polygon points="-120 0 120 0 140 -18 -140 -18" fill="url(#roofGrad)" stroke="#280000" stroke-width="2"/>
        <rect x="-70" y="-100" width="140" height="85" fill="url(#woodGrad)" stroke="#3c2105" stroke-width="3"/>
        <rect x="-80" y="-18" width="160" height="10" fill="url(#goldGrad)"/>
      </g>

      <!-- Clone template 6 times, stacking upward with scale -->
      <g transform="translate(0,-145) scale(0.92)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>
      <g transform="translate(0,-270) scale(0.84)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>
      <g transform="translate(0,-380) scale(0.76)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>
      <g transform="translate(0,-475) scale(0.68)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>
      <g transform="translate(0,-555) scale(0.60)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>
      <g transform="translate(0,-620) scale(0.52)">
        <use xlink:href="#upperFloorTemplate"/>
      </g>

      <!-- Spire -->
      <polygon points="0,-630 20,-660 -20,-660" fill="url(#goldGrad)" stroke="#7d5a00" stroke-width="2"/>
      <line x1="0" y1="-660" x2="0" y2="-720" stroke="url(#goldGrad)" stroke-width="4"/>
      <circle cx="0" cy="-735" r="15" fill="url(#goldGrad)" stroke="#7d5a00" stroke-width="2"/>
    </g>
  </g>

  <!-- =========  DRAGON  ========= -->
  <g id="dragon" filter="url(#shadow)" >
    <!-- Dragon body path (simplified sine-like coils) -->
    <path id="dragonBody"
          d="M150 850
             C 220 820, 260 740, 240 650
             C 220 560, 300 520, 370 560
             C 440 600, 500 540, 480 460
             C 460 380, 540 340, 610 380
             C 680 420, 700 330, 650 280
             "
          fill="none" stroke="url(#scalePattern)" stroke-width="35" stroke-linecap="round"/>

    <!-- Dragon belly (lighter line under main stroke) -->
    <path d="M150 850
             C 220 820, 260 740, 240 650
             C 220 560, 300 520, 370 560
             C 440 600, 500 540, 480 460
             C 460 380, 540 340, 610 380
             C 680 420, 700 330, 650 280"
          fill="none" stroke="#f8be7d" stroke-width="10" stroke-linecap="round"/>

    <!-- Dragon head -->
    <g id="dragonHead" transform="translate(640,270) rotate(-20)">
      <!-- Face -->
      <ellipse cx="0" cy="0" rx="40" ry="28" fill="url(#dragonGrad)" stroke="#431108" stroke-width="3"/>
      <!-- Horns -->
      <path d="M-18,-35 Q-25,-65 -5,-75" fill="none" stroke="#d1b64b" stroke-width="6" stroke-linecap="round"/>
      <path d="M18,-35  Q25,-65 5,-75"  fill="none" stroke="#d1b64b" stroke-width="6" stroke-linecap="round"/>
      <!-- Eyes -->
      <circle cx="-12" cy="-10" r="6" fill="white"/>
      <circle cx="12"  cy="-10" r="6" fill="white"/>
      <circle cx="-12" cy="-10" r="3" fill="#431108"/>
      <circle cx="12"  cy="-10" r="3" fill="#431108"/>
      <!-- Whiskers -->
      <path d="M-25,0  -70,-10" stroke="#f8be7d" stroke-width="4" stroke-linecap="round"/>
      <path d="M25,0   70,-10"  stroke="#f8be7d" stroke-width="4" stroke-linecap="round"/>
      <!-- Mouth -->
      <path d="M-15,12 Q0,22 15,12" stroke="#5a0808" stroke-width="4" fill="none"/>
      <!-- Mane -->
      <path d="M0,-28 Q-6,-45 -20,-52  M0,-30 Q6,-47 20,-54"
            fill="none" stroke="#ffdf8e" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Fore claw gripping pagoda -->
    <g id="claw" transform="translate(310,570) rotate(20)">
      <path d="M0 0 C5 20 -5 40 -15 60" stroke="#82150e" stroke-width="5" fill="none" stroke-linecap="round"/>
      <line x1="-5" y1="50" x2="-15" y2="70" stroke="#d1b64b" stroke-width="4" stroke-linecap="round"/>
      <line x1="5"  y1="45" x2="0"   y2="65" stroke="#d1b64b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- =========  FOREGROUND MIST (semi-transparent white) ========= -->
  <rect y="650" width="800" height="300" fill="white" opacity="0.12"/>
  <rect y="880" width="800" height="120" fill="white" opacity="0.08"/>

  <!-- =========  SIGNATURE (optional) ========= -->
  <text x="790" y="1190" font-size="14" fill="#3f3f3f" text-anchor="end"
        font-family="serif" opacity="0.6">Vector illustration © 2026</text>
</svg>