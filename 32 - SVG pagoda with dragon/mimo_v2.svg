<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roofGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8b0000" />
      <stop offset="100%" stop-color="#4a0000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="100%" stop-color="#b8860b" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background/Sky/Garden -->
  <rect width="1000" height="1200" fill="#fefdfa"/>
  <path d="M0,1000 Q500,900 1000,1000 L1000,1200 L0,1200 Z" fill="#e8efd8"/> <!-- Pond Area -->
  
  <!-- Bamboo/Pine Trees -->
  <g stroke="#2d5a27" stroke-width="2">
    <path d="M100,1200 L100,800 M120,1200 L120,850" /> <!-- Bamboo -->
    <path d="M900,1200 Q900,900 950,850 Q980,800 950,750" fill="none" stroke-width="10"/> <!-- Pine Trunk -->
  </g>

  <!-- The Pagoda (7 Floors) -->
  <g id="pagoda" transform="translate(500, 950)">
    <!-- Floors -->
    <g id="floors">
      <rect x="-100" y="-50" width="200" height="50" fill="#d2691e" />
      <rect x="-90" y="-100" width="180" height="50" fill="#d2691e" />
      <rect x="-80" y="-150" width="160" height="50" fill="#d2691e" />
      <rect x="-70" y="-200" width="140" height="50" fill="#d2691e" />
      <rect x="-60" y="-250" width="120" height="50" fill="#d2691e" />
      <rect x="-50" y="-300" width="100" height="50" fill="#d2691e" />
      <rect x="-40" y="-350" width="80" height="50" fill="#d2691e" />
    </g>

    <!-- Curved Eaves -->
    <g fill="url(#roofGrad)" stroke="#555" stroke-width="1">
      <path d="M-120,0 Q0,-30 120,0 L110,15 Q0,-10 -110,15 Z" />
      <path d="M-110,-50 Q0,-80 110,-50 L100,-35 Q0,-55 -100,-35 Z" />
      <path d="M-100,-100 Q0,-130 100,-100 L90,-85 Q0,-105 -90,-85 Z" />
      <path d="M-90,-150 Q0,-180 90,-150 L80,-135 Q0,-155 -80,-135 Z" />
      <path d="M-80,-200 Q0,-230 80,-200 L70,-185 Q0,-205 -70,-185 Z" />
      <path d="M-70,-250 Q0,-280 70,-250 L60,-235 Q0,-255 -60,-235 Z" />
      <path d="M-60,-300 Q0,-330 60,-300 L50,-285 Q0,-305 -50,-285 Z" />
    </g>
  </g>

  <!-- The Dragon -->
  <path id="dragon" 
    d="M200,800 C150,500 400,300 500,350 C600,400 800,500 750,700 C700,900 400,950 300,750 C200,550 500,500 600,600" 
    fill="none" stroke="#d4af37" stroke-width="12" stroke-linecap="round" filter="url(#shadow)"/>
    
  <!-- Dragon Details (Head) -->
  <g transform="translate(600, 600)">
    <circle cx="0" cy="0" r="20" fill="#8b0000" />
    <path d="M10,0 L30,-10 M10,5 L30,15" stroke="#d4af37" stroke-width="4" /> <!-- Whiskers -->
    <path d="M-5,-10 Q0,-30 10,-20" stroke="#d4af37" stroke-width="3" fill="none" /> <!-- Horn -->
  </g>

  <!-- Decorative Details -->
  <g id="lanterns" fill="#ff4500">
    <circle cx="450" cy="750" r="8" />
    <circle cx="550" cy="750" r="8" />
    <rect x="448" y="758" width="4" height="10" />
    <rect x="548" y="758" width="4" height="10" />
  </g>

  <!-- Clouds -->
  <path d="M50,100 Q100,50 150,100 T250,100" fill="none" stroke="#dcdcdc" stroke-width="3" />
  <path d="M800,150 Q850,100 900,150 T1000,150" fill="none" stroke="#dcdcdc" stroke-width="3" />
  
  <!-- Rocks and Pond -->
  <ellipse cx="200" cy="1100" rx="60" ry="30" fill="#708090" />
  <ellipse cx="800" cy="1150" rx="80" ry="40" fill="#708090" />
</svg>