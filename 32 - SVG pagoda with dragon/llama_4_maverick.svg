<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#964B00" />
      <stop offset="100%" stop-color="#FFC080" />
    </linearGradient>
    <linearGradient id="dragonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#660033" />
      <stop offset="100%" stop-color="#CC0066" />
    </linearGradient>
    <radialGradient id="cloudGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="tilePattern" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect x="0" y="0" width="10" height="10" fill="#FFC080" />
      <path d="M 0 0 L 10 10 M 0 10 L 10 0" stroke="#964B00" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Garden Background -->
  <rect x="0" y="0" width="800" height="600" fill="#C6E2B5" />

  <!-- Clouds and Mist -->
  <ellipse cx="600" cy="100" rx="100" ry="50" fill="url(#cloudGradient)" />
  <ellipse cx="700" cy="200" rx="50" ry="25" fill="url(#cloudGradient)" />

  <!-- Pine Trees -->
  <g>
    <path d="M 100 300 L 150 200 L 200 300" stroke="#228B22" stroke-width="5" fill="none" />
    <circle cx="150" cy="200" r="20" fill="#228B22" />
  </g>
  <g transform="translate(300, 0)">
    <path d="M 100 300 L 150 200 L 200 300" stroke="#228B22" stroke-width="5" fill="none" />
    <circle cx="150" cy="200" r="20" fill="#228B22" />
  </g>

  <!-- Bamboo -->
  <g>
    <rect x="250" y="400" width="10" height="100" fill="#228B22" />
    <rect x="270" y="380" width="10" height="120" fill="#228B22" />
    <rect x="290" y="420" width="10" height="80" fill="#228B22" />
  </g>

  <!-- Pond -->
  <ellipse cx="400" cy="550" rx="100" ry="50" fill="#4682B4" />

  <!-- Pathways -->
  <path d="M 100 500 L 300 550 L 500 500" stroke="#964B00" stroke-width="5" fill="none" />
  <path d="M 300 500 L 500 550 L 700 500" stroke="#964B00" stroke-width="5" fill="none" />

  <!-- Rocks -->
  <ellipse cx="550" cy="450" rx="20" ry="10" fill="#808080" />
  <ellipse cx="650" cy="500" rx="30" ry="20" fill="#808080" />

  <!-- Pagoda -->
  <g transform="translate(400, 200)">
    <!-- Base -->
    <rect x="-50" y="0" width="100" height="20" fill="#964B00" />

    <!-- Floors -->
    <g>
      <!-- Floor 1 -->
      <rect x="-40" y="20" width="80" height="20" fill="#FFC080" />
      <rect x="-45" y="40" width="90" height="5" fill="#964B00" />
      <!-- Floor 2 -->
      <rect x="-35" y="45" width="70" height="20" fill="#FFC080" />
      <rect x="-40" y="65" width="80" height="5" fill="#964B00" />
      <!-- Floor 3 -->
      <rect x="-30" y="70" width="60" height="20" fill="#FFC080" />
      <rect x="-35" y="90" width="70" height="5" fill="#964B00" />
      <!-- Floor 4 -->
      <rect x="-25" y="95" width="50" height="20" fill="#FFC080" />
      <rect x="-30" y="115" width="60" height="5" fill="#964B00" />
      <!-- Floor 5 -->
      <rect x="-20" y="120" width="40" height="20" fill="#FFC080" />
      <rect x="-25" y="140" width="50" height="5" fill="#964B00" />
      <!-- Floor 6 -->
      <rect x="-15" y="145" width="30" height="20" fill="#FFC080" />
      <rect x="-20" y="165" width="40" height="5" fill="#964B00" />
      <!-- Floor 7 -->
      <rect x="-10" y="170" width="20" height="20" fill="#FFC080" />
      <rect x="-15" y="190" width="30" height="5" fill="#964B00" />
      <!-- Floor 8 -->
      <rect x="-5" y="195" width="10" height="20" fill="#FFC080" />
    </g>

    <!-- Roofs -->
    <g>
      <!-- Roof 1 -->
      <path d="M -50 20 L 0 0 L 50 20" fill="url(#roofGradient)" />
      <!-- Roof 2 -->
      <path d="M -45 45 L 0 25 L 45 45" fill="url(#roofGradient)" />
      <!-- Roof 3 -->
      <path d="M -40 70 L 0 50 L 40 70" fill="url(#roofGradient)" />
      <!-- Roof 4 -->
      <path d="M -35 95 L 0 75 L 35 95" fill="url(#roofGradient)" />
      <!-- Roof 5 -->
      <path d="M -30 120 L 0 100 L 30 120" fill="url(#roofGradient)" />
      <!-- Roof 6 -->
      <path d="M -25 145 L 0 125 L 25 145" fill="url(#roofGradient)" />
      <!-- Roof 7 -->
      <path d="M -20 170 L 0 150 L 20 170" fill="url(#roofGradient)" />
      <!-- Roof 8 -->
      <path d="M -15 195 L 0 175 L 15 195" fill="url(#roofGradient)" />
    </g>

    <!-- Decorative Tiles -->
    <rect x="-50" y="20" width="100" height="180" fill="url(#tilePattern)" />

    <!-- Lanterns -->
    <g>
      <circle cx="-30" cy="50" r="5" fill="#FF0000" />
      <circle cx="30" cy="50" r="5" fill="#FF0000" />
      <circle cx="-30" cy="120" r="5" fill="#FF0000" />
      <circle cx="30" cy="120" r="5" fill="#FF0000" />
      <circle cx="-30" cy="190" r="5" fill="#FF0000" />
      <circle cx="30" cy="190" r="5" fill="#FF0000" />
    </g>

    <!-- Windows and Balconies -->
    <g>
      <rect x="-40" y="60" width="10" height="10" fill="#FFFFFF" />
      <rect x="30" y="60" width="10" height="10" fill="#FFFFFF" />
      <rect x="-40" y="130" width="10" height="10" fill="#FFFFFF" />
      <rect x="30" y="130" width="10" height="10" fill="#FFFFFF" />
      <rect x="-40" y="200" width="10" height="10" fill="#FFFFFF" />
      <rect x="30" y="200" width="10" height="10" fill="#FFFFFF" />
      <rect x="-45" y="55" width="90" height="5" fill="#964B00" />
      <rect x="-45" y="125" width="90" height="5" fill="#964B00" />
      <rect x="-45" y="195" width="90" height="5" fill="#964B00" />
    </g>
  </g>

  <!-- Dragon -->
  <g transform="translate(350, 250)" fill="url(#dragonGradient)">
    <!-- Body -->
    <path d="M 0 0 C 50 0 100 -50 150 -100 C 200 -150 250 -200 300 -250" stroke="#660033" stroke-width="5" fill="none" />
    <path d="M 0 0 C -50 0 -100 50 -150 100 C -200 150 -250 200 -300 250" stroke="#660033" stroke-width="5" fill="none" />
    <!-- Scales -->
    <g>
      <path d="M 50 -50 L 70 -30 L 50 -10" fill="#CC0066" />
      <path d="M 100 -100 L 120 -80 L 100 -60" fill="#CC0066" />
      <path d="M 150 -150 L 170 -130 L 150 -110" fill="#CC0066" />
      <path d="M -50 50 L -30 70 L -10 50" fill="#CC0066" />
      <path d="M -100 100 L -80 120 L -60 100" fill="#CC0066" />
      <path d="M -150 150 L -130 170 L -110 150" fill="#CC0066" />
    </g>
    <!-- Head -->
    <g transform="translate(300, -250)">
      <circle cx="0" cy="0" r="20" fill="#CC0066" />
      <!-- Eyes -->
      <circle cx="-5" cy="-5" r="5" fill="#FFFFFF" />
      <circle cx="5" cy="-5" r="5" fill="#FFFFFF" />
      <!-- Horns -->
      <path d="M -10 -20 L 0 -30 L 10 -20" fill="#CC0066" />
      <!-- Whiskers -->
      <path d="M -15 -10 L -20 -5 L -15 0" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <path d="M 15 -10 L 20 -5 L 15 0" stroke="#FFFFFF" stroke-width="2" fill="none" />
    </g>
    <!-- Claws -->
    <g>
      <path d="M 250 -220 L 260 -210 L 270 -220" fill="#CC0066" />
      <path d="M -250 220 L -260 210 L -270 220" fill="#CC0066" />
    </g>
    <!-- Mane -->
    <g>
      <path d="M 200 -150 L 220 -140 L 200 -130" fill="#CC0066" />
      <path d="M -200 150 L -220 140 L -200 130" fill="#CC0066" />
    </g>
  </g>

  <!-- Flowers -->
  <g>
    <circle cx="200" cy="550" r="10" fill="#FFC0CB" />
    <circle cx="220" cy="570" r="10" fill="#FFC0CB" />
    <circle cx="240" cy="550" r="10" fill="#FFC0CB" />
  </g>

</svg>
