<svg width="900" height="1400" viewBox="0 0 900 1400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="pagodaRoofGold" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f9e5be"/>
      <stop offset="50%" stop-color="#f6cb51"/>
      <stop offset="100%" stop-color="#9b6012"/>
    </linearGradient>
    <linearGradient id="pagodaRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cb3131"/>
      <stop offset="100%" stop-color="#7a1010"/>
    </linearGradient>
    <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbb031"/>
      <stop offset="50%" stop-color="#e34116"/>
      <stop offset="100%" stop-color="#861818"/>
    </linearGradient>
    <linearGradient id="dragonBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3ecc5"/>
      <stop offset="100%" stop-color="#e3c77e"/>
    </linearGradient>
    <radialGradient id="dragonShadow" cx="0.6" cy="0.3" r="1">
      <stop offset="0.2" stop-color="#00000033"/>
      <stop offset="1" stop-color="#00000000"/>
    </radialGradient>
    <linearGradient id="pineNeedle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#69914c"/>
      <stop offset="100%" stop-color="#385b26"/>
    </linearGradient>
    <linearGradient id="bamboo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b4e68d"/>
      <stop offset="100%" stop-color="#5f9653"/>
    </linearGradient>
    <radialGradient id="pond" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0%" stop-color="#c9edfc"/>
      <stop offset="80%" stop-color="#5bc5dc"/>
      <stop offset="100%" stop-color="#217689"/>
    </radialGradient>
    <linearGradient id="cloudMist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f6f3" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e9efd7" stop-opacity="0.4"/>
    </linearGradient>
    <pattern id="tilePattern" width="16" height="8" patternUnits="userSpaceOnUse">
      <ellipse cx="8" cy="4" rx="7" ry="3" fill="#7a2828" opacity="0.25"/>
      <ellipse cx="8" cy="7" rx="7" ry="1.5" fill="#ac6531" opacity="0.19"/>
    </pattern>
  </defs>

  <!-- Mist and background clouds -->
  <g opacity="0.9">
    <ellipse cx="450" cy="1230" rx="430" ry="80" fill="url(#cloudMist)"/>
    <ellipse cx="720" cy="380" rx="180" ry="46" fill="url(#cloudMist)" opacity="0.7"/>
    <ellipse cx="160" cy="835" rx="95" ry="18" fill="url(#cloudMist)" opacity="0.6"/>
    <ellipse cx="600" cy="145" rx="150" ry="35" fill="url(#cloudMist)" opacity="0.7"/>
    <ellipse cx="320" cy="290" rx="77" ry="20" fill="url(#cloudMist)" opacity="0.34"/>
    <ellipse cx="720" cy="1150" rx="170" ry="36" fill="url(#cloudMist)" opacity="0.34"/>
  </g>
  
  <!-- Garden elements: rocks, flowers, pathways, pond, bamboo and pines -->
  <g id="garden">
    <!-- Pond -->
    <ellipse cx="650" cy="1200" rx="95" ry="38" fill="url(#pond)" stroke="#65b9e5" stroke-width="2"/>
    <!-- Pathways -->
    <path d="M390,1350 Q410,1290 450,1260 Q470,1247 548,1230 Q610,1226 690,1209" stroke="#bfa168" stroke-width="18" fill="none" opacity="0.47" />
    <path d="M310,1290 Q360,1314 400,1360" stroke="#bfa168" stroke-width="10" fill="none" opacity="0.37"/>
    <!-- Garden Rocks (foreground) -->
    <ellipse cx="155" cy="1235" rx="55" ry="28" fill="#c9c9c1" stroke="#707070" stroke-width="3"/>
    <ellipse cx="360" cy="1245" rx="48" ry="18" fill="#bcb5a7" stroke="#504a40" stroke-width="2"/>
    <ellipse cx="800" cy="1270" rx="37" ry="14" fill="#e4dbc6" stroke="#948b78" stroke-width="2"/>
    <!-- Pine Trees -->
    <g id="pines">
      <!-- Main pine -->
      <rect x="77" y="1090" width="13" height="110" rx="9" fill="#715136"/>
      <ellipse cx="83" cy="1115" rx="75" ry="24" fill="url(#pineNeedle)" stroke="#48683b" stroke-width="2"/>
      <ellipse cx="120" cy="1135" rx="50" ry="15" fill="url(#pineNeedle)" stroke="#48683b" stroke-width="1.5"/>
      <ellipse cx="65" cy="1168" rx="30" ry="12" fill="url(#pineNeedle)" stroke="#48683b" stroke-width="1"/>
      <!-- Second pine -->
      <rect x="805" y="1150" width="8" height="42" rx="5" fill="#715136"/>
      <ellipse cx="820" cy="1165" rx="45" ry="13" fill="url(#pineNeedle)" stroke="#48683b" stroke-width="1.4"/>
    </g>
    <!-- Bamboo Clumps -->
    <g id="bamboo">
      <rect x="225" y="1200" width="7" height="60" rx="3.5" fill="url(#bamboo)" stroke="#498757" stroke-width="1"/>
      <rect x="235" y="1222" width="6" height="34" rx="3" fill="url(#bamboo)" stroke="#498757" stroke-width="0.8"/>
      <rect x="860" y="1235" width="8" height="45" rx="4" fill="url(#bamboo)" stroke="#498757" stroke-width="1"/>
      <ellipse cx="230" cy="1265" rx="8" ry="7" fill="#b4e68d" opacity="0.65"/>
      <!-- Bamboo leaves -->
      <path d="M229,1205 Q218,1200 234,1213" stroke="#498757" stroke-width="2.1" fill="none"/>
      <path d="M237,1222 Q230,1227 241,1241" stroke="#498757" stroke-width="1.5" fill="none"/>
      <path d="M864,1240 Q857,1248 874,1255" stroke="#498757" stroke-width="1.6" fill="none"/>
    </g>
    <!-- Flowers -->
    <g id="flowers">
      <ellipse cx="138" cy="1260" rx="6" ry="3" fill="#ffe7ea"/>
      <ellipse cx="148" cy="1270" rx="5" ry="3" fill="#ed97a4"/>
      <ellipse cx="178" cy="1255" rx="4.5" ry="2.3" fill="#ffe7ea"/>
      <ellipse cx="845" cy="1286" rx="4" ry="2.7" fill="#fcdb7c"/>
      <ellipse cx="863" cy="1280" rx="4" ry="2.7" fill="#fcdb7c"/>
      <ellipse cx="332" cy="1237" rx="5.7" ry="2.4" fill="#ffe7ea"/>
    </g>
  </g>

  <!-- Pagoda Shadow -->
  <ellipse cx="450" cy="1288" rx="145" ry="38" fill="#19120e" opacity="0.19" />

  <!-- Main Pagoda -->
  <g id="pagoda">
    <!-- Pagoda base platform -->
    <rect x="258" y="1165" width="384" height="60" rx="26" fill="url(#pagodaRoofGold)" stroke="#8b5e17" stroke-width="4"/>
    <ellipse cx="450" cy="1165" rx="197" ry="36" fill="#e8ca80" opacity="0.6"/>
    <!-- Stairs -->
    <rect x="420" y="1225" width="60" height="36" rx="14" fill="#9e8061" stroke="#362b1c" stroke-width="2"/>
    <rect x="430" y="1252" width="40" height="18" rx="6" fill="#c3ad81" stroke="#362b1c" stroke-width="1.5"/>
    
    <!-- Pagoda floors, from bottom up -->
    <g id="floors">
      <g id="floor1">
        <!-- Balcony -->
        <rect x="278" y="1132" width="344" height="26" rx="11" fill="url(#pagodaRed)" stroke="#6e1f1f" stroke-width="2.3"/>
        <rect x="326" y="1138" width="248" height="10" rx="2" fill="url(#pagodaRoofGold)" opacity="0.4"/>
        <!-- Walls -->
        <rect x="318" y="1073" width="264" height="66" rx="22" fill="#dcdbe8" stroke="#a29271" stroke-width="2.2"/>
        <!-- Doors and windows -->
        <rect x="418" y="1102" width="64" height="32" rx="11" fill="#772b1b" stroke="#be9e75" stroke-width="2"/>
        <rect x="365" y="1090" width="23" height="26" rx="6" fill="#772b1b" stroke="#be9e75" stroke-width="1.2"/>
        <rect x="514" y="1090" width="23" height="26" rx="6" fill="#772b1b" stroke="#be9e75" stroke-width="1.2"/>
      </g>
      <!-- Rooves and subsequent floors, 8 in total, each slightly smaller -->
      <g id="floor2">
        <!-- Roof -->
        <path d="M290,1072 Q450,1027 610,1072 Q595,1079 583,1084 Q450,1052 317,1084 Q307,1081 290,1072Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="2.8"/>
        <path d="M315,1082 Q450,1047 585,1082" fill="url(#tilePattern)" />
        <!-- Curved eaves -->
        <path d="M290,1072 Q267,1050 307,1087" stroke="#a97934" stroke-width="4.8" fill="none"/>
        <path d="M610,1072 Q633,1050 593,1087" stroke="#a97934" stroke-width="4.8" fill="none"/>
        <!-- Balcony -->
        <rect x="335" y="1058" width="230" height="15" rx="5" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="1.5"/>
        <!-- Wall -->
        <rect x="352" y="1014" width="196" height="45" rx="13" fill="#ebf3fa" stroke="#b9b7a7" stroke-width="1.4"/>
        <!-- Windows -->
        <rect x="433" y="1029" width="34" height="23" rx="7" fill="#772b1b" stroke="#b69c7a" stroke-width="1"/>
        <rect x="377" y="1029" width="18" height="17" rx="5" fill="#772b1b" stroke="#b69c7a" stroke-width="0.8"/>
        <rect x="507" y="1029" width="18" height="17" rx="5" fill="#772b1b" stroke="#b69c7a" stroke-width="0.8"/>
      </g>
      <g id="floor3">
        <!-- Roof -->
        <path d="M323,1011 Q450,978 577,1011 Q563,1017 552,1022 Q450,991 348,1022 Q336,1018 323,1011Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="2.4"/>
        <path d="M342,1020 Q450,995 558,1020" fill="url(#tilePattern)" />
        <path d="M323,1011 Q310,988 347,1026" stroke="#a97934" stroke-width="3.1" fill="none"/>
        <path d="M577,1011 Q590,988 553,1026" stroke="#a97934" stroke-width="3.1" fill="none"/>
        <!-- Balcony -->
        <rect x="367" y="995" width="166" height="12" rx="3.5" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="1.2"/>
        <!-- Wall -->
        <rect x="386" y="967" width="128" height="32" rx="8" fill="#e1eaf5" stroke="#b1b2b6" stroke-width="1.2"/>
        <!-- Windows -->
        <rect x="433" y="977" width="34" height="14" rx="5" fill="#772b1b" stroke="#ad987c" stroke-width="0.9"/>
      </g>
      <g id="floor4">
        <!-- Roof -->
        <path d="M355,966 Q450,945 545,966 Q534,971 523,975 Q450,954 377,975 Q367,971 355,966Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="2.1"/>
        <path d="M372,974 Q450,955 528,974" fill="url(#tilePattern)" />
        <path d="M355,966 Q343,948 375,979" stroke="#a97934" stroke-width="2.1" fill="none"/>
        <path d="M545,966 Q557,948 525,979" stroke="#a97934" stroke-width="2.1" fill="none"/>
        <!-- Balcony -->
        <rect x="398" y="954" width="104" height="9" rx="2.5" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="0.9"/>
        <!-- Wall -->
        <rect x="418" y="936" width="64" height="19" rx="3" fill="#dde3ea" stroke="#a49e8d" stroke-width="1.1"/>
      </g>
      <g id="floor5">
        <!-- Roof -->
        <path d="M384,936 Q450,924 516,936 Q507,940 499,944 Q450,929 401,944 Q393,940 384,936Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="1.8"/>
        <path d="M398,943 Q450,930 502,943" fill="url(#tilePattern)" />
        <path d="M384,936 Q373,922 401,947" stroke="#a97934" stroke-width="1.4" fill="none"/>
        <path d="M516,936 Q527,922 499,947" stroke="#a97934" stroke-width="1.4" fill="none"/>
        <!-- Balcony -->
        <rect x="423" y="929" width="54" height="6" rx="1.7" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="0.6"/>
        <!-- Wall -->
        <rect x="438" y="921" width="24" height="9" rx="1.5" fill="#dee6ef" stroke="#bbb5a5" stroke-width="0.7"/>
      </g>
      <g id="floor6">
        <!-- Roof -->
        <path d="M406,920 Q450,915 494,920 Q488,922 483,924 Q450,917 417,924 Q413,922 406,920Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="1.3"/>
        <path d="M416,924 Q450,919 484,924" fill="url(#tilePattern)" />
        <path d="M406,920 Q398,909 417,926" stroke="#a97934" stroke-width="1" fill="none"/>
        <path d="M494,920 Q502,909 483,926" stroke="#a97934" stroke-width="1" fill="none"/>
        <!-- Balcony -->
        <rect x="432" y="917" width="36" height="4.2" rx="1" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="0.4"/>
      </g>
      <g id="floor7">
        <!-- Roof -->
        <path d="M422,911 Q450,908 478,911 Q474,913 470,914 Q450,910 430,914 Q427,913 422,911Z" fill="url(#pagodaRoofGold)" stroke="#d3ad58" stroke-width="0.9"/>
        <path d="M430,914 Q450,911 470,914" fill="url(#tilePattern)" />
        <!-- Balustrade -->
        <rect x="440" y="910" width="20" height="2.4" rx="0.8" fill="url(#pagodaRed)" stroke="#8b231b" stroke-width="0.23"/>
      </g>
      <g id="floor8">
        <!-- Final lantern roof and finial -->
        <ellipse cx="450" cy="904" rx="13" ry="5.2" fill="url(#pagodaRoofGold)" stroke="#ab7a19" stroke-width="0.8"/>
        <ellipse cx="450" cy="898" rx="9" ry="3.6" fill="url(#pagodaRoofGold)" opacity="0.6"/>
        <!-- Finial post -->
        <rect x="447.3" y="885" width="5.4" height="16" rx="2.5" fill="url(#pagodaRoofGold)" stroke="#a87a19" stroke-width="0.5"/>
        <!-- Carved ornament -->
        <path d="M450,885 q6,-5 0,-11 q-6,6 0,11 z" fill="url(#pagodaRoofGold)" stroke="#ad7a19" stroke-width="0.7"/>
      </g>
    </g>
    <!-- Decorative lanterns (hanging under eaves) -->
    <g id="lanterns">
      <!-- Hanging lanterns, left -->
      <g>
        <ellipse cx="302" cy="1090" rx="8.5" ry="14" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="1.5"/>
        <rect x="299" y="1103" width="6" height="11" rx="2.3" fill="#d3b234"/>
      </g>
      <g>
        <ellipse cx="328" cy="1015" rx="7" ry="11" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="1.1"/>
        <rect x="325" y="1025" width="4.5" height="8" rx="2" fill="#d3b234"/>
      </g>
      <g>
        <ellipse cx="377" cy="954" rx="5.2" ry="8" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="0.8"/>
        <rect x="375" y="962" width="2.8" height="5" rx="1" fill="#d3b234"/>
      </g>
      <!-- Hanging lanterns, right -->
      <g>
        <ellipse cx="598" cy="1090" rx="8.5" ry="14" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="1.5"/>
        <rect x="595" y="1103" width="6" height="11" rx="2.3" fill="#d3b234"/>
      </g>
      <g>
        <ellipse cx="572" cy="1015" rx="7" ry="11" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="1.1"/>
        <rect x="570" y="1025" width="4.5" height="8" rx="2" fill="#d3b234"/>
      </g>
      <g>
        <ellipse cx="523" cy="954" rx="5.2" ry="8" fill="url(#pagodaRed)" stroke="#c28d2c" stroke-width="0.8"/>
        <rect x="521" y="962" width="2.8" height="5" rx="1" fill="#d3b234"/>
      </g>
    </g>
    <!-- Ornamental details -->
    <g id="ornamental-carving">
      <path d="M450,1150 q12,-12 24,0 q-12,-20 -24,0 z" fill="#a98852" opacity="0.25"/>
      <path d="M450,1150 q-12,-12 -24,0 q12,-20 24,0 z" fill="#a98852" opacity="0.25"/>
      <ellipse cx="450" cy="1160" rx="20" ry="9" fill="url(#tilePattern)" opacity="0.28"/>
    </g>
  </g>

  <!-- DRAGON: Around Pagoda -->
  <g id="dragon" filter="url(#dragonShadow)">
    <!-- Dragon shadow for 3D effect -->
    <path d="M535,950 Q620,1000 570,1110 Q520,1167 600,1202 Q645,1215 680,1190 Q785,1100 690,1010 Q570,895 585,805 Q599,751 671,694 Q569,780 556,837 Q533,915 535,950Z"
      fill="url(#dragonShadow)" opacity="0.29"/>

    <!-- Main body -->
    <path id="dragonBody" d="M661,690
      Q660,720 617,750
      Q600,765 575,820
      Q561,852 576,875
      Q587,892 630,920
      Q658,940 610,1064
      Q572,1165 612,1207
      Q660,1247 719,1202
      Q805,1127 718,1037
      Q636,951 656,876
      Q687,766 794,702
      Q689,795 671,694 Z"
      fill="url(#dragonBody)" stroke="#ba2c17" stroke-width="8"/>

    <!-- Belly -->
    <path d="M669,716
      Q652,745 608,770
      Q594,779 576,825
      Q563,860 589,885
      Q628,912 603,1034
      Q575,1147 611,1188
      Q656,1233 704,1197
      Q783,1133 715,1044
      Q629,938 650,880
      Q691,768 769,716
      Q682,785 669,716 Z"
      fill="url(#dragonBelly)" opacity="0.76"/>

    <!-- Dragon head -->
    <g id="dragonHead">
      <!-- Face base -->
      <ellipse cx="671" cy="690" rx="37" ry="24" fill="url(#dragonBody)" stroke="#a92209" stroke-width="3.3"/>
      <!-- Jaw and snout -->
      <ellipse cx="681" cy="713" rx="19" ry="8.7" fill="url(#dragonBelly)" stroke="#b59c77" stroke-width="1.5" opacity="0.88"/>
      <!-- Nostrils -->
      <ellipse cx="693" cy="710" rx="2" ry="0.9" fill="#59270a"/>
      <ellipse cx="667" cy="709" rx="2" ry="0.9" fill="#59270a"/>
      <!-- Eyes -->
      <ellipse cx="660" cy="697" rx="4.5" ry="2.5" fill="#fff"/>
      <ellipse cx="659" cy="697" rx="2.1" ry="1.4" fill="#17110e"/>
      <ellipse cx="682" cy="696" rx="4.5" ry="2.5" fill="#fff"/>
      <ellipse cx="683" cy="696" rx="2.1" ry="1.4" fill="#17110e"/>
      <!-- Eyebrows -->
      <path d="M657,694 Q652,687 663,688" stroke="#cbaa8d" stroke-width="3.5" fill="none"/>
      <path d="M686,692 Q689,684 684,688" stroke="#cbaa8d" stroke-width="3.5" fill="none"/>
      <!-- Horns -->
      <path d="M658,675 Q650,660 633,656 Q669,655 678,674" stroke="#ecd893" stroke-width="6" fill="none" />
      <path d="M687,675 Q698,660 715,657 Q672,654 667,672" stroke="#ecd893" stroke-width="6" fill="none" />
      <!-- Whiskers -->
      <path d="M633,691 Q604,684 616,705 Q647,695 638,733" stroke="#c5bca3" stroke-width="2.5" fill="none" />
      <path d="M704,689 Q730,680 723,704 Q688,701 701,729" stroke="#c5bca3" stroke-width="2.5" fill="none" />
      <!-- Fangs -->
      <path d="M671,718 Q668,725 673,723 Q668,726 673,726" stroke="#fff" stroke-width="1.2" fill="none" />
      <path d="M679,718 Q682,725 677,723 Q682,726 677,726" stroke="#fff" stroke-width="1.2" fill="none" />
      <!-- Flowing mane -->
      <path d="M660,697 Q642,686 631,690 Q646,698 656,712 Q636,704 627,716 Q651,720 666,715" stroke="#3c6b79" stroke-width="5" fill="none"/>
      <path d="M689,697 Q707,686 718,691 Q703,699 693,713 Q713,705 722,717 Q698,721 683,716" stroke="#3c6b79" stroke-width="5" fill="none"/>
      <!-- Cheek tufts -->
      <path d="M648,708 Q636,722 647,722" stroke="#eac891" stroke-width="2" fill="none"/>
      <path d="M693,708 Q707,722 692,722" stroke="#eac891" stroke-width="2" fill="none"/>
    </g>

    <!-- Scales (stylized, body only, approximate and sparse for detail) -->
    <g id="scales" opacity="0.23">
      <ellipse cx="610" cy="790" rx="12.5" ry="4" fill="#fff1c7" transform="rotate(25 610 790)"/>
      <ellipse cx="582" cy="842" rx="8" ry="2.7" fill="#fff1c7" transform="rotate(-8 582 842)"/>
      <ellipse cx="630" cy="955" rx="15" ry="5" fill="#fff1c7" transform="rotate(17 630 955)"/>
      <ellipse cx="652" cy="988" rx="7" ry="2.3" fill="#fff1c7" transform="rotate(10 652 988)"/>
      <ellipse cx="660" cy="1145" rx="14" ry="3.9" fill="#fff1c7" transform="rotate(-5 660 1145)"/>
      <ellipse cx="707" cy="1191" rx="21" ry="8.2" fill="#fff1c7" transform="rotate(6 707 1191)"/>
      <ellipse cx="684" cy="1159" rx="10.2" ry="3.1" fill="#fff1c7" transform="rotate(-19 684 1159)"/>
    </g>

    <!-- TOES/CLAWS -->
    <g id="claws" opacity="0.93">
      <!-- Fore claw, gripping pagoda floor 3 -->
      <g>
        <ellipse cx="548" cy="1023" rx="14" ry="5.2" fill="#eed47c" stroke="#a18237" stroke-width="2"/>
        <path d="M562,1022 Q570,1014 570,1027" stroke="#eac891" stroke-width="3.5" fill="none"/>
        <path d="M540,1023 Q534,1015 533,1027" stroke="#eac891" stroke-width="3.2" fill="none"/>
      </g>
      <!-- Hind claw, near base -->
      <g>
        <ellipse cx="635" cy="1202" rx="15" ry="7.2" fill="#eed47c" stroke="#a18237" stroke-width="2"/>
        <path d="M650,1203 Q658,1192 660,1209" stroke="#eac891" stroke-width="3.1" fill="none"/>
        <path d="M638,1210 Q635,1217 646,1212" stroke="#eac891" stroke-width="3.1" fill="none"/>
      </g>
    </g>
  </g>

  <!-- Foreground Mist Softening -->
  <ellipse cx="450" cy="1330" rx="355" ry="48" fill="url(#cloudMist)" opacity="0.39"/>

  <!-- Layer for clean outline of overall pagoda and dragon (for legibility on busy backgrounds) -->
  <g>
    <path d="M270,892 Q450,810 630,892 Q610,970 448,1310 Q285,970 270,892Z" fill="none" stroke="#56240d" stroke-width="6" opacity="0.13"/>
  </g>
  
</svg>