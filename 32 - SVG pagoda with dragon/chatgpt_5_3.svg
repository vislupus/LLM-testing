<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600">

<!-- ===================== DEFINITIONS ===================== -->
<defs>

<!-- Sky -->
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#dff3ff"/>
<stop offset="100%" stop-color="#ffffff"/>
</linearGradient>

<!-- Gold -->
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#fff4c2"/>
<stop offset="50%" stop-color="#e6b800"/>
<stop offset="100%" stop-color="#9a6a00"/>
</linearGradient>

<!-- Roof -->
<linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#c92a1a"/>
<stop offset="100%" stop-color="#5c0b07"/>
</linearGradient>

<!-- Wood -->
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#7a3e16"/>
<stop offset="100%" stop-color="#3b1d0a"/>
</linearGradient>

<!-- Dragon -->
<linearGradient id="dragon" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#ffd86b"/>
<stop offset="50%" stop-color="#d22c1c"/>
<stop offset="100%" stop-color="#6a0e0c"/>
</linearGradient>

<!-- Water -->
<radialGradient id="water" cx="50%" cy="40%" r="60%">
<stop offset="0%" stop-color="#bdefff"/>
<stop offset="100%" stop-color="#2b7da3"/>
</radialGradient>

<!-- Shadow -->
<filter id="shadow">
<feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.3"/>
</filter>

</defs>

<!-- ===================== BACKGROUND ===================== -->
<rect width="1200" height="1600" fill="url(#sky)"/>

<!-- Clouds -->
<g fill="white" opacity="0.7">
<ellipse cx="200" cy="200" rx="120" ry="50"/>
<ellipse cx="900" cy="150" rx="150" ry="60"/>
</g>

<!-- ===================== GARDEN ===================== -->
<!-- Ground -->
<rect y="900" width="1200" height="700" fill="#7fbf5b"/>

<!-- Pond -->
<ellipse cx="900" cy="1200" rx="180" ry="70" fill="url(#water)"/>

<!-- Rocks -->
<ellipse cx="200" cy="1100" rx="80" ry="40" fill="#6b7073"/>
<ellipse cx="250" cy="1080" rx="50" ry="25" fill="#4e5457"/>

<!-- Bamboo -->
<g stroke="#2d7d32" stroke-width="8">
<line x1="100" y1="1200" x2="100" y2="950"/>
<line x1="130" y1="1220" x2="130" y2="960"/>
</g>

<!-- Pine Tree -->
<polygon points="1050,900 1000,1100 1100,1100" fill="#1f5e2e"/>
<polygon points="1050,850 1010,1000 1090,1000" fill="#2c7a3f"/>

<!-- Path -->
<path d="M600 900 Q550 1100 650 1300" stroke="#e6d5b8" stroke-width="20" fill="none"/>

<!-- ===================== PAGODA ===================== -->
<g transform="translate(600,900)" filter="url(#shadow)">

<!-- Base -->
<rect x="-120" y="0" width="240" height="40" fill="#bca07a"/>

<!-- Floors -->
<g id="floor">
<polygon points="-160,0 160,0 180,-20 -180,-20" fill="url(#roof)"/>
<rect x="-100" y="-120" width="200" height="100" fill="url(#wood)"/>
<rect x="-110" y="-20" width="220" height="10" fill="url(#gold)"/>
</g>

<!-- 8 Floors -->
<g transform="translate(0,-150) scale(0.95)"><use href="#floor"/></g>
<g transform="translate(0,-280) scale(0.88)"><use href="#floor"/></g>
<g transform="translate(0,-400) scale(0.80)"><use href="#floor"/></g>
<g transform="translate(0,-510) scale(0.72)"><use href="#floor"/></g>
<g transform="translate(0,-610) scale(0.65)"><use href="#floor"/></g>
<g transform="translate(0,-700) scale(0.58)"><use href="#floor"/></g>
<g transform="translate(0,-780) scale(0.50)"><use href="#floor"/></g>

<!-- Spire -->
<line x1="0" y1="-820" x2="0" y2="-900" stroke="url(#gold)" stroke-width="6"/>
<circle cx="0" cy="-920" r="18" fill="url(#gold)"/>

</g>

<!-- ===================== DRAGON ===================== -->
<g filter="url(#shadow)">

<!-- Body -->
<path d="M200 1300
C300 1200, 350 1000, 500 950
C650 900, 700 750, 600 650
C500 550, 650 450, 800 500
C950 550, 950 350, 800 300"
stroke="url(#dragon)" stroke-width="50" fill="none" stroke-linecap="round"/>

<!-- Belly -->
<path d="M220 1300
C300 1200, 350 1000, 500 950
C650 900, 700 750, 600 650
C500 550, 650 450, 800 500
C950 550, 950 350, 800 300"
stroke="#ffdca0" stroke-width="15" fill="none" stroke-linecap="round"/>

<!-- Head -->
<g transform="translate(780,280)">
<ellipse cx="0" cy="0" rx="40" ry="30" fill="url(#dragon)"/>
<circle cx="-10" cy="-5" r="5" fill="white"/>
<circle cx="10" cy="-5" r="5" fill="white"/>
<path d="M-20,-30 Q0,-60 20,-30" stroke="url(#gold)" stroke-width="5" fill="none"/>
<path d="M-30,10 Q-60,0 -80,-10" stroke="#ffdca0" stroke-width="3"/>
<path d="M30,10 Q60,0 80,-10" stroke="#ffdca0" stroke-width="3"/>
</g>

</g>

<!-- ===================== MIST ===================== -->
<rect y="1100" width="1200" height="200" fill="white" opacity="0.15"/>

</svg>