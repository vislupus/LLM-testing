<svg viewBox="0 0 800 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#1a2a6c" />
            <stop offset="50%" style="stop-color:#b21f1f" />
            <stop offset="100%" style="stop-color:#fdbb2d" />
        </linearGradient>
        
        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#444" />
            <stop offset="100%" style="stop-color:#222" />
        </linearGradient>
        
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFD700" />
            <stop offset="100%" style="stop-color:#B8860B" />
        </linearGradient>

        <linearGradient id="dragonScaleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#006400" />
            <stop offset="50%" style="stop-color:#228B22" />
            <stop offset="100%" style="stop-color:#32CD32" />
        </linearGradient>

        <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ffffff; stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#ffffff; stop-opacity:0" />
        </radialGradient>

        <pattern id="tilePattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M 0 10 Q 5 0 10 10" fill="none" stroke="#555" stroke-width="0.5"/>
        </pattern>

        <!-- Filters -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="800" height="1200" fill="url(#skyGrad)" />
    
    <!-- Distant Mountains -->
    <path d="M0 800 L150 650 L300 750 L500 600 L800 800 Z" fill="#2c3e50" opacity="0.4" />
    <path d="M0 850 L200 700 L450 820 L650 680 L800 850 Z" fill="#34495e" opacity="0.6" />

    <!-- Clouds/Mist (Back) -->
    <g opacity="0.5">
        <circle cx="100" cy="400" r="80" fill="url(#mistGrad)" />
        <circle cx="700" cy="200" r="120" fill="url(#mistGrad)" />
        <circle cx="400" cy="500" r="150" fill="url(#mistGrad)" />
    </g>

    <!-- Pagoda Foundation -->
    <rect x="250" y="1000" width="300" height="50" fill="#555" rx="5" />
    <rect x="230" y="1040" width="340" height="40" fill="#444" rx="5" />

    <!-- DRAGON (Behind Pagoda Segments) -->
    <path d="M 550 900 Q 700 800 550 700 Q 400 600 550 500 Q 650 400 550 300" fill="none" stroke="url(#dragonScaleGrad)" stroke-width="40" stroke-linecap="round" />
    <path d="M 550 900 Q 700 800 550 700 Q 400 600 550 500 Q 650 400 550 300" fill="none" stroke="rgba(255,215,0,0.3)" stroke-width="45" stroke-dasharray="2,10" />

    <!-- Pagoda Structure Function (Logic visualization) -->
    <!-- We build from bottom to top -->
    
    <!-- Floor 1 (Bottom) -->
    <g transform="translate(0, 0)">
        <rect x="300" y="850" width="200" height="150" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 400 800 520 860 L 550 870 L 250 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 400 800 520 860" fill="none" stroke="url(#goldGrad)" stroke-width="5" />
        <!-- Balcony -->
        <rect x="290" y="980" width="220" height="20" fill="#4A2B0F" />
        <!-- Window -->
        <rect x="375" y="900" width="50" height="80" fill="#222" stroke="url(#goldGrad)" stroke-width="2" />
        <path d="M 375 925 H 425 M 375 950 H 425 M 400 900 V 980" stroke="url(#goldGrad)" stroke-width="1" />
    </g>

    <!-- Floor 2 -->
    <g transform="translate(10, -130)">
        <rect x="300" y="850" width="180" height="130" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 390 810 500 860 L 520 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 390 810 500 860" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
        <rect x="370" y="900" width="40" height="60" fill="#222" stroke="url(#goldGrad)" />
    </g>

    <!-- Floor 3 -->
    <g transform="translate(20, -250)">
        <rect x="300" y="850" width="160" height="120" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 380 820 480 860 L 500 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 380 820 480 860" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
        <rect x="365" y="890" width="30" height="50" fill="#222" stroke="url(#goldGrad)" />
    </g>

    <!-- DRAGON (Middle Front Segment) -->
    <path d="M 250 800 Q 150 700 300 600 Q 450 500 300 400" fill="none" stroke="url(#dragonScaleGrad)" stroke-width="38" stroke-linecap="round" />
    <path d="M 250 800 Q 150 700 300 600 Q 450 500 300 400" fill="none" stroke="#FFD700" stroke-width="10" stroke-dasharray="1,15" stroke-opacity="0.5"/>
    <!-- Dragon Claws -->
    <g fill="#EEE" stroke="#333" stroke-width="1">
        <path d="M 220 780 l -20 10 l -5 -15 l 20 -5 Z" />
        <path d="M 420 520 l 20 10 l 5 -15 l -20 -5 Z" />
    </g>

    <!-- Floor 4 -->
    <g transform="translate(30, -360)">
        <rect x="300" y="850" width="140" height="110" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 370 825 460 860 L 480 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 370 825 460 860" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- Floor 5 -->
    <g transform="translate(40, -460)">
        <rect x="300" y="850" width="120" height="100" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 360 830 440 860 L 460 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 360 830 440 860" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    </g>

    <!-- Floor 6 -->
    <g transform="translate(50, -550)">
        <rect x="300" y="850" width="100" height="90" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 350 835 420 860 L 440 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 350 835 420 860" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
    </g>

    <!-- Floor 7 (Top) -->
    <g transform="translate(60, -630)">
        <rect x="300" y="850" width="80" height="80" fill="#8B0000" stroke="#4A2B0F" stroke-width="4"/>
        <path d="M 280 860 Q 340 840 400 860 L 420 870 L 260 870 Z" fill="url(#roofGrad)" />
        <path d="M 280 860 Q 340 840 400 860" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
        <!-- Spire -->
        <path d="M 340 850 L 340 780" stroke="url(#goldGrad)" stroke-width="4" />
        <circle cx="340" cy="770" r="8" fill="url(#goldGrad)" filter="url(#glow)" />
        <circle cx="340" cy="750" r="4" fill="url(#goldGrad)" />
    </g>

    <!-- DRAGON HEAD (Top Level) -->
    <g transform="translate(300, 200)">
        <!-- Neck -->
        <path d="M 0 100 Q -50 50 0 0" fill="none" stroke="url(#dragonScaleGrad)" stroke-width="35" stroke-linecap="round" />
        <!-- Head -->
        <ellipse cx="10" cy="-10" rx="35" ry="25" fill="#228B22" />
        <!-- Snout -->
        <path d="M 30 -20 Q 60 -20 60 0 L 10 10 Z" fill="#228B22" />
        <!-- Horns -->
        <path d="M 0 -30 L -20 -60 M 20 -35 L 30 -65" stroke="#FFF" stroke-width="5" stroke-linecap="round" />
        <!-- Eyes -->
        <circle cx="30" cy="-15" r="5" fill="yellow" />
        <circle cx="30" cy="-15" r="2" fill="black" />
        <!-- Whiskers -->
        <path d="M 55 -5 Q 100 -20 120 20" fill="none" stroke="#FFD700" stroke-width="2" />
        <path d="M 55 5 Q 100 20 120 -20" fill="none" stroke="#FFD700" stroke-width="2" />
        <!-- Mane -->
        <path d="M -15 -25 Q -40 -10 -20 20" fill="#B22222" />
        <path d="M -5 -35 Q -30 -20 -10 10" fill="#B22222" />
    </g>

    <!-- Lanterns (Hanging from eaves) -->
    <g fill="#FF4500" stroke="#FFD700" stroke-width="1">
        <rect x="255" y="870" width="10" height="15" />
        <rect x="535" y="870" width="10" height="15" />
        <rect x="270" y="740" width="8" height="12" />
        <rect x="522" y="740" width="8" height="12" />
    </g>

    <!-- GARDEN ELEMENTS (Foreground) -->
    
    <!-- Pond -->
    <ellipse cx="400" cy="1120" rx="380" ry="80" fill="#1e3799" opacity="0.8" />
    <path d="M 100 1120 Q 400 1080 700 1120" fill="none" stroke="#4a69bd" stroke-width="2" opacity="0.5" />
    
    <!-- Lilypads -->
    <circle cx="200" cy="1130" r="15" fill="#2ed573" />
    <circle cx="600" cy="1140" r="12" fill="#2ed573" />
    
    <!-- Rocks -->
    <path d="M 50 1150 Q 80 1080 150 1150 Z" fill="#777" />
    <path d="M 650 1150 Q 720 1050 780 1150 Z" fill="#555" />
    
    <!-- Pine Trees (Left) -->
    <g transform="translate(60, 950)">
        <rect x="-5" y="0" width="10" height="100" fill="#4A2B0F" />
        <path d="M -50 20 Q 0 -20 50 20 Z" fill="#004d00" />
        <path d="M -40 -10 Q 0 -50 40 -10 Z" fill="#004d00" />
        <path d="M -30 -40 Q 0 -70 30 -40 Z" fill="#004d00" />
    </g>
    
    <!-- Bamboo (Right) -->
    <g transform="translate(700, 850)">
        <g stroke="#4b7b2b" stroke-width="6">
            <line x1="0" y1="0" x2="0" y2="250" />
            <line x1="30" y1="50" x2="30" y2="250" />
            <line x1="-30" y1="80" x2="-30" y2="250" />
        </g>
        <!-- Bamboo Leaves -->
        <path d="M 0 50 l 20 -10 M 0 100 l -20 -10 M 30 120 l 20 -5" stroke="#2d5a27" stroke-width="2" />
    </g>

    <!-- Flowers -->
    <g fill="#ff9ff3">
        <circle cx="150" cy="1080" r="5" />
        <circle cx="170" cy="1090" r="5" />
        <circle cx="650" cy="1080" r="6" />
        <circle cx="680" cy="1095" r="4" />
    </g>

    <!-- Foreground Mist -->
    <rect x="0" y="1050" width="800" height="150" fill="url(#mistGrad)" />

</svg>