<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FDB931;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="pillarRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B22222;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="roofTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#004D40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00251a;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2E8B57;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3CB371;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E8B57;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0288D1;stop-opacity:0.9" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="roofPattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="18" height="8" fill="url(#roofTile)" />
      <line x1="0" y1="9" x2="20" y2="9" stroke="#B8860B" stroke-width="1" />
    </pattern>
    
    <pattern id="dragonScales" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Filter for soft shadows -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background: Sky and Mist -->
  <rect x="0" y="0" width="800" height="1200" fill="url(#skyGradient)" />
  
  <!-- Distant Mountains -->
  <path d="M0,900 L150,600 L300,850 L500,550 L800,900 L800,1200 L0,1200 Z" fill="#90A4AE" opacity="0.5" />
  <path d="M-100,1200 L200,700 L400,1000 L800,800 L900,1200 Z" fill="#78909C" opacity="0.6" />

  <!-- Clouds -->
  <g fill="#FFFFFF" opacity="0.6">
    <circle cx="100" cy="150" r="40" />
    <circle cx="150" cy="130" r="50" />
    <circle cx="200" cy="150" r="40" />
    <circle cx="600" cy="200" r="60" />
    <circle cx="680" cy="180" r="50" />
    <circle cx="750" cy="220" r="40" />
  </g>

  <!-- Ground -->
  <rect x="0" y="900" width="800" height="300" fill="#4E342E" />
  <path d="M0,900 Q400,880 800,900 L800,1200 L0,1200 Z" fill="#5D4037" />

  <!-- Pond -->
  <ellipse cx="400" cy="1100" rx="350" ry="80" fill="url(#waterGradient)" />
  <!-- Reflection hint -->
  <path d="M350,1080 Q400,1060 450,1080" stroke="white" stroke-width="2" opacity="0.3" fill="none"/>

  <!-- Vegetation: Bamboo Background -->
  <g transform="translate(50, 400)">
    <defs>
        <g id="bambooStalk">
            <rect x="0" y="0" width="15" height="600" fill="#689F38" />
            <path d="M0,50 H15 M0,150 H15 M0,250 H15 M0,350 H15 M0,450 H15" stroke="#33691E" stroke-width="2" />
        </g>
    </defs>
    <use href="#bambooStalk" x="0" y="0" />
    <use href="#bambooStalk" x="30" y="20" transform="rotate(5, 30, 20)" />
    <use href="#bambooStalk" x="-20" y="50" transform="rotate(-5, -20, 50)" />
    <use href="#bambooStalk" x="60" y="-20" />
    <!-- Leaves -->
    <path d="M15,100 Q40,80 60,110 Q30,120 15,100 Z" fill="#7CB342" />
    <path d="M30,200 Q60,180 80,210 Q50,220 30,200 Z" fill="#7CB342" />
    <path d="M0,300 Q-30,280 -50,310 Q-20,320 0,300 Z" fill="#7CB342" />
  </g>
  
  <!-- Vegetation: Pine Trees -->
  <g transform="translate(650, 700)">
      <path d="M0,0 L-30,100 L-10,100 L-40,200 L-15,200 L-50,300 L50,300 L15,200 L40,200 L10,100 L30,100 Z" fill="#1B5E20" />
      <rect x="-10" y="300" width="20" height="50" fill="#3E2723" />
  </g>
  <g transform="translate(100, 750) scale(0.8)">
      <path d="M0,0 L-30,100 L-10,100 L-40,200 L-15,200 L-50,300 L50,300 L15,200 L40,200 L10,100 L30,100 Z" fill="#1B5E20" />
      <rect x="-10" y="300" width="20" height="50" fill="#3E2723" />
  </g>

  <!-- Rocks -->
  <path d="M150,1050 Q180,1000 220,1050 T280,1080 T220,1120 T150,1100 Z" fill="#757575" stroke="#424242" stroke-width="2"/>
  <path d="M550,1080 Q580,1030 620,1080 T680,1110 T620,1150 T550,1130 Z" fill="#757575" stroke="#424242" stroke-width="2"/>

  <!-- PAGODA CONSTRUCTION -->
  <!-- Reusable Floor Group Template would be ideal, but manual layering allows detail variation -->
  
  <!-- Floor 1 (Bottom) -->
  <g transform="translate(400, 950)">
    <!-- Foundation -->
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" stroke="#424242" />
    <!-- Pillars -->
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <!-- Wall/Window -->
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/> <!-- Window -->
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/> <!-- Window -->
    <!-- Floor slab -->
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <!-- Roof -->
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/> <!-- Eave curve -->
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/> <!-- Eave curve -->
  </g>

  <!-- Floor 2 -->
  <g transform="translate(400, 850) scale(0.9)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
  </g>

  <!-- Floor 3 -->
  <g transform="translate(400, 750) scale(0.8)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
  </g>

  <!-- Floor 4 -->
  <g transform="translate(400, 660) scale(0.7)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
  </g>

  <!-- Floor 5 -->
  <g transform="translate(400, 580) scale(0.6)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
  </g>

  <!-- Floor 6 -->
  <g transform="translate(400, 510) scale(0.5)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-120" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="40" y="-60" width="80" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/>
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
  </g>

  <!-- Floor 7 (Top) -->
  <g transform="translate(400, 450) scale(0.4)">
    <rect x="-160" y="0" width="320" height="30" fill="#9E9E9E" />
    <rect x="-150" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="140" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-80" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="70" y="-80" width="10" height="80" fill="url(#pillarRed)" />
    <rect x="-140" y="-70" width="280" height="60" fill="#B71C1C" />
    <rect x="-100" y="-60" width="200" height="40" fill="#3E2723" stroke="#FFD700" stroke-width="2"/> <!-- Door -->
    <rect x="-170" y="-90" width="340" height="10" fill="#424242" />
    <path d="M-200,-90 L200,-90 L170,-150 L-170,-150 Z" fill="url(#roofPattern)" stroke="#FFD700" stroke-width="3"/>
    <path d="M-170,-150 Q-200,-160 -210,-130 L-170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <path d="M170,-150 Q200,-160 210,-130 L170,-90" fill="none" stroke="#FFD700" stroke-width="4"/>
    <!-- Spire -->
    <rect x="-5" y="-200" width="10" height="50" fill="url(#goldGradient)" />
    <circle cx="0" cy="-210" r="8" fill="url(#goldGradient)" />
  </g>

  <!-- Lanterns -->
  <g transform="translate(220, 880)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#3E2723" stroke-width="2" />
      <rect x="-10" y="30" width="20" height="30" rx="5" fill="#D32F2F" />
      <path d="M-10,30 L0,25 L10,30" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>
  <g transform="translate(580, 880)">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#3E2723" stroke-width="2" />
      <rect x="-10" y="30" width="20" height="30" rx="5" fill="#D32F2F" />
      <path d="M-10,30 L0,25 L10,30" fill="none" stroke="#FFD700" stroke-width="2"/>
  </g>
  
  <!-- DRAGON -->
  <!-- The dragon coils around the pagoda. We draw the back segments behind, then front. -->
  <!-- To simulate coiling, we will draw segments. -->
  
  <!-- Dragon Tail (Bottom Left) -->
  <path d="M150,1100 Q100,1150 200,1150 T300,1050 T450,1000 T550,900 T600,750 T550,600" 
        fill="none" stroke="url(#dragonBody)" stroke-width="40" stroke-linecap="round" filter="url(#dropShadow)"/>
  
  <!-- Dragon Belly Highlights -->
  <path d="M150,1100 Q100,1150 200,1150 T300,1050 T450,1000 T550,900 T600,750 T550,600" 
        fill="none" stroke="#FFD700" stroke-width="10" stroke-dasharray="20,10" opacity="0.6"/>

  <!-- Dragon Scales Pattern Overlay on Body -->
  <path d="M150,1100 Q100,1150 200,1150 T300,1050 T450,1000 T550,900 T600,750 T550,600" 
        fill="none" stroke="url(#dragonScales)" stroke-width="40" opacity="0.3"/>

  <!-- Dragon Legs/Claws (Foreground) -->
  <!-- Claw gripping Floor 2 eave -->
  <g transform="translate(250, 820) rotate(-20)">
      <path d="M0,0 L-20,20 L-10,30 M0,0 L10,30 L20,20" stroke="#FFD700" stroke-width="4" fill="none" />
      <circle cx="0" cy="0" r="10" fill="#2E7D32" />
  </g>
  <!-- Claw gripping Floor 4 pillar -->
  <g transform="translate(350, 700) rotate(10)">
      <path d="M0,0 L-20,20 L-10,30 M0,0 L10,30 L20,20" stroke="#FFD700" stroke-width="4" fill="none" />
      <circle cx="0" cy="0" r="10" fill="#2E7D32" />
  </g>

  <!-- Dragon Head (Top Right/Center looking Left) -->
  <g transform="translate(550, 500) scale(1.5)">
    <!-- Mane -->
    <path d="M0,0 Q-20,-30 -40,-20 Q-30,10 -50,30 Q-20,20 0,40 Z" fill="#1B5E20" />
    <!-- Head Shape -->
    <path d="M0,0 C-20,-20 -60,-10 -80,0 C-60,10 -20,20 0,0 Z" fill="#2E7D32" />
    <!-- Snout -->
    <path d="M-80,0 Q-90,0 -100,10 L-80,10 Z" fill="#1B5E20" />
    <!-- Mouth -->
    <path d="M-80,0 L-100,5 L-80,10 Z" fill="#000" />
    <path d="M-100,5 L-95,2 L-90,5" fill="white" /> <!-- Teeth hint -->
    <!-- Eye -->
    <circle cx="-60" cy="-5" r="3" fill="#FFD700" stroke="#000" stroke-width="1"/>
    <circle cx="-61" cy="-5" r="1" fill="#000" />
    <!-- Horn -->
    <path d="M-40,-10 Q-50,-30 -30,-30" fill="none" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <!-- Whiskers -->
    <path d="M-90,5 Q-120,0 -140,20" fill="none" stroke="#FFD700" stroke-width="2" />
    <path d="M-90,5 Q-120,10 -140,-10" fill="none" stroke="#FFD700" stroke-width="2" />
  </g>

  <!-- Foreground Mist -->
  <rect x="0" y="1000" width="800" height="200" fill="url(#skyGradient)" opacity="0.3" />
  
  <!-- Decorative Path Stones -->
  <circle cx="300" cy="1050" r="15" fill="#9E9E9E" stroke="#424242" />
  <circle cx="330" cy="1060" r="18" fill="#9E9E9E" stroke="#424242" />
  <circle cx="360" cy="1040" r="14" fill="#9E9E9E" stroke="#424242" />
  
  <circle cx="500" cy="1050" r="15" fill="#9E9E9E" stroke="#424242" />
  <circle cx="530" cy="1060" r="18" fill="#9E9E9E" stroke="#424242" />
  <circle cx="560" cy="1040" r="14" fill="#9E9E9E" stroke="#424242" />

  <!-- Flowers -->
  <g transform="translate(50, 1050)">
    <circle cx="0" cy="0" r="5" fill="#FFEB3B" />
    <circle cx="5" cy="5" r="5" fill="#FF4081" />
    <circle cx="-5" cy="5" r="5" fill="#FF4081" />
    <circle cx="0" cy="10" r="5" fill="#FF4081" />
  </g>
  <g transform="translate(750, 1050)">
    <circle cx="0" cy="0" r="5" fill="#FFEB3B" />
    <circle cx="5" cy="5" r="5" fill="#FF4081" />
    <circle cx="-5" cy="5" r="5" fill="#FF4081" />
    <circle cx="0" cy="10" r="5" fill="#FF4081" />
  </g>

</svg>