<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fantasy Chinese Pagoda & Dragon</title>
    <style>
        svg { width: 100%; height: 100%; border: none; }
        body { margin: 0; padding: 0; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    </style>
</head>
<body>

<!-- Scalable Vector Graphics Definition -->
<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

    <!-- DEFS: Gradients, Filters, and Patterns -->
    <defs>
        <!-- Sky Gradient -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#87CEEB"/> <!-- Sky Blue -->
            <stop offset="100%" stop-color="#E0F7FA"/> <!-- Light Cyan -->
        </linearGradient>

        <!-- Ground Gradient -->
        <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#8D6E63"/> <!-- Earthy Brown -->
            <stop offset="100%" stop-color="#5D4037"/> <!-- Darker Brown -->
        </linearGradient>

        <!-- Metallic Gold Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFD700"/> <!-- Gold -->
            <stop offset="50%" stop-color="#FFF176"/> <!-- Yellow Highlight -->
            <stop offset="100%" stop-color="#FFA000"/> <!-- Darker Bronze -->
        </linearGradient>

        <!-- Jade/Scale Gradient -->
        <linearGradient id="jadeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2E7D32"/> <!-- Forest Green -->
            <stop offset="100%" stop-color="#1B5E20"/> <!-- Dark Green -->
        </linearGradient>

        <!-- Brick Pattern for Walls -->
        <pattern id="brickPattern" width="10" height="5" patternUnits="userSpaceOnUse">
            <rect width="10" height="5" fill="#8D6E63"/>
            <path d="M0 2.5 L10 2.5 M5 5 V0" stroke="#5D4037" stroke-width="1" fill="none"/>
        </pattern>

        <!-- Drop Shadow Filter -->
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
            <feOffset dx="0" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Mirror Pattern for Leaves -->
        <symbol id="pineNeedle" viewBox="0 0 20 20">
            <path d="M0 10 Q10 0 20 10 Q10 20 0 10 Z" fill="#2E7D32" />
        </symbol>
    </defs>

    <!-- BACKGROUND SCENE -->
    <!-- Sky & Mist -->
    <rect width="600" height="800" fill="url(#skyGrad)" />
    
    <!-- Distant Mountains (Stylized) -->
    <path d="M0,600 Q150,500 300,600 T600,600 V800 H0 Z" fill="#B2DFDB" opacity="0.5" filter="url(#dropShadow)"/>
    
    <!-- Pond / Water -->
    <ellipse cx="300" cy="750" rx="250" ry="40" fill="#4FC3F7" opacity="0.6" />

    <!-- PAGODA BASE -->
    <g transform="translate(300, 750)" id="PagodaBase">
        <!-- Foundation Stones -->
        <polygon points="-250,0 -250,-30 -150,-50 150,-50 250,-30 250,0" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
        <polygon points="-200,-30 -200,-60 200,-60 200,-30" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
        
        <!-- Pillars -->
        <rect x="-220" y="-60" width="10" height="200" fill="#D32F2F" stroke="#3E2723"/> <!-- Left -->
        <rect x="210" y="-60" width="10" height="200" fill="#D32F2F" stroke="#3E2723"/> <!-- Right -->
        <rect x="-150" y="-60" width="10" height="180" fill="#D32F2F" stroke="#3E2723"/>
        <rect x="150" y="-60" width="10" height="180" fill="#D32F2F" stroke="#3E2723"/>
        
        <!-- Central Stairway -->
        <path d="M-80,-40 L0,0 L80,-40" fill="none" stroke="#BCAAA4" stroke-width="2" stroke-dasharray="10,5"/>
        <circle cx="300" cy="710" r="5" fill="#FFC107"/> <!-- Lantern on stairs -->
    </g>

    <!-- PINE TREES (Foreground) -->
    <g id="PineTreeLeft" transform="translate(100, 750)">
        <path d="M0,0 Q10,20 5,30" stroke="#3E2723" stroke-width="8" fill="none" /> <!-- Trunk -->
        <!-- Branches -->
        <use href="#pineNeedle" transform="rotate(-20) translate(-30, -30)" />
        <use href="#pineNeedle" transform="scale(1.2) rotate(-10) translate(40, -50)" />
        <use href="#pineNeedle" transform="scale(0.8) rotate(-30) translate(-10, -70)" />
    </g>
    <g id="PineTreeRight" transform="translate(500, 750)">
         <path d="M0,0 Q-10,20 -5,30" stroke="#3E2723" stroke-width="8" fill="none" />
         <use href="#pineNeedle" transform="rotate(20) translate(30, -30)" />
         <use href="#pineNeedle" transform="scale(1.2) rotate(10) translate(-40, -50)" />
    </g>

    <!-- THE PAGODA (Built Floor by Floor) -->
    <g id="PagodaMain">
        <!-- FLOOR 1 -->
        <rect x="250" y="500" width="100" height="80" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="260" y="520" width="20" height="20" fill="#FFEB3B" stroke="#5D4037" rx="5"/> <!-- Window -->
        <rect x="320" y="520" width="20" height="20" fill="#FFEB3B" stroke="#5D4037" rx="5"/>
        <rect x="220" y="460" width="160" height="10" fill="#D32F2F" stroke="#3E2723"/>
        
        <!-- Roof 1 -->
        <path d="M150,460 L450,460 L420,430 Q300,380 180,430 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>
        <!-- Eaves Detail -->
        <path d="M180,430 Q200,410 220,430 Q240,410 260,430 Q280,410 300,430" fill="none" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>
        
        <!-- BALCONY 1 -->
        <line x1="200" y1="460" x2="400" y2="460" stroke="#8D6E63" stroke-width="2"/> <!-- Rail -->
        <line x1="220" y1="460" x2="220" y2="480" stroke="#D32F2F" stroke-width="3"/> <!-- Post -->
        <line x1="240" y1="460" x2="240" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="260" y1="460" x2="260" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="280" y1="460" x2="280" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="300" y1="460" x2="300" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="320" y1="460" x2="320" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="340" y1="460" x2="340" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="360" y1="460" x2="360" y2="480" stroke="#D32F2F" stroke-width="3"/>
        <line x1="380" y1="460" x2="380" y2="480" stroke="#D32F2F" stroke-width="3"/>

        <!-- HANGING BELL -->
        <circle cx="300" cy="485" r="5" fill="#FFA000"/>
        <path d="M300,485 L300,495" stroke="#5D4037" stroke-width="1"/>

        <!-- FLOOR 2 -->
        <rect x="260" y="420" width="80" height="80" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="270" y="440" width="15" height="15" fill="#FFEB3B" stroke="#5D4037" rx="3"/>
        <rect x="315" y="440" width="15" height="15" fill="#FFEB3B" stroke="#5D4037" rx="3"/>
        <rect x="200" y="380" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>

        <!-- Roof 2 -->
        <path d="M100,380 L500,380 L460,340 Q300,290 140,340 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>
        <path d="M140,340 Q200,310 260,340 Q320,310 380,340 Q440,310 500,340" fill="none" stroke="#FFD700" stroke-width="1" stroke-linecap="round"/>

        <!-- FLOOR 3 -->
        <rect x="270" y="350" width="60" height="60" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="200" y="310" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>
        <!-- Roof 3 -->
        <path d="M50,310 L550,310 L500,270 Q300,220 100,270 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>
        
        <!-- FLOOR 4 -->
        <rect x="280" y="290" width="40" height="50" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="200" y="250" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>
        <!-- Roof 4 -->
        <path d="M0,250 L600,250 L540,210 Q300,160 60,210 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>

        <!-- FLOOR 5 -->
        <rect x="290" y="240" width="20" height="40" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="200" y="200" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>
        <!-- Roof 5 -->
        <path d="M-50,200 L650,200 L580,160 Q300,110 10,160 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>

        <!-- FLOOR 6 -->
        <rect x="295" y="200" width="10" height="30" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="200" y="160" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>
        <!-- Roof 6 -->
        <path d="M-80,160 L680,160 L600,120 Q300,70 20,120 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>

        <!-- FLOOR 7 (Top Tier) -->
        <rect x="300" y="170" width="5" height="25" fill="url(#brickPattern)" stroke="#3E2723" stroke-width="2"/>
        <rect x="200" y="130" width="200" height="10" fill="#D32F2F" stroke="#3E2723"/>
        <!-- Roof 7 -->
        <path d="M-100,130 L700,130 L620,90 Q300,40 -20,90 Z" fill="#546E7A" stroke="#1B5E20" stroke-width="2"/>
    </g>

    <!-- FINIAL (Top) -->
    <g transform="translate(300, 40)" filter="url(#dropShadow)">
        <circle cx="0" cy="0" r="5" fill="url(#goldGrad)" />
        <path d="M0,0 L0,-10 M-5,-5 L5,-5" stroke="#FFA000" stroke-width="2" />
        <path d="M0,0 L0,-25" stroke="#FFD700" stroke-width="2" stroke-dasharray="2,2"/>
    </g>

    <!-- THE DRAGON -->
    <!-- Note: Drawn 'behind' some roofs to create depth, but head is in front -->
    <g id="Dragon" transform="translate(0,0)">
        
        <!-- BODY (Winding) -->
        <!-- Using a gradient to simulate scale shimmer along the length -->
        <path d="M100,700 
                 C150,650 150,500 200,450 
                 C240,410 280,450 300,500 
                 C320,550 250,500 200,450 
                 C180,420 220,400 240,430
                 C260,460 300,450 320,420
                 C330,400 380,420 400,450
                 C420,480 350,450 320,420
                 C300,400 340,380 360,410
                 C380,440 420,450 450,420
                 C470,400 500,450 520,400
                 C540,350 480,300 500,250
                 C510,230 520,240 510,200
                 C500,150 450,180 430,200
                 C420,210 440,200 450,180
                 C470,140 400,150 380,180
                 C370,190 390,190 380,180
                 C370,170 350,180 340,170
                 C330,160 360,150 350,140
                 C340,130 370,120 360,110
                 C350,100 400,80 380,90" 
                 fill="url(#jadeGrad)" stroke="#1B5E20" stroke-width="3" />
        
        <!-- Belly Plates (Pattern under body) -->
        <path d="M100,700 
                 C150,650 150,500 200,450 
                 C240,410 280,450 300,500 
                 C320,550 250,500 200,450 
                 C180,420 220,400 240,430
                 C260,460 300,450 320,420
                 C330,400 380,420 400,450
                 C420,480 350,450 320,420
                 C300,400 340,380 360,410
                 C380,440 420,450 450,420
                 C470,400 500,450 520,400
                 C540,350 480,300 500,250
                 C510,230 520,240 510,200
                 C500,150 450,180 430,200
                 C420,210 440,200 450,180
                 C470,140 400,150 380,180
                 C370,190 390,190 380,180
                 C370,170 350,180 340,170
                 C330,160 360,150 350,140
                 C340,130 370,120 360,110
                 C350,100 400,80 380,90" 
                 fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,2" opacity="0.5"/>

        <!-- Legs/Paws gripping the building -->
        <path d="M400,400 Q430,380 450,390" stroke="#D32F2F" stroke-width="4" fill="none"/>
        <path d="M350,210 Q380,220 390,210" stroke="#D32F2F" stroke-width="4" fill="none"/>
        
        <!-- TAIL Tip -->
        <path d="M50,720 Q20,750 40,780" stroke="#1B5E20" stroke-width="3" fill="none"/>
        
        <!-- HEAD -->
        <!-- Snout -->
        <path d="M380,100 L390,80 L360,70 Z" fill="#FFCC80" />
        <!-- Jaw -->
        <path d="M360,70 L340,80 Q320,80 310,85" fill="#FFF9C4" />
        <!-- Face Mask -->
        <path d="M380,100 L410,90 L390,120 L380,110 L360,100" fill="#FFC107" />
        
        <!-- Eyes (Fierce) -->
        <circle cx="395" cy="92" r="3" fill="#000" /> <!-- Red pupil simulated by dark shadow -->
        <circle cx="395" cy="92" r="1" fill="#FFF" />
        
        <!-- Horns/Antlers -->
        <path d="M385,85 L380,60" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M385,85 L390,55" stroke="#FFF" stroke-width="2" fill="none" stroke-linecap="round"/>
        
        <!-- Whiskers -->
        <path d="M360,80 L340,70" stroke="#000" stroke-width="1" opacity="0.6"/>
        <path d="M360,85 L330,85" stroke="#000" stroke-width="1" opacity="0.6"/>
        <path d="M360,80 L330,75" stroke="#000" stroke-width="1" opacity="0.6"/>
        
        <!-- Mane (Hair flowing back) -->
        <path d="M370,80 Q350,80 330,70 M375,80 Q355,85 335,90 M370,90 Q350,90 320,80" stroke="#D32F2F" stroke-width="3" fill="none" opacity="0.8"/>
        <path d="M375,90 Q355,95 335,100" stroke="#D32F2F" stroke-width="2" fill="none" opacity="0.6"/>

        <!-- Dragon Aura/Fire Breath -->
        <path d="M390,80 L420,70 L390,85" fill="url(#goldGrad)" opacity="0.6">
             <animateTransform attributeName="transform" type="scale" values="1 1; 1.2 1.2; 1 1" dur="0.5s" repeatCount="indefinite"/>
        </path>

    </g>

    <!-- OVERLAY ELEMENTS -->
    <!-- Cloaks / Ribbons -->
    <path d="M250,550 Q300,520 350,540" stroke="#FF5722" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M450,300 Q400,280 350,290" stroke="#FF5722" stroke-width="3" fill="none" opacity="0.7"/>

    <!-- Decorative Cloud Motifs (Floating) -->
    <path d="M50,50 Q70,30 90,50 T130,50 Q110,70 90,70 T50,50" fill="none" stroke="#FFF" stroke-width="1" opacity="0.4"/>
    <path d="M450,60 Q470,40 490,60 T530,60 Q510,80 490,80 T450,60" fill="none" stroke="#FFF" stroke-width="1" opacity="0.4"/>
    <path d="M550,600 Q570,580 590,600" fill="none" stroke="#FFF" stroke-width="2" opacity="0.2" stroke-dasharray="5,5"/>
    
    <!-- Final Atmospheric Overlay -->
    <radialGradient id="centerSpotlight" cx="50%" cy="50%" r="50%">
        <stop offset="0%" style="stop-color:white;stop-opacity:0.3" />
        <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </radialGradient>
    <circle cx="300" cy="400" r="200" fill="url(#centerSpotlight)" pointer-events="none" />
    
    <!-- Ornamental Corner Markers -->
    <circle cx="50" cy="50" r="3" fill="#D32F2F" opacity="0.5"/>
    <circle cx="550" cy="50" r="3" fill="#D32F2F" opacity="0.5"/>
    <circle cx="50" cy="750" r="3" fill="#D32F2F" opacity="0.5"/>
    <circle cx="550" cy="750" r="3" fill="#D32F2F" opacity="0.5"/>

</svg>
</body>
</html>