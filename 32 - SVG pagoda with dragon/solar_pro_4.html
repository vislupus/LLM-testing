<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chinese Pagoda & Dragon Garden</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a2e;
    font-family: sans-serif;
    overflow: hidden;
  }
  .container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  svg {
    max-width: 100%;
    max-height: 100%;
    filter: drop-shadow(0 0 40px rgba(0,0,0,0.3));
  }
</style>
</head>
<body>
<div class="container">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="40%" stop-color="#3a5a7a"/>
      <stop offset="70%" stop-color="#c8a060"/>
      <stop offset="100%" stop-color="#e8c878"/>
    </linearGradient>
    
    <!-- Sun/moon glow -->
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffe8a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffdd80" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Pond gradient -->
    <radialGradient id="pondGrad" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#4a8a9a"/>
      <stop offset="50%" stop-color="#2a5a6a"/>
      <stop offset="100%" stop-color="#1a3a4a"/>
    </radialGradient>
    
    <!-- Rock gradient -->
    <linearGradient id="rockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a6a5a"/>
      <stop offset="50%" stop-color="#4a4a3a"/>
      <stop offset="100%" stop-color="#3a3a2a"/>
    </linearGradient>
    
    <linearGradient id="rockGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a5a4a"/>
      <stop offset="50%" stop-color="#3a3a2a"/>
      <stop offset="100%" stop-color="#2a2a1a"/>
    </linearGradient>
    
    <!-- Pagoda wood gradient -->
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a3a1a"/>
      <stop offset="50%" stop-color="#7a4a2a"/>
      <stop offset="100%" stop-color="#5a3a1a"/>
    </linearGradient>
    
    <!-- Pagoda red gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a1a1a"/>
      <stop offset="30%" stop-color="#c82828"/>
      <stop offset="70%" stop-color="#a82020"/>
      <stop offset="100%" stop-color="#8a1a1a"/>
    </linearGradient>
    
    <!-- Roof gradient -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="40%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    
    <!-- Green roof tile gradient -->
    <linearGradient id="greenRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a3a"/>
      <stop offset="50%" stop-color="#1a4a2a"/>
      <stop offset="100%" stop-color="#0a3a1a"/>
    </linearGradient>
    
    <!-- Gold gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a030"/>
      <stop offset="50%" stop-color="#f0d050"/>
      <stop offset="100%" stop-color="#b88820"/>
    </linearGradient>
    
    <!-- Dragon body gradient -->
    <linearGradient id="dragonBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a7a5a"/>
      <stop offset="50%" stop-color="#1a5a4a"/>
      <stop offset="100%" stop-color="#0a3a2a"/>
    </linearGradient>
    
    <linearGradient id="dragonBelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9a6a"/>
      <stop offset="100%" stop-color="#2a6a4a"/>
    </linearGradient>
    
    <!-- Bamboo gradient -->
    <linearGradient id="bambooGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a6a2a"/>
      <stop offset="50%" stop-color="#4a8a3a"/>
      <stop offset="100%" stop-color="#3a6a2a"/>
    </linearGradient>
    
    <!-- Pine gradient -->
    <linearGradient id="pineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a5a2a"/>
      <stop offset="100%" stop-color="#1a3a1a"/>
    </linearGradient>
    
    <!-- Mist gradient -->
    <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b898" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c8b898" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c8b898" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Scale pattern for dragon -->
    <pattern id="dragonScales" width="10" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M0,8 Q5,0 10,8" fill="none" stroke="#0a3a2a" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    
    <!-- Tile pattern -->
    <pattern id="roofTiles" width="8" height="6" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="0.3"/>
      <line x1="0" y1="5" x2="8" y2="5" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
    
    <pattern id="greenTiles" width="8" height="6" patternUnits="userSpaceOnUse">
      <rect width="8" height="5" fill="#1a5a2a" stroke="#0a3a1a" stroke-width="0.3"/>
      <line x1="0" y1="5" x2="8" y2="5" stroke="#0a2a1a" stroke-width="0.5"/>
    </pattern>
    
    <!-- Claw gradient -->
    <linearGradient id="clawGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a5a4a"/>
      <stop offset="100%" stop-color="#0a3a2a"/>
    </linearGradient>
    
    <!-- Flower gradient -->
    <radialGradient id="flowerPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff8aae"/>
      <stop offset="100%" stop-color="#d44a7a"/>
    </radialGradient>
    <radialGradient id="flowerRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="100%" stop-color="#b02020"/>
    </radialGradient>
    <radialGradient id="flowerWhite" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff8f0"/>
      <stop offset="100%" stop-color="#e0c8b0"/>
    </radialGradient>
    <radialGradient id="flowerYellow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe860"/>
      <stop offset="100%" stop-color="#c8a020"/>
    </radialGradient>
    
    <!-- Lantern glow -->
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff6a30" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff4a10" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff4a10" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Window glow -->
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffcc40" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#cc8820" stop-opacity="0.2"/>
    </radialGradient>
    
    <!-- Cloud filter -->
    <filter id="cloudSoft">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    
    <filter id="mistSoft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  
  <!-- ===== BACKGROUND SKY ===== -->
  <rect width="800" height="1000" fill="url(#sky)"/>
  
  <!-- Sun glow -->
  <circle cx="650" cy="150" r="180" fill="url(#sunGlow)"/>
  <circle cx="650" cy="150" r="35" fill="#fff8d0" opacity="0.8"/>
  
  <!-- ===== CLOUDS ===== -->
  <g filter="url(#cloudSoft)" opacity="0.6">
    <!-- Cloud 1 -->
    <g fill="#e8d8b8">
      <ellipse cx="100" cy="80" rx="60" ry="20"/>
      <ellipse cx="140" cy="70" rx="50" ry="18"/>
      <ellipse cx="70" cy="90" rx="40" ry="15"/>
    </g>
    <!-- Cloud 2 -->
    <g fill="#d8c8a8">
      <ellipse cx="350" cy="50" rx="70" ry="18"/>
      <ellipse cx="400" cy="40" rx="55" ry="15"/>
      <ellipse cx="310" cy="55" rx="45" ry="14"/>
    </g>
    <!-- Cloud 3 -->
    <g fill="#e0d0b0" opacity="0.5">
      <ellipse cx="600" cy="60" rx="65" ry="16"/>
      <ellipse cx="640" cy="50" rx="50" ry="14"/>
    </g>
    <!-- Cloud 4 - lower -->
    <g fill="#c8b898" opacity="0.4">
      <ellipse cx="200" cy="200" rx="80" ry="15"/>
      <ellipse cx="240" cy="195" rx="60" ry="12"/>
    </g>
    <!-- Cloud 5 -->
    <g fill="#d0c0a0" opacity="0.35">
      <ellipse cx="550" cy="180" rx="70" ry="14"/>
      <ellipse cx="590" cy="175" rx="50" ry="11"/>
    </g>
  </g>
  
  <!-- ===== MIST ===== -->

  </g>
  
  <!-- ===== GROUND ===== -->
  <path d="M0,650 Q200,620 400,640 Q600,630 800,650 L800,1000 L0,1000 Z" fill="#2a4a1a"/>
  <path d="M0,680 Q200,660 400,670 Q600,660 800,680 L800,1000 L0,1000 Z" fill="#1a3a0a"/>
  
  <!-- Ground texture - subtle -->
  <g opacity="0.15" stroke="#3a6a2a" stroke-width="0.5">
    <line x1="50" y1="700" x2="55" y2="690"/>
    <line x1="120" y1="720" x2="125" y2="710"/>
    <line x1="250" y1="710" x2="255" y2="700"/>

    <line x1="600" y1="790" x2="605" y2="780"/>
  </g>
  
  <!-- ===== PATHWAY ===== -->
  <g>
    <!-- Main path -->
    <path d="M390,680 Q395,750 400,850 Q405,920 410,1000" stroke="#8a7a5a" stroke-width="28" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M390,680 Q395,750 400,850 Q405,920 410,1000" stroke="#9a8a6a" stroke-width="22" fill="none" opacity="0.4" stroke-linecap="round"/>
    <!-- Path stones -->
    <ellipse cx="400" cy="720" rx="15" ry="6" fill="#7a6a4a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="400" cy="760" rx="14" ry="5" fill="#6a5a3a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="400" cy="800" rx="16" ry="6" fill="#8a7a5a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="400" cy="850" rx="15" ry="5" fill="#7a6a4a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="400" cy="900" rx="17" ry="6" fill="#6a5a3a" stroke="#5a4a3a" stroke-width="0.5"/>
    <!-- Side path stones -->
    <ellipse cx="360" cy="730" rx="10" ry="4" fill="#7a6a4a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="440" cy="770" rx="11" ry="4" fill="#6a5a3a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="355" cy="830" rx="10" ry="4" fill="#8a7a5a" stroke="#5a4a3a" stroke-width="0.5"/>
    <ellipse cx="445" cy="870" rx="12" ry="4" fill="#7a6a4a" stroke="#5a4a3a" stroke-width="0.5"/>
  </g>
  
  <!-- ===== POND ===== -->
  <g>
    <ellipse cx="180" cy="880" rx="130" ry="40" fill="url(#pondGrad)"/>
    <ellipse cx="180" cy="878" rx="125" ry="36" fill="#3a7a8a" opacity="0.4"/>
    <!-- Pond edge -->
    <ellipse cx="180" cy="880" rx="132" ry="42" fill="none" stroke="#5a4a3a" stroke-width="2" opacity="0.5"/>
    <!-- Ripples -->
    <ellipse cx="180" cy="880" rx="90" ry="26" fill="none" stroke="#8ab8c8" stroke-width="0.5" opacity="0.3"/>
    <ellipse cx="180" cy="880" rx="55" ry="16" fill="none" stroke="#8ab8c8" stroke-width="0.5" opacity="0.25"/>
    <ellipse cx="180" cy="880" rx="20" ry="6" fill="none" stroke="#8ab8c8" stroke-width="0.5" opacity="0.2"/>
    <!-- Lily pads -->
    <g fill="#2a6a2a" opacity="0.8">
      <ellipse cx="150" cy="872" rx="10" ry="4" transform="rotate(-15,150,872)"/>
      <ellipse cx="210" cy="885" rx="9" ry="3.5" transform="rotate(20,210,885)"/>
      <ellipse cx="170" cy="890" rx="7" ry="3" transform="rotate(-10,170,890)"/>
    </g>
    <!-- Lotus flowers -->
    <g>
      <circle cx="150" cy="868" r="4" fill="url(#flowerPink)"/>
      <circle cx="148" cy="866" r="2.5" fill="#ffa0c0"/>
      <circle cx="210" cy="882" r="3.5" fill="url(#flowerWhite)"/>
      <circle cx="208" cy="880" r="2" fill="#fff8f0"/>
    </g>
    <!-- Pond reflection of pagoda -->
    <g opacity="0.12" transform="translate(0,1760) scale(1,-1)">
      <rect x="360" y="200" width="80" height="400" rx="2" fill="#8a1a1a"/>
      <rect x="370" y="200" width="60" height="400" rx="1" fill="#c82828"/>
    </g>
  </g>
  
  <!-- ===== ROCKS ===== -->
  <g>
    <!-- Large rock left foreground -->
    <g>
      <path d="M60,920 Q40,880 70,840 Q100,810 140,820 Q180,830 170,870 Q160,910 130,930 Q90,945 60,920 Z" fill="url(#rockGrad)" stroke="#3a3a2a" stroke-width="1.5"/>

      <path d="M100,910 Q115,905 130,910" stroke="#2a6a1a" stroke-width="2" fill="none" opacity="0.5"/>
      <!-- Small plant on rock -->
      <g stroke="#3a7a2a" stroke-width="1.5" fill="none">
        <path d="M110,855 Q108,840 112,830"/>
        <path d="M112,830 Q118,825 122,830"/>
        <path d="M112,830 Q106,825 102,830"/>
      </g>
    </g>
    
    <!-- Rock right -->
    <g>
      <path d="M660,930 Q640,890 670,850 Q700,820 740,830 Q780,840 770,880 Q760,920 730,940 Q690,950 660,930 Z" fill="url(#rockGrad2)" stroke="#2a2a1a" stroke-width="1.5"/>
      <path d="M680,880 Q710,860 740,870" stroke="#6a6a5a" stroke-width="1" fill="none" opacity="0.4"/>
      <!-- Moss -->
      <path d="M675,870 Q690,865 705,870 Q715,875 725,868" stroke="#3a7a2a" stroke-width="2.5" fill="none" opacity="0.6"/>
      <!-- Small ferns -->
      <g stroke="#2a6a1a" stroke-width="1.2" fill="none">
        <path d="M720,865 Q725,850 722,840"/>
        <path d="M722,840 Q728,837 732,842"/>
        <path d="M722,840 Q716,837 712,842"/>
      </g>
    </g>
    
    <!-- Small rock near pond -->
    <g>
      <path d="M300,890 Q290,870 310,855 Q330,848 340,860 Q345,875 335,885 Q320,892 300,890 Z" fill="#5a5a4a" stroke="#3a3a2a" stroke-width="0.8"/>
      <path d="M305,882 Q320,875 335,880" stroke="#6a6a5a" stroke-width="0.5" fill="none" opacity="0.4"/>
    </g>
  </g>
  
  <!-- ===== BAMBOO ===== -->
  <g>
    <!-- Bamboo cluster left -->
    <g>
      <!-- Stalk 1 -->
      <g>
        <rect x="42" y="650" width="10" height="300" fill="url(#bambooGrad)" stroke="#1a3a0a" stroke-width="0.5" rx="4"/>
        <g stroke="#1a3a0a" stroke-width="1.5" fill="none">
          <line x1="40" y1="680" x2="54" y2="680"/>
          <line x1="40" y1="720" x2="54" y2="720"/>
          <line x1="40" y1="760" x2="54" y2="760"/>

          <line x1="40" y1="840" x2="54" y2="840"/>
          <line x1="40" y1="880" x2="54" y2="880"/>
          <line x1="40" y1="920" x2="54" y2="920"/>
        </g>
        <g fill="#2a5a1a" stroke="#1a3a0a" stroke-width="0.5">
          <ellipse cx="47" cy="680" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="720" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="760" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="800" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="840" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="880" rx="6" ry="2.5"/>
          <ellipse cx="47" cy="920" rx="6" ry="2.5"/>
        </g>
        <!-- Leaves -->
        <g fill="#3a8a2a" stroke="#1a4a1a" stroke-width="0.5">
          <path d="M52,665 Q80,640 75,650 Q65,658 52,665 Z"/>
          <path d="M52,700 Q85,675 80,685 Q68,693 52,700 Z"/>
          <path d="M42,740 Q15,715 20,725 Q30,733 42,740 Z"/>
          <path d="M52,780 Q80,755 75,765 Q65,773 52,780 Z"/>
          <path d="M42,820 Q18,795 23,805 Q32,813 42,820 Z"/>

      </g>
      
      <!-- Stalk 2 -->
      <g>
        <rect x="72" y="660" width="9" height="290" fill="url(#bambooGrad)" stroke="#1a3a0a" stroke-width="0.5" rx="3.5"/>
        <g stroke="#1a3a0a" stroke-width="1.3" fill="none">
          <line x1="70" y1="690" x2="82" y2="690"/>
          <line x1="70" y1="730" x2="82" y2="730"/>
          <line x1="70" y1="770" x2="82" y2="770"/>
          <line x1="70" y1="810" x2="82" y2="810"/>
          <line x1="70" y1="850" x2="82" y2="850"/>
          <line x1="70" y1="890" x2="82" y2="890"/>
          <line x1="70" y1="930" x2="82" y2="930"/>
        </g>
        <g fill="#2a5a1a" stroke="#1a3a0a" stroke-width="0.5">
          <ellipse cx="76.5" cy="690" rx="5.5" ry="2.2"/>
          <ellipse cx="76.5" cy="730" rx="5.5" ry="2.2"/>
          <ellipse cx="76.5" cy="770" rx="5.5" ry="2.2"/>
          <ellipse cx="76.5" cy="810" rx="5.5" ry="2.2"/>
          <ellipse cx="76.5" cy="850" rx="5.5" ry="2.2"/>

        <g fill="#3a8a2a" stroke="#1a4a1a" stroke-width="0.5">
          <path d="M81,675 Q108,650 103,660 Q92,668 81,675 Z"/>
          <path d="M71,710 Q45,685 50,695 Q58,703 71,710 Z"/>
          <path d="M81,750 Q105,725 100,735 Q88,743 81,750 Z"/>
          <path d="M71,790 Q42,765 47,775 Q55,783 71,790 Z"/>
          <path d="M81,830 Q108,805 103,815 Q92,823 81,830 Z"/>
          <path d="M71,870 Q48,845 53,855 Q60,863 71,870 Z"/>
        </g>
      </g>
    </g>
    
    <!-- Bamboo cluster right -->
    <g>
      <g>
        <rect x="655" y="655" width="10" height="295" fill="url(#bambooGrad)" stroke="#1a3a0a" stroke-width="0.5" rx="4"/>
        <g stroke="#1a3a0a" stroke-width="1.5" fill="none">
          <line x1="653" y1="685" x2="667" y2="685"/>
          <line x1="653" y1="725" x2="667" y2="725"/>
          <line x1="653" y1="765" x2="667" y2="765"/>
          <line x1="653" y1="805" x2="667" y2="805"/>
          <line x1="653" y1="845" x2="667" y2="845"/>
          <line x1="653" y1="885" x2="667" y2="885"/>
          <line x1="653" y1="925" x2="667" y2="925"/>
        </g>
        <g fill="#2a5a1a" stroke="#1a3a0a" stroke-width="0.5">
          <ellipse cx="660" cy="685" rx="6" ry="2.5"/>
          <ellipse cx="660" cy="725" rx="6" ry="2.5"/>
