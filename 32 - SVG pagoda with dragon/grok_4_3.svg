<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <!-- Gradients and patterns -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#3a6a8c"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="50%" stop-color="#B22222"/>
      <stop offset="100%" stop-color="#5C0000"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a0000"/>
      <stop offset="50%" stop-color="#8B0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3317"/>
    </linearGradient>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="50%" stop-color="#228B22"/>
      <stop offset="100%" stop-color="#006400"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <pattern id="mist" patternUnits="userSpaceOnUse" width="200" height="100">
      <path d="M0,50 Q50,30 100,50 Q150,70 200,50" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="40"/>
    </pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="3" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky and background -->
  <rect width="1200" height="900" fill="url(#skyGrad)"/>
  
  <!-- Distant mountains -->
  <path d="M0,420 Q200,280 400,400 Q600,300 800,420 Q1000,320 1200,420 L1200,500 L0,500 Z" fill="#2a4a5c" opacity="0.6"/>
  <path d="M0,450 Q300,350 550,440 Q800,340 1200,450 L1200,520 L0,520 Z" fill="#3a5a6c" opacity="0.5"/>

  <!-- Mist layers -->
  <rect x="0" y="380" width="1200" height="200" fill="url(#mist)"/>
  <rect x="0" y="520" width="1200" height="120" fill="url(#mist)"/>

  <!-- Garden ground -->
  <rect x="0" y="620" width="1200" height="280" fill="#2E5A2E"/>

  <!-- Decorative stone pathway -->
  <path d="M580,620 Q600,720 620,900" fill="none" stroke="#A9A9A9" stroke-width="28" stroke-opacity="0.7"/>
  <path d="M580,620 Q600,720 620,900" fill="none" stroke="#D3D3D3" stroke-width="18" stroke-opacity="0.9"/>

  <!-- Pond -->
  <ellipse cx="280" cy="720" rx="160" ry="70" fill="url(#waterGrad)" stroke="#1a5276" stroke-width="4"/>
  <ellipse cx="280" cy="715" rx="120" ry="45" fill="#ffffff" opacity="0.25"/>

  <!-- Pine trees (left side) -->
  <g>
    <path d="M120,620 L80,480 L160,480 Z" fill="#1a472a"/>
    <path d="M120,580 L70,440 L170,440 Z" fill="#234d2e"/>
    <path d="M120,540 L90,420 L150,420 Z" fill="#2d5c36"/>
    <rect x="110" y="600" width="20" height="30" fill="#5C3317"/>
  </g>
  <g>
    <path d="M180,620 L140,510 L220,510 Z" fill="#1a472a"/>
    <path d="M180,570 L130,460 L230,460 Z" fill="#234d2e"/>
    <rect x="170" y="600" width="20" height="25" fill="#5C3317"/>
  </g>

  <!-- Bamboo (right side) -->
  <g>
    <rect x="980" y="480" width="7" height="150" fill="#3a7a3a"/>
    <rect x="995" y="460" width="6" height="170" fill="#2d6a2d"/>
    <rect x="1008" y="490" width="7" height="140" fill="#3a7a3a"/>
    <!-- Leaves -->
    <path d="M980,510 Q965,495 975,480" fill="none" stroke="#2d6a2d" stroke-width="4"/>
    <path d="M995,520 Q1015,505 1008,485" fill="none" stroke="#2d6a2d" stroke-width="4"/>
    <path d="M1010,530 Q1025,515 1018,495" fill="none" stroke="#2d6a2d" stroke-width="4"/>
  </g>

  <!-- Rocks -->
  <ellipse cx="80" cy="650" rx="55" ry="30" fill="#555555"/>
  <ellipse cx="95" cy="635" rx="35" ry="20" fill="#6a6a6a"/>
  <ellipse cx="1050" cy="660" rx="70" ry="35" fill="#555555"/>
  <ellipse cx="1070" cy="645" rx="40" ry="22" fill="#6a6a6a"/>

  <!-- Flowers -->
  <g>
    <circle cx="420" cy="680" r="8" fill="#C41E3A"/>
    <circle cx="435" cy="675" r="6" fill="#FF6B6B"/>
    <circle cx="450" cy="682" r="7" fill="#C41E3A"/>
  </g>
  <g>
    <circle cx="880" cy="695" r="7" fill="#FFD700"/>
    <circle cx="895" cy="688" r="5" fill="#FFA500"/>
  </g>

  <!-- PAGODA (8 floors, symmetrical) -->
  <g id="pagoda">
    <!-- Base platform -->
    <rect x="480" y="580" width="240" height="45" fill="#4a3728" rx="4"/>
    <rect x="485" y="575" width="230" height="12" fill="#6b5138"/>

    <!-- Floor 8 (top) -->
    <g>
      <!-- Roof 8 -->
      <path d="M540,340 Q600,295 660,340" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M545,340 Q600,310 655,340" fill="none" stroke="#FFD700" stroke-width="2"/>
      <!-- Tier body -->
      <rect x="555" y="340" width="90" height="32" fill="url(#woodGrad)"/>
      <!-- Windows -->
      <rect x="575" y="348" width="14" height="18" fill="#2a2a2a"/>
      <rect x="610" y="348" width="14" height="18" fill="#2a2a2a"/>
    </g>

    <!-- Floor 7 -->
    <g>
      <path d="M515,375 Q600,325 685,375" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M520,375 Q600,340 680,375" fill="none" stroke="#FFD700" stroke-width="2"/>
      <rect x="530" y="375" width="140" height="35" fill="url(#woodGrad)"/>
      <rect x="555" y="382" width="18" height="22" fill="#2a2a2a"/>
      <rect x="587" y="382" width="18" height="22" fill="#2a2a2a"/>
      <rect x="619" y="382" width="18" height="22" fill="#2a2a2a"/>
    </g>

    <!-- Floor 6 -->
    <g>
      <path d="M495,415 Q600,360 705,415" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M500,415 Q600,375 700,415" fill="none" stroke="#FFD700" stroke-width="2"/>
      <rect x="510" y="415" width="180" height="38" fill="url(#woodGrad)"/>
      <rect x="535" y="423" width="20" height="24" fill="#2a2a2a"/>
      <rect x="570" y="423" width="20" height="24" fill="#2a2a2a"/>
      <rect x="605" y="423" width="20" height="24" fill="#2a2a2a"/>
      <rect x="640" y="423" width="20" height="24" fill="#2a2a2a"/>
    </g>

    <!-- Floor 5 -->
    <g>
      <path d="M475,460 Q600,400 725,460" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M480,460 Q600,415 720,460" fill="none" stroke="#FFD700" stroke-width="2"/>
      <rect x="490" y="460" width="220" height="42" fill="url(#woodGrad)"/>
      <rect x="515" y="468" width="22" height="26" fill="#2a2a2a"/>
      <rect x="552" y="468" width="22" height="26" fill="#2a2a2a"/>
      <rect x="589" y="468" width="22" height="26" fill="#2a2a2a"/>
      <rect x="626" y="468" width="22" height="26" fill="#2a2a2a"/>
      <rect x="663" y="468" width="22" height="26" fill="#2a2a2a"/>
    </g>

    <!-- Floor 4 -->
    <g>
      <path d="M460,510 Q600,445 740,510" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M465,510 Q600,460 735,510" fill="none" stroke="#FFD700" stroke-width="2"/>
      <rect x="475" y="510" width="250" height="45" fill="url(#woodGrad)"/>
    </g>

    <!-- Floor 3 -->
    <g>
      <path d="M450,560 Q600,495 750,560" fill="url(#roofGrad)" stroke="#3a0000" stroke-width="3"/>
      <path d="M455,560 Q600,510 745,560" fill="none" stroke="#FFD700" stroke-width="2"/>
      <rect x="465" y="560" width="270" height="25" fill="url(#woodGrad)"/>
    </g>

    <!-- Main body floors 1-2 -->
    <rect x="470" y="580" width="260" height="50" fill="url(#woodGrad)"/>
    <!-- Balconies -->
    <rect x="465" y="555" width="270" height="8" fill="#5C3317"/>
    <rect x="475" y="530" width="250" height="8" fill="#5C3317"/>

    <!-- Decorative lanterns -->
    <g>
      <ellipse cx="510" cy="425" rx="8" ry="12" fill="#FFD700"/>
      <ellipse cx="690" cy="425" rx="8" ry="12" fill="#FFD700"/>
      <ellipse cx="510" cy="475" rx="7" ry="10" fill="#FFD700"/>
      <ellipse cx="690" cy="475" rx="7" ry="10" fill="#FFD700"/>
    </g>
  </g>

  <!-- DRAGON coiling around pagoda -->
  <g id="dragon" filter="url(#shadow)">
    <!-- Body (serpentine) -->
    <path d="M720,310 Q780,280 820,340 Q860,400 800,460 Q740,510 820,570 Q880,630 820,700 Q760,760 830,820" 
          fill="none" stroke="url(#dragonGrad)" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Scales -->
    <path d="M735,330 Q760,320 785,335" fill="none" stroke="#1a5c1a" stroke-width="3"/>
    <path d="M755,380 Q780,370 805,385" fill="none" stroke="#1a5c1a" stroke-width="3"/>
    <path d="M775,430 Q800,420 825,435" fill="none" stroke="#1a5c1a" stroke-width="3"/>
    <path d="M795,480 Q820,470 845,485" fill="none" stroke="#1a5c1a" stroke-width="3"/>
    <path d="M815,530 Q840,520 865,535" fill="none" stroke="#1a5c1a" stroke-width="3"/>

    <!-- Head -->
    <ellipse cx="720" cy="305" rx="32" ry="26" fill="#2E8B57" transform="rotate(-25 720 305)"/>
    <!-- Horns -->
    <path d="M705,282 L695,255 L710,280" fill="none" stroke="#1a5c1a" stroke-width="5"/>
    <path d="M735,282 L745,255 L730,280" fill="none" stroke="#1a5c1a" stroke-width="5"/>
    <!-- Eye -->
    <ellipse cx="705" cy="300" rx="6" ry="8" fill="#FFD700"/>
    <!-- Whiskers -->
    <path d="M690,305 Q670,295 655,310" fill="none" stroke="#FFD700" stroke-width="2"/>
    <path d="M690,312 Q665,320 650,305" fill="none" stroke="#FFD700" stroke-width="2"/>
    <!-- Mouth detail -->
    <path d="M695,318 Q705,325 715,318" fill="none" stroke="#1a5c1a" stroke-width="3"/>

    <!-- Claws -->
    <path d="M820,700 Q810,720 830,735" fill="none" stroke="#1a5c1a" stroke-width="6"/>
    <path d="M820,700 Q835,718 825,740" fill="none" stroke="#1a5c1a" stroke-width="6"/>
    <path d="M830,820 Q820,845 835,860" fill="none" stroke="#1a5c1a" stroke-width="6"/>

    <!-- Flowing mane -->
    <path d="M720,290 Q740,265 770,285" fill="none" stroke="#FFD700" stroke-width="8" stroke-opacity="0.9"/>
    <path d="M725,295 Q755,275 785,300" fill="none" stroke="#FFD700" stroke-width="6" stroke-opacity="0.85"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.25">
    <ellipse cx="200" cy="180" rx="90" ry="35"/>
    <ellipse cx="280" cy="165" rx="70" ry="28"/>
    <ellipse cx="950" cy="200" rx="110" ry="38"/>
    <ellipse cx="1030" cy="185" rx="75" ry="30"/>
  </g>

  <!-- Small decorative elements on pagoda -->
  <g fill="#FFD700">
    <circle cx="600" cy="305" r="5"/>
    <circle cx="600" cy="365" r="4"/>
    <circle cx="600" cy="410" r="4"/>
    <circle cx="600" cy="460" r="4"/>
  </g>
</svg>