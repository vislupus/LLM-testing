<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seven-Story Pagoda &amp; Celestial Dragon — SVG Illustration</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    :root {
      --ink: #1a1520;
      --paper: #f4efe6;
      --gold: #c9a227;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 120% 80% at 50% 0%, #2a1f3d 0%, #0f0c14 55%, #07060a 100%);
      color: var(--paper);
      font-family: "Songti SC", "STSong", "Noto Serif SC", "Times New Roman", serif;
    }
    .frame {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 2.5rem;
    }
    .title-block {
      text-align: center;
      margin-bottom: 1rem;
      letter-spacing: 0.12em;
    }
    .title-block h1 {
      font-size: clamp(1.1rem, 2.5vw, 1.65rem);
      font-weight: 600;
      margin: 0;
      color: #f3e6c8;
      text-shadow: 0 0 24px rgba(201, 162, 39, 0.35);
    }
    .title-block p {
      margin: 0.45rem 0 0;
      font-size: 0.78rem;
      color: #a89bb5;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .svg-shell {
      background: linear-gradient(160deg, rgba(255,250,240,0.06), rgba(120,90,160,0.08));
      border: 1px solid rgba(201, 162, 39, 0.35);
      border-radius: 18px;
      padding: 0.75rem;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 30px 80px rgba(0,0,0,0.55),
        0 0 60px rgba(180, 120, 40, 0.12);
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #0b0a10;
    }
    .hint {
      text-align: center;
      margin-top: 0.85rem;
      font-size: 0.72rem;
      color: #7d7190;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="title-block">
      <h1>七层宝塔 · 祥龙环抱</h1>
      <p>Seven-Story Pagoda · Celestial Dragon in the Imperial Garden</p>
    </header>
    <div class="svg-shell">
      <!--
        Standalone complex SVG illustration.
        Structure (bottom → top / back → front):
          1. defs: gradients, patterns, filters
          2. sky, distant mountains, mist, clouds
          3. garden: pond, rocks, bamboo, pines, flowers, path
          4. pagoda base & 7 tiers with roofs, beams, balconies, lanterns
          5. coiling dragon (partially behind/around tiers)
          6. foreground mist & ornaments
      -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
        <title id="title">Traditional Chinese Seven-Story Pagoda with Coiling Dragon in a Garden</title>
        <desc id="desc">
          A detailed symmetrical seven-story Chinese pagoda with curved eaves, wooden balconies,
          lanterns, and gold ornaments. A long serpentine dragon coils gracefully around the tower
          in a peaceful garden with bamboo, pines, rocks, a pond, flowers, pathways, clouds, and mist.
        </desc>

        <defs>
          <!-- ========== Gradients ========== -->
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1a1535"/>
            <stop offset="35%" stop-color="#3d2a55"/>
            <stop offset="62%" stop-color="#8b4a5a"/>
            <stop offset="82%" stop-color="#d4895a"/>
            <stop offset="100%" stop-color="#f0c98a"/>
          </linearGradient>

          <radialGradient id="sunGlow" cx="78%" cy="18%" r="28%">
            <stop offset="0%" stop-color="#fff2c4" stop-opacity="0.95"/>
            <stop offset="35%" stop-color="#ffb36b" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#ff8a4a" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="mountainFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4a3a68"/>
            <stop offset="100%" stop-color="#2a2038" stop-opacity="0.9"/>
          </linearGradient>

          <linearGradient id="mountainNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3d4a42"/>
            <stop offset="100%" stop-color="#1e2a24"/>
          </linearGradient>

          <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3d5a3a"/>
            <stop offset="40%" stop-color="#2f4a32"/>
            <stop offset="100%" stop-color="#1a2e22"/>
          </linearGradient>

          <linearGradient id="pondGrad" x1="0" y1="0" x2="0.3" y2="1">
            <stop offset="0%" stop-color="#6ec8d4"/>
            <stop offset="45%" stop-color="#2a7a8a"/>
            <stop offset="100%" stop-color="#143a48"/>
          </linearGradient>

          <radialGradient id="pondShine" cx="40%" cy="35%" r="50%">
            <stop offset="0%" stop-color="#c8f0ff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#2a7a8a" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="roofRed" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c23a32"/>
            <stop offset="45%" stop-color="#8e1e1a"/>
            <stop offset="100%" stop-color="#5a1010"/>
          </linearGradient>

          <linearGradient id="roofEdgeGold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0d878"/>
            <stop offset="50%" stop-color="#c9a227"/>
            <stop offset="100%" stop-color="#8a6a14"/>
          </linearGradient>

          <linearGradient id="woodBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#5c2a1a"/>
            <stop offset="20%" stop-color="#8b4518"/>
            <stop offset="50%" stop-color="#a85a28"/>
            <stop offset="80%" stop-color="#8b4518"/>
            <stop offset="100%" stop-color="#5c2a1a"/>
          </linearGradient>

          <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6b3418"/>
            <stop offset="100%" stop-color="#3a1a0c"/>
          </linearGradient>

          <linearGradient id="stoneBase" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9a8f82"/>
            <stop offset="40%" stop-color="#6e655c"/>
            <stop offset="100%" stop-color="#3e3832"/>
          </linearGradient>

          <linearGradient id="goldMetal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffe9a0"/>
            <stop offset="40%" stop-color="#e0b84a"/>
            <stop offset="100%" stop-color="#9a7018"/>
          </linearGradient>

          <linearGradient id="dragonBody" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2f8f5b"/>
            <stop offset="35%" stop-color="#1f6b45"/>
            <stop offset="70%" stop-color="#0f4a32"/>
            <stop offset="100%" stop-color="#1a6b48"/>
          </linearGradient>

          <linearGradient id="dragonBelly" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0d48a"/>
            <stop offset="100%" stop-color="#c9a050"/>
          </linearGradient>

          <linearGradient id="dragonMane" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ff5a2a"/>
            <stop offset="50%" stop-color="#e02020"/>
            <stop offset="100%" stop-color="#8a1010"/>
          </linearGradient>

          <linearGradient id="lanternPaper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffd0a0"/>
            <stop offset="40%" stop-color="#ff6a3a"/>
            <stop offset="100%" stop-color="#c02018"/>
          </linearGradient>

          <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffcc66" stop-opacity="0.7"/>
            <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
          </radialGradient>

          <linearGradient id="bambooGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#1a4a28"/>
            <stop offset="40%" stop-color="#3d8a48"/>
            <stop offset="100%" stop-color="#1a4a28"/>
          </linearGradient>

          <linearGradient id="pineGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2d6b3a"/>
            <stop offset="100%" stop-color="#0f2e18"/>
          </linearGradient>

          <linearGradient id="mistGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
            <stop offset="40%" stop-color="#e8e0f0" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#d0c8e0" stop-opacity="0.05"/>
          </linearGradient>

          <linearGradient id="pathStone" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#b8a890"/>
            <stop offset="100%" stop-color="#6a5e4e"/>
          </linearGradient>

          <linearGradient id="flowerPink" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffb6c8"/>
            <stop offset="100%" stop-color="#d44a78"/>
          </linearGradient>

          <linearGradient id="cloudFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff8f0" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#d8c8e8" stop-opacity="0.35"/>
          </linearGradient>

          <!-- Roof tile pattern -->
          <pattern id="tilePattern" width="10" height="6" patternUnits="userSpaceOnUse">
            <path d="M0,6 Q5,0 10,6" fill="none" stroke="#5a1010" stroke-width="0.6" opacity="0.55"/>
            <path d="M0,3 Q5,-1 10,3" fill="none" stroke="#a03028" stroke-width="0.4" opacity="0.35"/>
          </pattern>

          <!-- Scale pattern for dragon -->
          <pattern id="scalePattern" width="12" height="10" patternUnits="userSpaceOnUse">
            <path d="M0,8 Q6,0 12,8" fill="none" stroke="#7dcea0" stroke-width="0.7" opacity="0.55"/>
            <circle cx="6" cy="5" r="1.1" fill="#3a9a68" opacity="0.35"/>
          </pattern>

          <!-- Lattice window pattern -->
          <pattern id="lattice" width="8" height="8" patternUnits="userSpaceOnUse">
            <path d="M0,0 L8,8 M8,0 L0,8" stroke="#3a1a0c" stroke-width="0.7" opacity="0.7"/>
            <rect x="0" y="0" width="8" height="8" fill="none" stroke="#5c2a1a" stroke-width="0.4"/>
          </pattern>

          <!-- Soft shadow filter -->
          <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
            <feOffset dx="2" dy="5" result="offsetblur"/>
            <feComponentTransfer>
              <feFuncA type="linear" slope="0.35"/>
            </feComponentTransfer>
            <feMerge>
              <feMergeNode/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="dragonGlow" x="-15%" y="-15%" width="130%" height="130%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dy="2" result="b"/>
            <feComponentTransfer>
              <feFuncA type="linear" slope="0.4"/>
            </feComponentTransfer>
            <feMerge>
              <feMergeNode/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <!-- Reusable cloud puff -->
          <g id="cloudPuff">
            <ellipse cx="0" cy="0" rx="42" ry="18" fill="url(#cloudFill)"/>
            <ellipse cx="-28" cy="4" rx="28" ry="14" fill="url(#cloudFill)"/>
            <ellipse cx="30" cy="5" rx="26" ry="13" fill="url(#cloudFill)"/>
            <ellipse cx="-8" cy="-10" rx="22" ry="12" fill="url(#cloudFill)"/>
            <ellipse cx="16" cy="-8" rx="20" ry="11" fill="url(#cloudFill)"/>
          </g>

          <!-- Roof finial / chiwen-inspired ornament -->
          <g id="roofOrnament">
            <path d="M0,0 Q-6,-10 -2,-18 Q0,-12 2,-18 Q6,-10 0,0" fill="url(#goldMetal)" stroke="#6a4a10" stroke-width="0.5"/>
            <circle cx="0" cy="-6" r="2" fill="#ffe9a0"/>
          </g>

          <!-- Small lantern -->
          <g id="lantern">
            <ellipse cx="0" cy="-10" rx="3" ry="2" fill="url(#goldMetal)"/>
            <path d="M-7,-8 Q-8,2 -6,10 Q0,14 6,10 Q8,2 7,-8 Z" fill="url(#lanternPaper)" stroke="#8a2010" stroke-width="0.6"/>
            <ellipse cx="0" cy="-8" rx="7.2" ry="2.2" fill="#ffb070" opacity="0.5"/>
            <line x1="0" y1="-12" x2="0" y2="-18" stroke="#c9a227" stroke-width="1"/>
            <path d="M-4,10 Q0,16 4,10" fill="none" stroke="#c9a227" stroke-width="0.8"/>
            <circle cx="0" cy="16" r="1.5" fill="#e0b84a"/>
            <!-- vertical ribs -->
            <path d="M-3,-6 L-2.5,8 M0,-7 L0,10 M3,-6 L2.5,8" stroke="#8a2010" stroke-width="0.4" opacity="0.5"/>
          </g>

          <!-- Balcony rail section -->
          <g id="railPost">
            <rect x="-1.5" y="0" width="3" height="14" rx="0.5" fill="url(#woodDark)"/>
            <rect x="-3" y="0" width="6" height="2.5" rx="0.5" fill="url(#goldMetal)"/>
          </g>

          <!-- Decorative dougong-like bracket -->
          <g id="bracket">
            <path d="M-8,0 H8 V3 H-8 Z" fill="#5c2a1a"/>
            <path d="M-10,3 L0,10 L10,3 Z" fill="#8b4518" stroke="#3a1a0c" stroke-width="0.4"/>
            <path d="M-6,3 L0,7 L6,3" fill="none" stroke="#c9a227" stroke-width="0.6"/>
          </g>

          <!-- Flower blossom -->
          <g id="blossom">
            <circle cx="0" cy="0" r="2.2" fill="#ffeeaa"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="url(#flowerPink)" transform="rotate(0)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="url(#flowerPink)" transform="rotate(72)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="url(#flowerPink)" transform="rotate(144)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="url(#flowerPink)" transform="rotate(216)"/>
            <ellipse cx="0" cy="-5" rx="3" ry="4.5" fill="url(#flowerPink)" transform="rotate(288)"/>
          </g>

          <!-- Pine needle cluster -->
          <g id="pineCluster">
            <path d="M0,0 L-12,18 L0,12 L12,18 Z" fill="url(#pineGreen)" stroke="#0a2010" stroke-width="0.4"/>
            <path d="M0,6 L-10,22 L0,16 L10,22 Z" fill="#1a4a28" opacity="0.85"/>
            <path d="M0,12 L-8,26 L0,20 L8,26 Z" fill="#0f3020"/>
          </g>
        </defs>

        <!-- ===================== SKY ===================== -->
        <rect width="1000" height="1400" fill="url(#skyGrad)"/>
        <ellipse cx="780" cy="210" rx="160" ry="120" fill="url(#sunGlow)"/>
        <circle cx="780" cy="200" r="36" fill="#ffe8b0" opacity="0.9" filter="url(#glowGold)"/>
        <circle cx="780" cy="200" r="22" fill="#fff6d8"/>

        <!-- Distant mountains -->
        <path d="M0,420 Q80,340 160,380 T320,350 T480,390 T640,340 T800,370 T1000,330 L1000,520 L0,520 Z"
              fill="url(#mountainFar)" opacity="0.75"/>
        <path d="M0,480 Q120,400 220,450 T420,420 T600,460 T780,410 T1000,450 L1000,580 L0,580 Z"
              fill="url(#mountainNear)" opacity="0.85"/>

        <!-- Soft atmospheric mist bands -->
        <ellipse cx="200" cy="460" rx="180" ry="30" fill="#e8d8f0" opacity="0.12"/>
        <ellipse cx="700" cy="490" rx="220" ry="28" fill="#e8d8f0" opacity="0.1"/>
        <rect x="0" y="500" width="1000" height="120" fill="url(#mistGrad)"/>

        <!-- Clouds -->
        <use href="#cloudPuff" x="120" y="160" opacity="0.7" transform="scale(1.2)"/>
        <use href="#cloudPuff" x="320" y="110" opacity="0.55" transform="scale(0.85)"/>
        <use href="#cloudPuff" x="880" y="280" opacity="0.5" transform="scale(1.1)"/>
        <use href="#cloudPuff" x="60" y="300" opacity="0.4" transform="scale(0.7)"/>
        <use href="#cloudPuff" x="550" y="90" opacity="0.45" transform="scale(0.65)"/>

        <!-- ===================== GARDEN GROUND ===================== -->
        <path d="M0,780 Q200,740 400,760 T800,750 T1000,780 L1000,1400 L0,1400 Z" fill="url(#groundGrad)"/>

        <!-- Decorative grass texture lines -->
        <g stroke="#1a3a22" stroke-width="0.8" opacity="0.35" fill="none">
          <path d="M40,900 Q50,880 45,920 M70,950 Q80,930 75,970 M120,1100 Q130,1080 125,1120"/>
          <path d="M900,920 Q910,900 905,940 M940,1000 Q950,980 945,1020 M860,1150 Q870,1130 865,1170"/>
        </g>

        <!-- Pathway (stone) leading to pagoda -->
        <path d="M420,1380 Q460,1200 480,1100 Q500,1000 500,920 Q500,1000 520,1100 Q540,1200 580,1380"
              fill="url(#pathStone)" opacity="0.9" stroke="#4a4035" stroke-width="1"/>
        <g fill="#8a7a68" opacity="0.5">
          <!-- stepping stones -->
          <ellipse cx="500" cy="1280" rx="28" ry="10"/>
          <ellipse cx="495" cy="1220" rx="24" ry="9"/>
          <ellipse cx="502" cy="1160" rx="22" ry="8"/>
          <ellipse cx="498" cy="1105" rx="20" ry="7"/>
          <ellipse cx="500" cy="1055" rx="18" ry="7"/>
          <ellipse cx="500" cy="1005" rx="16" ry="6"/>
        </g>
        <g fill="none" stroke="#5a4e42" stroke-width="0.6" opacity="0.4">
          <ellipse cx="500" cy="1280" rx="28" ry="10"/>
          <ellipse cx="495" cy="1220" rx="24" ry="9"/>
          <ellipse cx="502" cy="1160" rx="22" ry="8"/>
        </g>

        <!-- Pond (left foreground) -->
        <ellipse cx="180" cy="1180" rx="140" ry="55" fill="url(#pondGrad)" filter="url(#softShadow)"/>
        <ellipse cx="180" cy="1180" rx="140" ry="55" fill="url(#pondShine)"/>
        <ellipse cx="180" cy="1180" rx="140" ry="55" fill="none" stroke="#4a9088" stroke-width="2" opacity="0.5"/>
        <!-- lily pads -->
        <ellipse cx="130" cy="1170" rx="18" ry="8" fill="#2a6a38" transform="rotate(-15 130 1170)"/>
        <ellipse cx="200" cy="1195" rx="14" ry="6" fill="#348048" transform="rotate(20 200 1195)"/>
        <ellipse cx="240" cy="1165" rx="12" ry="5" fill="#2a6a38" transform="rotate(-8 240 1165)"/>
        <!-- lotus flower -->
        <g transform="translate(160,1165)">
          <ellipse cx="0" cy="-4" rx="4" ry="10" fill="#f8a0c0" transform="rotate(0)"/>
          <ellipse cx="0" cy="-4" rx="4" ry="10" fill="#f080b0" transform="rotate(40)"/>
          <ellipse cx="0" cy="-4" rx="4" ry="10" fill="#f8a0c0" transform="rotate(80)"/>
          <ellipse cx="0" cy="-4" rx="4" ry="10" fill="#f080b0" transform="rotate(120)"/>
          <ellipse cx="0" cy="-4" rx="4" ry="10" fill="#f8a0c0" transform="rotate(160)"/>
          <circle cx="0" cy="0" r="3" fill="#ffee88"/>
        </g>
        <!-- water ripples -->
        <ellipse cx="210" cy="1175" rx="25" ry="8" fill="none" stroke="#a0e0e8" stroke-width="0.8" opacity="0.4"/>
        <ellipse cx="210" cy="1175" rx="15" ry="4" fill="none" stroke="#a0e0e8" stroke-width="0.6" opacity="0.35"/>

        <!-- Rocks around pond & garden -->
        <g filter="url(#softShadow)">
          <path d="M60,1220 Q40,1180 70,1160 Q100,1145 120,1170 Q140,1200 110,1230 Q80,1245 60,1220 Z" fill="#6a655c"/>
          <path d="M90,1210 Q80,1185 100,1175 Q120,1170 125,1190 Q120,1215 90,1210 Z" fill="#8a8478" opacity="0.5"/>
          <path d="M280,1230 Q260,1190 300,1175 Q340,1170 350,1205 Q345,1240 310,1250 Q280,1245 280,1230 Z" fill="#5a554c"/>
          <path d="M720,1200 Q700,1160 740,1140 Q790,1130 810,1170 Q815,1210 770,1225 Q730,1225 720,1200 Z" fill="#6a655c"/>
          <path d="M800,1260 Q780,1230 810,1215 Q850,1205 860,1240 Q855,1275 820,1280 Q800,1275 800,1260 Z" fill="#4a453e"/>
          <path d="M100,1050 Q85,1020 110,1005 Q145,995 155,1025 Q150,1055 120,1060 Q100,1058 100,1050 Z" fill="#5e584e"/>
          <path d="M850,1080 Q830,1045 870,1030 Q910,1025 920,1060 Q915,1095 875,1100 Q850,1095 850,1080 Z" fill="#6a655c"/>
        </g>
        <!-- rock moss accents -->
        <ellipse cx="95" cy="1205" rx="12" ry="5" fill="#3a6a38" opacity="0.45"/>
        <ellipse cx="760" cy="1185" rx="15" ry="6" fill="#3a6a38" opacity="0.4"/>

        <!-- Bamboo grove (left) -->
        <g id="bambooLeft">
          <g stroke="url(#bambooGrad)" stroke-width="7" fill="none" stroke-linecap="round">
            <path d="M70,1280 L75,900"/>
            <path d="M95,1290 L100,880"/>
            <path d="M118,1285 L112,920"/>
            <path d="M140,1295 L148,910"/>
            <path d="M50,1270 L48,960"/>
          </g>
          <!-- nodes -->
          <g stroke="#0f3020" stroke-width="1.2" opacity="0.7">
            <line x1="68" y1="1200" x2="78" y2="1200"/><line x1="70" y1="1120" x2="80" y2="1120"/>
            <line x1="70" y1="1040" x2="80" y2="1040"/><line x1="72" y1="970" x2="80" y2="970"/>
            <line x1="93" y1="1210" x2="103" y2="1210"/><line x1="95" y1="1125" x2="105" y2="1125"/>
