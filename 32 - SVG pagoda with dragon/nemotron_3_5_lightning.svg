<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#1A5C8A"/>
    </linearGradient>

    <!-- Pagoda roof gradient (red-tile) -->
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y100%">
      <stop offset="0%" stop-color="#D32F2F"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFAB00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Dragon body gradient (jade to gold) -->
    <linearGradient id="dragonGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="35%" stop-color="#66BB6A"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="65%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#C10000"/>
    </linearGradient>

    <!-- Water pond gradient -->
    <linearGradient id="pondGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="50%" stop-color="#BBDEFB"/>
      <stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>

    <!-- Stone pathway pattern -->
    <pattern id="stonePat" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#FFF8E1"/>
      <path d="M0 30 L15 0 L30 30 M0 0 L15 30 L30 0" stroke="#D7AA77" stroke-width="1"/>
    </pattern>

    <!-- Bamboo node pattern -->
    <pattern id="bambooPat" width="12" height="180" patternUnits="userSpaceOnUse">
      <rect width="12" height="180" fill="#2E7D32"/>
      <circle cx="6" cy="90" r="5" fill="#1B5E20"/>
    </pattern>

    <!-- Cloud fill gradient -->
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>

    <!-- Lantern glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background sky -->
  <rect width="800" height="800" fill="url(#skyGrad)"/>

  <!-- Distant mountains -->
  <g fill="#2C3E50">
    <path d="M20 780 Q 100 740, 200 770 Q 300 750, 400 780 Q 500 760, 600 790 L 600 800 L 20 800 Z"/>
    <path d="M580 770 Q 620 730, 660 760 Q 700 740, 740 780 L 740 800 L 580 800 Z"/>
  </g>

  <!-- Soft clouds -->
  <g fill="url(#cloudGrad)" opacity="0.85">
    <path d="M100 140 C 130 100, 200 120, 250 150 C 300 180, 350 160, 400 190 C 450 220, 500 200, 550 230"/>
    <path d="M250 180 C 280 140, 350 160, 400 190 C 450 220, 500 210, 550 240"/>
    <path d="M450 150 C 480 110, 550 130, 600 160 C 650 190, 700 170, 750 200"/>
  </g>

  <!-- Pond -->
  <ellipse cx="400" cy="700" rx="260" ry="85" fill="url(#pondGrad)"/>
  <!-- Water ripples -->
  <path d="M400 700 Q 400 690, 440 695" stroke="#90CAF9" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M400 710 Q 400 700, 430 705" stroke="#90CAF9" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M400 720 Q 400 710, 420 715" stroke="#90CAF9" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Center lily pad -->
  <circle cx="400" cy="685" r="28" fill="#E8F5E9" opacity="0.9"/>
  <!-- Floating lotus -->
  <g fill="#FF6F61" opacity="0.9">
    <circle cx="120" cy="695" r="12"/>
    <circle cx="680" cy="695" r="12"/>
    <circle cx="400" cy="695" r="10"/>
  </g>

  <!-- Decorative stone pathway -->
  <g fill="url(#stonePat)" stroke="#D7AA77" stroke-width="0.5">
    <polygon points="350,730 370,730 370,750 350,750"/>
    <polygon points="400,730 420,730 420,750 400,750"/>
    <polygon points="450,730 470,730 470,750 450,750"/>
    <polygon points="500,730 520,730 520,750 500,750"/>
    <polygon points="550,730 570,730 570,750 550,750"/>
    <polygon points="600,730 620,730 620,750 600,750"/>
    <polygon points="650,730 670,730 670,750 650,750"/>
  </g>

  <!-- Bamboo groves (repeated pattern) -->
  <g fill="url(#bambooPat)" stroke="#1B5E20" stroke-width="1">
    <!-- Left cluster -->
    <g transform="translate(80, 620)">
      <use xlink:href="#bambooPat"/>
      <use xlink:href="#bambooPat" transform="translate(0, -40)"/>
      <use xlink:href="#bambooPat" transform="translate(0, -80)"/>
    </g>
    <!-- Right cluster -->
    <g transform="translate(720, 590)">
      <use xlink:href="#bambooPat"/>
      <use xlink:href="#bambooPat" transform="translate(0, -40)"/>
    </g>
  </g>

  <!-- Pine trees -->
  <g fill="#1B5E20">
    <!-- Left pine -->
    <g transform="translate(50, 650)">
      <ellipse cx="0" cy="0" rx="45" ry="55" fill="#2E7D32"/>
      <path d="M -45 0 Q 0 -60, 45 0" fill="none" stroke="#1B5E20" stroke-width="2"/>
      <circle cx="0" cy="-50" r="6" fill="#FFFFFF"/>
      <path d="M -30 -55 L -10 -80 L 10 -80 L 30 -55" stroke="#1B5E20" stroke-width="1.5" fill="none"/>
    </g>
    <!-- Right pine -->
    <g transform="translate(750, 640)">
      <ellipse cx="0" cy="0" rx="42" ry="52" fill="#2E7D32"/>
      <path d="M -42 0 Q 0 -58, 42 0" fill="none" stroke="#1B5E20" stroke-width="2"/>
      <circle cx="0" cy="-48" r="6" fill="#FFFFFF"/>
      <path d="M -30 -52 L -10 -75 L 10 -75 L 30 -52" stroke="#1B5E20" stroke-width="1.5" fill="none"/>
    </g>
  </g>

  <!-- Flowing garden flowers -->
  <g fill="#FF6B6B" stroke="#FF4136" stroke-width="1">
    <g transform="translate(180, 660)">
      <circle cx="0" cy="0" r="9"/>
      <circle cx="-7" cy="-7" r="3.5" fill="#FFD700"/>
      <circle cx="7" cy="-7" r="3.5" fill="#FFD700"/>
      <path d="M -9 0 L -5 -8 L 5 -8 L 9 0 L 5 8 L -5 8 Z" fill="#FFD700" opacity="0.6"/>
    </g>
    <g transform="translate(670, 670)">
      <circle cx="0" cy="0" r="8"/>
      <circle cx="-6" cy="-6" r="3" fill="#FFD700"/>
      <circle cx="6" cy="-6" r="3" fill="#FFD700"/>
    </g>
    <g transform="translate(100, 580)">
      <circle cx="0" cy="0" r="7"/>
      <circle cx="-5" cy="-5" r="2.5" fill="#FFD700"/>
      <circle cx="5" cy="-5" r="2.5" fill="#FFD700"/>
    </g>
    <g transform="translate(350, 620)">
      <circle cx="0" cy="0" r="6"/>
      <circle cx="-4" cy="-4" r="2" fill="#FFD700"/>
      <circle cx="4" cy="-4" r="2" fill="#FFD700"/>
    </g>
  </g>

  <!-- ===== The 7‑Story Pagoda ===== -->
  <!-- Drawn first so the front facade sits on top of the dragon -->
  <g id="pagoda" transform="translate(400, 0)">
    <!-- Floor definitions: each floor is a group with roof, balcony, windows, lantern -->
    <!-- Floor 7 (top) -->
    <g transform="translate(0, 510)">
      <!-- Curved roof eaves -->
      <path d="M -38 0 L 38 0 C 52 -12, 52 -38, 38 -38 L 38 -70 L -38 -70 C -52 -12, -52 0, -38 0 Z" fill="url(#roofGrad)"/>
      <!-- Balcony rail -->
      <path d="M -30 -15 L 30 -15 M -30 -25 L 30 -25" stroke="#FFD700" stroke-width="2" fill="none"/>
      <!-- Central window -->
      <rect x="-8" y="-35" width="16" height="14" fill="#FFF8DC" stroke="#FFD700" stroke-width="1"/>
      <!-- Lantern -->
      <g transform="translate(0, -50)">
        <polygon points="0,-12 -6,-30 6,-30" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-30" r="3" fill="#EDA927"/>
        <line x1="0" y1="-12" x2="0" y2="-30" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 6 -->
    <g transform="translate(0, 475)">
      <path d="M -35 0 L 35 0 C 47 -10, 47 -35, 35 -35 L 35 -65 L -35 -65 C -47 -10, -47 0, -35 0 Z" fill="url(#roofGrad)"/>
      <path d="M -28 -12 L 28 -12 M -28 -22 L 28 -22" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-7" y="-30" width="14" height="12" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -42)">
        <polygon points="0,-10 -5,-22 5,-22" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-22" r="2.5" fill="#EDA927"/>
        <line x1="0" y1="-10" x2="0" y2="-22" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 5 -->
    <g transform="translate(0, 440)">
      <path d="M -32 0 L 32 0 C 44 -9, 44 -32, 32 -32 L 32 -60 L -32 -60 C -44 -9, -44 0, -32 0 Z" fill="url(#roofGrad)"/>
      <path d="M -26 -10 L 26 -10 M -26 -18 L 26 -18" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-6" y="-26" width="12" height="10" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -38)">
        <polygon points="0,-8 -4,-18 4,-18" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-18" r="2" fill="#EDA927"/>
        <line x1="0" y1="-8" x2="0" y2="-18" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 4 -->
    <g transform="translate(0, 405)">
      <path d="M -30 0 L 30 0 C 42 -8, 42 -30, 30 -30 L 30 -58 L -30 -58 C -42 -8, -42 0, -30 0 Z" fill="url(#roofGrad)"/>
      <path d="M -24 -8 L 24 -8 M -24 -14 L 24 -14" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-5" y="-22" width="10" height="8" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -34)">
        <polygon points="0,-6 -3,-14 3,-14" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-14" r="1.8" fill="#EDA927"/>
        <line x1="0" y1="-6" x2="0" y2="-14" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 3 -->
    <g transform="translate(0, 370)">
      <path d="M -27 0 L 27 0 C 38 -7, 38 -27, 27 -27 L 27 -52 L -27 -52 C -38 -7, -38 0, -27 0 Z" fill="url(#roofGrad)"/>
      <path d="M -21 -6 L 21 -6 M -21 -11 L 21 -11" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-4" y="-18" width="8" height="6" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -30)">
        <polygon points="0,-3 -2,-11 2,-11" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-11" r="1.5" fill="#EDA927"/>
        <line x1="0" y1="-3" x2="0" y2="-11" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 2 -->
    <g transform="translate(0, 335)">
      <path d="M -24 0 L 24 0 C 34 -5, 34 -24, 24 -24 L 24 -47 L -24 -47 C -34 -5, -34 0, -24 0 Z" fill="url(#roofGrad)"/>
      <path d="M -18 -4 L 18 -4 M -18 -9 L 18 -9" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-3" y="-15" width="6" height="4" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -27)">
        <polygon points="0,-2 -1,-9 1,-9" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-9" r="1.2" fill="#EDA927"/>
        <line x1="0" y1="-2" x2="0" y2="-9" stroke="#B71C1C" stroke-width="1"/>
      </g>
    </g>

    <!-- Floor 1 (ground level) -->
    <g transform="translate(0, 300)">
      <path d="M -22 0 L 22 0 C 32 -3, 32 -22, 22 -22 L 22 -42 L -22 -42 C -32 -3, -32 0, -22 0 Z" fill="url(#roofGrad)"/>
      <path d="M -16 -2 L 16 -2 M -16 -7 L 16 -7" stroke="#FFD700" stroke-width="2" fill="none"/>
      <rect x="-2" y="-12" width="4" height="2" fill="#FFF8DC" stroke="#FFD700"/>
      <g transform="translate(0, -24)">
        <polygon points="0,-1 -0.5,-6 0.5,-6" fill="#FFD700" stroke="#B71C1C" stroke-width="1"/>
        <circle cx="0" cy="-6" r="1" fill="#EDA927"/>
        <line x1="0" y1="-1" x2="0" y2="-6" stroke="#B71C1C" stroke-width="1"/>
      </g>
      <!-- Main entrance door -->
      <rect x="-10" y="-30" width="20" height="18" fill="#D7263D" stroke="#B71C1C" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ===== The Coiling Dragon ===== -->
  <!-- Drawn before the pagoda so the front facade appears on top -->
  <g id="dragon">
    <!-- Dragon body main path -->
    <path d="M 80 760 
             C 150 730, 250 730, 320 760 
             C 380 790, 430 770, 480 750 
             C 530 730, 580 710, 630 730 
             C 680 750, 720 730, 750 710 
             C 780 690, 760 650, 730 620 
             C 700 590, 660 570, 620 550 
             C 580 530, 540 510, 500 530 
             C 460 550, 420 530, 380 510 
             C 340 490, 300 470, 260 490 
             C 220 510, 180 530, 140 550 
             C 100 570, 70 550, 40 530 
             C 10 510, 0 490, 20 460 
             C 40 430, 70 410, 110 390 
             C 150 370, 200 350, 250 330 
             C 300 310, 350 290, 400 270 
             C 450 250, 500 230, 550 210 
             C 600 190, 650 170, 700 150 
             C 750 130, 780 110, 790 90 
             Z" 
          fill="url(#dragonGrad)" 
          stroke="#B71C1C" 
          stroke-width="2"/>
    
    <!-- Dragon head (front left) -->
    <g transform="translate(120, 750)">
      <path d="M 0 0 C 20 -10, 40 -10, 50 0 L 55 20 C 58 30, 55 45, 50 50 L 45 55 L 35 50 L 30 45 L 25 50 L 20 55 L 15 50 L 10 45 L 5 50 L 0 55 L -5 50 L -10 45 L -15 50 L -20 55 L -25 50 L -30 45 L -35 50 L -40 45 L -45 50 L -50 45 L -55 50 L -58 45 L -60 50 Z" fill="url(#dragonGrad)"/>
      <!-- Horn -->
      <path d="M 5 5 C 10 0, 15 -5, 20 0 L 22 2 C 24 4, 26 6, 28 8" stroke="#B71C1C" stroke-width="2.5" fill="none"/>
      <!-- Eye -->
      <circle cx="35" cy="10" r="2.5" fill="#B71C1C"/>
      <!-- Whiskers -->
      <g stroke="#B71C1C" stroke-width="1.5" fill="none">
        <line x1="80" y1="5" x2="110" y2="10"/>
        <line x1="82" y1="5" x2="112" y2="8"/>
        <line x1="84" y1="5" x2="114" y2="6"/>
      </g>
    </g>

    <!-- Dragon tail (back right) -->
    <g transform="translate(750, 460)">
      <path d="M 0 0 C -20 -10, -40 -10, -50 0 L -55 -20 C -58 -30, -55 -45, -50 -50 L -45 -55 L -35 -50 L -30 -45 L -25 -50 L -20 -55 L -15 -50 L -10 -45 L -5 -50 L 0 -55 L 5 -50 L 10 -45 L 15 -50 L 20 -55 L 25 -50 L 30 -45 L 35 -50 L 40 -55 L 45 -50 L 50 -55 L 55 -50 L 58 -55 L 60 -50 Z" fill="url(#dragonGrad)"/>
    </g>

    <!-- Scale texture overlay (subtle) -->
    <g fill="#FFD700" opacity="0.15">
      <path d="M 80 760 C 150 730, 250 730, 320 760" stroke="none"/>
      <ellipse cx="120" cy="750" rx="8" ry="4" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="200" cy="755" rx="7" ry="3.5" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="300" cy="752" rx="9" ry="4.5" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="420" cy="748" rx="6" ry="3" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="530" cy="735" rx="8" ry="4" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="620" cy="730" rx="7" ry="3.5" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="700" cy="715" rx="9" ry="4.5" fill="#FFD700" opacity="0.1"/>
      <ellipse cx="770" cy="700" rx="6" ry="3" fill="#FFD700" opacity="0.1"/>
    </g>
  </g>

  <!-- ===== Foreground garden accents on top ===== -->
  <!-- Small bridge over pond -->
  <g fill="#D7AA77" stroke="#B76E4F" stroke-width="1">
    <path d="M 150 680 Q 300 660, 450 680 Q 600 660, 750 680 L 750 700 L 150 700 Z"/>
    <rect x="340" y="675" width="20" height="5" rx="2" fill="#B76E4F"/>
    <rect x="540" y="675" width="20" height="5" rx="2" fill="#B76E4F"/>
  </g>

  <!-- Ground cover mist -->
  <g fill="#FFFFFF" opacity="0.3">
    <path d="M 0 760 Q 100 750, 250 770 Q 400 760, 550 780 Q 700 770, 800 760 L 800 800 L 0 800 Z"/>
    <path d="M 0 780 Q 120 770, 300 790 Q 500 780, 700 795 L 800 800 L 0 800 Z"/>
  </g>

  <!-- Closing -->
</svg>
