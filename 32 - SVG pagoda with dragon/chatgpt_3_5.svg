<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" aria-label="Traditional Chinese pagoda in a garden with dragon" role="img">
<defs>
<!-- Gradients -->
<linearGradient id="roofGradient" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#b21f16" offset="0%"/>
<stop stop-color="#7b0f0b" offset="100%"/>
</linearGradient>
<linearGradient id="woodBeamGradient" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#764422" offset="0%"/>
<stop stop-color="#4a2a10" offset="100%"/>
</linearGradient>
<linearGradient id="tileGradient" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#d4af37" offset="0%"/>
<stop stop-color="#a87c07" offset="100%"/>
</linearGradient>
<linearGradient id="dragonBodyGradient" x1="0" y1="0" x2="1" y2="1">
<stop stop-color="#fbc531" offset="0%"/>
<stop stop-color="#d48806" offset="100%"/>
</linearGradient>
<radialGradient id="dragonEyeGradient" cx="0.5" cy="0.5" r="0.5">
<stop stop-color="#000" offset="0%"/>
<stop stop-color="#ff0000" offset="100%"/>
</radialGradient>
<linearGradient id="bambooGradient" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#4c774e" offset="0%"/>
<stop stop-color="#2b3d26" offset="100%"/>
</linearGradient>
<radialGradient id="pondGradient" cx="0.5" cy="0.5" r="0.5">
<stop stop-color="#3ab5c9" offset="0%"/>
<stop stop-color="#0b4d60" offset="100%"/>
</radialGradient>
<linearGradient id="cloudGradient" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#f0f4f7" offset="0%"/>
<stop stop-color="#cbd5dc" offset="100%"/>
</linearGradient>

<!-- Patterns -->
<pattern id="roofTilePattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="24" height="24" fill="#a7730f"/>
<circle cx="12" cy="12" r="4" fill="#d4af37"/>
<path d="M0 12 L24 12 M12 0 L12 24" stroke="#7a5a02" stroke-width="1"/>
</pattern>
<pattern id="woodGrainPattern" width="10" height="10" patternUnits="userSpaceOnUse">
<path d="M0 0 C2 3, 5 3, 10 0" stroke="#572e11" stroke-width="1" fill="none"/>
</pattern>
<pattern id="scalePattern" width="12" height="12" patternUnits="userSpaceOnUse">
<path d="M0 6 Q6 12 12 6 T24 6" fill="none" stroke="#ac6a04" stroke-width="0.6"/>
<circle cx="6" cy="6" r="3" fill="#f6ce48"/>
</pattern>

<!-- Filters -->
<filter id="shadow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
<feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
</filter>
<filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
</filter>

<!-- Reusable shapes for pagoda details -->
<g id="carvedOrnament" >
<path d="M0 0 Q5 -10 10 0 Q5 10 0 0 Z" fill="#a6690e" stroke="#663f01" stroke-width="0.8"/>
</g>
<g id="lantern" >
<ellipse cx="0" cy="0" rx="10" ry="14" fill="url(#roofGradient)" stroke="#7e150f" stroke-width="1.2"/>
<line x1="0" y1="-14" x2="0" y2="-20" stroke="#7e150f" stroke-width="2"/>
<line x1="0" y1="14" x2="0" y2="20" stroke="#7e150f" stroke-width="2"/>
<line x1="-8" y1="0" x2="8" y2="0" stroke="#7e150f" stroke-width="2"/>
<line x1="-8" y1="10" x2="8" y2="10" stroke="#7e150f" stroke-width="1"/>
</g>

<!-- Window shape -->
<g id="window" >
<rect x="-20" y="-30" width="40" height="60" rx="8" ry="8" fill="#3e1a05" stroke="#7d4712" stroke-width="2"/>
<rect x="-15" y="-25" width="30" height="50" fill="#f3d9b1" opacity="0.7"/>
<line x1="-15" y1="0" x2="15" y2="0" stroke="#7d4712" stroke-width="2"/>
<line x1="0" y1="-25" x2="0" y2="25" stroke="#7d4712" stroke-width="2"/>
</g>

<!-- Pine tree shape -->
<g id="pineTree" >
<!-- trunk -->
<rect x="-6" y="50" width="12" height="30" fill="#5A3E1B"/>
<!-- needles layers -->
<polygon points="0,0 -35,60 35,60" fill="#094d0c"/>
<polygon points="0,20 -30,80 30,80" fill="#0A5E0E"/>
<polygon points="0,40 -28,100 28,100" fill="#0D7611"/>
<polygon points="0,60 -25,120 25,120" fill="#0F880F"/>
</g>

<!-- Bamboo stalk -->
<g id="bamboo" >
<rect x="-6" y="0" width="12" height="120" fill="url(#bambooGradient)" stroke="#235020" stroke-width="2"/>
<line x1="0" y1="0" x2="0" y2="120" stroke="#345e2c" stroke-width="3"/>
<line x1="-6" y1="25" x2="6" y2="25" stroke="#345e2c" stroke-width="3"/>
<line x1="-6" y1="60" x2="6" y2="60" stroke="#345e2c" stroke-width="3"/>
<line x1="-6" y1="90" x2="6" y2="90" stroke="#345e2c" stroke-width="3"/>
<polygon points="0,0 15,-60 0,-40 -15,-60" fill="#3d773b"/>
<polygon points="0,-40 12,-85 0,-75 -12,-85" fill="#367031"/>
</g>

<!-- Flower -->
<g id="flower" >
<circle cx="0" cy="0" r="20" fill="#d73737" stroke="#7f1111" stroke-width="1.5"/>
<circle cx="0" cy="0" r="12" fill="#f8d0d0" opacity="0.8"/>
<circle cx="0" cy="0" r="4" fill="#b32727"/>
<path d="M0,-20 Q5,-10 10,-15 Q5,-5 15,-5 Q5,0 5,10 Q0,5 -5,10 Q0,0 -15,0 Q-10,-5 -5,-15 Q-10,-10 0,-20z" fill="#ff5a5a" opacity="0.75"/>
</g>

</defs>

<!-- Background garden -->
<rect width="1200" height="1600" fill="#dde4da"/>

<!-- Mist and clouds -->
<g filter="url(#softShadow)">
<ellipse cx="600" cy="140" rx="570" ry="100" fill="url(#cloudGradient)" opacity="0.6"/>
<ellipse cx="1000" cy="270" rx="160" ry="50" fill="url(#cloudGradient)" opacity="0.4"/>
<ellipse cx="200" cy="260" rx="180" ry="40" fill="url(#cloudGradient)" opacity="0.45"/>
<ellipse cx="780" cy="360" rx="260" ry="40" fill="url(#cloudGradient)" opacity="0.3"/>
</g>
<rect x="0" y="130" width="1200" height="1400" fill="url(#cloudGradient)" opacity="0.08" />

<!-- Garden elements -->
<!-- Pond -->
<ellipse cx="960" cy="1450" rx="160" ry="90" fill="url(#pondGradient)" filter="url(#softShadow)" />
<ellipse cx="980" cy="1465" rx="120" ry="40" fill="#4bb6cc" opacity="0.35" />
<path d="M 900 1450 Q 980 1500 1060 1450" fill="none" stroke="#86d9f5" stroke-width="3" opacity="0.35" />
<path d="M 950 1500 Q 980 1470 1010 1500" fill="none" stroke="#b0eaff" stroke-width="2" opacity="0.3" />

<!-- Decorative stone pathway -->
<g stroke="#7a704f" stroke-width="8" fill="none" filter="url(#softShadow)">
<path d="M100 1400 C 250 1200, 350 1100, 610 1260 S 960 1180, 1050 1270" />
</g>
<g fill="#bfb194" stroke="#988c66" stroke-width="3">
<ellipse cx="100" cy="1400" rx="42" ry="22" />
<ellipse cx="170" cy="1250" rx="50" ry="24" />
<ellipse cx="240" cy="1170" rx="53" ry="28" />
<ellipse cx="300" cy="1150" rx="35" ry="20" />
<ellipse cx="460" cy="1200" rx="45" ry="22" />
<ellipse cx="610" cy="1260" rx="63" ry="31" />
<ellipse cx="780" cy="1210" rx="50" ry="25" />
<ellipse cx="960" cy="1180" rx="62" ry="33" />
<ellipse cx="1050" cy="1270" rx="73" ry="37" />
</g>

<!-- Rocks near pond -->
<g filter="url(#softShadow)">
<ellipse cx="900" cy="1520" rx="45" ry="20" fill="#7d7465" />
<ellipse cx="1080" cy="1470" rx="60" ry="25" fill="#8c836e" />
<ellipse cx="1030" cy="1520" rx="22" ry="14" fill="#6b6351" />
</g>

<!-- Pine trees cluster left -->
<g transform="translate(180,1420) scale(0.85)">
<use xlink:href="#pineTree"/>
</g>
<g transform="translate(450,1410) scale(1)">
<use xlink:href="#pineTree"/>
</g>
<g transform="translate(370,1400) scale(0.75)">
<use xlink:href="#pineTree"/>
</g>

<!-- Bamboo cluster right -->
<g transform="translate(1050,1420) scale(1.2)">
<use xlink::href="#bamboo"/>
  </g>
  <g transform="translate(1150,1450) scale(1)">
    <use xlink:href="#bamboo"/>
  </g>

  <!-- Flowers near pathway -->
  <g transform="translate(150,1470)">
    <g transform="rotate(30)">
      <use xlink:href="#flower"/>
    </g>
    <g transform="rotate(60)">
      <use xlink:href="#flower"/>
    </g>
  </g>
  <g transform="translate(350,1300)">
    <g transform="rotate(-20)">
      <use xlink:href="#flower"/>
    </g>
  </g>
  <g transform="translate(920,1320)">
    <g transform="rotate(-45)">
      <use xlink:href="#flower"/>
    </g>
    <g transform="rotate(65)">
      <use xlink:href="#flower"/>
    </g>
  </g>

  <!-- Chinese Pagoda -->
  <g transform="translate(600,1100)">
    <!-- Dragon wrapping around the pagoda -->
    <path d="M -320 0 Q -200 0, -150 70 Q -100 140, -50 140 Q 0 140, 50 70 Q 100 0, 250 0 Q 190 60, 150 70 Q 110 80, 55 140 Q 0 200, -55 160 Q -110 120, -150 70 Q -190 20, -250 0 Z M -150 140 Q -100 100, -50 60 Q 0 20, 50 60 Q 100 100, 150 140 Q 100 200, 50 200 Q 0 200, -50 160 Q -100 120, -150 140" fill="url(#dragonBodyGradient)" filter="url(#shadow)" />
    
    <!-- Pagoda building with detailed layers -->
    <g id="pagoda">
      <!-- Roof layers -->
      <g transform="translate(0,-70)">
        <path d="M -180 -210 Q 0 20, 180 -210 Z" fill="url(#roofGradient)" />
        <path d="M -170 -200 Q 0 30, 170 -200 Z" fill="url(#roofGradient)" />
        <path d="M -160 -190 Q 0 40, 160 -190 Z" fill="url(#roofGradient)" />
      </g>
      
      <!-- Wood beams on each floor -->
      <g transform="translate(0,-200)">
        <g transform="translate(0,-20)">
          <rect x="-15" y="-60" width="30" height="120" fill="url(#woodBeamGradient)" stroke="#6a3c0f" stroke-width="1"/>
        </g>
        <g transform="translate(0,-120)">
          <rect x="-20" y="-60" width="40" height="120" fill="url(#woodBeamGradient)" stroke="#804909" stroke-width="1.5"/>
        </g>
        <g transform="translate(0,-180)">
          <rect x="-25" y="-60" width="50" height="120" fill="url(#woodBeamGradient)" stroke="#6a3c0f" stroke-width="1"/>
        </g>
      </g>
      
      <!-- Decorative carved ornaments on the building -->
      <g transform="translate(0,-260)">
        <use xlink:href="#carvedOrnament" />
        <use xlink:href="#carvedOrnament" transform="rotate(45)" />
        <use xlink:href="#carvedOrnament" transform="rotate(90)" />
        <use xlink:href="#carvedOrnament" transform="rotate(135)" />
        <use xlink:href="#carvedOrnament" transform="rotate(180)" />
      </g>
      
      <!-- Balconies on each floor -->
      <g transform="translate(0,-600)">
        <rect x="-200" y="-20" width="400" height="40" fill="url(#woodBeamGradient)" stroke="#46270b" stroke-width="1"/>
        <rect x="-190" y="-10" width="380" height="20" fill="url(#roofTilePattern)" stroke="#58350c" stroke-width="1"/>
        <rect x="-180" y="0" width="360" height="10" fill="url(#tileGradient)" stroke="#70430f" stroke-width="1"/>
      </g>
      
      <!-- Windows on each side of the pagoda -->
      <g>
        <use xlink:href="#window" transform="translate(-100,-350)" />
        <use xlink:href="#window" transform="translate(100,-350)" />
        <use xlink:href="#window" transform="rotate(90) translate(-100,-350)" />
        <use xlink:href="#window" transform="rotate(90) translate(100,-350)" />
      </g>
      
      <!-- Lanterns hanging on top of the balconies -->
      <g>
        <use xlink:href="#lantern" transform="translate(-200,-620)" />
        <use xlink:href="#lantern" transform="translate(200,-620)" />
        <use xlink:href="#lantern" transform="rotate(90) translate(-200,-620)" />
        <use xlink:href="#lantern" transform="rotate(90) translate(200,-620)" />
      </g>
    </g>
  </g>
</svg>