<svg viewBox="0 0 700 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky-gradient">
      <stop offset="0%" stop-color="#c8e8ff"/>
      <stop offset="100%" stop-color="#edf7ff"/>
    </radialGradient>
    <linearGradient id="pagoda-gradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d93838"/>
      <stop offset="100%" stop-color="#b80c0c"/>  
    </linearGradient>
    <radialGradient id="roof-accent" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdf80"/>
      <stop offset="100%" stop-color="#ffbf00"/>
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky-gradient)"/>
  <g class="clouds">
    <path d="M57 42c33 1 46-26 60-29s32 19 52 22 34-24 55-26 57 33 57 33" 
        fill="#fff" opacity=".8"/>
    <path d="M500 120c47-8 61-51 88-53s47 34 73 43 59-26 81-29 70 42 70 42"
        fill="#fff" opacity=".7"/>
  </g>
  <g class="garden">
    <path class="rocks" fill="#8d7b6e" d="M50 700h52l21 45 43-14 16 49 60-15 2 35h456l-34-70-40-8-45-120-24-36-25 67-58-33-40 45-62-55-12 77-34-25z"/>
    <g class="trees">
      <path d="M38 672l6-122 18-32-9-42" stroke="#51834e" stroke-width="3" fill="none"/>  
      <path d="M190 640v-90l30-40-18-50" stroke="#395839" stroke-width="4" fill="none"/>
      <path d="M80 620v-50l25-80" stroke="#51834e" stroke-width="2" fill="none"/>
    </g>
    <path class="water" d="M290 710c30 4 60-4 62-6s-16-10-20-8-12 12-44 14Z" fill="#88d8f2"/>
    <g class="bamboo">
      <path d="M650 710v-140" stroke="#5e913d" stroke-width="4" fill="none"/>
      <path d="M648 600h12l-5 8h-12z" fill="#5e913d"/>
      <path d="M648 620h12l-5 8h-12z" fill="#5e913d"/>  
      <path d="M648 580h12l-5 8h-12z" fill="#5e913d"/>
    </g>
    <circle class="sun" cx="100" cy="100" r="50" fill="url(#sun-gradient)">
      <radialGradient id="sun-gradient">
        <stop offset="0%" stop-color="#ffdf80"/>
        <stop offset="100%" stop-color="#ffbf00"/>  
      </radialGradient>
    </circle>
  </g>
  <g class="pagoda">
    <rect x="260" y="500" width="180" height="240" fill="url(#pagoda-gradient)"/>
    <g class="floors">
      <rect x="270" y="650" width="160" height="10" fill="#a14343"/>
      <rect x="270" y="580" width="160" height="10" fill="#a14343"/>
      <rect x="270" y="510" width="160" height="10" fill="#a14343"/>
      <rect x="285" y="450" width="130" height="10" fill="#a14343"/>
      <rect x="300" y="390" width="100" height="10" fill="#a14343"/>
      <rect x="315" y="330" width="70" height="10" fill="#a14343"/>  
      <rect x="330" y="280" width="40" height="10" fill="#a14343"/>
    </g>
    <g class="roofs">
      <path d="M420 280 350 270Q325 240 300 270L230 280Q270 240 270 200L430 200Q430 240 470 280Z" fill="#b80c0c"/>
      <path d="M400 330 340 315Q315 290 290 315L240 330Q295 290 290 250L410 250Q420 290 440 330Z" fill="#b80c0c"/>  
      <path d="M390 380 335 370Q305 340 270 370L220 380Q275 330 270 300L420 300Q430 330 435 380Z" fill="#b80c0c"/>
      <path d="M380 440 330 425Q300 390 260 420L210 440Q270 380 265 350L435 350Q450 380 460 440Z" fill="#b80c0c"/>
      <path d="M380 500 320 490Q290 450 260 480L210 500Q280 430 265 400L455 400Q470 435 470 500Z" fill="#b80c0c"/>
      <path d="M400 570 330 560Q300 530 270 560L210 570Q275 500 265 475L485 475Q495 510 500 570Z" fill="#b80c0c"/>
      <path d="M390 650 325 630Q290 600 260 630L200 650Q270 570 255 540L515 540Q530 580 540 650Z" fill="#b80c0c"/> 
    </g>
    <g class="roof-accents">  
      <path d="M250 650Q305 600 365 650Z" fill="url(#roof-accent)"/>
      <path d="M230 570Q290 530 345 570Z" fill="url(#roof-accent)"/>
      <path d="M200 500Q275 450 350 500Z" fill="url(#roof-accent)"/>
      <path d="M190 440Q260 400 330 440Z" fill="url(#roof-accent)"/>
      <path d="M190 390Q255 350 320 390Z" fill="url(#roof-accent)"/>
      <path d="M190 330Q245 290 300 330Z" fill="url(#roof-accent)"/>
      <path d="M200 280Q245 240 300 280Z" fill="url(#roof-accent)"/>
    </g>
    <g class="balconies">
      <rect x="285" y="620" width="130" height="8" fill="#b35a2b"/>
      <rect x="305" y="540" width="90" height="8" fill="#b35a2b"/>  
      <rect x="320" y="470" width="60" height="8" fill="#b35a2b"/>
    </g>
    <g class="beams">
      <rect x="275" y="665" width="6" height="75" fill="#51320e"/>
      <rect x="415" y="665" width="6" height="75" fill="#51320e"/>
      <rect x="350" y="735" width="6" height="5" fill="#51320e" transform="rotate(90 350 735)"/>
      <rect x="280" y="590" width="6" height="60" fill="#51320e"/>
      <rect x="410" y="590" width="6" height="60" fill="#51320e"/>
      <rect x="345" y="645" width="6" height="5" fill="#51320e" transform="rotate(90 345 645)"/>
    </g>
    <g class="details">
      <circle cx="355" cy="600" r="16" fill="#fdde5c"/>
      <circle cx="355" cy="370" r="15" fill="#fdde5c"/>
      <path d="M230 245Q325 210 430 245" stroke="#51320e" stroke-width="4" fill="none"/>
      <circle cx="345" cy="245" r="5" fill="#fdde5c"/>
    </g>
  </g>
  <g class="dragon">
    <path class="body" d="M495 460Q550 400 620 340T720 300Q820 310 845 430L805 495Q780 420 680 400Q600 360 550 420L495 460Z" fill="#679d34"/>  
    <path class="scales" d="M720 300Q820 310 845 430" stroke="#fd7e36" stroke-width="10" fill="none">
      <animateMotion path="M0 0L100 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <path class="mane" d="M845 430Q880 400 860 340T800 300Q780 250 720 300" stroke="#679d34" stroke-width="20" fill="none"/>
    <g class="legs">
      <path d="M680 430 690 480" stroke="#679d34" stroke-width="8"/>
      <path d="M610 460 630 510" stroke="#679d34" stroke-width="8"/>
      <path d="M550 450 590 500" stroke="#679d34" stroke-width="8"/>  
    </g>
    <circle class="eye" cx="810" cy="350" r="8" fill="#fff"/>
  </g>
</svg>