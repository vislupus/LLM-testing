    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1000" preserveAspectRatio="xMidYMid meet" aria-label="Traditional Chinese pagoda with dragon in garden" role="img">
      <defs>
        <!-- Sky gradient -->
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1a2340"/>
          <stop offset="40%" stop-color="#2e3568"/>
          <stop offset="70%" stop-color="#4a2e4a"/>
          <stop offset="100%" stop-color="#6b1e2b"/>
        </linearGradient>
        <!-- Mist -->
        <linearGradient id="mistGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
          <stop offset="50%" stop-color="#f0dcc0" stop-opacity="0.05"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <!-- Gold shimmer -->
        <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#bfa045"/>
          <stop offset="30%" stop-color="#f0d878"/>
          <stop offset="60%" stop-color="#bfa045"/>
          <stop offset="100%" stop-color="#ffe8a0"/>
        </linearGradient>
        <!-- Red lacquer -->
        <linearGradient id="redGrad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#8b1e22"/>
          <stop offset="50%" stop-color="#b92b27"/>
          <stop offset="100%" stop-color="#e43d3a"/>
        </linearGradient>
        <!-- Jade -->
        <linearGradient id="jadeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a6b52"/>
          <stop offset="100%" stop-color="#1a3a2a"/>
        </linearGradient>
        <!-- Stone -->
        <linearGradient id="stoneGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#eaddb0"/>
          <stop offset="50%" stop-color="#c8b898"/>
          <stop offset="100%" stop-color="#a89878"/>
        </linearGradient>
        <!-- Pond water -->
        <linearGradient id="pondGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2a6b6e"/>
          <stop offset="50%" stop-color="#1a4848"/>
          <stop offset="100%" stop-color="#0f2e2e"/>
        </linearGradient>
        <!-- Roof tile pattern -->
        <pattern id="tilePat" width="12" height="14" patternUnits="userSpaceOnUse">
          <rect width="12" height="14" fill="#b92b27"/>
          <path d="M0 2 Q3 0 6 2 T12 2 L6 14 Z" fill="#e85c5a" stroke="#8b1e22" stroke-width="0.3"/>
          <rect x="1" y="7" width="10" height="1" fill="#8b1e22" opacity="0.4"/>
        </pattern>
        <!-- Scale pattern -->
        <pattern id="scalePat" width="14" height="18" patternUnits="userSpaceOnUse">
          <path d="M0 9 Q3 0 7 9 T14 9" fill="none" stroke="#f0c878" stroke-width="1.2" opacity="0.9"/>
          <path d="M-2 14 Q5 5 12 14" fill="none" stroke="#d4a030" stroke-width="0.7"/>
          <circle cx="7" cy="9" r="1.5" fill="#ffe8a0"/>
        </pattern>
      </defs>

      <!-- ============ BACKGROUND ============ -->
      <rect x="0" y="0" width="720" height="1000" fill="url(#skyGrad)"/>
      <!-- Distant mountains / mist -->
      <ellipse cx="120" cy="780" rx="160" ry="60" fill="#2e3568" opacity="0.35"/>
      <ellipse cx="600" cy="820" rx="140" ry="50" fill="#4a2e4a" opacity="0.3"/>
      <ellipse cx="360" cy="720" rx="200" ry="80" fill="url(#mistGrad)"/>

      <!-- ============ GARDEN LANDSCAPE ============ -->
      <!-- Grass hill base -->
      <ellipse cx="360" cy="830" rx="300" ry="140" fill="#1b3a28"/>
      <ellipse cx="360" cy="860" rx="260" ry="110" fill="#243d2e"/>
      <ellipse cx="360" cy="820" rx="230" ry="100" fill="#2a6b32"/>
      
      <!-- Pond -->
      <ellipse cx="580" cy="780" rx="70" ry="25" fill="url(#pondGrad)" opacity="0.9"/>
      <ellipse cx="580" cy="775" rx="50" ry="18" fill="#1a4848" opacity="0.6"/>
      <!-- Pond reflection shimmer -->
      <path d="M540 778 Q555 770 580 778 T620 778" fill="none" stroke="#f0dcc0" stroke-width="0.8" opacity="0.3"/>
      <path d="M545 782 Q565 776 590 782 T615 782" fill="none" stroke="#ffffff" stroke-width="0.4" opacity="0.2"/>

      <!-- Rocks -->
      <g fill="#9a8c72" stroke="#6b5e48" stroke-width="1">
        <ellipse cx="140" cy="790" rx="22" ry="14" transform="rotate(-10 140 790)"/>
        <ellipse cx="160" cy="805" rx="14" ry="10" transform="rotate(15 160 805)"/>
        <ellipse cx="620" cy="810" rx="26" ry="16" transform="rotate(5 620 810)"/>
        <ellipse cx="640" cy="805" rx="12" ry="8" transform="rotate(-20 640 805)"/>
        <ellipse cx="680" cy="795" rx="10" ry="7" transform="rotate(10 680 795)"/>
        <ellipse cx="110" cy="820" rx="16" ry="11" transform="rotate(-5 110 820)"/>
        <ellipse cx="680" cy="830" rx="14" ry="9" transform="rotate(8 680 830)"/>
      </g>

      <!-- Bamboo clusters -->
      <g stroke="#2a4a2a" stroke-width="1.5" fill="none">
        <!-- Stalks -->
        <line x1="100" y1="840" x2="95" y2="720"/>
        <line x1="105" y1="840" x2="100" y2="710"/>
        <line x1="110" y1="845" x2="115" y2="730"/>
        <line x1="620" y1="835" x2="615" y2="710"/>
        <line x1="625" y1="838" x2="630" y2="720"/>
        <line x1="630" y1="842" x2="635" y2="730"/>
      </g>
      <!-- Bamboo leaves -->
      <g fill="#3a6b52" stroke="#1a3a2a" stroke-width="0.3">
        <path d="M95 760 L80 750 L90 745 L100 755 Z"/>
        <path d="M100 740 L85 730 L95 725 L105 735 Z"/>
        <path d="M115 750 L130 745 L125 755 L110 760 Z"/>
        <path d="M615 740 L600 735 L605 725 L620 730 Z"/>
        <path d="M625 730 L640 725 L635 715 L620 720 Z"/>
        <path d="M630 750 L645 745 L640 735 L625 740 Z"/>
      </g>
      <g fill="#3a6b52" stroke="#1a3a2a" stroke-width="0.3">
        <path d="M102 780 L90 775 L95 765 L108 770 Z"/>
        <path d="M620 760 L605 755 L610 745 L630 750 Z"/>
      </g>

      <!-- Pine trees -->
      <g>
        <!-- Left pine -->
        <polygon points="60,860 90,720 120,860" fill="#1a3a2a" stroke="#0f2a1a" stroke-width="1"/>
        <polygon points="65,830 85,740 115,830" fill="#243d2e" stroke="#0f2a1a" stroke-width="0.5"/>
        <polygon points="70,810 85,750 110,810" fill="#2a6b32" stroke="#0f2a1a" stroke-width="0.5"/>
        <rect x="82" y="860" width="6" height="50" fill="#3a3020"/>
        
        <!-- Right pine -->
        <polygon points="680,870 710,730 740,870" fill="#1a3a2a" stroke="#0f2a1a" stroke-width="1"/>
        <polygon points="685,840 710,750 735,840" fill="#243d2e" stroke="#0f2a1a" stroke-width="0.5"/>
        <polygon points="690,820 710,760 730,820" fill="#2a6b32" stroke="#0f2a1a" stroke-width="0.5"/>
        <rect x="705" y="870" width="6" height="45" fill="#3a3020"/>
      </g>

      <!-- Flowers -->
      <g>
        <circle cx="180" cy="830" r="3" fill="#b92b27"/>
        <circle cx="190" cy="835" r="2.5" fill="#e85c5a"/>
        <circle cx="170" cy="840" r="2" fill="#ffd966"/>
        <circle cx="200" cy="825" r="2.5" fill="#b92b27"/>
        <circle cx="210" cy="842" r="2" fill="#ffd966"/>
        
        <circle cx="540" cy="820" r="3" fill="#ffe8a0"/>
        <circle cx="550" cy="815" r="2.5" fill="#b92b27"/>
        <circle cx="560" cy="825" r="2" fill="#f0dcc0"/>
        <circle cx="530" cy="830" r="2.5" fill="#e85c5a"/>
      </g>

      <!-- Stone pathway -->
      <path d="M280 880 Q360 820 440 880 T580 860" fill="none" stroke="#c8b898" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.8"/>
      <path d="M290 875 Q350 825 450 875" fill="none" stroke="#eaddb0" stroke-width="2" stroke-linecap="round"/>

      <!-- Clouds / Mist -->
      <ellipse cx="200" cy="250" rx="60" ry="20" fill="#ffffff" opacity="0.05" filter="blur(4px)"/>
      <ellipse cx="500" cy="180" rx="80" ry="25" fill="#ffffff" opacity="0.04" filter="blur(5px)"/>
      <ellipse cx="320" cy="320" rx="70" ry="22" fill="#ffffff" opacity="0.06" filter="blur(3px)"/>
      <ellipse cx="80" cy="300" rx="50" ry="15" fill="#ffffff" opacity="0.05" filter="blur(4px)"/>

      <!-- ============ PAGODA STRUCTURE ============ -->
      <!-- 8 Floors -->
      <g id="pagoda" stroke="#8b1e22" stroke-width="0.5">
        <!-- Base platform -->
        <rect x="260" y="760" width="200" height="40" fill="url(#stoneGrad)" rx="4"/>
        <rect x="270" y="755" width="180" height="8" fill="#a89878"/>
        
        <!-- Floor 8 (top, smallest) -->
        <g>
          <rect x="320" y="220" width="80" height="50" fill="url(#redGrad)"/>
          <polygon points="315,225 330,190 390,220 405,255" fill="#c92a24"/>
          <polygon points="310,225 325,195 390,215 395,245" fill="#8b1e22"/>
          <polygon points="400,225 385,195 320,215 315,245" fill="#8b1e22"/>
          <!-- Roof curves -->
          <path d="M315 225 Q340 185 400 225" fill="none" stroke="#ffe8a0" stroke-width="3"/>
          <path d="M400 225 Q360 185 315 225" fill="none" stroke="#ffe8a0" stroke-width="3"/>
          <!-- Lantern -->
          <rect x="345" y="200" width="30" height="20" fill="#d4a030" rx="3"/>
          <circle cx="360" cy="215" r="6" fill="#ffe8a0" opacity="0.7"/>
        </g>
        
        <!-- Floor 7 -->
        <g>
          <rect x="310" y="275" width="100" height="55" fill="#b92b27"/>
          <rect x="305" y="270" width="110" height="10" fill="#e43d3a"/>
          <!-- Eaves -->
          <path d="M300 275 Q350 235 410 275" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <path d="M410 275 Q360 235 300 275" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <polyline points="305 275 310 265 400 265 410 275" fill="none" stroke="#d4a030" stroke-width="2"/>
        </g>
        
        <!-- Floor 6 -->
        <g>
          <rect x="295" y="340" width="130" height="60" fill="#b92b27"/>
          <rect x="290" y="335" width="140" height="10" fill="#e43d3a"/>
          <path d="M285 340 Q350 290 415 340" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <path d="M415 340 Q350 290 285 340" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <!-- Balcony -->
          <rect x="300" y="370" width="120" height="8" fill="#8b1e22"/>
          <line x1="300" y1="374" x2="420" y2="374" stroke="#d4a030" stroke-width="1"/>
        </g>
        
        <!-- Floor 5 -->
        <g>
          <rect x="280" y="410" width="160" height="65" fill="#b92b27"/>
          <rect x="275" y="405" width="170" height="10" fill="#e43d3a"/>
          <path d="M270 410 Q350 350 430 410" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <path d="M430 410 Q350 350 270 410" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <!-- Decorative beams -->
          <line x1="290" y1="405" x2="290" y2="475" stroke="#d4a030" stroke-width="2"/>
          <line x1="350" y1="405" x2="350" y2="475" stroke="#d4a030" stroke-width="2"/>
          <line x1="410" y1="405" x2="410" y2="475" stroke="#d4a030" stroke-width="2"/>
        </g>
        
        <!-- Floor 4 -->
        <g>
          <rect x="265" y="485" width="190" height="70" fill="#b92b27"/>
          <rect x="260" y="480" width="200" height="12" fill="#e43d3a"/>
          <path d="M250 485 Q350 410 450 485" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <path d="M450 485 Q350 410 250 485" fill="none" stroke="#ffe8a0" stroke-width="4"/>
          <!-- Lantern -->
          <rect x="340" y="460" width="25" height="22" fill="#bfa045" rx="2"/>
          <circle cx="352" cy="475" r="5" fill="#ffe8a0"/>
        </g>
        
        <!-- Floor 3 -->
        <g>
          <rect x="245" y="565" width="230" height="75" fill="#b92b27"/>
          <rect x="240" y="560" width="240" height="14" fill="#e43d3a"/>
          <path d="M230 565 Q350 480 470 565" fill="none" stroke="#ffe8a0" stroke-width="5"/>
          <path d="M470 565 Q350 480 230 565" fill="none" stroke="#ffe8a0" stroke-width="5"/>
          <!-- Balcony -->
          <rect x="255" y="595" width="210" height="10" fill="#8b1e22"/>
          <line x1="255" y1="600" x2="465" y2="600" stroke="#d4a030"/>
        </g>
        
        <!-- Floor 2 -->
        <g>
          <rect x="225" y="650" width="270" height="80" fill="#b92b27"/>
          <rect x="220" y="645" width="280" height="14" fill="#e43d3a"/>
          <path d="M210 650 Q350 545 490 650" fill="none" stroke="#ffe8a0" stroke-width="5"/>
          <path d="M490 650 Q350 545 210 650" fill="none" stroke="#ffe8a0" stroke-width="5"/>
        </g>
        
        <!-- Floor 1 (ground level) -->
        <g>
          <rect x="200" y="740" width="320" height="80" fill="#b92b27"/>
          <rect x="195" y="735" width="330" height="14" fill="#e43d3a"/>
          <path d="M180 740 Q350 620 520 740" fill="none" stroke="#ffe8a0" stroke-width="6"/>
          <path d="M520 740 Q350 620 180 740" fill="none" stroke="#ffe8a0" stroke-width="6"/>
          <!-- Main entrance arch -->
          <path d="M300 740 Q350 680 400 740" fill="none" stroke="#ffe8a0" stroke-width="5"/>
          <rect x="320" y="685" width="80" height="60" fill="#8b1e22"/>
          <line x1="320" y1="710" x2="400" y2="710" stroke="#d4a030" stroke-width="2"/>
        </g>
        
        <!-- Pagoda finial (top ornament) -->
        <g>
          <line x1="360" y1="200" x2="360" y2="150" stroke="#d4a030" stroke-width="4"/>
          <circle cx="360" cy="145" r="8" fill="#ffe8a0"/>
          <circle cx="360" cy="135" r="4" fill="#ffd966"/>
        </g>
      </g>

      <!-- ============ DRAGON (Coiling) ============ -->
      <g stroke-width="0" fill-rule="evenodd">
        <!-- Main body (coiling around pagoda) -->
        <path d="M 470 650 
                 Q 520 560 440 500 T 480 410 T 430 330 T 490 250 T 420 180 T 350 250 T 420 350 T 380 450 T 440 540 T 380 640 T 420 720" 
              fill="none" stroke="#c92a24" stroke-width="28" stroke-linecap="round" opacity="0.95"/>
        <!-- Body shading / depth -->
        <path d="M 465 645 Q 510 565 440 505 T 475 415 T 435 335 T 485 260 T 425 190 T 360 255 T 420 345 T 385 445 T 440 535 T 385 635" 
              fill="none" stroke="#8b1e22" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
        
        <!-- Dragon head -->
        <g transform="translate(360, 150)">
          <!-- Head shape -->
          <ellipse cx="0" cy="10" rx="45" ry="35" fill="#c92a24" stroke="#8b1e22" stroke-width="2"/>
          <ellipse cx="-15" cy="0" rx="18" ry="14" fill="#e43d3a" stroke="#8b1e22" stroke-width="1"/>
          
          <!-- Eyes -->
          <ellipse cx="-18" cy="0" rx="8" ry="10" fill="#ffe8a0" stroke="#8b1e22"/>
          <circle cx="-18" cy="0" r="3" fill="#8b1e22"/>
          <ellipse cx="18" cy="2" rx="8" ry="10" fill="#ffe8a0" stroke="#8b1e22"/>
          <circle cx="18" cy="2" r="3" fill="#8b1e22"/>
          
          <!-- Horns -->
          <path d="M -20 -15 Q -35 -40 -45 -15" fill="none" stroke="#ffd966" stroke-width="6" stroke-linecap="round"/>
          <path d="M 20 -15 Q 35 -40 45 -15" fill="none" stroke="#ffd966" stroke-width="6" stroke-linecap="round"/>
          
          <!-- Mane / whiskers -->
          <path d="M 35 5 Q 60 15 70 -5" fill="none" stroke="#ffe8a0" stroke-width="2"/>
          <path d="M 35 10 Q 65 25 75 0" fill="none" stroke="#ffe8a0" stroke-width="2"/>
          <path d="M -35 5 Q -60 15 -70 -5" fill="none" stroke="#ffe8a0" stroke-width="2"/>
          
          <!-- Mouth / teeth -->
          <path d="M -20 25 Q 0 35 20 25 L 15 20 L -15 20 Z" fill="#8b1e22" stroke="#8b1e22"/>
          <line x1="-10" y1="25" x2="-10" y2="30" stroke="#ffe8a0" stroke-width="1"/>
          <line x1="0" y1="25" x2="0" y2="32" stroke="#ffe8a0" stroke-width="1"/>
          <line x1="10" y1="25" x2="10" y2="30" stroke="#ffe8a0" stroke-width="1"/>
        </g>
        
        <!-- Claws (visible along body) -->
        <g fill="#ffd966" stroke="#bfa045">
          <rect x="460" y="645" width="8" height="12" rx="2" transform="rotate(-30 464 651)"/>
          <rect x="440" y="565" width="8" height="12" rx="2" transform="rotate(15 444 571)"/>
          <rect x="475" y="410" width="8" height="12" rx="2" transform="rotate(-20 479 416)"/>
          <rect x="425" y="340" width="8" height="12" rx="2" transform="rotate(10 429 346)"/>
          <rect x="480" y="180" width="8" height="10" rx="2" transform="rotate(-35 484 185)"/>
        </g>
        
        <!-- Scales overlay (decorative) -->
        <path d="M 450 640 Q 480 600 460 540" fill="url(#scalePat)" opacity="0.5"/>
        <path d="M 450 540 Q 470 480 440 420" fill="url(#scalePat)" opacity="0.5"/>
        <path d="M 420 330 Q 440 270 410 220" fill="url(#scalePat)" opacity="0.6"/>
        
        <!-- Dragon tail tip -->
        <path d="M 420 720 Q 450 780 500 820" fill="none" stroke="#c92a24" stroke-width="22" stroke-linecap="round"/>
        <path d="M 425 725 Q 455 770 490 810" fill="none" stroke="#8b1e22" stroke-width="12"/>
      </g>

      <!-- ============ LANTERNS (Hanging) ============ -->
      <g>
        <!-- Hanging lantern left -->
        <line x1="290" y1="330" x2="290" y2="370" stroke="#8b1e22" stroke-width="1"/>
        <rect x="282" y="370" width="16" height="22" fill="#bfa045" rx="2"/>
        <rect x="285" y="368" width="10" height="4" fill="#ffe8a0"/>
        <circle cx="290" cy="390" r="10" fill="url(#goldGrad)" opacity="0.8"/>
        <circle cx="290" cy="390" r="6" fill="#fff0d0"/>
        
        <!-- Hanging lantern right -->
        <line x1="430" y1="410" x2="430" y2="450" stroke="#8b1e22" stroke-width="1"/>
        <rect x="422" y="450" width="16" height="22" fill="#bfa045" rx="2"/>
        <circle cx="430" cy="470" r="10" fill="url(#goldGrad)" opacity="0.8"/>
        <circle cx="430" cy="470" r="6" fill="#fff0d0"/>
      </g>

      <!-- ============ DECORATIVE ORNAMENTS ============ -->
      <g>
        <!-- Gold trim lines -->
        <line x1="360" y1="810" x2="360" y2="870" stroke="#d4a030" stroke-width="3"/>
        <line x1="360" y1="870" x2="360" y2="880" stroke="#ffe8a0" stroke-width="1"/>
        <circle cx="360" cy="875" r="3" fill="#ffd966"/>
        
        <!-- Side decorative panels -->
        <rect x="230" y="650" width="6" height="90" fill="#8b1e22" rx="1"/>
        <rect x="484" y="650" width="6" height="90" fill="#8b1e22" rx="1"/>
        <rect x="250" y="660" width="220" height="3" fill="#d4a030"/>
      </g>
      
      <!-- Title seal / red stamp near bottom -->
      <g transform="translate(620, 920)">
        <rect x="-25" y="-25" width="50" height="50" fill="url(#redGrad)" rx="4" stroke="#8b1e22" stroke-width="2"/>
        <text x="0" y="6" text-anchor="middle" font-family="'Ma Shan Zheng Mao Bi', cursive" font-size="28" fill="#ffe8a0">天龍</text>
        <rect x="-35" y="-35" width="70" height="70" fill="none" stroke="#d4a030" stroke-width="1" rx="2"/>
      </g>

    </svg>