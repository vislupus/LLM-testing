<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200">
  <defs>
    <!-- Gradients for Depth and Atmosphere -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a6c" />
      <stop offset="50%" style="stop-color:#b21f1f" />
      <stop offset="100%" style="stop-color:#fdbb2d" />
    </linearGradient>
    
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#004e92" />
      <stop offset="100%" style="stop-color:#000428" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BF953F" />
      <stop offset="25%" style="stop-color:#FCF6BA" />
      <stop offset="50%" style="stop-color:#B38728" />
      <stop offset="75%" style="stop-color:#FBF5B7" />
      <stop offset="100%" style="stop-color:#AA771C" />
    </linearGradient>

    <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.6)" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)" />
    </radialGradient>

    <!-- Patterns for Roof Tiles -->
    <pattern id="tilePattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 5 Q 5 0 10 5" fill="none" stroke="#333" stroke-width="1" />
    </pattern>
    
    <!-- Dragon Scale Pattern -->
    <pattern id="scalePattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 0 10 Q 5 0 10 10" fill="#d4af37" stroke="#8b0000" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background: Sky and Horizon -->
  <rect width="800" height="1200" fill="url(#skyGrad)" />
  
  <!-- Distant Mountains -->
  <path d="M0 800 L150 600 L300 750 L500 550 L700 700 L800 600 L800 800 Z" fill="#2c3e50" opacity="0.6" />
  <path d="M-100 800 L100 650 L250 780 L450 620 L650 750 L900 650 L900 800 Z" fill="#34495e" opacity="0.4" />

  <!-- Pond -->
  <ellipse cx="400" cy="1100" rx="500" ry="150" fill="url(#waterGrad)" />
  <ellipse cx="300" cy="1120" rx="100" ry="40" fill="rgba(255,255,255,0.1)" />
  <ellipse cx="500" cy="1080" rx="150" ry="60" fill="rgba(255,255,255,0.1)" />

  <!-- Garden Foliage: Bamboo and Pine -->
  <g id="garden">
    <!-- Bamboo Left -->
    <g transform="translate(50, 800) scale(0.8)">
      <rect x="0" y="0" width="8" height="300" fill="#2d5a27" rx="2" />
      <rect x="0" y="50" width="8" height="5" fill="#1e3d1a" />
      <rect x="0" y="120" width="8" height="5" fill="#1e3d1a" />
      <path d="M0 40 Q-20 20 -40 40" fill="none" stroke="#4caf50" stroke-width="3" />
      <path d="M8 60 Q20 40 40 60" fill="none" stroke="#4caf50" stroke-width="3" />
    </g>
    <g transform="translate(80, 820) scale(0.7)">
      <rect x="0" y="0" width="8" height="300" fill="#3a7d32" rx="2" />
      <path d="M0 30 Q-20 10 -40 30" fill="none" stroke="#66bb6a" stroke-width="3" />
    </g>
    
    <!-- Pine Trees Right -->
    <g transform="translate(650, 750)">
      <rect x="15" y="0" width="15" height="150" fill="#5d4037" />
      <path d="M0 130 L30 100 L60 130 Z" fill="#1b5e20" />
      <path d="M-10 100 L30 60 L70 100 Z" fill="#2e7d32" />
      <path d="M-20 60 L30 20 L80 60 Z" fill="#388e3c" />
      <path d="M10 20 L30 0 L50 20 Z" fill="#4caf50" />
    </g>
    
    <!-- Rocks -->
    <path d="M100 1050 Q120 1000 180 1030 Q220 1060 150 1080 Z" fill="#7f8c8d" stroke="#34495e" stroke-width="2" />
    <path d="M600 1060 Q630 1020 680 1050 Q720 1080 650 1100 Z" fill="#95a5a6" stroke="#34495e" stroke-width="2" />
  </g>

  <!-- Pagoda Structure -->
  <g id="pagoda" transform="translate(400, 100)">
    <!-- Base Platform -->
    <rect x="-120" y="850" width="240" height="40" fill="#5d4037" />
    <rect x="-140" y="870" width="280" height="30" fill="#3e2723" />

    <!-- Floors Generation (Iterative approach for visual complexity) -->
    <!-- Floor 8 (Top) -->
    <g transform="translate(0, 650)">
      <rect x="-20" y="0" width="40" height="60" fill="#B22222" /> <!-- Wall -->
      <path d="M-40 0 L40 0 L30 -20 L-30 -20 Z" fill="#4A4A4A" /> <!-- Roof -->
      <path d="M-45 0 L45 0 L35 -10 L-35 -10 Z" fill="url(#goldGrad)" opacity="0.7" /> <!-- Roof trim -->
      <rect x="-5" y="10" width="10" height="15" fill="#FFD700" /> <!-- Window -->
      <circle cx="-45" cy="0" r="5" fill="#FFD700" /> <!-- Eave ornament -->
      <circle cx="45" cy="0" r="5" fill="#FFD700" />
    </g>

    <!-- Floor 7 -->
    <g transform="translate(0, 580)">
      <rect x="-30" y="0" width="60" height="70" fill="#B22222" />
      <path d="M-50 0 L50 0 L40 -25 L-40 -25 Z" fill="#4A4A4A" />
      <path d="M-55 0 L55 0 L45 -15 L-45 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="5" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 6 -->
    <g transform="translate(0, 510)">
      <rect x="-40" y="0" width="80" height="70" fill="#B22222" />
      <path d="M-60 0 L60 0 L50 -25 L-50 -25 Z" fill="#4A4A4A" />
      <path d="M-65 0 L65 0 L55 -15 L-55 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-25" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-5" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="15" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 5 -->
    <g transform="translate(0, 440)">
      <rect x="-50" y="0" width="100" height="70" fill="#B22222" />
      <path d="M-70 0 L70 0 L60 -25 L-60 -25 Z" fill="#4A4A4A" />
      <path d="M-75 0 L75 0 L65 -15 L-65 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-35" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-5" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="25" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 4 -->
    <g transform="translate(0, 370)">
      <rect x="-60" y="0" width="120" height="70" fill="#B22222" />
      <path d="M-80 0 L80 0 L70 -25 L-70 -25 Z" fill="#4A4A4A" />
      <path d="M-85 0 L85 0 L75 -15 L-75 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-45" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="45" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 3 -->
    <g transform="translate(0, 300)">
      <rect x="-70" y="0" width="140" height="70" fill="#B22222" />
      <path d="M-90 0 L90 0 L80 -25 L-80 -25 Z" fill="#4A4A4A" />
      <path d="M-95 0 L95 0 L85 -15 L-85 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-55" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-25" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="45" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 2 -->
    <g transform="translate(0, 230)">
      <rect x="-80" y="0" width="160" height="70" fill="#B22222" />
      <path d="M-100 0 L100 0 L90 -25 L-90 -25 Z" fill="#4A4A4A" />
      <path d="M-105 0 L105 0 L95 -15 L-95 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-65" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-35" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-5" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="25" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="55" y="15" width="10" height="20" fill="#FFD700" />
    </g>

    <!-- Floor 1 -->
    <g transform="translate(0, 160)">
      <rect x="-90" y="0" width="180" height="70" fill="#B22222" />
      <path d="M-110 0 L110 0 L100 -25 L-100 -25 Z" fill="#4A4A4A" />
      <path d="M-115 0 L115 0 L105 -15 L-105 -15 Z" fill="url(#goldGrad)" opacity="0.7" />
      <rect x="-75" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-45" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="-15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="15" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="45" y="15" width="10" height="20" fill="#FFD700" />
      <rect x="75" y="15" width="10" height="20" fill="#FFD700" />
    </g>
    
    <!-- Spire -->
    <path d="M0 650 L0 620 L5 630 L0 620 L-5 630 Z" fill="url(#goldGrad)" />
    <circle cx="0" cy="615" r="3" fill="#FFD700" />
  </g>

  <!-- The Coiling Dragon -->
  <g id="dragon">
    <!-- Dragon Body: a winding path with scale pattern -->
    <path d="M 400 650 
             C 500 600, 550 700, 400 750 
             C 300 800, 250 700, 400 650 
             S 550 850, 400 900 
             S 250 1000, 400 1050 
             C 500 1100, 600 1000, 500 950 
             C 400 900, 300 950, 400 1000" 
          fill="none" stroke="url(#goldGrad)" stroke-width="25" stroke-linecap="round" />
    
    <!-- Scale overlay -->
    <path d="M 400 650 
             C 500 600, 550 700, 400 750 
             C 300 800, 250 700, 400 650 
             S 550 850, 400 900 
             S 250 1000, 400 1050 
             C 500 1100, 600 1000, 500 950 
             C 400 900, 300 950, 400 1000" 
          fill="none" stroke="url(#scalePattern)" stroke-width="20" stroke-linecap="round" />

    <!-- Dragon Head -->
    <g transform="translate(400, 650) rotate(-20)">
      <ellipse cx="0" cy="0" rx="25" ry="15" fill="#B22222" />
      <circle cx="10" cy="-5" r="4" fill="white" /> <!-- Eye -->
      <circle cx="10" cy="-5" r="2" fill="black" />
      <!-- Horns -->
      <path d="M-5 -10 Q-15 -30 -30 -25" fill="none" stroke="#FFD700" stroke-width="3" />
      <path d="M5 -10 Q15 -30 30 -25" fill="none" stroke="#FFD700" stroke-width="3" />
      <!-- Whiskers -->
      <path d="M15 0 Q 40 10 50 30" fill="none" stroke="#FFD700" stroke-width="1.5" />
      <path d="M15 0 Q 40 -10 50 -30" fill="none" stroke="#FFD700" stroke-width="1.5" />
      <!-- Mane -->
      <path d="M-20 0 Q-40 10 -50 0 Q-40 -10 -20 0" fill="#FF4500" />
      <path d="M-15 5 Q-30 15 -40 5" fill="#FF4500" />
    </g>

    <!-- Dragon Claws (placed at curve peaks) -->
    <g transform="translate(520, 680)">
      <path d="M0 0 L10 10 M0 0 L-10 10 M0 0 L0 15" stroke="#B22222" stroke-width="3" />
    </g>
    <g transform="translate(280, 780)">
      <path d="M0 0 L10 10 M0 0 L-10 10 M0 0 L0 15" stroke="#B22222" stroke-width="3" />
    </g>
    <g transform="translate(520, 1030)">
      <path d="M0 0 L10 10 M0 0 L-10 10 M0 0 L0 15" stroke="#B22222" stroke-width="3" />
    </g>
  </g>

  <!-- Final Finishing: Clouds and Mist -->
  <g id="mist">
    <ellipse cx="200" cy="1100" rx="150" ry="50" fill="url(#mistGrad)" />
    <ellipse cx="600" cy="1100" rx="150" ry="50" fill="url(#mistGrad)" />
    <ellipse cx="400" cy="800" rx="200" ry="40" fill="url(#mistGrad)" opacity="0.5" />
    
    <!-- Stylized Clouds -->
    <g transform="translate(100, 200)" fill="white" opacity="0.7">
      <circle cx="0" cy="0" r="30" />
      <circle cx="30" cy="0" r="30" />
      <circle cx="60" cy="0" r="30" />
      <circle cx="30" cy="-20" r="30" />
    </g>
    <g transform="translate(600, 300)" fill="white" opacity="0.7">
      <circle cx="0" cy="0" r="30" />
      <circle cx="30" cy="0" r="30" />
      <circle cx="60" cy="0" r="30" />
      <circle cx="30" cy="-20" r="30" />
    </g>
  </g>

  <!-- Decorative Border -->
  <rect x="10" y="10" width="780" height="1180" fill="none" stroke="url(#goldGrad)" stroke-width="5" rx="10" />
</svg>