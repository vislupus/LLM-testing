<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="roofGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2e5c55;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3a7d74;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2e5c55;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8a2b2b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a83232;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a2b2b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="dragonBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e8b57;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006400;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a1d8e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4fa0b8;stop-opacity:1" />
    </linearGradient>

    <!-- Patterns -->
    <pattern id="tilePattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="18" height="8" fill="#2e5c55" />
    </pattern>
    
    <pattern id="windowLattice" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3e2723" />
      <path d="M0,10 L20,10 M10,0 L10,20" stroke="#5d4037" stroke-width="2"/>
    </pattern>

    <!-- Reusable Components -->
    <g id="lantern">
      <path d="M0,0 L0,-10" stroke="#5d4037" stroke-width="2" />
      <ellipse cx="0" cy="10" rx="8" ry="12" fill="#d32f2f" stroke="#b71c1c" />
      <path d="M-8,10 Q0,25 8,10" fill="none" stroke="#ffeb3b" stroke-width="2" />
      <line x1="-5" y1="18" x2="5" y2="18" stroke="#ffeb3b" stroke-width="1" />
      <line x1="0" y1="10" x2="0" y2="22" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
    </g>
    
    <g id="roof">
       <!-- Main Roof Tile Area -->
       <path d="M-100,0 L100,0 L80,-30 L-80,-30 Z" fill="url(#roofGradient)" />
       <!-- Curved Eaves -->
       <path d="M-100,0 Q-110,-5 -120,10 L-80,10 Z" fill="#ffd700" />
       <path d="M100,0 Q110,-5 120,10 L80,10 Z" fill="#ffd700" />
       <!-- Ridge -->
       <rect x="-85" y="-30" width="170" height="5" fill="url(#goldGradient)" />
       <path d="M-90,-30 L90,-30 L95,-40 L-95,-40 Z" fill="url(#goldGradient)" />
    </g>

    <g id="floorLevel">
        <rect x="-60" y="0" width="120" height="60" fill="url(#wallGradient)" />
        <rect x="-65" y="0" width="130" height="5" fill="#3e2723" /> <!-- Beam -->
        <rect x="-60" y="60" width="120" height="5" fill="#3e2723" /> <!-- Floor -->
        <!-- Windows -->
        <rect x="-40" y="15" width="30" height="30" fill="url(#windowLattice)" stroke="#ffd700" stroke-width="2"/>
        <rect x="10" y="15" width="30" height="30" fill="url(#windowLattice)" stroke="#ffd700" stroke-width="2"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#skyGradient)" />
  
  <!-- Distant Mountains/Clouds -->
  <path d="M0,800 Q200,600 400,800 T800,800 V1000 H0 Z" fill="#cfd8dc" opacity="0.5" />
  <path d="M0,850 Q300,750 600,850 T800,900 V1000 H0 Z" fill="#b0bec5" opacity="0.5" />

  <!-- Ground -->
  <path d="M0,900 Q400,850 800,900 V1000 H0 Z" fill="#8d6e63" />
  <path d="M0,920 Q400,870 800,920 V1000 H0 Z" fill="#6d4c41" />

  <!-- Garden Elements -->
  
  <!-- Pond -->
  <ellipse cx="600" cy="920" rx="180" ry="60" fill="url(#waterGradient)" stroke="#546e7a" stroke-width="2" />
  <!-- Lily Pads -->
  <g fill="#4caf50" stroke="#2e7d32">
      <circle cx="550" cy="920" r="15" />
      <circle cx="580" cy="910" r="12" />
      <circle cx="620" cy="930" r="14" />
      <circle cx="650" cy="915" r="10" />
  </g>
  <!-- Lotus -->
  <g transform="translate(580, 910)">
      <path d="M0,0 C-5,-5 -5,-15 0,-20 C5,-15 5,-5 0,0" fill="#f48fb1" />
      <path d="M0,0 C-8,0 -10,-10 -2,-15" fill="none" stroke="#f06292" stroke-width="2"/>
  </g>

  <!-- Bamboo (Left) -->
  <g transform="translate(50, 600)">
    <rect x="0" y="-200" width="10" height="400" fill="#689f38" />
    <rect x="20" y="-150" width="8" height="350" fill="#7cb342" />
    <rect x="-10" y="-100" width="6" height="300" fill="#558b2f" />
    <!-- Leaves -->
    <path d="M0,-200 Q30,-250 60,-200 Q30,-180 0,-200" fill="#8bc34a" />
    <path d="M20,-150 Q50,-200 80,-150 Q50,-130 20,-150" fill="#8bc34a" />
    <path d="M-10,-100 Q20,-150 50,-100 Q20,-80 -10,-100" fill="#8bc34a" />
  </g>

  <!-- Pine Tree (Right) -->
  <g transform="translate(750, 700) scale(1.5)">
      <path d="M0,0 L-5,100 L5,100 Z" fill="#3e2723" /> <!-- Trunk -->
      <path d="M0,-20 L-30,20 L30,20 Z" fill="#1b5e20" />
      <path d="M0,-40 L-25,0 L25,0 Z" fill="#2e7d32" />
      <path d="M0,-60 L-20,-20 L20,-20 Z" fill="#388e3c" />
  </g>

  <!-- Rocks -->
  <path d="M150,950 Q180,900 220,950 T280,960 Z" fill="#78909c" stroke="#546e7a" stroke-width="2" />
  <path d="M180,950 L190,920 L210,940 Z" fill="#546e7a" />


  <!-- THE PAGODA -->
  <g transform="translate(400, 150)">
    
    <!-- Dragon Tail (Behind) -->
    <path d="M-150,600 Q-200,500 -150,400 T100,200" fill="none" stroke="#1b5e20" stroke-width="30" stroke-linecap="round" />
    <path d="M-150,600 Q-200,500 -150,400 T100,200" fill="none" stroke="#4caf50" stroke-width="10" stroke-dasharray="20,10" />

    <!-- Base -->
    <rect x="-180" y="650" width="360" height="40" fill="#5d4037" />
    <rect x="-200" y="690" width="400" height="20" fill="#3e2723" />

    <!-- Floors (7 to 1, bottom to top) -->
    <!-- Floor 1 -->
    <g transform="translate(0, 650)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 2 -->
    <g transform="translate(0, 560) scale(0.9)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 3 -->
    <g transform="translate(0, 475) scale(0.8)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 4 -->
    <g transform="translate(0, 395) scale(0.7)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 5 -->
    <g transform="translate(0, 320) scale(0.6)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 6 -->
    <g transform="translate(0, 250) scale(0.5)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Floor 7 -->
    <g transform="translate(0, 185) scale(0.4)">
        <use href="#floorLevel" />
        <use href="#roof" transform="translate(0, -30)" />
    </g>

    <!-- Spire -->
    <rect x="-5" y="140" width="10" height="50" fill="url(#goldGradient)" />
    <circle cx="0" cy="135" r="8" fill="url(#goldGradient)" />
    <path d="M-10,135 L0,100 L10,135 Z" fill="#ffd700" />

    <!-- Dragon Head (Coiled on Front Right) -->
    <g transform="translate(120, 600) rotate(20)">
        <!-- Body Segment -->
        <path d="M0,0 Q50,-20 80,20 T120,0" fill="none" stroke="url(#dragonBody)" stroke-width="35" stroke-linecap="round" />
        <!-- Belly Scales -->
        <path d="M0,0 Q50,-20 80,20 T120,0" fill="none" stroke="#fff176" stroke-width="8" stroke-dasharray="5,10" />
        
        <!-- Head -->
        <g transform="translate(120, 0) rotate(10)">
            <!-- Mane -->
            <path d="M0,0 Q-20,-30 -10,-50" stroke="#ffd700" stroke-width="3" fill="none"/>
            <path d="M10,-5 Q0,-40 20,-40" stroke="#ffd700" stroke-width="3" fill="none"/>
            
            <!-- Head Shape -->
            <path d="M-20,10 Q0,-30 40,0 Q50,10 40,30 Q0,40 -20,10 Z" fill="#2e8b57" stroke="#1b5e20" stroke-width="2" />
            <!-- Snout -->
            <path d="M30,10 Q50,15 55,25 L35,25 Z" fill="#81c784" />
            <!-- Eye -->
            <circle cx="15" cy="5" r="4" fill="#ffeb3b" />
            <circle cx="15" cy="5" r="1.5" fill="#000" />
            <!-- Horns -->
            <path d="M5,-10 Q10,-30 25,-25" stroke="#5d4037" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M15,-10 Q20,-35 35,-30" stroke="#5d4037" stroke-width="4" fill="none" stroke-linecap="round"/>
            <!-- Whiskers -->
            <path d="M40,20 Q60,10 80,15" stroke="#fff" stroke-width="1.5" fill="none"/>
            <path d="M40,25 Q60,35 80,30" stroke="#fff" stroke-width="1.5" fill="none"/>
            
            <!-- Claw -->
            <path d="M10,30 L5,45 L15,40 Z" fill="#ffd700" stroke="#b71c1c" stroke-width="1"/>
            <path d="M20,32 L25,45 L30,35 Z" fill="#ffd700" stroke="#b71c1c" stroke-width="1"/>
        </g>
    </g>
    
    <!-- Dragon Coils (Lower Body Front) -->
    <path d="M-80,650 Q-150,700 -50,720 T80,680" fill="none" stroke="url(#dragonBody)" stroke-width="30" />
    <path d="M-80,650 Q-150,700 -50,720 T80,680" fill="none" stroke="#fff176" stroke-width="8" stroke-dasharray="5,10" />

    <!-- Lanterns -->
    <use href="#lantern" x="-80" y="0" />
    <use href="#lantern" x="80" y="0" />
    <use href="#lantern" x="-70" y="-170" transform="scale(0.8)" />
    <use href="#lantern" x="70" y="-170" transform="scale(0.8)" />
    <use href="#lantern" x="-60" y="-300" transform="scale(0.6)" />
    <use href="#lantern" x="60" y="-300" transform="scale(0.6)" />

  </g>

  <!-- Mist / Atmosphere -->
  <rect x="0" y="850" width="800" height="150" fill="url(#skyGradient)" opacity="0.4" />

  <!-- Foreground Path -->
  <path d="M350,1000 L400,950 L450,1000 Z" fill="#d7ccc8" />

</svg>