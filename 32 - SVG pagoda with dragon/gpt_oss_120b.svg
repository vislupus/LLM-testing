<?xml version="1.0" encoding="UTF-8"?>
<!--
  Traditional Chinese Pagoda in a Garden with a Coiling Dragon
  – 8‑floor pagoda, detailed roofs, lanterns, windows, wooden beams
  – Dragon with scales, horns, whiskers, claws, flowing mane
  – Garden: rocks, bamboo, pine, flowers, pond, mist, paths
  – All gradients, patterns and filters are defined inline.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="800"
     viewBox="0 0 1000 800"
     preserveAspectRatio="xMidYMid meet">

  <!-- ==============================================================
       DEFINITIONS (gradients, patterns, filters, symbols)
       ============================================================== -->
  <defs>

    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d258"/>
      <stop offset="100%" stop-color="#c78a12"/>
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6e6e"/>
      <stop offset="100%" stop-color="#c71c1c"/>
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ba34d"/>
      <stop offset="100%" stop-color="#2b6c2e"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c0ff"/>
      <stop offset="100%" stop-color="#1c7fd5"/>
    </linearGradient>

    <radialGradient id="mistGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8abf5c"/>
      <stop offset="100%" stop-color="#4a7d34"/>
    </linearGradient>

    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a59d92"/>
      <stop offset="100%" stop-color="#635e55"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Patterns (scale texture for dragon) -->
    <pattern id="scalePattern" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="none"/>
      <path d="M0,6 L6,0 L12,6 L6,12 Z" fill="rgba(0,0,0,0.15)"/>
    </pattern>

    <!-- Symbol: Dragon head (re‑used) -->
    <symbol id="dragonHead" viewBox="0 0 120 80">
      <path d="M10,40 C20,5 100,5 110,40 C100,75 20,75 10,40 Z"
            fill="#ff7d00" stroke="#b34c00" stroke-width="2"/>
      <!-- Horns -->
      <path d="M30,10 L20,0 L35,5 Z" fill="#e0a040"/>
      <path d="M90,10 L100,0 L85,5 Z" fill="#e0a040"/>
      <!-- Eyes -->
      <circle cx="45" cy="38" r="8" fill="#fff"/>
      <circle cx="45" cy="38" r="5" fill="#000"/>
      <circle cx="75" cy="38" r="8" fill="#fff"/>
      <circle cx="75" cy="38" r="5" fill="#000"/>
      <!-- Whiskers -->
      <path d="M30,45 L0,55" stroke="#b34c00" stroke-width="2"/>
      <path d="M30,48 L0,68" stroke="#b34c00" stroke-width="2"/>
      <path d="M90,45 L120,55" stroke="#b34c00" stroke-width="2"/>
      <path d="M90,48 L120,68" stroke="#b34c00" stroke-width="2"/>
      <!-- Mouth -->
      <path d="M55,55 Q60,65 65,55" stroke="#b34c00" stroke-width="3" fill="none"/>
    </symbol>

  </defs>

  <!-- ==============================================================
       BACKGROUND (sky, mist, clouds)
       ============================================================== -->
  <rect width="100%" height="100%" fill="#cce6ff"/>

  <!-- Mist -->
  <ellipse cx="500" cy="150" rx="400" ry="120"
           fill="url(#mistGrad)" opacity="0.6"/>

  <!-- Clouds (simple path) -->
  <g fill="#fff" opacity="0.9">
    <path d="M150,120 a40,30 0 0,1 80,0 a30,30 0 0,1 60,0 a40,30 0 0,1 80,0 a30,30 0 0,1 60,0 h-280z"/>
    <path d="M650,100 a30,20 0 0,1 60,0 a20,20 0 0,1 40,0 a30,20 0 0,1 60,0 a20,20 0 0,1 40,0 h-200z"/>
  </g>

  <!-- ==============================================================
       GARDEN FEATURES (pond, rocks, bamboo, pine, paths, flowers)
       ============================================================== -->

  <!-- Pond -->
  <ellipse cx="800" cy="620" rx="120" ry="80" fill="url(#waterGrad)" filter="url(#softShadow)"/>

  <!-- Rock cluster -->
  <g id="rocks">
    <ellipse cx="200" cy="650" rx="45" ry="30" fill="url(#rockGrad)" filter="url(#softShadow)"/>
    <ellipse cx="260" cy="620" rx="30" ry="20" fill="url(#rockGrad)" filter="url(#softShadow)"/>
    <ellipse cx="150" cy="620" rx="20" ry="15" fill="url(#rockGrad)" filter="url(#softShadow)"/>
  </g>

  <!-- Bamboo grove (stylised) -->
  <g id="bamboo" fill="url(#bambooGrad)" stroke="#4a7d34" stroke-width="2">
    <path d="M70,480 L80,200 L90,480" />
    <path d="M110,480 L120,180 L130,480" />
    <path d="M150,480 L160,210 L170,480" />
    <!-- Leaves -->
    <path d="M80,250 q20,-40 40,0" fill="none" stroke="#4a7d34" stroke-width="1.5"/>
    <path d="M120,230 q20,-35 40,0" fill="none" stroke="#4a7d34" stroke-width="1.5"/>
    <path d="M160,250 q20,-45 40,0" fill="none" stroke="#4a7d34" stroke-width="1.5"/>
  </g>

  <!-- Pine tree (left side) -->
  <g id="pine" transform="translate(350,500)">
    <polygon points="0,0 -30,-120 30,-120" fill="#1e4620"/>
    <polygon points="0,-30 -25,-100 25,-100" fill="#254c27"/>
    <polygon points="0,-60 -20,-80 20,-80" fill="#305b31"/>
    <rect x="-5" y="0" width="10" height="30" fill="#3e3e3e"/>
  </g>

  <!-- Pathways (curved) -->
  <path d="M500,800 Q500,650 460,540 Q420,430 380,380"
        fill="none" stroke="#c2b280" stroke-width="12" stroke-linecap="round"/>

  <!-- Flowers (simple circles) -->
  <g fill="#ff5e5e" stroke="#b42e2e" stroke-width="1">
    <circle cx="720" cy="560" r="6"/>
    <circle cx="735" cy="580" r="6"/>
    <circle cx="750" cy="550" r="6"/>
    <circle cx="770" cy="570" r="6"/>
  </g>

  <!-- ==============================================================
       PAGODA (8 floors)
       ============================================================== -->
  <g id="pagoda" transform="translate(500,620)">
    <!-- Define a reusable floor -->
    <defs>
      <g id="floor">
        <!-- Wooden beams  -->
        <rect x="-80" y="-20" width="160" height="40" fill="#99734f"/>
        <line x1="-70" y1="-10" x2="-70" y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="-50" y1="-10" x2="-50" y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="-30" y1="-10" x2="-30" y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="-10" y1="-10" x2="-10" y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="10"  y1="-10" x2="10"  y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="30"  y1="-10" x2="30"  y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="50"  y1="-10" x2="50"  y2="10" stroke="#7a603a" stroke-width="2"/>
        <line x1="70"  y1="-10" x2="70"  y2="10" stroke="#7a603a" stroke-width="2"/>
        <!-- Windows (rounded) -->
        <rect x="-70" y="-12" width="30" height="24" rx="8" ry="8"
              fill="url(#goldGrad)" stroke="#7a603a" stroke-width="1"/>
        <rect x="10" y="-12" width="30" height="24" rx="8" ry="8"
              fill="url(#goldGrad)" stroke="#7a603a" stroke-width="1"/>
        <!-- Lanterns -->
        <circle cx="-55" cy="-30" r="6" fill="url(#redGrad)" stroke="#7a603a" stroke-width="1"/>
        <circle cx="25" cy="-30" r="6" fill="url(#redGrad)" stroke="#7a603a" stroke-width="1"/>
        <!-- Balcony rail -->
        <path d="M-80,-20 h160" stroke="#623d28" stroke-width="4"/>
      </g>
    </defs>

    <!-- Floor 1 (ground) -->
    <use href="#floor" transform="translate(0,0)" />

    <!-- Roof 1 (curved eaves) -->
    <g transform="translate(0,-20)">
      <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
            fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
    </g>

    <!-- Repeat floors 2‑8, each lifted 50px up -->
    <g id="upperFloors">
      <g transform="translate(0,-50)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>

      <g transform="translate(0,-100)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>

      <g transform="translate(0,-150)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>

      <g transform="translate(0,-200)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>

      <g transform="translate(0,-250)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>

      <g transform="translate(0,-300)">
        <use href="#floor"/>
        <g transform="translate(0,-20)">
          <path d="M-90,0 C-80,-30 -70,-30 -60,0 L60,0 C70,-30 80,-30 90,0"
                fill="url(#redGrad)" stroke="#7a603a" stroke-width="2"/>
        </g>
      </g>
    </g>

    <!-- Topmost roof (the 8th) – taller and more ornate -->
    <g transform="translate(0,-350)">
      <use href="#floor"/>
      <g transform="translate(0,-30)">
        <path d="M-100,0 C-90,-40 -80,-40 -70,0 L70,0 C80,-40 90,-40 100,0"
              fill="url(#redGrad)" stroke="#7a603a" stroke-width="3"/>
        <!-- Decorative ridge -->
        <path d="M-100,0 L100,0" stroke="#ffd700" stroke-width="4"/>
      </g>
    </g>
  </g>

  <!-- ==============================================================
       DRAGON (coiling around the pagoda)
       ============================================================== -->
  <g id="dragon" filter="url(#softShadow)">
    <!-- Body – a long sinuous path -->
    <path d="
        M380,720
        C350,680 340,620 360,580
        C380,540 420,540 440,580
        C460,620 470,660 440,700
        C410,740 390,740 380,720
        " fill="none" stroke="#ff7d00" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Scales – patterned fill over the body -->
    <path d="
        M380,720
        C350,680 340,620 360,580
        C380,540 420,540 440,580
        C460,620 470,660 440,700
        C410,740 390,740 380,720
        " fill="url(#scalePattern)" opacity="0.4"/>

    <!-- Head (symbol) placed at the front of the curve -->
    <use href="#dragonHead"
         x="350" y="560"
         width="120" height="80"
         transform="rotate(-30 410 600)"/>

    <!-- Claws – simple triangles at the tail end -->
    <polygon points="340,620 330,630 350,630" fill="#ff7d00" stroke="#b34c00" stroke-width="1"/>
    <polygon points="360,630 350,640 370,640" fill="#ff7d00" stroke="#b34c00" stroke-width="1"/>

    <!-- Mane (flowing lines) -->
    <path d="M390,590 q10,-20 20,0" stroke="#ffcc66" stroke-width="4" fill="none"/>
    <path d="M400,600 q10,-25 20,0" stroke="#ffcc66" stroke-width="4" fill="none"/>
    <path d="M410,610 q10,-30 20,0" stroke="#ffcc66" stroke-width="4" fill="none"/>

    <!-- Whiskers & facial details are within the head symbol
         (already defined). -->
  </g>

  <!-- ==============================================================
       FINAL OVERLAY – subtle vignette
       ============================================================== -->
  <rect x="0" y="0" width="100%" height="100%" fill="rgba(0,0,0,0.05)"/>

</svg>