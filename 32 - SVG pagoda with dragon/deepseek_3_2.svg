<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="1000" viewBox="0 0 800 1000">
    <defs>
        <!-- Gradients -->
        <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#ffd700;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#8b0000;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#600000;stop-opacity:1"/>
        </linearGradient>
        <linearGradient id="dragonBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#006400;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#228b22;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#32cd32;stop-opacity:1"/>
        </linearGradient>
        <radialGradient id="pondGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:0.7"/>
            <stop offset="100%" style="stop-color:#4682b4;stop-opacity:0.9"/>
        </radialGradient>
        <linearGradient id="bambooGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#228b22;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#006400;stop-opacity:1"/>
        </linearGradient>
        
        <!-- Patterns -->
        <pattern id="tilePattern" x="0" y="0" width="20" height="10" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="20" height="5" fill="#2f4f4f"/>
            <rect x="0" y="5" width="20" height="5" fill="#36454f"/>
        </pattern>
        <pattern id="woodPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
            <path d="M0,0 L8,0 L8,8 L0,8 Z" fill="none" stroke="#8b4513" stroke-width="0.5"/>
            <path d="M4,0 L4,8 M0,4 L8,4" stroke="#8b4513" stroke-width="0.3"/>
        </pattern>
        
        <!-- Filters -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="2" dy="2" result="offsetblur"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="800" height="1000" fill="url(#pondGrad)"/>
    <rect x="100" y="200" width="600" height="600" fill="#2e8b57" filter="url(#shadow)"/>
    
    <!-- Mist -->
    <ellipse cx="400" cy="300" rx="250" ry="50" fill="#f0f8ff" opacity="0.3"/>
    <ellipse cx="500" cy="400" rx="200" ry="40" fill="#f0f8ff" opacity="0.2"/>
    <ellipse cx="300" cy="500" rx="180" ry="35" fill="#f0f8ff" opacity="0.25"/>
    
    <!-- Garden Elements -->
    <!-- Pond -->
    <ellipse cx="650" cy="750" rx="120" ry="80" fill="url(#pondGrad)" stroke="#4682b4" stroke-width="2"/>
    
    <!-- Rocks -->
    <path d="M150,750 Q200,720 250,730 Q280,740 300,750 Q280,770 250,760 Q220,750 150,750" fill="#708090" filter="url(#shadow)"/>
    <path d="M600,800 Q630,780 670,790 Q690,800 700,810 Q680,830 650,820 Q620,810 600,800" fill="#a9a9a9" filter="url(#shadow)"/>
    
    <!-- Bamboo -->
    <g id="bambooStalk">
        <rect x="0" y="0" width="15" height="200" rx="7" fill="url(#bambooGrad)"/>
        <line x1="7.5" y1="20" x2="7.5" y2="180" stroke="#006400" stroke-width="0.5"/>
        <ellipse cx="7.5" cy="190" rx="7" ry="5" fill="#228b22"/>
    </g>
    <use xlink:href="#bambooStalk" x="100" y="750" transform="scale(0.8)"/>
    <use xlink:href="#bambooStalk" x="130" y="730" transform="scale(1)"/>
    <use xlink:href="#bambooStalk" x="160" y="740" transform="scale(0.9)"/>
    
    <!-- Pine Tree -->
    <g id="pineTree" transform="translate(700, 650)">
        <rect x="-10" y="0" width="20" height="100" fill="#8b4513"/>
        <path d="M-50,0 Q0,-40 50,0 Q30,-30 0,-60 Q-30,-30 -50,0" fill="#228b22"/>
        <path d="M-40,20 Q0,-20 40,20 Q25,-10 0,-30 Q-25,-10 -40,20" fill="#228b22"/>
        <path d="M-30,40 Q0,10 30,40 Q20,20 0,5 Q-20,20 -30,40" fill="#228b22"/>
    </g>
    
    <!-- Flowers -->
    <g id="lotus">
        <ellipse cx="0" cy="0" rx="15" ry="10" fill="#ffb6c1"/>
        <ellipse cx="0" cy="0" rx="10" ry="15" fill="#ff69b4"/>
        <circle cx="0" cy="0" r="5" fill="#ffd700"/>
    </g>
    <use xlink:href="#lotus" x="620" y="750"/>
    <use xlink:href="#lotus" x="650" y="730"/>
    <use xlink:href="#lotus" x="680" y="750"/>
    
    <!-- Pagoda Base -->
    <rect x="350" y="650" width="100" height="50" fill="#8b4513" filter="url(#shadow)"/>
    <rect x="330" y="600" width="140" height="50" fill="#a0522d" filter="url(#shadow)"/>
    
    <!-- Pagoda Structure (7 floors) -->
    <g id="pagoda">
        <!-- Floor 1 (largest) -->
        <g class="floor" data-floor="1">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="390" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="430" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="470" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="380" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="420" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <!-- Lanterns -->
            <circle cx="365" cy="530" r="8" fill="#ff4500"/>
            <circle cx="405" cy="530" r="8" fill="#ff4500"/>
            <circle cx="445" cy="530" r="8" fill="#ff4500"/>
        </g>
        
        <!-- Floor 2 -->
        <g class="floor" data-floor="2" transform="translate(20, -60) scale(0.9)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="390" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="430" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="380" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="420" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
        </g>
        
        <!-- Floor 3 -->
        <g class="floor" data-floor="3" transform="translate(40, -120) scale(0.85)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="390" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="430" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="380" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="420" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
        </g>
        
        <!-- Floor 4 -->
        <g class="floor" data-floor="4" transform="translate(60, -180) scale(0.8)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="390" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="380" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
        </g>
        
        <!-- Floor 5 -->
        <g class="floor" data-floor="5" transform="translate(80, -240) scale(0.75)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="390" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
            <rect x="380" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
        </g>
        
        <!-- Floor 6 -->
        <g class="floor" data-floor="6" transform="translate(100, -300) scale(0.7)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Windows -->
            <rect x="340" y="510" width="20" height="20" fill="#f0e68c" stroke="#8b4513" stroke-width="1"/>
        </g>
        
        <!-- Floor 7 (top) -->
        <g class="floor" data-floor="7" transform="translate(120, -360) scale(0.65)">
            <rect x="300" y="550" width="200" height="50" fill="url(#pillarGrad)"/>
            <path d="M280,550 L520,550 L500,530 L300,530 Z" fill="url(#roofGrad)"/>
            <rect x="320" y="500" width="160" height="30" fill="url(#woodPattern)"/>
            <!-- Pillars -->
            <rect x="310" y="500" width="10" height="50" fill="#8b4513"/>
            <rect x="350" y="500" width="10" height="50" fill="#8b4513"/>
            <!-- Finial -->
            <path d="M395,480 L405,480 L410,450 L390,450 Z" fill="#ffd700"/>
            <circle cx="400" cy="440" r="15" fill="#ff4500"/>
            <circle cx="400" cy="430" r="5" fill="#ffd700"/>
        </g>
        
        <!-- Roof decorations (eaves) -->
        <g id="eavesDecorations">
            <circle cx="280" cy="530" r="5" fill="#ffd700"/>
            <circle cx="300" cy="530" r="5" fill="#ffd700"/>
            <circle cx="320" cy="530" r="5" fill="#ffd700"/>
            <circle cx="340" cy="530" r="5" fill="#ffd700"/>
            <circle cx="360" cy="530" r="5" fill="#ffd700"/>
            <circle cx="380" cy="530" r="5" fill="#ffd700"/>
            <circle cx="400" cy="530" r="5" fill="#ffd700"/>
            <circle cx="420" cy="530" r="5" fill="#ffd700"/>
            <circle cx="440" cy="530" r="5" fill="#ffd700"/>
            <circle cx="460" cy="530" r="5" fill="#ffd700"/>
            <circle cx="480" cy="530" r="5" fill="#ffd700"/>
            <circle cx="500" cy="530" r="5" fill="#ffd700"/>
            <circle cx="520" cy="530" r="5" fill="#ffd700"/>
        </g>
        <use xlink:href="#eavesDecorations" transform="translate(20, -60) scale(0.9)"/>
        <use xlink:href="#eavesDecorations" transform="translate(40, -120) scale(0.85)"/>
        <use xlink:href="#eavesDecorations" transform="translate(60, -180) scale(0.8)"/>
        <use xlink:href="#eavesDecorations" transform="translate(80, -240) scale(0.75)"/>
        <use xlink:href="#eavesDecorations" transform="translate(100, -300) scale(0.7)"/>
        <use xlink:href="#eavesDecorations" transform="translate(120, -360) scale(0.65)"/>
    </g>
    
    <!-- Chinese Dragon -->
    <g id="dragon" filter="url(#shadow)">
        <!-- Dragon Head -->
        <g transform="translate(500, 400)">
            <!-- Head shape -->
            <ellipse cx="0" cy="0" rx="40" ry="30" fill="url(#dragonBodyGrad)"/>
            <!-- Horns -->
            <path d="M-20,-30 L-30,-50 L-15,-35" fill="#ffd700"/>
            <path d="M20,-30 L30,-50 L15,-35" fill="#ffd700"/>
            <!-- Eyes -->
            <circle cx="-15" cy="-5" r="8" fill="#fff"/>
            <circle cx="15" cy="-5" r="8" fill="#fff"/>
            <circle cx="-15" cy="-5" r="4" fill="#000"/>
            <circle cx="15" cy="-5" r="4" fill="#000"/>
            <!-- Mouth -->
            <path d="M-25,15 Q0,25 25,15" stroke="#ff0000" stroke-width="3" fill="none"/>
            <!-- Whiskers -->
            <path d="M-35,5 Q-50,0 -60,-10" stroke="#ffd700" stroke-width="2" fill="none"/>
            <path d="M-35,10 Q-50,15 -65,20" stroke="#ffd700" stroke-width="2" fill="none"/>
            <path d="M35,5 Q50,0 60,-10" stroke="#ffd700" stroke-width="2" fill="none"/>
            <path d="M35,10 Q50,15 65,20" stroke="#ffd700" stroke-width="2" fill="none"/>
            <!-- Mane -->
            <path d="M-40,-10 Q-45,-20 -40,-30" stroke="#ff4500" stroke-width="4" fill="none"/>
            <path d="M40,-10 Q45,-20 40,-30" stroke="#ff4500" stroke-width="4" fill="none"/>
        </g>
        
        <!-- Dragon Body (coiling around pagoda) -->
        <path id="dragonBody" d="M500,400 
                                 C450,450 400,500 350,550
                                 C300,600 350,650 400,600
                                 C450,550 500,500 550,550
                                 C600,600 650,550 600,500
                                 C550,450 500,400 450,350
                                 C400,300 350,250 300,200
                                 C250,150 200,100 150,150
                                 C100,200 150,250 200,300" 
              stroke="url(#dragonBodyGrad)" 
              stroke-width="30" 
              fill="none"
              stroke-linecap="round"/>
        
        <!-- Dragon Scales Pattern -->
        <g id="dragonScale">
            <path d="M0,0 Q5,-5 10,0 Q5,5 0,0" fill="#32cd32"/>
        </g>
        <use xlink:href="#dragonScale" x="500" y="400"/>
        <use xlink:href="#dragonScale" x="450" y="450"/>
        <use xlink:href="#dragonScale" x="400" y="500"/>
        <use xlink:href="#dragonScale" x="350" y="550"/>
        <use xlink:href="#dragonScale" x="400" y="600"/>
        <use xlink:href="#dragonScale" x="450" y="550"/>
        <use xlink:href="#dragonScale" x="500" y="500"/>
        <use xlink:href="#dragonScale" x="550" y="550"/>
        <use xlink:href="#dragonScale" x="600" y="500"/>
        <use xlink:href="#dragonScale" x="550" y="450"/>
        <use xlink:href="#dragonScale" x="500" y="400"/>
        <use xlink:href="#dragonScale" x="450" y="350"/>
        <use xlink:href="#dragonScale" x="400" y="300"/>
        <use xlink:href="#dragonScale" x="350" y="250"/>
        <use xlink:href="#dragonScale" x="300" y="200"/>
        <use xlink:href="#dragonScale" x="250" y="150"/>
        <use xlink:href="#dragonScale" x="200" y="100"/>
        <use xlink:href="#dragonScale" x="150" y="150"/>
        <use xlink:href="#dragonScale" x="200" y="200"/>
        
        <!-- Claws -->
        <g id="dragonClaw">
            <path d="M0,0 L-5,10 L5,10 Z" fill="#ffd700"/>
        </g>
        <use xlink:href="#dragonClaw" x="480" y="410" transform="rotate(30)"/>
        <use xlink:href="#dragonClaw" x="460" y="420" transform="rotate(45)"/>
        <use xlink:href="#dragonClaw" x="440" y="430" transform="rotate(60)"/>
    </g>
    
    <!-- Pathway -->
    <path d="M100,800 Q200,750 300,780 Q400,800 500,790 Q600,780 700,800" 
          stroke="#deb887" 
          stroke-width="30" 
          fill="none"
          stroke-linecap="round"/>
    <path d="M100,800 Q200,750 300,780 Q400,800 500,790 Q600,780 700,800" 
          stroke="#8b4513" 
          stroke-width="10" 
          fill="none"
          stroke-linecap="round"
          stroke-dasharray="5,5"/>
    
    <!-- Clouds -->
    <g id="cloud" opacity="0.7">
        <ellipse cx="0" cy="0" rx="50" ry="30" fill="#f8f8ff"/>
        <ellipse cx="30" cy="-10" rx="40" ry="25" fill="#f8f8ff"/>
        <ellipse cx="-20" cy="-5" rx="35" ry="20" fill="#f8f8ff"/>
    </g>
    <use xlink:href="#cloud" x="100" y="150"/>
    <use xlink:href="#cloud" x="600" y="100"/>
    <use xlink:href="#cloud" x="300" y="50"/>
    
    <!-- Decorative Border -->
    <rect x="50" y="50" width="700" height="900" rx="20" fill="none" stroke="#8b4513" stroke-width="5"/>
    <rect x="60" y="60" width="680" height="880" rx="15" fill="none" stroke="#d4af37" stroke-width="2"/>
    
    <!-- Title -->
    <text x="400" y="950" text-anchor="middle" font-family="'SimSun', serif" font-size="24" fill="#8b0000">
        七层宝塔与祥龙花园
    </text>
    <text x="400" y="980" text-anchor="middle" font-family="'SimSun', serif" font-size="18" fill="#8b4513">
        Seven-Story Pagoda with Auspicious Dragon Garden
    </text>
</svg>
