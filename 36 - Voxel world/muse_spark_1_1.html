@group(0) @binding(0) var<uniform> u: Uniforms;

struct VSIn {
  @location(0) pos: vec3<f32>,
  @location(1) nrm: vec3<f32>,
  @location(2) col: vec3<f32>,
  @location(3) emiss: f32,
  @location(4) ao: f32,
  @location(5) flag: f32,
};
struct VSOut {
  @builtin(position) clipPos: vec4<f32>,
  @location(0) world: vec3<f32>,
  @location(1) normal: vec3<f32>,
  @location(2) color: vec3<f32>,
  @location(3) emissive: f32,
  @location(4) ao: f32,
  @location(5) flag: f32,
  @location(6) dist: f32,
  @location(7) uv: vec2<f32>,

@vertex
fn vs_opaque(in: VSIn) -> VSOut {
  var out: VSOut;
  var p = in.pos;
  // flag wave for banners / leaves / water
  if (in.flag > 0.5 && in.flag < 1.5) {

    let wave = sin(u.time.x * 2.0 + p.y * 0.6 + p.x * 0.2) * 0.35 * in.flag;

    p.z += wave * 0.2;

  out.world = p;
  out.normal = in.nrm;
  out.color = in.col;
  out.emissive = in.emiss;
  out.ao = in.ao;
  out.flag = in.flag;
  out.dist = length(u.camPos.xyz - p);
  out.uv = vec2<f32>(p.x*0.1, p.z*0.1);
  return out;
}

@vertex
fn vs_water(in: VSIn) -> VSOut {
  var out: VSOut;
  var p = in.pos;
  let w1 = sin(u.time.x * 0.9 + p.x*0.23 + p.z*0.17) * 0.25;
  let w2 = cos(u.time.x * 0.6 + p.z*0.31) * 0.15;
  p.y += w1 + w2;
  let wp = vec4<f32>(p,1.0);
  out.clipPos = u.viewProj * wp;
  out.world = p;
  out.normal = in.nrm;
  out.color = in.col;
  out.emissive = in.emiss;
  out.ao = in.ao;
  out.flag = 3.0;
  out.dist = length(u.camPos.xyz - p);
  out.uv = vec2<f32>(p.x*0.08 + u.time.x*0.03, p.z*0.08);
  return out;
}

fn aces_tonemap(c: vec3<f32>) -> vec3<f32> {
  let a = 2.51; let b = 0.03; let cc = 2.43; let d = 0.59; let e = 0.14;
  return clamp((c*(a*c+b))/(c*(cc*c+d)+e), vec3<f32>(0.0), vec3<f32>(1.0));

@fragment
fn fs_opaque(in: VSOut) -> @location(0) vec4<f32> {
  let N = normalize(in.normal);
  let L = normalize(u.sunDir.xyz);
  let ndotl = max(dot(N, L), 0.0);
  let halfLambert = ndotl*0.5 + 0.5; 
  let wrap = halfLambert*halfLambert;

  // base
  var base = in.color;
  // desaturate slightly for realism
  let lum = dot(base, vec3<f32>(0.299,0.587,0.114));
  base = mix(vec3<f32>(lum), base, 0.88);

  let ambient = u.ambientColor.xyz * in.ao * (0.7 + 0.3*heightShade);

    // lava pulse
    if (em > 2.8) { em *= 0.9 + 0.25 * sin(u.time.x*1.5); }
    lit += base * em * 1.2;
  }

  let fogDens = u.fogParams.x;
  let fogStart = u.fogParams.y;
  let fogH = u.fogParams.z;
  let d = max(in.dist - fogStart, 0.0);
  let fogFactor = 1.0 - exp(-fogDens * d * (0.6 + 0.8*exp(-max(in.world.y-12.0,0.0)*fogH)));

  lit = mix(lit, fogCol, clamp(fogFactor,0.0,1.0));

  lit = aces_tonemap(lit);
  lit = pow(lit, vec3<f32>(1.0/2.2));

  let uv = in.clipPos.xy / vec2<f32>(1280.0, 720.0); // approx, but use clip

@fragment
fn fs_water(in: VSOut) -> @location(0) vec4<f32> {
  let N = normalize(vec3<f32>(in.normal.x + sin(in.uv.x*8.0+u.time.x)*0.15, 1.0, in.normal.z + cos(in.uv.y*8.0)*0.15));

  let spec = pow(max(dot(reflect(-L, N), normalize(u.camPos.xyz - in.world)),0.0), 64.0) * 0.9;
  let fresnel = pow(1.0 - max(dot(N, normalize(u.camPos.xyz - in.world)),0.0), 3.0);
  let depthCol = vec3<f32>(0.08, 0.28, 0.55);
  let shallow = vec3<f32>(0.18, 0.55, 0.72);
  let depthFade = clamp((in.world.y - 8.0)/6.0, 0.0, 1.0);
  var col = mix(depthCol, shallow, depthFade*0.6 + 0.2*sin(in.uv.x*3.0+u.time.x));
  col += spec * u.sunColor.xyz;
  col = mix(col, u.fogColor.xyz*1.2, fresnel*0.25);
  let d = max(in.dist - u.fogParams.y, 0.0);
  let fogF = 1.0 - exp(-u.fogParams.x*1.2*d);
  col = mix(col, u.fogColor.xyz, fogF*0.55);
  col = aces_tonemap(col*1.15);
  col = pow(col, vec3<f32>(1.0/2.2));
  return vec4<f32>(col, 0.82);
}

}
