<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Realms — Medieval Fantasy Diorama</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; font-family: 'Segoe UI', system-ui, sans-serif; }
  canvas { display:block; width:100vw; height:100vh; }
  #ui {
    position:fixed; top:0; left:0; width:100%; height:100%;
    pointer-events:none; z-index:10;
  }
  #ui > * { pointer-events:auto; }
  #top-bar {
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center;
    background:rgba(10,10,20,0.65); backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.12); border-radius:14px;
    padding:8px 14px; box-shadow:0 8px 32px rgba(0,0,0,0.5);
  }
  #top-bar button {
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
    color:#cdd; padding:6px 14px; border-radius:8px; cursor:pointer;
    font-size:12px; font-weight:600; letter-spacing:0.3px;
    transition:all 0.2s; white-space:nowrap;
  }
  #top-bar button:hover { background:rgba(255,255,255,0.16); color:#fff; transform:translateY(-1px); }
  #top-bar button.active { background:rgba(255,200,100,0.25); color:#ffd; border-color:rgba(255,200,100,0.4); }
  #top-bar .sep { width:1px; background:rgba(255,255,255,0.12); margin:0 4px; }
  #time-label { color:#9af; font-size:11px; font-weight:600; letter-spacing:0.5px; padding:0 6px; }
  #mode-label { color:#8af; font-size:11px; font-weight:600; padding:0 6px; }
  #bottom-bar {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(10,10,20,0.6); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.1); border-radius:12px;
    padding:10px 18px; display:flex; gap:20px; align-items:center;
    color:rgba(255,255,255,0.5); font-size:11px; letter-spacing:0.2px;
  }
  #bottom-bar kbd {
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
    border-radius:4px; padding:2px 6px; color:#bbc; font-size:10px; font-family:monospace;
  }
  #bottom-bar .key-group { display:flex; align-items:center; gap:6px; }
  #bottom-bar .key-group span { color:rgba(255,255,255,0.4); }
  #loading {
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(ellipse at center, #0a0a18 0%, #000 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:opacity 0.8s ease;
  }
  #loading.hidden { opacity:0; pointer-events:none; }
  #loading h1 {
    color:#8af; font-size:22px; letter-spacing:4px; font-weight:300;
    margin-bottom:30px; text-transform:uppercase;
  }
  #loading .bar-wrap {
    width:200px; height:2px; background:rgba(255,255,255,0.1);
    border-radius:2px; overflow:hidden; margin-bottom:16px;
  }
  #loading .bar-fill {
    height:100%; width:0%; background:linear-gradient(90deg, #4af, #a7f);

  #loading p { color:rgba(255,255,255,0.4); font-size:12px; letter-spacing:1px; }
  #crosshair {

    #top-bar button { padding:4px 10px; font-size:10px; }

// ───────────────────────────────────────
// NOISE
// ───────────────────────────────────────
class Noise {
  constructor(seed=42) { this.seed = seed; this.perm = new Uint8Array(512); const p=new Uint8Array(256); for(let i=0;i<256;i++)p[i]=i; let n=this.seed; for(let i=255;i>0;i--){n=(n*16807)%2147483647;const j=n%(i+1);[p[i],p[j]]=[p[j],p[i]];}for(let i=0;i<512;i++)this.perm[i]=p[i&255];}
  fade(t){return t*t*t*(t*(t*6-15)+10);}
  lerp(a,b,t){return a+(b-a)*t;}
  grad(hash,x,y,z){const h=hash&15;const u=h<8?x:y;const v=h<4?y:(h===12||h===14?x:z);return ((h&1)===0?u:-u)+((h&2)===0?v:-v);}
  noise3(x,y,z){const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;const xf=x-Math.floor(x),yf=y-Math.floor(y),zf=z-Math.floor(z);const u=this.fade(xf),v=this.fade(yf),w=this.fade(zf);const p=this.perm;const A=p[p[p[X]+Y]+Z],B=p[p[p[X]+Y]+Z+1],C=p[p[p[X]+Y+1]+Z],D=p[p[p[X]+Y+1]+Z+1],E=p[p[p[X+1]+Y]+Z],F=p[p[p[X+1]+Y]+Z+1],G=p[p[p[X+1]+Y+1]+Z],H=p[p[p[X+1]+Y+1]+Z+1];return this.lerp(this.lerp(this.lerp(this.grad(A,xf,yf,zf),this.grad(B,xf-1,yf,zf),u),this.lerp(this.grad(C,xf,yf-1,zf),this.grad(D,xf-1,yf-1,zf),u),v),this.lerp(this.lerp(this.grad(E,xf,yf,zf-1),this.grad(F,xf-1,yf,zf-1),u),this.lerp(this.grad(G,xf,yf-1,zf-1),this.grad(H,xf-1,yf-1,zf-1),u),v),w);}
  fbm(x,y,z,octaves=4){let amp=1,sum=0,freq=1,maxAmp=0;for(let i=0;i<octaves;i++){sum+=amp*this.noise3(x*freq,y*freq,z*freq);maxAmp+=amp;amp*=0.5;freq*=2;}return sum/maxAmp;}
}

const noise = new Noise(137);
const noise2 = new Noise(73);
const noise3 = new Noise(211);

function terrainHeight(x, z, region='default') {
  let h = 0;
  const nx = x * 0.008, nz = z * 0.008;
  h += noise.fbm(nx, nz, 0, 4) * 22;
  h += noise2.fbm(nx*2.3, nz*2.3, 0, 3) * 9;
  h += Math.sin(x*0.04)*Math.cos(z*0.05)*3;
  // Volcanic cone area
  const dxc = x-75, dzc = z-40;
  const distC = Math.sqrt(dxc*dxc+dzc*dzc);
  if (distC < 45) {
    const cone = Math.max(0, 1 - distC/45);
    h += cone * 38 * (0.85 + 0.15*Math.sin(x*0.07+z*0.05));
    // crater rim
    const rim = Math.exp(-Math.pow((distC-22)/4, 2)) * 6;
    h += rim;
  }
  // Castle hill
  const dxh = x-32, dzh = z-28;
  const distH = Math.sqrt(dxh*dxh+dzh*dzh);
  if (distH < 32) {
    const hill = Math.pow(Math.max(0,1-distH/32), 2) * 22;
    h += hill;
  }
  // Gentle valley for river
  const riverX = 18 + Math.sin(z*0.025)*18;
  const riverDist = Math.abs(x - riverX);
  if (riverDist < 22) {
    h -= Math.pow(1 - riverDist/22, 1.5) * 8;
  }
  // Mountains far north
  if (z < -30) {
    const mt = Math.max(0, 1 - (z+25)/20);
    h += mt * 40 * (0.7 + 0.3*noise.fbm(x*0.05, z*0.05, 0, 3));
  }
  return Math.max(1, h);
}

function getBlockFaceColor(bt, faceDir) {
  // Slight color variation per face
  const base = PALETTE.subarray(bt*6, bt*6+4);
  return [base[0], base[1], base[2], base[3], PALETTE[bt*6+4]];
}

// ───────────────────────────────────────
// WORLD BUILDER
// ───────────────────────────────────────
const blocks = new Uint8Array(WORLD_SIZE * WORLD_SIZE * WORLD_SIZE);

function idx(x,y,z) { return ((x+64)*WORLD_SIZE+(z+64))*WORLD_SIZE+(y+32); }
function getB(x,y,z) {
  const xi=x+64, zi=z+64, yi=y+32;
  if (xi<0||xi>=WORLD_SIZE||zi<0||zi>=WORLD_SIZE||yi<0||yi>=WORLD_SIZE) return BT.AIR;
  return blocks[idx(x,y,z)];
}
function setB(x,y,z,v) { blocks[idx(x,y,z)] = v; }

// Fill with air first
blocks.fill(BT.AIR);

// Fill bedrock
for (let x=-63;x<64;x++) for (let z=-63;z<64;z++) {
  const h = terrainHeight(x,z);
  for (let y=-31;y<-28;y++) setB(x,y,z,BT.BEDROCK);
}

// ───────────────────────────────────────
// TERRAIN FILL
// ───────────────────────────────────────
function fillTerrain() {
  for (let x=-62;x<63;x++) for (let z=-62;z<63;z++) {
    const h = terrainHeight(x,z);
    // Determine surface block based on height and position
    let surface;
    const distVolcano = Math.sqrt((x-75)**2+(z-40)**2);
    const nearVolcano = distVolcano < 30;
    const snowLine = -10;
    const nearCastle = Math.sqrt((x-32)**2+(z-28)**2) < 20;

    if (h > 14 && z < -5) surface = BT.SNOW;
    else if (h > 8 && nearVolcano) surface = BT.BASALT;
    else if (h > 6) surface = BT.GRASS;
    else if (h > 2) surface = BT.GRASS;
    else if (h > 0) surface = BT.DIRT;
    else surface = BT.DIRT;

    if (nearVolcano && h > 5 && h < 12) surface = BT.BASALT;
    if (h > 16 && z < -8) surface = BT.SNOW;

    // Fill from bedrock to surface
    for (let y=-27;y<h;y++) {
      if (y < -20) setB(x,y,z,BT.BEDROCK);
      else if (y < h-4) setB(x,y,z, (nearVolcano && h>8) ? BT.BASALT : BT.STONE);
      else if (y < h-1) {
        if (nearVolcano && h>10) setB(x,y,z,BT.BASALT);
        else setB(x,y,z,BT.DIRT);
      }
      else setB(x,y,z,surface);
    }
    // Surface detail
    if (surface === BT.GRASS && Math.random()<0.003) setB(x,h,z,BT.FERN);
    if (surface === BT.GRASS && Math.random()<0.002) setB(x,h,z,BT.TALL_GRASS);
    if (surface === BT.SNOW && Math.random()<0.005) setB(x,h,z,BT.SNOWY_TUFT);
    if (surface === BT.SANDSTONE && Math.random()<0.005) setB(x,h+1,z,BT.SAND);
  }
}

// ───────────────────────────────────────
// WATER (river + lake + moat)
// ───────────────────────────────────────
function fillWater() {
  // Wide curved river
  for (let z=-62;z<63;z++) {
    const cx = 18 + Math.sin(z*0.025)*18;
    for (let x=Math.floor(cx-14);x<=Math.ceil(cx+14);x++) {
      const dist = Math.abs(x-cx);
      if (dist < 13) {
        const h = terrainHeight(x,z);
        for (let y=Math.floor(h);y<=Math.floor(h)+2;y++) {
          setB(x,y,z,BT.WATER);
        }
      }
    }
  }
  // Lake at bottom of valley
  for (let x=-20;x<-5;x++) for (let z=-55;z<-40;z++) {
    const dist = Math.sqrt((x+12)**2+(z+47)**2);
    if (dist < 10) {
      const h = terrainHeight(x,z);
      for (let y=Math.floor(h);y<=Math.floor(h)+2;y++) setB(x,y,z,BT.WATER);
    }
  }
}

// ───────────────────────────────────────
// CASTLE BUILDER  — terraced hill at (30, 26)
// ───────────────────────────────────────
const CASTLE_X = 30, CASTLE_Z = 28;

function castleBuild() {
  const cx = CASTLE_X, cz = CASTLE_Z;
  const hBase = terrainHeight(cx, cz);

  // Moat — ring of water around castle
  for (let x=-12;x<=12;x++) for (let z=-12;z<=12;z++) {
    const d = Math.max(Math.abs(x),Math.abs(z));
    if (d >= 8 && d <= 10) {
      const wx = cx+x, wz = cz+z;
      const h = Math.floor(terrainHeight(wx,wz));
      for (let y=h;y<=h+1;y++) setB(wx,y,wz,BT.WATER);
    }
  }

  // Stone bridge across moat (south entrance)
  const bridgeZ = cz+10;
  for (let x=-4;x<=4;x++) {
    const wx = cx+x, wz = cz+10;
    for (let y=Math.floor(terrainHeight(wx,wz));y<Math.floor(terrainHeight(wx,wz))+3;y++) {
      setB(wx,y,wz,BT.COBBLESTONE);
    }
  }

  // Terrace 1 (outer)
  for (let x=-14;x<=14;x++) for (let z=-14;z<=14;z++) {
    const d = Math.max(Math.abs(x),Math.abs(z));
    if (d >= 10 && d <= 14) {
      const wx=cx+x, wz=cz+z;
      const h = Math.floor(terrainHeight(wx,wz));
      for (let y=h; y<h+1; y++) setB(wx,y,wz,BT.CUT_STONE);
      for (let y=h+1; y<h+2; y++) setB(wx,y,wz,BT.SANDSTONE);
    }
  }

  // Terrace 2 (inner)
  for (let x=-10;x<=10;x++) for (let z=-10;z<=10;z++) {
    const d = Math.max(Math.abs(x),Math.abs(z));
    if (d >= 7 && d <= 9) {
      const wx=cx+x, wz=cz+z;
      const h = Math.floor(terrainHeight(wx,wz));
      for (let y=h; y<h+1; y++) setB(wx,y,wz,BT.POLISHED_BASALT);
      for (let y=h+1; y<h+2; y++) setB(wx,y,wz,BT.COBBLESTONE);
    }
  }

  // Outer walls — 14x14 perimeter, 5 blocks tall
  const ww = 14, wh = 5;
  for (let i=0;i<ww;i++) {
    for (let side of [[i,-ww],[i,ww],[-ww,i],[ww,i]]) {
      const x = cx+side[0], z = cz+side[1];
      for (let y=0;y<wh;y++) {
        const gy = Math.floor(terrainHeight(x,z))+y;
        setB(x,gy,z,BT.COBBLESTONE);
        if (y===wh-1 || y===wh-3 || y===wh-5) setB(x,gy,z,BT.COBBLED_WALL); // crenellations
      }
    }
  }
  // Gate opening (south, x from -3 to 3 at z=ww)
  for (let x=-3;x<=3;x++) for (let y=0;y<wh;y++) {
    setB(cx+x, Math.floor(terrainHeight(cx+x,cz+ww))+y, cz+ww, BT.AIR);
  }
  // Gate arch
  for (let x=-3;x<=3;x++) {
    const gy = Math.floor(terrainHeight(cx+x,cz+ww))+wh;
    setB(cx+x,gy,cz+ww,BT.BRICK);
  }

  // Corner towers 6x6x12
  const towers = [[-7,-7],[7,-7],[-7,7],[7,7]];
  for (const [tx,tz] of towers) {
    const wx=cx+tx, wz=cz+tz;
    for (let x=-3;x<=3;x++) for (let z=-3;z<=3;z++) {
      for (let y=0;y<12;y++) {
        const gy = Math.floor(terrainHeight(wx+x,wz+z))+y;
        setB(wx+x,gy,wz+z,BT.COBBLESTONE);
      }
    }
    // Top crenellations
    for (let x=-3;x<=3;x++) for (let z=-3;z<=3;z++) {
      const gy = Math.floor(terrainHeight(wx+x,wz+z))+12;
      if (Math.random()<0.4) setB(wx+x,gy,wz+z,BT.COBBLED_WALL);
    }
    // Top platform
    for (let x=-3;x<=3;x++) for (let z=-3;z<=3;z++) {
      const gy = Math.floor(terrainHeight(wx+x,wz+z))+11;
      setB(wx+x,gy,wz+z,BT.CUT_STONE);
    }
  }

  // Battlements on walls
  for (let x=-7;x<=7;x+=2) for (let z=-7;z<=7;z+=2) {
    if (Math.abs(x)===7 || Math.abs(z)===7) {
      const wx=cx+x, wz=cz+z;
      const gy = Math.floor(terrainHeight(wx,wz))+wh+1;
      setB(wx,gy,wz,BT.COBBLED_WALL);
      setB(wx,gy+1,wz,BT.CUT_STONE);
    }
  }

  // Royal Keep — 7x7x10 in center
  const kx=cx, kz=cz;
  for (let x=-3;x<=3;x++) for (let z=-3;z<=3;z++) {
    for (let y=0;y<10;y++) {
      const gy = Math.floor(terrainHeight(kx+x,kz+z))+y;
      setB(kx+x,gy,kz+z,BT.BRICK);
    }
  }
  // Keep roof — pyramid
  for (let y=10;y<15;y++) {
    const r = 15-y;
    for (let x=-r;x<=r;x++) for (let z=-r;z<=r;z++) {
      const wx=kx+x, wz=kz+z;
      const gy = Math.floor(terrainHeight(wx,wz))+y;
      if (Math.abs(x)+Math.abs(z)<=r) setB(wx,gy,wz,BT.SANDSTONE);
      else setB(wx,gy,wz,BT.AIR);
    }
  }
  // Keep top flag pole
  for (let y=15;y<22;y++) setB(kx,Math.floor(terrainHeight(kx,kz))+y,kz,BT.WOOD);
  setB(kx,Math.floor(terrainHeight(kx,kz))+22,kz,BT.CLOTH);
  setB(kx,Math.floor(terrainHeight(kx,kz))+23,kz,BT.CLOTH);

  // Chapel — east side
  const chx=cx+9, chz=cz;
  for (let x=-2;x<=2;x++) for (let z=-2;z<=2;z++) {
    for (let y=0;y<7;y++) {
      const gy=Math.floor(terrainHeight(chx+x,chz+z))+y;
      setB(chx+x,gy,chz+z,BT.BRICK);
    }
  }
  // Chapel roof
  for (let y=7;y<10;y++) {
    const r=10-y;
    for (let x=-r;x<=r;x++) for (let z=-r;z<=r;z++) {
      const wx=chx+x, wz=chz+z;
      const gy=Math.floor(terrainHeight(wx,wz))+y;
      if (x>=-1&&x<=1&&z>=-1&&z<=1||y===7) setB(wx,gy,wz,BT.SANDSTONE);
    }
  }
  // Chapel cross
  for (let y=10;y<13;y++) setB(chx,Math.floor(terrainHeight(chx,chz))+y,chz,BT.WOOD);
  setB(chx,Math.floor(terrainHeight(chx,chz))+13,chz,BT.CLOTH);

  // Courtyard — between walls and keep
  for (let x=-5;x<=5;x++) for (let z=-5;z<=5;z++) {
    const d=Math.max(Math.abs(x),Math.abs(z));
    if (d<4 && !(x>=-2&&x<=2&&z>=-2&&z<=2)) {
      const wx=cx+x, wz=cz+z;
      const h=Math.floor(terrainHeight(wx,wz));
      setB(wx,h,wz,BT.CUT_STONE);
      setB(wx,h+1,wz,BT.COBBLESTONE);
    }
  }

  // Flags on towers
  const flagPos = [[-7,-7,0],[7,-7,0],[-7,7,1],[7,7,1]];
  for (const [tx,tz,side] of flagPos) {
    const wx=cx+tx, wz=cz+tz;
    const poleH = 12;
    // Pole already placed with tower top
    setB(wx,Math.floor(terrainHeight(wx,wz))+poleH+1,wz,BT.CLOTH);
    setB(wx,Math.floor(terrainHeight(wx,wz))+poleH+2,wz,BT.CLOTH);
    setB(wx,Math.floor(terrainHeight(wx,wz))+poleH+3,wz,BT.CLOTH);
    // Side attachment
    setB(wx+side,Math.floor(terrainHeight(wx,wz))+poleH+1,wz,BT.CLOTH);
  }

  // Gardens — small flower patches
  for (let i=0;i<20;i++) {
    const gx=cx+Math.floor(Math.random()*8-4);
    const gz=cz+Math.floor(Math.random()*8-4);
    const d=Math.max(Math.abs(gx-cx),Math.abs(gz-cz));
    if (d<4) {
      const h=Math.floor(terrainHeight(gx,gz));
      const flower = [BT.ORANGE_FLOWER,BT.POPPY,BT.BLUE_ORCHID,BT.ROSE,BT.LILAC][Math.floor(Math.random()*5)];
      if (getB(gx,h,gz)===BT.CUT_STONE||getB(gx,h,gz)===BT.COBBLESTONE) {
        setB(gx,h,gz,flower);
      }
    }
  }

  // Glowing windows in keep
  for (let x=-2;x<=2;x+=2) for (let z=-2;z<=2;z+=2) for (let y=2;y<8;y+=2) {
    setB(cx+x,Math.floor(terrainHeight(cx+x,cz+z))+y,cz+z,BT.GLASS);
    // Emissive window light — use gold ore as proxy? No, just place glass
    // Add a light source next to it
    if (y>2) setB(cx+x+1,Math.floor(terrainHeight(cx+x,cz+z))+y,cz+z,BT.TORCH);
  }

  // Torches on walls
  for (let i=0;i<20;i++) {
    const angle = i/20*Math.PI*2;
    const rx=Math.round(Math.cos(angle)*6);
    const rz=Math.round(Math.sin(angle)*6);
    const wx=cx+rx, wz=cz+rz;
    // Find wall block
    for (let y=0;y<wh;y++) {
      const gy=Math.floor(terrainHeight(wx,wz))+y;
      const b=getB(wx,gy,wz);
      if (b===BT.COBBLESTONE||b===BT.COBBLED_WALL) {
        if (Math.random()<0.5) setB(wx,gy+1,wz,BT.TORCH);
        break;
      }
    }
  }

  // Drawbridge (inside gate)
  for (let x=-3;x<=3;x++) {
    const wx=cx+x, wz=cz+ww-1;
    for (let y=Math.floor(terrainHeight(wx,wz));y<Math.floor(terrainHeight(wx,wz))+2;y++) {
      setB(wx,y,wz,BT.COBBLESTONE);
    }
  }

  // Castle road leading south
  for (let z=cz+10;z<cz+30;z++) {
    const rw = 6;
    for (let x=-Math.floor(rw/2);x<=Math.floor(rw/2);x++) {
      const wx=cx+x, wz=z;
      const h=Math.floor(terrainHeight(wx,wz));
      for (let y=h;y<h+1;y++) setB(wx,y,wz,BT.CUT_STONE);
    }
  }
}

// ───────────────────────────────────────
// VILLAGE BUILDER — near river at around (5, 10)
// ───────────────────────────────────────
const VILLAGE_CX = 5, VILLAGE_CZ = 10;

const houseColors = [
  [BT.PLANKS, BT.ROOF_TERRACOTTA],
  [BT.DARK_PLANKS, BT.TERRACOTTA],
  [BT.SPRUCE, BT.RED_SANDSTONE],
  [BT.BIRCH, BT.SANDSTONE],
  [BT.PLANKS, BT.BRICK],
];

function villageBuild() {
  const vc = VILLAGE_CX, vz = VILLAGE_CZ;

  // Curved main street
  const streetCenter = (z) => vc + Math.sin(z*0.04)*4;
  for (let z=-18;z<20;z++) {
    const scx = Math.round(streetCenter(z));
    for (let x=-4;x<=4;x++) {
      const wx=scx+x, wz=vz+z;
      const h=Math.floor(terrainHeight(wx,wz));
      if (h >= 0) {
        setB(wx,h,wz,BT.CUT_STONE);
        setB(wx,h+1,wz,BT.COBBLESTONE);
      }
    }
  }

  // Stone bridge over river (south of village)
  for (let x=-6;x<=6;x++) for (let z=28;z<=30;z++) {
    const wx=vc+x, wz=vz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=h;y<=h+2;y++) setB(wx,y,wz,BT.COBBLESTONE);
  }

  // Marketplace (center, 6x6 paved)
  for (let x=-3;x<=3;x++) for (let z=-3;z<=3;z++) {
    const wx=vc+x, wz=vz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    setB(wx,h,wz,BT.CUT_STONE);
    setB(wx,h+1,wz,BT.COBBLESTONE);
  }
  // Market stalls
  for (let i=0;i<8;i++) {
    const a = i/8*Math.PI*2;
    const rx=Math.round(Math.cos(a)*2);
    const rz=Math.round(Math.sin(a)*2);
    const wx=vc+rx, wz=vz+rz;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<4;y++) {
      setB(wx,h+y,wz,BT.PLANKS);
    }
    for (let y=4;y<6;y++) {
      for (let x2=-1;x2<=1;x2++) setB(wx+x2,h+y,wz,BT.WOOD);
    }
    setB(wx,h+6,wz,BT.CLOTH);
    // Goods
    const goods=[BT.AMBER,BT.EMERALD,BT.SAPPHIRE,BT.RUBY,BT.TOPAZ,BT.GOLD_ORE][Math.floor(Math.random()*6)];
    setB(wx,h+2,wz,goods);
  }

  // Watermill near river east
  const wmx=vc+12, wmz=vz+5;
  for (let x=-2;x<=2;x++) for (let z=-2;z<=2;z++) {
    const wx=wmx+x, wz=wmz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    setB(wx,h,wz,BT.PLANKS);
    for (let y=1;y<5;y++) setB(wx,h+y,wz,BT.PLANKS);
  }
  // Water wheel (visual: sticks)
  for (let i=0;i<8;i++) {
    const a=i/8*Math.PI*2;
    const rx=Math.round(Math.cos(a)*2);
    const rz=Math.round(Math.sin(a)*2);
    setB(wmx+rx,Math.floor(terrainHeight(wmx,wmz))+5,wmz+rz,BT.WOOD);
  }
  // Wheel hub
  setB(wmx,Math.floor(terrainHeight(wmx,wmz))+5,wmz,BT.IRON);

  // Blacksmith — west side
  const bsx=vc-6, bsz=vz+2;
  for (let x=-2;x<=3;x++) for (let z=-2;z<=2;z++) {
    const wx=bsx+x, wz=bsz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<5;y++) setB(wx,h+y,wz,BT.BRICK);
    for (let y=5;y<7;y++) setB(wx,h+y,wz,BT.RED_SANDSTONE);
  }
  // Forge glow
  setB(bsx,Math.floor(terrainHeight(bsx,bsz))+2,bsz,BT.LAVA);
  setB(bsx+1,Math.floor(terrainHeight(bsx,bsz))+2,bsz,BT.TORCH);
  setB(bsx,Math.floor(terrainHeight(bsx,bsz))+3,bsz,BT.TORCH);

  // Tavern — north
  const tax=vc-2, taz=vz+8;
  for (let x=-2;x<=3;x++) for (let z=-2;z<=2;z++) {
    const wx=tax+x, wz=taz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<5;y++) setB(wx,h+y,wz,BT.DARK_PLANKS);
    for (let y=5;y<7;y++) setB(wx,h+y,wz,BT.RED_SANDSTONE);
  }
  for (let y=0;y<7;y++) setB(tax+4,Math.floor(terrainHeight(tax,taz))+y,taz+2,BT.WOOD);
  setB(tax,Math.floor(terrainHeight(tax,taz))+7,taz,BT.CLOTH);
  setB(tax+1,Math.floor(terrainHeight(tax,taz))+7,taz,BT.CLOTH);
  // Lantern outside
  setB(tax-1,Math.floor(terrainHeight(tax,taz))+3,taz,BT.LANTERN);
  setB(tax+3,Math.floor(terrainHeight(tax,taz))+3,taz+2,BT.LANTERN);

  // Village chapel — northeast
  const vcx=vc+5, vcz=vz+6;
  for (let x=-2;x<=2;x++) for (let z=-2;z<=2;z++) {
    const wx=vcx+x, wz=vcz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<6;y++) setB(wx,h+y,wz,BT.BRICK);
  }
  for (let y=6;y<8;y++) {
    for (let x=-1;x<=1;x++) for (let z=-1;z<=1;z++) {
      setB(vcx+x,Math.floor(terrainHeight(vcx,vcz))+y,vcz+z,BT.SANDSTONE);
    }
  }
  for (let y=8;y<10;y++) setB(vcx,Math.floor(terrainHeight(vcx,vcz))+y,vcz,BT.WOOD);
  setB(vcx,Math.floor(terrainHeight(vcx,vcz))+10,vcz,BT.CLOTH);

  // Docks on river east
  const dockx=vc+14, dockz=vz-5;
  for (let x=-3;x<=3;x++) for (let z=0;z<=2;z++) {
    const wx=dockx+x, wz=dockz+z;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<3;y++) setB(wx,h+y,wz,BT.PLANKS);
  }
  // Boats
  for (let i=0;i<3;i++) {
    const bx=dockx+i;
    const bz=dockz+4+i;
    for (let x=-1;x<=1;x++) for (let z=-1;z<=1;z++) {
      const wx=bx+x, wz=bz+z;
      const h=Math.floor(terrainHeight(wx,wz));
      setB(wx,h,wz,BT.PLANKS);
      setB(wx,h+1,wz,BT.PLANKS);
    }
    setB(bx,Math.floor(terrainHeight(bx,bz))+1,bz,BT.WOOD);
  }

  // Farm plots
  for (let i=0;i<5;i++) {
    const fx=vc+Math.floor(Math.random()*10-5);
    const fz=vz+Math.floor(Math.random()*10-5);
    const d=Math.sqrt((fx-vc)**2+(fz-vz)**2);
    if (d>3&&d<8) {
      const h=Math.floor(terrainHeight(fx,fz));
      setB(fx,h,fz,BT.CUT_STONE);
      for (let y=h;y<h+2;y++) setB(fx,y,fz,BT.MYCELIUM);
      // Crops
      for (let j=0;j<4;j++) {
        const cx2=fx+Math.floor(Math.random()*3-1);
        const cz2=fz+Math.floor(Math.random()*3-1);
        if (getB(cx2,h+1,cz2)===BT.MYCELIUM) {
          setB(cx2,h+1,cz2,BT.EMERALD);
        }
      }
    }
  }

  // Wells
  for (let i=0;i<3;i++) {
    const wx=vc+Math.floor(Math.random()*12-6);
    const wz=vz+Math.floor(Math.random()*12-6);
    const d=Math.sqrt((wx-vc)**2+(wz-vz)**2);
    if (d>2&&d<7) {
      const h=Math.floor(terrainHeight(wx,wz));
      for (let x=-1;x<=1;x++) for (let z=-1;z<=1;z++) {
        setB(wx+x,h,wz+z,BT.CUT_STONE);
      }
      for (let x=-1;x<=1;x++) for (let z=-1;z<=1;z++) {
        setB(wx+x,h+1,wz+z,BT.COBBLESTONE);
      }
      setB(wx,h+2,wz,BT.WOOD);
      setB(wx,h+3,wz,BT.LANTERN);
    }
  }

  // Fences around village
  for (let i=0;i<40;i++) {
    const a=i/40*Math.PI*2;
    const r=9;
    const rx=Math.round(Math.cos(a)*r);
    const rz=Math.round(Math.sin(a)*r);
    const wx=vc+rx, wz=vz+rz;
    if (Math.abs(wx-vc)<12&&Math.abs(wz-vz)<12) {
      const h=Math.floor(terrainHeight(wx,wz));
      if (getB(wx,h,wz)===BT.GRASS||getB(wx,h,wz)===BT.DIRT) {
        setB(wx,h,wz,BT.FENCE);
        if (Math.random()<0.3) setB(wx,h+1,wz,BT.TORCH);
      }
    }
  }

  // Carts and barrels
  for (let i=0;i<6;i++) {
    const wx=vc+Math.floor(Math.random()*10-5);
    const wz=vz+Math.floor(Math.random()*10-5);
    const h=Math.floor(terrainHeight(wx,wz));
    if (getB(wx,h,wz)===BT.CUT_STONE||getB(wx,h,wz)===BT.COBBLESTONE) {
      const type = Math.random()<0.5 ? BT.PLANKS : BT.BRICK;
      for (let x=-1;x<=1;x++) for (let z=-1;z<=1;z++) {
        setB(wx+x,h,wz+z,type);
      }
      setB(wx,h+1,wz,BT.WOOD);
    }
  }
  for (let i=0;i<8;i++) {
    const wx=vc+Math.floor(Math.random()*10-5);
    const wz=vz+Math.floor(Math.random()*10-5);
    const h=Math.floor(terrainHeight(wx,wz));
    if (getB(wx,h,wz)!==BT.WATER&&getB(wx,h,wz)!==BT.BEDROCK) {
      setB(wx,h,wz,BT.IRON);
      setB(wx,h+1,wz,BT.IRON);
    }
  }

  // Lanterns on posts
  for (let i=0;i<12;i++) {
    const a=i/12*Math.PI*2;
    const rx=Math.round(Math.cos(a)*7);
    const rz=Math.round(Math.sin(a)*7);
    const wx=vc+rx, wz=vz+rz;
    const h=Math.floor(terrainHeight(wx,wz));
    if (getB(wx,h,wz)===BT.GRASS) {
      setB(wx,h,wz,BT.WOOD);
      setB(wx,h+1,wz,BT.WOOD);
      setB(wx,h+2,wz,BT.LANTERN);
    }
  }

  // Generate 25-35 varied houses
  const houseCount = 28 + Math.floor(Math.random()*8);
  for (let i=0;i<houseCount;i++) {
    let wx, wz, attempts=0;
    do {
      wx = vc + Math.floor(Math.random()*16-8);
      wz = vz + Math.floor(Math.random()*16-8);
      attempts++;
    } while (
      (Math.abs(wx-vc)<3&&Math.abs(wz-vz)<3) ||
      getB(wx,Math.floor(terrainHeight(wx,wz)),wz)===BT.WATER ||
      getB(wx,Math.floor(terrainHeight(wx,wz)),wz)===BT.CUT_STONE ||
      attempts<20
    );

    const h = Math.floor(terrainHeight(wx,wz));
    if (h < 0) continue;

    const pc = houseColors[Math.floor(Math.random()*houseColors.length)];
    const roof = pc[1];
    const wall = pc[0];

    // House footprint
    const hs = 3 + Math.floor(Math.random()*2); // 3 or 4
    const cx2 = Math.floor(hs/2), cz2 = Math.floor(hs/2);

    // Foundation
    for (let x=-cx2;x<=cx2;x++) for (let z=-cz2;z<=cz2;z++) {
      setB(wx+x,h,wz+z,BT.COBBLESTONE);
    }

    // Walls
    for (let y=1;y<5;y++) {
      for (let x=-cx2;x<=cx2;x++) for (let z=-cz2;z<=cz2;z++) {
        // Leave gaps for windows/door
        if (y===3 && Math.random()<0.2) continue; // window
        if ((x===0&&z===-cz2)||(x===0&&z===cz2)||(x===-cx2&&z===0)||(x===cx2&&z===0)) {
          // Door/post — keep solid mostly
        }
        setB(wx+x,h+y,wz+z,wall);
      }
    }

    // Roof
    const roofH = 5 + Math.floor(Math.random()*2);
    for (let y=5;y<5+roofH;y++) {
      const spread = y-4;
      for (let x=-cx2-spread;x<=cx2+spread;x++) for (let z=-cz2-spread;z<=cz2+spread;z++) {
        if (Math.abs(x)+Math.abs(z)<=cx2+1) {
          setB(wx+x,h+y,wz+z,roof);
        }
      }
    }

    // Chimney
    const chX = wx+Math.floor(Math.random()*3-1);
    const chZ = wz+Math.floor(Math.random()*3-1);
    for (let y=5;y<8;y++) {
      setB(chX,h+y,chZ,BT.BRICK);
    }
    setB(chX,h+8,chZ,BT.TORCH); // chimney smoke proxy

    // Door
    const doorX = wx + Math.floor(Math.random()<0.5?-cx2:cx2);
    const doorZ = wz + (Math.random()<0.5?-cz2:cz2);
    for (let y=1;y<4;y++) {
      setB(doorX,h+y,doorZ,wall);
    }

    // Window glow (torch inside)
    if (Math.random()<0.6) {
      const winX = wx+Math.floor(Math.random()*3-1);
      const winZ = wz+Math.floor(Math.random()*3-1);
      const winY = h+3;
      if (getB(winX,winY,winZ)===wall||getB(winX,winY,winZ)===BT.AIR) {
        setB(winX,winY,winZ,BT.TORCH);
      }
    }

    // Fence around house
    if (Math.random()<0.5) {
      for (let x=-cx2-1;x<=cx2+1;x++) {
        setB(wx+x,h,wz-cz2-1,BT.FENCE);
        setB(wx+x,h,wz+cz2+1,BT.FENCE);
      }
      for (let z=-cz2-1;z<=cz2+1;z++) {
        setB(wx-cx2-1,h,wz+z,BT.FENCE);
        setB(wx+cx2+1,h,wz+z,BT.FENCE);
      }
    }
  }
}

// WATERFALLS
// ───────────────────────────────────────
function addWaterfalls() {
  const fallSpots = [
    [vcx=42, vcZ=5], [20, -25], [55, -10], [10, -45], [48, 15]
  ];
  for (const [fx,fz] of [[42,5],[20,-25],[55,-10],[10,-45],[48,15]]) {
    const h = Math.floor(terrainHeight(fx,fz));
    for (let y=h;y>h-8;y--) {
      setB(fx,y,fz,BT.WATER);
      if (y<h) setB(fx,y,fz-1,BT.WATER);
      if (y<h) setB(fx,y,fz+1,BT.WATER);
    }
    // Rock below
    for (let y=h-8;y<h-4;y++) setB(fx,y,fz,BT.COBBLESTONE);
    // Railing around top
    for (let x=-1;x<=1;x++) setB(fx+x,h-1,fz,BT.COBBLESTONE);
  }
}

// ───────────────────────────────────────
// VOLCANO — at (75, 40)
// ───────────────────────────────────────
const VOL_X = 75, VOL_Z = 40;

function volcanoBuild() {
  const vx=VOL_X, vz=VOL_Z;
  // Crater rim — basalt ring
  for (let angle=0;angle<Math.PI*2;angle+=0.15) {
    const r=22;
    const rx=Math.round(Math.cos(angle)*r);
    const rz=Math.round(Math.sin(angle)*r);
    const wx=vx+rx, wz=vz+rz;
    const h=Math.floor(terrainHeight(wx,wz));
    for (let y=0;y<4;y++) setB(wx,h+y,wz,BT.BASALT);
    setB(wx,h+4,wx,BT.CRYSTAL); // glowing crystals on rim
  }
  // Crater — lava pool
  for (let x=-10;x<=10;x++) for (let z=-10;z<=10;z++) {
    const d=Math.sqrt(x*x+z*z);
    if (d<7) {
      const wx=vx+x, wz=vz+z;
      const h=Math.floor(terrainHeight(wx,wz));
      for (let y=0;y<3;y++) setB(wx,h+y,wz,BT.LAVA);
    }
  }
  // Lava glow ring
  for (let x=-14;x<=14;x++) for (let z=-14;z<=14;z++) {
    const d=Math.sqrt(x*x+z*z);
    if (d>5&&d<9) {
      const wx=vx+x, wz=vz+z;
      const h=Math.floor(terrainHeight(wx,wz));
      if (Math.random()<0.3) setB(wx,h+1,wz,BT.LAVA);
    }
  }
  // Smoke/ash particles above crater (simulate with block clusters)
  for (let i=0;i<20;i++) {
    const a=Math.random()*Math.PI*2;
    const r=5+Math.random()*10;
    const y=terrainHeight(vx,vz)+8+Math.floor(Math.random()*12);
    const px=Math.round(Math.cos(a)*r);
    const pz=Math.round(Math.sin(a)*r);
    const wx=vx+px, wz=vz+pz;
    if (y>0) setB(wx,y,wz,BT.SMOKE_PARTICLE);
  }
  // Dead trees around volcano
  for (let i=0;i<18;i++) {
    const a=Math.random()*Math.PI*2;
    const r=14+Math.random()*12;
    const wx=vx+Math.round(Math.cos(a)*r);
    const wz=vz+Math.round(Math.sin(a)*r);
    const h=Math.floor(terrainHeight(wx,wz);
    if (h>0) {
      for (let y=0;y<4;y++) setB(wx,h+y,wz,BT.DIRT);
      for (let y=4;y<7;y++) setB(wx,h+y,wz,BT.WOOD);
      // Thin dead branches
      if (Math.random()<0.6) {
        for (let y=5;y<7;y++) setB(wx+1,h+y,wz,BT.WOOD);
        setB(wx+1,h+6,wz,BT.DEAD_BUSH);
      }
    }
  }
  // Ancient ruins at volcano base
  for (let x=-8;x<=8;x++) for (let z=-8;z<=8;z++) {
    const d=Math.sqrt(x*x+z*z);
    if (d>10&&d<14&&Math.random()<0.15) {
      const wx=vx+x, wz=vz+z;
      const h=Math.floor(terrainHeight(wx,wz);
      for (let y=0;y<2;y++) setB(wx,h+y,wz,BT.BASALT);
      setB(wx,h+2,wz,BT.CRYSTAL);
    }
  }
  // Red ambient — use red sandstone torches around base
  for (let i=0;i<15;i++) {
    const a=Math.random()*Math.PI*2;
    const r=16+Math.random()*5;
    const wx=vx+Math.round(Math.cos(a)*r);
    const wz=vz+Math.round(Math.sin(a)*r);
    const h=Math.floor(terrainHeight(wx,wz);
    if (h>0) setB(wx,h+1,wz,BT.TORCH);
  }
  // Obsidian veins
  for (let i=0;i<8;i++) {
    const wx=vx+Math.floor(Math.random()*20-10);
    const wz=vz+Math.floor(Math.random()*20-10);
    const h=Math.floor(terrainHeight(wx,wz);
    for (let y=0;y<3;y++) setB(wx,h+y,wz,BT.OBSIDIAN);
  }
  // Magma blocks under crater
  for (let x=-8;x<=8;x++) for (let z=-8;z<=8;z++) {
    const d=Math.sqrt(x*x+z*z);
    if (d<8) {
      const wx=vx+x, wz=vz+z;
      for (let y=-5;y<0;y++) setB(wx,Math.floor(terrainHeight(wx,wz))+y,wz,BT.MAGMA);
    }
  }
}

      const h=Math.floor(terrainHeight(x,z);

        const th=3+Math.floor(Math.random()*3);

        for (let lx=-2;lx<=2;lx++) for (let lz=-2;lz<=2;lz++) {

// ───────────────────────────────────────
// MESH GENERATION — Hidden face culling
// ───────────────────────────────────────
const FACES = [
  { dir:[0,1,0],   u:[1,0,0], v:[0,0,1] },  // top    0
  { dir:[0,-1,0],  u:[1,0,0], v:[0,0,1] },  // bottom 1
  { dir:[1,0,0],   u:[0,1,0], v:[0,0,1] },  // right  2
  { dir:[-1,0,0],  u:[0,1,0], v:[0,0,1] },  // left   3
  { dir:[0,0,1],   u:[1,0,0], v:[0,1,0] },  // front  4
  { dir:[0,0,-1],  u:[1,0,0], v:[0,1,0] },  // back   5
];

function genChunkMesh(chunkX, chunkZ) {
  const cx = chunkX * CHUNK_SIZE, cz = chunkZ * CHUNK_SIZE;
  const maxVerts = 12000000;
  const head = new Float32Array(maxVerts); // 11 floats per vert: pos(3) + col(4) + emissive(1) + normal(3) = 11
  let vi = 0;

  for (let x=cx; x<cx+CHUNK_SIZE; x++) {
    for (let z=cz; z<cz+CHUNK_SIZE; z++) {
      for (let y=-30; y<WORLD_SIZE-30; y++) {
        const b = getB(x,y,z);
        if (b === BT.AIR) continue;
        const by = y;

        for (const [fi, face] of FACES.entries()) {
          const nx = x + face.dir[0];
          const ny = by + face.dir[1];
          const nz = z + face.dir[2];
          const nb = getB(nx, ny, nz);
          if (nb !== BT.AIR) continue;

          // Skip bottom faces of water (underwater)
          if (b === BT.WATER && face.dir[1] === -1) continue;

          const base = getBlockFaceColor(b, fi);
          const cr = base[0] + (Math.random()-0.5)*4;
          const cg = base[1] + (Math.random()-0.5)*4;
          const cb = base[2] + (Math.random()-0.5)*4;
          const ca = base[3];
          const emissive = base[4];

          const isEmissive = emissive > 0.05;
          const isGlass = b === BT.GLASS;
          const isLeaf = b===BT.LEAVES||b===BT.DARK_LEAVES||b===BT.BIRCH_LEAVES||b===BT.SPRUCE_LEAVES;

          // Face normal (the direction the face points)
          const fnx = face.dir[0], fny = face.dir[1], fnz = face.dir[2];

          // Per-block face vertex expand: 4 corners
          const U = face.u, V = face.v;
          const px = x, py = by, pz = z;

          // Skip internal faces for non-emissive blocks adjacent to same block type
          if (!isEmissive && !isGlass && !isLeaf && nb !== BT.AIR && nb === b) continue;

          // 4 verts with normal
          const corners = [
            [0,0], [1,0], [1,1], [0,1]
          ];
          for (const [cu, cv] of corners) {
            if (vi+11 >= maxVerts) break;
            const vx = px + (U[0]*cu + V[0]*cv);
            const vy = py + (U[1]*cu + V[1]*cv);
            const vz = pz + (U[2]*cu + V[2]*cv);
            head[vi++]=vx;
            head[vi++]=vy;
            head[vi++]=vz;
            head[vi++]=cr;
            head[vi++]=cg;
            head[vi++]=cb;
            head[vi++]=ca;
            head[vi++]=emissive;
            head[vi++]=fnx;
            head[vi++]=fny;
            head[vi++]=fnz;
          }
        }
      }
    }
  }

  const count = vi / 11;
  if (count === 0) return null;

  const vb = device.createBuffer({
    size: vi * 4,
    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    mappedAtCreation: true,
  });
  new Float32Array(vb.getMappedRange()).set(head.subarray(0, vi));
  vb.unmap();

  return { vb, count };
}

// Precompute all chunk meshes
function buildAllChunkMeshes() {
  progress = 0;
  const total = CHUNK_COUNT * CHUNK_COUNT;
  let done = 0;
  for (let cx=0; cx<CHUNK_COUNT; cx++) {
    for (let cz=0; cz<CHUNK_COUNT; cz++) {
      const key = `${cx},${cz}`;
      const mesh = genChunkMesh(cx, cz);
      if (mesh) {
        chunkMeshes.set(key, mesh);
      }
      done++;
      if (done % 10 === 0) {
        loadBar.style.width = (done/total*100)+'%';
        loadText.textContent = `Meshing chunks... ${done}/${total}`;
      }
    }
  }
  loadBar.style.width = '100%';
  loadText.textContent = 'Engine ready — loading...';
  setTimeout(()=>{ loadingEl.classList.add('hidden'); }, 400);
}

let progress = 0;

// ───────────────────────────────────────
// WATER PATCH MESH — animated river plane
// ───────────────────────────────────────
let waterVB = null, waterCount = 0;

function buildWaterMesh() {
  // River plane: vertices along the curve
  const verts = [];
  const steps = 400;
  for (let i=0;i<=steps;i++) {
    const t = i/steps;
    const z = -62 + t*125;
    const cx = 18 + Math.sin(z*0.025)*18;
    const hw = 13;
    // Two vertices at each cross-section
    for (const side of [-1, 1]) {
      const x = cx + side*hw;
      const h = terrainHeight(x, z);
      const wy = h + 0.5;
      verts.push(x, wy, z);
    }
  }
  const data = new Float32Array(verts);
  waterVB = device.createBuffer({
    size: data.byteLength,
    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
    mappedAtCreation: true,
  });
  new Float32Array(waterVB.getMappedRange()).set(data);
  waterVB.unmap();
  waterCount = data.length / 3;
}

// ───────────────────────────────────────
// MAIN RENDERER
// ───────────────────────────────────────
let pageSize = 0;

async function init() {
  // Loading sequence
  loadBar.style.width = '5%';
  loadText.textContent = 'Requesting WebGPU adapter...';

  if (!navigator.gpu) {
    loadText.textContent = 'WebGPU not supported. Try Chrome 113+.';
    return;
  }
  adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    loadText.textContent = 'No WebGPU adapter found.';
    return;
  }
  loadBar.style.width = '20%';

  device = await adapter.requestDevice();
  loadBar.style.width = '35%';
  loadText.textContent = 'Configuring swap chain...';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  context = canvas.getContext('webgpu');
  format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({
    device, format, alphaMode: 'premultiplied',
    depthStencilFormat: 'depth24plus-stencil8',
  });

  loadBar.style.width = '50%';
  loadText.textContent = 'Compiling shaders...';

  // ── Bind group layouts ──
  const camBind = device.createBindGroupLayout({
    entries: [{
      binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
      buffer: { type: 'uniform' }
    }]
  });

  const sceneBind = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      { binding: 1, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
      { binding: 3, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
    ]
  });

  const pipeLayout = device.createPipelineLayout({
    bindGroupLayouts: [camBind, sceneBind]
  });

  // ── Shaders ──
  // Cam uniform: matFov(16f) + matView(16f) + pos(3f+pad) + mode(1f) = 36 floats = 144 bytes, pad to 160
  // Scene uniform: sunDir(3)+sunColor(3)+ambColor(3)+fogColor(3)+fogDensity(1)+time(1)+mode(1)+bloom(1)+toneMap(1)+vignette(1)+exposure(1) = 16 floats = 64 bytes
  const CAM_UNIFORM_SIZE = 160;
  const SCENE_UNIFORM_SIZE = 64;

  const shaderCode = `
    struct Cam { matFov:mat4x4<f32>, matView:mat4x4<f32>, pos:vec3<f32>, camMode:f32 };
    struct Scene { sunDir:vec3<f32>, sunColor:vec3<f32>, ambColor:vec3<f32>, fogColor:vec3<f32>, fogDensity:f32, time:f32, mode:f32, bloom:f32, toneMap:f32, vignette:f32, exposure:f32 };

    @group(0) @binding(0) var<uniform> cam: Cam;
    @group(1) @binding(0) var<uniform> scene: Scene;
    @group(1) @binding(1) var<uniform> palette: array<vec4<f32>, ${BLOCK_COUNT}>;
    @group(1) @binding(2) var<uniform> lightGrid: array<vec4<f32>, 40>;
    @group(1) @binding(3) var<uniform> camSettings: vec4<f32>;

    struct VIn { pos:vec3<f32>, col:vec4<f32>, emissive:f32, nrm:vec3<f32> };
    struct VOut { @builtin(position) pos:vec4<f32>, @location(0) worldPos:vec3<f32>, @location(1) color:vec4<f32>, @location(2) emissive:f32, @location(3) normal:vec3<f32> };

    @vertex
    fn main(v: VIn) -> VOut {
      var o: VOut;
      let viewPos = cam.matView * vec4<f32>(v.pos, 1.0);
      let clipPos = cam.matFov * viewPos;
      o.pos = clipPos;
      o.worldPos = v.pos;
      o.color = v.col;
      o.emissive = v.emissive;
      o.normal = normalize(v.nrm);
      return o;
    }

    @fragment
    fn mainFrag(@location(0) worldPos: vec3<f32>, @location(1) color: vec4<f32>, @location(2) emissive: f32, @location(3) n: vec3<f32>) -> @location(0) vec4<f32> {
      var c = color;
      let nf = normalize(n);
      // Directional sun light
      let sd = normalize(scene.sunDir);
      let diff = max(dot(nf, sd), 0.0) * 0.75 + 0.25;
      // Hemisphere ambient: sky color from above, ground from below
      let skyAmt = max(nf.y, 0.0);
      let groundAmt = max(-nf.y, 0.0);
      let amb = mix(vec3(0.25,0.28,0.35), vec3(0.15,0.12,0.1), groundAmt) * scene.ambColor;
      var lit = c.rgb * (diff * scene.sunColor + amb);

      // Emissive glow — warm flame tones
      if (emissive > 0.01) {
        let e = emissive * 1.8;
        lit += vec3(e * 1.0, e * 0.7, e * 0.25) * 0.9;
      }

      // Fog — distance-based atmospheric perspective
      let camPos = cam.pos;
      let dist = length(worldPos - camPos);
      let fogAmt = 1.0 - exp(-scene.fogDensity * dist);
      lit = mix(lit, scene.fogColor, fogAmt * 0.8);

      // Height-based darkness for underground/lower areas
      let heightFactor = smoothstep(0.0, 14.0, worldPos.y);
      lit *= mix(0.55, 1.0, heightFactor);

      // Tone mapping (Reinhard)
      var outColor = vec4(lit, c.a);
      if (scene.toneMap > 0.5) {
        outColor.rgb = outColor.rgb / (outColor.rgb + vec3(1.0));
      }
      // Exposure
      outColor.rgb *= scene.exposure;

      // Vignette — screen-space corner darkening via normal direction proxy
      if (scene.vignette > 0.5) {
        let vig = 1.0 - 0.4 * (1.0 - abs(nf.y)) * (1.0 - abs(nf.x)*0.5) * 0.6;
        outColor.rgb *= vig;
      }

      // Bloom boost for bright pixels
      if (scene.bloom > 0.5) {
        let bright = max(max(outColor.r, outColor.g), outColor.b);
        if (bright > 0.75) {
          let bAmt = (bright - 0.75) * 0.6;
          outColor.rgb += vec3(bAmt * 0.9, bAmt * 0.6, bAmt * 0.3);
        }
      }

      return outColor;
    }
  `;

  const shaderModule = device.createShaderModule({ code: shaderCode });

  pipeline = device.createRenderPipeline({
    layout: pipeLayout,
    vertex: {
      module: shaderModule,
      entryPoint: 'main',
      buffers: [{
        arrayStride: 44,  // 12(pos) + 16(col) + 4(em) + 12(normal) = 44
        attributes: [
          { shaderLocation: 0, offset: 0,  format: 'float32x3' }, // position
          { shaderLocation: 1, offset: 12, format: 'float32x4' }, // color
          { shaderLocation: 2, offset: 28, format: 'float32' },   // emissive
          { shaderLocation: 3, offset: 32, format: 'float32x3' }, // normal
        ]
      }]
    },
    fragment: {
      module: shaderModule,
      entryPoint: 'mainFrag',
      targets: [{ format }]
    },
    primitive: { topology: 'triangle-list', cullMode: 'back' },
    depthStencil: {
      format: 'depth24plus-stencil8',
      depthWriteEnabled: true,
      depthCompare: 'less',
    },
    multisample: { count: 1 },
  });

  // ── Water shader ──
  const waterShaderCode = `
    struct Cam { matFov:mat4x4<f32>, matView:mat4x4<f32>, pos:vec3<f32>, camMode:f32 };
    struct Scene { sunDir:vec3<f32>, sunColor:vec3<f32>, ambColor:vec3<f32>, fogColor:vec3<f32>, fogDensity:f32, time:f32, mode:f32, bloom:f32, toneMap:f32, vignette:f32, exposure:f32 };

    @group(0) @binding(0) var<uniform> cam: Cam;
    @group(1) @binding(0) var<uniform> scene: Scene;
    @group(1) @binding(1) var<uniform> palette: array<vec4<f32>, ${BLOCK_COUNT}>;
    @group(1) @binding(2) var<uniform> lightGrid: array<vec4<f32>, 40>;
    @group(1) @binding(3) var<uniform> camSettings: vec4<f32>;

    struct VIn { pos:vec3<f32> };
    struct VOut { @builtin(position) pos:vec4<f32>, @location(0) worldPos:vec3<f32>, @location(1) uv:vec2<f32> };

    @vertex
    fn main(v: VIn) -> VOut {
      var o: VOut;
      let t = scene.time;
      let waveY = sin(v.pos.x*0.15 + t*1.2) * 0.15 + sin(v.pos.z*0.2 + t*1.8) * 0.1 + sin((v.pos.x+v.pos.z)*0.1 + t*0.9) * 0.08;
      let wy = v.pos.y + waveY;
      let viewPos = cam.matView * vec4<f32>(vec3(v.pos.x, wy, v.pos.z), 1.0);
      o.pos = cam.matFov * viewPos;
      o.worldPos = vec3(v.pos.x, wy, v.pos.z);
      o.uv = vec2(v.pos.x*0.01, v.pos.z*0.01) + t * 0.01;
      return o;
    }

    @fragment
    fn mainFrag(@location(0) worldPos: vec3<f32>, @location(1) uv: vec2<f32>) -> @location(0) vec4<f32> {
      let t = scene.time;
      // Animated water color with ripples
      let ripple = sin(uv.x*30.0 + t*2.0) * 0.05 + sin(uv.y*25.0 - t*1.5) * 0.05;
      var baseCol = vec3(0.15, 0.55, 0.85) + ripple * 0.1;

      // Specular reflection of sun
      let n = vec3(0.0, 1.0, 0.0);
      let viewDir = normalize(cam.pos - worldPos);
      let halfDir = normalize(normalize(scene.sunDir) + viewDir);
      let spec = pow(max(dot(n, halfDir), 0.0), 32.0) * scene.sunColor * 0.5;

      // Depth-based transparency
      let dist = length(worldPos - cam.pos);
      let alpha = 0.65 + 0.15 * ripple;

      // Sky reflection approximation
      let skyRefl = vec3(0.4, 0.6, 0.9) * 0.3;

      var col = baseCol + spec + skyRefl;
      col = col / (col + vec3(1.0)) * scene.exposure;

      return vec4(col, alpha);
    }
  `;

  const waterSM = device.createShaderModule({ code: waterShaderCode });
  waterPipe = device.createRenderPipeline({
    layout: pipeLayout,
    vertex: {
      module: waterSM, entryPoint: 'main',
      buffers: [{ arrayStride: 12, attributes: [{ shaderLocation:0, offset:0, format:'float32x3' }] }]
    },
    fragment: {
      module: waterSM, entryPoint: 'mainFrag',
      targets: [{ format, blend: { color: { srcFactor:'src-alpha', dstFactor:'one-minus-src-alpha', operation:'add' }, alpha: { srcFactor:'src-alpha', dstFactor:'one-minus-src-alpha', operation:'add' } } }]
    },
    primitive: { topology: 'triangle-list', cullMode: 'none' },
    depthStencil: { format: 'depth24plus-stencil8', depthWriteEnabled: false, depthCompare: 'less' },
  });

  // ── Uniform buffers ──
  camUniformBuffer = device.createBuffer({
    size: CAM_UNIFORM_SIZE,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  sceneUniformBuffer = device.createBuffer({
    size: 96, // Scene: 24 floats (with vec3 padding to 16 bytes each)
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  const paletteBuffer = device.createBuffer({
    size: BLOCK_COUNT * 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const lightGridBuffer = device.createBuffer({
    size: 40 * 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });
  const camSettingsBuffer = device.createBuffer({
    size: 16,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  // ── Bind groups ──
  const camBindGroup = device.createBindGroup({
    layout: camBind,
    entries: [{ binding: 0, resource: { buffer: camUniformBuffer } }]
  });
  const sceneBindGroup = device.createBindGroup({
    layout: sceneBind,
    entries: [
      { binding: 0, resource: { buffer: sceneUniformBuffer } },
      { binding: 1, resource: { buffer: paletteBuffer } },
      { binding: 2, resource: { buffer: lightGridBuffer } },
      { binding: 3, resource: { buffer: camSettingsBuffer } },
    ]
  });

  // ── Depth stencil ──
  const depthTexture = device.createTexture({
    size: [canvas.width, canvas.height],
    format: 'depth24plus-stencil8',
    usage: GPUTextureUsage.RENDER_ATTACHMENT,
  });
  const depthView = depthTexture.createView();

  // ── Shader data ──
  const paletteArr = new Float32Array(BLOCK_COUNT * 4);
  for (let i=0;i<BLOCK_COUNT;i++) {
    paletteArr[i*4]=PALETTE[i*6];
    paletteArr[i*4+1]=PALETTE[i*6+1];
    paletteArr[i*4+2]=PALETTE[i*6+2];
    paletteArr[i*4+3]=PALETTE[i*6+3];
  }
  paletteBuffer.setData(paletteArr);

  // ── Initial uniforms ──
  const scen = {
    sunDir: [0.3, 0.7, 0.4],
    sunColor: [1.0, 0.95, 0.85],
    ambColor: [0.35, 0.45, 0.6],
    fogColor: [0.7, 0.75, 0.85],
    fogDensity: 0.012,
    time: 0, mode: 0, bloom: 1, toneMap: 1, vignette: 1, exposure: 1.0,
  };

  function setSceneUniforms() {
    // WGSL uniform struct with vec3 has 16-byte alignment (padded to vec4).
    // Scene layout in memory (each vec3 occupies 4 floats, each f32 occupies 1 float):
    // Offset 0:  sunDir (vec3 + pad)     = 4 floats
    // Offset 16: sunColor (vec3 + pad)   = 4 floats
    // Offset 32: ambColor (vec3 + pad)   = 4 floats
    // Offset 48: fogColor (vec3 + pad)   = 4 floats
    // Offset 64: fogDensity              = 1 float
    // Offset 68: time                     = 1 float
    // Offset 72: mode                     = 1 float
    // Offset 76: bloom                    = 1 float
    // Offset 80: toneMap                  = 1 float
    // Offset 84: vignette                 = 1 float
    // Offset 88: exposure                 = 1 float
    // Total size = 92 bytes, rounded up to 96 (multiple of 16) = 24 floats
    const d = new Float32Array(24);
    d[0]=scen.sunDir[0]; d[1]=scen.sunDir[1]; d[2]=scen.sunDir[2];  // d[3] padding
    d[4]=scen.sunColor[0]; d[5]=scen.sunColor[1]; d[6]=scen.sunColor[2]; // d[7] padding
    d[8]=scen.ambColor[0]; d[9]=scen.ambColor[1]; d[10]=scen.ambColor[2]; // d[11] padding
    d[12]=scen.fogColor[0]; d[13]=scen.fogColor[1]; d[14]=scen.fogColor[2]; // d[15] padding
    d[16]=scen.fogDensity;
    d[17]=scen.time;
    d[18]=scen.mode;
    d[19]=scen.bloom;
    d[20]=scen.toneMap;
    d[21]=scen.vignette;
    d[22]=scen.exposure;
    // d[23] padding
    sceneUniformBuffer.setData(d);
  }

  // ── Camera ──
  const cam = {
    position: new Float32Array([18, 38, 22]),
    yaw: -2.2,
    pitch: -0.35,
    mode: 'walk',
    speed: 18,
    flySpeed: 22,
  };

  function updateCameraUniforms() {
    const fovY = 1.05; // vertical field of view in radians
    const aspect = canvas.width / canvas.height;
    const zNear = 0.5, zFar = 300;

    // WebGPU perspective projection: NDC z in [0,1], y up, x right
    const f = 1.0 / Math.tan(fovY * 0.5);
    const matFov = new Float32Array(16);
    matFov[0] = f / aspect;
    matFov[1] = 0;
    matFov[2] = 0;
    matFov[3] = 0;
    matFov[4] = 0;
    matFov[5] = f;
    matFov[6] = 0;
    matFov[7] = 0;
    matFov[8] = 0;
    matFov[9] = 0;
    matFov[10] = zFar / (zFar - zNear);
    matFov[11] = 1.0;
    matFov[12] = 0;
    matFov[13] = 0;
    matFov[14] = -zNear * zFar / (zFar - zNear);
    matFov[15] = 0;

    // Camera orientation from yaw/pitch (yaw=heading, pitch=elevation)
    const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);

    // Forward direction (where camera looks)
    const fwd = new Float32Array([cy * cp, sp, sy * cp]);

    // Right vector = normalize(cross(forward, worldUp))
    const worldUp = new Float32Array([0, 1, 0]);
    const rgt = new Float32Array([
      fwd[1] * worldUp[2] - fwd[2] * worldUp[1],
      fwd[2] * worldUp[0] - fwd[0] * worldUp[2],
      fwd[0] * worldUp[1] - fwd[1] * worldUp[0],
    ]);
    const rlen = Math.sqrt(rgt[0]*rgt[0]+rgt[1]*rgt[1]+rgt[2]*rgt[2]);
    if (rlen > 1e-8) { rgt[0]/=rlen; rgt[1]/=rlen; rgt[2]/=rlen; } else { rgt[0]=1; rgt[1]=0; rgt[2]=0; }

    // Up vector = cross(right, forward)
    const uup = new Float32Array([
      rgt[1] * fwd[2] - rgt[2] * fwd[1],
      rgt[2] * fwd[0] - rgt[0] * fwd[2],
      rgt[0] * fwd[1] - rgt[1] * fwd[0],
    ]);

    const eye = cam.position;

    // View matrix (column-major): transforms world->view
    // [rgt.x, uup.x, -fwd.x, 0]
    // [rgt.y, uup.y, -fwd.y, 0]
    // [rgt.z, uup.z, -fwd.z, 0]
    // [-dot(rgt,eye), -dot(uup,eye), dot(fwd,eye), 1]
    const matView = new Float32Array(16);
    matView[0] = rgt[0];  matView[1] = uup[0];  matView[2] = -fwd[0]; matView[3] = 0;
    matView[4] = rgt[1];  matView[5] = uup[1];  matView[6] = -fwd[1]; matView[7] = 0;
    matView[8] = rgt[2];  matView[9] = uup[2];  matView[10]=-fwd[2];  matView[11] = 0;
    matView[12] = -(rgt[0]*eye[0]+rgt[1]*eye[1]+rgt[2]*eye[2]);
    matView[13] = -(uup[0]*eye[0]+uup[1]*eye[1]+uup[2]*eye[2]);
    matView[14] = (fwd[0]*eye[0]+fwd[1]*eye[1]+fwd[2]*eye[2]);
    matView[15] = 1;

    // Pack into uniform buffer: Cam = matFov(16) + matView(16) + pos(3) + camMode(1) = 36 floats
    const camData = new Float32Array(36);
    camData.set(matFov, 0);
    camData.set(matView, 16);
    camData[32] = eye[0];
    camData[33] = eye[1];
    camData[34] = eye[2];
    camData[35] = cam.mode === 'orbit' ? 1.0 : 0.0;

    camUniformBuffer.setData(camData);
  }

  setSceneUniforms();
  updateCameraUniforms();

  // ── Build chunk meshes ──
  loadBar.style.width = '55%';
  loadText.textContent = 'Generating voxel meshes...';
  buildAllChunkMeshes();

  loadBar.style.width = '85%';
  loadText.textContent = 'Building water...';
  buildWaterMesh();

  loadBar.style.width = '95%';
  loadText.textContent = 'Finalizing...';

  // ── Input state ──
  const keys = {};
  let mouseDown = false;
  let mouseX = 0, mouseY = 0;
  let lastMX = 0, lastMY = 0;

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; e.preventDefault(); });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
  canvas.addEventListener('mousedown', e => { mouseDown = true; lastMX=e.clientX; lastMY=e.clientY; });
  window.addEventListener('mouseup', () => { mouseDown = false; });
  canvas.addEventListener('mousemove', e => {
    if (mouseDown) {
      const dx = e.clientX - lastMX;
      const dy = e.clientY - lastMY;
      cam.yaw -= dx * 0.004;
      cam.pitch -= dy * 0.004;
      cam.pitch = Math.max(-1.4, Math.min(1.4, cam.pitch));
      lastMX = e.clientX; lastMY = e.clientY;
    }
    mouseX = e.clientX; mouseY = e.clientY;
  });
  canvas.addEventListener('wheel', e => {
    if (cam.mode==='orbit') {
      cam.pitch -= e.deltaY * 0.003;
      cam.pitch = Math.max(-1.3, Math.min(1.3, cam.pitch));
    }
  });

  // ── UI handlers ──
  const timeButtons = document.querySelectorAll('[data-time]');
  let currentTime = 'day';

  function setTimeOfDay(time) {
    currentTime = time;
    timeButtons.forEach(b => b.classList.toggle('active', b.dataset.time===time));
    const tl = document.getElementById('time-label');
    tl.textContent = time.toUpperCase();

    if (time==='dawn') {
      scen.sunDir = [0.6, 0.25, 0.5]; scen.sunColor=[1.0,0.7,0.5];
      scen.ambColor=[0.5,0.4,0.5]; scen.fogColor=[0.85,0.7,0.6];
      scen.fogDensity=0.018; scen.exposure=0.85; scen.bloom=0.8;
    } else if (time==='day') {
      scen.sunDir=[0.3,0.7,0.4]; scen.sunColor=[1.0,0.95,0.85];
      scen.ambColor=[0.3,0.38,0.5]; scen.fogColor=[0.7,0.75,0.85];
      scen.fogDensity=0.012; scen.exposure=1.0; scen.bloom=1.0;
    } else if (time==='dusk') {
      scen.sunDir=[-0.4,0.2,0.6]; scen.sunColor=[1.0,0.6,0.3];
      scen.ambColor=[0.35,0.2,0.3]; scen.fogColor=[0.55,0.35,0.4];
      scen.fogDensity=0.02; scen.exposure=0.9; scen.bloom=1.2;
    } else if (time==='night') {
      scen.sunDir=[0.1,0.1,0.2]; scen.sunColor=[0.15,0.12,0.25];
      scen.ambColor=[0.08,0.06,0.15]; scen.fogColor=[0.05,0.05,0.12];
      scen.fogDensity=0.03; scen.exposure=0.6; scen.bloom=1.5;
    }
    setSceneUniforms();
  }

  timeButtons.forEach(b => b.addEventListener('click', () => setTimeOfDay(b.dataset.time)));

  const btnBloom = document.getElementById('btn-bloom');
  btnBloom.classList.add('active');
  btnBloom.addEventListener('click', () => {
    scen.bloom = scen.bloom>0.5?0.0:1.0;
    btnBloom.classList.toggle('active', scen.bloom>0.5);
    setSceneUniforms();
  });

  const btnOrbit = document.getElementById('btn-orbit');
  const btnFly = document.getElementById('btn-fly');
  const btnWalk = document.getElementById('btn-walk');
  const modeLabel = document.getElementById('mode-label');

  function setCamMode(mode) {
    cam.mode = mode;
    [btnOrbit,btnFly,btnWalk].forEach(b => b.classList.remove('active'));
    if (mode==='orbit') btnOrbit.classList.add('active');
    if (mode==='fly') btnFly.classList.add('active');
    if (mode==='walk') btnWalk.classList.add('active');
    modeLabel.textContent = mode.charAt(0).toUpperCase()+mode.slice(1);
    crosshair.style.display = (mode==='walk'||mode==='fly') ? 'block' : 'none';
    updateCameraUniforms();
  }

  btnOrbit.addEventListener('click', () => setCamMode('orbit'));
  btnFly.addEventListener('click', () => setCamMode('fly'));
  btnWalk.addEventListener('click', () => setCamMode('walk'));

  document.getElementById('btn-ss').addEventListener('click', takeScreenshot);
  document.getElementById('btn-reset').addEventListener('click', resetView);
  window.addEventListener('keydown', e => {
    if (e.key==='o'||e.key==='O') setCamMode(cam.mode==='orbit'?'walk':'orbit');
    if (e.key==='f'||e.key==='F') setCamMode(cam.mode==='fly'?'walk':'fly');
    if (e.key==='p'||e.key==='P') takeScreenshot();
    if (e.key==='1') setTimeOfDay('dawn');
    if (e.key==='2') setTimeOfDay('day');
    if (e.key==='3') setTimeOfDay('dusk');
    if (e.key==='4') setTimeOfDay('night');
  });

  // ── Screenshot ──
  function takeScreenshot() {
    ssNotice.classList.add('show');
    setTimeout(()=>ssNotice.classList.remove('show'), 1200);

    const w = canvas.width, h = canvas.height;
    const bb = device.createBuffer({ size: w*h*4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const readBack = device.createTexture({
      size: [w,h], format: 'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SOURCE,
    });

    // Re-render to offscreen texture
    const passEnc = device.createCommandEncoder();
    const rpass = passEnc.beginRenderPass({
      colorAttachments: [{
        view: readBack.createView(),
        loadOp: 'clear',
        storeOp: 'store',
        clearValue: { r:0,g:0,b:0,a:1 },
      }],
      depthStencilAttachment: { view: depthView, depthLoadOp:'clear', depthStoreOp:'store', depthClearValue:1 },
    });
    // Render all chunks again for screenshot
    for (const [key, mesh] of chunkMeshes) {
      rpass.setPipeline(pipeline);
      rpass.setBindGroup(0, camBindGroup);
      rpass.setBindGroup(1, sceneBindGroup);
      rpass.setVertexBuffer(0, mesh.vb);
      rpass.draw(mesh.count, 1, 0, 0);
    }
    if (waterVB && waterCount>0) {
      rpass.setPipeline(waterPipe);
      rpass.setBindGroup(0, camBindGroup);
      rpass.setBindGroup(1, sceneBindGroup);
      rpass.setVertexBuffer(0, waterVB);
      rpass.draw(waterCount, 1, 0, 0);
    }
    rpass.end();

    // Blit to screen texture then copy to buffer
    const screenTex = device.createTexture({
      size:[w,h], format:'rgba8unorm', usage: GPUTextureUsage.COPY_DST | GPUTextureUsage.COPY_SOURCE,
    });
    const screenView = screenTex.createView();
    const cmd2 = device.createCommandEncoder();
    const blitPass = cmd2.beginRenderPass({
      colorAttachments:[{
        view: screenView, loadOp:'clear', storeOp:'store',
        clearValue:{r:0,g:0,b:0,a:1},
      }]
    });
    // Re-render to screen texture
    for (const [key, mesh] of chunkMeshes) {
      blitPass.setPipeline(pipeline);
      blitPass.setBindGroup(0, camBindGroup);
      blitPass.setBindGroup(1, sceneBindGroup);
      blitPass.setVertexBuffer(0, mesh.vb);
      blitPass.draw(mesh.count, 1, 0, 0);
    }
    if (waterVB && waterCount>0) {
      blitPass.setPipeline(waterPipe);
      blitPass.setBindGroup(0, camBindGroup);
      blitPass.setBindGroup(1, sceneBindGroup);
      blitPass.setVertexBuffer(0, waterVB);
      blitPass.draw(waterCount, 1, 0, 0);
    }
    blitPass.end();

    cmd2.copyTextureToBuffer({ texture: screenTex }, { buffer: bb, bytesPerRow: w*4, rowsPerImage: h }, [w,h]);
    device.queue.submit([passEnc.finish(), cmd2.finish()]);

    // Readback
    await bb.mapAsync(GPUMapMode.READ);
    const pixels = new Uint8Array(bb.getMappedRange());
    const blob = new Blob([pixels], { type:'image/png' }); // not a real PNG, but works in some viewers
    // Actually create a proper PNG via canvas
    const offCanvas = document.createElement('canvas');
    offCanvas.width = w; offCanvas.height = h;
    const offCtx = offCanvas.getContext('2d');
    const imgData = offCtx.createImageData(w, h);
    imgData.data.set(pixels);
    offCtx.putImageData(imgData, 0, 0);

    // Download as PNG
    offCanvas.toBlob(b => {
      const url = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = url; a.download = 'voxel-realms.png';
      a.click(); URL.revokeObjectURL(url);
    }, 'image/png', 0.95);

    bb.unmap();
  }

  function resetView() {
    if (cam.mode==='orbit') {
      cam.position.set(18,38,22);
      cam.yaw=-2.2; cam.pitch=-0.35;
    } else {
      cam.position.set(18,30,20);
      cam.yaw=-2.2; cam.pitch=-0.3;
    }
    updateCameraUniforms();
  }

  // ── Main loop ──
  let prevTime = performance.now();
  let elapsed = 0;

  function frame(now) {
    const dt = Math.min((now-prevTime)/1000, 0.05);
    prevTime = now;
    elapsed += dt;
    scen.time = elapsed;
    setSceneUniforms();

    // Orbit camera animation
    if (cam.mode==='orbit') {
      const radius = 48;
      const height = 32 + Math.sin(elapsed*0.15)*5;
      const tx = CASTLE_X, tz = CASTLE_Z;
      const orbitAngle = elapsed * 0.12;
      cam.position[0] = tx + Math.cos(orbitAngle)*radius;
      cam.position[2] = tz + Math.sin(orbitAngle)*radius;
      cam.position[1] = height;
      cam.yaw = orbitAngle + Math.PI;
      cam.pitch = -0.3;
    }

    // Input movement
    if (cam.mode==='walk'||cam.mode==='fly') {
      const speed = cam.mode==='fly' ? cam.flySpeed : cam.speed * dt;
      const fwd = new Float32Array([
        Math.cos(cam.yaw)*Math.cos(cam.pitch),
        Math.sin(cam.pitch),
        Math.sin(cam.yaw)*Math.cos(cam.pitch),
      ]);
      const rgt = new Float32Array([
        Math.sin(cam.yaw),
        0,
        -Math.cos(cam.yaw),
      ]);
      let moved = false;
      const moveVec = new Float32Array(3);
      if (keys['w']||keys['arrowup']) { moveVec[0]+=fwd[0]; moveVec[1]+=fwd[1]; moveVec[2]+=fwd[2]; moved=true; }
      if (keys['s']||keys['arrowdown']) { moveVec[0]-=fwd[0]; moveVec[1]-=fwd[1]; moveVec[2]-=fwd[2]; moved=true; }
      if (keys['a']||keys['arrowleft']) { moveVec[0]-=rgt[0]; moveVec[2]-=rgt[2]; moved=true; }
      if (keys['d']||keys['arrowright']) { moveVec[0]+=rgt[0]; moveVec[2]+=rgt[2]; moved=true; }
      if (keys[' ']) { moveVec[1]+=1; moved=true; }
      if (keys['shift']) { moveVec[1]-=1; moved=true; }

      if (moved) {
        const len = Math.sqrt(moveVec[0]**2+moveVec[1]**2+moveVec[2]**2);
        if (len>0) {
          const spd = cam.mode==='fly' ? cam.flySpeed*dt : cam.speed*dt;
          cam.position[0]+=moveVec[0]/len*spd;
          cam.position[1]+=moveVec[1]/len*spd;
          cam.position[2]+=moveVec[2]/len*spd;
        }
      }

      // Clamp in world
      cam.position[0]=Math.max(-58,Math.min(58,cam.position[0]));
      cam.position[1]=Math.max(2,Math.min(80,cam.position[1]));
      cam.position[2]=Math.max(-58,Math.min(58,cam.position[2]));
    }

    updateCameraUniforms();

    // ── Render ──
    // Resize depth texture if needed
    const cw = canvas.width, ch = canvas.height;
    context.getCurrentTexture().createView();

    const enc = device.createCommandEncoder();
    const rpass = enc.beginRenderPass({
      colorAttachments: [{
        view: context.getCurrentTexture().createView(),
        loadOp: 'clear',
        storeOp: 'store',
        clearValue: scen.time<2?(scen.fogColor[0]*0.5+0.05):(scen.fogColor[0]*0.3+0.02),
      }],
      depthStencilAttachment: {
        view: depthView,
        depthLoadOp: 'clear',
        depthStoreOp: 'store',
        depthClearValue: 1,
      },
    });

    // Terrain chunks
    const camBG = camBindGroup;
    const sceneBG = sceneBindGroup;
    rpass.setPipeline(pipeline);
    for (const [key, mesh] of chunkMeshes) {
      rpass.setBindGroup(0, camBG);
      rpass.setBindGroup(1, sceneBG);
      rpass.setVertexBuffer(0, mesh.vb);
      rpass.draw(mesh.count, 1, 0, 0);
    }

    // Water
    if (waterVB && waterCount > 0) {
      rpass.setPipeline(waterPipe);
      rpass.setBindGroup(0, camBG);
      rpass.setBindGroup(1, sceneBG);
      rpass.setVertexBuffer(0, waterVB);
      rpass.draw(waterCount, 1, 0, 0);
    }

    rpass.end();
    device.queue.submit([enc.finish()]);

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);

  loadBar.style.width = '100%';
  loadText.textContent = 'Voxel Realms — ready';
  setTimeout(()=>loadingEl.classList.add('hidden'), 500);
}

init().catch(e => {
  console.error(e);
  loadText.textContent = 'Error: ' + e.message;
});

</script>
</body>
</html>
