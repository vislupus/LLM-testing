<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cinematic Medieval Fantasy Voxel World – Pure WebGPU Diorama</title>
  <style>
    html, body {margin:0;padding:0;width:100vw;height:100vh;overflow:hidden;background:#222;}
    #ui {
      position:absolute;top:13px;left:18px;z-index:10;font-family:sans-serif;
      color:#fff;font-size:16px;text-shadow:0 2px 6px #000a;
      user-select: none;
    }
    #ui button {
      background:rgba(40,40,50,0.85);color:#eee;padding:4px 12px;
      border:1px solid #555;border-radius:5px;margin-right:7px;
      margin-bottom: 3px;
      font-size:16px;cursor:pointer;
      transition: background 0.2s;
    }
    #ui button.selected {background:linear-gradient(90deg,#ffdb8433,#ffd25544,#4c2181bb);}
    #screenshotNotice {
      display:none;
      position:absolute;top:38px;left:33px;z-index:100;background:#000b;
      padding:18px 36px;border-radius:10px;font-size:22px;font-family:sans-serif;
      color:gold;box-shadow:0 4px 32px #0008;
      pointer-events:none;transition:opacity 0.7s;
    }
  </style>
</head>
<body>
<canvas id="gfx" width="1024" height="666" style="width:100vw;height:100vh;display:block;"></canvas>
<div id="ui">
  <button id="btnDawn">Dawn</button>
  <button id="btnDay">Day</button>
  <button id="btnDusk">Dusk</button>
  <button id="btnNight">Night</button>
  <button id="btnOrbit" title="Cinematic Camera Orbit">&#x21ba; Orbit</button>
  <button id="btnWalk" class="selected" title="Free Camera">☐ Walk</button>
  <button id="btnScreenshot" title="Save Screenshot">📸 Screenshot</button>
  <span id="perf" style="margin-left:25px;font-size:13px;color:#aaa;"></span><br>
  <span>WASD: Move, Space/Ctrl: Up/Down, Mouse: Look, Shift: Sprint, F: Toggle Fog, L: Toggle Bloom</span>
</div>
<div id="screenshotNotice">Screenshot saved!</div>
<script type="module">
// === PURE WEBGPU VOXEL DIORAMA SHOWCASE === //
//    by OpenAI ChatGPT | July 2026          //
//  ---- Modern Chrome/Edge, no polyfills ----

// ====== GLOBALS & WORLD CONFIG ======

const CANVAS = document.getElementById('gfx');
const RESX = CANVAS.width = window.innerWidth;
const RESY = CANVAS.height = window.innerHeight;

// Voxel world dimensions (in blocks). Diorama size.
const WORLD_SIZE = [80, 50, 80];  // [X,Y,Z]
const CHUNK_SIZE = 16;
const VOXEL_TYPES = { // Handful for demo; Add more for color/detail!
  air:0, grass:1, dirt:2, stone:3, water:4, wood:5,
  leaves:6, brick:7, thatch:8, glass:9, sand:10,
  basalt:11, lava:12, snow:13, torch:14, flag:15, gold:16, window:17,
  flower:18, ash:19,
  path:20, roof:21, iron:22, plank:23, wool:24, fence:25, crop:26,
};
const VOXEL_MATERIALS = [
  // [R,G,B,Emit,Smooth,Reflect,Transp]
  //   ... in 0-1, last=Opacity
  [0,0,0,0,0,0,0], // air
  [0.25,0.8,0.23,0,0.2,0,1], // grass
  [0.64,0.42,0.22,0,0.05,0,1], // dirt
  [0.62,0.60,0.64,0,0.1,0,1], // stone
  [0.19,0.32,0.56,0,0.2,0.45,0.95], // water
  [0.52,0.36,0.17,0,0.1,0,1], // wood
  [0.27,0.6,0.22,0,0.4,0,1], // leaves
  [0.59,0.35,0.17,0,0.12,0,1], // brick
  [0.81,0.73,0.31,0,0.15,0,1], // thatch/roof straw
  [0.75,0.95,1,0,0.27,0.02,0.78], // glass (village windows)
  [0.99,0.93,0.71,0,0.2,0.16,1], // sand
  [0.2,0.14,0.13,0,0.25,0,1], // basalt
  [0.959,0.38,0.01,0.46,0.7,0.23,1], // lava (bright!)
  [0.98,0.99,1,0,0.19,0,1], // snow
  [1,0.68,0.25,1,0.78,0.05,1], // torch (emissive orange)
  [0.8,0.11,0.18,0.47,0.4,0.11,1], // flag (red cloth, maybe animate)
  [1,0.88,0.37,0,0.18,0.56,1], // gold (castle/royal stuff)
  [0.95,0.76,0.55,0.35,0.61,0.22,0.6], // glowing window
  [0.13,0.88,0.22,0,0.2,0.1,1], // flower (village gardening)
  [0.5,0.37,0.28,0,0.05,0,1], // ash/ruin/volcano
  [0.78,0.68,0.41,0,0.05,0,1], // path/sand/road
  [0.75,0.37,0.15,0,0.16,0,1], // roof wood tile
  [0.84,0.84,0.84,0,0.32,0.19,1], // iron (gate)
  [0.912,0.67,0.45,0,0.09,0,1], // plank (whiter wood)
  [0.8,0.11,0.22,0,0.17,0,1], // wool (flag/cloth)
  [0.62,0.39,0.13,0,0.13,0,1], // fences/carts
  [0.85,0.91,0.46,0,0.27,0,1], // crops/farms
];

// Daylight colors. Sun intensity.
const SUNS = [
   // Color      Dir {[x,y,z]}      Strength
  {name:"Dawn", col:[1,0.6,0.35], dir:[-0.5,1,-0.2], pow:0.51, fog:[0.65,0.43,0.59], sky:[1,0.58,0.37]},
  {name:"Day", col:[1,0.94,0.8], dir:[-0.4,1.5,-0.5], pow:1, fog:[0.73,0.89,1], sky:[0.73,0.89,1]},
  {name:"Dusk", col:[1,0.49,0.32], dir:[-0.47,1,-0.42], pow:0.6, fog:[0.83,0.44,0.33], sky:[1,0.4,0.38]},
  {name:"Night", col:[0.36,0.41,0.68], dir:[0.12,-1,-0.51], pow:0.15, fog:[0.24,0.28,0.39], sky:[0.06,0.07,0.10]},
];

// ======= CAMERA, INPUT, CONTROLS =======

let camera = {
  pos: [60,34,65], // Y is height
  rot: [0,0],   // [pitch,yaw] in radians
  speed: 6, mode: "walk", orbitY: 35, orbitA: -0.675, orbitR: 62,
  vel: [0,0,0],
  flying: false,
  orbit: false,
};
let input = {
  k: {}, mouse: [0,0], prev:[0,0], lmb:0,rmb:0, pointerLock:false,
  sensitivity: 0.003, sprint: 1, fog:true, bloom:true,
};
function setupInput() {
  window.addEventListener('keydown',e=>{ input.k[e.key.toLowerCase()]=1; });
  window.addEventListener('keyup',e=>{ input.k[e.key.toLowerCase()]=0; });
  CANVAS.addEventListener("mousedown", (e)=>{
    if(document.pointerLockElement!==CANVAS) CANVAS.requestPointerLock();
    if(e.button==0)input.lmb=1;
    if(e.button==2)input.rmb=1;
  });
  window.addEventListener("pointerlockchange", ()=>{
    input.pointerLock=document.pointerLockElement===CANVAS;
  });
  CANVAS.addEventListener('mousemove',e=>{
    if(input.pointerLock) {
      camera.rot[1]-=e.movementX*input.sensitivity;
      camera.rot[0]-=e.movementY*input.sensitivity;
      camera.rot[0]=Math.max(-Math.PI/2+0.1,Math.min(Math.PI/2-0.1,camera.rot[0]));
    }
    input.mouse=[e.offsetX,e.offsetY];
  });
  window.addEventListener('contextmenu',e=>{
    if(document.pointerLockElement) e.preventDefault();
  });

  document.getElementById('btnWalk').onclick = ()=>{
    camera.orbit=false;
    document.getElementById('btnOrbit').classList.remove('selected');
    document.getElementById('btnWalk').classList.add('selected');
  };
  document.getElementById('btnOrbit').onclick = ()=>{
    camera.orbit=true;
    document.getElementById('btnOrbit').classList.add('selected');
    document.getElementById('btnWalk').classList.remove('selected');
  };
  document.getElementById('btnDawn').onclick = ()=>{ setSun(0); };
  document.getElementById('btnDay').onclick = ()=>{ setSun(1); };
  document.getElementById('btnDusk').onclick = ()=>{ setSun(2); };
  document.getElementById('btnNight').onclick = ()=>{ setSun(3); };

  document.getElementById('btnScreenshot').onclick = ()=>{
    CANVAS.toBlob(blob=>{
      let a = document.createElement('a');
      a.download = "screenshot.png";
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a);
      a.click();
      a.remove();
      showScreenshotNotice();
    },'image/png');
  };
  window.addEventListener('keydown',e=>{
    if(e.key==="f") input.fog^=1;
    if(e.key==="l") input.bloom^=1;
  });
}
function showScreenshotNotice(){
  let m = document.getElementById('screenshotNotice');
  m.style.display="block";m.style.opacity=1;
  setTimeout(()=>m.style.opacity=0,1600);
  setTimeout(()=>m.style.display="none",2200);
}

// =========== VOXEL DATA ===============

// Main world array: world[x][y][z]=voxel id (0=air)
let world = [];
for(let x=0;x<WORLD_SIZE[0];++x) {
  world[x]=[];
  for(let y=0;y<WORLD_SIZE[1];++y)
    world[x][y]=new Uint8Array(WORLD_SIZE[2]);
}

// Set voxel at position if in bounds
function setVoxel(x,y,z,id) {
  if(x>=0&&y>=0&&z>=0&&x<WORLD_SIZE[0]&&y<WORLD_SIZE[1]&&z<WORLD_SIZE[2])
    world[x][y][z]=id;
}
function getVoxel(x,y,z) {
  if(x<0||y<0||z<0||x>=WORLD_SIZE[0]||y>=WORLD_SIZE[1]||z>=WORLD_SIZE[2]) return 0;
  return world[x][y][z];
}

// ======== HANDCRAFTED DIORAMA CREATION ========

// Helper to fill a box of voxels
function box(x1,y1,z1,x2,y2,z2,id) {
  for(let x=x1;x<=x2;++x)
    for(let y=y1;y<=y2;++y)
      for(let z=z1;z<=z2;++z)
        setVoxel(x,y,z,id);
}

// Helper: Fill circle/ellipse shapes
function ellipse(cx,cz,r1,r2,y,h,id) {
  for(let x=-r1;x<=r1;++x)
    for(let z=-r2;z<=r2;++z)
      if((x*x)/(r1*r1)+(z*z)/(r2*r2)<=1)
        box(cx+x, y, cz+z, cx+x, y+h-1, cz+z, id);
}

// Helper: Cylinder between (x1,z1)-(x2,z2)
function cylinder(x0,z0,x1,z1,r, y0,y1, id) {
  let n=Math.max(1,Math.abs(x1-x0)+Math.abs(z1-z0));
  for(let i=0;i<=n;++i) {
    let x=Math.round(x0+(x1-x0)*i/n);
    let z=Math.round(z0+(z1-z0)*i/n);
    ellipse(x,z,r,r,y0,y1-y0+1,id);
  }
}
// Helper: Place a "block"--with clipping
function put(x,y,z,id){ setVoxel(x|0,y|0,z|0,id); }

// =========== MINIATURE WORLD BUILDER ===========

function buildTerrain() {
  // GROUND: river valley (village) to hill (castle/keep) to mountains/volcano

  // Perlin-like random noise for natural hills (static seed)
  function noise(x,z) {
    let s=Math.sin(x*0.18+z*0.12)*0.6+Math.cos(z*0.16+x*0.21)*0.7;
    s+=Math.sin((x+12)*0.087+z*0.14)*0.6;
    return s;
  }
  for(let x=0;x<WORLD_SIZE[0];++x) for(let z=0;z<WORLD_SIZE[2];++z) {
    let d = Math.sqrt((x-42)**2+(z-38)**2);
    let m = (1-noise(x,z))*4;
    let h = 18 + Math.cos((x-39)*0.06)*2 + Math.cos((z-41)*0.07)*2 +
      ((x<33)?-5:(x>62)?1:0) +
      (d<28? Math.max(0,24-Math.pow(d*0.89,1.31))+m : m );
    h|=0;

    let isHill = (x>44&&x<60&&z>26&&z<52);
    // Terrain layers:
    for(let y=0;y<=h;y++) {
      if(y+1>h) {
        setVoxel(x,y,z, isHill && y>22 ? VOXEL_TYPES.grass : VOXEL_TYPES.grass);
      } else if(y+4>h) setVoxel(x,y,z,VOXEL_TYPES.dirt);
      else setVoxel(x,y,z,VOXEL_TYPES.stone);
      // snow for higher elevations, near volcano
      if(y===h && (x>72||z<8) && h>=29) setVoxel(x,y,z,VOXEL_TYPES.snow);
    }
    // River
    if(z>14&&z<30&&x>15&&x<72&&Math.abs(z-22-(x-44)*0.11)<Math.max(5-Math.abs(x-43)*0.013,3.9)) {
      let w=h+1;
      for(let y=w;y<Math.max(25,h+3);++y) setVoxel(x,y,z,VOXEL_TYPES.water);
    }
    // Waterfall, on cliff at [72, dZ=20..27]
    if(x===71 && z>20&&z<27) for(let y=h+1;y<29;++y) setVoxel(x,y,z,VOXEL_TYPES.water);
    // Edge snow
    if(x>72&&h>27) setVoxel(x,h,z,VOXEL_TYPES.snow);
  }
}

function buildCastle() {
  // Main castle sits on a mound, at (xx,yy,zz)
  const bx=46, bz=44, by=27;
  // Terraced hill
  for(let i=0;i<3;++i) ellipse(bx,bz,9-i*2,7-i*2,by+i,1,VOXEL_TYPES.grass);
  // Moat (oval pool)
  for(let a=0;a<360;a+=3) {
    let ang=a*Math.PI/180, r=14, rz=12;
    let x=Math.round(bx+Math.cos(ang)*r), z=Math.round(bz+Math.sin(ang)*rz);
    // Lowered water
    for(let y=by-2;y<=by-1;++y) setVoxel(x,y,z,VOXEL_TYPES.water);
  }
  // Castle walls/towers
  ellipse(bx,bz,8,6,by+3,5,VOXEL_TYPES.brick);
  // Towers
  for(let d=0;d<4;d++) {
    let ang=d*Math.PI/2, rx=Math.round(Math.cos(ang)*7.2), rz=Math.round(Math.sin(ang)*5.7);
    cylinder(bx+rx,bz+rz,bx+rx,bz+rz,2,by+3,by+10,VOXEL_TYPES.brick);
    // Tower tops
    ellipse(bx+rx,bz+rz,2,2,by+11,1,VOXEL_TYPES.stone);
    // Flags
    for(let j=0;j<4;j++){
      let fy=by+12+j, fx=bx+rx, fz=bz+rz;
      setVoxel(fx,fy,fz,VOXEL_TYPES.flag);
      if(j>1) setVoxel(fx+1,fy,fz,VOXEL_TYPES.wool);
    }
  }
  // Main gate & bridge over moat
  for(let y=by+3;y<=by+6;++y) for(let x=bx-2;x<=bx+2;++x) setVoxel(x,y,bz-8,VOXEL_TYPES.iron);
  for(let l=0;l<7;l++) setVoxel(bx,bx+1-l, bz-8+l, VOXEL_TYPES.plank);
  for(let x=bx-1;x<=bx+1;x++)
    for(let z=bz-13;z<=bz-8;z++)
      setVoxel(x,by-2,z,VOXEL_TYPES.plank);
  // Royal keep, 6x5x7
  box(bx-2,by+5,bz-2,bx+3,by+12,bz+2,VOXEL_TYPES.stone);
  // Windows glowing (inside keep at night)
  for(let y=by+7;y<=by+11;y+=2) {
    setVoxel(bx+3,y,bz,VOXEL_TYPES.window);
    setVoxel(bx-2,y,bz,VOXEL_TYPES.window);
  }
  // Great hall (chapel style roof)
  box(bx-4,by+6,bz-4,bx+5,by+9,bz-2,VOXEL_TYPES.brick);
  for(let x=bx-4;x<=bx+5;x++)
    for(let z=bz-4;z<=bz-2;z++)
      if(Math.abs(x-bx)<4&&(z===bz-4||z===bz-2)) setVoxel(x,by+10,z,VOXEL_TYPES.roof);
  // Courtyard
  ellipse(bx,bz,5,3,by+3,1,VOXEL_TYPES.path);
  // Gardens
  for(let dx=-5;dx<=5;++dx)
    for(let dz=-3;dz<=3;++dz)
      if(Math.random()>0.88) setVoxel(bx+dx,by+3,bz+dz,VOXEL_TYPES.flower);
  // Battlements
  for (let ang=0;ang<360;ang+=13) {
    let r=8.2, rz=6.2, x=Math.round(bx+Math.cos(ang*Math.PI/180)*r), z=Math.round(bz+Math.sin(ang*Math.PI/180)*rz);
    setVoxel(x,by+8,z,VOXEL_TYPES.stone);
    setVoxel(x,by+9,z,VOXEL_TYPES.stone);
  }
  // Torches on entrances
  let ent=[[bx-2,by+4,bz-8],[bx+2,by+4,bz-8]];
  for(let [x,y,z] of ent) setVoxel(x,y,z,VOXEL_TYPES.torch);

  // Chapel
  box(bx+4,by+6,bz+1,bx+6,by+9,bz+2,VOXEL_TYPES.brick); // small rear chapel
  setVoxel(bx+4,by+9,bz+1,VOXEL_TYPES.window);

  // Watchtowers on hill
  for(let d of [[bx-10,bz+2,by+5],[bx+9,bz+1,by+6]]) {
    cylinder(d[0],d[1],d[0],d[1],1,d[2],d[2]+5,VOXEL_TYPES.stone);
    setVoxel(d[0],d[2]+6,d[1],VOXEL_TYPES.flag);
  }
}

function buildVillage() {
  // Village curves by the river. Place ~30 structures, curved paths.
  let cx=36,cz=20,vy=19;
  let layout = [
    // [dx,z,type]
    [-6,3,1], [-5,0,2], [-2,6,4], [2,11,3], [4,7,2], [7,5,3], [12,2,4],
    [-12,0,2], [-10,-3,2], [-6,-4,1], [-2,-8,2], [5,-11,3],[12,-5,3],[13,-7,1],
    [16,-1,2],[18,4,3],[21,7,3],[23,10,3],[-16,-10,2],
    [9,12,3],[14,15,1],[8,17,2],[0,16,1],[-7,13,3], [-10,8,2],
    [19,-13,3],[21,-10,2]
  ];
  let typ = [VOXEL_TYPES.wood,VOXEL_TYPES.stone,VOXEL_TYPES.brick];
  for(let h=0;h<layout.length;h++) {
    let [dx,dz,style]=layout[h];
    let x=cx+dx, z=cz+dz, y=vy+Math.round(noise(x,z));
    // Random house dimensions
    let w=3+((h^77)%2), d=3+((h^61)%2), H=2+((h^39)%2);
    // Floor & walls
    box(x-w,y,z-d,x+w,y,z+d,VOXEL_TYPES.path);
    box(x-w,y+1,z-d,x-w,y+H+1,z+d,typ[style%3]);
    box(x+w,y+1,z-d,x+w,y+H+1,z+d,typ[style%3]);
    box(x-w+1,y+1,z-d,x+w-1,y+H+1,z-d,typ[style%3]);
    box(x-w+1,y+1,z+d,x+w-1,y+H+1,z+d,typ[style%3]);
    // Roof
    for(let ry=H+2;ry<H+4;++ry)
      box(x-w-1+ry-H-2, y+ry, z-d-1+ry-H-2, x+w+1-ry+H+2, y+ry, z+d+1-ry+H+2,VOXEL_TYPES.thatch);
    // Windows (sometimes)
    if(h%5==0) setVoxel(x,y+2,z-d,VOXEL_TYPES.window);
    if(h%9==3) setVoxel(x-w,y+2,z+1,VOXEL_TYPES.window);
    // Gardens
    if(h%6==0) for(let gx=x-2;gx<=x+2;gx++)if(Math.random()>0.6) setVoxel(gx,y,z-d-2,VOXEL_TYPES.flower);
    // Light: torches
    if(h%4==1) setVoxel(x+w,y+2,z,VOXEL_TYPES.torch);
    // Fences
    if((h&3)==0) for(let xx=x-w-1;xx<=x+w+1;xx++){
      setVoxel(xx,y+1,z-d-2,VOXEL_TYPES.fence);
      setVoxel(xx,y+1,z+d+2,VOXEL_TYPES.fence);
    }
  }
  // Marketplace square (well, stalls)
  ellipse(cx+6,cz,2.4,2.4,vy,1,VOXEL_TYPES.path);
  for(let ang=0;ang<360;ang+=90) {
    let rad=3.5, x=Math.round(cx+6+Math.cos(ang*Math.PI/180)*rad),z=Math.round(cz+Math.sin(ang*Math.PI/180)*rad);
    box(x-1,vy+1,z-1,x+1,vy+2,z+1,VOXEL_TYPES.plank); // Stalls
    setVoxel(x,vy+3,z,VOXEL_TYPES.torch);
  }
  // Central well
  ellipse(cx+6,cz,1,1,vy+1,2,VOXEL_TYPES.stone);
  setVoxel(cx+6,vy+3,cz,VOXEL_TYPES.water);
  // Tavern and Blacksmith
  // Tavern: sign (flag) + glass
  box(cx+12,vy+1,cz+8,cx+15,vy+3,cz+12,VOXEL_TYPES.wood);
  setVoxel(cx+13,vy+3,cz+12,VOXEL_TYPES.flag);
  setVoxel(cx+12,vy+2,cz+8,VOXEL_TYPES.window);
  // Blacksmith: forge (lava), tools (iron)
  box(cx-13,vy+1,cz-10,cx-15,vy+3,cz-14,VOXEL_TYPES.brick);
  setVoxel(cx-14,vy+2,cz-12,VOXEL_TYPES.lava); setVoxel(cx-15,vy+2,cz-11,VOXEL_TYPES.iron);
  // Watermill
  box(cx-18,vy+1,cz-19,cx-20,vy+3,cz-21,VOXEL_TYPES.wood);
  for(let a=0;a<360;a+=60) {
    let rx=Math.round(Math.cos(a*Math.PI/180)*1.2), rz=Math.round(Math.sin(a*Math.PI/180)*1.2);
    setVoxel(cx-21+rx,vy+3,cz-18+rz,VOXEL_TYPES.iron);
  }
  // Docks and boats
  for(let i=0;i<6;++i) {
    let x=cx-2+i*2, z=cz-10-i;
    setVoxel(x,vy+1,z,VOXEL_TYPES.plank);
    setVoxel(x,vy+2,z-2,VOXEL_TYPES.wood);
  }
  // Stone bridge across river
  for(let x=32;x<46;++x)
    for(let iz=22;iz<=25;++iz)
      for(let y=vy+1;y<=vy+2;++y)
        setVoxel(x,y,iz,VOXEL_TYPES.stone);
  // Farms, crops
  for(let f=0;f<6;++f) {
    let fx=cx-10+f*3, fz=cz+14+Math.sin(f*0.7)*3, fy=vy-1;
    ellipse(fx,fz,2,2,fy,1,VOXEL_TYPES.path);
    for(let i=0;i<8;++i) setVoxel(fx+Math.round(Math.cos(i*0.7)*1.5),fy+1,fz+Math.round(Math.sin(i*1.1)*1.4),VOXEL_TYPES.crop);
  }
  // Carts, barrels (as blocks)
  setVoxel(cx+15,vy+2,cz-9,VOXEL_TYPES.wood); setVoxel(cx+16,vy+2,cz-7,VOXEL_TYPES.wood);
}

function buildBiomeDetail() {
  // Animate water surface
  for(let x=0;x<WORLD_SIZE[0];++x) for(let z=0;z<WORLD_SIZE[2];++z)
    for(let y=0;y<WORLD_SIZE[1];++y)
      if(getVoxel(x,y,z)===VOXEL_TYPES.water && Math.random()>0.992)
        setVoxel(x+(Math.random()>0.5?1:-1),y,z+(Math.random()>0.5?1:-1),VOXEL_TYPES.flower);
  // Forest belt, both deciduous and conifer
  for(let i=0;i<45;++i) {
    let x=17+Math.random()*50|0, z=6+Math.random()*55|0, y=22+Math.round(noise(x,z)*3);
    if(y<6||y>37)continue;
    // Trunk
    for(let t=0;t<2+Math.random()*2;t++)setVoxel(x,y+t,z,VOXEL_TYPES.wood);
    // Leaves ball/cone
    for(let dx=-2;dx<=2;++dx)
      for(let dz=-2;dz<=2;++dz)
        for(let dy=0;dy<=2;++dy)
          if(dx*dx+dz*dz+dy*dy<=5)
            setVoxel(x+dx,y+2+dy,z+dz,VOXEL_TYPES.leaves);
  }
  // Lookout posts, ruins, caves
  box(15,36,15,16,39,15,VOXEL_TYPES.stone); // ruined lookout
  box(68,16,67,69,21,67,VOXEL_TYPES.stone); // mountain wall (ruin)
  // Caves
  for(let c=0;c<7;++c) {
    let x=15+Math.random()*55|0, z=9+Math.random()*55|0, y=14+Math.random()*10|0;
    for(let i=0;i<5+Math.random()*4;i++)setVoxel(x+(Math.random()*3-1.5)|0,y+(Math.random()*2-1)|0,z+(Math.random()*3-1.5)|0,0);
  }
  // Hidden paths/fences
  for(let p=0;p<18;++p){
    let x=34+(Math.random()-0.5)*35|0,z=14+(Math.random()-0.5)*25|0;
    for(let y=18;y<22;y++) if(Math.random()>0.85) setVoxel(x,y,z,VOXEL_TYPES.path);
  }
}

// Dramatic volcano, summit near [76,5], base y=28+
function buildVolcano() {
  let vx=76,vz=6,vby=30;
  // Shape: cone w/crater, with basalt, ash, glowing lava core
  for(let y=0;y<19;++y) {
    let r2=13-y*0.59;
    ellipse(vx,vz,Math.max(2,r2-Math.sin(y*0.7)*0.5),Math.max(1.8,r2*0.8-Math.cos(y*0.6)*0.5),vby+y,1,VOXEL_TYPES.basalt);
    if(y>11) ellipse(vx,vz,6.7-(y-12)*0.45,4.6-(y-12)*0.31,vby+y,1,VOXEL_TYPES.ash);
  }
  // Crater
  for(let y=0;y<6;++y)
    ellipse(vx,vz,3-y*0.48,2.3-y*0.4,vby+12+y,1,VOXEL_TYPES.lava);
  // Lava flow
  for(let l=0;l<14;++l) {
    setVoxel(vx+Math.round(l/1.5),vby+15-Math.abs(l-4)*0.7|0,vz+3+l*0.08|0,VOXEL_TYPES.lava);
    for(let j=0;j<2;++j) setVoxel(vx+1+j,vby+5+j,vz+6+l,VOXEL_TYPES.lava);
  }
  // Dead trees
  for(let i=0;i<13;++i){
    let x=vx-10+Math.random()*18|0, z=vz-4+Math.random()*13|0, h=2+Math.random()*3|0;
    for(let y=0;y<h;y++) setVoxel(x,vby+y,z,VOXEL_TYPES.wood);
  }
  // Ruins: broken walls
  for(let i=0;i<5;++i)
    box(vx-2+i*2,vby+4,vz-3,vx-2+i*2,vby+7,vz-3,VOXEL_TYPES.stone);
  // Watchtower
  cylinder(vx-7,vz+9,vx-7,vz+9,2,vby+7,vby+13,VOXEL_TYPES.stone);
  setVoxel(vx-7,vby+14,vz+9,VOXEL_TYPES.flag);
}

// ========== GREEDY FACE MESHER (CHUNKED) ==========

const CHUNKS = [];
function buildChunks() {
  CHUNKS.length=0;
  for(let cx=0;cx<WORLD_SIZE[0];cx+=CHUNK_SIZE)
    for(let cy=0;cy<WORLD_SIZE[1];cy+=CHUNK_SIZE)
    for(let cz=0;cz<WORLD_SIZE[2];cz+=CHUNK_SIZE)
      CHUNKS.push(meshedChunk(cx,cy,cz));
}

function meshedChunk(x0,y0,z0) {
  // Returns: {verts:Float32Array, inds:Uint32Array, off:[x0,y0,z0], len:n}
  let verts=[]; let inds=[];
  let gvi=0;
  // For each axis
  // Greedy meshing reference: https://0fps.net/2012/06/30/meshing-in-a-minecraft-game/
  for(let d=0;d<3;d++) {
    let u=(d+1)%3, v=(d+2)%3;
    let q=[0,0,0]; q[d]=1;
    let sz=[CHUNK_SIZE,CHUNK_SIZE,CHUNK_SIZE];
    for(let slice=0;slice<=sz[d];slice++) {
      let mask=[];
      for(let i=0;i<sz[u];i++)
        for(let j=0;j<sz[v];j++) {
          let coord=[x0,y0,z0];
          coord[d]=slice;   coord[u]+=i;   coord[v]+=j;
          let curr   = (slice<sz[d]) ? getVoxel(...coord) : 0;
          let c2 = coord.slice(); c2[d]--;
          let prev   = (slice>0) ? getVoxel(...c2) : 0;
          // Non-air at face and air at adjacent==face needed
          let voxel=curr, mat, atface=0, dir=1;
          if(voxel&&(!prev||slice==0)) { atface=1; dir=1; mat=voxel; }
          else if(prev&&(!curr||slice==sz[d])){ atface=1; dir=-1; mat=prev; }
          else { mask.push(null); continue; }
          mask.push({voxel:mat,dir});
        }
      // Greedy merge 2D mask rows into quads
      let n=0;
      for(let i=0;i<sz[u];i++)for(let j=0;j<sz[v];j++) {
        let m=mask[i*sz[v]+j];
        if(!m)continue;
        let w=1;
        while(i+w<sz[u]&&mask[(i+w)*sz[v]+j]&&
              mask[(i+w)*sz[v]+j].voxel===m.voxel&&mask[(i+w)*sz[v]+j].dir===m.dir)w++;
        let h=1;
        i: for(;j+h<sz[v];h++)
          for(let k=0;k<w;k++)
            if(!mask[(i+k)*sz[v]+j+h]||mask[(i+k)*sz[v]+j+h].voxel!==m.voxel||mask[(i+k)*sz[v]+j+h].dir!==m.dir)
              break i;
        // Quad vertices, in world coords
        let coords=[[x0,y0,z0],[x0,y0,z0],[x0,y0,z0],[x0,y0,z0]];
        coords[0][u]+=i; coords[0][v]+=j;
        coords[1][u]+=i+w; coords[1][v]+=j;
        coords[2][u]+=i+w; coords[2][v]+=j+h;
        coords[3][u]+=i; coords[3][v]+=j+h;
        for(let qv=0;qv<4;++qv)coords[qv][d]+=slice*(m.dir>0?0: -1);
        let faceN=[0,0,0]; faceN[d]=m.dir;
        let mat=VOXEL_MATERIALS[m.voxel];
        // Push 4 verts: [x,y,z], normal [x,y,z], color [r,g,b,emit,opac], packed faceN for shader
        for(let qv=0;qv<4;++qv)
          verts.push(
            ...coords[qv], ...faceN, ...mat, m.voxel
          );
        inds.push(gvi,gvi+1,gvi+2,
                  gvi,gvi+2,gvi+3);
        gvi+=4;
        // Clear mask
        for(let k=0;k<w;k++)for(let l=0;l<h;l++)
          mask[(i+k)*sz[v]+j+l]=null;
      }
    }
  }
  return {
    verts: new Float32Array(verts),
    inds: new Uint32Array(inds),
    off:[x0,y0,z0], len:verts.length/13,
  };
}

// ======== WEBGPU RENDER PIPELINE ========

let device, context, renderPipeline, depthView, skyView, passFormat;
let uniformBuffer, worldBindGroup, matBuffer, chunkBuffers = [];
let skyPipeline, postPipeline, postBindGroup, postTexture, postView;
let frameSampler;
let sunState=1; // 0=DAWN, 1=DAY, 2=DUSK, 3=NIGHT

async function initWebGPU() {
  if (!navigator.gpu){alert("WebGPU not supported in this browser.\nTry Chrome/Edge July 2026+"); throw "no WebGPU";}
  const adapter = await navigator.gpu.requestAdapter();
  device = await adapter.requestDevice();
  context = CANVAS.getContext('webgpu');
  passFormat = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format: passFormat, alphaMode: "opaque" });

  // Uniform buffer [projView matrix: 16, sunDir:3, sunCol:3, camPos:3, fog 4, time 1, effect flags 1]
  uniformBuffer = device.createBuffer({ size:4*32, usage:GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  matBuffer = device.createBuffer({ size:4*VOXEL_MATERIALS.length*8, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(matBuffer,0,new Float32Array(VOXEL_MATERIALS.flatMap(x=>x)));

  // Frame Sampler for cloud animation
  frameSampler = device.createSampler({magFilter:"linear",minFilter:"linear",addressModeU:"repeat",addressModeV:"repeat"});

  // Main pipeline and sky and post-processing
  buildPipelines();
}

// Load world, chunk mesh to GPU buffers
function uploadChunks() {
  chunkBuffers.forEach(c=>{ c.vb.destroy(); c.ib.destroy(); });
  chunkBuffers = CHUNKS.map(c=>{
    let vb = device.createBuffer({size: c.verts.byteLength, usage: GPUBufferUsage.VERTEX});
    device.queue.writeBuffer(vb,0,c.verts);
    let ib = device.createBuffer({size: c.inds.byteLength, usage: GPUBufferUsage.INDEX});
    device.queue.writeBuffer(ib, 0, c.inds);
    return {vb,ib, len:c.inds.length};
  });
}

// Build rendering pipeline, sky pipeline, post/bloom pipeline
function buildPipelines() {
  // ---- Main Voxel Pipeline ----
  const vshader = `
  struct Uniforms { projView: mat4x4f, sunDir:vec3f, sunCol:vec3f, camPos:vec3f, fog:vec4f, time: f32, effectFlags:u32, _pad:f32 };
  @group(0) @binding(0) var<uniform> U: Uniforms;
  @group(0) @binding(1) var<storage,read> mats: array<vec4f>;
  struct VertIn { @location(0) pos:vec3f, @location(1) norm:vec3f,
                  @location(2) colorA:vec4f, @location(3) colorB:vec4f, @location(4) faceId: f32 };
  struct VertOut { @builtin(position) pos:vec4f, @location(0) wpos:vec3f, @location(1) norm:vec3f,
                   @location(2) colorA:vec4f, @location(3) colorB:vec4f, @location(4) faceId: f32 };
  @vertex
  fn main(input:VertIn)->VertOut{
    var out:VertOut;
    out.pos=U.projView*vec4f(input.pos,1);
    out.wpos=input.pos;
    out.norm=input.norm;
    out.colorA=input.colorA;
    out.colorB=input.colorB;
    out.faceId=input.faceId;
    return out;
  }`;

  // Main fragment: Physically-based but simplified, smooth fog, sun, emissive, point lights, water reflection by normal.Y, bloomable glowing blocks
  const fshader = `
  enable f16;
  struct Uniforms { projView: mat4x4f, sunDir:vec3f, sunCol:vec3f, camPos:vec3f, fog:vec4f, time: f32, effectFlags:u32, _pad:f32 };
  @group(0) @binding(0) var<uniform> U: Uniforms;
  @group(0) @binding(1) var<storage,read> mats: array<vec4f>;
  fn saturate(x:f32)->f32{ return clamp(x,0.,1.); }
  fn sRGB(x:f32)->f32{ return pow(x,0.4545); }
  fn Uncharted2Tonemap(x:vec3f) -> vec3f {
    let A=0.15; let B=0.50; let C=0.10; let D=0.20; let E=0.02; let F=0.30;
    return ((x*(A*x+C*B)+D*E)/(x*(A*x+B)+D*F))-E/F;
  }
  fn applyFog(color:vec3f, depth:f32, fogCol:vec3f, fogDist:vec2f)->vec3f{
    let kv = saturate((depth-fogDist.x)/(fogDist.y-fogDist.x));
    return mix(color, fogCol, kv);
  }
  struct FragIn { @location(0) wpos:vec3f; @location(1) norm:vec3f;
                  @location(2) colorA:vec4f; @location(3) colorB:vec4f; @location(4) faceId: f32 };
  @fragment
  fn main(frag:FragIn)->@location(0) vec4f {
    let camDir=normalize(frag.wpos-U.camPos);
    let N=normalize(frag.norm);
    let base=frag.colorA.xyz;
    let by=floor(frag.wpos.y-0.22);
    let matId=i32(frag.faceId+0.5);
    // Water/lava animate
    var color=base;
    var emit=frag.colorA.w;
    let opac=frag.colorB.w;
    let smooth=frag.colorB.x;
    let reflect=frag.colorB.y;
    let sun=dot(N,-U.sunDir)*0.58+0.42;
    // Add sun directional, + ambient, + emissive
    let diffuse=sun*U.sunCol + vec3f(0.23,0.28,0.22);
    var final= color*diffuse + color*0.18;
    // Glowing: torch/window/lava/flag
    if(matId==14||matId==17||matId==12||matId==15)final+=emit*color*0.54;
    // Water reflect: rippling highlight
    if(matId==4) {
      let t=U.time*0.47 +frag.wpos.x*0.09+frag.wpos.z*0.13;
      final+=vec3f(0.07,0.19,0.29)*(saturate(sin(t))*0.22+0.13);
      final=mix(final,vec3f(0.42,0.68,0.98),0.05+saturate(0.25*N.y));
    }
    // Lava glow/flicker
    if(matId==12)
      final+=vec3f(0.9,0.25,0.08)*abs(sin(U.time*1.2+frag.wpos.x*0.5))*0.34;
    // Torch/Fire flicker
    if(matId==14)
      final+=vec3f(1,0.6,0.15)*saturate(sin(U.time*5.1+frag.wpos.y*0.6))*0.35;
    // Flag waving
    if(matId==15||matId==24)
      final=mix(final, vec3f(0.86,0.19,0.16), (sin(frag.wpos.y+U.time*2.1+frag.wpos.x*0.5)*0.14+0.14));
    // Snow shimmer
    if(matId==13)
      final=mix(final,vec3f(1,1,1),(sin(frag.wpos.y+U.time*1.2)*0.08+0.08));
    // Glass/Window for bloom
    if(matId==9 || matId==17)
      final+=vec3f(0.96,0.88,0.66)*emit*0.31;
    // Iron/Roof slight metalness
    if(matId==21||matId==22)
      final+=vec3f(0.42,0.38,0.24)*(dot(N,U.sunDir)*0.15+0.2);
    // Fog vertical variation
    let fogColor = U.fog.xyz + vec3f(0,0.05*sin(frag.wpos.x*0.07+U.time),0.06*sin(frag.wpos.z*0.06));
    var depth=length(frag.wpos-U.camPos);
    // Voxel vignette for distant/fog
    if(U.effectFlags&1u==1u) final=applyFog(final,depth,fogColor,vec2f(U.fog.w*.7,U.fog.w));
    // Gamma, mild tone map to prevent blown-out bloom
    final=sRGB(Uncharted2Tonemap(final*0.93)*0.98);
    // Final alpha
    let alpha = (matId==4||matId==9||matId==17)?0.89:1.0;
    return vec4f(final,alpha*opac);
  }`;

  renderPipeline = device.createRenderPipeline({
    layout:"auto",
    vertex: { module: device.createShaderModule({code:vshader}),
      buffers:[
        {arrayStride:13*4,attributes:[
          {shaderLocation:0,offset:0,format:"float32x3"},
          {shaderLocation:1,offset:3*4,format:"float32x3"},
          {shaderLocation:2,offset:6*4,format:"float32x4"},
          {shaderLocation:3,offset:10*4,format:"float32x3"},
          {shaderLocation:4,offset:13*4-4,format:"float32"},
        ]}
      ]
    },
    fragment: { module: device.createShaderModule({code:fshader}),
      targets:[{format:passFormat}]
    },
    primitive: { topology:"triangle-list", cullMode:"back"},
    depthStencil: { format:'depth24plus', depthWriteEnabled:true, depthCompare:"less" }
  });

  // ---- Sky pipeline (full screen foggy gradient + clouds) ----
  const skyVert = `
  @vertex fn main(@builtin(vertex_index)i:u32)->@builtin(position) vec4f{
    var pos = array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(1,1),vec2f(-1,-1),vec2f(1,1),vec2f(-1,1));
    return vec4f(pos[i],0,1);
  }`;
  const skyFrag = `
  struct Uniforms { projView: mat4x4f, sunDir:vec3f, sunCol:vec3f, camPos:vec3f, fog:vec4f, time: f32, effectFlags:u32, _pad:f32 };
  @group(0) @binding(0) var<uniform> U: Uniforms;
  @fragment
  fn main(@builtin(position)pos:vec4f)->@location(0)vec4f{
    let y=pos.y/float(${RESY});
    let t = saturate((y-0.09)*0.95);
    let base = mix(U.fog.xyz,U.sunCol, t*0.65);
    // Animated clouds: sin/cos bands, moving across sky
    let cloud=0.21*sin(U.time*0.02+pos.x*0.008+pos.y*0.07)+
              0.11*cos(U.time*0.023+pos.x*0.015)+
              0.09*sin(pos.x*0.023+U.time*0.013-pos.y*0.035);
    let mist = saturate(0.13+cloud*0.33-t*0.6 );
    let sky=base+vec3f(mist*0.22,mist*0.17,0.22*mist);
    // Sun disk
    let sx = float(${RESX})/2.-float(${RESY})*U.sunDir.x*90.;
    let sy = float(${RESY})/2.-float(${RESY})*U.sunDir.y*90.;
    let r=sqrt(pow(pos.x-sx,2.)+pow(pos.y-sy,2.));
    if(r<56.0) sky=mix(sky,U.sunCol,0.4-pow(r/56.,1.6)*0.5);
    return vec4f(sky,1);
  }`;
  skyPipeline = device.createRenderPipeline({
    layout:"auto",
    vertex: {module:device.createShaderModule({code:skyVert})},
    fragment: {module:device.createShaderModule({code:skyFrag}),
      targets:[{format:passFormat}]},
    primitive:{topology:"triangle-list"}
  });

  // --- Post-processing/Bloom pipeline (optional) ---
  // Bloom tonemap: threshold + mild radial vignette
  const postVert = `
  @vertex fn main(@builtin(vertex_index)i:u32)->@builtin(position)vec4f
  {var pos=array<vec2f,6>(vec2f(-1,-1),vec2f(1,-1),vec2f(1,1),vec2f(-1,-1),vec2f(1,1),vec2f(-1,1));
  return vec4f(pos[i],0,1);}
  `;
  const postFrag = `
  @group(0) @binding(0) var img: texture_2d<f32>;
  @group(0) @binding(1) var frameSampler: sampler;
  struct Uniforms { projView: mat4x4f, sunDir:vec3f, sunCol:vec3f, camPos:vec3f, fog:vec4f, time: f32, effectFlags:u32, _pad:f32 };
  @group(0) @binding(2) var<uniform> U: Uniforms;
  fn sR(x:f32)->f32{return pow(x,0.4545);}
  @fragment
  fn main(@builtin(position)pos:vec4f)->@location(0)vec4f
  {
    let uv = pos.xy/vec2f(${RESX},${RESY});
    let col = textureSample(img, frameSampler, uv).rgb;
    var bloom=vec3<f32>(0);
    // Sample for bloom
    for(var dx:i32=-2;dx<=2;dx++)
      for(var dy:i32=-2;dy<=2;dy++)
      {
        let offs=vec2f(dx,dy)*0.0033;
        let b=textureSample(img,frameSampler,uv+offs).rgb;
        if(length(b)>0.92) bloom+=b*0.31;
      }
    // Final color: color + light-bloom, tone mapped, vignette
    var rgb=col+0.27*bloom;
    let v=saturate(0.96-length(uv*2.0-1.0)*0.74);
    rgb=mix(rgb,0.12*rgb,1.0-v);
    return vec4f(sR(rgb.r), sR(rgb.g), sR(rgb.b),1);
  }`;
  // Target: postTexture
  postTexture = device.createTexture({
    size:[RESX,RESY],
    format:passFormat,
    usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING
  });
  postView = postTexture.createView();
  postPipeline = device.createRenderPipeline({
    layout:"auto",
    vertex:{module:device.createShaderModule({code:postVert})},
    fragment:{module:device.createShaderModule({code:postFrag}),
      targets:[{format:passFormat}]},
    primitive:{topology:"triangle-list"},
  });
  // Post bind group will be rebuilt every frame for new sky/post textures
  updateBindGroups();
}

// (Re-)setup uniform and post-process bind groups
function updateBindGroups() {
  worldBindGroup = device.createBindGroup({
    layout:renderPipeline.getBindGroupLayout(0),
    entries: [
      {binding:0, resource:{buffer:uniformBuffer}},
      {binding:1, resource:{buffer:matBuffer}},
    ]
  });
  postBindGroup = device.createBindGroup({
    layout:postPipeline.getBindGroupLayout(0),
    entries:[
      {binding:0,resource:postView},
      {binding:1,resource:frameSampler},
      {binding:2,resource:{buffer:uniformBuffer}},
    ]
  });
}

// ========== CAMERA, VIEW MATRIX =============

// LookAt/type helpers
function normalize(v){ let d=Math.hypot(...v); return v.map(a=>a/d);}
function cross(a,b){ return [
    a[1]*b[2]-a[2]*b[1],
    a[2]*b[0]-a[0]*b[2],
    a[0]*b[1]-a[1]*b[0]
];}
function sub(a,b){ return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function add(a,b){ return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function mul(a,s){ return [a[0]*s,a[1]*s,a[2]*s]; }
// Matrix4: lookAt
function mat4LookAt(eye, center, up) {
  let f = normalize(sub(center, eye));
  let r = normalize(cross(f, up));
  let u = cross(r, f);
  let m = Array(16).fill(0);
  m[0]=r[0];m[1]=u[0];m[2]=-f[0];
  m[4]=r[1];m[5]=u[1];m[6]=-f[1];
  m[8]=r[2];m[9]=u[2];m[10]=-f[2];
  m[12]=-(r[0]*eye[0]+r[1]*eye[1]+r[2]*eye[2]);
  m[13]=-(u[0]*eye[0]+u[1]*eye[1]+u[2]*eye[2]);
  m[14]=f[0]*eye[0] + f[1]*eye[1] + f[2]*eye[2];
  m[15]=1;
  return m;
}
// Perspective matrix
function mat4PerspectiveY(fovy, aspect, near, far) {
  let f = 1.0 / Math.tan(fovy / 2), nf=1/(near-far), out=Array(16).fill(0);
  out[0]=f/aspect;
  out[5]=f;
  out[10]=(far+near)*nf;
  out[11]=-1;
  out[14]=2*far*near*nf;
  return out;
}

// Apply new sun/fog state
function setSun(i) {
  sunState=i;
  let btns=['btnDawn','btnDay','btnDusk','btnNight'];
  btns.forEach((b,j)=>document.getElementById(b).className = j==i?'selected':'');
}

// ========== MAIN RENDER LOOP ============

let timePrev=performance.now(), frameCount=0, lastPerf=0;
async function mainLoop(now) {
  frameCount++; now/=1000;
  const dt = now-timePrev;
  timePrev=now;

  // --- CAMERA UPDATE ---
  let move= [0,0,0];
  let speed = (input.k.shift?2.5:1)*(input.k['alt']?0.19:1);
  // Cinematic orbit mode!
  if(camera.orbit) {
    camera.orbitA+=dt*0.17;
    camera.rot[1]=camera.orbitA;
    camera.rot[0]=-0.18-Math.cos(now*0.12)*0.04;
    camera.orbitY=35+Math.sin(now*0.16)*2.4;
    camera.pos[0]=44+Math.cos(camera.orbitA)*camera.orbitR;
    camera.pos[1]=camera.orbitY-2+Math.abs(Math.sin(camera.orbitA*0.86))*8.9;
    camera.pos[2]=44+Math.sin(camera.orbitA)*camera.orbitR;
  } else {
    if(input.k.w) move[2]-=1;
    if(input.k.s) move[2]+=1;
    if(input.k.a) move[0]-=1;
    if(input.k.d) move[0]+=1;
    if(input.k[' ']) move[1]+=1;
    if(input.k.control) move[1]-=1;
    let ang = camera.rot[1];
    let f = [Math.sin(ang),0,Math.cos(ang)];
    let r = [Math.cos(ang),0,-Math.sin(ang)];
    let mv = [r[0]*move[0]+f[0]*move[2],move[1], r[2]*move[0]+f[2]*move[2]];
    let norm = Math.hypot(...mv);
    // Norm for diagonal speed
    if(norm>0.01) {
      camera.pos = add(camera.pos, mul(mv, dt*camera.speed*speed/norm));
      // Clamp camera in scene! (else crashes)
      camera.pos[0]=Math.max(6,Math.min(WORLD_SIZE[0]-6,camera.pos[0]));
      camera.pos[1]=Math.max(4,Math.min(WORLD_SIZE[1]-4,camera.pos[1]));
      camera.pos[2]=Math.max(6,Math.min(WORLD_SIZE[2]-6,camera.pos[2]));
    }
  }

  // --- UPDATE UNIFORM BUFFER ---
  // Build camera matrices (persp, then lookAt)
  let proj = mat4PerspectiveY( 1.09, RESX/RESY, 0.63, 140 );
  let pitch=camera.rot[0], yaw=camera.rot[1];
  let up=[0,1,0];
  let dir=[Math.sin(yaw)*Math.cos(pitch), -Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch)];
  let center=add(camera.pos,dir);
  let view = mat4LookAt(camera.pos, center, up);
  let projView = new Float32Array(16);
  for(let i=0;i<16;++i)projView[i]=proj[i];
  for(let i=0;i<16;++i)projView[i]=proj[i];
  // Turn proj*view into a single mat4 (on CPU multiply for demo simplicity)
  let pv = new Float32Array(16).fill(0);
  for(let i=0;i<4;++i)
    for(let j=0;j<4;++j)
      for(let k=0;k<4;++k)
        pv[i*4+j] += proj[i*4+k]*view[k*4+j];
  let sun = SUNS[sunState];
  let fogCol = sun.fog, fogDist = [30,75+sun.pow*55];
  let camWpos = camera.pos;
  let flags = (input.fog?1:0)|(input.bloom?2:0);
  let uniforms = new Float32Array(32);
  for(let i=0;i<16;i++) uniforms[i]=pv[i];
  uniforms.set([...sun.dir, ...sun.col, ...camWpos, ...fogCol, fogDist[1]], 16);
  uniforms[27]=now; uniforms[28]=flags;

  device.queue.writeBuffer(uniformBuffer,0,uniforms);

  // ----------- SKY PASS -----------
  let skyColorPass = {
    colorAttachments:[{
      view:postView,
      clearValue:{r:sun.sky[0],g:sun.sky[1],b:sun.sky[2],a:1},
      loadOp:'clear',storeOp:'store'
    }]
  };
  let enc=device.createCommandEncoder();
  let pass=enc.beginRenderPass(skyColorPass);
  pass.setPipeline(skyPipeline);
  pass.setBindGroup(0,worldBindGroup);
  pass.draw(6,1);
  pass.end();

  // ----------- MAIN SCENE PASS ------------
  // Render each chunk
  let scenePass = {
    colorAttachments:[{
      view:postView,
      loadOp:'load',storeOp:'store'
    }],
    depthStencilAttachment: {
      view: depthView = (depthView||device.createTexture({size:[RESX,RESY],format:"depth24plus",usage:GPUTextureUsage.RENDER_ATTACHMENT})).createView(),
      depthClearValue: 1.0, depthLoadOp:'clear', depthStoreOp:'store'
    }
  };
  let pass2=enc.beginRenderPass(scenePass);
  pass2.setPipeline(renderPipeline);
  pass2.setBindGroup(0, worldBindGroup);
  chunkBuffers.forEach((cb)=>{
    pass2.setVertexBuffer(0,cb.vb);
    pass2.setIndexBuffer(cb.ib,"uint32");
    pass2.drawIndexed(cb.len,1);
  });
  pass2.end();

  // ----------- POST/BLOOM/VIGNETTE PASS (optional) ------------
  let finalPass = {
    colorAttachments:[{
      view: context.getCurrentTexture().createView(),
      clearValue:{r:sun.sky[0],g:sun.sky[1],b:sun.sky[2],a:1},
      loadOp:'clear',storeOp:'store'
    }]
  };
  let lastpass = enc.beginRenderPass(finalPass);
  if(input.bloom)
    lastpass.setPipeline(postPipeline), lastpass.setBindGroup(0,postBindGroup), lastpass.draw(6,1);
  else // fallback: copy post buffer
    lastpass.setPipeline(skyPipeline), lastpass.setBindGroup(0,worldBindGroup), lastpass.draw(6,1);
  lastpass.end();

  device.queue.submit([enc.finish()]);

  // ------ PERF / UI update ------
  if(frameCount%14==0) {
    lastPerf = Math.round(1/dt);
    document.getElementById("perf").innerText = lastPerf+" FPS";
  }

  requestAnimationFrame(mainLoop);
}

// =====  INIT: Build world, load to GPU, start mainLoop  =====

setupInput();
setSun(1);//default: day
buildWorld();
buildChunks();
await initWebGPU();
uploadChunks();
requestAnimationFrame(mainLoop);

</script>
