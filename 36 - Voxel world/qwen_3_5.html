<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Fantasy Voxel World - WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        #canvas { 
            width: 100vw; 
            height: 100vh; 
            display: block;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }
        #ui h1 {
            font-size: 24px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f4a460, #8b4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
            max-width: 300px;
        }
        #timeControls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .timeBtn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            pointer-events: auto;
        }
        .timeBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .timeBtn.active {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        #modeControls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .modeBtn {
            padding: 10px 15px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }
        #loading h2 {
            font-size: 32px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f4a460, #8b4513);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #f4a460;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #fps {
            position: fixed;
            top: 70px;
            left: 20px;
            color: #0f0;
            font-family: monospace;
            font-size: 14px;
            z-index: 100;
        }
    </style>
</head>

    <div id="loading">
        <h2>🏰 Medieval Fantasy World</h2>
        <div class="spinner"></div>
        <p style="margin-top: 20px;">Initializing WebGPU...</p>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="ui">

        <p>WebGPU Powered | Pure JavaScript</p>
    </div>
    
    <div id="fps">FPS: 0</div>
    
    <div id="timeControls">

        <button class="timeBtn" data-time="day">☀️ Day</button>
        <button class="timeBtn" data-time="dusk">🌇 Dusk</button>
        <button class="timeBtn" data-time="night">🌙 Night</button>
    </div>
    
    <div id="modeControls">

        <button class="modeBtn" data-mode="walk">🚶 Walk</button>

    </div>

        WASD - Move<br>
        Mouse - Look<br>
        Shift - Sprint<br>
        Space - Up/Fly<br>

        Scroll - Zoom (Orbit)<br>
        Click - Lock Mouse<br>
        ESC - Unlock Mouse<br>
        1-4 - Time of Day<br>

            async init() {
                if (!navigator.gpu) {
                    alert('WebGPU not supported in this browser. Please use Chrome 113+ or Edge 113+');
                    return false;
                }
                
                const adapter = await navigator.gpu.requestAdapter();
                if (!adapter) {
                    alert('No appropriate GPU adapter found');
                    return false;
                }
                
                this.device = await adapter.requestDevice();
                this.context = this.canvas.getContext('webgpu');
                
                const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
                this.context.configure({
                    device: this.device,
                    format: presentationFormat,
                    alphaMode: 'premultiplied',
                });
                
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                
                this.setupPipeline();
                this.setupInput();
                this.generateWorld();
                
                document.getElementById('loading').style.display = 'none';
                
                this.animate();
                return true;
            }
            
            setupPipeline() {
                const shaderCode = `
                    struct Uniforms {
                        modelViewProjectionMatrix: mat4x4<f32>,
                        cameraPosition: vec3<f32>,
                        time: f32,
                        timeOfDay: f32,
                        padding: vec3<f32>,
                    };
                    
                    @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                    
                    struct VertexInput {
                        @location(0) position: vec3<f32>,
                        @location(1) normal: vec3<f32>,
                        @location(2) color: vec4<f32>,
                    };
                    
                    struct VertexOutput {
                        @builtin(position) position: vec4<f32>,
                        @location(0) color: vec4<f32>,
                        @location(1) worldPosition: vec3<f32>,
                        @location(2) normal: vec3<f32>,
                    };
                    
                    @vertex
                    fn vertexMain(@builtin(vertex_index) vertexIndex: u32,
                                  input: VertexInput) -> VertexOutput {
                        var output: VertexOutput;
                        output.position = uniforms.modelViewProjectionMatrix * vec4<f32>(input.position, 1.0);
                        output.color = input.color;
                        output.worldPosition = input.position;
                        output.normal = input.normal;
                        return output;
                    }
                    
                    @fragment
                    fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
                        var color = input.color;
                        
                        // Simple lighting
                        let lightDir = normalize(vec3<f32>(0.5, 1.0, 0.3));
                        let lightIntensity = max(dot(input.normal, lightDir), 0.3);
                        
                        // Time of day adjustment
                        let timeFactor = 0.5 + 0.5 * sin(uniforms.time * 0.1 + uniforms.timeOfDay);
                        color.rgb *= lightIntensity * timeFactor;
                        
                        // Fog
                        let dist = length(input.worldPosition - uniforms.cameraPosition);
                        let fogFactor = 1.0 - exp(-dist * 0.005);
                        let fogColor = vec3<f32>(0.6, 0.7, 0.8);
                        color.rgb = mix(color.rgb, fogColor, fogFactor * 0.5);
                        
                        return color;
                    }
                `;
                
                const shaderModule = this.device.createShaderModule({
                    code: shaderCode,
                });
                
                this.pipeline = this.device.createRenderPipeline({
                    layout: 'auto',
                    vertex: {
                        module: shaderModule,
                        entryPoint: 'vertexMain',
                        buffers: [{
                            arrayStride: 32,
                            attributes: [
                                { shaderLocation: 0, offset: 0, format: 'float32x3' },
                                { shaderLocation: 1, offset: 12, format: 'float32x3' },
                                { shaderLocation: 2, offset: 24, format: 'float32x4' },
                            ],
                        }],
                    },
                    fragment: {
                        module: shaderModule,
                        entryPoint: 'fragmentMain',
                        targets: [{
                            format: navigator.gpu.getPreferredCanvasFormat(),
                            blend: {
                                color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' },
                                alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' },
                            },
                        }],
                    },
                    primitive: {
                        topology: 'triangle-list',
                        cullMode: 'back',
                    },
                    depthStencil: {
                        depthWriteEnabled: true,
                        depthCompare: 'less',
                        format: 'depth24plus',
                    },
                });
                
                // Create uniform buffer
                this.uniformBuffer = this.device.createBuffer({
                    size: 64,
                    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
                });
                
                this.bindGroup = this.device.createBindGroup({
                    layout: this.pipeline.getBindGroupLayout(0),
                    entries: [{
                        binding: 0,
                        resource: { buffer: this.uniformBuffer },
                    }],
                });
                
                // Create depth texture
                this.depthTexture = this.device.createTexture({
                    size: [this.canvas.width, this.canvas.height],
                    format: 'depth24plus',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT,
                });
            }
            
            setupInput() {
                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                    if (e.code === 'Digit1') this.setTimeOfDay('dawn');
                    if (e.code === 'Digit2') this.setTimeOfDay('day');
                    if (e.code === 'Digit3') this.setTimeOfDay('dusk');
                    if (e.code === 'Digit4') this.setTimeOfDay('night');
                    if (e.code === 'KeyF') this.toggleCameraMode();
                });
                
                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
                
                window.addEventListener('mousemove', (e) => {
                    if (this.mouse.locked) {
                        this.camera.rotation.y += e.movementX * 0.002;
                        this.camera.rotation.x += e.movementY * 0.002;
                        this.camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.camera.rotation.x));
                        
                        if (this.camera.mode === 'orbit') {
                            this.camera.orbitHorizontal += e.movementX * 0.002;
                            this.camera.orbitVertical += e.movementY * 0.002;
                            this.camera.orbitVertical = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.camera.orbitVertical));
                        }
                    }
                });
                
                this.canvas.addEventListener('click', () => {
                    this.canvas.requestPointerLock();
                });
                
                document.addEventListener('pointerlockchange', () => {
                    this.mouse.locked = document.pointerLockElement === this.canvas;
                });
                
                window.addEventListener('wheel', (e) => {
                    if (this.camera.mode === 'orbit') {
                        this.camera.orbitDistance += e.deltaY * 0.1;
                        this.camera.orbitDistance = Math.max(20, Math.min(300, this.camera.orbitDistance));
                    }
                });
                
                // Time buttons
                document.querySelectorAll('.timeBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.timeBtn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.setTimeOfDay(btn.dataset.time);
                    });
                });
                
                // Mode buttons
                document.querySelectorAll('.modeBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.camera.mode = btn.dataset.mode;
                        if (btn.dataset.mode === 'screenshot') {
                            this.takeScreenshot();
                        }
                    });
                });
                
                window.addEventListener('resize', () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                    this.depthTexture = this.device.createTexture({
                        size: [this.canvas.width, this.canvas.height],
                        format: 'depth24plus',
                        usage: GPUTextureUsage.RENDER_ATTACHMENT,
                    });
                });
            }
            
            setTimeOfDay(time) {
                this.timeOfDay = time;
                const times = { dawn: 0.2, day: 0.8, dusk: 0.5, night: 0.1 };
                document.querySelectorAll('.timeBtn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.time === time);
                });
            }
            
            toggleCameraMode() {
                this.camera.mode = this.camera.mode === 'fly' ? 'walk' : 'fly';
            }
            
            takeScreenshot() {
                // Screenshot functionality would go here
                console.log('Screenshot mode activated');
            }
            
            generateWorld() {
                // Generate chunks around the center
                for (let x = -this.renderDistance; x <= this.renderDistance; x++) {
                    for (let z = -this.renderDistance; z <= this.renderDistance; z++) {
                        this.generateChunk(x, z);
                    }
                }
            }
            
            generateChunk(chunkX, chunkZ) {
                const key = `${chunkX},${chunkZ}`;
                const chunkData = new Uint8Array(this.chunkSize * 256 * this.chunkSize);
                
                // Simple terrain generation with noise-like patterns
                for (let x = 0; x < this.chunkSize; x++) {
                    for (let z = 0; z < this.chunkSize; z++) {
                        const worldX = chunkX * this.chunkSize + x;
                        const worldZ = chunkZ * this.chunkSize + z;
                        
                        // Height map using simple math functions
                        const height = this.getHeight(worldX, worldZ);
                        
                        for (let y = 0; y < 256; y++) {
                            const index = x + y * this.chunkSize + z * this.chunkSize * 256;
                            
                            if (y > height) {
                                chunkData[index] = 0; // air
                            } else if (y === height) {
                                chunkData[index] = 1; // grass
                            } else if (y > height - 4) {
                                chunkData[index] = 2; // dirt
                            } else {
                                chunkData[index] = 3; // stone
                            }
                        }
                    }
                }
                
                // Add castle on central chunk
                if (chunkX === 0 && chunkZ === 0) {
                    this.addCastle(chunkData, chunkX, chunkZ);
                }
                
                // Add village on nearby chunks
                if (chunkX === 1 && chunkZ === 0) {
                    this.addVillage(chunkData, chunkX, chunkZ);
                }
                
                // Add volcano on distant chunk
                if (chunkX === -3 && chunkZ === -3) {
                    this.addVolcano(chunkData, chunkX, chunkZ);
                }
                
                this.chunks.set(key, chunkData);
                this.buildChunkMesh(chunkX, chunkZ, chunkData);
            }
            
            getHeight(x, z) {
                // Simple height function using sine waves
                const baseHeight = 40;
                const hill1 = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 20;
                const hill2 = Math.sin(x * 0.02 + z * 0.03) * 15;
                const hill3 = Math.cos(x * 0.01 - z * 0.04) * 10;
                
                let height = baseHeight + hill1 + hill2 + hill3;
                
                // Add river
                const riverDist = Math.abs(Math.sin(x * 0.03) * 50 - z);
                if (riverDist < 15) {
                    height = Math.min(height, 35 - riverDist * 0.5);
                }
                
                // Add volcano area
                const volcanoDist = Math.sqrt((x + 150) ** 2 + (z + 150) ** 2);
                if (volcanoDist < 50) {
                    height += (50 - volcanoDist) * 0.8;
                }
                
                return Math.floor(height);
            }
            
            addCastle(chunkData, chunkX, chunkZ) {
                const baseX = 8;
                const baseZ = 8;
                const baseHeight = this.getHeight(chunkX * this.chunkSize + baseX, chunkZ * this.chunkSize + baseZ);
                
                // Castle walls
                for (let x = 0; x < 16; x++) {
                    for (let z = 0; z < 16; z++) {
                        for (let y = 0; y < 8; y++) {
                            if (x === 0 || x === 15 || z === 0 || z === 15) {
                                const index = x + (baseHeight + y) * this.chunkSize + z * this.chunkSize * 256;
                                if (index < chunkData.length) {
                                    chunkData[index] = 25; // castle_wall
                                }
                            }
                        }
                    }
                }
                
                // Towers at corners
                const towers = [[0, 0], [15, 0], [0, 15], [15, 15]];
                for (const [tx, tz] of towers) {
                    for (let y = 0; y < 15; y++) {
                        for (let dx = -1; dx <= 1; dx++) {
                            for (let dz = -1; dz <= 1; dz++) {
                                const index = (tx + dx) + (baseHeight + y) * this.chunkSize + (tz + dz) * this.chunkSize * 256;
                                if (index >= 0 && index < chunkData.length) {
                                    chunkData[index] = 25;
                                }
                            }
                        }
                    }
                }
                
                // Keep in center
                for (let x = 5; x < 11; x++) {
                    for (let z = 5; z < 11; z++) {
                        for (let y = 0; y < 12; y++) {
                            const index = x + (baseHeight + y) * this.chunkSize + z * this.chunkSize * 256;
                            if (index < chunkData.length) {
                                chunkData[index] = (x === 5 || x === 10 || z === 5 || z === 10) ? 25 : 26;
                            }
                        }
                    }
                }
            }
            
            addVillage(chunkData, chunkX, chunkZ) {
                const baseHeight = 35;
                
                // Add several houses
                const houses = [
                    { x: 3, z: 3 }, { x: 10, z: 3 }, { x: 3, z: 10 },
                    { x: 10, z: 10 }, { x: 7, z: 7 }, { x: 2, z: 8 },
                    { x: 12, z: 5 }, { x: 5, z: 12 }
                ];
                
                for (const house of houses) {
                    // House base
                    for (let x = 0; x < 4; x++) {
                        for (let z = 0; z < 4; z++) {
                            for (let y = 0; y < 3; y++) {
                                const index = (house.x + x) + (baseHeight + y) * this.chunkSize + (house.z + z) * this.chunkSize * 256;
                                if (index < chunkData.length) {
                                    chunkData[index] = (x === 0 || x === 3 || z === 0 || z === 3) ? 12 : 0;
                                }
                            }
                        }
                    }
                    
                    // Roof
                    for (let x = 0; x < 5; x++) {
                        for (let z = 0; z < 5; z++) {
                            const roofHeight = baseHeight + 3 + Math.min(x, 4 - x, z, 4 - z);
                            const index = (house.x + x - 1) + roofHeight * this.chunkSize + (house.z + z - 1) * this.chunkSize * 256;
                            if (index >= 0 && index < chunkData.length) {
                                chunkData[index] = 31;
                            }
                        }
                    }
                }
            }
            
            addVolcano(chunkData, chunkX, chunkZ) {
                const centerX = 8;
                const centerZ = 8;
                const baseHeight = 30;
                
                // Volcano cone
                for (let x = 0; x < 16; x++) {
                    for (let z = 0; z < 16; z++) {
                        const dist = Math.sqrt((x - centerX) ** 2 + (z - centerZ) ** 2);
                        const maxRadius = 7;
                        
                        if (dist < maxRadius) {
                            const height = Math.floor((maxRadius - dist) * 3);
                            for (let y = 0; y < height; y++) {
                                const index = x + (baseHeight + y) * this.chunkSize + z * this.chunkSize * 256;
                                if (index < chunkData.length) {
                                    chunkData[index] = y > height - 3 ? 9 : 145; // lava core, basalt exterior
                                }
                            }
                        }
                    }
                }
            }
            
            buildChunkMesh(chunkX, chunkZ, chunkData) {
                const positions = [];
                const normals = [];
                const colors = [];
                
                // Simple meshing - only create faces for exposed blocks
                for (let x = 0; x < this.chunkSize; x++) {
                    for (let y = 0; y < 256; y++) {
                        for (let z = 0; z < this.chunkSize; z++) {
                            const index = x + y * this.chunkSize + z * this.chunkSize * 256;
                            const block = chunkData[index];
                            
                            if (block === 0) continue; // skip air
                            
                            const worldX = chunkX * this.chunkSize + x;
                            const worldZ = chunkZ * this.chunkSize + z;
                            
                            // Check all 6 faces
                            const faces = [
                                { dir: [1, 0, 0], check: [x + 1, y, z] },
                                { dir: [-1, 0, 0], check: [x - 1, y, z] },
                                { dir: [0, 1, 0], check: [x, y + 1, z] },
                                { dir: [0, -1, 0], check: [x, y - 1, z] },
                                { dir: [0, 0, 1], check: [x, y, z + 1] },
                                { dir: [0, 0, -1], check: [x, y, z - 1] },
                            ];
                            
                            for (const face of faces) {
                                const [cx, cy, cz] = face.check;
                                let neighbor = 0;
                                
                                if (cx >= 0 && cx < this.chunkSize && 
                                    cy >= 0 && cy < 256 && 
                                    cz >= 0 && cz < this.chunkSize) {
                                    const nIndex = cx + cy * this.chunkSize + cz * this.chunkSize * 256;
                                    neighbor = chunkData[nIndex];
                                }
                                
                                if (neighbor === 0) {
                                    // Add face
                                    this.addFace(positions, normals, colors, 
                                        worldX, y, worldZ, face.dir, block);
                                }
                            }
                        }
                    }
                }
                
                if (positions.length > 0) {
                    const vertexData = new Float32Array(positions.length + normals.length + colors.length);
                    vertexData.set(positions, 0);
                    vertexData.set(normals, positions.length);
                    vertexData.set(colors, positions.length + normals.length);
                    
                    const vertexBuffer = this.device.createBuffer({
                        size: vertexData.byteLength,
                        usage: GPUBufferUsage.VERTEX,
                        mappedAtCreation: true,
                    });
                    new Float32Array(vertexBuffer.getMappedRange()).set(vertexData);
                    vertexBuffer.unmap();
                    
                    this.vertexBuffers.push({
                        buffer: vertexBuffer,
                        vertexCount: positions.length / 3,
                    });
                }
            }
            
            addFace(positions, normals, colors, x, y, z, dir, blockType) {
                const color = this.blockColors[blockType] || [1, 1, 1, 1];
                
                // Quad vertices
                const vertices = this.getFaceVertices(x, y, z, dir);
                
                for (const v of vertices) {
                    positions.push(v.x, v.y, v.z);
                    normals.push(dir[0], dir[1], dir[2]);
                    colors.push(...color);
                }
            }
            
            getFaceVertices(x, y, z, dir) {
                const vertices = [];
                
                if (dir[0] === 1) { // +X
                    vertices.push(
                        { x: x + 1, y: y, z: z },
                        { x: x + 1, y: y + 1, z: z },
                        { x: x + 1, y: y + 1, z: z + 1 },
                        { x: x + 1, y: y, z: z + 1 },
                    );
                } else if (dir[0] === -1) { // -X
                    vertices.push(
                        { x: x, y: y, z: z + 1 },
                        { x: x, y: y + 1, z: z + 1 },
                        { x: x, y: y + 1, z: z },
                        { x: x, y: y, z: z },
                    );
                } else if (dir[1] === 1) { // +Y
                    vertices.push(
                        { x: x, y: y + 1, z: z },
                        { x: x, y: y + 1, z: z + 1 },
                        { x: x + 1, y: y + 1, z: z + 1 },
                        { x: x + 1, y: y + 1, z: z },
                    );
                } else if (dir[1] === -1) { // -Y
                    vertices.push(
                        { x: x + 1, y: y, z: z },
                        { x: x + 1, y: y, z: z + 1 },
                        { x: x, y: y, z: z + 1 },
                        { x: x, y: y, z: z },
                    );
                } else if (dir[2] === 1) { // +Z
                    vertices.push(
                        { x: x, y: y, z: z + 1 },
                        { x: x + 1, y: y, z: z + 1 },
                        { x: x + 1, y: y + 1, z: z + 1 },
                        { x: x, y: y + 1, z: z + 1 },
                    );
                } else if (dir[2] === -1) { // -Z
                    vertices.push(
                        { x: x + 1, y: y, z: z },
                        { x: x, y: y, z: z },
                        { x: x, y: y + 1, z: z },
                        { x: x + 1, y: y + 1, z: z },
                    );
                }
                
                // Return as triangles
                return [
                    vertices[0], vertices[1], vertices[2],
                    vertices[0], vertices[2], vertices[3],
                ];
            }
            
            updateCamera(deltaTime) {
                const speed = this.keys['ShiftLeft'] ? 100 : 50;
                const moveSpeed = speed * deltaTime;
                
                if (this.camera.mode === 'orbit') {
                    // Update orbit camera
                    this.camera.position.x = this.camera.orbitTarget.x + 
                        Math.cos(this.camera.orbitHorizontal) * Math.cos(this.camera.orbitVertical) * this.camera.orbitDistance;
                    this.camera.position.y = this.camera.orbitTarget.y + 
                        Math.sin(this.camera.orbitVertical) * this.camera.orbitDistance;
                    this.camera.position.z = this.camera.orbitTarget.z + 
                        Math.sin(this.camera.orbitHorizontal) * Math.cos(this.camera.orbitVertical) * this.camera.orbitDistance;
                } else {
                    // Fly/Walk camera
                    const forward = {
                        x: -Math.sin(this.camera.rotation.y),
                        z: -Math.cos(this.camera.rotation.y),
                    };
                    const right = {
                        x: Math.cos(this.camera.rotation.y),
                        z: -Math.sin(this.camera.rotation.y),
                    };
                    
                    if (this.keys['KeyW']) {
                        this.camera.position.x += forward.x * moveSpeed;
                        this.camera.position.z += forward.z * moveSpeed;
                    }
                    if (this.keys['KeyS']) {
                        this.camera.position.x -= forward.x * moveSpeed;
                        this.camera.position.z -= forward.z * moveSpeed;
                    }
                    if (this.keys['KeyA']) {
                        this.camera.position.x -= right.x * moveSpeed;
                        this.camera.position.z -= right.z * moveSpeed;
                    }
                    if (this.keys['KeyD']) {
                        this.camera.position.x += right.x * moveSpeed;
                        this.camera.position.z += right.z * moveSpeed;
                    }
                    if (this.keys['Space'] || this.camera.mode === 'fly') {
                        this.camera.position.y += moveSpeed;
                    }
                    if (this.keys['ControlLeft']) {
                        this.camera.position.y -= moveSpeed;
                    }
                }
            }
            
            getProjectionMatrix() {
                const fov = Math.PI / 3;
                const aspect = this.canvas.width / this.canvas.height;
                const near = 0.1;
                const far = 1000;
                
                const f = 1.0 / Math.tan(fov / 2);
                const nf = 1 / (near - far);
                
                return new Float32Array([
                    f / aspect, 0, 0, 0,
                    0, f, 0, 0,
                    0, 0, (far + near) * nf, -1,
                    0, 0, 2 * far * near * nf, 0,
                ]);
            }
            
            getViewMatrix() {
                const eye = this.camera.position;
                const yaw = this.camera.rotation.y;
                const pitch = this.camera.rotation.x;
                
                const target = {
                    x: eye.x - Math.sin(yaw) * Math.cos(pitch),
                    y: eye.y + Math.sin(pitch),
                    z: eye.z - Math.cos(yaw) * Math.cos(pitch),
                };
                
                const f = this.normalize([target.x - eye.x, target.y - eye.y, target.z - eye.z]);
                const s = this.normalize(this.cross(f, [0, 1, 0]));
                const u = this.cross(s, f);
                
                return new Float32Array([
                    s[0], u[0], -f[0], 0,
                    s[1], u[1], -f[1], 0,
                    s[2], u[2], -f[2], 0,
                    -this.dot(s, eye), -this.dot(u, eye), this.dot(f, eye), 1,
                ]);
            }
            
            normalize(v) {
                const len = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
                return [v[0] / len, v[1] / len, v[2] / len];
            }
            
            cross(a, b) {
                return [
                    a[1] * b[2] - a[2] * b[1],
                    a[2] * b[0] - a[0] * b[2],
                    a[0] * b[1] - a[1] * b[0],
                ];
            }
            
            dot(a, b) {
                return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
            }
            
            multiplyMatrices(a, b) {
                const result = new Float32Array(16);
                for (let i = 0; i < 4; i++) {
                    for (let j = 0; j < 4; j++) {
                        result[i * 4 + j] = 0;
                        for (let k = 0; k < 4; k++) {
                            result[i * 4 + j] += a[i * 4 + k] * b[k * 4 + j];
                        }
                    }
                }
                return result;
            }
            
            animate() {
                const currentTime = performance.now();
                const deltaTime = (currentTime - this.lastTime) / 1000;
                this.lastTime = currentTime;
                
                // FPS counter
                this.frameCount++;
                if (currentTime - this.lastTime > 1000) {
                    this.fps = this.frameCount;
                    this.frameCount = 0;
                    this.lastTime = currentTime;
                    document.getElementById('fps').textContent = `FPS: ${this.fps}`;
                }
                
                this.updateCamera(deltaTime);
                this.time += deltaTime;
                
                // Update uniforms
                const viewMatrix = this.getViewMatrix();
                const projectionMatrix = this.getProjectionMatrix();
                const mvpMatrix = this.multiplyMatrices(projectionMatrix, viewMatrix);
                
                const timeOfDayValue = { dawn: 0.2, day: 0.8, dusk: 0.5, night: 0.1 }[this.timeOfDay];
                
                const uniformData = new Float32Array([
                    ...mvpMatrix,
                    this.camera.position.x, this.camera.position.y, this.camera.position.z,
                    this.time,
                    timeOfDayValue,
                    0, 0, 0,
                ]);
                
                this.device.queue.writeBuffer(this.uniformBuffer, 0, uniformData);
                
                // Render
                const commandEncoder = this.device.createCommandEncoder();
                const textureView = this.context.getCurrentTexture().createView();
                
                const renderPassDescriptor = {
                    colorAttachments: [{
                        view: textureView,
                        clearValue: { r: 0.4, g: 0.6, b: 0.8, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store',
                    }],
                    depthStencilAttachment: {
                        view: this.depthTexture.createView(),
                        depthClearValue: 1.0,
                        depthLoadOp: 'clear',
                        depthStoreOp: 'store',
                    },
                };
                
                const passEncoder = commandEncoder.beginRenderPass(renderPassDescriptor);
                passEncoder.setPipeline(this.pipeline);
                passEncoder.setBindGroup(0, this.bindGroup);
                
                for (const vertexBuffer of this.vertexBuffers) {
                    passEncoder.setVertexBuffer(0, vertexBuffer.buffer);
                    passEncoder.draw(vertexBuffer.vertexCount);
                }
                
                passEncoder.end();
                this.device.queue.submit([commandEncoder.finish()]);
                
                requestAnimationFrame(() => this.animate());
            }
        }
        
        // Initialize the world
        const world = new VoxelWorld();
        world.init();
    </script>
