<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel World</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    #canvas {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // Get the canvas element
    const canvas = document.getElementById('canvas');

    // Initialize WebGPU
    if (!navigator.gpu) {
      alert('WebGPU is not supported/enabled in your browser');
    }

    const adapter = await navigator.gpu.requestAdapter();
    const device = await adapter.requestDevice();

    // Create the WebGPU context
    const context = canvas.getContext('webgpu');
    const presentationFormat = navigator.gpu.getPreferredCanvasFormat();
    context.configure({
      device,
      format: presentationFormat,
      alphaMode: 'premultiplied'
    });

    // Define the vertex and fragment shaders
    const vertexShaderCode = `
      struct VertexInput {
        @location(0) position: vec4f,
        @location(1) color: vec4f,
      };

      struct VertexOutput {
        @builtin(position) position: vec4f,
        @location(0) color: vec4f,
      };

      @vertex
      fn vertex_main(input: VertexInput) -> VertexOutput {
        var output: VertexOutput;
        output.position = input.position;
        output.color = input.color;
        return output;
      }
    `;

    const fragmentShaderCode = `
      struct FragmentInput {
        @location(0) color: vec4f,
      };

      @fragment
      fn fragment_main(input: FragmentInput) -> @location(0) vec4f {
        return input.color;
      }
    `;

    // Create the shader modules
    const vertexShaderModule = device.createShaderModule({ code: vertexShaderCode });
    const fragmentShaderModule = device.createShaderModule({ code: fragmentShaderCode });

    // Create the pipeline
    const pipelineLayout = device.createPipelineLayout({ bindGroupLayouts: [] });
    const pipeline = device.createRenderPipeline({
      layout: pipelineLayout,
      vertex: {
        module: vertexShaderModule,
        entryPoint: 'vertex_main',
        buffers: [
          {
            arrayStride: 8 * 4,
            attributes: [
              { format: 'float32x4', offset: 0, shaderLocation: 0 },
              { format: 'float32x4', offset: 4 * 4, shaderLocation: 1 },
            ],
          },
        ],
      },
      fragment: {
        module: fragmentShaderModule,
        entryPoint: 'fragment_main',
        targets: [{ format: presentationFormat }],
      },
      primitive: {
        topology: 'triangle-list',
      },
      depthStencil: {
        format: 'depth24plus',
        depthWriteEnabled: true,
        depthCompare: 'less',
      },
    });

    // Create the voxel data
    const voxelData = new Uint8Array(16 * 16 * 16);
    for (let i = 0; i < voxelData.length; i++) {
      voxelData[i] = Math.random() < 0.5 ? 1 : 0;
    }

    // Create the vertex buffer
    const vertices = [];
    for (let x = 0; x < 16; x++) {
      for (let y = 0; y < 16; y++) {
        for (let z = 0; z < 16; z++) {
          if (voxelData[x + y * 16 + z * 16 * 16] === 1) {
            // Generate vertices for the voxel
            vertices.push(
              x, y, z, 1,
              1, 0, 0, 1,
              x + 1, y, z, 1,
              1, 0, 0, 1,
              x + 1, y + 1, z, 1,
              1, 0, 0, 1,
              x, y + 1, z, 1,
              1, 0, 0, 1,
              x, y, z + 1, 1,
              0, 1, 0, 1,
              x + 1, y, z + 1, 1,
              0, 1, 0, 1,
              x + 1, y + 1, z + 1, 1,
              0, 1, 0, 1,
              x, y + 1, z + 1, 1,
              0, 1, 0, 1,
            );
          }
        }
      }
    }

    const vertexBuffer = device.createBuffer({
      size: vertices.length * 4,
      usage: GPUBufferUsage.VERTEX,
      mappedAtCreation: true,
    });
    new Float32Array(vertexBuffer.getMappedRange()).set(vertices);
    vertexBuffer.unmap();

    // Create the depth texture
    const depthTexture = device.createTexture({
      size: [canvas.width, canvas.height, 1],
      format: 'depth24plus',
      usage: GPUTextureUsage.RENDER_ATTACHMENT,
    });

    // Main render loop
    function render() {
      const commandEncoder = device.createCommandEncoder();
      const textureView = context.getCurrentTexture().createView();
      const renderPassDescriptor = {
        colorAttachments: [
          {
            view: textureView,
            loadOp: 'clear',
            storeOp: 'store',
            clearValue: [0.0, 0.0, 0.0, 1.0],
          },
        ],
        depthStencilAttachment: {
          view: depthTexture.createView(),
          depthLoadOp: 'clear',
          depthStoreOp: 'store',
          depthClearValue: 1.0,
        },
      };

      const renderPass = commandEncoder.beginRenderPass(renderPassDescriptor);
      renderPass.setPipeline(pipeline);
      renderPass.setVertexBuffer(0, vertexBuffer);
      renderPass.draw(vertices.length / 8, 1, 0, 0);
      renderPass.end();

      device.queue.submit([commandEncoder.finish()]);
      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
