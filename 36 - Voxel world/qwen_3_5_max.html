                    view: postTexture.createView(),
                    clearValue: [0.1, 0.1, 0.15, 1.0],
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
                depthStencilAttachment: {
                    view: depthTexture.createView(),
                    depthClearValue: 1.0,
                    depthLoadOp: 'clear',
                    depthStoreOp: 'store',
                },
            });
            
            // Render terrain
            renderPass.setPipeline(pipeline);
            renderPass.setBindGroup(0, bindGroup);
            
            for (const [key, mesh] of meshes) {
                if (mesh.vertexBuffer && !key.startsWith('water')) {
                    renderPass.setVertexBuffer(0, mesh.vertexBuffer);
                    renderPass.setIndexBuffer(mesh.indexBuffer, 'uint32');
                    renderPass.drawIndexed(mesh.indexCount);
                }
            }
            
            // Render water
            renderPass.setPipeline(waterPipeline);
            if (meshes.has('water')) {
                const waterMesh = meshes.get('water');
                renderPass.setVertexBuffer(0, waterMesh.vertexBuffer);
                renderPass.setIndexBuffer(waterMesh.indexBuffer, 'uint32');
                renderPass.drawIndexed(waterMesh.indexCount);
            }
            
            renderPass.end();
            
            // Post-processing pass
            const postPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
                    view: context.getCurrentTexture().createView(),
                    clearValue: [0, 0, 0, 1],
                    loadOp: 'clear',
                    storeOp: 'store',
                }],
            });
            
            postPass.setPipeline(postPipeline);
            postPass.setBindGroup(0, postBindGroup);
            postPass.draw(3);
            
            postPass.end();
            
            device.queue.submit([commandEncoder.finish()]);
            
            requestAnimationFrame(render);
        }
        
        // ============================================
        // CAMERA & INPUT
        // ============================================
        
        function updateCamera(dt) {
            if (camera.mode === 'orbit') {
                const orbitTime = time / 1000 * CONFIG.ORBIT_SPEED;
                const angle = orbitTime + camera.rotation[2];
                camera.position[0] = 64 + Math.cos(angle) * CONFIG.ORBIT_RADIUS;
                camera.position[2] = 64 + Math.sin(angle) * CONFIG.ORBIT_RADIUS;
                camera.position[1] = 45 + Math.sin(orbitTime * 0.5) * 10;
                
                const targetX = 64 - camera.position[0];
                const targetZ = 64 - camera.position[2];
                const targetY = 30 - camera.position[1];
                const len = Math.sqrt(targetX**2 + targetY**2 + targetZ**2);
                camera.rotation = [targetX/len, targetY/len, targetZ/len];
                return;
            }
            
            const speed = camera.mode === 'walk' ? CONFIG.WALK_SPEED : camera.speed;
            let moveX = 0, moveY = 0, moveZ = 0;
            
            if (input.keys['KeyW']) { moveX += camera.rotation[0]; moveZ += camera.rotation[2]; }
            if (input.keys['KeyS']) { moveX -= camera.rotation[0]; moveZ -= camera.rotation[2]; }
            if (input.keys['KeyA']) { moveX += camera.rotation[2]; moveZ -= camera.rotation[0]; }
            if (input.keys['KeyD']) { moveX -= camera.rotation[2]; moveZ += camera.rotation[0]; }
            
            if (camera.mode === 'fly') {
                if (input.keys['Space']) moveY += 1;
                if (input.keys['ShiftLeft']) moveY -= 1;
            } else {
                // Walk mode - stay on ground
                const groundY = generateHeight(camera.position[0], camera.position[2]) + 2;
                camera.position[1] = groundY;
            }
            
            const moveLen = Math.sqrt(moveX**2 + moveY**2 + moveZ**2);
            if (moveLen > 0) {
                camera.position[0] += (moveX / moveLen) * speed * dt;
                camera.position[1] += (moveY / moveLen) * speed * dt;
                camera.position[2] += (moveZ / moveLen) * speed * dt;
            }
            
            // Clamp position
            camera.position[0] = Math.max(0, Math.min(CONFIG.WORLD_SIZE, camera.position[0]));
            camera.position[1] = Math.max(1, Math.min(CONFIG.WORLD_HEIGHT - 1, camera.position[1]));
            camera.position[2] = Math.max(0, Math.min(CONFIG.WORLD_SIZE, camera.position[2]));
        }
        
        function setupInput() {
            canvas.addEventListener('click', () => {
                if (!input.mouse.locked) {
                    canvas.requestPointerLock();
                }
            });
            
            document.addEventListener('pointerlockchange', () => {
                input.mouse.locked = document.pointerLockElement === canvas;
                document.getElementById('crosshair').classList.toggle('hidden', !input.mouse.locked);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (input.mouse.locked && camera.mode !== 'orbit') {
                    camera.rotation[2] += e.movementX * CONFIG.MOUSE_SENSITIVITY;
                    camera.rotation[1] -= e.movementY * CONFIG.MOUSE_SENSITIVITY;
                    camera.rotation[1] = Math.max(-1.5, Math.min(1.5, camera.rotation[1]));
                    
                    const horizLen = Math.cos(camera.rotation[1]);
                    camera.rotation[0] = Math.sin(camera.rotation[2]) * horizLen;
                    camera.rotation[2] = Math.cos(camera.rotation[2]) * horizLen;
                }
            });
            
            document.addEventListener('keydown', (e) => {
                input.keys[e.code] = true;
                
                // Time shortcuts
                if (e.code === 'Digit1') setTimeOfDay('dawn');
                if (e.code === 'Digit2') setTimeOfDay('day');
                if (e.code === 'Digit3') setTimeOfDay('dusk');
                if (e.code === 'Digit4') setTimeOfDay('night');
                
                // Mode shortcuts
                if (e.code === 'KeyF') setCameraMode('fly');
                if (e.code === 'KeyG') setCameraMode('orbit');
                if (e.code === 'KeyH') setCameraMode('walk');
                
                // Screenshot
                if (e.code === 'KeyP') takeScreenshot();
            });
            
            document.addEventListener('keyup', (e) => {
                input.keys[e.code] = false;
            });
            
            // UI buttons
            document.querySelectorAll('[data-time]').forEach(btn => {
                btn.addEventListener('click', () => setTimeOfDay(btn.dataset.time));
            });
            
            document.querySelectorAll('[data-mode]').forEach(btn => {
                btn.addEventListener('click', () => setCameraMode(btn.dataset.mode));
            });
            
            document.getElementById('bloom').addEventListener('change', (e) => {
                settings.bloom = e.target.checked;
            });
            
            document.getElementById('shadows').addEventListener('change', (e) => {
                settings.shadows = e.target.checked;
            });
            
            document.getElementById('fog').addEventListener('change', (e) => {
                settings.fog = e.target.checked;
            });
            
            document.getElementById('vignette').addEventListener('change', (e) => {
                settings.vignette = e.target.checked;
            });
            
            document.getElementById('particles').addEventListener('change', (e) => {
                settings.particles = e.target.checked;
            });
            
            document.getElementById('screenshot-btn').addEventListener('click', takeScreenshot);
        }
        
        function setTimeOfDay(time) {
            settings.timeOfDay = time;
            document.querySelectorAll('[data-time]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.time === time);
            });
        }
        
        function setCameraMode(mode) {
            camera.mode = mode;
            document.querySelectorAll('[data-mode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            document.getElementById('mode').textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
            document.getElementById('crosshair').classList.toggle('hidden', mode === 'orbit');
        }
        
        function takeScreenshot() {
            settings.screenshotMode = true;
            
            // Hide UI
            document.getElementById('ui').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('help').style.display = 'none';
            document.getElementById('crosshair').classList.add('hidden');
            
            setTimeout(() => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    document.getElementById('screenshot-preview').src = url;
                    document.getElementById('screenshot-overlay').classList.add('show');
                    
                    // Download
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `medieval-world-${Date.now()}.png`;
                    a.click();
                    
                    // Restore UI
                    setTimeout(() => {
                        document.getElementById('ui').style.display = '';
                        document.getElementById('stats').style.display = '';
                        document.getElementById('help').style.display = '';
                    }, 100);
                });
                
                settings.screenshotMode = false;
            }, 100);
        }
        
        document.getElementById('screenshot-overlay').addEventListener('click', () => {
            document.getElementById('screenshot-overlay').classList.remove('show');
        });
        
        // ============================================
        // MATH UTILITIES
        // ============================================
        
        function mat4Perspective(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const nf = 1 / (near - far);
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (far + near) * nf, -1,
                0, 0, 2 * far * near * nf, 0,
            ]);
        }
        
        function mat4LookAt(eye, center, up) {
            const z = normalize([eye[0] - center[0], eye[1] - center[1], eye[2] - center[2]]);
            const x = normalize(cross(up, z));
            const y = cross(z, x);
            
            return new Float32Array([
                x[0], y[0], z[0], 0,
                x[1], y[1], z[1], 0,
                x[2], y[2], z[2], 0,
                -dot(x, eye), -dot(y, eye), -dot(z, eye), 1,
            ]);
        }
        
        function mat4Multiply(a, b) {
            const result = new Float32Array(16);
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    result[i * 4 + j] = 
                        a[i * 4] * b[j] +
                        a[i * 4 + 1] * b[4 + j] +
                        a[i * 4 + 2] * b[8 + j] +
                        a[i * 4 + 3] * b[12 + j];
                }
            }
            return result;
        }
        
        function normalize(v) {
            const len = Math.sqrt(v[0]**2 + v[1]**2 + v[2]**2);
            return len > 0 ? [v[0]/len, v[1]/len, v[2]/len] : [0, 0, 0];
        }
        
        function cross(a, b) {
            return [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0],
            ];
        }
        
        function dot(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }
        
        // ============================================
        // LOADING & INIT
        // ============================================
        
        function updateLoading(progress, text) {
            document.getElementById('loading-progress').style.width = progress + '%';
            document.getElementById('loading-text').textContent = text;
        }
        
        async function init() {
            try {
                await initWebGPU();
                
                generateWorld();
                
                // Generate meshes
                let chunkCount = 0;
                const totalChunks = Math.ceil(CONFIG.WORLD_SIZE / CONFIG.CHUNK_SIZE) ** 2;
                
                for (let cx = 0; cx < CONFIG.WORLD_SIZE; cx += CONFIG.CHUNK_SIZE) {
                    for (let cz = 0; cz < CONFIG.WORLD_SIZE; cz += CONFIG.CHUNK_SIZE) {
                        const mesh = generateChunkMesh(cx / CONFIG.CHUNK_SIZE, cz / CONFIG.CHUNK_SIZE);
                        
                        if (mesh.vertices.length > 0) {
                            const key = `${cx}_${cz}`;
                            meshes.set(key, {
                                vertexBuffer: device.createBuffer({
                                    size: mesh.vertices.byteLength,
                                    usage: GPUBufferUsage.VERTEX,
                                    mappedAtCreation: true,
                                }),
                                indexBuffer: device.createBuffer({
                                    size: mesh.indices.byteLength,
                                    usage: GPUBufferUsage.INDEX,
                                    mappedAtCreation: true,
                                }),
                                vertexCount: mesh.vertices.length / 12,
                                indexCount: mesh.indices.length,
                            });
                            
                            new Float32Array(meshes.get(key).vertexBuffer.getMappedRange()).set(mesh.vertices);
                            new Uint32Array(meshes.get(key).indexBuffer.getMappedRange()).set(mesh.indices);
                            meshes.get(key).vertexBuffer.unmap();
                            meshes.get(key).indexBuffer.unmap();
                            
                            stats.voxelCount += mesh.vertices.length / 12;
                            stats.triCount += mesh.indices.length / 3;
                        }
                        
                        chunkCount++;
                        stats.chunkCount = chunkCount;
                        
                        if (chunkCount % 5 === 0) {
                            updateLoading(90 + (chunkCount / totalChunks) * 8, `Generating meshes... ${chunkCount}/${totalChunks}`);
                            await new Promise(r => setTimeout(r, 0));
                        }
                    }
                }
                
                // Water mesh
                const waterMesh = generateWaterMesh();
                if (waterMesh.vertices.length > 0) {
                    meshes.set('water', {
                        vertexBuffer: device.createBuffer({
                            size: waterMesh.vertices.byteLength,
                            usage: GPUBufferUsage.VERTEX,
                            mappedAtCreation: true,
                        }),
                        indexBuffer: device.createBuffer({
                            size: waterMesh.indices.byteLength,
                            usage: GPUBufferUsage.INDEX,
                            mappedAtCreation: true,
                        }),
                        vertexCount: waterMesh.vertices.length / 12,
                        indexCount: waterMesh.indices.length,
                    });
                    
                    new Float32Array(meshes.get('water').vertexBuffer.getMappedRange()).set(waterMesh.vertices);
                    new Uint32Array(meshes.get('water').indexBuffer.getMappedRange()).set(waterMesh.indices);
                    meshes.get('water').vertexBuffer.unmap();
                    meshes.get('water').indexBuffer.unmap();
                }
                
                updateLoading(99, 'Initializing particles...');
                initParticles();
                
                createBindGroups();
                setupInput();
                
                // Update stats display
                document.getElementById('chunks').textContent = stats.chunkCount;
                document.getElementById('voxels').textContent = (stats.voxelCount / 1000).toFixed(1) + 'K';
                document.getElementById('tris').textContent = (stats.triCount / 1000).toFixed(1) + 'K';
                
                // Hide loading screen
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                }, 500);
                
                // Start render loop
                requestAnimationFrame(render);
                
            } catch (err) {
                console.error('Initialization error:', err);
                document.getElementById('loading-text').textContent = 'Error: ' + err.message;
                document.getElementById('loading-text').style.color = '#f55';
            }
        }
        
        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            if (device) {
                depthTexture.destroy();
                depthTexture = device.createTexture({
                    size: [canvas.width, canvas.height],
                    format: 'depth24plus',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT,
                });
                
                postTexture.destroy();
                postTexture = device.createTexture({
                    size: [canvas.width, canvas.height],
                    format: navigator.gpu.getPreferredCanvasFormat(),
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
                });
                
                postBindGroup = device.createBindGroup({
                    layout: postPipeline.getBindGroupLayout(0),
                    entries: [
                        { binding: 0, resource: postBindGroup.entries[0].resource },
                        { binding: 1, resource: postTexture.createView() },
                        { binding: 2, resource: postBindGroup.entries[2].resource },
                    ],
                });
            }
        });
        
        // Start
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
    </script>
