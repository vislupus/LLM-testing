<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Fantasy Voxel World - WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            pointer-events: none;
        }
        #ui > * {
            pointer-events: auto;
        }
        .panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            backdrop-filter: blur(5px);
        }
        .panel h3 {
            color: #d4a574;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        button {
            background: linear-gradient(180deg, #5a4a3a 0%, #3d2f22 100%);
            border: 1px solid #8b7355;
            color: #d4a574;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        button:hover {
            background: linear-gradient(180deg, #6a5a4a 0%, #4d3f32 100%);
            transform: scale(1.05);
        }
        button.active {
            background: linear-gradient(180deg, #8b7355 0%, #5a4a3a 100%);
            border-color: #d4a574;
            box-shadow: 0 0 10px rgba(212, 165, 116, 0.5);
        }
        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 12px;
        }
        .checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        #stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 15px;
            font-size: 12px;
            z-index: 100;
        }
        #stats div {
            margin: 3px 0;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 100;
            opacity: 0.7;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #fff;
        }
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
        }
        #crosshair::after {
            width: 20px;
            height: 2px;
            top: 9px;
        }
        #crosshair.hidden {
            display: none;
        }
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading h1 {
            font-size: 32px;
            color: #d4a574;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 165, 116, 0.5);
        }
        #loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        #loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #8b7355, #d4a574);
            transition: width 0.3s;
        }
        #loading-text {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
        #help {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 8px;
            padding: 15px;
            font-size: 11px;
            z-index: 100;
            max-width: 250px;
        }
        #help h4 {
            color: #d4a574;
            margin-bottom: 8px;
        }
        #help kbd {
            background: #3d2f22;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #5a4a3a;
        }
        #screenshot-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }
        #screenshot-overlay.show {
            display: flex;
        }
        #screenshot-preview {
            max-width: 80%;
            max-height: 80%;
            border: 3px solid #d4a574;
            border-radius: 8px;
        }
        .slider {
            margin: 8px 0;
        }
        .slider label {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
            color: #d4a574;
        }
        .slider input {
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="loading">
        <h1>🏰 Medieval Fantasy World</h1>
        <div id="loading-bar"><div id="loading-progress"></div></div>
        <div id="loading-text">Initializing WebGPU...</div>
    </div>
    
    <div id="ui">
        <div class="panel">
            <h3>⏰ Time of Day</h3>
            <div class="btn-group">
                <button data-time="dawn">🌅 Dawn</button>
                <button data-time="day" class="active">☀️ Day</button>
                <button data-time="dusk">🌇 Dusk</button>
                <button data-time="night">🌙 Night</button>
            </div>
        </div>
        <div class="panel">
            <h3>🎬 Camera Mode</h3>
            <div class="btn-group">
                <button data-mode="fly" class="active">🦅 Fly</button>
                <button data-mode="walk">🚶 Walk</button>
                <button data-mode="orbit">🔄 Orbit</button>
            </div>
        </div>
        <div class="panel">
            <h3>✨ Effects</h3>
            <div class="checkbox">
                <input type="checkbox" id="bloom" checked>
                <label for="bloom">Bloom</label>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="shadows" checked>
                <label for="shadows">Shadows</label>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="fog" checked>
                <label for="fog">Fog</label>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="vignette" checked>
                <label for="vignette">Vignette</label>
            </div>
            <div class="checkbox">
                <input type="checkbox" id="particles" checked>
                <label for="particles">Particles</label>
            </div>
        </div>
        <div class="panel">
            <h3>📸 Screenshot</h3>
            <button id="screenshot-btn">📷 Capture</button>
        </div>
    </div>
    
    <div id="stats">
        <div>FPS: <span id="fps">0</span></div>
        <div>Chunks: <span id="chunks">0</span></div>
        <div>Voxels: <span id="voxels">0</span></div>
        <div>Triangles: <span id="tris">0</span></div>
        <div>Mode: <span id="mode">Fly</span></div>
    </div>
    
    <div id="crosshair" class="hidden"></div>
    
    <div id="help">
        <h4>Controls</h4>
        <div><kbd>WASD</kbd> Move</div>
        <div><kbd>Space</kbd>/<kbd>Shift</kbd> Up/Down</div>
        <div><kbd>Mouse</kbd> Look</div>
        <div><kbd>Click</kbd> Lock cursor</div>
        <div><kbd>Esc</kbd> Unlock</div>
        <div><kbd>1-4</kbd> Time presets</div>
        <div><kbd>F</kbd> Fly mode</div>
        <div><kbd>G</kbd> Orbit mode</div>
        <div><kbd>P</kbd> Screenshot</div>
    </div>
    
    <div id="screenshot-overlay">
        <img id="screenshot-preview" alt="Screenshot">
    </div>

    <script type="module">
        // ============================================
        // MEDIEVAL FANTASY VOXEL WORLD - WebGPU
        // ============================================
        
        // Configuration
        const CONFIG = {
            CHUNK_SIZE: 16,
            WORLD_SIZE: 128,
            WORLD_HEIGHT: 64,
            RENDER_DISTANCE: 8,
            WATER_LEVEL: 20,
            FOG_NEAR: 50,
            FOG_FAR: 200,
            CAMERA_SPEED: 15,
            WALK_SPEED: 5,
            MOUSE_SENSITIVITY: 0.002,
            ORBIT_RADIUS: 80,
            ORBIT_SPEED: 0.3,
        };
        
        // Voxel Types
        const VOXEL = {
            AIR: 0,
            GRASS: 1,
            DIRT: 2,
            STONE: 3,
            SAND: 4,
            WATER: 5,
            WOOD: 6,
            LEAVES: 7,
            STONE_BRICK: 8,
            COBBLESTONE: 9,
            GLASS: 10,
            TORCH: 11,
            LAVA: 12,
            SNOW: 13,
            ICE: 14,
            BASALT: 15,
            GLOWSTONE: 16,
            GOLD: 17,
            RED_WOOL: 18,
            BLUE_WOOL: 19,
            YELLOW_WOOL: 20,
            FLOWER: 21,
            REEDS: 22,
            DEAD_TREE: 23,
            MOSSY_STONE: 24,
            OBSIDIAN: 25,
        };
        
        // Color palette for voxels
        const VOXEL_COLORS = {
            [VOXEL.GRASS]: [0.35, 0.65, 0.25],
            [VOXEL.DIRT]: [0.55, 0.40, 0.25],
            [VOXEL.STONE]: [0.50, 0.50, 0.55],
            [VOXEL.SAND]: [0.85, 0.75, 0.55],
            [VOXEL.WATER]: [0.20, 0.45, 0.75],
            [VOXEL.WOOD]: [0.55, 0.35, 0.20],
            [VOXEL.LEAVES]: [0.25, 0.55, 0.20],
            [VOXEL.STONE_BRICK]: [0.55, 0.55, 0.60],
            [VOXEL.COBBLESTONE]: [0.45, 0.45, 0.50],
            [VOXEL.GLASS]: [0.70, 0.80, 0.85],
            [VOXEL.TORCH]: [1.00, 0.70, 0.30],
            [VOXEL.LAVA]: [1.00, 0.30, 0.10],
            [VOXEL.SNOW]: [0.95, 0.95, 0.98],
            [VOXEL.ICE]: [0.70, 0.85, 0.90],
            [VOXEL.BASALT]: [0.25, 0.25, 0.30],
            [VOXEL.GLOWSTONE]: [1.00, 0.90, 0.50],
            [VOXEL.GOLD]: [1.00, 0.80, 0.20],
            [VOXEL.RED_WOOL]: [0.75, 0.20, 0.20],
            [VOXEL.BLUE_WOOL]: [0.20, 0.35, 0.70],
            [VOXEL.YELLOW_WOOL]: [0.90, 0.75, 0.25],
            [VOXEL.FLOWER]: [1.00, 0.40, 0.50],
            [VOXEL.REEDS]: [0.45, 0.60, 0.30],
            [VOXEL.DEAD_TREE]: [0.30, 0.25, 0.20],
            [VOXEL.MOSSY_STONE]: [0.40, 0.50, 0.35],
            [VOXEL.OBSIDIAN]: [0.15, 0.10, 0.20],
        };
        
        // Emissive voxels
        const EMISSIVE_VOXELS = new Set([VOXEL.TORCH, VOXEL.LAVA, VOXEL.GLOWSTONE]);
        
        // State
        let device, context, canvas;
        let pipeline, shadowPipeline, waterPipeline, particlePipeline, postPipeline;
        let uniformBuffer, lightBuffer, timeBuffer;
        let depthTexture, shadowTexture;
        let chunks = new Map();
        let meshes = new Map();
        let particles = [];
        let birds = [];
        let clouds = [];
        
        let camera = {
            position: [80, 50, 80],
            rotation: [0.4, -0.8, 0],
            mode: 'fly',
            speed: CONFIG.CAMERA_SPEED,
        };
        
        let settings = {
            timeOfDay: 'day',
            timeValue: 0.5,
            bloom: true,
            shadows: true,
            fog: true,
            vignette: true,
            particles: true,
            screenshotMode: false,
        };
        
        let input = {
            keys: {},
            mouse: { x: 0, y: 0, locked: false },
        };
        
        let stats = {
            fps: 0,
            frameTime: 0,
            lastFrame: performance.now(),
            chunkCount: 0,
            voxelCount: 0,
            triCount: 0,
        };
        
        // World data
        const world = new Uint8Array(CONFIG.WORLD_SIZE * CONFIG.WORLD_SIZE * CONFIG.WORLD_HEIGHT);
        
        function worldIndex(x, y, z) {
            if (x < 0 || x >= CONFIG.WORLD_SIZE || y < 0 || y >= CONFIG.WORLD_HEIGHT || z < 0 || z >= CONFIG.WORLD_SIZE) return -1;
            return x + z * CONFIG.WORLD_SIZE + y * CONFIG.WORLD_SIZE * CONFIG.WORLD_SIZE;
        }
        
        function getVoxel(x, y, z) {
            const idx = worldIndex(x, y, z);
            return idx >= 0 ? world[idx] : VOXEL.AIR;
        }
        
        function setVoxel(x, y, z, type) {
            const idx = worldIndex(x, y, z);
            if (idx >= 0) world[idx] = type;
        }
        
        // ============================================
        // WORLD GENERATION
        // ============================================
        
        function generateWorld() {
            updateLoading(0, 'Generating terrain...');
            
            // Base terrain with hills and valleys
            for (let x = 0; x < CONFIG.WORLD_SIZE; x++) {
                for (let z = 0; z < CONFIG.WORLD_SIZE; z++) {
                    const height = generateHeight(x, z);
                    
                    for (let y = 0; y < CONFIG.WORLD_HEIGHT; y++) {
                        if (y < height - 4) {
                            setVoxel(x, y, z, VOXEL.STONE);
                        } else if (y < height) {
                            setVoxel(x, y, z, VOXEL.DIRT);
                        } else if (y === height) {
                            setVoxel(x, y, z, VOXEL.GRASS);
                        } else if (y <= CONFIG.WATER_LEVEL) {
                            setVoxel(x, y, z, VOXEL.WATER);
                        }
                    }
                }
            }
            
            updateLoading(20, 'Building castle...');
            buildCastle();
            
            updateLoading(40, 'Creating village...');
            buildVillage();
            
            updateLoading(60, 'Adding volcano...');
            buildVolcano();
            
            updateLoading(70, 'Placing forests...');
            addForests();
            
            updateLoading(80, 'Adding details...');
            addDetails();
            
            updateLoading(90, 'Generating meshes...');
        }
        
        function generateHeight(x, z) {
            // Multi-octave noise for natural terrain
            let height = CONFIG.WATER_LEVEL + 5;
            
            // Base hills
            height += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 8;
            height += Math.sin(x * 0.1 + 1) * Math.sin(z * 0.1 + 2) * 4;
            
            // Castle hill
            const castleDist = Math.sqrt(Math.pow(x - 90, 2) + Math.pow(z - 64, 2));
            if (castleDist < 35) {
                height += Math.max(0, 25 - castleDist * 0.7);
            }
            
            // Village area - flatter
            const villageDist = Math.sqrt(Math.pow(x - 40, 2) + Math.pow(z - 70, 2));
            if (villageDist < 30) {
                height = Math.min(height, CONFIG.WATER_LEVEL + 6);
            }
            
            // River valley
            const riverZ = 60 + Math.sin(x * 0.08) * 8;
            const riverDist = Math.abs(z - riverZ);
            if (riverDist < 8) {
                height = Math.min(height, CONFIG.WATER_LEVEL + 1);
            }
            
            // Volcano
            const volcanoDist = Math.sqrt(Math.pow(x - 110, 2) + Math.pow(z - 110, 2));
            if (volcanoDist < 25) {
                height += Math.max(0, 40 - volcanoDist * 1.5);
            }
            
            // Snowy mountains
            const mountainDist = Math.sqrt(Math.pow(x - 20, 2) + Math.pow(z - 20, 2));
            if (mountainDist < 25) {
                height += Math.max(0, 30 - mountainDist * 1.2);
            }
            
            return Math.floor(Math.max(1, Math.min(CONFIG.WORLD_HEIGHT - 5, height)));
        }
        
        function buildCastle() {
            const cx = 90, cz = 64;
            
            // Terraced hill foundation
            for (let tier = 0; tier < 4; tier++) {
                const radius = 28 - tier * 5;
                const baseY = generateHeight(cx, cz) + tier * 4;
                
                for (let dx = -radius; dx <= radius; dx++) {
                    for (let dz = -radius; dz <= radius; dz++) {
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        if (dist <= radius) {
                            for (let dy = 0; dy <= 4; dy++) {
                                setVoxel(cx + dx, baseY + dy, cz + dz, VOXEL.STONE_BRICK);
                            }
                            setVoxel(cx + dx, baseY + 4, cz + dz, VOXEL.COBBLESTONE);
                        }
                    }
                }
            }
            
            const baseY = generateHeight(cx, cz) + 16;
            
            // Outer walls
            const wallRadius = 22;
            for (let angle = 0; angle < 360; angle += 5) {
                const rad = angle * Math.PI / 180;
                const wx = Math.floor(cx + Math.cos(rad) * wallRadius);
                const wz = Math.floor(cz + Math.sin(rad) * wallRadius);
                
                for (let wy = baseY; wy < baseY + 12; wy++) {
                    setVoxel(wx, wy, wz, VOXEL.STONE_BRICK);
                }
                
                // Battlements
                if (angle % 20 < 10) {
                    for (let by = baseY + 12; by < baseY + 14; by++) {
                        setVoxel(wx, by, wz, VOXEL.STONE_BRICK);
                    }
                }
            }
            
            // Corner towers
            const towerAngles = [45, 135, 225, 315];
            for (const angle of towerAngles) {
                const rad = angle * Math.PI / 180;
                const tx = Math.floor(cx + Math.cos(rad) * wallRadius);
                const tz = Math.floor(cz + Math.sin(rad) * wallRadius);
                buildTower(tx, tz, baseY, 6, 18);
            }
            
            // Main gate
            const gateX = cx, gateZ = cz + wallRadius;
            for (let gx = gateX - 3; gx <= gateX + 3; gx++) {
                for (let gy = baseY; gy < baseY + 8; gy++) {
                    if (gx > gateX - 2 && gx < gateX + 2 && gy < baseY + 6) continue;
                    setVoxel(gx, gy, gateZ, VOXEL.STONE_BRICK);
                }
            }
            // Gate arch
            for (let ga = 0; ga < 3; ga++) {
                setVoxel(gateX - 1 + ga, baseY + 6, gateZ, VOXEL.STONE_BRICK);
            }
            
            // Bridge over moat
            const moatZ = cz + wallRadius + 4;
            for (let bz = gateZ; bz <= moatZ; bz++) {
                for (let bx = gateX - 2; bx <= gateX + 2; bx++) {
                    setVoxel(bx, baseY, bz, VOXEL.WOOD);
                }
            }
            
            // Moat
            for (let mx = cx - 26; mx <= cx + 26; mx++) {
                for (let mz = cz - 26; mz <= cz + 26; mz++) {
                    const dist = Math.sqrt(Math.pow(mx - cx, 2) + Math.pow(mz - cz, 2));
                    if (dist > 23 && dist < 26) {
                        for (let my = baseY - 3; my <= CONFIG.WATER_LEVEL; my++) {
                            setVoxel(mx, my, mz, VOXEL.WATER);
                        }
                    }
                }
            }
            
            // Royal Keep
            const keepX = cx, keepZ = cz - 8;
            buildTower(keepX, keepZ, baseY, 8, 25, true);
            
            // Keep roof
            for (let ry = baseY + 25; ry < baseY + 30; ry++) {
                const roofSize = 8 - (ry - baseY - 25);
                for (let rx = -roofSize; rx <= roofSize; rx++) {
                    for (let rz = -roofSize; rz <= roofSize; rz++) {
                        if (Math.abs(rx) === roofSize || Math.abs(rz) === roofSize) {
                            setVoxel(keepX + rx, ry, keepZ + rz, VOXEL.RED_WOOL);
                        }
                    }
                }
            }
            
            // Chapel
            const chapelX = cx + 12, chapelZ = cz;
            buildChapel(chapelX, chapelZ, baseY);
            
            // Courtyard
            for (let cyx = cx - 10; cyx <= cx + 10; cyx++) {
                for (let cyz = cz - 5; cyz <= cz + 15; cyz++) {
                    setVoxel(cyx, baseY, cyz, VOXEL.COBBLESTONE);
                }
            }
            
            // Gardens
            for (let gx = cx - 20; gx <= cx - 12; gx++) {
                for (let gz = cz - 15; gz <= cz + 15; gz++) {
                    if (Math.random() > 0.3) {
                        setVoxel(gx, baseY + 1, gz, VOXEL.FLOWER);
                    }
                    if (Math.random() > 0.8) {
                        setVoxel(gx, baseY + 1, gz, VOXEL.LEAVES);
                        setVoxel(gx, baseY + 2, gz, VOXEL.LEAVES);
                    }
                }
            }
            
            // Flags on towers
            for (const angle of towerAngles) {
                const rad = angle * Math.PI / 180;
                const fx = Math.floor(cx + Math.cos(rad) * wallRadius);
                const fz = Math.floor(cz + Math.sin(rad) * wallRadius);
                setVoxel(fx, baseY + 19, fz, VOXEL.GOLD);
                setVoxel(fx, baseY + 20, fz, VOXEL.RED_WOOL);
                setVoxel(fx, baseY + 21, fz, VOXEL.RED_WOOL);
            }
            
            // Glowing windows in keep
            for (let wy = baseY + 5; wy < baseY + 20; wy += 4) {
                for (let side = 0; side < 4; side++) {
                    const wx = keepX + (side % 2 === 0 ? 7 : 0);
                    const wz = keepZ + (side % 2 === 1 ? 7 : 0);
                    setVoxel(wx, wy, wz, VOXEL.GLOWSTONE);
                    setVoxel(wx, wy + 1, wz, VOXEL.GLASS);
                }
            }
            
            // Torches on walls
            for (let angle = 0; angle < 360; angle += 30) {
                const rad = angle * Math.PI / 180;
                const tx = Math.floor(cx + Math.cos(rad) * (wallRadius - 1));
                const tz = Math.floor(cz + Math.sin(rad) * (wallRadius - 1));
                setVoxel(tx, baseY + 8, tz, VOXEL.TORCH);
            }
        }
        
        function buildTower(x, z, baseY, radius, height, isKeep = false) {
            for (let ty = baseY; ty < baseY + height; ty++) {
                for (let tx = -radius; tx <= radius; tx++) {
                    for (let tz = -radius; tz <= radius; tz++) {
                        const dist = Math.sqrt(tx * tx + tz * tz);
                        if (dist <= radius && dist > radius - 2) {
                            setVoxel(x + tx, ty, z + tz, VOXEL.STONE_BRICK);
                        } else if (dist <= radius - 2 && isKeep && ty % 4 === 0) {
                            setVoxel(x + tx, ty, z + tz, VOXEL.WOOD); // Floors
                        }
                    }
                }
            }
            
            // Battlements
            for (let bx = -radius; bx <= radius; bx++) {
                for (let bz = -radius; bz <= radius; bz++) {
                    const dist = Math.sqrt(bx * bx + bz * bz);
                    if (dist <= radius && dist > radius - 2) {
                        if ((bx + bz) % 2 === 0) {
                            setVoxel(x + bx, baseY + height, z + bz, VOXEL.STONE_BRICK);
                            setVoxel(x + bx, baseY + height + 1, z + bz, VOXEL.STONE_BRICK);
                        }
                    }
                }
            }
        }
        
        function buildChapel(x, z, baseY) {
            // Main hall
            for (let cx = x - 4; cx <= x + 4; cx++) {
                for (let cz = z - 6; cz <= z + 6; cz++) {
                    setVoxel(cx, baseY, cz, VOXEL.STONE_BRICK);
                    for (let cy = baseY + 1; cy < baseY + 8; cy++) {
                        if (cx === x - 4 || cx === x + 4 || cz === z - 6 || cz === z + 6) {
                            setVoxel(cx, cy, cz, VOXEL.STONE_BRICK);
                        }
                    }
                }
            }
            
            // Stained glass windows
            for (let wy = baseY + 3; wy < baseY + 6; wy++) {
                setVoxel(x - 4, wy, z - 2, VOXEL.BLUE_WOOL);
                setVoxel(x - 4, wy, z + 2, VOXEL.RED_WOOL);
                setVoxel(x + 4, wy, z - 2, VOXEL.YELLOW_WOOL);
                setVoxel(x + 4, wy, z + 2, VOXEL.BLUE_WOOL);
            }
            
            // Steeple
            for (let sy = baseY + 8; sy < baseY + 15; sy++) {
                const ss = Math.max(0, 2 - Math.floor((sy - baseY - 8) / 2));
                for (let sx = -ss; sx <= ss; sx++) {
                    for (let sz = -ss; sz <= ss; sz++) {
                        setVoxel(x + sx, sy, z + sz, VOXEL.STONE_BRICK);
                    }
                }
            }
            setVoxel(x, baseY + 15, z, VOXEL.GOLD);
            setVoxel(x, baseY + 16, z, VOXEL.GOLD);
        }
        
        function buildVillage() {
            const vx = 40, vz = 70;
            const housePositions = [];
            
            // Generate house positions along curved streets
            for (let street = 0; street < 3; street++) {
                const streetZ = vz - 15 + street * 15;
                for (let hx = vx - 20; hx <= vx + 20; hx += 8 + Math.floor(Math.random() * 4)) {
                    const offset = Math.sin((hx - vx) * 0.15) * 5;
                    housePositions.push({
                        x: hx,
                        z: streetZ + offset,
                        type: Math.floor(Math.random() * 5)
                    });
                }
            }
            
            // Build houses
            for (let i = 0; i < Math.min(30, housePositions.length); i++) {
                const hp = housePositions[i];
                const groundY = generateHeight(hp.x, hp.z);
                buildHouse(hp.x, groundY, hp.z, hp.type);
            }
            
            // Marketplace
            const marketX = vx, marketZ = vz;
            const marketY = generateHeight(marketX, marketZ);
            for (let mx = marketX - 8; mx <= marketX + 8; mx++) {
                for (let mz = marketZ - 6; mz <= marketZ + 6; mz++) {
                    setVoxel(mx, marketY, mz, VOXEL.COBBLESTONE);
                }
            }
            
            // Market stalls
            buildStall(marketX - 5, marketY, marketZ - 3, VOXEL.RED_WOOL);
            buildStall(marketX + 5, marketY, marketZ - 3, VOXEL.BLUE_WOOL);
            buildStall(marketX - 5, marketY, marketZ + 3, VOXEL.YELLOW_WOOL);
            buildStall(marketX + 5, marketY, marketZ + 3, VOXEL.RED_WOOL);
            
            // Well
            buildWell(marketX, marketY, marketZ);
            
            // Blacksmith
            buildBlacksmith(vx - 25, generateHeight(vx - 25, vz), vz);
            
            // Tavern
            buildTavern(vx + 25, generateHeight(vx + 25, vz), vz);
            
            // Village chapel
            buildChapel(vx, vz + 20, generateHeight(vx, vz + 20));
            
            // Farms
            for (let fx = vx - 30; fx <= vx - 20; fx++) {
                for (let fz = vz - 25; fz <= vz - 15; fz++) {
                    const fy = generateHeight(fx, fz);
                    setVoxel(fx, fy, fz, VOXEL.DIRT);
                    if (Math.random() > 0.2) {
                        setVoxel(fx, fy + 1, fz, VOXEL.GRASS);
                    }
                }
            }
            
            // Fences around farms
            for (let fx = vx - 30; fx <= vx - 20; fx++) {
                setVoxel(fx, generateHeight(fx, vz - 25) + 1, vz - 25, VOXEL.WOOD);
                setVoxel(fx, generateHeight(fx, vz - 15) + 1, vz - 15, VOXEL.WOOD);
            }
            for (let fz = vz - 25; fz <= vz - 15; fz++) {
                setVoxel(vx - 30, generateHeight(vx - 30, fz) + 1, fz, VOXEL.WOOD);
                setVoxel(vx - 20, generateHeight(vx - 20, fz) + 1, fz, VOXEL.WOOD);
            }
            
            // Docks
            const dockX = vx - 10, dockZ = 58;
            const dockY = CONFIG.WATER_LEVEL;
            for (let dx = dockX; dx <= dockX + 8; dx++) {
                for (let dz = dockZ; dz <= dockZ + 4; dz++) {
                    setVoxel(dx, dockY, dz, VOXEL.WOOD);
                    setVoxel(dx, dockY + 1, dz, VOXEL.WOOD);
                }
            }
            
            // Boats
            buildBoat(dockX + 2, CONFIG.WATER_LEVEL, dockZ + 6);
            buildBoat(dockX + 6, CONFIG.WATER_LEVEL, dockZ + 7);
            
            // Watermill
            buildWatermill(vx - 15, CONFIG.WATER_LEVEL, 60);
            
            // Stone bridge to castle
            const bridgeStartZ = 55, bridgeEndZ = 45;
            for (let bz = bridgeEndZ; bz <= bridgeStartZ; bz++) {
                const bridgeX = 55 + Math.sin((bz - bridgeEndZ) * 0.2) * 3;
                const bridgeY = CONFIG.WATER_LEVEL + 3;
                for (let bx = Math.floor(bridgeX) - 2; bx <= Math.floor(bridgeX) + 2; bx++) {
                    setVoxel(bx, bridgeY, bz, VOXEL.STONE_BRICK);
                    // Arch
                    if (bz === bridgeEndZ + 5 || bz === bridgeStartZ - 5) {
                        setVoxel(bx, bridgeY - 1, bz, VOXEL.STONE_BRICK);
                        setVoxel(bx, bridgeY - 2, bz, VOXEL.STONE_BRICK);
                    }
                }
            }
            
            // Carts and barrels
            for (let i = 0; i < 8; i++) {
                const cx = vx - 15 + Math.random() * 30;
                const cz = vz - 10 + Math.random() * 20;
                const cy = generateHeight(cx, cz);
                setVoxel(Math.floor(cx), cy + 1, Math.floor(cz), VOXEL.WOOD);
                setVoxel(Math.floor(cx) + 1, cy + 1, Math.floor(cz), VOXEL.WOOD);
            }
            
            // Lanterns
            for (let lx = vx - 20; lx <= vx + 20; lx += 10) {
                const ly = generateHeight(lx, vz);
                setVoxel(lx, ly + 1, vz, VOXEL.WOOD);
                setVoxel(lx, ly + 2, vz, VOXEL.WOOD);
                setVoxel(lx, ly + 3, vz, VOXEL.TORCH);
            }
        }
        
        function buildHouse(x, y, z, type) {
            const width = 4 + type % 2;
            const depth = 4 + Math.floor(type / 2) % 2;
            const height = 4 + type % 3;
            
            // Walls
            for (let hx = x; hx <= x + width; hx++) {
                for (let hz = z; hz <= z + depth; hz++) {
                    for (let hy = y; hy < y + height; hy++) {
                        if (hx === x || hx === x + width || hz === z || hz === z + depth) {
                            const material = type < 2 ? VOXEL.WOOD : VOXEL.COBBLESTONE;
                            setVoxel(hx, hy, hz, material);
                        }
                    }
                }
            }
            
            // Floor
            for (let hx = x; hx <= x + width; hx++) {
                for (let hz = z; hz <= z + depth; hz++) {
                    setVoxel(hx, y, hz, VOXEL.WOOD);
                }
            }
            
            // Roof
            for (let ry = 0; ry <= 3; ry++) {
                for (let rx = x - 1 + ry; rx <= x + width + 1 - ry; rx++) {
                    setVoxel(rx, y + height + ry, z - 1, VOXEL.RED_WOOL);
                    setVoxel(rx, y + height + ry, z + depth + 1, VOXEL.RED_WOOL);
                }
            }
            
            // Door
            setVoxel(x + Math.floor(width / 2), y + 1, z, VOXEL.WOOD);
            setVoxel(x + Math.floor(width / 2), y + 2, z, VOXEL.WOOD);
            
            // Window with glow
            setVoxel(x, y + 2, z + Math.floor(depth / 2), VOXEL.GLOWSTONE);
        }
        
        function buildStall(x, y, z, color) {
            for (let sx = x; sx <= x + 2; sx++) {
                setVoxel(sx, y + 1, z, VOXEL.WOOD);
                setVoxel(sx, y + 1, z + 2, VOXEL.WOOD);
                setVoxel(sx, y + 3, z, color);
                setVoxel(sx, y + 3, z + 1, color);
                setVoxel(sx, y + 3, z + 2, color);
            }
        }
        
        function buildWell(x, y, z) {
            for (let wy = y; wy < y + 3; wy++) {
                for (let wx = x - 1; wx <= x + 1; wx++) {
                    for (let wz = z - 1; wz <= z + 1; wz++) {
                        if (wx === x - 1 || wx === x + 1 || wz === z - 1 || wz === z + 1) {
                            setVoxel(wx, wy, wz, VOXEL.COBBLESTONE);
                        }
                    }
                }
            }
            setVoxel(x, y, z, VOXEL.WATER);
            setVoxel(x, y + 1, z, VOXEL.WATER);
            setVoxel(x - 1, y + 3, z, VOXEL.WOOD);
            setVoxel(x + 1, y + 3, z, VOXEL.WOOD);
            setVoxel(x, y + 4, z, VOXEL.WOOD);
        }
        
        function buildBlacksmith(x, y, z) {
            buildHouse(x, y, z, 4);
            // Forge
            setVoxel(x + 1, y + 1, z + 1, VOXEL.COBBLESTONE);
            setVoxel(x + 1, y + 2, z + 1, VOXEL.LAVA);
            // Anvil
            setVoxel(x + 3, y + 1, z + 2, VOXEL.OBSIDIAN);
            setVoxel(x + 3, y + 2, z + 2, VOXEL.OBSIDIAN);
        }
        
        function buildTavern(x, y, z) {
            buildHouse(x, y, z, 3);
            // Sign
            setVoxel(x, y + 3, z - 1, VOXEL.WOOD);
            setVoxel(x, y + 4, z - 1, VOXEL.YELLOW_WOOL);
            // Extra windows
            setVoxel(x, y + 2, z + 1, VOXEL.GLOWSTONE);
            setVoxel(x, y + 2, z + 3, VOXEL.GLOWSTONE);
        }
        
        function buildBoat(x, y, z) {
            for (let bx = x; bx <= x + 3; bx++) {
                setVoxel(bx, y, z, VOXEL.WOOD);
                setVoxel(bx, y, z + 1, VOXEL.WOOD);
            }
            setVoxel(x + 1, y, z - 1, VOXEL.WOOD);
            setVoxel(x + 1, y, z + 2, VOXEL.WOOD);
            setVoxel(x + 2, y + 1, z, VOXEL.WOOD);
            setVoxel(x + 2, y + 2, z, VOXEL.RED_WOOL);
        }
        
        function buildWatermill(x, y, z) {
            // Building
            for (let wx = x; wx <= x + 4; wx++) {
                for (let wz = z; wz <= z + 4; wz++) {
                    setVoxel(wx, y + 1, wz, VOXEL.WOOD);
                    setVoxel(wx, y + 2, wz, VOXEL.WOOD);
                    setVoxel(wx, y + 3, wz, VOXEL.WOOD);
                    if (wx === x || wx === x + 4 || wz === z || wz === z + 4) {
                        setVoxel(wx, y + 4, wz, VOXEL.WOOD);
                    }
                }
            }
            // Wheel
            for (let angle = 0; angle < 8; angle++) {
                const rad = angle * Math.PI / 4;
                const wx = Math.floor(x + 2 + Math.cos(rad) * 2);
                const wy = Math.floor(y + 2 + Math.sin(rad) * 2);
                setVoxel(wx, wy, z - 1, VOXEL.WOOD);
            }
        }
        
        function buildVolcano() {
            const vx = 110, vz = 110;
            const baseY = generateHeight(vx, vz);
            
            // Volcano cone
            for (let radius = 25; radius > 0; radius--) {
                const ringY = baseY + (25 - radius) * 1.5;
                for (let angle = 0; angle < 360; angle += 3) {
                    const rad = angle * Math.PI / 180;
                    const dx = Math.floor(Math.cos(rad) * radius);
                    const dz = Math.floor(Math.sin(rad) * radius);
                    
                    const material = radius < 5 ? VOXEL.BASALT : 
                                    radius < 10 ? VOXEL.OBSIDIAN : VOXEL.BASALT;
                    
                    for (let dy = 0; dy < 3; dy++) {
                        setVoxel(vx + dx, ringY + dy, vz + dz, material);
                    }
                }
            }
            
            // Crater
            const craterY = baseY + 38;
            for (let cx = vx - 6; cx <= vx + 6; cx++) {
                for (let cz = vz - 6; cz <= vz + 6; cz++) {
                    const dist = Math.sqrt(Math.pow(cx - vx, 2) + Math.pow(cz - vz, 2));
                    if (dist < 6) {
                        setVoxel(cx, craterY, cz, VOXEL.LAVA);
                        setVoxel(cx, craterY - 1, cz, VOXEL.LAVA);
                    }
                }
            }
            
            // Lava flows
            for (let flow = 0; flow < 4; flow++) {
                const angle = flow * Math.PI / 2 + 0.3;
                let fx = vx, fz = vz, fy = craterY;
                for (let i = 0; i < 20; i++) {
                    fx += Math.cos(angle) * 1.5;
                    fz += Math.sin(angle) * 1.5;
                    fy -= 1.5;
                    
                    const ix = Math.floor(fx), iz = Math.floor(fz), iy = Math.floor(fy);
                    setVoxel(ix, iy, iz, VOXEL.LAVA);
                    setVoxel(ix + 1, iy, iz, VOXEL.BASALT);
                    setVoxel(ix - 1, iy, iz, VOXEL.BASALT);
                }
            }
            
            // Dead trees around volcano
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 15 + Math.random() * 10;
                const tx = Math.floor(vx + Math.cos(angle) * dist);
                const tz = Math.floor(vz + Math.sin(angle) * dist);
                const ty = generateHeight(tx, tz);
                
                for (let th = 0; th < 4; th++) {
                    setVoxel(tx, ty + th, tz, VOXEL.DEAD_TREE);
                }
            }
            
            // Ancient ruins
            for (let i = 0; i < 5; i++) {
                const rx = vx - 20 + Math.random() * 40;
                const rz = vz - 20 + Math.random() * 40;
                const ry = generateHeight(rx, rz);
                
                // Broken pillar
                for (let ph = 0; ph < 3 + Math.random() * 4; ph++) {
                    setVoxel(Math.floor(rx), ry + ph, Math.floor(rz), VOXEL.MOSSY_STONE);
                }
            }
        }
        
        function addForests() {
            // Main forest
            for (let i = 0; i < 150; i++) {
                const tx = 10 + Math.random() * 30;
                const tz = 80 + Math.random() * 30;
                const ty = generateHeight(tx, tz);
                plantTree(tx, ty, tz);
            }
            
            // Sparse trees around village
            for (let i = 0; i < 40; i++) {
                const tx = 20 + Math.random() * 50;
                const tz = 50 + Math.random() * 40;
                const ty = generateHeight(tx, tz);
                if (Math.random() > 0.5) plantTree(tx, ty, tz);
            }
            
            // Snowy mountain pines
            for (let i = 0; i < 30; i++) {
                const tx = 5 + Math.random() * 25;
                const tz = 5 + Math.random() * 25;
                const ty = generateHeight(tx, tz);
                plantPine(tx, ty, tz);
            }
        }
        
        function plantTree(x, y, z) {
            const height = 4 + Math.floor(Math.random() * 3);
            for (let th = 0; th < height; th++) {
                setVoxel(x, y + th, z, VOXEL.WOOD);
            }
            for (let lx = x - 2; lx <= x + 2; lx++) {
                for (let lz = z - 2; lz <= z + 2; lz++) {
                    for (let ly = height - 2; ly <= height + 1; ly++) {
                        const dist = Math.sqrt(Math.pow(lx - x, 2) + Math.pow(lz - z, 2) + Math.pow(ly - height, 2));
                        if (dist < 2.5 && Math.random() > 0.3) {
                            setVoxel(lx, y + ly, lz, VOXEL.LEAVES);
                        }
                    }
                }
            }
        }
        
        function plantPine(x, y, z) {
            for (let th = 0; th < 6; th++) {
                setVoxel(x, y + th, z, VOXEL.WOOD);
            }
            for (let layer = 0; layer < 4; layer++) {
                const radius = 3 - layer * 0.7;
                const ly = y + 2 + layer;
                for (let lx = -radius; lx <= radius; lx++) {
                    for (let lz = -radius; lz <= radius; lz++) {
                        if (lx * lx + lz * lz <= radius * radius && Math.random() > 0.3) {
                            setVoxel(x + lx, ly, z + lz, VOXEL.LEAVES);
                        }
                    }
                }
            }
            // Snow on top
            setVoxel(x, y + 6, z, VOXEL.SNOW);
        }
        
        function addDetails() {
            // Reeds along river
            for (let x = 0; x < CONFIG.WORLD_SIZE; x++) {
                const riverZ = 60 + Math.sin(x * 0.08) * 8;
                for (let dz = -2; dz <= 2; dz++) {
                    if (Math.random() > 0.6) {
                        const z = Math.floor(riverZ) + dz;
                        const y = getVoxel(x, CONFIG.WATER_LEVEL, z) === VOXEL.WATER ? CONFIG.WATER_LEVEL : CONFIG.WATER_LEVEL + 1;
                        setVoxel(x, y, z, VOXEL.REEDS);
                    }
                }
            }
            
            // Caves
            for (let cave = 0; cave < 5; cave++) {
                const cx = 20 + Math.random() * 80;
                const cz = 20 + Math.random() * 80;
                const cy = generateHeight(cx, cz) - 5 - Math.random() * 5;
                
                for (let i = 0; i < 30; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const dist = Math.random() * 5;
                    const dx = Math.floor(cx + Math.cos(angle) * dist);
                    const dz = Math.floor(cz + Math.sin(angle) * dist);
                    for (let dy = -2; dy <= 2; dy++) {
                        setVoxel(dx, cy + dy, dz, VOXEL.AIR);
                    }
                }
            }
            
            // Cliffs
            for (let cliff = 0; cliff < 8; cliff++) {
                const cx = Math.random() * CONFIG.WORLD_SIZE;
                const cz = Math.random() * CONFIG.WORLD_SIZE;
                for (let i = 0; i < 15; i++) {
                    const dx = Math.floor(cx + Math.random() * 10);
                    const dz = Math.floor(cz + Math.random() * 10);
                    const dy = generateHeight(dx, dz);
                    for (let h = 0; h < 5; h++) {
                        setVoxel(dx, dy - h, dz, VOXEL.STONE);
                    }
                }
            }
            
            // Hidden paths
            for (let path = 0; path < 3; path++) {
                let px = 10 + Math.random() * 40;
                let pz = 10 + Math.random() * 40;
                for (let i = 0; i < 30; i++) {
                    const py = generateHeight(px, pz);
                    setVoxel(Math.floor(px), py, Math.floor(pz), VOXEL.DIRT);
                    px += Math.cos(i * 0.3) * 1.5;
                    pz += Math.sin(i * 0.3) * 1.5;
                }
            }
            
            // Lookout posts
            const lookouts = [[15, 45], [70, 15], [100, 30]];
            for (const [lx, lz] of lookouts) {
                const ly = generateHeight(lx, lz);
                for (let lh = 0; lh < 8; lh++) {
                    setVoxel(lx, ly + lh, lz, VOXEL.WOOD);
                }
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        setVoxel(lx + dx, ly + 8, lz + dz, VOXEL.WOOD);
                    }
                }
                setVoxel(lx, ly + 9, lz, VOXEL.TORCH);
            }
            
            // Watchtowers
            const watchtowers = [[60, 40], [75, 85]];
            for (const [wx, wz] of watchtowers) {
                const wy = generateHeight(wx, wz);
                buildTower(wx, wz, wy, 3, 12);
                setVoxel(wx, wy + 13, wz, VOXEL.TORCH);
            }
            
            // Ruins scattered
            for (let i = 0; i < 8; i++) {
                const rx = 10 + Math.random() * 100;
                const rz = 10 + Math.random() * 100;
                const ry = generateHeight(rx, rz);
                
                for (let j = 0; j < 5; j++) {
                    const dx = Math.floor(rx + Math.random() * 6 - 3);
                    const dz = Math.floor(rz + Math.random() * 6 - 3);
                    for (let h = 0; h < 1 + Math.random() * 3; h++) {
                        setVoxel(dx, ry + h, dz, VOXEL.MOSSY_STONE);
                    }
                }
            }
        }
        
        // ============================================
        // MESH GENERATION
        // ============================================
        
        function generateChunkMesh(cx, cz) {
            const vertices = [];
            const indices = [];
            let vertexCount = 0;
            
            const startX = cx * CONFIG.CHUNK_SIZE;
            const startZ = cz * CONFIG.CHUNK_SIZE;
            
            for (let x = 0; x < CONFIG.CHUNK_SIZE; x++) {
                for (let z = 0; z < CONFIG.CHUNK_SIZE; z++) {
                    for (let y = 0; y < CONFIG.WORLD_HEIGHT; y++) {
                        const voxel = getVoxel(startX + x, y, startZ + z);
                        if (voxel === VOXEL.AIR || voxel === VOXEL.WATER) continue;
                        
                        const color = VOXEL_COLORS[voxel] || [0.5, 0.5, 0.5];
                        const emissive = EMISSIVE_VOXELS.has(voxel) ? 1.0 : 0.0;
                        const worldX = startX + x;
                        const worldZ = startZ + z;
                        
                        // Check each face
                        const faces = [
                            { dir: [1, 0, 0], normal: [1, 0, 0], uv: [[0, 0], [0, 1], [1, 1], [1, 0]] },
                            { dir: [-1, 0, 0], normal: [-1, 0, 0], uv: [[1, 0], [1, 1], [0, 1], [0, 0]] },
                            { dir: [0, 1, 0], normal: [0, 1, 0], uv: [[0, 1], [1, 1], [1, 0], [0, 0]] },
                            { dir: [0, -1, 0], normal: [0, -1, 0], uv: [[0, 0], [1, 0], [1, 1], [0, 1]] },
                            { dir: [0, 0, 1], normal: [0, 0, 1], uv: [[1, 0], [0, 0], [0, 1], [1, 1]] },
                            { dir: [0, 0, -1], normal: [0, 0, -1], uv: [[0, 0], [1, 0], [1, 1], [0, 1]] },
                        ];
                        
                        for (const face of faces) {
                            const nx = worldX + face.dir[0];
                            const ny = y + face.dir[1];
                            const nz = worldZ + face.dir[2];
                            const neighbor = getVoxel(nx, ny, nz);
                            
                            // Only render if neighbor is air or water (for transparency)
                            if (neighbor === VOXEL.AIR || neighbor === VOXEL.WATER) {
                                const baseX = worldX;
                                const baseY = y;
                                const baseZ = worldZ;
                                
                                const corners = [
                                    [baseX, baseY, baseZ],
                                    [baseX + 1, baseY, baseZ],
                                    [baseX + 1, baseY + 1, baseZ],
                                    [baseX, baseY + 1, baseZ],
                                    [baseX, baseY, baseZ + 1],
                                    [baseX + 1, baseY, baseZ + 1],
                                    [baseX + 1, baseY + 1, baseZ + 1],
                                    [baseX, baseY + 1, baseZ + 1],
                                ];
                                
                                let faceVerts;
                                if (face.dir[0] === 1) faceVerts = [5, 6, 7, 4];
                                else if (face.dir[0] === -1) faceVerts = [0, 3, 2, 1];
                                else if (face.dir[1] === 1) faceVerts = [3, 7, 6, 2];
                                else if (face.dir[1] === -1) faceVerts = [0, 1, 5, 4];
                                else if (face.dir[2] === 1) faceVerts = [4, 7, 3, 0];
                                else faceVerts = [1, 2, 6, 5];
                                
                                for (let i = 0; i < 4; i++) {
                                    const c = corners[faceVerts[i]];
                                    const variation = 0.95 + Math.random() * 0.1;
                                    vertices.push(
                                        c[0], c[1], c[2],
                                        face.normal[0], face.normal[1], face.normal[2],
                                        color[0] * variation, color[1] * variation, color[2] * variation,
                                        emissive,
                                        face.uv[i][0], face.uv[i][1]
                                    );
                                }
                                
                                indices.push(
                                    vertexCount, vertexCount + 1, vertexCount + 2,
                                    vertexCount, vertexCount + 2, vertexCount + 3
                                );
                                vertexCount += 4;
                            }
                        }
                    }
                }
            }
            
            return { vertices: new Float32Array(vertices), indices: new Uint32Array(indices) };
        }
        
        function generateWaterMesh() {
            const vertices = [];
            const indices = [];
            let vertexCount = 0;
            
            for (let x = 0; x < CONFIG.WORLD_SIZE; x++) {
                for (let z = 0; z < CONFIG.WORLD_SIZE; z++) {
                    if (getVoxel(x, CONFIG.WATER_LEVEL, z) === VOXEL.WATER) {
                        const y = CONFIG.WATER_LEVEL + 0.5;
                        const color = VOXEL_COLORS[VOXEL.WATER];
                        
                        vertices.push(
                            x, y, z, 0, 1, 0, color[0], color[1], color[2], 0, 0, 0,
                            x + 1, y, z, 0, 1, 0, color[0], color[1], color[2], 0, 1, 0,
                            x + 1, y, z + 1, 0, 1, 0, color[0], color[1], color[2], 0, 1, 1,
                            x, y, z + 1, 0, 1, 0, color[0], color[1], color[2], 0, 0, 1
                        );
                        
                        indices.push(
                            vertexCount, vertexCount + 1, vertexCount + 2,
                            vertexCount, vertexCount + 2, vertexCount + 3
                        );
                        vertexCount += 4;
                    }
                }
            }
            
            return { vertices: new Float32Array(vertices), indices: new Uint32Array(indices) };
        }
        
        // ============================================
        // PARTICLES
        // ============================================
        
        function initParticles() {
            particles = [];
            
            // Torches
            for (let x = 0; x < CONFIG.WORLD_SIZE; x++) {
                for (let z = 0; z < CONFIG.WORLD_SIZE; z++) {
                    for (let y = 0; y < CONFIG.WORLD_HEIGHT; y++) {
                        if (getVoxel(x, y, z) === VOXEL.TORCH) {
                            particles.push({
                                x: x + 0.5, y: y + 1, z: z + 0.5,
                                type: 'fire',
                                life: 0,
                                maxLife: 1 + Math.random()
                            });
                        }
                        if (getVoxel(x, y, z) === VOXEL.LAVA) {
                            if (Math.random() > 0.7) {
                                particles.push({
                                    x: x + 0.5, y: y + 1, z: z + 0.5,
                                    type: 'smoke',
                                    life: 0,
                                    maxLife: 2 + Math.random() * 2
                                });
                            }
                        }
                    }
                }
            }
            
            // Birds
            for (let i = 0; i < 8; i++) {
                birds.push({
                    x: 30 + Math.random() * 60,
                    y: 40 + Math.random() * 20,
                    z: 30 + Math.random() * 60,
                    angle: Math.random() * Math.PI * 2,
                    speed: 3 + Math.random() * 2
                });
            }
            
            // Clouds
            for (let i = 0; i < 12; i++) {
                clouds.push({
                    x: Math.random() * CONFIG.WORLD_SIZE,
                    y: CONFIG.WORLD_HEIGHT - 5 + Math.random() * 5,
                    z: Math.random() * CONFIG.WORLD_SIZE,
                    size: 5 + Math.random() * 8,
                    speed: 0.5 + Math.random() * 0.5
                });
            }
        }
        
        function updateParticles(dt) {
            for (const particle of particles) {
                particle.life += dt;
                if (particle.type === 'fire') {
                    particle.y += dt * 2;
                    particle.x += Math.sin(particle.life * 5) * dt * 0.5;
                    particle.z += Math.cos(particle.life * 5) * dt * 0.5;
                } else if (particle.type === 'smoke') {
                    particle.y += dt * 1.5;
                    particle.x += Math.sin(particle.life * 2) * dt * 0.3;
                    particle.z += Math.cos(particle.life * 2) * dt * 0.3;
                }
            }
            
            // Update birds
            for (const bird of birds) {
                bird.angle += Math.sin(Date.now() * 0.001 + bird.x) * dt * 0.5;
                bird.x += Math.cos(bird.angle) * bird.speed * dt;
                bird.z += Math.sin(bird.angle) * bird.speed * dt;
                bird.y += Math.sin(Date.now() * 0.002 + bird.z) * dt * 0.5;
                
                if (bird.x < 0 || bird.x > CONFIG.WORLD_SIZE) bird.angle = Math.PI - bird.angle;
                if (bird.z < 0 || bird.z > CONFIG.WORLD_SIZE) bird.angle = -bird.angle;
            }
            
            // Update clouds
            for (const cloud of clouds) {
                cloud.x += cloud.speed * dt;
                if (cloud.x > CONFIG.WORLD_SIZE + 10) cloud.x = -10;
            }
        }
        
        // ============================================
        // WebGPU INITIALIZATION
        // ============================================
        
        async function initWebGPU() {
            updateLoading(5, 'Requesting WebGPU adapter...');
            
            if (!navigator.gpu) {
                throw new Error('WebGPU not supported. Please use a browser with WebGPU support.');
            }
            
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) {
                throw new Error('No GPU adapter found.');
            }
            
            updateLoading(10, 'Creating WebGPU device...');
            
            device = await adapter.requestDevice({
                requiredFeatures: ['depth-clip-control'],
            });
            
            canvas = document.getElementById('canvas');
            context = canvas.getContext('webgpu');
            
            const format = navigator.gpu.getPreferredCanvasFormat();
            context.configure({
                device,
                format,
                alphaMode: 'opaque',
            });
            
            updateLoading(15, 'Creating shaders and pipelines...');
            
            // Create depth texture
            depthTexture = device.createTexture({
                size: [canvas.width, canvas.height],
                format: 'depth24plus',
                usage: GPUTextureUsage.RENDER_ATTACHMENT,
            });
            
            // Create shadow texture
            shadowTexture = device.createTexture({
                size: [2048, 2048],
                format: 'depth24plus',
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
            });
            
            // Create buffers
            uniformBuffer = device.createBuffer({
                size: 256,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            
            lightBuffer = device.createBuffer({
                size: 64,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            
            timeBuffer = device.createBuffer({
                size: 16,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            
            // Create pipelines
            await createPipelines(format);
            
            updateLoading(95, 'Finalizing...');
        }
        
        async function createPipelines(format) {
            const shaderCode = `
                struct Uniforms {
                    viewProj: mat4x4<f32>,
                    cameraPos: vec3<f32>,
                    time: f32,
                    lightDir: vec3<f32>,
                    lightColor: vec3<f32>,
                    ambientColor: vec3<f32>,
                    fogColor: vec3<f32>,
                    fogParams: vec2<f32>,
                    settings: vec4<f32>, // bloom, shadows, fog, vignette
                }
                
                @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                @group(0) @binding(1) var shadowSampler: sampler_comparison;
                @group(0) @binding(2) var shadowMap: texture_depth_2d;
                
                struct VertexInput {
                    @location(0) position: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                    @location(4) uv: vec2<f32>,
                }
                
                struct VertexOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) worldPos: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                    @location(4) shadowPos: vec3<f32>,
                    @location(5) uv: vec2<f32>,
                }
                
                @vertex
                fn vs_main(input: VertexInput) -> VertexOutput {
                    var output: VertexOutput;
                    output.position = uniforms.viewProj * vec4(input.position, 1.0);
                    output.worldPos = input.position;
                    output.normal = input.normal;
                    output.color = input.color;
                    output.emissive = input.emissive;
                    output.uv = input.uv;
                    
                    // Shadow position
                    let lightMatrix = mat4x4<f32>(
                        0.5, 0.0, 0.0, 0.0,
                        0.0, -0.5, 0.0, 0.0,
                        0.0, 0.0, 0.5, 0.0,
                        0.5, 0.5, 0.5, 1.0
                    );
                    output.shadowPos = (lightMatrix * vec4(input.position, 1.0)).xyz;
                    
                    return output;
                }
                
                @fragment
                fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
                    var color = input.color;
                    var normal = normalize(input.normal);
                    
                    // Lighting
                    let lightDir = normalize(uniforms.lightDir);
                    let diff = max(dot(normal, lightDir), 0.0);
                    let lighting = uniforms.ambientColor + diff * uniforms.lightColor;
                    
                    // Shadows
                    var shadow = 1.0;
                    if (uniforms.settings.y > 0.5) {
                        let shadowCoord = input.shadowPos;
                        if (shadowCoord.x >= 0.0 && shadowCoord.x <= 1.0 &&
                            shadowCoord.y >= 0.0 && shadowCoord.y <= 1.0 &&
                            shadowCoord.z >= 0.0 && shadowCoord.z <= 1.0) {
                            shadow = textureSampleCompare(
                                shadowMap, shadowSampler,
                                shadowCoord.xy, shadowCoord.z - 0.005
                            );
                            shadow = mix(1.0, shadow, 0.7);
                        }
                    }
                    
                    color = color * lighting * shadow;
                    
                    // Emissive
                    if (input.emissive > 0.5) {
                        color = input.color * 2.0;
                    }
                    
                    // Fog
                    if (uniforms.settings.z > 0.5) {
                        let dist = distance(input.worldPos, uniforms.cameraPos);
                        let fogFactor = smoothstep(uniforms.fogParams.x, uniforms.fogParams.y, dist);
                        color = mix(color, uniforms.fogColor, fogFactor);
                    }
                    
                    return vec4(color, 1.0);
                }
            `;
            
            const shaderModule = device.createShaderModule({ code: shaderCode });
            
            const bindGroupLayout = device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
                    { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'comparison' } },
                    { binding: 2, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'depth' } },
                ],
            });
            
            const pipelineLayout = device.createPipelineLayout({
                bindGroupLayouts: [bindGroupLayout],
            });
            
            pipeline = device.createRenderPipeline({
                layout: pipelineLayout,
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vs_main',
                    buffers: [{
                        arrayStride: 48,
                        attributes: [
                            { shaderLocation: 0, offset: 0, format: 'float32x3' },
                            { shaderLocation: 1, offset: 12, format: 'float32x3' },
                            { shaderLocation: 2, offset: 24, format: 'float32x3' },
                            { shaderLocation: 3, offset: 36, format: 'float32' },
                            { shaderLocation: 4, offset: 40, format: 'float32x2' },
                        ],
                    }],
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fs_main',
                    targets: [{ format }],
                },
                primitive: {
                    topology: 'triangle-list',
                    cullMode: 'back',
                },
                depthStencil: {
                    depthWriteEnabled: true,
                    depthCompare: 'less',
                    format: 'depth24plus',
                },
            });
            
            // Water pipeline
            const waterShader = `
                struct Uniforms {
                    viewProj: mat4x4<f32>,
                    cameraPos: vec3<f32>,
                    time: f32,
                    lightDir: vec3<f32>,
                    lightColor: vec3<f32>,
                    ambientColor: vec3<f32>,
                    fogColor: vec3<f32>,
                    fogParams: vec2<f32>,
                    settings: vec4<f32>,
                }
                
                @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                
                struct VertexInput {
                    @location(0) position: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                    @location(4) uv: vec2<f32>,
                }
                
                struct VertexOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) worldPos: vec3<f32>,
                    @location(1) color: vec3<f32>,
                    @location(2) uv: vec2<f32>,
                }
                
                @vertex
                fn vs_main(input: VertexInput) -> VertexOutput {
                    var output: VertexOutput;
                    let wave = sin(input.position.x * 0.5 + uniforms.time * 2.0) * 0.1 +
                               cos(input.position.z * 0.5 + uniforms.time * 1.5) * 0.1;
                    let pos = vec3(input.position.x, input.position.y + wave, input.position.z);
                    output.position = uniforms.viewProj * vec4(pos, 1.0);
                    output.worldPos = pos;
                    output.color = input.color;
                    output.uv = input.uv;
                    return output;
                }
                
                @fragment
                fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
                    var color = input.color;
                    
                    // Fresnel effect
                    let viewDir = normalize(uniforms.cameraPos - input.worldPos);
                    let fresnel = pow(1.0 - max(dot(viewDir, vec3(0.0, 1.0, 0.0)), 0.0), 3.0);
                    color = mix(color, vec3(0.8, 0.9, 1.0), fresnel * 0.5);
                    
                    // Fog
                    let dist = distance(input.worldPos, uniforms.cameraPos);
                    let fogFactor = smoothstep(uniforms.fogParams.x, uniforms.fogParams.y, dist);
                    color = mix(color, uniforms.fogColor, fogFactor);
                    
                    return vec4(color, 0.7);
                }
            `;
            
            const waterModule = device.createShaderModule({ code: waterShader });
            
            waterPipeline = device.createRenderPipeline({
                layout: pipelineLayout,
                vertex: {
                    module: waterModule,
                    entryPoint: 'vs_main',
                    buffers: [{
                        arrayStride: 48,
                        attributes: [
                            { shaderLocation: 0, offset: 0, format: 'float32x3' },
                            { shaderLocation: 1, offset: 12, format: 'float32x3' },
                            { shaderLocation: 2, offset: 24, format: 'float32x3' },
                            { shaderLocation: 3, offset: 36, format: 'float32' },
                            { shaderLocation: 4, offset: 40, format: 'float32x2' },
                        ],
                    }],
                },
                fragment: {
                    module: waterModule,
                    entryPoint: 'fs_main',
                    targets: [{ format, blend: {
                        color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                        alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                    }}],
                },
                primitive: {
                    topology: 'triangle-list',
                    cullMode: 'none',
                },
                depthStencil: {
                    depthWriteEnabled: false,
                    depthCompare: 'less',
                    format: 'depth24plus',
                },
            });
            
            // Post-processing pipeline
            const postShader = `
                @group(0) @binding(0) var texSampler: sampler;
                @group(0) @binding(1) var tex: texture_2d<f32>;
                
                struct Uniforms {
                    settings: vec4<f32>,
                    screenSize: vec2<f32>,
                    padding: vec2<f32>,
                }
                @group(0) @binding(2) var<uniform> uniforms: Uniforms;
                
                struct VertexOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) uv: vec2<f32>,
                }
                
                @vertex
                fn vs_main(@builtin(vertex_index) vi: u32) -> VertexOutput {
                    var pos = array<vec2<f32>, 3>(
                        vec2(-1.0, -1.0),
                        vec2(3.0, -1.0),
                        vec2(-1.0, 3.0)
                    );
                    var output: VertexOutput;
                    output.position = vec4(pos[vi], 0.0, 1.0);
                    output.uv = pos[vi] * 0.5 + 0.5;
                    return output;
                }
                
                @fragment
                fn fs_main(input: VertexOutput) -> @location(0) vec4<f32> {
                    var color = textureSample(tex, texSampler, input.uv);
                    
                    // Bloom
                    if (uniforms.settings.x > 0.5) {
                        var bloom = vec3(0.0);
                        let radius = 4;
                        for (var dx = -radius; dx <= radius; dx++) {
                            for (var dy = -radius; dy <= radius; dy++) {
                                let offset = vec2(f32(dx), f32(dy)) / uniforms.screenSize;
                                let sample = textureSample(tex, texSampler, input.uv + offset);
                                let brightness = dot(sample.rgb, vec3(0.299, 0.587, 0.114));
                                if (brightness > 0.8) {
                                    let weight = 1.0 - length(vec2(dx, dy)) / f32(radius);
                                    bloom += sample.rgb * weight * weight;
                                }
                            }
                        }
                        color.rgb += bloom * 0.15;
                    }
                    
                    // Tone mapping (ACES filmic)
                    color.rgb = color.rgb * (color.rgb + 0.0245786) / (color.rgb * (color.rgb + 0.00009) + 0.035);
                    color.rgb = pow(color.rgb, vec3(1.0 / 2.2));
                    
                    // Vignette
                    if (uniforms.settings.w > 0.5) {
                        let center = vec2(0.5, 0.5);
                        let dist = distance(input.uv, center);
                        let vignette = smoothstep(0.8, 0.3, dist);
                        color.rgb *= vignette;
                    }
                    
                    return vec4(color.rgb, 1.0);
                }
            `;
            
            const postModule = device.createShaderModule({ code: postShader });
            
            const postBindGroupLayout = device.createBindGroupLayout({
                entries: [
                    { binding: 0, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
                    { binding: 1, visibility: GPUShaderStage.FRAGMENT, texture: {} },
                    { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
                ],
            });
            
            postPipeline = device.createRenderPipeline({
                layout: device.createPipelineLayout({ bindGroupLayouts: [postBindGroupLayout] }),
                vertex: { module: postModule, entryPoint: 'vs_main' },
                fragment: { module: postModule, entryPoint: 'fs_main', targets: [{ format }] },
                primitive: { topology: 'triangle-list' },
            });
        }
        
        // ============================================
        // RENDERING
        // ============================================
        
        let bindGroup, postBindGroup, postTexture, postView;
        
        function createBindGroups() {
            const sampler = device.createSampler({
                compare: 'less',
                magFilter: 'linear',
                minFilter: 'linear',
            });
            
            bindGroup = device.createBindGroup({
                layout: pipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: uniformBuffer } },
                    { binding: 1, resource: sampler },
                    { binding: 2, resource: shadowTexture.createView() },
                ],
            });
            
            const postSampler = device.createSampler({
                magFilter: 'linear',
                minFilter: 'linear',
            });
            
            postTexture = device.createTexture({
                size: [canvas.width, canvas.height],
                format: navigator.gpu.getPreferredCanvasFormat(),
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
            });
            
            const postUniformBuffer = device.createBuffer({
                size: 32,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
            });
            
            postBindGroup = device.createBindGroup({
                layout: postPipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: postSampler },
                    { binding: 1, resource: postTexture.createView() },
                    { binding: 2, resource: { buffer: postUniformBuffer } },
                ],
            });
        }
        
        function updateUniforms(time) {
            // Time of day settings
            let lightDir, lightColor, ambientColor, fogColor;
            
            switch (settings.timeOfDay) {
                case 'dawn':
                    lightDir = [0.8, 0.3, 0.5];
                    lightColor = [1.0, 0.6, 0.4];
                    ambientColor = [0.3, 0.2, 0.25];
                    fogColor = [0.6, 0.4, 0.35];
                    break;
                case 'dusk':
                    lightDir = [-0.8, 0.3, 0.5];
                    lightColor = [1.0, 0.5, 0.3];
                    ambientColor = [0.25, 0.15, 0.2];
                    fogColor = [0.5, 0.3, 0.35];
                    break;
                case 'night':
                    lightDir = [0.0, -0.5, 0.0];
                    lightColor = [0.1, 0.15, 0.3];
                    ambientColor = [0.05, 0.05, 0.1];
                    fogColor = [0.05, 0.05, 0.15];
                    break;
                default: // day
                    lightDir = [0.5, 0.8, 0.3];
                    lightColor = [1.0, 0.95, 0.85];
                    ambientColor = [0.35, 0.4, 0.5];
                    fogColor = [0.65, 0.75, 0.85];
            }
            
            // Normalize light direction
            const len = Math.sqrt(lightDir[0]**2 + lightDir[1]**2 + lightDir[2]**2);
            lightDir = lightDir.map(v => v / len);
            
            // Camera matrix
            const aspect = canvas.width / canvas.height;
            const proj = mat4Perspective(60 * Math.PI / 180, aspect, 0.1, 500);
            const view = mat4LookAt(camera.position, 
                [camera.position[0] + camera.rotation[0], 
                 camera.position[1] + camera.rotation[1], 
                 camera.position[2] + camera.rotation[2]],
                [0, 1, 0]);
            const viewProj = mat4Multiply(proj, view);
            
            const uniformData = new Float32Array([
                ...viewProj,
                ...camera.position, 0,
                time, 0, 0, 0,
                ...lightDir, 0,
                ...lightColor, 0,
                ...ambientColor, 0,
                ...fogColor, 0,
                CONFIG.FOG_NEAR, CONFIG.FOG_FAR, 0, 0,
                settings.bloom ? 1 : 0,
                settings.shadows ? 1 : 0,
                settings.fog ? 1 : 0,
                settings.vignette ? 1 : 0,
            ]);
            
            device.queue.writeBuffer(uniformBuffer, 0, uniformData);
            
            // Post-processing uniforms
            const postData = new Float32Array([
                settings.bloom ? 1 : 0,
                0, 0,
                settings.vignette ? 1 : 0,
                canvas.width, canvas.height, 0, 0,
            ]);
            device.queue.writeBuffer(postBindGroup.entries[2].resource.buffer, 0, postData);
        }
        
        function render(time) {
            const now = performance.now();
            const dt = Math.min((now - stats.lastFrame) / 1000, 0.1);
            stats.lastFrame = now;
            stats.frameTime += dt;
            
            if (stats.frameTime >= 0.5) {
                stats.fps = Math.round(1 / dt);
                stats.frameTime = 0;
                document.getElementById('fps').textContent = stats.fps;
            }
            
            // Update
            updateCamera(dt);
            updateParticles(dt);
            updateUniforms(time / 1000);
            
            // Render
            const commandEncoder = device.createCommandEncoder();
            
            // Shadow pass
            if (settings.shadows) {
                const shadowPass = commandEncoder.beginRenderPass({
                    colorAttachments: [],
                    depthStencilAttachment: {
                        view: shadowTexture.createView(),
                        depthClearValue: 1.0,
                        depthLoadOp: 'clear',
                        depthStoreOp: 'store',
                    },
                });
                
                shadowPass.setPipeline(pipeline);
                shadowPass.setBindGroup(0, bindGroup);
                
                for (const [key, mesh] of meshes) {
                    if (mesh.vertexBuffer) {
                        shadowPass.setVertexBuffer(0, mesh.vertexBuffer);
                        shadowPass.setIndexBuffer(mesh.indexBuffer, 'uint32');
                        shadowPass.drawIndexed(mesh.indexCount);
                    }
                }
                
                shadowPass.end();
            }
            
            // Main pass
            const renderPass = commandEncoder.beginRenderPass({
                colorAttachments: [{
