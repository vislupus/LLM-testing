<!DOCTYPE html>
<html>
<head>
  <title>Voxel Fantasy World</title>
  <meta charset="UTF-8">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
'use strict';

const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();

const canvas = document.getElementById('canvas');
const context = canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format, alphaMode: 'premultiplied' });
const presentationFormat = context.getPreferredFormat(adapter);
context.configure({ device, format: presentationFormat });

// Shaders
const vertexShader = `
  @vertex fn main(@builtin(vertex_index) index : u32) -> @builtin(position) vec4<f32> {
    // Vertex shader code...
    return vec4<f32>(0.0, 0.0, 0.0, 1.0); 
  }
`;

const fragmentShader = `
  @fragment fn main() -> @location(0) vec4<f32> {
    // Fragment shader code...  
    return vec4<f32>(0.0, 0.5, 1.0, 1.0);
  }
`;

// Create pipeline
const pipeline = device.createRenderPipeline({
  layout: 'auto',
  vertex: {
    module: device.createShaderModule({ code: vertexShader }),
    entryPoint: 'main',
  },
  fragment: {
    module: device.createShaderModule({ code: fragmentShader }),
    entryPoint: 'main',
    targets: [{ format }],
  },
  primitive: { topology: 'triangle-list' },
});

// Create voxel world
const chunkSize = 32;
const worldSize = 4;
const voxelSize = 0.5;

const positions = new Float32Array(worldSize * worldSize * worldSize * 6 * 4 * 3); 
let positionsIndex = 0;

function addVoxel(x, y, z) {
  const vertexData = [
    // Front face
    x - voxelSize, y - voxelSize, z + voxelSize,
    x + voxelSize, y - voxelSize, z + voxelSize, 
    x + voxelSize, y + voxelSize, z + voxelSize,
    x - voxelSize, y + voxelSize, z + voxelSize,
    // Back face 
    x + voxelSize, y - voxelSize, z - voxelSize,
    x - voxelSize, y - voxelSize, z - voxelSize,
    x - voxelSize, y + voxelSize, z - voxelSize,
    x + voxelSize, y + voxelSize, z - voxelSize,
    // Top face
    x - voxelSize, y + voxelSize, z - voxelSize,  
    x - voxelSize, y + voxelSize, z + voxelSize,
    x + voxelSize, y + voxelSize, z + voxelSize,
    x + voxelSize, y + voxelSize, z - voxelSize,
    // Bottom face 
    x - voxelSize, y - voxelSize, z + voxelSize,
    x - voxelSize, y - voxelSize, z - voxelSize,
    x + voxelSize, y - voxelSize, z - voxelSize,
    x + voxelSize, y - voxelSize, z + voxelSize,
    // Right face
    x + voxelSize, y - voxelSize, z + voxelSize,
    x + voxelSize, y - voxelSize, z - voxelSize, 
    x + voxelSize, y + voxelSize, z - voxelSize,
    x + voxelSize, y + voxelSize, z + voxelSize,
    // Left face
    x - voxelSize, y - voxelSize, z - voxelSize,
    x - voxelSize, y - voxelSize, z + voxelSize,
    x - voxelSize, y + voxelSize, z + voxelSize,
    x - voxelSize, y + voxelSize, z - voxelSize,
  ];

  vertexData.forEach(v => {
    positions[positionsIndex++] = v;
  });
}

function generateWorld() {
  for (let y = 0; y < worldSize; y++) {
    for (let z = 0; z < worldSize; z++) {
      for (let x = 0; x < worldSize; x++) {
        const height = Math.sin(x * 0.1) * Math.sin(z * 0.1) * 2 + 2;
        if (y < height) {
          addVoxel(x, y, z);
        }
      }
    }
  }
}

generateWorld();

// Create buffers
const positionBuffer = device.createBuffer({
  size: positions.byteLength,
  usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
});
device.queue.writeBuffer(positionBuffer, 0, positions);

const indexData = new Uint16Array([
  0, 1, 2, 0, 2, 3,
  4, 5, 6, 4, 6, 7,
  8, 9, 10, 8, 10, 11,
  12, 13, 14, 12, 14, 15,
  16, 17, 18, 16, 18, 19,
  20, 21, 22, 20, 22, 23,
]);
const indexBuffer = device.createBuffer({
  size: indexData.byteLength,
  usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
});
device.queue.writeBuffer(indexBuffer, 0, indexData);

const uniformBufferSize = 4 * 16;  
let projectionMatrix = new Float32Array(16);
let viewMatrix = new Float32Array(16);
let modelMatrix = new Float32Array(16);
let mvpMatrix = new Float32Array(16);

const uniformBuffer = device.createBuffer({
  size: uniformBufferSize,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
});

function updateTransformationMatrix() {
  // Calculate transformation matrices...
  projectionMatrix.set([...]);
  viewMatrix.set([...]);
  modelMatrix.set([...]);
  multiplyMatrices(projectionMatrix, viewMatrix, mvpMatrix);
  multiplyMatrices(mvpMatrix, modelMatrix, mvpMatrix);
  
  device.queue.writeBuffer(uniformBuffer, 0, mvpMatrix.buffer, mvpMatrix.byteOffset, mvpMatrix.byteLength);
}

function multiplyMatrices(a, b, result) {
  // Matrix multiplication helper function...
}

// Input handling 
let pitch = 0;
let yaw = 0;
let velocity = [0, 0, 0];
let position = [0, 0, 5]; 

canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
document.exitPointerLock = document.exitPointerLock || document.mozExitPointerLock;

canvas.addEventListener('click', () => {
  canvas.requestPointerLock();
});

document.addEventListener('pointerlockchange', lockChange, false);
document.addEventListener('mozpointerlockchange', lockChange, false);

function lockChange() {
  if (document.pointerLockElement === canvas || document.mozPointerLockElement === canvas) {
    document.addEventListener('mousemove', updateLook, false);
  } else {
    document.removeEventListener('mousemove', updateLook, false);
  }
}

function updateLook(e) {
  yaw += e.movementX * 0.001;
  pitch -= e.movementY * 0.001;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
}

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
});
document.addEventListener('keyup', e => {
  keys[e.code] = false;  
});

function processInput() {
  const speed = 0.05;
  if (keys['KeyW']) {
    velocity[0] -= Math.sin(yaw) * speed;
    velocity[2] -= Math.cos(yaw) * speed;
  }
  if (keys['KeyS']) {  
    velocity[0] += Math.sin(yaw) * speed;
    velocity[2] += Math.cos(yaw) * speed;
  }
  if (keys['KeyA']) {
    velocity[0] -= Math.cos(yaw) * speed;
    velocity[2] += Math.sin(yaw) * speed;
  }
  if (keys['KeyD']) {
    velocity[0] += Math.cos(yaw) * speed; 
    velocity[2] -= Math.sin(yaw) * speed;
  }
  if (keys['Space']) {
    velocity[1] += speed;
  }
  if (keys['ShiftLeft']) {
    velocity[1] -= speed;
  }
}

function updatePosition() {
  position[0] += velocity[0];
  position[1] += velocity[1];
  position[2] += velocity[2];
  velocity[0] *= 0.9;
  velocity[1] *= 0.9; 
  velocity[2] *= 0.9;
}

// Main render loop
function render() {
  processInput();
  updatePosition();
  updateTransformationMatrix();

  const commandEncoder = device.createCommandEncoder();
  const textureView = context.getCurrentTexture().createView();

  const renderPass = commandEncoder.beginRenderPass({
    colorAttachments: [{
      view: textureView,
      loadOp: 'clear', 
      clearValue: [0, 0, 0, 1],
      storeOp: 'store',
    }],
  });

  renderPass.setPipeline(pipeline);
  renderPass.setVertexBuffer(0, positionBuffer);
  renderPass.setIndexBuffer(indexBuffer, 'uint16');
  renderPass.setBindGroup(0, device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniformBuffer } },
    ],
  }));
  renderPass.drawIndexed(indexData.length);
  renderPass.end(); 

  device.queue.submit([commandEncoder.finish()]);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
