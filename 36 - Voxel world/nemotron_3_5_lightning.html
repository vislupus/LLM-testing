<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGPU Medieval Voxel World</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:sans-serif}
  #canvas{width:100%;height:100%;display:block}
  #ui{position:absolute;top:10px;left:10px;padding:12px 20px;background:rgba(0,0,0,0.65);border-radius:8px;color:#fff;backdrop-filter:blur(4px);}
  #ui h2{margin:0 0 8px;font-size:14px;letter-spacing:.5px;}
  .btn{width:100%;padding:8px;margin:4px 0;background:#1e5a8a;color:#fff;border:none;border-radius:5px;font-size:13px;cursor:transition:background .2s;} .btn:hover{background:#2a7ab5;}
  .mode{margin-top:12px;} .mode span{display:block;margin:2px 0;font-size:12px;color:#bfe3ff;}
</style></head><body>
<canvas id="canvas"></canvas>
<div id="ui">
  <h2>Medieval Fantasy Voxel World</h2>
  <button class="btn" id="orbitBtn">Orbit Mode</button>
  <button class="btn" id="flyBtn">Fly/WALK</button>
  <div class="mode">
    <span>Time: <span id="timeLabel">Day</span></span>
    <button class="btn" data-time="0">Dawn</button>
    <button class="btn" data-time="0.5">Day</button>
    <button class="btn" data-time="1.2">Dusk</button>
    <button class="btn" data-time="2">Night</button>
  </div>
  <button class="btn" id="screenshotBtn">Screenshot</button>
</div>

<script>
/* ==========================================================
   Pure WebGPU Voxel Explorer – single file, no external libs.
   Features: chunked voxels, hidden-face meshing, fly/walk cam,
   cinematic start, orbit, screenshot, time-of-day, atmosphere.
   ========================================================== */

(() => {
  const canvas = document.getElementById('canvas');
  const gl = canvas.getContext('webgpu');
  if (!gl) { canvas.textContent='WebGPU not supported in this browser. Use Chrome/Edge desktop.'; return; }

  // -------- UI refs --------
  const orbitBtn = document.getElementById('orbitBtn');
  const flyBtn = document.getElementById('flyBtn');
  const timeLabel = document.getElementById('timeLabel');
  const ssBtn = document.getElementById('screenshotBtn');
  const timeBtns = document.querySelectorAll('#ui button[data-time]');

  // -------- WebGPU setup --------
  let device, queue, renderPipeline, depthFormat;
  let<|repo># WebGPU Voxel World - Continued Setup
  let<|repo> context, swapChainFormat, depthSwapChainFormat;
  let<|repo> mainRenderPassDescriptor;
  let<|repo> projectionMatrix, viewMatrix;
  let<|repo> orbitMode = false;
  let<|repo> flyMode = false;
  let<|repo> screenshotRequested = false;
  let<|repo> animTime = 0;
  let<|repo> cameraPos = {x:0, y:50, z:120};
  let<|repo> cameraYaw = -Math.PI/2;
  let<|repo> cameraPitch = 0;
  let<|repo> flySpeed = 0.3;
  let<|repo> moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;

  // -------- Input --------
  const keys = {};
  window.addEventListener('keydown', e=> keys[e.code]=true);
  window.addEventListener('keyup', e=> keys[e.code]=false);
  canvas.addEventListener('pointerdown', async e=> {
    if (!document.pointerLockElement) canvas.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', ()=> {
    if (document.pointerLockElement===canvas) canvas.addEventListener('mousemove', onMouseMove);
  });

  function onMouseMove(e) {
    cameraYaw -= e.movementX * 0.002;
    cameraPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, cameraPitch - e.movementY * 0.002));
  }

  // -------- Time-of-Day uniforms --------
  const timePresets = {
    0: {lightDir:[0.8,0.4,0.5], fogColor:[0.85,0.92,1.0], ambient:[0.4,0.5,0.7], label:'Dawn'},
    0.5: {lightDir:[0.6,0.2,0.9], fogColor:[0.5,0.7,1.0], ambient:[0.6,0.7,1.0], label:'Day'},
    1.2: {lightDir:[0.3,-0.1,0.7], fogColor:[0.9,0.7,0.5], ambient:[0.9,0.6,0.3], label:'Dusk'},
    2: {lightDir:[-0.5,-0.3,-0.8], fogColor:[0.2,0.1,0.15], ambient:[0.1,0.05,0.05], label:'Night'}
  };
  let curTime = 0.5;

  function updateTimeLabel(t){
    curTime = t;
    const p = timePresets[t];
    timeLabel.textContent = p.label;
    dirUniform.setValue(...p.lightDir);
    fogColorUniform.setValue(...p.fogColor);
    ambientUniform.setValue(...p.ambient);
  }
  timeBtns.forEach(btn=> btn.addEventListener('click',()=> updateTimeLabel(btn.dataset.time)));

  // -------- WebGPU initialization --------
  async function initWebGPU(){
    const adapter = await gpu.requestAdapter({powerPreference:'high-performance'});
    device = await adapter.requestDevice();
    queue = device.queue;
    context = canvas.getContext('webgpu');
    
    swapChainFormat = navigator.gpu.getPreferredCanvasFormat();
    depthSwapChainFormat = 'depth24plus';
    
    const swapChainDescriptor = {
      format: swapChainFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT,
    };
    swapChain = device.createSwapChain(&lt;HTMLElement>canvas, swapChainDescriptor);
    
    // Depth texture
    depthTexture = device.createTexture({
      size: [canvas.width, canvas.height],
      format: depthSwapChainFormat,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.SAMPLED,
    });
    
    // -------- Shaders (WGSL) --------
    const vsSource = `#version 300 es
    struct VertexInput { position: vec3<f32>, normal: vec3<f32> };
    struct VertexOutput { @builtin(position) pos: vec4<f32>, @varying n: vec3<f32>, @varying vpos: vec3<f32> };
    @group(0) @binding(0) var<uniform> uni: Uniforms;
    @vertex
    fn vs(in: VertexInput) -> VertexOutput {
      var out: VertexOutput;
      out.pos = uni.projView * vec4<f32>(in.position, 1.0);
      out.n = normalize(uni.model * in.normal);
      out.vpos = (uni.viewPos * vec4<f32>(in.position, 1.0)).xyz;
      return out;
    }`;
    
    const fsSource = `#version 300 es
    struct FragmentInput { @varying n: vec3<f32>, @varying vpos: vec3<f32> };
    @group(0) @binding(0) var<uniform> uni: Uniforms;
    @fragment
    fn fs(in: FragmentInput) -> @fragment {
      var N = normalize(in.n);
      var L = normalize(uni.lightDir);
      var diff = max(dot(N,L), 0.0);
      var H = normalize(L - in.vpos);
      var spec = pow(max(dot(N,H), 0.0), 32.0);
      var base = vec3<f32>(0.6,0.7,0.8) * diff + vec3<f32>(0.03,0.04,0.05) + vec3<f32>(0.3,0.3,0.3) * spec;
      var color = base;
      // emissive flicker for torches/lava
      if (uni.isEmissive > 0.0) {
        var flick = 0.5 + 0.5*sin(uni.time*4.0 + in.vpos.x*2.0 + in.vpos.y*3.0);
        color = mix(base, uni.emissiveColor * flick, 0.6);
      }
      // fog
      var fogDist = length(in.vpos - uni.cameraPos);
      var fogFactor = smoothstep(uni.fogStart, uni.fogEnd, fogDist);
      color = mix(color, uni.fogColor, fogFactor);
      return @fragment(color, 1.0);
    }`;

    const shaderModule = device.createShaderModule({code: vsSource + fsSource});

    // -------- Uniform buffer --------
    const uniformBuffer = device.createBuffer({
      size: Uniforms.sizeof(),
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const bindGroupLayout = device.createBindGroupLayout({
      entries: [
        {binding:0, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, bufferType:GPUBufferBindingType.UniformBuffer},
        {binding:1, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, bufferType:GPUBufferBindingType.UniformBuffer},
        {binding:2, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, bufferType:GPUBufferBindingType.UniformBuffer},
        {binding:3, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, bufferType:GPUBufferBindingType.UniformBuffer},
        {binding:4, visibility:GPUShaderStage.VERTEX|GPUShaderStage.FRAGMENT, bufferType:GPUBufferBindingType.UniformBuffer},
      ]
    });
    const bindGroup = device.createBindGroup({layout:bindGroupLayout, entries:[
      {binding:0, resource:{buffer:uniformBuffer}},
      {binding:1, resource:{buffer:uniformBuffer}},
      {binding:2, resource:{buffer:uniformBuffer}},
      {binding:3, resource:{buffer:uniformBuffer}},
      {binding:4, resource:{buffer:uniformBuffer}},
    ]});

    // -------- Pipeline --------
    const pipelineLayout = device.createPipelineLayout({bindGroupLayouts: [bindGroupLayout]});
    const renderPipelineDescriptor = {
      layout: pipelineLayout,
      vertex: {module:shaderModule, entryPoint:'vs'},
      fragment: {
        module:shaderModule,
        entryPoint:'fs',
        targets: [{format:swapChainFormat}],
      },
      depthStencil: {
        depthWriteEnabled: true,
        format: depthSwapChainFormat,
        stencilWriteMask: 0,
        stencilCompare: always,
        stencilFailOp: keep,
        depthFailOp: keep,
        depthOp: less,
      },
      multisample: {count: 1},
    };
    renderPipeline = device.createRenderPipeline(renderPipelineDescriptor);

    // -------- Vertex/index buffers will be filled later --------
    // We'll create a dynamic buffer for all visible quads
    quadVertexBuffer = device.createBuffer({size:65536*4*3, usage:GPUBufferUsage.VERTEX|GPUBufferUsage.COPY_DST});
    quadIndexBuffer = device.createBuffer({size:65536*3*2, usage:GPUBufferUsage.INDEX|GPUBufferUsage.COPY_DST});
    
    // -------- Camera matrices --------
    function resize(){
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      swapChain = device.createSwapChain(&lt;HTMLElement>canvas, swapChainDescriptor);
      depthTexture = device.createTexture({
        size: [canvas.width, canvas.height],
        format: depthSwapChainFormat,
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.SAMPLED,
      });
      const aspect = canvas.width/canvas.height;
      const fov = Math.PI/4;
      const near = 0.1, far = 500;
      const f = 1/Math.tan(fov/2);
      projMat[0]=f/aspect; projMat[1]=0; projMat[2]=0; projMat[3]=0;
      projMat[4]=0; projMat[5]=f; projMat[6]=0; projMat[7]=0;
      projMat[8]=0; projMat[9]=0; projMat[10]=-(far+near)/(far-near); projMat[11]=-1;
      projMat[12]=0; projMat[13]=0; projMat[14]=-(2*far*near)/(far-near); projMat[15]=0;
      
      // view matrix
      updateViewMatrix();
    }
    resize();
    window.addEventListener('resize', resize);

    // -------- Uniforms struct (WGSL layout) --------
    // We'll use 5 buffers: projView, model, lightDir(time), fog/ambient, cameraPos
    // We'll just update the single uniformBuffer with new data each frame
    
    // Start render loop
    requestAnimationFrame(renderLoop);
  }

  // -------- Uniform data helpers --------
  const projMat = new Float32Array(16);
  const viewMat = new Float32Array(16);
  const dirUniform = new Float32Array(3);
  const fogColorUniform = new Float32Array(3);
  const ambientUniform = new Float32Array(3);
  const cameraPosUniform = new Float32Array(3);
  
  function updateViewMatrix(){
    const cx=cameraPos.x, cy=cameraPos.y, cz=cameraPos.z;
    const y = cameraPitch, p = cameraYaw;
    const cp=Math.cos(p), sp=Math.sin(p);
    const cyaw=Math.cos(y), syaw=Math.sin(y);
    // simple Earth-kamera: forward = (-syaw*cos(p), -sin(p), -cp*cos(p))
    // right = (cp, 0, -syaw)
    const cxm=Math.cos(cameraYaw), sxm=Math.sin(cameraYaw);
    viewMat[0]=cxm; viewMat[1]=0; viewMat[2]=sxm; viewMat[3]=0;
    viewMat[4]=0; viewMat[5]=1; viewMat[6]=0; viewMat[7]=0;
    viewMat[8]=-sxm*cy; viewMat[9]=sy; viewMat[10]=-cxm*cy; viewMat[11]=0;
    viewMat[12]=-(cxm*cx*cy); viewMat[13]=-cy; viewMat[14]=-(sxm*cx*cy); viewMat[15]=1;
    // Actually let's use a proper look-at
    const target = {x:cx + cxm*Math.cos(p), y:cy + Math.sin(p), z:cz + sxm*Math.cos(p)};
    const up = {x:0, y:1, z:0};
    // compute view manually
    const f = {x:target.x-cx, y:target.y-cy, z:target.z-cz};
    const len = Math.sqrt(f.x*f.x+f.y*f.y+f.z*f.z);
    f.x/=len; f.y/=len; f.z/=len;
    const u = {x:up.x, y:up.y, z:up.z};
    const r = {x:u.y*f.z-u.z*f.y, y:u.z*f.x-u.x*f.z, z:u.x*f.y-u.y*f.x};
    const u2 = {x:r.y*f.z-r.z*f.y, y:r.z*f.x-r.x*f.z, z:r.x*f.y-r.y*f.x};
    // build view matrix column-major (WebGPU expects column-major? We'll match our proj code)
    // We'll just use a simple perspective*lookAt via matrix mult; for brevity we'll premultiply later.
    // Let's just set a basic view:
    // viewMat will be computed in render loop via lookAt function below.
  }
  function buildViewMatrix(){
    const eyex=cameraPos.x, eyey=cameraPos.y, eyez=cameraPos.z;
    const targetX = eyex + Math.cos(cameraYaw)*Math.cos(cameraPitch);
    const targetY = eyey + Math.sin(cameraPitch);
    const targetZ = eyez + Math.sin(cameraYaw)*Math.cos(cameraPitch);
    const f = {x:targetX-eyex, y:targetY-eyey, z:targetZ-eyez};
    const len = Math.sqrt(f.x*f.x+f.y*f.y+f.z*f.z);
    f.x/=len; f.y/=len; f.z/=len;
    const u = {x:0, y:1, z:0};
    const r = {x:u.y*f.z-u.z*f.y, y:u.z*f.x-u.x*f.z, z:u.x*f.y-u.y*f.x};
    const u2 = {x:r.y*f.z-r.z*f.y, y:r.z*f.x-r.x*f.z, z:r.x*f.y-r.y*f.x};
    // column-major view: right, up, -f, pos
    // WebGPU expects columns: column0=right, column1=up, column2=-f, column3=-dot(right,eye) etc.
    // Let's just fill a simple matrix we'll use for projView mult
    // We'll actually use a premade lookAt function below via JS multiplication
    // For now just set identity; we'll compute proper in render loop
    // Actually I'll compute projView via a helper below
  }

  // -------- World generation --------
  const BLOCK_SIZE = 1;
  const blockTypes = {
    AIR:0, GRASS:1, DIRT:2, STONE:3, WOOD:4, GLASS:5, TORCH:6, LAVA:7, WATER:8, SNOW:9, LEAVES:10, ROOF:11,
    // colors mapped later
  };
  let blockMap = new Map(); // key=`x,y,z` -> type
  let worldCenter = {x:0, y:30, z:0};
  
  function hashBlock(x,y,z){ return `${x},${y},${z}`; }
  
  function setBlock(x,y,z,type){
    if (type===blockTypes.AIR){ blockMap.delete(hashBlock(x,y,z)); return; }
    blockMap.set(hashBlock(x,y,z), type);
  }
  function getBlock(x,y,z){
    return blockMap.get(hashBlock(x,y,z))||blockTypes.AIR;
  }
  
  // generate terrain + structures
  function genWorld(){
    // terrain radius 120
    for(let x=-120; x<=120; x++){
      for(let z=-120; z<=120; z++){
        const h = Math.floor(30 + 12*Math.sin(x*0.05)*Math.cos(z*0.05) + 8*Math.random());
        // top layer
        for(let y=h; y>=Math.max(0,h-3); y--){
          const t = y===h ? blockTypes.GRASS : (y===h-1 ? blockTypes.DIRT : blockTypes.STONE);
          setBlock(x,y,z,t);
        }
        // random ore veins
        if(Math.random()<0.1){
          const vx=x+Math.floor(Math.random()*5)-2;
          const vz=z+Math.floor(Math.random()*5)-2;
          for(let k=0;k<3;k++) setBlock(vx,h-2+k,z,blockTypes.STONE);
        }
      }
    }
    // -------- Castle complex --------
    // keep at (100,35,100)
    function castleKeep(cx,cz){
      // base platform
      for(let dx=-20; dx<=20; dx++) for(let dz=-20; dz<=20; dz++) setBlock(cx+dx,38,cz+dz,blockTypes.STONE);
      // walls 6 high
      for(let dx=-18; dx<=18; dx++) for(let dz=-18; dz<=18; dz++) if(Math.abs(dx)>17||Math.abs(dz)>17)
        for(let dy=0; dy<6; dy++) setBlock(cx+dx,38+dy,cz+dz,blockTypes.STONE);
      // towers corners
      for(let tx=[-17,17], tz=[-17,17]; tx.length;){
        const txv=tx.pop(), tzv=tz.pop();
        for(let dy=0; dy<8; dy++) for(let dx=-3; dx<=3; dx++) for(let dz=-3; dz<=3; dz++) setBlock(cx+txv+dx,38+dy,cz+tzv+dz,blockTypes.STONE);
      }
      // battlements (parapet)
      for(let dx=-18; dx<=18; dx++) for(let dz=-18; dz<=18; dz++) if(Math.abs(dx)==18||Math.abs(dz)==18)
        for(let dy=5; dy<7; dy++) setBlock(cx+dx,38+dy,cz+dz,blockTypes.ROOF);
      // gatehouse
      for(let dx=-5; dx<=5; dx++) for(let dz=-5; dz<=5; dz++) for(let dy=0; dy<8; dy++) setBlock(cx+dx,38+dy,cz+dz,blockTypes.STONE);
      // door opening
      setBlock(cx,38,cz+5,blockTypes.AIR); setBlock(cx,39,cz+5,blockTypes.AIR);
      // flags
      for(let fx=[-3,3], fz=[-1]; fx.length;){
        const fxv=fx.pop(), fzv=fzv.pop();
        for(let dy=0; dy<3; dy++) setBlock(cx+fxv,40+dy,cz+fzv+2,blockTypes.ROOF); // flag pole
        setBlock(cx+fxv>0?cx+3:cx-3,43,cz+fzv,blockTypes.ROOF); // flag top
      }
      // chapel small
      for(let dx=-8; dx<=8; dx++) for(let dz=-8; dz<=8; dz++) for(let dy=0; dy<5; dy++) setBlock(cx+dx,40+dy,cz+dz,blockTypes.STONE);
      // windows glass
      for(let wx=[-7,7], wy=[-3,3], wz=[-7,-6,-5,-4]; wx.length;){
        const wxv=wx.pop(); const wzv=wz.pop();
        for(let wyv=0; wyv<=wy; wyv++) setBlock(cx+wxv,42+wyv,cz+wzv,blockTypes.GLASS);
      }
      // royal keep tower central
      for(let kx=-10; kx<=10; kx++) for(let kz=-10; kz<=10; kz++) for(let ky=0; ky<15; ky++) setBlock(cx+kx,40+ky,cz+kz,blockTypes.STONE);
      // keep windows
      for(let kx=[-9,-8,8,9], ky=[2,13], kz=[0]; kx.length;){
        const kxv=kx.pop(); const kyv=ky.pop();
        setBlock(cx+kxv,40+kyv,cz+kz,blockTypes.GLASS);
      }
    }
    castleKeep(100,100);
    
    // -------- Village by river --------
    // curved river from (-80,0) to (100,50) param t
    function riverCurve(t){ return {-80+1.8*t, 30, -20+0.3*t*t}; }
    for(let i=0; i<=30; i++){
      const t = i/30;
      const pos = riverCurve(t);
      const hx = Math.cos(t*Math.PI)*30; const hz = Math.sin(t*Math.PI)*20;
      // houses
      if(i%5===0){
        const hx2 = pos.x + (Math.random()-0.5)*15;
        const hz2 = pos.z + (Math.random()-0.5)*15;
        // house base 6x4
        for(let dx=-3; dx<=3; dx++) for(let dz=-2; dz<=2; dz++) for(let dy=0; dy<4; dy++) setBlock(hx2+dx,35+dy,hz2+dz,blockTypes.DIRT);
        for(let dx=-3; dx<=3; dx++) for(let dz=-2; dz<=2; dz++) setBlock(hx2+dx,38+dy,hz2+dz,blockTypes.WOOD); // roof
        // window
        setBlock(hx2,38,hz2+1,blockTypes.GLASS);
        setBlock(hx2,38,hz2-1,blockTypes.GLASS);
        // door
        setBlock(hx2-3,38,hz2,blockTypes.AIR);
      }
      // blacksmith
      if(i===15){
        for(let dx=-4; dx<=4; dx++) for(let dz=-4; dz<=4; dz++) for(let dy=0; dy<5; dy++) setBlock(pos.x+dx,35+dy,pos.z+dz,blockTypes.STONE);
        // furnace window
        setBlock(pos.x,38,pos.z,blockTypes.GLASS);
      }
      // tavern
      if(i===20){
        for(let dx=-5; dx<=5; dx++) for(let dz=-5; dz<=5; dz++) for(let dy=0; dy<4; dy++) setBlock(pos.x+dx,36+dy,pos.z+dz,blockTypes.WOOD);
        setBlock(pos.x,38,pos.z+2,blockTypes.GLASS);
      }
      // farm plots
      if(i===2||i===28){
        for(let fx=-2; fx<=2; fx++) for(let fz=-2; fz<=2; fz++) setBlock(pos.x+fx,34,pos.z+fz,blockTypes.GRASS);
        // well
        setBlock(pos.x,34,pos.z,blockTypes.STONE); setBlock(pos.x,35,pos.z,blockTypes.AIR); // well hole
      }
    }
    
    // -------- Volcano far side --------
    // peak at ( -150, 80, -100 )
    for(let x=-200; x<=0; x++){
      for(let z=-150; z<=0; z++){
        const dx=x+150, dz=z+100;
        const dist = Math.sqrt(dx*dx+dz*dz);
        if(dist>80) continue;
        const h = Math.floor(80 - dist*0.8);
        if(h>50){
          for(let y=h; y>=Math.max(50,h-4); y--) setBlock(x,y,z,blockTypes.STONE);
          if(y===h) setBlock(x,y,z,blockTypes.SNOW);
        } else if(h>20){
          for(let y=h; y>=h-3; y--) setBlock(x,y,z,blockTypes.BASALT); // we'll use STONE dark but imagine basalt
        } else {
          // lava pool
          if(Math.random()<0.15 && h<15) setBlock(x,15,z,blockTypes.LAVA);
          // dead tree
          if(Math.random()<0.05 && h<10) { setBlock(x,10,z,blockTypes.WOOD); setBlock(x,11,z,blockTypes.LEAVES); }
        }
      }
    }
    // lava glow pillars
    for(let i=0;i<5;i++){ const x=-150+Math.random()*50, z=-100+Math.random()*50; setBlock(x,20,z,blockTypes.LAVA); }
    
    // -------- Forests --------
    for(let i=0;i<12;i++){
      const tx = (Math.random()-0.5)*200;
      const tz = (Math.random()-0.5)*200;
      const ty = 30;
      // trunk
      for(let dy=0; dy<7; dy++) setBlock(tx, ty+dy, tz, blockTypes.WOOD);
      // leaves sphere
      for(let rx=-4; rx<=4; rx++) for(let rz=-4; rz<=4; rz++) for(let ry=0; ry<=4; ry++) if(rx*rx+rz*rz+(ry-2)*(ry-2)<=16) setBlock(tx+rx, ty+ry, tz+rz, blockTypes.LEAVES);
    }
    
    // -------- Bridges, fences, watermill --------
    // stone bridge over river near castle
    for(let bx=-10; bx<=10; bx++) for(let bz=-5; bz<=5; bz++) setBlock(80+bx,38,bz,blockTypes.STONE);
    for(let bx=-8; bx<=8; bx++) setBlock(80+bx,37,bz,blockTypes.WOOD); // bridge rail
    
    // watermill at river curve i=10 position ~(-64,30,-50)
    const wmX=-64, wmZ=-50;
