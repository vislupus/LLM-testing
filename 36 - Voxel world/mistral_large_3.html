                    format: 'float32x3',
                    offset: 0,
                    shaderLocation: 0
                }]
            };

            const colorBufferLayout = {
                arrayStride: 16, // 4 floats * 4 bytes each
                attributes: [{
                    format: 'float32x4',
                    offset: 0,
                    shaderLocation: 1
                }]
            };

            const emissiveBufferLayout = {
                arrayStride: 12, // 3 floats * 4 bytes each
                attributes: [{
                    format: 'float32x3',
                    offset: 0,
                    shaderLocation: 2
                }]
            };

            // Create shader modules
            const shaderModule = device.createShaderModule({
                code: `
                    struct Uniforms {
                        viewProjMatrix: mat4x4<f32>,
                        time: f32,
                        cameraPosition: vec3<f32>,
                        fogColor: vec3<f32>,
                        fogNear: f32,
                        fogFar: f32,
                        bloomThreshold: f32,
                        bloomStrength: f32
                    };

                    @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                    @group(0) @binding(1) var textureSampler: sampler;
                    @group(0) @binding(2) var colorTexture: texture_2d<f32>;
                    @group(0) @binding(3) var bloomTexture: texture_2d<f32>;

                    struct VertexInput {
                        @location(0) position: vec3<f32>,
                        @location(1) color: vec4<f32>,
                        @location(2) emissive: vec3<f32>
                    };

                    struct VertexOutput {
                        @builtin(position) clipPosition: vec4<f32>,
                        @location(0) worldPosition: vec3<f32>,
                        @location(1) color: vec4<f32>,
                        @location(2) emissive: vec3<f32>,
                        @location(3) @interpolate(flat) isEmissive: u32
                    };

                    @vertex
                    fn vertexMain(input: VertexInput) -> VertexOutput {
                        var output: VertexOutput;
                        output.clipPosition = uniforms.viewProjMatrix * vec4<f32>(input.position, 1.0);
                        output.worldPosition = input.position;
                        output.color = input.color;

                        // Animate water and lava
                        if (input.color.a < 1.0) {
                            let wave = sin(input.position.x * 0.1 + uniforms.time * 2.0) *
                                       cos(input.position.z * 0.1 + uniforms.time * 2.0) * 0.1;
                            output.clipPosition.y += wave;
                            output.worldPosition.y += wave;
                        }

                        output.emissive = input.emissive;
                        output.isEmissive = u32(input.emissive.x > 0.0 || input.emissive.y > 0.0 || input.emissive.z > 0.0);
                        return output;
                    }

                    @fragment
                    fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
                        // Calculate fog
                        let fogDistance = length(input.worldPosition - uniforms.cameraPosition);
                        let fogFactor = clamp((fogDistance - uniforms.fogNear) / (uniforms.fogFar - uniforms.fogNear), 0.0, 1.0);
                        let fogColor = mix(input.color.rgb, uniforms.fogColor, fogFactor);

                        // Apply bloom threshold
                        let brightness = dot(fogColor, vec3<f32>(0.299, 0.587, 0.114));
                        let bloomColor = vec3<f32>(0.0);
                        if (brightness > uniforms.bloomThreshold) {
                            bloomColor = fogColor * uniforms.bloomStrength;
                        }

                        // For emissive objects, add their emissive color
                        if (input.isEmissive != 0) {
                            fogColor += input.emissive;
                            bloomColor += input.emissive * uniforms.bloomStrength;
                        }

                        // Sample bloom texture for final composition
                        let texColor = textureSample(colorTexture, textureSampler, input.clipPosition.xy / input.clipPosition.w);
                        let bloomSample = textureSample(bloomTexture, textureSampler, input.clipPosition.xy / input.clipPosition.w);

                        // Combine with bloom
                        let finalColor = fogColor + bloomSample.rgb * 0.5;

                        return vec4<f32>(finalColor, input.color.a);
                    }
                `
            });

            // Create pipeline
            const pipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: shaderModule,
                    entryPoint: 'vertexMain',
                    buffers: [vertexBufferLayout, colorBufferLayout, emissiveBufferLayout]
                },
                fragment: {
                    module: shaderModule,
                    entryPoint: 'fragmentMain',
                    targets: [{
                        format: format,
                        blend: {
                            color: {
                                srcFactor: 'src-alpha',
                                dstFactor: 'one-minus-src-alpha',
                                operation: 'add'
                            },
                            alpha: {
                                srcFactor: 'one',
                                dstFactor: 'one-minus-src-alpha',
                                operation: 'add'
                            }
                        }
                    }]
                },
                primitive: {
                    topology: 'triangle-list',
                    cullMode: 'back'
                },
                depthStencil: {
                    format: 'depth24plus',
                    depthWriteEnabled: true,
                    depthCompare: 'less'
                }
            });

            // Create depth texture
            const depthTexture = device.createTexture({
                size: [width, height],
                format: 'depth24plus',
                usage: GPUTextureUsage.RENDER_ATTACHMENT
            });

            // Create uniform buffer
            const uniformBufferSize = 4 * (16 + 1 + 3 + 3 + 1 + 1 + 1 + 1); // viewProjMatrix + time + cameraPosition + fogColor + fogNear + fogFar + bloomThreshold + bloomStrength
            const uniformBuffer = device.createBuffer({
                size: uniformBufferSize,
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
            });

            // Create uniform bind group
            const uniformBindGroupLayout = pipeline.getBindGroupLayout(0);
            let uniformBindGroup;

            // Create textures for post-processing
            const colorTexture = device.createTexture({
                size: [width, height],
                format: format,
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
            });

            const colorTextureView = colorTexture.createView();

            const bloomTexture = device.createTexture({
                size: [width, height],
                format: format,
                usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
            });

            const bloomTextureView = bloomTexture.createView();

            // Create sampler
            const sampler = device.createSampler({
                magFilter: 'linear',
                minFilter: 'linear'
            });

            // Create bloom pipeline
            const bloomPipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: device.createShaderModule({
                        code: `
                            @vertex
                            fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4<f32> {
                                let pos = array(
                                    vec2<f32>(-1.0, -1.0),
                                    vec2<f32>(-1.0,  1.0),
                                    vec2<f32>( 1.0, -1.0),
                                    vec2<f32>( 1.0,  1.0),
                                    vec2<f32>(-1.0,  1.0),
                                    vec2<f32>( 1.0, -1.0)
                                );
                                return vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                            }
                        `
                    }),
                    entryPoint: 'vertexMain'
                },
                fragment: {
                    module: device.createShaderModule({
                        code: `
                            @group(0) @binding(0) var textureSampler: sampler;
                            @group(0) @binding(1) var colorTexture: texture_2d<f32>;

                            @fragment
                            fn fragmentMain(@builtin(position) pos: vec4<f32>) -> @location(0) vec4<f32> {
                                let uv = pos.xy / vec2<f32>(textureDimensions(colorTexture));
                                let color = textureSample(colorTexture, textureSampler, uv);

                                // Simple bloom effect - just blur bright areas
                                let sum = vec3<f32>(0.0);
                                let samples = 0.0;

                                for (var x = -2; x <= 2; x++) {
                                    for (var y = -2; y <= 2; y++) {
                                        let offset = vec2<f32>(f32(x), f32(y)) / vec2<f32>(textureDimensions(colorTexture));
                                        let sampleColor = textureSample(colorTexture, textureSampler, uv + offset);
                                        let brightness = dot(sampleColor.rgb, vec3<f32>(0.299, 0.587, 0.114));

                                        if (brightness > 0.8) {
                                            sum += sampleColor.rgb;
                                            samples += 1.0;
                                        }
                                    }
                                }

                                if (samples > 0.0) {
                                    sum /= samples;
                                }

                                return vec4<f32>(sum, 1.0);
                            }
                        `
                    }),
                    entryPoint: 'fragmentMain',
                    targets: [{
                        format: format
                    }]
                },
                primitive: {
                    topology: 'triangle-list'
                }
            });

            // Create bloom bind group
            const bloomBindGroup = device.createBindGroup({
                layout: bloomPipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: sampler },
                    { binding: 1, resource: colorTextureView }
                ]
            });

            // Create final pipeline
            const finalPipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: device.createShaderModule({
                        code: `
                            @vertex
                            fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4<f32> {
                                let pos = array(
                                    vec2<f32>(-1.0, -1.0),
                                    vec2<f32>(-1.0,  1.0),
                                    vec2<f32>( 1.0, -1.0),
                                    vec2<f32>( 1.0,  1.0),
                                    vec2<f32>(-1.0,  1.0),
                                    vec2<f32>( 1.0, -1.0)
                                );
                                return vec4<f32>(pos[vertexIndex], 0.0, 1.0);
                            }
                        `
                    }),
                    entryPoint: 'vertexMain'
                },
                fragment: {
                    module: device.createShaderModule({
                        code: `
                            @group(0) @binding(0) var textureSampler: sampler;
                            @group(0) @binding(1) var colorTexture: texture_2d<f32>;
                            @group(0) @binding(2) var bloomTexture: texture_2d<f32>;

                            @fragment
                            fn fragmentMain(@builtin(position) pos: vec4<f32>) -> @location(0) vec4<f32> {
                                let uv = pos.xy / vec2<f32>(textureDimensions(colorTexture));
                                let color = textureSample(colorTexture, textureSampler, uv);
                                let bloom = textureSample(bloomTexture, textureSampler, uv);

                                // Combine with bloom
                                let finalColor = color.rgb + bloom.rgb * 0.5;

                                // Vignette effect
                                let vignette = 1.0 - dot(uv - 0.5, uv - 0.5) * 0.5;
                                finalColor *= vignette;

                                return vec4<f32>(finalColor, color.a);
                            }
                        `
                    }),
                    entryPoint: 'fragmentMain',
                    targets: [{
                        format: format
                    }]
                },
                primitive: {
                    topology: 'triangle-list'
                }
            });

            // Create final bind group
            const finalBindGroup = device.createBindGroup({
                layout: finalPipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: sampler },
                    { binding: 1, resource: colorTextureView },
                    { binding: 2, resource: bloomTextureView }
                ]
            });

            // Create vertex buffers for each chunk
            function createChunkBuffers(chunkId) {
                const mesh = createChunkMesh(chunkId);
                if (!mesh) return null;

                const vertexBuffer = device.createBuffer({
                    size: mesh.vertices.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true
                });
                new Float32Array(vertexBuffer.getMappedRange()).set(mesh.vertices);
                vertexBuffer.unmap();

                const colorBuffer = device.createBuffer({
                    size: mesh.colors.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true
                });
                new Float32Array(colorBuffer.getMappedRange()).set(mesh.colors);
                colorBuffer.unmap();

                const emissiveBuffer = device.createBuffer({
                    size: mesh.emissives.byteLength,
                    usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true
                });
                new Float32Array(emissiveBuffer.getMappedRange()).set(mesh.emissives);
                emissiveBuffer.unmap();

                const indexBuffer = device.createBuffer({
                    size: mesh.indices.byteLength,
                    usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
                    mappedAtCreation: true
                });
                new Uint32Array(indexBuffer.getMappedRange()).set(mesh.indices);
                indexBuffer.unmap();

                return {
                    vertexBuffer,
                    colorBuffer,
                    emissiveBuffer,
                    indexBuffer,
                    vertexCount: mesh.vertexCount
                };
            }

            // Create chunk buffers
            const chunkBuffers = new Map();
            for (const chunkId of world.chunks.keys()) {
                const buffers = createChunkBuffers(chunkId);
                if (buffers) {
                    chunkBuffers.set(chunkId, buffers);
                }
            }

            // Particles for smoke, fire, etc.
            const particles = [];
            const volcanoSmoke = [];

            // Add some birds
            for (let i = 0; i < 20; i++) {
                particles.push({
                    position: [
                        Math.random() * 400 - 200,
                        50 + Math.random() * 50,
                        Math.random() * 400 - 200
                    ],
                    velocity: [
                        (Math.random() - 0.5) * 0.5,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.5
                    ],
                    size: 0.5 + Math.random() * 0.5,
                    color: [0.8, 0.8, 0.8, 1],
                    life: 1000,
                    type: 'bird'
                });
            }

            // Add some clouds
            for (let i = 0; i < 10; i++) {
                particles.push({
                    position: [
                        Math.random() * 800 - 400,
                        100 + Math.random() * 50,
                        Math.random() * 800 - 400
                    ],
                    velocity: [
                        (Math.random() - 0.5) * 0.1,
                        0,
                        (Math.random() - 0.5) * 0.1
                    ],
                    size: 20 + Math.random() * 30,
                    color: [0.9, 0.9, 0.95, 0.8],
                    life: 1000,
                    type: 'cloud'
                });
            }

            // Add some fireflies
            for (let i = 0; i < 50; i++) {
                particles.push({
                    position: [
                        Math.random() * 400 - 200,
                        10 + Math.random() * 30,
                        Math.random() * 400 - 200
                    ],
                    velocity: [
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.2
                    ],
                    size: 0.2 + Math.random() * 0.3,
                    color: [0.8, 0.8, 0.2, 1],
                    life: 1000,
                    type: 'firefly'
                });
            }

            // Create particle buffers
            const particleVertices = new Float32Array(particles.length * 12);
            const particleColors = new Float32Array(particles.length * 16);
            const particleIndices = new Uint32Array(particles.length * 6);

            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];

                // Vertices (billboard)
                particleVertices.set([
                    -particle.size, -particle.size, 0,
                    particle.size, -particle.size, 0,
                    particle.size, particle.size, 0,
                    -particle.size, particle.size, 0
                ], i * 12);

                // Colors
                for (let j = 0; j < 4; j++) {
                    particleColors.set(particle.color, i * 16 + j * 4);
                }

                // Indices
                particleIndices.set([
                    i * 4, i * 4 + 1, i * 4 + 2,
                    i * 4, i * 4 + 2, i * 4 + 3
                ], i * 6);
            }

            const particleVertexBuffer = device.createBuffer({
                size: particleVertices.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                mappedAtCreation: true
            });
            new Float32Array(particleVertexBuffer.getMappedRange()).set(particleVertices);
            particleVertexBuffer.unmap();

            const particleColorBuffer = device.createBuffer({
                size: particleColors.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                mappedAtCreation: true
            });
            new Float32Array(particleColorBuffer.getMappedRange()).set(particleColors);
            particleColorBuffer.unmap();

            const particleIndexBuffer = device.createBuffer({
                size: particleIndices.byteLength,
                usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
                mappedAtCreation: true
            });
            new Uint32Array(particleIndexBuffer.getMappedRange()).set(particleIndices);
            particleIndexBuffer.unmap();

            // Particle pipeline
            const particlePipeline = device.createRenderPipeline({
                layout: 'auto',
                vertex: {
                    module: device.createShaderModule({
                        code: `
                            struct Uniforms {
                                viewProjMatrix: mat4x4<f32>,
                                time: f32,
                                cameraPosition: vec3<f32>
                            };

                            @group(0) @binding(0) var<uniform> uniforms: Uniforms;

                            struct VertexInput {
                                @location(0) position: vec3<f32>,
                                @location(1) color: vec4<f32>
                            };

                            struct VertexOutput {
                                @builtin(position) clipPosition: vec4<f32>,
                                @location(0) color: vec4<f32>,
                                @location(1) worldPosition: vec3<f32>
                            };

                            @vertex
                            fn vertexMain(input: VertexInput, @builtin(instance_index) instanceIndex: u32) -> VertexOutput {
                                var output: VertexOutput;

                                // Get particle data (would normally use storage buffers)
                                let particlePosition = vec3<f32>(
                                    ${particles.map(p => p.position[0]).join(', ')},
                                    ${particles.map(p => p.position[1]).join(', ')},
                                    ${particles.map(p => p.position[2]).join(', ')}
                                );

                                let particleSize = f32(${particles.map(p => p.size).join(', ')});
                                let particleType = u32(${particles.map(p => p.type === 'bird' ? 0 : p.type === 'cloud' ? 1 : 2).join(', ')});

                                // Billboard the particle
                                let cameraRight = normalize(vec3<f32>(uniforms.viewProjMatrix[0].xyz));
                                let cameraUp = normalize(vec3<f32>(uniforms.viewProjMatrix[1].xyz));

                                let worldPosition = particlePosition;
                                let worldSize = particleSize;

                                // Animate based on type
                                if (particleType == 0u) { // Bird
                                    worldPosition.y += sin(uniforms.time * 2.0 + f32(instanceIndex) * 0.5) * 0.5;
                                    worldSize *= 0.8 + sin(uniforms.time * 3.0 + f32(instanceIndex)) * 0.2;
                                } else if (particleType == 1u) { // Cloud
                                    worldSize *= 1.0 + sin(uniforms.time * 0.5 + f32(instanceIndex)) * 0.1;
                                } else { // Firefly
                                    worldPosition += vec3<f32>(
                                        sin(uniforms.time * 2.0 + f32(instanceIndex)) * 0.5,
                                        sin(uniforms.time * 3.0 + f32(instanceIndex)) * 0.3,
                                        cos(uniforms.time * 2.0 + f32(instanceIndex)) * 0.5
                                    );
                                }

                                let vertexPosition = worldPosition +
                                    cameraRight * input.position.x * worldSize +
                                    cameraUp * input.position.y * worldSize;

                                output.clipPosition = uniforms.viewProjMatrix * vec4<f32>(vertexPosition, 1.0);
                                output.color = input.color;
                                output.worldPosition = vertexPosition;

                                return output;
                            }
                        `
                    }),
                    entryPoint: 'vertexMain',
                    buffers: [
                        {
                            arrayStride: 12,
                            attributes: [{
                                format: 'float32x3',
                                offset: 0,
                                shaderLocation: 0
                            }]
                        },
                        {
                            arrayStride: 16,
                            attributes: [{
                                format: 'float32x4',
                                offset: 0,
                                shaderLocation: 1
                            }]
                        }
                    ]
                },
                fragment: {
                    module: device.createShaderModule({
                        code: `
                            @fragment
                            fn fragmentMain(@location(0) color: vec4<f32>) -> @location(0) vec4<f32> {
                                return color;
                            }
                        `
                    }),
                    entryPoint: 'fragmentMain',
                    targets: [{
                        format: format,
                        blend: {
                            color: {
                                srcFactor: 'src-alpha',
                                dstFactor: 'one-minus-src-alpha',
                                operation: 'add'
                            },
                            alpha: {
                                srcFactor: 'one',
                                dstFactor: 'one-minus-src-alpha',
                                operation: 'add'
                            }
                        }
                    }]
                },
                primitive: {
                    topology: 'triangle-list',
                    cullMode: 'none'
                }
            });

            // Particle uniform buffer
            const particleUniformBuffer = device.createBuffer({
                size: 4 * (16 + 1 + 3), // viewProjMatrix + time + cameraPosition
                usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
            });

            // Particle bind group
            const particleBindGroup = device.createBindGroup({
                layout: particlePipeline.getBindGroupLayout(0),
                entries: [
                    { binding: 0, resource: { buffer: particleUniformBuffer } }
                ]
            });

            // Game state
            let lastTime = 0;
            let frameCount = 0;
            let bloomEnabled = true;
            let fogEnabled = true;
            let time = 0;

            // Initial camera position for cinematic start
            camera.position = [0, 150, 200];
            camera.target = [0, 50, 0];
            camera.mode = 'orbit';
            camera.orbitDistance = 250;
            camera.orbitAngle = [0.5, 0.0];

            // Animation loop
            function frame(currentTime) {
                const deltaTime = (currentTime - lastTime) / 1000;
                lastTime = currentTime;
                time += deltaTime;
                frameCount++;

                // Update time of day
                timeOfDay.update();
                const timeOfDayValue = timeOfDay.current;

                // Update camera
                if (camera.mode === 'fly' || camera.mode === 'walk') {
                    const moveSpeed = camera.speed * (keys['shift'] ? 2 : 1) * (keys['control'] ? 0.5 : 1);

                    if (keys['w']) {
                        camera.position[0] += camera.forward[0] * moveSpeed;
                        camera.position[2] += camera.forward[2] * moveSpeed;
                    }
                    if (keys['s']) {
                        camera.position[0] -= camera.forward[0] * moveSpeed;
                        camera.position[2] -= camera.forward[2] * moveSpeed;
                    }
                    if (keys['a']) {
                        camera.position[0] -= camera.right[0] * moveSpeed;
                        camera.position[2] -= camera.right[2] * moveSpeed;
                    }
                    if (keys['d']) {
                        camera.position[0] += camera.right[0] * moveSpeed;
                        camera.position[2] += camera.right[2] * moveSpeed;
                    }
                    if (keys[' ']) {
                        camera.position[1] += moveSpeed;
                    }
                    if (keys['shift']) {
                        camera.position[1] -= moveSpeed;
                    }

                    if (camera.mode === 'walk') {
                        camera.position[1] = getHeightAt(camera.position[0], camera.position[2]) + 1.8;
                    }

                    camera.updateViewMatrix();
                }

                // Update particles
                for (let i = 0; i < particles.length; i++) {
                    const particle = particles[i];

                    // Update position
                    particle.position[0] += particle.velocity[0] * deltaTime * 10;
                    particle.position[1] += particle.velocity[1] * deltaTime * 10;
                    particle.position[2] += particle.velocity[2] * deltaTime * 10;

                    // Update life
                    particle.life -= deltaTime * 1000;

                    // Reset particles that are out of bounds or dead
                    if (particle.life <= 0 ||
                        particle.position[0] < -400 || particle.position[0] > 400 ||
                        particle.position[2] < -400 || particle.position[2] > 400) {

                        if (particle.type === 'bird') {
                            particle.position = [
                                Math.random() * 400 - 200,
                                50 + Math.random() * 50,
                                Math.random() * 400 - 200
                            ];
                            particle.velocity = [
                                (Math.random() - 0.5) * 0.5,
                                (Math.random() - 0.5) * 0.1,
                                (Math.random() - 0.5) * 0.5
                            ];
                        } else if (particle.type === 'cloud') {
                            particle.position = [
                                Math.random() * 800 - 400,
                                100 + Math.random() * 50,
                                Math.random() * 800 - 400
                            ];
                            particle.velocity = [
                                (Math.random() - 0.5) * 0.1,
                                0,
                                (Math.random() - 0.5) * 0.1
                            ];
                        } else if (particle.type === 'firefly') {
                            particle.position = [
                                Math.random() * 400 - 200,
                                10 + Math.random() * 30,
                                Math.random() * 400 - 200
                            ];
                            particle.velocity = [
                                (Math.random() - 0.5) * 0.2,
                                (Math.random() - 0.5) * 0.1,
                                (Math.random() - 0.5) * 0.2
                            ];
                        }

                        particle.life = 1000;
                    }
                }

                // Update volcano smoke
                for (let i = 0; i < volcanoSmoke.length; i++) {
                    const smoke = volcanoSmoke[i];

                    smoke.position[0] += smoke.velocity[0] * deltaTime;
                    smoke.position[1] += smoke.velocity[1] * deltaTime;
                    smoke.position[2] += smoke.velocity[2] * deltaTime;

                    smoke.size += deltaTime * 0.5;
                    smoke.life -= deltaTime * 1000;

                    if (smoke.life <= 0) {
                        volcanoSmoke.splice(i, 1);
                        i--;
                    }
                }

                // Add new volcano smoke
                if (Math.random() < 0.1) {
                    volcanoSmoke.push({
                        position: [-150, 110, 0],
                        velocity: [
                            (Math.random() - 0.5) * 0.5,
                            0.5 + Math.random() * 0.5,
                            (Math.random() - 0.5) * 0.5
                        ],
                        size: 2 + Math.random() * 3,
                        life: 5000 + Math.random() * 5000,
                        color: [0.3, 0.3, 0.3, 0.5]
                    });
                }

                // Update chunk meshes if needed
                if (world.chunkNeedsUpdate.size > 0) {
                    for (const chunkId of world.chunkNeedsUpdate) {
                        const buffers = createChunkBuffers(chunkId);
                        if (buffers) {
                            chunkBuffers.set(chunkId, buffers);
                        }
                    }
                    world.chunkNeedsUpdate.clear();
                }

                // Update uniforms
                const viewProjMatrix = camera.getViewProjectionMatrix();
                const fogColor = getFogColor(timeOfDayValue);
                const fogNear = 50;
                const fogFar = 300;

                const uniformData = new Float32Array([
                    ...viewProjMatrix,
                    time,
                    ...camera.position,
                    ...fogColor,
                    fogNear,
                    fogFar,
                    bloomEnabled ? 0.8 : 100.0, // bloom threshold
                    bloomEnabled ? 1.0 : 0.0    // bloom strength
                ]);

                device.queue.writeBuffer(uniformBuffer, 0, uniformData);

                // Update particle uniforms
                const particleUniformData = new Float32Array([
                    ...viewProjMatrix,
                    time,
                    ...camera.position
                ]);

                device.queue.writeBuffer(particleUniformBuffer, 0, particleUniformData);

                // Create command encoder
                const commandEncoder = device.createCommandEncoder();

                // First pass - render scene to color texture
                const colorPassDescriptor = {
                    colorAttachments: [{
                        view: colorTextureView,
                        clearValue: { r: fogColor[0], g: fogColor[1], b: fogColor[2], a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store'
                    }],
                    depthStencilAttachment: {
                        view: depthTexture.createView(),
                        depthClearValue: 1.0,
                        depthLoadOp: 'clear',
                        depthStoreOp: 'store'
                    }
                };

                const colorPass = commandEncoder.beginRenderPass(colorPassDescriptor);

                // Render chunks
                colorPass.setPipeline(pipeline);

                if (!uniformBindGroup) {
                    uniformBindGroup = device.createBindGroup({
                        layout: uniformBindGroupLayout,
                        entries: [
                            { binding: 0, resource: { buffer: uniformBuffer } },
                            { binding: 1, resource: sampler },
                            { binding: 2, resource: colorTextureView },
                            { binding: 3, resource: bloomTextureView }
                        ]
                    });
                }

                colorPass.setBindGroup(0, uniformBindGroup);

                for (const [chunkId, buffers] of chunkBuffers) {
                    colorPass.setVertexBuffer(0, buffers.vertexBuffer);
                    colorPass.setVertexBuffer(1, buffers.colorBuffer);
                    colorPass.setVertexBuffer(2, buffers.emissiveBuffer);
                    colorPass.setIndexBuffer(buffers.indexBuffer, 'uint32');
                    colorPass.drawIndexed(buffers.vertexCount);
                }

                // Render particles
                colorPass.setPipeline(particlePipeline);
                colorPass.setBindGroup(0, particleBindGroup);
                colorPass.setVertexBuffer(0, particleVertexBuffer);
                colorPass.setVertexBuffer(1, particleColorBuffer);
                colorPass.setIndexBuffer(particleIndexBuffer, 'uint32');
                colorPass.drawIndexed(particleIndices.length, particles.length);

                colorPass.end();

                // Second pass - bloom
                if (bloomEnabled) {
                    const bloomPassDescriptor = {
                        colorAttachments: [{
                            view: bloomTextureView,
                            clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                            loadOp: 'clear',
                            storeOp: 'store'
                        }]
                    };

                    const bloomPass = commandEncoder.beginRenderPass(bloomPassDescriptor);
                    bloomPass.setPipeline(bloomPipeline);
                    bloomPass.setBindGroup(0, bloomBindGroup);
                    bloomPass.draw(6);
                    bloomPass.end();
                }

                // Third pass - final composition
                const finalPassDescriptor = {
                    colorAttachments: [{
                        view: context.getCurrentTexture().createView(),
                        clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
                        loadOp: 'clear',
                        storeOp: 'store'
                    }]
                };

                const finalPass = commandEncoder.beginRenderPass(finalPassDescriptor);
                finalPass.setPipeline(finalPipeline);
                finalPass.setBindGroup(0, finalBindGroup);
                finalPass.draw(6);
                finalPass.end();

                // Submit commands
                device.queue.submit([commandEncoder.finish()]);

                // Request next frame
                requestAnimationFrame(frame);
            }

            // Helper function to get fog color based on time of day
            function getFogColor(timeOfDay) {
                // Dawn
                if (timeOfDay < 0.25) {
                    const t = timeOfDay / 0.25;
                    return [
                        0.3 * t + 0.1 * (1 - t),
                        0.4 * t + 0.2 * (1 - t),
                        0.6 * t + 0.3 * (1 - t)
                    ];
                }
                // Day
                else if (timeOfDay < 0.5) {
                    const t = (timeOfDay - 0.25) / 0.25;
                    return [
                        0.3 * (1 - t) + 0.5 * t,
                        0.4 * (1 - t) + 0.7 * t,
                        0.6 * (1 - t) + 0.9 * t
                    ];
                }
                // Dusk
                else if (timeOfDay < 0.75) {
                    const t = (timeOfDay - 0.5) / 0.25;
                    return [
                        0.5 * (1 - t) + 0.8 * t,
                        0.7 * (1 - t) + 0.4 * t,
                        0.9 * (1 - t) + 0.2 * t
                    ];
                }
                // Night
                else {
                    const t = (timeOfDay - 0.75) / 0.25;
                    return [
                        0.8 * (1 - t) + 0.1 * t,
                        0.4 * (1 - t) + 0.1 * t,
                        0.2 * (1 - t) + 0.2 * t
                    ];
                }
            }

            // Start the animation loop
            loading.style.display = 'none';
            requestAnimationFrame(frame);
        }

        // Initialize
        init();
    </script>
</body>
