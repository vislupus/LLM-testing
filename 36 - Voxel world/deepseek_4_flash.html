<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voxeloria — Medieval Fantasy Voxel World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
            background: rgba(10, 10, 20, .7);
            padding: 10px 16px;
            border-radius: 16px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, .12);
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            max-width: 95vw;
        }
        #ui button {
            background: rgba(255, 255, 255, .15);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all .2s;
            white-space: nowrap;
        }
        #ui button:hover {
            background: rgba(255, 255, 255, .3);
            transform: scale(1.04);
        }
        #ui button.active {
            background: #ff9f43;
            color: #222;
            border-color: #ff9f43;
            font-weight: 600;
        }
        #ui .sep {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, .2);
            margin: 0 4px;
        }
        #info {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 10;
            font-size: 12px;
            background: rgba(0, 0, 0, .5);
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, .1);
            pointer-events: none;
            line-height: 1.5;
            backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, .9);
        }
        #info b {
            color: #ff9f43;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            z-index: 99;
            font-size: 20px;
            color: #ff9f43;
            flex-direction: column;
            gap: 14px;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, .2);
            border-top-color: #ff9f43;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        #err {
            color: #ff5555;
            font-size: 14px;
            padding: 20px;
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Generating voxel world…</div>
    </div>
    <canvas id="c"></canvas>
    <div id="info">
        <b>WASD</b> fly/walk · <b>Space</b> up · <b>Shift</b> down<br>
        <b>Mouse</b> look · <b>F</b> fly <b>G</b> walk <b>O</b> orbit<br>
        <b>1–4</b> time of day
    </div>
    <div id="ui">
        <button id="btn-dawn">🌅 Dawn</button>
        <button id="btn-day">☀️ Day</button>
        <button id="btn-dusk">🌇 Dusk</button>
        <button id="btn-night">🌙 Night</button>
        <div class="sep"></div>
        <button id="btn-fly">🕊️ Fly</button>
        <button id="btn-walk">🚶 Walk</button>
        <button id="btn-orbit">🌀 Orbit</button>
        <button id="btn-shot">📸 Showcase</button>
    </div>
    <script>
        (async function() {
            // ============ CONSTANTS ============
            const WS = 256,
                WH = 160,
                CS = 32,
                CHUNKS_X = Math.ceil(WS / CS),
                CHUNKS_Y = Math.ceil(WH / CS),
                CHUNKS_Z = Math.ceil(WS / CS);
            const WATER_LEVEL = 34;

            const B = {
                AIR: 0,
                GRASS: 1,
                DIRT: 2,
                STONE: 3,
                LOG: 4,
                PLANK: 5,
                LEAF: 6,
                WATER: 7,
                SAND: 8,
                SNOW: 9,
                BRICK: 10,
                STONEB: 11,
                ROOF: 12,
                GLASS: 13,
                LAVA: 14,
                BASALT: 15,
                PATH: 16,
                WHEAT: 17,
                REED: 18,
                LANTERN: 19,
                GLOW: 20,
                PLASTER: 21,
                WFRAME: 22,
                COBBLE: 23,
                FARM: 24,
                BASALT2: 25,
                VOLCROCK: 26
            };

            // ============ WORLD STATE ============
            let world = new Uint8Array(WS * WS * WH);
            let heightmap = new Float32Array(WS * WS);

            function gb(x, y, z) {
                if (x < 0 || y < 0 || z < 0 || x >= WS || y >= WH || z >= WS) return B.AIR;
                return world[(z * WS + x) * WH + y];
            }

            function sb(x, y, z, v) {
                if (x < 0 || y < 0 || z < 0 || x >= WS || y >= WH || z >= WS) return;
                world[(z * WS + x) * WH + y] = v;
            }

            function isSolid(t) {
                return t !== B.AIR && t !== B.WATER && t !== B.GLASS && t !== B.REED && t !== B.WHEAT;
            }
            function isOpaque(t) {
                return t !== B.AIR && t !== B.WATER && t !== B.GLASS && t !== B.REED && t !== B.WHEAT && t !== B.LANTERN;
            }

            // ============ NOISE ============
            function hash2(ix, iz, seed) {
                let h = (ix | 0) * 374761393 + (iz | 0) * 668265263 + seed * 1442695041;
                h = Math.imul(h ^ (h >>> 13), 1274126177);
                return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
            }

            function vnoise(x, z, seed) {
                let xi = Math.floor(x),
                    zi = Math.floor(z),
                    xf = x - xi,
                    zf = z - zi;
                xf = xf * xf * (3 - 2 * xf);
                zf = zf * zf * (3 - 2 * zf);
                let a = hash2(xi, zi, seed),
                    b = hash2(xi + 1, zi, seed),
                    c = hash2(xi, zi + 1, seed),
                    d = hash2(xi + 1, zi + 1, seed);
                return a + (b - a) * xf + (c - a) * zf + (a - b - c + d) * xf * zf;
            }

            function fbm(x, z, seed, oct) {
                let t = 0,
                    f = 1,
                    a = 1,
                    mx = 0;
                for (let i = 0; i < oct; i++) { t += vnoise(x * f, z * f, seed + i * 101) * a;
                    mx += a;
                    a *= .5;
                    f *= 2; }
                return t / mx;
            }

            function distSeg(px, pz, x1, z1, x2, z2) {
                let dx = x2 - x1,
                    dz = z2 - z1,
                    l2 = dx * dx + dz * dz;
                if (l2 < 0.001) return Math.hypot(px - x1, pz - z1);
                let t = Math.max(0, Math.min(1, ((px - x1) * dx + (pz - z1) * dz) / l2));
                return Math.hypot(px - (x1 + t * dx), pz - (z1 + t * dz));
            }

            // River path
            const RIVER = [
                [10, 60],
                [40, 80],
                [70, 95],
                [100, 110],
                [130, 130],
                [160, 150],
                [200, 180],
                [240, 220],
                [250, 250]
            ];

            function riverDist(x, z) {
                let md = 1e9;
                for (let i = 0; i < RIVER.length - 1; i++) {
                    md = Math.min(md, distSeg(x, z, RIVER[i][0], RIVER[i][1], RIVER[i + 1][0], RIVER[i + 1][1]));
                }
                return md;
            }

            // ============ TERRAIN GEN ============
            function terrainHeight(x, z) {
                let h = 30 + fbm(x * .008 + 100, z * .008 + 100, 42, 5) * 22;
                h += fbm(x * .03, z * .03, 77, 3) * 4;

                // Mountains north
                let dm = Math.hypot(x - 128, z - 10);
                let mnt = Math.max(0, 1 - dm / 90);
                h += mnt * mnt * 65 * vnoise(x * .02, z * .02, 5);

                // Volcano
                let dv = Math.hypot(x - 52, z - 45);
                if (dv < 55) {
                    let t = 1 - dv / 55;
                    h += t * t * 70;
                    if (dv < 18) {
                        let mouth = Math.max(0, 12 - dv);
                        h -= mouth * 1.2;
                        if (dv < 8) h = Math.max(h, 45);
                    }
                }

                // Castle hill
                let dc = Math.hypot(x - 185, z - 105);
                if (dc < 55) {
                    let t = 1 - dc / 55;
                    h += t * t * 32 + t * 3;
                    if (dc < 24) h = Math.min(h, 62);
                }

                // River valley
                let rd = riverDist(x, z);
                if (rd < 14) {
                    let t = 1 - rd / 14;
                    h -= t * t * 14;
                }

                // Village flatten
                let dvillage = Math.hypot(x - 135, z - 150);
                if (dvillage < 45) {
                    let t = Math.min(1, (45 - dvillage) / 45);
                    h = h * (1 - t * .8) + 42 * t * .8;
                }

                // Castle flatten
                if (dc < 24) {
                    let t = Math.min(1, (24 - dc) / 24);
                    h = h * (1 - t) + 60 * t;
                }

                return Math.floor(Math.max(2, Math.min(WH - 10, h)));
            }

            function surfaceBlock(x, z, h) {
                let dv = Math.hypot(x - 52, z - 45);
                if (dv < 40) return B.VOLCROCK;
                if (h > 68) return B.SNOW;
                if (h <= WATER_LEVEL + 2) return B.SAND;
                if (dv < 55) return B.BASALT;
                return B.GRASS;
            }

            function genTerrain() {
                for (let x = 0; x < WS; x++) {
                    for (let z = 0; z < WS; z++) {
                        let h = terrainHeight(x, z);
                        heightmap[z * WS + x] = h;
                        let surf = surfaceBlock(x, z, h);
                        for (let y = 0; y <= h; y++) {
                            let t = B.STONE;
                            if (y === h) t = surf;
                            else if (y === h - 1 && surf === B.GRASS) t = B.DIRT;
                            else if (y > h - 5 && surf !== B.SNOW && surf !== B.VOLCROCK && surf !== B.BASALT) t = B.DIRT;
                            else if (surf === B.VOLCROCK && y > h - 8) t = B.BASALT;
                            else if (surf === B.BASALT && y > h - 6) t = B.BASALT;
                            else if (surf === B.SNOW && y > h - 3) t = B.STONE;
                            // Lava in volcano mouth
                            if (dv < 10 && y > h - 3) t = B.LAVA;
                            sb(x, y, z, t);
                        }
                        // Water
                        if (h < WATER_LEVEL) {
                            for (let y = h + 1; y <= WATER_LEVEL; y++) {
                                sb(x, y, z, B.WATER);
                            }
                        }
                    }
                }

                // Riverbed sand
                for (let x = 0; x < WS; x++) {
                    for (let z = 0; z < WS; z++) {
                        let rd = riverDist(x, z);
                        if (rd < 12) {
                            let h = heightmap[z * WS + x];
                            for (let y = 0; y <= Math.min(h + 1, WATER_LEVEL); y++) {
                                if (gb(x, y, z) !== B.WATER) sb(x, y, z, B.SAND);
                            }
                        }
                    }
                }
            }

            // ============ STRUCTURES ============
            function fillBox(x0, y0, z0, x1, y1, z1, t) {
                for (let x = x0; x <= x1; x++)
                    for (let y = y0; y <= y1; y++)
                        for (let z = z0; z <= z1; z++)
                            sb(x, y, z, t);
            }

            function spiralHouse(x, z, rot, hw) {
                let g = Math.floor(heightmap[z * WS + x]);
                let w = 4 + Math.floor(Math.random() * 3),
                    d = 3 + Math.floor(Math.random() * 2),
                    h = 3 + Math.floor(Math.random() * 2);
                let wx = w,
                    wz = d;
                for (let dx = -Math.floor(w / 2); dx <= Math.floor(w / 2); dx++) {
                    for (let dz = -Math.floor(d / 2); dz <= Math.floor(d / 2); dz++) {
                        let px = x + dx,
                            pz = z + dz;
                        let gh = Math.floor(heightmap[pz * WS + px]);
                        let wall = Math.abs(dx) === Math.floor(w / 2) || Math.abs(dz) === Math.floor(d / 2);
                        for (let y = 0; y < h; y++) {
                            let ty = gh + y;
                            if (wall) {
                                let t = B.PLASTER;
                                if ((Math.abs(dx) === Math.floor(w / 2) && Math.abs(dz) === Math.floor(d / 2)) ||
                                    y === h - 1) t = B.WFRAME;
                                if (Math.abs(dx) <= 1 && Math.abs(dz) <= 1 && y === 0) t = B.PLANK;
                                sb(px, ty, pz, t);
                            } else {
                                sb(px, ty, pz, B.PLANK);
                            }
                        }
                    }
                }
                // Roof
                let gh = Math.floor(heightmap[z * WS + x]);
                for (let dx = -Math.floor(w / 2) - 1; dx <= Math.floor(w / 2) + 1; dx++) {
                    for (let dz = -Math.floor(d / 2) - 1; dz <= Math.floor(d / 2) + 1; dz++) {
                        let adx = Math.abs(dx),
                            adz = Math.abs(dz);
                        let rh = h + Math.max(0, Math.max(adx - Math.floor(w / 2), adz - Math.floor(d / 2)));
                        if (rh < h + 3) {
                            let px = x + dx,
                                pz = z + dz;
                            let ty = gh + rh;
                            if (gb(px, ty, pz) === B.AIR) {
                                sb(px, ty, pz, B.ROOF);
                                if (Math.random() < .3) sb(px, ty + 1, pz, B.ROOF);
                            }
                        }
                    }
                }
                // Door
                let doorX = x + Math.floor(w / 2) + 1,
                    doorZ = z;
                sb(doorX, gh + 1, doorZ, B.PLANK);
                sb(doorX, gh + 2, doorZ, B.PLANK);
                // Windows
                for (let side = -1; side <= 1; side += 2) {
                    sb(x + side * Math.floor(w / 2), gh + 2, z, B.GLASS);
                    sb(x, gh + 2, z + side * Math.floor(d / 2), B.GLASS);
                }
                // Lantern
                sb(x + Math.floor(w / 2) + 1, gh + 3, z, B.LANTERN);
            }

            function genCastle() {
                let cx = 185,
                    cz = 105;
                // Plateau flatten is done in terrain
                // Moat
                for (let x = cx - 32; x <= cx + 32; x++) {
                    for (let z = cz - 32; z <= cz + 32; z++) {
                        let d = Math.max(Math.abs(x - cx), Math.abs(z - cz));
                        if (d >= 24 && d <= 27) {
                            for (let y = WATER_LEVEL - 1; y <= WATER_LEVEL; y++) sb(x, y, z, B.WATER);
                            if (gb(x, 34, z) === B.WATER) sb(x, 33, z, B.WATER);
                        }
                    }
                }
                // Bridge across moat (south)
                for (let bx = cx - 4; bx <= cx + 4; bx++) {
                    for (let bz = cz + 24; bz <= cz + 30; bz++) {
                        if (bz <= cz + 27) sb(bx, WATER_LEVEL, bz, B.PLANK);
                        else if (bz === cz + 30) sb(bx, WATER_LEVEL, bz, B.STONEB);
                    }
                }
                // Outer walls
                let wx0 = cx - 22,
                    wz0 = cz - 22,
                    wx1 = cx + 22,
                    wz1 = cz + 22;
                for (let x = wx0; x <= wx1; x++) {
                    for (let z = wz0; z <= wz1; z++) {
                        let onWall = (x === wx0 || x === wx1 || z === wz0 || z === wz1);
                        let isGate = (z === wz1 && x >= cx - 3 && x <= cx + 3);
                        if (onWall && !isGate) {
                            let bh = 58;
                            for (let y = 50; y <= 58; y++) sb(x, y, z, B.STONEB);
                            // battlements
                            if ((x + z) % 2 === 0) sb(x, 59, z, B.STONEB);
                        }
                    }
                }
                // Gate opening
                for (let x = cx - 3; x <= cx + 3; x++) {
                    for (let z = wz1; z <= wz1 + 2; z++) {
                        for (let y = 54; y <= 58; y++) sb(x, y, z, B.STONEB);
                    }
                    sb(x, 53, wz1, B.PLANK);
                }
                // Corner towers
                let towers = [
                    [wx0, wz0],
                    [wx0, wz1],
                    [wx1, wz0],
                    [wx1, wz1]
                ];
                for (let [tx, tz] of towers) {
                    for (let x = tx - 3; x <= tx + 3; x++) {
                        for (let z = tz - 3; z <= tz + 3; z++) {
                            let d = Math.max(Math.abs(x - tx), Math.abs(z - tz));
                            if (d <= 3) {
                                for (let y = 50; y <= 72; y++) sb(x, y, z, d <= 2 ? B.STONEB : B.COBBLE);
                                // Roof cone
                                let rh = 72 + Math.max(0, d - 1);
                                if (d <= 3) {
                                    for (let y = 72; y <= rh; y++) sb(x, y, z, B.ROOF);
                                }
                            }
                        }
                    }
                    // Flag
                    for (let y = 72; y <= 78; y++) sb(tx, y, tz, B.LOG);
                    sb(tx, 78, tz, B.LANTERN);
                }
                // Keep
                let kx0 = cx - 8,
                    kx1 = cx + 8,
                    kz0 = cz - 8,
                    kz1 = cz + 8;
                for (let x = kx0; x <= kx1; x++) {
                    for (let z = kz0; z <= kz1; z++) {
                        let wall = x === kx0 || x === kx1 || z === kz0 || z === kz1;
                        for (let y = 55; y <= 70; y++) {
                            if (wall) {
                                sb(x, y, z, B.STONEB);
                                // Windows
                                if (y === 62 && (x === kx0 || x === kx1 || z === kz0 || z === kz1) &&
                                    (x + z) % 3 === 0) sb(x, y, z, B.GLOW);
                            } else {
                                if (y <= 58) sb(x, y, z, B.PLANK);
                                else if (y > 66) sb(x, y, z, B.ROOF);
                                else sb(x, y, z, B.AIR);
                            }
                        }
                    }
                }
                // Keep roof
                for (let x = kx0; x <= kx1; x++) {
                    for (let z = kz0; z <= kz1; z++) {
                        let d = Math.max(Math.abs(x - cx), Math.abs(z - cz));
                        let rh = 70 + Math.max(0, d - 4);
                        if (rh > 70 && rh < 74) {
                            for (let y = 70; y <= rh; y++) {
                                if (gb(x, y, z) === B.AIR) sb(x, y, z, B.ROOF);
                            }
                        }
                    }
                }
                // Great flag on keep
                for (let y = 70; y <= 78; y++) sb(cx, y, cz, B.LOG);
                sb(cx, 78, cz, B.LANTERN);
                // Chapel
                let chx = cx + 14,
                    chz = cz - 14;
                fillBox(chx - 3, 55, chz - 3, chx + 3, 62, chz + 3, B.STONEB);
                // Chapel roof
                for (let x = chx - 3; x <= chx + 3; x++) {
                    for (let z = chz - 3; z <= chz + 3; z++) {
                        let d = Math.max(Math.abs(x - chx), Math.abs(z - chz));
                        let rh = 62 + Math.max(0, d - 1);
                        if (rh < 65) {
                            let y = rh;
                            if (gb(x, y, z) === B.AIR) sb(x, y, z, B.ROOF);
                        }
                    }
                }
                // Chapel window
                sb(chx, 59, chz + 3, B.GLOW);
                sb(chx, 60, chz + 3, B.GLOW);
                // Garden
                for (let x = cx - 18; x <= cx + 18; x++) {
                    for (let z = cz - 18; z <= cz + 18; z++) {
                        if (gb(x, 51, z) === B.GRASS && Math.random() < .3) {
                            sb(x, 52, z, B.WHEAT);
                        }
                    }
                }
                // Inner courtyard path
                for (let x = cx - 5; x <= cx + 5; x++) {
                    for (let z = cz - 5; z <= cz + 5; z++) {
                        sb(x, 55, z, B.PATH);
                    }
                }
                // Torches along walls
                for (let x = wx0; x <= wx1; x += 4) {
                    sb(x, 59, wz0, B.LANTERN);
                    sb(x, 59, wz1, B.LANTERN);
                }
                for (let z = wz0; z <= wz1; z += 4) {
                    sb(wx0, 59, z, B.LANTERN);
                    sb(wx1, 59, z, B.LANTERN);
                }
            }

            function genVillage() {
                let vx = 135,
                    vz = 150;
                // Marketplace square
                for (let x = vx - 8; x <= vx + 8; x++) {
                    for (let z = vz - 4; z <= vz + 4; z++) {
                        let gh = Math.floor(heightmap[z * WS + x]);
                        sb(x, gh, z, B.PATH);
                    }
                }
                // Well
                sb(vx, 42, vz, B.STONEB);
                sb(vx + 1, 42, vz, B.STONEB);
                sb(vx, 42, vz + 1, B.STONEB);
                sb(vx + 1, 42, vz + 1, B.STONEB);
                sb(vx + 1, 43, vz, B.PLANK);
                sb(vx, 43, vz + 1, B.PLANK);
                sb(vx + 1, 43, vz + 1, B.PLANK);
                sb(vx, 43, vz, B.WATER);
                // Generate houses around
                let housePos = [];
                for (let i = 0; i < 30; i++) {
                    let angle = Math.random() * Math.PI * 2;
                    let dist = 8 + Math.random() * 28;
                    let hx = Math.round(vx + Math.cos(angle) * dist);
                    let hz = Math.round(vz + Math.sin(angle) * dist);
                    if (hx < 10 || hx > 245 || hz < 10 || hz > 245) continue;
                    let gh = Math.floor(heightmap[hz * WS + hx]);
                    let dv = Math.hypot(hx - 52, hz - 45);
                    let dc = Math.hypot(hx - 185, hz - 105);
                    let rd = riverDist(hx, hz);
                    if (gh < WATER_LEVEL + 2 || dv < 30 || dc < 40 || rd < 14) continue;
                    let ok = true;
                    for (let [px, pz] of housePos) {
                        if (Math.hypot(px - hx, pz - hz) < 6) { ok = false; break; }
                    }
                    if (!ok) continue;
                    housePos.push([hx, hz]);
                    spiralHouse(hx, hz, Math.random() * Math.PI, 3 + Math.random() * 2);
                }
                // Bridge over river to castle road
                let brx = 155,
                    brz = 130;
                for (let x = brx - 5; x <= brx + 5; x++) {
                    for (let z = brz; z <= brz + 6; z++) {
                        let gh = Math.floor(heightmap[z * WS + x]);
                        if (gh <= WATER_LEVEL) {
                            sb(x, WATER_LEVEL, z, B.STONEB);
                            if (z === brz || z === brz + 6) sb(x, WATER_LEVEL + 1, z, B.STONEB);
                        }
                    }
                }
                // Road from bridge to castle
                for (let x = brx - 4; x <= brx + 4; x++) {
                    for (let z = 125; z <= 135; z++) {
                        let gh = Math.floor(heightmap[z * WS + x]);
                        if (gb(x, gh, z) === B.GRASS) sb(x, gh, z, B.PATH);
                    }
                }
            }

            function genTrees() {
                for (let x = 4; x < WS - 4; x += 2) {
                    for (let z = 4; z < WS - 4; z += 2) {
                        let gh = Math.floor(heightmap[z * WS + x]);
                        let dv = Math.hypot(x - 52, z - 45);
                        let dc = Math.hypot(x - 185, z - 105);
                        let dVill = Math.hypot(x - 135, z - 150);
                        let rd = riverDist(x, z);
                        if (gh < WATER_LEVEL + 2 || dv < 30 || dc < 50 || dVill < 40 || rd < 16) continue;
                        let n = fbm(x * .1 + 33, z * .1 + 33, 11, 2);
                        if (n > .55 && gh > 45 && gh < 65) {
                            let hgt = 4 + Math.floor(Math.random() * 3);
                            for (let y = gh + 1; y <= gh + hgt; y++) sb(x, y, z, B.LOG);
                            for (let dx = -2; dx <= 2; dx++) {
                                for (let dz = -2; dz <= 2; dz++) {
                                    for (let ly = gh + hgt - 2; ly <= gh + hgt + 1; ly++) {
                                        if (Math.abs(dx) === 2 && Math.abs(dz) === 2 && ly < gh + hgt) continue;
                                        if (gb(x + dx, ly, z + dz) === B.AIR && Math.random() < .8) {
                                            sb(x + dx, ly, z + dz, B.LEAF);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
                // Dead trees near volcano
                for (let x = 20; x < 90; x++) {
                    for (let z = 10; z < 80; z++) {
                        let dv = Math.hypot(x - 52, z - 45);
                        if (dv > 15 && dv < 40) {
                            let gh = Math.floor(heightmap[z * WS + x]);
                            if (gb(x, gh, z) === B.BASALT && Math.random() < .06) {
                                let hgt = 3 + Math.floor(Math.random() * 3);
                                for (let y = gh + 1; y <= gh + hgt; y++) sb(x, y, z, B.LOG);
                            }
                        }
                    }
                }
            }

            function genFarms() {
                let fx = 120,
                    fz = 170;
                for (let x = fx - 15; x <= fx + 15; x++) {
                    for (let z = fz - 10; z <= fz + 10; z++) {
                        let gh = Math.floor(heightmap[z * WS + x]);
                        let rd = riverDist(x, z);
                        if (rd > 20 && rd < 40 && gh > WATER_LEVEL) {
                            if (Math.random() < .7) sb(x, gh, z, B.FARM);
                            if (Math.random() < .5) sb(x, gh + 1, z, B.WHEAT);
                        }
                    }
                }
            }

            function genFeatures() {
                // Reed along river
                for (let x = 0; x < WS; x += 2) {
                    for (let z = 0; z < WS; z += 2) {
                        let rd = riverDist(x, z);
                        if (rd > 6 && rd < 14) {
                            let h = Math.floor(heightmap[z * WS + x]);
                            if (gb(x, WATER_LEVEL, z) === B.WATER) {
                                for (let y = WATER_LEVEL + 1; y <= WATER_LEVEL + 2; y++) {
                                    if (gb(x, y, z) === B.AIR && Math.random() < .2) sb(x, y, z, B.REED);
                                }
                            }
                        }
                    }
                }
                // Docks
                let docks = [
                    [140, 155],
                    [145, 158]
                ];
                for (let [dx, dz] of docks) {
                    for (let i = -2; i <= 2; i++) {
                        for (let j = 0; j < 4; j++) {
                            let y = WATER_LEVEL;
                            sb(dx + i, y, dz + j, B.PLANK);
                            if (j === 3) sb(dx + i, y + 1, dz + j, B.LOG);
                        }
                    }
                }
                // Boat (simple)
                sb(148, WATER_LEVEL + 1, 160, B.WOOD = B.PLANK);
                sb(149, WATER_LEVEL + 1, 160, B.PLANK);
                sb(148, WATER_LEVEL + 1, 161, B.PLANK);
                sb(149, WATER_LEVEL + 1, 161, B.PLANK);
                sb(148, WATER_LEVEL + 2, 160, B.PLANK);
                sb(149, WATER_LEVEL + 2, 161, B.PLANK);
                // Watermill
                let mwx = 120,
                    mwz = 142;
                for (let y = 36; y <= 48; y++) {
                    for (let dx = 0; dx < 4; dx++) {
                        for (let dz = 0; dz < 4; dz++) {
                            if (y <= 44) sb(mwx + dx, y, mwz + dz, B.STONEB);
                            else sb(mwx + dx, y, mwz + dz, B.ROOF);
                        }
                    }
                }
                // Water wheel
                for (let y = 38; y <= 44; y++) {
                    sb(mwx - 2, y, mwz + 1, B.PLANK);
                    sb(mwx - 2, y, mwz + 2, B.PLANK);
                }
                // Cart
                let cartX = 130,
                    cartZ = 160;
                sb(cartX, 43, cartZ, B.PLANK);
                sb(cartX + 1, 43, cartZ, B.PLANK);
                sb(cartX + 1, 43, cartZ + 1, B.PLANK);
                sb(cartX, 43, cartZ + 1, B.PLANK);
                sb(cartX + 2, 43, cartZ, B.LOG);
                sb(cartX + 2, 43, cartZ + 1, B.LOG);
                // Barrels at tavern
                let tbx = 142,
                    tbz = 144;
                for (let i = 0; i < 3; i++) {
                    sb(tbx + i, 43, tbz, B.LOG);
                    sb(tbx + i, 44, tbz, B.LOG);
                }
                // Bronze lantern posts
                for (let lx = 120; lx <= 160; lx += 10) {
                    for (let lz = 138; lz <= 160; lz += 10) {
                        let gh = Math.floor(heightmap[lz * WS + lx]);
                        if (gb(lx, gh, lz) === B.PATH || gb(lx, gh, lz) === B.GRASS) {
                            sb(lx, gh + 1, lz, B.LOG);
                            sb(lx, gh + 2, lz, B.LANTERN);
                        }
                    }
                }
                // Watchtower near village
                let wx = 109,
                    wz = 135;
                for (let y = 40; y <= 55; y++) {
                    for (let dx = 0; dx < 4; dx++) {
                        for (let dz = 0; dz < 4; dz++) {
                            if (dx === 0 || dx === 3 || dz === 0 || dz === 3 || y > 52) {
                                sb(wx + dx, y, wz + dz, B.WFRAME);
                            } else {
                                sb(wx + dx, y, wz + dz, B.AIR);
                            }
                        }
                    }
                }
                sb(wx + 1, 56, wz + 1, B.LANTERN);
                // Ruins near volcano
                for (let rx = 35; rx < 65; rx += 4) {
                    for (let rz = 25; rz < 55; rz += 4) {
                        let dv = Math.hypot(rx - 52, rz - 45);
                        if (dv > 20 && dv < 35) {
                            let gh = Math.floor(heightmap[rz * WS + rx]);
                            if (Math.random() < .5) {
                                for (let y = gh; y <= gh + 2; y++) sb(rx, y, rz, B.STONEB);
                                if (Math.random() < .3) sb(rx, gh + 3, rz, B.STONEB);
                            }
                        }
                    }
                }
            }

            // ============ MESHING ============
            // Vertex: position(3f) normal(3f) color(3f) emissive(1f) => 40 bytes
            const FACE_DEFS = [];
            // Generate face defs programmatically
            function addFaceDef(nx, ny, nz, ux, uy, uz, vx, vy, vz) {
                FACE_DEFS.push({ n: [nx, ny, nz], u: [ux, uy, uz], v: [vx, vy, vz] });
            }
            addFaceDef(1, 0, 0, 0, 1, 0, 0, 0, 1);
            addFaceDef(-1, 0, 0, 0, 1, 0, 0, 0, -1);
            addFaceDef(0, 1, 0, 1, 0, 0, 0, 0, 1);
            addFaceDef(0, -1, 0, 1, 0, 0, 0, 0, -1);
            addFaceDef(0, 0, 1, 1, 0, 0, 0, 1, 0);
            addFaceDef(0, 0, -1, 1, 0, 0, 0, -1, 0);

            const BLOCK_COLORS = {
                [B.GRASS]: { top: [0.33, .55, .22], side: [0.35, .42, .2], bottom: [0.4, .28, .15] },
                [B.DIRT]: { top: [0.42, .28, .15], side: [0.42, .28, .15], bottom: [0.42, .28, .15] },
                [B.STONE]: { top: [0.5, .5, .5], side: [0.5, .5, .5], bottom: [0.5, .5, .5] },
                [B.LOG]: { top: [0.4, .3, .2], side: [0.3, .2, .1], bottom: [0.4, .3, .2] },
                [B.PLANK]: { top: [0.55, .42, .28], side: [0.55, .42, .28], bottom: [0.55, .42, .28] },
                [B.LEAF]: { top: [0.2, .45, .15], side: [0.2, .4, .13], bottom: [0.2, .4, .13] },
                [B.WATER]: { top: [0.15, .35, .55], side: [0.1, .25, .4], bottom: [0.1, .25, .4] },
                [B.SAND]: { top: [0.76, .7, .5], side: [0.76, .7, .5], bottom: [0.76, .7, .5] },
                [B.SNOW]: { top: [0.9, .92, .95], side: [0.85, .88, .92], bottom: [0.85, .88, .92] },
                [B.BRICK]: { top: [0.55, .25, .2], side: [0.55, .25, .2], bottom: [0.55, .25, .2] },
                [B.STONEB]: { top: [0.45, .45, .45], side: [0.45, .45, .45], bottom: [0.45, .45, .45] },
                [B.ROOF]: { top: [0.35, .15, .12], side: [0.35, .15, .12], bottom: [0.35, .15, .12] },
                [B.GLASS]: { top: [0.6, .75, .8], side: [0.6, .75, .8], bottom: [0.6, .75, .8] },
                [B.LAVA]: { top: [0.9, .3, .05], side: [0.8, .25, .04], bottom: [0.8, .25, .04] },
                [B.BASALT]: { top: [0.25, .25, .28], side: [0.25, .25, .28], bottom: [0.25, .25, .28] },
                [B.PATH]: { top: [0.5, .42, .28], side: [0.45, .38, .25], bottom: [0.45, .38, .25] },
                [B.WHEAT]: { top: [0.85, .65, .2], side: [0.8, .6, .18], bottom: [0.8, .6, .18] },
                [B.REED]: { top: [0.3, .6, .3], side: [0.3, .6, .3], bottom: [0.3, .6, .3] },
                [B.LANTERN]: { top: [0.9, .7, .1], side: [0.9, .7, .1], bottom: [0.9, .7, .1] },
                [B.GLOW]: { top: [0.9, .8, .4], side: [0.9, .8, .4], bottom: [0.9, .8, .4] },
                [B.PLASTER]: { top: [0.85, .82, .7], side: [0.85, .82, .7], bottom: [0.85, .82, .7] },
                [B.WFRAME]: { top: [0.35, .22, .12], side: [0.35, .22, .12], bottom: [0.35, .22, .12] },
                [B.COBBLE]: { top: [0.4, .4, .4], side: [0.4, .4, .4], bottom: [0.4, .4, .4] },
                [B.FARM]: { top: [0.35, .28, .18], side: [0.3, .25, .15], bottom: [0.3, .25, .15] },
                [B.BASALT2]: { top: [0.2, .2, .22], side: [0.2, .2, .22], bottom: [0.2, .2, .22] },
                [B.VOLCROCK]: { top: [0.22, .18, .2], side: [0.22, .18, .2], bottom: [0.22, .18, .2] },
            };

            function getColor(type, face, x, y, z) {
                let c = BLOCK_COLORS[type];
                if (!c) return [0.5, .5, .5];
                if (type === B.GRASS) {
                    if (face === 'top') return c.top;
                    if (face === 'bottom') return c.bottom;
                    return c.side;
                }
                if (type === B.LOG) {
                    if (face === 'top' || face === 'bottom') return c.top;
                    return c.side;
                }
                return c.top || c.side || c.bottom || [0.5, .5, .5];
            }

            function emissiveFor(type) {
                if (type === B.LAVA) return 1.5;
                if (type === B.LANTERN) return 2.0;
                if (type === B.GLOW) return 1.5;
                if (type === B.WHATEVER) return 0;
                return 0;
            }

            function aoAt(x, y, z) {
                let s1 = isSolid(gb(x, y, z));
                let s2 = isSolid(gb(x, y, z));
                return 0;
            }

            // Chunk meshes
            let chunkMeshes = [];

            function meshChunk(cx, cy, cz) {
                let verts = [];
                let idx = [];
                let vertCount = 0;
                let x0 = cx * CS,
                    y0 = cy * CS,
                    z0 = cz * CS;
                let x1 = Math.min(x0 + CS, WS),
                    y1 = Math.min(y0 + CS, WH),
                    z1 = Math.min(z0 + CS, WS);

                for (let x = x0; x < x1; x++) {
                    for (let y = y0; y < y1; y++) {
                        for (let z = z0; z < z1; z++) {
                            let b = gb(x, y, z);
                            if (b === B.AIR || b === B.WATER || b === B.REED) continue;

                            for (let fi = 0; fi < 6; fi++) {
                                let fd = FACE_DEFS[fi];
                                let nx = x + fd.n[0],
                                    ny = y + fd.n[1],
                                    nz = z + fd.n[2];
                                let nb = gb(nx, ny, nz);
                                if (nb !== B.AIR && nb !== B.WATER) continue;

                                let faceKey = '';
                                if (fd.n[1] === 1) faceKey = 'top';
                                else if (fd.n[1] === -1) faceKey = 'bottom';
                                else faceKey = 'side';
                                let col = getColor(b, faceKey, x, y, z);
                                let emiss = emissiveFor(b);
                                // Slight color variation
                                let variation = 1 + (hash2(x * 1337 + z * 7433 + y * 3911, x + z, 123) - .5) * .08;
                                col = [col[0] * variation, col[1] * variation, col[2] * variation];

                                // Face shading
                                let shade = 1;
                                if (fd.n[1] === 0) shade = .8;
                                if (fd.n[1] === -1) shade = .55;
                                col = [col[0] * shade, col[1] * shade, col[2] * shade];

                                let faceVertStart = vertCount;

                                // 4 vertices
                                for (let vi = 0; vi < 4; vi++) {
                                    let a = (vi >> 1) & 1;
                                    let bv = vi & 1;
                                    let pos = [
                                        x + fd.n[0] + a * fd.u[0] + bv * fd.v[0],
                                        y + fd.n[1] + a * fd.u[1] + bv * fd.v[1],
                                        z + fd.n[2] + a * fd.u[2] + bv * fd.v[2]
                                    ];
                                    // AO
                                    let ao = 1.0;
                                    let s1p = [pos[0] - fd.u[0], pos[1] - fd.u[1], pos[2] - fd.u[2]];
                                    let s2p = [pos[0] - fd.v[0], pos[1] - fd.v[1], pos[2] - fd.v[2]];
                                    let cp = [pos[0] - fd.u[0] - fd.v[0], pos[1] - fd.u[1] - fd.v[1], pos[2] - fd.u[2] - fd
                                        .v[2]
                                    ];
                                    let s1 = isSolid(gb(Math.floor(s1p[0]), Math.floor(s1p[1]), Math.floor(s1p[2])));
                                    let s2 = isSolid(gb(Math.floor(s2p[0]), Math.floor(s2p[1]), Math.floor(s2p[2])));
                                    let sc = isSolid(gb(Math.floor(cp[0]), Math.floor(cp[1]), Math.floor(cp[2])));
                                    let aoVal = 3;
                                    if (s1 && s2) aoVal = 0;
                                    else if (s1 || s2) aoVal = 1;
                                    else if (sc) aoVal = 2;
                                    ao = (aoVal + 1) / 4;
                                    // Encode color with AO
                                    let acol = [col[0] * ao, col[1] * ao, col[2] * ao];

                                    verts.push(pos[0], pos[1], pos[2]);
                                    verts.push(fd.n[0], fd.n[1], fd.n[2]);
                                    verts.push(acol[0], acol[1], acol[2]);
                                    verts.push(emiss);
                                    vertCount++;
                                }

                                // Indices: 0,1,2  2,1,3
                                idx.push(faceVertStart, faceVertStart + 1, faceVertStart + 2);
                                idx.push(faceVertStart + 2, faceVertStart + 1, faceVertStart + 3);
                            }
                        }
                    }
                }

                // Water mesh
                let wverts = [];
                let widx = [];
                let wvertCount = 0;
                for (let x = x0; x < x1; x++) {
                    for (let y = y0; y < y1; y++) {
                        for (let z = z0; z < z1; z++) {
                            let b = gb(x, y, z);
                            if (b !== B.WATER) continue;
                            // Top face if air above
                            if (gb(x, y + 1, z) === B.AIR || gb(x, y + 1, z) === B.GLASS) {
                                let col = [0.15, .35, .55];
                                let faceVertStart = wvertCount;
                                let verts = [
                                    [x, y + 1, z],
                                    [x, y + 1, z + 1],
                                    [x + 1, y + 1, z],
                                    [x + 1, y + 1, z + 1]
                                ];
                                for (let vi = 0; vi < 4; vi++) {
                                    let p = verts[vi];
                                    let shade = 1;
                                    let acol = [col[0] * shade, col[1] * shade, col[2] * shade];
                                    wverts.push(p[0], p[1], p[2], 0, 1, 0, acol[0], acol[1], acol[2], 0.4);
                                    wvertCount++;
                                }
                                widx.push(faceVertStart, faceVertStart + 1, faceVertStart + 2);
                                widx.push(faceVertStart + 2, faceVertStart + 1, faceVertStart + 3);
                            }
                        }
                    }
                }

                return {
                    verts: new Float32Array(verts),
                    idx: new Uint16Array(idx),
                    wverts: new Float32Array(wverts),
                    widx: new Uint16Array(widx),
                    vertCount: vertCount,
                    wvertCount: wvertCount
                };
            }

            // ============ WEBGPU ============
            let canvas, ctx, device, format;
            let uniformBuffer, uniformBindGroup, pipeline, waterPipeline, postPipeline, brightPipeline, compositePipeline;
            let sceneTexture, sceneView, depthTexture, depthView;
            let brightTexture, brightView;
            let quadBuffer;

            const WGSL = {

                uniforms: `
                struct Uniforms {
                    viewProj: mat4x4<f32>,
                    lightDir: vec4<f32>,
                    cameraPos: vec4<f32>,
                    fogColor: vec4<f32>,
                    fogDensity: f32,
                    time: f32,
                    sunIntensity: f32,
                }
                @group(0) @binding(0) var<uniform> uniforms: Uniforms;
                `,

                vertexMain: `
                ${''}
                struct VSInput {
                    @location(0) pos: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                }
                struct VSOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) worldPos: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                }
                @vertex
                fn vs_main(in: VSInput) -> VSOutput {
                    var out: VSOutput;
                    out.position = uniforms.viewProj * vec4(in.pos, 1.0);
                    out.worldPos = in.pos;
                    out.normal = in.normal;
                    out.color = in.color;
                    out.emissive = in.emissive;
                    return out;
                }
                `,

                fragmentMain: `
                @fragment
                fn fs_main(in: VSOutput) -> @location(0) vec4<f32> {
                    let lightDir = normalize(uniforms.lightDir.xyz);
                    let normal = normalize(in.normal);
                    let ndotl = max(dot(normal, lightDir), 0.0);
                    let ambient = 0.25 + uniforms.sunIntensity * 0.15;
                    let diffuse = ndotl * 0.8 * uniforms.sunIntensity;
                    var color = in.color * (ambient + diffuse);
                    
                    // Emissive
                    if (in.emissive > 0.0) {
                        color += vec3(1.0, 0.6, 0.2) * in.emissive;
                    }
                    
                    // Fog
                    let dist = length(in.worldPos - uniforms.cameraPos.xyz);
                    let fogFactor = 1.0 - exp(-uniforms.fogDensity * dist * dist);
                    color = mix(color, uniforms.fogColor.rgb, clamp(fogFactor, 0.0, 1.0));
                    
                    return vec4(color, 1.0);
                }
                `,

                waterVertex: `
                struct VSInput {
                    @location(0) pos: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                }
                struct VSOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) worldPos: vec3<f32>,
                    @location(1) normal: vec3<f32>,
                    @location(2) color: vec3<f32>,
                    @location(3) emissive: f32,
                }
                @vertex
                fn vs_main(in: VSInput) -> VSOutput {
                    var out: VSOutput;
                    let wave = sin(in.pos.x * 1.5 + uniforms.time * 1.8) * cos(in.pos.z * 1.5 + uniforms.time * 1.2) * 0.12;
                    let animated = in.pos + vec3(0.0, wave, 0.0);
                    out.position = uniforms.viewProj * vec4(animated, 1.0);
                    out.worldPos = animated;
                    out.normal = in.normal;
                    out.color = in.color;
                    out.emissive = in.emissive;
                    return out;
                }
                `,

                waterFragment: `
                @fragment
                fn fs_main(in: VSOutput) -> @location(0) vec4<f32> {
                    let lightDir = normalize(uniforms.lightDir.xyz);
                    let normal = normalize(vec3(in.normal.x * 0.3, in.normal.y, in.normal.z * 0.3));
                    let ndotl = max(dot(normal, lightDir), 0.0);
                    var color = in.color * (0.4 + ndotl * 0.5);
                    let dist = length(in.worldPos - uniforms.cameraPos.xyz);
                    let fogFactor = 1.0 - exp(-uniforms.fogDensity * dist * dist);
                    color = mix(color, uniforms.fogColor.rgb, clamp(fogFactor, 0.0, 1.0));
                    return vec4(color.rgb, 0.65);
                }
                `,

                postVertex: `
                struct VSOutput {
                    @builtin(position) position: vec4<f32>,
                    @location(0) uv: vec2<f32>,
                }
                @vertex
                fn vs_main(@builtin(vertex_index) vi: u32) -> VSOutput {
                    var positions = array<vec2<f32>, 6>(
                        vec2(-1.0, -1.0), vec2(1.0, -1.0), vec2(1.0, 1.0),
                        vec2(-1.0, -1.0), vec2(1.0, 1.0), vec2(-1.0, 1.0)
                    );
                    let p = positions[vi];
                    var out: VSOutput;
                    out.position = vec4(p, 0.0, 1.0);
                    out.uv = vec2((p.x + 1.0) * 0.5, (1.0 - p.y) * 0.5);
                    return out;
                }
                `,

                compositeFragment: `
                @group(0) @binding(0) var sceneTex: texture_2d<f32>;
                @group(0) @binding(1) var sceneSampler: sampler;
                @group(0) @binding(2) var brightTex: texture_2d<f32>;
                @group(0) @binding(3) var brightSampler: sampler;
                @group(0) @binding(4) var<uniform> uniformData: UniformData;

                struct UniformData {
                    time: f32,
                    exposure: f32,
                }

                @fragment
                fn fs_main(in: VSOutput) -> @location(0) vec4<f32> {
                    let hdr = textureSample(sceneTex, sceneSampler, in.uv).rgb;
                    let bright = textureSample(brightTex, brightSampler, in.uv).rgb;
                    
                    // Tone map ACES approximation
                    let a = 2.51;
                    let b = 0.03;
                    let c = 2.43;
                    let d = 0.59;
                    let e = 0.14;
                    var color = (hdr * (a * hdr + b)) / (hdr * (c * hdr + d) + e);
                    
                    // Add bloom
                    color += bright * 0.45;
                    
                    // Vignette
                    let dx = in.uv.x - 0.5;
                    let dy = in.uv.y - 0.5;
                    let dist = sqrt(dx * dx + dy * dy);
                    let vignette = 1.0 - smoothstep(0.25, 0.9, dist);
                    color *= vignette;
                    
                    // Slight saturation boost
                    let gray = dot(color, vec3(0.299, 0.587, 0.114));
                    color = mix(vec3(gray), color, 1.15);
                    
                    return vec4(pow(color, vec3(0.85)), 1.0);
                }
                `,

                brightFragment: `
                @group(0) @binding(0) var sceneTex: texture_2d<f32>;
                @group(0) @binding(1) var sceneSampler: sampler;
                @group(0) @binding(2) var<uniform> uniformData: UniformData;
                struct UniformData { time: f32, exposure: f32; }

                @fragment
                fn fs_main(in: VSOutput) -> @location(0) vec4<f32> {
                    let hdr = textureSample(sceneTex, sceneSampler, in.uv).rgb;
                    let brightness = dot(hdr, vec3(0.299, 0.587, 0.114));
                    var out = vec4(0.0);
                    if (brightness > 0.8) {
                        out = vec4(hdr * (brightness - 0.8) * 2.0, 1.0);
                    }
                    return out;
                }
                `,
            };

            async function initWebGPU() {
                canvas = document.getElementById('c');
                if (!navigator.gpu) throw new Error('WebGPU not supported');
                let adapter = await navigator.gpu.requestAdapter();
                if (!adapter) throw new Error('No GPU adapter');
                device = await adapter.requestDevice();
                ctx = canvas.getContext('webgpu');
                if (!ctx) throw new Error('No WebGPU context');
                format = 'bgra8unorm';
                // Use preferred format
                let pf = navigator.gpu.getPreferredCanvasFormat();
                format = pf;
                ctx.configure({
                    device,
                    format,
                    alphaMode: 'opaque',
                });
                canvas.width = Math.min(window.innerWidth, 2048);
                canvas.height = Math.min(window.innerHeight, 2048);

                // Uniform buffer
                uniformBuffer = device.createBuffer({ size: 192, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

                let bgl = device.createBindGroupLayout({

                });
                uniformBindGroup = device.createBindGroup({
                    layout: bgl,
                    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
                });

                // Pipelines
                let shaderModule = device.createShaderModule({ code: WGSL.uniforms + WGSL.vertexMain + WGSL.fragmentMain });
                let waterModule = device.createShaderModule({ code: WGSL.uniforms + WGSL.waterVertex + WGSL.waterFragment });

                let vertexLayout = {
                    arrayStride: 40,
                    attributes: [
                        { shaderLocation: 0, offset: 0, format: 'float32x3' },
                        { shaderLocation: 1, offset: 12, format: 'float32x3' },
                        { shaderLocation: 2, offset: 24, format: 'float32x3' },
                        { shaderLocation: 3, offset: 36, format: 'float32' },
                    ]
                };

                let pipelineDesc = {
                    layout: device.createPipelineLayout({ bindGroupLayouts: [bgl] }),
                    vertex: { module: shaderModule, entryPoint: 'vs_main', buffers: [vertexLayout] },
                    fragment: { module: shaderModule, entryPoint: 'fs_main', targets: [{ format: 'rgba16float' }] },
                    primitive: { topology: 'triangle-list', cullMode: 'back' },
                    depthStencil: { format: 'depth24plus', depthWriteEnabled: true, depthCompare: 'less' },
                };
                pipeline = device.createRenderPipeline(pipelineDesc);

                let waterPipelineDesc = {
                    ...pipelineDesc,
                    vertex: { module: waterModule, entryPoint: 'vs_main', buffers: [vertexLayout] },
                    fragment: { module: waterModule, entryPoint: 'fs_main', targets: [{ format: 'rgba16float', blend: { color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } } }] },
                };
                waterPipeline = device.createRenderPipeline(waterPipelineDesc);

                // Scene texture
                let texDesc = {
                    size: [canvas.width, canvas.height],
                    format: 'rgba16float',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
                };
                sceneTexture = device.createTexture(texDesc);
                sceneView = sceneTexture.createView();

                // Depth texture
                let dtexDesc = {
                    size: [canvas.width, canvas.height],
                    format: 'depth24plus',
                    usage: GPUTextureUsage.RENDER_ATTACHMENT,
                };
                depthTexture = device.createTexture(dtexDesc);
                depthView = depthTexture.createView();

                // Bright texture (quarter res)
                let bw = Math.max(1, canvas.width >> 2),
                    bh = Math.max(1, canvas.height >> 2);
                brightTexture = device.createTexture({ size: [bw, bh], format: 'rgba16float', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING });
                brightView = brightTexture.createView();

                // Post pipeline
                let postShader = device.createShaderModule({ code: WGSL.postVertex + WGSL.compositeFragment });
                let postBGL = device.createBindGroupLayout({ entries: [
                    { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: {} },
                    { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
                    { binding: 2, visibility: GPUShaderStage.FRAGMENT, texture: {} },
                    { binding: 3, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
                    { binding: 4, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
                ] });
                compositePipeline = device.createRenderPipeline({
                    layout: device.createPipelineLayout({ bindGroupLayouts: [postBGL] }),
                    vertex: { module: postShader, entryPoint: 'vs_main', buffers: [] },
                    fragment: { module: postShader, entryPoint: 'fs_main', targets: [{ format }] },
                    primitive: { topology: 'triangle-list' },
                });

                // Bright pass pipeline
                let brightShader = device.createShaderModule({ code: WGSL.postVertex + WGSL.brightFragment });
                let brightBGL = device.createBindGroupLayout({ entries: [
                    { binding: 0, visibility: GPUShaderStage.FRAGMENT, texture: {} },
                    { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: {} },
                    { binding: 2, visibility: GPUShaderStage.FRAGMENT, buffer: { type: 'uniform' } },
                ] });
                brightPipeline = device.createRenderPipeline({
                    layout: device.createPipelineLayout({ bindGroupLayouts: [brightBGL] }),
                    vertex: { module: brightShader, entryPoint: 'vs_main', buffers: [] },
                    fragment: { module: brightShader, entryPoint: 'fs_main', targets: [{ format: 'rgba16float' }] },
                    primitive: { topology: 'triangle-list' },
                });

                // Post uniform buffer
                postUniformBuffer = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
                postBindGroup = device.createBindGroup({
                    layout: brightBGL,
                    entries: [
                        { binding: 0, resource: sceneView },
                        { binding: 1, resource: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) },
                        { binding: 2, resource: { buffer: postUniformBuffer } },
                    ]
                });
                compositeBindGroup = device.createBindGroup({
                    layout: postBGL,
                    entries: [
                        { binding: 0, resource: sceneView },
                        { binding: 1, resource: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) },
                        { binding: 2, resource: brightView },
                        { binding: 3, resource: device.createSampler({ magFilter: 'linear', minFilter: 'linear' }) },
                        { binding: 4, resource: { buffer: postUniformBuffer } },
                    ]
                });
            }

            // ============ MESH BUFFER UPLOAD ============
            let meshBuffers = [];

            function uploadMeshes() {
                for (let cx = 0; cx < CHUNKS_X; cx++) {
                    for (let cy = 0; cy < CHUNKS_Y; cy++) {
                        for (let cz = 0; cz < CHUNKS_Z; cz++) {
                            let mesh = meshChunk(cx, cy, cz);
                            let vb = null,
                                ib = null,
                                wvb = null,
                                wib = null;
                            if (mesh.vertCount > 0) {
                                vb = device.createBuffer({ size: mesh.verts.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
                                device.queue.writeBuffer(vb, 0, mesh.verts);
                                ib = device.createBuffer({ size: mesh.idx.length * 2, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
                                device.queue.writeBuffer(ib, 0, mesh.idx);
                            }
                            if (mesh.wvertCount > 0) {
                                wvb = device.createBuffer({ size: mesh.wverts.length * 4, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
                                device.queue.writeBuffer(wvb, 0, mesh.wverts);
                                wib = device.createBuffer({ size: mesh.widx.length * 2, usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST });
                                device.queue.writeBuffer(wib, 0, mesh.widx);
                            }
                            meshBuffers.push({
                                cx,
                                cy,
                                cz,
                                vb,
                                ib,
                                wvb,
                                wib,
                                vcount: mesh.vertCount,
                                wcount: mesh.wvertCount,
                                icount: mesh.idx.length,
                                wicount: mesh.widx.length
                            });
                        }
                    }
                }
            }

            // ============ CAMERA ============
            let cam = {
                pos: [175, 85, 55],
                yaw: -0.4,
                pitch: -0.25,
                mode: 'fly',
                fov: 70 * Math.PI / 180,
                speed: 22,
            };
            let keys = {};
            let mouseDX = 0,
                mouseDY = 0;
            let pointerLocked = false;
            let orbitAngle = 0,
                orbitTarget = [180, 60, 105],
                orbitDist = 60,
                orbitSpeed = .15;

            function setupControls() {
                document.addEventListener('keydown', e => {
                    keys[e.code] = true;
                    if (e.code === 'KeyF') setMode('fly');
                    if (e.code === 'KeyG') setMode('walk');

                    if (e.code === 'Digit1') setTime(0);
                    if (e.code === 'Digit2') setTime(1);

                canvas.addEventListener('click', async () => {

                    }
                });
                document.addEventListener('pointerlockchange', () => {

                document.addEventListener('mousemove', e => {
                    if (!pointerLocked) return;

                let buttons = {
                    'btn-dawn': () => setTime(0),
                    'btn-day': () => setTime(1),
                    'btn-dusk': () => setTime(2),

                    'btn-fly': () => setMode('fly'),
                    'btn-walk': () => setMode('walk'),

            }

            // Time of day
            let timeOfDay = 2; // 0=dawn,1=day,2=dusk,3=night
            let timeColors = [
                { sun: [1, .7, .4], amb: .35, fog: [.7, .5, .4], fogD: .0012, sunI: .7, lightDir: [-.5, .4, -.3] },
                { sun: [1, .95, .85], amb: .45, fog: [.65, .75, .85], fogD: .0005, sunI: 1, lightDir: [-.4, .8, -.3] },
                { sun: [1, .5, .25], amb: .3, fog: [.5, .3, .25], fogD: .001, sunI: .6, lightDir: [-.3, .2, -.4] },
                { sun: [.3, .4, .7], amb: .15, fog: [.1, .12, .2], fogD: .0015, sunI: .35, lightDir: [-.2, .1, -.3] },
            ];
            let currentTime = 2;

            function setTime(t) {
                currentTime = t;
                document.querySelectorAll('#ui button').forEach(b => {
                    let map = { 0: 'btn-dawn', 1: 'btn-day', 2: 'btn-dusk', 3: 'btn-night' };
