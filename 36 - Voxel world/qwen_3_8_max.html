        backdrop-filter:blur(6px);pointer-events:none}

       border:1px solid rgba(226,197,132,.28);backdrop-filter:blur(8px)}

<body>

<div id="loading"><h2>⚜ ELDENMOOR ⚜</h2><div class="sub">raising mountains, laying stones, lighting torches…</div><div id="pct"></div></div>

<script>
(async()=>{
"use strict";
const $=id=>document.getElementById(id);
const pct=t=>{$('pct').textContent=t;};
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const v3=(x=0,y=0,z=0)=>({x,y,z});
const sub=(a,b)=>v3(a.x-b.x,a.y-b.y,a.z-b.z), add=(a,b)=>v3(a.x+b.x,a.y+b.y,a.z+b.z);
const scl=(a,s)=>v3(a.x*s,a.y*s,a.z*s), dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>v3(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const len=a=>Math.hypot(a.x,a.y,a.z), norm=a=>{const l=len(a)||1;return scl(a,1/l);};
function m4mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)
 o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}
function m4persp(fov,asp,n,f){const t=1/Math.tan(fov/2),o=new Float32Array(16);
 o[0]=t/asp;o[5]=t;o[10]=f/(n-f);o[11]=-1;o[14]=n*f/(n-f);return o;}
function m4look(e,c,u){const z=norm(sub(e,c)),x=norm(cross(u,z)),y=cross(z,x);
 return new Float32Array([x.x,y.x,z.x,0,x.y,y.y,z.y,0,x.z,y.z,z.z,0,-dot(x,e),-dot(y,e),-dot(z,e),1]);}
function m4inv(m){const inv=new Float32Array(16);
 inv[0]=m[5]*m[10]*m[15]-m[5]*m[11]*m[14]-m[9]*m[6]*m[15]+m[9]*m[7]*m[14]+m[13]*m[6]*m[11]-m[13]*m[7]*m[10];
 inv[4]=-m[4]*m[10]*m[15]+m[4]*m[11]*m[14]+m[8]*m[6]*m[15]-m[8]*m[7]*m[14]-m[12]*m[6]*m[11]+m[12]*m[7]*m[10];
 inv[8]=m[4]*m[9]*m[15]-m[4]*m[11]*m[13]-m[8]*m[5]*m[15]+m[8]*m[7]*m[13]+m[12]*m[5]*m[11]-m[12]*m[7]*m[9];
 inv[12]=-m[4]*m[9]*m[14]+m[4]*m[10]*m[13]+m[8]*m[5]*m[14]-m[8]*m[6]*m[13]-m[12]*m[5]*m[10]+m[12]*m[6]*m[9];
 inv[1]=-m[1]*m[10]*m[15]+m[1]*m[11]*m[14]+m[9]*m[2]*m[15]-m[9]*m[3]*m[14]-m[13]*m[2]*m[11]+m[13]*m[3]*m[10];
 inv[5]=m[0]*m[10]*m[15]-m[0]*m[11]*m[14]-m[8]*m[2]*m[15]+m[8]*m[3]*m[14]+m[12]*m[2]*m[11]-m[12]*m[3]*m[10];
 inv[9]=-m[0]*m[9]*m[15]+m[0]*m[11]*m[13]+m[8]*m[1]*m[15]-m[8]*m[3]*m[13]-m[12]*m[1]*m[11]+m[12]*m[3]*m[9];
 inv[13]=m[0]*m[9]*m[14]-m[0]*m[10]*m[13]-m[8]*m[1]*m[14]+m[8]*m[2]*m[13]+m[12]*m[1]*m[10]-m[12]*m[2]*m[9];
 inv[2]=m[1]*m[6]*m[15]-m[1]*m[7]*m[14]-m[5]*m[2]*m[15]+m[5]*m[3]*m[14]+m[13]*m[2]*m[7]-m[13]*m[3]*m[6];
 inv[6]=-m[0]*m[6]*m[15]+m[0]*m[7]*m[14]+m[4]*m[2]*m[15]-m[4]*m[3]*m[14]-m[12]*m[2]*m[7]+m[12]*m[3]*m[6];
 inv[10]=m[0]*m[5]*m[15]-m[0]*m[7]*m[13]-m[4]*m[1]*m[15]+m[4]*m[3]*m[13]+m[12]*m[1]*m[7]-m[12]*m[3]*m[5];
 inv[14]=-m[0]*m[5]*m[14]+m[0]*m[6]*m[13]+m[4]*m[1]*m[14]-m[4]*m[2]*m[13]-m[12]*m[1]*m[6]+m[12]*m[2]*m[5];
 inv[3]=-m[1]*m[6]*m[11]+m[1]*m[7]*m[10]+m[5]*m[2]*m[11]-m[5]*m[3]*m[10]-m[9]*m[2]*m[7]+m[9]*m[3]*m[6];
 inv[7]=m[0]*m[6]*m[11]-m[0]*m[7]*m[10]-m[4]*m[2]*m[11]+m[4]*m[3]*m[10]+m[8]*m[2]*m[7]-m[8]*m[3]*m[6];
 inv[11]=-m[0]*m[5]*m[11]+m[0]*m[7]*m[9]+m[4]*m[1]*m[11]-m[4]*m[3]*m[9]-m[8]*m[1]*m[7]+m[8]*m[3]*m[5];
 inv[15]=m[0]*m[5]*m[10]-m[0]*m[6]*m[9]-m[4]*m[1]*m[10]+m[4]*m[2]*m[9]+m[8]*m[1]*m[6]-m[8]*m[2]*m[5];
 let det=m[0]*inv[0]+m[1]*inv[4]+m[2]*inv[8]+m[3]*inv[12];if(!det)det=1;det=1/det;
 for(let i=0;i<16;i++)inv[i]*=det;return inv;}

/* ================= WebGPU init ================= */
pct('waking the graphics forge…');
if(!navigator.gpu){$('pct').textContent='This browser does not support WebGPU — try Chrome or Edge 113+.';return;}
const adapter=await navigator.gpu.requestAdapter();
if(!adapter){$('pct').textContent='No WebGPU adapter found.';return;}
const device=await adapter.requestDevice();
const canvas=$('gfx'), ctx=canvas.getContext('webgpu');
const fmt=await navigator.gpu.getPreferredCanvasFormat();
ctx.configure({device,format:fmt,alphaMode:'opaque'});

/* ================= noise ================= */
function h2(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);}
function h3(x,y,z){const n=Math.sin(x*127.1+y*269.5+z*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
 const a=h2(xi,zi),b=h2(xi+1,zi),c=h2(xi,zi+1),d=h2(xi+1,zi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,z){let s=0,a=.5,f=1;for(let i=0;i<4;i++){s+=a*vn(x*f,z*f);a*=.5;f*=2.03;}return s;}
const ridge=(x,z)=>1-Math.abs(vn(x,z)*2-1);

/* ================= world ================= */
pct('shaping the land…');await tick();
const WX=256,WY=96,WZ=256,WL=9;
const W=new Uint8Array(WX*WZ*WY);
const TI=(x,z)=>(x*WZ+z)*WY;
const get=(x,y,z)=>(x<0||x>=WX||y<0||y>=WY||z<0||z>=WZ)?0:W[TI(x,z)+y];
const set=(x,y,z,id)=>{if(x>=0&&x<WX&&y>=0&&y<WY&&z>=0&&z<WZ)W[TI(x,z)+y]=id;};
const A=0,GRASS=1,DIRT=2,STONE=3,SAND=4,WATER=5,LOG=6,LEAF=7,PLANK=8,BRICK=9,RRED=10,RTHATCH=11,
TORCH=12,WIN=13,LAVA=14,SNOW=15,BASALT=16,DEAD=17,CLOTH=18,W FALL_PLACEHOLDER=0; // (typo guard)
// NOTE: ids (kept flat & explicit):
const WATERFALL=19,DARK=20,WHEAT=21,REED=22,LANTERN=23,RSLATE=24,COBBLE=25,PLASTER=26,TIMBER=27,
FRED=28,FYEL=29,HEDGE=30,PINE=31,CLOTHR=32,MOSS=33,GOLD=34,TILLED=35;
const H=new Float32Array(WX*WZ);
const CASTLE={x:88,z:104,top:29};

const rx=z=>150+22*Math.sin(z*0.02)+10*Math.sin(z*0.005+2);
const rw=z=>6.5+2.5*Math.sin(z*0.013);

for(let x=0;x<WX;x++)for(let z=0;z<WZ;z++){
 let h=11+fbm(x*0.021,z*0.021)*9+fbm(x*0.083,z*0.083)*2.2;
 const m=smooth(64,20,z);                                   // northern mountains
 if(m>0){h+=m*m*(6+ridge(x*0.03,z*0.03)*34+fbm(x*0.09,z*0.09)*8);}
 h+=smooth(26,0,len(sub(v3(x,0,z),v3(20,0,140))))*10;       // western ridge
 let dv=len(sub(v3(x,0,z),v3(218,0,30)));                   // volcano
 const cone=clamp(1-dv/27,0,1);
 if(cone>0)h=lerp(h,13+cone*cone*42,clamp(cone*1.7,0,1));
 const dc=len(sub(v3(x,0,z),v3(88,0,104)));                 // castle hill
 if(dc<34)h=Math.max(h,12+smooth(34,4,dc)*18);
 if(dc<24){h=dc<13?29:dc<17?25:dc<21?21:29-smooth(21,27,dc)*17;} // terraces
 if(dc>=21&&dc<=24)h=6;                                     // moat trench
 const ve=len(sub(v3(x,0,z),v3(212,0,118)));                // village plateau
 if(ve<52)h=lerp(h,13,smooth(52,42,ve));
 if(x>214&&z>196)h+=smooth(214,250,x)*smooth(196,226,z)*(9+fbm(x*0.1,z*0.1)*5); // SE cliffs
 const dRiv=Math.abs(x-rx(z));                              // river carve
 if(dRiv<rw(z)+4){const t=smooth(rw(z)+4,rw(z)-3,dRiv);
  const bed=z<46?lerp(15,6,smooth(38,52,z)):6;
  h=lerp(h,bed,t);}
 H[x*WZ+z]=h;
}
// fill columns
for(let x=0;x<WX;x++)for(let z=0;z<WZ;z++){
 const hi=Math.round(H[x*WZ+z]),t=TI(x,z);
 const dv=len(sub(v3(x,0,z),v3(218,0,30)));
 for(let y=0;y<=hi&&y<WY;y++){
  let id=STONE;
  if(y>hi-3)id=DIRT;
  if(y===hi){
   id=GRASS;
   if(hi<=WL+1)id=SAND;
   if(hi>40||(z<52&&hi>27))id=SNOW;
   if(dv<30)id=hi>16?BASALT:DIRT;
   if(x>214&&z>196&&hi>15)id=STONE;
  }
  if(dv<30&&y<hi&&y>hi-4)id=BASALT;
  W[t+y]=id;
 }
 for(let y=hi+1;y<=WL;y++)W[t+y]=WATER;                     // sea-level water
 if(hi<WL&&get(x,hi+1,z)===0){}                             // (river handled above by bed<WL)
}
// alpine river water above WL
for(let z=0;z<46;z++)for(let x=0;x<WX;x++){
 const d=Math.abs(x-rx(z));if(d>=rw(z))continue;
 const hi=Math.round(H[x*WZ+z]);if(hi>=WL)set(x,hi+1,z,WATER);
}
/* ---- waterfalls ---- */
{const z=46,cx=Math.round(rx(z));
 for(let dx=-1;dx<=1;dx++)for(let y=8;y<=16;y++)set(cx+dx,y,z,WATERFALL);
 set(cx,17,z,WATER);set(cx-1,17,z,WATER);set(cx+1,17,z,WATER);}
{for(let y=11;y<=19;y++){set(236,y,205,WATERFALL);set(236,y,206,WATERFALL);}}

/* ================= decorators ================= */
const smokes=[],flags=[],treeAvoid=new Uint8Array(WX*WZ);
const markAvoid=(x,z,r)=>{for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++){
 const xx=x+i,zz=z+j;if(xx>=0&&xx<WX&&zz>=0&&zz<WZ&&i*i+j*j<=r*r)treeAvoid[xx*WZ+zz]=1;}};
const topY=(x,z)=>{if(x<0||x>=WX||z<0||z>=WZ)return 0;const t=TI(x,z);
 for(let y=WY-1;y>=0;y--)if(W[t+y]!==A&&W[t+y]!==WATER&&W[t+y]!==WATERFALL)return y;return 0;};
function flatten(x0,z0,x1,z0z1,h,top){ // rect flatten
 for(let x=x0;x<=x1;x++)for(let z=z0z1[0];z<=z0z1[1];z++){
  const t=TI(x,z);let cur=0;for(let y=WY-1;y>=0;y--){const id=W[t+y];if(id!==A&&id!==WATER){cur=y;break;}}
  for(let y=Math.min(cur,h);y<=Math.max(cur,h);y++){if(y<=h)W[t+y]=(y===h?top:(y>h-3?DIRT:STONE));else if(y>h&&y<=cur)W[t+y]=A;}
 }}
function column(x,y0,y1,id){for(let y=y0;y<=y1;y++)set(x,y,z,id);} // helper placeholder (z via closure not used)

/* ================= castle ================= */
pct('raising the castle…');await tick();
function gableRoof(x0,z0,w,d,h,id,axis){ // axis 'z' => ridge along z
 for(let i=0;i<h;i++){
  const shrink=i;
  if(axis==='z'){const xa=x0+shrink,xb=x0+w-1-shrink;if(xa>xb){for(let z=z0;z<z0+d;z++)for(let x=xa-1;x<=xb+1;x++)set(x,i,z,id);break;}
   for(let z=z0;z<z0+d;z++)for(let x=xa;x<=xb;x++)set(x,i,z,id);}
  else{const za=z0+shrink,zb=z0+d-1-shrink;if(za>zb)break;
   for(let x=x0;x<x0+w;x++)for(let z=za;z<=zb;z++)set(z===za||z===zb?x:x,i,z,id);} // fill rect
 }
}
function roofZ(x0,y,z0,w,d,h,id){for(let i=0;i<h;i++){const xa=x0+i,xb=x0+w-1-i;
 if(xa>xb){for(let z=z0;z<z0+d;z++)set(x0+(w>>1),y+i,z,id);continue;}
 for(let z=z0;z<z0+d;z++)for(let x=xa;x<=xb;x++)set(x,y+i,z,id);}}
function roofX(x0,y,z0,w,d,h,id){for(let i=0;i<h;i++){const za=z0+i,zb=z0+d-1-i;
 if(za>zb){for(let x=x0;x<x0+w;x++)set(x,y+i,z0+(d>>1),id);continue;}
 for(let x=x0;x<x0+w;x++)for(let z=za;z<=zb;z++)set(x,y+i,z,id);}}

{
 const cx=CASTLE.x,cz=CASTLE.z,T=CASTLE.top;
 for(let x=cx-11;x<=cx+11;x++)for(let z=cz-11;z<=cz+11;z++)set(x,T,z,COBBLE);
 // curtain walls + battlements
 for(let x=cx-11;x<=cx+11;x++)for(let z=cz-11;z<=cz+11;z++){
  const edge=(x===cx-11||x===cx+11||z===cz-11||z===cz+11);if(!edge)continue;
  if(z===cz&&x>=cx+9)continue; // gate gap east
  for(let y=T+1;y<=T+5;y++)set(x,y,z,BRICK);
  if((x+z)%2===0)set(x,T+6,z,BRICK);
 }
 for(let y=T+1;y<=T+3;y++){set(cx+11,y,cz-1,BRICK);set(cx+11,y,cz+1,BRICK);} // gate jambs
 for(let y=T+4;y<=T+5;y++)for(let dz=-1;dz<=1;dz++)set(cx+11,y,cz+dz,BRICK);
 // corner towers
 [[-11,-11],[11,-11],[-11,11],[11,11]].forEach(([ox,oz],ti)=>{
  for(let x=ox-1;x<=ox+1;x++)for(let z=oz-1;z<=oz+1;z++)
   for(let y=T+1;y<=T+9;y++)set(cx+x,y,cz+z,BRICK);
  for(let x=ox-1;x<=ox+1;x++)for(let z=oz-1;z<=oz+1;z++){if((x+z)%2===0||true)set(cx+x,T+10,cz+z,BRICK);}
  set(cx+ox,T+11,cz+oz,LOG);set(cx+ox,T+12,cz+oz,LOG);
  flags.push({x:cx+ox,y:T+13,z:cz+oz,dx:ox>0?1:-1,dz:oz>0?0.3:-0.3,ph:ti});
 });
 // gatehouse side towers
 [[cz-3],[cz+3]].forEach(([gz])=>{
  for(let x=10;x<=12;x++)for(let z=gz-1;z<=gz+1;z++)for(let y=T+1;y<=T+7;y++)set(cx+x,y,cz+z,BRICK);
  for(let x=10;x<=12;x++)for(let z=gz-1;z<=gz+1;z++)set(cx+x,T+8,cz+z,BRICK);
 });
 // keep
 const kx=cx-2,kz=cz;
 for(let x=kx-3;x<=kx+3;x++)for(let z=kz-3;z<=kz+3;z++)for(let y=T+1;y<=T+12;y++)set(x,y,z,BRICK);
 for(let x=kx-3;x<=kx+3;x++)for(let z=kz-3;z<=kz+3;z++){if((x+z)%2===0)set(x,T+13,z,BRICK);}
 [[-3,-3],[3,-3],[-3,3],[3,3]].forEach(([ox,oz])=>{
  for(let y=T+13;y<=T+15;y++)set(kx+ox,y,kz+oz,BRICK);
  roofX(kx+ox-1,T+16,kz+oz-1,3,3,2,RSLATE);});
 for(let s=0;s<3;s++)for(const dz of[-2,0,2]){set(kx+4,T+4+s*3,kz+dz,WIN);}
 for(const dz of[-2,2])set(kx+4,T+2,kz+dz,TORCH);
 set(kx,T+16,kz,LOG);set(kx,T+17,kz,LOG);flags.push({x:kx,y:T+18,z:kz,dx:1,dz:0,ph:4});
 // chapel
 const px=cx-7,pz=cz-6;
 for(let x=px-2;x<=px+2;x++)for(let z=pz-3;z<=pz+3;z++)for(let y=T+1;y<=T+5;y++)set(x,y,z,BRICK);
 roofX(px-3,T+6,pz-4,7,9,3,RSLATE);
 for(let y=T+6;y<=T+11;y++)set(px,y,pz-3,BRICK);
 roofX(px-1,T+12,pz-4,3,3,2,RSLATE);set(px,T+14,pz-3,BRICK);set(px,T+15,pz-3,BRICK);
 set(px+3,T+3,pz,WIN);set(px+3,T+3,pz-2,WIN);set(px-3,T+3,pz,WIN);
 // courtyard props
 const wx=cx+4,wz=cz+4;

  var c=base*(u.ambient.rgb+u.sunColor.rgb*diff);
  let hv=normalize(u.sunDir.xyz+V);
  c+=u.sunColor.rgb*pow(max(dot(n,hv),0.0),90.0)*1.2;
  c=mix(c,sky,clamp(fres*0.85,0.0,1.0));
  return vec4f(mix(c,u.fogColor.rgb,fogF(i.wp)),0.82); }

 var n=vec3f(0,1,0);
 if(ni==0){n=vec3f(1,0,0);}else if(ni==1){n=vec3f(-1,0,0);}else if(ni==3){n=vec3f(0,-1,0);}
 else if(ni==4){n=vec3f(0,0,1);}else if(ni==5){n=vec3f(0,0,-1);}
 let diff=max(dot(n,u.sunDir.xyz),0.0);
 let hemi=0.5+0.5*n.y;

  if(g>1.5&&g<2.5){pulse=0.72+0.28*sin(T*11.0+i.wp.x*13.0+i.wp.z*17.0)*sin(T*6.7+i.wp.y*9.0);}

const COMP=/* wgsl */`
@group(0)@binding(0) var smp:sampler;
@group(0)@binding(1) var tex:texture_2d<f32>;
struct PC{ res:vec4f };
@group(0)@binding(2) var<uniform> pc:PC;
struct CO{ @builtin(position) p:vec4f, @location(0) uv:vec2f };
@vertex fn vs(@builtin(vertex_index) vi:u32)->CO{
 var q=array<vec2f,3>(vec2f(-1,-3),vec2f(3,1),vec2f(-1,1));
 var o:CO; o.p=vec4f(q[vi],0,1); o.uv=q[vi]*0.5+0.5; return o; }
fn aces(x:vec3f)->vec3f{ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),vec3f(0),vec3f(1)); }
@fragment fn fs(i:CO)->@location(0) vec4f{
 var col=textureSample(tex,smp,i.uv).rgb;
 if(pc.res.z>0.01){ var b=vec3f(0);
  let rad=vec2f(pc.res.w)*0.006;
  for(var k=0;k<8;k++){ let ang=f32(k)*0.785;
   let off=vec2f(cos(ang),sin(ang))*rad*(1.0+f32(k%2)*0.7);
   let s=textureSample(tex,smp,i.uv+off).rgb;
   b+=max(s-vec3f(0.72),vec3f(0)); }
  col+=b*0.42*pc.res.z; }

 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(canvas.clientWidth*dpr);canvas.height=Math.floor(canvas.clientHeight*dpr);
 makeTargets();}
addEventListener('resize',resize);resize();

/* ================= times of day ================= */
const TIMES=[
 {dir:[0.72,0.24,0.30],sun:[1.35,0.72,0.42],amb:[0.34,0.30,0.40],skyT:[0.30,0.35,0.60],skyB:[0.98,0.60,0.40],fog:[0.90,0.63,0.48,0.0065],glow:1.7},
 {dir:[0.50,0.80,0.30],sun:[1.25,1.17,1.02],amb:[0.40,0.44,0.52],skyT:[0.32,0.58,0.94],skyB:[0.76,0.88,0.98],fog:[0.74,0.85,0.95,0.0042],glow:0.9},
 {dir:[-0.65,0.22,0.25],sun:[1.45,0.58,0.30],amb:[0.30,0.26,0.38],skyT:[0.22,0.22,0.48],skyB:[0.96,0.44,0.28],fog:[0.72,0.47,0.40,0.0065],glow:1.9},
 {dir:[-0.30,0.60,-0.45],sun:[0.30,0.36,0.58],amb:[0.13,0.15,0.24],skyT:[0.02,0.03,0.09],skyB:[0.08,0.10,0.20],fog:[0.05,0.07,0.12,0.0072],glow:2.8}];
let cur=JSON.parse(JSON.stringify(TIMES[1])),tgt=TIMES[1];
function lerpTo(dt){const k=1-Math.exp(-dt*1.4);
 for(const key of['sun','amb','skyT','skyB','glow']){
  if(typeof cur[key]==='number')cur[key]=lerp(cur[key],tgt[key],k);
  else for(let i=0;i<cur[key].length;i++)cur[key][i]=lerp(cur[key][i],tgt[key][i],k);}
 for(let i=0;i<3;i++)cur.dir[i]=lerp(cur.dir[i],tgt.dir[i],k);
 for(let i=0;i<4;i++)cur.fog[i]=lerp(cur.fog[i],tgt.fog[i],k);}
let bloomOn=false,bloomAmt=0;

/* ================= camera & input ================= */
let mode='orbit',pos=v3(250,110,250),yaw=2.4,pitch=-0.45,keys={};
let orbA=0.8,orbR=210,orbT=0;
const TARGET=v3(110,26,110);
const topAt=(x,z)=>topY(Math.floor(x),Math.floor(z));
addEventListener('keydown',e=>{keys[e.code]=true;
 if(e.code==='Digit1')setTime(0);if(e.code==='Digit2')setTime(1);
 if(e.code==='Digit3')setTime(2);if(e.code==='Digit4')setTime(3);
 if(e.code==='KeyB')toggleBloom();if(e.code==='KeyP')shot();});
addEventListener('keyup',e=>keys[e.code]=false);
canvas.addEventListener('click',()=>{if(mode!=='orbit'&&document.pointerLockElement!==canvas)canvas.requestPointerLock();});
addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;
 yaw+=e.movementX*0.0022;pitch=clamp(pitch-e.movementY*0.0022,-1.5,1.5);});
addEventListener('wheel',e=>{if(mode==='orbit')orbR=clamp(orbR+e.deltaY*0.08,30,260);});
function setMode(m){mode=m;document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 if(m==='orbit'){orbR=len(sub(pos,TARGET));orbA=Math.atan2(pos.z-TARGET.z,pos.x-TARGET.x);}
 if(m==='walk'){pos.y=topAt(pos.x,pos.z)+2.4;pitch=clamp(pitch,-0.4,0.4);}}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function setTime(i){tgt=TIMES[i];document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===i));}
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTime(+b.dataset.t));
function toggleBloom(){bloomOn=!bloomOn;$('bloom').classList.toggle('on',bloomOn);}
$('bloom').onclick=toggleBloom;
let shotPending=false;
function shot(){$('title').classList.add('off');$('hint').classList.add('off');$('bar').classList.add('off');shotPending=true;}
$('shot').onclick=shot;

/* ================= frustum culling ================= */
function frustum(m){const row=r=>[m[r],m[4+r],m[8+r],m[12+r]];
 const r0=row(0),r1=row(1),r2=row(2),r3=row(3),p=[];
 [[r3,r0,1],[r3,r0,-1],[r3,r1,1],[r3,r1,-1],[r3,r2,1],[r3,r2,-1]].forEach(([a,b,s])=>
  p.push([a[0]+s*b[0],a[1]+s*b[1],a[2]+s*b[2],a[3]+s*b[3]]));
 p.forEach(q=>{const l=Math.hypot(q[0],q[1],q[2])||1;q[0]/=l;q[1]/=l;q[2]/=l;q[3]/=l;});return p;}
const inF=(p,x,y,z,r)=>{for(const q of p)if(q[0]*x+q[1]*y+q[2]*z+q[3]<-r)return false;return true;};

/* ================= main loop ================= */
pct('lighting the torches…');await tick();
const U=new Float32Array(80);
let last=performance.now(),T=0;
function writeU(modeId,vp,invVP,cam,right,up){
 U.set(vp,0);U.set(invVP,16);
 U[32]=cam.x;U[33]=cam.y;U[34]=cam.z;U[35]=1;
 U[36]=right.x;U[37]=right.y;U[38]=right.z;U[39]=0;
 U[40]=up.x;U[41]=up.y;U[42]=up.z;U[43]=0;
 const sd=norm(v3(cur.dir[0],cur.dir[1],cur.dir[2]));
 U[44]=sd.x;U[45]=sd.y;U[46]=sd.z;U[47]=0;
 U[48]=cur.sun[0];U[49]=cur.sun[1];U[50]=cur.sun[2];U[51]=1;
 U[52]=cur.amb[0];U[53]=cur.amb[1];U[54]=cur.amb[2];U[55]=1;
 U[56]=cur.fog[0];U[57]=cur.fog[1];U[58]=cur.fog[2];U[59]=cur.fog[3];
 U[60]=cur.skyT[0];U[61]=cur.skyT[1];U[62]=cur.skyT[2];U[63]=1;
 U[64]=cur.skyB[0];U[65]=cur.skyB[1];U[66]=cur.skyB[2];U[67]=1;
 U[68]=T;U[69]=modeId;U[70]=cur.glow;U[71]=0;
 device.queue.writeBuffer(ubuf,0,U);}
const sceneBG=device.createBindGroup({layout:sceneBGL,entries:[{binding:0,resource:ubuf}]});
$('loading').classList.add('off');

function frame(){
 requestAnimationFrame(frame);
 const now=performance.now(),dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
 lerpTo(dt);bloomAmt=lerp(bloomAmt,bloomOn?1:0,1-Math.exp(-dt*3));
 // camera
 let look;
 if(mode==='orbit'){
  orbT+=dt;orbA+=dt*0.05;
  orbR=lerp(orbR,orbR<120?orbR:95,dt*0.02);
  const h=clamp(40+Math.sin(orbT*0.1)*10,18,120);
  pos=v3(TARGET.x+Math.cos(orbA)*orbR,h,TARGET.z+Math.sin(orbA)*orbR);
  look=TARGET;
 }else{
  const f=v3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  look=add(pos,f);
  const fw=v3(Math.sin(yaw),0,Math.cos(yaw)),rt=v3(fw.z,0,-fw.x);
  const sp=(mode==='fly'?(keys.ShiftLeft?46:22):(keys.ShiftLeft?13:7))*dt;
  if(keys.KeyW)pos=add(pos,scl(mode==='walk'?fw:f,sp));
  if(keys.KeyS)pos=add(pos,scl(mode==='walk'?fw:f,-sp));
  if(keys.KeyA)pos=add(pos,scl(rt,sp));
  if(keys.KeyD)pos=add(pos,scl(rt,-sp));
  if(mode==='fly'){if(keys.Space)pos.y+=sp;if(keys.KeyC)pos.y-=sp;}
  else{const g=Math.max(topAt(pos.x,pos.z)+1,WL+1)+1.6;pos.y=lerp(pos.y,g,1-Math.exp(-dt*10));}
  pos.x=clamp(pos.x,2,WX-2);pos.z=clamp(pos.z,2,WZ-2);pos.y=clamp(pos.y,2,WY+40);
 }
 const view=m4look(pos,look||add(pos,v3(0,0,1)),v3(0,1,0));
 const proj=m4persp(1.05,canvas.width/canvas.height,0.3,900);
 const vp=m4mul(proj,view),invVP=m4inv(vp);
 const fwd=norm(sub(look||add(pos,v3(0,0,1)),pos));
 const right=norm(cross(fwd,v3(0,1,0))),up=cross(right,fwd);
 const planes=frustum(vp);
 device.queue.writeBuffer(pbuf,0,new Float32Array([canvas.width,canvas.height,bloomAmt,Math.max(canvas.width,canvas.height)]));
 const enc=device.createCommandEncoder();
 const pass=enc.beginRenderPass({colorAttachments:[{view:sceneTex.createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}],
  depthStencilAttachment:{view:depthTex.createView(),depthLoadOp:'clear',depthStoreOp:'store',depthClearValue:1}});
 // sky
 writeU(7,vp,invVP,pos,right,up);pass.setPipeline(pipeSky);pass.setBindGroup(0,sceneBG);pass.draw(3);
 // solid chunks
 writeU(0,vp,invVP,pos,right,up);pass.setPipeline(pipeSolid);pass.setBindGroup(0,sceneBG);
 pass.setVertexBuffer(0,solidVB);pass.setIndexBuffer(solidIB,'uint32');
 for(const c of solidRanges)if(inF(planes,c.cx,c.my,c.cz,c.r))pass.drawIndexed(c.count,1,c.first);
 // flags
 writeU(2,vp,invVP,pos,right,up);pass.setVertexBuffer(0,flagVB);pass.setIndexBuffer(flagIB,'uint32');
 pass.drawIndexed(FI.length);
 // birds
 writeU(5,vp,invVP,pos,right,up);pass.setPipeline(pipeBird);
 pass.setVertexBuffer(0,birdGeom);pass.setVertexBuffer(1,birdVB);pass.draw(6,birdInst.length);
 // water
 writeU(1,vp,invVP,pos,right,up);pass.setPipeline(pipeWater);
 pass.setVertexBuffer(0,waterVB);pass.setIndexBuffer(waterIB,'uint32');
 for(const c of waterRanges)if(inF(planes,c.cx,c.my,c.cz,c.r))pass.drawIndexed(c.count,1,c.first);
 // clouds
 writeU(3,vp,invVP,pos,right,up);pass.setPipeline(pipeBlend);
 pass.setVertexBuffer(0,cloudVB);pass.setIndexBuffer(cloudIB,'uint32');pass.drawIndexed(CI.length);
 // smoke
 writeU(4,vp,invVP,pos,right,up);pass.setPipeline(pipeSmoke);
 pass.setVertexBuffer(0,quadVB);pass.setVertexBuffer(1,smokeVB);pass.draw(4,smokeArr.length);
 // sun/moon sprite
 writeU(6,vp,invVP,pos,right,up);pass.setPipeline(pipeAdd);pass.draw(6);
 pass.end();
 // composite
 const cp=enc.beginRenderPass({colorAttachments:[{view:ctx.getCurrentTexture().createView(),loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
 cp.setPipeline(compPipe);cp.setBindGroup(0,compBG);cp.draw(3);cp.end();
 device.queue.submit([enc.finish()]);
 if(shotPending){shotPending=false;
  device.queue.onSubmittedWorkDone().then(()=>{
   canvas.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='eldenmoor.png';a.click();
    $('title').classList.remove('off');$('hint').classList.remove('off');$('bar').classList.remove('off');});});}
}
frame();
})();
</script>
