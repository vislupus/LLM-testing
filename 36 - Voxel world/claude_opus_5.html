<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Aldermoor — a WebGPU voxel realm</title>
<style>
  :root{
    --ink:#0b0d12;
    --parchment:#e8dcc0;
    --gold:#d7a94b;
    --ember:#e0663a;
    --moss:#7f9a5c;
    --slate:rgba(16,19,26,.72);
    --line:rgba(215,169,75,.28);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05070b;color:var(--parchment);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    -webkit-font-smoothing:antialiased;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}

  /* ---------- top corners ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #title{position:absolute;top:20px;left:24px;line-height:1}
  #title b{display:block;font-size:26px;letter-spacing:.24em;font-weight:500;
    color:var(--parchment);text-shadow:0 2px 18px rgba(0,0,0,.85)}
  #title span{display:block;margin-top:7px;font-size:10.5px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--gold);opacity:.8;font-family:ui-monospace,monospace}
  #stats{position:absolute;top:22px;right:24px;text-align:right;font-family:ui-monospace,monospace;
    font-size:11px;line-height:1.75;color:rgba(232,220,192,.62);text-shadow:0 1px 10px #000}
  #stats b{color:var(--gold);font-weight:500}
  #compass{position:absolute;top:96px;right:24px;width:64px;height:64px;opacity:.55}

  /* ---------- bottom control rail ---------- */
  #rail{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
    display:flex;gap:10px;align-items:stretch;padding:9px;border-radius:3px;
    background:linear-gradient(180deg,rgba(20,23,31,.82),rgba(9,11,16,.9));
    border:1px solid var(--line);backdrop-filter:blur(14px);
    box-shadow:0 18px 50px -18px #000, inset 0 1px 0 rgba(255,255,255,.05)}
  .grp{display:flex;flex-direction:column;gap:6px;padding:0 9px}
  .grp+.grp{border-left:1px solid rgba(215,169,75,.18)}
  .grp>em{font-style:normal;font-family:ui-monospace,monospace;font-size:8.5px;letter-spacing:.28em;
    text-transform:uppercase;color:rgba(215,169,75,.62);padding-left:1px}
  .row{display:flex;gap:5px}
  button{appearance:none;border:1px solid rgba(215,169,75,.22);background:rgba(232,220,192,.05);
    color:rgba(232,220,192,.86);font:500 11.5px/1 ui-monospace,monospace;letter-spacing:.09em;
    padding:8px 11px;border-radius:2px;cursor:pointer;transition:.16s ease;white-space:nowrap}
  button:hover{background:rgba(215,169,75,.16);border-color:rgba(215,169,75,.5);color:#fff}
  button.on{background:linear-gradient(180deg,rgba(215,169,75,.32),rgba(215,169,75,.16));
    border-color:var(--gold);color:#fff8e6;box-shadow:0 0 16px -4px rgba(215,169,75,.6)}
  button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- help ---------- */
  #help{position:fixed;left:24px;bottom:22px;z-index:20;width:272px;padding:16px 18px;
    border:1px solid var(--line);border-radius:3px;background:rgba(9,11,16,.9);
    backdrop-filter:blur(14px);font-family:ui-monospace,monospace;font-size:11px;line-height:1.95;
    color:rgba(232,220,192,.72);display:none}
  #help.show{display:block}
  #help h3{font:500 9px/1 ui-monospace,monospace;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);margin-bottom:10px}
  #help div{display:flex;justify-content:space-between;gap:14px}
  #help kbd{color:var(--parchment);background:rgba(232,220,192,.08);border:1px solid rgba(232,220,192,.14);
    border-radius:2px;padding:1px 6px;font-size:10px}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:82px;transform:translate(-50%,-8px);z-index:40;
    padding:9px 18px;border:1px solid var(--line);border-radius:2px;background:rgba(9,11,16,.92);
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;color:var(--gold);
    opacity:0;transition:.3s ease;pointer-events:none}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- cinematic bars ---------- */
  #bars .b{position:fixed;left:0;right:0;height:0;background:#000;z-index:30;
    transition:height .7s cubic-bezier(.6,0,.2,1);pointer-events:none}
  #bars .t{top:0}#bars .u{bottom:0}
  body.cine #bars .b{height:11vh}
  body.cine #rail,body.cine #hud,body.cine #help{opacity:0;transition:opacity .5s}
  body.shot #rail,body.shot #hud,body.shot #help,body.shot #toast{opacity:0!important}

  /* ---------- loader ---------- */
  #load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:radial-gradient(120% 80% at 50% 0%,#141a25 0%,#05070b 60%);
    transition:opacity .9s ease}
  #load.gone{opacity:0;pointer-events:none}
  #load .box{width:min(460px,84vw);text-align:center}
  #load h1{font-size:34px;letter-spacing:.36em;font-weight:400;margin-left:.36em}
  #load .sub{margin-top:10px;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--gold);opacity:.75}
  #trackw{margin-top:34px;height:1px;background:rgba(232,220,192,.14);overflow:hidden}
  #track{height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--gold));
    transition:width .35s ease;box-shadow:0 0 12px var(--gold)}
  #stage{margin-top:12px;font-family:ui-monospace,monospace;font-size:11px;
    color:rgba(232,220,192,.55);letter-spacing:.08em;min-height:16px}
  #fail{max-width:520px;padding:26px;border:1px solid rgba(224,102,58,.4);border-radius:3px;
    background:rgba(9,11,16,.8);font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.8;
    color:rgba(232,220,192,.8);display:none}
  #fail b{color:var(--ember);display:block;margin-bottom:8px;letter-spacing:.2em}

  @media (max-width:760px){
    #rail{bottom:10px;padding:7px;gap:6px;max-width:96vw;overflow-x:auto}
    .grp{padding:0 6px}button{padding:7px 8px;font-size:10.5px}
    #title b{font-size:19px}#help{display:none!important}#compass{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="gfx"></canvas>

<div id="hud">
  <div id="title"><b>ALDERMOOR</b><span>WebGPU voxel realm</span></div>
  <div id="stats"></div>
</div>

<div id="bars"><div class="b t"></div><div class="b u"></div></div>

<div id="help">
  <h3>Controls</h3>
  <div><span>Look around</span><kbd>drag / mouse</kbd></div>
  <div><span>Move</span><kbd>W A S D</kbd></div>
  <div><span>Up · Down</span><kbd>Space · Shift</kbd></div>
  <div><span>Sprint</span><kbd>Ctrl</kbd></div>
  <div><span>Speed</span><kbd>wheel</kbd></div>
  <div><span>Fly / walk</span><kbd>F</kbd></div>
  <div><span>Orbit</span><kbd>C</kbd></div>
  <div><span>Showcase</span><kbd>V</kbd></div>
  <div><span>Screenshot</span><kbd>P</kbd></div>
  <div><span>Time of day</span><kbd>1 – 4</kbd></div>
  <div><span>Bloom</span><kbd>B</kbd></div>
  <div><span>Return to sky</span><kbd>R</kbd></div>
</div>

<div id="rail">
  <div class="grp"><em>Hour</em><div class="row">
    <button data-time="dawn">Dawn</button><button data-time="day" class="on">Day</button>
    <button data-time="dusk">Dusk</button><button data-time="night">Night</button>
  </div></div>
  <div class="grp"><em>Camera</em><div class="row">
    <button data-act="fly" class="on">Fly</button><button data-act="walk">Walk</button>
    <button data-act="orbit">Orbit</button><button data-act="showcase">Showcase</button>
  </div></div>
  <div class="grp"><em>Places</em><div class="row">
    <button data-go="castle">Castle</button><button data-go="village">Village</button>
    <button data-go="volcano">Volcano</button><button data-go="peaks">Peaks</button>
  </div></div>
  <div class="grp"><em>Render</em><div class="row">
    <button data-act="bloom" class="on">Bloom</button><button data-act="shot">Capture</button>
    <button data-act="help">?</button>
  </div></div>
</div>

<div id="toast"></div>

<div id="load"><div class="box">
  <h1>ALDERMOOR</h1>
  <div class="sub">Raising a kingdom from bare voxels</div>
  <div id="trackw"><div id="track"></div></div>
  <div id="stage">waking the device…</div>
  <div id="fail"></div>
</div></div>

<script>
/* =====================================================================
   ALDERMOOR — a handcrafted voxel realm rendered with raw WebGPU.
   No engines, no libraries. One file.
   ===================================================================== */
(function () {
"use strict";

/* ---------------------------------------------------------------- utils */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const RND = mulberry32(20260726);
const rnd = () => RND();
const rndi = (n) => (RND() * n) | 0;
const pick = (arr) => arr[(RND() * arr.length) | 0];
const chance = (p) => RND() < p;

function ihash(x, y, z, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 2147483629) ^ Math.imul(s | 0, 1274126177);
  h = Math.imul(h ^ h >>> 13, 1274126177);
  return ((h ^ h >>> 16) >>> 0) / 4294967296;
}
function vn2(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = ihash(xi, yi, 0, s), b = ihash(xi + 1, yi, 0, s);
  const c = ihash(xi, yi + 1, 0, s), d = ihash(xi + 1, yi + 1, 0, s);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function vn3(x, y, z, s) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = ihash(xi, yi, zi, s), c100 = ihash(xi + 1, yi, zi, s);
  const c010 = ihash(xi, yi + 1, zi, s), c110 = ihash(xi + 1, yi + 1, zi, s);
  const c001 = ihash(xi, yi, zi + 1, s), c101 = ihash(xi + 1, yi, zi + 1, s);
  const c011 = ihash(xi, yi + 1, zi + 1, s), c111 = ihash(xi + 1, yi + 1, zi + 1, s);
  return lerp(lerp(lerp(c000, c100, u), lerp(c010, c110, u), v),
              lerp(lerp(c001, c101, u), lerp(c011, c111, u), v), w);
}
function fbm2(x, y, oct, s) {
  let a = 0, amp = 0.5, f = 1, nrm = 0;
  for (let i = 0; i < oct; i++) { a += vn2(x * f, y * f, s + i * 71) * amp; nrm += amp; amp *= 0.5; f *= 2.02; }
  return a / nrm;
}
function fbm3(x, y, z, oct, s) {
  let a = 0, amp = 0.5, f = 1, nrm = 0;
  for (let i = 0; i < oct; i++) { a += vn3(x * f, y * f, z * f, s + i * 53) * amp; nrm += amp; amp *= 0.5; f *= 2.03; }
  return a / nrm;
}
function ridged2(x, y, oct, s) {
  let a = 0, amp = 0.5, f = 1, nrm = 0;
  for (let i = 0; i < oct; i++) {
    let n = 1 - Math.abs(vn2(x * f, y * f, s + i * 97) * 2 - 1); n *= n;
    a += n * amp; nrm += amp; amp *= 0.5; f *= 2.04;
  }
  return a / nrm;
}

/* ------------------------------------------------------------- geometry */
function distSeg(px, pz, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az, wx = px - ax, wz = pz - az;
  const L = vx * vx + vz * vz;
  let t = L > 0 ? (wx * vx + wz * vz) / L : 0;
  t = clamp(t, 0, 1);
  const dx = wx - vx * t, dz = wz - vz * t;
  return { d: Math.hypot(dx, dz), t };
}
function distPath(px, pz, pts) {
  let best = 1e9, bt = 0, seg = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const r = distSeg(px, pz, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]);
    if (r.d < best) { best = r.d; bt = r.t; seg = i; }
  }
  return { d: best, seg, t: bt, u: (seg + bt) / (pts.length - 1) };
}
function samplePath(pts, u) {
  const n = pts.length - 1, f = clamp(u, 0, 0.99999) * n, i = Math.floor(f), t = f - i;
  return [lerp(pts[i][0], pts[i + 1][0], t), lerp(pts[i][1], pts[i + 1][1], t)];
}
function pathTangent(pts, u) {
  const a = samplePath(pts, clamp(u - 0.01, 0, 1)), b = samplePath(pts, clamp(u + 0.01, 0, 1));
  const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz) || 1;
  return [dx / l, dz / l];
}

/* ------------------------------------------------------------- palette */
/* colours are sRGB bytes; the shader lifts them to linear */
const BL = [{ n: 'AIR', c: [0, 0, 0], t: [0, 0, 0], s: [0, 0, 0], b: [0, 0, 0], e: 0, L: null, solid: false, water: false }];
const ID = { AIR: 0 };
function def(n, c, o) {
  o = o || {};
  BL.push({
    n, c, t: o.top || c, s: o.side || c, b: o.bot || o.side || c,
    e: o.e || 0, L: o.L || null,
    solid: o.solid !== false, water: !!o.water, foliage: !!o.foliage
  });
  return (ID[n] = BL.length - 1);
}

def('GRASS',      [110,163, 72], { side:[122,101, 66], bot:[122,101,66] });
def('GRASS_DRY',  [156,164, 86], { side:[128,108, 70] });
def('DIRT',       [122,101, 66]);
def('MUD',        [ 86, 70, 54]);
def('PATH',       [152,128, 94], { side:[128,106, 76] });
def('STONE',      [128,131,136]);
def('STONE_DARK', [ 96, 99,106]);
def('COBBLE',     [116,117,120]);
def('COBBLE_MOSS',[103,116, 98]);
def('BRICKS',     [152,150,142]);
def('BRICKS_DARK',[ 92, 95,103]);
def('SLATE',      [ 92, 97,108]);
def('MARBLE',     [232,228,216]);
def('GRAVEL',     [140,136,130]);
def('SAND',       [216,199,152]);
def('SNOW',       [240,246,252]);
def('ICE',        [172,206,232]);
def('LOG',        [102, 76, 50], { top:[142,112, 76], bot:[142,112,76] });
def('BIRCH',      [222,220,206], { top:[196,192,176], bot:[196,192,176] });
def('PINE_LOG',   [ 82, 60, 42], { top:[118, 92, 62], bot:[118,92,62] });
def('CHARRED',    [ 46, 41, 40]);
def('PLANK',      [170,130, 86]);
def('PLANK_DARK', [118, 86, 56]);
def('PLANK_PALE', [198,168,116]);
def('BEAM',       [ 84, 60, 42]);
def('PLASTER',    [224,214,194]);
def('PLASTER_WRM',[214,192,160]);
def('LEAF_OAK',   [ 68,124, 54], { foliage:true });
def('LEAF_OAK2',  [ 86,140, 60], { foliage:true });
def('LEAF_PINE',  [ 44, 94, 62], { foliage:true });
def('LEAF_BIRCH', [118,162, 74], { foliage:true });
def('LEAF_AUTUMN',[176,124, 48], { foliage:true });
def('ROOF_RED',   [150, 62, 52]);
def('ROOF_DARK',  [ 68, 63, 72]);
def('ROOF_BLUE',  [ 56, 78,120]);
def('ROOF_GREEN', [ 66,100, 78]);
def('THATCH',     [188,154, 88]);
def('HAY',        [206,176, 88]);
def('FARMLAND',   [ 92, 68, 48]);
def('CROP',       [204,178, 72], { foliage:true });
def('CROP_GREEN', [124,164, 70], { foliage:true });
def('REED',       [ 96,142, 70], { foliage:true });
def('BUSH',       [ 62,108, 56], { foliage:true });
def('FLOWER_R',   [190, 62, 62], { foliage:true });
def('FLOWER_Y',   [222,198, 72], { foliage:true });
def('FLOWER_B',   [110,120,200], { foliage:true });
def('CLOTH_RED',  [168, 52, 52]);
def('CLOTH_BLUE', [ 58, 84,150]);
def('CLOTH_GREEN',[ 72,118, 74]);
def('CLOTH_CREAM',[212,198,168]);
def('GOLD',       [216,178, 72]);
def('IRON',       [148,152,158]);
def('BASALT',     [ 56, 54, 60]);
def('BASALT_HOT', [ 84, 56, 50]);
def('OBSIDIAN',   [ 32, 28, 42]);
def('ASH',        [ 98, 94, 92]);
def('WINDOW',     [255,198,112], { e: 1.0, L: [15, 10, 5] });
def('WINDOW_DIM', [216,168, 96], { e: 0.55, L: [10, 7, 3] });
def('STAINED',    [ 96,146,206], { e: 0.8,  L: [5, 9, 14] });
def('STAINED_R',  [206, 90, 82], { e: 0.8,  L: [14, 6, 4] });
def('TORCH',      [255,176, 78], { e: 1.0, L: [15, 9, 4] });
def('LANTERN',    [255,208,142], { e: 1.0, L: [15, 11, 6] });
def('EMBER',      [232, 92, 40], { e: 0.9, L: [13, 5, 2] });
def('LAVA',       [255,116, 32], { e: 1.0, L: [15, 6, 2] });
def('CRYSTAL',    [124,222,232], { e: 0.9, L: [4, 12, 13] });
def('GLASS',      [186,214,226], { e: 0.05 });
def('WATER',      [ 34, 84,116], { water: true, solid: false });

const OPAQUE = BL.map(b => b.solid && !b.water);

/* -------------------------------------------------------------- world */
const W = 320, H = 96, D = 320, SEA = 30;
const NCELL = W * H * D;
const blocks = new Uint8Array(NCELL);
const AREA = W * D;
const hmap = new Int16Array(AREA);      // top solid surface
const biome = new Uint8Array(AREA);     // 0 plain 1 forest 2 mountain 3 volcanic 4 beach 5 built
const BIOME = { PLAIN:0, FOREST:1, MOUNTAIN:2, VOLCANIC:3, BEACH:4, BUILT:5 };
const occupancy = new Uint8Array(AREA); // structure footprints

const idx = (x, y, z) => (y * D + z) * W + x;
function gb(x, y, z) {
  if (x < 0 || y < 0 || z < 0 || x >= W || y >= H || z >= D) return 0;
  return blocks[(y * D + z) * W + x];
}
function sb(x, y, z, v) {
  if (x < 0 || y < 0 || z < 0 || x >= W || y >= H || z >= D) return;
  blocks[(y * D + z) * W + x] = v;
}
function sbAir(x, y, z, v) { if (gb(x, y, z) === 0) sb(x, y, z, v); }
function solidAt(x, y, z) { return OPAQUE[gb(x, y, z)]; }

function fill(x0, y0, z0, x1, y1, z1, v) {
  const xa = Math.min(x0, x1) | 0, xb = Math.max(x0, x1) | 0;
  const ya = Math.min(y0, y1) | 0, yb = Math.max(y0, y1) | 0;
  const za = Math.min(z0, z1) | 0, zb = Math.max(z0, z1) | 0;
  for (let y = ya; y <= yb; y++) for (let z = za; z <= zb; z++) for (let x = xa; x <= xb; x++) sb(x, y, z, v);
}
function shell(x0, y0, z0, x1, y1, z1, v) {
  for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    if (x === x0 || x === x1 || z === z0 || z === z1 || y === y0 || y === y1) sb(x, y, z, v);
  }
}
function wallsOnly(x0, y0, z0, x1, y1, z1, v) {
  for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    if (x === x0 || x === x1 || z === z0 || z === z1) sb(x, y, z, v);
  }
}
function cyl(cx, cz, r, y0, y1, v, hollowR) {
  const ri = Math.ceil(r);
  for (let y = y0; y <= y1; y++)
    for (let z = cz - ri; z <= cz + ri; z++)
      for (let x = cx - ri; x <= cx + ri; x++) {
        const d = Math.hypot(x + .5 - cx, z + .5 - cz);
        if (d <= r && (hollowR === undefined || d >= hollowR)) sb(x, y, z, v);
      }
}
function obox(cx, cz, ang, len, wid, y0, y1, v) {
  const c = Math.cos(ang), s = Math.sin(ang), r = Math.ceil(Math.max(len, wid) * .75) + 2;
  for (let z = Math.floor(cz - r); z <= cz + r; z++)
    for (let x = Math.floor(cx - r); x <= cx + r; x++) {
      const dx = x + .5 - cx, dz = z + .5 - cz;
      const u = dx * c + dz * s, w = -dx * s + dz * c;
      if (Math.abs(u) <= len * .5 && Math.abs(w) <= wid * .5)
        for (let y = y0; y <= y1; y++) sb(x, y, z, v);
    }
}

/* ------------------------------------------------------------ landmarks */
const CASTLE = { x: 202, z: 74, y: 56 };
const VILLAGE = { x: 128, z: 226 };
const VOLCANO = { x: 262, z: 240, r: 62 };
const PEAKS = { x: 52, z: 56 };

const RIVER = [[84, 84], [98, 122], [114, 160], [132, 194], [146, 222], [148, 252], [132, 284], [110, 318]];
const RIVER_W = [7, 9, 11, 13, 15, 16, 17, 18];
const ROAD = [[202, 100], [206, 128], [198, 156], [180, 180], [162, 198], [148, 208], [136, 214], [126, 220]];

function riverInfo(x, z) {
  const r = distPath(x, z, RIVER);
  const w = lerp(RIVER_W[Math.min(r.seg, RIVER_W.length - 1)], RIVER_W[Math.min(r.seg + 1, RIVER_W.length - 1)], r.t);
  return { d: r.d, hw: w * .5, u: r.u };
}

/* ------------------------------------------------------- terrain shape */
function terrainHeight(x, z) {
  const cxn = (x - 160) / 152, czn = (z - 160) / 152;
  const rad = Math.hypot(cxn, czn);
  const coast = fbm2(x * .017, z * .017, 3, 311) - .5;
  const edge = 1 - smoothstep(0.66, 1.04, rad + coast * .2);

  let h = 39.5 + (fbm2(x * .0105, z * .0105, 4, 3) - .5) * 21
            + (fbm2(x * .034, z * .034, 3, 19) - .5) * 4.6;

  // rolling eastern downs
  const downs = clamp(1 - Math.hypot((x - 250) / 118, (z - 110) / 108), 0, 1);
  h += Math.pow(downs, 1.35) * fbm2(x * .015, z * .015, 3, 61) * 19;

  h = 20 + (h - 20) * edge;

  // north-west snowy massif — rises through the coastal falloff into sea cliffs
  const mtn = clamp(1 - Math.hypot((x - PEAKS.x) / 126, (z - PEAKS.z) / 118), 0, 1);
  if (mtn > 0.02) {
    const mh = 30 + Math.pow(mtn, 1.32) * Math.pow(ridged2(x * .0072, z * .0072, 4, 41), 1.6) * 68;
    if (mh > h) h = lerp(h, mh, smoothstep(0.02, 0.16, mtn));
  }

  // volcano cone
  const vd = Math.hypot(x - VOLCANO.x, z - VOLCANO.z);
  if (vd < VOLCANO.r) {
    let c = Math.pow(1 - vd / VOLCANO.r, 1.65) * 58;
    if (vd < 15) c -= (15 - vd) * 2.05;
    const vh = 29 + c + (fbm2(x * .06, z * .06, 2, 83) - .5) * 3.4 * smoothstep(6, 26, vd);
    if (vh > h) h = vh;
  }

  // river valley
  const ri = riverInfo(x, z);
  if (ri.d < 52) {
    const t = smoothstep(ri.hw + 2, 52, ri.d);
    const valley = 33.6 + t * 11 + (fbm2(x * .05, z * .05, 2, 97) - .5) * 2.2 * t;
    if (valley < h) h = lerp(valley, h, t * t);
    if (ri.d < ri.hw) h = Math.min(h, SEA - 2.2 - (1 - ri.d / ri.hw) * 2.6);
  }

  // castle terraces
  const cd = Math.hypot(x - CASTLE.x, z - CASTLE.z);
  if (cd < 78) {
    let tH;
    if (cd < 25) tH = 56;
    else if (cd < 33) tH = 51;
    else if (cd < 41) tH = 47;
    else if (cd < 46) tH = 44;
    else if (cd < 54) tH = 36;            // moat basin
    else if (cd < 64) tH = 44;
    else tH = lerp(44, h, smoothstep(64, 78, cd));
    if (cd < 54) h = tH;
    else h = lerp(tH, h, smoothstep(54, 78, cd));
  }

  // the village stands on a low terrace above the flood line
  const vgd = Math.hypot(x - VILLAGE.x, z - VILLAGE.z);
  if (vgd < 62) {
    const k = 1 - smoothstep(30, 62, vgd);
    const vH = 35.8 + (fbm2(x * .043, z * .043, 2, 131) - .5) * 2.2;
    h = lerp(h, Math.max(h, vH), k);
  }

  // whatever else happened above, the river keeps its channel
  if (ri.d < ri.hw) h = Math.min(h, SEA - 2.2 - (1 - ri.d / ri.hw) * 2.6);
  else if (ri.d < ri.hw + 3.5) h = Math.min(h, SEA + 0.5 + (ri.d - ri.hw) * 0.9);
  return h;
}

function generateTerrain(report) {
  for (let z = 0; z < D; z++) {
    for (let x = 0; x < W; x++) {
      const a = z * W + x;
      let h = terrainHeight(x, z);
      const hi = clamp(Math.round(h), 1, H - 12);
      hmap[a] = hi;

      const vd = Math.hypot(x - VOLCANO.x, z - VOLCANO.z);
      const volcanic = vd < VOLCANO.r * 0.95;
      const mtnish = hi > 55 + (fbm2(x * .06, z * .06, 2, 7) - .5) * 8;
      const shore = hi <= SEA + 1 + (fbm2(x * .07, z * .07, 2, 13) - .5) * 2.4;
      const ri = riverInfo(x, z);

      let surf, sub = ID.DIRT;
      if (volcanic) {
        const t = 1 - vd / (VOLCANO.r * .95);
        surf = t > .55 ? ID.BASALT : (t > .3 ? (chance(.6) ? ID.BASALT : ID.ASH) : (chance(.45) ? ID.ASH : ID.GRASS_DRY));
        sub = ID.BASALT;
        biome[a] = BIOME.VOLCANIC;
      } else if (hi > 62 + (fbm2(x * .05, z * .05, 2, 29) - .5) * 7) {
        surf = ID.SNOW; sub = ID.STONE; biome[a] = BIOME.MOUNTAIN;
      } else if (mtnish) {
        surf = chance(.35) ? ID.STONE : ID.GRASS; sub = ID.STONE; biome[a] = BIOME.MOUNTAIN;
      } else if (shore || (ri.d < ri.hw + 2.5 && hi < SEA + 2)) {
        surf = ID.SAND; sub = ID.SAND; biome[a] = BIOME.BEACH;
      } else {
        surf = ID.GRASS; sub = ID.DIRT; biome[a] = BIOME.PLAIN;
      }

      const stoneTop = hi - (2 + ((fbm2(x * .09, z * .09, 2, 37) * 3) | 0));
      for (let y = 0; y <= hi; y++) {
        let v;
        if (y === hi) v = surf;
        else if (y > stoneTop) v = sub;
        else v = volcanic ? ID.BASALT : (y < 12 ? ID.STONE_DARK : ID.STONE);
        blocks[(y * D + z) * W + x] = v;
      }
    }
    if ((z & 31) === 0) report(z / D);
  }
}

/* ------------------------------------------------------------- carving */
function carveCaves() {
  // a handful of winding caverns with entrances in the cliffs
  const mouths = [[68, 100], [246, 122], [176, 118], [96, 268], [286, 200]];
  for (let m = 0; m < mouths.length; m++) {
    let x = mouths[m][0], z = mouths[m][1];
    let y = hmap[z * W + x] - 3;
    let ax = rnd() * TAU, ay = -0.16;
    const len = 130 + rndi(90);
    for (let i = 0; i < len; i++) {
      ax += (rnd() - .5) * .34; ay += (rnd() - .5) * .13; ay = clamp(ay, -.42, .26);
      x += Math.cos(ax) * 1.35; z += Math.sin(ax) * 1.35; y += ay;
      if (x < 6 || z < 6 || x > W - 6 || z > D - 6 || y < 9 || y > H - 20) break;
      const r = 2.3 + Math.sin(i * .11) * 1.15 + rnd() * .8;
      const ri = Math.ceil(r);
      for (let dy = -ri; dy <= ri; dy++) for (let dz = -ri; dz <= ri; dz++) for (let dx = -ri; dx <= ri; dx++) {
        if (dx * dx + dy * dy * 1.7 + dz * dz <= r * r) sb((x + dx) | 0, (y + dy) | 0, (z + dz) | 0, 0);
      }
      if (i % 17 === 0) {
        sb(x | 0, (y - r) | 0, z | 0, ID.CRYSTAL);
        if (chance(.5)) sb((x + 2) | 0, (y - r + 1) | 0, (z + 1) | 0, ID.CRYSTAL);
      }
      if (i % 23 === 5) sb((x + 1) | 0, (y + r - 1) | 0, z | 0, ID.EMBER);
    }
  }
  // pocket erosion for cliff texture
  for (let z = 4; z < D - 4; z += 1) for (let x = 4; x < W - 4; x += 1) {
    const a = z * W + x, h = hmap[a];
    if (h < SEA + 6 || biome[a] === BIOME.VOLCANIC) continue;
    const n = fbm3(x * .06, h * .06, z * .06, 2, 131);
    if (n > .74) { sb(x, h, z, 0); if (n > .80) sb(x, h - 1, z, 0); }
  }
}

function refreshHeights(x0, z0, x1, z1) {
  x0 = clamp(x0 | 0, 0, W - 1); x1 = clamp(x1 | 0, 0, W - 1);
  z0 = clamp(z0 | 0, 0, D - 1); z1 = clamp(z1 | 0, 0, D - 1);
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    let y = H - 1;
    while (y > 0 && !OPAQUE[gb(x, y, z)]) y--;
    hmap[z * W + x] = y;
  }
}
function computeHeightmap() { refreshHeights(0, 0, W - 1, D - 1); }

function groundY(x, z) {
  if (x < 0 || z < 0 || x >= W || z >= D) return SEA;
  return hmap[z * W + x];
}
function areaStats(x0, z0, x1, z1) {
  let lo = 999, hi = -999, sum = 0, n = 0, wet = 0, occ = 0;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    const g = groundY(x, z);
    if (g < lo) lo = g; if (g > hi) hi = g; sum += g; n++;
    if (g <= SEA + 1) wet++;
    if (occupancy[z * W + x]) occ++;
  }
  return { lo, hi, avg: Math.round(sum / Math.max(n, 1)), wet, occ, span: hi - lo };
}
function claim(x0, z0, x1, z1) {
  for (let z = clamp(z0, 0, D - 1); z <= clamp(z1, 0, D - 1); z++)
    for (let x = clamp(x0, 0, W - 1); x <= clamp(x1, 0, W - 1); x++) occupancy[z * W + x] = 1;
}
function flattenTo(x0, z0, x1, z1, y, mat) {
  mat = mat || ID.DIRT;
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) {
    for (let yy = y + 1; yy < y + 26; yy++) if (gb(x, yy, z) !== ID.WATER) sb(x, yy, z, 0);
    for (let yy = y; yy > y - 9; yy--) if (!OPAQUE[gb(x, yy, z)]) sb(x, yy, z, mat);
    sb(x, y, z, mat);
  }
}

/* --------------------------------------------------------- water fill */
function floodOcean(report) {
  const q = new Int32Array(1 << 22);
  let qh = 0, qt = 0;
  const push = (i) => { if (qt < q.length) q[qt++] = i; };
  for (let y = SEA; y >= 0; y--) {
    for (let x = 0; x < W; x++) {
      let i = (y * D + 0) * W + x; if (blocks[i] === 0) { blocks[i] = ID.WATER; push(i); }
      i = (y * D + (D - 1)) * W + x; if (blocks[i] === 0) { blocks[i] = ID.WATER; push(i); }
    }
    for (let z = 0; z < D; z++) {
      let i = (y * D + z) * W + 0; if (blocks[i] === 0) { blocks[i] = ID.WATER; push(i); }
      i = (y * D + z) * W + (W - 1); if (blocks[i] === 0) { blocks[i] = ID.WATER; push(i); }
    }
  }
  const wid = ID.WATER;
  while (qh < qt) {
    const i = q[qh++];
    const y = (i / AREA) | 0, r = i - y * AREA, z = (r / W) | 0, x = r - z * W;
    if (x > 0     && blocks[i - 1] === 0) { blocks[i - 1] = wid; push(i - 1); }
    if (x < W - 1 && blocks[i + 1] === 0) { blocks[i + 1] = wid; push(i + 1); }
    if (z > 0     && blocks[i - W] === 0) { blocks[i - W] = wid; push(i - W); }
    if (z < D - 1 && blocks[i + W] === 0) { blocks[i + W] = wid; push(i + W); }
    if (y > 0     && blocks[i - AREA] === 0) { blocks[i - AREA] = wid; push(i - AREA); }
    if (y < SEA   && blocks[i + AREA] === 0) { blocks[i + AREA] = wid; push(i + AREA); }
    if ((qh & 0xFFFFF) === 0) report(qh / Math.max(qt, 1));
  }
}

/* ------------------------------------------------------- light flooding */
let lightR, lightG, lightB;
function propagateLight(report) {
  lightR = new Uint8Array(NCELL); lightG = new Uint8Array(NCELL); lightB = new Uint8Array(NCELL);
  let cap = 1 << 21, q = new Int32Array(cap), qh = 0, qt = 0;
  const push = (i) => {
    if (qt === cap) { cap *= 2; const n = new Int32Array(cap); n.set(q.subarray(0, qt)); q = n; }
    q[qt++] = i;
  };
  for (let i = 0; i < NCELL; i++) {
    const L = BL[blocks[i]].L;
    if (L) { lightR[i] = L[0]; lightG[i] = L[1]; lightB[i] = L[2]; push(i); }
  }
  const seeds = qt;
  while (qh < qt) {
    const i = q[qh++];
    const r = lightR[i], g = lightG[i], b = lightB[i];
    if (r <= 1 && g <= 1 && b <= 1) continue;
    const y = (i / AREA) | 0, rr = i - y * AREA, z = (rr / W) | 0, x = rr - z * W;
    for (let k = 0; k < 6; k++) {
      let nx = x, ny = y, nz = z;
      if (k === 0) nx++; else if (k === 1) nx--; else if (k === 2) ny++;
      else if (k === 3) ny--; else if (k === 4) nz++; else nz--;
      if (nx < 0 || ny < 0 || nz < 0 || nx >= W || ny >= H || nz >= D) continue;
      const j = (ny * D + nz) * W + nx;
      const bt = blocks[j];
      if (OPAQUE[bt] && !BL[bt].foliage) continue;
      const att = BL[bt].water ? 3 : (BL[bt].foliage ? 2 : 1);
      const nr = r - att, ng = g - att, nb = b - att;
      let changed = false;
      if (nr > lightR[j]) { lightR[j] = nr; changed = true; }
      if (ng > lightG[j]) { lightG[j] = ng; changed = true; }
      if (nb > lightB[j]) { lightB[j] = nb; changed = true; }
      if (changed) push(j);
    }
    if ((qh & 0x3FFFF) === 0) report(clamp(qh / Math.max(qt, seeds * 40), 0, .98));
  }
}
/* ================================================================
   HANDCRAFTED STRUCTURES
   ================================================================ */
const flagList = [];      // cloth banners, animated on the GPU
const emitters = [];      // particle sources
const birdPaths = [];     // circling flocks

function addFlag(x, y, z, ang, len, hgt, col, kind) {
  flagList.push({ x, y, z, ang, len, hgt, col, phase: rnd() * TAU, kind: kind || 0 });
}
function emit(type, x, y, z, o) {
  emitters.push(Object.assign({ type, x, y, z, r: 1, rate: 1 }, o || {}));
}

/* -------------------------------------------------------- roof helpers */
function gable(x0, z0, x1, z1, y0, mat, over, wall) {
  over = over === undefined ? 1 : over;
  const lx = x1 - x0, lz = z1 - z0;
  if (lx >= lz) {
    const half = Math.ceil((lz + 1 + over * 2) / 2);
    for (let i = 0; i < half; i++) {
      const za = z0 - over + i, zb = z1 + over - i, y = y0 + i;
      if (za > zb) break;
      for (let x = x0 - over; x <= x1 + over; x++) { sb(x, y, za, mat); sb(x, y, zb, mat); }
      if (wall) for (let z = za + 1; z < zb; z++) { sb(x0, y, z, wall); sb(x1, y, z, wall); }
    }
  } else {
    const half = Math.ceil((lx + 1 + over * 2) / 2);
    for (let i = 0; i < half; i++) {
      const xa = x0 - over + i, xb = x1 + over - i, y = y0 + i;
      if (xa > xb) break;
      for (let z = z0 - over; z <= z1 + over; z++) { sb(xa, y, z, mat); sb(xb, y, z, mat); }
      if (wall) for (let x = xa + 1; x < xb; x++) { sb(x, y, z0, wall); sb(x, y, z1, wall); }
    }
  }
}
function pyramid(x0, z0, x1, z1, y0, mat, over) {
  over = over === undefined ? 1 : over;
  let a = x0 - over, b = x1 + over, c = z0 - over, d = z1 + over, y = y0;
  while (a <= b && c <= d) {
    for (let x = a; x <= b; x++) { sb(x, y, c, mat); sb(x, y, d, mat); }
    for (let z = c; z <= d; z++) { sb(a, y, z, mat); sb(b, y, z, mat); }
    a++; b--; c++; d--; y++;
  }
}
function cone(cx, cz, r, y0, mat, steep) {
  steep = steep || 0.72;
  let i = 0;
  for (let rr = r; rr > 0.4; rr -= steep, i++) cyl(cx, cz, rr, y0 + i, y0 + i, mat, Math.max(rr - 1.6, 0));
  return y0 + i;
}

/* ---------------------------------------------------------- tiny props */
function barrel(x, y, z) { sb(x, y, z, ID.PLANK_DARK); sb(x, y + 1, z, ID.IRON); }
function crate(x, y, z) { sb(x, y, z, ID.PLANK); }
function lanternPost(x, y, z, h) {
  h = h || 3;
  for (let i = 0; i < h; i++) sb(x, y + i, z, ID.BEAM);
  sb(x, y + h, z, ID.LANTERN);
}
function torchOn(x, y, z) { sb(x, y, z, ID.TORCH); }
function fenceLine(x0, z0, x1, z1, mat) {
  mat = mat || ID.BEAM;
  const n = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0));
  for (let i = 0; i <= n; i++) {
    const x = Math.round(lerp(x0, x1, i / n)), z = Math.round(lerp(z0, z1, i / n));
    const g = groundY(x, z);
    if (g <= SEA) continue;
    sb(x, g + 1, z, mat);
    if (i % 2 === 0) sb(x, g + 2, z, mat);
  }
}
function cart(x, z, ang) {
  const g = groundY(x, z) + 1;
  obox(x, z, ang, 5, 3, g + 1, g + 1, ID.PLANK);
  obox(x, z, ang, 5, 3, g + 2, g + 2, ID.PLANK_DARK);
  const c = Math.cos(ang), s = Math.sin(ang);
  sb(Math.round(x - c * 1.6 - s * 1.8), g, Math.round(z - s * 1.6 + c * 1.8), ID.LOG);
  sb(Math.round(x - c * 1.6 + s * 1.8), g, Math.round(z - s * 1.6 - c * 1.8), ID.LOG);
  sb(Math.round(x + c * 3.2), g + 1, Math.round(z + s * 3.2), ID.BEAM);

}
function well(x, z) {

  fill(x, g - 3, z, x, g, z, ID.WATER);
  sb(x - 1, g + 3, z - 1, ID.BEAM); sb(x + 1, g + 3, z + 1, ID.BEAM);
  sb(x - 1, g + 4, z - 1, ID.BEAM); sb(x + 1, g + 4, z + 1, ID.BEAM);
  gable(x - 1, z - 1, x + 1, z + 1, g + 5, ID.PLANK_DARK, 1);

function stall(x, z, cl) {

  fill(x - 2, g + 3, z - 1, x + 2, g + 3, z + 1, cl);
  fill(x - 2, g + 1, z, x + 2, g + 1, z, ID.PLANK);
  if (chance(.6)) barrel(x - 2, g, z + 2);
  if (chance(.6)) crate(x + 2, g, z + 2);
  sb(x, g + 4, z, chance(.4) ? ID.LANTERN : 0);
  claim(x - 3, z - 2, x + 3, z + 2);
}
function boat(x, z, ang) {
  const g = SEA;
  obox(x, z, ang, 9, 3, g - 1, g - 1, ID.PLANK_DARK);
  obox(x, z, ang, 8, 3, g, g, ID.PLANK);
  const c = Math.cos(ang), s = Math.sin(ang);
  for (let i = -4; i <= 4; i++) {
    sb(Math.round(x + c * i - s * 1.6), g, Math.round(z + s * i + c * 1.6), ID.PLANK_DARK);
    sb(Math.round(x + c * i + s * 1.6), g, Math.round(z + s * i - c * 1.6), ID.PLANK_DARK);
  }
  if (chance(.55)) {
    const mx = Math.round(x), mz = Math.round(z);
    fill(mx, g + 1, mz, mx, g + 7, mz, ID.BEAM);

  } else barrel(Math.round(x + c * 2), g + 1, Math.round(z + s * 2));

/* ================================================================ CASTLE */
function buildCastle() {
  const cx = CASTLE.x, cz = CASTLE.z, top = CASTLE.y;
  claim(cx - 60, cz - 60, cx + 60, cz + 62);

  /* moat water ---------------------------------------------------- */
  for (let z = cz - 60; z <= cz + 60; z++) for (let x = cx - 60; x <= cx + 60; x++) {
    const d = Math.hypot(x - cx, z - cz);
    if (d >= 46 && d < 54) {
      for (let y = 36; y <= 41; y++) sbAir(x, y, z, ID.WATER);
      sb(x, 35, z, ID.GRAVEL);
    }
  }

  /* plateau surface ------------------------------------------------ */
  for (let z = cz - 26; z <= cz + 26; z++) for (let x = cx - 26; x <= cx + 26; x++) {
    const d = Math.hypot(x - cx, z - cz);
    if (d < 25.5) {
      for (let y = top + 1; y < top + 34; y++) sb(x, y, z, 0);
      sb(x, top, z, d > 21 ? ID.BRICKS : (chance(.14) ? ID.COBBLE_MOSS : ID.COBBLE));
    }
  }
  // terrace retaining walls
  for (const [r, y] of [[25.5, top], [33, 51], [41, 47], [46, 44]]) {
    for (let a = 0; a < TAU; a += 0.006) {
      const x = Math.round(cx + Math.cos(a) * r), z = Math.round(cz + Math.sin(a) * r);
      for (let k = 0; k < 3; k++) sb(x, y - k, z, chance(.2) ? ID.COBBLE_MOSS : ID.BRICKS);
      sb(x, y + 1, z, ID.BRICKS);
    }
  }

  /* curtain wall + towers ------------------------------------------ */
  const wallTop = top + 9;
  for (let a = 0; a < TAU; a += 0.004) {
    const ca = Math.cos(a), sa = Math.sin(a);
    if (sa > 0.86 && Math.abs(ca) < 0.52) continue;             // gate gap (+Z)
    for (let t = 0; t < 3; t++) {
      const r = 22.4 + t;
      const x = Math.round(cx + ca * r), z = Math.round(cz + sa * r);
      fill(x, top - 4, z, x, wallTop, z, ID.BRICKS);
      if (((x + z) & 1) === 0) sb(x, wallTop + 1, z, ID.BRICKS);
      if (t === 1) sb(x, wallTop + 1, z, 0);                     // walkway groove
    }
  }
  // wall walk + torches
  for (let a = 0; a < TAU; a += 0.28) {
    const x = Math.round(cx + Math.cos(a) * 20.6), z = Math.round(cz + Math.sin(a) * 20.6);
    if (gb(x, top, z) === 0) continue;
    fill(x, top + 1, z, x, wallTop - 1, z, 0);
    torchOn(x, wallTop - 1, z);
  }

  const towerAng = [0.52, 1.9, 2.62, 3.34, 4.06, 5.76];
  for (let i = 0; i < towerAng.length; i++) {
    const a = towerAng[i];
    const tx = Math.round(cx + Math.cos(a) * 23), tz = Math.round(cz + Math.sin(a) * 23);
    cyl(tx, tz, 5.4, top - 8, top + 17, ID.BRICKS);
    cyl(tx, tz, 3.3, top + 1, top + 16, 0);
    cyl(tx, tz, 5.9, top + 17, top + 17, ID.BRICKS_DARK);
    for (let a2 = 0; a2 < TAU; a2 += 0.1) {
      const mx = Math.round(tx + Math.cos(a2) * 5.5), mz = Math.round(tz + Math.sin(a2) * 5.5);
      if (((mx + mz) & 1) === 0) sb(mx, top + 18, mz, ID.BRICKS);
    }
    const roofTop = cone(tx, tz, 5.2, top + 19, i % 2 ? ID.ROOF_BLUE : ID.ROOF_DARK, .62);
    fill(tx, roofTop, tz, tx, roofTop + 4, tz, ID.BEAM);
    sb(tx, roofTop + 5, tz, ID.GOLD);
    addFlag(tx, roofTop + 4, tz, a, 6, 4, i % 2 ? [168, 52, 52] : [58, 84, 150], 0);
    // arrow slits + inner glow
    for (let y = top + 3; y <= top + 14; y += 4) {
      sb(Math.round(tx + Math.cos(a) * 5.4), y, Math.round(tz + Math.sin(a) * 5.4), ID.WINDOW_DIM);
      sb(Math.round(tx - Math.cos(a) * 5.4), y, Math.round(tz - Math.sin(a) * 5.4), ID.WINDOW_DIM);
      sb(tx, y, tz, ID.TORCH);
    }
  }

  /* gatehouse ------------------------------------------------------- */
  const gz = cz + 23;
  for (const sx of [-7, 7]) {
    const gx = cx + sx;
    fill(gx - 3, top - 6, gz - 3, gx + 3, top + 15, gz + 3, ID.BRICKS);
    fill(gx - 2, top + 1, gz - 2, gx + 2, top + 14, gz + 2, 0);
    for (let x = gx - 3; x <= gx + 3; x++) for (let z = gz - 3; z <= gz + 3; z++)
      if (((x + z) & 1) === 0) sb(x, top + 16, z, ID.BRICKS);
    sb(gx, top + 4, gz - 3, ID.WINDOW); sb(gx, top + 9, gz - 3, ID.WINDOW);
    sb(gx, top + 4, gz + 3, ID.WINDOW); sb(gx, top + 9, gz + 3, ID.WINDOW);
    torchOn(gx - 3, top + 3, gz + 2); torchOn(gx + 3, top + 3, gz + 2);
    fill(gx, top + 1, gz, gx, top + 12, gz, ID.TORCH);
    addFlag(gx, top + 16, gz, Math.PI / 2, 5, 4, [168, 52, 52], 0);
    fill(gx, top + 17, gz, gx, top + 20, gz, ID.BEAM);
  }
  // arch over the road
  fill(cx - 5, top + 8, gz - 3, cx + 5, top + 12, gz + 3, ID.BRICKS);
  fill(cx - 4, top + 1, gz - 3, cx + 4, top + 7, gz + 3, 0);
  for (let i = 0; i < 4; i++) fill(cx - 4 + i, top + 7 - i, gz - 3, cx - 4 + i, top + 7 - i, gz + 3, ID.BRICKS);
  for (let i = 0; i < 4; i++) fill(cx + 4 - i, top + 7 - i, gz - 3, cx + 4 - i, top + 7 - i, gz + 3, ID.BRICKS);
  for (let x = cx - 3; x <= cx + 3; x += 2) fill(x, top + 5, gz + 3, x, top + 7, gz + 3, ID.IRON); // portcullis
  for (let x = cx - 5; x <= cx + 5; x++) if (((x + gz) & 1) === 0) sb(x, top + 13, gz + 1, ID.BRICKS);
  torchOn(cx - 5, top + 4, gz + 4); torchOn(cx + 5, top + 4, gz + 4);

  /* ramp down to the bridge ------------------------------------------ */
  for (let z = cz + 26; z <= cz + 45; z++) {
    const t = (z - (cz + 26)) / 19;
    const y = Math.round(lerp(top, 44, t));
    for (let x = cx - 5; x <= cx + 5; x++) {
      for (let yy = y + 1; yy < y + 12; yy++) sb(x, yy, z, 0);
      for (let yy = y; yy > y - 14; yy--) if (!OPAQUE[gb(x, yy, z)]) sb(x, yy, z, ID.COBBLE);
      sb(x, y, z, ((x + z) & 3) === 0 ? ID.COBBLE_MOSS : ID.COBBLE);
    }
    sb(cx - 6, y + 1, z, ID.BRICKS); sb(cx + 6, y + 1, z, ID.BRICKS);
    if (z % 6 === 0) { lanternPost(cx - 6, y + 2, z, 2); lanternPost(cx + 6, y + 2, z, 2); }
  }

  /* bridge over the moat --------------------------------------------- */
  const bz0 = cz + 44, bz1 = cz + 56;
  fill(cx - 5, 44, bz0, cx + 5, 44, bz1, ID.BRICKS);
  fill(cx - 4, 43, bz0, cx + 4, 43, bz1, ID.BRICKS_DARK);
  for (const pz of [bz0 + 2, bz0 + 6, bz0 + 10]) {
    fill(cx - 3, 34, pz - 1, cx + 3, 42, pz + 1, ID.BRICKS);
    fill(cx - 3, 38, pz, cx + 3, 42, pz, 0);
  }
  for (let z = bz0; z <= bz1; z++) {
    sb(cx - 6, 45, z, ID.BRICKS); sb(cx + 6, 45, z, ID.BRICKS);
    if (z % 4 === 0) { lanternPost(cx - 6, 46, z, 2); lanternPost(cx + 6, 46, z, 2); }
  }
  // outer gate posts
  for (const sx of [-6, 6]) {
    fill(cx + sx, 45, bz1 + 1, cx + sx, 51, bz1 + 1, ID.BRICKS);
    sb(cx + sx, 52, bz1 + 1, ID.TORCH);
  }

  /* the keep --------------------------------------------------------- */
  const kx = cx, kz = cz - 3, kw = 10, kd = 9, ky = top;
  fill(kx - kw, ky, kz - kd, kx + kw, ky + 26, kz + kd, ID.BRICKS);
  fill(kx - kw + 2, ky + 1, kz - kd + 2, kx + kw - 2, ky + 24, kz + kd - 2, 0);
  for (let f = 0; f < 4; f++) fill(kx - kw + 2, ky + 1 + f * 6, kz - kd + 2, kx + kw - 2, ky + 1 + f * 6, kz + kd - 2, ID.PLANK_DARK);
  // battlements
  for (let x = kx - kw; x <= kx + kw; x++) for (let z = kz - kd; z <= kz + kd; z++) {
    const edge = x === kx - kw || x === kx + kw || z === kz - kd || z === kz + kd;
    if (edge && ((x + z) & 1) === 0) sb(x, ky + 27, z, ID.BRICKS);
  }
  // windows
  for (let f = 0; f < 4; f++) {
    const y = ky + 3 + f * 6;
    for (let x = kx - kw + 3; x <= kx + kw - 3; x += 4) {
      sb(x, y, kz - kd, ID.WINDOW); sb(x, y + 1, kz - kd, ID.WINDOW);
      sb(x, y, kz + kd, ID.WINDOW); sb(x, y + 1, kz + kd, ID.WINDOW);
    }
    for (let z = kz - kd + 3; z <= kz + kd - 3; z += 4) {
      sb(kx - kw, y, z, ID.WINDOW); sb(kx - kw, y + 1, z, ID.WINDOW);
      sb(kx + kw, y, z, ID.WINDOW); sb(kx + kw, y + 1, z, ID.WINDOW);
    }
    fill(kx - 2, y, kz, kx + 2, y, kz, ID.TORCH);
  }
  // grand doorway
  fill(kx - 2, ky + 1, kz + kd, kx + 2, ky + 4, kz + kd, 0);
  fill(kx - 3, ky + 5, kz + kd, kx + 3, ky + 5, kz + kd, ID.GOLD);
  torchOn(kx - 3, ky + 3, kz + kd + 1); torchOn(kx + 3, ky + 3, kz + kd + 1);
  fill(kx - 4, ky, kz + kd + 1, kx + 4, ky, kz + kd + 3, ID.MARBLE);
  // corner turrets
  for (const s of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const tx = kx + s[0] * kw, tz = kz + s[1] * kd;
    cyl(tx, tz, 3.6, ky - 2, ky + 32, ID.BRICKS);
    cyl(tx, tz, 2.0, ky + 2, ky + 30, 0);
    cyl(tx, tz, 4.1, ky + 32, ky + 32, ID.BRICKS_DARK);
    const rt = cone(tx, tz, 3.9, ky + 33, ID.ROOF_BLUE, .58);
    fill(tx, rt, tz, tx, rt + 3, tz, ID.BEAM);
    sb(tx, rt + 4, tz, ID.GOLD);
    addFlag(tx, rt + 3, tz, s[0] > 0 ? 0.4 : 2.8, 5, 3.5, [168, 52, 52], 0);
    for (let y = ky + 6; y < ky + 30; y += 5) sb(tx, y, tz, ID.TORCH);
  }
  // great hall roof over the keep top
  gable(kx - kw + 1, kz - kd + 1, kx + kw - 1, kz + kd - 1, ky + 28, ID.ROOF_BLUE, 1, ID.BRICKS);
  emit('smoke', kx - kw + 3, ky + 30, kz - kd + 3, { rate: .7, size: 1.6, col: [.42, .40, .40] });
  fill(kx - kw + 3, ky + 27, kz - kd + 3, kx - kw + 3, ky + 30, kz - kd + 3, ID.BRICKS_DARK);
  sb(kx - kw + 3, ky + 29, kz - kd + 3, ID.EMBER);
  addFlag(kx, ky + 34, kz, Math.PI / 2, 9, 6, [216, 178, 72], 0);
  fill(kx, ky + 28, kz, kx, ky + 34, kz, ID.BEAM);

  /* chapel ------------------------------------------------------------ */
  const chx = cx - 16, chz = cz + 7;
  fill(chx - 5, top, chz - 7, chx + 5, top + 8, chz + 7, ID.MARBLE);
  fill(chx - 4, top + 1, chz - 6, chx + 4, top + 7, chz + 6, 0);
  for (let z = chz - 4; z <= chz + 4; z += 4) {
    sb(chx - 5, top + 4, z, ID.STAINED); sb(chx - 5, top + 5, z, ID.STAINED);
    sb(chx + 5, top + 4, z, ID.STAINED); sb(chx + 5, top + 5, z, ID.STAINED);
  }
  fill(chx - 1, top + 1, chz + 7, chx + 1, top + 4, chz + 7, 0);
  fill(chx - 2, top + 3, chz - 7, chx + 2, top + 6, chz - 7, ID.STAINED_R);
  fill(chx - 3, top + 2, chz - 5, chx + 3, top + 2, chz + 5, ID.TORCH);
  gable(chx - 5, chz - 7, chx + 5, chz + 7, top + 9, ID.ROOF_DARK, 1, ID.MARBLE);
  // bell spire
  fill(chx - 2, top, chz + 9, chx + 2, top + 14, chz + 9 + 4, ID.MARBLE);
  fill(chx - 1, top + 1, chz + 10, chx + 1, top + 12, chz + 12, 0);
  fill(chx - 1, top + 11, chz + 9, chx + 1, top + 12, chz + 9, ID.WINDOW);
  sb(chx, top + 12, chz + 11, ID.GOLD);
  const spTop = pyramid(chx - 2, chz + 9, chx + 2, chz + 13, top + 15, ID.ROOF_DARK, 1);
  fill(chx, top + 18, chz + 11, chx, top + 22, chz + 11, ID.GOLD);
  claim(chx - 6, chz - 8, chx + 6, chz + 14);

  /* courtyard life ------------------------------------------------------ */
  well(cx + 13, cz + 10);
  const castleAwnings = [ID.CLOTH_RED, ID.CLOTH_BLUE, ID.CLOTH_GREEN];
  const castleStalls = [[cx - 15, cz - 12], [cx - 9, cz - 15], [cx + 14, cz - 10]];
  for (let i = 0; i < castleStalls.length; i++) stall(castleStalls[i][0], castleStalls[i][1], castleAwnings[i % 3]);
  // garden parterre
  for (let z = cz + 5; z <= cz + 17; z++) for (let x = cx - 8; x <= cx + 4; x++) {
    const d = Math.hypot(x - (cx - 2), z - (cz + 11));
    if (d > 6.4) continue;
    sb(x, top, z, ID.GRASS);
    const ring = Math.round(d);
    if (ring === 3 || ring === 6) sb(x, top + 1, z, ID.BUSH);
    else if (chance(.16)) sb(x, top + 1, z, pick([ID.FLOWER_R, ID.FLOWER_Y, ID.FLOWER_B]));
  }
  fill(cx - 2, top + 1, cz + 11, cx - 2, top + 3, cz + 11, ID.MARBLE);
  sb(cx - 2, top + 4, cz + 11, ID.WATER);
  // stables & barracks
  fill(cx + 8, top, cz - 16, cx + 18, top + 4, cz - 8, ID.PLANK);
  fill(cx + 9, top + 1, cz - 15, cx + 17, top + 3, cz - 9, 0);
  gable(cx + 8, cz - 16, cx + 18, cz - 8, top + 5, ID.THATCH, 1, ID.PLANK);
  for (let z = cz - 15; z <= cz - 9; z += 3) { sb(cx + 8, top + 2, z, ID.WINDOW_DIM); sb(cx + 18, top + 2, z, ID.WINDOW_DIM); }
  fill(cx + 12, top + 1, cz - 8, cx + 14, top + 3, cz - 8, 0);
  for (let i = 0; i < 6; i++) barrel(cx + 6, top + 1 + (i % 2 ? 0 : 0), cz - 12 + i);
  for (let a = 0; a < TAU; a += 0.9) torchOn(Math.round(cx + Math.cos(a) * 17), top + 1, Math.round(cz + Math.sin(a) * 17));
  cart(cx + 4, cz + 19, 0.4);
  birdPaths.push({ x: cx, y: top + 42, z: cz, r: 44, n: 14, spd: .16 });
}

/* =============================================================== ROADS */
function paintRoads() {
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const r = distPath(x, z, ROAD);
    if (r.d > 4.2) continue;
    const g = groundY(x, z);
    if (g <= SEA + 1) continue;
    const a = z * W + x;
    if (occupancy[a] && Math.hypot(x - CASTLE.x, z - CASTLE.z) < 60) continue;
    for (let y = g + 1; y < g + 6; y++) if (gb(x, y, z) !== ID.WATER) sb(x, y, z, 0);
    sb(x, g, z, r.d > 3.4 ? ID.GRAVEL : ID.PATH);
    if (r.d > 3.9 && ((x * 7 + z * 3) % 29) === 0) sb(x, g + 1, z, chance(.5) ? ID.BUSH : ID.FLOWER_Y);
  }
  // roadside lanterns and a wayshrine
  for (let u = 0.06; u < 0.98; u += 0.075) {
    const p = samplePath(ROAD, u), t = pathTangent(ROAD, u);
    for (const s of [-1, 1]) {
      const x = Math.round(p[0] - t[1] * 5 * s), z = Math.round(p[1] + t[0] * 5 * s);
      const g = groundY(x, z);
      if (g > SEA + 1 && !occupancy[z * W + x]) lanternPost(x, g + 1, z, 3);
    }
  }
  const sp = samplePath(ROAD, 0.42);
  const sx = Math.round(sp[0]) + 8, sz = Math.round(sp[1]);
  const sg = groundY(sx, sz);
  if (sg > SEA + 1) {
    fill(sx - 1, sg, sz - 1, sx + 1, sg + 4, sz + 1, ID.COBBLE_MOSS);
    fill(sx, sg + 1, sz, sx, sg + 3, sz, 0);
    sb(sx, sg + 2, sz, ID.LANTERN);
    pyramid(sx - 1, sz - 1, sx + 1, sz + 1, sg + 5, ID.SLATE, 1);
  }
}

/* ============================================================== BRIDGE */
function buildRiverBridge() {
  // find where the road meets the river
  let best = 1e9, bu = .5;
  for (let u = 0; u <= 1; u += .002) {
    const p = samplePath(ROAD, u);
    const ri = riverInfo(p[0], p[1]);
    if (ri.d < best) { best = ri.d; bu = u; }
  }
  const p = samplePath(ROAD, bu);
  const ri0 = distPath(p[0], p[1], RIVER);
  const rt = pathTangent(RIVER, ri0.u);
  const ang = Math.atan2(-rt[0], rt[1]);         // perpendicular to the river
  const cxr = samplePath(RIVER, ri0.u);
  const cx = cxr[0], cz = cxr[1];
  const deckY = SEA + 4, len = 42, wid = 9;

  obox(cx, cz, ang, len, wid, deckY, deckY, ID.BRICKS);
  obox(cx, cz, ang, len - 2, wid - 2, deckY - 1, deckY - 1, ID.BRICKS_DARK);
  const c = Math.cos(ang), s = Math.sin(ang);
  // parapets
  for (let i = -len / 2; i <= len / 2; i++) {
    for (const sd of [-1, 1]) {
      const x = Math.round(cx + c * i - s * (wid / 2) * sd), z = Math.round(cz + s * i + c * (wid / 2) * sd);
      sb(x, deckY + 1, z, ID.BRICKS);
      if ((Math.round(i) % 2) === 0) sb(x, deckY + 2, z, ID.BRICKS);
      if ((Math.round(i) % 9) === 0) lanternPost(x, deckY + 3, z, 2);
    }
  }
  // arches
  for (const o of [-11, 0, 11]) {
    const px = cx + c * o, pz = cz + s * o;
    obox(px, pz, ang, 5, wid + 2, SEA - 4, deckY - 1, ID.BRICKS);
  }
  for (const o of [-5.5, 5.5, -16.5, 16.5]) {
    const px = cx + c * o, pz = cz + s * o;
    for (let k = 0; k < 4; k++) obox(px, pz, ang, 6 - k * 1.2, wid + 2, SEA + 1 + k, SEA + 1 + k, 0);
  }
  // approach ramps
  for (const sd of [-1, 1]) {
    for (let i = len / 2; i < len / 2 + 16; i++) {
      const x = Math.round(cx + c * i * sd), z = Math.round(cz + s * i * sd);
      const g = groundY(x, z);
      const t = (i - len / 2) / 16;
      const y = Math.round(lerp(deckY, Math.max(g, SEA + 1), t));
      obox(x, z, ang, 2, wid, y - 6, y, ID.COBBLE);
      obox(x, z, ang, 2, wid + 4, y + 1, y + 7, 0);
      obox(x, z, ang, 2, wid, y, y, ID.PATH);
    }
  }
  claim(cx - 26, cz - 26, cx + 26, cz + 26);
  return { x: cx, z: cz, ang, deckY };
}

/* ============================================================= HOUSES */
const HOUSE_STYLES = [
  { wall: ID.PLASTER, beam: ID.BEAM, roof: ID.ROOF_RED, base: ID.COBBLE },
  { wall: ID.PLASTER_WRM, beam: ID.BEAM, roof: ID.THATCH, base: ID.COBBLE },
  { wall: ID.PLANK, beam: ID.PLANK_DARK, roof: ID.ROOF_DARK, base: ID.COBBLE },
  { wall: ID.BRICKS, beam: ID.BEAM, roof: ID.ROOF_GREEN, base: ID.STONE },
  { wall: ID.PLASTER, beam: ID.PLANK_DARK, roof: ID.ROOF_BLUE, base: ID.COBBLE },
  { wall: ID.PLANK_PALE, beam: ID.BEAM, roof: ID.THATCH, base: ID.COBBLE }
];

function buildHouse(cx, cz, w, d, opt) {
  opt = opt || {};
  const x0 = cx - (w >> 1), x1 = x0 + w, z0 = cz - (d >> 1), z1 = z0 + d;
  const st = areaStats(x0, z0, x1, z1);
  if (!opt.force && (st.span > 5 || st.wet > 0 || st.occ > 0)) return false;
  const g = opt.y !== undefined ? opt.y : st.avg;
  const S = opt.style || pick(HOUSE_STYLES);
  const floors = opt.floors || (chance(.42) ? 2 : 1);
  const wh = 4;

  flattenTo(x0 - 1, z0 - 1, x1 + 1, z1 + 1, g, ID.DIRT);
  fill(x0 - 1, g - 4, z0 - 1, x1 + 1, g, z1 + 1, S.base);
  claim(x0 - 1, z0 - 1, x1 + 1, z1 + 1);

  let base = g;
  for (let f = 0; f < floors; f++) {
    const jut = (f === 1 && chance(.6)) ? 1 : 0;
    const a0 = x0 - jut, a1 = x1 + jut, b0 = z0 - jut, b1 = z1 + jut;
    if (jut) fill(a0, base, b0, a1, base, b1, S.beam);
    wallsOnly(a0, base + 1, b0, a1, base + wh, b1, S.wall);
    // corner + mid posts
    for (const p of [[a0, b0], [a1, b0], [a0, b1], [a1, b1]]) fill(p[0], base + 1, p[1], p[0], base + wh, p[1], S.beam);
    fill(a0, base + wh, b0, a1, base + wh, b1, S.beam);
    if (chance(.7)) {
      for (let x = a0 + 2; x < a1; x += 3) { sb(x, base + 2, b0, S.beam); sb(x, base + 3, b1, S.beam); }
      for (let z = b0 + 2; z < b1; z += 3) { sb(a0, base + 3, z, S.beam); sb(a1, base + 2, z, S.beam); }
    }
    // windows
    const wy = base + 2;
    for (let x = a0 + 2; x <= a1 - 2; x += 3) {
      if (chance(.68)) { sb(x, wy, b0, ID.WINDOW); if (chance(.4)) sb(x, wy + 1, b0, ID.WINDOW); }
      if (chance(.68)) { sb(x, wy, b1, ID.WINDOW); if (chance(.4)) sb(x, wy + 1, b1, ID.WINDOW); }
    }
    for (let z = b0 + 2; z <= b1 - 2; z += 3) {
      if (chance(.6)) sb(a0, wy, z, ID.WINDOW);
      if (chance(.6)) sb(a1, wy, z, ID.WINDOW);
    }
    fill(a0 + 1, base + 1, b0 + 1, a1 - 1, base + wh - 1, b1 - 1, 0);
    fill(a0 + 1, base + wh, b0 + 1, a1 - 1, base + wh, b1 - 1, S.beam === ID.BEAM ? ID.PLANK_DARK : ID.PLANK);
    sb(cx, base + wh - 1, cz, ID.LANTERN);
    base += wh;
  }
  // door
  const dside = rndi(4);
  if (dside === 0) fill(cx, g + 1, z0, cx, g + 3, z0, 0);
  else if (dside === 1) fill(cx, g + 1, z1, cx, g + 3, z1, 0);
  else if (dside === 2) fill(x0, g + 1, cz, x0, g + 3, cz, 0);
  else fill(x1, g + 1, cz, x1, g + 3, cz, 0);

  gable(x0, z0, x1, z1, base + 1, S.roof, 1, S.wall);
  // chimney
  if (chance(.75)) {
    const chx = x0 + 1 + rndi(Math.max(w - 2, 1)), chz = z0 + 1 + rndi(Math.max(d - 2, 1));
    fill(chx, g + 1, chz, chx, base + 4 + rndi(3), chz, ID.BRICKS);
    const topY = base + 4;
    sb(chx, topY + 1, chz, ID.EMBER);
    emit('smoke', chx, topY + 2, chz, { rate: .32 + rnd() * .3, size: .95, col: [.5, .48, .46] });
  }
  // lanterns and clutter
  if (chance(.5)) lanternPost(x1 + 2, g + 1, z1 + 2, 3);
  if (chance(.4)) barrel(x0 - 1, g + 1, z1 + 1);
  if (chance(.3)) crate(x1 + 1, g + 1, z0 - 1);
  if (chance(.35)) {
    for (let i = 0; i < 3; i++) sb(x0 - 2, g + 1, z0 + i, ID.BUSH);
  }
  refreshHeights(x0 - 3, z0 - 3, x1 + 3, z1 + 3);
  return true;
}

/* ============================================================= VILLAGE */
const STREETS = [
  [[104, 190], [110, 206], [116, 224], [116, 244], [108, 262], [96, 276]],
  [[86, 214], [102, 220], [118, 226], [132, 232], [142, 240]],
  [[124, 200], [132, 214], [138, 230], [136, 248]],
  [[96, 246], [110, 252], [124, 256], [136, 258]]
];

function paintStreets() {
  for (const st of STREETS) {
    for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
      const r = distPath(x, z, st);
      if (r.d > 3.0) continue;
      const g = groundY(x, z);
      if (g <= SEA) continue;
      for (let y = g + 1; y < g + 6; y++) if (gb(x, y, z) !== ID.WATER) sb(x, y, z, 0);
      sb(x, g, z, r.d > 2.2 ? ID.GRAVEL : (((x * 3 + z * 5) % 11) === 0 ? ID.COBBLE_MOSS : ID.COBBLE));
      if (r.d <= 2.4) occupancy[z * W + x] = 2;
    }
  }
}

function buildVillage() {
  const cx = VILLAGE.x, cz = VILLAGE.z;

  /* market square ------------------------------------------------------ */
  const mx = 114, mz = 228;
  const ms = areaStats(mx - 9, mz - 9, mx + 9, mz + 9);
  flattenTo(mx - 9, mz - 9, mx + 9, mz + 9, ms.avg, ID.COBBLE);
  for (let z = mz - 9; z <= mz + 9; z++) for (let x = mx - 9; x <= mx + 9; x++)
    sb(x, ms.avg, z, ((x + z) % 7 === 0) ? ID.COBBLE_MOSS : ID.COBBLE);
  claim(mx - 10, mz - 10, mx + 10, mz + 10);
  well(mx, mz);
  const awnings = [ID.CLOTH_RED, ID.CLOTH_BLUE, ID.CLOTH_GREEN, ID.CLOTH_CREAM];
  const stalls = [[-6, -6], [6, -6], [-6, 6], [6, 6], [0, -8], [0, 8]];
  for (let i = 0; i < stalls.length; i++) stall(mx + stalls[i][0], mz + stalls[i][1], awnings[i % 4]);
  cart(mx - 3, mz + 4, 0.8); cart(mx + 4, mz - 3, 2.1);
  for (let i = 0; i < 8; i++) barrel(mx - 8 + i, ms.avg + 1, mz - 8);
  for (let a = 0; a < TAU; a += 1.05) lanternPost(Math.round(mx + Math.cos(a) * 8), ms.avg + 1, Math.round(mz + Math.sin(a) * 8), 4);

  const tg = tv.avg;
  fill(tvx - 7, tg + 9, tvz + 6, tvx + 7, tg + 9, tvz + 8, ID.PLANK_DARK);
  for (let x = tvx - 6; x <= tvx + 6; x += 3) fill(x, tg + 1, tvz + 8, x, tg + 8, tvz + 8, ID.BEAM);
  for (let i = 0; i < 5; i++) { barrel(tvx - 6 + i * 3, tg + 1, tvz + 7); }
  lanternPost(tvx - 8, tg + 1, tvz + 7, 4); lanternPost(tvx + 8, tg + 1, tvz + 7, 4);
  sb(tvx + 8, tg + 6, tvz + 5, ID.CLOTH_RED); sb(tvx + 8, tg + 5, tvz + 5, ID.CLOTH_RED);
  addFlag(tvx, tg + 12, tvz, 0.3, 5, 3, [212, 198, 168], 0);
  emit('smoke', tvx + 4, tg + 13, tvz - 3, { rate: .55, size: 1.15, col: [.5, .48, .45] });

  /* blacksmith ---------------------------------------------------------- */
  const bx = 122, bz = 216;
  const bs = areaStats(bx - 6, bz - 5, bx + 6, bz + 5);
  const bg = bs.avg;
  flattenTo(bx - 7, bz - 6, bx + 7, bz + 6, bg, ID.COBBLE);
  fill(bx - 6, bg, bz - 5, bx + 6, bg + 5, bz + 5, ID.STONE);
  fill(bx - 5, bg + 1, bz - 4, bx + 5, bg + 4, bz + 4, 0);
  gable(bx - 6, bz - 5, bx + 6, bz + 5, bg + 6, ID.ROOF_DARK, 1, ID.STONE);
  fill(bx - 2, bg + 1, bz + 5, bx + 2, bg + 4, bz + 5, 0);
  fill(bx + 3, bg + 1, bz - 3, bx + 5, bg + 3, bz - 1, ID.BRICKS);   // forge
  fill(bx + 4, bg + 1, bz - 2, bx + 4, bg + 2, bz - 2, ID.LAVA);
  sb(bx + 4, bg + 3, bz - 2, ID.EMBER);
  fill(bx + 4, bg + 4, bz - 2, bx + 4, bg + 12, bz - 2, ID.BRICKS);
  fill(bx + 4, bg + 5, bz - 2, bx + 4, bg + 11, bz - 2, 0);
  emit('smoke', bx + 4, bg + 13, bz - 2, { rate: 1.1, size: 1.5, col: [.34, .32, .32] });
  emit('ember', bx + 4, bg + 2, bz - 2, { rate: 2.4, size: .3 });
  fill(bx - 4, bg + 1, bz + 2, bx - 3, bg + 2, bz + 3, ID.IRON);      // anvil + stock
  for (let i = 0; i < 4; i++) barrel(bx - 7, bg + 1, bz - 3 + i * 2);
  sb(bx - 6, bg + 3, bz, ID.WINDOW); sb(bx + 6, bg + 3, bz + 1, ID.WINDOW);
  claim(bx - 8, bz - 7, bx + 8, bz + 7);
  cart(bx - 8, bz + 6, 1.5);

  /* village chapel ------------------------------------------------------ */
  const px = 100, pz = 200;
  const ps = areaStats(px - 6, pz - 8, px + 6, pz + 8);
  const pg = ps.avg;
  flattenTo(px - 7, pz - 9, px + 7, pz + 9, pg, ID.GRASS);
  fill(px - 5, pg, pz - 8, px + 5, pg + 7, pz + 8, ID.BRICKS);
  fill(px - 4, pg + 1, pz - 7, px + 4, pg + 6, pz + 7, 0);
  gable(px - 5, pz - 8, px + 5, pz + 8, pg + 8, ID.SLATE, 1, ID.BRICKS);
  for (let z = pz - 5; z <= pz + 5; z += 5) {
    sb(px - 5, pg + 3, z, ID.STAINED); sb(px - 5, pg + 4, z, ID.STAINED);
    sb(px + 5, pg + 3, z, ID.STAINED); sb(px + 5, pg + 4, z, ID.STAINED);
  }
  fill(px - 1, pg + 1, pz + 8, px + 1, pg + 4, pz + 8, 0);
  fill(px - 2, pg + 2, pz - 5, px + 2, pg + 2, pz + 5, ID.TORCH);
  fill(px - 2, pg, pz - 12, px + 2, pg + 16, pz - 8, ID.BRICKS);
  fill(px - 1, pg + 1, pz - 11, px + 1, pg + 14, pz - 9, 0);
  fill(px - 1, pg + 13, pz - 12, px + 1, pg + 14, pz - 12, ID.WINDOW);
  sb(px, pg + 14, pz - 10, ID.GOLD);
  pyramid(px - 2, pz - 12, px + 2, pz - 8, pg + 17, ID.SLATE, 1);
  fill(px, pg + 21, pz - 10, px, pg + 25, pz - 10, ID.GOLD);
  // graveyard
  for (let i = 0; i < 14; i++) {
    const gx = px + 8 + rndi(9), gz = pz - 6 + rndi(15);
    const gg = groundY(gx, gz);
    if (gg <= SEA || occupancy[gz * W + gx]) continue;
    fill(gx, gg + 1, gz, gx, gg + 1 + rndi(2), gz, ID.STONE_DARK);
  }
  fenceLine(px + 7, pz - 8, px + 18, pz - 8); fenceLine(px + 18, pz - 8, px + 18, pz + 9);
  claim(px - 8, pz - 13, px + 20, pz + 10);

  /* docks, boats, watermill -------------------------------------------- */
  buildDocks();
  buildWatermill();

  /* farms --------------------------------------------------------------- */
  buildFarms();

  /* the houses ----------------------------------------------------------- */
  let placed = 0;
  const targets = 32;
  for (const st of STREETS) {
    for (let u = 0.03; u < 0.98 && placed < targets; u += 0.042) {
      const p = samplePath(st, u), t = pathTangent(st, u);
      for (const side of [-1, 1]) {
        if (placed >= targets) break;
        const off = 8 + rnd() * 2.6;
        const hx = Math.round(p[0] - t[1] * off * side), hz = Math.round(p[1] + t[0] * off * side);
        if (hx < 8 || hz < 8 || hx > W - 8 || hz > D - 8) continue;
        if (occupancy[hz * W + hx]) continue;
        const along = Math.abs(t[0]) > Math.abs(t[1]);
        const w = along ? 7 + rndi(3) : 6 + rndi(3);
        const d = along ? 6 + rndi(3) : 7 + rndi(3);
        if (buildHouse(hx, hz, w, d, {})) {
          placed++;
          if (chance(.4)) fenceLine(hx - 5, hz - 5, hx + 5, hz - 5);
        }
      }
    }
  }
  // fill any remainder with a scattered outskirt cluster
  let guard = 0;
  while (placed < 30 && guard++ < 3000) {
    const rr = 12 + rnd() * 36, aa = rnd() * TAU;
    const hx = Math.round(cx + Math.cos(aa) * rr), hz = Math.round(cz + Math.sin(aa) * rr * 1.15);
    if (hx < 8 || hz < 8 || hx > W - 8 || hz > D - 8) continue;
    if (occupancy[hz * W + hx]) continue;
    if (buildHouse(hx, hz, 6 + rndi(3), 6 + rndi(3), {})) placed++;
  }
  // finally, tuck small cottages into whatever gaps are left
  guard = 0;
  while (placed < 30 && guard++ < 5000) {
    const rr = 10 + rnd() * 46, aa = rnd() * TAU;
    const hx = Math.round(cx + Math.cos(aa) * rr), hz = Math.round(cz + Math.sin(aa) * rr * 1.1);
    if (hx < 8 || hz < 8 || hx > W - 8 || hz > D - 8) continue;
    if (occupancy[hz * W + hx]) continue;
    if (buildHouse(hx, hz, 5 + rndi(2), 5 + rndi(2), { floors: 1 })) placed++;
  }
  VILLAGE.houses = placed;

  birdPaths.push({ x: mx, y: 62, z: mz, r: 30, n: 10, spd: .22 });
}

function buildDocks() {
  const u = 0.63;
  const p = samplePath(RIVER, u), t = pathTangent(RIVER, u);
  const nx = -t[1], nz = t[0];
  const bankX = p[0] - nx * 11, bankZ = p[1] - nz * 11;
  const ang = Math.atan2(t[1], t[0]);
  const gy = SEA + 1;
  // pier decking
  for (let i = -12; i <= 12; i++) {
    for (let j = 0; j <= 13; j++) {
      const x = Math.round(bankX + t[0] * i + nx * j), z = Math.round(bankZ + t[1] * i + nz * j);
      if (j < 2 && groundY(x, z) > SEA + 2) continue;
      sb(x, gy, z, ID.PLANK_DARK);
      for (let y = gy + 1; y < gy + 7; y++) if (gb(x, y, z) !== ID.WATER) sb(x, y, z, 0);
      if ((i + 40) % 4 === 0 && j % 5 === 0) fill(x, SEA - 4, z, x, gy - 1, z, ID.BEAM);
      occupancy[clamp(z, 0, D - 1) * W + clamp(x, 0, W - 1)] = 1;
    }
  }
  for (let i = -12; i <= 12; i += 6) {
    const x = Math.round(bankX + t[0] * i + nx * 13), z = Math.round(bankZ + t[1] * i + nz * 13);
    lanternPost(x, gy + 1, z, 4);
  }
  for (let i = -10; i <= 10; i += 5) {
    const x = Math.round(bankX + t[0] * i + nx * 4), z = Math.round(bankZ + t[1] * i + nz * 4);
    if (chance(.7)) barrel(x, gy + 1, z);
    if (chance(.5)) crate(x + 1, gy + 1, z);
  }
  // warehouse
  const wx = Math.round(bankX - t[0] * 15), wz = Math.round(bankZ - t[1] * 15);
  const ws = areaStats(wx - 6, wz - 5, wx + 6, wz + 5);
  if (ws.wet < 30) {
    flattenTo(wx - 7, wz - 6, wx + 7, wz + 6, ws.avg, ID.COBBLE);
    fill(wx - 6, ws.avg, wz - 5, wx + 6, ws.avg + 6, wz + 5, ID.PLANK);
    fill(wx - 5, ws.avg + 1, wz - 4, wx + 5, ws.avg + 5, wz + 4, 0);
    gable(wx - 6, wz - 5, wx + 6, wz + 5, ws.avg + 7, ID.ROOF_DARK, 1, ID.PLANK);
    fill(wx - 2, ws.avg + 1, wz + 5, wx + 2, ws.avg + 4, wz + 5, 0);
    sb(wx, ws.avg + 4, wz, ID.LANTERN);
    claim(wx - 7, wz - 6, wx + 7, wz + 6);
  }
  // boats
  for (let i = 0; i < 5; i++) {
    const off = -11 + i * 5.5;
    const bxp = bankX + t[0] * off + nx * (15 + rnd() * 4), bzp = bankZ + t[1] * off + nz * (15 + rnd() * 4);
    boat(bxp, bzp, ang + (rnd() - .5) * .4);
  }
  // a fishing skiff drifting downstream
  const dp = samplePath(RIVER, 0.78), dt = pathTangent(RIVER, 0.78);
  boat(dp[0], dp[1], Math.atan2(dt[1], dt[0]));
}

function buildWatermill() {
  const u = 0.55;
  const p = samplePath(RIVER, u), t = pathTangent(RIVER, u);
  const nx = -t[1], nz = t[0];
  const bx = Math.round(p[0] - nx * 12), bz = Math.round(p[1] - nz * 12);
  const st = areaStats(bx - 6, bz - 6, bx + 6, bz + 6);
  const g = Math.max(st.avg, SEA + 2);
  flattenTo(bx - 7, bz - 7, bx + 7, bz + 7, g, ID.COBBLE);
  fill(bx - 5, g, bz - 5, bx + 5, g + 7, bz + 5, ID.STONE);
  fill(bx - 4, g + 1, bz - 4, bx + 4, g + 6, bz + 4, 0);
  fill(bx - 4, g + 8, bz - 4, bx + 4, g + 11, bz + 4, ID.PLANK);
  wallsOnly(bx - 4, g + 8, bz - 4, bx + 4, g + 11, bz + 4, ID.PLANK);
  gable(bx - 5, bz - 5, bx + 5, bz + 5, g + 12, ID.THATCH, 1, ID.PLANK);
  sb(bx - 5, g + 3, bz, ID.WINDOW); sb(bx + 5, g + 3, bz, ID.WINDOW);
  sb(bx, g + 9, bz - 5, ID.WINDOW); sb(bx, g + 9, bz + 5, ID.WINDOW);
  fill(bx - 1, g + 1, bz + 5, bx + 1, g + 4, bz + 5, 0);
  sb(bx, g + 5, bz, ID.LANTERN);

  // wheel on the river side
  const wx = Math.round(p[0] - nx * 6.5), wz = Math.round(p[1] - nz * 6.5);
  const wy = SEA + 5;
  for (let a = 0; a < TAU; a += 0.08) {
    const rx = Math.round(wx + Math.cos(a) * 5.4 * nx), rz = Math.round(wz + Math.cos(a) * 5.4 * nz);
    const ry = Math.round(wy + Math.sin(a) * 5.4);
    sb(rx, ry, rz, ID.PLANK_DARK);
    const r2x = Math.round(wx + Math.cos(a) * 4.4 * nx), r2z = Math.round(wz + Math.cos(a) * 4.4 * nz);
    sb(r2x, Math.round(wy + Math.sin(a) * 4.4), r2z, ID.BEAM);
  }
  for (let a = 0; a < TAU; a += 0.5) {
    for (let k = 4.4; k <= 5.4; k += 0.5) {
      sb(Math.round(wx + Math.cos(a) * k * nx), Math.round(wy + Math.sin(a) * k), Math.round(wz + Math.cos(a) * k * nz), ID.PLANK);
    }
  }
  fill(wx, wy, wz, wx, wy, wz, ID.BEAM);
  // sluice pouring onto the wheel
  const sx = Math.round(wx + nx * 2), sz = Math.round(wz + nz * 2);
  for (let y = wy + 6; y <= wy + 10; y++) { sb(sx, y, sz, ID.WATER); sb(sx + 1, y, sz, ID.WATER); }
  emit('spray', wx, wy - 3, wz, { rate: 3.5, size: .55 });
  emit('smoke', bx + 3, g + 14, bz + 3, { rate: .4, size: 1.0, col: [.5, .48, .46] });
  fill(bx + 3, g + 12, bz + 3, bx + 3, g + 14, bz + 3, ID.BRICKS);
  sb(bx + 3, g + 13, bz + 3, ID.EMBER);
  claim(bx - 8, bz - 8, bx + 8, bz + 8);
}

function buildFarms() {
  // look for open, level, unclaimed ground in a ring around the village
  const cand = [];
  for (let z = VILLAGE.z - 58; z < VILLAGE.z + 58; z += 3) {
    for (let x = VILLAGE.x - 58; x < VILLAGE.x + 58; x += 3) {
      const pw = 20, pd = 15;
      if (x < 6 || z < 6 || x + pw > W - 6 || z + pd > D - 6) continue;
      const r = Math.hypot(x + 10 - VILLAGE.x, z + 7 - VILLAGE.z);
      if (r < 20 || r > 62) continue;
      const st = areaStats(x, z, x + pw, z + pd);
      if (st.wet > 4 || st.occ > 2 || st.span > 5) continue;
      cand.push({ x, z, pw, pd, score: st.span * 3 + st.occ * 2 + st.wet + r * 0.06 });
    }
  }
  cand.sort((a, b) => a.score - b.score);
  const plots = [];
  for (const c of cand) {
    if (plots.length >= 4) break;
    let far = true;
    for (const q of plots) if (Math.hypot(q[0] - c.x, q[1] - c.z) < 30) { far = false; break; }
    if (far) plots.push([c.x, c.z, c.pw, c.pd]);
  }
  for (const [px, pz, pw, pd] of plots) {
    const st = areaStats(px, pz, px + pw, pz + pd);
    const g = st.avg;
    flattenTo(px - 1, pz - 1, px + pw + 1, pz + pd + 1, g, ID.DIRT);
    const crop = chance(.5) ? ID.CROP : ID.CROP_GREEN;
    for (let z = pz; z <= pz + pd; z++) for (let x = px; x <= px + pw; x++) {
      const row = (z - pz) % 4;
      if (row === 3) { sb(x, g, z, ID.DIRT); continue; }
      sb(x, g, z, ID.FARMLAND);
      if (chance(.86)) sb(x, g + 1, z, crop);
    }
    fenceLine(px - 1, pz - 1, px + pw + 1, pz - 1);
    fenceLine(px - 1, pz + pd + 1, px + pw + 1, pz + pd + 1);
    fenceLine(px - 1, pz - 1, px - 1, pz + pd + 1);
    fenceLine(px + pw + 1, pz - 1, px + pw + 1, pz + pd + 1);
    claim(px - 2, pz - 2, px + pw + 2, pz + pd + 2);
    // haystacks + a scarecrow
    for (let i = 0; i < 3; i++) {
      const hx = px + 2 + rndi(pw - 4), hz = pz + 2 + rndi(pd - 4);
      fill(hx, g + 1, hz, hx + 1, g + 2, hz + 1, ID.HAY);
    }
    const scx = px + (pw >> 1), scz = pz + (pd >> 1);
    fill(scx, g + 1, scz, scx, g + 3, scz, ID.BEAM);
    fill(scx - 1, g + 3, scz, scx + 1, g + 3, scz, ID.BEAM);
    sb(scx, g + 4, scz, ID.HAY);
    // barn
    const bx = px + pw + 5, bz = pz + 3;
    const bst = areaStats(bx - 5, bz - 4, bx + 5, bz + 4);
    if (bst.wet < 8 && bst.occ < 10 && bst.span < 6) {
      flattenTo(bx - 6, bz - 5, bx + 6, bz + 5, bst.avg, ID.DIRT);
      fill(bx - 5, bst.avg, bz - 4, bx + 5, bst.avg + 5, bz + 4, ID.PLANK_DARK);
      fill(bx - 4, bst.avg + 1, bz - 3, bx + 4, bst.avg + 4, bz + 3, 0);
      gable(bx - 5, bz - 4, bx + 5, bz + 4, bst.avg + 6, ID.ROOF_RED, 1, ID.PLANK_DARK);
      fill(bx - 2, bst.avg + 1, bz + 4, bx + 2, bst.avg + 4, bz + 4, 0);
      sb(bx, bst.avg + 4, bz, ID.LANTERN);
      for (let i = 0; i < 5; i++) fill(bx - 6, bst.avg + 1, bz - 3 + i, bx - 6, bst.avg + 2, bz - 3 + i, ID.HAY);
      claim(bx - 6, bz - 5, bx + 6, bz + 5);
      cart(bx + 7, bz + 2, .3);
    }
  }
}

   WILDERNESS — forests, water, ruins, peaks, the burning mountain
