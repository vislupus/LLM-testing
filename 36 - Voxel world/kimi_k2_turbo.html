<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Fantasy Voxel World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            color: white;
            pointer-events: none;
            z-index: 100;
        }
        
        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: auto;
        }
        
        button {
            padding: 10px 20px;
            background: rgba(30, 30, 40, 0.9);
            border: 1px solid rgba(100, 100, 150, 0.5);
            color: white;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }
        
        button:hover {
            background: rgba(50, 50, 70, 0.95);
            border-color: rgba(150, 150, 200, 0.7);
            transform: translateY(-2px);
        }
        
        button.active {
            background: rgba(80, 120, 180, 0.9);
            border-color: rgba(120, 180, 255, 0.8);
        }
        
        #info {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: #ccc;
            font-size: 12px;
            line-height: 1.6;
            max-width: 280px;
            pointer-events: auto;
        }
        
        #info h3 {
            color: #fff;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loading h1 {
            color: #d4af37;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        
        #loading-bar {
            width: 300px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        
        #loading-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #d4af37, #f4d03f);
            transition: width 0.3s;
        }
        
        #loading-text {
            color: #888;
            margin-top: 15px;
            font-size: 13px;
        }
        
        .key {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255,255,255,0.15);
            border-radius: 4px;
            margin: 0 2px;
            font-family: monospace;
        }
        
        #screenshot-flash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            transition: opacity 0.1s;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>⚔️ Medieval Fantasy Voxel World</h1>
        <div id="loading-bar"><div id="loading-fill"></div></div>
        <div id="loading-text">Initializing WebGPU...</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <h2>🏰 Medieval Fantasy Voxel World</h2>
    </div>
    
    <div id="info">
        <h3>Controls</h3>
        <b>Movement:</b> <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> + Mouse<br>
        <b>Fly Up/Down:</b> <span class="key">Space</span> / <span class="key">Shift</span><br>
        <b>Speed:</b> Hold <span class="key">Shift</span><br>
        <b>Orbit:</b> <span class="key">O</span> toggle<br>
        <b>Screenshot:</b> <span class="key">P</span><br>
        <b>Time:</b> Buttons below<br>
        <div id="fps" style="margin-top:10px;color:#d4af37;">FPS: --</div>
    </div>
    
    <div id="controls">
        <button onclick="setTimeOfDay('dawn')">🌅 Dawn</button>
        <button onclick="setTimeOfDay('day')" class="active">☀️ Day</button>
        <button onclick="setTimeOfDay('dusk')">🌇 Dusk</button>
        <button onclick="setTimeOfDay('night')">🌙 Night</button>
        <button onclick="toggleOrbit()" id="orbit-btn">🎥 Orbit Mode</button>
        <button onclick="toggleBloom()">✨ Bloom</button>
        <button onclick="takeScreenshot()">📸 Screenshot</button>
    </div>
    
    <div id="screenshot-flash"></div>

    return BLOCK_COLORS[blockId] || [0x80, 0x80, 0x80];
}

function getBlockProps(blockId) {
    return BLOCK_PROPS[blockId] || { transparent: false, solid: true, emissive: 0 };
}

// ============================================
// MATH UTILITIES
// ============================================

class Vec3 {
    constructor(x = 0, y = 0, z = 0) {
        this.x = x; this.y = y; this.z = z;
    }
    add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
    sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
    mul(s) { return new Vec3(this.x * s, this.y * s, this.z * s); }
    dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
    cross(v) {
        return new Vec3(
            this.y * v.z - this.z * v.y,
            this.z * v.x - this.x * v.z,
            this.x * v.y - this.y * v.x
        );
    }
    normalize() {
        const len = Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
        return len > 0 ? new Vec3(this.x / len, this.y / len, this.z / len) : new Vec3(0, 0, 0);
    }
    toArray() { return [this.x, this.y, this.z]; }
}

class Mat4 {
    constructor() {
        this.m = new Float32Array(16);
        this.identity();
    }
    identity() {
        const m = this.m;
        m[0] = 1; m[1] = 0; m[2] = 0; m[3] = 0;
        m[4] = 0; m[5] = 1; m[6] = 0; m[7] = 0;
        m[8] = 0; m[9] = 0; m[10] = 1; m[11] = 0;
        m[12] = 0; m[13] = 0; m[14] = 0; m[15] = 1;
        return this;
    }
    perspective(fov, aspect, near, far) {
        const f = 1.0 / Math.tan(fov / 2);
        const nf = 1 / (near - far);
        const m = this.m;
        m[0] = f / aspect; m[1] = 0; m[2] = 0; m[3] = 0;
        m[4] = 0; m[5] = f; m[6] = 0; m[7] = 0;
        m[8] = 0; m[9] = 0; m[10] = (far + near) * nf; m[11] = -1;
        m[12] = 0; m[13] = 0; m[14] = 2 * far * near * nf; m[15] = 0;
        return this;
    }
    lookAt(eye, center, up) {
        const z = eye.sub(center).normalize();
        const x = up.cross(z).normalize();
        const y = z.cross(x);
        const m = this.m;
        m[0] = x.x; m[1] = y.x; m[2] = z.x; m[3] = 0;
        m[4] = x.y; m[5] = y.y; m[6] = z.y; m[7] = 0;
        m[8] = x.z; m[9] = y.z; m[10] = z.z; m[11] = 0;
        m[12] = -x.dot(eye); m[13] = -y.dot(eye); m[14] = -z.dot(eye); m[15] = 1;
        return this;
    }
    translate(x, y, z) {
        const m = this.m;
        m[12] += m[0] * x + m[4] * y + m[8] * z;
        m[13] += m[1] * x + m[5] * y + m[9] * z;
        m[14] += m[2] * x + m[6] * y + m[10] * z;
        m[15] += m[3] * x + m[7] * y + m[11] * z;
        return this;
    }
    rotateY(angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        const m = this.m;
        const a0 = m[0], a2 = m[2], a4 = m[4], a6 = m[6], a8 = m[8], a10 = m[10];
        m[0] = a0 * c + a8 * s; m[2] = a2 * c + a10 * s;
        m[4] = a4 * c + m[12] * s; m[6] = a6 * c + m[14] * s;
        m[8] = a8 * c - a0 * s; m[10] = a10 * c - a2 * s;
        m[12] = m[12] * c - a4 * s; m[14] = m[14] * c - a6 * s;
        return this;
    }
    rotateX(angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        const m = this.m;
        const a1 = m[1], a2 = m[2], a5 = m[5], a6 = m[6], a9 = m[9], a10 = m[10];
        m[1] = a1 * c + a9 * s; m[2] = a2 * c + a10 * s;
        m[5] = a5 * c + m[13] * s; m[6] = a6 * c + m[14] * s;
        m[9] = a9 * c - a1 * s; m[10] = a10 * c - a2 * s;
        m[13] = m[13] * c - a5 * s; m[14] = m[14] * c - a6 * s;
        return this;
    }
    multiply(b) {
        const a = this.m, bm = b.m;
        const res = new Mat4();
        const r = res.m;
        for (let i = 0; i < 4; i++) {
            for (let j = 0; j < 4; j++) {
                r[i * 4 + j] = a[i * 4] * bm[j] + a[i * 4 + 1] * bm[4 + j] + 
                              a[i * 4 + 2] * bm[8 + j] + a[i * 4 + 3] * bm[12 + j];
            }
        }
        return res;
    }
    toArray() { return this.m; }
}

// ============================================
// NOISE FUNCTIONS
// ============================================

class SimplexNoise {
    constructor(seed = Math.random()) {
        this.p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) this.p[i] = i;
        for (let i = 255; i > 0; i--) {
            const j = Math.floor((seed * (i + 1)) % 256);
            [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
            seed = (seed * 1.2345 + 0.6789) % 1;
        }
        this.perm = new Uint8Array(512);
        for (let i = 0; i < 512; i++) this.perm[i] = this.p[i & 255];
    }
    
    noise2D(x, y) {
        const F2 = 0.5 * (Math.sqrt(3) - 1);
        const G2 = (3 - Math.sqrt(3)) / 6;
        const s = (x + y) * F2;
        const i = Math.floor(x + s), j = Math.floor(y + s);
        const t = (i + j) * G2;
        const X0 = i - t, Y0 = j - t;
        const x0 = x - X0, y0 = y - Y0;
        const i1 = x0 > y0 ? 1 : 0, j1 = x0 > y0 ? 0 : 1;
        const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2;
        const x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
        const ii = i & 255, jj = j & 255;
        
        const grad = (hash, x, y) => {
            const h = hash & 15;
            const u = h < 8 ? x : y;
            const v = h < 4 ? y : h === 12 || h === 14 ? x : 0;
            return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
        };
        
        let n0 = 0, n1 = 0, n2 = 0;
        const t0 = 0.5 - x0 * x0 - y0 * y0;
        if (t0 >= 0) {
            const gi0 = this.perm[ii + this.perm[jj]];
            n0 = (t0 * t0) * (t0 * t0) * grad(gi0, x0, y0);
        }
        const t1 = 0.5 - x1 * x1 - y1 * y1;
        if (t1 >= 0) {
            const gi1 = this.perm[ii + i1 + this.perm[jj + j1]];
            n1 = (t1 * t1) * (t1 * t1) * grad(gi1, x1, y1);
        }
        const t2 = 0.5 - x2 * x2 - y2 * y2;
        if (t2 >= 0) {
            const gi2 = this.perm[ii + 1 + this.perm[jj + 1]];
            n2 = (t2 * t2) * (t2 * t2) * grad(gi2, x2, y2);
        }
        return 70 * (n0 + n1 + n2);
    }
    
    noise3D(x, y, z) {
        return this.noise2D(x * 0.7 + z * 0.3, y * 0.7 + z * 0.3);
    }
    
    fractal2D(x, y, octaves = 4, persistence = 0.5, lacunarity = 2) {
        let total = 0, amplitude = 1, frequency = 1, maxValue = 0;
        for (let i = 0; i < octaves; i++) {
            total += this.noise2D(x * frequency, y * frequency) * amplitude;
            maxValue += amplitude;
            amplitude *= persistence;
            frequency *= lacunarity;
        }
        return total / maxValue;
    }
}

// ============================================
// VOXEL WORLD
// ============================================

class VoxelWorld {
    constructor(width, height, depth) {
        this.width = width;
        this.height = height;
        this.depth = depth;
        this.data = new Uint8Array(width * height * depth);
        this.noise = new SimplexNoise(12345);
        this.noise2 = new SimplexNoise(54321);
        this.noise3 = new SimplexNoise(99999);
    }
    
    getIndex(x, y, z) {
        return (y * this.depth + z) * this.width + x;
    }
    
    getBlock(x, y, z) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height || z < 0 || z >= this.depth) {
            return BLOCKS.AIR;
        }
        return this.data[this.getIndex(x, y, z)];
    }
    
    setBlock(x, y, z, block) {
        if (x < 0 || x >= this.width || y < 0 || y >= this.height || z < 0 || z >= this.depth) return;
        this.data[this.getIndex(x, y, z)] = block;
    }
    
    isSolid(x, y, z) {
        const block = this.getBlock(x, y, z);
        return block !== BLOCKS.AIR && !getBlockProps(block).liquid;
    }
    
    isTransparent(x, y, z) {
        const block = this.getBlock(x, y, z);
        return getBlockProps(block).transparent;
    }
    
    generateTerrain() {
        const cx = this.width / 2;
        const cz = this.depth / 2;
        
        // Generate base terrain
        for (let x = 0; x < this.width; x++) {
            for (let z = 0; z < this.depth; z++) {
                const nx = x / 100;
                const nz = z / 100;
                
                // Multi-octave terrain
                let height = 40 + this.noise.fractal2D(nx, nz, 6, 0.5, 2) * 25;
                
                // Add mountain ranges
                const mountainNoise = this.noise2.fractal2D(nx * 2, nz * 2, 4, 0.5, 2);
                if (mountainNoise > 0.4) {
                    height += (mountainNoise - 0.4) * 60;
                }
                
                // Volcano in one corner
                const dx = x - this.width * 0.85;
                const dz = z - this.depth * 0.15;
                const dist = Math.sqrt(dx * dx + dz * dz);
                if (dist < 40) {
                    const volcanoHeight = 60 * Math.exp(-dist * 0.05);
                    height += volcanoHeight;
                }
                
                // River
                const riverCurve = Math.sin(x / 30) * 20 + this.depth * 0.6;
                const riverDist = Math.abs(z - riverCurve);
                if (riverDist < 12) {
                    height = Math.min(height, 32 - (12 - riverDist) * 0.5);
                }
                
                // Castle hill (terraced)
                const castleDx = x - cx;
                const castleDz = z - cz + 80;
                const castleDist = Math.sqrt(castleDx * castleDx + castleDz * castleDz);
                if (castleDist < 50) {
                    height = 55 + (50 - castleDist) * 0.3;
                    // Terraces
                    height = Math.floor(height / 5) * 5;
                }
                
                height = Math.floor(Math.max(5, Math.min(this.height - 10, height)));
                
                // Fill column
                for (let y = 0; y < this.height; y++) {
                    if (y === 0) {
                        this.setBlock(x, y, z, BLOCKS.BEDROCK);
                    } else if (y < height - 5) {
                        this.setBlock(x, y, z, BLOCKS.STONE);
                    } else if (y < height - 1) {
                        this.setBlock(x, y, z, BLOCKS.DIRT);
                    } else if (y < height) {
                        // Surface block
                        if (height > 70) {
                            this.setBlock(x, y, z, BLOCKS.SNOW);
                        } else if (riverDist < 15) {
                            this.setBlock(x, y, z, BLOCKS.SAND);
                        } else {
                            this.setBlock(x, y, z, BLOCKS.GRASS);
                        }
                    } else if (y < 32 && riverDist < 12) {
                        this.setBlock(x, y, z, BLOCKS.WATER);
                    }
                }
            }
        }
        
        this.generateCastle();
        this.generateVillage();
        this.generateVolcano();
        this.generateForest();
        this.generateDetails();
    }
    
    generateCastle() {
        const cx = Math.floor(this.width / 2);
        const cz = Math.floor(this.depth / 2) + 80;
        const baseY = 58;
        
        // Castle walls (square)
        const wallRadius = 25;
        for (let x = cx - wallRadius; x <= cx + wallRadius; x++) {
            for (let z = cz - wallRadius; z <= cz + wallRadius; z++) {
                const onWall = x === cx - wallRadius || x === cx + wallRadius || 
                              z === cz - wallRadius || z === cz + wallRadius;
                const corner = (Math.abs(x - cx) === wallRadius && Math.abs(z - cz) === wallRadius);
                
                if (onWall && !corner) {
                    // Wall
                    for (let y = baseY; y < baseY + 12; y++) {
                        this.setBlock(x, y, z, BLOCKS.COBBLESTONE);
                    }
                    // Battlements
                    if ((x + z) % 4 === 0) {
                        this.setBlock(x, baseY + 12, z, BLOCKS.COBBLESTONE);
                    }
                } else if (corner) {
                    // Towers at corners
                    for (let y = baseY; y < baseY + 18; y++) {
                        this.setBlock(x, y, z, BLOCKS.STONE);
                        // Tower thickness
                        for (let dx = -1; dx <= 1; dx++) {
                            for (let dz = -1; dz <= 1; dz++) {
                                if (Math.abs(dx) + Math.abs(dz) <= 1) {
                                    this.setBlock(x + dx, y, z + dz, BLOCKS.STONE);
                                }
                            }
                        }
                    }
                    // Tower roof
                    for (let dx = -2; dx <= 2; dx++) {
                        for (let dz = -2; dz <= 2; dz++) {
                            if (Math.abs(dx) + Math.abs(dz) <= 2) {
                                this.setBlock(x + dx, baseY + 18, z + dz, BLOCKS.PLANKS_DARK);
                            }
                        }
                    }
                    // Flag
                    this.setBlock(x, baseY + 19, z, BLOCKS.FENCE_OAK);
                    this.setBlock(x, baseY + 20, z, BLOCKS.WOOL_RED);
                    this.setBlock(x + 1, baseY + 20, z, BLOCKS.WOOL_RED);
                }
            }
        }
        
        // Gatehouse (front)
        const gateZ = cz + wallRadius;
        for (let x = cx - 4; x <= cx + 4; x++) {
            for (let y = baseY; y < baseY + 15; y++) {
                if (Math.abs(x - cx) > 2 || y > baseY + 8) {
                    this.setBlock(x, y, gateZ, BLOCKS.STONE);
                }
            }
        }
        // Portcullis
        for (let x = cx - 2; x <= cx + 2; x++) {
            for (let y = baseY; y < baseY + 8; y++) {
                if (x % 2 === 0 || y === baseY + 7) {
                    this.setBlock(x, y, gateZ, BLOCKS.IRON_ORE);
                }
            }
        }
        
        // Bridge over moat
        for (let z = gateZ + 1; z < gateZ + 15; z++) {
            for (let x = cx - 3; x <= cx + 3; x++) {
                this.setBlock(x, baseY + 1, z, BLOCKS.PLANKS_OAK);
            }
            // Bridge railings
            this.setBlock(cx - 3, baseY + 2, z, BLOCKS.FENCE_OAK);
            this.setBlock(cx + 3, baseY + 2, z, BLOCKS.FENCE_OAK);
        }
        
        // Moat
        for (let x = cx - wallRadius - 8; x <= cx + wallRadius + 8; x++) {
            for (let z = cz - wallRadius - 8; z <= cz + wallRadius + 8; z++) {
                const inMoat = (Math.abs(x - cx) > wallRadius && Math.abs(x - cx) <= wallRadius + 6) ||
                              (Math.abs(z - cz) > wallRadius && Math.abs(z - cz) <= wallRadius + 6);
                const outside = Math.abs(x - cx) > wallRadius || Math.abs(z - cz) > wallRadius;
                if (inMoat && outside) {
                    for (let y = baseY - 3; y < baseY + 1; y++) {
                        if (this.getBlock(x, y, z) === BLOCKS.AIR) {
                            this.setBlock(x, y, z, BLOCKS.WATER);
                        }
                    }
                }
            }
        }
        
        // Keep (central tower)
        for (let x = cx - 8; x <= cx + 8; x++) {
            for (let z = cz - 8; z <= cz + 8; z++) {
                const inKeep = Math.abs(x - cx) <= 7 && Math.abs(z - cz) <= 7;
                const keepWall = Math.abs(x - cx) === 7 || Math.abs(z - cz) === 7;
                
                if (inKeep) {
                    for (let y = baseY; y < baseY + 25; y++) {
                        if (keepWall || y === baseY) {
                            this.setBlock(x, y, z, BLOCKS.STONE);
                        } else if (y === baseY + 24) {
                            this.setBlock(x, y, z, BLOCKS.PLANKS_DARK);
                        } else if (y > baseY && y < baseY + 24) {
                            // Interior floors
                            if (y === baseY + 8 || y === baseY + 16) {
                                this.setBlock(x, y, z, BLOCKS.PLANKS_OAK);
                            }
                        }
                    }
                }
            }
        }
        
        // Chapel
        const chapelX = cx - 15;
        const chapelZ = cz;
        for (let x = chapelX - 5; x <= chapelX + 5; x++) {
            for (let z = chapelZ - 8; z <= chapelZ + 8; z++) {
                const inChapel = Math.abs(x - chapelX) <= 4 && Math.abs(z - chapelZ) <= 7;
                const chapelWall = Math.abs(x - chapelX) === 4 || Math.abs(z - chapelZ) === 7;
                
                if (inChapel) {
                    for (let y = baseY; y < baseY + 12; y++) {
                        if (chapelWall || y === baseY) {
                            this.setBlock(x, y, z, BLOCKS.STONE);
                        }
                        // Stained glass windows
                        if (chapelWall && y > baseY + 3 && y < baseY + 9 && (x + z) % 4 === 0) {
                            this.setBlock(x, y, z, BLOCKS.GLASS);
                        }
                    }
                    // Chapel roof (pointed)
                    const roofHeight = 4 - Math.floor(Math.abs(z - chapelZ) / 2);
                    for (let y = 0; y < roofHeight; y++) {
                        this.setBlock(x, baseY + 12 + y, z, BLOCKS.PLANKS_DARK);
                    }
                }
            }
        }
        
        // Courtyard details
        for (let x = cx - 15; x <= cx + 15; x++) {
            for (let z = cz - 15; z <= cz + 15; z++) {
                if (Math.abs(x - cx) < 20 && Math.abs(z - cz) < 20) {
                    // Garden paths
                    if ((x + z) % 7 === 0) {
                        this.setBlock(x, baseY, z, BLOCKS.GRAVEL);
                    }
                    // Flower beds
                    if (Math.random() < 0.05 && this.getBlock(x, baseY, z) === BLOCKS.GRASS) {
                        const flowers = [BLOCKS.POPPY, BLOCKS.DANDELION, BLOCKS.BLUE_ORCHID, BLOCKS.ALLIUM];
                        this.setBlock(x, baseY + 1, z, flowers[Math.floor(Math.random() * flowers.length)]);
                    }
                }
            }
        }
        
        // Torches on walls
        const torchPositions = [
            [cx - wallRadius + 5, gateZ], [cx + wallRadius - 5, gateZ],
            [cx - wallRadius, cz - wallRadius + 5], [cx - wallRadius, cz + wallRadius - 5],
            [cx + wallRadius, cz - wallRadius + 5], [cx + wallRadius, cz + wallRadius - 5]
        ];
        for (const [tx, tz] of torchPositions) {
            this.setBlock(tx, baseY + 8, tz, BLOCKS.TORCH);
        }
    }
    
    generateVillage() {
        const cx = Math.floor(this.width / 2);
        const cz = Math.floor(this.depth / 2) - 50;
        const baseY = 35;
        
        // Village layout - curved streets
        const houses = [];
        const numHouses = 30;
        
        for (let i = 0; i < numHouses; i++) {
            const angle = (i / numHouses) * Math.PI * 2 + Math.sin(i * 0.5) * 0.5;
            const radius = 25 + Math.random() * 20;
            const x = cx + Math.cos(angle) * radius;
            const z = cz + Math.sin(angle) * radius * 0.6;
            
            // Ensure flat ground
            const y = baseY;
            for (let hx = Math.floor(x) - 3; hx <= Math.floor(x) + 3; hx++) {
                for (let hz = Math.floor(z) - 3; hz <= Math.floor(z) + 3; hz++) {
                    for (let hy = y - 2; hy <= y; hy++) {
                        this.setBlock(hx, hy, hz, BLOCKS.DIRT);
                    }
                    this.setBlock(hx, y, hz, BLOCKS.GRASS);
                }
            }
            
            houses.push({ x: Math.floor(x), y: y, z: Math.floor(z), type: i % 5 });
        }
        
        // Build houses
        for (const house of houses) {
            this.buildHouse(house.x, house.y, house.z, house.type);
        }
        
        // Marketplace (central square)
        for (let x = cx - 15; x <= cx + 15; x++) {
            for (let z = cz - 10; z <= cz + 10; z++) {
                this.setBlock(x, baseY, z, BLOCKS.GRAVEL);
                
                // Market stalls
                if ((x % 6 === 0 && z % 6 === 0) && Math.abs(x - cx) < 12 && Math.abs(z - cz) < 8) {
                    // Stall posts
                    this.setBlock(x, baseY + 1, z, BLOCKS.FENCE_OAK);
                    this.setBlock(x, baseY + 2, z, BLOCKS.WOOL_RED);
                    // Stall roof
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dz = -1; dz <= 1; dz++) {
                            this.setBlock(x + dx, baseY + 3, z + dz, BLOCKS.WOOL_WHITE);
                        }
                    }
                }
            }
        }
        
        // Tavern (larger building)
        const tavernX = cx - 30;
        const tavernZ = cz;
        this.buildTavern(tavernX, baseY, tavernZ);
        
        // Blacksmith
        const smithX = cx + 25;
        const smithZ = cz + 10;
        this.buildBlacksmith(smithX, baseY, smithZ);
        
        // Chapel
        const vilChapelX = cx;
        const vilChapelZ = cz - 35;
        this.buildVillageChapel(vilChapelX, baseY, vilChapelZ);
        
        // Farms
        for (let i = 0; i < 4; i++) {
            const fx = cx + 40 + i * 15;
            const fz = cz - 20 + i * 10;
            this.buildFarm(fx, baseY, fz);
        }
        
        // Docks by the river
        const dockZ = cz + 50;
        for (let x = cx - 20; x <= cx + 20; x++) {
            for (let z = dockZ; z < dockZ + 10; z++) {
                if (this.getBlock(x, baseY, z) === BLOCKS.GRASS) {
                    // Dock platforms
                    if (x % 4 !== 0) {
                        for (let y = baseY; y < baseY + 2; y++) {
                            this.setBlock(x, y, z, BLOCKS.PLANKS_OAK);
                        }
                    }
                }
            }
        }
        
        // Boats
        this.buildBoat(cx - 10, baseY + 1, dockZ + 5);
        this.buildBoat(cx + 15, baseY + 1, dockZ + 7);
        
        // Watermill
        this.buildWatermill(cx + 35, baseY, cz + 30);
        
        // Wells
        for (const [wx, wz] of [[cx - 20, cz - 15], [cx + 20, cz + 20]]) {
            for (let y = baseY; y < baseY + 3; y++) {
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        if (dx === 0 && dz === 0 && y === baseY + 1) {
                            this.setBlock(wx + dx, y, wz + dz, BLOCKS.WATER);
                        } else {
                            this.setBlock(wx + dx, y, wz + dz, BLOCKS.COBBLESTONE);
                        }
                    }
                }
            }
            // Well roof
            this.setBlock(wx, baseY + 3, wz, BLOCKS.PLANKS_OAK);
        }
        
        // Stone bridge to castle
        for (let z = cz + 30; z < cz + 80; z++) {
            for (let x = cx - 2; x <= cx + 2; x++) {
                const bridgeHeight = baseY + 2 + Math.sin((z - cz) / 20) * 3;
                this.setBlock(x, Math.floor(bridgeHeight), z, BLOCKS.COBBLESTONE);
                // Railings
                if (Math.abs(x - cx) === 2) {
                    this.setBlock(x, Math.floor(bridgeHeight) + 1, z, BLOCKS.FENCE_OAK);
                }
            }
        }
        
        // Fences and paths
        for (let x = cx - 50; x <= cx + 50; x++) {
            for (let z = cz - 40; z <= cz + 60; z++) {
                // Random fences
                if (Math.random() < 0.02 && this.getBlock(x, baseY, z) === BLOCKS.GRASS) {
                    this.setBlock(x, baseY + 1, z, BLOCKS.FENCE_OAK);
                }
                // Path connections
                if (Math.random() < 0.1 && this.getBlock(x, baseY, z) === BLOCKS.GRASS) {
                    const nearHouse = houses.some(h => Math.abs(h.x - x) < 5 && Math.abs(h.z - z) < 5);
                    if (nearHouse) {
                        this.setBlock(x, baseY, z, BLOCKS.GRAVEL);
                    }
                }
            }
        }
        
        // Lanterns
        for (let i = 0; i < 15; i++) {
            const lx = cx + (Math.random() - 0.5) * 60;
            const lz = cz + (Math.random() - 0.5) * 60;
            const ly = baseY + 2;
            this.setBlock(Math.floor(lx), ly, Math.floor(lz), BLOCKS.LANTERN);
        }
        
        // Barrels and carts
        for (let i = 0; i < 20; i++) {
            const bx = cx + (Math.random() - 0.5) * 50;
            const bz = cz + (Math.random() - 0.5) * 50;
            if (this.getBlock(Math.floor(bx), baseY + 1, Math.floor(bz)) === BLOCKS.AIR) {
                this.setBlock(Math.floor(bx), baseY + 1, Math.floor(bz), BLOCKS.BARREL);
            }
        }
    }
    
    buildHouse(x, y, z, type) {
        const width = 4 + Math.floor(Math.random() * 3);
        const depth = 4 + Math.floor(Math.random() * 3);
        const height = 4 + Math.floor(Math.random() * 2);
        
        const materials = [
            [BLOCKS.PLANKS_OAK, BLOCKS.WOOD_OAK], // Wood house
            [BLOCKS.COBBLESTONE, BLOCKS.STONE],   // Stone house
            [BLOCKS.PLANKS_BIRCH, BLOCKS.WOOD_BIRCH], // Birch house
            [BLOCKS.BRICK_RED, BLOCKS.BRICK_STONE],   // Brick house
            [BLOCKS.TERRACOTTA_BROWN, BLOCKS.TERRACOTTA_WHITE] // Terracotta
        ];
        const [wallMat, frameMat] = materials[type % materials.length];
        
        for (let hx = x - width; hx <= x + width; hx++) {
            for (let hz = z - depth; hz <= z + depth; hz++) {
                for (let hy = y; hy < y + height; hy++) {
                    const isWall = hx === x - width || hx === x + width || 
                                hz === z - depth || hz === z + depth;
                    const isCorner = (hx === x - width || hx === x + width) && 
                                    (hz === z - depth || hz === z + depth);
                    
                    if (hy === y) {
                        this.setBlock(hx, hy, hz, frameMat);
                    } else if (isWall) {
                        // Door
                        if (hz === z + depth && Math.abs(hx - x) <= 1 && hy < y + 3) {
                            if (hy < y + 2) continue; // Open door
                            this.setBlock(hx, hy, hz, BLOCKS.PLANKS_DARK);
                        } else if (isCorner) {
                            this.setBlock(hx, hy, hz, frameMat);
                        } else {
                            this.setBlock(hx, hy, hz, wallMat);
                        }
                        
                        // Windows
                        if (!isCorner && hy === y + 2 && (hx + hz) % 3 === 0) {
                            this.setBlock(hx, hy, hz, BLOCKS.GLASS);
                        }
                    }
                }
                
                // Roof
                const roofHeight = height + Math.min(width - Math.abs(hx - x), depth - Math.abs(hz - z)) / 2;
                for (let ry = 0; ry < roofHeight; ry++) {
                    if (Math.abs(hx - x) <= width - ry && Math.abs(hz - z) <= depth - ry) {
                        this.setBlock(hx, y + height + ry, hz, BLOCKS.PLANKS_DARK);
                    }
                }
            }
        }
        
        // Chimney
        const chimX = x + width - 1;
        const chimZ = z - depth + 1;
        for (let cy = y + height; cy < y + height + 4; cy++) {
            this.setBlock(chimX, cy, chimZ, BLOCKS.STONE);
        }
        this.setBlock(chimX, y + height + 4, chimZ, BLOCKS.CAMPFIRE);
    }
    
    buildTavern(x, y, z) {
        const width = 10, depth = 8, height = 6;
        
        for (let tx = x - width; tx <= x + width; tx++) {
            for (let tz = z - depth; tz <= z + depth; tz++) {
                for (let ty = y; ty < y + height; ty++) {
                    const isWall = Math.abs(tx - x) === width || Math.abs(tz - z) === depth;
                    
                    if (ty === y) {
                        this.setBlock(tx, ty, tz, BLOCKS.COBBLESTONE);
                    } else if (isWall) {
                        this.setBlock(tx, ty, tz, BLOCKS.PLANKS_OAK);
                        // Windows with warm glow
                        if (ty === y + 3 && (tx + tz) % 4 === 0) {
                            this.setBlock(tx, ty, tz, BLOCKS.GLASS);
                        }
                    }
                }
                
                // Roof
                const roofPeak = 4;
                for (let ry = 0; ry < roofPeak; ry++) {
                    if (Math.abs(tx - x) <= width - ry && Math.abs(tz - z) <= depth - ry * 0.8) {
                        this.setBlock(tx, y + height + ry, tz, BLOCKS.PLANKS_DARK);
                    }
                }
            }
        }
        
        // Sign
        this.setBlock(x, y + 4, z + depth + 1, BLOCKS.SIGN);
        
        // Lanterns outside
        this.setBlock(x - width - 1, y + 3, z, BLOCKS.LANTERN);
        this.setBlock(x + width + 1, y + 3, z, BLOCKS.LANTERN);
    }
    
    buildBlacksmith(x, y, z) {
        const width = 6, depth = 5, height = 5;
        
        for (let bx = x - width; bx <= x + width; bx++) {
            for (let bz = z - depth; bz <= z + depth; bz++) {
                for (let by = y; by < y + height; by++) {
                    const isWall = Math.abs(bx - x) === width || Math.abs(bz - z) === depth;
                    
                    if (by === y) {
                        this.setBlock(bx, by, bz, BLOCKS.COBBLESTONE);
                    } else if (isWall) {
                        this.setBlock(bx, by, bz, BLOCKS.STONE);
                    }
                }
                
                // Roof
                for (let ry = 0; ry < 3; ry++) {
                    if (Math.abs(bx - x) <= width - ry && Math.abs(bz - z) <= depth - ry) {
                        this.setBlock(bx, y + height + ry, bz, BLOCKS.PLANKS_DARK);
                    }
                }
            }
        }
        
        // Forge
        this.setBlock(x, y + 1, z - depth + 2, BLOCKS.FURNACE);
        this.setBlock(x, y + 2, z - depth + 2, BLOCKS.CAMPFIRE);
        this.setBlock(x - 1, y + 1, z - depth + 2, BLOCKS.ANVIL);
    }
    
    buildVillageChapel(x, y, z) {
        const width = 5, depth = 8, height = 8;
        const steepleHeight = 6;
        
        for (let cx = x - width; cx <= x + width; cx++) {
            for (let cz = z - depth; cz <= z + depth; cz++) {
                for (let cy = y; cy < y + height; cy++) {
                    const isWall = Math.abs(cx - x) === width || Math.abs(cz - z) === depth;
                    
                    if (cy === y) {
                        this.setBlock(cx, cy, cz, BLOCKS.STONE);
                    } else if (isWall) {
                        this.setBlock(cx, cy, cz, BLOCKS.COBBLESTONE);
                        // Tall stained glass windows
                        if (cy > y + 2 && cy < y + 6 && (cx + cz) % 3 === 0) {
                            this.setBlock(cx, cy, cz, BLOCKS.GLASS);
                        }
                    }
                }
                
                // Steeple
                for (let sy = 0; sy < steepleHeight; sy++) {
                    if (Math.abs(cx - x) <= 1 && Math.abs(cz - z) <= 1) {
                        this.setBlock(cx, y + height + sy, cz, BLOCKS.PLANKS_DARK);
                    }
                }
            }
        }
        
        // Bell
        this.setBlock(x, y + height + steepleHeight - 1, z, BLOCKS.BELL);
    }
    
    buildFarm(x, y, z) {
        // Farm house
        for (let fx = x - 3; fx <= x + 3; fx++) {
            for (let fz = z - 3; fz <= z + 3; fz++) {
                for (let fy = y; fy < y + 4; fy++) {
                    const isWall = Math.abs(fx - x) === 3 || Math.abs(fz - z) === 3;
                    if (fy === y) {
                        this.setBlock(fx, fy, fz, BLOCKS.PLANKS_OAK);
                    } else if (isWall) {
                        this.setBlock(fx, fy, fz, BLOCKS.PLANKS_OAK);
                    }
                }
                // Roof
                if (Math.abs(fx - x) <= 2 && Math.abs(fz - z) <= 2) {
                    this.setBlock(fx, y + 4, fz, BLOCKS.PLANKS_DARK);
                }
            }
        }
        
        // Fields
        for (let fx = x - 10; fx <= x + 10; fx++) {
            for (let fz = z + 5; fz <= z + 15; fz++) {
                this.setBlock(fx, y, fz, BLOCKS.FARMLAND);
                // Crops
                if (Math.random() < 0.7) {
                    const crops = [BLOCKS.WHEAT, BLOCKS.CARROTS, BLOCKS.POTATOES || BLOCKS.WHEAT];
                    this.setBlock(fx, y + 1, fz, crops[Math.floor(Math.random() * crops.length)]);
                }
            }
        }
        
        // Scarecrow
        this.setBlock(x + 8, y + 1, z + 10, BLOCKS.FENCE_OAK);
        this.setBlock(x + 8, y + 2, z + 10, BLOCKS.HAY_BLOCK || BLOCKS.WOOL_YELLOW);
        this.setBlock(x + 8, y + 2, z + 11, BLOCKS.WOOL_RED);
    }
    
    buildBoat(x, y, z) {
        // Simple boat shape
        for (let bx = -2; bx <= 2; bx++) {
            for (let bz = -4; bz <= 4; bz++) {
                const hull = Math.abs(bx) === 2 || Math.abs(bz) === 4;
                if (!hull || (Math.abs(bx) < 2 && Math.abs(bz) < 4)) {
                    this.setBlock(x + bx, y, z + bz, BLOCKS.PLANKS_OAK);
                }
            }
        }
        // Mast
        for (let my = 0; my < 6; my++) {
            this.setBlock(x, y + my, z, BLOCKS.FENCE_OAK);
        }
        // Sail
        for (let sy = 2; sy < 5; sy++) {
            for (let sx = 1; sx <= 2; sx++) {
                this.setBlock(x + sx, y + sy, z, BLOCKS.WOOL_WHITE);
            }
        }
    }
    
    buildWatermill(x, y, z) {
        // Mill building
        for (let mx = x - 4; mx <= x + 4; mx++) {
            for (let mz = z - 3; mz <= z + 3; mz++) {
                for (let my = y; my < y + 5; my++) {
                    const isWall = Math.abs(mx - x) === 4 || Math.abs(mz - z) === 3;
                    if (my === y) {
                        this.setBlock(mx, my, mz, BLOCKS.COBBLESTONE);
                    } else if (isWall) {
                        this.setBlock(mx, my, mz, BLOCKS.PLANKS_OAK);
                    }
                }
                // Roof
                if (Math.abs(mx - x) <= 3 && Math.abs(mz - z) <= 2) {
                    this.setBlock(mx, y + 5, mz, BLOCKS.PLANKS_DARK);
                }
            }
        }
        
        // Water wheel
        for (let wy = -2; wy <= 2; wy++) {
            for (let wz = -2; wz <= 2; wz++) {
                if (Math.abs(wy) === 2 || Math.abs(wz) === 2) {
                    this.setBlock(x + 5, y + 2 + wy, z + wz, BLOCKS.FENCE_OAK);
                }
            }
        }
    }
    
    generateVolcano() {
        const vx = Math.floor(this.width * 0.85);
        const vz = Math.floor(this.depth * 0.15);
        const baseY = 40;
        
        // Volcano cone
        for (let x = vx - 50; x <= vx + 50; x++) {
            for (let z = vz - 50; z <= vz + 50; z++) {
                const dx = x - vx;
                const dz = z - vz;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist < 45) {
                    const height = baseY + (45 - dist) * 1.5 - Math.pow(dist / 15, 2);
                    const crater = dist < 12;
                    
                    for (let y = 0; y < height; y++) {
                        if (y > height - 3 && !crater) {
                            // Surface
                            if (dist > 35) {
                                this.setBlock(x, y, z, BLOCKS.BASALT);
                            } else if (dist > 25) {
                                this.setBlock(x, y, z, BLOCKS.POLISHED_BASALT);
                            } else {
                                this.setBlock(x, y, z, BLOCKS.OBSIDIAN);
                            }
                        } else if (!crater || y < height - 5) {
                            this.setBlock(x, y, z, BLOCKS.STONE);
                        }
                    }
                    
                    // Lava in crater
                    if (crater) {
                        for (let y = baseY + 10; y < height - 2; y++) {
                            this.setBlock(x, y, z, BLOCKS.LAVA);
                        }
                    }
                }
            }
        }
        
        // Lava flows
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;
            let lx = vx + Math.cos(angle) * 12;
            let lz = vz + Math.sin(angle) * 12;
            let ly = baseY + 35;
            
            for (let step = 0; step < 30; step++) {
                lx += Math.cos(angle) * 0.5;
                lz += Math.sin(angle) * 0.5;
                ly -= 0.3;
                
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        this.setBlock(Math.floor(lx + dx), Math.floor(ly), Math.floor(lz + dz), BLOCKS.LAVA);
                    }
                }
            }
        }
        
        // Smoke particles (represented as special blocks)
        for (let i = 0; i < 20; i++) {
            const sx = vx + (Math.random() - 0.5) * 10;
            const sz = vz + (Math.random() - 0.5) * 10;
            const sy = baseY + 50 + Math.random() * 20;
            // Use wool gray for smoke
        }
        
        // Dead trees around volcano
        for (let i = 0; i < 15; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 20;
            const tx = vx + Math.cos(angle) * dist;
            const tz = vz + Math.sin(angle) * dist;
            const ty = this.findGroundHeight(Math.floor(tx), Math.floor(tz));
            
            if (ty > 0) {
                // Dead trunk
                for (let h = 0; h < 3 + Math.random() * 3; h++) {
                    this.setBlock(Math.floor(tx), ty + h, Math.floor(tz), BLOCKS.WOOD_DARK);
                }
            }
        }
        
        // Ancient ruins at base
        for (let rx = vx - 30; rx <= vx + 30; rx += 8) {
            for (let rz = vz - 30; rz <= vz + 30; rz += 8) {
                if (Math.random() < 0.3) {
                    const ry = this.findGroundHeight(rx, rz);
                    // Ruined pillar
                    for (let h = 0; h < 2 + Math.random() * 4; h++) {
                        this.setBlock(rx, ry + h, rz, BLOCKS.MOSSY_STONE);
                    }
                }
            }
        }
    }
    
    generateForest() {
        // Various forest patches
        const forests = [
            { x: this.width * 0.2, z: this.depth * 0.3, r: 40, type: 'oak' },
            { x: this.width * 0.7, z: this.depth * 0.4, r: 35, type: 'birch' },
            { x: this.width * 0.3, z: this.depth * 0.7, r: 50, type: 'pine' },
            { x: this.width * 0.8, z: this.depth * 0.8, r: 30, type: 'mixed' }
        ];
        
        for (const forest of forests) {
            const numTrees = Math.floor(forest.r * 1.5);
            for (let i = 0; i < numTrees; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * forest.r;
                const tx = Math.floor(forest.x + Math.cos(angle) * dist);
                const tz = Math.floor(forest.z + Math.sin(angle) * dist);
                const ty = this.findGroundHeight(tx, tz);
                
                if (ty > 30 && ty < 70 && this.getBlock(tx, ty, tz) === BLOCKS.GRASS) {
                    this.buildTree(tx, ty + 1, tz, forest.type);
                }
            }
        }
    }
    
    buildTree(x, y, z, type) {
        const height = 4 + Math.floor(Math.random() * 4);
        const leafRadius = type === 'birch' ? 2 : type === 'pine' ? 3 : 3;
        
        // Trunk
        const woodType = type === 'birch' ? BLOCKS.WOOD_BIRCH : 
                       type === 'pine' ? BLOCKS.WOOD_DARK : BLOCKS.WOOD_OAK;
        const leafType = type === 'birch' ? BLOCKS.LEAVES_BIRCH : 
                        type === 'pine' ? BLOCKS.LEAVES_PINE : BLOCKS.LEAVES_OAK;
        
        for (let h = 0; h < height; h++) {
            this.setBlock(x, y + h, z, woodType);
        }
        
        // Leaves
        if (type === 'pine') {
            // Pine shape
            for (let ly = height - 2; ly < height + 2; ly++) {
                const r = 4 - (ly - height + 2);
                for (let lx = -r; lx <= r; lx++) {
                    for (let lz = -r; lz <= r; lz++) {
                        if (Math.abs(lx) + Math.abs(lz) <= r + 0.5) {
                            this.setBlock(x + lx, y + ly, z + lz, leafType);
                        }
                    }
                }
            }
        } else {
            // Round canopy
            for (let ly = height - 2; ly < height + 2; ly++) {
                for (let lx = -leafRadius; lx <= leafRadius; lx++) {
                    for (let lz = -leafRadius; lz <= leafRadius; lz++) {
                        const dist = Math.sqrt(lx * lx + ly * ly * 0.5 + lz * lz);
                        if (dist <= leafRadius + 0.5) {
                            this.setBlock(x + lx, y + ly, z + lz, leafType);
                        }
                    }
                }
            }
        }
    }
    
    generateDetails() {
        // Caves
        for (let i = 0; i < 10; i++) {
            let cx = Math.floor(Math.random() * this.width);
            let cz = Math.floor(Math.random() * this.depth);
            let cy = 20 + Math.floor(Math.random() * 20);
            
            // Dig cave
            for (let step = 0; step < 50; step++) {
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dy = -2; dy <= 2; dy++) {
                        for (let dz = -2; dz <= 2; dz++) {
                            if (dx * dx + dy * dy + dz * dz <= 4) {
                                this.setBlock(cx + dx, cy + dy, cz + dz, BLOCKS.AIR);
                            }
                        }
                    }
                }
                // Random walk
                cx += Math.floor((Math.random() - 0.5) * 3);
                cy += Math.floor((Math.random() - 0.5) * 2);
                cz += Math.floor((Math.random() - 0.5) * 3);
            }
        }
        
        // Ores in caves
        for (let x = 0; x < this.width; x += 2) {
            for (let y = 5; y < 40; y += 2) {
                for (let z = 0; z < this.depth; z += 2) {
                    if (this.getBlock(x, y, z) === BLOCKS.STONE && Math.random() < 0.02) {
                        const ores = [BLOCKS.COAL_ORE, BLOCKS.IRON_ORE, BLOCKS.GOLD_ORE, 
                                     BLOCKS.DIAMOND_ORE, BLOCKS.REDSTONE_ORE, BLOCKS.LAPIS_ORE];
                        this.setBlock(x, y, z, ores[Math.floor(Math.random() * ores.length)]);
                    }
                }
            }
        }
        
        // Lookout posts
        const posts = [
            [this.width * 0.1, this.depth * 0.1],
            [this.width * 0.9, this.depth * 0.1],
            [this.width * 0.1, this.depth * 0.9],
            [this.width * 0.9, this.depth * 0.9]
        ];
        for (const [px, pz] of posts) {
            const py = this.findGroundHeight(Math.floor(px), Math.floor(pz));
            this.buildLookout(Math.floor(px), py + 1, Math.floor(pz));
        }
        
        // Hidden paths
        for (let i = 0; i < 5; i++) {
            const startX = Math.floor(Math.random() * this.width);
            const startZ = Math.floor(Math.random() * this.depth);
            let cx = startX, cz = startZ;
            
            for (let step = 0; step < 100; step++) {
                const cy = this.findGroundHeight(cx, cz);
                if (cy > 0 && this.getBlock(cx, cy, cz) === BLOCKS.GRASS) {
                    this.setBlock(cx, cy, cz, BLOCKS.GRAVEL);
                }
                cx += Math.floor((Math.random() - 0.5) * 3);
                cz += Math.floor((Math.random() - 0.5) * 3);
            }
        }
        
        // Waterfalls
        for (let i = 0; i < 5; i++) {
            const wx = Math.floor(Math.random() * this.width);
            const wz = Math.floor(Math.random() * this.depth);
            let wy = 70;
            
            while (wy > 20 && this.getBlock(wx, wy, wz) === BLOCKS.AIR) {
                this.setBlock(wx, wy, wz, BLOCKS.WATER);
                wy--;
            }
        }
        
        // Reeds by water
        for (let x = 0; x < this.width; x++) {
            for (let z = 0; z < this.depth; z++) {
                if (this.getBlock(x, 32, z) === BLOCKS.WATER) {
                    if (Math.random() < 0.1) {
                        const hy = this.findGroundHeight(x, z);
                        for (let h = 0; h < 2 + Math.random() * 2; h++) {
                            this.setBlock(x, hy + h, z, BLOCKS.REEDS);
                        }
                    }
                }
            }
        }
        
        // Mist/fog effect blocks at low areas
        for (let x = 0; x < this.width; x += 4) {
            for (let z = 0; z < this.depth; z += 4) {
                const y = this.findGroundHeight(x, z);
                if (y < 35 && Math.random() < 0.3) {
                    // Use snow blocks for mist (will be rendered specially)
                    this.setBlock(x, y + 3, z, BLOCKS.SNOW);
                }
            }
        }
    }
    
    buildLookout(x, y, z) {
        const height = 12;
        
        // Tower
        for (let ly = 0; ly < height; ly++) {
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    if (Math.abs(lx) === 2 || Math.abs(lz) === 2) {
                        this.setBlock(x + lx, y + ly, z + lz, BLOCKS.COBBLESTONE);
                    }
                }
            }
        }
        
        // Platform
        for (let lx = -3; lx <= 3; lx++) {
            for (let lz = -3; lz <= 3; lz++) {
                this.setBlock(x + lx, y + height, z + lz, BLOCKS.PLANKS_OAK);
            }
        }
        
        // Roof
        for (let lx = -2; lx <= 2; lx++) {
            for (let lz = -2; lz <= 2; lz++) {
                this.setBlock(x + lx, y + height + 3, z + lz, BLOCKS.PLANKS_DARK);
            }
        }
        
        // Beacon fire
        this.setBlock(x, y + height + 1, z, BLOCKS.CAMPFIRE);
    }
    
    findGroundHeight(x, z) {
        for (let y = this.height - 1; y >= 0; y--) {
            const block = this.getBlock(x, y, z);
            if (block !== BLOCKS.AIR && !getBlockProps(block).liquid) {
                return y;
            }
        }
        return -1;
    }
}

// ============================================
// CHUNK MESHING
// ============================================

class ChunkMesher {
    constructor() {
        this.vertices = [];
        this.indices = [];
        this.colors = [];
        this.emissive = [];
        this.indexOffset = 0;
    }
    
    clear() {
        this.vertices = [];
        this.indices = [];
        this.colors = [];
        this.emissive = [];
        this.indexOffset = 0;
    }
    
    addFace(x, y, z, face, color, emissiveVal, blockId) {
        const props = getBlockProps(blockId);
        const isLiquid = props.liquid;
        const size = isLiquid ? 0.9 : 1.0;
        const offset = isLiquid ? 0.05 : 0;
        
        let verts, norm;
        
        switch(face) {
            case 0: // Top
                verts = [
                    x + offset, y + size, z + offset,
                    x + size, y + size, z + offset,
                    x + size, y + size, z + size,
                    x + offset, y + size, z + size
                ];
                norm = [0, 1, 0];
                break;
            case 1: // Bottom
                verts = [
                    x + offset, y, z + size,
                    x + size, y, z + size,
                    x + size, y, z + offset,
                    x + offset, y, z + offset
                ];
                norm = [0, -1, 0];
                break;
            case 2: // Front (Z+)
                verts = [
                    x + offset, y, z + size,
                    x + size, y, z + size,
                    x + size, y + size, z + size,
                    x + offset, y + size, z + size
                ];
                norm = [0, 0, 1];
                break;
            case 3: // Back (Z-)
                verts = [
                    x + size, y, z + offset,
                    x + offset, y, z + offset,
                    x + offset, y + size, z + offset,
                    x + size, y + size, z + offset
                ];
                norm = [0, 0, -1];
                break;
            case 4: // Right (X+)
                verts = [
                    x + size, y, z + size,
                    x + size, y, z + offset,
                    x + size, y + size, z + offset,
                    x + size, y + size, z + size
                ];
                norm = [1, 0, 0];
                break;
            case 5: // Left (X-)
                verts = [
                    x + offset, y, z + offset,
                    x + offset, y, z + size,
                    x + offset, y + size, z + size,
                    x + offset, y + size, z + offset
                ];
                norm = [-1, 0, 0];
                break;
        }
        
        // Add vertices with normals
        for (let i = 0; i < 4; i++) {
            this.vertices.push(
                verts[i * 3], verts[i * 3 + 1], verts[i * 3 + 2],
                norm[0], norm[1], norm[2]
            );
            
            // Color variation
            const variation = 0.9 + Math.random() * 0.2;
            this.colors.push(
                Math.min(255, Math.floor(color[0] * variation)),
                Math.min(255, Math.floor(color[1] * variation)),
                Math.min(255, Math.floor(color[2] * variation)),
                props.transparent ? 200 : 255
            );
            
            this.emissive.push(emissiveVal);
        }
        
        // Two triangles
        this.indices.push(
            this.indexOffset, this.indexOffset + 1, this.indexOffset + 2,
            this.indexOffset, this.indexOffset + 2, this.indexOffset + 3
        );
        
        this.indexOffset += 4;
    }
    
    meshChunk(world, cx, cz) {
        this.clear();
        
        const startX = cx * CHUNK_SIZE;
        const startZ = cz * CHUNK_SIZE;
        
        for (let x = 0; x < CHUNK_SIZE; x++) {
            for (let z = 0; z < CHUNK_SIZE; z++) {
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    const wx = startX + x;
                    const wz = startZ + z;
                    const block = world.getBlock(wx, y, wz);
                    
                    if (block === BLOCKS.AIR) continue;
                    
                    const props = getBlockProps(block);
                    const color = getBlockColor(block);
                    const emissive = props.emissive || 0;
                    
                    // Check each face for culling
                    const neighbors = [
                        world.getBlock(wx, y + 1, wz),
                        world.getBlock(wx, y - 1, wz),
                        world.getBlock(wx, y, wz + 1),
                        world.getBlock(wx, y, wz - 1),
                        world.getBlock(wx + 1, y, wz),
                        world.getBlock(wx - 1, y, wz)
                    ];
                    
                    for (let f = 0; f < 6; f++) {
                        const neighbor = neighbors[f];
                        const nProps = getBlockProps(neighbor);
                        
                        // Face culling logic
                        let drawFace = false;
                        if (neighbor === BLOCKS.AIR) {
                            drawFace = true;
                        } else if (props.transparent && !nProps.transparent) {
                            drawFace = true;
                        } else if (!props.transparent && nProps.transparent) {
                            drawFace = true;
                        } else if (props.liquid && !nProps.liquid) {
                            drawFace = true;
                        }
                        
                        // Don't draw faces between solid blocks
                        if (!props.transparent && !nProps.transparent && !nProps.liquid) {
                            drawFace = false;
                        }
                        
                        if (drawFace) {
                            this.addFace(x, y, z, f, color, emissive, block);
                        }
                    }
                }
            }
        }
        
        return {
            vertices: new Float32Array(this.vertices),
            indices: new Uint32Array(this.indices),
            colors: new Uint8Array(this.colors),
            emissive: new Float32Array(this.emissive),
            vertexCount: this.indices.length
        };
    }
}

// ============================================
// WEBGPU RENDERER
// ============================================

class WebGPURenderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.device = null;
        this.context = null;
        this.renderPipeline = null;
        this.depthTexture = null;
        this.uniformBuffer = null;
        this.bindGroup = null;
        this.chunks = new Map();
        this.chunkMeshes = new Map();
        this.camera = {
            pos: new Vec3(200, 100, 200),
            rot: new Vec3(-0.3, 0, 0),
            fov: Math.PI / 3,
            near: 0.1,
            far: 500
        };
        this.timeOfDay = 'day';
        this.bloomEnabled = true;
        this.orbitMode = false;
        this.orbitAngle = 0;
        this.time = 0;
    }
    
    async init() {
        if (!navigator.gpu) {
            throw new Error('WebGPU not supported');
        }
        
        const adapter = await navigator.gpu.requestAdapter({
            powerPreference: 'high-performance'
        });
        
        if (!adapter) {
            throw new Error('No GPU adapter found');
        }
        
        this.device = await adapter.requestDevice();
        this.context = this.canvas.getContext('webgpu');
        
        const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
        
        this.context.configure({
            device: this.device,
            format: canvasFormat,
            alphaMode: 'premultiplied',
            usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC
        });
        
        await this.createPipelines(canvasFormat);
        this.resize();
        
        window.addEventListener('resize', () => this.resize());
    }
    
    async createPipelines(format) {
        // Vertex shader
        const vertexShader = `
            struct VertexInput {
                @location(0) position: vec3f,
                @location(1) normal: vec3f,
                @location(2) color: vec4f,
                @location(3) emissive: f32,
            }
            
            struct VertexOutput {
                @builtin(position) position: vec4f,
                @location(0) worldPos: vec3f,
                @location(1) normal: vec3f,
                @location(2) color: vec4f,
                @location(3) emissive: f32,
            }
            
            struct Uniforms {
                viewProj: mat4x4f,
                sunDir: vec3f,
                sunColor: vec3f,
                ambient: f32,
                time: f32,
                fogColor: vec3f,
                fogDensity: f32,
            }
            
            @binding(0) @group(0) var<uniform> uniforms: Uniforms;
            
            @vertex
            fn vs_main(input: VertexInput) -> VertexOutput {
                var output: VertexOutput;
                output.position = uniforms.viewProj * vec4f(input.position, 1.0);
                output.worldPos = input.position;
                output.normal = input.normal;
                output.color = input.color;
                output.emissive = input.emissive;
                return output;
            }
        `;
        
        // Fragment shader with lighting, fog, and emissive effects
        const fragmentShader = `
            struct VertexOutput {
                @builtin(position) position: vec4f,
                @location(0) worldPos: vec3f,
                @location(1) normal: vec3f,
                @location(2) color: vec4f,
                @location(3) emissive: f32,
            }
            
            struct Uniforms {
                viewProj: mat4x4f,
                sunDir: vec3f,
                sunColor: vec3f,
                ambient: f32,
                time: f32,
                fogColor: vec3f,
                fogDensity: f32,
            }
            
            @binding(0) @group(0) var<uniform> uniforms: Uniforms;
            
            @fragment
            fn fs_main(input: VertexOutput) -> @location(0) vec4f {
                // Normalize normal
                let N = normalize(input.normal);
                
                // Sun lighting
                let L = normalize(-uniforms.sunDir);
                let lambert = max(dot(N, L), 0.0);
                
                // Ambient + diffuse
                let litColor = input.color.rgb * (uniforms.ambient + lambert * uniforms.sunColor * (1.0 - uniforms.ambient));
                
                // Emissive glow
                let emissive = input.emissive * input.color.rgb * 2.0;
                
                // Flicker effect for fire
                var flicker = 1.0;
                if (input.emissive > 0.8) {
                    flicker = 0.8 + 0.2 * sin(uniforms.time * 10.0 + input.worldPos.x * 3.0);
                }
                
                let finalColor = litColor + emissive * flicker;
                
                // Fog
                let dist = length(input.worldPos);
                let fogFactor = exp(-uniforms.fogDensity * uniforms.fogDensity * dist * dist);
                let foggedColor = mix(uniforms.fogColor, finalColor, clamp(fogFactor, 0.0, 1.0));
                
                // Tone mapping (ACES approximation)
                let mapped = foggedColor / (foggedColor + vec3f(1.0));
                mapped = pow(mapped, vec3f(1.0 / 2.2)); // Gamma correction
                
                // Vignette
                let uv = input.position.xy / vec2f(1920.0, 1080.0); // Approximate
                let vignette = 1.0 - length(uv - 0.5) * 0.5;
                
                return vec4f(mapped * vignette, input.color.a / 255.0);
            }
        `;
        
        // Compile shaders
        const vertexModule = this.device.createShaderModule({ code: vertexShader });
        const fragmentModule = this.device.createShaderModule({ code: fragmentShader });
        
        // Vertex buffer layout
        const vertexLayout = {
            arrayStride: 32, // 3 pos + 3 normal + 4 color + 1 emissive (padded)
            attributes: [
                { shaderLocation: 0, offset: 0, format: 'float32x3' },  // position
                { shaderLocation: 1, offset: 12, format: 'float32x3' }, // normal
                { shaderLocation: 2, offset: 24, format: 'uint8x4', normalized: true }, // color
                { shaderLocation: 3, offset: 28, format: 'float32' }   // emissive
            ]
        };
        
        // Create pipeline
        this.renderPipeline = this.device.createRenderPipeline({
            layout: 'auto',
            vertex: {
                module: vertexModule,
                entryPoint: 'vs_main',
                buffers: [vertexLayout]
            },
            fragment: {
                module: fragmentModule,
                entryPoint: 'fs_main',
                targets: [{ format, blend: {
                    color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                    alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
                }}]
            },
            primitive: {
                topology: 'triangle-list',
                cullMode: 'back'
            },
            depthStencil: {
                depthWriteEnabled: true,
                depthCompare: 'less',
                format: 'depth24plus'
            }
        });
        
        // Uniform buffer
        this.uniformBuffer = this.device.createBuffer({
            size: 256,
            usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
        });
        
        this.bindGroup = this.device.createBindGroup({
            layout: this.renderPipeline.getBindGroupLayout(0),
            entries: [{
                binding: 0,
                resource: { buffer: this.uniformBuffer }
            }]
        });
    }
    
    resize() {
        const width = this.canvas.clientWidth;
        const height = this.canvas.clientHeight;
        this.canvas.width = width;
        this.canvas.height = height;
        
        if (this.depthTexture) {
            this.depthTexture.destroy();
        }
        
        this.depthTexture = this.device.createTexture({
            size: [width, height],
            format: 'depth24plus',
            usage: GPUTextureUsage.RENDER_ATTACHMENT
        });
        
        this.camera.aspect = width / height;
    }
    
    updateUniforms() {
        const time = performance.now() / 1000;
        this.time = time;
        
        // Camera matrix
        const view = new Mat4();
        const proj = new Mat4();
        
        if (this.orbitMode) {
            this.orbitAngle += 0.005;
            const radius = 150;
            this.camera.pos.x = 200 + Math.cos(this.orbitAngle) * radius;
            this.camera.pos.z = 150 + Math.sin(this.orbitAngle) * radius;
            this.camera.pos.y = 100;
            view.lookAt(this.camera.pos, new Vec3(200, 50, 150), new Vec3(0, 1, 0));
        } else {
            const center = new Vec3(
                this.camera.pos.x + Math.cos(this.camera.rot.y) * Math.cos(this.camera.rot.x),
                this.camera.pos.y + Math.sin(this.camera.rot.x),
                this.camera.pos.z + Math.sin(this.camera.rot.y) * Math.cos(this.camera.rot.x)
            );
            view.lookAt(this.camera.pos, center, new Vec3(0, 1, 0));
        }
        
        proj.perspective(this.camera.fov, this.camera.aspect, this.camera.near, this.camera.far);
        const viewProj = proj.multiply(view);
        
        // Time of day settings
        let sunDir, sunColor, ambient, fogColor, fogDensity;
        
        switch(this.timeOfDay) {
            case 'dawn':
                sunDir = new Vec3(0.3, 0.5, -0.8);
                sunColor = new Vec3(1.0, 0.6, 0.4);
                ambient = 0.3;
                fogColor = new Vec3(0.8, 0.6, 0.5);
                fogDensity = 0.008;
                break;
            case 'day':
                sunDir = new Vec3(0.2, 0.9, -0.4);
                sunColor = new Vec3(1.0, 0.95, 0.8);
                ambient = 0.25;
                fogColor = new Vec3(0.7, 0.8, 0.9);
                fogDensity = 0.005;
                break;
            case 'dusk':
                sunDir = new Vec3(-0.3, 0.4, -0.9);
                sunColor = new Vec3(1.0, 0.5, 0.3);
                ambient = 0.2;
                fogColor = new Vec3(0.6, 0.4, 0.3);
                fogDensity = 0.012;
                break;
            case 'night':
                sunDir = new Vec3(-0.2, -0.5, -0.8);
                sunColor = new Vec3(0.2, 0.3, 0.5);
                ambient = 0.08;
                fogColor = new Vec3(0.05, 0.05, 0.1);
                fogDensity = 0.015;
                break;
        }
        
        // Write uniforms
        const uniformData = new Float32Array(64);
        uniformData.set(viewProj.m, 0);
        uniformData.set(sunDir.normalize().toArray(), 16);
        uniformData.set(sunColor.toArray(), 20);
        uniformData[23] = ambient;
        uniformData[24] = time;
        uniformData.set(fogColor.toArray(), 28);
        uniformData[31] = fogDensity;
        
        this.device.queue.writeBuffer(this.uniformBuffer, 0, uniformData);
    }
    
    render() {
        const commandEncoder = this.device.createCommandEncoder();
        const textureView = this.context.getCurrentTexture().createView();
        
        const renderPass = commandEncoder.beginRenderPass({
            colorAttachments: [{
                view: textureView,
                clearValue: { r: 0.05, g: 0.05, b: 0.1, a: 1 },
                loadOp: 'clear',
                storeOp: 'store'
            }],
            depthStencilAttachment: {
                view: this.depthTexture.createView(),
                depthClearValue: 1,
                depthLoadOp: 'clear',
                depthStoreOp: 'store'
            }
        });
        
        renderPass.setPipeline(this.renderPipeline);
        renderPass.setBindGroup(0, this.bindGroup);
        
        // Render chunks
        for (const [key, mesh] of this.chunkMeshes) {
            if (!mesh.vertexBuffer) continue;
            
            renderPass.setVertexBuffer(0, mesh.vertexBuffer);
            renderPass.setIndexBuffer(mesh.indexBuffer, 'uint32');
            renderPass.drawIndexed(mesh.indexCount);
        }
        
        renderPass.end();
        this.device.queue.submit([commandEncoder.finish()]);
    }
    
    updateChunks(world, cameraChunkX, cameraChunkZ) {
        const mesher = new ChunkMesher();
        const renderDist = RENDER_DISTANCE;
        
        for (let cx = cameraChunkX - renderDist; cx <= cameraChunkX + renderDist; cx++) {
            for (let cz = cameraChunkZ - renderDist; cz <= cameraChunkZ + renderDist; cz++) {
                const key = `${cx},${cz}`;
                
                if (!this.chunkMeshes.has(key)) {
                    const meshData = mesher.meshChunk(world, cx, cz);
                    
                    if (meshData.vertexCount > 0) {
                        // Create interleaved vertex buffer
                        const vertexData = new ArrayBuffer(meshData.vertices.length / 6 * 32);
                        const floatView = new Float32Array(vertexData);
                        const byteView = new Uint8Array(vertexData);
                        
                        for (let i = 0; i < meshData.vertices.length / 6; i++) {
                            // Position (3 floats)
                            floatView[i * 8 + 0] = meshData.vertices[i * 6 + 0];
                            floatView[i * 8 + 1] = meshData.vertices[i * 6 + 1];
                            floatView[i * 8 + 2] = meshData.vertices[i * 6 + 2];
                            // Normal (3 floats)
                            floatView[i * 8 + 3] = meshData.vertices[i * 6 + 3];
                            floatView[i * 8 + 4] = meshData.vertices[i * 6 + 4];
                            floatView[i * 8 + 5] = meshData.vertices[i * 6 + 5];
                            // Color (4 bytes)
                            byteView[i * 32 + 24] = meshData.colors[i * 4 + 0];
                            byteView[i * 32 + 25] = meshData.colors[i * 4 + 1];
                            byteView[i * 32 + 26] = meshData.colors[i * 4 + 2];
                            byteView[i * 32 + 27] = meshData.colors[i * 4 + 3];
                            // Emissive (1 float)
                            floatView[i * 8 + 7] = meshData.emissive[i];
                        }
                        
                        const vertexBuffer = this.device.createBuffer({
                            size: vertexData.byteLength,
                            usage: GPUBufferUsage.VERTEX,
                            mappedAtCreation: true
                        });
                        new Uint8Array(vertexBuffer.getMappedRange()).set(new Uint8Array(vertexData));
                        vertexBuffer.unmap();
                        
                        const indexBuffer = this.device.createBuffer({
                            size: meshData.indices.byteLength,
                            usage: GPUBufferUsage.INDEX,
                            mappedAtCreation: true
                        });
                        new Uint32Array(indexBuffer.getMappedRange()).set(meshData.indices);
                        indexBuffer.unmap();
                        
                        this.chunkMeshes.set(key, {
                            vertexBuffer,
                            indexBuffer,
                            indexCount: meshData.indexCount
                        });
                    }
                }
            }
        }
        
        // Cleanup distant chunks
        for (const [key, mesh] of this.chunkMeshes) {
            const [cx, cz] = key.split(',').map(Number);
            if (Math.abs(cx - cameraChunkX) > renderDist + 2 || 
                Math.abs(cz - cameraChunkZ) > renderDist + 2) {
                if (mesh.vertexBuffer) mesh.vertexBuffer.destroy();
                if (mesh.indexBuffer) mesh.indexBuffer.destroy();
                this.chunkMeshes.delete(key);
            }
        }
    }
}

// ============================================
// INPUT HANDLING
// ============================================

class InputHandler {
    constructor(renderer) {
        this.renderer = renderer;
        this.keys = {};
        this.mouse = { x: 0, y: 0, dx: 0, dy: 0, down: false };
        this.speed = 0.5;
        this.fastSpeed = 2.0;
        
        this.setupEvents();
    }
    
    setupEvents() {
        document.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
            if (e.code === 'KeyO') toggleOrbit();
            if (e.code === 'KeyP') takeScreenshot();
        });
        
        document.addEventListener('keyup', (e) => {
            this.keys[e.code] = false;
        });
        
        this.renderer.canvas.addEventListener('mousedown', (e) => {
            this.mouse.down = true;
            this.mouse.x = e.clientX;
            this.mouse.y = e.clientY;
            this.renderer.canvas.requestPointerLock();
        });
        
        document.addEventListener('mouseup', () => {
            this.mouse.down = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === this.renderer.canvas) {
                this.renderer.camera.rot.y += e.movementX * 0.002;
                this.renderer.camera.rot.x -= e.movementY * 0.002;
                this.renderer.camera.rot.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, this.renderer.camera.rot.x));
            }
        });
        
        // Touch support
        let touchStart = null;
        this.renderer.canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        
        this.renderer.canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && touchStart) {
                const dx = e.touches[0].clientX - touchStart.x;
                const dy = e.touches[0].clientY - touchStart.y;
                this.renderer.camera.rot.y += dx * 0.005;
                this.renderer.camera.rot.x -= dy * 0.005;
                touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
    }
    
    update() {
        if (this.renderer.orbitMode) return;
        
        const moveSpeed = this.keys['ShiftLeft'] || this.keys['ShiftRight'] ? this.fastSpeed : this.speed;
        
        const forward = new Vec3(
            Math.cos(this.renderer.camera.rot.y) * Math.cos(this.renderer.camera.rot.x),
            0,
            Math.sin(this.renderer.camera.rot.y) * Math.cos(this.renderer.camera.rot.x)
        );
        
        const right = new Vec3(
            Math.cos(this.renderer.camera.rot.y + Math.PI/2),
            0,
            Math.sin(this.renderer.camera.rot.y + Math.PI/2)
        );
        
        let move = new Vec3(0, 0, 0);
        
        if (this.keys['KeyW']) move = move.add(forward);
        if (this.keys['KeyS']) move = move.sub(forward);
        if (this.keys['KeyA']) move = move.sub(right);
        if (this.keys['KeyD']) move = move.add(right);
        if (this.keys['Space']) move.y += 1;
        if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) move.y -= 1;
        
        if (move.x !== 0 || move.y !== 0 || move.z !== 0) {
            move = move.normalize().mul(moveSpeed);
            this.renderer.camera.pos = this.renderer.camera.pos.add(move);
        }
    }
}

// MAIN APPLICATION
// ============================================

let renderer, input, world;
let lastTime = 0;
let frameCount = 0;
let fpsElement = document.getElementById('fps');

async function init() {
    try {
        updateLoading(10, 'Creating voxel world...');
        
        // Create world
        world = new VoxelWorld(400, WORLD_HEIGHT, 400);
        world.generateTerrain();
        
        updateLoading(50, 'Initializing WebGPU...');
        
        // Setup renderer
        const canvas = document.getElementById('canvas');
        renderer = new WebGPURenderer(canvas);
        await renderer.init();
        
        updateLoading(70, 'Building chunk meshes...');
        
        // Initial chunk generation
        renderer.updateChunks(world, 6, 6);
        
        updateLoading(90, 'Setting up controls...');
        
        // Setup input
        input = new InputHandler(renderer);
        
        // Set initial camera for dramatic view
        renderer.camera.pos = new Vec3(200, 120, 50);
        renderer.camera.rot.x = -0.4;
        renderer.camera.rot.y = 0;
        
        updateLoading(100, 'Ready!');
        
        setTimeout(() => {
            document.getElementById('loading').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        }, 500);
        
        requestAnimationFrame(loop);
        
    } catch (error) {
        console.error('Initialization failed:', error);
        document.getElementById('loading-text').textContent = 'Error: ' + error.message;
        document.getElementById('loading-fill').style.width = '100%';
        document.getElementById('loading-fill').style.background = '#c00';
    }
}

function updateLoading(percent, text) {
    document.getElementById('loading-fill').style.width = percent + '%';
    document.getElementById('loading-text').textContent = text;
}

function loop(currentTime) {
    const deltaTime = currentTime - lastTime;
    lastTime = currentTime;
    
    // FPS counter
    frameCount++;
    if (frameCount % 30 === 0) {
        fpsElement.textContent = `FPS: ${Math.round(1000 / deltaTime)}`;
    }
    
    // Update
    input.update();
    
    // Update chunks based on camera position
    const cx = Math.floor(renderer.camera.pos.x / CHUNK_SIZE);
    const cz = Math.floor(renderer.camera.pos.z / CHUNK_SIZE);
    renderer.updateChunks(world, cx, cz);
    
    renderer.updateUniforms();
    renderer.render();
    
    requestAnimationFrame(loop);
}

// UI Functions
function setTimeOfDay(time) {
    renderer.timeOfDay = time;
    document.querySelectorAll('#controls button').forEach(btn => {
        if (btn.textContent.toLowerCase().includes(time)) {
            btn.classList.add('active');
        } else if (btn.textContent.includes('Dawn') || 
                   btn.textContent.includes('Day') || 
                   btn.textContent.includes('Dusk') || 
                   btn.textContent.includes('Night')) {
            btn.classList.remove('active');
        }
    });
}

function toggleOrbit() {
    renderer.orbitMode = !renderer.orbitMode;
    document.getElementById('orbit-btn').classList.toggle('active', renderer.orbitMode);
}

function toggleBloom() {
    renderer.bloomEnabled = !renderer.bloomEnabled;
}

function takeScreenshot() {
    const flash = document.getElementById('screenshot-flash');
    flash.style.opacity = '1';
    setTimeout(() => {
        flash.style.opacity = '0';
    }, 100);
    
    // Create download link
    const canvas = document.getElementById('canvas');
    const link = document.createElement('a');
    link.download = `voxel-world-${Date.now()}.png`;
    link.href = canvas.toDataURL();
    link.click();
}

// Start
init();
</script>
