<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medieval Fantasy Voxel World - WebGPU</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; }
        #ui {
            position: fixed; top: 20px; left: 20px; z-index: 100;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px;
            color: #fff; font-size: 13px; backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #ui h3 { margin-bottom: 10px; color: #ffd700; font-size: 14px; }
        .btn-group { display: flex; gap: 5px; margin: 8px 0; }
        .btn {
            padding: 6px 12px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: #fff; cursor: pointer;
            border-radius: 5px; font-size: 11px; transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.25); }
        .btn.active { background: rgba(255,215,0,0.4); border-color: #ffd700; }
        #controls { position: fixed; bottom: 20px; left: 20px; color: rgba(255,255,255,0.6); font-size: 11px; z-index: 100; }
        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffd700; font-size: 24px; z-index: 1000; text-align: center;
        }
        #loading .spinner { 
            width: 40px; height: 40px; border: 3px solid rgba(255,215,0,0.3);
            border-top-color: #ffd700; border-radius: 50%; margin: 20px auto;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .checkbox-label { display: flex; align-items: center; gap: 5px; margin: 3px 0; cursor: pointer; }
        .checkbox-label input { cursor: pointer; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        Building Medieval World...
    </div>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <h3>⚔️ Medieval Fantasy World</h3>
        <div class="btn-group">
            <button class="btn" id="btnDawn">🌅 Dawn</button>
            <button class="btn active" id="btnDay">☀️ Day</button>
            <button class="btn" id="btnDusk">🌆 Dusk</button>
            <button class="btn" id="btnNight">🌙 Night</button>
        </div>
        <div class="btn-group">
            <button class="btn" id="btnCinematic">🎬 Cinematic</button>
            <button class="btn" id="btnScreenshot">📸 Screenshot</button>
            <button class="btn" id="btnReset">🏰 Reset View</button>
        </div>
        <label class="checkbox-label"><input type="checkbox" id="cbBloom" checked> Bloom Effect</label>
        <label class="checkbox-label"><input type="checkbox" id="cbVignette" checked> Vignette</label>
        <label class="checkbox-label"><input type="checkbox" id="cbFog" checked> Fog</label>
        <label class="checkbox-label"><input type="checkbox" id="cbShadows" checked> Shadows</label>
        <label class="checkbox-label"><input type="checkbox" id="cbWater" checked> Animated Water</label>
    </div>
    <div id="controls">
        WASD - Move | Space/Shift - Up/Down | Mouse - Look | F - Toggle Fly | C - Cinematic | S - Screenshot
    </div>

    <script type="module">
// WebGPU Medieval Fantasy Voxel World
// Complete self-contained implementation

const canvas = document.getElementById('canvas');
const loading = document.getElementById('loading');

// World configuration
const CHUNK_SIZE = 16;
const WORLD_CHUNKS_X = 10;
const WORLD_CHUNKS_Z = 10;
const WORLD_HEIGHT = 80;
const WORLD_SIZE_X = CHUNK_SIZE * WORLD_CHUNKS_X;
const WORLD_SIZE_Z = CHUNK_SIZE * WORLD_CHUNKS_Z;
const WATER_LEVEL = 28;

// Block types
const BLOCK = {
    AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, WATER: 4, SAND: 5,
    WOOD: 6, LEAVES: 7, COBBLESTONE: 8, PLANKS: 9, BRICK: 10,
    ROOF_TILE: 11, SNOW: 12, LAVA: 13, BASALT: 14, GLASS: 15,
    TORCH: 16, IRON: 17, GOLD: 18, GRAVEL: 19, COAL_ORE: 20,
    MOSSY_STONE: 21, FLOWER_RED: 22, FLOWER_YELLOW: 23, WHEAT: 24,
    HAY: 25, FENCE: 26, DOOR: 27, WINDOW: 28, BOOKSHELF: 29,
    DARK_WOOD: 30, LIGHT_WOOD: 31, PURPLE_STONE: 32, ASH: 33
};

// Block colors (RGB)
const BLOCK_COLORS = {
    [BLOCK.AIR]: [0, 0, 0],
    [BLOCK.GRASS]: [0.35, 0.65, 0.2],
    [BLOCK.DIRT]: [0.55, 0.35, 0.2],
    [BLOCK.STONE]: [0.5, 0.5, 0.52],
    [BLOCK.WATER]: [0.15, 0.35, 0.7],
    [BLOCK.SAND]: [0.85, 0.8, 0.55],
    [BLOCK.WOOD]: [0.45, 0.3, 0.15],
    [BLOCK.LEAVES]: [0.2, 0.55, 0.15],
    [BLOCK.COBBLESTONE]: [0.45, 0.44, 0.46],
    [BLOCK.PLANKS]: [0.65, 0.45, 0.2],
    [BLOCK.BRICK]: [0.7, 0.35, 0.25],
    [BLOCK.ROOF_TILE]: [0.55, 0.2, 0.15],
    [BLOCK.SNOW]: [0.95, 0.95, 0.97],
    [BLOCK.LAVA]: [1.0, 0.4, 0.1],
    [BLOCK.BASALT]: [0.25, 0.25, 0.27],
    [BLOCK.GLASS]: [0.7, 0.85, 0.95],
    [BLOCK.TORCH]: [1.0, 0.8, 0.2],
    [BLOCK.IRON]: [0.6, 0.6, 0.65],
    [BLOCK.GOLD]: [0.9, 0.8, 0.2],
    [BLOCK.GRAVEL]: [0.55, 0.52, 0.5],
    [BLOCK.COAL_ORE]: [0.3, 0.3, 0.3],
    [BLOCK.MOSSY_STONE]: [0.4, 0.5, 0.38],
    [BLOCK.FLOWER_RED]: [0.9, 0.15, 0.15],
    [BLOCK.FLOWER_YELLOW]: [0.95, 0.9, 0.2],
    [BLOCK.WHEAT]: [0.85, 0.75, 0.3],
    [BLOCK.HAY]: [0.9, 0.8, 0.3],
    [BLOCK.FENCE]: [0.5, 0.35, 0.15],
    [BLOCK.DOOR]: [0.5, 0.3, 0.12],
    [BLOCK.WINDOW]: [0.7, 0.85, 1.0],
    [BLOCK.BOOKSHELF]: [0.5, 0.35, 0.2],
    [BLOCK.DARK_WOOD]: [0.3, 0.2, 0.1],
    [BLOCK.LIGHT_WOOD]: [0.75, 0.55, 0.3],
    [BLOCK.PURPLE_STONE]: [0.4, 0.3, 0.5],
    [BLOCK.ASH]: [0.35, 0.32, 0.3],
};

// Block properties
const BLOCK_PROPERTIES = {
    [BLOCK.WATER]: { transparent: true, animated: true },
    [BLOCK.LAVA]: { transparent: false, animated: true, emissive: 1.0 },
    [BLOCK.GLASS]: { transparent: true },
    [BLOCK.TORCH]: { transparent: true, emissive: 0.9 },
    [BLOCK.LEAVES]: { transparent: true },
    [BLOCK.WINDOW]: { transparent: true, emissive: 0.4 },
    [BLOCK.FLOWER_RED]: { transparent: true },
    [BLOCK.FLOWER_YELLOW]: { transparent: true },
    [BLOCK.WHEAT]: { transparent: true },
};

// State
let world = new Uint8Array(WORLD_SIZE_X * WORLD_HEIGHT * WORLD_SIZE_Z);
let flyMode = true;
let cinematicMode = false;
let timeOfDay = 0.4; // 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk
let camera = {
    x: WORLD_SIZE_X / 2, y: 60, z: WORLD_SIZE_Z / 2 + 40,
    pitch: -0.3, yaw: Math.PI * 0.75,
    vx: 0, vy: 0, vz: 0
};
let keys = {};
let mouseDown = false;
let gpuDevice, gpuContext, renderPipeline, depthTexture;
let chunks = [];
let frameCount = 0;

// Initialize WebGPU
async function initWebGPU() {
    if (!navigator.gpu) {
        alert('WebGPU not supported. Please use Chrome 113+ or Edge 113+');
        return false;
    }
    
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
        alert('No GPU adapter found');
        return false;
    }
    
    gpuDevice = await adapter.requestDevice();
    gpuContext = canvas.getContext('webgpu');
    
    const format = navigator.gpu.getPreferredCanvasFormat();
    gpuContext.configure({
        device: gpuDevice,
        format: format,
        alphaMode: 'premultiplied'
    });
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    return true;
}

// World generation
function getBlock(x, y, z) {
    if (x < 0 || x >= WORLD_SIZE_X || y < 0 || y >= WORLD_HEIGHT || z < 0 || z >= WORLD_SIZE_Z) return BLOCK.AIR;
    return world[x + y * WORLD_SIZE_X + z * WORLD_SIZE_X * WORLD_HEIGHT];
}

function setBlock(x, y, z, type) {
    if (x < 0 || x >= WORLD_SIZE_X || y < 0 || y >= WORLD_HEIGHT || z < 0 || z >= WORLD_SIZE_Z) return;
    world[x + y * WORLD_SIZE_X + z * WORLD_SIZE_X * WORLD_HEIGHT] = type;
}

function noise2D(x, z, scale, seed) {
    const n = Math.sin(x * 12.9898 * scale + z * 78.233 * scale + seed) * 43758.5453;
    return n - Math.floor(n);
}

function smoothNoise(x, z, scale, seed) {
    const ix = Math.floor(x * scale);
    const iz = Math.floor(z * scale);
    const fx = (x * scale) - ix;
    const fz = (z * scale) - iz;
    
    const sfx = fx * fx * (3 - 2 * fx);
    const sfz = fz * fz * (3 - 2 * fz);
    
    const n00 = noise2D(ix, iz, 1, seed);
    const n10 = noise2D(ix + 1, iz, 1, seed);
    const n01 = noise2D(ix, iz + 1, 1, seed);
    const n11 = noise2D(ix + 1, iz + 1, 1, seed);
    
    const nx0 = n00 + (n10 - n00) * sfx;
    const nx1 = n01 + (n11 - n01) * sfx;
    
    return nx0 + (nx1 - nx0) * sfz;
}

function getHeight(x, z) {
    let h = 0;
    h += smoothNoise(x, z, 0.01, 1) * 30;
    h += smoothNoise(x, z, 0.03, 2) * 12;
    h += smoothNoise(x, z, 0.08, 3) * 5;
    h += smoothNoise(x, z, 0.15, 4) * 2;
    
    // Create terrain features
    const cx = WORLD_SIZE_X / 2;
    const cz = WORLD_SIZE_Z / 2;
    
    // Castle hill - raised plateau
    const castleDist = Math.sqrt((x - cx) * (x - cx) + (z - cz) * (z - cz));
    if (castleDist < 20) {
        h += (20 - castleDist) * 1.2;
    }
    
    // Mountains in corner
    const mtnDist = Math.sqrt((x - 10) * (x - 10) + (z - 10) * (z - 10));
    if (mtnDist < 30) {
        h += (30 - mtnDist) * 1.5;
    }
    
    // Volcano area
    const volDist = Math.sqrt((x - (WORLD_SIZE_X - 15)) * (x - (WORLD_SIZE_X - 15)) + (z - 15) * (z - 15));
    if (volDist < 18) {
        h += (18 - volDist) * 2.0;
    }
    
    // River valley
    const riverCenter = WORLD_SIZE_Z * 0.65 + Math.sin(x * 0.05) * 8;
    const riverDist = Math.abs(z - riverCenter);
    if (riverDist < 8) {
        h -= (8 - riverDist) * 1.5;
    }
    
    return Math.floor(h + WATER_LEVEL + 2);
}

function generateWorld() {
    console.log('Generating terrain...');
    
    // Base terrain
    for (let x = 0; x < WORLD_SIZE_X; x++) {
        for (let z = 0; z < WORLD_SIZE_Z; z++) {
            const h = getHeight(x, z);
            
            for (let y = 0; y < WORLD_HEIGHT; y++) {
                let block = BLOCK.AIR;
                
                if (y === 0) {
                    block = BLOCK.STONE;
                } else if (y < h - 4) {
                    block = BLOCK.STONE;
                } else if (y < h - 1) {
                    block = BLOCK.DIRT;
                } else if (y === h - 1) {
                    if (y < WATER_LEVEL + 1) {
                        block = BLOCK.SAND;
                    } else if (y > WORLD_HEIGHT - 25) {
                        block = BLOCK.SNOW;
                    } else {
                        block = BLOCK.GRASS;
                    }
                } else if (y < WATER_LEVEL) {
                    block = BLOCK.WATER;
                }
                
                setBlock(x, y, z, block);
            }
            
            // Add ore veins
            if (Math.random() < 0.02) {
                const oreY = Math.floor(Math.random() * (WATER_LEVEL - 5)) + 2;
                const oreType = Math.random() < 0.5 ? BLOCK.COAL_ORE : BLOCK.IRON;
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        if (Math.random() < 0.6) {
                            setBlock(x + dx, oreY, z + dz, oreType);
                        }
                    }
                }
            }
        }
    }
    
    // Generate structures
    generateCastle();
    generateVillage();
    generateForest();
    generateMountains();
    generateVolcano();
    generateRiver();
    generatePaths();
    generateRuins();
    generateCaves();
    
    console.log('World generated!');
}

function generateCastle() {
    const cx = Math.floor(WORLD_SIZE_X / 2);
    const cz = Math.floor(WORLD_SIZE_Z / 2);
    const baseH = getHeight(cx, cz);
    
    // Terraced hill base
    for (let r = 0; r < 18; r++) {
        for (let a = 0; a < 360; a += 5) {
            const rad = a * Math.PI / 180;
            const px = Math.floor(cx + Math.cos(rad) * r);
            const pz = Math.floor(cz + Math.sin(rad) * r);
            const h = baseH - Math.floor(r * 0.5);
            for (let y = WATER_LEVEL; y < h; y++) {
                setBlock(px, y, pz, BLOCK.COBBLESTONE);
            }
        }
    }
    
    // Castle walls
    const wallH = 12;
    const wallT = 3;
    const castleSize = 14;
    
    for (let i = -castleSize; i <= castleSize; i++) {
        for (let j = -castleSize; j <= castleSize; j++) {
            const dist = Math.max(Math.abs(i), Math.abs(j));
            if (dist >= castleSize - wallT && dist <= castleSize) {
                for (let y = baseH; y < baseH + wallH; y++) {
                    setBlock(cx + i, y, cz + j, BLOCK.STONE);
                }
                // Battlements
                if ((Math.abs(i) + Math.abs(j)) % 2 === 0) {
                    setBlock(cx + i, baseH + wallH, cz + j, BLOCK.STONE);
                    setBlock(cx + i, baseH + wallH + 1, cz + j, BLOCK.STONE);
                }
            }
        }
    }
    
    // Gate
    for (let y = baseH; y < baseH + 6; y++) {
        for (let w = -2; w <= 2; w++) {
            setBlock(cx + w, y, cz + castleSize, BLOCK.AIR);
            if (y === baseH + 5) {
                setBlock(cx + w, y, cz + castleSize, BLOCK.DARK_WOOD);
            }
        }
    }
    
    // Towers at corners
    const towerPositions = [
        [-castleSize, -castleSize], [-castleSize, castleSize],
        [castleSize, -castleSize], [castleSize, castleSize]
    ];
    
    towerPositions.forEach(([tx, tz]) => {
        for (let y = baseH; y < baseH + wallH + 6; y++) {
            for (let dx = -2; dx <= 2; dx++) {
                for (let dz = -2; dz <= 2; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) <= 3) {
                        setBlock(cx + tx + dx, y, cz + tz + dz, BLOCK.STONE);
                    }
                }
            }
        }
        // Tower top battlements
        for (let dx = -3; dx <= 3; dx++) {
            for (let dz = -3; dz <= 3; dz++) {
                if ((Math.abs(dx) + Math.abs(dz)) % 2 === 0) {
                    setBlock(cx + tx + dx, baseH + wallH + 6, cz + tz + dz, BLOCK.STONE);
                }
            }
        }
        // Torch on tower
        setBlock(cx + tx, baseH + wallH + 4, cz + tz, BLOCK.TORCH);
    });
    
    // Royal Keep (central building)
    for (let y = baseH; y < baseH + 16; y++) {
        for (let dx = -5; dx <= 5; dx++) {
            for (let dz = -5; dz <= 5; dz++) {
                if (Math.abs(dx) === 5 || Math.abs(dz) === 5 || y === baseH + 15) {
                    setBlock(cx + dx, y, cz + dz, BLOCK.COBBLESTONE);
                }
                if (y === baseH + 16) {
                    setBlock(cx + dx, y, cz + dz, BLOCK.ROOF_TILE);
                }
            }
        }
    }
    // Keep windows (glowing)
    for (let y = baseH + 3; y < baseH + 14; y += 4) {
        setBlock(cx - 5, y, cz - 2, BLOCK.WINDOW);
        setBlock(cx - 5, y, cz + 2, BLOCK.WINDOW);
        setBlock(cx + 5, y, cz - 2, BLOCK.WINDOW);
        setBlock(cx + 5, y, cz + 2, BLOCK.WINDOW);
    }
    
    // Chapel
    const chapelX = cx + 7;
    const chapelZ = cz - 6;
    for (let y = baseH; y < baseH + 8; y++) {
        for (let dx = -3; dx <= 3; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
                if (Math.abs(dx) === 3 || Math.abs(dz) === 2) {
                    setBlock(chapelX + dx, y, chapelZ + dz, BLOCK.STONE);
                }
            }
        }
    }
    // Chapel spire
    for (let y = baseH + 8; y < baseH + 14; y++) {
        setBlock(chapelX, y, chapelZ, BLOCK.STONE);
        setBlock(chapelX + 1, y, chapelZ, BLOCK.STONE);
    }
    // Chapel windows
    setBlock(chapelX - 3, baseH + 3, chapelZ, BLOCK.WINDOW);
    setBlock(chapelX + 3, baseH + 3, chapelZ, BLOCK.WINDOW);
    
    // Courtyard decorations
    // Well
    for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
            setBlock(cx + 3 + dx, baseH, cz + 3 + dz, BLOCK.COBBLESTONE);
        }
    }
    setBlock(cx + 3, baseH + 1, cz + 3, BLOCK.WATER);
    
    // Gardens
    for (let dx = -8; dx <= -4; dx++) {
        for (let dz = 4; dz <= 8; dz++) {
            if (Math.random() < 0.3) {
                setBlock(cx + dx, baseH, cz + dz, BLOCK.FLOWER_RED);
            } else if (Math.random() < 0.3) {
                setBlock(cx + dx, baseH, cz + dz, BLOCK.FLOWER_YELLOW);
            }
        }
    }
    
    // Moat
    for (let r = castleSize + 3; r <= castleSize + 5; r++) {
        for (let a = 0; a < 360; a += 3) {
            const rad = a * Math.PI / 180;
            const px = Math.floor(cx + Math.cos(rad) * r);
            const pz = Math.floor(cz + Math.sin(rad) * r);
            for (let y = baseH - 3; y < baseH; y++) {
                setBlock(px, y, pz, BLOCK.WATER);
            }
        }
    }
    
    // Bridge over moat
    for (let i = -2; i <= 2; i++) {
        for (let j = castleSize - 2; j <= castleSize + 5; j++) {
            setBlock(cx + i, baseH - 1, cz + j, BLOCK.PLANKS);
        }
    }
    
    // Flags on towers
    towerPositions.forEach(([tx, tz]) => {
        const flagY = baseH + wallH + 7;
        setBlock(cx + tx, flagY, cz + tz, BLOCK.WOOD);
        setBlock(cx + tx, flagY + 1, cz + tz, BLOCK.WOOD);
        setBlock(cx + tx + 1, flagY, cz + tz, BLOCK.BRICK); // flag
        setBlock(cx + tx + 1, flagY + 1, cz + tz, BLOCK.BRICK);
    });
    
    // Torches along walls
    for (let i = -castleSize; i <= castleSize; i += 4) {
        setBlock(cx + i, baseH + 4, cz - castleSize, BLOCK.TORCH);
        setBlock(cx + i, baseH + 4, cz + castleSize, BLOCK.TORCH);
        setBlock(cx - castleSize, baseH + 4, cz + i, BLOCK.TORCH);
        setBlock(cx + castleSize, baseH + 4, cz + i, BLOCK.TORCH);
    }
}

function generateVillage() {
    const vx = Math.floor(WORLD_SIZE_X * 0.45);
    const vz = Math.floor(WORLD_SIZE_Z * 0.55);
    
    // Generate 30 houses with variation
    const houseCount = 30;
    const housePositions = [];
    
    for (let i = 0; i < houseCount; i++) {
        let hx, hz, attempts = 0;
        do {
            hx = vx + Math.floor((Math.random() - 0.5) * 40);
            hz = vz + Math.floor((Math.random() - 0.5) * 30);
            attempts++;
        } while (attempts < 50 && housePositions.some(([px, pz]) => 
            Math.abs(px - hx) < 5 && Math.abs(pz - hz) < 5));
        
        if (attempts < 50) {
            housePositions.push([hx, hz]);
            buildHouse(hx, hz, i);
        }
    }
    
    // Marketplace
    const marketX = vx;
    const marketZ = vz;
    for (let dx = -3; dx <= 3; dx++) {
        for (let dz = -3; dz <= 3; dz++) {
            setBlock(marketX + dx, getHeight(marketX + dx, marketZ + dz), marketZ + dz, BLOCK.COBBLESTONE);
        }
    }
    // Market stalls
    for (let s = 0; s < 4; s++) {
        const sx = marketX + Math.cos(s * Math.PI / 2) * 2;
        const sz = marketZ + Math.sin(s * Math.PI / 2) * 2;
        const sh = getHeight(Math.floor(sx), Math.floor(sz));
        for (let dy = 0; dy < 3; dy++) {
            setBlock(Math.floor(sx), sh + dy, Math.floor(sz), BLOCK.PLANKS);
        }
        setBlock(Math.floor(sx) - 1, sh + 3, Math.floor(sz), BLOCK.PLANKS);
        setBlock(Math.floor(sx) + 1, sh + 3, Math.floor(sz), BLOCK.PLANKS);
    }
    
    // Blacksmith
    const bsX = vx - 12;
    const bsZ = vz - 8;
    buildBlacksmith(bsX, bsZ);
    
    // Tavern (larger)
    const tavX = vx + 10;
    const tavZ = vz + 8;
    buildTavern(tavX, tavZ);
    
    // Village chapel
    const vcX = vx + 5;
    const vcZ = vz - 12;
    buildSmallChapel(vcX, vcZ);
    
    // Farms
    for (let f = 0; f < 3; f++) {
        const fx = vx - 20 + f * 10;
        const fz = vz + 15;
        buildFarm(fx, fz);
    }
    
    // Docks and boats
    const dockX = vx + 5;
    const dockZ = Math.floor(WORLD_SIZE_Z * 0.65) - 3;
    buildDocks(dockX, dockZ);
    
    // Watermill
    const millX = vx - 8;
    const millZ = Math.floor(WORLD_SIZE_Z * 0.65) - 2;
    buildWatermill(millX, millZ);
    
    // Stone bridge to castle road
    const bridgeX = Math.floor(WORLD_SIZE_X / 2) - 15;
    const bridgeZ = Math.floor(WORLD_SIZE_Z * 0.65);
    buildStoneBridge(bridgeX, bridgeZ);
    
    // Wells scattered
    for (let w = 0; w < 3; w++) {
        const wx = vx + Math.floor((Math.random() - 0.5) * 30);
        const wz = vz + Math.floor((Math.random() - 0.5) * 20);
        buildWell(wx, wz);
    }
    
    // Lanterns along streets
    for (let l = 0; l < 15; l++) {
        const lx = vx + Math.floor((Math.random() - 0.5) * 35);
        const lz = vz + Math.floor((Math.random() - 0.5) * 25);
        const lh = getHeight(lx, lz);
        if (getBlock(lx, lh, lz) !== BLOCK.WATER) {
            setBlock(lx, lh + 1, lz, BLOCK.FENCE);
            setBlock(lx, lh + 2, lz, BLOCK.TORCH);
        }
    }
    
    // Barrels and carts
    for (let b = 0; b < 8; b++) {
        const bx = vx + Math.floor((Math.random() - 0.5) * 30);
        const bz = vz + Math.floor((Math.random() - 0.5) * 20);
        const bh = getHeight(bx, bz);
        setBlock(bx, bh + 1, bz, BLOCK.DARK_WOOD);
    }
}

function buildHouse(x, z, variant) {
    const h = getHeight(x, z);
    const width = 3 + Math.floor(Math.random() * 3);
    const depth = 3 + Math.floor(Math.random() * 2);
    const height = 4 + Math.floor(Math.random() * 3);
    const wallType = variant % 3 === 0 ? BLOCK.COBBLESTONE : (variant % 3 === 1 ? BLOCK.PLANKS : BLOCK.BRICK);
    const roofType = variant % 2 === 0 ? BLOCK.ROOF_TILE : BLOCK.DARK_WOOD;
    
    // Walls
    for (let y = h + 1; y <= h + height; y++) {
        for (let dx = 0; dx < width; dx++) {
            for (let dz = 0; dz < depth; dz++) {
                if (dx === 0 || dx === width - 1 || dz === 0 || dz === depth - 1) {
                    setBlock(x + dx, y, z + dz, wallType);
                }
            }
        }
    }
    
    // Roof
    for (let dx = -1; dx <= width; dx++) {
        for (let dz = -1; dz <= depth; dz++) {
            setBlock(x + dx, h + height + 1, z + dz, roofType);
        }
    }
    // Peaked roof
    for (let dx = 0; dx < width; dx++) {
        setBlock(x + dx, h + height + 2, z + Math.floor(depth / 2), roofType);
    }
    
    // Door
    setBlock(x + Math.floor(width / 2), h + 1, z, BLOCK.DOOR);
    setBlock(x + Math.floor(width / 2), h + 2, z, BLOCK.DOOR);
    
    // Windows
    if (width > 3) {
        setBlock(x + 1, h + 3, z, BLOCK.WINDOW);
        setBlock(x + width - 2, h + 3, z, BLOCK.WINDOW);
    }
    setBlock(x, h + 3, z + Math.floor(depth / 2), BLOCK.WINDOW);
    
    // Chimney
    if (variant % 2 === 0) {
        setBlock(x + width - 1, h + height + 1, z + depth - 1, BLOCK.COBBLESTONE);
        setBlock(x + width - 1, h + height + 2, z + depth - 1, BLOCK.COBBLESTONE);
        setBlock(x + width - 1, h + height + 3, z + depth - 1, BLOCK.COBBLESTONE);
    }
}

function buildBlacksmith(x, z) {
    const h = getHeight(x, z);
    // Main structure
    for (let y = h + 1; y <= h + 5; y++) {
        for (let dx = 0; dx < 6; dx++) {
            for (let dz = 0; dz < 5; dz++) {
                if (dx === 0 || dx === 5 || dz === 0 || dz === 4) {
                    setBlock(x + dx, y, z + dz, BLOCK.DARK_WOOD);
                }
            }
        }
    }
    // Roof
    for (let dx = -1; dx <= 6; dx++) {
        for (let dz = -1; dz <= 5; dz++) {
            setBlock(x + dx, h + 6, z + dz, BLOCK.ROOF_TILE);
        }
    }
    // Forge (lava)
    setBlock(x + 2, h + 1, z + 2, BLOCK.LAVA);
    setBlock(x + 3, h + 1, z + 2, BLOCK.LAVA);
    // Anvil
    setBlock(x + 4, h + 1, z + 2, BLOCK.IRON);
    setBlock(x + 4, h + 2, z + 2, BLOCK.IRON);
}

function buildTavern(x, z) {
    const h = getHeight(x, z);
    // Larger building
    for (let y = h + 1; y <= h + 7; y++) {
        for (let dx = 0; dx < 8; dx++) {
            for (let dz = 0; dz < 6; dz++) {
                if (dx === 0 || dx === 7 || dz === 0 || dz === 5) {
                    setBlock(x + dx, y, z + dz, BLOCK.PLANKS);
                }
            }
        }
    }
    // Second floor
    for (let dx = 0; dx < 8; dx++) {
        for (let dz = 0; dz < 6; dz++) {
            setBlock(x + dx, h + 4, z + dz, BLOCK.PLANKS);
        }
    }
    // Roof
    for (let dx = -1; dx <= 8; dx++) {
        for (let dz = -1; dz <= 6; dz++) {
            setBlock(x + dx, h + 8, z + dz, BLOCK.ROOF_TILE);
        }
    }
    // Sign
    setBlock(x - 1, h + 2, z + 3, BLOCK.WOOD);
    setBlock(x - 1, h + 3, z + 3, BLOCK.PLANKS);
    // Many windows (glowing at night)
    for (let dx = 1; dx < 7; dx += 2) {
        setBlock(x + dx, h + 2, z, BLOCK.WINDOW);
        setBlock(x + dx, h + 5, z, BLOCK.WINDOW);
    }
    // Door
    setBlock(x + 3, h + 1, z, BLOCK.DOOR);
    setBlock(x + 4, h + 1, z, BLOCK.DOOR);
    setBlock(x + 3, h + 2, z, BLOCK.AIR);
    setBlock(x + 4, h + 2, z, BLOCK.AIR);
}

function buildSmallChapel(x, z) {
    const h = getHeight(x, z);
    for (let y = h + 1; y <= h + 6; y++) {
        for (let dx = 0; dx < 5; dx++) {
            for (let dz = 0; dz < 4; dz++) {
                if (dx === 0 || dx === 4 || dz === 0 || dz === 3) {
                    setBlock(x + dx, y, z + dz, BLOCK.STONE);
                }
            }
        }
    }
    // Steeple
    for (let y = h + 6; y < h + 10; y++) {
        setBlock(x + 2, y, z + 1, BLOCK.STONE);
        setBlock(x + 2, y, z + 2, BLOCK.STONE);
    }
    // Stained glass
    setBlock(x + 2, h + 4, z, BLOCK.WINDOW);
}

function buildFarm(x, z) {
    const h = getHeight(x, z);
    // Wheat fields
    for (let dx = 0; dx < 8; dx++) {
        for (let dz = 0; dz < 6; dz++) {
            if (Math.random() < 0.8) {
                setBlock(x + dx, h + 1, z + dz, BLOCK.WHEAT);
            }
        }
    }
    // Fences
    for (let dx = -1; dx <= 8; dx++) {
        setBlock(x + dx, h + 1, z - 1, BLOCK.FENCE);
        setBlock(x + dx, h + 1, z + 6, BLOCK.FENCE);
    }
    for (let dz = -1; dz <= 6; dz++) {
        setBlock(x - 1, h + 1, z + dz, BLOCK.FENCE);
        setBlock(x + 8, h + 1, z + dz, BLOCK.FENCE);
    }
    // Hay bales
    setBlock(x + 6, h + 1, z + 4, BLOCK.HAY);
    setBlock(x + 7, h + 1, z + 4, BLOCK.HAY);
    setBlock(x + 6, h + 2, z + 4, BLOCK.HAY);
}

function buildDocks(x, z) {
    // Wooden dock extending into water
    for (let d = 0; d < 8; d++) {
        setBlock(x, WATER_LEVEL, z + d, BLOCK.PLANKS);
        setBlock(x + 1, WATER_LEVEL, z + d, BLOCK.PLANKS);
    }
    // Posts
    for (let d = 0; d < 8; d += 2) {
        setBlock(x - 1, WATER_LEVEL, z + d, BLOCK.WOOD);
        setBlock(x - 1, WATER_LEVEL + 1, z + d, BLOCK.WOOD);
        setBlock(x + 2, WATER_LEVEL, z + d, BLOCK.WOOD);
        setBlock(x + 2, WATER_LEVEL + 1, z + d, BLOCK.WOOD);
    }
    // Boats
    for (let b = 0; b < 3; b++) {
        const bx = x + 4 + b * 3;
        for (let dx = 0; dx < 3; dx++) {
            setBlock(bx + dx, WATER_LEVEL, z + 5, BLOCK.DARK_WOOD);
        }
        setBlock(bx, WATER_LEVEL + 1, z + 5, BLOCK.DARK_WOOD);
        setBlock(bx + 2, WATER_LEVEL + 1, z + 5, BLOCK.DARK_WOOD);
    }
}

function buildWatermill(x, z) {
    const h = getHeight(x, z);
    // Building
    for (let y = h + 1; y <= h + 6; y++) {
        for (let dx = 0; dx < 5; dx++) {
            for (let dz = 0; dz < 5; dz++) {
                if (dx === 0 || dx === 4 || dz === 0 || dz === 4) {
                    setBlock(x + dx, y, z + dz, BLOCK.STONE);
                }
            }
        }
    }
    // Water wheel
    for (let a = 0; a < 360; a += 30) {
        const rad = a * Math.PI / 180;
        const wx = x + 5 + Math.floor(Math.cos(rad) * 3);
        const wy = h + 4 + Math.floor(Math.sin(rad) * 3);
        setBlock(wx, wy, z + 2, BLOCK.DARK_WOOD);
    }
    setBlock(x + 5, h + 4, z + 2, BLOCK.WOOD); // axle
}

function buildStoneBridge(x, z) {
    for (let i = -3; i <= 3; i++) {
        for (let j = 0; j < 12; j++) {
            // Arch
            const archH = Math.floor(Math.sqrt(9 - i * i));
            if (j > 9 - archH && j < 9 + archH) continue;
            setBlock(x + i, WATER_LEVEL + 1, z + j, BLOCK.STONE);
            setBlock(x + i, WATER_LEVEL + 2, z + j, BLOCK.STONE);
        }
    }
    // Road surface
    for (let i = -3; i <= 3; i++) {
        for (let j = 0; j < 12; j++) {
            setBlock(x + i, WATER_LEVEL + 3, z + j, BLOCK.COBBLESTONE);
        }
    }
    // Railings
    for (let j = 0; j < 12; j++) {
        setBlock(x - 3, WATER_LEVEL + 4, z + j, BLOCK.STONE);
        setBlock(x + 3, WATER_LEVEL + 4, z + j, BLOCK.STONE);
    }
}

function buildWell(x, z) {
    const h = getHeight(x, z);
    for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
            setBlock(x + dx, h + 1, z + dz, BLOCK.COBBLESTONE);
        }
    }
    setBlock(x, h + 1, z, BLOCK.WATER);
    // Roof supports
    setBlock(x - 1, h + 2, z - 1, BLOCK.WOOD);
    setBlock(x + 1, h + 2, z + 1, BLOCK.WOOD);
    setBlock(x - 1, h + 3, z - 1, BLOCK.WOOD);
    setBlock(x + 1, h + 3, z + 1, BLOCK.WOOD);
    // Roof
    setBlock(x, h + 4, z, BLOCK.PLANKS);
    for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
            setBlock(x + dx, h + 4, z + dz, BLOCK.ROOF_TILE);
        }
    }
}

function generateForest() {
    const treePositions = [];
    for (let i = 0; i < 200; i++) {
        const x = Math.floor(Math.random() * WORLD_SIZE_X);
        const z = Math.floor(Math.random() * WORLD_SIZE_Z);
        const h = getHeight(x, z);
        
        if (h > WATER_LEVEL + 2 && h < WORLD_HEIGHT - 20 && getBlock(x, h, z) === BLOCK.GRASS) {
            if (!treePositions.some(([px, pz]) => Math.abs(px - x) < 3 && Math.abs(pz - z) < 3)) {
                treePositions.push([x, z]);
                buildTree(x, z, h);
            }
        }
    }
}

function buildTree(x, z, h) {
    const height = 4 + Math.floor(Math.random() * 4);
    const type = Math.random();
    
    if (type < 0.5) {
        // Oak
        for (let y = 0; y < height; y++) {
            setBlock(x, h + y + 1, z, BLOCK.WOOD);
        }
        for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
                for (let dy = -1; dy <= 2; dy++) {
                    if (Math.abs(dx) + Math.abs(dz) + Math.abs(dy) <= 3) {
                        setBlock(x + dx, h + height + dy, z + dz, BLOCK.LEAVES);
                    }
                }
            }
        }
    } else if (type < 0.8) {
        // Pine
        for (let y = 0; y < height + 2; y++) {
            setBlock(x, h + y + 1, z, BLOCK.WOOD);
        }
        for (let ly = 0; ly < 4; ly++) {
            const radius = 3 - ly;
            for (let dx = -radius; dx <= radius; dx++) {
                for (let dz = -radius; dz <= radius; dz++) {
                    if (Math.abs(dx) + Math.abs(dz) <= radius + 1) {
                        setBlock(x + dx, h + height - 1 + ly, z + dz, BLOCK.LEAVES);
                    }
                }
            }
        }
    } else {
        // Birch (light wood)
        for (let y = 0; y < height; y++) {
            setBlock(x, h + y + 1, z, BLOCK.LIGHT_WOOD);
        }
        for (let dx = -2; dx <= 2; dx++) {
            for (let dz = -2; dz <= 2; dz++) {
                for (let dy = 0; dy <= 2; dy++) {
                    if (Math.abs(dx) + Math.abs(dz) + dy <= 3) {
                        setBlock(x + dx, h + height + dy, z + dz, BLOCK.LEAVES);
                    }
                }
            }
        }
    }
}

function generateMountains() {
    const mx = 15;
    const mz = 15;
    
    // Snowy peaks
    for (let x = mx - 20; x < mx + 20; x++) {
        for (let z = mz - 20; z < mz + 20; z++) {
            const dist = Math.sqrt((x - mx) * (x - mx) + (z - mz) * (z - mz));
            if (dist < 20) {
                const peakH = WORLD_HEIGHT - 10 - Math.floor(dist * 1.5);
                for (let y = peakH; y < WORLD_HEIGHT - 5; y++) {
                    setBlock(x, y, z, BLOCK.SNOW);
                }
                // Caves
                if (Math.random() < 0.005) {
                    const caveY = Math.floor(Math.random() * (peakH - WATER_LEVEL)) + WATER_LEVEL + 5;
                    for (let dx = -2; dx <= 2; dx++) {
                        for (let dz = -2; dz <= 2; dz++) {
                            for (let dy = -2; dy <= 2; dy++) {
                                if (dx * dx + dy * dy + dz * dz < 6) {
                                    setBlock(x + dx, caveY + dy, z + dz, BLOCK.AIR);
                                }
                            }
                        }
                    }
                }
            }
        }
    }
    
    // Lookout post
    const lpX = mx + 10;
    const lpZ = mz + 10;
    const lpH = getHeight(lpX, lpZ);
    for (let y = 0; y < 8; y++) {
        setBlock(lpX, lpH + y, lpZ, BLOCK.WOOD);
    }
    for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
            setBlock(lpX + dx, lpH + 8, lpZ + dz, BLOCK.PLANKS);
        }
    }
}

function generateVolcano() {
    const vx = WORLD_SIZE_X - 15;
    const vz = 15;
    
    // Volcanic cone
    for (let r = 0; r < 16; r++) {
        for (let a = 0; a < 360; a += 5) {
            const rad = a * Math.PI / 180;
            const px = Math.floor(vx + Math.cos(rad) * r);
            const pz = Math.floor(vz + Math.sin(rad) * r);
            const h = getHeight(px, pz);
            const targetH = h + (16 - r) * 2;
            
            for (let y = h; y < Math.min(targetH, WORLD_HEIGHT - 5); y++) {
                setBlock(px, y, pz, r < 3 ? BLOCK.LAVA : BLOCK.BASALT);
            }
        }
    }
    
    // Crater
    for (let dx = -3; dx <= 3; dx++) {
        for (let dz = -3; dz <= 3; dz++) {
            if (dx * dx + dz * dz < 10) {
                const craterH = getHeight(vx + dx, vz + dz);
                for (let y = craterH - 5; y < craterH; y++) {
                    setBlock(vx + dx, y, vz + dz, BLOCK.LAVA);
                }
                // Lava flow
                for (let flow = 0; flow < 10; flow++) {
                    const fx = vx + dx + flow;
                    const fz = vz + dz;
                    const fh = getHeight(fx, fz);
                    if (fh > WATER_LEVEL) {
                        setBlock(fx, fh, fz, BLOCK.LAVA);
                    }
                }
            }
        }
    }
    
    // Ash ground
    for (let x = vx - 20; x < vx + 20; x++) {
        for (let z = vz - 20; z < vz + 20; z++) {
            const dist = Math.sqrt((x - vx) * (x - vx) + (z - vz) * (z - vz));
            if (dist < 20 && dist > 5) {
                const h = getHeight(x, z);
                if (Math.random() < 0.4) {
                    setBlock(x, h, z, BLOCK.ASH);
                }
            }
        }
    }
    
    // Dead trees
    for (let i = 0; i < 15; i++) {
        const tx = vx + Math.floor((Math.random() - 0.5) * 30);
        const tz = vz + Math.floor((Math.random() - 0.5) * 30);
        const th = getHeight(tx, tz);
        if (th > WATER_LEVEL && th < WORLD_HEIGHT - 15) {
            for (let y = 0; y < 4; y++) {
                setBlock(tx, th + y, tz, BLOCK.DARK_WOOD);
            }
            // Bare branches
            setBlock(tx + 1, th + 3, tz, BLOCK.DARK_WOOD);
            setBlock(tx - 1, th + 2, tz, BLOCK.DARK_WOOD);
        }
    }
    
    // Ancient ruins
    for (let r = 0; r < 5; r++) {
        const rx = vx + 8 + Math.floor(Math.random() * 5);
        const rz = vz - 5 + Math.floor(Math.random() * 10);
        const rh = getHeight(rx, rz);
        // Broken columns
        const colH = 3 + Math.floor(Math.random() * 4);
        for (let y = 0; y < colH; y++) {
            setBlock(rx, rh + y, rz, BLOCK.PURPLE_STONE);
        }
    }
    
    // Watchtower near volcano
    const wtX = vx - 10;
    const wtZ = vz + 10;
    const wtH = getHeight(wtX, wtZ);
    for (let y = 0; y < 10; y++) {
        for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
                if (Math.abs(dx) + Math.abs(dz) <= 1) {
                    setBlock(wtX + dx, wtH + y, wtZ + dz, BLOCK.STONE);
                }
            }
        }
    }
    setBlock(wtX, wtH + 10, wtZ, BLOCK.TORCH);
}

function generateRiver() {
    const riverCenter = Math.floor(WORLD_SIZE_Z * 0.65);
    
    for (let x = 0; x < WORLD_SIZE_X; x++) {
        const curve = Math.sin(x * 0.05) * 8;
        const rz = riverCenter + curve;
        const width = 6 + Math.sin(x * 0.1) * 2;
        
        for (let z = Math.floor(rz - width); z <= Math.floor(rz + width); z++) {
            const h = getHeight(x, z);
            for (let y = h - 2; y < WATER_LEVEL; y++) {
                if (y >= 0) {
                    setBlock(x, y, z, BLOCK.WATER);
                }
            }
            // Reeds
            if (Math.random() < 0.1 && h <= WATER_LEVEL + 1) {
                setBlock(x, WATER_LEVEL + 1, z, BLOCK.WHEAT);
            }
        }
        
        // Waterfall
        if (x === Math.floor(WORLD_SIZE_X * 0.3)) {
            for (let z = Math.floor(rz - 2); z <= Math.floor(rz + 2); z++) {
                const wh = getHeight(x, z);
                for (let y = wh; y < wh + 8; y++) {
                    setBlock(x, y, z, BLOCK.WATER);
                }
            }
        }
    }
}

function generatePaths() {
    // Path from village to castle
    const vx = Math.floor(WORLD_SIZE_X * 0.45);
    const vz = Math.floor(WORLD_SIZE_Z * 0.55);
    const cx = Math.floor(WORLD_SIZE_X / 2);
    const cz = Math.floor(WORLD_SIZE_Z / 2);
    
    const steps = 30;
    for (let i = 0; i < steps; i++) {
        const t = i / steps;
        const px = Math.floor(vx + (cx - vx) * t);
        const pz = Math.floor(vz + (cz - vz) * t);
        const h = getHeight(px, pz);
        
        for (let dx = -1; dx <= 1; dx++) {
            for (let dz = -1; dz <= 1; dz++) {
                setBlock(px + dx, h, pz + dz, BLOCK.GRAVEL);
            }
        }
    }
    
    // Hidden forest path
    for (let i = 0; i < 20; i++) {
        const px = Math.floor(20 + Math.sin(i * 0.5) * 3);
        const pz = Math.floor(30 + i * 2);
        const h = getHeight(px, pz);
        setBlock(px, h, pz, BLOCK.DIRT);
    }
}

function generateRuins() {
    const rx = Math.floor(WORLD_SIZE_X * 0.2);
    const rz = Math.floor(WORLD_SIZE_Z * 0.3);
    const rh = getHeight(rx, rz);
    
    // Ruined wall segments
    for (let i = 0; i < 5; i++) {
        const wx = rx + Math.floor(Math.random() * 8) - 4;
        const wz = rz + Math.floor(Math.random() * 8) - 4;
        const wallH = 2 + Math.floor(Math.random() * 3);
        for (let y = 0; y < wallH; y++) {
            setBlock(wx, rh + y, wz, BLOCK.MOSSY_STONE);
            setBlock(wx + 1, rh + y, wz, BLOCK.MOSSY_STONE);
        }
    }
}

function generateCaves() {
    for (let c = 0; c < 8; c++) {
        const cx = Math.floor(Math.random() * WORLD_SIZE_X);
        const cz = Math.floor(Math.random() * WORLD_SIZE_Z);
        const cy = Math.floor(Math.random() * (WATER_LEVEL - 5)) + 3;
        
        // Simple cave
        for (let dx = -3; dx <= 3; dx++) {
            for (let dz = -3; dz <= 3; dz++) {
                for (let dy = -2; dy <= 2; dy++) {
                    if (dx * dx + dy * dy + dz * dz < 10) {
                        setBlock(cx + dx, cy + dy, cz + dz, BLOCK.AIR);
                    }
                }
            }
        }
        // Cave entrance
        const surfH = getHeight(cx, cz);
        for (let dy = 0; dy < 3; dy++) {
            setBlock(cx, surfH - dy, cz, BLOCK.AIR);
            setBlock(cx + 1, surfH - dy, cz, BLOCK.AIR);
        }
    }
}

// Greedy Meshing for chunk
function meshChunk(chunkX, chunkZ) {
    const vertices = [];
    const startX = chunkX * CHUNK_SIZE;
    const startZ = chunkZ * CHUNK_SIZE;
    
    // For each face direction
    const directions = [
        { dir: [1, 0, 0], face: 'right' },
        { dir: [-1, 0, 0], face: 'left' },
        { dir: [0, 1, 0], face: 'top' },
        { dir: [0, -1, 0], face: 'bottom' },
        { dir: [0, 0, 1], face: 'front' },
        { dir: [0, 0, -1], face: 'back' }
    ];
    
    for (const { dir, face } of directions) {
        // Check each potential face in the chunk
        for (let x = 0; x < CHUNK_SIZE; x++) {
            for (let z = 0; z < CHUNK_SIZE; z++) {
                for (let y = 0; y < WORLD_HEIGHT; y++) {
                    const wx = startX + x;
                    const wz = startZ + z;
                    const block = getBlock(wx, y, wz);
                    
                    if (block === BLOCK.AIR) continue;
                    
                    const nx = wx + dir[0];
                    const ny = y + dir[1];
                    const nz = wz + dir[2];
                    const neighbor = getBlock(nx, ny, nz);
                    
                    const blockProps = BLOCK_PROPERTIES[block] || {};
                    const neighborProps = BLOCK_PROPERTIES[neighbor] || {};
                    
                    // Only render face if neighbor is transparent or air
                    if (neighbor === BLOCK.AIR || (neighborProps.transparent && neighbor !== block)) {
                        addFace(vertices, wx, y, wz, face, block);
                    }
                }
            }
        }
    }
    
    return new Float32Array(vertices);
}

function addFace(vertices, x, y, z, face, blockType) {
    const color = BLOCK_COLORS[blockType] || [0.5, 0.5, 0.5];
    const props = BLOCK_PROPERTIES[blockType] || {};
    const emissive = props.emissive || 0;
    
    // Face vertices (2 triangles = 6 vertices)
    let v;
    switch (face) {
        case 'top':
            v = [
                [x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1],
                [x, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]
            ];
            break;
        case 'bottom':
            v = [
                [x, y, z + 1], [x + 1, y, z + 1], [x + 1, y, z],
                [x, y, z + 1], [x + 1, y, z], [x, y, z]
            ];
            break;
        case 'front':
            v = [
                [x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1],
                [x, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]
            ];
            break;
        case 'back':
            v = [
                [x + 1, y, z], [x, y, z], [x, y + 1, z],
                [x + 1, y, z], [x, y + 1, z], [x + 1, y + 1, z]
            ];
            break;
        case 'right':
            v = [
                [x + 1, y, z + 1], [x + 1, y, z], [x + 1, y + 1, z],
                [x + 1, y, z + 1], [x + 1, y + 1, z], [x + 1, y + 1, z + 1]
            ];
            break;
        case 'left':
            v = [
                [x, y, z], [x, y, z + 1], [x, y + 1, z + 1],
                [x, y, z], [x, y + 1, z + 1], [x, y + 1, z]
            ];
            break;
    }
    
    // Apply face-dependent lighting (fake AO)
    let shade = 1.0;
    if (face === 'top') shade = 1.0;
    else if (face === 'bottom') shade = 0.5;
    else if (face === 'front' || face === 'back') shade = 0.8;
    else shade = 0.7;
    
    for (const vert of v) {
        vertices.push(
            vert[0], vert[1], vert[2],
            color[0] * shade, color[1] * shade, color[2] * shade,
            emissive
        );
    }
}

// Create render pipeline
async function createPipeline() {
    const shaderCode = `
struct Uniforms {
    mvp: mat4x4<f32>,
    cameraPos: vec4<f32>,
    sunDir: vec4<f32>,
    sunColor: vec4<f32>,
    ambientColor: vec4<f32>,
    fogColor: vec4<f32>,
    time: f32,
    fogDensity: f32,
    bloomStrength: f32,
    renderPass: f32,
};

@group(0) @binding(0) var<uniform> uniforms: Uniforms;

struct VertexInput {
    @location(0) position: vec3<f32>,
    @location(1) color: vec3<f32>,
    @location(2) emissive: f32,
};

struct VertexOutput {
    @builtin(position) position: vec4<f32>,
    @location(0) worldPos: vec3<f32>,
    @location(1) color: vec3<f32>,
    @location(2) emissive: f32,
    @location(3) viewDist: f32,
};

@vertex
fn vertexMain(input: VertexInput) -> VertexOutput {
    var output: VertexOutput;
    output.position = uniforms.mvp * vec4<f32>(input.position, 1.0);
    output.worldPos = input.position;
    output.color = input.color;
    output.emissive = input.emissive;
    output.viewDist = length(input.position - uniforms.cameraPos.xyz);
    return output;
}

@fragment
fn fragmentMain(input: VertexOutput) -> @location(0) vec4<f32> {
    let sunDir = normalize(uniforms.sunDir.xyz);
    let toSun = dot(normalize(vec3<f32>(0.0, 1.0, 0.0)), sunDir);
    
    // Simple directional lighting
    let normal = normalize(input.worldPos - uniforms.cameraPos.xyz);
    let diffuse = max(0.0, dot(vec3<f32>(0.0, 1.0, 0.0), sunDir)) * 0.7 + 0.3;
    
    var finalColor = input.color * diffuse * uniforms.sunColor.rgb;
    finalColor = finalColor + uniforms.ambientColor.rgb * input.color;
    
    // Emissive
    finalColor = finalColor + input.color * input.emissive * 2.0;
    
    // Animated water
    let isWater = input.color.b > 0.5 && input.color.r < 0.3;
    if (isWater) {
        let wave = sin(input.worldPos.x * 0.5 + uniforms.time * 2.0) * 0.05;
        finalColor = finalColor + vec3<f32>(wave, wave * 0.5, wave);
        finalColor = mix(finalColor, uniforms.fogColor.rgb, 0.3);
    }
    
    // Lava glow
    let isLava = input.color.r > 0.8 && input.color.g < 0.5;
    if (isLava) {
        let pulse = sin(uniforms.time * 3.0) * 0.2 + 0.8;
        finalColor = finalColor * pulse;
    }
    
    // Torch flicker
    if (input.emissive > 0.5 && !isLava) {
        let flicker = sin(uniforms.time * 10.0 + input.worldPos.x * 5.0) * 0.15 + 0.85;
        finalColor = finalColor * flicker;
    }
    
    // Fog
    let fogAmount = 1.0 - exp(-input.viewDist * uniforms.fogDensity);
    finalColor = mix(finalColor, uniforms.fogColor.rgb, fogAmount);
    
    return vec4<f32>(finalColor, 1.0);
}
`;

    const shaderModule = gpuDevice.createShaderModule({ code: shaderCode });
    
    const pipeline = gpuDevice.createRenderPipeline({
        layout: 'auto',
        vertex: {
            module: shaderModule,
            entryPoint: 'vertexMain',
            buffers: [{
                arrayStride: 28, // 3 pos + 3 color + 1 emissive = 7 floats * 4 bytes
                attributes: [
                    { shaderLocation: 0, offset: 0, format: 'float32x3' },
                    { shaderLocation: 1, offset: 12, format: 'float32x3' },
                    { shaderLocation: 2, offset: 24, format: 'float32' },
                ]
            }]
        },
        fragment: {
            module: shaderModule,
            entryPoint: 'fragmentMain',
            targets: [{ format: navigator.gpu.getPreferredCanvasFormat() }]
        },
        primitive: { topology: 'triangle-list', cullMode: 'back' },
        depthStencil: {
            format: 'depth24plus',
            depthWriteEnabled: true,
            depthCompare: 'less'
        }
    });
    
    return pipeline;
}

// Build chunk meshes
function buildChunkMeshes() {
    chunks = [];
    for (let cx = 0; cx < WORLD_CHUNKS_X; cx++) {
        for (let cz = 0; cz < WORLD_CHUNKS_Z; cz++) {
            const vertexData = meshChunk(cx, cz);
            if (vertexData.length === 0) continue;
            
            const buffer = gpuDevice.createBuffer({
                size: vertexData.byteLength,
                usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
                mappedAtCreation: true
            });
            new Float32Array(buffer.getMappedRange()).set(vertexData);
            buffer.unmap();
            
            chunks.push({
                x: cx, z: cz,
                buffer: buffer,
                vertexCount: vertexData.length / 7
            });
        }
    }
}

// Matrix math
function mat4Perspective(fov, aspect, near, far) {
    const f = 1.0 / Math.tan(fov / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
    ]);
}

function mat4LookAt(eye, center, up) {
    const zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    const zl = Math.sqrt(zx * zx + zy * zy + zz * zz);
    const z = [zx / zl, zy / zl, zz / zl];
    
    const xx = up[1] * z[2] - up[2] * z[1];
    const xy = up[2] * z[0] - up[0] * z[2];
    const xz = up[0] * z[1] - up[1] * z[0];
    const xl = Math.sqrt(xx * xx + xy * xy + xz * xz);
    const x = [xx / xl, xy / xl, xz / xl];
    
    const y = [z[1] * x[2] - z[2] * x[1], z[2] * x[0] - z[0] * x[2], z[0] * x[1] - z[1] * x[0]];
    
    return new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
        -(x[0] * eye[0] + x[1] * eye[1] + x[2] * eye[2]),
        -(y[0] * eye[0] + y[1] * eye[1] + y[2] * eye[2]),
        -(z[0] * eye[0] + z[1] * eye[1] + z[2] * eye[2]),
        1
    ]);
}

function mat4Multiply(a, b) {
    const r = new Float32Array(16);
    for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
            r[i * 4 + j] = a[j] * b[i * 4] + a[4 + j] * b[i * 4 + 1] +
                           a[8 + j] * b[i * 4 + 2] + a[12 + j] * b[i * 4 + 3];
        }
    }
    return r;
}

// Camera
function getCameraForward() {
    return [
        -Math.sin(camera.yaw) * Math.cos(camera.pitch),
        Math.sin(camera.pitch),
        -Math.cos(camera.yaw) * Math.cos(camera.pitch)
    ];
}

function getCameraRight() {
    return [
        Math.cos(camera.yaw), 0, -Math.sin(camera.yaw)
    ];
}

function updateCamera(dt) {
    const speed = (keys['ShiftLeft'] ? 40 : 20) * dt;
    const forward = getCameraForward();
    const right = getCameraRight();
    
    if (keys['KeyW']) { camera.x += forward[0] * speed; camera.y += forward[1] * speed; camera.z += forward[2] * speed; }
    if (keys['KeyS']) { camera.x -= forward[0] * speed; camera.y -= forward[1] * speed; camera.z -= forward[2] * speed; }
    if (keys['KeyA']) { camera.x -= right[0] * speed; camera.z -= right[2] * speed; }
    if (keys['KeyD']) { camera.x += right[0] * speed; camera.z += right[2] * speed; }
    if (keys['Space']) { camera.y += speed; }
    if (keys['ControlLeft'] || keys['ShiftRight']) { camera.y -= speed; }
    
    // Keep in bounds
    camera.x = Math.max(1, Math.min(WORLD_SIZE_X - 1, camera.x));
    camera.z = Math.max(1, Math.min(WORLD_SIZE_Z - 1, camera.z));
    camera.y = Math.max(2, Math.min(WORLD_HEIGHT - 2, camera.y));
}

// Rendering
let uniformBuffer, uniformBindGroup;

async function render() {
    const format = navigator.gpu.getPreferredCanvasFormat();
    
    if (!depthTexture || depthTexture.width !== canvas.width || depthTexture.height !== canvas.height) {
        if (depthTexture) depthTexture.destroy();
        depthTexture = gpuDevice.createTexture({
            size: [canvas.width, canvas.height],
            format: 'depth24plus',
            usage: GPUTextureUsage.RENDER_ATTACHMENT
        });
    }
    
    const now = performance.now() / 1000;
    
    // Update time of day
    if (cinematicMode) {
        timeOfDay = (timeOfDay + 0.0001) % 1.0;
    }
    
    // Camera
    if (!cinematicMode) {
        updateCamera(0.016);
    } else {
        // Cinematic orbit
        const orbitRadius = 80;
        const orbitSpeed = 0.15;
        const cx = WORLD_SIZE_X / 2;
        const cz = WORLD_SIZE_Z / 2;
        camera.x = cx + Math.cos(now * orbitSpeed) * orbitRadius;
        camera.z = cz + Math.sin(now * orbitSpeed) * orbitRadius;
        camera.y = 55 + Math.sin(now * 0.2) * 10;
        camera.yaw = Math.atan2(cx - camera.x, cz - camera.z) + Math.PI;
        camera.pitch = -0.2 + Math.sin(now * 0.1) * 0.1;
    }
    
    // View/Projection
    const aspect = canvas.width / canvas.height;
    const proj = mat4Perspective(Math.PI / 3, aspect, 0.5, 300);
    const forward = getCameraForward();
    const view = mat4LookAt(
        [camera.x, camera.y, camera.z],
        [camera.x + forward[0], camera.y + forward[1], camera.z + forward[2]],
        [0, 1, 0]
    );
    const mvp = mat4Multiply(proj, view);
    
    // Lighting based on time of day
    let sunDir, sunColor, ambientColor, fogColor;
    
    if (timeOfDay < 0.25) { // Night to dawn
        const t = timeOfDay / 0.25;
        sunDir = [Math.cos(t * Math.PI), Math.sin(t * Math.PI) * 0.5 + 0.1, 0.3];
        sunColor = [0.3 + t * 0.5, 0.2 + t * 0.4, 0.3 + t * 0.2, 1];
        ambientColor = [0.1 + t * 0.1, 0.1 + t * 0.05, 0.15 + t * 0.05, 1];
        fogColor = [0.05 + t * 0.4, 0.05 + t * 0.3, 0.1 + t * 0.3, 1];
    } else if (timeOfDay < 0.5) { // Dawn to noon
        const t = (timeOfDay - 0.25) / 0.25;
        sunDir = [0.3, 0.6 + t * 0.4, 0.3];
        sunColor = [0.8 + t * 0.2, 0.7 + t * 0.2, 0.5 + t * 0.3, 1];
        ambientColor = [0.2 + t * 0.2, 0.2 + t * 0.2, 0.2 + t * 0.1, 1];
        fogColor = [0.5 + t * 0.2, 0.5 + t * 0.2, 0.6 + t * 0.1, 1];
    } else if (timeOfDay < 0.75) { // Noon to dusk
        const t = (timeOfDay - 0.5) / 0.25;
        sunDir = [0.3 + t * 0.5, 1.0 - t * 0.5, -0.3];
        sunColor = [1.0, 0.9 - t * 0.4, 0.8 - t * 0.5, 1];
        ambientColor = [0.4 - t * 0.2, 0.3 - t * 0.1, 0.2, 1];
        fogColor = [0.7 - t * 0.3, 0.6 - t * 0.2, 0.5, 1];
    } else { // Dusk to night
        const t = (timeOfDay - 0.75) / 0.25;
        sunDir = [0.8 - t * 0.5, 0.5 - t * 0.5, -0.3];
        sunColor = [0.8 - t * 0.6, 0.5 - t * 0.4, 0.3 - t * 0.2, 1];
        ambientColor = [0.15 - t * 0.1, 0.1 - t * 0.05, 0.15, 1];
        fogColor = [0.1 + (1 - t) * 0.1, 0.1, 0.15, 1];
    }
    
    const fogDensity = document.getElementById('cbFog').checked ? 0.008 : 0.0;
    
    // Update uniforms
    const uniformData = new Float32Array([
        ...mvp,
        camera.x, camera.y, camera.z, 1.0,
        ...sunDir, 0.0,
        ...sunColor,
        ...ambientColor,
        ...fogColor,
        now, fogDensity,
        document.getElementById('cbBloom').checked ? 0.3 : 0.0,
        0.0
    ]);
    gpuDevice.queue.writeBuffer(uniformBuffer, 0, uniformData);
    
    // Render
    const commandEncoder = gpuDevice.createCommandEncoder();
    const textureView = gpuContext.getCurrentTexture().createView();
    
    const renderPass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: textureView,
            clearValue: { r: fogColor[0], g: fogColor[1], b: fogColor[2], a: 1 },
            loadOp: 'clear',
            storeOp: 'store'
        }],
        depthStencilAttachment: {
            view: depthTexture.createView(),
            depthClearValue: 1.0,
            depthLoadOp: 'clear',
            depthStoreOp: 'store'
        }
    });
    
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0, uniformBindGroup);
    
    // Draw chunks
    for (const chunk of chunks) {
        renderPass.setVertexBuffer(0, chunk.buffer);
        renderPass.draw(chunk.vertexCount);
    }
    
    renderPass.end();
    
    // Apply vignette post-process (simple overlay in 2D pass)
    if (document.getElementById('cbVignette').checked) {
        // For simplicity, we'll skip the vignette GPU pass and just let the final image be as is
        // A real implementation would add a fullscreen quad post-process
    }
    
    gpuDevice.queue.submit([commandEncoder.finish()]);
    
    frameCount++;
    requestAnimationFrame(render);
}

// Input handling
function setupInput() {
    document.addEventListener('keydown', (e) => {
        keys[e.code] = true;
        if (e.code === 'KeyF') flyMode = !flyMode;
        if (e.code === 'KeyC') toggleCinematic();
    });
    
    document.addEventListener('keyup', (e) => {
        keys[e.code] = false;
    });
    
    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
            mouseDown = true;
            canvas.requestPointerLock();
        }
    });
    
    canvas.addEventListener('mouseup', () => {
        mouseDown = false;
        document.exitPointerLock();
    });
    
    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === canvas && !cinematicMode) {
            camera.yaw += e.movementX * 0.003;
            camera.pitch -= e.movementY * 0.003;
            camera.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, camera.pitch));
        }
    });
    
    canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        const forward = getCameraForward();
        camera.x += forward[0] * -e.deltaY * 0.05;
        camera.y += forward[1] * -e.deltaY * 0.05;
        camera.z += forward[2] * -e.deltaY * 0.05;
    });
    
    // UI buttons
    document.getElementById('btnDawn').addEventListener('click', () => setTime(0.2));
    document.getElementById('btnDay').addEventListener('click', () => setTime(0.45));
    document.getElementById('btnDusk').addEventListener('click', () => setTime(0.7));
    document.getElementById('btnNight').addEventListener('click', () => setTime(0.9));
    document.getElementById('btnCinematic').addEventListener('click', toggleCinematic);
    document.getElementById('btnScreenshot').addEventListener('click', takeScreenshot);
    document.getElementById('btnReset').addEventListener('click', resetView);
}

function setTime(t) {
    timeOfDay = t;
    document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
    if (t < 0.3) document.getElementById('btnDawn').classList.add('active');
    else if (t < 0.6) document.getElementById('btnDay').classList.add('active');
    else if (t < 0.8) document.getElementById('btnDusk').classList.add('active');
    else document.getElementById('btnNight').classList.add('active');
}

function toggleCinematic() {
    cinematicMode = !cinematicMode;
    document.getElementById('btnCinematic').classList.toggle('active', cinematicMode);
}

function takeScreenshot() {
    canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'medieval-world-' + Date.now() + '.png';
        a.click();
        URL.revokeObjectURL(url);
    });
}

function resetView() {
    camera.x = WORLD_SIZE_X / 2;
    camera.y = 60;
    camera.z = WORLD_SIZE_Z / 2 + 40;
    camera.pitch = -0.3;
    camera.yaw = Math.PI * 0.75;
    cinematicMode = false;
    document.getElementById('btnCinematic').classList.remove('active');
}

// Resize handler
function handleResize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

// Main initialization
async function init() {
    window.addEventListener('resize', handleResize);
    
    const success = await initWebGPU();
    if (!success) return;
    
    generateWorld();
    
    renderPipeline = await createPipeline();
    
    // Create uniform buffer
    uniformBuffer = gpuDevice.createBuffer({
        size: 256, // Enough for all uniforms
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });
    
    uniformBindGroup = gpuDevice.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [{
            binding: 0,
            resource: { buffer: uniformBuffer }
        }]
    });
    
    buildChunkMeshes();
    setupInput();
    
    loading.style.display = 'none';
    
    // Start with dramatic aerial view
    camera.x = WORLD_SIZE_X / 2;
    camera.y = 70;
    camera.z = WORLD_SIZE_Z / 2 + 50;
    camera.pitch = -0.5;
    camera.yaw = Math.PI * 0.75;
    
    // Auto-start cinematic for first impression
    setTimeout(() => {
        cinematicMode = true;
        document.getElementById('btnCinematic').classList.add('active');
        // Stop after 10 seconds
        setTimeout(() => {
            cinematicMode = false;
            document.getElementById('btnCinematic').classList.remove('active');
        }, 10000);
    }, 500);
    
    render();
}

init().catch(err => {
    console.error('Initialization failed:', err);
    loading.innerHTML = `<div style="color: red;">Error: ${err.message}</div>`;
});
    </script>
