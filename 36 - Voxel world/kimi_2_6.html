// SHADERS (WGSL)
// ============================================
const SHADOW_VERT = `
struct Uniforms {
  mvp: mat4x4f,
};
@binding(0) @group(0) var<uniform> u: Uniforms;

@vertex
fn main(@location(0) pos: vec3f) -> @builtin(position) vec4f {
  return u.mvp * vec4f(pos, 1.0);
}
`;

const SHADOW_FRAG = `
@fragment
fn main() -> @location(0) vec4f {
  return vec4f(1.0, 0.0, 0.0, 1.0);
}
`;

const MAIN_VERT = `
struct Camera {
  viewProj: mat4x4f,
  pos: vec4f,
  time: f32,
  sunDir: vec4f,
  sunColor: vec4f,
  ambient: f32,
  fogNear: f32,
  fogFar: f32,
  fogColor: vec4f,
};

struct Model {
  transform: mat4x4f,
};

@binding(0) @group(0) var<uniform> camera: Camera;
@binding(1) @group(0) var<uniform> model: Model;

struct VertexOutput {
  @builtin(position) position: vec4f,
  @location(0) worldPos: vec3f,
  @location(1) normal: vec3f,
  @location(2) color: vec3f,
  @location(3) blockId: f32,
  @location(4) ao: f32,
  @location(5) emissive: f32,
  @location(6) transparent: f32,
  @location(7) shadowPos: vec3f,
};

@vertex
fn main(
  @location(0) pos: vec3f,
  @location(1) normal: vec3f,
  @location(2) color: vec3f,
  @location(3) blockId: f32,
  @location(4) ao: f32,
  @location(5) emissive: f32,
  @location(6) transparent: f32
) -> VertexOutput {
  var out: VertexOutput;
  var worldPos = pos;

  // Water animation
  if (blockId == 12.0) {
    worldPos.y += sin(pos.x * 0.5 + camera.time * 2.0) * 0.1 + cos(pos.z * 0.3 + camera.time * 1.5) * 0.08;
  }

  // Lava pulse
  if (blockId == 13.0) {
    worldPos.y += sin(camera.time * 3.0 + pos.x * 0.2) * 0.05;
  }

  // Flag wave
  if (blockId == 132.0) {
    worldPos.x += sin(pos.y * 0.5 + camera.time * 4.0) * 0.2 * (pos.y * 0.1);
  }

  out.worldPos = worldPos;
  out.position = camera.viewProj * vec4f(worldPos, 1.0);
  out.normal = normal;
  out.color = color;
  out.blockId = blockId;
  out.ao = ao;
  out.emissive = emissive;
  out.transparent = transparent;
  out.shadowPos = worldPos; // Will be transformed in fragment
  return out;
}
`;

const MAIN_FRAG = `
struct Camera {
  viewProj: mat4x4f,
  pos: vec4f,
  time: f32,
  sunDir: vec4f,
  sunColor: vec4f,
  ambient: f32,
  fogNear: f32,
  fogFar: f32,
  fogColor: vec4f,
};

struct LightSpace {
  matrix: mat4x4f,
};

@binding(0) @group(0) var<uniform> camera: Camera;
@binding(1) @group(0) var<uniform> lightSpace: LightSpace;
@binding(2) @group(0) var shadowMap: texture_depth_2d;
@binding(3) @group(0) var shadowSampler: sampler_comparison;

fn sampleShadow(shadowPos: vec3f) -> f32 {
  let projCoords = shadowPos * 0.5 + 0.5;
  if (projCoords.x < 0.0 || projCoords.x > 1.0 || projCoords.y < 0.0 || projCoords.y > 1.0 || projCoords.z < 0.0 || projCoords.z > 1.0) {
    return 1.0;
  }

  var shadow = 0.0;
  let texelSize = 1.0 / 2048.0;
  for (var x = -1; x <= 1; x++) {
    for (var y = -1; y <= 1; y++) {
      shadow += textureSampleCompare(shadowMap, shadowSampler, projCoords.xy + vec2f(f32(x), f32(y)) * texelSize, projCoords.z - 0.005);
    }
  }
  return shadow / 9.0;
}

@fragment
fn main(
  @location(0) worldPos: vec3f,
  @location(1) normal: vec3f,
  @location(2) color: vec3f,
  @location(3) blockId: f32,
  @location(4) ao: f32,
  @location(5) emissive: f32,
  @location(6) transparent: f32,
  @location(7) shadowPos: vec3f
) -> @location(0) vec4f {
  let N = normalize(normal);
  let L = normalize(-camera.sunDir.xyz);
  let V = normalize(camera.pos.xyz - worldPos);
  let H = normalize(L + V);

  // Diffuse
  let diff = max(dot(N, L), 0.0);

  // Specular
  let spec = pow(max(dot(N, H), 0.0), 32.0) * 0.3;

  // Shadow
  let shadowPosLS = lightSpace.matrix * vec4f(worldPos, 1.0);
  let shadow = sampleShadow(shadowPosLS.xyz / shadowPosLS.w);

  // Lighting
  var lit = color * (camera.ambient + diff * shadow * camera.sunColor.rgb);
  lit += vec3f(spec * shadow);

  // Emissive
  if (emissive > 0.5) {
    let flicker = 1.0 + sin(camera.time * 10.0 + worldPos.x * 3.0) * 0.1;
    lit += color * 2.0 * flicker;
  }

  // Water special handling
  if (blockId == 12.0) {
    lit = mix(lit, vec3f(0.2, 0.4, 0.6), 0.3);
    lit += vec3f(0.1, 0.2, 0.3) * (1.0 - dot(V, N));
  }

  // Lava glow
  if (blockId == 13.0) {
    let pulse = 1.0 + sin(camera.time * 2.0 + worldPos.x) * 0.2;
    lit += vec3f(0.8, 0.3, 0.05) * pulse;
  }

  // Window glow at night
  if (blockId == 79.0) {
    let nightGlow = 1.0 - camera.sunColor.r;
    lit += vec3f(0.9, 0.7, 0.3) * nightGlow * 2.0;
  }

  // Fog
  let dist = length(camera.pos.xyz - worldPos);
  let fogFactor = clamp((dist - camera.fogNear) / (camera.fogFar - camera.fogNear), 0.0, 1.0);
  lit = mix(lit, camera.fogColor.rgb, fogFactor);

  // Atmospheric perspective
  let atmos = exp(-dist * 0.002);
  lit = mix(camera.fogColor.rgb * 0.8, lit, atmos);

  // Alpha for transparent blocks
  var alpha = 1.0;
  if (transparent > 0.5) {
    if (blockId == 12.0) alpha = 0.7;
    else if (blockId == 19.0) alpha = 0.4;
    else if (blockId == 79.0) alpha = 0.6;
    else alpha = 0.85;
  }

  return vec4f(lit, alpha);
}
`;

const POST_VERT = `
@vertex
fn main(@builtin(vertex_index) idx: u32) -> @builtin(position) vec4f {
  let pos = array<vec2f, 4>(
    vec2f(-1.0, -1.0), vec2f(1.0, -1.0),
    vec2f(-1.0, 1.0), vec2f(1.0, 1.0)
  );
  return vec4f(pos[idx], 0.0, 1.0);
}
`;

const BLOOM_EXTRACT_FRAG = `
@group(0) @binding(0) var srcTex: texture_2d<f32>;
@group(0) @binding(1) var srcSampler: sampler;

@fragment
fn main(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let uv = pos.xy / vec2f(textureDimensions(srcTex));
  let color = textureSample(srcTex, srcSampler, uv).rgb;
  let brightness = dot(color, vec3f(0.2126, 0.7152, 0.0722));
  if (brightness > 0.8) {
    return vec4f(color, 1.0);
  }
  return vec4f(0.0, 0.0, 0.0, 1.0);
}
`;

const BLUR_FRAG = `
@group(0) @binding(0) var srcTex: texture_2d<f32>;
@group(0) @binding(1) var srcSampler: sampler;
@group(0) @binding(2) var<uniform> dir: vec2f;

@fragment
fn main(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let uv = pos.xy / vec2f(textureDimensions(srcTex));
  let texel = 1.0 / vec2f(textureDimensions(srcTex));

  var result = vec3f(0.0);
  let weights = array<f32, 5>(0.227027, 0.1945946, 0.1216216, 0.054054, 0.016216);

  result += textureSample(srcTex, srcSampler, uv).rgb * weights[0];
  for (var i = 1; i < 5; i++) {
    let offset = dir * texel * f32(i);
    result += textureSample(srcTex, srcSampler, uv + offset).rgb * weights[i];
    result += textureSample(srcTex, srcSampler, uv - offset).rgb * weights[i];
  }

  return vec4f(result, 1.0);
}
`;

const COMPOSITE_FRAG = `
@group(0) @binding(0) var sceneTex: texture_2d<f32>;
@group(0) @binding(1) var sceneSampler: sampler;
@group(0) @binding(2) var bloomTex: texture_2d<f32>;
@group(0) @binding(3) var bloomSampler: sampler;
@group(0) @binding(4) var<uniform> bloomIntensity: f32;

fn acesToneMapping(color: vec3f) -> vec3f {
  let a = 2.51;
  let b = 0.03;
  let c = 2.43;
  let d = 0.59;
  let e = 0.14;
  return clamp((color * (a * color + b)) / (color * (c * color + d) + e), vec3f(0.0), vec3f(1.0));
}

@fragment
fn main(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let uv = pos.xy / vec2f(textureDimensions(sceneTex));
  let scene = textureSample(sceneTex, sceneSampler, uv).rgb;
  let bloom = textureSample(bloomTex, bloomSampler, uv).rgb;

  var color = scene + bloom * bloomIntensity;

  // Tone mapping
  color = acesToneMapping(color);

  // Vignette
  let center = uv - 0.5;
  let vignette = 1.0 - dot(center, center) * 0.8;
  color *= vignette;

  // Slight contrast
  color = pow(color, vec3f(0.95));

  return vec4f(color, 1.0);
}
`;

// ============================================
// CAMERA
// ============================================
class Camera {
  constructor() {
    this.pos = Vec3.create(WORLD_SIZE_X * 0.35, 80, WORLD_SIZE_Z * 0.45);
    this.yaw = -Math.PI / 2;
    this.pitch = -0.4;
    this.fov = Math.PI / 3;
    this.near = 0.1;
    this.far = 400;
    this.mode = 'walk'; // walk, fly, orbit
    this.orbitDist = 120;
    this.orbitTarget = Vec3.create(WORLD_SIZE_X * 0.5, 30, WORLD_SIZE_Z * 0.5);
    this.orbitYaw = 0;
    this.orbitPitch = -0.5;
    this.velocity = Vec3.create();
    this.grounded = false;
    this.height = 1.8;
    this.speed = 15;
  }

  getViewProj(aspect) {
    const proj = Mat4.create();
    Mat4.perspective(proj, this.fov, aspect, this.near, this.far);

    const view = Mat4.create();
    if (this.mode === 'orbit') {
      const x = this.orbitTarget[0] + Math.cos(this.orbitYaw) * Math.cos(this.orbitPitch) * this.orbitDist;
      const y = this.orbitTarget[1] + Math.sin(this.orbitPitch) * this.orbitDist;
      const z = this.orbitTarget[2] + Math.sin(this.orbitYaw) * Math.cos(this.orbitPitch) * this.orbitDist;
      Mat4.lookAt(view, Vec3.create(x, y, z), this.orbitTarget, Vec3.create(0, 1, 0));
      Vec3.copy(Vec3.create(x, y, z), this.pos);
    } else {
      const forward = Vec3.create(
        Math.cos(this.pitch) * Math.sin(this.yaw),
        Math.sin(this.pitch),
        Math.cos(this.pitch) * Math.cos(this.yaw)
      );
      const target = Vec3.create(
        this.pos[0] + forward[0],
        this.pos[1] + forward[1],
        this.pos[2] + forward[2]
      );
      Mat4.lookAt(view, this.pos, target, Vec3.create(0, 1, 0));
    }

    const vp = Mat4.create();
    Mat4.multiply(proj, view, vp);
    return vp;
  }

  update(dt, keys, world) {
    if (this.mode === 'orbit') {
      if (keys['ArrowLeft'] || keys['a']) this.orbitYaw -= dt * 0.5;
      if (keys['ArrowRight'] || keys['d']) this.orbitYaw += dt * 0.5;
      if (keys['ArrowUp'] || keys['w']) this.orbitPitch = Math.min(this.orbitPitch + dt * 0.3, Math.PI / 2 - 0.1);
      if (keys['ArrowDown'] || keys['s']) this.orbitPitch = Math.max(this.orbitPitch - dt * 0.3, -Math.PI / 2 + 0.1);
      if (keys['q']) this.orbitDist = Math.max(this.orbitDist - dt * 20, 10);
      if (keys['e']) this.orbitDist = Math.min(this.orbitDist + dt * 20, 300);
      return;
    }

    const forward = Vec3.create(Math.sin(this.yaw), 0, Math.cos(this.yaw));
    const right = Vec3.create(Math.sin(this.yaw + Math.PI / 2), 0, Math.cos(this.yaw + Math.PI / 2));

    const move = Vec3.create();
    if (keys['w'] || keys['ArrowUp']) Vec3.add(move, forward, move);
    if (keys['s'] || keys['ArrowDown']) Vec3.sub(move, forward, move);
    if (keys['a'] || keys['ArrowLeft']) Vec3.sub(move, right, move);
    if (keys['d'] || keys['ArrowRight']) Vec3.add(move, right, move);

    if (Vec3.len(move) > 0) {
      Vec3.norm(move, move);
      Vec3.mul(move, this.speed, move);

      if (this.mode === 'walk') {
        move[1] = this.velocity[1];
        this.velocity[1] -= 30 * dt; // gravity
        if (keys[' '] && this.grounded) {
          this.velocity[1] = 8;
          this.grounded = false;
        }
      } else {
        if (keys[' ']) move[1] += this.speed;
        if (keys['Shift']) move[1] -= this.speed;
      }

      // Apply with collision
      const newPos = Vec3.create(
        this.pos[0] + move[0] * dt,
        this.pos[1] + move[1] * dt,
        this.pos[2] + move[2] * dt
      );

      // Simple collision
      const bx = Math.floor(newPos[0]);
      const by = Math.floor(newPos[1]);
      const bz = Math.floor(newPos[2]);

      if (world.getBlock(bx, by, bz) !== BLOCK.AIR && !TRANSPARENT_BLOCKS.has(world.getBlock(bx, by, bz))) {
        if (this.mode === 'walk') {
          if (move[1] < 0) {
            newPos[1] = by + 1;
            this.velocity[1] = 0;
            this.grounded = true;
          }
        }
      } else {
        this.grounded = false;
      }

      this.pos[0] = Math.max(2, Math.min(WORLD_SIZE_X - 2, newPos[0]));
      this.pos[1] = Math.max(2, Math.min(WORLD_HEIGHT - 2, newPos[1]));
      this.pos[2] = Math.max(2, Math.min(WORLD_SIZE_Z - 2, newPos[2]));
    }
  }
}

// ============================================
// RENDERER
// ============================================
class Renderer {
  constructor() {
    this.canvas = document.getElementById('canvas');
    this.device = null;
    this.context = null;
    this.format = 'bgra8unorm';
    this.bloomEnabled = true;
    this.bloomIntensity = 0.5;
  }

  async init() {
    if (!navigator.gpu) throw new Error('WebGPU not supported');

    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('No adapter found');

    this.device = await adapter.requestDevice();
    this.context = this.canvas.getContext('webgpu');
    this.format = navigator.gpu.getPreferredCanvasFormat();

    this.context.configure({
      device: this.device,
      format: this.format,
      alphaMode: 'opaque',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC
    });

    this.resize();
    window.addEventListener('resize', () => this.resize());

    await this.createPipelines();
    this.createBuffers();
  }

  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    this.createTextures();
  }

  createTextures() {
    const w = this.canvas.width;
    const h = this.canvas.height;

    this.sceneTexture = this.device.createTexture({
      size: [w, h],
      format: 'rgba16float',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
    });

    this.depthTexture = this.device.createTexture({
      size: [w, h],
      format: 'depth32float',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
    });

    // Bloom textures (half res)
    this.bloomTextures = [];
    for (let i = 0; i < 4; i++) {
      const bw = Math.max(1, Math.floor(w / (2 * (i + 1))));
      const bh = Math.max(1, Math.floor(h / (2 * (i + 1))));
      this.bloomTextures.push(this.device.createTexture({
        size: [bw, bh],
        format: 'rgba16float',
        usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
      }));
    }

    // Shadow map
    this.shadowTexture = this.device.createTexture({
      size: [2048, 2048],
      format: 'depth32float',
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING
    });
  }

  async createPipelines() {
    // Shadow pipeline
    const shadowShader = this.device.createShaderModule({ code: SHADOW_VERT });
    const shadowFragShader = this.device.createShaderModule({ code: SHADOW_FRAG });

    this.shadowPipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: shadowShader,
        entryPoint: 'main',
        buffers: [{
          arrayStride: 12 * 4,
          attributes: [
            { shaderLocation: 0, offset: 0, format: 'float32x3' }
          ]
        }]
      },
      fragment: {
        module: shadowFragShader,
        entryPoint: 'main',
        targets: [{ format: 'rgba8unorm' }]
      },
      primitive: { topology: 'triangle-list', cullMode: 'back' },
      depthStencil: {
        depthWriteEnabled: true,
        depthCompare: 'less',
        format: 'depth32float'
      }
    });

    // Main pipeline
    const mainVertShader = this.device.createShaderModule({ code: MAIN_VERT });
    const mainFragShader = this.device.createShaderModule({ code: MAIN_FRAG });

    this.mainPipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: {
        module: mainVertShader,
        entryPoint: 'main',
        buffers: [{
          arrayStride: 12 * 4,
          attributes: [
            { shaderLocation: 0, offset: 0, format: 'float32x3' },
            { shaderLocation: 1, offset: 3 * 4, format: 'float32x3' },
            { shaderLocation: 2, offset: 6 * 4, format: 'float32x3' },
            { shaderLocation: 3, offset: 9 * 4, format: 'float32' },
            { shaderLocation: 4, offset: 10 * 4, format: 'float32' },
            { shaderLocation: 5, offset: 11 * 4, format: 'float32' },
            { shaderLocation: 6, offset: 12 * 4, format: 'float32' }
          ]
        }]
      },
      fragment: {
        module: mainFragShader,
        entryPoint: 'main',
        targets: [
          { format: 'rgba16float', blend: { color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha' }, alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha' } } }
        ]
      },
      primitive: { topology: 'triangle-list', cullMode: 'back' },
      depthStencil: {
        depthWriteEnabled: true,
        depthCompare: 'less',
        format: 'depth32float'
      }
    });

    // Post-processing pipelines
    const postVertShader = this.device.createShaderModule({ code: POST_VERT });

    const bloomExtractShader = this.device.createShaderModule({ code: BLOOM_EXTRACT_FRAG });
    this.bloomExtractPipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: postVertShader, entryPoint: 'main' },
      fragment: { module: bloomExtractShader, entryPoint: 'main', targets: [{ format: 'rgba16float' }] },
      primitive: { topology: 'triangle-strip' }
    });

    const blurShader = this.device.createShaderModule({ code: BLUR_FRAG });
    this.blurPipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: postVertShader, entryPoint: 'main' },
      fragment: { module: blurShader, entryPoint: 'main', targets: [{ format: 'rgba16float' }] },
      primitive: { topology: 'triangle-strip' }
    });

    const compositeShader = this.device.createShaderModule({ code: COMPOSITE_FRAG });
    this.compositePipeline = this.device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: postVertShader, entryPoint: 'main' },
      fragment: { module: compositeShader, entryPoint: 'main', targets: [{ format: this.format }] },
      primitive: { topology: 'triangle-strip' }
    });
  }

  createBuffers() {
    // Uniform buffers
    this.cameraBuffer = this.device.createBuffer({
      size: 80 * 4,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    this.modelBuffer = this.device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    this.lightSpaceBuffer = this.device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    this.bloomIntensityBuffer = this.device.createBuffer({
      size: 4,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    // Full screen quad (implicit in post shaders)

    // Samplers
    this.linearSampler = this.device.createSampler({
      magFilter: 'linear',
      minFilter: 'linear',
      addressModeU: 'clamp-to-edge',
      addressModeV: 'clamp-to-edge'
    });

    this.shadowSampler = this.device.createSampler({
      compare: 'less',
      magFilter: 'linear',
      minFilter: 'linear',
      addressModeU: 'clamp-to-edge',
      addressModeV: 'clamp-to-edge'
    });
  }

  createChunkBuffers(chunkData) {
    if (!chunkData || chunkData.vertices.length === 0) return null;

    const vb = this.device.createBuffer({
      size: chunkData.vertices.byteLength,
      usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
    });
    this.device.queue.writeBuffer(vb, 0, chunkData.vertices);

    const ib = this.device.createBuffer({
      size: chunkData.indices.byteLength,
      usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST
    });
    this.device.queue.writeBuffer(ib, 0, chunkData.indices);

    return { vb, ib, count: chunkData.indices.length };
  }

  render(timeOfDay, camera, chunks) {
    const w = this.canvas.width;
    const h = this.canvas.height;
    const aspect = w / h;

    // Time of day parameters
    let sunDir, sunColor, ambient, fogColor, fogNear, fogFar;
    switch(timeOfDay) {
      case 'dawn':
        sunDir = [0.3, 0.2, -0.9];
        sunColor = [1.0, 0.6, 0.3];
        ambient = 0.3;
        fogColor = [0.7, 0.5, 0.4];
        fogNear = 80; fogFar = 250;
        break;
      case 'day':
        sunDir = [0.2, 0.8, -0.5];
        sunColor = [1.0, 0.95, 0.85];
        ambient = 0.4;
        fogColor = [0.6, 0.7, 0.8];
        fogNear = 100; fogFar = 300;
        break;
      case 'dusk':
        sunDir = [-0.3, 0.15, -0.9];
        sunColor = [0.9, 0.4, 0.2];
        ambient = 0.25;
        fogColor = [0.5, 0.3, 0.25];
        fogNear = 60; fogFar = 200;
        break;
      case 'night':
        sunDir = [0.1, -0.3, -0.9];
        sunColor = [0.2, 0.3, 0.5];
        ambient = 0.15;
        fogColor = [0.05, 0.05, 0.1];
        fogNear = 40; fogFar = 180;
        break;
    }

    // Light space matrix for shadows
    const lightProj = Mat4.create();
    Mat4.ortho(lightProj, -150, 150, -150, 150, 1, 300);
    const lightView = Mat4.create();
    const lightPos = Vec3.create(-sunDir[0] * 100, -sunDir[1] * 100, -sunDir[2] * 100);
    Mat4.lookAt(lightView, lightPos, Vec3.create(WORLD_SIZE_X * 0.5, 0, WORLD_SIZE_Z * 0.5), Vec3.create(0, 1, 0));
    const lightSpace = Mat4.create();
    Mat4.multiply(lightProj, lightView, lightSpace);

    // Camera matrix
    const vp = camera.getViewProj(aspect);

    // Update uniform buffers
    const cameraData = new Float32Array(80);
    cameraData.set(vp, 0);
    cameraData.set(camera.pos, 16);
    cameraData[19] = 1.0;
    cameraData[20] = performance.now() / 1000;
    cameraData.set(sunDir, 24);
    cameraData[27] = 0;
    cameraData.set(sunColor, 28);
    cameraData[31] = 1;
    cameraData[32] = ambient;
    cameraData[33] = fogNear;
    cameraData[34] = fogFar;
    cameraData.set(fogColor, 36);
    cameraData[39] = 1;
    this.device.queue.writeBuffer(this.cameraBuffer, 0, cameraData);

    const modelData = new Float32Array(16);
    Mat4.identity(modelData);
    this.device.queue.writeBuffer(this.modelBuffer, 0, modelData);

    this.device.queue.writeBuffer(this.lightSpaceBuffer, 0, new Float32Array(lightSpace));

    // Shadow pass
    const shadowPass = this.device.createCommandEncoder();
    const shadowRender = shadowPass.beginRenderPass({
      colorAttachments: [],
      depthStencilAttachment: {
        view: this.shadowTexture.createView(),
        depthClearValue: 1.0,
        depthLoadOp: 'clear',
        depthStoreOp: 'store'
      }
    });

    const shadowBind = this.device.createBindGroup({
      layout: this.shadowPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: this.lightSpaceBuffer } }
      ]
    });

    shadowRender.setPipeline(this.shadowPipeline);
    shadowRender.setBindGroup(0, shadowBind);

    for (const chunk of chunks) {
      if (!chunk.gpu) continue;
      shadowRender.setVertexBuffer(0, chunk.gpu.vb);
      shadowRender.setIndexBuffer(chunk.gpu.ib, 'uint32');
      shadowRender.drawIndexed(chunk.gpu.count);
    }
    shadowRender.end();
    this.device.queue.submit([shadowPass.finish()]);

    // Main pass
    const mainEncoder = this.device.createCommandEncoder();
    const mainPass = mainEncoder.beginRenderPass({
      colorAttachments: [{
        view: this.sceneTexture.createView(),
        clearValue: { r: fogColor[0], g: fogColor[1], b: fogColor[2], a: 1 },
        loadOp: 'clear',
        storeOp: 'store'
      }],
      depthStencilAttachment: {
        view: this.depthTexture.createView(),
        depthClearValue: 1.0,
        depthLoadOp: 'clear',
        depthStoreOp: 'store'
      }
    });

    const mainBind = this.device.createBindGroup({
      layout: this.mainPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: this.cameraBuffer } },
        { binding: 1, resource: { buffer: this.modelBuffer } },
        { binding: 2, resource: this.shadowTexture.createView() },
        { binding: 3, resource: this.shadowSampler }
      ]
    });

    mainPass.setPipeline(this.mainPipeline);
    mainPass.setBindGroup(0, mainBind);

    for (const chunk of chunks) {
      if (!chunk.gpu) continue;
      mainPass.setVertexBuffer(0, chunk.gpu.vb);
      mainPass.setIndexBuffer(chunk.gpu.ib, 'uint32');
      mainPass.drawIndexed(chunk.gpu.count);
    }
    mainPass.end();
    this.device.queue.submit([mainEncoder.finish()]);

    // Post-processing
    if (this.bloomEnabled) {
      this.renderBloom();
    }

    this.renderComposite();
  }

  renderBloom() {
    // Extract bright
    const enc1 = this.device.createCommandEncoder();
    const pass1 = enc1.beginRenderPass({
      colorAttachments: [{
        view: this.bloomTextures[0].createView(),
        loadOp: 'clear',
        storeOp: 'store',
        clearValue: { r: 0, g: 0, b: 0, a: 1 }
      }]
    });

    const extractBind = this.device.createBindGroup({
      layout: this.bloomExtractPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: this.sceneTexture.createView() },
        { binding: 1, resource: this.linearSampler }
      ]
    });

    pass1.setPipeline(this.bloomExtractPipeline);
    pass1.setBindGroup(0, extractBind);
    pass1.draw(4);
    pass1.end();
    this.device.queue.submit([enc1.finish()]);

    // Blur passes
    for (let i = 0; i < 2; i++) {
      // Horizontal
      const encH = this.device.createCommandEncoder();
      const passH = encH.beginRenderPass({
        colorAttachments: [{
          view: this.bloomTextures[1].createView(),
          loadOp: 'clear',
          storeOp: 'store',
          clearValue: { r: 0, g: 0, b: 0, a: 1 }
        }]
      });

      const dirBufferH = this.device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      this.device.queue.writeBuffer(dirBufferH, 0, new Float32Array([1, 0]));

      const blurBindH = this.device.createBindGroup({
        layout: this.blurPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: this.bloomTextures[0].createView() },
          { binding: 1, resource: this.linearSampler },
          { binding: 2, resource: { buffer: dirBufferH } }
        ]
      });

      passH.setPipeline(this.blurPipeline);
      passH.setBindGroup(0, blurBindH);
      passH.draw(4);
      passH.end();
      this.device.queue.submit([encH.finish()]);

      // Vertical
      const encV = this.device.createCommandEncoder();
      const passV = encV.beginRenderPass({
        colorAttachments: [{
          view: this.bloomTextures[0].createView(),
          loadOp: 'clear',
          storeOp: 'store',
          clearValue: { r: 0, g: 0, b: 0, a: 1 }
        }]
      });

      const dirBufferV = this.device.createBuffer({ size: 8, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      this.device.queue.writeBuffer(dirBufferV, 0, new Float32Array([0, 1]));

      const blurBindV = this.device.createBindGroup({
        layout: this.blurPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: this.bloomTextures[1].createView() },
          { binding: 1, resource: this.linearSampler },
          { binding: 2, resource: { buffer: dirBufferV } }
        ]
      });

      passV.setPipeline(this.blurPipeline);
      passV.setBindGroup(0, blurBindV);
      passV.draw(4);
      passV.end();
      this.device.queue.submit([encV.finish()]);
    }
  }

  renderComposite() {
    this.device.queue.writeBuffer(this.bloomIntensityBuffer, 0, new Float32Array([this.bloomIntensity]));

    const enc = this.device.createCommandEncoder();
    const pass = enc.beginRenderPass({
      colorAttachments: [{
        view: this.context.getCurrentTexture().createView(),
        loadOp: 'clear',
        storeOp: 'store',
        clearValue: { r: 0, g: 0, b: 0, a: 1 }
      }]
    });

    const compositeBind = this.device.createBindGroup({
      layout: this.compositePipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: this.sceneTexture.createView() },
        { binding: 1, resource: this.linearSampler },
        { binding: 2, resource: this.bloomTextures[0].createView() },
        { binding: 3, resource: this.linearSampler },
        { binding: 4, resource: { buffer: this.bloomIntensityBuffer } }
      ]
    });

    pass.setPipeline(this.compositePipeline);
    pass.setBindGroup(0, compositeBind);
    pass.draw(4);
    pass.end();
    this.device.queue.submit([enc.finish()]);
  }
}

// ============================================
// APP
// ============================================
class App {
  constructor() {
    this.world = new VoxelWorld();
    this.renderer = new Renderer();
    this.camera = new Camera();
    this.timeOfDay = 'day';
    this.keys = {};
    this.chunks = [];
    this.mouseX = 0;
    this.mouseY = 0;
    this.mouseLocked = false;
    this.lastTime = 0;
    this.fps = 0;
    this.frameCount = 0;
    this.fpsTime = 0;
  }

  async init() {
    // Update loading
    const loadingFill = document.getElementById('loading-fill');
    const loadingText = document.getElementById('loading-text');

    loadingFill.style.width = '10%';
    loadingText.textContent = 'Generating terrain...';

    // Generate world
    const { riverPath } = generateTerrain(this.world);
    loadingFill.style.width = '30%';
    loadingText.textContent = 'Building castle...';

    generateCastle(this.world, Math.floor(WORLD_SIZE_X * 0.35), Math.floor(WORLD_SIZE_Z * 0.45));
    loadingFill.style.width = '45%';
    loadingText.textContent = 'Building village...';

    generateVillage(this.world, riverPath);
    loadingFill.style.width = '60%';
    loadingText.textContent = 'Forging volcano...';

    generateVolcano(this.world);
    loadingFill.style.width = '70%';
    loadingText.textContent = 'Planting forests...';

    generateTrees(this.world);
    loadingFill.style.width = '80%';
    loadingText.textContent = 'Adding details...';

    generateDetails(this.world);
    loadingFill.style.width = '85%';
    loadingText.textContent = 'Initializing WebGPU...';

    await this.renderer.init();
    loadingFill.style.width = '90%';
    loadingText.textContent = 'Building meshes...';

    // Generate chunk meshes
    let processed = 0;
    const totalChunks = WORLD_CHUNKS_X * WORLD_CHUNKS_Y * WORLD_CHUNKS_Z;

    for (let cx = 0; cx < WORLD_CHUNKS_X; cx++) {
      for (let cy = 0; cy < WORLD_CHUNKS_Y; cy++) {
        for (let cz = 0; cz < WORLD_CHUNKS_Z; cz++) {
          const chunkData = generateChunkMesh(this.world, cx, cy, cz);
          if (chunkData) {
            const gpu = this.renderer.createChunkBuffers(chunkData);
            if (gpu) {
              this.chunks.push({ cx, cy, cz, gpu });
            }
          }
          processed++;
          if (processed % 10 === 0) {
            loadingFill.style.width = `${90 + (processed / totalChunks) * 8}%`;
          }
        }
      }
    }

    loadingFill.style.width = '98%';
    loadingText.textContent = 'Ready...';

    // Setup input
    this.setupInput();

    // Hide loading
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('ui').classList.add('visible');
        document.getElementById('controls-hint').classList.add('visible');
      }, 1000);
    }, 500);

    // Start loop
    requestAnimationFrame((t) => this.loop(t));
  }

  setupInput() {
    window.addEventListener('keydown', (e) => {
      this.keys[e.key.toLowerCase()] = true;
      if (e.key === 'Escape') {
        this.mouseLocked = false;
        document.exitPointerLock();
      }
    });

    window.addEventListener('keyup', (e) => {
      this.keys[e.key.toLowerCase()] = false;
    });

    this.renderer.canvas.addEventListener('click', () => {
      if (!this.mouseLocked) {
        this.renderer.canvas.requestPointerLock();
      }
    });

    document.addEventListener('pointerlockchange', () => {
      this.mouseLocked = document.pointerLockElement === this.renderer.canvas;
    });

    document.addEventListener('mousemove', (e) => {
      if (this.mouseLocked) {
        const sensitivity = 0.002;
        this.camera.yaw -= e.movementX * sensitivity;
        this.camera.pitch -= e.movementY * sensitivity;
        this.camera.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, this.camera.pitch));
      }
    });

    // Orbit mode mouse
    let orbitDragging = false;
    let lastOrbitX = 0, lastOrbitY = 0;

    this.renderer.canvas.addEventListener('mousedown', (e) => {
      if (this.camera.mode === 'orbit') {
        orbitDragging = true;
        lastOrbitX = e.clientX;
        lastOrbitY = e.clientY;
      }
    });

    window.addEventListener('mouseup', () => { orbitDragging = false; });

    window.addEventListener('mousemove', (e) => {
      if (this.camera.mode === 'orbit' && orbitDragging) {
        const dx = e.clientX - lastOrbitX;
        const dy = e.clientY - lastOrbitY;
        this.camera.orbitYaw += dx * 0.005;
        this.camera.orbitPitch += dy * 0.005;
        this.camera.orbitPitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, this.camera.orbitPitch));
        lastOrbitX = e.clientX;
        lastOrbitY = e.clientY;
      }
    });

    // Scroll for orbit distance
    this.renderer.canvas.addEventListener('wheel', (e) => {
      if (this.camera.mode === 'orbit') {
        this.camera.orbitDist = Math.max(10, Math.min(300, this.camera.orbitDist + e.deltaY * 0.1));
      }
    });
  }

  setTime(time) {
    this.timeOfDay = time;
    document.querySelectorAll('#ui button').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${time}`).classList.add('active');
  }

  setMode(mode) {
    this.camera.mode = mode;
    document.querySelectorAll('#ui button').forEach(b => {
      if (b.id === 'btn-fly' || b.id === 'btn-walk' || b.id === 'btn-orbit') b.classList.remove('active');
    });
    document.getElementById(`btn-${mode}`).classList.add('active');

    if (mode === 'orbit') {
      this.camera.orbitTarget = Vec3.create(this.camera.pos[0], this.camera.pos[1], this.camera.pos[2]);
    }
  }

  toggleBloom() {
    this.renderer.bloomEnabled = !this.renderer.bloomEnabled;
    document.getElementById('btn-bloom').classList.toggle('active');
  }

  screenshot() {
    const link = document.createElement('a');
    link.download = `realm-of-voxels-${Date.now()}.png`;
    link.href = this.renderer.canvas.toDataURL('image/png');
    link.click();
  }

  loop(time) {
    const dt = Math.min((time - this.lastTime) / 1000, 0.05);
    this.lastTime = time;

    // FPS
    this.frameCount++;
    if (time - this.fpsTime > 1000) {
      this.fps = this.frameCount;
      this.frameCount = 0;
      this.fpsTime = time;
      document.getElementById('fps').textContent = `${this.fps} FPS`;
    }

    // Update camera
    this.camera.update(dt, this.keys, this.world);

    // Render
    this.renderer.render(this.timeOfDay, this.camera, this.chunks);

    requestAnimationFrame((t) => this.loop(t));
  }
}

// Start
const app = new App();
app.init().catch(err => {
  console.error(err);
  document.getElementById('loading-text').textContent = 'Error: ' + err.message;
  document.getElementById('loading-text').style.color = '#ff4444';
});

window.app = app;
</script>
</body>
