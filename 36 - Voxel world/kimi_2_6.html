<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realm of Voxels — Cinematic Medieval Fantasy World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #loading {
    position: fixed; inset: 0; background: #0a0a0f; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 1000; transition: opacity 1s;
  }
  #loading h1 { font-size: 2.5rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 1rem;
    background: linear-gradient(90deg, #c9a227, #e8d5a3, #c9a227); -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; animation: shimmer 3s infinite linear; background-size: 200%;
  }
  @keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }
  #loading-bar { width: 300px; height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-top: 20px; }
  #loading-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #c9a227, #e8d5a3); transition: width 0.3s; }
  #loading-text { margin-top: 12px; font-size: 0.85rem; color: #888; letter-spacing: 0.1em; }
  #ui {
    position: fixed; top: 16px; left: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none; opacity: 0; transition: opacity 1s 0.5s;
  }
  #ui.visible { opacity: 1; }
  .ui-group {
    background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 12px; pointer-events: auto; min-width: 220px;
  }
  .ui-group h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: #888; margin-bottom: 8px; }
  .btn-row { display: flex; gap: 4px; flex-wrap: wrap; }
  button {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #ccc;
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; transition: all 0.2s;
    letter-spacing: 0.05em;
  }
  button:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); color: #fff; }
  button.active { background: rgba(201, 162, 39, 0.2); border-color: rgba(201, 162, 39, 0.5); color: #e8d5a3; }
  #fps { position: fixed; bottom: 16px; right: 16px; font-size: 0.75rem; color: #666; z-index: 100; }
  #controls-hint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,15,0.7); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 20px;
    font-size: 0.7rem; color: #888; letter-spacing: 0.05em; border: 1px solid rgba(255,255,255,0.05);
    z-index: 100; opacity: 0; transition: opacity 1s 1s; pointer-events: none;
  }
  #controls-hint.visible { opacity: 1; }
  .key { display: inline-block; background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.12); font-family: monospace; color: #aaa; margin: 0 2px;
  }
</style>
</head>
<body>
<div id="loading">
  <h1>Realm of Voxels</h1>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <div id="loading-text">Forging world...</div>
</div>

<div id="ui">
  <div class="ui-group">
    <h3>Time of Day</h3>
    <div class="btn-row">
      <button id="btn-dawn" onclick="app.setTime('dawn')">Dawn</button>
      <button id="btn-day" class="active" onclick="app.setTime('day')">Day</button>
      <button id="btn-dusk" onclick="app.setTime('dusk')">Dusk</button>
      <button id="btn-night" onclick="app.setTime('night')">Night</button>
    </div>
  </div>
  <div class="ui-group">
    <h3>Camera Mode</h3>
    <div class="btn-row">
      <button id="btn-fly" onclick="app.setMode('fly')">Fly</button>
      <button id="btn-walk" class="active" onclick="app.setMode('walk')">Walk</button>
      <button id="btn-orbit" onclick="app.setMode('orbit')">Orbit</button>
    </div>
  </div>
  <div class="ui-group">
    <h3>Capture</h3>
    <div class="btn-row">
      <button onclick="app.screenshot()">Screenshot</button>
      <button id="btn-bloom" class="active" onclick="app.toggleBloom()">Bloom</button>
    </div>
  </div>
</div>

<div id="controls-hint">
  <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move &nbsp;
  <span class="key">Space</span> Up &nbsp;
  <span class="key">Shift</span> Down &nbsp;
  <span class="key">Mouse</span> Look &nbsp;
  <span class="key">Click</span> Lock &nbsp;
  <span class="key">Esc</span> Unlock
</div>

<div id="fps">-- FPS</div>

<canvas id="canvas"></canvas>

  sub: (a,b,out) => { out[0]=a[0]-b[0]; out[1]=a[1]-b[1]; out[2]=a[2]-b[2]; return out; },
  mul: (a,s,out) => { out[0]=a[0]*s; out[1]=a[1]*s; out[2]=a[2]*s; return out; },
  dot: (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross: (a,b,out) => { out[0]=a[1]*b[2]-a[2]*b[1]; out[1]=a[2]*b[0]-a[0]*b[2]; out[2]=a[0]*b[1]-a[1]*b[0]; return out; },

  dist: (a,b) => { const dx=a[0]-b[0],dy=a[1]-b[1],dz=a[2]-b[2]; return Math.sqrt(dx*dx+dy*dy+dz*dz); },
  lerp: (a,b,t,out) => { out[0]=a[0]+(b[0]-a[0])*t; out[1]=a[1]+(b[1]-a[1])*t; out[2]=a[2]+(b[2]-a[2])*t; return out; },
  copy: (a,out) => { out[0]=a[0]; out[1]=a[1]; out[2]=a[2]; return out; }
};

// ============================================
// NOISE
// ============================================
function hash2(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}
function hash3(x, y, z) {
  let h = x * 374761393 + y * 668265263 + z * 208644480;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) & 0x7fffffff) / 0x7fffffff;
}
function noise2D(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm2D(x, y, octaves = 4, lac = 2.0, gain = 0.5) {
  let amp = 1.0, freq = 1.0, sum = 0.0, max = 0.0;
  for (let i = 0; i < octaves; i++) {
    sum += noise2D(x * freq, y * freq) * amp;
    max += amp;
    amp *= gain;
    freq *= lac;
  }
  return sum / max;
}
function ridgedNoise(x, y) {
  const n = noise2D(x, y);
  return 1.0 - Math.abs(n * 2 - 1);
}

// ============================================
// VOXEL WORLD
// ============================================
class VoxelWorld {
  constructor() {
    this.chunks = new Map();
    this.heightmap = new Float32Array(WORLD_SIZE_X * WORLD_SIZE_Z);
  }

  key(cx, cy, cz) { return `${cx},${cy},${cz}`; }

  getChunk(cx, cy, cz) {
    return this.chunks.get(this.key(cx, cy, cz));
  }

  ensureChunk(cx, cy, cz) {
    const k = this.key(cx, cy, cz);
    if (!this.chunks.has(k)) {
      this.chunks.set(k, new Uint8Array(CHUNK_SIZE * CHUNK_SIZE * CHUNK_SIZE));
    }
    return this.chunks.get(k);
  }

  getBlock(x, y, z) {
    if (x < 0 || y < 0 || z < 0 || x >= WORLD_SIZE_X || y >= WORLD_HEIGHT || z >= WORLD_SIZE_Z) return BLOCK.AIR;
    const cx = Math.floor(x / CHUNK_SIZE), cy = Math.floor(y / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    const lx = x - cx * CHUNK_SIZE, ly = y - cy * CHUNK_SIZE, lz = z - cz * CHUNK_SIZE;
    const chunk = this.getChunk(cx, cy, cz);
    if (!chunk) return BLOCK.AIR;
    return chunk[lx + ly * CHUNK_SIZE + lz * CHUNK_SIZE * CHUNK_SIZE];
  }

  setBlock(x, y, z, id) {
    if (x < 0 || y < 0 || z < 0 || x >= WORLD_SIZE_X || y >= WORLD_HEIGHT || z >= WORLD_SIZE_Z) return;
    const cx = Math.floor(x / CHUNK_SIZE), cy = Math.floor(y / CHUNK_SIZE), cz = Math.floor(z / CHUNK_SIZE);
    const lx = x - cx * CHUNK_SIZE, ly = y - cy * CHUNK_SIZE, lz = z - cz * CHUNK_SIZE;
    const chunk = this.ensureChunk(cx, cy, cz);
    chunk[lx + ly * CHUNK_SIZE + lz * CHUNK_SIZE * CHUNK_SIZE] = id;
  }

  getHeight(x, z) {
    if (x < 0 || z < 0 || x >= WORLD_SIZE_X || z >= WORLD_SIZE_Z) return 0;
    return this.heightmap[x + z * WORLD_SIZE_X];
  }

  setHeight(x, z, h) {
    if (x < 0 || z < 0 || x >= WORLD_SIZE_X || z >= WORLD_SIZE_Z) return;
    this.heightmap[x + z * WORLD_SIZE_X] = h;
  }
}

// ============================================
// TERRAIN GENERATION
// ============================================
function generateTerrain(world) {
  const scale = 0.012;
  const riverScale = 0.008;

  // River path
  const riverPath = [];
  for (let x = 0; x < WORLD_SIZE_X; x += 4) {
    const z = WORLD_SIZE_Z * 0.5 + Math.sin(x * 0.015) * 30 + Math.sin(x * 0.005) * 60 + noise2D(x * 0.01, 0) * 20;
    riverPath.push({ x, z });
  }

  // Heightmap
  for (let z = 0; z < WORLD_SIZE_Z; z++) {
    for (let x = 0; x < WORLD_SIZE_X; x++) {
      let h = 30 + fbm2D(x * scale, z * scale, 6) * 25;
      h += ridgedNoise(x * scale * 2, z * scale * 2) * 10;

      // River carving
      let minRiverDist = 9999;
      for (const rp of riverPath) {
        const dx = x - rp.x, dz = z - rp.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < minRiverDist) minRiverDist = d;
      }
      if (minRiverDist < 25) {
        h -= (25 - minRiverDist) * 1.2;
      }

      // Volcano mountain in corner
      const vdx = x - WORLD_SIZE_X * 0.85, vdz = z - WORLD_SIZE_Z * 0.15;
      const vdist = Math.sqrt(vdx * vdx + vdz * vdz);
      if (vdist < 80) {
        const vh = (80 - vdist) * 1.2;
        h = Math.max(h, 20 + vh);
      }

      // Castle hill near center-left
      const cdx = x - WORLD_SIZE_X * 0.35, cdz = z - WORLD_SIZE_Z * 0.45;
      const cdist = Math.sqrt(cdx * cdx + cdz * cdz);
      if (cdist < 40) {
        h += (40 - cdist) * 0.4;
      }

      // Village flat area near river
      const vcdx = x - WORLD_SIZE_X * 0.55, vcdz = z - WORLD_SIZE_Z * 0.55;
      const vcdist = Math.sqrt(vcdx * vcdx + vcdz * vcdz);
      if (vcdist < 50) {
        h = h * 0.7 + 28 * 0.3;
      }

      h = Math.max(5, Math.min(WORLD_HEIGHT - 10, h));
      world.setHeight(x, z, Math.floor(h));
    }
  }

  // Fill voxels
  for (let z = 0; z < WORLD_SIZE_Z; z++) {
    for (let x = 0; x < WORLD_SIZE_X; x++) {
      const h = world.getHeight(x, z);
      for (let y = 0; y < h - 3; y++) {
        world.setBlock(x, y, z, BLOCK.STONE);
      }
      for (let y = Math.max(0, h - 3); y < h; y++) {
        world.setBlock(x, y, z, BLOCK.DIRT);
      }

      // Surface
      if (h < 15) {
        world.setBlock(x, h, z, BLOCK.SAND);
      } else if (h > 55) {
        world.setBlock(x, h, z, BLOCK.SNOW);
        // Snow layers
        if (h < WORLD_HEIGHT - 1) world.setBlock(x, h + 1, z, BLOCK.SNOW);
      } else {
        world.setBlock(x, h, z, BLOCK.GRASS);
      }

      // River water
      let minRiverDist = 9999;
      for (const rp of riverPath) {
        const dx = x - rp.x, dz = z - rp.z;
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < minRiverDist) minRiverDist = d;
      }
      if (minRiverDist < 12 && h < 22) {
        for (let y = h; y < 20; y++) {
          world.setBlock(x, y, z, BLOCK.WATER);
        }
      }

      // Volcano
      const vdx = x - WORLD_SIZE_X * 0.85, vdz = z - WORLD_SIZE_Z * 0.15;
      const vdist = Math.sqrt(vdx * vdx + vdz * vdz);
      if (vdist < 60 && h > 50) {
        world.setBlock(x, h, z, BLOCK.BASALT);
        if (vdist < 15 && h > 70) {
          world.setBlock(x, h, z, BLOCK.LAVA);
          if (h < WORLD_HEIGHT - 1) world.setBlock(x, h + 1, z, BLOCK.LAVA);
        }
      }
    }
  }

  return { riverPath };
}

function generateCastle(world, cx, cz) {
  const baseH = world.getHeight(cx, cz);
  const y0 = baseH + 1;

  // Moat
  for (let dx = -18; dx <= 18; dx++) {
    for (let dz = -18; dz <= 18; dz++) {
      const d = Math.max(Math.abs(dx), Math.abs(dz));
      if (d >= 14 && d <= 17) {
        const h = world.getHeight(cx + dx, cz + dz);
        for (let y = h - 2; y < h + 1; y++) {
          world.setBlock(cx + dx, y, cz + dz, BLOCK.WATER);
        }
      }
    }
  }

  // Bridge
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = 14; dz <= 20; dz++) {
      world.setBlock(cx + dx, y0, cz + dz, BLOCK.BRIDGE_PLANK);
      if (Math.abs(dx) === 3) {
        world.setBlock(cx + dx, y0 + 1, cz + dz, BLOCK.FENCE);
      }
    }
  }

  // Gatehouse
  for (let dx = -4; dx <= 4; dx++) {
    for (let dz = -4; dz <= 4; dz++) {
      for (let dy = 0; dy < 12; dy++) {
        if (Math.abs(dx) < 3 && Math.abs(dz) < 3 && dy < 8) continue; // interior
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Gate arch
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = 4; dz <= 5; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (Math.abs(dx) < 2 && dy < 5) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Portcullis
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = 1; dy < 5; dy++) {
      world.setBlock(cx + dx, y0 + dy, cz + 4, BLOCK.CHAIN);
    }
  }

  // Outer walls
  const wallSize = 12;
  for (let dx = -wallSize; dx <= wallSize; dx++) {
    for (let dz = -wallSize; dz <= wallSize; dz++) {
      if (Math.abs(dx) === wallSize || Math.abs(dz) === wallSize) {
        for (let dy = 0; dy < 8; dy++) {
          world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_BRICK);
        }
        // Battlements
        if ((dx + dz) % 2 === 0) {
          world.setBlock(cx + dx, y0 + 8, cz + dz, BLOCK.STONE_BRICK);
        }
      }
    }
  }

  // Corner towers
  const towers = [[-wallSize, -wallSize], [wallSize, -wallSize], [-wallSize, wallSize], [wallSize, wallSize]];
  for (const [tdx, tdz] of towers) {
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        for (let dy = 0; dy < 14; dy++) {
          world.setBlock(cx + tdx + dx, y0 + dy, cz + tdz + dz, BLOCK.STONE_BRICK);
        }
        // Tower top
        world.setBlock(cx + tdx + dx, y0 + 14, cz + tdz + dz, BLOCK.STONE_BRICK);
      }
    }
    // Tower roof
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        world.setBlock(cx + tdx + dx, y0 + 15, cz + tdz + dz, BLOCK.ROOF_GRAY);
      }
    }
    world.setBlock(cx + tdx, y0 + 16, cz + tdz, BLOCK.ROOF_GRAY);
    // Flag
    world.setBlock(cx + tdx, y0 + 17, cz + tdz, BLOCK.FLAG_POLE);
    world.setBlock(cx + tdx, y0 + 18, cz + tdz, BLOCK.FLAG_CLOTH);
  }

  // Keep (central tower)
  for (let dx = -5; dx <= 5; dx++) {
    for (let dz = -5; dz <= 5; dz++) {
      for (let dy = 0; dy < 20; dy++) {
        if (Math.abs(dx) < 3 && Math.abs(dz) < 3 && dy < 16) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_SMOOTH);
      }
    }
  }
  // Keep roof
  for (let dx = -4; dx <= 4; dx++) {
    for (let dz = -4; dz <= 4; dz++) {
      world.setBlock(cx + dx, y0 + 20, cz + dz, BLOCK.ROOF_GRAY);
    }
  }
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -2; dz <= 2; dz++) {
      world.setBlock(cx + dx, y0 + 21, cz + dz, BLOCK.ROOF_GRAY);
    }
  }
  world.setBlock(cx, y0 + 22, cz, BLOCK.ROOF_GRAY);
  // Keep flag
  world.setBlock(cx, y0 + 23, cz, BLOCK.FLAG_POLE);
  world.setBlock(cx, y0 + 24, cz, BLOCK.FLAG_CLOTH);

  // Chapel
  const chapelX = cx - 8, chapelZ = cz - 8;
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -5; dz <= 5; dz++) {
      for (let dy = 0; dy < 10; dy++) {
        if (Math.abs(dx) < 2 && Math.abs(dz) < 4 && dy < 8) continue;
        world.setBlock(chapelX + dx, y0 + dy, chapelZ + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Chapel roof
  for (let dz = -5; dz <= 5; dz++) {
    world.setBlock(chapelX, y0 + 10, chapelZ + dz, BLOCK.ROOF_RED);
    world.setBlock(chapelX - 1, y0 + 10, chapelZ + dz, BLOCK.ROOF_RED);
    world.setBlock(chapelX + 1, y0 + 10, chapelZ + dz, BLOCK.ROOF_RED);
  }
  // Chapel windows (glowing)
  for (let dz = -4; dz <= 4; dz += 2) {
    world.setBlock(chapelX + 3, y0 + 4, chapelZ + dz, BLOCK.WINDOW);
    world.setBlock(chapelX - 3, y0 + 4, chapelZ + dz, BLOCK.WINDOW);
  }
  // Chapel bell
  world.setBlock(chapelX, y0 + 11, chapelZ, BLOCK.BELL);

  // Courtyard
  for (let dx = -8; dx <= 8; dx++) {
    for (let dz = -8; dz <= 8; dz++) {
      if (Math.abs(dx) > 5 || Math.abs(dz) > 5) {
        world.setBlock(cx + dx, y0, cz + dz, BLOCK.STONE_TILE);
      }
    }
  }
  // Courtyard garden
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      if ((dx + dz) % 2 === 0) {
        world.setBlock(cx + dx, y0 + 1, cz + dz, BLOCK.FLOWER_RED);
      } else {
        world.setBlock(cx + dx, y0 + 1, cz + dz, BLOCK.FLOWER_YELLOW);
      }
    }
  }
  // Fountain
  world.setBlock(cx, y0 + 1, cz, BLOCK.FOUNTAIN);
  world.setBlock(cx, y0 + 2, cz, BLOCK.WATER);

  // Torches on walls
  const torchPositions = [
    [cx - wallSize, y0 + 6, cz], [cx + wallSize, y0 + 6, cz],
    [cx, y0 + 6, cz - wallSize], [cx, y0 + 6, cz + wallSize],
    [cx - 6, y0 + 5, cz - 6], [cx + 6, y0 + 5, cz - 6],
    [cx - 6, y0 + 5, cz + 6], [cx + 6, y0 + 5, cz + 6]
  ];
  for (const [tx, ty, tz] of torchPositions) {
    world.setBlock(tx, ty, tz, BLOCK.TORCH);
  }

  // Royal chambers (smaller building near keep)
  for (let dx = 6; dx <= 10; dx++) {
    for (let dz = -4; dz <= 4; dz++) {
      for (let dy = 0; dy < 8; dy++) {
        if (dx > 7 && dx < 10 && Math.abs(dz) < 3 && dy < 6) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Royal windows
  for (let dz = -2; dz <= 2; dz += 2) {
    world.setBlock(cx + 10, y0 + 3, cz + dz, BLOCK.WINDOW);
  }

  // Stables
  for (let dx = -10; dx <= -6; dx++) {
    for (let dz = 6; dz <= 10; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (dx > -9 && dx < -6 && dz > 7 && dz < 10 && dy < 4) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.PLANKS);
      }
    }
  }
  // Stable doors
  world.setBlock(cx - 8, y0 + 1, cz + 10, BLOCK.DOOR_WOOD);
  world.setBlock(cx - 8, y0 + 2, cz + 10, BLOCK.DOOR_WOOD);

  // Barracks
  for (let dx = -10; dx <= -6; dx++) {
    for (let dz = -10; dz <= -6; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (dx > -9 && dx < -6 && dz > -9 && dz < -6 && dy < 4) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.PLANKS);
      }
    }
  }

  // Armory
  for (let dx = 6; dx <= 10; dx++) {
    for (let dz = 6; dz <= 10; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (dx > 7 && dx < 10 && dz > 7 && dz < 10 && dy < 4) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Armor stands
  world.setBlock(cx + 8, y0 + 1, cz + 8, BLOCK.ARMOR_STAND);
  world.setBlock(cx + 9, y0 + 1, cz + 8, BLOCK.ARMOR_STAND);

  // Kitchen
  for (let dx = -4; dx <= -1; dx++) {
    for (let dz = 8; dz <= 11; dz++) {
      for (let dy = 0; dy < 5; dy++) {
        if (dx > -3 && dz > 9 && dy < 3) continue;
        world.setBlock(cx + dx, y0 + dy, cz + dz, BLOCK.PLANKS);
      }
    }
  }
  // Kitchen furnace
  world.setBlock(cx - 3, y0 + 1, cz + 11, BLOCK.FURNACE);

  // Watchtowers on walls
  const watchPositions = [
    [cx - wallSize, cz], [cx + wallSize, cz], [cx, cz - wallSize], [cx, cz + wallSize]
  ];
  for (const [wx, wz] of watchPositions) {
    for (let dy = 0; dy < 12; dy++) {
      world.setBlock(wx, y0 + dy, wz, BLOCK.STONE_BRICK);
    }
    world.setBlock(wx, y0 + 12, wz, BLOCK.ROOF_GRAY);
    world.setBlock(wx, y0 + 13, wz, BLOCK.TORCH);
  }

  // Secret passage entrance
  world.setBlock(cx + 12, y0 + 1, cz + 12, BLOCK.MOSSY_STONE);
  world.setBlock(cx + 12, y0 + 2, cz + 12, BLOCK.AIR);
  world.setBlock(cx + 12, y0 + 3, cz + 12, BLOCK.MOSSY_STONE);

  // Dungeon entrance
  world.setBlock(cx - 8, y0 + 1, cz + 8, BLOCK.IRON_ORE);
  world.setBlock(cx - 8, y0 + 2, cz + 8, BLOCK.AIR);
  world.setBlock(cx - 8, y0 + 3, cz + 8, BLOCK.IRON_ORE);

  // Treasury
  for (let dx = 2; dx <= 4; dx++) {
    for (let dz = 2; dz <= 4; dz++) {
      world.setBlock(cx + dx, y0 + 1, cz + dz, BLOCK.CHEST_GOLD);
    }
  }

  // Throne room hint
  world.setBlock(cx + 2, y0 + 1, cz - 2, BLOCK.THRONE);

  // Map table
  world.setBlock(cx - 2, y0 + 1, cz - 2, BLOCK.TABLE);
  world.setBlock(cx - 2, y0 + 2, cz - 2, BLOCK.MAP);
}

function generateVillage(world, riverPath) {
  const centerX = Math.floor(WORLD_SIZE_X * 0.55);
  const centerZ = Math.floor(WORLD_SIZE_Z * 0.55);
  const baseH = world.getHeight(centerX, centerZ);

  // Village road network (curved)
  const roads = [];
  for (let t = 0; t < Math.PI * 2; t += 0.3) {
    const rx = centerX + Math.cos(t) * 20 + noise2D(t * 3, 0) * 8;
    const rz = centerZ + Math.sin(t) * 20 + noise2D(0, t * 3) * 8;
    roads.push({ x: Math.floor(rx), z: Math.floor(rz) });
  }

  // Main road to castle
  for (let t = 0; t < 1; t += 0.02) {
    const x = Math.floor(centerX + (WORLD_SIZE_X * 0.35 - centerX) * t);
    const z = Math.floor(centerZ + (WORLD_SIZE_Z * 0.45 - centerZ) * t);
    const h = world.getHeight(x, z);
    world.setBlock(x, h, z, BLOCK.PATH_STONE);
    world.setBlock(x + 1, h, z, BLOCK.PATH_STONE);
  }

  // Stone bridge over river
  const bridgeX = Math.floor((centerX + WORLD_SIZE_X * 0.35) / 2);
  const bridgeZ = Math.floor((centerZ + WORLD_SIZE_Z * 0.45) / 2);
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = -8; dz <= 8; dz++) {
      const h = world.getHeight(bridgeX + dx, bridgeZ + dz);
      if (world.getBlock(bridgeX + dx, h, bridgeZ + dz) === BLOCK.WATER) {
        world.setBlock(bridgeX + dx, h + 1, bridgeZ + dz, BLOCK.BRIDGE_PLANK);
        if (Math.abs(dx) === 2) {
          world.setBlock(bridgeX + dx, h + 2, bridgeZ + dz, BLOCK.FENCE);
        }
      }
    }
  }

  // Houses (25-35)
  const houseCount = 32;
  const housePositions = [];
  for (let i = 0; i < houseCount; i++) {
    const angle = (i / houseCount) * Math.PI * 2 + noise2D(i * 7, i * 3) * 0.5;
    const dist = 12 + noise2D(i * 5, i * 2) * 15;
    const hx = Math.floor(centerX + Math.cos(angle) * dist);
    const hz = Math.floor(centerZ + Math.sin(angle) * dist);
    const hh = world.getHeight(hx, hz);

    // Avoid water
    if (world.getBlock(hx, hh, hz) === BLOCK.WATER) continue;

    housePositions.push({ x: hx, z: hz, h: hh, type: i % 5 });
  }

  for (const house of housePositions) {
    const { x, z, h, type } = house;
    const width = 3 + Math.floor(Math.abs(noise2D(x * 0.1, z * 0.1)) * 3);
    const depth = 3 + Math.floor(Math.abs(noise2D(z * 0.1, x * 0.1)) * 3);
    const height = 3 + type;

    // Walls
    for (let dx = -width; dx <= width; dx++) {
      for (let dz = -depth; dz <= depth; dz++) {
        for (let dy = 0; dy < height; dy++) {
          if (Math.abs(dx) < width && Math.abs(dz) < depth && dy < height - 1) continue;
          const block = type === 0 ? BLOCK.PLANKS : type === 1 ? BLOCK.STONE_BRICK : type === 2 ? BLOCK.PLANK_DARK : type === 3 ? BLOCK.WOOD_OAK : BLOCK.PLANKS;
          world.setBlock(x + dx, h + dy, z + dz, block);
        }
      }
    }

    // Roof
    for (let dy = 0; dy < 3; dy++) {
      const rw = width + 1 - dy;
      const rd = depth + 1 - dy;
      for (let dx = -rw; dx <= rw; dx++) {
        for (let dz = -rd; dz <= rd; dz++) {
          const roofBlock = type === 0 ? BLOCK.ROOF_RED : type === 1 ? BLOCK.ROOF_GRAY : type === 2 ? BLOCK.THATCH : type === 3 ? BLOCK.ROOF_BROWN : BLOCK.STRAW;
          world.setBlock(x + dx, h + height + dy, z + dz, roofBlock);
        }
      }
    }

    // Door
    world.setBlock(x, h + 1, z + depth, BLOCK.DOOR_WOOD);
    world.setBlock(x, h + 2, z + depth, BLOCK.DOOR_WOOD);

    // Window
    world.setBlock(x + width, h + 2, z, BLOCK.WINDOW);
    world.setBlock(x - width, h + 2, z, BLOCK.WINDOW);

    // Chimney
    if (type === 1 || type === 3) {
      world.setBlock(x + width - 1, h + height + 1, z + depth - 1, BLOCK.STONE_BRICK);
      world.setBlock(x + width - 1, h + height + 2, z + depth - 1, BLOCK.STONE_BRICK);
      world.setBlock(x + width - 1, h + height + 3, z + depth - 1, BLOCK.SMOKE);
    }
  }

  // Marketplace (central open area)
  for (let dx = -5; dx <= 5; dx++) {
    for (let dz = -5; dz <= 5; dz++) {
      world.setBlock(centerX + dx, baseH, centerZ + dz, BLOCK.PATH_STONE);
    }
  }
  // Market stalls
  const stallPositions = [
    [centerX - 3, centerZ - 3], [centerX + 3, centerZ - 3],
    [centerX - 3, centerZ + 3], [centerX + 3, centerZ + 3],
    [centerX, centerZ - 4], [centerX, centerZ + 4]
  ];
  for (const [sx, sz] of stallPositions) {
    world.setBlock(sx, baseH + 1, sz, BLOCK.CRATE);
    world.setBlock(sx, baseH + 2, sz, BLOCK.TENT);
  }
  // Well
  world.setBlock(centerX, baseH + 1, centerZ, BLOCK.WELL_STONE);
  world.setBlock(centerX, baseH + 2, centerZ, BLOCK.WATER);

  // Blacksmith
  const bsx = centerX + 15, bsz = centerZ - 10;
  const bsh = world.getHeight(bsx, bsz);
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (Math.abs(dx) < 2 && Math.abs(dz) < 2 && dy < 4) continue;
        world.setBlock(bsx + dx, bsh + dy, bsz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Blacksmith forge
  world.setBlock(bsx, bsh + 1, bsz + 3, BLOCK.FORGE);
  world.setBlock(bsx, bsh + 2, bsz + 3, BLOCK.FIRE);
  // Anvil
  world.setBlock(bsx - 1, bsh + 1, bsz, BLOCK.ANVIL_METAL);
  // Chimney
  for (let dy = 4; dy < 10; dy++) {
    world.setBlock(bsx + 2, bsh + dy, bsz + 2, BLOCK.STONE_BRICK);
  }
  world.setBlock(bsx + 2, bsh + 10, bsz + 2, BLOCK.SMOKE);

  // Tavern
  const tax = centerX - 15, taz = centerZ + 10;
  const tah = world.getHeight(tax, taz);
  for (let dx = -4; dx <= 4; dx++) {
    for (let dz = -4; dz <= 4; dz++) {
      for (let dy = 0; dy < 7; dy++) {
        if (Math.abs(dx) < 3 && Math.abs(dz) < 3 && dy < 5) continue;
        world.setBlock(tax + dx, tah + dy, taz + dz, BLOCK.PLANK_DARK);
      }
    }
  }
  // Tavern roof
  for (let dy = 0; dy < 3; dy++) {
    for (let dx = -5 + dy; dx <= 5 - dy; dx++) {
      for (let dz = -5 + dy; dz <= 5 - dy; dz++) {
        world.setBlock(tax + dx, tah + 7 + dy, taz + dz, BLOCK.ROOF_RED);
      }
    }
  }
  // Tavern sign
  world.setBlock(tax, tah + 4, taz + 5, BLOCK.SIGN);
  // Lanterns
  world.setBlock(tax + 4, tah + 3, taz + 4, BLOCK.LANTERN);
  world.setBlock(tax - 4, tah + 3, taz + 4, BLOCK.LANTERN);

  // Chapel
  const chx = centerX + 10, chz = centerZ + 15;
  const chh = world.getHeight(chx, chz);
  for (let dx = -3; dx <= 3; dx++) {
    for (let dz = -6; dz <= 6; dz++) {
      for (let dy = 0; dy < 10; dy++) {
        if (Math.abs(dx) < 2 && Math.abs(dz) < 5 && dy < 8) continue;
        world.setBlock(chx + dx, chh + dy, chz + dz, BLOCK.STONE_BRICK);
      }
    }
  }
  // Chapel roof
  for (let dz = -6; dz <= 6; dz++) {
    world.setBlock(chx, chh + 10, chz + dz, BLOCK.ROOF_GRAY);
    world.setBlock(chx - 1, chh + 10, chz + dz, BLOCK.ROOF_GRAY);
    world.setBlock(chx + 1, chh + 10, chz + dz, BLOCK.ROOF_GRAY);
  }
  // Chapel windows
  for (let dz = -4; dz <= 4; dz += 2) {
    world.setBlock(chx + 3, chh + 4, chz + dz, BLOCK.WINDOW);
    world.setBlock(chx - 3, chh + 4, chz + dz, BLOCK.WINDOW);
  }
  // Chapel bell
  world.setBlock(chx, chh + 11, chz, BLOCK.BELL);

  // Watermill
  const wmx = centerX - 20, wmz = centerZ;
  const wmh = world.getHeight(wmx, wmz);
  // Find nearest river
  let nearestRiverZ = wmz;
  let minDist = 9999;
  for (const rp of riverPath) {
    const d = Math.abs(rp.x - wmx);
    if (d < minDist) {
      minDist = d;
      nearestRiverZ = rp.z;
    }
  }
  for (let dx = -4; dx <= 4; dx++) {
    for (let dz = -3; dz <= 3; dz++) {
      for (let dy = 0; dy < 6; dy++) {
        if (Math.abs(dx) < 3 && Math.abs(dz) < 2 && dy < 4) continue;
        world.setBlock(wmx + dx, wmh + dy, nearestRiverZ + dz, BLOCK.PLANKS);
      }
    }
  }
  // Waterwheel
  for (let dy = -2; dy <= 4; dy++) {
    for (let dz = -1; dz <= 1; dz++) {
      world.setBlock(wmx - 4, wmh + dy, nearestRiverZ + dz + 4, BLOCK.WATERWHEEL);
    }
  }

  // Farms
  const farmPositions = [
    [centerX + 20, centerZ - 15], [centerX + 25, centerZ - 10],
    [centerX - 20, centerZ - 15], [centerX - 25, centerZ - 10]
  ];
  for (const [fx, fz] of farmPositions) {
    const fh = world.getHeight(fx, fz);
    // Fences
    for (let dx = -4; dx <= 4; dx++) {
      world.setBlock(fx + dx, fh + 1, fz - 4, BLOCK.FENCE);
      world.setBlock(fx + dx, fh + 1, fz + 4, BLOCK.FENCE);
    }
    for (let dz = -4; dz <= 4; dz++) {
      world.setBlock(fx - 4, fh + 1, fz + dz, BLOCK.FENCE);
      world.setBlock(fx + 4, fh + 1, fz + dz, BLOCK.FENCE);
    }
    // Crops
    for (let dx = -3; dx <= 3; dx++) {
      for (let dz = -3; dz <= 3; dz++) {
        if ((dx + dz) % 2 === 0) {
          world.setBlock(fx + dx, fh + 1, fz + dz, BLOCK.CROP_WHEAT);
        } else {
          world.setBlock(fx + dx, fh + 1, fz + dz, BLOCK.CROP_CARROT);
        }
      }
    }
    // Hay bale
    world.setBlock(fx + 3, fh + 1, fz + 3, BLOCK.HAY_BALE);
  }

  // Docks
  const dockX = centerX + 30;
  const dockZ = centerZ + 5;
  const dockH = world.getHeight(dockX, dockZ);
  for (let dx = -2; dx <= 2; dx++) {
    for (let dz = 0; dz <= 8; dz++) {
      world.setBlock(dockX + dx, dockH, dockZ + dz, BLOCK.BRIDGE_PLANK);
    }
  }
  // Boats
  world.setBlock(dockX + 1, dockH + 1, dockZ + 10, BLOCK.BOAT);
  world.setBlock(dockX - 1, dockH + 1, dockZ + 12, BLOCK.BOAT);

  // Carts and barrels
  const propPositions = [
    [centerX + 8, centerZ + 8], [centerX - 8, centerZ - 8],
    [centerX + 12, centerZ - 5], [centerX - 12, centerZ + 5]
  ];
  for (const [px, pz] of propPositions) {
    const ph = world.getHeight(px, pz);
    world.setBlock(px, ph + 1, pz, BLOCK.CART);
    world.setBlock(px + 1, ph + 1, pz, BLOCK.BARREL);
    world.setBlock(px, ph + 1, pz + 1, BLOCK.CRATE);
  }

  // Lanterns along roads
  for (let i = 0; i < roads.length; i += 3) {
    const road = roads[i];
    const rh = world.getHeight(road.x, road.z);
    world.setBlock(road.x, rh + 1, road.z, BLOCK.LANTERN);
  }

  // Wells in village outskirts
  const wellPositions = [
    [centerX + 18, centerZ + 18], [centerX - 18, centerZ - 18]
  ];
  for (const [wx, wz] of wellPositions) {
    const wh = world.getHeight(wx, wz);
    world.setBlock(wx, wh + 1, wz, BLOCK.WELL_WOOD);
    world.setBlock(wx, wh + 2, wz, BLOCK.WATER);
  }
}

function generateVolcano(world) {
  const vx = Math.floor(WORLD_SIZE_X * 0.85);
  const vz = Math.floor(WORLD_SIZE_Z * 0.15);
  const vBase = world.getHeight(vx, vz);

  // Volcano cone
  for (let y = 0; y < 50; y++) {
    const radius = (50 - y) * 0.8 + 5;
    for (let dx = -Math.ceil(radius); dx <= Math.ceil(radius); dx++) {
      for (let dz = -Math.ceil(radius); dz <= Math.ceil(radius); dz++) {
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d <= radius) {
          const wx = vx + dx, wz = vz + dz;
          if (wx < 0 || wz < 0 || wx >= WORLD_SIZE_X || wz >= WORLD_SIZE_Z) continue;
          const h = vBase + y;
          if (h < WORLD_HEIGHT) {
            // Outer shell
            if (d > radius - 2) {
              world.setBlock(wx, h, wz, BLOCK.BASALT);
            } else if (y > 40) {
              // Lava chamber
              world.setBlock(wx, h, wz, BLOCK.LAVA);
            } else {
              world.setBlock(wx, h, wz, BLOCK.BASALT);
            }
          }
        }
      }
    }
  }

  // Crater rim
  for (let dx = -8; dx <= 8; dx++) {
    for (let dz = -8; dz <= 8; dz++) {
      const d = Math.sqrt(dx * dx + dz * dz);
      if (d > 6 && d < 9) {
        const wx = vx + dx, wz = vz + dz;
        const h = vBase + 48;
        if (h < WORLD_HEIGHT) {
          world.setBlock(wx, h, wz, BLOCK.OBSIDIAN);
          world.setBlock(wx, h + 1, wz, BLOCK.OBSIDIAN);
        }
      }
    }
  }

  // Lava lake in crater
  for (let dx = -6; dx <= 6; dx++) {
    for (let dz = -6; dz <= 6; dz++) {
      const d = Math.sqrt(dx * dx + dz * dz);
      if (d < 6) {
        const wx = vx + dx, wz = vz + dz;
        const h = vBase + 47;
        if (h < WORLD_HEIGHT) {
          world.setBlock(wx, h, wz, BLOCK.LAVA);
          world.setBlock(wx, h + 1, wz, BLOCK.LAVA);
        }
      }
    }
  }

  // Smoke and embers
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 3 + Math.random() * 3;
    const sx = vx + Math.cos(angle) * dist;
    const sz = vz + Math.sin(angle) * dist;
    const sh = vBase + 50 + Math.floor(Math.random() * 5);
    if (sh < WORLD_HEIGHT - 2) {
      world.setBlock(Math.floor(sx), sh, Math.floor(sz), BLOCK.SMOKE);
      world.setBlock(Math.floor(sx), sh + 1, Math.floor(sz), BLOCK.SMOKE);
    }
  }

  // Dead trees around volcano
  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 40;
    const tx = Math.floor(vx + Math.cos(angle) * dist);
    const tz = Math.floor(vz + Math.sin(angle) * dist);
    const th = world.getHeight(tx, tz);
    if (th > 10 && th < WORLD_HEIGHT - 5) {
      // Dead trunk
      for (let dy = 0; dy < 3 + Math.random() * 4; dy++) {
        world.setBlock(tx, th + dy, tz, BLOCK.WOOD_DARK);
      }
      // Dead branches
      if (Math.random() > 0.5) {
        world.setBlock(tx + 1, th + 2, tz, BLOCK.WOOD_DARK);
      }
      if (Math.random() > 0.5) {
        world.setBlock(tx - 1, th + 3, tz, BLOCK.WOOD_DARK);
      }
    }
  }

  // Ancient ruins near volcano
  for (let i = 0; i < 5; i++) {
    const rx = vx + (Math.random() - 0.5) * 60;
    const rz = vz + (Math.random() - 0.5) * 60;
    const rh = world.getHeight(Math.floor(rx), Math.floor(rz));
    // Ruined pillars
    for (let dy = 0; dy < 2 + Math.random() * 4; dy++) {
      world.setBlock(Math.floor(rx), rh + dy, Math.floor(rz), BLOCK.CRACKED_STONE);
    }
    // Fallen blocks
    if (Math.random() > 0.5) {
      world.setBlock(Math.floor(rx) + 1, rh, Math.floor(rz), BLOCK.CRACKED_STONE);
    }
  }

  // Ash and obsidian scattered
  for (let i = 0; i < 100; i++) {
    const ax = vx + (Math.random() - 0.5) * 80;
    const az = vz + (Math.random() - 0.5) * 80;
    const ah = world.getHeight(Math.floor(ax), Math.floor(az));
    if (ah > 5 && ah < WORLD_HEIGHT - 1) {
      world.setBlock(Math.floor(ax), ah + 1, Math.floor(az), Math.random() > 0.5 ? BLOCK.ASH : BLOCK.OBSIDIAN);
    }
  }

  // Glowing obsidian patches
  for (let i = 0; i < 10; i++) {
    const gx = vx + (Math.random() - 0.5) * 30;
    const gz = vz + (Math.random() - 0.5) * 30;
    const gh = world.getHeight(Math.floor(gx), Math.floor(gz));
    world.setBlock(Math.floor(gx), gh + 1, Math.floor(gz), BLOCK.GLOWING_OBSIDIAN);
  }

  // Basalt columns
  for (let i = 0; i < 15; i++) {
    const bx = vx + (Math.random() - 0.5) * 40;
    const bz = vz + (Math.random() - 0.5) * 40;
    const bh = world.getHeight(Math.floor(bx), Math.floor(bz));
    const height = 3 + Math.random() * 8;
    for (let dy = 0; dy < height; dy++) {
      world.setBlock(Math.floor(bx), bh + dy, Math.floor(bz), BLOCK.BASALT);
    }
  }
}

function generateTrees(world) {
  const treeCount = 400;
  for (let i = 0; i < treeCount; i++) {
    const x = Math.floor(Math.random() * WORLD_SIZE_X);
    const z = Math.floor(Math.random() * WORLD_SIZE_Z);
    const h = world.getHeight(x, z);

    // Skip water, lava, sand, snow
    const surface = world.getBlock(x, h, z);
    if (surface === BLOCK.WATER || surface === BLOCK.LAVA || surface === BLOCK.SAND || surface === BLOCK.SNOW) continue;

    // Skip near volcano
    const vdx = x - WORLD_SIZE_X * 0.85, vdz = z - WORLD_SIZE_Z * 0.15;
    if (Math.sqrt(vdx * vdx + vdz * vdz) < 50) continue;

    // Skip near castle and village
    const cdx = x - WORLD_SIZE_X * 0.35, cdz = z - WORLD_SIZE_Z * 0.45;
    if (Math.sqrt(cdx * cdx + cdz * cdz) < 30) continue;

    const vcdx = x - WORLD_SIZE_X * 0.55, vcdz = z - WORLD_SIZE_Z * 0.55;
    if (Math.sqrt(vcdx * vcdx + vcdz * vcdz) < 40) continue;

    const type = Math.random();
    const trunkHeight = 3 + Math.floor(Math.random() * 4);

    // Trunk
    for (let dy = 1; dy <= trunkHeight; dy++) {
      world.setBlock(x, h + dy, z, BLOCK.WOOD_OAK);
    }

    if (type < 0.4) {
      // Oak
      for (let dx = -2; dx <= 2; dx++) {
        for (let dz = -2; dz <= 2; dz++) {
          for (let dy = 0; dy < 3; dy++) {
            if (Math.abs(dx) === 2 && Math.abs(dz) === 2) continue;
            world.setBlock(x + dx, h + trunkHeight + dy, z + dz, BLOCK.LEAVES_OAK);
          }
        }
      }
      world.setBlock(x, h + trunkHeight + 3, z, BLOCK.LEAVES_OAK);
    } else if (type < 0.7) {
      // Birch
      for (let dx = -1; dx <= 1; dx++) {
        for (let dz = -1; dz <= 1; dz++) {
          for (let dy = 0; dy < 2; dy++) {
            world.setBlock(x + dx, h + trunkHeight + dy, z + dz, BLOCK.LEAVES_BIRCH);
          }
        }
      }
      world.setBlock(x, h + trunkHeight + 2, z, BLOCK.LEAVES_BIRCH);
    } else {
      // Pine
      for (let dy = 0; dy < 4; dy++) {
        const radius = 2 - Math.floor(dy / 2);
        for (let dx = -radius; dx <= radius; dx++) {
          for (let dz = -radius; dz <= radius; dz++) {
            world.setBlock(x + dx, h + trunkHeight + dy, z + dz, BLOCK.LEAVES_PINE);
          }
        }
      }
      world.setBlock(x, h + trunkHeight + 4, z, BLOCK.LEAVES_PINE);
    }
  }
}

function generateDetails(world) {
  // Flowers and grass
  for (let i = 0; i < 800; i++) {
    const x = Math.floor(Math.random() * WORLD_SIZE_X);
    const z = Math.floor(Math.random() * WORLD_SIZE_Z);
    const h = world.getHeight(x, z);
    if (world.getBlock(x, h, z) === BLOCK.GRASS) {
      const r = Math.random();
      if (r < 0.3) world.setBlock(x, h + 1, z, BLOCK.FLOWER_RED);
      else if (r < 0.6) world.setBlock(x, h + 1, z, BLOCK.FLOWER_YELLOW);
      else if (r < 0.8) world.setBlock(x, h + 1, z, BLOCK.MUSHROOM);
      else world.setBlock(x, h + 1, z, BLOCK.REEDS);
    }
  }

  // Mushroom circles
  for (let i = 0; i < 10; i++) {
    const cx = Math.floor(Math.random() * WORLD_SIZE_X);
    const cz = Math.floor(Math.random() * WORLD_SIZE_Z);
    const ch = world.getHeight(cx, cz);
    for (let dx = -3; dx <= 3; dx++) {
      for (let dz = -3; dz <= 3; dz++) {
        const d = Math.sqrt(dx * dx + dz * dz);
        if (d < 3 && d > 1.5) {
          world.setBlock(cx + dx, ch + 1, cz + dz, BLOCK.MUSHROOM);
        }
      }
    }
  }

  // Reeds along river
  for (let x = 0; x < WORLD_SIZE_X; x += 2) {
    for (let z = 0; z < WORLD_SIZE_Z; z += 2) {
      const h = world.getHeight(x, z);
      if (world.getBlock(x, h, z) === BLOCK.WATER) {
        if (Math.random() > 0.7) {
          world.setBlock(x, h + 1, z, BLOCK.REEDS);
          if (Math.random() > 0.5) world.setBlock(x, h + 2, z, BLOCK.REEDS);
        }
      }
    }
  }

  // Lily pads
  for (let i = 0; i < 50; i++) {
    const x = Math.floor(Math.random() * WORLD_SIZE_X);
    const z = Math.floor(Math.random() * WORLD_SIZE_Z);
    const h = world.getHeight(x, z);
    if (world.getBlock(x, h, z) === BLOCK.WATER) {
      world.setBlock(x, h + 1, z, BLOCK.LILY_PAD);
    }
  }

  // Rocks and boulders
  for (let i = 0; i < 100; i++) {
    const x = Math.floor(Math.random() * WORLD_SIZE_X);
    const z = Math.floor(Math.random() * WORLD_SIZE_Z);
    const h = world.getHeight(x, z);
    if (world.getBlock(x, h, z) === BLOCK.GRASS || world.getBlock(x, h, z) === BLOCK.STONE) {
      world.setBlock(x, h + 1, z, BLOCK.GRAVEL);
      if (Math.random() > 0.5) world.setBlock(x + 1, h + 1, z, BLOCK.GRAVEL);
      if (Math.random() > 0.5) world.setBlock(x, h + 1, z + 1, BLOCK.GRAVEL);
    }
  }

  // Caves (simple tunnel carving)
  for (let i = 0; i < 5; i++) {
    let cx = Math.floor(Math.random() * WORLD_SIZE_X);
    let cy = 10 + Math.floor(Math.random() * 20);
    let cz = Math.floor(Math.random() * WORLD_SIZE_Z);
    const dirX = Math.random() - 0.5;
    const dirZ = Math.random() - 0.5;
    for (let step = 0; step < 50; step++) {
      cx += dirX + (Math.random() - 0.5);
      cz += dirZ + (Math.random() - 0.5);
      cy += Math.sin(step * 0.2) * 0.5;
      for (let dx = -2; dx <= 2; dx++) {
        for (let dy = -2; dy <= 2; dy++) {
          for (let dz = -2; dz <= 2; dz++) {
            if (dx*dx + dy*dy + dz*dz < 4) {
              world.setBlock(Math.floor(cx + dx), Math.floor(cy + dy), Math.floor(cz + dz), BLOCK.AIR);
            }
          }
        }
      }
      // Glowstone in caves
      if (Math.random() > 0.95) {
        world.setBlock(Math.floor(cx), Math.floor(cy), Math.floor(cz), BLOCK.GLOWSTONE);
      }
    }
  }

  // Cliffs
  for (let x = 0; x < WORLD_SIZE_X; x++) {
    for (let z = 0; z < WORLD_SIZE_Z; z++) {
      const h = world.getHeight(x, z);
      if (h > 40) {
        // Steep drop
        const h2 = world.getHeight(x + 1, z);
        if (h - h2 > 5) {
          for (let dy = h2; dy < h; dy++) {
            world.setBlock(x, dy, z, BLOCK.STONE);
          }
        }
      }
    }
  }

  // Hidden paths
  for (let i = 0; i < 3; i++) {
    let px = Math.floor(Math.random() * WORLD_SIZE_X);
    let pz = Math.floor(Math.random() * WORLD_SIZE_Z);
    for (let step = 0; step < 30; step++) {
      const h = world.getHeight(px, pz);
      world.setBlock(px, h, pz, BLOCK.PATH_DIRT);
      px += Math.floor(Math.random() * 3) - 1;
      pz += Math.floor(Math.random() * 3) - 1;
    }
  }

  // Lookout posts
  const lookoutPositions = [
    [WORLD_SIZE_X * 0.2, WORLD_SIZE_Z * 0.2],
    [WORLD_SIZE_X * 0.8, WORLD_SIZE_Z * 0.8],
    [WORLD_SIZE_X * 0.2, WORLD_SIZE_Z * 0.8]
  ];
  for (const [lx, lz] of lookoutPositions) {
    const lh = world.getHeight(Math.floor(lx), Math.floor(lz));
    for (let dy = 0; dy < 8; dy++) {
      world.setBlock(Math.floor(lx), lh + dy, Math.floor(lz), BLOCK.LOG_SIDE);
    }
    world.setBlock(Math.floor(lx), lh + 8, Math.floor(lz), BLOCK.LANTERN);
  }

  // Watchtowers (small)
  const watchtowerPositions = [
    [WORLD_SIZE_X * 0.4, WORLD_SIZE_Z * 0.2],
    [WORLD_SIZE_X * 0.6, WORLD_SIZE_Z * 0.3]
  ];
  for (const [wx, wz] of watchtowerPositions) {
    const wh = world.getHeight(Math.floor(wx), Math.floor(wz));
    for (let dx = -1; dx <= 1; dx++) {
      for (let dz = -1; dz <= 1; dz++) {
        for (let dy = 0; dy < 6; dy++) {
          world.setBlock(Math.floor(wx + dx), wh + dy, Math.floor(wz + dz), BLOCK.STONE_BRICK);
        }
      }
    }
    world.setBlock(Math.floor(wx), wh + 6, Math.floor(wz), BLOCK.TORCH);
  }

  // Snowy mountains (additional peaks)
  for (let i = 0; i < 3; i++) {
    const mx = Math.floor(Math.random() * WORLD_SIZE_X * 0.3 + WORLD_SIZE_X * 0.6);
    const mz = Math.floor(Math.random() * WORLD_SIZE_Z * 0.3 + WORLD_SIZE_Z * 0.6);
    const mh = world.getHeight(mx, mz);
    if (mh > 50) {
      for (let dx = -5; dx <= 5; dx++) {
        for (let dz = -5; dz <= 5; dz++) {
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d < 5) {
            const h = world.getHeight(mx + dx, mz + dz);
            for (let dy = h; dy < h + 3; dy++) {
              world.setBlock(mx + dx, dy, mz + dz, BLOCK.SNOW);
            }
          }
        }
      }
    }
  }

  // Ruins (scattered)
  for (let i = 0; i < 8; i++) {
    const rx = Math.floor(Math.random() * WORLD_SIZE_X);
    const rz = Math.floor(Math.random() * WORLD_SIZE_Z);
    const rh = world.getHeight(rx, rz);
    // Small ruin structure
    for (let dx = -2; dx <= 2; dx++) {
      for (let dz = -2; dz <= 2; dz++) {
        if (Math.random() > 0.4) {
          world.setBlock(rx + dx, rh + 1, rz + dz, BLOCK.CRACKED_STONE);
        }
      }
    }
  }

  // Campfire
  const campfirePositions = [
    [centerX + 5, centerZ + 5], [centerX - 5, centerZ - 5]
  ];
  for (const [cx, cz] of campfirePositions) {
    const ch = world.getHeight(cx, cz);
    world.setBlock(cx, ch + 1, cz, BLOCK.CAMPFIRE);
    world.setBlock(cx, ch + 2, cz, BLOCK.FIRE);
  }

  // Graves (cemetery near chapel)
  const chapelX = Math.floor(WORLD_SIZE_X * 0.55) + 10;
  const chapelZ = Math.floor(WORLD_SIZE_Z * 0.55) + 15;
  for (let i = 0; i < 12; i++) {
    const gx = chapelX + (Math.random() - 0.5) * 20;
    const gz = chapelZ + (Math.random() - 0.5) * 20;
    const gh = world.getHeight(Math.floor(gx), Math.floor(gz));
    world.setBlock(Math.floor(gx), gh + 1, Math.floor(gz), BLOCK.GRAVE);
  }

  // Weather vane on castle keep
  const castleX = Math.floor(WORLD_SIZE_X * 0.35);
  const castleZ = Math.floor(WORLD_SIZE_Z * 0.45);
  const castleH = world.getHeight(castleX, castleZ);
  world.setBlock(castleX, castleH + 25, castleZ, BLOCK.WEATHER_VANE);

  // Lightning rod on wizard tower (if we had one, put on keep instead)
  world.setBlock(castleX + 2, castleH + 24, castleZ + 2, BLOCK.LIGHTNING_ROD);
}

// ============================================
// MESH GENERATION (Greedy)
// ============================================
function generateChunkMesh(world, cx, cy, cz) {
  const chunk = world.getChunk(cx, cy, cz);
  if (!chunk) return null;

  const S = CHUNK_SIZE;
  const faces = [];

  const getBlockLocal = (lx, ly, lz) => {
    if (lx < 0 || ly < 0 || lz < 0 || lx >= S || ly >= S || lz >= S) {
      return world.getBlock(cx * S + lx, cy * S + ly, cz * S + lz);
    }
    return chunk[lx + ly * S + lz * S * S];
  };

  const isSolid = (id) => id !== BLOCK.AIR && !TRANSPARENT_BLOCKS.has(id);
  const isTransparent = (id) => TRANSPARENT_BLOCKS.has(id);

  // Greedy meshing for opaque blocks
  for (let axis = 0; axis < 3; axis++) {
    const u = (axis + 1) % 3;
    const v = (axis + 2) % 3;
    const dims = [S, S, S];
    const x = [0, 0, 0];
    const q = [0, 0, 0];
    q[axis] = 1;

    for (x[axis] = -1; x[axis] < dims[axis]; x[axis]++) {
      const mask = new Int32Array(dims[u] * dims[v]);
      let n = 0;

      for (x[v] = 0; x[v] < dims[v]; x[v]++) {
        for (x[u] = 0; x[u] < dims[u]; x[u]++) {
          const b1 = (x[axis] >= 0) ? getBlockLocal(x[0], x[1], x[2]) : BLOCK.AIR;
          const b2 = (x[axis] < dims[axis] - 1) ? getBlockLocal(x[0] + q[0], x[1] + q[1], x[2] + q[2]) : BLOCK.AIR;

          if (isSolid(b1) && !isSolid(b2)) {
            mask[n] = b1;
          } else if (!isSolid(b1) && isSolid(b2)) {
            mask[n] = -b2;
          } else {
            mask[n] = 0;
          }
          n++;
        }
      }

      x[axis]++;

      n = 0;
      for (let j = 0; j < dims[v]; j++) {
        for (let i = 0; i < dims[u]; ) {
          const maskVal = mask[n];
          if (maskVal !== 0) {
            let w = 1;
            while (i + w < dims[u] && mask[n + w] === maskVal) w++;

            let h = 1;
            outer: while (j + h < dims[v]) {
              for (let k = 0; k < w; k++) {
                if (mask[n + k + h * dims[u]] !== maskVal) break outer;
              }
              h++;
            }

            x[u] = i;
            x[v] = j;
            const pos = [x[0], x[1], x[2]];
            const du = [0, 0, 0]; du[u] = w;
            const dv = [0, 0, 0]; dv[v] = h;

            const normal = [0, 0, 0];
            normal[axis] = maskVal > 0 ? 1 : -1;
            const blockId = Math.abs(maskVal);

            const c1 = [pos[0], pos[1], pos[2]];
            const c2 = [pos[0] + du[0], pos[1] + du[1], pos[2] + du[2]];
            const c3 = [pos[0] + du[0] + dv[0], pos[1] + du[1] + dv[1], pos[2] + du[2] + dv[2]];
            const c4 = [pos[0] + dv[0], pos[1] + dv[1], pos[2] + dv[2]];

            if (maskVal > 0) {
              faces.push({ c1, c2, c3, c4, normal, blockId, transparent: false });
            } else {
              faces.push({ c1: c1, c2: c4, c3: c3, c4: c2, normal: [-normal[0], -normal[1], -normal[2]], blockId, transparent: false });
            }

            for (let l = 0; l < h; l++) {
              for (let k = 0; k < w; k++) {
                mask[n + k + l * dims[u]] = 0;
              }
            }

            i += w;
            n += w;
          } else {
            i++;
            n++;
          }
        }
      }
    }
  }

  // Separate pass for transparent blocks (water, glass, leaves)
  for (let axis = 0; axis < 3; axis++) {
    const u = (axis + 1) % 3;
    const v = (axis + 2) % 3;
    const dims = [S, S, S];
    const x = [0, 0, 0];
    const q = [0, 0, 0];
    q[axis] = 1;

    for (x[axis] = -1; x[axis] < dims[axis]; x[axis]++) {
      const mask = new Int32Array(dims[u] * dims[v]);
      let n = 0;

      for (x[v] = 0; x[v] < dims[v]; x[v]++) {
        for (x[u] = 0; x[u] < dims[u]; x[u]++) {
          const b1 = (x[axis] >= 0) ? getBlockLocal(x[0], x[1], x[2]) : BLOCK.AIR;
          const b2 = (x[axis] < dims[axis] - 1) ? getBlockLocal(x[0] + q[0], x[1] + q[1], x[2] + q[2]) : BLOCK.AIR;

          if (isTransparent(b1) && b1 !== b2) {
            mask[n] = b1;
          } else if (b1 !== b2 && isTransparent(b2)) {
            mask[n] = -b2;
          } else {
            mask[n] = 0;
          }
          n++;
        }
      }

      x[axis]++;

      n = 0;
      for (let j = 0; j < dims[v]; j++) {
        for (let i = 0; i < dims[u]; ) {
          const maskVal = mask[n];
          if (maskVal !== 0) {
            let w = 1;
            while (i + w < dims[u] && mask[n + w] === maskVal) w++;

            let h = 1;
            outer: while (j + h < dims[v]) {
              for (let k = 0; k < w; k++) {
                if (mask[n + k + h * dims[u]] !== maskVal) break outer;
              }
              h++;
            }

            x[u] = i;
            x[v] = j;
            const pos = [x[0], x[1], x[2]];
            const du = [0, 0, 0]; du[u] = w;
            const dv = [0, 0, 0]; dv[v] = h;

            const normal = [0, 0, 0];
            normal[axis] = maskVal > 0 ? 1 : -1;
            const blockId = Math.abs(maskVal);

            const c1 = [pos[0], pos[1], pos[2]];
            const c2 = [pos[0] + du[0], pos[1] + du[1], pos[2] + du[2]];
            const c3 = [pos[0] + du[0] + dv[0], pos[1] + du[1] + dv[1], pos[2] + du[2] + dv[2]];
            const c4 = [pos[0] + dv[0], pos[1] + dv[1], pos[2] + dv[2]];

            if (maskVal > 0) {
              faces.push({ c1, c2, c3, c4, normal, blockId, transparent: true });
            } else {
              faces.push({ c1: c1, c2: c4, c3: c3, c4: c2, normal: [-normal[0], -normal[1], -normal[2]], blockId, transparent: true });
            }

            for (let l = 0; l < h; l++) {
              for (let k = 0; k < w; k++) {
                mask[n + k + l * dims[u]] = 0;
              }
            }

            i += w;
            n += w;
          } else {
            i++;
            n++;
          }
        }
      }
    }
  }

  // Build buffers
  const verts = [];
  const inds = [];
  let idx = 0;

  for (const f of faces) {
    const { c1, c2, c3, c4, normal, blockId, transparent } = f;
    const color = BLOCK_COLORS[blockId] || [0.5, 0.5, 0.5];
    const emissive = EMISSIVE_BLOCKS.has(blockId) ? 1.0 : 0.0;

    // World positions
    const wx = cx * S;
    const wy = cy * S;
    const wz = cz * S;

    // Color variation
    const r = color[0] + Math.sin(c1[0] * 13 + c1[2] * 7 + wx) * 0.03;
    const g = color[1] + Math.cos(c1[2] * 11 + c1[1] * 5 + wy) * 0.03;
    const b = color[2] + Math.sin(c1[0] * 17 + c1[1] * 3 + wz) * 0.03;

    // AO approximation based on normal and position
    const aoBase = 0.85 + Math.sin(c1[0] * 0.5) * 0.05 + Math.sin(c1[2] * 0.5) * 0.05;

    verts.push(
      c1[0] + wx, c1[1] + wy, c1[2] + wz, normal[0], normal[1], normal[2], r, g, b, blockId, aoBase, emissive, transparent ? 1.0 : 0.0,
      c2[0] + wx, c2[1] + wy, c2[2] + wz, normal[0], normal[1], normal[2], r, g, b, blockId, aoBase * 0.9, emissive, transparent ? 1.0 : 0.0,
      c3[0] + wx, c3[1] + wy, c3[2] + wz, normal[0], normal[1], normal[2], r, g, b, blockId, aoBase * 0.8, emissive, transparent ? 1.0 : 0.0,
      c4[0] + wx, c4[1] + wy, c4[2] + wz, normal[0], normal[1], normal[2], r, g, b, blockId, aoBase * 0.9, emissive, transparent ? 1.0 : 0.0
    );

    inds.push(idx, idx + 1, idx + 2, idx, idx + 2, idx + 3);
    idx += 4;
  }

  return {
    vertices: new Float32Array(verts),
    indices: new Uint32Array(inds),
    faceCount: faces.length
  };
}
