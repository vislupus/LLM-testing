<!DOCTYPE html>
<html>
<head>
    <title>WebGPU Voxel Kingdom</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Voxel Kingdom (WebGPU)</h1>
        <p>WASD to Move | Mouse to Look | Shift/Space to Fly</p>
    </div>
    <canvas id="gpuCanvas"></canvas>

<script type="module">
const canvas = document.getElementById("gpuCanvas");
const adapter = await navigator.gpu.requestAdapter();
const device = await adapter.requestDevice();
const context = canvas.getContext("webgpu");
context.configure({ device, format: "bgra8unorm" });

// SHADER CODE
const shaderCode = 
struct Uniforms { mat4 viewProjection; };
@group(0) @binding(0) var<uniform> uniforms : Uniforms;

struct VertexOut { @builtin(position) pos: vec4<f32>, @location(0) col: vec4<f32> };

@vertex
fn vs(@builtin(vertex_index) vid: u32) -> VertexOut {
    var pos = array<vec3<f32>, 36>(
        vec3(-0.5,-0.5, 0.5), vec3( 0.5,-0.5, 0.5), vec3( 0.5, 0.5, 0.5), // Simplified cube primitive
        vec3(-0.5,-0.5, 0.5), vec3( 0.5, 0.5, 0.5), vec3(-0.5, 0.5, 0.5)
    );
    let p = pos[vid % 6];
    var out: VertexOut;
    out.pos = uniforms.viewProjection  vec4(p, 1.0);
    out.col = vec4(p.y + 0.5, 0.5, 0.2, 1.0);
    return out;
}

@fragment
fn fs(in: VertexOut) -> @location(0) vec4<f32> { return in.col; }
;

// PIPELINE SETUP
const shaderModule = device.createShaderModule({ code: shaderCode });
const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: { module: shaderModule, entryPoint: 'vs' },
    fragment: { module: shaderModule, entryPoint: 'fs', targets: [{ format: 'bgra8unorm' }] },
    primitive: { topology: 'triangle-list' }
});

// CAMERA / LOOP
let cameraPos = { x: 0, y: 10, z: -20 };
function frame() {
    const commandEncoder = device.createCommandEncoder();
    const pass = commandEncoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            loadOp: 'clear', clearValue: {r: 0.1, g: 0.2, b: 0.3, a: 1},
            storeOp: 'store'
        }]
    });
    pass.setPipeline(pipeline);
    pass.draw(6);
    pass.end();
    device.queue.submit([commandEncoder.finish()]);
    requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
