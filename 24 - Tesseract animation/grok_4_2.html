<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESSERACT • 4D Explorer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1f;
            font-family: 'Inter', system-ui;
            color: #ddd;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15,15,35,0.92);
            padding: 16px 22px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.6;
            pointer-events: none;
        }
        #help {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 13px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="ui">
        <div><strong>TESSERACT</strong> 4D Projection</div>
        <div>Drag to orbit • Scroll to zoom</div>
        <div style="margin-top:12px;font-size:12px;opacity:0.8">
            SPACE = pause<br>
            1-6 = toggle 4D plane rotation<br>
            + / - = speed<br>
            O = toggle ortho / perspective<br>
            R = reset angles
        </div>
    </div>
    <div id="help">DRAG MOUSE = rotate view • SCROLL = zoom</div>

    <script>
        // ================================================
        // TESSERACT 4D Explorer
        // Interactive 4D→3D→2D projection with multiple rotations
        // p5.js • Single standalone HTML file
        // Smooth morphing cube-within-cube + educational controls
        // ================================================

        let vertices4D = [];
        let edges = [];
        let angles = [0,0,0,0,0,0]; // for 6 planes: xy,xz,xw,yz,yw,zw
        let activePlanes = [true,true,true,true,true,true];
        let rotSpeed = 0.008;
        let paused = false;
        let orthoMode = false; // false = perspective in 3D
        let projDist4D = 4.2;
        let projDist3D = 3.8;
        
        let rotX = 0, rotY = 0; // 3D view rotation
        
        function setup() {
            createCanvas(920, 620);
            
            // Generate 16 vertices of tesseract (±1, ±1, ±1, ±1)
            for (let x = -1; x <= 1; x += 2) {
                for (let y = -1; y <= 1; y += 2) {
                    for (let z = -1; z <= 1; z += 2) {
                        for (let w = -1; w <= 1; w += 2) {
                            vertices4D.push(createVector(x, y, z, w));
                        }
                    }
                }
            }
            
            // Generate edges: differ in exactly one coordinate
            for (let i = 0; i < vertices4D.length; i++) {
                for (let j = i+1; j < vertices4D.length; j++) {
                    let diffCount = 0;
                    if (abs(vertices4D[i].x - vertices4D[j].x) > 1.9) diffCount++;
                    if (abs(vertices4D[i].y - vertices4D[j].y) > 1.9) diffCount++;
                    if (abs(vertices4D[i].z - vertices4D[j].z) > 1.9) diffCount++;
                    if (abs(vertices4D[i].w - vertices4D[j].w) > 1.9) diffCount++;
                    if (diffCount === 1) {
                        edges.push([i, j]);
                    }
                }
            }
        }
        
        function project4DTo3D(v4) {
            let d = projDist4D;
            let factor = d / (d - v4.w);
            return createVector(
                v4.x * factor,
                v4.y * factor,
                v4.z * factor
            );
        }
        
        function project3DTo2D(v3) {
            if (orthoMode) {
                return createVector(v3.x * 28, v3.y * 28);
            } else {
                let d = projDist3D;
                let factor = d / (d - v3.z);
                return createVector(
                    v3.x * factor * 28,
                    v3.y * factor * 28
                );
            }
        }
        
        function rotate4D(v, plane, theta) {
            let vNew = v.copy();
            let a = v.array();
            let i = plane[0];
            let j = plane[1];
            let cosT = cos(theta);
            let sinT = sin(theta);
            let temp = a[i] * cosT - a[j] * sinT;
            a[j] = a[i] * sinT + a[j] * cosT;
            a[i] = temp;
            return createVector(a[0], a[1], a[2], a[3]);
        }
        
        function draw() {
            background(10, 12, 22);
            translate(width/2, height/2);
            
            // Update angles
            if (!paused) {
                for (let i = 0; i < 6; i++) {
                    if (activePlanes[i]) angles[i] += rotSpeed;
                }
            }
            
            // Planes: 0=xy, 1=xz, 2=xw, 3=yz, 4=yw, 5=zw
            const planeList = [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]];
            
            // Project all vertices
            let projected2D = [];
            for (let i = 0; i < vertices4D.length; i++) {
                let v = vertices4D[i].copy();
                
                // Apply all active 4D rotations
                for (let p = 0; p < 6; p++) {
                    if (activePlanes[p]) {
                        v = rotate4D(v, planeList[p], angles[p]);
                    }
                }
                
                // 4D → 3D perspective
                let v3 = project4DTo3D(v);
                
                // 3D rotation from mouse
                let rx = rotX;
                let ry = rotY;
                let x = v3.x;
                let y = v3.y * cos(rx) - v3.z * sin(rx);
                let z = v3.y * sin(rx) + v3.z * cos(rx);
                let x2 = x * cos(ry) + z * sin(ry);
                let z2 = -x * sin(ry) + z * cos(ry);
                let v3rot = createVector(x2, y, z2);
                
                // 3D → 2D
                let v2 = project3DTo2D(v3rot);
                
                projected2D.push(v2);
            }
            
            // Draw edges
            stroke(100, 220, 255);
            strokeWeight(2.5);
            for (let edge of edges) {
                let a = projected2D[edge[0]];
                let b = projected2D[edge[1]];
                
                // Color inner vs outer edges based on average w
                let wAvg = (vertices4D[edge[0]].w + vertices4D[edge[1]].w) / 2;
                if (wAvg > 0) {
                    stroke(255, 180, 100);
                    strokeWeight(1.8);
                } else {
                    stroke(100, 220, 255);
                    strokeWeight(2.8);
                }
                line(a.x, a.y, b.x, b.y);
            }
            
            // Draw vertices
            noStroke();
            for (let i = 0; i < projected2D.length; i++) {
                let v2 = projected2D[i];
                let w = vertices4D[i].w;
                let alpha = map(w, -1, 1, 80, 255);
                fill(255, alpha);
                let sz = map(w, -1, 1, 4, 9);
                circle(v2.x, v2.y, sz);
            }
        }
        
        function mouseDragged() {
            rotY += (mouseX - pmouseX) * 0.008;
            rotX += (mouseY - pmouseY) * 0.008;
        }
        
        function mouseWheel(e) {
            // Zoom by changing 3D projection distance
            projDist3D += e.delta * 0.008;
            projDist3D = constrain(projDist3D, 1.5, 8);
            return false;
        }
        
        function keyPressed() {
            if (key === ' ') paused = !paused;
            if (key === 'r' || key === 'R') {
                angles = [0,0,0,0,0,0];
                rotX = rotY = 0;
            }
            if (key === 'o' || key === 'O') orthoMode = !orthoMode;
            
            // Toggle planes 1-6
            if (key >= '1' && key <= '6') {
                let idx = parseInt(key) - 1;
                activePlanes[idx] = !activePlanes[idx];
            }
            
            if (key === '+' || key === '=') rotSpeed += 0.002;
            if (key === '-') rotSpeed = max(0.001, rotSpeed - 0.002);
        }
        
        window.onload = () => {
            // p5 will call setup() automatically
        };
    </script>
</body>
</html>
