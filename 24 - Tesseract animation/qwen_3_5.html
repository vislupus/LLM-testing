<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Tesseract Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #canvas-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            backdrop-filter: blur(5px);
            width: 280px;
            pointer-events: auto;
            user-select: none;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 15px 0;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #00ffff;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .checkbox-item input {
            margin-right: 10px;
            accent-color: #00ffff;
        }

        .info-text {
            font-size: 0.75rem;
            color: #666;
            margin-top: 15px;
            line-height: 1.4;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .key-badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="ui-layer">
            <h1>4D Tesseract</h1>
            
            <div class="control-group">
                <label>Rotation Speed <span id="val-speed">1.0</span></label>
                <input type="range" id="inp-speed" min="0" max="5" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label>4D Camera Distance <span id="val-dist">3.0</span></label>
                <input type="range" id="inp-dist" min="1.5" max="6" step="0.1" value="3.0">
            </div>

            <div class="control-group">
                <label>3D Perspective Scale</label>
                <input type="range" id="inp-scale" min="100" max="600" step="10" value="300">
            </div>

            <div class="control-group">
                <label>Projection Mode</label>
                <div class="checkbox-item">
                    <input type="checkbox" id="chk-perspective" checked>
                    <span>Perspective (4D &rarr; 3D)</span>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="chk-ortho" >
                    <span>Orthographic (3D &rarr; 2D)</span>
                </div>
            </div>

            <div class="control-group">
                <label>Active Rotation Planes</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" class="plane-toggle" data-plane="XW" checked> XW Plane
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" class="plane-toggle" data-plane="YW" checked> YW Plane
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" class="plane-toggle" data-plane="ZW" checked> ZW Plane
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" class="plane-toggle" data-plane="XY"> XY Plane (3D Spin)
                    </label>
                </div>
            </div>

            <div class="info-text">
                <p><span class="key-badge">Space</span> Pause/Resume</p>
                <p><span class="key-badge">C</span> Toggle Color Gradient</p>
                <p>Vertices color indicates W-depth.</p>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & State ---
        let points = [];
        let edges = [];
        let angle = 0;
        let isPaused = false;
        let showColorGradient = true;

        // UI State
        const state = {
            speed: 1.0,
            distance4D: 3.0,
            scale3D: 300,
            perspective4D: true,
            ortho3D: false,
            planes: {
                XW: true,
                YW: true,
                ZW: true,
                XY: false
            }
        };

        // --- 4D Math Helpers ---

        class P4 {
            constructor(x, y, z, w) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.w = w;
            }

            copy() {
                return new P4(this.x, this.y, this.z, this.w);
            }
        }

        // Matrix multiplication for 4D rotation
        function matMul(v, m) {
            let x = v.x * m[0][0] + v.y * m[0][1] + v.z * m[0][2] + v.w * m[0][3];
            let y = v.x * m[1][0] + v.y * m[1][1] + v.z * m[1][2] + v.w * m[1][3];
            let z = v.x * m[2][0] + v.y * m[2][1] + v.z * m[2][2] + v.w * m[2][3];
            let w = v.x * m[3][0] + v.y * m[3][1] + v.z * m[3][2] + v.w * m[3][3];
            return new P4(x, y, z, w);
        }

        // --- Setup & Draw ---

        function setup() {
            let cnv = createCanvas(800, 800);
            cnv.parent('canvas-container');
            colorMode(HSB, 360, 100, 100, 100);
            initTesseract();
            setupUI();
        }

        function initTesseract() {
            points = [];
            // Generate 16 vertices of a hypercube (+-1, +-1, +-1, +-1)
            for (let i = 0; i < 16; i++) {
                let x = (i & 1) ? 1 : -1;
                let y = (i & 2) ? 1 : -1;
                let z = (i & 4) ? 1 : -1;
                let w = (i & 8) ? 1 : -1;
                points.push(new P4(x, y, z, w));
            }

            // Generate edges (connect points that differ by exactly 1 coordinate)
            edges = [];
            for (let i = 0; i < 16; i++) {
                for (let j = i + 1; j < 16; j++) {
                    let diff = 0;
                    // Check coordinates manually since we didn't store them as array
                    let p1 = points[i];
                    let p2 = points[j];
                    if (p1.x !== p2.x) diff++;
                    if (p1.y !== p2.y) diff++;
                    if (p1.z !== p2.z) diff++;
                    if (p1.w !== p2.w) diff++;
                    
                    if (diff === 1) {
                        edges.push([i, j]);
                    }
                }
            }
        }

        function draw() {
            background(10);
            translate(width / 2, height / 2);

            if (!isPaused) {
                angle += 0.01 * state.speed;
            }

            // 1. Calculate Rotated & Projected Points
            let projectedPoints = [];

            for (let i = 0; i < points.length; i++) {
                let p = points[i].copy();

                // --- 4D Rotations ---
                
                // XW Plane Rotation
                if (state.planes.XW) {
                    let s = sin(angle);
                    let c = cos(angle);
                    let x = p.x * c - p.w * s;
                    let w = p.x * s + p.w * c;
                    p.x = x;
                    p.w = w;
                }

                // YW Plane Rotation
                if (state.planes.YW) {
                    let s = sin(angle * 0.7); // Different speed for complexity
                    let c = cos(angle * 0.7);
                    let y = p.y * c - p.w * s;
                    let w = p.y * s + p.w * c;
                    p.y = y;
                    p.w = w;
                }

                // ZW Plane Rotation
                if (state.planes.ZW) {
                    let s = sin(angle * 0.5);
                    let c = cos(angle * 0.5);
                    let z = p.z * c - p.w * s;
                    let w = p.z * s + p.w * c;
                    p.z = z;
                    p.w = w;
                }

                // XY Plane Rotation (Standard 3D spin)
                if (state.planes.XY) {
                    let s = sin(angle * 0.3);
                    let c = cos(angle * 0.3);
                    let x = p.x * c - p.y * s;
                    let y = p.x * s + p.y * c;
                    p.x = x;
                    p.y = y;
                }

                // --- 4D to 3D Projection ---
                let p3 = { x: 0, y: 0, z: 0, w: p.w }; // Keep w for coloring
                
                if (state.perspective4D) {
                    // Perspective projection from 4D to 3D
                    // w is the distance from the 4D camera
                    let distance = state.distance4D;
                    let wVal = distance - p.w;
                    if (wVal === 0) wVal = 0.001; // Prevent division by zero
                    
                    let scale4D = 1 / wVal;
                    p3.x = p.x * scale4D;
                    p3.y = p.y * scale4D;
                    p3.z = p.z * scale4D;
                    p3.w = p.w; // Store original W for color
                } else {
                    // Orthographic projection (just drop W)
                    p3.x = p.x;
                    p3.y = p.y;
                    p3.z = p.z;
                    p3.w = p.w;
                }

                // --- 3D to 2D Projection ---
                let p2 = createVector(0, 0);
                
                if (!state.ortho3D) {
                    // Simple perspective for 3D -> 2D
                    // We assume a camera at z = some value looking at origin
                    // But since our object is centered, we can just scale by Z depth
                    // To make it look like a standard 3D view, we rotate the 3D object slightly
                    // so we see depth, or just use Z for scale.
                    
                    // Let's add a slight fixed 3D rotation so it's not flat
                    let rotX = 0.5; 
                    let rotY = 0.5;
                    
                    // Rotate Y
                    let x1 = p3.x * cos(rotY) - p3.z * sin(rotY);
                    let z1 = p3.x * sin(rotY) + p3.z * cos(rotY);
                    // Rotate X
                    let y1 = p3.y * cos(rotX) - z1 * sin(rotX);
                    let z2 = p3.y * sin(rotX) + z1 * cos(rotX);

                    let fov = state.scale3D;
                    let zDepth = 2 - z2; // Camera distance in 3D
                    if (zDepth < 0.1) zDepth = 0.1;
                    
                    let scale3D = fov / zDepth;
                    p2.x = x1 * scale3D;
                    p2.y = y1 * scale3D;
                } else {
                    // Orthographic 3D -> 2D (Isometric-ish)
                    let isoX = p3.x - p3.z * 0.5;
                    let isoY = p3.y - p3.z * 0.5;
                    p2.x = isoX * (state.scale3D / 2);
                    p2.y = isoY * (state.scale3D / 2);
                }

                projectedPoints.push({
                    x: p2.x,
                    y: p2.y,
                    w: p3.w // Store W for coloring
                });
            }

            // 2. Draw Edges
            strokeWeight(2);
            noFill();

            for (let i = 0; i < edges.length; i++) {
                let idxA = edges[i][0];
                let idxB = edges[i][1];
                let pA = projectedPoints[idxA];
                let pB = projectedPoints[idxB];

                // Color based on average W depth of the edge
                if (showColorGradient) {
                    let avgW = (pA.w + pB.w) / 2;
                    // Map W (-1 to 1) to Hue (180 to 360)
                    // -1 (back) = Cyan/Blue, 1 (front) = Magenta/Red
                    let hue = map(avgW, -1, 1, 180, 340);
                    stroke(hue, 80, 100, 80);
                } else {
                    stroke(200, 50, 100, 60);
                }

                line(pA.x, pA.y, pB.x, pB.y);
            }

            // 3. Draw Vertices
            noStroke();
            for (let i = 0; i < projectedPoints.length; i++) {
                let p = projectedPoints[i];
                
                // Size based on depth (W)
                let size = map(p.w, -1, 1, 4, 10);
                
                if (showColorGradient) {
                    let hue = map(p.w, -1, 1, 180, 340);
                    fill(hue, 90, 100);
                } else {
                    fill(255);
                }
                
                ellipse(p.x, p.y, size);
            }
        }

        // --- UI & Interaction ---

        function setupUI() {
            // Speed
            const inpSpeed = document.getElementById('inp-speed');
            const valSpeed = document.getElementById('val-speed');
            inpSpeed.addEventListener('input', (e) => {
                state.speed = parseFloat(e.target.value);
                valSpeed.innerText = state.speed.toFixed(1);
            });

            // Distance 4D
            const inpDist = document.getElementById('inp-dist');
            const valDist = document.getElementById('val-dist');
            inpDist.addEventListener('input', (e) => {
                state.distance4D = parseFloat(e.target.value);
                valDist.innerText = state.distance4D.toFixed(1);
            });

            // Scale 3D
            const inpScale = document.getElementById('inp-scale');
            inpScale.addEventListener('input', (e) => {
                state.scale3D = parseInt(e.target.value);
            });

            // Checkboxes
            document.getElementById('chk-perspective').addEventListener('change', (e) => {
                state.perspective4D = e.target.checked;
            });
            document.getElementById('chk-ortho').addEventListener('change', (e) => {
                state.ortho3D = e.target.checked;
            });

            // Plane Toggles
            document.querySelectorAll('.plane-toggle').forEach(chk => {
                chk.addEventListener('change', (e) => {
                    state.planes[e.target.dataset.plane] = e.target.checked;
                });
            });

            // Keyboard Controls
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    isPaused = !isPaused;
                }
                if (e.code === 'KeyC') {
                    showColorGradient = !showColorGradient;
                }
            });
        }

    </script>
</body>
</html>
