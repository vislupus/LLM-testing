<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tesseract — 4D Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  :root {
    --bg-0: #06070d;
    --bg-1: #0c0e1a;
    --line: rgba(140, 160, 220, 0.12);
    --text: #d4d8ec;
    --text-dim: #6a7090;
    --text-faint: #3d4260;
    --accent-warm: #ffb464;
    --accent-cool: #6cd0ff;
    --accent-on: #b4f0c8;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    overflow: hidden;
    height: 100%;
    -webkit-font-smoothing: antialiased;
  }

  canvas { display: block; }

  /* Title */
  #title {
    position: fixed;
    top: 28px;
    right: 32px;
    text-align: right;
    pointer-events: none;
    z-index: 10;
  }
  #title .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 38px;
    letter-spacing: 0.02em;
    color: var(--text);
    line-height: 1;
  }
  #title .sub {
    margin-top: 6px;
    font-size: 10px;
    letter-spacing: 0.32em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  /* Control panel */
  #panel {
    position: fixed;
    top: 28px; left: 28px;
    width: 280px;
    background: linear-gradient(180deg, rgba(12,14,26,0.92), rgba(8,10,18,0.92));
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px 20px 16px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 11px;
    letter-spacing: 0.04em;
    z-index: 10;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 24px 60px -20px rgba(0,0,0,0.7);
  }

  .section-label {
    font-size: 9px;
    letter-spacing: 0.32em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label::after {
    content: ''; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
  }
  .section-label:first-child { margin-top: 0; }

  .row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 4px 0;
    font-size: 11px;
  }
  .row .label { color: var(--text-dim); }
  .row .key {
    color: var(--accent-warm);
    font-weight: 500;
    font-size: 10px;
    background: rgba(255,180,100,0.06);
    border: 1px solid rgba(255,180,100,0.18);
    padding: 1px 6px;
    border-radius: 2px;
    letter-spacing: 0.08em;
  }
  .row .val {
    color: var(--accent-cool);
    font-weight: 400;
    font-variant-numeric: tabular-nums;
  }
  .row .val.on { color: var(--accent-on); }

  .planes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 4px;
  }
  .plane {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 6px 4px;
    background: rgba(255,255,255,0.015);
    border: 1px solid var(--line);
    border-radius: 3px;
    transition: all 0.2s;
    position: relative;
  }
  .plane.active {
    background: rgba(108, 208, 255, 0.06);
    border-color: rgba(108, 208, 255, 0.4);
  }
  .plane .pn {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .plane.active .pn { color: var(--accent-cool); }
  .plane .pk {
    font-size: 8px;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .plane .pa {
    font-size: 8px;
    color: var(--text-faint);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
    height: 10px;
  }
  .plane.active .pa { color: var(--accent-cool); opacity: 0.7; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }

  /* Bottom hint strip */
  #hint {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.28em;
    color: var(--text-faint);
    text-transform: uppercase;
    z-index: 10;
    pointer-events: none;
  }
  #hint span { color: var(--text-dim); }

  /* FPS */
  #fps {
    position: fixed;
    bottom: 24px; right: 32px;
    font-size: 10px;
    letter-spacing: 0.24em;
    color: var(--text-faint);
    text-transform: uppercase;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }
  #fps b { color: var(--text-dim); font-weight: 400; }

  /* Subtle frame on the canvas */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%, transparent 50%, rgba(0,0,0,0.5) 100%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(40,30,80,0.15), transparent 70%);
    pointer-events: none;
    z-index: 1;
  }
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 1;
  }

  #panel, #title, #hint, #fps { z-index: 10; }
</style>
</head>
<body>

<div id="title">
  <div class="name">Tesseract</div>
  <div class="sub">8-cell · 4D wireframe study</div>
</div>

<div id="panel">
  <div class="section-label">Transport</div>
  <div class="row"><span class="label">pause / resume</span><span class="key">SPC</span></div>
  <div class="row"><span class="label">reset rotation</span><span class="key">R</span></div>
  <div class="row"><span class="label">state</span><span class="val on" id="state">running</span></div>

  <div class="section-label">Projection</div>
  <div class="row"><span class="label">toggle ortho/persp</span><span class="key">O</span></div>
  <div class="row"><span class="label">color gradient</span><span class="key">G</span></div>
  <div class="row"><span class="label">4D distance</span><span class="key">← →</span></div>
  <div class="row"><span class="label">mode</span><span class="val" id="proj">perspective</span></div>
  <div class="row"><span class="label">distance</span><span class="val" id="dist">3.0</span></div>

  <div class="section-label">Speed</div>
  <div class="row"><span class="label">slower / faster</span><span class="key">↓ ↑</span></div>
  <div class="row"><span class="label">multiplier</span><span class="val" id="speed">1.0×</span></div>

  <div class="section-label">Rotation Planes</div>
  <div class="planes" id="planes"></div>
</div>

<div id="hint">drag <span>·</span> orbit 3d view <span>·</span> scroll <span>·</span> zoom</div>
<div id="fps"><b id="fpsval">60</b> fps</div>

<script>
// ============================================================
//  4D TESSERACT — wireframe visualization in p5.js
//
//  Pipeline:    R⁴ — (six 4D rotations) → R⁴ — (perspective or
//               orthographic w-projection) → R³ — (camera + screen
//               projection) → R² screen.
// ============================================================

// ---- Tesseract topology -----------------------------------------------------
// 16 vertices: every (±1, ±1, ±1, ±1)
// 32 edges:   pairs of vertices that differ in exactly one coordinate
const VERTS = [];
for (let i = 0; i < 16; i++) {
  VERTS.push([
    (i & 1) ? 1 : -1,
    (i & 2) ? 1 : -1,
    (i & 4) ? 1 : -1,
    (i & 8) ? 1 : -1,
  ]);
}
const EDGES = [];
for (let i = 0; i < 16; i++) {
  for (let j = i + 1; j < 16; j++) {
    const d = i ^ j;
    if (d && (d & (d - 1)) === 0) EDGES.push([i, j]);
  }
}

// ---- State ------------------------------------------------------------------
const PLANE_NAMES = ['XY', 'XZ', 'XW', 'YZ', 'YW', 'ZW'];
const PLANE_KEYS  = ['1',  '2',  '3',  '4',  '5',  '6' ];

// Each of the 6 rotation planes (4D has six independent ones, not three).
// XW, YW, ZW are the planes that mix in the 4th dimension — they're what
// make the cube-within-cube morph happen, so they're on by default.
const angles = [0, 0, 0, 0, 0, 0];
const baseSpeeds = [0.00, 0.00, 0.62, 0.00, 0.83, 0.41];  // base radians/sec
const active = [false, false, true, false, true, true];

let speedMult = 1.0;
let projDist = 3.0;
let perspective = true;
let paused = false;
let gradient = true;

// 3D camera (orbit around the projected 3D shape)
let camYaw = 0.35;
let camPitch = -0.18;
let camZoom = 1.0;
const CAM_DIST = 6.0;

let dragging = false;
let lastT = 0;

// ---- 4D math ----------------------------------------------------------------
function rotate4D(p, plane, theta) {
  const c = Math.cos(theta), s = Math.sin(theta);
  const [x, y, z, w] = p;
  switch (plane) {
    case 0: return [c*x - s*y, s*x + c*y, z, w];          // XY
    case 1: return [c*x - s*z, y, s*x + c*z, w];          // XZ
    case 2: return [c*x - s*w, y, z, s*x + c*w];          // XW
    case 3: return [x, c*y - s*z, s*y + c*z, w];          // YZ
    case 4: return [x, c*y - s*w, z, s*y + c*w];          // YW
    case 5: return [x, y, c*z - s*w, s*z + c*w];          // ZW
  }
  return p;
}

function project4Dto3D(p) {
  // Returns [x3, y3, z3, w_original] — w retained for color.
  if (!perspective) return [p[0], p[1], p[2], p[3]];
  const denom = projDist - p[3];
  const f = projDist / Math.max(denom, 0.0001);
  return [p[0] * f, p[1] * f, p[2] * f, p[3]];
}

function project3Dto2D(p) {
  // Yaw around Y, pitch around X, then perspective onto 2D.
  const cy = Math.cos(camYaw), sy = Math.sin(camYaw);
  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const x = p[0], y = p[1], z = p[2];
  const x1 =  cy * x - sy * z;
  const z1 =  sy * x + cy * z;
  const y2 =  cp * y - sp * z1;
  const z2 =  sp * y + cp * z1;

  const denom = CAM_DIST - z2;
  const f = (4.2 / Math.max(denom, 0.001)) * camZoom;
  const scale = Math.min(width, height) * 0.18;

  return [
    x1 * f * scale + width / 2,
    y2 * f * scale + height / 2,
    z2,                // depth in 3D camera space (for sorting & shading)
    p[3],              // 4D w (for color)
  ];
}

// ---- Color: cool→warm gradient driven by 4D w-coordinate -------------------
function colorForW(wNorm) {
  // wNorm in roughly [0,1].  Three-stop gradient:
  //   0.0  inner cube (positive w side after our convention)  → warm magenta
  //   0.5  connecting edges                                   → violet
  //   1.0  outer cube                                         → cyan
  if (!gradient) return [200, 220, 255];
  let r, g, b;
  if (wNorm < 0.5) {
    const t = wNorm / 0.5;
    r = lerp(255, 168, t);
    g = lerp( 96, 110, t);
    b = lerp(168, 232, t);
  } else {
    const t = (wNorm - 0.5) / 0.5;
    r = lerp(168, 108, t);
    g = lerp(110, 216, t);
    b = lerp(232, 255, t);
  }
  return [r, g, b];
}

// ---- p5 lifecycle -----------------------------------------------------------
function setup() {
  const c = createCanvas(windowWidth, windowHeight);
  c.style('display', 'block');
  smooth();
  buildPlaneUI();
  updateUI();
  lastT = millis();
}

function buildPlaneUI() {
  const root = document.getElementById('planes');
  for (let i = 0; i < 6; i++) {
    const div = document.createElement('div');
    div.className = 'plane' + (active[i] ? ' active' : '');
    div.id = 'pl-' + i;
    div.innerHTML =
      `<div class="pn">${PLANE_NAMES[i]}</div>` +
      `<div class="pk">${PLANE_KEYS[i]}</div>` +
      `<div class="pa" id="pa-${i}">—</div>`;
    div.addEventListener('click', () => togglePlane(i));
    root.appendChild(div);
  }
}

function togglePlane(i) {
  active[i] = !active[i];
  document.getElementById('pl-' + i).classList.toggle('active', active[i]);
}

function draw() {
  // Soft fade clear — gives a faint persistence-of-vision trail
  noStroke();
  fill(6, 7, 13, 230);
  rect(0, 0, width, height);

  // dt for frame-rate-independent rotation
  const now = millis();
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (!paused) {
    for (let i = 0; i < 6; i++) {
      if (active[i]) angles[i] += baseSpeeds[i] * speedMult * dt;
    }
  }

  // ---- Transform every vertex through the full pipeline --------------------
  const proj = new Array(16);
  for (let v = 0; v < 16; v++) {
    let p = VERTS[v];
    for (let r = 0; r < 6; r++) p = rotate4D(p, r, angles[r]);
    const p3 = project4Dto3D(p);
    proj[v] = project3Dto2D(p3);
  }

  // ---- Build edge list with depth metadata, sort back-to-front -------------
  const edgeData = new Array(EDGES.length);
  for (let e = 0; e < EDGES.length; e++) {
    const [a, b] = EDGES[e];
    const p1 = proj[a], p2 = proj[b];
    edgeData[e] = {
      p1, p2,
      midZ: (p1[2] + p2[2]) * 0.5,
      midW: (p1[3] + p2[3]) * 0.5,
    };
  }
  edgeData.sort((a, b) => a.midZ - b.midZ);

  // ---- Render edges with multi-pass glow ----------------------------------
  // w-range observed: roughly [-1, +1] but rotations can mix coords up to 2.
  // We map mid-w into [0,1] for color, and z into [0,1] for depth shading.
  for (const e of edgeData) {
    const wn = constrain((e.midW + 1.6) / 3.2, 0, 1);
    const zn = constrain((e.midZ + 3) / 6, 0, 1);            // far=0, near=1

    const [r, g, b] = colorForW(wn);
    const alphaCore = lerp(70, 235, zn);
    const widthCore = lerp(0.7, 2.0, zn);

    // Outer glow
    strokeWeight(widthCore + 7);
    stroke(r, g, b, alphaCore * 0.06);
    line(e.p1[0], e.p1[1], e.p2[0], e.p2[1]);

    strokeWeight(widthCore + 3);
    stroke(r, g, b, alphaCore * 0.16);
    line(e.p1[0], e.p1[1], e.p2[0], e.p2[1]);

    strokeWeight(widthCore + 1);
    stroke(r, g, b, alphaCore * 0.45);
    line(e.p1[0], e.p1[1], e.p2[0], e.p2[1]);

    // Crisp core
    strokeWeight(widthCore);
    stroke(255, 255, 255, alphaCore * 0.85);
    line(e.p1[0], e.p1[1], e.p2[0], e.p2[1]);
  }

  // ---- Vertex dots ---------------------------------------------------------
  for (let v = 0; v < 16; v++) {
    const p = proj[v];
    const wn = constrain((p[3] + 1.6) / 3.2, 0, 1);
    const zn = constrain((p[2] + 3) / 6, 0, 1);
    const [r, g, b] = colorForW(wn);

    noStroke();
    fill(r, g, b, 60);
    circle(p[0], p[1], lerp(8, 14, zn));
    fill(255, 255, 255, lerp(160, 255, zn));
    circle(p[0], p[1], lerp(2.0, 3.4, zn));
  }

  // ---- HUD updates --------------------------------------------------------
  // Per-plane angle readout (cheap, every frame)
  for (let i = 0; i < 6; i++) {
    const el = document.getElementById('pa-' + i);
    if (el) {
      const a = ((angles[i] % (Math.PI * 2)) * 180 / Math.PI);
      el.textContent = active[i] ? (a.toFixed(0) + '°') : '—';
    }
  }
  if (frameCount % 12 === 0) {
    document.getElementById('fpsval').textContent = Math.round(frameRate());
  }
}

// ---- Input ------------------------------------------------------------------
function keyPressed() {
  if (key === ' ') { paused = !paused; updateUI(); return false; }
  if (key === 'o' || key === 'O') { perspective = !perspective; updateUI(); }
  if (key === 'g' || key === 'G') { gradient = !gradient; }
  if (key === 'r' || key === 'R') {
    for (let i = 0; i < 6; i++) angles[i] = 0;
    camYaw = 0.35; camPitch = -0.18; camZoom = 1.0;
  }
  for (let i = 0; i < 6; i++) {
    if (key === PLANE_KEYS[i]) togglePlane(i);
  }
  if (keyCode === UP_ARROW)    { speedMult = Math.min(4.0, speedMult + 0.1); updateUI(); return false; }
  if (keyCode === DOWN_ARROW)  { speedMult = Math.max(0.0, speedMult - 0.1); updateUI(); return false; }
  if (keyCode === LEFT_ARROW)  { projDist = Math.max(2.2, projDist - 0.15); updateUI(); return false; }
  if (keyCode === RIGHT_ARROW) { projDist = Math.min(8.0, projDist + 0.15); updateUI(); return false; }
}

function mousePressed() {
  // Don't capture clicks on the panel
  if (mouseX < 340 && mouseY < 600) return;
  dragging = true;
}
function mouseReleased() { dragging = false; }
function mouseDragged() {
  if (!dragging) return;
  camYaw   += (mouseX - pmouseX) * 0.006;
  camPitch += (mouseY - pmouseY) * 0.006;
  camPitch = constrain(camPitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
}
function mouseWheel(e) {
  camZoom = constrain(camZoom * (1 - e.delta * 0.0008), 0.35, 3.0);
  return false;
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }

// ---- UI sync ----------------------------------------------------------------
function updateUI() {
  document.getElementById('proj').textContent  = perspective ? 'perspective' : 'orthographic';
  document.getElementById('dist').textContent  = projDist.toFixed(2);
  document.getElementById('speed').textContent = speedMult.toFixed(1) + '×';
  const s = document.getElementById('state');
  s.textContent = paused ? 'paused' : 'running';
  s.classList.toggle('on', !paused);
}
</script>
</body>
</html>
