<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 4D Tesseract in p5.js</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
</head>
<body>
    <script>
    // =======================================================================
    // Interactive 4D Tesseract (Hypercube) Visualization
    //
    // --- CONTROLS ---
    // [Space]      : Pause / Resume Animation
    // [P]          : Toggle Perspective / Orthographic Projection
    // [R]          : Reset Rotation Angles
    // [1] - [6]    : Toggle Rotation on the 6 Planes (XY, ZW, XZ, YW, XW, YZ)
    // [Mouse Wheel]: Adjust 4D projection distance (perspective effect)
    // =======================================================================

    // --- Tesseract Data ---
    let vertices = [];
    let edges = [];

    // --- Animation & Control State ---
    let angles = { xy: 0, zw: 0, xz: 0, yw: 0, xw: 0, yz: 0 };
    let isPaused = false;
    let rotationSpeeds = { xy: 0.01, zw: 0.015, xz: 0, yw: 0, xw: 0.007, yz: 0 };
    let activeRotations = {
        xy: { name: "XY", active: true },
        zw: { name: "ZW", active: true },
        xz: { name: "XZ", active: false },
        yw: { name: "YW", active: false },
        xw: { name: "XW", active: true },
        yz: { name: "YZ", active: false },
    };
    const rotationKeys = ['xy', 'zw', 'xz', 'yw', 'xw', 'yz'];

    // --- Projection Settings ---
    let isPerspective = true;
    let w_distance = 2.5; // Distance of the 3D "slice" from the 4D viewpoint
    let projectionScale;

    // --- Visuals ---
    const colorBack = [0, 255, 255];   // Cyan
    const colorFront = [255, 0, 255]; // Magenta

    function setup() {
        createCanvas(windowWidth, windowHeight);
        projectionScale = min(width, height) / 4;

        // 1. Generate the 16 vertices of a tesseract
        // A tesseract's vertices are at (±1, ±1, ±1, ±1)
        for (let i = 0; i < 16; i++) {
            let x = i & 1 ? -1 : 1;
            let y = i & 2 ? -1 : 1;
            let z = i & 4 ? -1 : 1;
            let w = i & 8 ? -1 : 1;
            vertices.push({ x, y, z, w });
        }

        // 2. Generate the 32 edges
        // An edge connects two vertices that differ in only one coordinate.
        for (let i = 0; i < vertices.length; i++) {
            for (let j = i + 1; j < vertices.length; j++) {
                let p1 = vertices[i];
                let p2 = vertices[j];
                let diff =
                    abs(p1.x - p2.x) +
                    abs(p1.y - p2.y) +
                    abs(p1.z - p2.z) +
                    abs(p1.w - p2.w);
                // If the sum of absolute differences is 2, it means one coordinate changed from -1 to 1.
                if (diff === 2) {
                    edges.push([i, j]);
                }
            }
        }
    }

    function draw() {
        background(10, 10, 10);
        translate(width / 2, height / 2);

        // --- 1. Update Angles (if not paused) ---
        if (!isPaused) {
            for (const key in angles) {
                if (activeRotations[key].active) {
                    angles[key] += rotationSpeeds[key];
                }
            }
        }

        // --- 2. Rotate Vertices in 4D ---
        let rotatedVertices = vertices.map(v => {
            let p = { ...v }; // Start with a copy of the original vertex
            p = rotate4D(p, 'xy', angles.xy);
            p = rotate4D(p, 'zw', angles.zw);
            p = rotate4D(p, 'xz', angles.xz);
            p = rotate4D(p, 'yw', angles.yw);
            p = rotate4D(p, 'xw', angles.xw);
            p = rotate4D(p, 'yz', angles.yz);
            return p;
        });

        // --- 3. Project from 4D to 3D, then 3D to 2D ---
        let projectedPoints2D = rotatedVertices.map(v => {
            // Project from 4D to 3D
            let w_perspective = isPerspective ? w_distance / (w_distance - v.w) : 1;
            let p3d = createVector(
                v.x * w_perspective,
                v.y * w_perspective,
                v.z * w_perspective
            );

            // Project from 3D to 2D (p5 does this implicitly, but for clarity, we can do it manually)
            // Here, we just scale the 3D points for rendering. p5's `vertex(x,y,z)` would be an alternative.
            // We can add a Z-perspective factor for more depth.
            let z_perspective = 1.5 / (1.5 - p3d.z * 0.5); // Simple 3D perspective
            return createVector(
                p3d.x * projectionScale * z_perspective,
                p3d.y * projectionScale * z_perspective
            );
        });

        // --- 4. Draw Edges ---
        for (const edge of edges) {
            const v1_index = edge[0];
            const v2_index = edge[1];

            const p1_rotated = rotatedVertices[v1_index];
            const p2_rotated = rotatedVertices[v2_index];
            
            const p1_projected = projectedPoints2D[v1_index];
            const p2_projected = projectedPoints2D[v2_index];

            // Color the line based on its average position in the 4th dimension (w)
            // This gives a visual cue for 4D depth.
            const avg_w = (p1_rotated.w + p2_rotated.w) / 2;
            const w_interp = map(avg_w, -1, 1, 0, 1);
            const stroke_color = lerpColor(color(colorBack), color(colorFront), w_interp);

            strokeWeight(map(w_interp, 0, 1, 1, 3)); // Make "closer" lines thicker
            stroke(stroke_color);
            line(p1_projected.x, p1_projected.y, p2_projected.x, p2_projected.y);
        }
        
        // --- 5. Draw HUD ---
        drawHUD();
    }
    
    /**
     * Rotates a 4D point in a specified plane by a given angle.
     * @param {{x,y,z,w}} p - The 4D point.
     * @param {string} plane - The plane of rotation ('xy', 'zw', etc.).
     * @param {number} theta - The angle in radians.
     * @returns {{x,y,z,w}} The new rotated point.
     */
    function rotate4D(p, plane, theta) {
        const c = cos(theta);
        const s = sin(theta);
        let x, y, z, w;

        switch (plane) {
            case 'xy':
                x = p.x * c - p.y * s;
                y = p.x * s + p.y * c;
                return { x, y, z: p.z, w: p.w };
            case 'zw':
                z = p.z * c - p.w * s;
                w = p.z * s + p.w * c;
                return { x: p.x, y: p.y, z, w };
            case 'xz':
                x = p.x * c - p.z * s;
                z = p.x * s + p.z * c;
                return { x, y: p.y, z, w: p.w };
            case 'yw':
                y = p.y * c - p.w * s;
                w = p.y * s + p.w * c;
                return { x: p.x, y, z: p.z, w };
            case 'xw':
                x = p.x * c - p.w * s;
                w = p.x * s + p.w * c;
                return { x, y: p.y, z: p.z, w };
            case 'yz':
                y = p.y * c - p.z * s;
                z = p.y * s + p.z * c;
                return { x: p.x, y, z, w: p.w };
            default:
                return p;
        }
    }

    function drawHUD() {
        push();
        resetMatrix(); // Draw in screen space
        fill(220);
        noStroke();
        textSize(14);
        
        let y_pos = 20;
        text("4D TESSERACT VISUALIZATION", 15, y_pos); y_pos += 25;

        text(`[Space] Animation: ${isPaused ? 'PAUSED' : 'RUNNING'}`, 15, y_pos); y_pos += 20;
        text(`[P] Projection: ${isPerspective ? 'Perspective' : 'Orthographic'}`, 15, y_pos); y_pos += 20;
        text(`[Wheel] 4D Distance: ${w_distance.toFixed(2)}`, 15, y_pos); y_pos += 25;
        
        text("[R] Reset Rotation", 15, y_pos); y_pos += 25;
        text("Toggle Rotation Planes [1-6]:", 15, y_pos); y_pos += 20;
        
        for (let i = 0; i < rotationKeys.length; i++) {
            const key = rotationKeys[i];
            const rot = activeRotations[key];
            fill(rot.active ? color(100, 255, 100) : 150); // Green for active, gray for inactive
            text(`  [${i + 1}] ${rot.name}`, 15, y_pos);
            y_pos += 18;
        }
        pop();
    }
    
    // --- User Input Handlers ---
    function keyPressed() {
        if (key === ' ') {
            isPaused = !isPaused;
        } else if (key.toLowerCase() === 'p') {
            isPerspective = !isPerspective;
        } else if (key.toLowerCase() === 'r') {
             for (const k in angles) angles[k] = 0;
        } else if (key >= '1' && key <= '6') {
            const index = parseInt(key) - 1;
            const rotKey = rotationKeys[index];
            activeRotations[rotKey].active = !activeRotations[rotKey].active;
            // If we re-enable a rotation, reset its angle to avoid a jump
            if (activeRotations[rotKey].active) {
                angles[rotKey] = 0;
            }
        }
    }
    
    function mouseWheel(event) {
        // Adjust the 4D projection distance
        w_distance -= event.delta * 0.005;
        w_distance = constrain(w_distance, 1.5, 10);
        return false; // Prevent page scrolling
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      projectionScale = min(width, height) / 4;
    }

    </script>
</body>
</html>
