<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Tesseract Visualization</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            width: 320px;
            border: 1px solid rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        #controls h3 {
            margin: 0 0 15px 0;
            color: #66ccff;
            text-shadow: 0 0 10px #66ccff;
            font-size: 16px;
            letter-spacing: 1px;
        }
        
        .control-group {
            margin: 12px 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            color: #88ddff;
            font-weight: bold;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
            accent-color: #66ccff;
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
            accent-color: #66ccff;
        }
        
        button {
            background: linear-gradient(135deg, #0066cc, #00aaff);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        button:hover {
            background: linear-gradient(135deg, #00aaff, #00ddff);
            box-shadow: 0 2px 15px rgba(100, 200, 255, 0.5);
        }
        
        .value-display {
            color: #00ffff;
            float: right;
            font-weight: bold;
        }
        
        .key {
            display: inline-block;
            background: rgba(100, 200, 255, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
            border: 1px solid rgba(100, 200, 255, 0.4);
        }
        
        .rotation-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            margin-top: 5px;
        }
        
        #info {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            text-align: right;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(100, 200, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="controls">
        <h3>◈ 4D Tesseract Projection</h3>
        
        <div class="control-group">
            <strong>⌨️ Keyboard Controls:</strong><br>
            <span class="key">Space</span> Pause/Resume<br>
            <span class="key">R</span> Reset rotation<br>
            <span class="key">P</span> Toggle projection type<br>
            <span class="key">G</span> Toggle color gradient<br>
            <span class="key">D</span> Toggle depth shading<br>
            <span class="key">1-6</span> Toggle rotation planes
        </div>
        
        <div class="control-group">
            <label>4D Distance:
                <span class="value-display" id="distance4dVal">3.0</span>
            </label>
            <input type="range" id="distance4d" min="1.5" max="6" value="3" step="0.1">
            
            <label>3D Distance:
                <span class="value-display" id="distance3dVal">4.0</span>
            </label>
            <input type="range" id="distance3d" min="2" max="8" value="4" step="0.1">
        </div>
        
        <div class="control-group">
            <label>Master Speed:
                <span class="value-display" id="speedVal">1.0</span>
            </label>
            <input type="range" id="masterSpeed" min="0" max="3" value="1" step="0.1">
            
            <label>4D Rotation Planes:</label>
            <div class="rotation-controls">
                <label><input type="checkbox" id="rotXY" checked> XY</label>
                <label><input type="checkbox" id="rotXZ"> XZ</label>
                <label><input type="checkbox" id="rotXW" checked> XW</label>
                <label><input type="checkbox" id="rotYZ"> YZ</label>
                <label><input type="checkbox" id="rotYW"> YW</label>
                <label><input type="checkbox" id="rotZW" checked> ZW</label>
            </div>
        </div>
        
        <div class="control-group">
            <label>Visual Options:</label>
            <label><input type="checkbox" id="perspective" checked> Perspective Projection</label>
            <label><input type="checkbox" id="gradient" checked> Color Gradient</label>
            <label><input type="checkbox" id="depthShading" checked> Depth Shading</label>
            <label><input type="checkbox" id="showVertices" checked> Show Vertices</label>
            <label><input type="checkbox" id="pulseEffect"> Pulse Effect</label>
        </div>
        
        <div class="control-group">
            <label>Edge Opacity:
                <span class="value-display" id="opacityVal">0.8</span>
            </label>
            <input type="range" id="edgeOpacity" min="0.1" max="1" value="0.8" step="0.1">
        </div>
        
        <div class="control-group">
            <button onclick="resetRotation()">Reset</button>
            <button onclick="togglePause()">Pause</button>
            <button onclick="randomizeRotation()">Random</button>
        </div>
    </div>
    
    <div id="info">
        FPS: <span id="fps">60</span><br>
        Vertices: 16 | Edges: 32<br>
        Projection: <span id="projectionType">Perspective</span>
    </div>

    <script>
        class Vector4 {
            constructor(x, y, z, w) {
                this.x = x;
                this.y = y;
                this.z = z;
                this.w = w;
            }
            
            rotate4D(angle, plane) {
                let rotated = new Vector4(this.x, this.y, this.z, this.w);
                let cos = Math.cos(angle);
                let sin = Math.sin(angle);
                
                switch(plane) {
                    case 'XY':
                        rotated.x = cos * this.x - sin * this.y;
                        rotated.y = sin * this.x + cos * this.y;
                        break;
                    case 'XZ':
                        rotated.x = cos * this.x - sin * this.z;
                        rotated.z = sin * this.x + cos * this.z;
                        break;
                    case 'XW':
                        rotated.x = cos * this.x - sin * this.w;
                        rotated.w = sin * this.x + cos * this.w;
                        break;
                    case 'YZ':
                        rotated.y = cos * this.y - sin * this.z;
                        rotated.z = sin * this.y + cos * this.z;
                        break;
                    case 'YW':
                        rotated.y = cos * this.y - sin * this.w;
                        rotated.w = sin * this.y + cos * this.w;
                        break;
                    case 'ZW':
                        rotated.z = cos * this.z - sin * this.w;
                        rotated.w = sin * this.z + cos * this.w;
                        break;
                }
                
                return rotated;
            }
            
            project3D(distance4d, perspective) {
                if (perspective) {
                    let w = 1 / (distance4d - this.w);
                    return createVector(
                        this.x * w,
                        this.y * w,
                        this.z * w
                    );
                } else {
                    // Orthographic projection
                    return createVector(this.x, this.y, this.z);
                }
            }
        }
        
        class Tesseract {
            constructor() {
                this.vertices = [];
                this.edges = [];
                this.projectedVertices = [];
                this.initializeGeometry();
                
                // Rotation angles for each plane
                this.angles = {
                    XY: 0, XZ: 0, XW: 0,
                    YZ: 0, YW: 0, ZW: 0
                };
                
                // Rotation speeds for each plane
                this.speeds = {
                    XY: 0.003, XZ: 0.005, XW: 0.007,
                    YZ: 0.011, YW: 0.013, ZW: 0.017
                };
            }
            
            initializeGeometry() {
                // Create 16 vertices of the tesseract
                for (let i = 0; i < 16; i++) {
                    let x = (i & 1) ? 1 : -1;
                    let y = (i & 2) ? 1 : -1;
                    let z = (i & 4) ? 1 : -1;
                    let w = (i & 8) ? 1 : -1;
                    this.vertices.push(new Vector4(x, y, z, w));
                }
                
                // Define edges (vertices that differ by only one bit)
                for (let i = 0; i < 16; i++) {
                    for (let j = i + 1; j < 16; j++) {
                        let diff = i ^ j;
                        // Check if exactly one bit is different (power of 2)
                        if ((diff & (diff - 1)) === 0) {
                            this.edges.push([i, j]);
                        }
                    }
                }
            }
            
            update(activeRotations, masterSpeed) {
                // Update rotation angles
                for (let plane in this.angles) {
                    if (activeRotations[plane]) {
                        this.angles[plane] += this.speeds[plane] * masterSpeed;
                    }
                }
            }
            
            project(distance4d, distance3d, perspective) {
                this.projectedVertices = [];
                
                for (let vertex of this.vertices) {
                    // Apply 4D rotations
                    let rotated = vertex;
                    for (let plane in this.angles) {
                        if (this.angles[plane] !== 0) {
                            rotated = rotated.rotate4D(this.angles[plane], plane);
                        }
                    }
                    
                    // Project from 4D to 3D
                    let projected3d = rotated.project3D(distance4d, perspective);
                    
                    // Project from 3D to 2D
                    let finalProjection;
                    if (perspective) {
                        let w = 1 / (distance3d - projected3d.z);
                        finalProjection = createVector(
                            projected3d.x * w * 200,
                            projected3d.y * w * 200
                        );
                        finalProjection.depth = projected3d.z;
                        finalProjection.w4d = rotated.w; // Store 4D w coordinate for coloring
                    } else {
                        finalProjection = createVector(
                            projected3d.x * 150,
                            projected3d.y * 150
                        );
                        finalProjection.depth = projected3d.z;
                        finalProjection.w4d = rotated.w;
                    }
                    
                    this.projectedVertices.push(finalProjection);
                }
            }
            
            render(options) {
                push();
                translate(width / 2, height / 2);
                
                // Draw edges
                for (let edge of this.edges) {
                    let v1 = this.projectedVertices[edge[0]];
                    let v2 = this.projectedVertices[edge[1]];
                    
                    if (!v1 || !v2) continue;
                    
                    // Calculate edge properties
                    let avgDepth = (v1.depth + v2.depth) / 2;
                    let avgW = (v1.w4d + v2.w4d) / 2;
                    
                    // Base stroke weight
                    let weight = map(avgDepth, -2, 2, 3, 1);
                    strokeWeight(weight);
                    
                    // Color based on options
                    let r, g, b, a;
                    
                    if (options.gradient) {
                        // Color gradient based on 4D position
                        r = map(avgW, -1, 1, 100, 255);
                        g = map(avgDepth, -2, 2, 100, 255);
                        b = 200;
                    } else {
                        // Simple white
                        r = g = b = 255;
                    }
                    
                    if (options.depthShading) {
                        // Apply depth-based shading
                        let brightness = map(avgDepth, -2, 2, 0.3, 1);
                        r *= brightness;
                        g *= brightness;
                        b *= brightness;
                    }
                    
                    a = options.edgeOpacity * 255;
                    
                    if (options.pulseEffect) {
                        // Add pulsing effect
                        let pulse = sin(frameCount * 0.05 + avgW * PI) * 0.3 + 0.7;
                        a *= pulse;
                    }
                    
                    stroke(r, g, b, a);
                    line(v1.x, v1.y, v2.x, v2.y);
                }
                
                // Draw vertices
                if (options.showVertices) {
                    for (let i = 0; i < this.projectedVertices.length; i++) {
                        let v = this.projectedVertices[i];
                        
                        let size = map(v.depth, -2, 2, 8, 4);
                        
                        if (options.gradient) {
                            let r = map(v.w4d, -1, 1, 100, 255);
                            let g = map(v.depth, -2, 2, 100, 255);
                            fill(r, g, 255, 200);
                        } else {
                            fill(255, 255, 255, 200);
                        }
                        
                        noStroke();
                        ellipse(v.x, v.y, size, size);
                    }
                }
                
                pop();
            }
            
            resetRotation() {
                for (let plane in this.angles) {
                    this.angles[plane] = 0;
                }
            }
            
            randomizeRotation() {
                for (let plane in this.angles) {
                    this.angles[plane] = random(TWO_PI);
                    this.speeds[plane] = random(0.001, 0.02);
                }
            }
        }
        
        let tesseract;
        let isPaused = false;
        let options = {
            perspective: true,
            gradient: true,
            depthShading: true,
            showVertices: true,
            pulseEffect: false,
            edgeOpacity: 0.8
        };
        
        let activeRotations = {
            XY: true, XZ: false, XW: true,
            YZ: false, YW: false, ZW: true
        };
        
        let distance4d = 3;
        let distance3d = 4;
        let masterSpeed = 1;
        
        function setup() {
            createCanvas(windowWidth, windowHeight);
            tesseract = new Tesseract();
            setupControls();
        }
        
        function draw() {
            // Dark gradient background
            for (let i = 0; i <= height; i++) {
                let inter = map(i, 0, height, 0, 1);
                let c = lerpColor(color(0, 5, 20), color(0, 0, 5), inter);
                stroke(c);
                line(0, i, width, i);
            }
            
            // Update tesseract
            if (!isPaused) {
                tesseract.update(activeRotations, masterSpeed);
            }
            
            // Project tesseract
            tesseract.project(distance4d, distance3d, options.perspective);
            
            // Render tesseract
            tesseract.render(options);
            
            // Draw center reference
            push();
            translate(width / 2, height / 2);
            stroke(100, 200, 255, 50);
            strokeWeight(1);
            noFill();
            
            // Draw circular guides
            for (let r = 100; r <= 300; r += 100) {
                ellipse(0, 0, r * 2, r * 2);
            }
            
            // Draw axis lines
            line(-width / 2, 0, width / 2, 0);
            line(0, -height / 2, 0, height / 2);
            pop();
            
            // Update stats
            if (frameCount % 10 === 0) {
                document.getElementById('fps').textContent = Math.round(frameRate());
                document.getElementById('projectionType').textContent = options.perspective ? 'Perspective' : 'Orthographic';
            }
        }
        
        function setupControls() {
            // 4D distance slider
            document.getElementById('distance4d').addEventListener('input', function(e) {
                distance4d = parseFloat(e.target.value);
                document.getElementById('distance4dVal').textContent = distance4d.toFixed(1);
            });
            
            // 3D distance slider
            document.getElementById('distance3d').addEventListener('input', function(e) {
                distance3d = parseFloat(e.target.value);
                document.getElementById('distance3dVal').textContent = distance3d.toFixed(1);
            });
            
            // Master speed slider
            document.getElementById('masterSpeed').addEventListener('input', function(e) {
                masterSpeed = parseFloat(e.target.value);
                document.getElementById('speedVal').textContent = masterSpeed.toFixed(1);
            });
            
            // Edge opacity slider
            document.getElementById('edgeOpacity').addEventListener('input', function(e) {
                options.edgeOpacity = parseFloat(e.target.value);
                document.getElementById('opacityVal').textContent = options.edgeOpacity.toFixed(1);
            });
            
            // Rotation plane checkboxes
            ['XY', 'XZ', 'XW', 'YZ', 'YW', 'ZW'].forEach(plane => {
                document.getElementById('rot' + plane).addEventListener('change', function(e) {
                    activeRotations[plane] = e.target.checked;
                });
            });
            
            // Visual option checkboxes
            document.getElementById('perspective').addEventListener('change', function(e) {
                options.perspective = e.target.checked;
            });
            
            document.getElementById('gradient').addEventListener('change', function(e) {
                options.gradient = e.target.checked;
            });
            
            document.getElementById('depthShading').addEventListener('change', function(e) {
                options.depthShading = e.target.checked;
            });
            
            document.getElementById('showVertices').addEventListener('change', function(e) {
                options.showVertices = e.target.checked;
            });
            
            document.getElementById('pulseEffect').addEventListener('change', function(e) {
                options.pulseEffect = e.target.checked;
            });
        }
        
        function keyPressed() {
            switch(key.toLowerCase()) {
                case ' ':
                    togglePause();
                    break;
                case 'r':
                    resetRotation();
                    break;
                case 'p':
                    options.perspective = !options.perspective;
                    document.getElementById('perspective').checked = options.perspective;
                    break;
                case 'g':
                    options.gradient = !options.gradient;
                    document.getElementById('gradient').checked = options.gradient;
                    break;
                case 'd':
                    options.depthShading = !options.depthShading;
                    document.getElementById('depthShading').checked = options.depthShading;
                    break;
            }
            
            // Number keys for rotation planes
            if (key >= '1' && key <= '6') {
                let planes = ['XY', 'XZ', 'XW', 'YZ', 'YW', 'ZW'];
                let idx = parseInt(key) - 1;
                activeRotations[planes[idx]] = !activeRotations[planes[idx]];
                document.getElementById('rot' + planes[idx]).checked = activeRotations[planes[idx]];
            }
        }
        
        function resetRotation() {
            tesseract.resetRotation();
        }
        
        function togglePause() {
            isPaused = !isPaused;
        }
        
        function randomizeRotation() {
            tesseract.randomizeRotation();
        }
        
        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
