<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 4D Tesseract</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            position: relative;
        }
        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 150, 255, 0.1);
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 35, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(100, 100, 255, 0.2);
            font-size: 14px;
            pointer-events: none;
            max-width: 300px;
            line-height: 1.5;
            backdrop-filter: blur(5px);
        }
        h3 { margin: 0 0 10px 0; color: #4dc9f6; font-size: 16px; text-transform: uppercase; letter-spacing: 1px;}
        .key { color: #ffaa00; font-weight: bold; background: rgba(255,255,255,0.1); padding: 2px 5px; border-radius: 3px;}
        .status { margin-top: 10px; font-size: 12px; color: #aaa; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .highlight { color: #4dc9f6; }
    </style>
</head>
<body>

<div id="canvas-container">
    <div id="ui">
        <h3>Tesseract Controls</h3>
        <span class="key">1-6</span> Toggle Rotation Planes<br>
        <span class="key">SPACE</span> Pause / Resume<br>
        <span class="key">P</span> Perspective / Orthographic<br>
        <span class="key">UP/DOWN</span> 4D Projection Distance<br>
        <span class="key">LEFT/RIGHT</span> Rotation Speed<br>
        
        <div class="status">
            Active Planes: <span id="activePlanes" class="highlight">XW, YW</span><br>
            Projection: <span id="projType" class="highlight">Perspective</span><br>
            4D Distance: <span id="dist4d" class="highlight">2.5</span><br>
            Speed: <span id="speed" class="highlight">1.0x</span><br>
            Status: <span id="status" class="highlight">Playing</span>
        </div>
    </div>
</div>

<script>
    // Configuration
    const DIM = 4;
    const NUM_VERTICES = 16;
    const NUM_EDGES = 32;
    const SCALE_3D = 200; // Scaling factor for final 2D projection
    
    // Data structures
    let vertices = [];
    let edges = [];
    let projected = [];
    let wValues = []; // Store w coordinates before projection for coloring
    
    // State variables
    let angles = [0, 0, 0, 0, 0, 0]; // XY, XZ, YZ, XW, YW, ZW
    let speeds = [0, 0, 0, 0.01, 0.015, 0.005]; // Default rotation speeds
    let isRotating = [false, false, false, true, true, true]; // Active planes
    
    let isPaused = false;
    let isPerspective = true;
    let dist4D = 2.5;
    let speedMultiplier = 1.0;
    
    // Colors
    let colorInner, colorOuter, colorBg;
    
    function setup() {
        let canvas = createCanvas(800, 800);
        canvas.parent('canvas-container');
        
        colorInner = color(50, 150, 255); // Blue for w < 0
        colorOuter = color(255, 100, 50); // Orange for w > 0
        colorBg = color(15, 15, 26);
        
        // Generate 16 vertices
        for (let i = 0; i < NUM_VERTICES; i++) {
            vertices.push([
                (i & 1) ? 1 : -1,
                (i & 2) ? 1 : -1,
                (i & 4) ? 1 : -1,
                (i & 8) ? 1 : -1
            ]);
        }
        
        // Generate 32 edges (connect vertices differing by 1 bit)
        for (let i = 0; i < NUM_VERTICES; i++) {
            for (let j = i + 1; j < NUM_VERTICES; j++) {
                let diff = i ^ j;
                // Check if exactly one bit is different (power of 2)
                if (diff > 0 && (diff & (diff - 1)) === 0) {
                    edges.push([i, j]);
                }
            }
        }
    }
    
    function draw() {
        background(colorBg);
        translate(width / 2, height / 2);
        
        // Update angles
        if (!isPaused) {
            for (let i = 0; i < 6; i++) {
                if (isRotating[i]) {
                    angles[i] += speeds[i] * speedMultiplier;
                }
            }
        }
        
        // Project vertices
        for (let i = 0; i < NUM_VERTICES; i++) {
            let v = vertices[i].slice(); // Clone
            v = rotate4D(v);
            wValues[i] = v[3]; // Save w for coloring
            
            let p = project4Dto3D(v);
            p = project3Dto2D(p);
            projected[i] = p;
        }
        
        // Draw edges
        strokeWeight(2);
        for (let i = 0; i < NUM_EDGES; i++) {
            let idx1 = edges[i][0];
            let idx2 = edges[i][1];
            
            let p1 = projected[idx1];
            let p2 = projected[idx2];
            
            // Color based on average w value of the edge's vertices
            let avgW = (wValues[idx1] + wValues[idx2]) / 2;
            let col = getGradientColor(avgW);
            
            // Alpha based on depth (z in 3D space before 2D projection) - subtle shading
            // Not strictly necessary but adds depth. Let's keep color solid but gradient.
            stroke(col);
            line(p1[0] * SCALE_3D, p1[1] * SCALE_3D, p2[0] * SCALE_3D, p2[1] * SCALE_3D);
        }
        
        // Draw vertices
        noStroke();
        for (let i = 0; i < NUM_VERTICES; i++) {
            let p = projected[i];
            let col = getGradientColor(wValues[i]);
            fill(col);
            let size = map(abs(wValues[i]), 0, 1.5, 4, 8); // Closer (higher abs w) appears larger due to perspective, simulate slightly
            ellipse(p[0] * SCALE_3D, p[1] * SCALE_3D, size, size);
        }
        
        // Update UI
        updateUI();
    }
    
    // --- Math Functions ---
    
    function rotate4D(v) {
        let [x, y, z, w] = v;
        let c, s, nx, ny, nz, nw;
        
        // XY Plane (0)
        c = cos(angles[0]); s = sin(angles[0]);
        nx = x*c - y*s; ny = x*s + y*c; x = nx; y = ny;
        
        // XZ Plane (1)
        c = cos(angles[1]); s = sin(angles[1]);
        nx = x*c - z*s; nz = x*s + z*c; x = nx; z = nz;
        
        // YZ Plane (2)
        c = cos(angles[2]); s = sin(angles[2]);
        ny = y*c - z*s; nz = y*s + z*c; y = ny; z = nz;
        
        // XW Plane (3)
        c = cos(angles[3]); s = sin(angles[3]);
        nx = x*c - w*s; nw = x*s + w*c; x = nx; w = nw;
        
        // YW Plane (4)
        c = cos(angles[4]); s = sin(angles[4]);
        ny = y*c - w*s; nw = y*s + w*c; y = ny; w = nw;
        
        // ZW Plane (5)
        c = cos(angles[5]); s = sin(angles[5]);
        nz = z*c - w*s; nw = z*s + w*c; z = nz; w = nw;
        
        return [x, y, z, w];
    }
    
    function project4Dto3D(v) {
        let [x, y, z, w] = v;
        if (isPerspective) {
            // Perspective projection from W axis
            let d = abs(dist4D);
            let scale = d / (d - w);
            return [x * scale, y * scale, z * scale];
        } else {
            // Orthographic - just drop W
            return [x, y, z];
        }
    }
    
    function project3Dto2D(p) {
        let [x, y, z] = p;
        if (isPerspective) {
            // Simple 3D perspective from Z axis
            let d = 4; // Fixed 3D camera distance
            let scale = d / (d - z);
            return [x * scale, y * scale];
        } else {
            // Orthographic - just drop Z
            return [x, y];
        }
    }
    
    function getGradientColor(w) {
        // Map w (-1.5 to 1.5) to color (Inner Blue to Outer Orange)
        let t = map(w, -1.5, 1.5, 0, 1);
        t = constrain(t, 0, 1);
        return lerpColor(colorInner, colorOuter, t);
    }
    
    // --- Controls ---
    
    function keyPressed() {
        // Toggle rotation planes 1-6
        if (key >= '1' && key <= '6') {
            let idx = int(key) - 1;
            isRotating[idx] = !isRotating[idx];
        }
        
        // Pause/Resume
        if (key === ' ') {
            isPaused = !isPaused;
        }
        
        // Toggle Projection
        if (key === 'p' || key === 'P') {
            isPerspective = !isPerspective;
        }
        
        // Adjust Projection Distance
        if (keyCode === UP_ARROW) {
            dist4D = min(5, dist4D + 0.1);
        } else if (keyCode === DOWN_ARROW) {
            dist4D = max(1.1, dist4D - 0.1);
        }
        
        // Adjust Speed
        if (keyCode === RIGHT_ARROW) {
            speedMultiplier = min(3.0, speedMultiplier + 0.1);
        } else if (keyCode === LEFT_ARROW) {
            speedMultiplier = max(0.1, speedMultiplier - 0.1);
        }
    }
    
    function updateUI() {
        let planeNames = ['XY', 'XZ', 'YZ', 'XW', 'YW', 'ZW'];
        let activeStr = "";
        for(let i=0; i<6; i++) {
            if(isRotating[i]) activeStr += planeNames[i] + " ";
        }
        if(activeStr === "") activeStr = "None";
        
        document.getElementById('activePlanes').innerText = activeStr;
        document.getElementById('projType').innerText = isPerspective ? "Perspective" : "Orthographic";
        document.getElementById('dist4d').innerText = dist4D.toFixed(1);
        document.getElementById('speed').innerText = speedMultiplier.toFixed(1) + "x";
        document.getElementById('status').innerText = isPaused ? "Paused" : "Playing";
    }
</script>
</body>
</html>
