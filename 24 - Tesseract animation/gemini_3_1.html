<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 4D Tesseract</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0d12;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 28, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 1.4rem;
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .control-group {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #00e5ff;
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .checkbox-item input {
            margin-right: 8px;
            accent-color: #00e5ff;
            cursor: pointer;
        }

        select {
            width: 100%;
            background: #1a1a24;
            color: #fff;
            border: 1px solid #333;
            padding: 8px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
        }

        button {
            width: 100%;
            background: linear-gradient(45deg, #00e5ff, #0077ff);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        button:hover { opacity: 0.9; }
        button:active { transform: scale(0.98); }

        .info {
            font-size: 0.75rem;
            color: #777;
            line-height: 1.4;
            margin-top: 10px;
        }
        
        .color-legend {
            display: flex;
            justify-content: space-between;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            height: 6px;
            border-radius: 3px;
            margin-top: 10px;
        }
        .color-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h1>Tesseract 4D</h1>

        <button id="btn-pause">Pause Rotation (Space)</button>

        <div class="control-group">
            <div class="control-header">
                <span>Rotation Speed</span>
                <span id="val-speed">1.5x</span>
            </div>
            <input type="range" id="sl-speed" min="0" max="3" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <div class="control-header"><span>Active 4D Rotation Planes</span></div>
            <div class="checkbox-grid">
                <label class="checkbox-item"><input type="checkbox" id="chk-xy"> XY Plane</label>
                <label class="checkbox-item"><input type="checkbox" id="chk-xz"> XZ Plane</label>
                <label class="checkbox-item"><input type="checkbox" id="chk-xw" checked> XW Plane</label>
                <label class="checkbox-item"><input type="checkbox" id="chk-yz" checked> YZ Plane</label>
                <label class="checkbox-item"><input type="checkbox" id="chk-yw"> YW Plane</label>
                <label class="checkbox-item"><input type="checkbox" id="chk-zw"> ZW Plane</label>
            </div>
        </div>

        <div class="control-group">
            <div class="control-header"><span>4D &rarr; 3D Projection</span></div>
            <select id="sel-proj4d">
                <option value="perspective">Perspective</option>
                <option value="orthographic">Orthographic</option>
            </select>
            <div class="control-header" style="margin-top: 10px;">
                <span>4D Camera Distance</span>
                <span id="val-dist4d">2.5</span>
            </div>
            <input type="range" id="sl-dist4d" min="2.2" max="6.0" step="0.1" value="2.5">
        </div>

        <div class="control-group">
            <div class="control-header"><span>3D &rarr; 2D Projection</span></div>
            <select id="sel-proj3d">
                <option value="perspective">Perspective</option>
                <option value="orthographic">Orthographic</option>
            </select>
            <div class="control-header" style="margin-top: 10px;">
                <span>3D Camera Distance</span>
                <span id="val-dist3d">3.0</span>
            </div>
            <input type="range" id="sl-dist3d" min="2.2" max="6.0" step="0.1" value="3.0">
        </div>

        <div class="info">
            <b>Depth Visualization:</b> Line color represents the 4th dimension (W-axis). 
            <div class="color-legend"></div>
            <div class="color-labels"><span>Close (-W)</span><span>Far (+W)</span></div>
        </div>
    </div>

<script>
/**
 * 4D Vector Class
 */
class Vec4 {
    constructor(x, y, z, w) {
        this.x = x; this.y = y; this.z = z; this.w = w;
    }
}

// Geometry Data
const points = [];
const edges = [];

// State Variables
let angles = { xy: 0, xz: 0, xw: 0, yz: 0, yw: 0, zw: 0 };
let isPaused = false;
let baseScale;

// UI Elements
const uiSpeed = document.getElementById('sl-speed');
const uiDist4D = document.getElementById('sl-dist4d');
const uiDist3D = document.getElementById('sl-dist3d');
const uiProj4D = document.getElementById('sel-proj4d');
const uiProj3D = document.getElementById('sel-proj3d');
const btnPause = document.getElementById('btn-pause');

// Initialize 4D Vertices and Edges
function initTesseract() {
    // Generate 16 vertices of a tesseract (±1, ±1, ±1, ±1)
    for (let i = 0; i < 16; i++) {
        let x = (i & 1) ? 1 : -1;
        let y = (i & 2) ? 1 : -1;
        let z = (i & 4) ? 1 : -1;
        let w = (i & 8) ? 1 : -1;
        points.push(new Vec4(x, y, z, w));
    }

    // Connect vertices that differ by exactly 1 coordinate (32 edges)
    for (let i = 0; i < 16; i++) {
        for (let j = 0; j < 4; j++) {
            let neighbor = i ^ (1 << j);
            if (i < neighbor) {
                edges.push([i, neighbor]);
            }
        }
    }
}

// 4D Rotation Functions
function rotateXY(v, a) { return new Vec4(v.x * cos(a) - v.y * sin(a), v.x * sin(a) + v.y * cos(a), v.z, v.w); }
function rotateXZ(v, a) { return new Vec4(v.x * cos(a) - v.z * sin(a), v.y, v.x * sin(a) + v.z * cos(a), v.w); }
function rotateXW(v, a) { return new Vec4(v.x * cos(a) - v.w * sin(a), v.y, v.z, v.x * sin(a) + v.w * cos(a)); }
function rotateYZ(v, a) { return new Vec4(v.x, v.y * cos(a) - v.z * sin(a), v.y * sin(a) + v.z * cos(a), v.w); }
function rotateYW(v, a) { return new Vec4(v.x, v.y * cos(a) - v.w * sin(a), v.z, v.y * sin(a) + v.w * cos(a)); }
function rotateZW(v, a) { return new Vec4(v.x, v.y, v.z * cos(a) - v.w * sin(a), v.z * sin(a) + v.w * cos(a)); }

// Map W coordinate to a Cyan-Magenta Color Gradient
function getDepthColor(w) {
    // w generally ranges from -2 to 2 after multiple rotations.
    let t = map(w, -2, 2, 0, 1, true);
    
    // Cyan (180) to Magenta (300) in HSB
    colorMode(HSB, 360, 100, 100, 1);
    let h = lerp(180, 300, t);
    let c = color(h, 100, 100, 0.9);
    colorMode(RGB, 255); // Reset to default RGB
    
    return c;
}

function setup() {
    let canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('canvas-container');
    initTesseract();
    baseScale = min(width, height) * 0.15;

    // UI Listeners
    uiSpeed.oninput = (e) => document.getElementById('val-speed').innerText = e.target.value + 'x';
    uiDist4D.oninput = (e) => document.getElementById('val-dist4d').innerText = e.target.value;
    uiDist3D.oninput = (e) => document.getElementById('val-dist3d').innerText = e.target.value;
    
    btnPause.onclick = togglePause;
}

function togglePause() {
    isPaused = !isPaused;
    btnPause.innerText = isPaused ? "Resume Rotation" : "Pause Rotation (Space)";
    btnPause.style.background = isPaused ? "#333" : "linear-gradient(45deg, #00e5ff, #0077ff)";
    btnPause.style.color = isPaused ? "#fff" : "#000";
}

function keyPressed() {
    if (key === ' ' || key === 'Spacebar') {
        togglePause();
    }
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    baseScale = min(width, height) * 0.15;
}

function draw() {
    background(13, 13, 18);
    translate(width / 2, height / 2);

    // 1. Update Angles
    if (!isPaused) {
        let speed = parseFloat(uiSpeed.value) * 0.01;
        if (document.getElementById('chk-xy').checked) angles.xy += speed;
        if (document.getElementById('chk-xz').checked) angles.xz += speed;
        if (document.getElementById('chk-xw').checked) angles.xw += speed;
        if (document.getElementById('chk-yz').checked) angles.yz += speed;
        if (document.getElementById('chk-yw').checked) angles.yw += speed;
        if (document.getElementById('chk-zw').checked) angles.zw += speed;
    }

    // Read UI Settings
    let d4 = parseFloat(uiDist4D.value);
    let d3 = parseFloat(uiDist3D.value);
    let p4 = uiProj4D.value;
    let p3 = uiProj3D.value;

    let projectedPoints = [];

    // 2. Process Vertices: Rotate -> Project 4D to 3D -> Project 3D to 2D
    for (let i = 0; i < points.length; i++) {
        let v = points[i];

        // Apply Rotations
        if (document.getElementById('chk-xy').checked) v = rotateXY(v, angles.xy);
        if (document.getElementById('chk-xz').checked) v = rotateXZ(v, angles.xz);
        if (document.getElementById('chk-xw').checked) v = rotateXW(v, angles.xw);
        if (document.getElementById('chk-yz').checked) v = rotateYZ(v, angles.yz);
        if (document.getElementById('chk-yw').checked) v = rotateYW(v, angles.yw);
        if (document.getElementById('chk-zw').checked) v = rotateZW(v, angles.zw);

        // 4D to 3D Projection
        let wFactor = 1;
        if (p4 === 'perspective') {
            wFactor = d4 / (d4 - v.w);
        }
        let v3 = {
            x: v.x * wFactor,
            y: v.y * wFactor,
            z: v.z * wFactor,
            w: v.w // Keep original W for depth coloring
        };

        // 3D to 2D Projection
        let zFactor = 1;
        if (p3 === 'perspective') {
            zFactor = d3 / (d3 - v3.z);
        }
        let v2 = {
            x: v3.x * zFactor * baseScale,
            y: v3.y * zFactor * baseScale,
            w: v.w 
        };

        projectedPoints.push(v2);
    }

    // 3. Render Edges (Wireframe)
    // Sort edges so that lines further back (lower average W) are drawn first
    let sortedEdges = edges.slice().sort((a, b) => {
        let avgWa = (projectedPoints[a[0]].w + projectedPoints[a[1]].w) / 2;
        let avgWb = (projectedPoints[b[0]].w + projectedPoints[b[1]].w) / 2;
        return avgWa - avgWb;
    });

    for (let i = 0; i < sortedEdges.length; i++) {
        let p1 = projectedPoints[sortedEdges[i][0]];
        let p2 = projectedPoints[sortedEdges[i][1]];

        // Create a color gradient based on the 4D depth (W) of the two endpoints
        let c1 = getDepthColor(p1.w);
        let c2 = getDepthColor(p2.w);

        // Use HTML Canvas API for Gradient Strokes
        let grad = drawingContext.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
        grad.addColorStop(0, c1.toString());
        grad.addColorStop(1, c2.toString());

        drawingContext.strokeStyle = grad;
        
        // Thickness based on depth (closer = thicker)
        let avgW = (p1.w + p2.w) / 2;
        strokeWeight(map(avgW, -2, 2, 1.5, 4.5));

        line(p1.x, p1.y, p2.x, p2.y);
    }

    // 4. Render Vertices (Points)
    noStroke();
    for (let i = 0; i < projectedPoints.length; i++) {
        let p = projectedPoints[i];
        fill(getDepthColor(p.w));
        let radius = map(p.w, -2, 2, 3, 8);
        circle(p.x, p.y, radius);
        
        // Subtle glowing core for points
        fill(255, 255, 255, 150);
        circle(p.x, p.y, radius * 0.4);
    }
}
</script>
</body>
</html>
