<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 4D Tesseract</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #080a0f; color: #e0e6f0; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    #controls {
      position: absolute; top: 16px; left: 16px;
      background: rgba(15, 18, 28, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100, 160, 255, 0.15);
      border-radius: 12px; padding: 16px; width: 280px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      pointer-events: auto; user-select: none;
    }
    h2 { font-size: 18px; color: #7dd3fc; margin-bottom: 10px; letter-spacing: 0.5px; }
    h3 { font-size: 12px; color: #8899bb; margin: 12px 0 6px 0; text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
    
    .ctrl { margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ctrl label { font-size: 12px; color: #a0b0c5; white-space: nowrap; }
    .ctrl input[type="range"] { flex: 1; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(100,150,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .ctrl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #7dd3fc; border-radius: 50%; cursor: pointer; }
    .ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: #7dd3fc; border-radius: 50%; cursor: pointer; border: none; }
    .val { font-size: 12px; color: #7dd3fc; font-weight: bold; min-width: 35px; text-align: right; }

    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
    .btn { flex: 1; padding: 6px 10px; background: rgba(30, 40, 60, 0.6); border: 1px solid rgba(100,150,255,0.2); border-radius: 6px; color: #c0d0f0; font-size: 11px; cursor: pointer; transition: all 0.15s; text-align: center; }
    .btn:hover { background: rgba(40, 55, 80, 0.8); border-color: #7dd3fc; color: #fff; }
    .btn.active { background: rgba(125, 211, 252, 0.25); border-color: #7dd3fc; color: #fff; }

    .plane-toggles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .plane-toggles .toggle { font-size: 11px; padding: 4px; text-align: center; background: rgba(20,25,35,0.5); border-radius: 4px; cursor: pointer; color: #667799; border: 1px solid transparent; }
    .plane-toggles .toggle:hover { background: rgba(30,40,50,0.6); }
    .plane-toggles .toggle.on { background: rgba(125, 211, 252, 0.2); color: #7dd3fc; border-color: rgba(125, 211, 252, 0.4); }

    .hint { font-size: 10px; color: #556688; margin-top: 10px; line-height: 1.4; }
    .legend { display: flex; gap: 8px; margin-top: 6px; font-size: 10px; }
    .legend span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
  </style>
</head>
<body>
  <div id="controls">
    <h2>🧊 4D Tesseract Explorer</h2>
    
    <div class="ctrl">
      <label>Rotation Speed</label>
      <input type="range" id="speed" min="0" max="2" step="0.1" value="0.8">
      <span class="val" id="v-speed">0.8x</span>
    </div>
    <div class="ctrl">
      <label>Projection Distance</label>
      <input type="range" id="dist" min="1.6" max="5.0" step="0.1" value="2.5">
      <span class="val" id="v-dist">2.5</span>
    </div>
    <div class="ctrl">
      <label>3D View Angle X</label>
      <input type="range" id="rotX" min="-1.5" max="1.5" step="0.1" value="0.4">
      <span class="val" id="v-rotX">0.4</span>
    </div>
    <div class="ctrl">
      <label>3D View Angle Y</label>
      <input type="range" id="rotY" min="-1.5" max="1.5" step="0.1" value="0.6">
      <span class="val" id="v-rotY">0.6</span>
    </div>

    <div class="row">
      <button class="btn" id="btn-pause">⏸ Pause</button>
      <button class="btn active" id="btn-proj">🌐 Perspective</button>
    </div>

    <h3>Active Rotation Planes</h3>
    <div class="plane-toggles" id="plane-toggles">
      <div class="toggle on" data-plane="0">XW</div>
      <div class="toggle on" data-plane="1">YW</div>
      <div class="toggle on" data-plane="2">ZW</div>
      <div class="toggle" data-plane="3">XY</div>
      <div class="toggle" data-plane="4">XZ</div>
      <div class="toggle" data-plane="5">YZ</div>
    </div>

    <div class="legend">
      <span><div class="dot" style="background:#3b82f6"></div> Inner (w≈-1)</span>
      <span><div class="dot" style="background:#f472b6"></div> Outer (w≈+1)</span>
    </div>
    <div class="hint">🖱️ Drag canvas to rotate 3D view<br>⌨️ Space: Pause | P: Projection | R: Reset</div>
  </div>

  <script>
    // ===== GLOBAL STATE =====
    let vertices = []; // 16 4D points
    let edges = [];    // 32 edge pairs
    let angles = [0, 0, 0, 0, 0, 0]; // XY, XZ, XW, YZ, YW, ZW
    let speeds = [0.008, 0.005, 0.018, 0.01, 0.022, 0.015];
    let activePlanes = [true, true, true, false, false, false];
    let paused = false;
    let isPerspective = true;
    let projDist = 2.5;
    let viewRotX = 0.4, viewRotY = 0.6;
    let isDragging = false, lastMouse = {x:0, y:0};

    // Pre-allocated buffers for performance
    let pts4D = new Array(16);
    let pts3D = new Array(16);
    let pts2D = new Array(16);

    function setup() {
      createCanvas(windowWidth, windowHeight);
      pixelDensity(1);
      initGeometry();
      
      // UI Bindings
      bindSlider('speed', 'v-speed', v => rotationSpeed = parseFloat(v));
      bindSlider('dist', 'v-dist', v => { projDist = parseFloat(v); });
      bindSlider('rotX', 'v-rotX', v => viewRotX = parseFloat(v));
      bindSlider('rotY', 'v-rotY', v => viewRotY = parseFloat(v));

      document.getElementById('btn-pause').onclick = () => { paused = !paused; document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause'; document.getElementById('btn-pause').classList.toggle('active', !paused); };
      document.getElementById('btn-proj').onclick = () => { isPerspective = !isPerspective; document.getElementById('btn-proj').textContent = isPerspective ? '🌐 Perspective' : '⬜ Orthographic'; };
      
      document.querySelectorAll('.toggle').forEach(el => {
        el.onclick = () => { activePlanes[parseInt(el.dataset.plane)] = !activePlanes[parseInt(el.dataset.plane)]; el.classList.toggle('on'); };
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === ' ') { paused = !paused; document.getElementById('btn-pause').textContent = paused ? '▶ Play' : '⏸ Pause'; }
        if (e.key.toLowerCase() === 'p') { isPerspective = !isPerspective; document.getElementById('btn-proj').textContent = isPerspective ? '🌐 Perspective' : '⬜ Orthographic'; }
        if (e.key.toLowerCase() === 'r') { viewRotX = 0.4; viewRotY = 0.6; document.getElementById('rotX').value = viewRotX; document.getElementById('v-rotX').textContent = viewRotX; document.getElementById('rotY').value = viewRotY; document.getElementById('v-rotY').textContent = viewRotY; }
      });
    }

    let rotationSpeed = 0.8;
    function bindSlider(id, valId, onChange) {
      const el = document.getElementById(id);
      const vEl = document.getElementById(valId);
      el.addEventListener('input', () => { vEl.textContent = el.value; onChange(el.value); });
    }

    function initGeometry() {
      // Generate 16 vertices of a hypercube: (±1, ±1, ±1, ±1)
      vertices = [];
      for (let i = 0; i < 16; i++) {
        vertices.push([
          (i & 1) ? 1 : -1,
          (i & 2) ? 1 : -1,
          (i & 4) ? 1 : -1,
          (i & 8) ? 1 : -1
        ]);
      }
      // Generate 32 edges: connect vertices differing by exactly 1 bit
      edges = [];
      for (let i = 0; i < 16; i++) {
        for (let j = i + 1; j < 16; j++) {
          let diff = i ^ j;
          if ((diff & (diff - 1)) === 0) { // Power of 2 check
            edges.push([i, j]);
          }
        }
      }
    }

    // ===== MATH PIPELINE =====
    function rotate4D(p) {
      let [x, y, z, w] = p;
      // Apply active 4D plane rotations sequentially
      if (activePlanes[3]) { let a=angles[3]; [x,y] = [x*cos(a)-y*sin(a), x*sin(a)+y*cos(a)]; }
      if (activePlanes[4]) { let a=angles[4]; [x,z] = [x*cos(a)-z*sin(a), x*sin(a)+z*cos(a)]; }
      if (activePlanes[5]) { let a=angles[5]; [y,z] = [y*cos(a)-z*sin(a), y*sin(a)+z*cos(a)]; }
      if (activePlanes[0]) { let a=angles[0]; [x,w] = [x*cos(a)-w*sin(a), x*sin(a)+w*cos(a)]; }
      if (activePlanes[1]) { let a=angles[1]; [y,w] = [y*cos(a)-w*sin(a), y*sin(a)+w*cos(a)]; }
      if (activePlanes[2]) { let a=angles[2]; [z,w] = [z*cos(a)-w*sin(a), z*sin(a)+w*cos(a)]; }
      return [x, y, z, w];
    }

    function project4Dto3D(p) {
      let [x, y, z, w] = p;
      let scale = isPerspective ? 1.0 / (projDist - w) : 1.0;
      return [x * scale, y * scale, z * scale, w];
    }

    function rotate3D(p) {
      let [x, y, z] = p;
      // Yaw
      let cy = cos(viewRotY), sy = sin(viewRotY);
      let x2 = x * cy - z * sy;
      let z2 = x * sy + z * cy;
      x = x2; z = z2;
      // Pitch
      let cx = cos(viewRotX), sx = sin(viewRotX);
      let y2 = y * cx - z * sx;
      let z3 = y * sx + z * cx;
      return [x, y2, z3];
    }

    function project3Dto2D(p3d, w) {
      let [x, y, z] = p3d;
      let scale = isPerspective ? 350 / (3.5 - z) : 280;
      return { x: x * scale + width/2, y: y * scale + height/2, depth: z, w: w, scale: scale };
    }

    // ===== DRAW LOOP =====
    function draw() {
      background(8, 10, 15);
      
      if (!paused) {
        for (let i = 0; i < 6; i++) {
          if (activePlanes[i]) angles[i] += speeds[i] * rotationSpeed;
        }
      }

      // 1. Transform & Project all vertices
      for (let i = 0; i < 16; i++) {
        pts4D[i] = rotate4D(vertices[i]);
        pts3D[i] = project4Dto3D(pts4D[i]);
        let rot3D = rotate3D([pts3D[i][0], pts3D[i][1], pts3D[i][2]]);
        pts2D[i] = project3Dto2D(rot3D, pts4D[i][3]);
      }

      // 2. Sort edges by average depth (Painter's algorithm)
      let sortedEdges = edges.slice().map(e => {
        let avgZ = (pts2D[e[0]].depth + pts2D[e[1]].depth) / 2;
        return { idx: e, z: avgZ };
      }).sort((a, b) => a.z - b.z);

      // 3. Draw edges with depth & w-coordinate styling
      strokeCap(ROUND);
      for (let e of sortedEdges) {
        let p1 = pts2D[e.idx[0]];
        let p2 = pts2D[e.idx[1]];
        let avgW = (pts4D[e.idx[0]][3] + pts4D[e.idx[1]][3]) / 2;
        
        // Color gradient: Inner (w≈-1) -> Blue, Outer (w≈+1) -> Pink
        let t = (avgW + 1) / 2;
        let c = lerpColor(color(59, 130, 246), color(244, 114, 182), t);
        
        // Depth affects opacity & line weight
        let depthNorm = (e.z + 1.5) / 3.0;
        let alpha = map(depthNorm, 0, 1, 60, 220);
        let weight = map(depthNorm, 0, 1, 0.8, 2.5);

        stroke(red(c), green(c), blue(c), alpha);
        strokeWeight(weight);
        line(p1.x, p1.y, p2.x, p2.y);
      }

      // 4. Draw subtle vertices
      noStroke();
      for (let p of pts2D) {
        let t = (p.w + 1) / 2;
        let c = lerpColor(color(59, 130, 246), color(244, 114, 182), t);
        fill(red(c), green(c), blue(c), 200);
        ellipse(p.x, p.y, 4 + p.scale * 0.01, 4 + p.scale * 0.01);
      }
    }

    // ===== MOUSE INTERACTION =====
    function mousePressed() { isDragging = true; lastMouse = {x: mouseX, y: mouseY}; }
    function mouseReleased() { isDragging = false; }
    function mouseDragged() {
      if (isDragging && !document.getElementById('controls').contains(document.elementFromPoint(mouseX, mouseY))) {
        viewRotY += (mouseX - lastMouse.x) * 0.01;
        viewRotX += (mouseY - lastMouse.y) * 0.01;
        // Update UI sliders
        document.getElementById('rotX').value = viewRotX; document.getElementById('v-rotX').textContent = viewRotX.toFixed(2);
        document.getElementById('rotY').value = viewRotY; document.getElementById('v-rotY').textContent = viewRotY.toFixed(2);
        lastMouse = {x: mouseX, y: mouseY};
      }
    }

    function windowResized() { resizeCanvas(windowWidth, windowHeight); }
  </script>
</body>
</html>
