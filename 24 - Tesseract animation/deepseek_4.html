<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4D Tesseract – Interactive Projection</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js">
    </script>
    <style>
        :root {
            --bg: #0a0a14;
            --panel-bg: rgba(16, 16, 30, 0.94);
            --text: #d0d0e0;
            --accent: #7b9fff;
            --accent2: #ff6b8a;
            --gold: #ffb347;
            --border: rgba(255, 255, 255, 0.12);
            --radius: 8px;
            --font: 'Segoe UI', 'Inter', system-ui, sans-serif;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            overflow: hidden;
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            flex-direction: column;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            cursor: grab;
            min-height: 400px;
        }
        #canvasContainer:active {
            cursor: grabbing;
        }
        #canvasContainer.orbiting {
            cursor: grabbing;
        }
        canvas {
            display: block;
        }

        /* Bottom control panel */
        .control-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            z-index: 20;
            flex-shrink: 0;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
            font-size: 11px;
            color: var(--text);
        }
        .ctrl-group {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }
        .ctrl-group label {
            font-size: 10px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }
        .ctrl-group input[type="range"] {
            width: 70px;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .ctrl-group input[type="number"] {
            width: 42px;
            padding: 3px 5px;
            border-radius: 3px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 10px;
            text-align: center;
            font-family: var(--font);
        }
        .ctrl-group span.val {
            font-size: 10px;
            color: #bbb;
            min-width: 22px;
            text-align: center;
        }
        button {
            padding: 5px 11px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font);
            transition: all 0.15s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        button.accent {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        button.accent:hover {
            background: #9ab4ff;
        }
        button.accent.active-btn {
            background: var(--accent2);
            border-color: var(--accent2);
            animation: pulse-btn 1.8s infinite;
        }
        @keyframes pulse-btn {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 138, 0.5);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(255, 107, 138, 0);
            }
        }
        button.secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #ccc;
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }
        button.tiny {
            padding: 3px 7px;
            font-size: 9px;
            border-radius: 3px;
            min-width: 22px;
            text-align: center;
        }
        .plane-toggle {
            display: flex;
            gap: 2px;
            flex-wrap: wrap;
        }
        .plane-toggle button {
            padding: 3px 7px;
            font-size: 9px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font);
        }
        .plane-toggle button.active-plane {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .plane-toggle button:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #ddd;
        }
        .divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            margin: 0 2px;
        }

        /* Info overlay */
        .info-overlay {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(10, 10, 22, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 6px;
            padding: 8px 12px;
            color: #bbb;
            font-size: 10px;
            z-index: 10;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            letter-spacing: 0.2px;
            line-height: 1.5;
        }
        .info-overlay span {
            color: var(--gold);
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .control-panel {
                gap: 6px;
                padding: 8px 10px;
                flex-wrap: wrap;
            }
            .ctrl-group input[type="range"] {
                width: 48px;
            }
            .plane-toggle button {
                padding: 2px 5px;
                font-size: 8px;
            }
            .info-overlay {
                font-size: 9px;
                padding: 6px 10px;
            }
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <div class="info-overlay" id="infoOverlay">
            🌀 <span>Tesseract</span> · 4D→3D→2D projection<br>
            🖱 Drag to orbit · Scroll to zoom · <span id="fpsDisplay">60</span> FPS
        </div>
    </div>
    <div class="control-panel" id="controlPanel">
        <div class="ctrl-group">
            <button class="accent active-btn" id="btnPause" title="Pause/Resume (Space)">⏯</button>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <label>Speed</label>
            <input type="range" id="speedSlider" min="0" max="3" step="0.05" value="1" title="Rotation speed multiplier">
            <span class="val" id="speedVal">1.0×</span>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <label>4D dist</label>
            <input type="range" id="projDist4D" min="1.5" max="12" step="0.1" value="4.0" title="4D→3D projection distance">
            <span class="val" id="proj4Val">4.0</span>
        </div>
        <div class="ctrl-group">
            <label>3D proj</label>
            <select id="projMode3D" style="padding:4px 6px;border-radius:3px;border:1px solid rgba(255,255,255,0.2);background:rgba(0,0,0,0.4);color:#fff;font-size:10px;font-family:var(--font);cursor:pointer;">
                <option value="perspective" selected>Perspective</option>
                <option value="orthographic">Orthographic</option>
            </select>
        </div>
        <div class="divider"></div>
        <div class="ctrl-group">
            <label style="font-size:9px;">Planes:</label>
            <div class="plane-toggle" id="planeToggles">
                <button class="active-plane" data-plane="XY">XY</button>
                <button class="active-plane" data-plane="XZ">XZ</button>
                <button class="active-plane" data-plane="XW">XW</button>
                <button data-plane="YZ">YZ</button>
                <button data-plane="YW">YW</button>
                <button data-plane="ZW">ZW</button>
            </div>
        </div>
        <div class="divider"></div>
        <button class="secondary tiny" id="btnReset" title="Reset view (R)">↺ Reset</button>
        <button class="secondary tiny" id="btnRandomize" title="Randomize rotation speeds">🎲 Random</button>
    </div>

    <script>
        // ==================== p5.js SKETCH ====================
        const sketch = (p) => {
            // ============ STATE ============
            // Tesseract vertices: all 16 combinations of ±1
            const baseVertices = [];
            for (let i = 0; i < 16; i++) {
                baseVertices.push([
                    (i & 1) ? 1 : -1, // x
                    (i & 2) ? 1 : -1, // y
                    (i & 4) ? 1 : -1, // z
                    (i & 8) ? 1 : -1 // w
                ]);
            }

            // Edges: connect vertices differing in exactly one coordinate
            const edges = [];
            for (let i = 0; i < 16; i++) {
                for (let j = i + 1; j < 16; j++) {
                    const diff = i ^ j;
                    if (diff && (diff & (diff - 1)) === 0) {
                        // diff is a power of 2 → exactly 1 bit differs
                        edges.push([i, j]);
                    }
                }
            }
            // 32 edges total

            // Rotation angles for each 4D plane
            const planeAngles = { XY: 0, XZ: 0, XW: 0, YZ: 0, YW: 0, ZW: 0 };
            const planeSpeeds = { XY: 0.40, XZ: 0.55, XW: 0.48, YZ: 0.35, YW: 0.52, ZW: 0.30 };
            const planeActive = { XY: true, XZ: true, XW: true, YZ: false, YW: false, ZW: false };
            const planeOrder = ['XY', 'XZ', 'XW', 'YZ', 'YW', 'ZW'];

            let masterSpeed = 1.0;
            let projDist4D = 4.0;
            let projMode3D = 'perspective';
            let projDist3D = 8.0;
            let isPaused = false;
            let orbitTheta = 0.6;
            let orbitPhi = -0.35;
            let targetOrbitTheta = 0.6;
            let targetOrbitPhi = -0.35;
            let isOrbiting = false;
            let prevMouseX = 0;
            let prevMouseY = 0;
            let zoomLevel = 1.0;
            let targetZoom = 1.0;

            // FPS tracking
            let fpsCounter = 0;
            let fpsTime = 0;
            let displayFPS = 60;

            // ============ 4D ROTATION ============
            function rotate4D(v, plane, angle) {
                const c = Math.cos(angle);
                const s = Math.sin(angle);
                const result = [...v];
                switch (plane) {
                    case 'XY':
                        result[0] = v[0] * c - v[1] * s;
                        result[1] = v[0] * s + v[1] * c;
                        break;
                    case 'XZ':
                        result[0] = v[0] * c - v[2] * s;
                        result[2] = v[0] * s + v[2] * c;
                        break;
                    case 'XW':
                        result[0] = v[0] * c - v[3] * s;
                        result[3] = v[0] * s + v[3] * c;
                        break;
                    case 'YZ':
                        result[1] = v[1] * c - v[2] * s;
                        result[2] = v[1] * s + v[2] * c;
                        break;
                    case 'YW':
                        result[1] = v[1] * c - v[3] * s;
                        result[3] = v[1] * s + v[3] * c;
                        break;
                    case 'ZW':
                        result[2] = v[2] * c - v[3] * s;
                        result[3] = v[2] * s + v[3] * c;
                        break;
                }
                return result;
            }

            function applyAllRotations(v) {
                let result = [...v];
                for (const plane of planeOrder) {
                    if (planeActive[plane]) {
                        result = rotate4D(result, plane, planeAngles[plane]);
                    }
                }
                return result;
            }

            // ============ 4D → 3D PROJECTION ============
            function project4Dto3D(v4, d) {
                const denom = d - v4[3];
                if (denom <= 0.001) return null; // behind or at camera
                const factor = d / denom;
                return {
                    x: v4[0] * factor,
                    y: v4[1] * factor,
                    z: v4[2] * factor,
                    w: v4[3], // keep original w for coloring
                };
            }

            // ============ 3D ORBIT ROTATION ============
            function rotate3D(p3, theta, phi) {
                // Rotate around Y axis (theta)
                const cosT = Math.cos(theta);
                const sinT = Math.sin(theta);
                const x1 = p3.x * cosT + p3.z * sinT;
                const z1 = -p3.x * sinT + p3.z * cosT;
                const y1 = p3.y;

                // Rotate around X axis (phi)
                const cosP = Math.cos(phi);
                const sinP = Math.sin(phi);
                const y2 = y1 * cosP - z1 * sinP;
                const z2 = y1 * sinP + z1 * cosP;
                const x2 = x1;

                return { x: x2, y: y2, z: z2, w: p3.w };
            }

            // ============ 3D → 2D PROJECTION ============
            function project3Dto2D(p3, d3, mode) {
                if (mode === 'orthographic') {
                    return { x: p3.x, y: p3.y, z: p3.z, w: p3.w };
                }
                // Perspective
                const denom = d3 - p3.z;
                if (denom <= 0.01) return null;
                const factor = d3 / denom;
                return { x: p3.x * factor, y: p3.y * factor, z: p3.z, w: p3.w };
            }

            // ============ FULL PIPELINE ============
            function processVertex(baseV) {
                const rotated4 = applyAllRotations(baseV);
                const proj3 = project4Dto3D(rotated4, projDist4D);
                if (!proj3) return null;
                const orbited = rotate3D(proj3, orbitTheta, orbitPhi);
                const proj2 = project3Dto2D(orbited, projDist3D, projMode3D);
                return proj2;
            }

            // ============ DRAWING ============
            function getEdgeColor(avgW) {
                // Map avgW from roughly [-2.5, 2.5] to hue range
                const normalized = p.constrain((avgW + 2.5) / 5.0, 0, 1);
                // Outer (high w, closer to camera) = cyan/blue (~200°)
                // Inner (low w, farther) = warm orange/red (~15°)
                const hue = p.lerp(15, 210, normalized);
                const saturation = 75;
                const brightness = p.lerp(55, 95, normalized);
                const alpha = p.lerp(0.55, 0.95, normalized);
                return { h: hue, s: saturation, b: brightness, a: alpha };
            }

            p.setup = function() {
                const container = document.getElementById('canvasContainer');
                const w = container.clientWidth;
                const h = container.clientHeight;
                const canvas = p.createCanvas(w, h);
                canvas.parent('canvasContainer');
                p.colorMode(p.HSB, 360, 100, 100, 1);
                p.frameRate(60);
                p.smooth();
                fpsTime = p.millis();
            };

            p.draw = function() {
                p.background(10, 10, 22);

                // Update FPS
                fpsCounter++;
                if (p.millis() - fpsTime >= 1000) {
                    displayFPS = Math.round(fpsCounter / ((p.millis() - fpsTime) / 1000));
                    fpsCounter = 0;
                    fpsTime = p.millis();
                    document.getElementById('fpsDisplay').textContent = displayFPS;
                }

                // Smooth orbit and zoom
                orbitTheta = p.lerp(orbitTheta, targetOrbitTheta, 0.18);
                orbitPhi = p.lerp(orbitPhi, targetOrbitPhi, 0.18);
                zoomLevel = p.lerp(zoomLevel, targetZoom, 0.2);

                // Update rotation angles
                if (!isPaused) {
                    const dt = p.deltaTime / 1000;
                    for (const plane of planeOrder) {
                        if (planeActive[plane]) {
                            planeAngles[plane] += planeSpeeds[plane] * masterSpeed * dt;
                            // Keep angles in reasonable range
                            planeAngles[plane] = planeAngles[plane] % (Math.PI * 2);
                        }
                    }
                }

                // Process all vertices
                const projectedVertices = [];
                for (const baseV of baseVertices) {
                    const proj = processVertex(baseV);
                    projectedVertices.push(proj);
                }

                // Build edge list with depth info
                const edgeDrawList = [];
                for (const [i, j] of edges) {
                    const p1 = projectedVertices[i];
                    const p2 = projectedVertices[j];
                    if (!p1 || !p2) continue;
                    const avgW = (p1.w + p2.w) / 2;
                    const avgZ = (p1.z + p2.z) / 2;
                    edgeDrawList.push({ p1, p2, avgW, avgZ });
                }

                // Sort by depth (farthest first for back-to-front wireframe)
                edgeDrawList.sort((a, b) => b.avgZ - a.avgZ);

                // Compute scale to fit canvas
                const canvasScale = Math.min(p.width, p.height) * 0.38 * zoomLevel;

                // Draw edges
                p.push();
                p.translate(p.width / 2, p.height / 2);

                // Draw subtle depth glow for each edge
                for (const edge of edgeDrawList) {
                    const { p1, p2, avgW } = edge;
                    const col = getEdgeColor(avgW);
                    const sx1 = p1.x * canvasScale;
                    const sy1 = -p1.y * canvasScale;
                    const sx2 = p2.x * canvasScale;
                    const sy2 = -p2.y * canvasScale;

                    // Clamp to reasonable screen bounds
                    const maxCoord = Math.max(p.width, p.height) * 2;
                    if (Math.abs(sx1) > maxCoord || Math.abs(sy1) > maxCoord ||
                        Math.abs(sx2) > maxCoord || Math.abs(sy2) > maxCoord) continue;

                    // Glow pass
                    p.stroke(col.h, col.s, col.b, col.a * 0.25);
                    p.strokeWeight(2.5);
                    p.line(sx1, sy1, sx2, sy2);

                    // Core line
                    p.stroke(col.h, col.s, Math.min(100, col.b + 15), col.a * 0.85);
                    p.strokeWeight(1.3);
                    p.line(sx1, sy1, sx2, sy2);
                }

                // Draw vertices
                for (const proj of projectedVertices) {
                    if (!proj) continue;
                    const sx = proj.x * canvasScale;
                    const sy = -proj.y * canvasScale;
                    const maxCoord = Math.max(p.width, p.height) * 2;
                    if (Math.abs(sx) > maxCoord || Math.abs(sy) > maxCoord) continue;
                    const col = getEdgeColor(proj.w);
                    p.noStroke();
                    p.fill(col.h, col.s, Math.min(100, col.b + 20), col.a * 1);
                    p.circle(sx, sy, 3.5);
                }

                p.pop();

                // Draw subtle center crosshair
                p.push();
                p.translate(p.width / 2, p.height / 2);
                p.stroke(255, 255, 255, 20);
                p.strokeWeight(0.5);
                const chLen = 20;
                p.line(-chLen, 0, chLen, 0);
                p.line(0, -chLen, 0, chLen);
                p.pop();
            };

            // ============ MOUSE INTERACTION ============
            p.mousePressed = function() {
                if (p.mouseY < p.height - 60) {
                    // Only orbit when clicking on the canvas (not the control panel area)
                    isOrbiting = true;
                    prevMouseX = p.mouseX;
                    prevMouseY = p.mouseY;
                    document.getElementById('canvasContainer').classList.add('orbiting');
                }
            };

            p.mouseDragged = function() {
                if (isOrbiting) {
                    const dx = p.mouseX - prevMouseX;
                    const dy = p.mouseY - prevMouseY;
                    targetOrbitTheta += dx * 0.008;
                    targetOrbitPhi += dy * 0.008;
                    targetOrbitPhi = p.constrain(targetOrbitPhi, -Math.PI / 2 + 0.1, Math.PI / 2 - 0.1);
                    prevMouseX = p.mouseX;
                    prevMouseY = p.mouseY;
                }
            };

            p.mouseReleased = function() {
                isOrbiting = false;
                document.getElementById('canvasContainer').classList.remove('orbiting');
            };

            p.mouseWheel = function(event) {
                if (event.deltaY < 0) {
                    targetZoom = Math.min(4.0, targetZoom * 1.12);
                } else {
                    targetZoom = Math.max(0.25, targetZoom / 1.12);
                }
                return false;
            };

            p.windowResized = function() {
                const container = document.getElementById('canvasContainer');
                p.resizeCanvas(container.clientWidth, container.clientHeight);
            };

            // ============ KEYBOARD ============
            p.keyPressed = function() {
                const key = p.key.toLowerCase();
                if (key === ' ') {
                    isPaused = !isPaused;
                    updatePauseButton();
                    return false;
                }
                if (key === 'r') {
                    resetView();
                    return false;
                }
                if (key === 'o') {
                    projMode3D = projMode3D === 'perspective' ? 'orthographic' : 'perspective';
                    document.getElementById('projMode3D').value = projMode3D;
                    return false;
                }
                if (key === '+' || key === '=') {
                    masterSpeed = Math.min(3, masterSpeed + 0.1);
                    updateSpeedUI();
                    return false;
                }
                if (key === '-') {
                    masterSpeed = Math.max(0, masterSpeed - 0.1);
                    updateSpeedUI();
                    return false;
                }
                if (key === '[') {
                    projDist4D = Math.max(1.5, projDist4D - 0.3);
                    updateProjDistUI();
                    return false;
                }
                if (key === ']') {
                    projDist4D = Math.min(12, projDist4D + 0.3);
                    updateProjDistUI();
                    return false;
                }
                // Number keys toggle planes
                const planeKeys = ['1', '2', '3', '4', '5', '6'];
                const pkIdx = planeKeys.indexOf(key);
                if (pkIdx >= 0 && pkIdx < planeOrder.length) {
                    const plane = planeOrder[pkIdx];
                    planeActive[plane] = !planeActive[plane];
                    updatePlaneToggles();
                    return false;
                }
                return true;
            };

            function resetView() {
                targetOrbitTheta = 0.6;
                targetOrbitPhi = -0.35;
                targetZoom = 1.0;
                projDist4D = 4.0;
                projMode3D = 'perspective';
                masterSpeed = 1.0;
                isPaused = false;
                for (const plane of planeOrder) {
                    planeAngles[plane] = 0;
                    planeActive[plane] = (plane === 'XY' || plane === 'XZ' || plane === 'XW');
                }
                updateAllUI();
            }

            function updatePauseButton() {
                const btn = document.getElementById('btnPause');
                if (isPaused) {
                    btn.textContent = '▶';
                    btn.classList.remove('active-btn');
                } else {
                    btn.textContent = '⏯';
                    btn.classList.add('active-btn');
                }
            }

            function updateSpeedUI() {
                document.getElementById('speedSlider').value = masterSpeed;
                document.getElementById('speedVal').textContent = masterSpeed.toFixed(2) + '×';
            }

            function updateProjDistUI() {
                document.getElementById('projDist4D').value = projDist4D;
                document.getElementById('proj4Val').textContent = projDist4D.toFixed(1);
            }

            function updatePlaneToggles() {
                const buttons = document.querySelectorAll('#planeToggles button');
                buttons.forEach(btn => {
                    const plane = btn.dataset.plane;
                    if (planeActive[plane]) {
                        btn.classList.add('active-plane');
                    } else {
                        btn.classList.remove('active-plane');
                    }
                });
            }

            function updateAllUI() {
                updatePauseButton();
                updateSpeedUI();
                updateProjDistUI();
                updatePlaneToggles();
                document.getElementById('projMode3D').value = projMode3D;
            }
        };

        // ==================== INITIALIZE P5 ====================
        const myP5 = new p5(sketch);

        // ==================== UI EVENT HANDLERS ====================
        document.getElementById('btnPause').addEventListener('click', () => {
            const sketchInstance = myP5;
            // Access the sketch's isPaused via a workaround
            // We'll use a global toggle
            const event = new KeyboardEvent('keydown', { key: ' ', bubbles: true });
            document.dispatchEvent(event);
        });

        // Direct manipulation of sketch variables via DOM
        document.getElementById('speedSlider').addEventListener('input', function() {
            const val = parseFloat(this.value);
            document.getElementById('speedVal').textContent = val.toFixed(2) + '×';
            // We need to access the sketch's masterSpeed. Use a custom approach.
            updateSketchVar('masterSpeed', val);
        });

        document.getElementById('projDist4D').addEventListener('input', function() {
            const val = parseFloat(this.value);
            document.getElementById('proj4Val').textContent = val.toFixed(1);
            updateSketchVar('projDist4D', val);
        });

        document.getElementById('projMode3D').addEventListener('change', function() {
            updateSketchVar('projMode3D', this.value);
        });

        document.getElementById('btnReset').addEventListener('click', () => {
            const event = new KeyboardEvent('keydown', { key: 'r', bubbles: true });
            document.dispatchEvent(event);
        });

        document.getElementById('btnRandomize').addEventListener('click', () => {
            const planes = ['XY', 'XZ', 'XW', 'YZ', 'YW', 'ZW'];
            planes.forEach(plane => {
                const speed = (Math.random() * 0.7 + 0.15) * (Math.random() > 0.5 ? 1 : -1);
                updateSketchVar('planeSpeeds', speed, plane);
                updateSketchVar('planeActive', Math.random() > 0.35, plane);
            });
            updateSketchVar('masterSpeed', Math.random() * 1.5 + 0.4);
            updateSketchVar('projDist4D', Math.random() * 5 + 2.5);
            updateSketchVar('targetOrbitTheta', Math.random() * Math.PI * 2);
            updateSketchVar('targetOrbitPhi', (Math.random() - 0.5) * 2.2);
            updateAllUIRefs();
        });

        // Plane toggle buttons
        document.querySelectorAll('#planeToggles button').forEach(btn => {
            btn.addEventListener('click', function() {
                const plane = this.dataset.plane;
                const current = getSketchVar('planeActive', plane);
                updateSketchVar('planeActive', !current, plane);
                this.classList.toggle('active-plane', !current);
            });
        });

        // ==================== BRIDGE FUNCTIONS (access p5 sketch internals) ====================
        function getSketchVar(varName, subKey) {
            // Access the sketch's internal variables
            // p5.js stores the sketch context; we can reach into it
            try {
                const ctx = myP5;
                if (subKey !== undefined) {
                    return ctx[varName] ? ctx[varName][subKey] : undefined;
                }
                return ctx[varName];
            } catch (e) {
                return undefined;
            }
        }

        function updateSketchVar(varName, value, subKey) {
            try {
                const ctx = myP5;
                if (subKey !== undefined) {
                    if (ctx[varName]) ctx[varName][subKey] = value;
                } else {
                    ctx[varName] = value;
                }
            } catch (e) {
                // Fallback
            }
        }

        function updateAllUIRefs() {
            try {
                const ctx = myP5;
                document.getElementById('speedSlider').value = ctx.masterSpeed || 1;
                document.getElementById('speedVal').textContent = (ctx.masterSpeed || 1).toFixed(2) + '×';
                document.getElementById('projDist4D').value = ctx.projDist4D || 4;
                document.getElementById('proj4Val').textContent = (ctx.projDist4D || 4).toFixed(1);
                document.getElementById('projMode3D').value = ctx.projMode3D || 'perspective';
                updatePlaneToggleUI();
                updatePauseButtonUI();
            } catch (e) {}
        }

        function updatePlaneToggleUI() {
            const buttons = document.querySelectorAll('#planeToggles button');
            buttons.forEach(btn => {
                const plane = btn.dataset.plane;
                const active = getSketchVar('planeActive', plane);
                if (active !== undefined) {
                    btn.classList.toggle('active-plane', active);
                }
            });
        }

        function updatePauseButtonUI() {
            const btn = document.getElementById('btnPause');
            const paused = getSketchVar('isPaused');
            if (paused) {
                btn.textContent = '▶';
                btn.classList.remove('active-btn');
            } else {
                btn.textContent = '⏯';
                btn.classList.add('active-btn');
            }
        }

        // Update FPS display reference
        setInterval(() => {
            try {
                const fps = myP5.displayFPS;
                if (fps) document.getElementById('fpsDisplay').textContent = fps;
            } catch (e) {}
        }, 1000);

        // Initial UI state
        setTimeout(updateAllUIRefs, 200);

        console.log('🌀 4D Tesseract Visualization Ready');
        console.log('  • 4D → 3D → 2D projection pipeline');
        console.log('  • 6 rotation planes: XY XZ XW YZ YW ZW');
        console.log('  • Mouse drag: orbit 3D view');
        console.log('  • Scroll: zoom in/out');
        console.log('  • Keys: Space=pause R=reset O=toggle projection []=dist -=speed 1-6=toggle planes');
        console.log('  • Color gradient: warm (close) ↔ cool (far) based on 4D depth');
    </script>
</body>
</html>
