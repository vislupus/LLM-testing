<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UI Builder Studio</title>
<style>
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --panel-2: #f8fafc;
    --border: #dbe1ea;
    --text: #172033;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-2: #eef2ff;
    --danger: #dc2626;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    --toolbar-height: 56px;
    --left-width: 260px;
    --right-width: 310px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }

  .app { height: 100%; display: grid; grid-template-rows: var(--toolbar-height) 1fr; }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 218px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: white;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    box-shadow: 0 8px 18px rgba(79, 70, 229, 0.25);
  }
  .toolbar-group { display: flex; align-items: center; gap: 6px; }
  .toolbar-spacer { flex: 1; }
  .divider { width: 1px; height: 28px; background: var(--border); margin: 0 2px; }

  .btn {
    min-height: 36px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 7px 11px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: 120ms ease;
    white-space: nowrap;
  }
  .btn:hover { background: #f8fafc; border-color: #cbd5e1; }
  .btn.active { background: var(--primary-2); color: var(--primary); border-color: #a5b4fc; }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.primary:hover { background: #4338ca; }
  .btn.danger { color: var(--danger); }
  .btn.icon { width: 36px; padding: 0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .toolbar-field {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--muted);
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 4px 7px;
  }
  .toolbar-field input {
    width: 62px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-weight: 650;
  }
  .toolbar-field.grid input { width: 34px; }

  .main { min-height: 0; display: grid; grid-template-columns: var(--left-width) 1fr var(--right-width); }
  .sidebar {
    background: var(--panel);
    min-height: 0;
    overflow: auto;
    border-right: 1px solid var(--border);
  }
  .sidebar.right { border-right: 0; border-left: 1px solid var(--border); }
  .panel-header {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 14px 16px 10px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eef2f7;
  }
  .panel-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
  .panel-subtitle { margin-top: 4px; font-size: 11px; color: var(--muted); line-height: 1.35; }

  .library { padding: 12px; }
  .library-section { margin-bottom: 18px; }
  .library-section h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .library-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .palette-item {
    min-height: 74px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--panel-2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #334155;
    font-size: 11px;
    font-weight: 700;
    user-select: none;
    transition: 120ms ease;
  }
  .palette-item:hover { transform: translateY(-1px); border-color: #a5b4fc; background: #f7f7ff; box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06); }
  .palette-item:active { transform: scale(0.98); }
  .palette-icon { width: 34px; height: 24px; display: grid; place-items: center; color: var(--primary); }
  .palette-icon svg { width: 100%; height: 100%; }

  .workspace {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    background-color: #e8ecf2;
    background-image: radial-gradient(circle at 1px 1px, rgba(100,116,139,.22) 1px, transparent 0);
    background-size: 20px 20px;
  }
  .workspace-inner {
    min-width: 100%;
    min-height: 100%;
    width: max-content;
    height: max-content;
    padding: 80px;
  }
  .canvas-shell { position: relative; width: max-content; height: max-content; }
  .canvas {
    position: relative;
    width: 1200px;
    height: 800px;
    overflow: hidden;
    background-color: #fff;
    background-image:
      linear-gradient(to right, rgba(148,163,184,.18) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,163,184,.18) 1px, transparent 1px);
    background-size: 10px 10px;
    border: 1px solid #cbd5e1;
    box-shadow: var(--shadow);
    isolation: isolate;
  }
  .canvas.no-grid { background-image: none; }
  .canvas-label {
    position: absolute;
    top: -28px;
    left: 0;
    font-size: 12px;
    color: #475569;
    font-weight: 700;
  }
  .canvas-resize-handle {
    position: absolute;
    right: -11px;
    bottom: -11px;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: 2px solid #fff;
    background: var(--primary);
    box-shadow: 0 2px 10px rgba(15,23,42,.25);
    cursor: nwse-resize;
    z-index: 50;
  }
  .canvas-resize-handle::before {
    content: "";
    position: absolute;
    inset: 5px;
    border-right: 2px solid rgba(255,255,255,.9);
    border-bottom: 2px solid rgba(255,255,255,.9);
  }

  .connection-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
  .connection-visible { fill: none; pointer-events: none; }
  .connection-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
  .connection-control { pointer-events: all; cursor: move; fill: #fff; stroke: var(--primary); stroke-width: 2; }
  .connection-endpoint { pointer-events: none; fill: #fff; stroke: var(--primary); stroke-width: 2; }

  .builder-element {
    position: absolute;
    z-index: 3;
    user-select: none;
    touch-action: none;
    cursor: move;
    transform-origin: center;
  }
  .builder-element .element-content { width: 100%; height: 100%; pointer-events: none; }
  .builder-element.selected { outline: 2px solid var(--primary); outline-offset: 1px; }
  .builder-element.connect-source { outline: 3px solid #06b6d4; outline-offset: 2px; }
  .builder-element.locked { cursor: not-allowed; }

  .resize-handle {
    display: none;
    position: absolute;
    width: 10px;
    height: 10px;
    border: 2px solid var(--primary);
    background: #fff;
    border-radius: 3px;
    z-index: 15;
    pointer-events: auto;
  }
  .selected > .resize-handle { display: block; }
  .resize-handle.nw { left: -6px; top: -6px; cursor: nwse-resize; }
  .resize-handle.n { left: 50%; top: -6px; transform: translateX(-50%); cursor: ns-resize; }
  .resize-handle.ne { right: -6px; top: -6px; cursor: nesw-resize; }
  .resize-handle.e { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }
  .resize-handle.se { right: -6px; bottom: -6px; cursor: nwse-resize; }
  .resize-handle.s { left: 50%; bottom: -6px; transform: translateX(-50%); cursor: ns-resize; }
  .resize-handle.sw { left: -6px; bottom: -6px; cursor: nesw-resize; }
  .resize-handle.w { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; }

  .visual {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    overflow: hidden;
    outline: none;
  }
  button.visual, input.visual, textarea.visual, select.visual { appearance: none; }
  input.visual, textarea.visual, select.visual { justify-content: flex-start; }
  textarea.visual { resize: none; }
  .visual.text { background: transparent !important; border-color: transparent !important; box-shadow: none !important; padding: 2px; }
  .checkbox-visual { justify-content: flex-start; gap: 8px; }
  .checkbox-box { width: 17px; height: 17px; flex: 0 0 17px; border-radius: 4px; border: 2px solid currentColor; display: grid; place-items: center; }
  .checkbox-box.checked::after { content: "✓"; font-size: 12px; font-weight: 900; }
  .slider-visual { padding: 10px 12px; }
  .slider-track { position: relative; width: 100%; height: 6px; background: #dbe3ef; border-radius: 999px; overflow: visible; }
  .slider-fill { height: 100%; border-radius: inherit; }
  .slider-thumb { position: absolute; top: 50%; width: 16px; height: 16px; transform: translate(-50%,-50%); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 5px rgba(15,23,42,.3); }
  .stepper-visual { display: grid; grid-template-columns: 34px 1fr 34px; padding: 0; overflow: hidden; }
  .stepper-visual span { height: 100%; display: grid; place-items: center; }
  .stepper-visual span:first-child, .stepper-visual span:last-child { background: rgba(148,163,184,.14); font-size: 18px; }
  .progress-visual { position: relative; padding: 0; background: #e2e8f0 !important; }
  .progress-fill { position: absolute; inset: 0 auto 0 0; }
  .progress-label { position: relative; z-index: 1; font-size: 11px; font-weight: 800; mix-blend-mode: multiply; }
  .shape-rect, .shape-circle { width: 100%; height: 100%; }
  .shape-circle { border-radius: 50% !important; }
  .shape-svg { display: block; width: 100%; height: 100%; overflow: visible; }

  .guide { position: absolute; display: none; z-index: 1000; pointer-events: none; background: #ec4899; }
  .guide.v { top: 0; bottom: 0; width: 1px; }
  .guide.h { left: 0; right: 0; height: 1px; }
  .selection-badge {
    position: absolute;
    z-index: 1001;
    display: none;
    pointer-events: none;
    background: var(--primary);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 6px;
    border-radius: 5px;
    white-space: nowrap;
  }

  .empty-state { padding: 28px 18px; text-align: center; color: var(--muted); }
  .empty-state .big { font-size: 32px; margin-bottom: 10px; }
  .empty-state h3 { margin: 0 0 6px; color: #334155; font-size: 14px; }
  .empty-state p { margin: 0; font-size: 12px; line-height: 1.5; }

  .properties { padding: 10px 14px 24px; }
  .prop-section { border-bottom: 1px solid #eef2f7; padding: 11px 0 13px; }
  .prop-section:last-child { border-bottom: 0; }
  .prop-section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 11px; font-weight: 850; text-transform: uppercase; letter-spacing: .07em; color: #475569; }
  .prop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .prop-row { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
  .prop-row:last-child { margin-bottom: 0; }
  .prop-row label { font-size: 10px; color: var(--muted); font-weight: 700; }
  .prop-input {
    width: 100%;
    min-height: 34px;
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #f8fafc;
    color: var(--text);
    outline: 0;
  }
  .prop-input:focus { border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.11); background: #fff; }
  input[type="color"].prop-input { padding: 4px; }
  input[type="range"].prop-input { padding: 5px 0; border: 0; background: transparent; }
  .prop-check { display: flex; align-items: center; gap: 8px; min-height: 34px; font-size: 12px; }
  .prop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .prop-actions .btn { min-height: 34px; font-size: 12px; }
  .hint {
    margin: 10px 12px 0;
    padding: 9px 10px;
    border-radius: 9px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
    font-size: 11px;
    line-height: 1.4;
  }
  .status-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    background: #0f172a;
    color: #fff;
    border-radius: 9px;
    padding: 9px 13px;
    font-size: 12px;
    font-weight: 700;
    transition: 180ms ease;
    box-shadow: 0 10px 30px rgba(15,23,42,.3);
  }
  .status-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .drop-overlay {
    position: absolute;
    inset: 12px;
    border: 2px dashed #818cf8;
    background: rgba(238,242,255,.72);
    color: #4338ca;
    display: none;
    place-items: center;
    font-weight: 800;
    z-index: 2000;
    pointer-events: none;
  }
  .workspace.drag-over .drop-overlay { display: grid; }

  @media (max-width: 1100px) {
    :root { --left-width: 220px; --right-width: 280px; }
    .brand { min-width: 176px; }
    .toolbar .optional { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand"><div class="brand-mark">◆</div><span>UI Builder Studio</span></div>
    <div class="toolbar-group">
      <button class="btn icon" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶</button>
      <button class="btn icon" id="redoBtn" title="Redo (Ctrl/Cmd+Shift+Z)">↷</button>
      <div class="divider"></div>
      <button class="btn" id="connectBtn" title="Connect two elements">⌁ Connect</button>
      <button class="btn optional" id="duplicateBtn" title="Duplicate selected element">⧉ Duplicate</button>
      <button class="btn danger optional" id="deleteBtn" title="Delete selection">⌫ Delete</button>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-group">
      <label class="toolbar-field optional">Canvas <input id="canvasWidth" type="number" min="320" max="5000" value="1200"> × <input id="canvasHeight" type="number" min="240" max="5000" value="800"></label>
      <label class="toolbar-field grid">Grid <input id="gridSize" type="number" min="2" max="100" value="10"></label>
      <button class="btn active" id="snapBtn" title="Toggle grid and alignment snapping">⌗ Snap</button>
      <button class="btn" id="toggleGridBtn" title="Show or hide grid">▦ Grid</button>
      <div class="divider"></div>
      <button class="btn" id="saveJsonBtn" title="Download editable project JSON">Save JSON</button>
      <button class="btn" id="loadJsonBtn" title="Load project JSON">Load</button>
      <input type="file" id="loadJsonInput" accept="application/json,.json" hidden>
      <button class="btn primary" id="exportBtn">Export HTML</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar left">
      <div class="panel-header">
        <div class="panel-title">Components</div>
        <div class="panel-subtitle">Drag items onto the canvas or click to add them.</div>
      </div>
      <div class="library" id="library"></div>
    </aside>

    <main class="workspace" id="workspace">
      <div class="drop-overlay">Drop component on the canvas</div>
      <div class="workspace-inner">
        <div class="canvas-shell" id="canvasShell">
          <div class="canvas-label" id="canvasLabel">Canvas · 1200 × 800</div>
          <div class="canvas" id="designCanvas" tabindex="0">
            <svg class="connection-layer" id="connectionLayer" aria-hidden="true"></svg>
            <div class="guide v" id="guideV"></div>
            <div class="guide h" id="guideH"></div>
            <div class="selection-badge" id="selectionBadge"></div>
          </div>
          <div class="canvas-resize-handle" id="canvasResizeHandle" title="Drag to resize canvas"></div>
        </div>
      </div>
    </main>

    <aside class="sidebar right">
      <div class="panel-header">
        <div class="panel-title">Properties</div>
        <div class="panel-subtitle">Edit layout, styling, component data, and connectors.</div>
      </div>
      <div id="properties"></div>
    </aside>
  </div>
</div>
<div class="status-toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const COMPONENTS = [
    { section: "Core", type: "text", label: "Text", icon: '<svg viewBox="0 0 40 28"><path d="M7 5h26M20 5v18M13 23h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>' },
    { section: "Core", type: "button", label: "Button", icon: '<svg viewBox="0 0 40 28"><rect x="4" y="5" width="32" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 14h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    { section: "Form Controls", type: "input", label: "Input", icon: '<svg viewBox="0 0 40 28"><rect x="3" y="5" width="34" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 14h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    { section: "Form Controls", type: "textarea", label: "Text Field", icon: '<svg viewBox="0 0 40 28"><rect x="3" y="3" width="34" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 10h22M9 15h18M9 20h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>' },
    { section: "Form Controls", type: "checkbox", label: "Checkbox", icon: '<svg viewBox="0 0 40 28"><rect x="4" y="6" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m8 14 3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M25 14h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>' },
    { section: "Form Controls", type: "dropdown", label: "Dropdown", icon: '<svg viewBox="0 0 40 28"><rect x="3" y="5" width="34" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m29 11 3 3-3 3M9 14h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' },
    { section: "Form Controls", type: "slider", label: "Slider", icon: '<svg viewBox="0 0 40 28"><path d="M5 14h30" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="14" r="5" fill="white" stroke="currentColor" stroke-width="2"/></svg>' },
    { section: "Form Controls", type: "stepper", label: "Stepper", icon: '<svg viewBox="0 0 40 28"><rect x="3" y="5" width="34" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 14H7M30 11v6M27 14h6M20 5v18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>' },
    { section: "Indicators", type: "progress", label: "Progress", icon: '<svg viewBox="0 0 40 28"><rect x="3" y="9" width="34" height="10" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 14h15" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>' },
    { section: "Shapes", type: "rectangle", label: "Rectangle", icon: '<svg viewBox="0 0 40 28"><rect x="5" y="4" width="30" height="20" rx="2" fill="currentColor" opacity=".18" stroke="currentColor" stroke-width="2"/></svg>' },
    { section: "Shapes", type: "circle", label: "Circle", icon: '<svg viewBox="0 0 40 28"><circle cx="20" cy="14" r="10" fill="currentColor" opacity=".18" stroke="currentColor" stroke-width="2"/></svg>' },
    { section: "Shapes", type: "triangle", label: "Triangle", icon: '<svg viewBox="0 0 40 28"><path d="M20 4 35 24H5Z" fill="currentColor" opacity=".18" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>' },
    { section: "Shapes", type: "line", label: "Line", icon: '<svg viewBox="0 0 40 28"><path d="M5 22 35 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>' }
  ];

  const SIZE_DEFAULTS = {
    text: [160, 40], button: [140, 44], input: [220, 44], textarea: [240, 100], checkbox: [170, 42], dropdown: [220, 44],
    slider: [220, 44], stepper: [150, 44], progress: [220, 30], rectangle: [160, 100], circle: [110, 110], triangle: [130, 110], line: [180, 40]
  };

  const state = {
    elements: [],
    connections: [],
    selectedKind: null,
    selectedId: null,
    connectMode: false,
    connectStart: null,
    canvas: { width: 1200, height: 800, grid: 10, snap: true, showGrid: true },
    interaction: null,
    history: [],
    historyIndex: -1,
    isRestoring: false
  };

  const dom = {
    library: document.getElementById("library"),
    canvas: document.getElementById("designCanvas"),
    workspace: document.getElementById("workspace"),
    canvasShell: document.getElementById("canvasShell"),
    connectionLayer: document.getElementById("connectionLayer"),
    guideV: document.getElementById("guideV"),
    guideH: document.getElementById("guideH"),
    badge: document.getElementById("selectionBadge"),
    properties: document.getElementById("properties"),
    connectBtn: document.getElementById("connectBtn"),
    undoBtn: document.getElementById("undoBtn"),
    redoBtn: document.getElementById("redoBtn"),
    duplicateBtn: document.getElementById("duplicateBtn"),
    deleteBtn: document.getElementById("deleteBtn"),
    snapBtn: document.getElementById("snapBtn"),
    toggleGridBtn: document.getElementById("toggleGridBtn"),
    gridSize: document.getElementById("gridSize"),
    canvasWidth: document.getElementById("canvasWidth"),
    canvasHeight: document.getElementById("canvasHeight"),
    canvasLabel: document.getElementById("canvasLabel"),
    canvasResizeHandle: document.getElementById("canvasResizeHandle"),
    toast: document.getElementById("toast")
  };

  const uid = (prefix = "id") => `${prefix}_${Math.random().toString(36).slice(2, 9)}${Date.now().toString(36).slice(-4)}`;
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const round = (value, decimals = 0) => Number(Number(value).toFixed(decimals));
  const esc = value => String(value ?? "").replace(/[&<>'"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[ch]));
  const cssEsc = value => String(value ?? "").replace(/[<>]/g, "");
  const selectedElement = () => state.selectedKind === "element" ? state.elements.find(e => e.id === state.selectedId) : null;
  const selectedConnection = () => state.selectedKind === "connection" ? state.connections.find(c => c.id === state.selectedId) : null;
  const getElement = id => state.elements.find(e => e.id === id);

  function defaultProps(type) {
    const common = {
      label: type[0].toUpperCase() + type.slice(1),
      fill: ["rectangle", "circle", "triangle"].includes(type) ? "#c7d2fe" : "#ffffff",
      color: "#172033",
      borderColor: ["rectangle", "circle", "triangle", "line"].includes(type) ? "#4f46e5" : "#cbd5e1",
      borderWidth: type === "line" ? 3 : 1,
      borderStyle: "solid",
      radius: ["button", "input", "textarea", "dropdown", "stepper"].includes(type) ? 8 : 4,
      opacity: 1,
      shadowX: 0,
      shadowY: 4,
      shadowBlur: 14,
      shadowSpread: 0,
      shadowColor: "rgba(15,23,42,0.12)",
      shadowEnabled: false,
      fontSize: 14,
      fontWeight: 600,
      textAlign: "center",
      rotation: 0,
      placeholder: "Type here…",
      options: "Option one\nOption two\nOption three",
      min: 0,
      max: 100,
      value: type === "progress" ? 65 : type === "slider" ? 45 : type === "stepper" ? 1 : 0,
      checked: true,
      locked: false,
      hidden: false
    };
    const labels = {
      text: "Heading text",
      button: "Button",
      input: "",
      textarea: "",
      checkbox: "Remember me",
      dropdown: "",
      slider: "",
      stepper: "",
      progress: "",
      rectangle: "",
      circle: "",
      triangle: "",
      line: ""
    };
    common.label = labels[type] ?? common.label;
    if (type === "button") { common.fill = "#4f46e5"; common.color = "#ffffff"; common.borderColor = "#4f46e5"; common.shadowEnabled = true; }
    if (type === "text") { common.fontSize = 22; common.fontWeight = 750; common.textAlign = "left"; }
    if (type === "progress" || type === "slider") { common.fill = "#4f46e5"; common.borderWidth = 0; }
    if (type === "checkbox") { common.borderWidth = 0; common.textAlign = "left"; }
    return common;
  }

  function newElement(type, x, y) {
    const [w, h] = SIZE_DEFAULTS[type] || [140, 60];
    return {
      id: uid("el"), type,
      x: clamp(x, 0, Math.max(0, state.canvas.width - w)),
      y: clamp(y, 0, Math.max(0, state.canvas.height - h)),
      w, h,
      z: Math.max(0, ...state.elements.map(e => e.z || 0)) + 1,
      props: defaultProps(type)
    };
  }

  function renderLibrary() {
    const sections = [...new Set(COMPONENTS.map(item => item.section))];
    dom.library.innerHTML = sections.map(section => `
      <section class="library-section">
        <h3>${esc(section)}</h3>
        <div class="library-grid">
          ${COMPONENTS.filter(c => c.section === section).map(c => `
            <div class="palette-item" draggable="true" data-type="${esc(c.type)}" title="Drag or click to add ${esc(c.label)}">
              <div class="palette-icon">${c.icon}</div>
              <span>${esc(c.label)}</span>
            </div>`).join("")}
        </div>
      </section>`).join("");

    dom.library.querySelectorAll(".palette-item").forEach(item => {
      item.addEventListener("dragstart", event => {
        event.dataTransfer.setData("text/ui-component", item.dataset.type);
        event.dataTransfer.effectAllowed = "copy";
      });
      item.addEventListener("click", () => {
        const type = item.dataset.type;
        const [w, h] = SIZE_DEFAULTS[type] || [140, 60];
        const el = newElement(type, (state.canvas.width - w) / 2, (state.canvas.height - h) / 2);
        state.elements.push(el);
        renderAll();
        select("element", el.id);
        commitHistory();
        toast(`${type} added`);
      });
    });
  }

  function componentInnerHTML(el, interactive = false) {
    const p = el.props;
    const style = visualStyle(el);
    const disabled = interactive ? "" : " disabled";
    const valuePercent = clamp((Number(p.value) - Number(p.min)) / Math.max(1, Number(p.max) - Number(p.min)) * 100, 0, 100);
    switch (el.type) {
      case "text": return `<div class="visual text" style="${style}">${esc(p.label || "Text")}</div>`;
      case "button": return `<button class="visual" style="${style}"${disabled}>${esc(p.label || "Button")}</button>`;
      case "input": return `<input class="visual" style="${style}" placeholder="${esc(p.placeholder)}"${disabled}>`;
      case "textarea": return `<textarea class="visual" style="${style}" placeholder="${esc(p.placeholder)}"${disabled}></textarea>`;
      case "checkbox": return `<div class="visual checkbox-visual" style="${style}"><span class="checkbox-box ${p.checked ? "checked" : ""}"></span><span>${esc(p.label || "Checkbox")}</span></div>`;
      case "dropdown": {
        const options = String(p.options || "Option").split(/\r?\n/).filter(Boolean);
        return `<select class="visual" style="${style}"${disabled}>${options.map(o => `<option>${esc(o)}</option>`).join("")}</select>`;
      }
      case "slider": return `<div class="visual slider-visual" style="${style}"><div class="slider-track"><div class="slider-fill" style="width:${valuePercent}%;background:${cssEsc(p.fill)}"></div><div class="slider-thumb" style="left:${valuePercent}%;background:${cssEsc(p.fill)}"></div></div></div>`;
      case "stepper": return `<div class="visual stepper-visual" style="${style}"><span>−</span><span>${esc(p.value)}</span><span>+</span></div>`;
      case "progress": return `<div class="visual progress-visual" style="${style}"><div class="progress-fill" style="width:${valuePercent}%;background:${cssEsc(p.fill)}"></div><span class="progress-label">${round(valuePercent)}%</span></div>`;
      case "rectangle": return `<div class="shape-rect" style="${shapeStyle(el)}"></div>`;
      case "circle": return `<div class="shape-circle" style="${shapeStyle(el)}"></div>`;
      case "triangle": return `<svg class="shape-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="50,2 98,98 2,98" fill="${esc(p.fill)}" stroke="${esc(p.borderColor)}" stroke-width="${Math.max(0, Number(p.borderWidth))}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
      case "line": return `<svg class="shape-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="2" y1="50" x2="98" y2="50" stroke="${esc(p.borderColor)}" stroke-width="${Math.max(1, Number(p.borderWidth))}" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>`;
      default: return `<div class="visual" style="${style}">${esc(p.label || el.type)}</div>`;
    }
  }

  function boxShadow(p) {
    return p.shadowEnabled ? `${Number(p.shadowX) || 0}px ${Number(p.shadowY) || 0}px ${Math.max(0, Number(p.shadowBlur) || 0)}px ${Number(p.shadowSpread) || 0}px ${cssEsc(p.shadowColor || "rgba(0,0,0,.15)")}` : "none";
  }

  function visualStyle(el) {
    const p = el.props;
    const alignMap = { left: "flex-start", center: "center", right: "flex-end" };
    return [
      `background:${cssEsc(p.fill)}`,
      `color:${cssEsc(p.color)}`,
      `border:${Math.max(0, Number(p.borderWidth) || 0)}px ${cssEsc(p.borderStyle || "solid")} ${cssEsc(p.borderColor)}`,
      `border-radius:${Math.max(0, Number(p.radius) || 0)}px`,
      `box-shadow:${boxShadow(p)}`,
      `font-size:${Math.max(6, Number(p.fontSize) || 14)}px`,
      `font-weight:${Number(p.fontWeight) || 400}`,
      `text-align:${cssEsc(p.textAlign || "center")}`,
      `justify-content:${alignMap[p.textAlign] || "center"}`
    ].join(";");
  }

  function shapeStyle(el) {
    const p = el.props;
    return [
      `background:${cssEsc(p.fill)}`,
      `border:${Math.max(0, Number(p.borderWidth) || 0)}px ${cssEsc(p.borderStyle || "solid")} ${cssEsc(p.borderColor)}`,
      `border-radius:${Math.max(0, Number(p.radius) || 0)}px`,
      `box-shadow:${boxShadow(p)}`
    ].join(";");
  }

  function renderAll() {
    dom.canvas.querySelectorAll(".builder-element").forEach(node => node.remove());
    state.elements.forEach(createElementNode);
    applyCanvasSettings();
    drawConnections();
    updateSelectionClasses();
    renderProperties();
    updateToolbarState();
  }

  function createElementNode(el) {
    const node = document.createElement("div");
    node.className = "builder-element";
    node.dataset.id = el.id;
    node.dataset.type = el.type;
    node.innerHTML = `<div class="element-content">${componentInnerHTML(el, false)}</div>${["nw","n","ne","e","se","s","sw","w"].map(dir => `<span class="resize-handle ${dir}" data-dir="${dir}"></span>`).join("")}`;
    node.addEventListener("pointerdown", onElementPointerDown);
    dom.canvas.appendChild(node);
    updateElementNode(el);
  }

  function updateElementNode(el) {
    const node = dom.canvas.querySelector(`.builder-element[data-id="${CSS.escape(el.id)}"]`);
    if (!node) return;
    node.style.left = `${el.x}px`;
    node.style.top = `${el.y}px`;
    node.style.width = `${el.w}px`;
    node.style.height = `${el.h}px`;
    node.style.zIndex = String((el.z || 0) + 3);
    node.style.opacity = String(clamp(Number(el.props.opacity) || 0, 0, 1));
    node.style.transform = `rotate(${Number(el.props.rotation) || 0}deg)`;
    node.style.display = el.props.hidden ? "none" : "block";
    node.classList.toggle("locked", !!el.props.locked);
    const content = node.querySelector(".element-content");
    if (content) content.innerHTML = componentInnerHTML(el, false);
  }

  function applyCanvasSettings() {
    dom.canvas.style.width = `${state.canvas.width}px`;
    dom.canvas.style.height = `${state.canvas.height}px`;
    dom.canvas.style.backgroundSize = `${state.canvas.grid}px ${state.canvas.grid}px`;
    dom.canvas.classList.toggle("no-grid", !state.canvas.showGrid);
    dom.canvasWidth.value = state.canvas.width;
    dom.canvasHeight.value = state.canvas.height;
    dom.gridSize.value = state.canvas.grid;
    dom.canvasLabel.textContent = `Canvas · ${state.canvas.width} × ${state.canvas.height}`;
    dom.snapBtn.classList.toggle("active", state.canvas.snap);
    dom.toggleGridBtn.classList.toggle("active", state.canvas.showGrid);
    dom.connectionLayer.setAttribute("viewBox", `0 0 ${state.canvas.width} ${state.canvas.height}`);
  }

  function getCanvasPoint(clientX, clientY) {
    const rect = dom.canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * state.canvas.width / rect.width,
      y: (clientY - rect.top) * state.canvas.height / rect.height
    };
  }

  function onElementPointerDown(event) {
    event.stopPropagation();
    const node = event.currentTarget;
    const el = getElement(node.dataset.id);
    if (!el || el.props.hidden) return;

    if (state.connectMode) {
      handleConnectClick(el.id);
      return;
    }

    const handle = event.target.closest(".resize-handle");
    select("element", el.id);
    if (el.props.locked) { toast("Element is locked"); return; }

    const point = getCanvasPoint(event.clientX, event.clientY);
    if (handle) {
      state.interaction = {
        kind: "resize", id: el.id, dir: handle.dataset.dir,
        startPoint: point, start: { x: el.x, y: el.y, w: el.w, h: el.h }
      };
    } else {
      state.interaction = {
        kind: "move", id: el.id,
        startPoint: point, start: { x: el.x, y: el.y }
      };
    }
    node.setPointerCapture?.(event.pointerId);
  }

  function onPointerMove(event) {
    const inter = state.interaction;
    if (!inter) return;
    const point = getCanvasPoint(event.clientX, event.clientY);

    if (inter.kind === "move") moveInteraction(inter, point);
    else if (inter.kind === "resize") resizeInteraction(inter, point);
    else if (inter.kind === "canvas-resize") canvasResizeInteraction(inter, point);
    else if (inter.kind === "connection-control") connectionControlInteraction(inter, point);
  }

  function onPointerUp() {
    if (!state.interaction) return;
    const changed = state.interaction.kind;
    state.interaction = null;
    hideGuides();
    hideBadge();
    if (changed) commitHistory();
  }

  function moveInteraction(inter, point) {
    const el = getElement(inter.id);
    if (!el) return;
    let x = inter.start.x + point.x - inter.startPoint.x;
    let y = inter.start.y + point.y - inter.startPoint.y;
    const snapped = snapPosition(el, x, y, el.w, el.h);
    el.x = clamp(snapped.x, 0, Math.max(0, state.canvas.width - el.w));
    el.y = clamp(snapped.y, 0, Math.max(0, state.canvas.height - el.h));
    updateElementNode(el);
    drawConnections();
    showBadge(el);
    syncPropertyPosition(el);
  }

  function resizeInteraction(inter, point) {
    const el = getElement(inter.id);
    if (!el) return;
    const dx = point.x - inter.startPoint.x;
    const dy = point.y - inter.startPoint.y;
    let { x, y, w, h } = inter.start;
    const dir = inter.dir;
    const minW = el.type === "line" ? 30 : 24;
    const minH = el.type === "line" ? 12 : 20;

    if (dir.includes("e")) w = Math.max(minW, inter.start.w + dx);
    if (dir.includes("s")) h = Math.max(minH, inter.start.h + dy);
    if (dir.includes("w")) { w = Math.max(minW, inter.start.w - dx); x = inter.start.x + (inter.start.w - w); }
    if (dir.includes("n")) { h = Math.max(minH, inter.start.h - dy); y = inter.start.y + (inter.start.h - h); }

    if (state.canvas.snap) {
      const g = state.canvas.grid;
      if (dir.includes("e")) w = Math.max(minW, Math.round((x + w) / g) * g - x);
      if (dir.includes("s")) h = Math.max(minH, Math.round((y + h) / g) * g - y);
      if (dir.includes("w")) {
        const right = x + w;
        x = Math.round(x / g) * g;
        w = Math.max(minW, right - x);
      }
      if (dir.includes("n")) {
        const bottom = y + h;
        y = Math.round(y / g) * g;
        h = Math.max(minH, bottom - y);
      }
    }

    x = clamp(x, 0, state.canvas.width - minW);
    y = clamp(y, 0, state.canvas.height - minH);
    w = clamp(w, minW, state.canvas.width - x);
    h = clamp(h, minH, state.canvas.height - y);

    el.x = round(x); el.y = round(y); el.w = round(w); el.h = round(h);
    updateElementNode(el);
    drawConnections();
    showBadge(el);
    syncPropertyPosition(el);
  }

  function snapPosition(el, x, y, w, h) {
    let outX = x, outY = y;
    let vGuide = null, hGuide = null;
    if (state.canvas.snap) {
      const grid = state.canvas.grid;
      outX = Math.round(outX / grid) * grid;
      outY = Math.round(outY / grid) * grid;
      const threshold = 5;
      const movingX = [outX, outX + w / 2, outX + w];
      const movingY = [outY, outY + h / 2, outY + h];
      let bestX = threshold + 1, bestY = threshold + 1;
      for (const other of state.elements) {
        if (other.id === el.id || other.props.hidden) continue;
        const targetsX = [other.x, other.x + other.w / 2, other.x + other.w];
        const targetsY = [other.y, other.y + other.h / 2, other.y + other.h];
        for (let mi = 0; mi < movingX.length; mi++) {
          for (const tx of targetsX) {
            const diff = tx - movingX[mi];
            if (Math.abs(diff) < bestX) { bestX = Math.abs(diff); outX += diff; movingX[0] += diff; movingX[1] += diff; movingX[2] += diff; vGuide = tx; }
          }
        }
        for (let mi = 0; mi < movingY.length; mi++) {
          for (const ty of targetsY) {
            const diff = ty - movingY[mi];
            if (Math.abs(diff) < bestY) { bestY = Math.abs(diff); outY += diff; movingY[0] += diff; movingY[1] += diff; movingY[2] += diff; hGuide = ty; }
          }
        }
      }
    }
    showGuides(vGuide, hGuide);
    return { x: round(outX), y: round(outY) };
  }

  function showGuides(x, y) {
    if (x == null) dom.guideV.style.display = "none";
    else { dom.guideV.style.display = "block"; dom.guideV.style.left = `${x}px`; }
    if (y == null) dom.guideH.style.display = "none";
    else { dom.guideH.style.display = "block"; dom.guideH.style.top = `${y}px`; }
  }
  function hideGuides() { showGuides(null, null); }
  function showBadge(el) {
    dom.badge.textContent = `${round(el.w)} × ${round(el.h)}  ·  ${round(el.x)}, ${round(el.y)}`;
    dom.badge.style.display = "block";
    dom.badge.style.left = `${clamp(el.x, 0, state.canvas.width - 120)}px`;
    dom.badge.style.top = `${Math.max(2, el.y - 25)}px`;
  }
  function hideBadge() { dom.badge.style.display = "none"; }

  function select(kind, id) {
    state.selectedKind = kind;
    state.selectedId = id;
    updateSelectionClasses();
    renderProperties();
    updateToolbarState();
    drawConnections();
  }

  function updateSelectionClasses() {
    dom.canvas.querySelectorAll(".builder-element").forEach(node => {
      node.classList.toggle("selected", state.selectedKind === "element" && node.dataset.id === state.selectedId);
      node.classList.toggle("connect-source", state.connectStart === node.dataset.id);
    });
  }

  function clearSelection() {
    state.selectedKind = null;
    state.selectedId = null;
    state.connectStart = null;
    updateSelectionClasses();
    renderProperties();
    updateToolbarState();
    drawConnections();
  }

  function handleConnectClick(id) {
    if (!state.connectStart) {
      state.connectStart = id;
      updateSelectionClasses();
      toast("Select a second element");
      return;
    }
    if (state.connectStart === id) { toast("Choose a different element"); return; }
    const connection = {
      id: uid("conn"), from: state.connectStart, to: id,
      fromAnchor: "auto", toAnchor: "auto", route: "orthogonal",
      color: "#4f46e5", width: 2, dash: "solid", arrowStart: false, arrowEnd: true, offset: 0
    };
    state.connections.push(connection);
    state.connectStart = null;
    state.connectMode = false;
    dom.connectBtn.classList.remove("active");
    renderAll();
    select("connection", connection.id);
    commitHistory();
    toast("Connection created");
  }

  function anchorPoint(el, anchor, targetEl) {
    const cx = el.x + el.w / 2, cy = el.y + el.h / 2;
    let use = anchor;
    if (anchor === "auto") {
      const tx = targetEl ? targetEl.x + targetEl.w / 2 : cx + 1;
      const ty = targetEl ? targetEl.y + targetEl.h / 2 : cy;
      const dx = tx - cx, dy = ty - cy;
      if (Math.abs(dx) >= Math.abs(dy)) use = dx >= 0 ? "right" : "left";
      else use = dy >= 0 ? "bottom" : "top";
    }
    if (use === "left") return { x: el.x, y: cy, side: "left" };
    if (use === "right") return { x: el.x + el.w, y: cy, side: "right" };
    if (use === "top") return { x: cx, y: el.y, side: "top" };
    return { x: cx, y: el.y + el.h, side: "bottom" };
  }

  function connectionGeometry(conn) {
    const from = getElement(conn.from), to = getElement(conn.to);
    if (!from || !to) return null;
    const a = anchorPoint(from, conn.fromAnchor, to);
    const b = anchorPoint(to, conn.toAnchor, from);
    const offset = Number(conn.offset) || 0;
    let d = "", control = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, axis: "both" };
    if (conn.route === "straight") {
      d = `M ${a.x} ${a.y} L ${b.x} ${b.y}`;
    } else if (conn.route === "curved") {
      const horizontal = ["left","right"].includes(a.side);
      const distance = Math.max(40, Math.hypot(b.x - a.x, b.y - a.y) * 0.35) + offset;
      const c1 = horizontal ? { x: a.x + (a.side === "right" ? distance : -distance), y: a.y } : { x: a.x, y: a.y + (a.side === "bottom" ? distance : -distance) };
      const c2 = ["left","right"].includes(b.side) ? { x: b.x + (b.side === "right" ? distance : -distance), y: b.y } : { x: b.x, y: b.y + (b.side === "bottom" ? distance : -distance) };
      d = `M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`;
      control = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + offset, axis: "y" };
    } else {
      const horizontal = ["left","right"].includes(a.side);
      if (horizontal) {
        const midX = (a.x + b.x) / 2 + offset;
        d = `M ${a.x} ${a.y} L ${midX} ${a.y} L ${midX} ${b.y} L ${b.x} ${b.y}`;
        control = { x: midX, y: (a.y + b.y) / 2, axis: "x" };
      } else {
        const midY = (a.y + b.y) / 2 + offset;
        d = `M ${a.x} ${a.y} L ${a.x} ${midY} L ${b.x} ${midY} L ${b.x} ${b.y}`;
        control = { x: (a.x + b.x) / 2, y: midY, axis: "y" };
      }
    }
    return { a, b, d, control };
  }

  function drawConnections() {
    const defs = `<defs>
      ${state.connections.map(conn => `<marker id="arrow-${conn.id}" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="${esc(conn.color)}"></path></marker><marker id="arrow-start-${conn.id}" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="${esc(conn.color)}"></path></marker>`).join("")}
    </defs>`;
    const paths = state.connections.map(conn => {
      const g = connectionGeometry(conn);
      if (!g) return "";
      const selected = state.selectedKind === "connection" && state.selectedId === conn.id;
      const dash = conn.dash === "dashed" ? "8 6" : conn.dash === "dotted" ? "2 5" : "none";
      const markerEnd = conn.arrowEnd ? `url(#arrow-${conn.id})` : "none";
      const markerStart = conn.arrowStart ? `url(#arrow-start-${conn.id})` : "none";
      return `<g data-connection-id="${esc(conn.id)}">
        ${selected ? `<path d="${g.d}" fill="none" stroke="#c7d2fe" stroke-width="${Number(conn.width) + 6}" opacity=".75"></path>` : ""}
        <path class="connection-visible" d="${g.d}" stroke="${esc(conn.color)}" stroke-width="${Math.max(1, Number(conn.width) || 2)}" stroke-dasharray="${dash}" marker-start="${markerStart}" marker-end="${markerEnd}"></path>
        <path class="connection-hit" data-id="${esc(conn.id)}" d="${g.d}"></path>
        ${selected ? `<circle class="connection-endpoint" cx="${g.a.x}" cy="${g.a.y}" r="4"></circle><circle class="connection-endpoint" cx="${g.b.x}" cy="${g.b.y}" r="4"></circle><circle class="connection-control" data-id="${esc(conn.id)}" data-axis="${g.control.axis}" cx="${g.control.x}" cy="${g.control.y}" r="6"></circle>` : ""}
      </g>`;
    }).join("");
    dom.connectionLayer.innerHTML = defs + paths;

    dom.connectionLayer.querySelectorAll(".connection-hit").forEach(path => {
      path.addEventListener("pointerdown", event => {
        event.stopPropagation();
        select("connection", path.dataset.id);
      });
    });
    dom.connectionLayer.querySelectorAll(".connection-control").forEach(handle => {
      handle.addEventListener("pointerdown", event => {
        event.stopPropagation();
        const conn = state.connections.find(c => c.id === handle.dataset.id);
        if (!conn) return;
        state.interaction = { kind: "connection-control", id: conn.id, axis: handle.dataset.axis, startPoint: getCanvasPoint(event.clientX, event.clientY), startOffset: Number(conn.offset) || 0 };
      });
    });
  }

  function connectionControlInteraction(inter, point) {
    const conn = state.connections.find(c => c.id === inter.id);
    if (!conn) return;
    const delta = inter.axis === "x" ? point.x - inter.startPoint.x : point.y - inter.startPoint.y;
    conn.offset = round(inter.startOffset + delta);
    drawConnections();
    syncConnectionOffset(conn);
  }

  function field(label, input, full = false) {
    return `<div class="prop-row${full ? " full" : ""}"><label>${esc(label)}</label>${input}</div>`;
  }
  function inputField(scope, prop, value, type = "text", attrs = "") {
    const safeValue = type === "checkbox" ? "" : ` value="${esc(value)}"`;
    const checked = type === "checkbox" && value ? " checked" : "";
    if (type === "checkbox") return `<label class="prop-check"><input type="checkbox" data-scope="${scope}" data-prop="${prop}"${checked}> Enabled</label>`;
    return `<input class="prop-input" type="${type}" data-scope="${scope}" data-prop="${prop}"${safeValue} ${attrs}>`;
  }
  function selectField(scope, prop, value, options) {
    return `<select class="prop-input" data-scope="${scope}" data-prop="${prop}">${options.map(([v,l]) => `<option value="${esc(v)}"${String(v) === String(value) ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  }

  function renderProperties() {
    const el = selectedElement();
    const conn = selectedConnection();
    if (!el && !conn) {
      dom.properties.innerHTML = `<div class="empty-state"><div class="big">◇</div><h3>Nothing selected</h3><p>Select an element or connector to edit its properties. Use the Connect tool to create dynamic flow lines.</p></div><div class="hint"><strong>Tips:</strong> drag resize handles, use arrow keys for precise movement, Shift + arrows for 10 px, and Delete to remove a selection.</div>`;
      return;
    }

    if (conn) {
      const elementOptions = state.elements.map(e => [e.id, `${e.type} · ${e.id.slice(-5)}`]);
      dom.properties.innerHTML = `<div class="properties">
        <section class="prop-section">
          <div class="prop-section-title">Connection</div>
          ${field("From", selectField("connection", "from", conn.from, elementOptions))}
          ${field("To", selectField("connection", "to", conn.to, elementOptions))}
          <div class="prop-grid">
            ${field("From anchor", selectField("connection", "fromAnchor", conn.fromAnchor, [["auto","Auto"],["top","Top"],["right","Right"],["bottom","Bottom"],["left","Left"]]))}
            ${field("To anchor", selectField("connection", "toAnchor", conn.toAnchor, [["auto","Auto"],["top","Top"],["right","Right"],["bottom","Bottom"],["left","Left"]]))}
          </div>
          ${field("Routing", selectField("connection", "route", conn.route, [["orthogonal","Orthogonal"],["curved","Curved"],["straight","Straight"]]))}
        </section>
        <section class="prop-section">
          <div class="prop-section-title">Line style</div>
          <div class="prop-grid">
            ${field("Color", inputField("connection", "color", conn.color, "color"))}
            ${field("Width", inputField("connection", "width", conn.width, "number", 'min="1" max="20" step="1"'))}
            ${field("Pattern", selectField("connection", "dash", conn.dash, [["solid","Solid"],["dashed","Dashed"],["dotted","Dotted"]]))}
            ${field("Offset", inputField("connection", "offset", conn.offset, "number", 'step="1"'))}
          </div>
          <div class="prop-grid">
            ${field("Start arrow", inputField("connection", "arrowStart", conn.arrowStart, "checkbox"))}
            ${field("End arrow", inputField("connection", "arrowEnd", conn.arrowEnd, "checkbox"))}
          </div>
        </section>
        <section class="prop-section">
          <div class="prop-section-title">Actions</div>
          <div class="prop-actions"><button class="btn" data-action="reverse-connection">⇄ Reverse</button><button class="btn danger" data-action="delete-selection">Delete</button></div>
        </section>
      </div>`;
      bindPropertyEvents();
      return;
    }

    const p = el.props;
    const hasText = ["text","button","checkbox"].includes(el.type);
    const hasPlaceholder = ["input","textarea"].includes(el.type);
    const hasOptions = el.type === "dropdown";
    const hasValue = ["slider","stepper","progress"].includes(el.type);
    const isShape = ["rectangle","circle","triangle","line"].includes(el.type);

    dom.properties.innerHTML = `<div class="properties">
      <section class="prop-section">
        <div class="prop-section-title"><span>${esc(el.type)}</span><span>${esc(el.id.slice(-6))}</span></div>
        <div class="prop-grid">
          ${field("X", inputField("element", "x", round(el.x), "number", 'step="1"'))}
          ${field("Y", inputField("element", "y", round(el.y), "number", 'step="1"'))}
          ${field("Width", inputField("element", "w", round(el.w), "number", 'min="12" step="1"'))}
          ${field("Height", inputField("element", "h", round(el.h), "number", 'min="12" step="1"'))}
          ${field("Rotation", inputField("props", "rotation", p.rotation, "number", 'step="1"'))}
          ${field("Layer", inputField("element", "z", el.z, "number", 'min="0" step="1"'))}
        </div>
      </section>

      ${(hasText || hasPlaceholder || hasOptions || hasValue) ? `<section class="prop-section">
        <div class="prop-section-title">Component data</div>
        ${hasText ? field("Text / label", `<input class="prop-input" type="text" data-scope="props" data-prop="label" value="${esc(p.label)}">`) : ""}
        ${hasPlaceholder ? field("Placeholder", `<input class="prop-input" type="text" data-scope="props" data-prop="placeholder" value="${esc(p.placeholder)}">`) : ""}
        ${hasOptions ? field("Options (one per line)", `<textarea class="prop-input" rows="4" data-scope="props" data-prop="options">${esc(p.options)}</textarea>`) : ""}
        ${hasValue ? `<div class="prop-grid">${field("Value", inputField("props", "value", p.value, "number", 'step="1"'))}${field("Minimum", inputField("props", "min", p.min, "number", 'step="1"'))}${field("Maximum", inputField("props", "max", p.max, "number", 'step="1"'))}</div>` : ""}
        ${el.type === "checkbox" ? field("Checked", inputField("props", "checked", p.checked, "checkbox")) : ""}
      </section>` : ""}

      <section class="prop-section">
        <div class="prop-section-title">Appearance</div>
        <div class="prop-grid">
          ${el.type !== "line" ? field(isShape ? "Fill" : "Background", inputField("props", "fill", p.fill, "color")) : ""}
          ${!isShape ? field("Text color", inputField("props", "color", p.color, "color")) : ""}
          ${field(el.type === "line" ? "Line color" : "Border color", inputField("props", "borderColor", p.borderColor, "color"))}
          ${field(el.type === "line" ? "Line width" : "Border width", inputField("props", "borderWidth", p.borderWidth, "number", 'min="0" max="40" step="1"'))}
          ${el.type !== "line" ? field("Border style", selectField("props", "borderStyle", p.borderStyle, [["solid","Solid"],["dashed","Dashed"],["dotted","Dotted"],["double","Double"]])) : ""}
          ${!["triangle","line"].includes(el.type) ? field("Border radius", inputField("props", "radius", p.radius, "number", 'min="0" max="500" step="1"')) : ""}
          ${field("Opacity", inputField("props", "opacity", p.opacity, "number", 'min="0" max="1" step="0.05"'))}
        </div>
      </section>

      ${!isShape || el.type === "rectangle" || el.type === "circle" ? `<section class="prop-section">
        <div class="prop-section-title">Typography</div>
        <div class="prop-grid">
          ${field("Font size", inputField("props", "fontSize", p.fontSize, "number", 'min="6" max="160" step="1"'))}
          ${field("Weight", selectField("props", "fontWeight", p.fontWeight, [[300,"Light"],[400,"Regular"],[500,"Medium"],[600,"Semibold"],[700,"Bold"],[800,"Extra bold"]]))}
          ${field("Alignment", selectField("props", "textAlign", p.textAlign, [["left","Left"],["center","Center"],["right","Right"]]))}
        </div>
      </section>` : ""}

      ${el.type !== "line" && el.type !== "triangle" ? `<section class="prop-section">
        <div class="prop-section-title">Box shadow</div>
        ${field("Shadow enabled", inputField("props", "shadowEnabled", p.shadowEnabled, "checkbox"))}
        <div class="prop-grid">
          ${field("X", inputField("props", "shadowX", p.shadowX, "number", 'step="1"'))}
          ${field("Y", inputField("props", "shadowY", p.shadowY, "number", 'step="1"'))}
          ${field("Blur", inputField("props", "shadowBlur", p.shadowBlur, "number", 'min="0" step="1"'))}
          ${field("Spread", inputField("props", "shadowSpread", p.shadowSpread, "number", 'step="1"'))}
        </div>
        ${field("Shadow color", `<input class="prop-input" type="text" data-scope="props" data-prop="shadowColor" value="${esc(p.shadowColor)}" placeholder="rgba(0,0,0,0.2)">`)}
      </section>` : ""}

      <section class="prop-section">
        <div class="prop-section-title">Advanced</div>
        <div class="prop-grid">
          ${field("Locked", inputField("props", "locked", p.locked, "checkbox"))}
          ${field("Hidden", inputField("props", "hidden", p.hidden, "checkbox"))}
        </div>
        <div class="prop-actions">
          <button class="btn" data-action="bring-front">Bring to front</button>
          <button class="btn" data-action="send-back">Send to back</button>
          <button class="btn" data-action="duplicate">Duplicate</button>
          <button class="btn danger" data-action="delete-selection">Delete</button>
        </div>
      </section>
    </div>`;
    bindPropertyEvents();
  }

  function bindPropertyEvents() {
    dom.properties.querySelectorAll("[data-prop]").forEach(input => {
      input.addEventListener("input", onPropertyInput);
      input.addEventListener("change", () => commitHistory());
    });
    dom.properties.querySelectorAll("[data-action]").forEach(button => {
      button.addEventListener("click", () => propertyAction(button.dataset.action));
    });
  }

  function onPropertyInput(event) {
    const input = event.currentTarget;
    const value = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value) : input.value;
    const scope = input.dataset.scope;
    const prop = input.dataset.prop;

    if (state.selectedKind === "element") {
      const el = selectedElement();
      if (!el) return;
      if (scope === "element") {
        if (["x","y","w","h","z"].includes(prop)) el[prop] = Number(value);
        el.w = Math.max(12, el.w); el.h = Math.max(12, el.h);
        el.x = clamp(el.x, 0, Math.max(0, state.canvas.width - el.w));
        el.y = clamp(el.y, 0, Math.max(0, state.canvas.height - el.h));
      } else if (scope === "props") {
        el.props[prop] = value;
      }
      updateElementNode(el);
      drawConnections();
      updateSelectionClasses();
    } else if (state.selectedKind === "connection") {
      const conn = selectedConnection();
      if (!conn) return;
      conn[prop] = value;
      drawConnections();
    }
  }

  function syncPropertyPosition(el) {
    ["x","y","w","h"].forEach(prop => {
      const input = dom.properties.querySelector(`[data-scope="element"][data-prop="${prop}"]`);
      if (input) input.value = round(el[prop]);
    });
  }
  function syncConnectionOffset(conn) {
    const input = dom.properties.querySelector('[data-scope="connection"][data-prop="offset"]');
    if (input) input.value = round(conn.offset);
  }

  function propertyAction(action) {
    if (action === "delete-selection") deleteSelection();
    else if (action === "duplicate") duplicateSelection();
    else if (action === "bring-front") {
      const el = selectedElement(); if (!el) return;
      el.z = Math.max(0, ...state.elements.map(e => e.z || 0)) + 1; updateElementNode(el); renderProperties(); commitHistory();
    } else if (action === "send-back") {
      const el = selectedElement(); if (!el) return;
      el.z = Math.min(0, ...state.elements.map(e => e.z || 0)) - 1; updateElementNode(el); renderProperties(); commitHistory();
    } else if (action === "reverse-connection") {
      const conn = selectedConnection(); if (!conn) return;
      [conn.from, conn.to] = [conn.to, conn.from];
      [conn.fromAnchor, conn.toAnchor] = [conn.toAnchor, conn.fromAnchor];
      drawConnections(); renderProperties(); commitHistory();
    }
  }

  function deleteSelection() {
    if (state.selectedKind === "element") {
      const id = state.selectedId;
      state.elements = state.elements.filter(e => e.id !== id);
      state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
    } else if (state.selectedKind === "connection") {
      state.connections = state.connections.filter(c => c.id !== state.selectedId);
    } else return;
    state.selectedKind = null; state.selectedId = null;
    renderAll(); commitHistory(); toast("Selection deleted");
  }

  function duplicateSelection() {
    const el = selectedElement();
    if (!el) return;
    const copy = JSON.parse(JSON.stringify(el));
    copy.id = uid("el");
    copy.x = clamp(el.x + state.canvas.grid * 2, 0, state.canvas.width - el.w);
    copy.y = clamp(el.y + state.canvas.grid * 2, 0, state.canvas.height - el.h);
    copy.z = Math.max(0, ...state.elements.map(e => e.z || 0)) + 1;
    state.elements.push(copy);
    renderAll(); select("element", copy.id); commitHistory(); toast("Element duplicated");
  }

  function canvasResizeInteraction(inter, point) {
    let width = Math.max(320, inter.start.width + point.x - inter.startPoint.x);
    let height = Math.max(240, inter.start.height + point.y - inter.startPoint.y);
    if (state.canvas.snap) {
      width = Math.round(width / state.canvas.grid) * state.canvas.grid;
      height = Math.round(height / state.canvas.grid) * state.canvas.grid;
    }
    state.canvas.width = round(width);
    state.canvas.height = round(height);
    applyCanvasSettings();
    drawConnections();
  }

  function setCanvasSize(width, height, commit = true) {
    state.canvas.width = clamp(Number(width) || 1200, 320, 5000);
    state.canvas.height = clamp(Number(height) || 800, 240, 5000);
    applyCanvasSettings(); drawConnections();
    if (commit) commitHistory();
  }

  function updateToolbarState() {
    dom.undoBtn.disabled = state.historyIndex <= 0;
    dom.redoBtn.disabled = state.historyIndex >= state.history.length - 1;
    dom.duplicateBtn.disabled = state.selectedKind !== "element";
    dom.deleteBtn.disabled = !state.selectedKind;
    dom.connectBtn.classList.toggle("active", state.connectMode);
  }

  function projectSnapshot() {
    return JSON.stringify({ version: 1, canvas: state.canvas, elements: state.elements, connections: state.connections });
  }

  function commitHistory() {
    if (state.isRestoring) return;
    const snapshot = projectSnapshot();
    if (state.history[state.historyIndex] === snapshot) { updateToolbarState(); return; }
    state.history = state.history.slice(0, state.historyIndex + 1);
    state.history.push(snapshot);
    if (state.history.length > 100) state.history.shift();
    state.historyIndex = state.history.length - 1;
    updateToolbarState();
  }

  function restoreSnapshot(snapshot) {
    if (!snapshot) return;
    state.isRestoring = true;
    try {
      const data = JSON.parse(snapshot);
      state.canvas = { width: 1200, height: 800, grid: 10, snap: true, showGrid: true, ...(data.canvas || {}) };
      state.elements = Array.isArray(data.elements) ? data.elements : [];
      state.connections = Array.isArray(data.connections) ? data.connections : [];
      state.selectedKind = null; state.selectedId = null; state.connectStart = null; state.connectMode = false;
      renderAll();
    } finally { state.isRestoring = false; }
  }

  function undo() {
    if (state.historyIndex <= 0) return;
    state.historyIndex--;
    restoreSnapshot(state.history[state.historyIndex]);
    updateToolbarState();
  }
  function redo() {
    if (state.historyIndex >= state.history.length - 1) return;
    state.historyIndex++;
    restoreSnapshot(state.history[state.historyIndex]);
    updateToolbarState();
  }

  function downloadBlob(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  function exportProjectHTML() {
    const elementsMarkup = state.elements.filter(e => !e.props.hidden).map(el => {
      const baseStyle = [
        "position:absolute", `left:${round(el.x,2)}px`, `top:${round(el.y,2)}px`, `width:${round(el.w,2)}px`, `height:${round(el.h,2)}px`,
        `z-index:${Number(el.z) || 0}`, `opacity:${clamp(Number(el.props.opacity) || 0,0,1)}`, `transform:rotate(${Number(el.props.rotation) || 0}deg)`, "transform-origin:center"
      ].join(";");
      return `<div class="export-element" data-id="${esc(el.id)}" data-type="${esc(el.type)}" style="${baseStyle}">${componentInnerHTML(el, true)}</div>`;
    }).join("\n");

    const exportData = JSON.stringify({ connections: state.connections, elements: state.elements.map(e => ({ id: e.id, x: e.x, y: e.y, w: e.w, h: e.h })) }).replace(/</g, "\\u003c");
    const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exported UI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef2f7;color:#172033}.stage-wrap{min-height:100vh;display:grid;place-items:center;padding:32px;overflow:auto}.stage{position:relative;width:${state.canvas.width}px;height:${state.canvas.height}px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.14);overflow:hidden;isolation:isolate}.export-element{position:absolute}.visual{width:100%;height:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px 12px;overflow:hidden;outline:none}.visual.text{background:transparent!important;border-color:transparent!important;box-shadow:none!important;padding:2px}.checkbox-visual{justify-content:flex-start;gap:8px}.checkbox-box{width:17px;height:17px;flex:0 0 17px;border-radius:4px;border:2px solid currentColor;display:grid;place-items:center}.checkbox-box.checked:after{content:"✓";font-size:12px;font-weight:900}.slider-visual{padding:10px 12px}.slider-track{position:relative;width:100%;height:6px;background:#dbe3ef;border-radius:999px;overflow:visible}.slider-fill{height:100%;border-radius:inherit}.slider-thumb{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;box-shadow:0 1px 5px rgba(15,23,42,.3)}.stepper-visual{display:grid;grid-template-columns:34px 1fr 34px;padding:0;overflow:hidden}.stepper-visual span{height:100%;display:grid;place-items:center}.stepper-visual span:first-child,.stepper-visual span:last-child{background:rgba(148,163,184,.14);font-size:18px}.progress-visual{position:relative;padding:0;background:#e2e8f0!important}.progress-fill{position:absolute;inset:0 auto 0 0}.progress-label{position:relative;z-index:1;font-size:11px;font-weight:800;mix-blend-mode:multiply}.shape-rect,.shape-circle{width:100%;height:100%}.shape-circle{border-radius:50%!important}.shape-svg{display:block;width:100%;height:100%;overflow:visible}.connections{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:9999}
</style>
</head>
<body>
<div class="stage-wrap"><div class="stage" id="stage">
${elementsMarkup}
<svg class="connections" id="connections" viewBox="0 0 ${state.canvas.width} ${state.canvas.height}"></svg>
</div></div>
<script>
const project=${exportData};
const stage=document.getElementById("stage"),svg=document.getElementById("connections");
function elBox(id){const node=stage.querySelector('[data-id="'+CSS.escape(id)+'"]');if(!node)return null;return{node,x:node.offsetLeft,y:node.offsetTop,w:node.offsetWidth,h:node.offsetHeight}}
function anchor(el,side,target){const cx=el.x+el.w/2,cy=el.y+el.h/2;let use=side;if(side==="auto"){const tx=target.x+target.w/2,ty=target.y+target.h/2,dx=tx-cx,dy=ty-cy;use=Math.abs(dx)>=Math.abs(dy)?(dx>=0?"right":"left"):(dy>=0?"bottom":"top")}if(use==="left")return{x:el.x,y:cy,side:use};if(use==="right")return{x:el.x+el.w,y:cy,side:use};if(use==="top")return{x:cx,y:el.y,side:use};return{x:cx,y:el.y+el.h,side:"bottom"}}
function geometry(c){const f=elBox(c.from),t=elBox(c.to);if(!f||!t)return null;const a=anchor(f,c.fromAnchor,t),b=anchor(t,c.toAnchor,f),o=Number(c.offset)||0;let d;if(c.route==="straight")d='M '+a.x+' '+a.y+' L '+b.x+' '+b.y;else if(c.route==="curved"){const horizontal=["left","right"].includes(a.side),dist=Math.max(40,Math.hypot(b.x-a.x,b.y-a.y)*.35)+o,c1=horizontal?{x:a.x+(a.side==="right"?dist:-dist),y:a.y}:{x:a.x,y:a.y+(a.side==="bottom"?dist:-dist)},c2=["left","right"].includes(b.side)?{x:b.x+(b.side==="right"?dist:-dist),y:b.y}:{x:b.x,y:b.y+(b.side==="bottom"?dist:-dist)};d='M '+a.x+' '+a.y+' C '+c1.x+' '+c1.y+', '+c2.x+' '+c2.y+', '+b.x+' '+b.y}else if(["left","right"].includes(a.side)){const m=(a.x+b.x)/2+o;d='M '+a.x+' '+a.y+' L '+m+' '+a.y+' L '+m+' '+b.y+' L '+b.x+' '+b.y}else{const m=(a.y+b.y)/2+o;d='M '+a.x+' '+a.y+' L '+a.x+' '+m+' L '+b.x+' '+m+' L '+b.x+' '+b.y}return d}
function draw(){const defs='<defs>'+project.connections.map(c=>'<marker id="a-'+c.id+'" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="'+c.color+'"></path></marker><marker id="s-'+c.id+'" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth"><path d="M9,0 L9,6 L0,3 z" fill="'+c.color+'"></path></marker>').join('')+'</defs>';svg.innerHTML=defs+project.connections.map(c=>{const d=geometry(c);if(!d)return'';const dash=c.dash==="dashed"?"8 6":c.dash==="dotted"?"2 5":"none";return'<path d="'+d+'" fill="none" stroke="'+c.color+'" stroke-width="'+(Number(c.width)||2)+'" stroke-dasharray="'+dash+'" marker-start="'+(c.arrowStart?'url(#s-'+c.id+')':'none')+'" marker-end="'+(c.arrowEnd?'url(#a-'+c.id+')':'none')+'"></path>'}).join('')}
new ResizeObserver(draw).observe(stage);window.addEventListener("resize",draw);draw();
<\/script>
</body>
</html>`;
    downloadBlob(html, "exported-ui.html", "text/html;charset=utf-8");
    toast("Standalone HTML exported");
  }

  function saveJSON() {
    const pretty = JSON.stringify(JSON.parse(projectSnapshot()), null, 2);
    downloadBlob(pretty, "ui-builder-project.json", "application/json;charset=utf-8");
    toast("Project JSON saved");
  }

  function loadJSONFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.elements) || !Array.isArray(data.connections)) throw new Error("Invalid project format");
        state.canvas = { width: 1200, height: 800, grid: 10, snap: true, showGrid: true, ...(data.canvas || {}) };
        state.elements = data.elements;
        state.connections = data.connections;
        state.selectedKind = null; state.selectedId = null; state.connectMode = false; state.connectStart = null;
        renderAll(); commitHistory(); toast("Project loaded");
      } catch (error) { alert(`Could not load project: ${error.message}`); }
    };
    reader.readAsText(file);
  }

  let toastTimer;
  function toast(message) {
    clearTimeout(toastTimer);
    dom.toast.textContent = message;
    dom.toast.classList.add("show");
    toastTimer = setTimeout(() => dom.toast.classList.remove("show"), 1500);
  }

  function seedDemo() {
    const title = newElement("text", 80, 70); title.w = 340; title.props.label = "Customer onboarding"; title.props.fontSize = 28;
    const input = newElement("input", 80, 145); input.props.placeholder = "Email address";
    const button = newElement("button", 330, 145); button.props.label = "Continue";
    const progress = newElement("progress", 80, 220); progress.w = 390; progress.props.value = 38;
    const card = newElement("rectangle", 600, 95); card.w = 300; card.h = 190; card.props.fill = "#f8fafc"; card.props.radius = 18; card.props.shadowEnabled = true;
    state.elements.push(title, input, button, progress, card);
    state.connections.push({ id: uid("conn"), from: button.id, to: card.id, fromAnchor: "right", toAnchor: "left", route: "orthogonal", color: "#4f46e5", width: 2, dash: "solid", arrowStart: false, arrowEnd: true, offset: 0 });
  }

  dom.canvas.addEventListener("pointerdown", event => {
    if (event.target === dom.canvas || event.target === dom.connectionLayer) clearSelection();
  });
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  dom.workspace.addEventListener("dragover", event => {
    if (event.dataTransfer.types.includes("text/ui-component")) {
      event.preventDefault();
      dom.workspace.classList.add("drag-over");
    }
  });
  dom.workspace.addEventListener("dragleave", event => {
    if (!dom.workspace.contains(event.relatedTarget)) dom.workspace.classList.remove("drag-over");
  });
  dom.workspace.addEventListener("drop", event => {
    event.preventDefault();
    dom.workspace.classList.remove("drag-over");
    const type = event.dataTransfer.getData("text/ui-component");
    if (!type) return;
    const point = getCanvasPoint(event.clientX, event.clientY);
    const [w, h] = SIZE_DEFAULTS[type] || [140, 60];
    let x = point.x - w / 2, y = point.y - h / 2;
    if (state.canvas.snap) { x = Math.round(x / state.canvas.grid) * state.canvas.grid; y = Math.round(y / state.canvas.grid) * state.canvas.grid; }
    const el = newElement(type, x, y);
    state.elements.push(el); renderAll(); select("element", el.id); commitHistory();
  });

  dom.canvasResizeHandle.addEventListener("pointerdown", event => {
    event.preventDefault(); event.stopPropagation();
    state.interaction = { kind: "canvas-resize", startPoint: getCanvasPoint(event.clientX, event.clientY), start: { width: state.canvas.width, height: state.canvas.height } };
  });

  dom.connectBtn.addEventListener("click", () => {
    state.connectMode = !state.connectMode;
    state.connectStart = null;
    dom.connectBtn.classList.toggle("active", state.connectMode);
    updateSelectionClasses();
    toast(state.connectMode ? "Select the first element" : "Connect mode cancelled");
  });
  dom.undoBtn.addEventListener("click", undo);
  dom.redoBtn.addEventListener("click", redo);
  dom.duplicateBtn.addEventListener("click", duplicateSelection);
  dom.deleteBtn.addEventListener("click", deleteSelection);
  dom.exportBtn = document.getElementById("exportBtn");
  dom.exportBtn.addEventListener("click", exportProjectHTML);
  document.getElementById("saveJsonBtn").addEventListener("click", saveJSON);
  document.getElementById("loadJsonBtn").addEventListener("click", () => document.getElementById("loadJsonInput").click());
  document.getElementById("loadJsonInput").addEventListener("change", event => {
    if (event.target.files[0]) loadJSONFile(event.target.files[0]);
    event.target.value = "";
  });

  dom.snapBtn.addEventListener("click", () => { state.canvas.snap = !state.canvas.snap; applyCanvasSettings(); commitHistory(); });
  dom.toggleGridBtn.addEventListener("click", () => { state.canvas.showGrid = !state.canvas.showGrid; applyCanvasSettings(); commitHistory(); });
  dom.gridSize.addEventListener("change", () => { state.canvas.grid = clamp(Number(dom.gridSize.value) || 10, 2, 100); applyCanvasSettings(); commitHistory(); });
  dom.canvasWidth.addEventListener("change", () => setCanvasSize(dom.canvasWidth.value, state.canvas.height));
  dom.canvasHeight.addEventListener("change", () => setCanvasSize(state.canvas.width, dom.canvasHeight.value));

  window.addEventListener("keydown", event => {
    const tag = document.activeElement?.tagName;
    const editing = ["INPUT","TEXTAREA","SELECT"].includes(tag);
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "z") {
      event.preventDefault(); event.shiftKey ? redo() : undo(); return;
    }
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "d" && !editing) {
      event.preventDefault(); duplicateSelection(); return;
    }
    if (editing) return;
    if (event.key === "Delete" || event.key === "Backspace") { event.preventDefault(); deleteSelection(); return; }
    if (event.key === "Escape") {
      state.connectMode = false; state.connectStart = null; dom.connectBtn.classList.remove("active"); clearSelection(); return;
    }
    const el = selectedElement();
    if (el && ["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(event.key) && !el.props.locked) {
      event.preventDefault();
      const step = event.shiftKey ? 10 : 1;
      if (event.key === "ArrowLeft") el.x -= step;
      if (event.key === "ArrowRight") el.x += step;
      if (event.key === "ArrowUp") el.y -= step;
      if (event.key === "ArrowDown") el.y += step;
      el.x = clamp(el.x, 0, state.canvas.width - el.w); el.y = clamp(el.y, 0, state.canvas.height - el.h);
      updateElementNode(el); drawConnections(); renderProperties(); commitHistory();
    }
  });

  renderLibrary();
  seedDemo();
  renderAll();
  commitHistory();
})();
</script>
</body>
</html>
