<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini UI Builder</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --panel-bg: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --grid-size: 20px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: var(--bg);
            overflow: hidden;
            color: var(--text);
        }

        /* Layout */
        #sidebar, #properties {
            width: 260px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        #properties {
            border-right: none;
            border-left: 1px solid var(--border);
        }
        
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
            position: relative;
        }

        .header {
            padding: 15px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Sidebar Components */
        .component-list {
            padding: 10px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .component-item {
            padding: 15px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            cursor: grab;
            user-select: none;
            transition: border 0.2s;
        }
        .component-item:active { cursor: grabbing; }
        .component-item:hover { border-color: var(--primary); }

        /* Canvas */
        #canvas-wrapper {
            padding: 40px;
            min-height: 100%;
            min-width: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }

        #canvas {
            width: 800px;
            height: 600px;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            background-image: linear-gradient(to right, #e5e7eb 1px, transparent 1px),
                              linear-gradient(to bottom, #e5e7eb 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            transform-origin: top left;
        }

        #svg-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Let clicks pass through to elements */
            z-index: 1;
        }

        /* Canvas Elements */
        .canvas-element {
            position: absolute;
            box-sizing: border-box;
            cursor: move;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-element.selected {
            outline: 2px solid var(--primary);
            z-index: 10;
        }

        /* Handles */
        .resize-handle {
            position: absolute;
            width: 8px; height: 8px;
            background: white;
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: none;
        }
        .canvas-element.selected .resize-handle { display: block; }
        .handle-tl { top: -5px; left: -5px; cursor: nwse-resize; }
        .handle-tr { top: -5px; right: -5px; cursor: nesw-resize; }
        .handle-bl { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .handle-br { bottom: -5px; right: -5px; cursor: nwse-resize; }

        /* Properties Panel */
        .prop-group { padding: 15px; border-bottom: 1px solid var(--border); }
        .prop-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #6b7280; }
        .prop-group input, .prop-group select {
            width: 100%; padding: 6px; box-sizing: border-box;
            border: 1px solid var(--border); border-radius: 4px;
        }

        /* Buttons */
        .btn {
            background: var(--primary); color: white; border: none;
            padding: 8px 12px; border-radius: 4px; cursor: pointer;
            font-size: 13px; width: 100%; margin-top: 10px;
        }
        .btn:hover { background: #1d4ed8; }
        .btn-toggle { background: #fff; color: var(--text); border: 1px solid var(--border); }
        .btn-toggle.active { background: #e0e7ff; border-color: var(--primary); color: var(--primary); }

        /* Element defaults styles for internal rendering */
        .el-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); background: #ccc; width:100%; height:100%; }
        .el-content { width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">Components</div>
        <div class="component-list" id="component-list">
            <div class="component-item" draggable="true" data-type="button">Button</div>
            <div class="component-item" draggable="true" data-type="input">Input Text</div>
            <div class="component-item" draggable="true" data-type="checkbox">Checkbox</div>
            <div class="component-item" draggable="true" data-type="dropdown">Dropdown</div>
            <div class="component-item" draggable="true" data-type="slider">Slider</div>
            <div class="component-item" draggable="true" data-type="progress">Progress Bar</div>
            <div class="component-item" draggable="true" data-type="rectangle">Rectangle</div>
            <div class="component-item" draggable="true" data-type="circle">Circle</div>
            <div class="component-item" draggable="true" data-type="triangle">Triangle</div>
            <div class="component-item" draggable="true" data-type="text">Text Block</div>
        </div>
        <div style="padding: 15px; border-top: 1px solid var(--border);">
            <button id="btn-connect" class="btn btn-toggle">🔗 Connect Mode (Off)</button>
        </div>
    </div>

    <div id="workspace">
        <div class="header">
            <span>Canvas</span>
            <button class="btn" style="width: auto; margin:0;" onclick="exportHTML()">⬇ Export HTML</button>
        </div>
        <div id="canvas-wrapper">
            <div id="canvas">
                <svg id="svg-layer"></svg>
            </div>
        </div>
    </div>

    <div id="properties">
        <div class="header">Properties</div>
        <div id="props-empty" style="padding: 15px; font-size: 13px; color: #6b7280;">Select an element to edit properties.</div>
        <div id="props-panel" style="display: none;">
            <div class="prop-group">
                <label>Text Content</label>
                <input type="text" id="prop-text" oninput="updateElement()">
            </div>
            <div class="prop-group">
                <label>Dimensions (W x H)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="prop-w" oninput="updateElement()">
                    <input type="number" id="prop-h" oninput="updateElement()">
                </div>
            </div>
            <div class="prop-group">
                <label>Position (X, Y)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="prop-x" oninput="updateElement()">
                    <input type="number" id="prop-y" oninput="updateElement()">
                </div>
            </div>
            <div class="prop-group">
                <label>Border Radius (px)</label>
                <input type="number" id="prop-radius" oninput="updateElement()">
            </div>
            <div class="prop-group">
                <label>Box Shadow (CSS)</label>
                <input type="text" id="prop-shadow" placeholder="2px 2px 5px #000" oninput="updateElement()">
            </div>
            <div class="prop-group">
                <label>Background Color</label>
                <input type="color" id="prop-bg" oninput="updateElement()">
            </div>
            <div class="prop-group">
                <button class="btn" style="background:#dc2626;" onclick="deleteSelected()">Delete Element</button>
            </div>
        </div>
    </div>

<script>
    // --- State & Variables ---
    const canvas = document.getElementById('canvas');
    const svgLayer = document.getElementById('svg-layer');
    const gridSize = 20;
    
    let elementIdCounter = 0;
    let selectedElement = null;
    let elementsData = {}; // Stores properties: { id: { type, connections: [] } }
    let connections = []; // Array of { from: id, to: id }

    // Modes: 'select' or 'connect'
    let currentMode = 'select';
    let connectSource = null;

    // Interaction State
    let isDragging = false;
    let isResizing = false;
    let currentHandle = null;
    let startX, startY, startLeft, startTop, startW, startH;

    // --- Drag and Drop (Sidebar to Canvas) ---
    document.querySelectorAll('.component-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
            e.dataTransfer.setData('type', e.target.getAttribute('data-type'));
        });
    });

    canvas.addEventListener('dragover', (e) => {
        e.preventDefault(); // allow drop
    });

    canvas.addEventListener('drop', (e) => {
        e.preventDefault();
        const type = e.dataTransfer.getData('type');
        if (!type) return;

        const rect = canvas.getBoundingClientRect();
        // Snap drop position to grid
        const x = snap(e.clientX - rect.left);
        const y = snap(e.clientY - rect.top);

        createElement(type, x, y);
    });

    function snap(value) {
        return Math.round(value / gridSize) * gridSize;
    }

    // --- Element Creation ---
    function createElement(type, x, y) {
        const id = 'el_' + elementIdCounter++;
        const el = document.createElement('div');
        el.className = 'canvas-element';
        el.id = id;
        
        // Defaults
        let w = 100, h = 40, content = '';

        switch(type) {
            case 'button': content = '<button class="el-content" style="width:100%; height:100%;">Button</button>'; break;
            case 'input': content = '<input class="el-content" type="text" placeholder="Input..." style="width:100%; height:100%; box-sizing:border-box;">'; break;
            case 'checkbox': w=20; h=20; content = '<input class="el-content" type="checkbox" style="width:100%; height:100%;">'; break;
            case 'dropdown': content = '<select class="el-content" style="width:100%; height:100%;"><option>Option 1</option></select>'; break;
            case 'slider': content = '<input class="el-content" type="range" style="width:100%; height:100%;">'; break;
            case 'progress': content = '<progress class="el-content" value="50" max="100" style="width:100%; height:100%;"></progress>'; break;
            case 'rectangle': content = '<div class="el-content" style="background:#3b82f6; width:100%; height:100%;"></div>'; break;
            case 'circle': w=80; h=80; content = '<div class="el-content" style="background:#ef4444; width:100%; height:100%; border-radius:50%;"></div>'; break;
            case 'triangle': w=80; h=80; content = '<div class="el-content el-triangle"></div>'; break;
            case 'text': w=120; content = '<div class="el-content" style="display:flex; align-items:center;">Text Block</div>'; break;
        }

        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        
        // Add content and resize handles
        el.innerHTML = content + `
            <div class="resize-handle handle-tl" data-handle="tl"></div>
            <div class="resize-handle handle-tr" data-handle="tr"></div>
            <div class="resize-handle handle-bl" data-handle="bl"></div>
            <div class="resize-handle handle-br" data-handle="br"></div>
        `;

        elementsData[id] = { type };
        canvas.appendChild(el);
        
        selectElement(el);
        drawConnections();
    }

    // --- Interaction (Select, Drag, Resize, Connect) ---
    canvas.addEventListener('mousedown', (e) => {
        const handle = e.target.closest('.resize-handle');
        const element = e.target.closest('.canvas-element');

        // Click on empty canvas
        if (!element && !handle) {
            deselectAll();
            connectSource = null;
            return;
        }

        if (currentMode === 'connect') {
            if (element) handleConnectLogic(element);
            return; // Prevent dragging while connecting
        }

        if (handle) {
            isResizing = true;
            currentHandle = handle.dataset.handle;
            selectedElement = element;
        } else if (element) {
            isDragging = true;
            selectElement(element);
        }

        startX = e.clientX;
        startY = e.clientY;
        startLeft = parseInt(selectedElement.style.left) || 0;
        startTop = parseInt(selectedElement.style.top) || 0;
        startW = parseInt(selectedElement.style.width) || 0;
        startH = parseInt(selectedElement.style.height) || 0;
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging && !isResizing) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        if (isDragging) {
            // Snap to grid
            selectedElement.style.left = snap(startLeft + dx) + 'px';
            selectedElement.style.top = snap(startTop + dy) + 'px';
        } else if (isResizing) {
            let newW = startW, newH = startH, newLeft = startLeft, newTop = startTop;

            if (currentHandle.includes('r')) newW = snap(startW + dx);
            if (currentHandle.includes('l')) {
                newW = snap(startW - dx);
                newLeft = snap(startLeft + dx);
            }
            if (currentHandle.includes('b')) newH = snap(startH + dy);
            if (currentHandle.includes('t')) {
                newH = snap(startH - dy);
                newTop = snap(startTop + dy);
            }

            // Minimum dimensions
            if (newW >= 20) {
                selectedElement.style.width = newW + 'px';
                selectedElement.style.left = newLeft + 'px';
            }
            if (newH >= 20) {
                selectedElement.style.height = newH + 'px';
                selectedElement.style.top = newTop + 'px';
            }
        }
        
        drawConnections();
        updatePropertiesPanel(); // live update properties
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        isResizing = false;
        currentHandle = null;
    });

    // --- Selection & Properties ---
    function selectElement(el) {
        deselectAll();
        selectedElement = el;
        el.classList.add('selected');
        
        document.getElementById('props-empty').style.display = 'none';
        document.getElementById('props-panel').style.display = 'block';
        updatePropertiesPanel();
    }

    function deselectAll() {
        document.querySelectorAll('.canvas-element').forEach(el => el.classList.remove('selected'));
        selectedElement = null;
        document.getElementById('props-empty').style.display = 'block';
        document.getElementById('props-panel').style.display = 'none';
    }

    function updatePropertiesPanel() {
        if (!selectedElement) return;
        
        document.getElementById('prop-w').value = parseInt(selectedElement.style.width);
        document.getElementById('prop-h').value = parseInt(selectedElement.style.height);
        document.getElementById('prop-x').value = parseInt(selectedElement.style.left);
        document.getElementById('prop-y').value = parseInt(selectedElement.style.top);
        
        const innerEl = selectedElement.querySelector('.el-content');
        document.getElementById('prop-text').value = innerEl.innerText || innerEl.value || '';
        document.getElementById('prop-radius').value = parseInt(innerEl.style.borderRadius) || 0;
        document.getElementById('prop-shadow').value = innerEl.style.boxShadow || '';
    }

    function updateElement() {
        if (!selectedElement) return;

        selectedElement.style.width = document.getElementById('prop-w').value + 'px';
        selectedElement.style.height = document.getElementById('prop-h').value + 'px';
        selectedElement.style.left = document.getElementById('prop-x').value + 'px';
        selectedElement.style.top = document.getElementById('prop-y').value + 'px';

        const innerEl = selectedElement.querySelector('.el-content');
        if (innerEl.tagName === 'INPUT' || innerEl.tagName === 'BUTTON') {
            innerEl.value = document.getElementById('prop-text').value;
            innerEl.innerText = document.getElementById('prop-text').value;
        } else {
            innerEl.innerText = document.getElementById('prop-text').value;
        }

        innerEl.style.borderRadius = document.getElementById('prop-radius').value + 'px';
        innerEl.style.boxShadow = document.getElementById('prop-shadow').value;
        
        const bgColor = document.getElementById('prop-bg').value;
        if (bgColor) innerEl.style.backgroundColor = bgColor;

        drawConnections();
    }

    function deleteSelected() {
        if (selectedElement) {
            const id = selectedElement.id;
            selectedElement.remove();
            selectedElement = null;
            delete elementsData[id];
            // Remove linked connections
            connections = connections.filter(c => c.from !== id && c.to !== id);
            deselectAll();
            drawConnections();
        }
    }

    // --- Flowcharting / Connections ---
    const btnConnect = document.getElementById('btn-connect');
    btnConnect.addEventListener('click', () => {
        if (currentMode === 'select') {
            currentMode = 'connect';
            btnConnect.classList.add('active');
            btnConnect.innerText = '🔗 Connect Mode (On)';
            deselectAll();
            canvas.style.cursor = 'crosshair';
        } else {
            currentMode = 'select';
            btnConnect.classList.remove('active');
            btnConnect.innerText = '🔗 Connect Mode (Off)';
            connectSource = null;
            canvas.style.cursor = 'default';
        }
    });

    function handleConnectLogic(element) {
        if (!connectSource) {
            connectSource = element;
            element.classList.add('selected'); // visual cue
        } else {
            if (connectSource.id !== element.id) {
                // Prevent duplicate connections
                const exists = connections.find(c => c.from === connectSource.id && c.to === element.id);
                if (!exists) {
                    connections.push({ from: connectSource.id, to: element.id });
                }
            }
            connectSource.classList.remove('selected');
            connectSource = null;
            drawConnections();
        }
    }

    function drawConnections() {
        svgLayer.innerHTML = ''; // Clear existing lines
        
        connections.forEach(conn => {
            const fromEl = document.getElementById(conn.from);
            const toEl = document.getElementById(conn.to);
            if (!fromEl || !toEl) return;

            // Calculate center points
            const fRect = { 
                x: parseInt(fromEl.style.left) + parseInt(fromEl.style.width) / 2, 
                y: parseInt(fromEl.style.top) + parseInt(fromEl.style.height) / 2 
            };
            const tRect = { 
                x: parseInt(toEl.style.left) + parseInt(toEl.style.width) / 2, 
                y: parseInt(toEl.style.top) + parseInt(toEl.style.height) / 2 
            };

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            // Draw an elbow curve or straight line. Let's do a curved bezier for aesthetics
            const d = `M ${fRect.x} ${fRect.y} C ${fRect.x + 50} ${fRect.y}, ${tRect.x - 50} ${tRect.y}, ${tRect.x} ${tRect.y}`;
            
            path.setAttribute('d', d);
            path.setAttribute('stroke', '#6b7280');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            
            svgLayer.appendChild(path);
        });
    }

    // --- Export Logic ---
    function exportHTML() {
        // Clone the canvas
        const exportCanvas = canvas.cloneNode(true);
        
        // Cleanup editor specific UI
        exportCanvas.style.backgroundImage = 'none'; // remove grid
        exportCanvas.querySelectorAll('.resize-handle').forEach(h => h.remove());
        exportCanvas.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
        
        // Remove 'canvas-element' class interactive properties in exported css
        exportCanvas.querySelectorAll('.canvas-element').forEach(el => {
            el.style.cursor = 'default';
        });

        // Build the final HTML string
        const finalHTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exported UI</title>
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; background: #fff; }
        #canvas { position: relative; width: ${canvas.style.width}; height: ${canvas.style.height}; }
        .canvas-element { position: absolute; box-sizing: border-box; display: flex; align-items: center; justify-content: center;}
        .el-content { width: 100%; height: 100%; box-sizing: border-box; pointer-events: auto !important; }
        .el-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    </style>
</head>
<body>
    ${exportCanvas.outerHTML}
</body>
</html>`;

        // Create blob and trigger download
        const blob = new Blob([finalHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'my-ui-export.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }
</script>
</body>
</html>
