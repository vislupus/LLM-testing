<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standalone UI Builder</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-medium: #2d2d2d;
            --bg-light: #3c3c3c;
            --text-primary: #d4d4d4;
            --text-secondary: #a0a0a0;
            --accent-primary: #0e639c;
            --accent-secondary: #17a2b8;
            --border-color: #4a4a4a;
            --guide-color: #f44336;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Global & Layout --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-family);
            font-size: 13px;
        }

        .builder-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* --- Left Panel: Component Library --- */
        #component-library {
            width: 220px;
            background-color: var(--bg-medium);
            border-right: 1px solid var(--border-color);
            padding: 10px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #component-library h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin: 15px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .component-item {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s;
        }
        .component-item:hover { background-color: #4a4a4a; }
        .component-item svg { fill: var(--text-primary); width: 16px; height: 16px; }

        /* --- Center Panel: Workspace --- */
        #workspace-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        
        #top-bar {
            height: 40px;
            background: var(--bg-medium);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 20px;
            flex-shrink: 0;
        }
        
        #top-bar label { margin-right: 5px; color: var(--text-secondary); }
        #top-bar input[type="number"] {
            width: 60px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px;
            border-radius: 3px;
        }
        #top-bar button {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        #top-bar button:hover { background: #127dc7; }
        .mode-toggle { display: flex; align-items: center; gap: 5px; }

        #canvas-wrapper {
            flex-grow: 1;
            padding: 20px;
            overflow: auto;
            background-color: var(--bg-dark);
        }

        #canvas {
            position: relative;
            background-color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            background-image:
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
        }
        
        #connector-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: visible;
        }

        .canvas-element {
            position: absolute;
            box-sizing: border-box;
            cursor: move;
            border: 1px solid transparent;
        }
        .canvas-element.selected { border: 1px dashed var(--accent-primary); }

        /* Shapes */
        .shape-triangle {
            width: 0; height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid black;
            background: none !important;
        }
        .shape-line {
            height: 2px;
            background-color: black;
        }

        /* --- Element Interaction --- */
        .resize-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border: 1px solid var(--accent-primary);
            border-radius: 50%;
        }
        .resize-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .resize-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .resize-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .resize-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
        
        .alignment-guide {
            position: absolute;
            background-color: var(--guide-color);
            z-index: 9999;
        }
        .alignment-guide.horizontal { width: 100%; height: 1px; }
        .alignment-guide.vertical { height: 100%; width: 1px; }
        
        .connector-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-secondary);
            border: 1px solid white;
            cursor: crosshair;
            display: none;
        }
        .canvas-element:hover .connector-handle { display: block; }
        .connector-handle.top { top: -6px; left: 50%; transform: translateX(-50%); }
        .connector-handle.bottom { bottom: -6px; left: 50%; transform: translateX(-50%); }
        .connector-handle.left { left: -6px; top: 50%; transform: translateY(-50%); }
        .connector-handle.right { right: -6px; top: 50%; transform: translateY(-50%); }


        /* --- Right Panel: Properties --- */
        #properties-panel {
            width: 260px;
            background-color: var(--bg-medium);
            border-left: 1px solid var(--border-color);
            padding: 10px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        #properties-panel h3 {
            font-size: 14px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin: 15px 0 10px 0;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .prop-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        .prop-item {
            display: flex;
            flex-direction: column;
        }

        .prop-item label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .prop-item input, .prop-item select {
            width: 100%;
            box-sizing: border-box;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 5px;
            border-radius: 3px;
        }
        .prop-item input[type=color] { padding: 0; height: 28px; }
        .prop-item.full-width { grid-column: 1 / -1; }
        
        #no-selection-message { text-align: center; color: var(--text-secondary); margin-top: 50px; }
    </style>
</head>
<body>

    <div class="builder-container">
        <!-- Component Library -->
        <aside id="component-library">
            <!-- Items will be populated by JS -->
        </aside>

        <!-- Main Workspace -->
        <main id="workspace-container">
            <div id="top-bar">
                <div class="mode-toggle">
                     <label>Mode:</label>
                     <button id="mode-select-btn">Select</button>
                     <button id="mode-connect-btn">Connect</button>
                </div>
                <div class="canvas-size-controls">
                    <label for="canvas-width">W:</label>
                    <input type="number" id="canvas-width" value="1200">
                    <label for="canvas-height">H:</label>
                    <input type="number" id="canvas-height" value="800">
                </div>
                <div class="grid-controls">
                    <label for="grid-size">Grid:</label>
                    <input type="number" id="grid-size" value="10" min="0" step="5">
                </div>
                <button id="export-html-btn">Export to HTML</button>
            </div>
            <div id="canvas-wrapper">
                <div id="canvas">
                    <svg id="connector-svg"></svg>
                </div>
            </div>
        </main>

        <!-- Properties Panel -->
        <aside id="properties-panel">
            <div id="no-selection-message">
                <p>Select an element to see its properties.</p>
            </div>
            <div id="props-container" style="display: none;">
                <h3>Transform</h3>
                <div class="prop-group">
                    <div class="prop-item"><label for="prop-x">X</label><input type="number" id="prop-x" data-prop="x"></div>
                    <div class="prop-item"><label for="prop-y">Y</label><input type="number" id="prop-y" data-prop="y"></div>
                    <div class="prop-item"><label for="prop-width">Width</label><input type="number" id="prop-width" data-prop="width"></div>
                    <div class="prop-item"><label for="prop-height">Height</label><input type="number" id="prop-height" data-prop="height"></div>
                </div>

                <h3>Appearance</h3>
                <div class="prop-group">
                    <div class="prop-item"><label for="prop-bg-color">Fill</label><input type="color" id="prop-bg-color" data-style-prop="backgroundColor"></div>
                    <div class="prop-item"><label for="prop-text-color">Color</label><input type="color" id="prop-text-color" data-style-prop="color"></div>
                    <div class="prop-item full-width"><label for="prop-border-radius">Border Radius</label><input type="number" id="prop-border-radius" data-style-prop="borderRadius" min="0"></div>
                </div>

                <h3>Shadow</h3>
                <div class="prop-group">
                    <div class="prop-item"><label for="prop-shadow-x">X</label><input type="number" id="prop-shadow-x" data-shadow-prop="x" value="0"></div>
                    <div class="prop-item"><label for="prop-shadow-y">Y</label><input type="number" id="prop-shadow-y" data-shadow-prop="y" value="0"></div>
                    <div class="prop-item"><label for="prop-shadow-blur">Blur</label><input type="number" id="prop-shadow-blur" data-shadow-prop="blur" value="0" min="0"></div>
                    <div class="prop-item"><label for="prop-shadow-color">Color</label><input type="color" id="prop-shadow-color" data-shadow-prop="color" value="#000000"></div>
                </div>
                
                 <h3>Content</h3>
                <div class="prop-group">
                    <div class="prop-item full-width" id="prop-text-container"><label for="prop-text">Text</label><input type="text" id="prop-text" data-prop="text"></div>
                </div>

            </div>
        </aside>
    </div>

<script>
class UIBuilder {
    constructor() {
        // --- STATE ---
        this.elements = [];
        this.connections = [];
        this.selectedElementId = null;
        this.gridSize = 10;
        this.canvasWidth = 1200;
        this.canvasHeight = 800;
        this.mode = 'select'; // 'select' or 'connect'
        
        // --- DRAG/RESIZE STATE ---
        this.isDragging = false;
        this.isResizing = false;
        this.isConnecting = false;
        this.draggedElement = null;
        this.resizeHandle = null;
        this.startPos = { x: 0, y: 0 };
        this.startElementPos = { x: 0, y: 0 };
        this.startElementSize = { width: 0, height: 0 };
        this.tempConnectionLine = null;
        
        // --- DOM Elements ---
        this.componentLibrary = document.getElementById('component-library');
        this.canvas = document.getElementById('canvas');
        this.connectorSvg = document.getElementById('connector-svg');
        this.propertiesPanel = document.getElementById('properties-panel');
        this.propsContainer = document.getElementById('props-container');
        this.noSelectionMsg = document.getElementById('no-selection-message');
        
        // --- Init ---
        this.initComponentLibrary();
        this.initCanvasSize();
        this.initEventListeners();
        this.renderCanvas();
    }

    // --- INITIALIZATION ---
    initComponentLibrary() {
        const components = {
            'UI Components': [
                { type: 'button', label: 'Button', icon: '<svg viewBox="0 0 24 24"><path d="M4 7v10h16V7H4zm15 9H5V8h14v8z"/></svg>' },
                { type: 'input', label: 'Input', icon: '<svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm-1 14H5V7h14v11z"/></svg>' },
                { type: 'textarea', label: 'Text Field', icon: '<svg viewBox="0 0 24 24"><path d="M20 3H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-1 16H5V5h14v14zM7 7h10v2H7V7zm10 4H7v2h10v-2zm-3 4H7v2h7v-2z"/></svg>' },
                { type: 'checkbox', label: 'Checkbox', icon: '<svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>' },
                { type: 'dropdown', label: 'Dropdown', icon: '<svg viewBox="0 0 24 24"><path d="M20 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zm-1 10H5V8h14v8zm-5-3l-3 4-3-4h6z"/></svg>' },
                { type: 'slider', label: 'Slider', icon: '<svg viewBox="0 0 24 24"><path d="M17 11H3v2h14v-2zm4-2v6h-2V9h2zM3 15h14v2H3v-2zM21 7v10h-2V7h2z"/></svg>' },
                { type: 'progressbar', label: 'Progress Bar', icon: '<svg viewBox="0 0 24 24"><path d="M4 11h16v2H4zM4 11a1 1 0 0 1 0-2h8a1 1 0 0 1 0 2H4z"/></svg>' },
                { type: 'stepper', label: 'Stepper', icon: '<svg viewBox="0 0 24 24"><path d="M15 6.001L9 12l6 5.999V6.001zm-2 0H5v12h8V6.001z"/></svg>' },
            ],
            'Shapes': [
                { type: 'rectangle', label: 'Rectangle', icon: '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>' },
                { type: 'circle', label: 'Circle', icon: '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>' },
                { type: 'triangle', label: 'Triangle', icon: '<svg viewBox="0 0 24 24"><path d="M12 2L1 21h22L12 2z"/></svg>' },
                { type: 'line', label: 'Line', icon: '<svg viewBox="0 0 24 24"><path d="M3 11h18v2H3z"/></svg>' },
            ]
        };

        for (const category in components) {
            const header = document.createElement('h3');
            header.textContent = category;
            this.componentLibrary.appendChild(header);

            components[category].forEach(comp => {
                const item = document.createElement('div');
                item.className = 'component-item';
                item.draggable = true;
                item.dataset.type = comp.type;
                item.innerHTML = `${comp.icon}<span>${comp.label}</span>`;
                this.componentLibrary.appendChild(item);
            });
        }
    }

    initCanvasSize() {
        this.canvas.style.width = `${this.canvasWidth}px`;
        this.canvas.style.height = `${this.canvasHeight}px`;
        this.canvas.style.backgroundSize = `${this.gridSize}px ${this.gridSize}px`;
        document.getElementById('canvas-width').value = this.canvasWidth;
        document.getElementById('canvas-height').value = this.canvasHeight;
        document.getElementById('grid-size').value = this.gridSize;
    }
    
    // --- EVENT LISTENERS ---
    initEventListeners() {
        // --- Drag from library ---
        this.componentLibrary.addEventListener('dragstart', (e) => {
            if (e.target.classList.contains('component-item')) {
                e.dataTransfer.setData('text/plain', e.target.dataset.type);
            }
        });
        
        this.canvas.addEventListener('dragover', (e) => e.preventDefault());
        this.canvas.addEventListener('drop', this.handleDrop.bind(this));

        // --- Drag, Resize, Select on Canvas ---
        this.canvas.addEventListener('mousedown', this.handleCanvasMouseDown.bind(this));
        document.addEventListener('mousemove', this.handleDocumentMouseMove.bind(this));
        document.addEventListener('mouseup', this.handleDocumentMouseUp.bind(this));
        document.addEventListener('keydown', this.handleKeyDown.bind(this));

        // --- Top Bar Controls ---
        document.getElementById('canvas-width').addEventListener('change', (e) => { this.canvasWidth = e.target.value; this.initCanvasSize(); });
        document.getElementById('canvas-height').addEventListener('change', (e) => { this.canvasHeight = e.target.value; this.initCanvasSize(); });
        document.getElementById('grid-size').addEventListener('change', (e) => { this.gridSize = parseInt(e.target.value) || 0; this.initCanvasSize(); });
        document.getElementById('export-html-btn').addEventListener('click', this.exportToHTML.bind(this));
        document.getElementById('mode-select-btn').addEventListener('click', () => this.setMode('select'));
        document.getElementById('mode-connect-btn').addEventListener('click', () => this.setMode('connect'));

        // --- Properties Panel ---
        this.propertiesPanel.addEventListener('input', this.handlePropertyChange.bind(this));
    }
    
    // --- CORE LOGIC ---
    setMode(mode) {
        this.mode = mode;
        this.canvas.style.cursor = mode === 'connect' ? 'crosshair' : 'default';
        document.getElementById('mode-select-btn').style.backgroundColor = mode === 'select' ? 'var(--accent-primary)' : 'var(--bg-light)';
        document.getElementById('mode-connect-btn').style.backgroundColor = mode === 'connect' ? 'var(--accent-primary)' : 'var(--bg-light)';
        this.deselectElement();
    }

    handleDrop(e) {
        e.preventDefault();
        const type = e.dataTransfer.getData('text/plain');
        const rect = this.canvas.getBoundingClientRect();
        const x = this.snapToGrid(e.clientX - rect.left);
        const y = this.snapToGrid(e.clientY - rect.top);
        this.addElement(type, x, y);
    }

    handleCanvasMouseDown(e) {
        const target = e.target.closest('.canvas-element, .resize-handle, .connector-handle');
        if (!target) {
            this.deselectElement();
            return;
        }

        e.stopPropagation();

        if (this.mode === 'select') {
            if (target.classList.contains('canvas-element')) {
                this.isDragging = true;
                this.draggedElement = this.elements.find(el => el.id === target.dataset.id);
                this.selectElement(this.draggedElement.id);
            } else if (target.classList.contains('resize-handle')) {
                this.isResizing = true;
                this.resizeHandle = target.dataset.handle;
                this.draggedElement = this.elements.find(el => el.id === target.parentElement.dataset.id);
            }
            
             if (this.isDragging || this.isResizing) {
                this.startPos = { x: e.clientX, y: e.clientY };
                this.startElementPos = { x: this.draggedElement.x, y: this.draggedElement.y };
                this.startElementSize = { width: this.draggedElement.width, height: this.draggedElement.height };
            }
            
        } else if (this.mode === 'connect' && target.classList.contains('connector-handle')) {
            this.isConnecting = true;
            this.startElementId = target.parentElement.dataset.id;
            this.startHandlePosition = target.dataset.pos;
            
            this.tempConnectionLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            this.tempConnectionLine.setAttribute('stroke', 'var(--accent-secondary)');
            this.tempConnectionLine.setAttribute('stroke-width', '2');
            this.tempConnectionLine.setAttribute('stroke-dasharray', '5,5');
            this.connectorSvg.appendChild(this.tempConnectionLine);
            
            const startCoords = this.getHandleCoords(this.startElementId, this.startHandlePosition);
            this.tempConnectionLine.setAttribute('x1', startCoords.x);
            this.tempConnectionLine.setAttribute('y1', startCoords.y);
            this.tempConnectionLine.setAttribute('x2', startCoords.x);
            this.tempConnectionLine.setAttribute('y2', startCoords.y);
        }
    }

    handleDocumentMouseMove(e) {
        this.clearAlignmentGuides();
        if (this.isDragging && this.draggedElement) {
            const dx = e.clientX - this.startPos.x;
            const dy = e.clientY - this.startPos.y;
            let newX = this.startElementPos.x + dx;
            let newY = this.startElementPos.y + dy;
            
            // Smart guides and snapping
            const snapResult = this.getSnapPosition(this.draggedElement, newX, newY);
            newX = this.snapToGrid(snapResult.x);
            newY = this.snapToGrid(snapResult.y);
            
            this.draggedElement.x = newX;
            this.draggedElement.y = newY;
            this.updateElementInDOM(this.draggedElement);
            this.updatePropertiesPanel();
            this.renderConnectors();
        } else if (this.isResizing && this.draggedElement) {
            this.handleResize(e);
            this.renderConnectors();
        } else if (this.isConnecting) {
             const rect = this.canvas.getBoundingClientRect();
             const x = e.clientX - rect.left;
             const y = e.clientY - rect.top;
             this.tempConnectionLine.setAttribute('x2', x);
             this.tempConnectionLine.setAttribute('y2', y);
        }
    }

    handleDocumentMouseUp(e) {
        this.clearAlignmentGuides();
        if (this.isConnecting) {
            const endTarget = e.target.closest('.connector-handle');
            if (endTarget && endTarget.parentElement.dataset.id !== this.startElementId) {
                this.addConnection({
                    fromId: this.startElementId,
                    fromHandle: this.startHandlePosition,
                    toId: endTarget.parentElement.dataset.id,
                    toHandle: endTarget.dataset.pos,
                });
            }
            this.connectorSvg.removeChild(this.tempConnectionLine);
            this.tempConnectionLine = null;
        }
        
        this.isDragging = false;
        this.isResizing = false;
        this.isConnecting = false;
        this.draggedElement = null;
    }
    
    handleKeyDown(e) {
        if (this.selectedElementId) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                e.preventDefault();
                this.deleteElement(this.selectedElementId);
            }
        }
    }
    
    handlePropertyChange(e) {
        if (!this.selectedElementId) return;
        const input = e.target;
        const element = this.elements.find(el => el.id === this.selectedElementId);
        
        if (input.dataset.prop) {
            const prop = input.dataset.prop;
            element[prop] = input.type === 'number' ? parseFloat(input.value) : input.value;
        } else if (input.dataset.styleProp) {
            const prop = input.dataset.styleProp;
            element.style[prop] = input.value;
        } else if (input.dataset.shadowProp) {
            const prop = input.dataset.shadowProp;
            element.style.boxShadow[prop] = input.type === 'number' ? parseFloat(input.value) : input.value;
            this.updateElementShadow(element);
        }
        this.updateElementInDOM(element);
        this.renderConnectors();
    }
    
    handleResize(e) {
        const dx = e.clientX - this.startPos.x;
        const dy = e.clientY - this.startPos.y;
        
        let newX = this.startElementPos.x;
        let newY = this.startElementPos.y;
        let newW = this.startElementSize.width;
        let newH = this.startElementSize.height;

        if (this.resizeHandle.includes('e')) newW = this.snapToGrid(this.startElementSize.width + dx);
        if (this.resizeHandle.includes('w')) {
            newW = this.snapToGrid(this.startElementSize.width - dx);
            newX = this.snapToGrid(this.startElementPos.x + dx);
        }
        if (this.resizeHandle.includes('s')) newH = this.snapToGrid(this.startElementSize.height + dy);
        if (this.resizeHandle.includes('n')) {
            newH = this.snapToGrid(this.startElementSize.height - dy);
            newY = this.snapToGrid(this.startElementPos.y + dy);
        }
        
        this.draggedElement.x = newX;
        this.draggedElement.y = newY;
        this.draggedElement.width = Math.max(20, newW);
        this.draggedElement.height = Math.max(20, newH);
        
        this.updateElementInDOM(this.draggedElement);
        this.updatePropertiesPanel();
    }
    
    // --- ELEMENT MANAGEMENT ---
    addElement(type, x, y) {
        const id = 'el_' + Date.now();
        const newElement = {
            id,
            type,
            x,
            y,
            width: 150,
            height: 40,
            text: 'Button',
            style: {
                backgroundColor: '#0e639c',
                color: '#ffffff',
                borderRadius: '4',
                boxShadow: { x: 0, y: 0, blur: 0, color: '#000000' }
            }
        };

        // Adjust defaults based on type
        switch(type) {
            case 'rectangle': newElement.text = ''; newElement.style.backgroundColor = '#d9d9d9'; break;
            case 'circle': newElement.text = ''; newElement.width = 100; newElement.height = 100; newElement.style.backgroundColor = '#d9d9d9'; newElement.style.borderRadius = '50'; break;
            case 'input': newElement.text = ''; newElement.style.backgroundColor = '#ffffff'; newElement.style.color = '#000000'; break;
            case 'textarea': newElement.text = ''; newElement.style.backgroundColor = '#ffffff'; newElement.style.color = '#000000'; newElement.height = 80; break;
            case 'triangle': newElement.text=''; newElement.width=100; newElement.height=100; newElement.style.backgroundColor='transparent'; break;
            case 'line': newElement.text=''; newElement.height=2; newElement.style.backgroundColor='#000000'; break;
        }

        this.elements.push(newElement);
        this.renderCanvas();
        this.selectElement(id);
    }
    
    deleteElement(id) {
        this.elements = this.elements.filter(el => el.id !== id);
        // Also remove connections associated with this element
        this.connections = this.connections.filter(c => c.fromId !== id && c.toId !== id);
        
        if (this.selectedElementId === id) {
            this.deselectElement();
        }
        this.renderCanvas();
    }

    // --- SELECTION & GUIDES ---
    selectElement(id) {
        this.selectedElementId = id;
        this.renderCanvas(); // Re-render to show selection and handles
        this.updatePropertiesPanel();
    }

    deselectElement() {
        this.selectedElementId = null;
        this.renderCanvas();
        this.updatePropertiesPanel();
    }
    
    getSnapPosition(element, newX, newY) {
        const SNAP_THRESHOLD = 5;
        let snapX = newX, snapY = newY;
        
        const elBounds = {
            left: newX, right: newX + element.width,
            top: newY, bottom: newY + element.height,
            hCenter: newX + element.width / 2,
            vCenter: newY + element.height / 2
        };
        
        this.elements.forEach(other => {
            if (other.id === element.id) return;
            
            const otherBounds = {
                left: other.x, right: other.x + other.width,
                top: other.y, bottom: other.y + other.height,
                hCenter: other.x + other.width / 2,
                vCenter: other.y + other.height / 2
            };

            const checks = [
                // X-axis checks
                { from: elBounds.left, to: otherBounds.left, axis: 'x' },
                { from: elBounds.left, to: otherBounds.right, axis: 'x' },
                { from: elBounds.right, to: otherBounds.left, axis: 'x' },
                { from: elBounds.right, to: otherBounds.right, axis: 'x' },
                { from: elBounds.hCenter, to: otherBounds.hCenter, axis: 'x' },
                // Y-axis checks
                { from: elBounds.top, to: otherBounds.top, axis: 'y' },
                { from: elBounds.top, to: otherBounds.bottom, axis: 'y' },
                { from: elBounds.bottom, to: otherBounds.top, axis: 'y' },
                { from: elBounds.bottom, to: otherBounds.bottom, axis: 'y' },
                { from: elBounds.vCenter, to: otherBounds.vCenter, axis: 'y' },
            ];

            checks.forEach(check => {
                if (Math.abs(check.from - check.to) < SNAP_THRESHOLD) {
                    if (check.axis === 'x') {
                        snapX = newX - (check.from - check.to);
                        this.showAlignmentGuide(check.to, 'vertical');
                    } else {
                        snapY = newY - (check.from - check.to);
                        this.showAlignmentGuide(check.to, 'horizontal');
                    }
                }
            });
        });

        return { x: snapX, y: snapY };
    }
    
    showAlignmentGuide(pos, orientation) {
        const guide = document.createElement('div');
        guide.className = `alignment-guide ${orientation}`;
        if (orientation === 'vertical') {
            guide.style.left = `${pos}px`;
        } else {
            guide.style.top = `${pos}px`;
        }
        this.canvas.appendChild(guide);
    }

    clearAlignmentGuides() {
        this.canvas.querySelectorAll('.alignment-guide').forEach(guide => guide.remove());
    }


    // --- RENDERING ---
    renderCanvas() {
        this.canvas.innerHTML = ''; // Clear canvas
        
        // Re-add SVG layer
        this.connectorSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        this.connectorSvg.id = 'connector-svg';
        this.canvas.appendChild(this.connectorSvg);

        this.elements.forEach(el => {
            const elDom = this.createElementInDOM(el);
            this.canvas.appendChild(elDom);

            if (el.id === this.selectedElementId && this.mode === 'select') {
                this.addResizeHandles(elDom);
            }
            if (this.mode === 'connect') {
                this.addConnectorHandles(elDom);
            }
        });
        this.renderConnectors();
    }
    
    createElementInDOM(element) {
        const elDom = document.createElement('div');
        elDom.className = `canvas-element type-${element.type}`;
        if (element.id === this.selectedElementId) elDom.classList.add('selected');
        elDom.dataset.id = element.id;
        
        this.updateElementInDOM(element, elDom);
        return elDom;
    }
    
    updateElementInDOM(element, elDom = null) {
        if (!elDom) elDom = this.canvas.querySelector(`[data-id="${element.id}"]`);
        if (!elDom) return;
        
        elDom.style.left = `${element.x}px`;
        elDom.style.top = `${element.y}px`;
        elDom.style.width = `${element.width}px`;
        elDom.style.height = `${element.height}px`;

        elDom.style.backgroundColor = element.style.backgroundColor;
        elDom.style.color = element.style.color;
        elDom.style.borderRadius = `${element.style.borderRadius}px`;
        this.updateElementShadow(element, elDom);
        
        let content = '';
        switch(element.type) {
            case 'button': content = `<button style="width:100%; height:100%; pointer-events:none;">${element.text}</button>`; break;
            case 'input': content = `<input type="text" value="${element.text}" style="width:100%; height:100%; box-sizing:border-box; pointer-events:none;">`; break;
            case 'textarea': content = `<textarea style="width:100%; height:100%; box-sizing:border-box; pointer-events:none;">${element.text}</textarea>`; break;
            case 'checkbox': content = `<div style="display:flex; align-items:center; gap:5px; pointer-events:none;"><input type="checkbox"><span>${element.text}</span></div>`; break;
            case 'dropdown': content = `<select style="width:100%; height:100%; pointer-events:none;"><option>${element.text}</option></select>`; break;
            case 'slider': content = `<input type="range" style="width:100%; pointer-events:none;">`; break;
            case 'progressbar': content = `<progress value="50" max="100" style="width:100%; pointer-events:none;"></progress>`; break;
            case 'stepper': content = `<input type="number" value="${element.text}" style="width:100%; height:100%; box-sizing:border-box; pointer-events:none;">`; break;
            case 'circle': elDom.style.borderRadius = '50%'; break;
            case 'triangle':
                elDom.classList.add('shape-triangle');
                elDom.style.borderLeftWidth = `${element.width / 2}px`;
                elDom.style.borderRightWidth = `${element.width / 2}px`;
                elDom.style.borderBottomWidth = `${element.height}px`;
                elDom.style.borderBottomColor = element.style.backgroundColor;
                elDom.style.backgroundColor = 'transparent'; // Override standard bg
                elDom.style.width = '0px'; elDom.style.height = '0px';
                break;
            case 'line':
                 elDom.classList.add('shape-line');
                 elDom.style.transform = `rotate(${element.style.rotation || 0}deg)`;
                 break;
            default: content = element.text;
        }
        if (content) elDom.innerHTML = content;
    }
    
    updateElementShadow(element, elDom = null) {
        if (!elDom) elDom = this.canvas.querySelector(`[data-id="${element.id}"]`);
        const s = element.style.boxShadow;
        elDom.style.boxShadow = `${s.x}px ${s.y}px ${s.blur}px ${s.color}`;
    }

    addResizeHandles(elDom) {
        ['nw', 'ne', 'sw', 'se'].forEach(handle => {
            const handleDiv = document.createElement('div');
            handleDiv.className = `resize-handle ${handle}`;
            handleDiv.dataset.handle = handle;
            elDom.appendChild(handleDiv);
        });
    }

    // --- CONNECTIONS ---
    addConnectorHandles(elDom) {
        ['top', 'bottom', 'left', 'right'].forEach(pos => {
            const handleDiv = document.createElement('div');
            handleDiv.className = `connector-handle ${pos}`;
            handleDiv.dataset.pos = pos;
            elDom.appendChild(handleDiv);
        });
    }
    
    addConnection(connection) {
        connection.id = 'conn_' + Date.now();
        this.connections.push(connection);
        this.renderConnectors();
    }
    
    getHandleCoords(elementId, handlePosition) {
        const el = this.elements.find(e => e.id === elementId);
        if (!el) return { x: 0, y: 0 };
        
        switch(handlePosition) {
            case 'top': return { x: el.x + el.width / 2, y: el.y };
            case 'bottom': return { x: el.x + el.width / 2, y: el.y + el.height };
            case 'left': return { x: el.x, y: el.y + el.height / 2 };
            case 'right': return { x: el.x + el.width, y: el.y + el.height / 2 };
        }
    }
    
    renderConnectors() {
        this.connectorSvg.innerHTML = '';
        this.connections.forEach(conn => {
            const start = this.getHandleCoords(conn.fromId, conn.fromHandle);
            const end = this.getHandleCoords(conn.toId, conn.toHandle);
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', start.x);
            line.setAttribute('y1', start.y);
            line.setAttribute('x2', end.x);
            line.setAttribute('y2', end.y);
            line.setAttribute('stroke', '#a0a0a0');
            line.setAttribute('stroke-width', '2');
            this.connectorSvg.appendChild(line);
        });
    }


    // --- PROPERTIES PANEL ---
    updatePropertiesPanel() {
        if (!this.selectedElementId) {
            this.propsContainer.style.display = 'none';
            this.noSelectionMsg.style.display = 'block';
            return;
        }

        this.propsContainer.style.display = 'block';
        this.noSelectionMsg.style.display = 'none';
        
        const element = this.elements.find(el => el.id === this.selectedElementId);
        if (!element) return;

        // Set values for all inputs
        document.getElementById('prop-x').value = Math.round(element.x);
        document.getElementById('prop-y').value = Math.round(element.y);
        document.getElementById('prop-width').value = Math.round(element.width);
        document.getElementById('prop-height').value = Math.round(element.height);
        document.getElementById('prop-bg-color').value = this.rgbToHex(element.style.backgroundColor);
        document.getElementById('prop-text-color').value = this.rgbToHex(element.style.color);
        document.getElementById('prop-border-radius').value = element.style.borderRadius;
        
        document.getElementById('prop-shadow-x').value = element.style.boxShadow.x;
        document.getElementById('prop-shadow-y').value = element.style.boxShadow.y;
        document.getElementById('prop-shadow-blur').value = element.style.boxShadow.blur;
        document.getElementById('prop-shadow-color').value = this.rgbToHex(element.style.boxShadow.color);
        
        const textInputContainer = document.getElementById('prop-text-container');
        if (['button', 'input', 'textarea', 'checkbox', 'dropdown', 'stepper'].includes(element.type)) {
            document.getElementById('prop-text').value = element.text;
            textInputContainer.style.display = 'flex';
        } else {
            textInputContainer.style.display = 'none';
        }
    }

    // --- UTILITIES ---
    snapToGrid(value) {
        if (this.gridSize <= 0) return value;
        return Math.round(value / this.gridSize) * this.gridSize;
    }
    
    rgbToHex(rgb) {
        if (typeof rgb !== 'string' || !rgb.startsWith('#')) return rgb || '#000000';
        return rgb;
    }

    // --- EXPORT ---
    exportToHTML() {
        let bodyContent = '';
        let svgContent = '';

        this.elements.forEach(el => {
            const style = `
                position: absolute;
                left: ${el.x}px;
                top: ${el.y}px;
                width: ${el.width}px;
                height: ${el.height}px;
                background-color: ${el.style.backgroundColor};
                color: ${el.style.color};
                border-radius: ${el.style.borderRadius}px;
                box-shadow: ${el.style.boxShadow.x}px ${el.style.boxShadow.y}px ${el.style.boxShadow.blur}px ${el.style.boxShadow.color};
                box-sizing: border-box;
            `;

            let innerHTML = '';
             switch(el.type) {
                case 'button': innerHTML = `<button style="width:100%; height:100%;">${el.text}</button>`; break;
                case 'input': innerHTML = `<input type="text" value="${el.text}" style="width:100%; height:100%; box-sizing:border-box;">`; break;
                case 'textarea': innerHTML = `<textarea style="width:100%; height:100%; box-sizing:border-box;">${el.text}</textarea>`; break;
                case 'checkbox': innerHTML = `<div style="display:flex; align-items:center; gap:5px;"><input type="checkbox"><span>${el.text}</span></div>`; break;
                case 'dropdown': innerHTML = `<select style="width:100%; height:100%;"><option>${el.text}</option></select>`; break;
                case 'slider': innerHTML = `<input type="range" style="width:100%;">`; break;
                case 'progressbar': innerHTML = `<progress value="50" max="100" style="width:100%;"></progress>`; break;
                case 'stepper': innerHTML = `<input type="number" value="${el.text}" style="width:100%; height:100%; box-sizing:border-box;">`; break;
                case 'triangle':
                    bodyContent += `<div style="${style} background-color: transparent !important; width: 0; height: 0; border-left: ${el.width/2}px solid transparent; border-right: ${el.width/2}px solid transparent; border-bottom: ${el.height}px solid ${el.style.backgroundColor};"></div>\n`;
                    return;
                case 'line':
                    bodyContent += `<div style="${style} height: 2px;"></div>\n`;
                    return;
                default: innerHTML = el.text;
            }
            bodyContent += `<div style="${style}">${innerHTML}</div>\n`;
        });
        
        this.connections.forEach(conn => {
            const start = this.getHandleCoords(conn.fromId, conn.fromHandle);
            const end = this.getHandleCoords(conn.toId, conn.toHandle);
            svgContent += `<line x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}" stroke="#a0a0a0" stroke-width="2" />\n`;
        });

        const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exported UI</title>
    <style> body { margin: 0; font-family: sans-serif; } </style>
</head>
<body>
    <div id="exported-canvas" style="position: relative; width: ${this.canvasWidth}px; height: ${this.canvasHeight}px; background: #fff; border: 1px solid #ccc; margin: 20px;">
        ${bodyContent}
        <svg style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">${svgContent}</svg>
    </div>
</body>
</html>`;

        const blob = new Blob([fullHTML], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'exported-ui.html';
        a.click();
        URL.revokeObjectURL(url);
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new UIBuilder();
});

</script>
