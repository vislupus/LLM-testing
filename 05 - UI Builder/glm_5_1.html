<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced UI Builder</title>
<style>
    :root {
        --bg: #2c2c2c; --sidebar: #252525; --canvas-bg: #1a1a1a; --text: #e0e0e0;
        --accent: #4a90e2; --border: #444; --handle: #fff; --guide: #ff4081;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; user-select: none; }

    /* Top Toolbar */
    #toolbar { height: 40px; background: var(--sidebar); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 10px; gap: 15px; }
    #toolbar label { font-size: 12px; display: flex; align-items: center; gap: 5px; }
    #toolbar input { width: 50px; background: var(--bg); color: white; border: 1px solid var(--border); padding: 2px; border-radius: 2px; }
    #toolbar button { background: var(--accent); color: white; border: none; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    #toolbar button.active { background: #e91e63; }

    /* Main Layout */
    #main { display: flex; flex: 1; overflow: hidden; }

    /* Left Sidebar */
    #left-panel { width: 200px; background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
    .panel-section { margin-bottom: 15px; }
    .panel-title { font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .lib-item { background: var(--bg); padding: 8px; margin-bottom: 4px; border-radius: 3px; cursor: grab; font-size: 12px; text-align: center; border: 1px solid var(--border); }
    .lib-item:active { cursor: grabbing; }

    /* Canvas Area */
    #canvas-viewport { flex: 1; overflow: auto; background: #111; position: relative; }
    #canvas { position: relative; background-color: #222; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); }
    #svg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
    #alignment-guides { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9998; }
    .guide-line { position: absolute; background: var(--guide); } .guide-line.h { height: 1px; width: 100%; } .guide-line.v { width: 1px; height: 100%; }

    /* Canvas Elements */
    .canvas-element { position: absolute; cursor: move; box-sizing: border-box; min-width: 20px; min-height: 20px; }
    .canvas-element.selected { outline: 1px solid var(--accent); }
    .resize-handle { position: absolute; width: 8px; height: 8px; background: var(--handle); border: 1px solid var(--accent); display: none; z-index: 10; }
    .canvas-element.selected .resize-handle { display: block; }
    .handle-tl { top: -4px; left: -4px; cursor: nw-resize; } .handle-tr { top: -4px; right: -4px; cursor: ne-resize; }
    .handle-bl { bottom: -4px; left: -4px; cursor: sw-resize; } .handle-br { bottom: -4px; right: -4px; cursor: se-resize; }
    
    /* Right Sidebar (Properties) */
    #right-panel { width: 240px; background: var(--sidebar); border-left: 1px solid var(--border); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .prop-group { background: var(--bg); padding: 8px; border-radius: 3px; border: 1px solid var(--border); }
    .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-size: 12px; }
    .prop-row label { width: 60px; } .prop-row input, .prop-row select { flex: 1; background: var(--sidebar); color: white; border: 1px solid var(--border); padding: 2px; border-radius: 2px; }
    .hidden { display: none; }

    /* Shape Specifics */
    .shape-triangle { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
    .shape-circle { border-radius: 50%; }
    
    /* Component Styling */
    .ui-button { background: #4a90e2; color: white; border: none; padding: 5px 10px; text-align: center; width: 100%; height: 100%; border-radius: 3px; }
    .ui-input { background: white; color: black; border: 1px solid #ccc; padding: 0 5px; width: 100%; height: 100%; border-radius: 3px; }
    .ui-checkbox { display: flex; align-items: center; gap: 5px; font-size: 12px; color: white; }
    .ui-dropdown { background: white; color: black; border: 1px solid #ccc; width: 100%; height: 100%; border-radius: 3px; }
    .ui-slider { width: 100%; height: 100%; accent-color: var(--accent); }
    .ui-progress { width: 100%; height: 100%; }
    .ui-textarea { background: white; color: black; border: 1px solid #ccc; resize: none; width: 100%; height: 100%; font-size: 12px; padding: 5px; border-radius: 3px; }
    .ui-stepper { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; color: white; background: #444; border-radius: 3px; }
</style>
</head>
<body>

<div id="toolbar">
    <label>Canvas W: <input type="number" id="inp-cw" value="1200"></label>
    <label>H: <input type="number" id="inp-ch" value="800"></label>
    <button onclick="updateCanvasSize()">Resize Canvas</button>
    <label><input type="checkbox" id="inp-snap" checked> Snap (20px)</label>
    <button id="btn-connect" onclick="toggleConnectMode()">Connect Mode: OFF</button>
    <button onclick="exportToHTML()" style="margin-left:auto; background:#27ae60;">Export HTML</button>
</div>

<div id="main">
    <div id="left-panel">
        <div class="panel-section">
            <div class="panel-title">UI Components</div>
            <div class="lib-item" draggable="true" data-type="button">Button</div>
            <div class="lib-item" draggable="true" data-type="input">Input</div>
            <div class="lib-item" draggable="true" data-type="textarea">Text Field</div>
            <div class="lib-item" draggable="true" data-type="checkbox">Checkbox</div>
            <div class="lib-item" draggable="true" data-type="dropdown">Dropdown</div>
            <div class="lib-item" draggable="true" data-type="slider">Slider</div>
            <div class="lib-item" draggable="true" data-type="stepper">Stepper</div>
            <div class="lib-item" draggable="true" data-type="progress">Progress Bar</div>
        </div>
        <div class="panel-section">
            <div class="panel-title">Shapes</div>
            <div class="lib-item" draggable="true" data-type="rect">Rectangle</div>
            <div class="lib-item" draggable="true" data-type="circle">Circle</div>
            <div class="lib-item" draggable="true" data-type="triangle">Triangle</div>
            <div class="lib-item" draggable="true" data-type="line">Line</div>
        </div>
    </div>

    <div id="canvas-viewport">
        <div id="canvas" style="width:1200px; height:800px;">
            <div id="alignment-guides"></div>
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <div id="right-panel">
        <div id="props-empty">Select an element to edit.</div>
        <div id="props-content" class="hidden">
            <div class="prop-group">
                <div class="panel-title">Geometry</div>
                <div class="prop-row"><label>X</label><input type="number" id="p-x"></div>
                <div class="prop-row"><label>Y</label><input type="number" id="p-y"></div>
                <div class="prop-row"><label>W</label><input type="number" id="p-w"></div>
                <div class="prop-row"><label>H</label><input type="number" id="p-h"></div>
            </div>
            <div class="prop-group">
                <div class="panel-title">Style</div>
                <div class="prop-row"><label>Bg</label><input type="color" id="p-bg" value="#444444"></div>
                <div class="prop-row"><label>Text</label><input type="color" id="p-color" value="#ffffff"></div>
                <div class="prop-row"><label>Border</label><input type="text" id="p-border" placeholder="1px solid #000"></div>
                <div class="prop-row"><label>Radius</label><input type="number" id="p-radius" min="0"></div>
                <div class="prop-row"><label>Shadow</label><input type="text" id="p-shadow" placeholder="2px 2px 5px #000"></div>
            </div>
            <div class="prop-group">
                <button onclick="deleteSelected()" style="width:100%; background:#c0392b; color:white; border:none; padding:5px; cursor:pointer;">Delete Element</button>
            </div>
        </div>
    </div>
</div>

<script>
const state = {
    elements: [],
    connections: [],
    selectedId: null,
    connectMode: false,
    connectStart: null,
    dragState: null,
    resizeState: null,
    gridSnap: 20,
    idCounter: 0
};

const canvas = document.getElementById('canvas');
const svgLayer = document.getElementById('svg-layer');
const guidesContainer = document.getElementById('alignment-guides');

// --- Utilities ---
function snap(val) { return state.gridSnap ? Math.round(val / state.gridSnap) * state.gridSnap : val; }
function genId() { return 'el_' + (state.idCounter++); }

function getEl(id) { return state.elements.find(e => e.id === id); }
function getDom(id) { return document.querySelector(`[data-id="${id}"]`); }

// --- Canvas Setup ---
function updateCanvasSize() {
    canvas.style.width = document.getElementById('inp-cw').value + 'px';
    canvas.style.height = document.getElementById('inp-ch').value + 'px';
}

document.getElementById('inp-snap').addEventListener('change', (e) => {
    state.gridSnap = e.target.checked ? 20 : 0;
});

// --- Drag & Drop from Library ---
document.querySelectorAll('.lib-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('type', item.dataset.type);
    });
});

canvas.addEventListener('dragover', e => e.preventDefault());
canvas.addEventListener('drop', (e) => {
    e.preventDefault();
    const type = e.dataTransfer.getData('type');
    if (!type) return;
    
    const rect = canvas.getBoundingClientRect();
    let x = e.clientX - rect.left + canvas.parentElement.scrollLeft;
    let y = e.clientY - rect.top + canvas.parentElement.scrollTop;
    
    if (state.gridSnap) { x = snap(x); y = snap(y); }

    const defaults = {
        button: { w: 100, h: 40, bg: '#4a90e2', color: '#fff', radius: 4, border: 'none', shadow: '' },
        input: { w: 150, h: 30, bg: '#fff', color: '#000', radius: 3, border: '1px solid #ccc', shadow: '' },
        textarea: { w: 150, h: 100, bg: '#fff', color: '#000', radius: 3, border: '1px solid #ccc', shadow: '' },
        checkbox: { w: 100, h: 30, bg: 'transparent', color: '#fff', radius: 0, border: 'none', shadow: '' },
        dropdown: { w: 150, h: 30, bg: '#fff', color: '#000', radius: 3, border: '1px solid #ccc', shadow: '' },
        slider: { w: 150, h: 20, bg: 'transparent', color: '#000', radius: 0, border: 'none', shadow: '' },
        stepper: { w: 80, h: 30, bg: '#444', color: '#fff', radius: 3, border: '1px solid #666', shadow: '' },
        progress: { w: 150, h: 20, bg: 'transparent', color: '#000', radius: 0, border: 'none', shadow: '' },
        rect: { w: 100, h: 100, bg: '#e74c3c', color: '#fff', radius: 0, border: 'none', shadow: '' },
        circle: { w: 100, h: 100, bg: '#2ecc71', color: '#fff', radius: 50, border: 'none', shadow: '' },
        triangle: { w: 100, h: 100, bg: '#f1c40f', color: '#fff', radius: 0, border: 'none', shadow: '' },
        line: { w: 150, h: 2, bg: '#ecf0f1', color: '#000', radius: 0, border: 'none', shadow: '' }
    };

    const d = defaults[type];
    const newEl = { id: genId(), type, x, y, w: d.w, h: d.h, style: { bg: d.bg, color: d.color, border: d.border, radius: d.radius, shadow: d.shadow } };
    state.elements.push(newEl);
    renderElement(newEl);
    selectElement(newEl.id);
});

// --- DOM Rendering ---
function renderElement(el) {
    let dom = getDom(el.id);
    if (!dom) {
        dom = document.createElement('div');
        dom.className = 'canvas-element';
        dom.dataset.id = el.id;
        
        // Inner content based on type
        if (el.type === 'button') dom.innerHTML = '<button class="ui-button" style="pointer-events:none;width:100%;height:100%">Button</button>';
        else if (el.type === 'input') dom.innerHTML = '<input class="ui-input" style="pointer-events:none" value="Input">';
        else if (el.type === 'textarea') dom.innerHTML = '<textarea class="ui-textarea" style="pointer-events:none">Text Area</textarea>';
        else if (el.type === 'checkbox') dom.innerHTML = '<div class="ui-checkbox" style="pointer-events:none"><input type="checkbox"><span>Check</span></div>';
        else if (el.type === 'dropdown') dom.innerHTML = '<select class="ui-dropdown" style="pointer-events:none"><option>Option 1</option></select>';
        else if (el.type === 'slider') dom.innerHTML = '<input type="range" class="ui-slider" style="pointer-events:none">';
        else if (el.type === 'stepper') dom.innerHTML = '<div class="ui-stepper" style="pointer-events:none"><button>-</button><span>0</span><button>+</button></div>';
        else if (el.type === 'progress') dom.innerHTML = '<progress class="ui-progress" value="70" max="100" style="pointer-events:none"></progress>';
        else if (el.type === 'triangle') dom.classList.add('shape-triangle');
        else if (el.type === 'circle') dom.classList.add('shape-circle');
        else if (el.type === 'line') { /* plain div */ }

        // Resize handles
        ['tl', 'tr', 'bl', 'br'].forEach(pos => {
            const h = document.createElement('div');
            h.className = `resize-handle handle-${pos}`;
            h.dataset.handle = pos;
            dom.appendChild(h);
        });

        canvas.appendChild(dom);
        
        // Events
        dom.addEventListener('mousedown', onElementMouseDown);
        dom.addEventListener('click', onElementClick);
    }

    // Apply styles and pos
    dom.style.left = el.x + 'px';
    dom.style.top = el.y + 'px';
    dom.style.width = el.w + 'px';
    dom.style.height = el.h + 'px';
    dom.style.backgroundColor = (el.type !== 'triangle' && el.type !== 'circle') ? el.style.bg : el.style.bg;
    dom.style.color = el.style.color;
    dom.style.border = el.style.border;
    dom.style.borderRadius = el.style.radius + 'px';
    dom.style.boxShadow = el.style.shadow;

    // Fix specific shapes
    if (el.type === 'circle') dom.style.borderRadius = '50%';
    if (el.type === 'line') { dom.style.height = '2px'; dom.style.backgroundColor = el.style.bg; }

    updateConnections();
}

// --- Selection ---
function selectElement(id) {
    if (state.connectMode) return;
    state.selectedId = id;
    document.querySelectorAll('.canvas-element').forEach(d => d.classList.remove('selected'));
    if (id) {
        getDom(id).classList.add('selected');
        document.getElementById('props-empty').classList.add('hidden');
        document.getElementById('props-content').classList.remove('hidden');
        populateProps();
    } else {
        document.getElementById('props-empty').classList.remove('hidden');
        document.getElementById('props-content').classList.add('hidden');
    }
}

function populateProps() {
    const el = getEl(state.selectedId);
    if (!el) return;
    document.getElementById('p-x').value = el.x;
    document.getElementById('p-y').value = el.y;
    document.getElementById('p-w').value = el.w;
    document.getElementById('p-h').value = el.h;
    document.getElementById('p-bg').value = el.style.bg !== 'transparent' ? el.style.bg : '#000000';
    document.getElementById('p-color').value = el.style.color;
    document.getElementById('p-border').value = el.style.border;
    document.getElementById('p-radius').value = el.style.radius;
    document.getElementById('p-shadow').value = el.style.shadow;
}

// Listen to prop changes
document.querySelectorAll('#right-panel input, #right-panel select').forEach(inp => {
    inp.addEventListener('input', () => {
        if (!state.selectedId) return;
        const el = getEl(state.selectedId);
        el.x = parseInt(document.getElementById('p-x').value);
        el.y = parseInt(document.getElementById('p-y').value);
        el.w = parseInt(document.getElementById('p-w').value);
        el.h = parseInt(document.getElementById('p-h').value);
        el.style.bg = document.getElementById('p-bg').value;
        el.style.color = document.getElementById('p-color').value;
        el.style.border = document.getElementById('p-border').value;
        el.style.radius = document.getElementById('p-radius').value;
        el.style.shadow = document.getElementById('p-shadow').value;
        renderElement(el);
    });
});

function deleteSelected() {
    if (!state.selectedId) return;
    const id = state.selectedId;
    state.elements = state.elements.filter(e => e.id !== id);
    state.connections = state.connections.filter(c => c.from !== id && c.to !== id);
    getDom(id).remove();
    selectElement(null);
    updateConnections();
}

// --- Canvas Interactions (Move & Resize) ---
function onElementClick(e) {
    e.stopPropagation();
    if (state.connectMode) {
        handleConnectClick(e.currentTarget.dataset.id);
    } else {
        selectElement(e.currentTarget.dataset.id);
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (e.target === canvas) selectElement(null);
});

function onElementMouseDown(e) {
    if (state.connectMode || e.target.classList.contains('resize-handle')) return;
    e.preventDefault(); e.stopPropagation();
    
    const dom = e.currentTarget;
    const el = getEl(dom.dataset.id);
    selectElement(el.id);

    state.dragState = {
        id: el.id,
        startX: e.clientX,
        startY: e.clientY,
        origX: el.x,
        origY: el.y
    };
}

// Resize Handles
canvas.addEventListener('mousedown', (e) => {
    if (!e.target.classList.contains('resize-handle')) return;
    e.preventDefault(); e.stopPropagation();
    
    const dom = e.target.parentElement;
    const el = getEl(dom.dataset.id);
    selectElement(el.id);

    state.resizeState = {
        id: el.id,
        handle: e.target.dataset.handle,
        startX: e.clientX,
        startY: e.clientY,
        origX: el.x,
        origY: el.y,
        origW: el.w,
        origH: el.h
    };
});

document.addEventListener('mousemove', (e) => {
    if (state.dragState) {
        const ds = state.dragState;
        const el = getEl(ds.id);
        let dx = e.clientX - ds.startX;
        let dy = e.clientY - ds.startY;
        
        let newX = ds.origX + dx;
        let newY = ds.origY + dy;

        if (state.gridSnap) { newX = snap(newX); newY = snap(newY); }

        // Alignment guides logic
        checkAlignment(el, newX, newY, el.w, el.h);

        el.x = newX; el.y = newY;
        renderElement(el); // updates DOM and connections
        populateProps();
    } 
    else if (state.resizeState) {
        const rs = state.resizeState;
        const el = getEl(rs.id);
        let dx = e.clientX - rs.startX;
        let dy = e.clientY - rs.startY;

        let newX = rs.origX, newY = rs.origY, newW = rs.origW, newH = rs.origH;

        if (rs.handle.includes('r')) newW = rs.origW + dx;
        if (rs.handle.includes('l')) { newW = rs.origW - dx; newX = rs.origX + dx; }
        if (rs.handle.includes('b')) newH = rs.origH + dy;
        if (rs.handle.includes('t')) { newH = rs.origH - dy; newY = rs.origY + dy; }

        // Min size
        if (newW < 20) { if(rs.handle.includes('l')) newX = rs.origX + rs.origW - 20; newW = 20; }
        if (newH < 20) { if(rs.handle.includes('t')) newY = rs.origY + rs.origH - 20; newH = 20; }

        if (state.gridSnap) { newX = snap(newX); newY = snap(newY); newW = snap(newW); newH = snap(newH); }

        checkAlignment(el, newX, newY, newW, newH);

        el.x = newX; el.y = newY; el.w = newW; el.h = newH;
        renderElement(el);
        populateProps();
    }
});

document.addEventListener('mouseup', () => {
    state.dragState = null;
    state.resizeState = null;
    clearGuides();
});

// --- Alignment Guides ---
function checkAlignment(movingEl, x, y, w, h) {
    clearGuides();
    const threshold = 5;
    const cX = x + w/2, cY = y + h/2;
    const l = x, r = x + w, t = y, b = y + h;
    
    state.elements.forEach(el => {
        if (el.id === movingEl.id) return;
        const eCX = el.x + el.w/2, eCY = el.y + el.h/2;
        const eL = el.x, eR = el.x + el.w, eT = el.y, eB = el.y + el.h;

        // Check X axis
        if (Math.abs(l - eL) < threshold) { drawGuide('v', eL); x = eL; }
        else if (Math.abs(r - eR) < threshold) { drawGuide('v', eR); x = eR; }
        else if (Math.abs(cX - eCX) < threshold) { drawGuide('v', eCX); x = eCX - w/2; }

        // Check Y axis
        if (Math.abs(t - eT) < threshold) { drawGuide('h', eT); y = eT; }
        else if (Math.abs(b - eB) < threshold) { drawGuide('h', eB); y = eB; }
        else if (Math.abs(cY - eCY) < threshold) { drawGuide('h', eCY); y = eCY - h/2; }
    });
}

function drawGuide(type, pos) {
    const div = document.createElement('div');
    div.className = `guide-line ${type}`;
    if (type === 'h') div.style.top = pos + 'px'; else div.style.left = pos + 'px';
    guidesContainer.appendChild(div);
}

function clearGuides() { guidesContainer.innerHTML = ''; }

// --- Flowchart Connections ---
function toggleConnectMode() {
    state.connectMode = !state.connectMode;
    state.connectStart = null;
    document.getElementById('btn-connect').classList.toggle('active', state.connectMode);
    document.getElementById('btn-connect').innerText = `Connect Mode: ${state.connectMode ? 'ON' : 'OFF'}`;
    canvas.style.cursor = state.connectMode ? 'crosshair' : 'default';
}

function handleConnectClick(id) {
    if (!state.connectStart) {
        state.connectStart = id;
        getDom(id).style.outline = '2px solid #e91e63';
    } else {
        if (state.connectStart !== id) {
            state.connections.push({ id: 'conn_' + Date.now(), from: state.connectStart, to: id });
            updateConnections();
        }
        getDom(state.connectStart).style.outline = '';
        state.connectStart = null;
    }
}

function updateConnections() {
    svgLayer.innerHTML = '';
    state.connections.forEach(conn => {
        const fromEl = getEl(conn.from);
        const toEl = getEl(conn.to);
        if (!fromEl || !toEl) return;

        const fCX = fromEl.x + fromEl.w/2, fCY = fromEl.y + fromEl.h/2;
        const tCX = toEl.x + toEl.w/2, tCY = toEl.y + toEl.h/2;
        
        // Smart anchor logic
        let dx = tCX - fCX, dy = tCY - fCY;
        let x1, y1, x2, y2;

        if (Math.abs(dx) > Math.abs(dy)) {
            x1 = dx > 0 ? fromEl.x + fromEl.w : fromEl.x; y1 = fCY;
            x2 = dx > 0 ? toEl.x : toEl.x + toEl.w; y2 = tCY;
        } else {
            x1 = fCX; y1 = dy > 0 ? fromEl.y + fromEl.h : fromEl.y;
            x2 = tCX; y2 = dy > 0 ? toEl.y : toEl.y + toEl.h;
        }

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const midX = (x1 + x2) / 2;
        path.setAttribute('d', `M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}`);
        path.setAttribute('stroke', '#4a90e2');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('fill', 'none');
        path.setAttribute('marker-end', 'url(#arrowhead)');
        svgLayer.appendChild(path);
    });
    
    // Add arrowhead def if connections exist
    if (state.connections.length > 0) {
        const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', 'arrowhead');
        marker.setAttribute('markerWidth', '10');
        marker.setAttribute('markerHeight', '7');
        marker.setAttribute('refX', '9');
        marker.setAttribute('refY', '3.5');
        marker.setAttribute('orient', 'auto');
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', '0 0, 10 3.5, 0 7');
        polygon.setAttribute('fill', '#4a90e2');
        marker.appendChild(polygon);
        defs.appendChild(marker);
        svgLayer.prepend(defs);
    }
}

// --- Export Function ---
function exportToHTML() {
    const cw = canvas.style.width, ch = canvas.style.height;
    let html = `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<title>Exported UI</title>\n<style>\nbody{margin:0;background:#111;display:flex;justify-content:center;padding:50px;}\n.container{position:relative;width:${cw};height:${ch};background:#222;overflow:hidden;box-shadow:0 0 20px rgba(0,0,0,0.5);}\n.el{position:absolute;box-sizing:border-box;}\n.shape-triangle{clip-path:polygon(50% 0%, 0% 100%, 100% 100%);}\n.shape-circle{border-radius:50%;}\n.ui-button{background:#4a90e2;color:white;border:none;text-align:center;cursor:pointer;}\n.ui-input{background:white;color:black;border:1px solid #ccc;padding:0 5px;}\n.ui-textarea{background:white;color:black;border:1px solid #ccc;resize:none;font-size:12px;padding:5px;}\n.ui-checkbox{display:flex;align-items:center;gap:5px;font-size:12px;color:white;}\n.ui-dropdown{background:white;color:black;border:1px solid #ccc;}\n.ui-slider{width:100%;height:100%;accent-color:#4a90e2;}\n.ui-progress{width:100%;height:100%;}\n.ui-stepper{display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;color:white;background:#444;}\n</style>\n</head>\n<body>\n<div class="container">\n`;

    state.elements.forEach(el => {
        let cls = `el ${el.type === 'triangle' ? 'shape-triangle' : el.type === 'circle' ? 'shape-circle' : ''} ui-${el.type}`.trim();
        let style = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;background:${el.style.bg};color:${el.style.color};border:${el.style.border};border-radius:${el.style.radius}px;box-shadow:${el.style.shadow};`;
        if (el.type === 'line') style += `height:2px;`;
        
        let inner = '';
        if (el.type === 'button') inner = 'Button';
        else if (el.type === 'input') inner = `<input type="text" value="Input" style="width:100%;height:100%;background:transparent;border:none;color:inherit;">`;
        else if (el.type === 'textarea') inner = `<textarea style="width:100%;height:100%;background:transparent;border:none;color:inherit;resize:none">Text Area</textarea>`;
        else if (el.type === 'checkbox') inner = `<input type="checkbox"><span>Check</span>`;
        else if (el.type === 'dropdown') inner = `<select style="width:100%;height:100%"><option>Option 1</option></select>`;
        else if (el.type === 'slider') inner = `<input type="range" style="width:100%;height:100%">`;
        else if (el.type === 'progress') inner = `<progress value="70" max="100" style="width:100%;height:100%"></progress>`;
        else if (el.type === 'stepper') inner = `<button onclick="this.nextElementSibling.innerText=parseInt(this.nextElementSibling.innerText)-1">-</button><span>0</span><button onclick="this.previousElementSibling.innerText=parseInt(this.previousElementSibling.innerText)+1">+</button>`;

        html += `<div class="${cls}" style="${style}">${inner}</div>\n`;
    });

    // Export Connections SVG
    if (state.connections.length > 0) {
        html += `<svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">\n<defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#4a90e2" /></marker></defs>\n`;
        state.connections.forEach(conn => {
            const fromEl = getEl(conn.from), toEl = getEl(conn.to);
            if(!fromEl || !toEl) return;
            const fCX = fromEl.x + fromEl.w/2, fCY = fromEl.y + fromEl.h/2;
            const tCX = toEl.x + toEl.w/2, tCY = toEl.y + toEl.h/2;
            let dx = tCX - fCX, dy = tCY - fCY, x1, y1, x2, y2;
            if (Math.abs(dx) > Math.abs(dy)) {
                x1 = dx > 0 ? fromEl.x + fromEl.w : fromEl.x; y1 = fCY;
                x2 = dx > 0 ? toEl.x : toEl.x + toEl.w; y2 = tCY;
            } else {
                x1 = fCX; y1 = dy > 0 ? fromEl.y + fromEl.h : fromEl.y;
                x2 = tCX; y2 = dy > 0 ? toEl.y : toEl.y + toEl.h;
            }
            const midX = (x1+x2)/2;
            html += `<path d="M${x1},${y1} C${midX},${y1} ${midX},${y2} ${x2},${y2}" stroke="#4a90e2" stroke-width="2" fill="none" marker-end="url(#arrowhead)" />\n`;
        });
        html += `</svg>\n`;
    }

    html += `</div>\n</body>\n</html>`;

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ui-design.html'; a.click();
    URL.revokeObjectURL(url);
}
