<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Builder Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;color:#c9d1d9;background:#0d1117}

/* ── TOP BAR ── */
#topbar{height:40px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;padding:0 12px;gap:4px;z-index:100;position:relative}
#topbar .logo{font-weight:700;color:#58a6ff;margin-right:16px;font-size:14px}
#topbar button{background:rgba(255,255,255,.05);border:1px solid #30363d;color:#c9d1d9;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
#topbar button:hover{background:rgba(255,255,255,.1)}
#topbar .sep{width:1px;height:20px;background:#30363d;margin:0 4px}
#topbar .zoom-info{color:#8b949e;font-size:11px;min-width:50px;text-align:center}
#topbar .tool-btn{position:relative}
#topbar .tool-btn.active{background:rgba(88,166,255,.15);border-color:#58a6ff;color:#58a6ff}

/* ── MAIN LAYOUT ── */
#main{display:flex;height:calc(100vh - 40px)}

/* ── LEFT PANEL ── */
#left{width:220px;background:#161b22;border-right:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0}
#left .p-head{padding:10px 12px;font-weight:600;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #21262d}
#lib-list{flex:1;overflow-y:auto;padding:4px}
.lib-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;cursor:grab;margin:1px 0;transition:background .1s}
.lib-item:hover{background:rgba(255,255,255,.05)}
.lib-item:active{cursor:grabbing}
.lib-icon{width:28px;height:22px;border-radius:3px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.lib-item span{font-size:12px}
.lib-sep{padding:8px 10px 4px;font-size:10px;color:#484f58;font-weight:600;text-transform:uppercase;letter-spacing:.5px}

/* ── CANVAS ── */
#canvas-area{flex:1;overflow:hidden;position:relative;background:#0d1117}
#canvas-vp{width:100%;height:100%;overflow:auto;position:relative}
#canvas{position:absolute;width:10000px;height:10000px;transform-origin:0 0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:20px 20px}
#canvas-inner{position:absolute;top:0;left:0;width:1400px;height:900px;background:#1c2128;box-shadow:0 0 0 1px #30363d;border-radius:4px}
#el-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:10}
#svg-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:visible}
#guide-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;pointer-events:none}
#temp-line{position:absolute;top:0;left:0;width:100%;height:100%;z-index:25;pointer-events:none;overflow:visible}

/* ── ELEMENTS ── */
.el{position:absolute;cursor:move;user-select:none;box-sizing:border-box;transition:box-shadow .15s}
.el:hover{box-shadow:0 0 0 1px rgba(88,166,255,.4)!important}
.el.selected{outline:2px solid #58a6ff;outline-offset:0;z-index:15!important}
.el.editing{outline:2px dashed #3fb950;outline-offset:0;z-index:16!important}
.el .resize-handle{position:absolute;width:8px;height:8px;background:#58a6ff;border:1.5px solid #fff;border-radius:50%;z-index:30;display:none}
.el.selected .resize-handle{display:block}
.rh-nw{top:-4px;left:-4px;cursor:nw-resize}.rh-n{top:-4px;left:50%;margin-left:-4px;cursor:n-resize}
.rh-ne{top:-4px;right:-4px;cursor:ne-resize}.rh-e{top:50%;margin-top:-4px;right:-4px;cursor:e-resize}
.rh-se{bottom:-4px;right:-4px;cursor:se-resize}.rh-s{bottom:-4px;left:50%;margin-left:-4px;cursor:s-resize}
.rh-sw{bottom:-4px;left:-4px;cursor:sw-resize}.rh-w{top:50%;margin-top:-4px;left:-4px;cursor:w-resize}

/* ── GUIDES ── */
.guide{position:absolute;background:#f78166;z-index:21;pointer-events:none}
.guide-h{height:1px;left:0;right:0}.guide-v{width:1px;top:0;bottom:0}

/* ── CONNECTION RENDERING ── */
.conn-path{fill:none;stroke:#58a6ff;stroke-width:2}
.conn-path-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;pointer-events:stroke}
.conn-arrow{fill:#58a6ff}
.conn:hover .conn-path{stroke:#f0883e}
.conn.selected .conn-path{stroke:#f0883e;stroke-width:2.5}
.conn-draw{fill:none;stroke:#58a6ff;stroke-width:2;stroke-dasharray:6 4;opacity:.7}

/* ── RIGHT PANEL ── */
#right{width:260px;background:#161b22;border-left:1px solid #21262d;display:flex;flex-direction:column;flex-shrink:0}
#right .p-head{padding:10px 12px;font-weight:600;font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #21262d;display:flex;justify-content:space-between}
#props{flex:1;overflow-y:auto;padding:8px}
.pg{margin-bottom:10px}
.pg-title{font-size:10px;color:#58a6ff;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:4px 0;border-bottom:1px solid #21262d;margin-bottom:6px}
.pr{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.pr label{width:68px;font-size:11px;color:#8b949e;flex-shrink:0}
.pr input,.pr select{flex:1;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px;padding:4px 6px;font-size:11px;min-width:0}
.pr input[type=color]{width:28px;height:22px;padding:0;border-radius:3px;cursor:pointer}
.pr input:focus,.pr select:focus{border-color:#58a6ff;outline:none}
.pr input[type=number]{width:60px}
.pr input[type=range]{accent-color:#58a6ff;height:4px;padding:0}
.pr .row2{display:flex;gap:4px;flex:1}
.pr .row2 input{flex:1}
.pr button{background:rgba(255,255,255,.05);border:1px solid #30363d;color:#c9d1d9;padding:3px 8px;border-radius:4px;cursor:pointer;font-size:11px}
.pr button:hover{background:rgba(255,255,255,.1)}
#no-sel{padding:20px 12px;color:#484f58;text-align:center;font-size:12px;line-height:1.6}

/* ── STATUS BAR ── */
#statusbar{height:24px;background:#161b22;border-top:1px solid #21262d;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11px;color:#484f58}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="logo">⬡ UI Builder</div>
  <div class="sep"></div>
  <button id="tool-select" class="tool-btn active" onclick="setTool('select')" title="Select (V)">🖱 Select</button>
  <button id="tool-connect" class="tool-btn" onclick="setTool('connect')" title="Connect (C)">⛓ Connect</button>
  <div class="sep"></div>
  <button onclick="undo()" title="Ctrl+Z">↩ Undo</button>
  <button onclick="redo()" title="Ctrl+Y">↪ Redo</button>
  <button onclick="deleteSelected()" title="Del">🗑 Delete</button>
  <div class="sep"></div>
  <button onclick="duplicateSelected()" title="Ctrl+D">⧉ Dup</button>
  <button onclick="bringForward()">↑↑</button>
  <button onclick="sendBackward()">↓↓</button>
  <div class="sep"></div>
  <button onclick="alignSelected('left')" title="Align Left">⫷</button>
  <button onclick="alignSelected('centerH')" title="Align Center H">⫿</button>
  <button onclick="alignSelected('right')" title="Align Right">⫸</button>
  <button onclick="alignSelected('top')" title="Align Top">⫏</button>
  <button onclick="alignSelected('centerV')" title="Align Center V">⫿</button>
  <button onclick="alignSelected('bottom')" title="Align Bottom">⫐</button>
  <div class="sep"></div>
  <button onclick="zoomIn()">+</button>
  <span class="zoom-info" id="zoom-info">100%</span>
  <button onclick="zoomOut()">−</button>
  <button onclick="zoomFit()">Fit</button>
  <div class="sep"></div>
  <button onclick="exportHTML()" style="background:rgba(88,166,255,.15);border-color:#58a6ff;color:#58a6ff">⬇ Export HTML</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- LEFT PANEL -->
  <div id="left">
    <div class="p-head">Components</div>
    <div id="lib-list"></div>
  </div>

  <!-- CANVAS -->
  <div id="canvas-area">
    <div id="canvas-vp">
      <div id="canvas">
        <div id="canvas-inner">
          <div id="guide-layer"></div>
          <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"><defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#58a6ff"/></marker>
            <marker id="arrowhead-sel" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f0883e"/></marker>
          </defs></svg>
          <div id="el-layer"></div>
          <svg id="temp-line" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div id="right">
    <div class="p-head"><span>Properties</span></div>
    <div id="props"><div id="no-sel">Select an element to<br>edit its properties<br><br>Drag components from<br>the left panel onto<br>the canvas</div></div>
  </div>
</div>

<div id="statusbar">
  <span id="status-left">Ready</span>
  <span id="status-right">Grid: 20px · Canvas: 1400×900</span>
</div>

<script>
/* ══════════════════════════════════════
   CONFIGURATION
   ══════════════════════════════════════ */
var GRID=20, CANVAS_W=1400, CANVAS_H=900, MIN_SIZE=20;
var ARROW='►'; // arrow symbol for connections

/* ══════════════════════════════════════
   STATE
   ══════════════════════════════════════ */
var elements=[], connections=[];
var selId=null, tool='select', zoom=1;
var idCounter=1, zIndex=10;
var drag=null, resize=null, connDraw=null, editingText=false;
var undoStack=[], redoStack=[], maxUndo=80;
var canvasEl, vpEl;

/* ══════════════════════════════════════
   ELEMENT TEMPLATES
   ══════════════════════════════════════ */
var TEMPLATES={
  'UI Components':{
    button:{name:'Button',icon:'⬜',w:130,h:38,tag:'button',text:'Button',styles:{background:'#3772ff',color:'#fff',border:'none',borderRadius:'6px',fontSize:'13px',fontWeight:'600',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}},
    input:{name:'Text Input',icon:'▭',w:220,h:36,tag:'input',text:'',styles:{background:'#21262d',color:'#c9d1d9',border:'1px solid #30363d',borderRadius:'6px',padding:'6px 10px',fontSize:'13px',outline:'none'}},
    textarea:{name:'Text Area',icon:'▤',w:260,h:100,tag:'textarea',text:'Type here…',styles:{background:'#21262d',color:'#c9d1d9',border:'1px solid #30363d',borderRadius:'6px',padding:'8px 10px',fontSize:'13px',resize:'none',outline:'none'}},
    checkbox:{name:'Checkbox',icon:'☑',w:170,h:24,tag:'checkbox',text:'Checkbox label',styles:{}},
    dropdown:{name:'Dropdown',icon:'▾',w:200,h:36,tag:'select',text:'Option 1,Option 2,Option 3',styles:{background:'#21262d',color:'#c9d1d9',border:'1px solid #30363d',borderRadius:'6px',padding:'6px 10px',fontSize:'13px'}},
    slider:{name:'Slider',icon:'━',w:200,h:36,tag:'range',text:'50',styles:{}},
    progress:{name:'Progress Bar',icon:'▰',w:220,h:20,tag:'progress',text:'60',styles:{borderRadius:'10px',overflow:'hidden'}},
    stepper:{name:'Stepper',icon:'⊕⊖',w:150,h:34,tag:'stepper',text:'0',styles:{}},
    heading:{name:'Heading',icon:'H',w:300,h:40,tag:'heading',text:'Heading',styles:{color:'#e6edf3',fontSize:'24px',fontWeight:'700',background:'transparent',border:'none'}},
    paragraph:{name:'Paragraph',icon:'¶',w:320,h:80,tag:'paragraph',text:'Lorem ipsum dolor sit amet, consectetur adipiscing elit.',styles:{color:'#8b949e',fontSize:'13px',lineHeight:'1.6',background:'transparent',border:'none'}},
    label:{name:'Label',icon:'A',w:100,h:20,tag:'label',text:'Label:',styles:{color:'#8b949e',fontSize:'12px',fontWeight:'500',background:'transparent',border:'none'}},
    icon:{name:'Icon Box',icon:'★',w:40,h:40,tag:'icon',text:'⭐',styles:{fontSize:'20px',background:'rgba(255,255,255,.05)',border:'1px solid #30363d',borderRadius:'8px',display:'flex',alignItems:'center',justifyContent:'center'}},
    image:{name:'Image',icon:'🖼',w:200,h:150,tag:'img',text:'',styles:{background:'#21262d',border:'1px solid #30363d',borderRadius:'4px',objectFit:'cover'}},
  },
  'Shapes':{
    rect:{name:'Rectangle',icon:'▬',w:160,h:100,tag:'div',text:'',styles:{background:'#21262d',border:'2px solid #30363d',borderRadius:'0'}},
    circle:{name:'Circle',icon:'●',w:100,h:100,tag:'div',text:'',styles:{background:'#21262d',border:'2px solid #30363d',borderRadius:'50%'}},
    triangle:{name:'Triangle',icon:'▲',w:100,h:100,tag:'div',text:'',styles:{background:'transparent',border:'none',clipPath:'polygon(50% 0%, 0% 100%, 100% 100%)',_fill:'#21262d'}},
    card:{name:'Card',icon:'🃏',w:260,h:180,tag:'card',text:'Card Title,Card content goes here. Add more details.',styles:{background:'#161b22',border:'1px solid #21262d',borderRadius:'10px',boxShadow:'0 4px 12px rgba(0,0,0,.3)'}},
  }
};

/* ══════════════════════════════════════
   INIT
   ══════════════════════════════════════ */
function init(){
  canvasEl=document.getElementById('canvas');
  vpEl=document.getElementById('canvas-vp');
  buildLibrary();
  setupEvents();
  zoomFit();
  updateStatus();
}

/* ══════════════════════════════════════
   LIBRARY
   ══════════════════════════════════════ */
function buildLibrary(){
  var list=document.getElementById('lib-list');
  list.innerHTML='';
  Object.keys(TEMPLATES).forEach(function(group){
    var sep=document.createElement('div');sep.className='lib-sep';sep.textContent=group;list.appendChild(sep);
    Object.keys(TEMPLATES[group]).forEach(function(key){
      var t=TEMPLATES[group][key];
      var item=document.createElement('div');
      item.className='lib-item';
      item.innerHTML='<div class="lib-icon">'+t.icon+'</div><span>'+t.name+'</span>';
      item.addEventListener('mousedown',function(e){startLibDrag(e,key,t);});
      list.appendChild(item);
    });
  });
}

/* ══════════════════════════════════════
   ELEMENT CREATION
   ══════════════════════════════════════ */
function createElement(type,template,x,y){
  var el={id:idCounter++,type:type,x:snap(x||0),y:snap(y||0),w:template.w,h:template.h,
    zIndex:++zIndex,styles:Object.assign({},template.styles),
    text:template.text||'',tag:template.tag,name:template.name};
  elements.push(el);
  renderElement(el);
  selectElement(el.id);
  saveUndo('Add '+el.name);
  return el;
}

function renderElement(el){
  var dom=document.getElementById('el-'+el.id);
  if(dom)dom.remove();
  dom=document.createElement('div');
  dom.id='el-'+el.id;
  dom.className='el';
  dom.style.cssText='left:'+el.x+'px;top:'+el.y+'px;width:'+el.w+'px;height:'+el.h+'px;z-index:'+el.zIndex;

  // Build inner content
  var inner='';
  switch(el.tag){
    case 'button':inner='<button style="width:100%;height:100%;border:none;outline:none;font:inherit;cursor:pointer;color:'+el.styles.color+';background:'+el.styles.background+';border-radius:'+(el.styles.borderRadius||'0')+';font-size:'+(el.styles.fontSize||'13px')+';font-weight:'+(el.styles.fontWeight||'normal')+'">'+escHtml(el.text)+'</button>';break;
    case 'input':inner='<input style="width:100%;height:100%;border:none;outline:none;font:inherit;color:'+el.styles.color+';background:'+el.styles.background+';border-radius:'+(el.styles.borderRadius||'0')+';padding:'+(el.styles.padding||'6px 10px')+';font-size:'+(el.styles.fontSize||'13px')+'" placeholder="Input…" readonly>';break;
    case 'textarea':inner='<textarea style="width:100%;height:100%;border:none;outline:none;font:inherit;color:'+el.styles.color+';background:'+el.styles.background+';border-radius:'+(el.styles.borderRadius||'0')+';padding:'+(el.styles.padding||'8px')+';font-size:'+(el.styles.fontSize||'13px')+';resize:none" readonly>'+escHtml(el.text)+'</textarea>';break;
    case 'checkbox':inner='<label style="display:flex;align-items:center;gap:6px;height:100%;cursor:pointer;color:#c9d1d9;font-size:13px"><input type="checkbox" style="accent-color:#3772ff;width:16px;height:16px">'+escHtml(el.text)+'</label>';break;
    case 'select':var opts=(el.text||'Option 1,Option 2').split(',').map(function(o){return '<option>'+escHtml(o.trim())+'</option>';}).join('');inner='<select style="width:100%;height:100%;border:none;outline:none;font:inherit;color:'+el.styles.color+';background:'+el.styles.background+';border-radius:'+(el.styles.borderRadius||'0')+';padding:'+(el.styles.padding||'6px 10px')+';font-size:'+(el.styles.fontSize||'13px')+'" disabled>'+opts+'</select>';break;
    case 'range':inner='<div style="display:flex;align-items:center;height:100%;gap:8px;padding:0 4px"><input type="range" min="0" max="100" value="'+(el.text||'50')+'" style="flex:1;accent-color:#3772ff" disabled><span style="font-size:11px;color:#8b949e;min-width:28px;text-align:right">'+el.text+'</span></div>';break;
    case 'progress':var pct=parseInt(el.text)||60;inner='<div style="width:100%;height:100%;background:#21262d;border-radius:'+(el.styles.borderRadius||'10px')+';overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#3772ff,#58a6ff);border-radius:inherit"></div></div>';break;
    case 'stepper':inner='<div style="display:flex;align-items:center;height:100%;gap:2px"><button style="width:28px;height:100%;border:1px solid #30363d;background:#21262d;color:#c9d1d9;border-radius:4px 0 0 4px;font-size:14px;cursor:default">−</button><div style="flex:1;text-align:center;background:#21262d;border-top:1px solid #30363d;border-bottom:1px solid #30363d;height:100%;display:flex;align-items:center;justify-content:center;font-size:13px">'+el.text+'</div><button style="width:28px;height:100%;border:1px solid #30363d;background:#21262d;color:#c9d1d9;border-radius:0 4px 4px 0;font-size:14px;cursor:default">+</button></div>';break;
    case 'heading':inner='<div style="width:100%;height:100%;display:flex;align-items:center;color:'+el.styles.color+';font-size:'+el.styles.fontSize+';font-weight:'+el.styles.fontWeight+'">'+escHtml(el.text)+'</div>';break;
    case 'paragraph':inner='<div style="width:100%;height:100%;color:'+el.styles.color+';font-size:'+el.styles.fontSize+';line-height:'+el.styles.lineHeight+';overflow:hidden">'+escHtml(el.text)+'</div>';break;
    case 'label':inner='<div style="width:100%;height:100%;display:flex;align-items:center;color:'+el.styles.color+';font-size:'+el.styles.fontSize+';font-weight:'+el.styles.fontWeight+'">'+escHtml(el.text)+'</div>';break;
    case 'icon':inner='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:'+el.styles.fontSize+'">'+el.text+'</div>';break;
    case 'img':inner='<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#484f58;font-size:11px">Image Placeholder</div>';break;
    case 'card':var parts=el.text.split(',');inner='<div style="width:100%;height:100%;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:hidden"><div style="font-size:16px;font-weight:600;color:#e6edf3">'+escHtml(parts[0]||'Card')+'</div><div style="font-size:13px;color:#8b949e;line-height:1.5">'+escHtml(parts[1]||'')+'</div></div>';break;
    default:inner='<div style="width:100%;height:100%"></div>';
  }

  // Apply base styles
  if(el.styles.background&&el.tag!=='button') dom.style.background=el.styles.background;
  if(el.styles.border) dom.style.border=el.styles.border;
  if(el.styles.borderRadius) dom.style.borderRadius=el.styles.borderRadius;
  if(el.styles.boxShadow) dom.style.boxShadow=el.styles.boxShadow;
  if(el.styles.clipPath) dom.style.clipPath=el.styles.clipPath;
  if(el.styles._fill) dom.style.background=el.styles._fill;

  dom.innerHTML=inner+
    '<div class="resize-handle rh-nw" data-r="nw"></div><div class="resize-handle rh-n" data-r="n"></div>'+
    '<div class="resize-handle rh-ne" data-r="ne"></div><div class="resize-handle rh-e" data-r="e"></div>'+
    '<div class="resize-handle rh-se" data-r="se"></div><div class="resize-handle rh-s" data-r="s"></div>'+
    '<div class="resize-handle rh-sw" data-r="sw"></div><div class="resize-handle rh-w" data-r="w"></div>';

  document.getElementById('el-layer').appendChild(dom);
  if(selId===el.id) dom.classList.add('selected');
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function getEl(id){return elements.find(function(e){return e.id===id;});}

/* ══════════════════════════════════════
   SELECTION
   ══════════════════════════════════════ */
function selectElement(id){
  document.querySelectorAll('.el.selected').forEach(function(e){e.classList.remove('selected');});
  selId=id;
  if(id){
    var dom=document.getElementById('el-'+id);
    if(dom) dom.classList.add('selected');
  }
  updateProps();
}

/* ══════════════════════════════════════
   RENDER CONNECTIONS (SVG)
   ══════════════════════════════════════ */
function renderConnections(){
  var svg=document.getElementById('svg-layer');
  svg.querySelectorAll('.conn').forEach(function(c){c.remove();});

  connections.forEach(function(c,i){
    var from=getEl(c.from),to=getEl(c.to);
    if(!from||!to)return;

    var fc={x:from.x+from.w/2,y:from.y+from.h/2};
    var tc={x:to.x+to.w/2,y:to.y+to.h/2};
    var p1=edgePoint(from,tc);
    var p2=edgePoint(to,fc);

    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.classList.add('conn');
    if(selId==='conn-'+i) g.classList.add('selected');

    var path=document.createElementNS('http://www.w3.org/2000/svg','path');
    var d=bezPath(p1.x,p1.y,p2.x,p2.y);
    path.setAttribute('d',d);
    path.classList.add('conn-path');
    path.setAttribute('marker-end',selId==='conn-'+i?'url(#arrowhead-sel)':'url(#arrowhead)');

    var hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d);
    hit.classList.add('conn-path-hit');
    hit.style.pointerEvents='stroke';
    hit.addEventListener('click',function(e){e.stopPropagation();selId='conn-'+i;selectElement(null);updateProps();renderConnections();});

    g.appendChild(hit);
    g.appendChild(path);
    svg.appendChild(g);
  });
}

function edgePoint(el,other){
  var cx=el.x+el.w/2,cy=el.y+el.h/2;
  var dx=other.x-cx,dy=other.y-cy;
  if(Math.abs(dx)<0.1&&Math.abs(dy)<0.1) return{x:cx,y:cy};
  var hw=el.w/2,hh=el.h/2;
  if(Math.abs(dx)*hh>Math.abs(dy)*hw){
    return{x:cx+(dx>0?hw:-hw), y:cy+dy*(dx>0?hw:-hw)/dx};
  } else {
    return{x:cx+dx*(dy>0?hh:-hh)/dy, y:cy+(dy>0?hh:-hh)};
  }
}

function bezPath(x1,y1,x2,y2){
  var dx=x2-x1,dy=y2-y1;
  var off=Math.min(Math.abs(dx)*.5,80);
  return 'M'+x1+' '+y1+' C'+(x1+off)+' '+y1+','+(x2-off)+' '+y2+','+x2+' '+y2;
}

/* ══════════════════════════════════════
   ALIGNMENT GUIDES
   ══════════════════════════════════════ */
function showGuides(el,x,y){
  clearGuides();
  var TOL=5, guides=[];
  var moving={l:x,r:x+el.w,t:y,b:y+el.h,cx:x+el.w/2,cy:y+el.h/2};

  elements.forEach(function(o){
    if(o.id===el.id)return;
    var other={l:o.x,r:o.x+o.w,t:o.y,b:o.y+o.h,cx:o.x+o.w/2,cy:o.y+o.h/2};
    // Vertical guides
    [['l','l'],['l','r'],['r','l'],['r','r'],['cx','cx']].forEach(function(pair){
      if(Math.abs(moving[pair[0]]-other[pair[1]])<TOL){
        guides.push({type:'v',pos:other[pair[1]]});
      }
    });
    // Horizontal guides
    [['t','t'],['t','b'],['b','t'],['b','b'],['cy','cy']].forEach(function(pair){
      if(Math.abs(moving[pair[0]]-other[pair[1]])<TOL){
        guides.push({type:'h',pos:other[pair[1]]});
      }
    });
  });

  var gl=document.getElementById('guide-layer');
  guides.forEach(function(g){
    var div=document.createElement('div');
    div.className='guide '+(g.type==='h'?'guide-h':'guide-v');
    if(g.type==='h') div.style.top=g.pos+'px';
    else div.style.left=g.pos+'px';
    gl.appendChild(div);
  });
}

function clearGuides(){document.getElementById('guide-layer').innerHTML='';}

/* ══════════════════════════════════════
   SNAP
   ══════════════════════════════════════ */
function snap(v){return Math.round(v/GRID)*GRID;}

/* ══════════════════════════════════════
   UNDO / REDO
   ══════════════════════════════════════ */
function saveState(){
  return JSON.stringify({elements:elements,connections:connections,idCounter:idCounter,zIndex:zIndex});
}
function loadState(s){
  var d=JSON.parse(s);
  elements=d.elements;connections=d.connections;idCounter=d.idCounter;zIndex=d.zIndex;
  rebuildCanvas();
}
function saveUndo(name){
  undoStack.push(saveState());
  if(undoStack.length>maxUndo)undoStack.shift();
  redoStack=[];
  updateStatus(name);
}
function undo(){
  if(undoStack.length<=0)return;
  redoStack.push(saveState());
  loadState(undoStack.pop());
  selectElement(null);
}
function redo(){
  if(redoStack.length<=0)return;
  undoStack.push(saveState());
  loadState(redoStack.pop());
  selectElement(null);
}

function rebuildCanvas(){
  document.getElementById('el-layer').innerHTML='';
  elements.forEach(function(el){renderElement(el);});
  renderConnections();
  if(selId&&!getEl(selId)&&selId.indexOf('conn')!==0) selId=null;
  updateProps();
}

/* ══════════════════════════════════════

    return;
  }
  var el=getEl(selId);if(!el)return;
  var s=el.styles;

  p.innerHTML=
    '<div class="pg"><div class="pg-title">General</div>'+
    row('Name','<input type="text" value="'+escAttr(el.name)+'" onchange="updEl(\''+el.id+'\',\'name\',this.value)">')+
    row('Type','<span style="color:#58a6ff">'+el.type+'</span>')+
    row('Z-Index','<input type="number" value="'+el.zIndex+'" style="width:50px" onchange="updEl('+el.id+',\'zIndex\',+this.value);renderElement(getEl('+el.id+'))">')+
    '</div>'+
    '<div class="pg"><div class="pg-title">Transform</div>'+
    row('X','<input type="number" value="'+el.x+'" onchange="updPos('+el.id+',\'x\',+this.value)">')+ 
    row('Y','<input type="number" value="'+el.y+'" onchange="updPos('+el.id+',\'y\',+this.value)">')+
    row('W','<input type="number" value="'+el.w+'" min="'+MIN_SIZE+'" onchange="updPos('+el.id+',\'w\',Math.max(MIN_SIZE,+this.value))">')+
    row('H','<input type="number" value="'+el.h+'" min="'+MIN_SIZE+'" onchange="updPos('+el.id+',\'h\',Math.max(MIN_SIZE,+this.value))">')+
    '</div>'+
    '<div class="pg"><div class="pg-title">Content</div>'+
    (el.tag!=='img'?row('Text','<input type="text" value="'+escAttr(el.text)+'" onchange="updEl('+el.id+',\'text\',this.value);renderElement(getEl('+el.id+'))">'):'')+
    '</div>'+
    '<div class="pg"><div class="pg-title">Appearance</div>'+
    row('Fill','<input type="color" value="'+colorVal(s.background||'#21262d')+'" onchange="updStyle('+el.id+',\'background\',this.value)">')+
    row('Border','<div class="row2"><input type="color" value="'+colorVal(s.borderColor||'#30363d')+'" onchange="updStyle('+el.id+',\'border\',this.value+\' solid 2px\')" style="width:28px;flex:0"><input type="number" value="'+(parseInt(s.borderWidth)||2)+'" min="0" max="20" style="width:42px" onchange="updBorder('+el.id+',this.value)"></div>')+
    row('Radius','<input type="number" value="'+(parseInt(s.borderRadius)||0)+'" min="0" max="200" onchange="updStyle('+el.id+',\'borderRadius\',this.value+\'px\');renderElement(getEl('+el.id+'))">')+
    row('Shadow','<input type="text" value="'+escAttr(s.boxShadow||'none')+'" onchange="updStyle('+el.id+',\'boxShadow\',this.value)">')+
    '</div>'+
    '<div class="pg"><div class="pg-title">Text</div>'+
    row('Color','<input type="color" value="'+colorVal(s.color||'#c9d1d9')+'" onchange="updStyle('+el.id+',\'color\',this.value);renderElement(getEl('+el.id+'))">')+
    row('Size','<input type="number" value="'+(parseInt(s.fontSize)||13)+'" min="8" max="72" onchange="updStyle('+el.id+',\'fontSize\',this.value+\'px\');renderElement(getEl('+el.id+'))">')+
    row('Weight','<select onchange="updStyle('+el.id+',\'fontWeight\',this.value);renderElement(getEl('+el.id+'))"><option value="400"'+(s.fontWeight==='400'||!s.fontWeight?' selected':'')+'>Normal</option><option value="600"'+(s.fontWeight==='600'?' selected':'')+'>Semi Bold</option><option value="700"'+(s.fontWeight==='700'?' selected':'')+'>Bold</option></select>')+
    '</div>'+
    '<div class="pg"><div class="pg-title">Actions</div>'+
    '<div class="pr"><button onclick="duplicateSelected()" style="flex:1">Duplicate</button><button onclick="deleteSelected()" style="flex:1;color:#f85149">Delete</button></div>'+
    '<div class="pr"><button onclick="bringForward()" style="flex:1">Bring Forward</button><button onclick="sendBackward()" style="flex:1">Send Back</button></div>'+

}

function row(label,content){return '<div class="pr"><label>'+label+'</label>'+content+'</div>';}
function escAttr(s){return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function colorVal(c){
  if(!c||c==='transparent'||c==='none')return'#21262d';
  if(c.indexOf('#')===0&&c.length>=7)return c.substring(0,7);
  // try to parse rgb
  var m=c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(m)return '#'+(+m[1]).toString(16).padStart(2,'0')+(+m[2]).toString(16).padStart(2,'0')+(+m[3]).toString(16).padStart(2,'0');
  return '#21262d';
}

function updEl(id,prop,val){
  var el=getEl(typeof id==='string'?parseInt(id):id);if(!el)return;
  el[prop]=val;
  renderElement(el);
  saveUndo('Edit '+prop);
}

function updPos(id,prop,val){
  var el=getEl(id);if(!el)return;
  el[prop]=snap(val);
  renderElement(el);
  renderConnections();
  updateProps();
  saveUndo('Move');
}

function updStyle(id,prop,val){
  var el=getEl(id);if(!el)return;
  el.styles[prop]=val;
  renderElement(el);
  saveUndo('Style '+prop);
}

function updBorder(id,val){
  var el=getEl(id);if(!el)return;
  var bc=el.styles.borderColor||'#30363d';
  el.styles.border=val+'px solid '+bc;
  el.styles.borderWidth=val;
  renderElement(el);
  saveUndo('Border');
}

function deleteConn(){
  selId=null;renderConnections();updateProps();
  // Remove last selected connection
  connections.pop();
  renderConnections();saveUndo('Delete connection');
}

/* ══════════════════════════════════════
   ELEMENT OPERATIONS
   ══════════════════════════════════════ */
function deleteSelected(){
  if(!selId)return;
  if(selId.indexOf('conn')===0){
    var idx=parseInt(selId.split('-')[1]);
    connections.splice(idx,1);
    selId=null;renderConnections();updateProps();saveUndo('Delete connection');return;
  }
  // Remove connections involving this element
  connections=connections.filter(function(c){return c.from!==selId&&c.to!==selId;});
  elements=elements.filter(function(e){return e.id!==selId;});
  var dom=document.getElementById('el-'+selId);if(dom)dom.remove();
  selId=null;renderConnections();updateProps();saveUndo('Delete');
}

function duplicateSelected(){
  if(!selId||selId.indexOf('conn')===0)return;
  var src=getEl(selId);if(!src)return;
  var dup=Object.assign({},JSON.parse(JSON.stringify(src)));
  dup.id=idCounter++;dup.x+=GRID*2;dup.y+=GRID*2;dup.zIndex=++zIndex;dup.name=src.name+' copy';
  elements.push(dup);renderElement(dup);selectElement(dup.id);saveUndo('Duplicate');
}

function bringForward(){
  if(!selId)return;var el=getEl(selId);if(!el)return;
  el.zIndex=++zIndex;renderElement(el);saveUndo('Bring forward');
}
function sendBackward(){
  if(!selId)return;var el=getEl(selId);if(!el)return;
  el.zIndex=Math.max(1,el.zIndex-2);renderElement(el);saveUndo('Send backward');
}

function alignSelected(type){
  if(!selId||selId.indexOf('conn')===0)return;
  var el=getEl(selId);if(!el)return;
  switch(type){
    case'left':el.x=snap(0);break;case'centerH':el.x=snap((CANVAS_W-el.w)/2);break;
    case'right':el.x=snap(CANVAS_W-el.w);break;case'top':el.y=snap(0);break;
    case'centerV':el.y=snap((CANVAS_H-el.h)/2);break;case'bottom':el.y=snap(CANVAS_H-el.h);break;
  }
  renderElement(el);renderConnections();updateProps();saveUndo('Align '+type);
}

/* ══════════════════════════════════════
   EVENTS
   ══════════════════════════════════════ */
function setupEvents(){
  var canvasInner=document.getElementById('canvas-inner');

  // Canvas mouse events
  canvasInner.addEventListener('mousedown',onCanvasDown);
  document.addEventListener('mousemove',onDocMove);
  document.addEventListener('mouseup',onDocUp);
  document.addEventListener('keydown',onKeyDown);

  // Zoom
  vpEl.addEventListener('wheel',function(e){
    if(e.ctrlKey||e.metaKey){
      e.preventDefault();
      var d=e.deltaY>0?-1:1;
      zoom=Math.max(.1,Math.min(5,zoom+d*.1));
      applyZoom();
    }
  },{passive:false});

  // Context menu prevention
  canvasInner.addEventListener('contextmenu',function(e){e.preventDefault();});
}

function canvasXY(e){
  var rect=canvasEl.getBoundingClientRect();
  return{x:(e.clientX-rect.left)/zoom, y:(e.clientY-rect.top)/zoom};
}

function onCanvasDown(e){
  if(editingText)return;
  var pos=canvasXY(e);
  var target=e.target;

  // Connection mode
  if(tool==='connect'){
    var elDom=target.closest('.el');
    if(elDom){
      var id=parseInt(elDom.id.replace('el-',''));
      if(!connDraw){
        connDraw={fromId:id};
        document.getElementById('status-left').textContent='Click another element to connect';
      } else {
        if(id!==connDraw.fromId){
          connections.push({from:connDraw.fromId,to:id});
          renderConnections();
          saveUndo('Connect');
        }
        connDraw=null;
        document.getElementById('status-left').textContent='Connect mode';
      }
    }
    return;
  }

  // Resize handle
  if(target.classList.contains('resize-handle')){
    var elDom=target.closest('.el');
    var el=getEl(parseInt(elDom.id.replace('el-','')));
    if(el){
      e.stopPropagation();
      resize={el:el,dir:target.dataset.r,sx:pos.x,sy:pos.y,ox:el.x,oy:el.y,ow:el.w,oh:el.h};
    }
    return;
  }

  // Click on element
  var elDom=target.closest('.el');
  if(elDom){
    var el=getEl(parseInt(elDom.id.replace('el-','')));
    if(el){
      e.stopPropagation();
      selectElement(el.id);
      if(tool==='select'){
        drag={el:el,ox:pos.x-el.x,oy:pos.y-el.y,startX:el.x,startY:el.y};
      }
    }
    return;
  }

  // Click on canvas (deselect)
  selectElement(null);
}

function onDocMove(e){
  if(drag){
    var pos=canvasXY(e);
    var nx=snap(pos.x-drag.ox);
    var ny=snap(pos.y-drag.oy);
    nx=Math.max(0,Math.min(CANVAS_W-drag.el.w,nx));
    ny=Math.max(0,Math.min(CANVAS_H-drag.el.h,ny));
    drag.el.x=nx;drag.el.y=ny;
    var dom=document.getElementById('el-'+drag.el.id);
    if(dom){dom.style.left=nx+'px';dom.style.top=ny+'px';}
    renderConnections();
    showGuides(drag.el,nx,ny);
  }
  if(resize){
    var pos=canvasXY(e);
    var r=resize,el=r.el;
    var dx=pos.x-r.sx,dy=pos.y-r.sy;
    var nx=r.ox,ny=r.oy,nw=r.ow,nh=r.oh;
    if(r.dir.includes('e')){nw=snap(Math.max(MIN_SIZE,r.ow+dx));}
    if(r.dir.includes('w')){nw=snap(Math.max(MIN_SIZE,r.ow-dx));nx=snap(r.ox+r.ow-nw);}
    if(r.dir.includes('s')){nh=snap(Math.max(MIN_SIZE,r.oh+dy));}
    if(r.dir.includes('n')){nh=snap(Math.max(MIN_SIZE,r.oh-dy));ny=snap(r.oy+r.oh-nh);}
    el.x=nx;el.y=ny;el.w=nw;el.h=nh;
    var dom=document.getElementById('el-'+el.id);
    if(dom){dom.style.left=nx+'px';dom.style.top=ny+'px';dom.style.width=nw+'px';dom.style.height=nh+'px';}
    renderConnections();
    updateProps();
  }
  if(connDraw){
    // Draw temp line
    var pos=canvasXY(e);
    var from=getEl(connDraw.fromId);
    if(from){
      var fp=edgePoint(from,pos);
      var svg=document.getElementById('temp-line');
      svg.innerHTML='<line x1="'+fp.x+'" y1="'+fp.y+'" x2="'+pos.x+'" y2="'+pos.y+'" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 4" opacity=".7"/>';
    }
  }
}

function onDocUp(e){
  if(drag){
    clearGuides();
    if(drag.startX!==drag.el.x||drag.startY!==drag.el.y){
      saveUndo('Move');
    }
    drag=null;updateProps();
  }
  if(resize){saveUndo('Resize');resize=null;updateProps();}
}

function onKeyDown(e){
  if(editingText)return;
  var ctrl=e.ctrlKey||e.metaKey;

  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelected();}
  else if(ctrl&&e.key==='z'){e.preventDefault();undo();}
  else if(ctrl&&e.key==='y'){e.preventDefault();redo();}
  else if(ctrl&&e.key==='d'){e.preventDefault();duplicateSelected();}
  else if(ctrl&&e.key==='a'){e.preventDefault();/* could select all */}
  else if(e.key==='v'||e.key==='V'){setTool('select');}
  else if(e.key==='c'||e.key==='C'){if(!ctrl)setTool('connect');}
  else if(e.key==='Escape'){connDraw=null;document.getElementById('temp-line').innerHTML='';
    document.getElementById('status-left').textContent=tool==='connect'?'Connect mode':'Ready';}
  else if(e.key==='+'||e.key==='='){zoomIn();}
  else if(e.key==='-'){zoomOut();}
}

/* ══════════════════════════════════════
   LIBRARY DRAG
   ══════════════════════════════════════ */
function startLibDrag(e,type,template){
  e.preventDefault();
  var ghost=document.createElement('div');
  ghost.style.cssText='position:fixed;z-index:10000;background:rgba(88,166,255,.2);border:2px dashed #58a6ff;border-radius:4px;pointer-events:none;width:'+template.w+'px;height:'+template.h+'px;display:none';
  document.body.appendChild(ghost);

  var onMove=function(e2){
    ghost.style.display='block';
    ghost.style.left=(e2.clientX-template.w/2)+'px';
    ghost.style.top=(e2.clientY-template.h/2)+'px';
  };
  var onUp=function(e2){
    ghost.remove();
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);

    var canvasRect=canvasEl.getBoundingClientRect();
    var x=(e2.clientX-canvasRect.left)/zoom-template.w/2;
    var y=(e2.clientY-canvasRect.top)/zoom-template.h/2;

    if(x>=-50&&y>=-50&&x<CANVAS_W+50&&y<CANVAS_H+50){
      createElement(type,template,Math.max(0,x),Math.max(0,y));
    }
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

/* ══════════════════════════════════════
   ZOOM
   ══════════════════════════════════════ */
function applyZoom(){
  canvasEl.style.transform='scale('+zoom+')';
  document.getElementById('zoom-info').textContent=Math.round(zoom*100)+'%';
}
function zoomIn(){zoom=Math.min(5,zoom+.2);applyZoom();}
function zoomOut(){zoom=Math.max(.1,zoom-.2);applyZoom();}
function zoomFit(){
  var vw=vpEl.clientWidth,vh=vpEl.clientHeight;
  zoom=Math.min(vw/(CANVAS_W+40),vh/(CANVAS_H+40),1);
  applyZoom();
}

/* ══════════════════════════════════════
   TOOL
   ══════════════════════════════════════ */
function setTool(t){
  tool=t;connDraw=null;document.getElementById('temp-line').innerHTML='';
  document.querySelectorAll('.tool-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('tool-'+t).classList.add('active');
  document.getElementById('status-left').textContent=t==='connect'?'Connect mode — click two elements':'Ready';
}

/* ══════════════════════════════════════
   STATUS
   ══════════════════════════════════════ */
function updateStatus(action){
  if(action) document.getElementById('status-left').textContent=action;
  document.getElementById('status-right').textContent='Elements: '+elements.length+' · Connections: '+connections.length+' · Grid: '+GRID+'px · Zoom: '+Math.round(zoom*100)+'%';
}

/* ══════════════════════════════════════
   EXPORT
   ══════════════════════════════════════ */
function exportHTML(){
  var elHTML='';
  elements.forEach(function(el){
    elHTML+=buildExportElement(el);
  });

  // Connection SVG
  var connSVG='';
  if(connections.length){
    connSVG='<svg style="position:absolute;top:0;left:0;width:'+CANVAS_W+'px;height:'+CANVAS_H+'px;z-index:1;pointer-events:none;overflow:visible">\n';
    connections.forEach(function(c){
      var from=getEl(c.from),to=getEl(c.to);if(!from||!to)return;
      var fc={x:from.x+from.w/2,y:from.y+from.h/2};
      var tc={x:to.x+to.w/2,y:to.y+to.h/2};
      var p1=edgePoint(from,tc),p2=edgePoint(to,fc);
      connSVG+='  <path d="'+bezPath(p1.x,p1.y,p2.x,p2.y)+'" fill="none" stroke="#3772ff" stroke-width="2" marker-end="url(#expArrow)"/>\n';
    });
    connSVG+='  <defs><marker id="expArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3772ff"/></marker></defs>\n';
    connSVG+='</svg>\n';
  }

  var html='<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Exported UI</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box}\nbody{background:#0d1117;font-family:\'Segoe UI\',system-ui,sans-serif;display:flex;justify-content:center;padding:40px}\n#canvas{position:relative;width:'+CANVAS_W+'px;height:'+CANVAS_H+'px;background:#1c2128;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #30363d}\n'+getExportStyles()+'\n</style>\n</head>\n<body>\n<div id="canvas">\n'+connSVG+elHTML+'</div>\n</body>\n</html>';

  var blob=new Blob([html],{type:'text/html'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='ui-export.html';
  a.click();
  URL.revokeObjectURL(a.href);
  document.getElementById('status-left').textContent='Exported!';
  setTimeout(function(){updateStatus();},2000);
}

function buildExportElement(el){
  var s=el.styles;
  var base='position:absolute;left:'+el.x+'px;top:'+el.y+'px;width:'+el.w+'px;height:'+el.h+'px;';
  if(s.borderRadius&&s.borderRadius!=='0') base+='border-radius:'+s.borderRadius+';';
  if(s.boxShadow&&s.boxShadow!=='none') base+='box-shadow:'+s.boxShadow+';';
  if(s.background&&s.background!=='transparent') base+='background:'+s.background+';';
  if(s.border&&s.border!=='none') base+='border:'+s.border+';';
  if(s.clipPath) base+='clip-path:'+s.clipPath+';';
  if(s.color) base+='color:'+s.color+';';
  if(s.fontSize) base+='font-size:'+s.fontSize+';';
  if(s.fontWeight) base+='font-weight:'+s.fontWeight+';';
  if(s.zIndex) base+='z-index:'+el.zIndex+';';

  var inner='';
  switch(el.tag){
    case'button':inner='<button style="width:100%;height:100%;border:none;background:inherit;color:inherit;border-radius:inherit;font:inherit;cursor:pointer">'+escHtml(el.text)+'</button>';break;
    case'input':inner='<input placeholder="Input…" style="width:100%;height:100%;border:none;background:inherit;color:inherit;border-radius:inherit;padding:'+(s.padding||'6px 10px')+';font:inherit;outline:none">';break;
    case'textarea':inner='<textarea placeholder="Type…" style="width:100%;height:100%;border:none;background:inherit;color:inherit;border-radius:inherit;padding:'+(s.padding||'8px')+';font:inherit;resize:none;outline:none">'+escHtml(el.text)+'</textarea>';break;
    case'checkbox':inner='<label style="display:flex;align-items:center;gap:6px;height:100%;cursor:pointer"><input type="checkbox" style="accent-color:#3772ff;width:16px;height:16px">'+escHtml(el.text)+'</label>';break;
    case'select':inner='<select style="width:100%;height:100%;border:none;background:inherit;color:inherit;border-radius:inherit;padding:'+(s.padding||'6px 10px')+';font:inherit;outline:none">'+el.text.split(',').map(function(o){return '<option>'+escHtml(o.trim())+'</option>';}).join('')+'</select>';break;
    case'range':inner='<div style="display:flex;align-items:center;height:100%;gap:8px;padding:0 8px"><input type="range" min="0" max="100" value="'+(el.text||'50')+'" style="flex:1;accent-color:#3772ff"><span style="font-size:11px;color:#8b949e">'+el.text+'</span></div>';break;
    case'progress':var pct=parseInt(el.text)||60;inner='<div style="width:100%;height:100%;background:#21262d;border-radius:inherit;overflow:hidden"><div style="width:'+pct+'%;height:100%;background:linear-gradient(90deg,#3772ff,#58a6ff)"></div></div>';break;
    case'stepper':inner='<div style="display:flex;align-items:center;height:100%;gap:0"><button style="width:28px;height:100%;border:1px solid #30363d;background:#21262d;color:#c9d1d9;border-radius:4px 0 0 4px;font-size:14px">−</button><div style="flex:1;text-align:center;background:#21262d;border-top:1px solid #30363d;border-bottom:1px solid #30363d;height:100%;display:flex;align-items:center;justify-content:center">'+el.text+'</div><button style="width:28px;height:100%;border:1px solid #30363d;background:#21262d;color:#c9d1d9;border-radius:0 4px 4px 0;font-size:14px">+</button></div>';break;
    case'heading':inner='<div style="display:flex;align-items:center;height:100%">'+escHtml(el.text)+'</div>';break;
    case'paragraph':inner='<div style="line-height:'+(s.lineHeight||'1.6')+';overflow:hidden">'+escHtml(el.text)+'</div>';break;
    case'label':inner='<div style="display:flex;align-items:center;height:100%">'+escHtml(el.text)+'</div>';break;
    case'icon':inner='<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:'+(s.fontSize||'20px')+'">'+el.text+'</div>';break;
    case'img':inner='<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#484f58">Image</div>';break;
    case'card':var cp=el.text.split(',');inner='<div style="padding:16px;display:flex;flex-direction:column;gap:8px;height:100%;overflow:hidden"><div style="font-size:16px;font-weight:600;color:#e6edf3">'+escHtml(cp[0]||'Card')+'</div><div style="font-size:13px;color:#8b949e;line-height:1.5">'+escHtml(cp[1]||'')+'</div></div>';break;
    default:inner='';
  }
  return '<div style="'+escAttr(base)+'">'+inner+'</div>\n';
}

function getExportStyles(){
  return '*{font-family:\'Segoe UI\',system-ui,sans-serif}\ninput,textarea,select{font-family:inherit}\nbutton{cursor:pointer}\n';
}
