<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Builder - Figma-like Drag & Drop Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Toolbar */
        #toolbar {
            height: 50px;
            background: #2d2d30;
            border-bottom: 1px solid #3e3e42;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
            z-index: 100;
        }

        .toolbar-btn {
            padding: 6px 12px;
            background: #3e3e42;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }

        .toolbar-btn:hover {
            background: #4a4a4e;
        }

        .toolbar-btn.active {
            background: #007acc;
        }

        .toolbar-divider {
            width: 1px;
            height: 20px;
            background: #666;
        }

        /* Main Workspace */
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Components Sidebar */
        #components {
            width: 220px;
            background: #2d2d30;
            border-right: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .component-category {
            padding: 10px 15px;
            font-weight: bold;
            color: #a0a0a0;
            font-size: 12px;
            text-transform: uppercase;
        }

        .component-item {
            padding: 10px;
            margin: 5px 10px;
            background: #3e3e42;
            border-radius: 4px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            transition: transform 0.1s;
        }

        .component-item:hover {
            transform: translateX(3px);
            background: #4a4a4e;
        }

        .component-item:active {
            cursor: grabbing;
        }

        /* Canvas Area */
        #canvas-container {
            flex: 1;
            background: #e0e0e0;
            overflow: auto;
            position: relative;
            cursor: crosshair;
        }

        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            background: white;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Properties Panel */
        #properties {
            width: 300px;
            background: #2d2d30;
            border-left: 1px solid #3e3e42;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .panel-section {
            padding: 15px;
            border-bottom: 1px solid #3e3e42;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #e0e0e0;
        }

        .property {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
        }

        .property-label {
            font-size: 12px;
            color: #a0a0a0;
            margin-bottom: 4px;
        }

        .property-input {
            padding: 6px;
            background: #3e3e42;
            border: 1px solid #4a4a4e;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 13px;
        }

        select.property-input {
            background: #3e3e42;
            color: #e0e0e0;
        }

        input[type="range"] {
            width: 100%;
        }

        /* Canvas Controls */
        #canvas-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.9);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            border-radius: 4px;
            border: none;
            background: #3e3e42;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: #4a4a4e;
        }

        /* Connection Mode */
        .connection-line {
            position: absolute;
            pointer-events: none;
            stroke: #007acc;
            stroke-width: 2;
            fill: none;
        }

        /* Snap Grid */
        .snap-point {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #007acc;
            border-radius: 50%;
            pointer-events: none;
            display: none;
        }

        /* Resize Handles */
        .resize-handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #007acc;
            border: 1px solid white;
            border-radius: 2px;
            cursor: nwse-resize;
            z-index: 1000;
            display: none;
        }

        .resize-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .resize-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .resize-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .resize-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }

        /* Hidden file input for export */
        #export-input {
            display: none;
        }

        /* Loading overlay */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #3e3e42;
            border-top: 5px solid #007acc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Component icons (using simple text representations) */
        .icon { font-style: italic; opacity: 0.7; font-size: 11px; }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div id="toolbar">
        <button class="toolbar-btn" onclick="toggleConnectionMode()" id="connectionBtn">Connection Mode</button>
        <button class="toolbar-btn" onclick="toggleGridSnap()" id="gridBtn">Snap to Grid: ON</button>
        <button class="toolbar-btn" onclick="toggleAlignGuides()" id="alignBtn">Align Guides: ON</button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" onclick="deleteSelected()">Delete</button>
        <button class="toolbar-btn" onclick="duplicateSelected()">Duplicate</button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" onclick="exportHTML()">Export HTML</button>
        <button class="toolbar-btn" onclick="clearCanvas()">Clear All</button>
        <div class="toolbar-divider"></div>
        <span style="font-size: 12px; color: #a0a0a0;">Selected: <span id="selectedInfo" style="color: #e0e0e0;">None</span></span>
    </div>

    <div id="workspace">
        <!-- Components Sidebar -->
        <div id="components">
            <div class="component-category">Basic Shapes</div>
            <div class="component-item" draggable="true" data-type="shape" data-shape="rect">Rectangle</div>
            <div class="component-item" draggable="true" data-type="shape" data-shape="circle">Circle</div>
            <div class="component-item" draggable="true" data-type="shape" data-shape="triangle">Triangle</div>
            <div class="component-item" draggable="true" data-type="shape" data-shape="line">Line</div>
            
            <div class="component-category">Form Components</div>
            <div class="component-item" draggable="true" data-type="button" data-style="primary">Button (Primary)</div>
            <div class="component-item" draggable="true" data-type="button" data-style="secondary">Button (Secondary)</div>
            <div class="component-item" draggable="true" data-type="input">Text Input</div>
            <div class="component-item" draggable="true" data-type="checkbox">Checkbox</div>
            <div class="component-item" draggable="true" data-type="select">Dropdown</div>
            <div class="component-item" draggable="true" data-type="slider">Slider</div>
            <div class="component-item" draggable="true" data-type="stepper">Stepper</div>
            <div class="component-item" draggable="true" data-type="progress">Progress Bar</div>
            
            <div class="component-category">Text</div>
            <div class="component-item" draggable="true" data-type="text" data-style="heading">Heading</div>
            <div class="component-item" draggable="true" data-type="text" data-style="paragraph">Paragraph</div>
            <div class="component-item" draggable="true" data-type="text" data-style="label">Label</div>
        </div>

        <!-- Canvas Container -->
        <div id="canvas-container">
            <div id="canvas"></div>
        </div>

        <!-- Properties Panel -->
        <div id="properties">
            <div class="panel-section">
                <div class="panel-title">Position & Size</div>
                <div class="property">
                    <label>X Position</label>
                    <input type="number" id="propX" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>Y Position</label>
                    <input type="number" id="propY" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>Width</label>
                    <input type="number" id="propWidth" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>Height</label>
                    <input type="number" id="propHeight" class="property-input" onchange="updateSelected()">
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Appearance</div>
                <div class="property">
                    <label>Background Color</label>
                    <input type="color" id="propBgColor" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>Text Color</label>
                    <input type="color" id="propTextColor" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>Border Radius</label>
                    <input type="range" id="propBorderRadius" min="0" max="50" value="0" oninput="updateSelected()">
                </div>
                <div class="property">
                    <label>Box Shadow</label>
                    <select id="propBoxShadow" class="property-input" onchange="updateSelected()">
                        <option value="none">None</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Content</div>
                <div class="property">
                    <label>Text / Content</label>
                    <input type="text" id="propText" class="property-input" onchange="updateSelected()">
                </div>
                <div class="property">
                    <label>HTML (advanced)</label>
                    <textarea id="propHTML" class="property-input" rows="3" onchange="updateSelected()"></textarea>
                </div>
            </div>

            <div class="panel-section">
                <div class="panel-title">Flowchart</div>
                <div class="property">
                    <label>Start Connection</label>
                    <select id="propStartConn" class="property-input" onchange="updateSelected()">
                        <option value="">None</option>
                        <option value="top">Top</option>
                        <option value="right">Right</option>
                        <option value="bottom">Bottom</option>
                        <option value="left">Left</option>
                    </select>
                </div>
                <div class="property">
                    <label>End Connection</label>
                    <select id="propEndConn" class="property-input" onchange="updateSelected()">
                        <option value="">None</option>
                        <option value="top">Top</option>
                        <option value="right">Right</option>
                        <option value="bottom">Bottom</option>
                        <option value="left">Left</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas Controls -->
    <div id="canvas-controls">
        <button class="control-btn" onclick="zoomIn()" title="Zoom In">+</button>
        <button class="control-btn" onclick="zoomOut()" title="Zoom Out">−</button>
        <button class="control-btn" onclick="resetZoom()" title="Reset Zoom">⟲</button>
        <button class="control-btn" onclick="toggleGrid()" title="Toggle Grid">◼</button>
    </div>

    <!-- Loading Overlay -->
    <div id="loading">
        <div class="spinner"></div>
        <p>Generating HTML...</p>
    </div>

    <!-- Hidden input for export -->
    <input type="file" id="export-input" accept=".html">

    <script>
        // ========== Application State ==========
        const state = {
            canvas: {
                width: 1200,
                height: 800,
                gridSize: 20,
                snapToGrid: true,
                alignGuides: true,
                zoom: 1,
                gridVisible: true
            },
            elements: [],
            connections: [],
            selectedElement: null,
            connectionMode: false,
            connectionStart: null,
            tempConnectionLine: null,
            dragInfo: {
                isDragging: false,
                isResizing: false,
                startX: 0,
                startY: 0,
                initialLeft: 0,
                initialTop: 0,
                initialWidth: 0,
                initialHeight: 0,
                handle: null
            }
        };

        // ========== Initialization ==========
        document.addEventListener('DOMContentLoaded', function() {
            initCanvas();
            initDragDrop();
            initPropertiesPanel();
            initCanvasControls();
            render();
        });

        function initCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.style.width = state.canvas.width + 'px';
            canvas.style.height = state.canvas.height + 'px';
            
            // Draw grid
            drawGrid();
        }

        function drawGrid() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const gridSize = state.canvas.gridSize;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw light gray grid
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            
            for (let y = 0; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // ========== Drag and Drop ==========
        function initDragDrop() {
            const components = document.querySelectorAll('.component-item');
            const canvas = document.getElementById('canvas-container');
            
            components.forEach(item => {
                item.addEventListener('dragstart', handleDragStart);
            });
            
            canvas.addEventListener('dragover', handleDragOver);
            canvas.addEventListener('dragenter', handleDragEnter);
            canvas.addEventListener('drop', handleDrop);
        }

        function handleDragStart(e) {
            e.dataTransfer.setData('component', JSON.stringify({
                type: this.dataset.type,
                shape: this.dataset.shape,
                style: this.dataset.style
            }));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        }

        function handleDragEnter(e) {
            e.preventDefault();
        }

        function handleDrop(e) {
            e.preventDefault();
            const data = e.dataTransfer.getData('component');
            if (!data) return;
            
            const component = JSON.parse(data);
            const rect = document.getElementById('canvas-container).getBoundingClientRect();
            const x = (e.clientX - rect.left - state.canvas.width/2) * state.canvas.zoom + state.canvas.width/2;
            const y = (e.clientY - rect.top - state.canvas.height/2) * state.canvas.zoom + state.canvas.height/2;
            
            // Snap to grid
            const snapX = Math.round(x / state.canvas.gridSize) * state.canvas.gridSize;
            const snapY = Math.round(y / state.canvas.gridSize) * state.canvas.gridSize;
            
            createElement(component, snapX, snapY);
        }

        // ========== Element Management ==========
        function createElement(component, x, y) {
            const element = {
                id: Date.now() + Math.random(),
                type: component.type,
                shape: component.shape,
                style: component.style,
                x: x,
                y: y,
                width: getInitialWidth(component),
                height: getInitialHeight(component),
                backgroundColor: getBackgroundColor(component),
                textColor: '#333333',
                borderRadius: 0,
                boxShadow: 'none',
                text: getInitialText(component),
                html: getInitialHTML(component),
                startConnection: null,
                endConnection: null
            };
            
            state.elements.push(element);
            renderElement(element);
            saveHistory();
        }

        function getInitialWidth(component) {
            switch(component.type) {
                case 'button': return 120;
                case 'input': return 200;
                case 'checkbox': return 20;
                case 'select': return 150;
                case 'slider': return 200;
                case 'stepper': return 100;
                case 'progress': return 200;
                case 'text': return 100;
                default: return 100;
            }
        }

        function getInitialHeight(component) {
            switch(component.type) {
                case 'button': return 36;
                case 'input': return 36;
                case 'checkbox': return 20;
                case 'select': return 36;
                case 'slider': return 36;
                case 'stepper': return 30;
                case 'progress': return 20;
                case 'text': return 20;
                default: return 100;
            }
        }

        function getBackgroundColor(component) {
            switch(component.type) {
                case 'button':
                    return component.style === 'primary' ? '#007acc' : '#6e7478';
                case 'checkbox':
                    return '#ffffff';
                default:
                    return '#ffffff';
            }
        }

        function getInitialText(component) {
            switch(component.type) {
                case 'button':
                    return component.style === 'primary' ? 'Button' : 'Secondary';
                case 'checkbox':
                    return '✓';
                case 'text':
                    return component.style === 'heading' ? 'Heading' : 
                           component.style === 'paragraph' ? 'Lorem ipsum dolor sit amet...' : 
                           'Label';
                default:
                    return '';
            }
        }

        function getInitialHTML(component) {
            switch(component.type) {
                case 'stepper':
                    return `<div style="display:flex;align-items:center;justify-content:space-between;width:100%;height:100%;">
                        <button style="width:30px;height:100%;background:#ddd;border:none;cursor:pointer;">-</button>
                        <span style="width:40px;text-align:center;">0</span>
                        <button style="width:30px;height:100%;background:#ddd;border:none;cursor:pointer;">+</button>
                    </div>`;
                case 'slider':
                    return `<input type="range" min="0" max="100" value="50" style="width:100%;height:100%;">`;
                case 'progress':
                    return `<div style="width:100%;height:100%;background:#e0e0e0;border-radius:2px;">
                        <div style="width:60%;height:100%;background:#007acc;"></div>
                    </div>`;
                default:
                    return '';
            }
        }

        function renderElement(element) {
            const canvas = document.getElementById('canvas');
            const el = document.createElement('div');
            el.id = `el-${element.id}`;
            el.className = 'canvas-element';
            el.style.position = 'absolute';
            el.style.left = element.x + 'px';
            el.style.top = element.y + 'px';
            el.style.width = element.width + 'px';
            el.style.height = element.height + 'px';
            el.style.backgroundColor = element.backgroundColor;
            el.style.color = element.textColor;
            el.style.borderRadius = element.borderRadius + 'px';
            el.style.boxShadow = getBoxShadowStyle(element.boxShadow);
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';
            el.style.cursor = 'move';
            el.style.fontSize = '14px';
            el.style.fontFamily = 'Segoe UI, sans-serif';
            el.style.overflow = 'hidden';
            el.style.userSelect = 'none';
            el.style.zIndex = '10';
            
            // Add content
            if (element.html) {
                el.innerHTML = element.html;
            } else {
                el.textContent = element.text;
            }
            
            // Add resize handles if selected
            if (state.selectedElement === element) {
                addResizeHandles(el);
            }
            
            // Add event listeners for interaction
            el.addEventListener('mousedown', handleElementMouseDown);
            
            canvas.appendChild(el);
        }

        function getBoxShadowStyle(shadow) {
            switch(shadow) {
                case 'small': return '0 2px 4px rgba(0,0,0,0.2)';
                case 'medium': return '0 4px 8px rgba(0,0,0,0.3)';
                case 'large': return '0 8px 16px rgba(0,0,0,0.4)';
                default: return 'none';
            }
        }

        function addResizeHandles(el) {
            // Remove existing handles
            const existing = el.querySelectorAll('.resize-handle');
            existing.forEach(h => h.remove());
            
            const handles = ['nw', 'ne', 'sw', 'se'];
            handles.forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle ${pos}`;
                handle.dataset.position = pos;
                handle.addEventListener('mousedown', (e) => startResize(e, el, pos));
                el.appendChild(handle);
            });
        }

        // ========== Element Interaction ==========
        function handleElementMouseDown(e) {
            if (e.target.classList.contains('resize-handle')) return;
            
            const el = e.currentTarget;
            const elementId = parseFloat(el.id.replace('el-', ''));
            const element = state.elements.find(el => el.id === elementId);
            
            if (!element) return;
            
            // Select element
            selectElement(element);
            
            // Start dragging
            state.dragInfo = {
                isDragging: true,
                isResizing: false,
                startX: e.clientX,
                startY: e.clientY,
                initialLeft: element.x,
                initialTop: element.y,
                initialWidth: element.width,
                initialHeight: element.height,
                handle: null
            };
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function startResize(e, el, handle) {
            e.stopPropagation();
            const elementId = parseFloat(el.id.replace('el-', ''));
            const element = state.elements.find(el => el.id === elementId);
            
            state.dragInfo = {
                isDragging: false,
                isResizing: true,
                startX: e.clientX,
                startY: e.clientY,
                initialLeft: element.x,
                initialTop: element.y,
                initialWidth: element.width,
                initialHeight: element.height,
                handle: handle
            };
            
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
        }

        function handleMouseMove(e) {
            if (!state.dragInfo.isDragging && !state.dragInfo.isResizing) return;
            
            const el = document.getElementById(`el-${state.selectedElement.id}`);
            if (!el) return;
            
            if (state.dragInfo.isDragging) {
                const dx = (e.clientX - state.dragInfo.startX) / state.canvas.zoom;
                const dy = (e.clientY - state.dragInfo.startY) / state.canvas.zoom;
                
                let newX = state.dragInfo.initialLeft + dx;
                let newY = state.dragInfo.initialTop + dy;
                
                // Snap to grid
                if (state.canvas.snapToGrid) {
                    newX = Math.round(newX / state.canvas.gridSize) * state.canvas.gridSize;
                    newY = Math.round(newY / state.canvas.gridSize) * state.canvas.gridSize;
                }
                
                // Update element and DOM
                state.selectedElement.x = newX;
                state.selectedElement.y = newY;
                el.style.left = newX + 'px';
                el.style.top = newY + 'px';
                
                // Update connections
                updateConnections();
            } else if (state.dragInfo.isResizing) {
                const dx = (e.clientX - state.dragInfo.startX) / state.canvas.zoom;
                const dy = (e.clientY - state.dragInfo.startY) / state.canvas.zoom;
                const handle = state.dragInfo.handle;
                
                let newWidth = state.dragInfo.initialWidth;
                let newHeight = state.dragInfo.initialHeight;
                let newX = state.dragInfo.initialLeft;
                let newY = state.dragInfo.initialTop;
                
                // Adjust based on handle
                if (handle.includes('e')) {
                    newWidth = state.dragInfo.initialWidth + dx;
                }
                if (handle.includes('s')) {
                    newHeight = state.dragInfo.initialHeight + dy;
                }
                if (handle.includes('w')) {
                    newWidth = state.dragInfo.initialWidth - dx;
                    newX = state.dragInfo.initialLeft + dx;
                }
                if (handle.includes('n')) {
                    newHeight = state.dragInfo.initialHeight - dy;
                    newY = state.dragInfo.initialTop + dy;
                }
                
                // Minimum size
                newWidth = Math.max(10, newWidth);
                newHeight = Math.max(10, newHeight);
                
                // Snap to grid
                if (state.canvas.snapToGrid) {
                    newWidth = Math.round(newWidth / state.canvas.gridSize) * state.canvas.gridSize;
                    newHeight = Math.round(newHeight / state.canvas.gridSize) * state.canvas.gridSize;
                }
                
                // Update element and DOM
                state.selectedElement.width = newWidth;
                state.selectedElement.height = newHeight;
                state.selectedElement.x = newX;
                state.selectedElement.y = newY;
                
                el.style.width = newWidth + 'px';
                el.style.height = newHeight + 'px';
                el.style.left = newX + 'px';
                el.style.top = newY + 'px';
                
                // Update connections
                updateConnections();
            }
            
            updatePropertiesPanel();
        }

        function handleMouseUp() {
            state.dragInfo.isDragging = false;
            state.dragInfo.isResizing = false;
            document.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseup', handleMouseUp);
            saveHistory();
        }

        // ========== Connection System ==========
        function toggleConnectionMode() {
            state.connectionMode = !state.connectionMode;
            const btn = document.getElementById('connectionBtn');
            btn.classList.toggle('active', state.connectionMode);
            
            if (!state.connectionMode) {
                // Cancel any pending connection
                if (state.tempConnectionLine) {
                    state.tempConnectionLine.remove();
                    state.tempConnectionLine = null;
                }
                state.connectionStart = null;
            }
        }

        function handleElementMouseDownForConnection(e) {
            if (!state.connectionMode) return;
            
            e.stopPropagation();
            const el = e.currentTarget;
            const elementId = parseFloat(el.id.replace('el-', ''));
            const element = state.elements.find(el => el.id === elementId);
            
            if (!element) return;
            
            if (!state.connectionStart) {
                // Start connection
                state.connectionStart = element;
                
                // Create temp line
                const canvas = document.getElementById('canvas');
                const line = document.createElement('div');
                line.className = 'connection-line';
                line.style.position = 'absolute';
                line.style.pointerEvents = 'none';
                line.style.zIndex = '5';
                canvas.appendChild(line);
                
                state.tempConnectionLine = line;
            } else {
                // Complete connection
                if (state.connectionStart !== element) {
                    // Find existing connection
                    const existing = state.connections.find(c => 
                        c.from === state.connectionStart.id && c.to === element.id
                    );
                    
                    if (!existing) {
                        createConnection(state.connectionStart.id, element.id);
                    }
                }
                
                // Reset
                state.connectionStart = null;
                if (state.tempConnectionLine) {
                    state.tempConnectionLine.remove();
                    state.tempConnectionLine = null;
                }
                toggleConnectionMode();
            }
        }

        function createConnection(fromId, toId) {
            state.connections.push({
                id: Date.now(),
                from: fromId,
                to: toId,
                fromPoint: 'right',
                toPoint: 'left'
            });
            renderConnections();
            saveHistory();
        }

        function updateConnections() {
            renderConnections();
        }

        function renderConnections() {
            // Remove old connection lines
            document.querySelectorAll('.connection-line').forEach(line => {
                line.remove();
            });
            
            state.connections.forEach(conn => {
                const fromEl = document.getElementById(`el-${conn.from}`);
                const toEl = document.getElementById(`el-${conn.to}`);
                
                if (!fromEl || !toEl) return;
                
                const fromRect = fromEl.getBoundingClientRect();
                const toRect = toEl.getBoundingClientRect();
                const canvasRect = document.getElementById('canvas-container').getBoundingClientRect();
                
                // Calculate connection points relative to canvas
                const fromX = fromRect.left + fromRect.width/2 - canvasRect.left;
                const fromY = fromRect.top + fromRect.height/2 - canvasRect.top;
                const toX = toRect.left + toRect.width/2 - canvasRect.left;
                const toY = toRect.top + toRect.height/2 - canvasRect.top;
                
                // Draw line
                const line = document.createElement('div');
                line.className = 'connection-line';
                line.style.position = 'absolute';
                line.style.left = fromX + 'px';
                line.style.top = fromY + 'px';
                line.style.width = Math.abs(toX - fromX) + 'px';
                line.style.height = Math.abs(toY - fromY) + 'px';
                line.style.transformOrigin = '0 0';
                
                const angle = Math.atan2(toY - fromY, toX - fromX);
                line.style.transform = `rotate(${angle}rad)`;
                
                document.getElementById('canvas').appendChild(line);
            });
        }

        // ========== Properties Panel ==========
        function initPropertiesPanel() {
            // Add event listeners for property inputs
            document.getElementById('propX').addEventListener('change', updateSelected);
            document.getElementById('propY').addEventListener('change', updateSelected);
            document.getElementById('propWidth').addEventListener('change', updateSelected);
            document.getElementById('propHeight').addEventListener('change', updateSelected);
            document.getElementById('propBgColor').addEventListener('input', updateSelected);
            document.getElementById('propTextColor').addEventListener('input', updateSelected);
            document.getElementById('propBorderRadius').addEventListener('input', updateSelected);
            document.getElementById('propBoxShadow').addEventListener('change', updateSelected);
            document.getElementById('propText').addEventListener('input', updateSelected);
            document.getElementById('propHTML').addEventListener('input', updateSelected);
            document.getElementById('propStartConn').addEventListener('change', updateSelected);
            document.getElementById('propEndConn').addEventListener('change', updateSelected);
        }

        function updatePropertiesPanel() {
            if (!state.selectedElement) {
                document.getElementById('properties').querySelectorAll('input, select, textarea').forEach(el => {
                    el.value = '';
                });
                return;
            }
            
            const el = state.selectedElement;
            document.getElementById('propX').value = Math.round(el.x);
            document.getElementById('propY').value = Math.round(el.y);
            document.getElementById('propWidth').value = Math.round(el.width);
            document.getElementById('propHeight').value = Math.round(el.height);
            document.getElementById('propBgColor').value = el.backgroundColor;
            document.getElementById('propTextColor').value = el.textColor;
            document.getElementById('propBorderRadius').value = el.borderRadius;
            document.getElementById('propBoxShadow').value = el.boxShadow;
            document.getElementById('propText').value = el.text;
            document.getElementById('propHTML').value = el.html || '';
            document.getElementById('propStartConn').value = el.startConnection || '';
            document.getElementById('propEndConn').value = el.endConnection || '';
        }

        function updateSelected() {
            if (!state.selectedElement) return;
            
            const el = state.selectedElement;
            const domEl = document.getElementById(`el-${el.id}`);
            
            // Update properties from panel
            el.x = parseFloat(document.getElementById('propX').value);
            el.y = parseFloat(document.getElementById('propY').value);
            el.width = parseFloat(document.getElementById('propWidth').value);
            el.height = parseFloat(document.getElementById('propHeight').value);
            el.backgroundColor = document.getElementById('propBgColor').value;
            el.textColor = document.getElementById('propTextColor').value;
            el.borderRadius = parseInt(document.getElementById('propBorderRadius').value);
            el.boxShadow = document.getElementById('propBoxShadow').value;
            el.text = document.getElementById('propText').value;
            el.html = document.getElementById('propHTML').value;
            el.startConnection = document.getElementById('propStartConn').value || null;
            el.endConnection = document.getElementById('propEndConn').value || null;
            
            // Update DOM
            domEl.style.left = el.x + 'px';
            domEl.style.top = el.y + 'px';
            domEl.style.width = el.width + 'px';
            domEl.style.height = el.height + 'px';
            domEl.style.backgroundColor = el.backgroundColor;
            domEl.style.color = el.textColor;
            domEl.style.borderRadius = el.borderRadius + 'px';
            domEl.style.boxShadow = getBoxShadowStyle(el.boxShadow);
            
            if (el.html) {
                domEl.innerHTML = el.html;
            } else {
                domEl.textContent = el.text;
            }
            
            // Update resize handles
            addResizeHandles(domEl);
            
            // Update connections
            updateConnections();
        }

        function selectElement(element) {
            // Deselect previous
            if (state.selectedElement) {
                const prevEl = document.getElementById(`el-${state.selectedElement.id}`);
                if (prevEl) prevEl.classList.remove('selected');
            }
            
            state.selectedElement = element;
            
            // Select new
            const newEl = document.getElementById(`el-${element.id}`);
            if (newEl) {
                newEl.classList.add('selected');
                addResizeHandles(newEl);
            }
            
            // Update properties panel
            updatePropertiesPanel();
            
            // Update info
            document.getElementById('selectedInfo').textContent = 
                `${element.type} (${element.id.toString().slice(-4)})`;
        }

        // ========== Canvas Controls ==========
        function zoomIn() {
            state.canvas.zoom = Math.min(state.canvas.zoom + 0.1, 3);
            applyZoom();
        }

        function zoomOut() {
            state.canvas.zoom = Math.max(state.canvas.zoom - 0.1, 0.5);
            applyZoom();
        }

        function resetZoom() {
            state.canvas.zoom = 1;
            applyZoom();
        }

        function applyZoom() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('canvas');
            
            canvas.style.transform = `scale(${state.canvas.zoom})`;
            canvas.style.transformOrigin = 'center center';
        }

        function toggleGrid() {
            state.canvas.gridVisible = !state.canvas.gridVisible;
            drawGrid();
        }

        function toggleGridSnap() {
            state.canvas.snapToGrid = !state.canvas.snapToGrid;
            const btn = document.getElementById('gridBtn');
            btn.textContent = `Snap to Grid: ${state.canvas.snapToGrid ? 'ON' : 'OFF'}`;
        }

        function toggleAlignGuides() {
            state.canvas.alignGuides = !state.canvas.alignGuides;
            const btn = document.getElementById('alignBtn');
            btn.textContent = `Align Guides: ${state.canvas.alignGuides ? 'ON' : 'OFF'}`;
        }

        // ========== History ==========
        let historyStack = [];
        let historyIndex = -1;

        function saveHistory() {
            // For now, just save element states
            // In a full implementation, we'd save more efficiently
            const snapshot = JSON.parse(JSON.stringify(state.elements));
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(snapshot);
            historyIndex++;
        }

        function deleteSelected() {
            if (!state.selectedElement) return;
            
            // Remove element
            state.elements = state.elements.filter(el => el.id !== state.selectedElement.id);
            
            // Remove connections
            state.connections = state.connections.filter(conn => 
                conn.from !== state.selectedElement.id && 
                conn.to !== state.selectedElement.id
            );
            
            // Remove DOM element
            const el = document.getElementById(`el-${state.selectedElement.id}`);
            if (el) el.remove();
            
            // Deselect
            state.selectedElement = null;
            updatePropertiesPanel();
            
            // Render connections
            renderConnections();
            
            saveHistory();
        }

        function duplicateSelected() {
            if (!state.selectedElement) return;
            
            const original = state.selectedElement;
            const duplicate = JSON.parse(JSON.stringify(original));
            duplicate.id = Date.now();
            duplicate.x += 20;
            duplicate.y += 20;
            
            state.elements.push(duplicate);
            renderElement(duplicate);
            selectElement(duplicate);
            saveHistory();
        }

        function clearCanvas() {
            if (confirm('Clear all elements?')) {
                state.elements = [];
                state.connections = [];
                state.selectedElement = null;
                document.getElementById('canvas').innerHTML = '';
                updatePropertiesPanel();
                saveHistory();
            }
        }

        // ========== Rendering ==========
        function render() {
            // Initial render of all elements
            state.elements.forEach(renderElement);
            renderConnections();
            updatePropertiesPanel();
        }

        // ========== Export HTML ==========
        function exportHTML() {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            
            setTimeout(() => {
                const html = generateExportHTML();
                
                // Create blob and download
                const blob = new Blob([html], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ui-export.html';
                a.click();
                
                loading.style.display = 'none';
                showToast('HTML exported successfully!');
            }, 1000);
        }

            return html;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.cssText = `
                position: fixed; bottom: 20px; right: 20px;
                background: #007acc; color: white;
                padding: 10px 20px; border-radius: 4px;
                z-index: 3000; animation: fadeIn 0.3s;
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ========== Initialize Canvas with Event Listeners ==========
        function initCanvasControls() {
            const canvas = document.getElementById('canvas-container');
            
            // Zoom with mouse wheel
            canvas.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) zoomIn();
                    else zoomOut();
                }
            });
        }
