<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForgeUI — Visual Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#111318;--bg2:#16181e;--bg3:#1c1f27;--surface:#21242e;--surface2:#282c38;
  --border:#333845;--border2:#3e4452;--text:#d8dce6;--text2:#8a91a4;--text3:#5c6378;
  --accent:#4f8cff;--accent2:#3a6fd4;--accent-bg:rgba(79,140,255,0.1);
  --accent-border:rgba(79,140,255,0.3);--green:#45c98b;--red:#e05454;
  --guide-color:#ff4488;--left-w:220px;--right-w:260px;--topbar-h:42px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column;font-size:12px;user-select:none;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

#topbar{height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0;z-index:900;}
.tb-brand{font-family:'Azeret Mono',monospace;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:1px;margin-right:12px;}
.tb-sep{width:1px;height:22px;background:var(--border);margin:0 4px;}
.tb-btn{height:28px;padding:0 10px;background:var(--surface);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;}
.tb-btn:hover{background:var(--surface2);border-color:var(--border2);}
.tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.tb-btn.primary:hover{background:var(--accent2);}
.tb-btn.active{background:var(--accent-bg);border-color:var(--accent-border);color:var(--accent);}
.tb-spacer{flex:1;}
.tb-info{font-family:'Azeret Mono',monospace;font-size:10px;color:var(--text3);padding:4px 10px;background:var(--surface);border-radius:4px;}

#main{flex:1;display:flex;overflow:hidden;}

#left-panel{width:var(--left-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;}
.lp-section{border-bottom:1px solid var(--border);}
.lp-header{padding:10px 14px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.lp-header:hover{color:var(--text2);}
.lp-body{padding:4px 10px 10px;display:flex;flex-wrap:wrap;gap:5px;}
.lp-section.collapsed .lp-body{display:none;}

.comp-item{width:calc(50% - 3px);height:52px;background:var(--surface);border:1px solid var(--border);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:grab;transition:all .15s;font-size:10px;color:var(--text2);}
.comp-item:hover{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent);}
.comp-item:active{cursor:grabbing;}
.comp-icon{font-size:16px;line-height:1;}

#layer-list{flex:1;overflow-y:auto;padding:4px 8px;}
.layer-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:11px;color:var(--text2);transition:background .1s;}
.layer-item:hover{background:var(--surface);}
.layer-item.selected{background:var(--accent-bg);color:var(--accent);}
.layer-icon{font-size:12px;opacity:.6;}
.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.layer-vis{opacity:.4;cursor:pointer;font-size:11px;}
.layer-vis:hover{opacity:1;}
.layer-vis.hidden-layer{opacity:.15;}

#canvas-area{flex:1;position:relative;overflow:hidden;background:var(--bg);cursor:default;}
#canvas-wrapper{position:absolute;transform-origin:0 0;}
#the-canvas{background:#fff;position:relative;box-shadow:0 4px 40px rgba(0,0,0,.4);}
#the-canvas.show-grid{background-image:radial-gradient(circle,#ddd 1px,transparent 1px);background-size:20px 20px;}

.select-box{position:absolute;border:1px solid var(--accent);background:rgba(79,140,255,.06);pointer-events:none;z-index:9999;}

.canvas-el{position:absolute;cursor:move;outline:none;}
.canvas-el:hover{outline:1px solid rgba(79,140,255,.4);}
.canvas-el.selected{outline:2px solid var(--accent);z-index:100!important;}

.resize-handle{position:absolute;width:8px;height:8px;background:#fff;border:1.5px solid var(--accent);border-radius:2px;z-index:200;pointer-events:all;}
.resize-handle.nw{top:-4px;left:-4px;cursor:nw-resize;}
.resize-handle.n{top:-4px;left:calc(50% - 4px);cursor:n-resize;}
.resize-handle.ne{top:-4px;right:-4px;cursor:ne-resize;}
.resize-handle.e{top:calc(50% - 4px);right:-4px;cursor:e-resize;}
.resize-handle.se{bottom:-4px;right:-4px;cursor:se-resize;}
.resize-handle.s{bottom:-4px;left:calc(50% - 4px);cursor:s-resize;}
.resize-handle.sw{bottom:-4px;left:-4px;cursor:sw-resize;}
.resize-handle.w{top:calc(50% - 4px);left:-4px;cursor:w-resize;}

.conn-anchor{position:absolute;width:10px;height:10px;background:var(--green);border:2px solid #fff;border-radius:50%;z-index:300;cursor:crosshair;opacity:0;transition:opacity .15s;}
.canvas-el:hover .conn-anchor,.canvas-el.selected .conn-anchor{opacity:1;}
.conn-anchor.top{top:-5px;left:calc(50% - 5px);}
.conn-anchor.right{top:calc(50% - 5px);right:-5px;}
.conn-anchor.bottom{bottom:-5px;left:calc(50% - 5px);}
.conn-anchor.left{top:calc(50% - 5px);left:-5px;}

.align-guide{position:absolute;background:var(--guide-color);z-index:10000;pointer-events:none;}
.align-guide.h{height:1px;left:0;right:0;}
.align-guide.v{width:1px;top:0;bottom:0;}

#connections-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:50;overflow:visible;}
#connections-svg path{fill:none;stroke-width:2;pointer-events:stroke;cursor:pointer;}
#connections-svg path:hover{stroke-width:3;}

#right-panel{width:var(--right-w);background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.rp-section{border-bottom:1px solid var(--border);padding:12px 14px;}
.rp-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);margin-bottom:10px;}
.rp-empty{padding:24px 14px;text-align:center;color:var(--text3);font-size:11px;}

.prop-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.prop-label{font-size:11px;color:var(--text2);width:55px;flex-shrink:0;}
.prop-input{flex:1;height:26px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:'Azeret Mono',monospace;font-size:11px;padding:0 6px;outline:none;transition:border-color .15s;}
.prop-input:focus{border-color:var(--accent);}
.prop-input-half{width:calc(50% - 3px);}
.prop-color{width:26px;height:26px;border:1px solid var(--border);border-radius:4px;cursor:pointer;padding:0;-webkit-appearance:none;appearance:none;background:none;}
.prop-color::-webkit-color-swatch-wrapper{padding:2px;}
.prop-color::-webkit-color-swatch{border:none;border-radius:2px;}
.prop-select{flex:1;height:26px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:inherit;font-size:11px;padding:0 6px;outline:none;cursor:pointer;}
.prop-range{flex:1;height:4px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none;}
.prop-range::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--accent);border-radius:50%;cursor:pointer;}
.prop-val{font-family:'Azeret Mono',monospace;font-size:10px;color:var(--text3);width:28px;text-align:right;}
.prop-btn-row{display:flex;gap:4px;margin-bottom:7px;}
.prop-btn{flex:1;height:26px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--text2);font-family:inherit;font-size:10px;cursor:pointer;transition:all .1s;}
.prop-btn:hover{background:var(--surface2);color:var(--text);}

#temp-conn-svg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:11000;}
</style>
</head>
<body>

<div id="topbar">
  <span class="tb-brand">FORGE·UI</span>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="undo()" title="Ctrl+Z">↩ Undo</button>
  <button class="tb-btn" onclick="redo()" title="Ctrl+Y">↪ Redo</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="grid-toggle" onclick="toggleGrid()">⊞ Grid</button>
  <button class="tb-btn active" id="snap-toggle" onclick="toggleSnap()">⊟ Snap</button>
  <button class="tb-btn active" id="guides-toggle" onclick="toggleGuides()">⫼ Guides</button>
  <div class="tb-sep"></div>
  <label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)">
    <input type="number" id="canvas-w" value="1200" min="100" max="5000" style="width:56px" class="prop-input" onchange="resizeCanvas()"> ×
    <input type="number" id="canvas-h" value="800" min="100" max="5000" style="width:56px" class="prop-input" onchange="resizeCanvas()">
  </label>
  <div class="tb-spacer"></div>
  <span class="tb-info" id="zoom-display">100%</span>
  <button class="tb-btn" onclick="zoomTo(1)">1:1</button>
  <button class="tb-btn" onclick="fitCanvas()">Fit</button>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="deleteSelected()" style="color:var(--red)">✕ Delete</button>
  <div class="tb-sep"></div>
  <button class="tb-btn primary" onclick="exportHTML()">⬇ Export HTML</button>
</div>

<div id="main">
  <div id="left-panel">
    <div class="lp-section">
      <div class="lp-header" onclick="this.parentElement.classList.toggle('collapsed')">UI Components <span>▾</span></div>
      <div class="lp-body" id="ui-comps"></div>
    </div>
    <div class="lp-section">
      <div class="lp-header" onclick="this.parentElement.classList.toggle('collapsed')">Shapes <span>▾</span></div>
      <div class="lp-body" id="shape-comps"></div>
    </div>
    <div class="lp-section" style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="lp-header">Layers <span id="layer-count">0</span></div>
      <div id="layer-list"></div>
    </div>
  </div>

  <div id="canvas-area">
    <div id="canvas-wrapper">
      <div id="the-canvas"><svg id="connections-svg"></svg></div>
    </div>
    <svg id="temp-conn-svg"><line id="temp-line" x1="0" y1="0" x2="0" y2="0" stroke="#45c98b" stroke-width="2" stroke-dasharray="6 3"/></svg>
  </div>

  <div id="right-panel">
    <div id="props-empty" class="rp-empty">Select an element to<br>edit its properties</div>
    <div id="props-content" style="display:none">
      <div class="rp-section">
        <div class="rp-title">Position & Size</div>
        <div class="prop-row"><span class="prop-label">X</span><input class="prop-input" id="prop-x" type="number" onchange="setProp('x',+this.value)"><span class="prop-label" style="width:20px;text-align:center">Y</span><input class="prop-input" id="prop-y" type="number" onchange="setProp('y',+this.value)"></div>
        <div class="prop-row"><span class="prop-label">W</span><input class="prop-input" id="prop-w" type="number" onchange="setProp('w',+this.value)"><span class="prop-label" style="width:20px;text-align:center">H</span><input class="prop-input" id="prop-h" type="number" onchange="setProp('h',+this.value)"></div>
        <div class="prop-row"><span class="prop-label">Rotation</span><input class="prop-input" id="prop-rotation" type="number" value="0" min="0" max="360" onchange="setProp('rotation',+this.value)"><span style="font-size:10px;color:var(--text3)">deg</span></div>
      </div>
      <div class="rp-section">
        <div class="rp-title">Align on Canvas</div>
        <div class="prop-btn-row">
          <button class="prop-btn" onclick="alignEl('left')" title="Left">⫷</button>
          <button class="prop-btn" onclick="alignEl('cx')" title="Center H">⫿</button>
          <button class="prop-btn" onclick="alignEl('right')" title="Right">⫸</button>
          <button class="prop-btn" onclick="alignEl('top')" title="Top">⊤</button>
          <button class="prop-btn" onclick="alignEl('cy')" title="Center V">⊟</button>
          <button class="prop-btn" onclick="alignEl('bottom')" title="Bottom">⊥</button>
        </div>
      </div>
      <div class="rp-section">
        <div class="rp-title">Appearance</div>
        <div class="prop-row"><span class="prop-label">Fill</span><input type="color" class="prop-color" id="prop-bg" value="#ffffff" onchange="setStyle('backgroundColor',this.value)"><input class="prop-input" id="prop-bg-t" value="#ffffff" onchange="setStyle('backgroundColor',this.value);q('#prop-bg').value=this.value"></div>
        <div class="prop-row"><span class="prop-label">Text Col</span><input type="color" class="prop-color" id="prop-color" value="#000000" onchange="setStyle('color',this.value)"><input class="prop-input" id="prop-color-t" value="#000000" onchange="setStyle('color',this.value);q('#prop-color').value=this.value"></div>
        <div class="prop-row"><span class="prop-label">Opacity</span><input type="range" class="prop-range" id="prop-opacity" min="0" max="100" value="100" oninput="setStyle('opacity',this.value/100);q('#prop-opacity-v').textContent=this.value+'%'"><span class="prop-val" id="prop-opacity-v">100%</span></div>
        <div class="prop-row"><span class="prop-label">Font Size</span><input class="prop-input" id="prop-fs" type="number" value="14" min="6" max="200" onchange="setStyle('fontSize',this.value+'px')"></div>
        <div class="prop-row"><span class="prop-label">Weight</span><select class="prop-select" id="prop-fw" onchange="setStyle('fontWeight',this.value)"><option value="300">Light</option><option value="400" selected>Normal</option><option value="500">Medium</option><option value="600">Semi</option><option value="700">Bold</option></select></div>
        <div class="prop-row"><span class="prop-label">Text</span><input class="prop-input" id="prop-text" value="" onchange="setTextContent(this.value)"></div>
      </div>
      <div class="rp-section">
        <div class="rp-title">Border</div>
        <div class="prop-row"><span class="prop-label">Width</span><input class="prop-input" id="prop-bw" type="number" value="0" min="0" max="50" onchange="setStyle('borderWidth',this.value+'px')"></div>
        <div class="prop-row"><span class="prop-label">Color</span><input type="color" class="prop-color" id="prop-bc" value="#cccccc" onchange="setStyle('borderColor',this.value)"><input class="prop-input" id="prop-bc-t" value="#cccccc" onchange="setStyle('borderColor',this.value)"></div>
        <div class="prop-row"><span class="prop-label">Style</span><select class="prop-select" id="prop-bs" onchange="setStyle('borderStyle',this.value)"><option value="solid">Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option><option value="none">None</option></select></div>
        <div class="prop-row"><span class="prop-label">Radius</span><input class="prop-input" id="prop-br" type="number" value="0" min="0" max="500" onchange="setStyle('borderRadius',this.value+'px')"></div>
      </div>
      <div class="rp-section">
        <div class="rp-title">Box Shadow</div>
        <div class="prop-row"><span class="prop-label">X / Y</span><input class="prop-input prop-input-half" id="prop-sx" type="number" value="0" onchange="updateShadow()"><input class="prop-input prop-input-half" id="prop-sy" type="number" value="2" onchange="updateShadow()"></div>
        <div class="prop-row"><span class="prop-label">Blur / Spr</span><input class="prop-input prop-input-half" id="prop-sb" type="number" value="8" min="0" onchange="updateShadow()"><input class="prop-input prop-input-half" id="prop-ss" type="number" value="0" onchange="updateShadow()"></div>
        <div class="prop-row"><span class="prop-label">Color</span><input type="color" class="prop-color" id="prop-sc" value="#000000" onchange="updateShadow()"><input class="prop-input" id="prop-sa" type="number" value="15" min="0" max="100" onchange="updateShadow()"><span style="font-size:10px;color:var(--text3)">%</span></div>
      </div>
      <div class="rp-section" id="conn-section" style="display:none">
        <div class="rp-title">Connection</div>
        <div class="prop-row"><span class="prop-label">Stroke</span><input type="color" class="prop-color" id="conn-color" value="#555555" onchange="updateConn()"><input class="prop-input" id="conn-width" type="number" value="2" min="1" max="10" onchange="updateConn()"></div>
        <div class="prop-row"><span class="prop-label">Style</span><select class="prop-select" id="conn-style" onchange="updateConn()"><option value="solid">Solid</option><option value="dashed">Dashed</option><option value="dotted">Dotted</option></select></div>
        <div class="prop-row"><span class="prop-label">Type</span><select class="prop-select" id="conn-type" onchange="updateConn()"><option value="curved">Curved</option><option value="straight">Straight</option><option value="step">Step</option></select></div>
        <div class="prop-row"><span class="prop-label">Arrow</span><select class="prop-select" id="conn-arrow" onchange="updateConn()"><option value="end">End →</option><option value="start">Start ←</option><option value="both">Both ↔</option><option value="none">None</option></select></div>
        <button class="prop-btn" style="width:100%;color:var(--red);margin-top:4px" onclick="deleteConn()">Delete Connection</button>
      </div>
    </div>
  </div>
</div>

<script>
const q=s=>document.getElementById(s.replace('#',''));
const canvas=q('the-canvas'), canvasArea=q('canvas-area'), canvasWrapper=q('canvas-wrapper'), connSvg=q('connections-svg');
let CW=1200,CH=800,zoom=1,panX=0,panY=0,showGrid=false,snapOn=true,guidesOn=true,gridSz=20;
let els=[],selIds=new Set(),nxId=1,conns=[],selConn=null,nxConn=1;
let isDrag=false,dragT=null,dragSX=0,dragSY=0,dragStarts=[];
let resH=null,resEl=null,resS={};
let boxSel=false,bsX=0,bsY=0;
let drawConn=false,connSId=null,connSAnch=null;
let isPan=false,pSX=0,pSY=0,pSOX=0,pSOY=0;
let hist=[],hIdx=-1;

const UICOMPS=[
  {type:'button',icon:'▢',label:'Button',w:120,h:40,ds:{backgroundColor:'#4f8cff',color:'#fff',borderRadius:'6px',fontSize:'14px',fontWeight:'500',borderWidth:'0px'},text:'Button'},
  {type:'input',icon:'▬',label:'Input',w:200,h:38,ds:{backgroundColor:'#fff',color:'#999',borderRadius:'6px',fontSize:'14px',borderWidth:'1px',borderColor:'#d0d5dd',borderStyle:'solid'},text:'Enter text...'},
  {type:'text',icon:'A',label:'Text',w:180,h:32,ds:{backgroundColor:'transparent',color:'#333',fontSize:'16px',borderWidth:'0px'},text:'Text label'},
  {type:'heading',icon:'H',label:'Heading',w:300,h:44,ds:{backgroundColor:'transparent',color:'#111',fontSize:'28px',fontWeight:'700',borderWidth:'0px'},text:'Heading'},
  {type:'checkbox',icon:'☑',label:'Checkbox',w:160,h:28,ds:{backgroundColor:'transparent',color:'#333',fontSize:'14px',borderWidth:'0px'},text:'Checkbox',sub:'checkbox'},
  {type:'dropdown',icon:'⊟',label:'Dropdown',w:180,h:38,ds:{backgroundColor:'#fff',color:'#333',borderRadius:'6px',fontSize:'14px',borderWidth:'1px',borderColor:'#d0d5dd',borderStyle:'solid'},text:'Select...'},
  {type:'slider',icon:'⊶',label:'Slider',w:200,h:30,ds:{backgroundColor:'transparent',borderWidth:'0px'},text:'',sub:'range'},
  {type:'progress',icon:'▰',label:'Progress',w:200,h:20,ds:{backgroundColor:'#e9ecef',borderRadius:'10px',borderWidth:'0px'},text:'',pv:65},
  {type:'stepper',icon:'±',label:'Stepper',w:130,h:38,ds:{backgroundColor:'#fff',color:'#333',borderRadius:'6px',fontSize:'14px',borderWidth:'1px',borderColor:'#d0d5dd',borderStyle:'solid'},text:'0',sub:'stepper'},
  {type:'toggle',icon:'◑',label:'Toggle',w:52,h:28,ds:{backgroundColor:'#4f8cff',borderRadius:'14px',borderWidth:'0px'},text:'',sub:'toggle'},
  {type:'card',icon:'▱',label:'Card',w:280,h:180,ds:{backgroundColor:'#fff',borderRadius:'12px',borderWidth:'1px',borderColor:'#e5e7eb',borderStyle:'solid'},text:'Card',sub:'card'},
  {type:'image',icon:'⬒',label:'Image',w:200,h:150,ds:{backgroundColor:'#f0f1f3',borderRadius:'8px',borderWidth:'1px',borderColor:'#e0e0e0',borderStyle:'dashed',color:'#999',fontSize:'12px'},text:'Image'},
];

const SHAPES=[
  {type:'rectangle',icon:'▭',label:'Rectangle',w:160,h:100,ds:{backgroundColor:'#e8ecf1',borderWidth:'1px',borderColor:'#ccd0d8',borderStyle:'solid'},text:''},
  {type:'rounded-rect',icon:'▢',label:'Rounded',w:160,h:100,ds:{backgroundColor:'#e8ecf1',borderRadius:'12px',borderWidth:'1px',borderColor:'#ccd0d8',borderStyle:'solid'},text:''},
  {type:'circle',icon:'●',label:'Circle',w:100,h:100,ds:{backgroundColor:'#e8ecf1',borderRadius:'50%',borderWidth:'1px',borderColor:'#ccd0d8',borderStyle:'solid'},text:''},
  {type:'triangle',icon:'△',label:'Triangle',w:120,h:104,ds:{backgroundColor:'#e8ecf1',borderWidth:'0px'},text:'',tri:true},
  {type:'line-shape',icon:'╱',label:'Line',w:200,h:4,ds:{backgroundColor:'#333',borderRadius:'2px',borderWidth:'0px'},text:''},
  {type:'diamond',icon:'◇',label:'Diamond',w:100,h:100,ds:{backgroundColor:'#e8ecf1',borderWidth:'1px',borderColor:'#ccd0d8',borderStyle:'solid'},text:'',dia:true},
];

function initPanels(){
  const uc=q('ui-comps'),sc=q('shape-comps');
  [...UICOMPS,...SHAPES].forEach((c,i)=>{
    const d=document.createElement('div');d.className='comp-item';
    d.innerHTML=`<span class="comp-icon">${c.icon}</span><span>${c.label}</span>`;
    d.draggable=true;
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('comp',JSON.stringify(c));e.dataTransfer.effectAllowed='copy';});
    (i<UICOMPS.length?uc:sc).appendChild(d);
  });
}

function setupCanvas(){canvas.style.width=CW+'px';canvas.style.height=CH+'px';connSvg.setAttribute('width',CW);connSvg.setAttribute('height',CH);updateTransform();}
function resizeCanvas(){CW=Math.max(100,+q('canvas-w').value||1200);CH=Math.max(100,+q('canvas-h').value||800);canvas.style.width=CW+'px';canvas.style.height=CH+'px';connSvg.setAttribute('width',CW);connSvg.setAttribute('height',CH);renderConns();}
function updateTransform(){canvasWrapper.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;q('zoom-display').textContent=Math.round(zoom*100)+'%';}
function zoomTo(z){zoom=Math.max(.1,Math.min(5,z));updateTransform();}
function fitCanvas(){const r=canvasArea.getBoundingClientRect();zoom=Math.min((r.width-60)/CW,(r.height-60)/CH,1);panX=(r.width-CW*zoom)/2;panY=(r.height-CH*zoom)/2;updateTransform();}

canvasArea.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});
canvasArea.addEventListener('drop',e=>{
  e.preventDefault();const d=e.dataTransfer.getData('comp');if(!d)return;
  const c=JSON.parse(d),rect=canvas.getBoundingClientRect();
  let x=(e.clientX-rect.left)/zoom-c.w/2,y=(e.clientY-rect.top)/zoom-c.h/2;
  if(snapOn){x=Math.round(x/gridSz)*gridSz;y=Math.round(y/gridSz)*gridSz;}
  x=Math.max(0,Math.min(CW-c.w,x));y=Math.max(0,Math.min(CH-c.h,y));
  addEl(c,x,y);
});

function addEl(c,x,y){
  const el={id:nxId++,type:c.type,x,y,w:c.w,h:c.h,rotation:0,text:c.text||'',sub:c.sub||null,tri:!!c.tri,dia:!!c.dia,pv:c.pv||0,styles:{...c.ds,opacity:1},shadow:{x:0,y:0,blur:0,spread:0,color:'#000000',alpha:0},visible:true};
  els.push(el);renderEl(el);selectEl(el.id);saveHist('Add '+c.label);renderLayers();
}

function renderEl(el){
  let div=q('el-'+el.id);if(div)div.remove();
  div=document.createElement('div');div.id='el-'+el.id;div.className='canvas-el'+(selIds.has(el.id)?' selected':'');div.dataset.eid=el.id;
  div.style.cssText=`left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
  if(el.rotation)div.style.transform=`rotate(${el.rotation}deg)`;
  if(!el.visible)div.style.display='none';
  const s=el.styles;
  if(s.backgroundColor&&s.backgroundColor!=='transparent')div.style.backgroundColor=s.backgroundColor;
  if(s.color)div.style.color=s.color;
  if(s.borderRadius)div.style.borderRadius=s.borderRadius;
  if(s.fontSize)div.style.fontSize=s.fontSize;
  if(s.fontWeight)div.style.fontWeight=s.fontWeight;
  if(s.borderWidth&&s.borderWidth!=='0px'){div.style.borderWidth=s.borderWidth;div.style.borderColor=s.borderColor||'#ccc';div.style.borderStyle=s.borderStyle||'solid';}
  if(s.opacity!==undefined)div.style.opacity=s.opacity;
  if(el.shadow&&el.shadow.alpha>0){const h=el.shadow;div.style.boxShadow=`${h.x}px ${h.y}px ${h.blur}px ${h.spread}px ${hex2rgba(h.color,h.alpha/100)}`;}
  if(el.tri)div.style.clipPath='polygon(50% 0%,0% 100%,100% 100%)';
  if(el.dia)div.style.clipPath='polygon(50% 0%,100% 50%,50% 100%,0% 50%)';

  // Content
  if(el.type==='button'){div.style.display='flex';div.style.alignItems='center';div.style.justifyContent='center';div.style.cursor='pointer';div.textContent=el.text;}
  else if(el.type==='input'){div.style.display='flex';div.style.alignItems='center';div.style.padding='0 12px';div.textContent=el.text;}
  else if(el.type==='checkbox'){div.style.display='flex';div.style.alignItems='center';div.style.gap='8px';div.innerHTML=`<span style="width:16px;height:16px;border:2px solid #d0d5dd;border-radius:4px;display:inline-block;background:#fff;flex-shrink:0"></span><span>${el.text}</span>`;}
  else if(el.type==='dropdown'){div.style.display='flex';div.style.alignItems='center';div.style.justifyContent='space-between';div.style.padding='0 12px';div.innerHTML=`<span>${el.text}</span><span style="color:#999">▾</span>`;}
  else if(el.sub==='range'){div.style.display='flex';div.style.alignItems='center';div.innerHTML=`<div style="flex:1;height:4px;background:#e0e0e0;border-radius:2px;position:relative"><div style="width:50%;height:100%;background:#4f8cff;border-radius:2px"></div><div style="position:absolute;top:-5px;left:50%;width:14px;height:14px;background:#fff;border:2px solid #4f8cff;border-radius:50%;transform:translateX(-50%)"></div></div>`;}
  else if(el.type==='progress'){div.style.overflow='hidden';div.innerHTML=`<div style="width:${el.pv}%;height:100%;background:#4f8cff;border-radius:inherit"></div>`;}
  else if(el.sub==='stepper'){div.style.display='flex';div.style.alignItems='center';div.style.overflow='hidden';div.innerHTML=`<span style="width:32px;height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #e0e0e0;font-size:16px">−</span><span style="flex:1;text-align:center">${el.text}</span><span style="width:32px;height:100%;display:flex;align-items:center;justify-content:center;border-left:1px solid #e0e0e0;font-size:16px">+</span>`;}
  else if(el.sub==='toggle'){div.innerHTML=`<div style="position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>`;}
  else if(el.sub==='card'){div.style.display='flex';div.style.flexDirection='column';div.style.padding='20px';div.innerHTML=`<div style="font-size:18px;font-weight:600;color:#111;margin-bottom:8px">${el.text}</div><div style="font-size:13px;color:#666;line-height:1.5">Card content here.</div>`;}
  else{div.style.display='flex';div.style.alignItems='center';div.style.justifyContent='center';div.textContent=el.text;}

  ['top','right','bottom','left'].forEach(p=>{const a=document.createElement('div');a.className='conn-anchor '+p;a.dataset.anchor=p;a.dataset.eid=el.id;a.addEventListener('mousedown',startConn);div.appendChild(a);});
  div.addEventListener('mousedown',onElDown);
  canvas.appendChild(div);
}

function rerenderAll(){canvas.querySelectorAll('.canvas-el,.resize-handle,.align-guide,.select-box').forEach(e=>e.remove());els.forEach(renderEl);renderConns();updateSelVis();}

function selectEl(id,add=false){if(!add){selIds.clear();selConn=null;}selIds.add(id);updateSelVis();updateProps();renderLayers();}
function deselectAll(){selIds.clear();selConn=null;updateSelVis();updateProps();renderLayers();}

function updateSelVis(){
  canvas.querySelectorAll('.canvas-el').forEach(d=>{d.classList.toggle('selected',selIds.has(+d.dataset.eid));});
  canvas.querySelectorAll('.resize-handle').forEach(h=>h.remove());
  if(selIds.size===1){const el=getEl([...selIds][0]);if(el)addHandles(el);}
}

function addHandles(el){
  ['nw','n','ne','e','se','s','sw','w'].forEach(p=>{
    const h=document.createElement('div');h.className='resize-handle '+p;h.dataset.handle=p;h.dataset.eid=el.id;
    h.style.left=hX(p,el)+'px';h.style.top=hY(p,el)+'px';
    h.addEventListener('mousedown',onResDown);canvas.appendChild(h);
  });
}
function hX(p,el){return p.includes('w')?el.x-4:p.includes('e')?el.x+el.w-4:el.x+el.w/2-4;}
function hY(p,el){return p.includes('n')?el.y-4:p.includes('s')?el.y+el.h-4:el.y+el.h/2-4;}
function getEl(id){return els.find(e=>e.id===id);}

function onElDown(e){
  if(e.target.classList.contains('conn-anchor'))return;e.stopPropagation();
  const id=+e.currentTarget.dataset.eid;
  if(e.shiftKey){selIds.has(id)?selIds.delete(id):selIds.add(id);updateSelVis();updateProps();renderLayers();return;}
  if(!selIds.has(id))selectEl(id);
  isDrag=true;dragT='move';
  const r=canvas.getBoundingClientRect();dragSX=(e.clientX-r.left)/zoom;dragSY=(e.clientY-r.top)/zoom;
  dragStarts=[...selIds].map(sid=>{const el=getEl(sid);return{id:sid,x:el.x,y:el.y};});
}

function onResDown(e){
  e.stopPropagation();const id=+e.currentTarget.dataset.eid;
  resH=e.currentTarget.dataset.handle;resEl=getEl(id);
  const r=canvas.getBoundingClientRect();
  resS={mx:(e.clientX-r.left)/zoom,my:(e.clientY-r.top)/zoom,x:resEl.x,y:resEl.y,w:resEl.w,h:resEl.h};
  isDrag=true;dragT='resize';
}

canvasArea.addEventListener('mousedown',e=>{
  if(e.target===canvasArea||e.target===canvasWrapper||e.target===canvas){
    if(e.button===1||(e.button===0&&e.altKey)){isPan=true;pSX=e.clientX;pSY=e.clientY;pSOX=panX;pSOY=panY;canvasArea.style.cursor='grabbing';return;}
    deselectAll();
    if(e.target===canvas){boxSel=true;const r=canvas.getBoundingClientRect();bsX=(e.clientX-r.left)/zoom;bsY=(e.clientY-r.top)/zoom;}
  }
});

document.addEventListener('mousemove',e=>{
  if(isPan){panX=pSOX+(e.clientX-pSX);panY=pSOY+(e.clientY-pSY);updateTransform();return;}
  if(drawConn){
    const r=canvas.getBoundingClientRect(),mx=(e.clientX-r.left)/zoom,my=(e.clientY-r.top)/zoom;
    const se=getEl(connSId),sp=anchorPt(se,connSAnch);
    const tl=q('temp-line');tl.setAttribute('x1',r.left+sp.x*zoom);tl.setAttribute('y1',r.top+sp.y*zoom);tl.setAttribute('x2',e.clientX);tl.setAttribute('y2',e.clientY);
    q('temp-conn-svg').style.display='block';return;
  }
  if(boxSel){const r=canvas.getBoundingClientRect(),mx=(e.clientX-r.left)/zoom,my=(e.clientY-r.top)/zoom;drawBox(bsX,bsY,mx,my);return;}
  if(!isDrag)return;
  const cr=canvas.getBoundingClientRect(),mx=(cr.left?((e.clientX-cr.left)/zoom):0),my=(cr.top?((e.clientY-cr.top)/zoom):0);
  if(dragT==='move'){
    let dx=mx-dragSX,dy=my-dragSY;
    if(snapOn){const p=dragStarts[0];let nx=p.x+dx,ny=p.y+dy;nx=Math.round(nx/gridSz)*gridSz;ny=Math.round(ny/gridSz)*gridSz;dx=nx-p.x;dy=ny-p.y;}
    clearGuides();
    if(guidesOn&&selIds.size===1){const el=getEl(dragStarts[0].id),nx=dragStarts[0].x+dx,ny=dragStarts[0].y+dy;const g=computeGuides(el.id,nx,ny,el.w,el.h);if(g.sx!==null)dx=g.sx-dragStarts[0].x;if(g.sy!==null)dy=g.sy-dragStarts[0].y;showGuides(g);}
    dragStarts.forEach(sp=>{const el=getEl(sp.id);el.x=Math.max(0,sp.x+dx);el.y=Math.max(0,sp.y+dy);updateElDOM(el);});renderConns();
  }
  if(dragT==='resize'){
    const dx=mx-resS.mx,dy=my-resS.my;let{x,y,w,h}=resS;
    if(resH.includes('e'))w=Math.max(10,w+dx);if(resH.includes('w')){w=Math.max(10,w-dx);x=x+(resS.w-w);}
    if(resH.includes('s'))h=Math.max(10,h+dy);if(resH.includes('n')){h=Math.max(10,h-dy);y=y+(resS.h-h);}
    if(snapOn){w=Math.round(w/gridSz)*gridSz||gridSz;h=Math.round(h/gridSz)*gridSz||gridSz;x=Math.round(x/gridSz)*gridSz;y=Math.round(y/gridSz)*gridSz;}
    resEl.x=x;resEl.y=y;resEl.w=w;resEl.h=h;updateElDOM(resEl);updateSelVis();updateProps();renderConns();
  }
});

document.addEventListener('mouseup',e=>{
  if(isPan){isPan=false;canvasArea.style.cursor='';return;}
  if(drawConn){finishConn(e);return;}
  if(boxSel){
    boxSel=false;canvas.querySelector('.select-box')?.remove();
    const r=canvas.getBoundingClientRect(),mx=(e.clientX-r.left)/zoom,my=(e.clientY-r.top)/zoom;
    const bx=Math.min(bsX,mx),by=Math.min(bsY,my),bw=Math.abs(mx-bsX),bh=Math.abs(my-bsY);
    els.forEach(el=>{if(el.x>=bx&&el.y>=by&&el.x+el.w<=bx+bw&&el.y+el.h<=by+bh)selIds.add(el.id);});
    updateSelVis();updateProps();renderLayers();return;
  }
  if(isDrag){isDrag=false;clearGuides();if(dragT==='move')saveHist('Move');if(dragT==='resize')saveHist('Resize');dragT=null;updateSelVis();updateProps();}
});

function drawBox(x1,y1,x2,y2){let b=canvas.querySelector('.select-box');if(!b){b=document.createElement('div');b.className='select-box';canvas.appendChild(b);}b.style.left=Math.min(x1,x2)+'px';b.style.top=Math.min(y1,y2)+'px';b.style.width=Math.abs(x2-x1)+'px';b.style.height=Math.abs(y2-y1)+'px';}

function updateElDOM(el){
  const d=q('el-'+el.id);if(!d)return;
  d.style.left=el.x+'px';d.style.top=el.y+'px';d.style.width=el.w+'px';d.style.height=el.h+'px';
  d.style.transform=el.rotation?`rotate(${el.rotation}deg)`:'';
  canvas.querySelectorAll(`.resize-handle[data-eid="${el.id}"]`).forEach(h=>{h.style.left=hX(h.dataset.handle,el)+'px';h.style.top=hY(h.dataset.handle,el)+'px';});
}

// Guides
function computeGuides(eid,nx,ny,w,h){
  const r={hG:[],vG:[],sx:null,sy:null},T=5,cx=nx+w/2,cy=ny+h/2,rx=nx+w,by=ny+h;
  const ccx=CW/2,ccy=CH/2;
  if(Math.abs(cx-ccx)<T){r.vG.push(ccx);r.sx=ccx-w/2;}
  if(Math.abs(cy-ccy)<T){r.hG.push(ccy);r.sy=ccy-h/2;}
  els.forEach(o=>{
    if(o.id===eid||!o.visible)return;
    const ox=o.x,oy=o.y,ow=o.w,oh=o.h,ocx=ox+ow/2,ocy=oy+oh/2;
    if(Math.abs(nx-ox)<T){r.vG.push(ox);r.sx=ox;}
    if(Math.abs(rx-(ox+ow))<T){r.vG.push(ox+ow);r.sx=ox+ow-w;}
    if(Math.abs(nx-(ox+ow))<T){r.vG.push(ox+ow);r.sx=ox+ow;}
    if(Math.abs(rx-ox)<T){r.vG.push(ox);r.sx=ox-w;}
    if(Math.abs(cx-ocx)<T){r.vG.push(ocx);r.sx=ocx-w/2;}
    if(Math.abs(ny-oy)<T){r.hG.push(oy);r.sy=oy;}
    if(Math.abs(by-(oy+oh))<T){r.hG.push(oy+oh);r.sy=oy+oh-h;}
    if(Math.abs(ny-(oy+oh))<T){r.hG.push(oy+oh);r.sy=oy+oh;}
    if(Math.abs(by-oy)<T){r.hG.push(oy);r.sy=oy-h;}
    if(Math.abs(cy-ocy)<T){r.hG.push(ocy);r.sy=ocy-h/2;}
  });
  return r;
}
function showGuides(g){clearGuides();g.hG.forEach(y=>{const d=document.createElement('div');d.className='align-guide h';d.style.top=y+'px';canvas.appendChild(d);});g.vG.forEach(x=>{const d=document.createElement('div');d.className='align-guide v';d.style.left=x+'px';canvas.appendChild(d);});}
function clearGuides(){canvas.querySelectorAll('.align-guide').forEach(g=>g.remove());}

// Connections
function startConn(e){e.stopPropagation();drawConn=true;connSId=+e.currentTarget.dataset.eid;connSAnch=e.currentTarget.dataset.anchor;}
function finishConn(e){
  drawConn=false;q('temp-conn-svg').style.display='none';
  const t=document.elementFromPoint(e.clientX,e.clientY);
  if(t&&t.classList.contains('conn-anchor')){
    const eid=+t.dataset.eid,anch=t.dataset.anchor;
    if(eid!==connSId){conns.push({id:nxConn++,fId:connSId,fA:connSAnch,tId:eid,tA:anch,color:'#555',width:2,style:'solid',type:'curved',arrow:'end'});renderConns();saveHist('Connect');}
  }
}
function anchorPt(el,a){switch(a){case'top':return{x:el.x+el.w/2,y:el.y};case'right':return{x:el.x+el.w,y:el.y+el.h/2};case'bottom':return{x:el.x+el.w/2,y:el.y+el.h};case'left':return{x:el.x,y:el.y+el.h/2};}}

function renderConns(){
  connSvg.innerHTML='';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  conns.forEach(c=>{
    // end marker
    const m=document.createElementNS('http://www.w3.org/2000/svg','marker');
    m.setAttribute('id','ae-'+c.id);m.setAttribute('markerWidth','10');m.setAttribute('markerHeight','7');m.setAttribute('refX','10');m.setAttribute('refY','3.5');m.setAttribute('orient','auto');
    const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('points','0 0,10 3.5,0 7');p.setAttribute('fill',c.color);m.appendChild(p);defs.appendChild(m);
    // start marker
    const m2=document.createElementNS('http://www.w3.org/2000/svg','marker');
    m2.setAttribute('id','as-'+c.id);m2.setAttribute('markerWidth','10');m2.setAttribute('markerHeight','7');m2.setAttribute('refX','0');m2.setAttribute('refY','3.5');m2.setAttribute('orient','auto');
    const p2=document.createElementNS('http://www.w3.org/2000/svg','polygon');p2.setAttribute('points','10 0,0 3.5,10 7');p2.setAttribute('fill',c.color);m2.appendChild(p2);defs.appendChild(m2);
  });
  connSvg.appendChild(defs);
  conns.forEach(c=>{
    const fe=getEl(c.fId),te=getEl(c.tId);if(!fe||!te)return;
    const f=anchorPt(fe,c.fA),t=anchorPt(te,c.tA);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    let d;
    if(c.type==='straight')d=`M${f.x} ${f.y}L${t.x} ${t.y}`;
    else if(c.type==='step'){const mx=(f.x+t.x)/2;d=`M${f.x} ${f.y}L${mx} ${f.y}L${mx} ${t.y}L${t.x} ${t.y}`;}
    else{
      const dx=Math.abs(t.x-f.x)*.5,dy=Math.abs(t.y-f.y)*.5;
      let c1x=f.x,c1y=f.y,c2x=t.x,c2y=t.y;
      if(c.fA==='right')c1x+=dx;else if(c.fA==='left')c1x-=dx;else if(c.fA==='bottom')c1y+=dy;else c1y-=dy;
      if(c.tA==='right')c2x+=dx;else if(c.tA==='left')c2x-=dx;else if(c.tA==='bottom')c2y+=dy;else c2y-=dy;
      d=`M${f.x} ${f.y}C${c1x} ${c1y},${c2x} ${c2y},${t.x} ${t.y}`;
    }
    path.setAttribute('d',d);path.setAttribute('stroke',c.color);path.setAttribute('stroke-width',c.width);
    if(c.style==='dashed')path.setAttribute('stroke-dasharray','8 4');
    if(c.style==='dotted')path.setAttribute('stroke-dasharray','2 3');
    if(c.arrow==='end'||c.arrow==='both')path.setAttribute('marker-end',`url(#ae-${c.id})`);
    if(c.arrow==='start'||c.arrow==='both')path.setAttribute('marker-start',`url(#as-${c.id})`);
    path.style.pointerEvents='stroke';path.style.cursor='pointer';path.dataset.cid=c.id;
    path.addEventListener('click',ev=>{ev.stopPropagation();selConn=c.id;selIds.clear();updateSelVis();showConnProps(c);});
    connSvg.appendChild(path);
  });
}

function showConnProps(c){q('props-empty').style.display='none';q('props-content').style.display='block';q('conn-section').style.display='block';q('conn-color').value=c.color;q('conn-width').value=c.width;q('conn-style').value=c.style;q('conn-type').value=c.type;q('conn-arrow').value=c.arrow;}
function updateConn(){if(!selConn)return;const c=conns.find(x=>x.id===selConn);if(!c)return;c.color=q('conn-color').value;c.width=+q('conn-width').value;c.style=q('conn-style').value;c.type=q('conn-type').value;c.arrow=q('conn-arrow').value;renderConns();saveHist('Edit Connection');}
function deleteConn(){if(!selConn)return;conns=conns.filter(c=>c.id!==selConn);selConn=null;renderConns();updateProps();saveHist('Delete Connection');}

// Props panel
function updateProps(){
  const emp=q('props-empty'),con=q('props-content'),cs=q('conn-section');
  if(!selIds.size&&!selConn){emp.style.display='block';con.style.display='none';return;}
  if(selConn){const c=conns.find(x=>x.id===selConn);if(c)showConnProps(c);return;}
  emp.style.display='none';con.style.display='block';cs.style.display='none';
  const el=getEl([...selIds][0]);if(!el)return;
  q('prop-x').value=Math.round(el.x);q('prop-y').value=Math.round(el.y);q('prop-w').value=Math.round(el.w);q('prop-h').value=Math.round(el.h);q('prop-rotation').value=el.rotation||0;
  const s=el.styles;
  q('prop-bg').value=(s.backgroundColor&&s.backgroundColor!=='transparent')?s.backgroundColor:'#ffffff';q('prop-bg-t').value=s.backgroundColor||'transparent';
  q('prop-color').value=s.color||'#000000';q('prop-color-t').value=s.color||'#000000';
  q('prop-opacity').value=(s.opacity!==undefined?s.opacity:1)*100;q('prop-opacity-v').textContent=Math.round((s.opacity!==undefined?s.opacity:1)*100)+'%';
  q('prop-fs').value=parseInt(s.fontSize)||14;q('prop-fw').value=s.fontWeight||'400';q('prop-text').value=el.text;
  q('prop-bw').value=parseInt(s.borderWidth)||0;q('prop-bc').value=s.borderColor||'#cccccc';q('prop-bc-t').value=s.borderColor||'#cccccc';q('prop-bs').value=s.borderStyle||'solid';q('prop-br').value=parseInt(s.borderRadius)||0;
  const h=el.shadow||{x:0,y:0,blur:0,spread:0,color:'#000000',alpha:0};
  q('prop-sx').value=h.x;q('prop-sy').value=h.y;q('prop-sb').value=h.blur;q('prop-ss').value=h.spread;q('prop-sc').value=h.color;q('prop-sa').value=h.alpha;
}

function setProp(p,v){selIds.forEach(id=>{const el=getEl(id);if(!el)return;el[p]=v;if(['x','y','w','h'].includes(p)){updateElDOM(el);updateSelVis();renderConns();}else if(p==='rotation'){updateElDOM(el);}});saveHist('Edit');updateProps();}
function setStyle(p,v){selIds.forEach(id=>{const el=getEl(id);if(!el)return;el.styles[p]=v;renderEl(el);updateSelVis();});saveHist('Style');}
function setTextContent(v){selIds.forEach(id=>{const el=getEl(id);if(el){el.text=v;renderEl(el);updateSelVis();}});saveHist('Text');}
function updateShadow(){const sh={x:+q('prop-sx').value,y:+q('prop-sy').value,blur:+q('prop-sb').value,spread:+q('prop-ss').value,color:q('prop-sc').value,alpha:+q('prop-sa').value};selIds.forEach(id=>{const el=getEl(id);if(el){el.shadow=sh;renderEl(el);updateSelVis();}});saveHist('Shadow');}

function alignEl(m){selIds.forEach(id=>{const el=getEl(id);if(!el)return;if(m==='left')el.x=0;else if(m==='cx')el.x=(CW-el.w)/2;else if(m==='right')el.x=CW-el.w;else if(m==='top')el.y=0;else if(m==='cy')el.y=(CH-el.h)/2;else if(m==='bottom')el.y=CH-el.h;updateElDOM(el);updateSelVis();renderConns();});updateProps();saveHist('Align');}

function deleteSelected(){if(!selIds.size)return;selIds.forEach(id=>{els=els.filter(e=>e.id!==id);conns=conns.filter(c=>c.fId!==id&&c.tId!==id);const d=q('el-'+id);if(d)d.remove();});selIds.clear();updateSelVis();updateProps();renderConns();renderLayers();saveHist('Delete');}

function renderLayers(){const list=q('layer-list');list.innerHTML='';q('layer-count').textContent=els.length;
  for(let i=els.length-1;i>=0;i--){const el=els[i];const it=document.createElement('div');it.className='layer-item'+(selIds.has(el.id)?' selected':'');
    const ic=document.createElement('span');ic.className='layer-icon';ic.textContent=getIcon(el.type);
    const nm=document.createElement('span');nm.className='layer-name';nm.textContent=el.text||el.type;
    const vs=document.createElement('span');vs.className='layer-vis'+(el.visible?'':' hidden-layer');vs.textContent='👁';vs.onclick=ev=>{ev.stopPropagation();el.visible=!el.visible;renderEl(el);renderLayers();};
    it.appendChild(ic);it.appendChild(nm);it.appendChild(vs);it.onclick=()=>selectEl(el.id);list.appendChild(it);
  }
}
function getIcon(t){return{button:'▢',input:'▬',text:'A',heading:'H',checkbox:'☑',dropdown:'⊟',slider:'⊶',progress:'▰',stepper:'±',toggle:'◑',card:'▱',image:'⬒',rectangle:'▭','rounded-rect':'▢',circle:'●',triangle:'△','line-shape':'╱',diamond:'◇'}[t]||'●';}

function toggleGrid(){showGrid=!showGrid;canvas.classList.toggle('show-grid',showGrid);q('grid-toggle').classList.toggle('active',showGrid);}
function toggleSnap(){snapOn=!snapOn;q('snap-toggle').classList.toggle('active',snapOn);}
function toggleGuides(){guidesOn=!guidesOn;q('guides-toggle').classList.toggle('active',guidesOn);}

// History
function saveHist(a){if(hIdx<hist.length-1)hist=hist.slice(0,hIdx+1);hist.push({a,els:JSON.parse(JSON.stringify(els)),conns:JSON.parse(JSON.stringify(conns))});if(hist.length>50)hist.shift();hIdx=hist.length-1;}
function undo(){if(hIdx<=0)return;hIdx--;restoreState(hist[hIdx]);}
function redo(){if(hIdx>=hist.length-1)return;hIdx++;restoreState(hist[hIdx]);}
function restoreState(s){els=JSON.parse(JSON.stringify(s.els));conns=JSON.parse(JSON.stringify(s.conns));selIds.clear();rerenderAll();renderLayers();updateProps();}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')return;
  const ct=e.ctrlKey||e.metaKey;
  if(ct&&e.key==='z'){e.preventDefault();undo();}
  else if(ct&&e.key==='y'){e.preventDefault();redo();}
  else if(ct&&e.key==='a'){e.preventDefault();els.forEach(el=>selIds.add(el.id));updateSelVis();updateProps();}
  else if(e.key==='Delete'||e.key==='Backspace'){deleteSelected();}
  else if(ct&&e.key==='d'){e.preventDefault();const nw=[];selIds.forEach(id=>{const el=getEl(id);if(!el)return;const cp=JSON.parse(JSON.stringify(el));cp.id=nxId++;cp.x+=20;cp.y+=20;els.push(cp);nw.push(cp);});selIds.clear();nw.forEach(el=>{renderEl(el);selIds.add(el.id);});updateSelVis();renderLayers();saveHist('Duplicate');}
  else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const st=e.shiftKey?10:1;selIds.forEach(id=>{const el=getEl(id);if(!el)return;if(e.key==='ArrowUp')el.y-=st;if(e.key==='ArrowDown')el.y+=st;if(e.key==='ArrowLeft')el.x-=st;if(e.key==='ArrowRight')el.x+=st;updateElDOM(el);});updateSelVis();renderConns();updateProps();}
});

canvasArea.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?.9:1.1;const nz=Math.max(.1,Math.min(5,zoom*d));const r=canvasArea.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;panX=mx-(mx-panX)*(nz/zoom);panY=my-(my-panY)*(nz/zoom);zoom=nz;updateTransform();},{passive:false});

// Export
function exportHTML(){
  let h=`<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>Exported UI</title>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;}\nbody{font-family:-apple-system,sans-serif;}\n.canvas{width:${CW}px;height:${CH}px;position:relative;margin:0 auto;background:#fff;}\n.el{position:absolute;}\n</style>\n</head>\n<body>\n<div class="canvas">\n`;

  if(conns.length){
    h+=`<svg width="${CW}" height="${CH}" style="position:absolute;top:0;left:0;pointer-events:none;z-index:0">\n<defs>\n`;
    conns.forEach(c=>{h+=`<marker id="ea${c.id}" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="${c.color}"/></marker>\n`;h+=`<marker id="eas${c.id}" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto"><polygon points="10 0,0 3.5,10 7" fill="${c.color}"/></marker>\n`;});
    h+=`</defs>\n`;
    conns.forEach(c=>{
      const fe=getEl(c.fId),te=getEl(c.tId);if(!fe||!te)return;
      const f=anchorPt(fe,c.fA),t=anchorPt(te,c.tA);
      let d;if(c.type==='straight')d=`M${f.x} ${f.y}L${t.x} ${t.y}`;
      else if(c.type==='step'){const mx=(f.x+t.x)/2;d=`M${f.x} ${f.y}L${mx} ${f.y}L${mx} ${t.y}L${t.x} ${t.y}`;}
      else{const dx=Math.abs(t.x-f.x)*.5,dy=Math.abs(t.y-f.y)*.5;let c1x=f.x,c1y=f.y,c2x=t.x,c2y=t.y;if(c.fA==='right')c1x+=dx;else if(c.fA==='left')c1x-=dx;else if(c.fA==='bottom')c1y+=dy;else c1y-=dy;if(c.tA==='right')c2x+=dx;else if(c.tA==='left')c2x-=dx;else if(c.tA==='bottom')c2y+=dy;else c2y-=dy;d=`M${f.x} ${f.y}C${c1x} ${c1y},${c2x} ${c2y},${t.x} ${t.y}`;}
      let da='';if(c.style==='dashed')da=' stroke-dasharray="8 4"';if(c.style==='dotted')da=' stroke-dasharray="2 3"';
      let mk='';if(c.arrow==='end'||c.arrow==='both')mk+=` marker-end="url(#ea${c.id})"`;if(c.arrow==='start'||c.arrow==='both')mk+=` marker-start="url(#eas${c.id})"`;
      h+=`<path d="${d}" stroke="${c.color}" stroke-width="${c.width}" fill="none"${da}${mk}/>\n`;
    });
    h+=`</svg>\n`;
  }

  els.forEach(el=>{
    if(!el.visible)return;
    let st=`left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
    if(el.rotation)st+=`transform:rotate(${el.rotation}deg);`;
    const s=el.styles;
    if(s.backgroundColor&&s.backgroundColor!=='transparent')st+=`background:${s.backgroundColor};`;
    if(s.color)st+=`color:${s.color};`;
    if(s.borderRadius&&s.borderRadius!=='0px')st+=`border-radius:${s.borderRadius};`;
    if(s.fontSize)st+=`font-size:${s.fontSize};`;
    if(s.fontWeight&&s.fontWeight!=='400')st+=`font-weight:${s.fontWeight};`;
    if(s.borderWidth&&s.borderWidth!=='0px')st+=`border:${s.borderWidth} ${s.borderStyle||'solid'} ${s.borderColor||'#ccc'};`;
    if(s.opacity!==undefined&&s.opacity<1)st+=`opacity:${s.opacity};`;
    if(el.shadow&&el.shadow.alpha>0){const sh=el.shadow;st+=`box-shadow:${sh.x}px ${sh.y}px ${sh.blur}px ${sh.spread}px ${hex2rgba(sh.color,sh.alpha/100)};`;}
    if(el.tri)st+=`clip-path:polygon(50% 0%,0% 100%,100% 100%);`;
    if(el.dia)st+=`clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);`;

    if(el.type==='input'){h+=`<input class="el" style="${st}padding:0 12px;border:${s.borderWidth||'1px'} ${s.borderStyle||'solid'} ${s.borderColor||'#d0d5dd'};border-radius:${s.borderRadius||'6px'};font-size:${s.fontSize||'14px'};" placeholder="${el.text}">\n`;return;}
    if(el.type==='checkbox'){h+=`<label class="el" style="${st}display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox"> ${el.text}</label>\n`;return;}
    if(el.type==='dropdown'){h+=`<select class="el" style="${st}padding:0 12px;"><option>${el.text}</option></select>\n`;return;}
    if(el.sub==='range'){h+=`<input type="range" class="el" style="${st}" value="50">\n`;return;}
    if(el.type==='progress'){h+=`<div class="el" style="${st}overflow:hidden"><div style="width:${el.pv}%;height:100%;background:#4f8cff;border-radius:inherit"></div></div>\n`;return;}

    let xs='display:flex;align-items:center;justify-content:center;',cn=el.text;
    if(el.sub==='stepper'){xs='display:flex;align-items:center;overflow:hidden;';cn=`<span style="width:32px;height:100%;display:flex;align-items:center;justify-content:center;border-right:1px solid #e0e0e0">−</span><span style="flex:1;text-align:center">${el.text}</span><span style="width:32px;height:100%;display:flex;align-items:center;justify-content:center;border-left:1px solid #e0e0e0">+</span>`;}
    else if(el.sub==='toggle'){xs='';cn=`<div style="position:absolute;top:3px;left:3px;width:22px;height:22px;background:#fff;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>`;}
    else if(el.sub==='card'){xs='display:flex;flex-direction:column;padding:20px;';cn=`<div style="font-size:18px;font-weight:600;color:#111;margin-bottom:8px">${el.text}</div><div style="font-size:13px;color:#666;line-height:1.5">Card content.</div>`;}
    else if(el.type==='button')xs='display:flex;align-items:center;justify-content:center;cursor:pointer;';
    h+=`<div class="el" style="${st}${xs}">${cn}</div>\n`;
  });
  h+=`</div>\n</body>\n</html>`;
  const blob=new Blob([h],{type:'text/html'});const a=document.createElement('a');a.download='exported-ui.html';a.href=URL.createObjectURL(blob);a.click();URL.revokeObjectURL(a.href);
}

function hex2rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return`rgba(${r},${g},${b},${a})`;}

// Init
initPanels();setupCanvas();fitCanvas();saveHist('Initial');renderLayers();
</script>
</body>
</html>
