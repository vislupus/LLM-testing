<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Builder • Figma Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        #canvas {
            background: 
                linear-gradient(#e5e7eb 1px, transparent 1px),
                linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
        }
        .element {
            position: absolute;
            cursor: move;
            user-select: none;
            box-sizing: border-box;
            transition: box-shadow 0.1s;
        }
        .element.selected {
            box-shadow: 0 0 0 3px #3b82f6;
        }
        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            border: 2px solid #3b82f6;
            z-index: 100;
        }
        .handle-nw { top: -6px; left: -6px; cursor: nwse-resize; }
        .handle-ne { top: -6px; right: -6px; cursor: nesw-resize; }
        .handle-sw { bottom: -6px; left: -6px; cursor: nesw-resize; }
        .handle-se { bottom: -6px; right: -6px; cursor: nwse-resize; }
        .handle-n { top: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; width: 20px; height: 8px; }
        .handle-s { bottom: -6px; left: 50%; transform: translateX(-50%); cursor: ns-resize; width: 20px; height: 8px; }
        .handle-w { left: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; height: 20px; width: 8px; }
        .handle-e { right: -6px; top: 50%; transform: translateY(-50%); cursor: ew-resize; height: 20px; width: 8px; }
        .connection-line {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        .guide {
            position: absolute;
            background: #eab308;
            opacity: 0.6;
            z-index: 50;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 overflow-hidden h-screen flex flex-col">
    <!-- Top Bar -->
    <div class="h-14 bg-zinc-900 border-b border-zinc-800 flex items-center px-6 justify-between">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-square text-blue-500 text-2xl"></i>
                <span class="font-bold text-2xl tracking-tighter">Builder</span>
            </div>
            <div class="flex gap-6 text-sm">
                <button onclick="setTool(0)" id="tool0" class="tool-btn px-5 py-1.5 rounded-xl bg-white text-zinc-900 font-semibold">Select</button>
                <button onclick="setTool(1)" id="tool1" class="tool-btn px-5 py-1.5 rounded-xl hover:bg-zinc-800">Connect</button>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="clearCanvas()" class="px-5 py-2 text-sm hover:bg-zinc-800 rounded-2xl flex items-center gap-2">
                <i class="fa-solid fa-trash"></i> Clear
            </button>
            <button onclick="exportHTML()" class="bg-blue-600 hover:bg-blue-500 px-8 py-2 rounded-3xl font-semibold flex items-center gap-2">
                <i class="fa-solid fa-download"></i> Export HTML
            </button>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left Library -->
        <div class="w-72 bg-zinc-900 border-r border-zinc-800 p-6 overflow-auto">
            <div class="mb-6">
                <div class="text-xs uppercase tracking-widest text-zinc-500 mb-3">Components</div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div onclick="addComponent('button')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Button</div>
                    <div onclick="addComponent('input')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Input</div>
                    <div onclick="addComponent('text')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Text</div>
                    <div onclick="addComponent('checkbox')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Checkbox</div>
                    <div onclick="addComponent('dropdown')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Dropdown</div>
                    <div onclick="addComponent('slider')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Slider</div>
                    <div onclick="addComponent('progress')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Progress</div>
                </div>
            </div>
            <div>
                <div class="text-xs uppercase tracking-widest text-zinc-500 mb-3">Shapes</div>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div onclick="addShape('rect')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Rectangle</div>
                    <div onclick="addShape('circle')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Circle</div>
                    <div onclick="addShape('triangle')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Triangle</div>
                    <div onclick="addShape('line')" class="library-item bg-zinc-800 hover:bg-zinc-700 p-4 rounded-2xl cursor-pointer text-center">Line</div>
                </div>
            </div>
        </div>

        <!-- Canvas Area -->
        <div class="flex-1 flex items-center justify-center bg-zinc-950 overflow-auto p-12" id="canvasWrapper">
            <div id="canvas" class="relative bg-white shadow-2xl" style="width: 1200px; height: 700px;">
                <!-- Elements added here by JS -->
                <!-- SVG for connections -->
                <svg id="connectionsSVG" class="absolute top-0 left-0 w-full h-full pointer-events-none" style="z-index: 10;"></svg>
            </div>
        </div>

        <!-- Right Properties -->
        <div class="w-80 bg-zinc-900 border-l border-zinc-800 p-6 overflow-auto" id="propertiesPanel">
            <div class="text-xs uppercase tracking-widest text-zinc-400 mb-4">Properties</div>
            <div id="noSelection" class="text-center py-12 text-zinc-500">
                Select an element to edit
            </div>
            <div id="propertiesContent" class="hidden space-y-8">
                <!-- Filled by JS -->
            </div>
        </div>
    </div>

    <script>
        // Tailwind already loaded
        let elements = [];
        let connections = [];
        let selectedId = null;
        let currentTool = 0; // 0 = select, 1 = connect
        let gridSize = 10;
        let isDragging = false;
        let dragOffsetX = 0, dragOffsetY = 0;
        let draggedEl = null;
        let isResizing = false;
        let resizeHandle = null;
        let startX, startY, startW, startH, startLeft, startTop;
        let tempGuides = [];

        let nextId = 1;

        const canvas = document.getElementById('canvas');
        const svg = document.getElementById('connectionsSVG');

        function createElement(type, x = 200, y = 150) {
            const id = 'el_' + nextId++;
            let el = document.createElement('div');
            el.className = 'element bg-white border border-zinc-300 shadow-sm flex items-center justify-center text-zinc-900 text-sm';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.width = type === 'line' ? '200px' : '140px';
            el.style.height = type === 'line' ? '4px' : '42px';
            el.dataset.id = id;
            el.dataset.type = type;

            let content = '';
            switch(type) {
                case 'button':
                    el.style.backgroundColor = '#3b82f6';
                    el.style.color = 'white';
                    el.style.borderRadius = '8px';
                    content = 'Button';
                    break;
                case 'input':
                    el.style.borderRadius = '6px';
                    el.style.border = '2px solid #64748b';
                    content = '<input type="text" class="w-full h-full bg-transparent outline-none px-4 text-sm" placeholder="Type here...">';
                    break;
                case 'text':
                    el.style.border = 'none';
                    el.style.background = 'transparent';
                    el.style.width = '180px';
                    el.style.height = 'auto';
                    el.style.minHeight = '28px';
                    content = 'Double-click to edit text';
                    el.contentEditable = true;
                    break;
                case 'checkbox':
                    content = '<input type="checkbox" class="w-5 h-5 accent-blue-600"> Label';
                    el.style.justifyContent = 'flex-start';
                    el.style.gap = '12px';
                    break;
                case 'dropdown':
                    content = '<select class="w-full bg-white border border-zinc-300 rounded px-4 py-2 text-sm"><option>Option 1</option><option>Option 2</option></select>';
                    break;
                case 'slider':
                    content = '<input type="range" class="w-full accent-blue-600">';
                    break;
                case 'progress':
                    content = '<div class="w-full h-3 bg-zinc-200 rounded-full overflow-hidden"><div class="h-full bg-blue-600 w-3/4"></div></div>';
                    break;
                case 'rect':
                    el.style.backgroundColor = '#64748b';
                    el.style.borderRadius = '4px';
                    content = '';
                    break;
                case 'circle':
                    el.style.backgroundColor = '#f43f5e';
                    el.style.borderRadius = '9999px';
                    el.style.width = '90px';
                    el.style.height = '90px';
                    break;
                case 'triangle':
                    el.style.width = '0';
                    el.style.height = '0';
                    el.style.borderLeft = '60px solid transparent';
                    el.style.borderRight = '60px solid transparent';
                    el.style.borderBottom = '100px solid #22c55e';
                    break;
                case 'line':
                    el.style.backgroundColor = '#64748b';
                    el.style.height = '3px';
                    el.style.border = 'none';
                    break;
            }
            el.innerHTML = content;

            canvas.appendChild(el);

            makeDraggable(el);
            makeResizable(el);

            el.addEventListener('click', (e) => {
                if (currentTool === 1) {
                    handleConnectionClick(id);
                    return;
                }
                e.stopImmediatePropagation();
                selectElement(id);
            });

            elements.push({
                id: id,
                type: type,
                el: el,
                x: x,
                y: y,
                w: parseFloat(el.style.width),
                h: parseFloat(el.style.height)
            });

            return id;
        }

        function addComponent(type) {
            createElement(type, 300 + Math.random()*200, 200 + Math.random()*150);
        }

        function addShape(type) {
            createElement(type, 300 + Math.random()*200, 200 + Math.random()*150);
        }

        function makeDraggable(el) {
            el.addEventListener('pointerdown', (e) => {
                if (currentTool === 1 || e.target.closest('.resize-handle')) return;
                draggedEl = el;
                const rect = el.getBoundingClientRect();
                const canvasRect = canvas.getBoundingClientRect();
                dragOffsetX = e.clientX - rect.left;
                dragOffsetY = e.clientY - rect.top;
                isDragging = true;
                selectElement(el.dataset.id);
                canvas.style.cursor = 'grabbing';
            });
        }

        function makeResizable(el) {
            const handles = ['nw','ne','sw','se','n','s','w','e'];
            handles.forEach(pos => {
                const handle = document.createElement('div');
                handle.className = `resize-handle handle-${pos}`;
                el.appendChild(handle);

                handle.addEventListener('pointerdown', (e) => {
                    e.stopImmediatePropagation();
                    isResizing = true;
                    resizeHandle = pos;
                    startX = e.clientX;
                    startY = e.clientY;
                    const rect = el.getBoundingClientRect();
                    startW = rect.width;
                    startH = rect.height;
                    startLeft = parseFloat(el.style.left);
                    startTop = parseFloat(el.style.top);
                    selectElement(el.dataset.id);
                });
            });
        }

        document.addEventListener('pointermove', (e) => {
            if (isDragging && draggedEl) {
                let newLeft = e.clientX - canvas.getBoundingClientRect().left - dragOffsetX;
                let newTop = e.clientY - canvas.getBoundingClientRect().top - dragOffsetY;

                // Snap to grid
                newLeft = Math.round(newLeft / gridSize) * gridSize;
                newTop = Math.round(newTop / gridSize) * gridSize;

                draggedEl.style.left = newLeft + 'px';
                draggedEl.style.top = newTop + 'px';

                updateConnections();
                showAlignmentGuides(draggedEl);
            }

            if (isResizing && selectedId) {
                const el = document.querySelector(`[data-id="${selectedId}"]`);
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;

                let newW = startW;
                let newH = startH;
                let newLeft = startLeft;
                let newTop = startTop;

                if (resizeHandle.includes('e')) newW = Math.max(40, startW + dx);
                if (resizeHandle.includes('w')) {
                    newW = Math.max(40, startW - dx);
                    newLeft = startLeft + dx;
                }
                if (resizeHandle.includes('s')) newH = Math.max(30, startH + dy);
                if (resizeHandle.includes('n')) {
                    newH = Math.max(30, startH - dy);
                    newTop = startTop + dy;
                }

                // Snap
                newW = Math.round(newW / gridSize) * gridSize;
                newH = Math.round(newH / gridSize) * gridSize;
                newLeft = Math.round(newLeft / gridSize) * gridSize;
                newTop = Math.round(newTop / gridSize) * gridSize;

                el.style.width = newW + 'px';
                el.style.height = newH + 'px';
                el.style.left = newLeft + 'px';
                el.style.top = newTop + 'px';

                updateConnections();
            }
        });

        document.addEventListener('pointerup', () => {
            isDragging = false;
            isResizing = false;
            draggedEl = null;
            canvas.style.cursor = 'default';
            hideGuides();
            updateElementData();
        });

        function updateElementData() {
            elements.forEach(item => {
                const el = item.el;
                item.x = parseFloat(el.style.left);
                item.y = parseFloat(el.style.top);
                item.w = parseFloat(el.style.width);
                item.h = parseFloat(el.style.height);
            });
        }

        function selectElement(id) {
            selectedId = id;
            document.querySelectorAll('.element').forEach(e => e.classList.remove('selected'));
            const el = document.querySelector(`[data-id="${id}"]`);
            if (el) el.classList.add('selected');
            renderProperties();
        }

        function renderProperties() {
            const panel = document.getElementById('propertiesContent');
            const noSel = document.getElementById('noSelection');
            const item = elements.find(e => e.id === selectedId);
            if (!item) {
                noSel.classList.remove('hidden');
                panel.classList.add('hidden');
                return;
            }
            noSel.classList.add('hidden');
            panel.classList.remove('hidden');

            let html = `
                <div class="space-y-6">
                    <div>
                        <label class="text-xs text-zinc-400">Position</label>
                        <div class="grid grid-cols-2 gap-4 mt-2">
                            <div>
                                <div class="text-xs">X</div>
                                <input type="number" value="${Math.round(item.x)}" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-lg" onchange="updatePosition('${item.id}', 'x', this.value)">
                            </div>
                            <div>
                                <div class="text-xs">Y</div>
                                <input type="number" value="${Math.round(item.y)}" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-lg" onchange="updatePosition('${item.id}', 'y', this.value)">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400">Size</label>
                        <div class="grid grid-cols-2 gap-4 mt-2">
                            <div>
                                <div class="text-xs">Width</div>
                                <input type="number" value="${Math.round(item.w)}" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-lg" onchange="updateSize('${item.id}', 'w', this.value)">
                            </div>
                            <div>
                                <div class="text-xs">Height</div>
                                <input type="number" value="${Math.round(item.h)}" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3 text-lg" onchange="updateSize('${item.id}', 'h', this.value)">
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Border Radius</label>
                        <input type="range" min="0" max="60" value="8" class="w-full" oninput="applyStyle('${item.id}', 'borderRadius', this.value + 'px')">
                    </div>
                    <div>
                        <label class="text-xs text-zinc-400 block mb-2">Box Shadow</label>
                        <select onchange="applyStyle('${item.id}', 'boxShadow', this.value)" class="w-full bg-zinc-800 border border-zinc-700 rounded-2xl px-4 py-3">
                            <option value="none">None</option>
                            <option value="0 10px 15px -3px rgb(0 0 0 / 0.1)">Soft</option>
                            <option value="0 20px 25px -5px rgb(0 0 0 / 0.1)">Medium</option>
                            <option value="0 25px 50px -12px rgb(0 0 0 / 0.25)">Heavy</option>
                        </select>
                    </div>
                    <button onclick="deleteElement('${item.id}')" class="w-full py-4 bg-red-600 hover:bg-red-500 rounded-3xl text-white font-semibold">Delete Element</button>
                </div>
            `;
            panel.innerHTML = html;
        }

        window.updatePosition = function(id, axis, val) {
            const item = elements.find(e => e.id === id);
            const el = item.el;
            if (axis === 'x') el.style.left = val + 'px';
            if (axis === 'y') el.style.top = val + 'px';
            updateElementData();
            updateConnections();
        };

        window.updateSize = function(id, axis, val) {
            const item = elements.find(e => e.id === id);
            const el = item.el;
            if (axis === 'w') el.style.width = val + 'px';
            if (axis === 'h') el.style.height = val + 'px';
            updateElementData();
            updateConnections();
        };

        window.applyStyle = function(id, prop, value) {
            const el = document.querySelector(`[data-id="${id}"]`);
            if (prop === 'borderRadius') el.style.borderRadius = value;
            if (prop === 'boxShadow') el.style.boxShadow = value;
        };

        function deleteElement(id) {
            const item = elements.find(e => e.id === id);
            if (item) item.el.remove();
            elements = elements.filter(e => e.id !== id);
            connections = connections.filter(c => c.from !== id && c.to !== id);
            selectedId = null;
            updateConnections();
            document.getElementById('propertiesContent').classList.add('hidden');
            document.getElementById('noSelection').classList.remove('hidden');
        }

        // Connection system
        let connectFrom = null;

        function handleConnectionClick(id) {
            if (!connectFrom) {
                connectFrom = id;
                return;
            }
            if (connectFrom === id) {
                connectFrom = null;
                return;
            }
            connections.push({ from: connectFrom, to: id });
            connectFrom = null;
            updateConnections();
        }

        function updateConnections() {
            svg.innerHTML = '';
            connections.forEach(conn => {
                const fromEl = document.querySelector(`[data-id="${conn.from}"]`);
                const toEl = document.querySelector(`[data-id="${conn.to}"]`);
                if (!fromEl || !toEl) return;

                const fRect = fromEl.getBoundingClientRect();
                const tRect = toEl.getBoundingClientRect();
                const cRect = canvas.getBoundingClientRect();

                const x1 = fRect.left + fRect.width/2 - cRect.left;
                const y1 = fRect.top + fRect.height/2 - cRect.top;
                const x2 = tRect.left + tRect.width/2 - cRect.left;
                const y2 = tRect.top + tRect.height/2 - cRect.top;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", x1);
                line.setAttribute("y1", y1);
                line.setAttribute("x2", x2);
                line.setAttribute("y2", y2);
                line.setAttribute("stroke", "#64748b");
                line.setAttribute("stroke-width", "3");
                line.setAttribute("stroke-dasharray", "8 4");
                svg.appendChild(line);
            });
        }

        function showAlignmentGuides(el) {
            hideGuides();
            const rect = el.getBoundingClientRect();
            const cRect = canvas.getBoundingClientRect();

            elements.forEach(item => {
                if (item.el === el) return;
                const iRect = item.el.getBoundingClientRect();

                // Vertical guides
                if (Math.abs(rect.left - iRect.left) < 12) {
                    const guide = createGuide('vertical', iRect.left - cRect.left);
                    canvas.appendChild(guide);
                    tempGuides.push(guide);
                }
                if (Math.abs(rect.right - iRect.right) < 12) {
                    const guide = createGuide('vertical', iRect.right - cRect.left);
                    canvas.appendChild(guide);
                    tempGuides.push(guide);
                }
            });
        }

        function createGuide(type, pos) {
            const g = document.createElement('div');
            g.className = 'guide';
            if (type === 'vertical') {
                g.style.left = pos + 'px';
                g.style.top = '0';
                g.style.width = '1px';
                g.style.height = '100%';
            }
            return g;
        }

        function hideGuides() {
            tempGuides.forEach(g => g.remove());
            tempGuides = [];
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('bg-white', 'text-zinc-900'));
            document.getElementById('tool' + tool).classList.add('bg-white', 'text-zinc-900');
        }

        function clearCanvas() {
            if (!confirm('Clear entire canvas?')) return;
            canvas.innerHTML = '<svg id="connectionsSVG" class="absolute top-0 left-0 w-full h-full pointer-events-none" style="z-index: 10;"></svg>';
            svg = document.getElementById('connectionsSVG');
            elements = [];
            connections = [];
            selectedId = null;
        }

        function exportHTML() {
            let html = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My UI Design</title>
    <scr` + `ipt src="https://cdn.tailwindcss.com"></scr` + `ipt>
    <style>body { font-family: system-ui; }</style>
</head>
<body class="bg-zinc-950 min-h-screen flex items-center justify-center">
    <div class="relative bg-white shadow-2xl" style="width:1200px;height:700px;">`;

            elements.forEach(item => {
                const el = item.el.cloneNode(true);
                el.style.position = 'absolute';
                el.style.left = item.x + 'px';
                el.style.top = item.y + 'px';
                el.style.width = item.w + 'px';
                el.style.height = item.h + 'px';
                el.classList.remove('selected');
                html += '\n        ' + el.outerHTML;
            });

            html += `\n    </div>
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'my-ui-design.html';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Delete' && selectedId) deleteElement(selectedId);
            if (e.key === 'Escape') {
                selectedId = null;
                document.querySelectorAll('.element').forEach(el => el.classList.remove('selected'));
                document.getElementById('propertiesContent').classList.add('hidden');
                document.getElementById('noSelection').classList.remove('hidden');
            }
        });

        // Double click to edit text
        canvas.addEventListener('dblclick', (e) => {
            const target = e.target.closest('.element');
            if (target && target.dataset.type === 'text') {
                target.focus();
            }
        });

        // Init
        function init() {
            // Demo elements
            createElement('button', 180, 120);
