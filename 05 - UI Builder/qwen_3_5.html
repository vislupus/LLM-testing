<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProUI Builder - Drag & Drop Design Tool</title>
    <style>
        :root {
            --bg-dark: #1e1e1e;
            --bg-panel: #252526;
            --bg-canvas: #ffffff;
            --accent: #007acc;
            --text-main: #cccccc;
            --text-light: #ffffff;
            --border: #3e3e42;
            --grid-color: #e0e0e0;
        }

        * { box-sizing: border-box; user-select: none; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

        /* Layout */
        #sidebar-left { width: 260px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        #sidebar-right { width: 300px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; }
        #main-area { flex: 1; position: relative; overflow: hidden; background: #333; display: flex; justify-content: center; align-items: center; }

        /* Toolbar & Components */
        .panel-header { padding: 15px; font-weight: bold; color: var(--text-light); border-bottom: 1px solid var(--border); background: #333; }
        .component-list { padding: 10px; overflow-y: auto; flex: 1; }
        .component-item { 
            background: #3e3e42; padding: 10px; margin-bottom: 8px; border-radius: 4px; cursor: grab; 
            display: flex; align-items: center; gap: 10px; transition: background 0.2s;
        }
        .component-item:hover { background: #4e4e52; }
        .component-item:active { cursor: grabbing; }
        .icon { width: 20px; height: 20px; background: #888; border-radius: 3px; }

        /* Canvas */
        #canvas-container {
            width: 800px; height: 600px; background: var(--bg-canvas); position: relative; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5); overflow: hidden;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        #canvas-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        #canvas-svg path { stroke: #007acc; stroke-width: 2; fill: none; pointer-events: stroke; cursor: pointer; }
        #canvas-svg path:hover { stroke: #ff0055; stroke-width: 4; }

        /* Elements on Canvas */
        .canvas-element {
            position: absolute; cursor: move; user-select: text;
            box-sizing: border-box; display: flex; align-items: center; justify-content: center;
        }
        .canvas-element.selected { outline: 2px solid var(--accent); z-index: 100 !important; }
        
        /* Resize Handles */
        .resize-handle {
            position: absolute; width: 10px; height: 10px; background: var(--accent); border: 1px solid white;
            z-index: 101; display: none;
        }
        .canvas-element.selected .resize-handle { display: block; }
        .rh-tl { top: -5px; left: -5px; cursor: nw-resize; }
        .rh-tr { top: -5px; right: -5px; cursor: ne-resize; }
        .rh-bl { bottom: -5px; left: -5px; cursor: sw-resize; }
        .rh-br { bottom: -5px; right: -5px; cursor: se-resize; }

        /* Connection Ports */
        .port {
            position: absolute; width: 12px; height: 12px; background: #fff; border: 2px solid var(--accent);
            border-radius: 50%; z-index: 102; display: none; cursor: crosshair;
        }
        .canvas-element.selected .port { display: block; }
        .port-top { top: -6px; left: 50%; transform: translateX(-50%); }
        .port-bottom { bottom: -6px; left: 50%; transform: translateX(-50%); }
        .port-left { left: -6px; top: 50%; transform: translateY(-50%); }
        .port-right { right: -6px; top: 50%; transform: translateY(-50%); }

        /* Properties Panel */
        .prop-group { padding: 15px; border-bottom: 1px solid var(--border); }
        .prop-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .prop-row label { font-size: 0.85rem; }
        .prop-row input, .prop-row select { 
            background: #3e3e42; border: 1px solid #555; color: white; padding: 4px; border-radius: 3px; width: 120px; 
        }
        .btn { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 3px; cursor: pointer; width: 100%; margin-top: 5px;}
        .btn-danger { background: #d94545; }
        .btn-success { background: #2da44e; }

        /* Specific Component Styles (Preview in Builder) */
        .comp-btn { background: #007acc; color: white; border: none; padding: 8px 16px; border-radius: 4px; }
        .comp-input { border: 1px solid #ccc; padding: 6px; border-radius: 4px; width: 100%; background: white; color: black;}
        .comp-checkbox { width: 16px; height: 16px; }
        .comp-slider { width: 100%; }
        .comp-progress { width: 100%; height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; }
        .comp-progress-bar { height: 100%; background: var(--accent); width: 50%; }
        .comp-shape-rect { background: #ccc; }
        .comp-shape-circle { background: #ccc; border-radius: 50%; }
        .comp-shape-triangle { 
            width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 40px solid #ccc; 
            background: transparent; justify-content: flex-start; 
        }

        /* Top Bar */
        #top-bar {
            position: absolute; top: 0; left: 260px; right: 300px; height: 40px; background: #333; 
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between; z-index: 20;
        }
        .canvas-controls button { background: #444; color: white; border: none; padding: 5px 10px; margin-left: 5px; cursor: pointer; border-radius: 3px;}
        .canvas-controls button:hover { background: #555; }

    </style>
</head>
<body>

    <!-- Left Sidebar: Components -->
    <div id="sidebar-left">
        <div class="panel-header">Components</div>
        <div class="component-list" id="component-list">
            <!-- Generated by JS -->
        </div>
        <div class="panel-header">Actions</div>
        <div style="padding: 15px;">
            <button class="btn btn-danger" onclick="app.clearCanvas()">Clear Canvas</button>
        </div>
    </div>

    <!-- Top Bar -->
    <div id="top-bar">
        <div style="font-weight: bold;">Untitled Project</div>
        <div class="canvas-controls">
            <button onclick="app.toggleGrid()">Grid</button>
            <button onclick="app.toggleSnap()">Snap</button>
            <button class="btn-success" style="padding: 5px 15px;" onclick="app.exportHTML()">Export HTML</button>
        </div>
    </div>

    <!-- Main Canvas Area -->
    <div id="main-area">
        <div id="canvas-container">
            <svg id="canvas-svg"></svg>
            <!-- Elements injected here -->
        </div>
    </div>

    <!-- Right Sidebar: Properties -->
    <div id="sidebar-right">
        <div class="panel-header">Properties</div>
        <div id="properties-content" style="overflow-y: auto; flex: 1;">
            <div style="padding: 20px; text-align: center; color: #666;">Select an element to edit properties</div>
        </div>
    </div>

    <script>
        /**
         * Application State & Logic
         */
        const app = {
            elements: [],
            connections: [],
            selectedId: null,
            nextId: 1,
            settings: {
                grid: true,
                snap: true,
                gridSize: 20
            },
            dragState: null, // { type: 'move'|'resize'|'connect', ... }
            
            init() {
                this.renderComponentList();
                this.setupCanvasEvents();
                this.setupPropertyListeners();
                this.loop();
            },

            // --- Component Definitions ---
            components: [
                { type: 'button', label: 'Button', html: '<button class="comp-btn">Button</button>' },
                { type: 'input', label: 'Text Input', html: '<input class="comp-input" type="text" placeholder="Enter text...">' },
                { type: 'label', label: 'Label', html: '<span style="color:black; font-weight:bold;">Label Text</span>' },
                { type: 'checkbox', label: 'Checkbox', html: '<input type="checkbox" class="comp-checkbox"> <span style="color:black; margin-left:5px;">Option</span>' },
                { type: 'slider', label: 'Slider', html: '<input type="range" class="comp-slider">' },
                { type: 'progress', label: 'Progress Bar', html: '<div class="comp-progress"><div class="comp-progress-bar"></div></div>' },
                { type: 'rect', label: 'Rectangle', html: '<div class="comp-shape-rect" style="width:100%; height:100%;"></div>' },
                { type: 'circle', label: 'Circle', html: '<div class="comp-shape-circle" style="width:100%; height:100%;"></div>' },
                { type: 'triangle', label: 'Triangle', html: '<div class="comp-shape-triangle"></div>' }
            ],

            renderComponentList() {
                const list = document.getElementById('component-list');
                this.components.forEach(comp => {
                    const el = document.createElement('div');
                    el.className = 'component-item';
                    el.draggable = true;
                    el.innerHTML = `<div class="icon"></div> ${comp.label}`;
                    el.addEventListener('dragstart', (e) => {
                        e.dataTransfer.setData('type', comp.type);
                        e.dataTransfer.setData('html', comp.html);
                    });
                    list.appendChild(el);
                });
            },

            // --- Canvas Interaction ---
            setupCanvasEvents() {
                const container = document.getElementById('canvas-container');
                
                // Drop New Element
                container.addEventListener('dragover', e => e.preventDefault());
                container.addEventListener('drop', e => {
                    e.preventDefault();
                    const type = e.dataTransfer.getData('type');
                    const html = e.dataTransfer.getData('html');
                    if (!type) return;

                    const rect = container.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    this.createElement(type, html, x, y);
                });

                // Global Mouse Up (end drag/resize)
                document.addEventListener('mouseup', () => {
                    if (this.dragState) {
                        this.dragState = null;
                        this.updateConnections(); // Ensure lines are tight after move
                    }
                });

                // Global Mouse Move
                document.addEventListener('mousemove', (e) => this.handleMouseMove(e));
            },

            createElement(type, html, x, y) {
                const id = 'el-' + this.nextId++;
                const elData = {
                    id, type, html, x, y, width: 120, height: 40,
                    styles: { backgroundColor: 'transparent', color: 'inherit', borderRadius: '0px', boxShadow: 'none' }
                };
                
                // Default sizes for shapes
                if (type === 'rect') { elData.width = 100; elData.height = 100; }
                if (type === 'circle') { elData.width = 100; elData.height = 100; }
                if (type === 'triangle') { elData.width = 60; elData.height = 60; }

                this.elements.push(elData);
                this.renderElement(elData);
                this.selectElement(id);
            },

            renderElement(data) {
                const container = document.getElementById('canvas-container');
                let el = document.getElementById(data.id);
                
                if (!el) {
                    el = document.createElement('div');
                    el.id = data.id;
                    el.className = 'canvas-element';
                    el.innerHTML = data.html;
                    
                    // Ports for connections
                    ['top', 'bottom', 'left', 'right'].forEach(pos => {
                        const port = document.createElement('div');
                        port.className = `port port-${pos}`;
                        port.dataset.id = data.id;
                        port.dataset.pos = pos;
                        port.onmousedown = (e) => this.startConnection(e, data.id, pos);
                        el.appendChild(port);
                    });

                    // Resize Handles
                    ['tl', 'tr', 'bl', 'br'].forEach(pos => {
                        const handle = document.createElement('div');
                        handle.className = `resize-handle rh-${pos}`;
                        handle.onmousedown = (e) => this.startResize(e, data.id, pos);
                        el.appendChild(handle);
                    });

                    // Selection & Move
                    el.onmousedown = (e) => {
                        if(e.target.classList.contains('port') || e.target.classList.contains('resize-handle')) return;
                        this.startMove(e, data.id);
                        this.selectElement(data.id);
                        e.stopPropagation();
                    };

                    container.appendChild(el);
                }

                // Apply State
                el.style.left = data.x + 'px';
                el.style.top = data.y + 'px';
                el.style.width = data.width + 'px';
                el.style.height = data.height + 'px';
                
                // Apply Custom Styles
                Object.assign(el.style, data.styles);
                
                // Specific style fixes for shapes to ensure they fill the box
                if(data.type === 'triangle') {
                    // Triangle CSS hack relies on borders, width/height of container matters less visually but logically needed
                }
            },

            selectElement(id) {
                this.selectedId = id;
                document.querySelectorAll('.canvas-element').forEach(el => el.classList.remove('selected'));
                if (id) {
                    const el = document.getElementById(id);
                    if(el) el.classList.add('selected');
                    this.renderProperties(id);
                } else {
                    document.getElementById('properties-content').innerHTML = '<div style="padding:20px; text-align:center; color:#666;">Select an element</div>';
                }
            },

            // --- Drag/Resize Logic ---
            startMove(e, id) {
                const elData = this.elements.find(x => x.id === id);
                this.dragState = {
                    type: 'move',
                    id,
                    startX: e.clientX,
                    startY: e.clientY,
                    origX: elData.x,
                    origY: elData.y
                };
            },

            startResize(e, id, corner) {
                e.stopPropagation();
                const elData = this.elements.find(x => x.id === id);
                this.dragState = {
                    type: 'resize',
                    id,
                    corner,
                    startX: e.clientX,
                    startY: e.clientY,
                    origW: elData.width,
                    origH: elData.height,
                    origX: elData.x,
                    origY: elData.y
                };
            },

            startConnection(e, id, pos) {
                e.stopPropagation();
                e.preventDefault(); // Prevent text selection
                const container = document.getElementById('canvas-container');
                const rect = container.getBoundingClientRect();
                
                // Create a temporary SVG line following mouse
                this.dragState = {
                    type: 'connect',
                    fromId: id,
                    fromPos: pos,
                    tempLine: document.createElementNS('http://www.w3.org/2000/svg', 'path'),
                    startX: e.clientX - rect.left,
                    startY: e.clientY - rect.top
                };
                
                this.dragState.tempLine.setAttribute('d', `M ${this.dragState.startX} ${this.dragState.startY} L ${this.dragState.startX} ${this.dragState.startY}`);
                this.dragState.tempLine.style.strokeDasharray = "5,5";
                document.getElementById('canvas-svg').appendChild(this.dragState.tempLine);
            },

            handleMouseMove(e) {
                if (!this.dragState) return;
                const container = document.getElementById('canvas-container');
                const rect = container.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                if (this.dragState.type === 'move') {
                    const dx = mouseX - this.dragState.startX;
                    const dy = mouseY - this.dragState.startY;
                    
                    let newX = this.dragState.origX + dx;
                    let newY = this.dragState.origY + dy;

                    if (this.settings.snap) {
                        newX = Math.round(newX / this.settings.gridSize) * this.settings.gridSize;
                        newY = Math.round(newY / this.settings.gridSize) * this.settings.gridSize;
                    }

                    const elData = this.elements.find(x => x.id === this.dragState.id);
                    elData.x = newX;
                    elData.y = newY;
                    this.renderElement(elData);
                    this.updateConnections();

                } else if (this.dragState.type === 'resize') {
                    const dx = mouseX - this.dragState.startX;
                    const dy = mouseY - this.dragState.startY;
                    const elData = this.elements.find(x => x.id === this.dragState.id);
                    
                    let newW = this.dragState.origW;
                    let newH = this.dragState.origH;
                    let newX = this.dragState.origX;
                    let newY = this.dragState.origY;

                    if (this.dragState.corner.includes('r')) newW += dx;
                    if (this.dragState.corner.includes('b')) newH += dy;
                    if (this.dragState.corner.includes('l')) { newX += dx; newW -= dx; }
                    if (this.dragState.corner.includes('t')) { newY += dy; newH -= dy; }

                    // Min size
                    if (newW < 20) newW = 20;
                    if (newH < 20) newH = 20;

                    elData.width = newW;
                    elData.height = newH;
                    elData.x = newX;
                    elData.y = newY;
                    this.renderElement(elData);
                    this.updateConnections();

                } else if (this.dragState.type === 'connect') {
                    const d = `M ${this.dragState.startX} ${this.dragState.startY} L ${mouseX} ${mouseY}`;
                    this.dragState.tempLine.setAttribute('d', d);
                }
            },

            // --- Connection Logic ---
            // When mouse up on a port
            handlePortDrop(targetId, targetPos) {
                if (this.dragState && this.dragState.type === 'connect') {
                    if (this.dragState.fromId !== targetId) {
                        // Add connection
                        this.connections.push({
                            from: this.dragState.fromId,
                            fromPos: this.dragState.fromPos,
                            to: targetId,
                            toPos: targetPos
                        });
                        this.updateConnections();
                    }
                    // Remove temp line
                    if(this.dragState.tempLine) this.dragState.tempLine.remove();
                    this.dragState = null;
                }
            },
            
            // Attach drop listeners to all ports dynamically
            setupPropertyListeners() {
                // Delegate event for ports since they are recreated
                document.getElementById('canvas-container').addEventListener('mouseup', (e) => {
                    if (e.target.classList.contains('port')) {
                        this.handlePortDrop(e.target.dataset.id, e.target.dataset.pos);
                    } else if (!e.target.closest('.canvas-element') && !e.target.closest('#sidebar-right')) {
                        // Clicked on empty canvas
                        this.selectElement(null);
                    }
                });
            },

            updateConnections() {
                const svg = document.getElementById('canvas-svg');
                svg.innerHTML = ''; // Clear and redraw

                this.connections.forEach(conn => {
                    const fromEl = document.getElementById(conn.from);
                    const toEl = document.getElementById(conn.to);
                    if (!fromEl || !toEl) return;

                    const fromRect = fromEl.getBoundingClientRect();
                    const toRect = toEl.getBoundingClientRect();
                    const containerRect = document.getElementById('canvas-container').getBoundingClientRect();

                    const getCenter = (rect, pos) => {
                        const x = rect.left - containerRect.left + rect.width/2;
                        const y = rect.top - containerRect.top + rect.height/2;
                        // Adjust based on port position roughly
                        if(pos === 'top') return {x, y: rect.top - containerRect.top};
                        if(pos === 'bottom') return {x, y: rect.bottom - containerRect.top};
                        if(pos === 'left') return {x: rect.left - containerRect.left, y};
                        if(pos === 'right') return {x: rect.right - containerRect.left, y};
                        return {x, y};
                    };

                    const p1 = getCenter(fromRect, conn.fromPos);
                    const p2 = getCenter(toRect, conn.toPos);

                    // Bezier Curve
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const deltaX = Math.abs(p2.x - p1.x) * 0.5;
                    const deltaY = Math.abs(p2.y - p1.y) * 0.5;
                    
                    // Simple logic for control points based on direction
                    let c1x = p1.x, c1y = p1.y, c2x = p2.x, c2y = p2.y;
                    
                    if(conn.fromPos === 'right') c1x += 50;
                    if(conn.fromPos === 'left') c1x -= 50;
                    if(conn.fromPos === 'bottom') c1y += 50;
                    if(conn.fromPos === 'top') c1y -= 50;

                    if(conn.toPos === 'right') c2x += 50;
                    if(conn.toPos === 'left') c2x -= 50;
                    if(conn.toPos === 'bottom') c2y += 50;
                    if(conn.toPos === 'top') c2y -= 50;

                    const d = `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
                    path.setAttribute('d', d);
                    
                    // Delete connection on click
                    path.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if(confirm('Delete connection?')) {
                            this.connections = this.connections.filter(c => c !== conn);
                            this.updateConnections();
                        }
                    });

                    svg.appendChild(path);
                });
            },

            // --- Properties Panel ---
            renderProperties(id) {
                const data = this.elements.find(x => x.id === id);
                if (!data) return;

                const panel = document.getElementById('properties-content');
                panel.innerHTML = `
                    <div class="prop-group">
                        <div class="prop-row"><label>ID</label> <input type="text" value="${data.id}" disabled style="opacity:0.5"></div>
                        <div class="prop-row"><label>Type</label> <input type="text" value="${data.type}" disabled style="opacity:0.5"></div>
                    </div>
                    <div class="prop-group">
                        <div class="panel-header" style="padding:10px; font-size:0.9rem;">Layout</div>
                        <div class="prop-row"><label>X</label> <input type="number" id="prop-x" value="${Math.round(data.x)}"></div>
                        <div class="prop-row"><label>Y</label> <input type="number" id="prop-y" value="${Math.round(data.y)}"></div>
                        <div class="prop-row"><label>Width</label> <input type="number" id="prop-w" value="${Math.round(data.width)}"></div>
                        <div class="prop-row"><label>Height</label> <input type="number" id="prop-h" value="${Math.round(data.height)}"></div>
                    </div>
                    <div class="prop-group">
                        <div class="panel-header" style="padding:10px; font-size:0.9rem;">Style</div>
                        <div class="prop-row"><label>Bg Color</label> <input type="color" id="prop-bg" value="${this.rgbToHex(data.styles.backgroundColor) || '#ffffff'}"></div>
                        <div class="prop-row"><label>Text Color</label> <input type="color" id="prop-color" value="${this.rgbToHex(data.styles.color) || '#000000'}"></div>
                        <div class="prop-row"><label>Border Radius</label> <input type="text" id="prop-radius" value="${data.styles.borderRadius || '0px'}"></div>
                        <div class="prop-row"><label>Box Shadow</label> <input type="text" id="prop-shadow" value="${data.styles.boxShadow || 'none'}" placeholder="x y blur color"></div>
                    </div>
                    <div class="prop-group">
                        <button class="btn btn-danger" onclick="app.deleteElement('${data.id}')">Delete Element</button>
                    </div>
                `;

                // Bind Inputs
                ['x', 'y', 'w', 'h'].forEach(k => {
                    document.getElementById(`prop-${k}`).addEventListener('input', (e) => {
                        data[k === 'w' ? 'width' : k === 'h' ? 'height' : k] = parseInt(e.target.value);
                        this.renderElement(data);
                        this.updateConnections();
                    });
                });

                ['bg', 'color', 'radius', 'shadow'].forEach(k => {
                    const input = document.getElementById(`prop-${k}`);
                    input.addEventListener('input', (e) => {
                        let val = e.target.value;
                        if(k === 'shadow' && val !== 'none') {
                            // Simple parser for shadow input "x y blur color"
                            const parts = val.split(' ');
                            if(parts.length >= 4) val = `${parts[0]}px ${parts[1]}px ${parts[2]}px ${parts[3]}`;
                        }
                        if(k === 'bg') data.styles.backgroundColor = val;
                        if(k === 'color') data.styles.color = val;
                        if(k === 'radius') data.styles.borderRadius = val;
                        if(k === 'shadow') data.styles.boxShadow = val;
                        this.renderElement(data);
                    });
                });
            },

            deleteElement(id) {
                this.elements = this.elements.filter(e => e.id !== id);
                this.connections = this.connections.filter(c => c.from !== id && c.to !== id);
                document.getElementById(id).remove();
                this.updateConnections();
                this.selectElement(null);
            },

            clearCanvas() {
                if(confirm('Clear entire canvas?')) {
                    this.elements = [];
                    this.connections = [];
                    document.getElementById('canvas-container').innerHTML = '<svg id="canvas-svg"></svg>';
                    this.nextId = 1;
                    this.selectElement(null);
                }
            },

            toggleGrid() {
                this.settings.grid = !this.settings.grid;
                const container = document.getElementById('canvas-container');
                container.style.backgroundImage = this.settings.grid ? 
                    'linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px)' : 'none';
                container.style.backgroundSize = this.settings.grid ? '20px 20px' : 'auto';
            },

            toggleSnap() {
                this.settings.snap = !this.settings.snap;
            },

            // --- Export Logic ---
            exportHTML() {
                const htmlContent = this.elements.map(el => {
                    // Clean styles for export
                    let styleStr = `position:absolute; left:${el.x}px; top:${el.y}px; width:${el.width}px; height:${el.height}px;`;
                    styleStr += `background-color:${el.styles.backgroundColor}; color:${el.styles.color};`;
                    styleStr += `border-radius:${el.styles.borderRadius}; box-shadow:${el.styles.boxShadow};`;
                    styleStr += `display:flex; align-items:center; justify-content:center; box-sizing:border-box;`;
                    
                    // Remove builder-specific classes from HTML string
                    let cleanHtml = el.html.replace(/class="comp-[^"]*"/g, 'style="width:100%; height:100%;"');
                    
                    return `<div style="${styleStr}">${cleanHtml}</div>`;
                }).join('\n');

                const connectionsSvg = this.connections.map(conn => {
                    // In export, we can't easily calculate dynamic positions without JS runtime.
                    // For a static export, we would need to bake the SVG paths.
                    // Simplified: We will include the SVG layer with hardcoded paths based on current positions.
                    const fromEl = this.elements.find(e => e.id === conn.from);
                    const toEl = this.elements.find(e => e.id === conn.to);
                    if(!fromEl || !toEl) return '';
                    
                    // Recalculate centers (same logic as updateConnections)
                    const getCenter = (el, pos) => {
                        const x = el.x + el.width/2;
                        const y = el.y + el.height/2;
                        if(pos === 'top') return {x, y: el.y};
                        if(pos === 'bottom') return {x, y: el.y + el.height};
                        if(pos === 'left') return {x: el.x, y};
                        if(pos === 'right') return {x: el.x + el.width, y};
                        return {x, y};
                    };
                    const p1 = getCenter(fromEl, conn.fromPos);
                    const p2 = getCenter(toEl, conn.toPos);
                    
                    const deltaX = Math.abs(p2.x - p1.x) * 0.5;
                    const deltaY = Math.abs(p2.y - p1.y) * 0.5;
                    let c1x = p1.x, c1y = p1.y, c2x = p2.x, c2y = p2.y;
                    if(conn.fromPos === 'right') c1x += 50; if(conn.fromPos === 'left') c1x -= 50;
                    if(conn.fromPos === 'bottom') c1y += 50; if(conn.fromPos === 'top') c1y -= 50;
                    if(conn.toPos === 'right') c2x += 50; if(conn.toPos === 'left') c2x -= 50;
                    if(conn.toPos === 'bottom') c2y += 50; if(conn.toPos === 'top') c2y -= 50;

                    const d = `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
                    return `<path d="${d}" stroke="#007acc" stroke-width="2" fill="none" />`;
                }).join('');

                const fullHtml = `
<!DOCTYPE html>
<html>
<head>
    <title>Exported Design</title>
    <style>
        body { margin: 0; padding: 0; background: #f0f0f0; font-family: sans-serif; }
        #export-canvas { position: relative; width: 800px; height: 600px; background: white; margin: 50px auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow: hidden; }
        svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="export-canvas">
        <svg>${connectionsSvg}</svg>
        ${htmlContent}
    </div>
</body>
</html>`;

                const blob = new Blob([fullHtml], {type: 'text/html'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'design.html';
                a.click();
            },

            // Helper
            rgbToHex(rgb) {
                if (!rgb || rgb === 'transparent') return '#ffffff';
                if (rgb.startsWith('#')) return rgb;
                const sep = rgb.indexOf(",") > -1 ? "," : " ";
                rgb = rgb.substr(4).split(")")[0].split(sep);
                let r = (+rgb[0]).toString(16), g = (+rgb[1]).toString(16), b = (+rgb[2]).toString(16);
                if (r.length == 1) r = "0" + r; if (g.length == 1) g = "0" + g; if (b.length == 1) b = "0" + b;
                return "#" + r + g + b;
            },

            loop() {
                requestAnimationFrame(() => this.loop());
            }
        };

        // Start App
        app.init();

    </script>
</body>
</html>
