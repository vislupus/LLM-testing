<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drafting Table — UI Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --paper:       #f4efe4;
  --paper-deep:  #ede7d7;
  --paper-soft:  #faf6ec;
  --ink:         #14243b;
  --ink-soft:    #3a4b66;
  --ink-faint:   #7a8599;
  --rule:        #c7bfa9;
  --rule-soft:   #ddd5bf;

  --accent:      #0d5e6e;     /* blueprint teal */
  --accent-hi:   #117e93;
  --accent-soft: rgba(13, 94, 110, 0.12);
  --accent-softer: rgba(13, 94, 110, 0.06);

  --warning:     #b14d2a;
  --handle:      #14243b;
  --handle-hi:   #0d5e6e;

  --grid-line:   rgba(13, 94, 110, 0.08);
  --grid-line-2: rgba(13, 94, 110, 0.18);

  --shadow-sm:   0 1px 2px rgba(20, 36, 59, 0.08);
  --shadow-md:   0 4px 14px rgba(20, 36, 59, 0.1);
  --shadow-lg:   0 20px 50px rgba(20, 36, 59, 0.15);

  --display:     "Newsreader", Georgia, serif;
  --body:        "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif;
  --mono:        "JetBrains Mono", "SF Mono", Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; }
input:focus, select:focus, textarea:focus { outline: none; }

/* ============================================================
   LAYOUT
   ============================================================ */
#app {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  grid-template-rows: 50px 1fr;
  grid-template-areas:
    "topbar topbar topbar"
    "library canvas inspector";
  height: 100vh;
  width: 100vw;
}

/* ============================================================
   TOP BAR
   ============================================================ */
#topbar {
  grid-area: topbar;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: var(--paper-soft);
  border-bottom: 1px solid var(--rule);
  gap: 14px;
}
.brand {
  font-family: var(--display);
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.015em;
  color: var(--ink);
  padding-right: 14px;
  border-right: 1px solid var(--rule);
  margin-right: 4px;
}
.brand sup {
  font-family: var(--mono);
  font-style: normal;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--accent);
  margin-left: 6px;
  vertical-align: 8px;
}

.tool-tab {
  padding: 8px 12px;
  font-size: 12px;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
  border-radius: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.tool-tab:hover { background: var(--paper-deep); color: var(--ink); }
.tool-tab.active {
  background: var(--ink);
  color: var(--paper-soft);
}
.tool-tab svg { width: 14px; height: 14px; }

.top-spacer { flex: 1; }

.action-btn {
  padding: 7px 14px;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--ink);
  border: 1px solid var(--rule);
  background: transparent;
  border-radius: 2px;
  transition: all 120ms;
}
.action-btn:hover { border-color: var(--ink); }
.action-btn.primary {
  background: var(--accent);
  color: var(--paper-soft);
  border-color: var(--accent);
}
.action-btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.action-btn.danger:hover { border-color: var(--warning); color: var(--warning); }

.top-stat {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
  display: flex;
  flex-direction: column;
  line-height: 1.3;
}
.top-stat b { color: var(--ink); font-weight: 500; font-size: 11px; }

/* ============================================================
   LIBRARY (left)
   ============================================================ */
#library {
  grid-area: library;
  background: var(--paper-soft);
  border-right: 1px solid var(--rule);
  overflow-y: auto;
  padding: 18px 0;
}
#library::-webkit-scrollbar { width: 6px; }
#library::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.lib-search-wrap { padding: 0 18px 14px; }
.lib-search {
  width: 100%;
  padding: 7px 10px;
  font-size: 12px;
  background: var(--paper-deep);
  border: 1px solid var(--rule);
  border-radius: 3px;
  color: var(--ink);
  font-family: var(--body);
}
.lib-search:focus { border-color: var(--accent); background: white; }

.lib-section {
  margin-bottom: 8px;
}
.lib-section-head {
  padding: 10px 18px 8px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink-faint);
  display: flex;
  align-items: center;
  gap: 10px;
}
.lib-section-head::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--rule-soft);
}

.lib-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  padding: 0 12px;
}
.lib-item {
  background: var(--paper-soft);
  border: 1px solid var(--rule-soft);
  border-radius: 3px;
  padding: 10px 8px 8px;
  cursor: grab;
  position: relative;
  transition: all 140ms;
  text-align: center;
  min-height: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.lib-item:hover {
  border-color: var(--accent);
  background: white;
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.lib-item:active { cursor: grabbing; }
.lib-item.dragging { opacity: 0.4; }
.lib-item .preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
}
.lib-item .preview svg { width: 32px; height: 24px; }
.lib-item .preview .mini-btn {
  font-family: var(--body);
  font-size: 9px;
  padding: 3px 7px;
  background: var(--ink);
  color: var(--paper);
  border-radius: 2px;
}
.lib-item .preview .mini-input {
  width: 40px;
  height: 12px;
  border: 1px solid var(--ink-soft);
  border-radius: 1px;
  background: white;
}
.lib-item .preview .mini-check {
  width: 10px;
  height: 10px;
  border: 1px solid var(--ink);
  border-radius: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: 8px;
}
.lib-item .label {
  font-size: 10px;
  color: var(--ink-soft);
  letter-spacing: 0.02em;
}
.lib-item.shape .preview svg {
  color: var(--accent);
  fill: var(--accent-soft);
  stroke: var(--accent);
  stroke-width: 1.5;
}

/* ============================================================
   CANVAS AREA
   ============================================================ */
#canvas-area {
  grid-area: canvas;
  position: relative;
  overflow: hidden;
  background: var(--paper);
}
#canvas-scroll {
  position: absolute;
  inset: 0;
  overflow: auto;
  padding: 48px;
}
#canvas-scroll::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
#canvas-scroll::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 5px; }

#canvas {
  position: relative;
  background: white;
  box-shadow: var(--shadow-lg);
  margin: 0 auto;
  /* blueprint grid */
  background-image:
    linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px),
    linear-gradient(to right, var(--grid-line-2) 1px, transparent 1px),
    linear-gradient(to bottom, var(--grid-line-2) 1px, transparent 1px);
  background-size: 10px 10px, 10px 10px, 100px 100px, 100px 100px;
}

#canvas.dragging-over { box-shadow: 0 0 0 3px var(--accent), var(--shadow-lg); }

#connections-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 1;
  overflow: visible;
}
#connections-svg .conn-line {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.5;
  pointer-events: stroke;
  cursor: pointer;
}
#connections-svg .conn-line:hover { stroke: var(--accent); stroke-width: 2; }
#connections-svg .conn-line.selected { stroke: var(--accent); stroke-width: 2; }
#connections-svg .conn-hit {
  fill: none;
  stroke: transparent;
  stroke-width: 12;
  pointer-events: stroke;
  cursor: pointer;
}
#connections-svg .conn-endpoint {
  fill: var(--ink);
}
#connections-svg .conn-line.selected ~ .conn-endpoint,
#connections-svg .conn-endpoint.selected { fill: var(--accent); }

/* Elements on canvas */
.el {
  position: absolute;
  cursor: move;
  z-index: 2;
  box-sizing: border-box;
}
.el.selected { z-index: 3; }
.el.connectable-hover { outline: 2px dashed var(--accent); outline-offset: 2px; }
.el.connect-source { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Selection chrome */
.sel-frame {
  position: absolute;
  border: 1.5px solid var(--accent);
  pointer-events: none;
  z-index: 10;
}
.sel-handles {
  position: absolute;
  z-index: 11;
}
.handle {
  position: absolute;
  width: 9px; height: 9px;
  background: white;
  border: 1.5px solid var(--accent);
  border-radius: 1px;
  pointer-events: all;
}
.handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
.handle.n  { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
.handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
.handle.e  { top: 50%; right: -5px; margin-top: -5px; cursor: ew-resize; }
.handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
.handle.s  { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
.handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
.handle.w  { top: 50%; left: -5px; margin-top: -5px; cursor: ew-resize; }

/* Anchor dots (shown in connect mode) */
.anchor-dot {
  position: absolute;
  width: 10px; height: 10px;
  background: var(--accent);
  border: 2px solid white;
  border-radius: 50%;
  cursor: crosshair;
  z-index: 12;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1px var(--accent);
}
.anchor-dot:hover { transform: translate(-50%, -50%) scale(1.4); }

/* Alignment guides */
.align-guide {
  position: absolute;
  background: var(--warning);
  z-index: 50;
  pointer-events: none;
}
.align-guide.h { height: 1px; }
.align-guide.v { width: 1px; }
.align-guide.gap-label {
  background: var(--warning);
  color: white;
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 2px;
  line-height: 1.2;
  height: auto;
  width: auto;
}

/* ============================================================
   CANVAS UTILITIES BAR (below canvas, floating)
   ============================================================ */
.canvas-util-bar {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--paper-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  padding: 4px;
  display: flex;
  gap: 2px;
  box-shadow: var(--shadow-md);
  z-index: 100;
  align-items: center;
}
.canvas-util-bar button {
  width: 28px; height: 26px;
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  border-radius: 2px;
}
.canvas-util-bar button:hover { background: var(--paper-deep); color: var(--ink); }
.canvas-util-bar button.active { background: var(--ink); color: var(--paper); }
.canvas-util-bar button svg { width: 14px; height: 14px; }
.canvas-util-bar .bar-sep { width: 1px; height: 16px; background: var(--rule); margin: 0 2px; }
.canvas-util-bar .zoom-val {
  font-family: var(--mono);
  font-size: 10px;
  padding: 0 8px;
  color: var(--ink-soft);
  letter-spacing: 0.04em;
  min-width: 48px;
  text-align: center;
}

/* ============================================================
   INSPECTOR (right)
   ============================================================ */
#inspector {
  grid-area: inspector;
  background: var(--paper-soft);
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
#inspector::-webkit-scrollbar { width: 6px; }
#inspector::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 3px; }

.insp-empty {
  padding: 40px 24px;
  text-align: center;
  color: var(--ink-faint);
  font-family: var(--display);
  font-style: italic;
  font-size: 16px;
  line-height: 1.45;
}
.insp-empty .hint {
  font-family: var(--mono);
  font-style: normal;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-top: 14px;
  color: var(--ink-faint);
}

.insp-header {
  padding: 14px 18px 12px;
  border-bottom: 1px solid var(--rule);
}
.insp-header .type {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 500;
  margin-bottom: 4px;
}
.insp-header .id {
  font-family: var(--display);
  font-style: italic;
  font-size: 20px;
  color: var(--ink);
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.insp-section {
  border-bottom: 1px solid var(--rule-soft);
  padding: 14px 18px 16px;
}
.insp-section:last-child { border-bottom: none; }
.insp-section-title {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 12px;
}

.field-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}
.field-row label {
  font-size: 11px;
  color: var(--ink-soft);
}
.field-row .full-input {
  grid-column: 1 / -1;
}
.field-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.field-input {
  width: 100%;
  padding: 5px 8px;
  font-family: var(--mono);
  font-size: 11px;
  background: white;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
}
.field-input:focus { border-color: var(--accent); }
.field-input.text-input { font-family: var(--body); font-size: 12px; }

.field-select {
  width: 100%;
  padding: 5px 6px;
  font-size: 11px;
  background: white;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  cursor: pointer;
}

.field-color-wrap {
  display: flex;
  gap: 6px;
  align-items: center;
}
.field-color {
  width: 26px; height: 22px;
  border: 1px solid var(--rule);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  overflow: hidden;
}
.field-color input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.field-color-text {
  flex: 1;
  padding: 4px 6px;
  font-family: var(--mono);
  font-size: 10px;
  background: white;
  border: 1px solid var(--rule);
  border-radius: 2px;
  color: var(--ink);
  text-transform: uppercase;
}

.slider-field {
  display: flex;
  align-items: center;
  gap: 8px;
}
.slider-field input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 14px;
  background: transparent;
  cursor: pointer;
}
.slider-field input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--rule); border-radius: 1px; }
.slider-field input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: -5px;
  border: 2px solid var(--paper-soft);
  box-shadow: 0 0 0 1px var(--accent);
}
.slider-field input[type=range]::-moz-range-track { height: 2px; background: var(--rule); border-radius: 1px; }
.slider-field input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--paper-soft); box-shadow: 0 0 0 1px var(--accent); }
.slider-field .num {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-soft);
  min-width: 34px;
  text-align: right;
}

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.toggle {
  position: relative;
  width: 28px; height: 16px;
  background: var(--rule);
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 12px; height: 12px;
  background: white;
  border-radius: 50%;
  transition: left 120ms;
  box-shadow: var(--shadow-sm);
}
.toggle.on { background: var(--accent); }
.toggle.on::after { left: 14px; }

.shadow-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.tiny-btn {
  font-size: 10px;
  padding: 5px 8px;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  border: 1px solid var(--rule);
  border-radius: 2px;
  background: white;
}
.tiny-btn:hover { border-color: var(--accent); color: var(--accent); }
.tiny-btn.danger:hover { border-color: var(--warning); color: var(--warning); }
.tiny-btn.full { width: 100%; }

.align-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
}
.align-row button {
  padding: 6px 0;
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  border-radius: 2px;
}
.align-row button:hover { background: var(--paper-deep); color: var(--ink); }
.align-row button svg { width: 14px; height: 14px; }

/* ============================================================
   MODAL (export preview)
   ============================================================ */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(20, 36, 59, 0.55);
  z-index: 10000;
  display: grid;
  place-items: center;
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.modal {
  background: var(--paper-soft);
  border: 1px solid var(--rule);
  border-radius: 6px;
  width: min(780px, 92vw);
  max-height: 88vh;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.modal-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head .t {
  font-family: var(--display);
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.01em;
}
.modal-head .t em { font-style: italic; color: var(--accent); }
.modal-close {
  width: 26px; height: 26px;
  display: grid;
  place-items: center;
  color: var(--ink-soft);
  border-radius: 3px;
}
.modal-close:hover { background: var(--paper-deep); color: var(--ink); }

.modal-body {
  flex: 1;
  overflow: auto;
  padding: 16px 22px;
}
.modal-body pre {
  background: white;
  border: 1px solid var(--rule-soft);
  border-radius: 4px;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  color: var(--ink);
  max-height: 56vh;
  overflow: auto;
  white-space: pre;
}
.modal-foot {
  padding: 12px 22px 16px;
  border-top: 1px solid var(--rule);
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: var(--paper-soft);
  padding: 9px 16px;
  border-radius: 3px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  font-family: var(--mono);
  opacity: 0;
  transition: opacity 180ms, transform 180ms;
  z-index: 20000;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   CONTEXT MENU
   ============================================================ */
.ctx-menu {
  position: fixed;
  background: var(--paper-soft);
  border: 1px solid var(--rule);
  border-radius: 4px;
  box-shadow: var(--shadow-lg);
  padding: 4px;
  min-width: 160px;
  z-index: 9000;
  font-size: 12px;
}
.ctx-menu .ci {

   ============================================================================ */

/* ---------- utilities ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

let uidCounter = 1;
const uid = (prefix='el') => prefix + '_' + (uidCounter++);

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function roundTo(v, step) { return Math.round(v / step) * step; }

/* ============================================================================
   DOCUMENT MODEL

/* ============================================================================

const LIBRARY = {
  /* --- Form components --- */

    preview: `<svg viewBox="0 0 32 24"><rect x="3" y="3" width="26" height="18" rx="2"/></svg>`,
    defaultW: 160, defaultH: 100,
    props: {},
    style: { bg: '#0d5e6e', borderWidth: 0, borderColor: '#14243b', borderRadius: 6, shadowX: 0, shadowY: 4, shadowBlur: 12, shadowColor: 'rgba(13,94,110,0.25)', shadowSpread: 0 },
    render(el) {
      const s = el.style;
      const css = [
        `width:100%`,`height:100%`,
        `background:${s.bg}`,
        `border:${s.borderWidth}px solid ${s.borderColor}`,
        `border-radius:${s.borderRadius}px`,
        `box-shadow:${boxShadowCss(s)}`,
        `box-sizing:border-box`,
      ].join(';');
      return `<div style="${css}"></div>`;
    },
    fields: [
      { kind: 'color', key: 'style.bg', label: 'Fill' },
      { kind: 'color', key: 'style.borderColor', label: 'Border' },
      { kind: 'slider', key: 'style.borderWidth', label: 'B. Width', min: 0, max: 12, step: 1, unit: 'px' },
      { kind: 'slider', key: 'style.borderRadius', label: 'Radius', min: 0, max: 100, step: 1, unit: 'px' },
    ],
  },

  circle: {
    label: 'Circle',
    group: 'shapes', isShape: true,
    preview: `<svg viewBox="0 0 32 24"><circle cx="16" cy="12" r="9"/></svg>`,
    defaultW: 100, defaultH: 100,
    props: {},
    style: { bg: '#b14d2a', borderWidth: 0, borderColor: '#14243b', shadowX: 0, shadowY: 4, shadowBlur: 12, shadowColor: 'rgba(177,77,42,0.3)', shadowSpread: 0, borderRadius: 999 },
    render(el) {
      const s = el.style;
      const css = [
        `width:100%`,`height:100%`,
        `background:${s.bg}`,
        `border:${s.borderWidth}px solid ${s.borderColor}`,
        `border-radius:50%`,
        `box-shadow:${boxShadowCss(s)}`,
        `box-sizing:border-box`,
      ].join(';');
      return `<div style="${css}"></div>`;
    },
    fields: [
      { kind: 'color', key: 'style.bg', label: 'Fill' },
      { kind: 'color', key: 'style.borderColor', label: 'Border' },
      { kind: 'slider', key: 'style.borderWidth', label: 'B. Width', min: 0, max: 12, step: 1, unit: 'px' },
    ],
  },

  triangle: {
    label: 'Triangle',
    group: 'shapes', isShape: true,
    preview: `<svg viewBox="0 0 32 24"><polygon points="16,4 28,20 4,20"/></svg>`,
    defaultW: 120, defaultH: 100,
    props: {},
    style: { bg: '#14243b', borderWidth: 0, borderColor: '#14243b', shadowX: 0, shadowY: 0, shadowBlur: 0, shadowColor: 'rgba(0,0,0,0)', shadowSpread: 0, borderRadius: 0 },
    render(el) {
      const s = el.style;
      /* We use SVG so the triangle has a real hit shape and can carry border/shadow correctly */
      const strokeW = s.borderWidth || 0;
      const pad = Math.max(1, strokeW / 2);
      return `
        <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible;filter:${s.shadowBlur || s.shadowY || s.shadowX ? `drop-shadow(${s.shadowX}px ${s.shadowY}px ${s.shadowBlur}px ${s.shadowColor})` : 'none'};">
          <polygon points="50,${pad} ${100-pad},${100-pad} ${pad},${100-pad}"
                   fill="${s.bg}"
                   stroke="${s.borderColor}"
                   stroke-width="${strokeW}"
                   stroke-linejoin="round"/>
        </svg>`;
    },
    fields: [
      { kind: 'color', key: 'style.bg', label: 'Fill' },
      { kind: 'color', key: 'style.borderColor', label: 'Border' },
      { kind: 'slider', key: 'style.borderWidth', label: 'B. Width', min: 0, max: 12, step: 1, unit: 'px' },
    ],
  },

  line: {
    label: 'Line',
    group: 'shapes', isShape: true,
    preview: `<svg viewBox="0 0 32 24" stroke-width="1.5"><line x1="4" y1="20" x2="28" y2="4"/></svg>`,
    defaultW: 160, defaultH: 4,
    props: {},
    style: { bg: '#14243b', borderWidth: 0, borderColor: '#14243b', shadowX: 0, shadowY: 0, shadowBlur: 0, shadowColor: 'rgba(0,0,0,0)', shadowSpread: 0, borderRadius: 2 },
    render(el) {
      const s = el.style;
      const css = [
        `width:100%`,`height:100%`,
        `background:${s.bg}`,
        `border-radius:${s.borderRadius}px`,
        `box-shadow:${boxShadowCss(s)}`,
      ].join(';');
      return `<div style="${css}"></div>`;
    },
    fields: [
      { kind: 'color', key: 'style.bg', label: 'Color' },
      { kind: 'slider', key: 'style.borderRadius', label: 'Radius', min: 0, max: 20, step: 1, unit: 'px' },
    ],
  },
};

function boxShadowCss(s) {
  if (!s || (!s.shadowBlur && !s.shadowX && !s.shadowY && !s.shadowSpread)) return 'none';
  return `${s.shadowX||0}px ${s.shadowY||0}px ${s.shadowBlur||0}px ${s.shadowSpread||0}px ${s.shadowColor||'rgba(0,0,0,0.2)'}`;
}

/* ---------- escape helpers ---------- */
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* ============================================================================
   CORE DOM REFS
   ============================================================================ */
const canvasEl        = $('#canvas');
const canvasScroll    = $('#canvas-scroll');
const connectionsSvg  = $('#connections-svg');
const inspector       = $('#inspector');
const libBody         = $('#lib-body');
const statElements    = $('#stat-elements');
const statConnections = $('#stat-connections');

let currentTool = 'select';    // 'select' | 'connect'
let pendingConnection = null;  // { fromId, fromAnchor }

/* ============================================================================
   LIBRARY PANEL
   ============================================================================ */
function renderLibrary(filter='') {
  const groups = { components: [], shapes: [] };
  for (const [key, def] of Object.entries(LIBRARY)) {
    if (filter && !def.label.toLowerCase().includes(filter.toLowerCase())) continue;
    groups[def.group].push({ key, def });
  }

  let html = '';
  if (groups.components.length) {
    html += `<div class="lib-section"><div class="lib-section-head">Components</div><div class="lib-grid">`;
    for (const { key, def } of groups.components) {
      html += `<div class="lib-item" draggable="true" data-kind="${key}">
        <div class="preview">${def.preview}</div>
        <div class="label">${def.label}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  if (groups.shapes.length) {
    html += `<div class="lib-section"><div class="lib-section-head">Shapes</div><div class="lib-grid">`;
    for (const { key, def } of groups.shapes) {
      html += `<div class="lib-item shape" draggable="true" data-kind="${key}">
        <div class="preview">${def.preview}</div>
        <div class="label">${def.label}</div>
      </div>`;
    }
    html += `</div></div>`;
  }
  libBody.innerHTML = html;

  /* Drag and click handlers on library items */
  libBody.querySelectorAll('.lib-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/dt-kind', item.dataset.kind);
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    /* click to add at center */
    item.addEventListener('dblclick', () => {
      addElement(item.dataset.kind, doc.canvas.w / 2 - 60, doc.canvas.h / 2 - 20);
    });
  });
}

$('#lib-search').addEventListener('input', (e) => renderLibrary(e.target.value));

/* ============================================================================
   CANVAS DRAG-AND-DROP (receive)
   ============================================================================ */
canvasEl.addEventListener('dragover', (e) => {
  if (e.dataTransfer.types.includes('text/dt-kind')) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    canvasEl.classList.add('dragging-over');
  }
});
canvasEl.addEventListener('dragleave', (e) => {
  if (!canvasEl.contains(e.relatedTarget)) canvasEl.classList.remove('dragging-over');
});
canvasEl.addEventListener('drop', (e) => {
  canvasEl.classList.remove('dragging-over');
  const kind = e.dataTransfer.getData('text/dt-kind');
  if (!kind || !LIBRARY[kind]) return;
  e.preventDefault();
  const rect = canvasEl.getBoundingClientRect();
  const def = LIBRARY[kind];
  const x = (e.clientX - rect.left) / doc.zoom - def.defaultW / 2;
  const y = (e.clientY - rect.top) / doc.zoom - def.defaultH / 2;
  addElement(kind, x, y);
});

/* ============================================================================
   ELEMENT CRUD
   ============================================================================ */
function addElement(kind, x, y) {
  const def = LIBRARY[kind];
  if (!def) return;
  const id = uid(kind);
  const snap = doc.snap ? doc.gridSize : 1;
  const el = {
    id,
    type: kind,
    x: roundTo(clamp(x, 0, doc.canvas.w - def.defaultW), snap),
    y: roundTo(clamp(y, 0, doc.canvas.h - def.defaultH), snap),
    w: def.defaultW,
    h: def.defaultH,
    props: JSON.parse(JSON.stringify(def.props || {})),
    style: JSON.parse(JSON.stringify(def.style || {})),
  };
  doc.elements.push(el);
  renderCanvas();
  select(id, 'element');
  updateStats();
}

function deleteElement(id) {
  doc.elements = doc.elements.filter(e => e.id !== id);
  doc.connections = doc.connections.filter(c => c.fromId !== id && c.toId !== id);
  if (doc.selected === id) { doc.selected = null; doc.selectedKind = null; }
  renderCanvas();
  renderInspector();
  updateStats();
}

function duplicateElement(id) {
  const src = doc.elements.find(e => e.id === id);
  if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid(src.type);
  copy.x += 20; copy.y += 20;
  doc.elements.push(copy);
  select(copy.id, 'element');
  renderCanvas();
  updateStats();
}

function bringForward(id) {
  const i = doc.elements.findIndex(e => e.id === id);
  if (i < 0 || i === doc.elements.length - 1) return;
  [doc.elements[i], doc.elements[i + 1]] = [doc.elements[i + 1], doc.elements[i]];
  renderCanvas();
}
function sendBackward(id) {
  const i = doc.elements.findIndex(e => e.id === id);
  if (i <= 0) return;
  [doc.elements[i], doc.elements[i - 1]] = [doc.elements[i - 1], doc.elements[i]];
  renderCanvas();
}
function bringToFront(id) {
  const i = doc.elements.findIndex(e => e.id === id);
  if (i < 0) return;
  const [e] = doc.elements.splice(i, 1);
  doc.elements.push(e);
  renderCanvas();
}
function sendToBack(id) {
  const i = doc.elements.findIndex(e => e.id === id);
  if (i < 0) return;
  const [e] = doc.elements.splice(i, 1);
  doc.elements.unshift(e);
  renderCanvas();
}

/* ============================================================================
   RENDERING
   ============================================================================ */
function renderCanvas() {
  /* Set canvas dimensions */
  canvasEl.style.width = doc.canvas.w + 'px';
  canvasEl.style.height = doc.canvas.h + 'px';
  canvasEl.style.backgroundColor = doc.canvas.bg;
  connectionsSvg.setAttribute('width', doc.canvas.w);
  connectionsSvg.setAttribute('height', doc.canvas.h);

  /* Remove old element/handle DOM, keep SVG */
  $$('.el, .sel-frame, .sel-handles, .anchor-dot, .align-guide', canvasEl).forEach(n => n.remove());

  /* Render elements */
  for (const el of doc.elements) {
    const def = LIBRARY[el.type];
    if (!def) continue;
    const node = document.createElement('div');
    node.className = 'el';
    node.dataset.id = el.id;
    node.style.left = el.x + 'px';
    node.style.top  = el.y + 'px';
    node.style.width  = el.w + 'px';
    node.style.height = el.h + 'px';
    node.innerHTML = def.render(el);
    if (doc.selected === el.id && doc.selectedKind === 'element') node.classList.add('selected');
    canvasEl.appendChild(node);
  }

  /* Render selection chrome */
  if (doc.selectedKind === 'element' && doc.selected) {
    const el = getElement(doc.selected);
    if (el) renderSelectionFor(el);
  }

  /* Render connect-mode anchor dots on hovered/selected element */
  /* (We render lazily on mousemove — see connect tool handlers) */

  renderConnections();
  applyZoom();
}

function renderSelectionFor(el) {
  const frame = document.createElement('div');
  frame.className = 'sel-frame';
  frame.style.left = el.x + 'px';
  frame.style.top  = el.y + 'px';
  frame.style.width  = el.w + 'px';
  frame.style.height = el.h + 'px';
  canvasEl.appendChild(frame);

  const handles = document.createElement('div');
  handles.className = 'sel-handles';
  handles.style.left = el.x + 'px';
  handles.style.top  = el.y + 'px';
  handles.style.width  = el.w + 'px';
  handles.style.height = el.h + 'px';
  const H = ['nw','n','ne','e','se','s','sw','w'];
  for (const dir of H) {
    const h = document.createElement('div');
    h.className = 'handle ' + dir;
    h.dataset.handle = dir;
    handles.appendChild(h);
  }
  canvasEl.appendChild(handles);
}

/* Anchor points for a given element: N, S, E, W, center */
function elementAnchor(el, anchor) {
  switch (anchor) {
    case 'n': return { x: el.x + el.w / 2, y: el.y };
    case 's': return { x: el.x + el.w / 2, y: el.y + el.h };
    case 'e': return { x: el.x + el.w,     y: el.y + el.h / 2 };
    case 'w': return { x: el.x,            y: el.y + el.h / 2 };
    case 'c':
    default:  return { x: el.x + el.w / 2, y: el.y + el.h / 2 };
  }
}

/* Pick the best anchor between two elements: the pair minimizing distance */
function pickBestAnchorPair(a, b) {
  const anchors = ['n','s','e','w'];
  let best = { from: 'c', to: 'c', d: Infinity };
  for (const fa of anchors) {
    for (const ta of anchors) {
      const p = elementAnchor(a, fa), q = elementAnchor(b, ta);
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < best.d) best = { from: fa, to: ta, d };
    }
  }
  return best;
}

function getElement(id) { return doc.elements.find(e => e.id === id); }

/* Orthogonal bezier curve that respects anchor direction */
function connectionPath(from, to, fromAnchor, toAnchor) {
  const dx = to.x - from.x, dy = to.y - from.y;
  /* direction vectors pointing OUT of the source element at each anchor */
  const dir = {
    n: [0, -1], s: [0,  1], e: [ 1, 0], w: [-1, 0], c: [Math.sign(dx) || 1, 0],
  };
  const d1 = dir[fromAnchor] || dir.c;
  const d2 = dir[toAnchor] || dir.c;
  /* magnitude: proportional to distance, but bounded */
  const mag = Math.min(180, Math.max(32, Math.hypot(dx, dy) * 0.5));
  const cp1 = { x: from.x + d1[0] * mag, y: from.y + d1[1] * mag };
  const cp2 = { x: to.x   + d2[0] * mag, y: to.y   + d2[1] * mag };
  return `M ${from.x} ${from.y} C ${cp1.x} ${cp1.y}, ${cp2.x} ${cp2.y}, ${to.x} ${to.y}`;
}

function renderConnections() {
  connectionsSvg.innerHTML = '';
  /* arrow marker */
  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  defs.innerHTML = `
    <marker id="conn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink)"/>
    </marker>
    <marker id="conn-arrow-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--accent)"/>
    </marker>
  `;
  connectionsSvg.appendChild(defs);

  for (const conn of doc.connections) {
    const a = getElement(conn.fromId);
    const b = getElement(conn.toId);
    if (!a || !b) continue;

    /* auto-pick anchors each render if they're set to 'auto' */
    let fromAnchor = conn.fromAnchor, toAnchor = conn.toAnchor;
    if (fromAnchor === 'auto' || toAnchor === 'auto') {
      const pair = pickBestAnchorPair(a, b);
      if (fromAnchor === 'auto') fromAnchor = pair.from;
      if (toAnchor === 'auto') toAnchor = pair.to;
    }
    const from = elementAnchor(a, fromAnchor);
    const to   = elementAnchor(b, toAnchor);
    const d = connectionPath(from, to, fromAnchor, toAnchor);
    const selected = doc.selected === conn.id && doc.selectedKind === 'connection';

    /* thick invisible hit area + visible line */
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    hit.setAttribute('class', 'conn-hit');
    hit.setAttribute('d', d);
    hit.dataset.connId = conn.id;
    connectionsSvg.appendChild(hit);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('class', 'conn-line' + (selected ? ' selected' : ''));
    line.setAttribute('d', d);
    if (conn.style) {
      if (conn.style.color) line.setAttribute('stroke', selected ? 'var(--accent)' : conn.style.color);
      if (conn.style.width) line.setAttribute('stroke-width', conn.style.width);
      if (conn.style.dashed) line.setAttribute('stroke-dasharray', '6 4');
    }
    if (conn.style?.arrowEnd !== false) line.setAttribute('marker-end', selected ? 'url(#conn-arrow-sel)' : 'url(#conn-arrow)');
    if (conn.style?.arrowStart) line.setAttribute('marker-start', selected ? 'url(#conn-arrow-sel)' : 'url(#conn-arrow)');
    line.dataset.connId = conn.id;
    connectionsSvg.appendChild(line);

    /* endpoint circles */
    for (const pt of [from, to]) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('class', 'conn-endpoint' + (selected ? ' selected' : ''));
      c.setAttribute('cx', pt.x);
      c.setAttribute('cy', pt.y);
      c.setAttribute('r', 3);
      c.setAttribute('fill', selected ? 'var(--accent)' : 'var(--ink)');
      connectionsSvg.appendChild(c);
    }
  }
}

function updateStats() {
  statElements.textContent = doc.elements.length;
  statConnections.textContent = doc.connections.length;
}

/* ============================================================================
   ZOOM
   ============================================================================ */
function applyZoom() {
  canvasEl.style.transform = `scale(${doc.zoom})`;
  canvasEl.style.transformOrigin = 'top left';
  canvasEl.style.marginRight  = (doc.canvas.w * (doc.zoom - 1)) + 'px';
  canvasEl.style.marginBottom = (doc.canvas.h * (doc.zoom - 1)) + 'px';
  $('#zoom-val').textContent = Math.round(doc.zoom * 100) + '%';
}
function setZoom(z) {
  doc.zoom = clamp(z, 0.25, 3);
  applyZoom();
}
$('#btn-zoom-in').addEventListener('click', () => setZoom(doc.zoom * 1.25));
$('#btn-zoom-out').addEventListener('click', () => setZoom(doc.zoom / 1.25));

canvasScroll.addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    const f = e.deltaY < 0 ? 1.1 : 0.91;
    setZoom(doc.zoom * f);
  }
}, { passive: false });

/* ============================================================================
   SELECT + MOVE + RESIZE
   ============================================================================ */
function select(id, kind) {
  doc.selected = id;
  doc.selectedKind = kind;
  renderCanvas();
  renderInspector();
}

/* Convert clientX/Y into canvas coordinates (respecting zoom) */
function clientToCanvas(clientX, clientY) {
  const r = canvasEl.getBoundingClientRect();
  return {
    x: (clientX - r.left) / doc.zoom,
    y: (clientY - r.top)  / doc.zoom,
  };
}

let dragState = null;

canvasEl.addEventListener('mousedown', onCanvasMouseDown);
canvasScroll.addEventListener('mousedown', (e) => {
  /* click on empty canvas area (outside canvasEl) → deselect */
  if (e.target === canvasScroll) {
    doc.selected = null;
    doc.selectedKind = null;
    renderCanvas();
    renderInspector();
    hideAlignGuides();
  }
});

function onCanvasMouseDown(e) {
  if (e.button !== 0) return;

  /* --- Handle: resize --- */
  const handleEl = e.target.closest('.handle');
  if (handleEl && doc.selectedKind === 'element') {
    const el = getElement(doc.selected);
    if (!el) return;
    e.preventDefault();
    e.stopPropagation();
    const dir = handleEl.dataset.handle;
    const p = clientToCanvas(e.clientX, e.clientY);
    dragState = {
      mode: 'resize',
      dir,
      startX: p.x, startY: p.y,
      origX: el.x, origY: el.y, origW: el.w, origH: el.h,
      id: el.id,
    };
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragUp);
    return;
  }

  /* --- Anchor dot: start a connection --- */
  const anchorEl = e.target.closest('.anchor-dot');
  if (anchorEl) {
    e.preventDefault();
    e.stopPropagation();
    pendingConnection = {
      fromId: anchorEl.dataset.elId,
      fromAnchor: anchorEl.dataset.anchor,
    };
    dragState = {
      mode: 'connect-drag',
      fromId: pendingConnection.fromId,
      fromAnchor: pendingConnection.fromAnchor,
    };
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragUp);
    return;
  }

  /* --- Connection line hit --- */
  const hit = e.target.closest('[data-conn-id]');
  if (hit && hit.tagName.toLowerCase() === 'path') {
    e.stopPropagation();
    select(hit.dataset.connId, 'connection');
    return;
  }

  /* --- Element body: start move or select --- */
  const elNode = e.target.closest('.el');
  if (elNode) {
    const id = elNode.dataset.id;
    if (currentTool === 'connect') {
      e.stopPropagation();
      e.preventDefault();
      if (!pendingConnection) {
        pendingConnection = { fromId: id, fromAnchor: 'auto' };
        elNode.classList.add('connect-source');
      } else {
        /* second click: create connection */
        if (pendingConnection.fromId !== id) {
          addConnection(pendingConnection.fromId, id, pendingConnection.fromAnchor, 'auto');
        }
        pendingConnection = null;
        renderCanvas();
      }
      return;
    }
    /* select tool */
    if (doc.selected !== id || doc.selectedKind !== 'element') {
      select(id, 'element');
    }
    e.preventDefault();
    const p = clientToCanvas(e.clientX, e.clientY);
    const el = getElement(id);
    dragState = {
      mode: 'move',
      id,
      startX: p.x, startY: p.y,
      origX: el.x, origY: el.y,
    };
    window.addEventListener('mousemove', onDragMove);
    window.addEventListener('mouseup', onDragUp);
    return;
  }

  /* --- Clicked on canvas background --- */
  if (e.target === canvasEl) {
    if (pendingConnection && currentTool === 'connect') {
      pendingConnection = null;
      renderCanvas();
    }
    doc.selected = null;
    doc.selectedKind = null;
    renderCanvas();
    renderInspector();
  }
}

function onDragMove(e) {
  if (!dragState) return;
  const p = clientToCanvas(e.clientX, e.clientY);
  const snap = doc.snap ? doc.gridSize : 1;

  if (dragState.mode === 'move') {
    const el = getElement(dragState.id);
    if (!el) return;
    const dx = p.x - dragState.startX;
    const dy = p.y - dragState.startY;
    let nx = dragState.origX + dx;
    let ny = dragState.origY + dy;
    if (doc.snap) {
      nx = roundTo(nx, snap);
      ny = roundTo(ny, snap);
    }
    nx = clamp(nx, 0, doc.canvas.w - el.w);
    ny = clamp(ny, 0, doc.canvas.h - el.h);

    /* Alignment guides */
    if (doc.guides) {
      const gs = computeGuides(el, nx, ny);
      if (gs.snapX !== null) nx = gs.snapX;
      if (gs.snapY !== null) ny = gs.snapY;
      showAlignGuides(gs.lines);
    }

    el.x = nx; el.y = ny;
    /* Directly update DOM for smoothness */
    const node = canvasEl.querySelector('.el[data-id="' + el.id + '"]');
    if (node) { node.style.left = nx + 'px'; node.style.top = ny + 'px'; }
    const frame = canvasEl.querySelector('.sel-frame');
    const handles = canvasEl.querySelector('.sel-handles');
    if (frame) { frame.style.left = nx + 'px'; frame.style.top = ny + 'px'; }
    if (handles) { handles.style.left = nx + 'px'; handles.style.top = ny + 'px'; }
    updateInspectorFields(['x', 'y']);
    renderConnections();
  }
  else if (dragState.mode === 'resize') {
    const el = getElement(dragState.id);
    if (!el) return;
    const dx = p.x - dragState.startX;
    const dy = p.y - dragState.startY;
    let { origX, origY, origW, origH, dir } = dragState;
    let x = origX, y = origY, w = origW, h = origH;
    const MIN = 10;

    if (dir.includes('e')) w = origW + dx;
    if (dir.includes('s')) h = origH + dy;
    if (dir.includes('w')) { x = origX + dx; w = origW - dx; }
    if (dir.includes('n')) { y = origY + dy; h = origH - dy; }
    if (e.shiftKey) {
      /* preserve aspect */
      const r = origW / Math.max(1, origH);
      if (dir === 'se' || dir === 'nw') {
        if (Math.abs(dx) > Math.abs(dy)) { h = w / r; if (dir === 'nw') y = origY + (origH - h); }
        else { w = h * r; if (dir === 'nw') x = origX + (origW - w); }
      }
    }
    if (doc.snap) {
      w = roundTo(w, snap); h = roundTo(h, snap);
      x = roundTo(x, snap); y = roundTo(y, snap);
    }
    if (w < MIN) { if (dir.includes('w')) x = origX + origW - MIN; w = MIN; }
    if (h < MIN) { if (dir.includes('n')) y = origY + origH - MIN; h = MIN; }
    x = clamp(x, 0, doc.canvas.w); y = clamp(y, 0, doc.canvas.h);
    w = clamp(w, MIN, doc.canvas.w - x);
    h = clamp(h, MIN, doc.canvas.h - y);

    el.x = x; el.y = y; el.w = w; el.h = h;

    /* re-render the element body (size can change internals) and chrome */
    const node = canvasEl.querySelector('.el[data-id="' + el.id + '"]');
    if (node) {
      node.style.left = x + 'px'; node.style.top = y + 'px';
      node.style.width = w + 'px'; node.style.height = h + 'px';
      const def = LIBRARY[el.type];
      node.innerHTML = def.render(el);
    }
    const frame = canvasEl.querySelector('.sel-frame');
    const handles = canvasEl.querySelector('.sel-handles');
    if (frame) { frame.style.left = x+'px'; frame.style.top = y+'px'; frame.style.width = w+'px'; frame.style.height = h+'px'; }
    if (handles) { handles.style.left = x+'px'; handles.style.top = y+'px'; handles.style.width = w+'px'; handles.style.height = h+'px'; }
    updateInspectorFields(['x','y','w','h']);
    renderConnections();
  }
  else if (dragState.mode === 'connect-drag') {
    /* draw temporary line from source anchor to pointer */
    renderConnections();
    const a = getElement(dragState.fromId);
    if (!a) return;
    const from = elementAnchor(a, dragState.fromAnchor);
    const to = { x: p.x, y: p.y };
    const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    tmp.setAttribute('d', connectionPath(from, to, dragState.fromAnchor, 'c'));
    tmp.setAttribute('class', 'conn-line');
    tmp.setAttribute('stroke', 'var(--accent)');
    tmp.setAttribute('stroke-dasharray', '4 4');
    connectionsSvg.appendChild(tmp);
  }
}

function onDragUp(e) {
  if (dragState && dragState.mode === 'connect-drag') {
    /* look for element under cursor */
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const targetEl = el && el.closest && el.closest('.el');
    if (targetEl && targetEl.dataset.id !== dragState.fromId) {
      /* find target anchor dot if any */
      const anchorEl = el.closest('.anchor-dot');
      const toAnchor = anchorEl ? anchorEl.dataset.anchor : 'auto';
      addConnection(dragState.fromId, targetEl.dataset.id, dragState.fromAnchor, toAnchor);
    }
    pendingConnection = null;
    renderCanvas();
  }
  dragState = null;
  hideAlignGuides();
  window.removeEventListener('mousemove', onDragMove);
  window.removeEventListener('mouseup', onDragUp);
  renderInspector();
}

/* ============================================================================
   ALIGNMENT GUIDES
   ============================================================================ */
const GUIDE_TOLERANCE = 6;   /* snap within this many px */

function computeGuides(el, nx, ny) {
  const lines = [];
  let snapX = null, snapY = null;
  const selfEdgesX = [ nx, nx + el.w / 2, nx + el.w ];
  const selfEdgesY = [ ny, ny + el.h / 2, ny + el.h ];

  /* canvas edges and center */
  const canvasX = [ 0, doc.canvas.w / 2, doc.canvas.w ];
  const canvasY = [ 0, doc.canvas.h / 2, doc.canvas.h ];

  /* other elements */
  const otherX = [], otherY = [];
  for (const o of doc.elements) {
    if (o.id === el.id) continue;
    otherX.push(o.x, o.x + o.w / 2, o.x + o.w);
    otherY.push(o.y, o.y + o.h / 2, o.y + o.h);
  }

  const allX = [...canvasX, ...otherX];
  const allY = [...canvasY, ...otherY];

  /* Check each self edge against each target — pick minimum */
  let bestX = { diff: GUIDE_TOLERANCE + 1, targetX: null, selfIdx: -1 };
  for (let i = 0; i < selfEdgesX.length; i++) {
    for (const tx of allX) {
      const diff = Math.abs(selfEdgesX[i] - tx);
      if (diff < bestX.diff) bestX = { diff, targetX: tx, selfIdx: i };
    }
  }
  if (bestX.targetX !== null) {
    const offsets = [0, el.w / 2, el.w];
    snapX = bestX.targetX - offsets[bestX.selfIdx];
    lines.push({ kind: 'v', x: bestX.targetX });
  }

  let bestY = { diff: GUIDE_TOLERANCE + 1, targetY: null, selfIdx: -1 };
  for (let i = 0; i < selfEdgesY.length; i++) {
    for (const ty of allY) {
      const diff = Math.abs(selfEdgesY[i] - ty);
      if (diff < bestY.diff) bestY = { diff, targetY: ty, selfIdx: i };
    }
  }
  if (bestY.targetY !== null) {
    const offsets = [0, el.h / 2, el.h];
    snapY = bestY.targetY - offsets[bestY.selfIdx];
    lines.push({ kind: 'h', y: bestY.targetY });
  }

  return { snapX, snapY, lines };
}

function showAlignGuides(lines) {
  hideAlignGuides();
  for (const g of lines) {
    const el = document.createElement('div');
    el.className = 'align-guide';
    if (g.kind === 'v') {
      el.classList.add('v');
      el.style.left = g.x + 'px';
      el.style.top = '0';
      el.style.height = doc.canvas.h + 'px';
    } else {
      el.classList.add('h');
      el.style.top = g.y + 'px';
      el.style.left = '0';
      el.style.width = doc.canvas.w + 'px';
    }
    canvasEl.appendChild(el);
  }
}
function hideAlignGuides() {
  $$('.align-guide', canvasEl).forEach(n => n.remove());
}

/* ============================================================================
   CONNECTIONS
   ============================================================================ */
function addConnection(fromId, toId, fromAnchor, toAnchor) {
  /* avoid duplicates */
  if (doc.connections.some(c => c.fromId === fromId && c.toId === toId)) {
    toast('Connection exists');
    return;
  }
  const conn = {
    id: uid('conn'),
    fromId, toId,
    fromAnchor: fromAnchor || 'auto',
    toAnchor:   toAnchor   || 'auto',
    style: { color: '#14243b', width: 1.5, arrowEnd: true, arrowStart: false, dashed: false },
  };
  doc.connections.push(conn);
  renderCanvas();
  select(conn.id, 'connection');
  updateStats();
  toast('Connected');
}

function deleteConnection(id) {
  doc.connections = doc.connections.filter(c => c.id !== id);
  if (doc.selected === id) { doc.selected = null; doc.selectedKind = null; }
  renderCanvas();
  renderInspector();
  updateStats();
}

/* ============================================================================
   TOOL MODE
   ============================================================================ */
function setTool(name) {
  currentTool = name;
  $$('.tool-tab').forEach(b => b.classList.toggle('active', b.dataset.tool === name));
  pendingConnection = null;
  $$('.el').forEach(n => n.classList.remove('connect-source'));
  canvasEl.style.cursor = (name === 'connect') ? 'crosshair' : '';
}
$$('.tool-tab').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

/* ============================================================================
   INSPECTOR
   ============================================================================ */
function renderInspector() {
  inspector.innerHTML = '';

  if (!doc.selected) {
    renderEmptyInspector();
    return;
  }

  if (doc.selectedKind === 'connection') {
    renderConnectionInspector();
    return;
  }

  const el = getElement(doc.selected);
  if (!el) { renderEmptyInspector(); return; }
  const def = LIBRARY[el.type];

  /* Header */
  const head = document.createElement('div');
  head.className = 'insp-header';
  head.innerHTML = `
    <div class="type">${escapeHtml(def.label)}</div>
    <div class="id">${escapeHtml(el.id)}</div>
  `;
  inspector.appendChild(head);

  /* Geometry */
  inspector.appendChild(makeSection('Geometry', `
    <div class="field-row">
      <label>Position</label>
      <div class="field-pair">
        <input class="field-input" type="number" data-geom="x" value="${el.x}" />
        <input class="field-input" type="number" data-geom="y" value="${el.y}" />
      </div>
    </div>
    <div class="field-row">
      <label>Size</label>
      <div class="field-pair">
        <input class="field-input" type="number" data-geom="w" value="${el.w}" min="10" />
        <input class="field-input" type="number" data-geom="h" value="${el.h}" min="10" />
      </div>
    </div>
    <div class="inline-label">Align on canvas</div>
    <div class="align-row">
      ${alignBtnSvg('align-l', 'M2 2v12M5 5h8v2H5zM5 9h5v2H5z', 'Left')}
      ${alignBtnSvg('align-hc', 'M8 2v12M4 5h8v2H4zM5 9h6v2H5z', 'Center H')}
      ${alignBtnSvg('align-r', 'M14 2v12M3 5h8v2H3zM6 9h5v2H6z', 'Right')}
      ${alignBtnSvg('align-t', 'M2 2h12M5 5v8h2V5zM9 5v5h2V5z', 'Top')}
      ${alignBtnSvg('align-vc', 'M2 8h12M5 4v8h2V4zM9 5v6h2V5z', 'Center V')}
      ${alignBtnSvg('align-b', 'M2 14h12M5 3v8h2V3zM9 6v5h2V6z', 'Bottom')}
    </div>
  `));

  /* Component-specific fields */
  if (def.fields && def.fields.length) {
    const section = document.createElement('div');
    section.className = 'insp-section';
    section.innerHTML = `<div class="insp-section-title">${def.group === 'shapes' ? 'Shape' : def.label} Properties</div>`;
    for (const f of def.fields) section.appendChild(renderField(el, f));
    inspector.appendChild(section);
  }

  /* Shared: radius + shadow */
  const s = el.style;
  const hasRadius = 'borderRadius' in s;
  const hasShadow = 'shadowBlur' in s;
  if (hasRadius || hasShadow) {
    const section = document.createElement('div');
    section.className = 'insp-section';
    section.innerHTML = `<div class="insp-section-title">Effects</div>`;

    if (hasRadius && !def.fields.some(f => f.key === 'style.borderRadius')) {
      section.appendChild(renderField(el, { kind: 'slider', key: 'style.borderRadius', label: 'Radius', min: 0, max: 100, step: 1, unit: 'px' }));
    }
    if (hasShadow) {
      section.insertAdjacentHTML('beforeend', `<div class="inline-label">Box shadow</div>`);
      const grid = document.createElement('div');
      grid.className = 'shadow-grid';
      grid.appendChild(renderField(el, { kind: 'number', key: 'style.shadowX', label: 'X' }, true));
      grid.appendChild(renderField(el, { kind: 'number', key: 'style.shadowY', label: 'Y' }, true));
      grid.appendChild(renderField(el, { kind: 'number', key: 'style.shadowBlur', label: 'Blur' }, true));
      grid.appendChild(renderField(el, { kind: 'number', key: 'style.shadowSpread', label: 'Spread' }, true));
      section.appendChild(grid);
      section.appendChild(renderField(el, { kind: 'color', key: 'style.shadowColor', label: 'Shadow', allowAlpha: true }));
    }
    inspector.appendChild(section);
  }

  /* Arrange + delete */
  const actions = document.createElement('div');
  actions.className = 'insp-section';
  actions.innerHTML = `
    <div class="insp-section-title">Actions</div>
    <div class="align-row" style="grid-template-columns: repeat(4, 1fr);">
      ${alignBtnSvg('arr-front', 'M4 3h8v8H4z M2 5h8v8H2z', 'To front')}
      ${alignBtnSvg('arr-up', 'M5 3h8v8H5z M3 5h8v8H3z', 'Forward')}
      ${alignBtnSvg('arr-down', 'M3 3h8v8H3z M5 5h8v8H5z', 'Backward')}
      ${alignBtnSvg('arr-back', 'M2 3h8v8H2z M4 5h8v8H4z', 'To back')}
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;">
      <button class="tiny-btn full" data-act="dup">Duplicate</button>
      <button class="tiny-btn full danger" data-act="del">Delete</button>
    </div>
  `;
  inspector.appendChild(actions);

  /* --- Bindings --- */
  bindInspector(el, def);
}

function renderEmptyInspector() {
  inspector.innerHTML = `
    <div class="insp-empty">
      <div>Drag a component from the library, or select something on the canvas.</div>
      <div class="hint">Select Tool · V &nbsp; Connect · C</div>
    </div>
    ${renderCanvasPanel()}
  `;
  bindCanvasPanel();
}

function renderConnectionInspector() {
  const conn = doc.connections.find(c => c.id === doc.selected);
  if (!conn) { renderEmptyInspector(); return; }
  const anchors = ['auto','n','e','s','w','c'];
  inspector.innerHTML = `
    <div class="insp-header">
      <div class="type">Connection</div>
      <div class="id">${escapeHtml(conn.id)}</div>
    </div>
    <div class="insp-section">
      <div class="insp-section-title">Endpoints</div>
      <div class="field-row">
        <label>From</label>
        <select class="field-select" data-conn="fromId">
          ${doc.elements.map(e => `<option value="${e.id}"${e.id===conn.fromId?' selected':''}>${escapeHtml(e.id)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <label>Anchor</label>
        <select class="field-select" data-conn="fromAnchor">
          ${anchors.map(a => `<option value="${a}"${a===conn.fromAnchor?' selected':''}>${a.toUpperCase()}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <label>To</label>
        <select class="field-select" data-conn="toId">
          ${doc.elements.map(e => `<option value="${e.id}"${e.id===conn.toId?' selected':''}>${escapeHtml(e.id)}</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <label>Anchor</label>
        <select class="field-select" data-conn="toAnchor">
          ${anchors.map(a => `<option value="${a}"${a===conn.toAnchor?' selected':''}>${a.toUpperCase()}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="insp-section">
      <div class="insp-section-title">Appearance</div>
      <div class="field-row">
        <label>Color</label>
        <div class="field-color-wrap">
          <label class="field-color" style="background:${conn.style.color}">
            <input type="color" value="${conn.style.color}" data-conn="style.color" />
          </label>
          <input class="field-color-text" data-conn="style.color" value="${conn.style.color}" />
        </div>
      </div>
      <div class="field-row">
        <label>Width</label>
        <div class="slider-field">
          <input type="range" min="1" max="8" step="0.5" value="${conn.style.width}" data-conn="style.width" />
          <span class="num">${conn.style.width}px</span>
        </div>
      </div>
      <div class="toggle-row">
        <label style="font-size:11px;color:var(--ink-soft);">Arrow end</label>
        <div class="toggle ${conn.style.arrowEnd ? 'on' : ''}" data-conn="style.arrowEnd"></div>
      </div>
      <div class="toggle-row">
        <label style="font-size:11px;color:var(--ink-soft);">Arrow start</label>
        <div class="toggle ${conn.style.arrowStart ? 'on' : ''}" data-conn="style.arrowStart"></div>
      </div>
      <div class="toggle-row">
        <label style="font-size:11px;color:var(--ink-soft);">Dashed</label>
        <div class="toggle ${conn.style.dashed ? 'on' : ''}" data-conn="style.dashed"></div>
      </div>
    </div>
    <div class="insp-section">
      <button class="tiny-btn full danger" id="btn-conn-del">Delete connection</button>
    </div>
  `;

  inspector.querySelectorAll('[data-conn]').forEach(inp => {
    const key = inp.dataset.conn;
    const handler = () => {
      let val;
      if (inp.classList.contains('toggle')) {
        val = !inp.classList.contains('on');
        inp.classList.toggle('on', val);
      } else if (inp.type === 'range' || inp.type === 'number') {
        val = parseFloat(inp.value);
      } else {
        val = inp.value;
      }
      setPath(conn, key, val);
      /* sync color swatches */
      if (key === 'style.color') {
        inspector.querySelectorAll('[data-conn="style.color"]').forEach(x => {
          if (x !== inp && x.value !== undefined) x.value = val;
          if (x.tagName === 'LABEL') x.style.background = val;
        });
        const sw = inspector.querySelector('.field-color');
        if (sw) sw.style.background = val;
      }
      if (inp.type === 'range') inp.parentElement.querySelector('.num').textContent = val + 'px';
      renderConnections();
    };
    if (inp.classList.contains('toggle')) inp.addEventListener('click', handler);
    else inp.addEventListener('input', handler);
  });
  $('#btn-conn-del').addEventListener('click', () => deleteConnection(conn.id));
}

function renderField(el, field, compact) {
  const row = document.createElement('div');
  row.className = 'field-row';
  const val = getPath(el, field.key);

  if (field.kind === 'text') {
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <input class="field-input text-input" type="text" value="${escapeAttr(val ?? '')}" />`;
    row.querySelector('input').addEventListener('input', (e) => {
      setPath(el, field.key, e.target.value);
      rerenderElement(el.id);
    });
  }
  else if (field.kind === 'textarea') {
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <textarea class="field-input text-input full-input" rows="3" style="resize:vertical;font-family:${field.key.includes('options') || field.key.includes('value')?'var(--body)':'var(--body)'};">${escapeHtml(val ?? '')}</textarea>`;
    row.querySelector('textarea').addEventListener('input', (e) => {
      setPath(el, field.key, e.target.value);
      rerenderElement(el.id);
    });
  }
  else if (field.kind === 'number') {
    const html = compact
      ? `<input class="field-input" type="number" value="${val}" placeholder="${field.label}" title="${field.label}" />`
      : `<label>${escapeHtml(field.label)}</label><input class="field-input" type="number" value="${val}" />`;
    row.innerHTML = html;
    row.querySelector('input').addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) { setPath(el, field.key, v); rerenderElement(el.id); }
    });
  }
  else if (field.kind === 'pair') {
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <div class="field-pair">
        <input class="field-input" type="number" data-sub="a" value="${getPath(el, field.a.key)}" />
        <input class="field-input" type="number" data-sub="b" value="${getPath(el, field.b.key)}" />
      </div>`;
    row.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', (e) => {
        const v = parseFloat(e.target.value);
        if (!isNaN(v)) {
          setPath(el, inp.dataset.sub === 'a' ? field.a.key : field.b.key, v);
          rerenderElement(el.id);
        }
      });
    });
  }
  else if (field.kind === 'select') {
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <select class="field-select">${field.options.map(o => `<option value="${o}"${String(o)===String(val)?' selected':''}>${o}</option>`).join('')}</select>`;
    row.querySelector('select').addEventListener('change', (e) => {
      const v = isNaN(e.target.value) ? e.target.value : Number(e.target.value);
      setPath(el, field.key, v);
      rerenderElement(el.id);
    });
  }
  else if (field.kind === 'color') {
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <div class="field-color-wrap">
        <label class="field-color" style="background:${val};">
          <input type="color" value="${val.startsWith('#') ? val : '#000000'}" />
        </label>
        <input class="field-color-text" value="${escapeAttr(val)}" />
      </div>`;
    const picker = row.querySelector('input[type=color]');
    const text = row.querySelector('.field-color-text');
    const swatch = row.querySelector('.field-color');
    picker.addEventListener('input', (e) => {
      const v = e.target.value;
      setPath(el, field.key, v);
      text.value = v;
      swatch.style.background = v;
      rerenderElement(el.id);
    });
    text.addEventListener('input', (e) => {
      const v = e.target.value;
      setPath(el, field.key, v);
      swatch.style.background = v;
      if (v.startsWith('#') && (v.length === 7 || v.length === 4)) picker.value = v;
      rerenderElement(el.id);
    });
  }
  else if (field.kind === 'slider') {
    const unit = field.unit || '';
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <div class="slider-field">
        <input type="range" min="${field.min}" max="${field.max}" step="${field.step || 1}" value="${val}" />
        <span class="num">${(+val).toFixed(field.step && field.step < 1 ? 2 : 0)}${unit}</span>
      </div>`;
    const inp = row.querySelector('input');
    const num = row.querySelector('.num');
    inp.addEventListener('input', (e) => {
      const v = parseFloat(e.target.value);
      setPath(el, field.key, v);
      num.textContent = (field.step && field.step < 1 ? v.toFixed(2) : v.toFixed(0)) + unit;
      rerenderElement(el.id);
    });
  }
  else if (field.kind === 'toggle') {
    row.className = 'toggle-row';
    row.innerHTML = `<label>${escapeHtml(field.label)}</label>
      <div class="toggle ${val ? 'on' : ''}"></div>`;
    row.querySelector('.toggle').addEventListener('click', () => {
      const v = !getPath(el, field.key);
      setPath(el, field.key, v);
      row.querySelector('.toggle').classList.toggle('on', v);
      rerenderElement(el.id);
    });
  }
  return row;
}

function bindInspector(el, def) {
  /* geometry */
  inspector.querySelectorAll('[data-geom]').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const key = inp.dataset.geom;
      const v = parseFloat(e.target.value);
      if (isNaN(v)) return;
      if (key === 'x' || key === 'y') el[key] = clamp(v, 0, (key === 'x' ? doc.canvas.w - el.w : doc.canvas.h - el.h));
      else if (key === 'w') el.w = clamp(v, 10, doc.canvas.w - el.x);
      else if (key === 'h') el.h = clamp(v, 10, doc.canvas.h - el.y);
      rerenderElement(el.id);
      updateInspectorFields(['x','y','w','h']);
      renderConnections();
      /* re-render chrome position */
      const frame = canvasEl.querySelector('.sel-frame');
      const handles = canvasEl.querySelector('.sel-handles');
      if (frame) { frame.style.left = el.x+'px'; frame.style.top = el.y+'px'; frame.style.width = el.w+'px'; frame.style.height = el.h+'px'; }
      if (handles) { handles.style.left = el.x+'px'; handles.style.top = el.y+'px'; handles.style.width = el.w+'px'; handles.style.height = el.h+'px'; }
    });
  });
  /* alignment buttons */
  inspector.querySelectorAll('[data-align]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.align;
      if (k === 'align-l') el.x = 0;
      else if (k === 'align-r') el.x = doc.canvas.w - el.w;
      else if (k === 'align-hc') el.x = Math.round((doc.canvas.w - el.w) / 2);
      else if (k === 'align-t') el.y = 0;
      else if (k === 'align-b') el.y = doc.canvas.h - el.h;
      else if (k === 'align-vc') el.y = Math.round((doc.canvas.h - el.h) / 2);
      renderCanvas();
      renderInspector();
    });
  });
  /* arrangement */
  inspector.querySelectorAll('[data-align]').forEach(btn => {
    const k = btn.dataset.align;
    if (k === 'arr-front') btn.addEventListener('click', () => bringToFront(el.id));
    if (k === 'arr-up')    btn.addEventListener('click', () => bringForward(el.id));
    if (k === 'arr-down')  btn.addEventListener('click', () => sendBackward(el.id));
    if (k === 'arr-back')  btn.addEventListener('click', () => sendToBack(el.id));
  });
  /* actions */
  inspector.querySelectorAll('[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.act === 'dup') duplicateElement(el.id);
      if (btn.dataset.act === 'del') deleteElement(el.id);
    });
  });
}

function alignBtnSvg(key, path, title) {

}

          <input class="field-input" type="number" data-canvas="h" value="${doc.canvas.h}" min="200" />
        </div>
      </div>
      <div class="field-row">
        <label>Background</label>

          <label class="field-color" style="background:${doc.canvas.bg}">

          <span class="num">${doc.gridSize}px</span>

function bindCanvasPanel() {
  inspector.querySelectorAll('[data-canvas]').forEach(inp => {
    inp.addEventListener('input', (e) => {
      const k = inp.dataset.canvas;
      if (k === 'w' || k === 'h' || k === 'gridSize') {
        const v = parseFloat(inp.value);
        if (!isNaN(v)) {
          if (k === 'gridSize') doc.gridSize = clamp(v, 2, 100);
          else doc.canvas[k] = clamp(v, 100, 4000);
        }
        if (k === 'gridSize') inp.parentElement.querySelector('.num').textContent = doc.gridSize + 'px';
      } else if (k === 'bg') {
        doc.canvas.bg = inp.value;
      }
      renderCanvas();
    });
  });
}

function rerenderElement(id) {
  const el = getElement(id);
  if (!el) return;
  const node = canvasEl.querySelector('.el[data-id="' + id + '"]');
  if (!node) { renderCanvas(); return; }
  const def = LIBRARY[el.type];
  node.style.left = el.x + 'px';
  node.style.top  = el.y + 'px';
  node.style.width  = el.w + 'px';
  node.style.height = el.h + 'px';
  node.innerHTML = def.render(el);
}

function updateInspectorFields(keys) {
  const el = getElement(doc.selected);
  if (!el) return;
  for (const k of keys) {
    const inp = inspector.querySelector('[data-geom="' + k + '"]');
    if (inp) inp.value = Math.round(el[k]);
  }
}

/* ---------- path get/set helpers ---------- */
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, val) {
  const keys = path.split('.');
  const last = keys.pop();
  const target = keys.reduce((o, k) => (o[k] = o[k] || {}), obj);
  target[last] = val;
}

/* ============================================================================
   EXPORT
   ============================================================================ */
function buildExportHTML() {
  const lines = [];
  lines.push('<!DOCTYPE html>');
  lines.push('<html lang="en">');
  lines.push('<head>');
  lines.push('<meta charset="UTF-8">');
  lines.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  lines.push('<title>Exported Design</title>');
  lines.push('<link rel="preconnect" href="https://fonts.googleapis.com">');
  lines.push('<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>');
  lines.push('<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">');
  lines.push('<style>');
  lines.push('  *{box-sizing:border-box;margin:0;padding:0;}');
  lines.push('  html,body{background:#f4efe4;font-family:"Inter Tight",-apple-system,sans-serif;color:#14243b;}');
  lines.push(`  .stage{position:relative;width:${doc.canvas.w}px;height:${doc.canvas.h}px;background:${doc.canvas.bg};margin:40px auto;box-shadow:0 20px 50px rgba(20,36,59,0.12);}`);
  lines.push('  .el{position:absolute;}');
  lines.push('  .connections{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;}');
  lines.push('  .conn-line{fill:none;}');
  lines.push('</style>');
  lines.push('</head>');
  lines.push('<body>');
  lines.push(`<div class="stage">`);

  /* connections layer first (z behind elements) */
  lines.push(`  <svg class="connections" width="${doc.canvas.w}" height="${doc.canvas.h}">`);
  lines.push(`    <defs>`);
  lines.push(`      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">`);
  lines.push(`        <path d="M 0 0 L 10 5 L 0 10 z" fill="#14243b"/>`);
  lines.push(`      </marker>`);
  lines.push(`    </defs>`);
  for (const conn of doc.connections) {
    const a = getElement(conn.fromId), b = getElement(conn.toId);
    if (!a || !b) continue;
    let fa = conn.fromAnchor, ta = conn.toAnchor;
    if (fa === 'auto' || ta === 'auto') {
      const p = pickBestAnchorPair(a, b);
      if (fa === 'auto') fa = p.from;
      if (ta === 'auto') ta = p.to;
    }
    const from = elementAnchor(a, fa), to = elementAnchor(b, ta);
    const d = connectionPath(from, to, fa, ta);
    const attrs = [
      `d="${d}"`,
      `class="conn-line"`,
      `stroke="${conn.style?.color || '#14243b'}"`,
      `stroke-width="${conn.style?.width || 1.5}"`,
    ];
    if (conn.style?.dashed) attrs.push(`stroke-dasharray="6 4"`);
    if (conn.style?.arrowEnd !== false) attrs.push(`marker-end="url(#arrow)"`);
    if (conn.style?.arrowStart) attrs.push(`marker-start="url(#arrow)"`);
    lines.push(`    <path ${attrs.join(' ')}/>`);
  }
  lines.push(`  </svg>`);

  /* elements */
  for (const el of doc.elements) {
    const def = LIBRARY[el.type];
    if (!def) continue;
    const content = (def.exportRender || def.render)(el);
    const posCss = `left:${el.x}px;top:${el.y}px;width:${el.w}px;height:${el.h}px;`;
    lines.push(`  <div class="el" style="${posCss}">${content}</div>`);
  }

  lines.push(`</div>`);
  lines.push('</body>');
  lines.push('</html>');
  return lines.join('\n');
}

$('#btn-preview').addEventListener('click', () => {
  const html = buildExportHTML();
  const w = window.open('', '_blank');

    w.document.open();

    w.document.close();

    toast('Pop-up blocked');
  }
});

$('#btn-export').addEventListener('click', () => {

});

function showExportModal(html) {
  const host = $('#modal-host');
  host.innerHTML = `
    <div class="modal-backdrop" id="m-back">
      <div class="modal">
        <div class="modal-head">
          <div class="t">Your <em>design</em>, portable.</div>
          <button class="modal-close" id="m-close">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l8 8M11 3l-8 8"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <pre id="export-pre"></pre>
        </div>
        <div class="modal-foot">
          <button class="action-btn" id="m-copy">Copy to clipboard</button>
          <button class="action-btn primary" id="m-download">Download .html</button>
        </div>
      </div>
    </div>`;
  $('#export-pre').textContent = html;
  $('#m-back').addEventListener('click', (e) => { if (e.target.id === 'm-back') host.innerHTML = ''; });
  $('#m-close').addEventListener('click', () => host.innerHTML = '');
  $('#m-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(html); toast('Copied to clipboard'); }
    catch (e) { toast('Copy failed'); }
  });
  $('#m-download').addEventListener('click', () => {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'design.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Downloaded');
  });
}

/* ============================================================================
   TOAST
   ============================================================================ */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ============================================================================
   KEYBOARD SHORTCUTS
   ============================================================================ */
window.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea, select')) return;
  if (e.target.isContentEditable) return;
  const k = e.key.toLowerCase();
  if (k === 'v')     setTool('select');
  if (k === 'c')     setTool('connect');
  if (k === 'delete' || k === 'backspace') {
    if (doc.selectedKind === 'element') { deleteElement(doc.selected); e.preventDefault(); }
    else if (doc.selectedKind === 'connection') { deleteConnection(doc.selected); e.preventDefault(); }
  }
  if (k === 'escape') {
    pendingConnection = null;
    doc.selected = null; doc.selectedKind = null;
    renderCanvas(); renderInspector();
  }
  if ((e.ctrlKey || e.metaKey) && k === 'd' && doc.selectedKind === 'element') {
    e.preventDefault();
    duplicateElement(doc.selected);
  }
  /* nudge */
  if (doc.selectedKind === 'element' && ['arrowleft','arrowright','arrowup','arrowdown'].includes(k)) {
    e.preventDefault();
    const el = getElement(doc.selected);
    if (!el) return;
    const step = e.shiftKey ? 10 : 1;
    if (k === 'arrowleft')  el.x = clamp(el.x - step, 0, doc.canvas.w - el.w);
    if (k === 'arrowright') el.x = clamp(el.x + step, 0, doc.canvas.w - el.w);
    if (k === 'arrowup')    el.y = clamp(el.y - step, 0, doc.canvas.h - el.h);
    if (k === 'arrowdown')  el.y = clamp(el.y + step, 0, doc.canvas.h - el.h);
    rerenderElement(el.id);
    const frame = canvasEl.querySelector('.sel-frame');
    const handles = canvasEl.querySelector('.sel-handles');
    if (frame)   { frame.style.left = el.x+'px';   frame.style.top = el.y+'px';   }
    if (handles) { handles.style.left = el.x+'px'; handles.style.top = el.y+'px'; }
    renderConnections();
    updateInspectorFields(['x','y']);
  }
});

/* ============================================================================
   CONTEXT MENU (right-click on element)
   ============================================================================ */
canvasEl.addEventListener('contextmenu', (e) => {
  const elNode = e.target.closest('.el');
  if (!elNode) return;
  e.preventDefault();
  const id = elNode.dataset.id;
  select(id, 'element');
  openCtxMenu(e.clientX, e.clientY, [
    { label: 'Duplicate', kbd: '⌘D', fn: () => duplicateElement(id) },
    { label: 'Bring to front', fn: () => bringToFront(id) },
    { label: 'Send to back',   fn: () => sendToBack(id) },
    { sep: true },
    { label: 'Delete', kbd: 'Del', danger: true, fn: () => deleteElement(id) },
  ]);
});

function openCtxMenu(x, y, items) {
  const host = $('#ctx-host');
  const html = items.map(it => {
    if (it.sep) return `<div class="sep"></div>`;
    return `<div class="ci ${it.danger ? 'danger' : ''}" data-i="${items.indexOf(it)}">
      <span>${it.label}</span><span class="kb">${it.kbd || ''}</span></div>`;
  }).join('');
  host.innerHTML = `<div class="ctx-menu" style="left:${x}px;top:${y}px;">${html}</div>`;
  host.querySelectorAll('.ci').forEach(ci => {
    ci.addEventListener('click', () => {
      const idx = parseInt(ci.dataset.i, 10);
      items[idx].fn();
      host.innerHTML = '';
    });
  });
  const close = (ev) => {
    if (!host.firstChild) return;
    if (!host.firstChild.contains(ev.target)) {
      host.innerHTML = '';
      document.removeEventListener('mousedown', close, true);
    }
  };
  setTimeout(() => document.addEventListener('mousedown', close, true), 0);
}

   BOOT
   ============================================================================ */
function boot() {
  renderLibrary();
  renderCanvas();
  renderInspector();
  updateStats();

  /* Demo content — a small flow chart */
  const input   = seed('input',  120, 150, { props: { placeholder: 'Enter name', value: 'Alex' } });
  const stepper = seed('stepper', 380, 150);
  const btn     = seed('button', 620, 250, { props: { text: 'Submit', variant: 'solid' } });
  const progress = seed('progress', 120, 260, { props: { value: 0.4 } });
  const circle  = seed('circle', 800, 140, { w: 120, h: 120 });

  doc.connections.push({
    id: uid('conn'),
    fromId: input.id, toId: btn.id,
    fromAnchor: 'auto', toAnchor: 'auto',
    style: { color: '#14243b', width: 1.5, arrowEnd: true, arrowStart: false, dashed: false },
  });
  doc.connections.push({
    id: uid('conn'),
    fromId: stepper.id, toId: btn.id,
    fromAnchor: 'auto', toAnchor: 'auto',
    style: { color: '#14243b', width: 1.5, arrowEnd: true, arrowStart: false, dashed: false },
  });
  doc.connections.push({
    id: uid('conn'),
    fromId: btn.id, toId: circle.id,
    fromAnchor: 'auto', toAnchor: 'auto',
    style: { color: '#0d5e6e', width: 1.8, arrowEnd: true, arrowStart: false, dashed: true },
  });

  renderCanvas();
  updateStats();
}

function seed(type, x, y, overrides) {
  const def = LIBRARY[type];
  const el = {
    id: uid(type),
    type,
    x, y,
    w: overrides?.w ?? def.defaultW,
    h: overrides?.h ?? def.defaultH,
    props: { ...JSON.parse(JSON.stringify(def.props || {})), ...(overrides?.props || {}) },
    style: { ...JSON.parse(JSON.stringify(def.style || {})), ...(overrides?.style || {}) },
  };
  doc.elements.push(el);
  return el;
}

boot();
