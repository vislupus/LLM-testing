<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo • 3D Terrain Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        body { margin:0; overflow:hidden; background:#0a0a1a; font-family:'Press Start 2P', sans-serif; }
        canvas { display:block; }
        #ui {
            position:absolute; top:20px; left:20px; color:#ffdd99; text-shadow:0 2px 8px #000; pointer-events:none;
            font-size:13px; line-height:1.5;
        }
        #instructions {
            position:absolute; bottom:25px; left:50%; transform:translateX(-50%);
            background:rgba(0,0,0,0.65); padding:12px 28px; border-radius:12px; font-size:13px; white-space:nowrap;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="ui">
        <div>OSOGOVO MOUNTAINS</div>
        <div style="font-size:11px;opacity:0.7;">Drag to orbit • Scroll to zoom</div>
    </div>
    <div id="instructions">
        ← DRAG TO ROTATE • SCROLL TO ZOOM • MOUSE WHEEL ZOOM
    </div>

    <script>
        // ================================================
        // OSOGOVO 3D TERRAIN DIORAMA
        // Single HTML file • Babylon.js CDN
        // Heightmap + Diffuse from local files
        // Pedestal box • Billboard labels on peaks
        // ================================================

        const canvas = document.getElementById("canvas");
        const engine = new BABYLON.Engine(canvas, true);

        function createScene() {
            const scene = new BABYLON.Scene(engine);
            
            // Orbit camera
            const camera = new BABYLON.ArcRotateCamera(
                "camera", 
                Math.PI * 0.8, 
                Math.PI * 0.45, 
                380, 
                new BABYLON.Vector3(0, 45, 0), 
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 120;
            camera.upperRadiusLimit = 620;
            camera.lowerBetaLimit = 0.15;
            camera.upperBetaLimit = 1.45;
            camera.panningSensibility = 80;

            // Lighting
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0.4, 1, -0.3), scene);
            hemi.intensity = 0.85;
            hemi.groundColor = new BABYLON.Color3(0.4, 0.55, 0.8);
            
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.6, -0.85, -0.4), scene);
            sun.intensity = 1.35;

            // Soft fog
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogColor = new BABYLON.Color3(0.75, 0.82, 0.95);
            scene.fogDensity = 0.0014;

            // === TERRAIN ===
            const terrainSize = 420;
            const terrain = BABYLON.MeshBuilder.CreateGroundFromHeightMap(
                "osogovoTerrain",
                "Osogovo Height Map (Merged).png",
                terrainSize, terrainSize,
                128,          // subdivisions
                0, 95,        // minHeight, maxHeight
                scene,
                false,
                () => {
                    // Callback when heightmap is fully loaded
                    placeMarkers(terrain);
                }
            );
            
            const terrainMat = new BABYLON.StandardMaterial("terrainMat", scene);
            terrainMat.diffuseTexture = new BABYLON.Texture("Osogovo_map.jpg", scene);
            terrainMat.diffuseTexture.uScale = 1;
            terrainMat.diffuseTexture.vScale = 1;
            terrainMat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);
            terrainMat.specularPower = 32;
            terrain.material = terrainMat;

            // === PEDESTAL / DIORAMA BOX ===
            const wallHeight = 95;
            const wallThick = 12;
            const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
            baseMat.diffuseColor = new BABYLON.Color3(0.28, 0.22, 0.18);
            
            // Left wall
            const leftWall = BABYLON.MeshBuilder.CreateBox("leftWall", {
                width: wallThick, height: wallHeight, depth: terrainSize + wallThick*2
            }, scene);
            leftWall.position.set(-terrainSize/2 - wallThick/2, -wallHeight/2, 0);
            leftWall.material = baseMat;
            
            // Right wall
            const rightWall = leftWall.clone("rightWall");
            rightWall.position.x = terrainSize/2 + wallThick/2;
            
            // Front wall (negative Z)
            const frontWall = BABYLON.MeshBuilder.CreateBox("frontWall", {
                width: terrainSize + wallThick*2, height: wallHeight, depth: wallThick
            }, scene);
            frontWall.position.set(0, -wallHeight/2, -terrainSize/2 - wallThick/2);
            frontWall.material = baseMat;
            
            // Back wall
            const backWall = frontWall.clone("backWall");
            backWall.position.z = terrainSize/2 + wallThick/2;
            
            // Bottom
            const bottom = BABYLON.MeshBuilder.CreateBox("bottom", {
                width: terrainSize + wallThick*2, height: wallThick, depth: terrainSize + wallThick*2
            }, scene);
            bottom.position.set(0, -wallHeight - wallThick/2, 0);
            bottom.material = baseMat;

            // Gentle floating animation for the whole terrain + pedestal
            const allDiorama = new BABYLON.TransformNode("diorama", scene);
            terrain.parent = allDiorama;
            leftWall.parent = allDiorama;
            rightWall.parent = allDiorama;
            frontWall.parent = allDiorama;
            backWall.parent = allDiorama;
            bottom.parent = allDiorama;
            
            let t = 0;
            scene.registerBeforeRender(() => {
                t += 0.004;
                allDiorama.position.y = Math.sin(t) * 1.2;
            });

            return scene;
        }

        function placeMarkers(terrain) {
            // Three highest peaks - approximate coordinates based on typical Osogovo layout
            // User can adjust these X/Z values if needed
            const peaks = [
                { name: "RUEN",     x: 68,  z: 92 },
                { name: "OSOGOVO",  x: -105, z: -48 },
                { name: "SOKOLINA", x: 132, z: -75 }
            ];

            peaks.forEach(peak => {
                // Get exact height from terrain
                const y = terrain.getHeightAtCoordinates(peak.x, peak.z) + 8;
                
                // Marker pin (small golden cone)
                const pin = BABYLON.MeshBuilder.CreateCylinder("pin", {
                    height: 9, diameterTop: 0, diameterBottom: 5
                }, scene);
                pin.position.set(peak.x, y + 4, peak.z);
                const pinMat = new BABYLON.StandardMaterial("", scene);
                pinMat.diffuseColor = new BABYLON.Color3(1, 0.75, 0.1);
                pin.material = pinMat;
                
                // Billboard label
                const labelPlane = BABYLON.MeshBuilder.CreatePlane("label", {width: 28, height: 9}, scene);
                labelPlane.position.set(peak.x, y + 22, peak.z);
                labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                
                const texture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(labelPlane, 512, 128);
                const textBlock = new BABYLON.GUI.TextBlock();
                textBlock.text = peak.name;
                textBlock.color = "white";
                textBlock.fontSize = 52;
                textBlock.outlineColor = "#000000";
                textBlock.outlineWidth = 8;
                textBlock.shadowOffsetX = 4;
                textBlock.shadowOffsetY = 4;
                textBlock.shadowBlur = 12;
                texture.addControl(textBlock);
            });
        }

        // Main initialization
        window.onload = () => {
            const scene = createScene();
            
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => engine.resize());
        };
    </script>
</body>
</html>
