<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Osogovo 3D Terrain Diorama</title>
  <style>
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0a0a0a;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }
    #info {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(10, 15, 25, 0.85);
      color: #ccd6e0;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      pointer-events: none;
      user-select: none;
      border: 1px solid rgba(100, 150, 255, 0.15);
      backdrop-filter: blur(6px);
      line-height: 1.6;
    }
    #info strong {
      color: #7ec0ee;
      font-size: 15px;
      display: block;
      margin-bottom: 6px;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="info">
    <strong>Osogovo Terrain Diorama</strong>
    Left-drag to orbit &middot; Scroll to zoom<br>
    Right-drag to pan &middot; Peaks marked in red
  </div>

  <script>
    // ============================================================
    //  OSOGOVO 3D TERRAIN DIORAMA
    // ============================================================
    //  NOTE: This file uses procedurally generated placeholder
    //  textures so it works immediately. To use the real images,
    //  replace the two lines marked with [REPLACE] below.
    // ============================================================

    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

    // --- Configuration ------------------------------------------------
    const TERRAIN_SIZE   = 120;   // World units (width & depth)
    const MAX_HEIGHT     = 22;    // Maximum terrain height
    const PEDESTAL_DEPTH = 18;    // How far down the walls go
    const SUBDIVISIONS   = 200;   // Terrain mesh resolution
    const GRID           = SUBDIVISIONS + 1;

    // --- Texture Generation -------------------------------------------
    //  [REPLACE 1/2] Replace generateHeightMapURL() with:
    //      "Osogovo Height Map (Merged).png"
    //  [REPLACE 2/2] Replace generateDiffuseURL() with:
    //      "Osogovo_map.jpg"

    function generateHeightMapURL() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(512, 512);
      const peaks = [
        {x: 0.32, z: 0.38, h: 1.00, r: 0.14},
        {x: 0.62, z: 0.52, h: 0.88, r: 0.11},
        {x: 0.48, z: 0.22, h: 0.78, r: 0.10}
      ];
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          let v = 0.06;
          // pseudo-random detail noise
          v += (Math.sin(x * 0.15) + Math.cos(y * 0.13)) * 0.03;
          v += (Math.sin(x * 0.05 + y * 0.07) * Math.cos(y * 0.04)) * 0.04;
          // major peaks
          for (let p of peaks) {
            const dx = x / 512 - p.x;
            const dy = y / 512 - p.z;
            const d2 = dx * dx + dy * dy;
            v += p.h * Math.exp(-d2 / (p.r * p.r));
          }
          // edge fade so walls meet flat ground
          const ex = Math.min(x, 511 - x) / 512;
          const ey = Math.min(y, 511 - y) / 512;
          v *= Math.min(1, Math.min(ex, ey) * 10);
          const iv = Math.min(255, Math.max(0, Math.floor(v * 255)));
          const idx = (y * 512 + x) * 4;
          img.data[idx] = iv;
          img.data[idx + 1] = iv;
          img.data[idx + 2] = iv;
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL("image/png");
    }

    function generateDiffuseURL() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const ctx = c.getContext("2d");
      const img = ctx.createImageData(512, 512);
      const peaks = [
        {x: 0.32, z: 0.38, h: 1.00, r: 0.14},
        {x: 0.62, z: 0.52, h: 0.88, r: 0.11},
        {x: 0.48, z: 0.22, h: 0.78, r: 0.10}
      ];
      for (let y = 0; y < 512; y++) {
        for (let x = 0; x < 512; x++) {
          let h = 0.06;
          h += (Math.sin(x * 0.15) + Math.cos(y * 0.13)) * 0.03;
          h += (Math.sin(x * 0.05 + y * 0.07) * Math.cos(y * 0.04)) * 0.04;
          for (let p of peaks) {
            const dx = x / 512 - p.x;
            const dy = y / 512 - p.z;
            const d2 = dx * dx + dy * dy;
            h += p.h * Math.exp(-d2 / (p.r * p.r));
          }
          const ex = Math.min(x, 511 - x) / 512;
          const ey = Math.min(y, 511 - y) / 512;
          h *= Math.min(1, Math.min(ex, ey) * 10);

          let r, g, b;
          if (h > 0.72) {        // snow / rock peaks
            const t = (h - 0.72) / 0.28;
            r = 180 + t * 55; g = 175 + t * 60; b = 170 + t * 55;
          } else if (h > 0.38) { // brown / alpine
            const t = (h - 0.38) / 0.34;
            r = 100 + t * 80; g = 85 + t * 90; b = 55 + t * 115;
          } else if (h > 0.12) { // forest green
            const t = (h - 0.12) / 0.26;
            r = 55 + t * 45; g = 80 + t * 5; b = 35 + t * 20;
          } else {               // lowland meadow
            const t = h / 0.12;
            r = 80 + t * (-25); g = 110 + t * (-30); b = 50 + t * (-15);
          }
          const idx = (y * 512 + x) * 4;
          img.data[idx]     = Math.min(255, Math.max(0, r));
          img.data[idx + 1] = Math.min(255, Math.max(0, g));
          img.data[idx + 2] = Math.min(255, Math.max(0, b));
          img.data[idx + 3] = 255;
        }
      }
      ctx.putImageData(img, 0, 0);
      return c.toDataURL("image/png");
    }

    // --- Scene Creation -----------------------------------------------
    const createScene = function () {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color3(0.04, 0.06, 0.09);
      scene.ambientColor = new BABYLON.Color3(0.25, 0.28, 0.32);

      // Camera
      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2.5,
        Math.PI / 2.6,
        160,
        new BABYLON.Vector3(0, 8, 0),
        scene
      );
      camera.attachControl(canvas, true);
      camera.lowerRadiusLimit = 35;
      camera.upperRadiusLimit = 300;
      camera.wheelPrecision = 40;
      camera.panningSensibility = 60;
      camera.lowerBetaLimit = 0.15;
      camera.upperBetaLimit = Math.PI / 2.05;

      // Lights
      const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0.3), scene);
      hemi.intensity = 0.55;
      hemi.groundColor = new BABYLON.Color3(0.12, 0.14, 0.18);

      const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-0.8, -1.2, -0.6), scene);
      sun.position = new BABYLON.Vector3(80, 120, 80);
      sun.intensity = 1.1;

      // Shadows
      const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
      shadowGen.useBlurExponentialShadowMap = true;
      shadowGen.blurKernel = 24;
      shadowGen.darkness = 0.45;

      // --- Materials --------------------------------------------------
      const terrainMat = new BABYLON.StandardMaterial("terrainMat", scene);
      terrainMat.diffuseTexture = new BABYLON.Texture(generateDiffuseURL(), scene);
      terrainMat.diffuseTexture.wrapU = BABYLON.Texture.WRAP_ADDRESSMODE;
      terrainMat.diffuseTexture.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
      terrainMat.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
      terrainMat.ambientColor = new BABYLON.Color3(0.4, 0.4, 0.45);

      const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
      wallMat.diffuseColor = new BABYLON.Color3(0.18, 0.16, 0.14);
      wallMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      wallMat.ambientColor = new BABYLON.Color3(0.2, 0.18, 0.16);

      const bottomMat = new BABYLON.StandardMaterial("bottomMat", scene);
      bottomMat.diffuseColor = new BABYLON.Color3(0.12, 0.11, 0.10);
      bottomMat.specularColor = new BABYLON.Color3(0, 0, 0);

      // --- Terrain Mesh -----------------------------------------------
      const ground = BABYLON.MeshBuilder.CreateGround("terrain", {
        width: TERRAIN_SIZE,
        height: TERRAIN_SIZE,
        subdivisions: SUBDIVISIONS,
        updatable: true
      }, scene);
      ground.material = terrainMat;
      ground.receiveShadows = true;
      shadowGen.addShadowCaster(ground);

      // Load height map image and displace vertices
      const heightMapURL = generateHeightMapURL(); // [REPLACE 1/2]
      const hmImg = new Image();
      hmImg.crossOrigin = "anonymous";
      hmImg.onload = function() {
        const hmCanvas = document.createElement("canvas");
        hmCanvas.width = GRID;
        hmCanvas.height = GRID;
        const hmCtx = hmCanvas.getContext("2d");
        hmCtx.drawImage(hmImg, 0, 0, GRID, GRID);
        const hmData = hmCtx.getImageData(0, 0, GRID, GRID).data;

        const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
        const heightValues = new Float32Array(GRID * GRID);

        for (let i = 0; i < positions.length; i += 3) {
          const vx = positions[i];
          const vz = positions[i + 2];
          const gx = Math.floor(((vx / TERRAIN_SIZE) + 0.5) * (GRID - 1));
          const gz = Math.floor(((vz / TERRAIN_SIZE) + 0.5) * (GRID - 1));
          const cx = Math.max(0, Math.min(GRID - 1, gx));
          const cz = Math.max(0, Math.min(GRID - 1, gz));
          const idx = (cz * GRID + cx) * 4;
          const h = (hmData[idx] / 255) * MAX_HEIGHT;
          positions[i + 1] = h;
          heightValues[cz * GRID + cx] = h;
        }
        ground.updateVerticesData(BABYLON.VertexBuffer.PositionKind, positions);
        ground.createNormals(true);

        // --- Find 3 Highest Peaks -------------------------------------
        const peakCandidates = [];
        for (let z = 2; z < GRID - 2; z++) {
          for (let x = 2; x < GRID - 2; x++) {
            const h = heightValues[z * GRID + x];
            // simple local-maximum check
            let isMax = true;
            for (let dz = -1; dz <= 1 && isMax; dz++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dz === 0 && dx === 0) continue;
                if (heightValues[(z + dz) * GRID + (x + dx)] > h) {
                  isMax = false; break;
                }
              }
            }
            if (isMax) peakCandidates.push({h: h, x: x, z: z});
          }
        }
        peakCandidates.sort((a, b) => b.h - a.h);

        const top3 = [];
        const minSep = GRID * 0.12;
        for (let c of peakCandidates) {
          let tooClose = false;
          for (let t of top3) {
            const d = Math.sqrt((c.x - t.x) ** 2 + (c.z - t.z) ** 2);
            if (d < minSep) { tooClose = true; break; }
          }
          if (!tooClose) top3.push(c);
          if (top3.length >= 3) break;
        }

        // If we didn't find 3 local maxima, just take top 3 by height
        if (top3.length < 3) {
          const all = [];
          for (let z = 0; z < GRID; z++) {
            for (let x = 0; x < GRID; x++) {
              all.push({h: heightValues[z * GRID + x], x, z});
            }
          }
          all.sort((a, b) => b.h - a.h);
          top3.length = 0;
          for (let c of all) {
            let tooClose = false;
            for (let t of top3) {
              const d = Math.sqrt((c.x - t.x) ** 2 + (c.z - t.z) ** 2);
              if (d < minSep) { tooClose = true; break; }
            }
            if (!tooClose) top3.push(c);
            if (top3.length >= 3) break;
          }
        }

        const peakNames = ["Ruen (2,252 m)", "Lisec", "Carev Vrv"];

        for (let i = 0; i < top3.length; i++) {
          const p = top3[i];
          const wx = (p.x / (GRID - 1) - 0.5) * TERRAIN_SIZE;
          const wz = (p.z / (GRID - 1) - 0.5) * TERRAIN_SIZE;
          const wy = p.h;

          // Red sphere marker
          const marker = BABYLON.MeshBuilder.CreateSphere("peak" + i, {diameter: 1.6, segments: 16}, scene);
          marker.position = new BABYLON.Vector3(wx, wy + 0.8, wz);
          const mMat = new BABYLON.StandardMaterial("pm" + i, scene);
          mMat.diffuseColor = new BABYLON.Color3(0.95, 0.12, 0.12);
          mMat.emissiveColor = new BABYLON.Color3(0.35, 0.02, 0.02);
          mMat.specularColor = new BABYLON.Color3(0.3, 0.1, 0.1);
          marker.material = mMat;
          shadowGen.addShadowCaster(marker);

          // Thin pin to ground
          const pin = BABYLON.MeshBuilder.CreateCylinder("pin" + i, {diameter: 0.12, height: wy + 0.5}, scene);
          pin.position = new BABYLON.Vector3(wx, wy / 2 + 0.25, wz);
          const pinMat = new BABYLON.StandardMaterial("pinMat" + i, scene);
          pinMat.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
          pin.material = pinMat;

          // Billboard label
          const labelPlane = BABYLON.MeshBuilder.CreatePlane("label" + i, {width: 10, height: 2.8}, scene);
          labelPlane.position = new BABYLON.Vector3(wx, wy + 4.5, wz);
          labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;

          const dt = new BABYLON.DynamicTexture("dt" + i, {width: 1024, height: 280}, scene);
          const ctx = dt.getContext();
          ctx.clearRect(0, 0, 1024, 280);
          ctx.fillStyle = "rgba(10, 18, 30, 0.82)";
          ctx.beginPath();
          const r = 24;
          ctx.moveTo(r, 0);
          ctx.lineTo(1024 - r, 0);
          ctx.quadraticCurveTo(1024, 0, 1024, r);
          ctx.lineTo(1024, 280 - r);
          ctx.quadraticCurveTo(1024, 280, 1024 - r, 280);
          ctx.lineTo(r, 280);
          ctx.quadraticCurveTo(0, 280, 0, 280 - r);
          ctx.lineTo(0, r);
          ctx.quadraticCurveTo(0, 0, r, 0);
          ctx.fill();
          ctx.strokeStyle = "rgba(120, 180, 255, 0.5)";
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.font = "bold 72px Arial, Helvetica, sans-serif";
          ctx.fillStyle = "#e8f1f8";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(peakNames[i] || ("Peak " + (i + 1)), 512, 140);
          dt.update();

          const lMat = new BABYLON.StandardMaterial("lm" + i, scene);
          lMat.diffuseTexture = dt;
          lMat.opacityTexture = dt;
          lMat.specularColor = new BABYLON.Color3(0, 0, 0);
          lMat.emissiveColor = new BABYLON.Color3(0.25, 0.25, 0.3);
          lMat.backFaceCulling = false;
          lMat.useAlphaFromDiffuseTexture = true;
          labelPlane.material = lMat;
        }
      };
      hmImg.src = heightMapURL;

      // --- Pedestal / Diorama Box -------------------------------------
      const half = TERRAIN_SIZE / 2;
      const w = TERRAIN_SIZE;
      const d = PEDESTAL_DEPTH;

      // Front wall
      const front = BABYLON.MeshBuilder.CreatePlane("front", {width: w, height: d}, scene);
      front.position = new BABYLON.Vector3(0, -d / 2, half + 0.05);
      front.material = wallMat;
      front.receiveShadows = true;

      // Back wall
      const back = BABYLON.MeshBuilder.CreatePlane("back", {width: w, height: d}, scene);
      back.position = new BABYLON.Vector3(0, -d / 2, -half - 0.05);
      back.rotation.y = Math.PI;
      back.material = wallMat;
      back.receiveShadows = true;

      // Right wall
      const right = BABYLON.MeshBuilder.CreatePlane("right", {width: w, height: d}, scene);
      right.position = new BABYLON.Vector3(half + 0.05, -d / 2, 0);
      right.rotation.y = Math.PI / 2;
      right.material = wallMat;
      right.receiveShadows = true;

      // Left wall
      const left = BABYLON.MeshBuilder.CreatePlane("left", {width: w, height: d}, scene);
      left.position = new BABYLON.Vector3(-half - 0.05, -d / 2, 0);
      left.rotation.y = -Math.PI / 2;
      left.material = wallMat;
      left.receiveShadows = true;

      // Bottom
      const bottom = BABYLON.MeshBuilder.CreateGround("bottom", {width: w + 0.2, height: w + 0.2}, scene);
      bottom.position.y = -d;
      bottom.material = bottomMat;
      bottom.receiveShadows = true;

      // --- Decorative rim ---------------------------------------------
      const rimMat = new BABYLON.StandardMaterial("rimMat", scene);
      rimMat.diffuseColor = new BABYLON.Color3(0.22, 0.20, 0.18);
      rimMat.specularColor = new BABYLON.Color3(0.15, 0.15, 0.15);

      const rimThickness = 0.6;
      const rimDepth = 1.2;

      const rimF = BABYLON.MeshBuilder.CreateBox("rimF", {width: w + rimThickness * 2, height: rimDepth, depth: rimThickness}, scene);
      rimF.position = new BABYLON.Vector3(0, -rimDepth / 2 + 0.05, half + rimThickness / 2);
      rimF.material = rimMat;

      const rimB = BABYLON.MeshBuilder.CreateBox("rimB", {width: w + rimThickness * 2, height: rimDepth, depth: rimThickness}, scene);
      rimB.position = new BABYLON.Vector3(0, -rimDepth / 2 + 0.05, -half - rimThickness / 2);
      rimB.material = rimMat;

      const rimR = BABYLON.MeshBuilder.CreateBox("rimR", {width: rimThickness, height: rimDepth, depth: w}, scene);
      rimR.position = new BABYLON.Vector3(half + rimThickness / 2, -rimDepth / 2 + 0.05, 0);
      rimR.material = rimMat;

      const rimL = BABYLON.MeshBuilder.CreateBox("rimL", {width: rimThickness, height: rimDepth, depth: w}, scene);
      rimL.position = new BABYLON.Vector3(-half - rimThickness / 2, -rimDepth / 2 + 0.05, 0);
      rimL.material = rimMat;

      // --- Environment ------------------------------------------------
      // Subtle ground plane below the diorama for shadows
      const envGround = BABYLON.MeshBuilder.CreateGround("envGround", {width: 400, height: 400}, scene);
      envGround.position.y = -d - 0.05;
      const envMat = new BABYLON.StandardMaterial("envMat", scene);
      envMat.diffuseColor = new BABYLON.Color3(0.06, 0.07, 0.09);
      envMat.specularColor = new BABYLON.Color3(0, 0, 0);
      envGround.material = envMat;
      envGround.receiveShadows = true;

      return scene;
    };

    const scene = createScene();
    engine.runRenderLoop(() => scene.render());
    window.addEventListener("resize", () => engine.resize());
  </script>
</body>
</html>
