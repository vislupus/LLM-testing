<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo 3D Terrain Diorama</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', system-ui, sans-serif; }
        #renderCanvas { width: 100%; height: 100%; outline: none; }
        
        /* Loading Screen */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: #e0e0e0;
        }
        #loading.hidden { display: none; }
        #loading h1 { margin-bottom: 20px; color: #4ecdc4; }
        
        .upload-section {
            background: rgba(255,255,255,0.05);
            border: 1px dashed #4ecdc4;
            border-radius: 12px; padding: 30px; margin: 10px;
            text-align: center; min-width: 300px;
        }
        .upload-section label { display: block; margin-bottom: 10px; color: #aaa; font-size: 14px; }
        .upload-section input[type="file"] {
            background: rgba(255,255,255,0.1); color: #fff;
            padding: 10px; border-radius: 6px; cursor: pointer;
        }
        #start-btn {
            margin-top: 30px; padding: 14px 40px;
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            border: none; color: #fff; font-size: 16px; font-weight: bold;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        #start-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(78, 205, 196, 0.4); }
        #start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: #ddd; padding: 10px 20px;
            border-radius: 20px; font-size: 13px; pointer-events: none;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading">
        <h1>🏔️ Osogovo 3D Terrain</h1>
        
        <div class="upload-section">
            <label>📍 Height Map (Osogovo Height Map (Merged).png)</label>
            <input type="file" id="heightmap-input" accept="image/*">
        </div>
        
        <div class="upload-section">
            <label>🗺️ Diffuse Texture (Osogovo_map.jpg)</label>
            <input type="file" id="diffuse-input" accept="image/*">
        </div>
        
        <button id="start-btn" disabled onclick="startScene()">Generate 3D Terrain</button>
    </div>
    
    <div id="info" style="display:none;">
        🖱️ Left-click drag: Orbit | Scroll: Zoom | Right-click drag: Pan
    </div>

    <script>
        let canvas = document.getElementById("renderCanvas");
        let engine = null;
        let scene = null;
        
        // File inputs
        let heightMapFile = null;
        let diffuseFile = null;
        
        document.getElementById('heightmap-input').addEventListener('change', (e) => {
            heightMapFile = e.target.files[0];
            checkReady();
        });
        
        document.getElementById('diffuse-input').addEventListener('change', (e) => {
            diffuseFile = e.target.files[0];
            checkReady();
        });
        
        function checkReady() {
            document.getElementById('start-btn').disabled = !(heightMapFile && diffuseFile);
        }
        
        function readFileAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }
        
        async function startScene() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('info').style.display = 'block';
            
            const heightMapURL = await readFileAsDataURL(heightMapFile);
            const diffuseURL = await readFileAsDataURL(diffuseFile);
            
            createScene(heightMapURL, diffuseURL);
        }
        
        function createScene(heightMapURL, diffuseURL) {
            engine = new BABYLON.Engine(canvas, true);
            scene = new BABYLON.Scene(engine);
            
            // Clear color - deep dark blue/gray
            scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.08, 1);
            scene.ambientColor = new BABYLON.Color3(0.15, 0.12, 0.1);
            
            // Camera - orbit control
            const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI / 4, Math.PI / 3, 150, new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 350;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.05;
            camera.wheelPrecision = 25;
            camera.panningSensibility = 300;
            camera.minZ = 0.1;
            camera.maxZ = 500;
            
            // Lighting
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.45;
            hemi.groundColor = new BABYLON.Color3(0.1, 0.15, 0.1);
            
            const sun = new BABYLON.DirectionalLight("sun", new BABYLON.Vector3(-1.5, -2.5, -1), scene);
            sun.position = new BABYLON.Vector3(40, 80, 30);
            sun.intensity = 0.7;
            
            const fill = new BABYLON.PointLight("fill", new BABYLON.Vector3(-30, 20, -30), scene);
            fill.intensity = 0.15;
            fill.diffuse = new BABYLON.Color3(0.7, 0.8, 1.0);
            
            const rim = new BABYLON.PointLight("rim", new BABYLON.Vector3(30, 15, 30), scene);
            rim.intensity = 0.12;
            rim.diffuse = new BABYLON.Color3(1.0, 0.85, 0.7);
            
            // Load diffuse texture
            const diffuseTexture = new BABYLON.Texture(diffuseURL, scene);
            diffuseTexture.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
            diffuseTexture.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
            diffuseTexture.anisotropicFilteringLevel = 16;
            
            // Create terrain from height map
            // Parameters: name, height map URL, options, scene
            const terrainSize = 200;
            const subdivisions = 255;
            const minHeight = -5;
            const maxHeight = 50;
            
            // We need to use CreateGroundFromHeightMap with data URL
            // Since it expects a URL, we can pass the data URL directly
            const ground = BABYLON.MeshBuilder.CreateGroundFromHeightMap(
                "terrain",
                heightMapURL,
                {
                    width: terrainSize,
                    height: terrainSize,
                    subdivisions: subdivisions,
                    minHeight: minHeight,
                    maxHeight: maxHeight,
                    colorFilter: new BABYLON.Color3(1, 1, 1)
                },
                scene
            );
            
            // Apply diffuse texture to terrain
            const terrainMat = new BABYLON.StandardMaterial("terrainMat", scene);
            terrainMat.diffuseTexture = diffuseTexture;
            terrainMat.diffuseTexture.uScale = 1;
            terrainMat.diffuseTexture.vScale = 1;
            terrainMat.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
            terrainMat.specularPower = 16;
            terrainMat.ambientColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            
            // Use onReady to ensure mesh is created before applying material
            ground.onReady = () => {
                ground.material = terrainMat;
            };
            
            // Wait for terrain to be ready before building walls
            ground.computeWorldMatrix(true);
            BABYLON.Tools.WaitUntil(() => {
                return ground.isReady();
            }, 100, () => {
                ground.material = terrainMat;
                buildWalls(terrainSize, maxHeight);
                findAndMarkPeaks(terrainSize, maxHeight, subdivisions);
            });
            
            function buildWalls(size, maxH) {
                const wallDepth = 35;
                const half = size / 2;
                
                // Wall materials
                const wallMat = new BABYLON.StandardMaterial("wallMat", scene);
                wallMat.diffuseColor = new BABYLON.Color3(0.22, 0.2, 0.18);
                wallMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
                
                const sideWallMat = new BABYLON.StandardMaterial("sideWall", scene);
                sideWallMat.diffuseColor = new BABYLON.Color3(0.25, 0.23, 0.2);
                
                const bottomMat = new BABYLON.StandardMaterial("bottom", scene);
                bottomMat.diffuseColor = new BABYLON.Color3(0.15, 0.14, 0.12);
                
                // Create walls for each side
                const walls = [];
                
                // North wall (z = -half)
                const northWall = BABYLON.MeshBuilder.CreateBox("northWall", {
                    width: size + wallDepth * 2,
                    height: wallDepth,
                    depth: wallDepth
                }, scene);
                northWall.position.set(0, -wallDepth/2, -half - wallDepth/2);
                northWall.material = wallMat;
                
                // South wall (z = +half)
                const southWall = BABYLON.MeshBuilder.CreateBox("southWall", {
                    width: size + wallDepth * 2,
                    height: wallDepth,
                    depth: wallDepth
                }, scene);
                southWall.position.set(0, -wallDepth/2, half + wallDepth/2);
                southWall.material = wallMat;
                
                // East wall (x = +half)
                const eastWall = BABYLON.MeshBuilder.CreateBox("eastWall", {
                    width: wallDepth,
                    height: wallDepth,
                    depth: size
                }, scene);
                eastWall.position.set(half + wallDepth/2, -wallDepth/2, 0);
                eastWall.material = sideWallMat;
                
                // West wall (x = -half)
                const westWall = BABYLON.MeshBuilder.CreateBox("westWall", {
                    width: wallDepth,
                    height: wallDepth,
                    depth: size
                }, scene);
                westWall.position.set(-half - wallDepth/2, -wallDepth/2, 0);
                westWall.material = sideWallMat;
                
                // Bottom floor
                const bottom = BABYLON.MeshBuilder.CreateBox("bottom", {
                    width: size + wallDepth * 2,
                    height: 1,
                    depth: size + wallDepth * 2
                }, scene);
                bottom.position.set(0, -wallDepth - 0.5, 0);
                bottom.material = bottomMat;
                
                // Base trim
                const trimMat = new BABYLON.StandardMaterial("trim", scene);
                trimMat.diffuseColor = new BABYLON.Color3(0.35, 0.32, 0.28);
                
                const trimNorth = BABYLON.MeshBuilder.CreateBox("trimN", {
                    width: size + wallDepth * 2 + 1,
                    height: 1.5,
                    depth: 1.5
                }, scene);
                trimNorth.position.set(0, -wallDepth - 0.25, -half - wallDepth - 0.25);
                trimNorth.material = trimMat;
                
                const trimSouth = BABYLON.MeshBuilder.CreateBox("trimS", {
                    width: size + wallDepth * 2 + 1,
                    height: 1.5,
                    depth: 1.5
                }, scene);
                trimSouth.position.set(0, -wallDepth - 0.25, half + wallDepth + 0.25);
                trimSouth.material = trimMat;
                
                const trimEast = BABYLON.MeshBuilder.CreateBox("trimE", {
                    width: 1.5,
                    height: 1.5,
                    depth: size + wallDepth * 2 + 1
                }, scene);
                trimEast.position.set(half + wallDepth + 0.25, -wallDepth - 0.25, 0);
                trimEast.material = trimMat;
                
                const trimWest = BABYLON.MeshBuilder.CreateBox("trimW", {
                    width: 1.5,
                    height: 1.5,
                    depth: size + wallDepth * 2 + 1
                }, scene);
                trimWest.position.set(-half - wallDepth - 0.25, -wallDepth - 0.25, 0);
                trimWest.material = trimMat;
                
                // Corner pillars
                const pillarMat = new BABYLON.StandardMaterial("pillar", scene);
                pillarMat.diffuseColor = new BABYLON.Color3(0.3, 0.28, 0.25);
                
                [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx, sz], i) => {
                    const pillar = BABYLON.MeshBuilder.CreateCylinder("pillar" + i, {
                        height: wallDepth + 1,
                        diameterTop: 2.5,
                        diameterBottom: 3,
                        tessellation: 8
                    }, scene);
                    pillar.position.set(sx * (half + wallDepth), -wallDepth/2, sz * (half + wallDepth));
                    pillar.material = pillarMat;
                });
            }
            
            function findAndMarkPeaks(size, maxH, subdivisions) {
                // Get vertex data to find peaks
                const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                if (!positions) return;
                
                // Convert to 2D grid for easier processing
                const gridDim = subdivisions + 1;
                const grid = [];
                for (let i = 0; i < gridDim * gridDim; i++) {
                    grid.push({
                        x: positions[i * 3],
                        y: positions[i * 3 + 1],
                        z: positions[i * 3 + 2],
                        idx: i
                    });
                }
                
                // Sort by height (Y)
                grid.sort((a, b) => b.y - a.y);
                
                // Find top peaks that are well-separated
                const peaks = [];
                const minDistance = size / 8; // Minimum distance between peaks
                
                for (let i = 0; i < grid.length && peaks.length < 6; i++) {
                    const candidate = grid[i];
                    // Check if too close to existing peaks
                    let tooClose = false;
                    for (const peak of peaks) {
                        const dx = candidate.x - peak.x;
                        const dz = candidate.z - peak.z;
                        if (Math.sqrt(dx*dx + dz*dz) < minDistance) {
                            tooClose = true;
                            break;
                        }
                    }
                    if (!tooClose) {
                        peaks.push(candidate);
                    }
                }
                
                // Take top 3 peaks
                const topPeaks = peaks.slice(0, 3);
                
                const peakNames = ["Peak 1", "Peak 2", "Peak 3"];
                
                topPeaks.forEach((peak, i) => {
                    // Marker post
                    const post = BABYLON.MeshBuilder.CreateCylinder("post" + i, {
                        height: 6,
                        diameter: 0.4,
                        tessellation: 6
                    }, scene);
                    post.position.set(peak.x, peak.y + 3, peak.z);
                    
                    const postMat = new BABYLON.StandardMaterial("postMat" + i, scene);
                    postMat.diffuseColor = new BABYLON.Color3(1, 0.95, 0.3);
                    postMat.emissiveColor = new BABYLON.Color3(0.3, 0.25, 0.05);
                    post.material = postMat;
                    
                    // Glowing sphere on top
                    const sphere = BABYLON.MeshBuilder.CreateSphere("sphere" + i, {
                        diameter: 1.5,
                        segments: 16
                    }, scene);
                    sphere.position.set(peak.x, peak.y + 6.5, peak.z);
                    
                    const sphereMat = new BABYLON.StandardMaterial("sphereMat" + i, scene);
                    sphereMat.diffuseColor = new BABYLON.Color3(1, 0.4, 0.1);
                    sphereMat.emissiveColor = new BABYLON.Color3(0.5, 0.15, 0.05);
                    sphere.material = sphereMat;
                    
                    // Point light at peak
                    const peakLight = new BABYLON.PointLight("peakLight" + i, sphere.position, scene);
                    peakLight.intensity = 0.25;
                    peakLight.diffuse = new BABYLON.Color3(1, 0.6, 0.3);
                    
                    // Billboard text label
                    const labelPlane = BABYLON.MeshBuilder.CreatePlane("label" + i, {
                        width: 12,
                        height: 4
                    }, scene);
                    labelPlane.position.set(peak.x, peak.y + 12, peak.z);
                    labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                    
                    // Create texture with text
                    const dynamicTexture = new BABYLON.DynamicTexture("dt" + i, {width: 512, height: 128}, scene);
                    dynamicTexture.hasAlpha = true;
                    const context = dynamicTexture.getContext();
                    
                    // Background
                    context.fillStyle = "rgba(20, 20, 35, 0.85)";
                    context.roundRect(0, 0, 512, 128, 20);
                    context.fill();
                    
                    // Border
                    context.strokeStyle = "#ffd700";
                    context.lineWidth = 4;
                    context.roundRect(0, 0, 512, 128, 20);
                    context.stroke();
                    
                    // Text
                    context.font = "bold 48px Segoe UI, Arial, sans-serif";
                    context.textAlign = "center";
                    context.textBaseline = "middle";
                    context.fillStyle = "#ffd700";
                    context.fillText(peakNames[i], 256, 50);
                    
                    context.font = "32px Segoe UI, Arial, sans-serif";
                    context.fillStyle = "#cccccc";
                    context.fillText(`Elevation: ${Math.round(peak.y)}m`, 256, 95);
                    
                    dynamicTexture.update();
                    
                    const labelMat = new BABYLON.StandardMaterial("labelMat" + i, scene);
                    labelMat.diffuseTexture = dynamicTexture;
                    labelMat.emissiveTexture = dynamicTexture;
                    labelMat.useAlphaFromDiffuseTexture = true;
                    labelMat.disableLighting = true;
                    labelPlane.material = labelMat;
                });
            }
            
            // Subtle ambient particles for atmosphere
            const ps = new BABYLON.ParticleSystem("atmosphere", 150, scene);
            ps.particleTexture = new BABYLON.Texture("https://playground.babylonjs.com/textures/flare.png", scene);
            ps.createPointEmitter(
                new BABYLON.Vector3(-terrainSize/2, maxHeight, -terrainSize/2),
                new BABYLON.Vector3(terrainSize/2, maxHeight + 40, terrainSize/2)
            );
            ps.color1 = new BABYLON.Color4(0.7, 0.8, 0.9, 0.15);
            ps.color2 = new BABYLON.Color4(0.9, 0.95, 1, 0.05);
            ps.colorDead = new BABYLON.Color4(0.5, 0.6, 0.7, 0);
            ps.minSize = 0.5;
            ps.maxSize = 2.5;
            ps.minLifeTime = 3;
            ps.maxLifeTime = 8;
            ps.emitRate = 25;
            ps.blendMode = BABYLON.ParticleSystem.BLENDMODE_ONEONE;
            ps.minEmitPower = 0.2;
            ps.maxEmitPower = 1;
            ps.updateSpeed = 0.01;
            ps.start();
            
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            window.addEventListener("resize", () => {
                engine.resize();
            });
        }
    </script>
</body>
</html>
