        const textureBase64 = "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QAiRXhpZgAATU0AKgAAAAgAAQESAAMAAAABAAEAAAAAAAABAIQAAwAAAAEAAQAAABABAgMAAAABAAEAAAB3AgUAAAABAAAApIEAAgACAAAAWQAABl6gAQADAAAAAQAAAACgAwAEAAAAAQAAA+ikAQAFAAAAAQAAArqkAQAFAAAAAQAAAsCiAQAHAAAAAQAAAAAApAIABQAAAAEAAAsspAMABQAAAAEAAAtCpAUABQAAAAEAAAtMJAQACgAAAAEAAAtUJAQADAAAAAQAAAACkBgADAAAAAQAAAAAAAAAAAABIAAAAAQAAAEgAAAABU2F0ZWxsaXRlIHRleHR1cmUuanBnAAMAAJAHAAQAAAAAQwAAOdABAAQAAAABAAEAAAAAAAAACgAAAVIAAAAFAAAAhgAAAP////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////"

        window.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);

            const createScene = function() {
                const scene = new BABYLON.Scene(engine);
                scene.clearColor = new BABYLON.Color3.FromHexString("#223049");

                // --- CAMERA SETUP ---
                // ArcRotateCamera allows orbiting, panning, and zooming
                const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2.2, Math.PI / 3.5, 600, new BABYLON.Vector3(0, 0, 0), scene);
                camera.attachControl(canvas, true);
                camera.wheelPrecision = 10;
                camera.lowerRadiusLimit = 200;
                camera.upperRadiusLimit = 1500;
                camera.upperBetaLimit = Math.PI / 2.1; // Prevent camera from going below the terrain

                // --- LIGHTING SETUP ---
                // Hemispheric light provides ambient illumination
                const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
                hemiLight.intensity = 0.8;
                hemiLight.specular = new BABYLON.Color3(0, 0, 0); // No specular highlights from this light

                // Directional light simulates a sun
                const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-0.5, -1, -0.5), scene);
                dirLight.position = new BABYLON.Vector3(200, 400, 200);
                dirLight.intensity = 0.7;

                // --- TERRAIN CREATION ---
                const terrainMaterial = new BABYLON.StandardMaterial("terrainMat", scene);
                terrainMaterial.diffuseTexture = new BABYLON.Texture(textureBase64, scene, false, true);
                terrainMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                
                const groundSize = 500;
                const groundSubdivisions = 250;
                const minHeight = 0;
                const maxHeight = 60;

                const terrain = BABYLON.MeshBuilder.CreateGroundFromHeightMap("terrain", heightMapBase64, {
                    width: groundSize,
                    height: groundSize,
                    subdivisions: groundSubdivisions,
                    minHeight: minHeight,
                    maxHeight: maxHeight,
                    updatable: true // Important: allows us to read vertex data
                }, scene);
                terrain.material = terrainMaterial;
                terrain.position.y = -5; // Lower the whole terrain slightly

                // --- DIORAMA PEDESTAL CREATION ---
                const pedestalMaterial = new BABYLON.StandardMaterial("pedestalMat", scene);
                pedestalMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.15, 0.2);
                pedestalMaterial.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

                const createPedestal = (ground) => {
                    const positions = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                    const sideLength = groundSubdivisions + 1;
                    const topPath = [];
                    
                    // This logic traces the perimeter of the square grid of vertices
                    // 1. Top edge
                    for (let i = 0; i < sideLength; i++) {
                        topPath.push(new BABYLON.Vector3(positions[i * 3], positions[i * 3 + 1], positions[i * 3 + 2]));
                    }
                    // 2. Right edge
                    for (let i = 1; i < sideLength; i++) {
                        let index = (i * sideLength) + (sideLength - 1);
                        topPath.push(new BABYLON.Vector3(positions[index * 3], positions[index * 3 + 1], positions[index * 3 + 2]));
                    }
                    // 3. Bottom edge (in reverse)
                    for (let i = sideLength - 2; i >= 0; i--) {
                        let index = ((sideLength - 1) * sideLength) + i;
                        topPath.push(new BABYLON.Vector3(positions[index * 3], positions[index * 3 + 1], positions[index * 3 + 2]));
                    }
                    // 4. Left edge (in reverse)
                    for (let i = sideLength - 2; i > 0; i--) {
                        let index = i * sideLength;
                        topPath.push(new BABYLON.Vector3(positions[index * 3], positions[index * 3 + 1], positions[index * 3 + 2]));
                    }

                    const pedestalDepth = -60; // How far down the pedestal extends
                    const bottomPath = topPath.map(p => new BABYLON.Vector3(p.x, pedestalDepth, p.z));

                    // Close the loop for the ribbon
                    topPath.push(topPath[0].clone());
                    bottomPath.push(bottomPath[0].clone());

                    // Create the walls by forming a ribbon between the top and bottom edge paths
                    const walls = BABYLON.MeshBuilder.CreateRibbon("walls", {
                        pathArray: [bottomPath, topPath], // Order matters for normals
                        sideOrientation: BABYLON.Mesh.DOUBLESIDE,
                        instance: null,
                        updatable: false
                    }, scene);
                    walls.material = pedestalMaterial;
                    walls.parent = ground;

                    // Create the bottom cap of the pedestal
                    const bottomPlane = BABYLON.MeshBuilder.CreateGround("bottom", {width: groundSize, height: groundSize}, scene);
                    bottomPlane.material = pedestalMaterial;
                    bottomPlane.position.y = pedestalDepth;
                    bottomPlane.parent = ground;
                };

                // Wait for the ground to be fully ready before creating the pedestal
                ground.onReady = () => {
                    createPedestal(ground);

                    // --- PEAK MARKERS AND LABELS ---
                    // Helper function to create a marker and its label
                    const createPeakMarker = (name, position, labelText, scene) => {
                        // The glowing marker point
                        const marker = BABYLON.MeshBuilder.CreateSphere(name + "Marker", { diameter: 4 }, scene);
                        marker.position = position;
                        marker.parent = ground;

                        const markerMaterial = new BABYLON.StandardMaterial(name + "Mat", scene);
                        markerMaterial.emissiveColor = new BABYLON.Color3.FromHexString("#ff5555");
                        markerMaterial.disableLighting = true; // Make it glow regardless of light
                        marker.material = markerMaterial;

                        // The plane that will hold the text label
                        const labelPlane = BABYLON.MeshBuilder.CreatePlane(name + "LabelPlane", { width: 40, height: 15 }, scene);
                        labelPlane.position = position.add(new BABYLON.Vector3(0, 10, 0)); // Position label above the marker
                        labelPlane.parent = ground;
                        labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_Y; // Always face camera, but don't tilt up/down

                        // Create a dynamic texture on the plane for the GUI text
                        const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateForMesh(labelPlane);
                        
                        const textBlock = new BABYLON.GUI.TextBlock();
                        textBlock.text = labelText;
                        textBlock.color = "white";
                        textBlock.fontSize = 70;
                        textBlock.fontStyle = "bold";
                        textBlock.shadowBlur = 5;
                        textBlock.shadowColor = "black";
                        advancedTexture.addControl(textBlock);
                    };

                    // Coordinates for markers. These were found by inspecting the height map.
                    // (0,0) is the center of the terrain.
                    const peakLocations = [
                        { name: "Ruen Peak", pos: new BABYLON.Vector3(-15, 47, -25) },
                        { name: "Sultan Tepe", pos: new BABYLON.Vector3(105, 38, 140) },
                        { name: "Carev Vrv", pos: new BABYLON.Vector3(-140, 25, 120) }
                    ];

                    peakLocations.forEach(peak => {
                        createPeakMarker(peak.name, peak.pos, peak.name, scene);
                    });
                };

                return scene;
            };

            const scene = createScene();

            // --- RENDER LOOP ---
            engine.runRenderLoop(function() {
                scene.render();
            });

            // Handle browser window resize
            window.addEventListener('resize', function() {
                engine.resize();
            });
        });
    </script>
