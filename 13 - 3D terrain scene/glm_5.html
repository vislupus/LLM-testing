<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏔️ Osogovo 3D Terrain Diorama</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            display: block;
            touch-action: none;
        }

        /* UI Overlay */
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
        }

        .title-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(20, 30, 50, 0.95), rgba(10, 20, 40, 0.98));
            border: 2px solid #4a9eff;
            border-radius: 12px;
            padding: 15px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .title-card h1 {
            color: #4a9eff;
            font-size: 22px;
            text-shadow: 0 0 20px rgba(74, 158, 255, 0.5);
            margin-bottom: 5px;
        }

        .title-card p {
            color: #8899aa;
            font-size: 12px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, rgba(20, 30, 50, 0.9), rgba(10, 20, 40, 0.95));
            border: 2px solid #4a9eff;
            border-radius: 12px;
            padding: 15px;
            pointer-events: auto;
        }

        .legend-title {
            color: #4a9eff;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            color: #aabbcc;
            font-size: 11px;
        }

        .legend-marker {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 30, 50, 0.8);
            border: 1px solid #4a6fa5;
            border-radius: 8px;
            padding: 10px 15px;
            color: #8b9dc3;
            font-size: 11px;
        }

        .controls-hint span {
            color: #4ecdc4;
        }

        /* Loading screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid #333;
            border-top-color: #4a9eff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingScreen p {
            color: #4a9eff;
            margin-top: 20px;
            font-size: 16px;
        }

        .progress-bar {
            width: 200px;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a9eff, #00ff88);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loader"></div>
        <p>Generating Osogovo Terrain...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Canvas -->
    <canvas id="renderCanvas"></canvas>

    <!-- UI -->
    <div id="ui">
        <div class="title-card">
            <h1>🏔️ Osogovo Mountain Range</h1>
            <p>3D Terrain Diorama - Height: 2,252m</p>
        </div>
        
        <div class="legend">
            <div class="legend-title">Peak Markers</div>
            <div class="legend-item">
                <div class="legend-marker" style="background: #ff4444; color: #ff4444;"></div>
                <span>Ruen Peak (2,252m)</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker" style="background: #44ff44; color: #44ff44;"></div>
                <span>Ezeyn Peak (2,068m)</span>
            </div>
            <div class="legend-item">
                <div class="legend-marker" style="background: #ffaa00; color: #ffaa00;"></div>
                <span>Choveka Peak (2,047m)</span>
            </div>
        </div>

        <div class="controls-hint">
            <span>🖱️ Drag</span> Rotate &nbsp;
            <span>🔘 Scroll</span> Zoom &nbsp;
            <span>⌨️ WASD</span> Pan
        </div>
    </div>

    <!-- Babylon.js -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>

    <script>
        /* ============================================
           CONFIGURATION
           ============================================ */
        const CONFIG = {
            terrainSize: 100,
            terrainHeight: 25,
            subdivisions: 150,
            boxDepth: 15,
            minElevation: 0
        };

        /* ============================================
           PROCEDURAL HEIGHT MAP GENERATION
           Simulates Osogovo mountain range
           ============================================ */
        function generateHeightMap(width, height) {
            const data = new Float32Array(width * height);
            
            // Simplex-like noise implementation
            class SimplexNoise {
                constructor(seed = Math.random()) {
                    this.p = new Uint8Array(512);
                    this.perm = new Uint8Array(512);
                    
                    for (let i = 0; i < 256; i++) {
                        this.p[i] = i;
                    }
                    
                    // Shuffle
                    for (let i = 255; i > 0; i--) {
                        const j = Math.floor((seed = (seed * 16807) % 2147483647) / 2147483647 * (i + 1));
                        [this.p[i], this.p[j]] = [this.p[j], this.p[i]];
                    }
                    
                    for (let i = 0; i < 512; i++) {
                        this.perm[i] = this.p[i & 255];
                    }
                }
                
                noise2D(x, y) {
                    const F2 = 0.5 * (Math.sqrt(3) - 1);
                    const G2 = (3 - Math.sqrt(3)) / 6;
                    
                    const s = (x + y) * F2;
                    const i = Math.floor(x + s);
                    const j = Math.floor(y + s);
                    
                    const t = (i + j) * G2;
                    const X0 = i - t;
                    const Y0 = j - t;
                    const x0 = x - X0;
                    const y0 = y - Y0;
                    
                    let i1, j1;
                    if (x0 > y0) { i1 = 1; j1 = 0; }
                    else { i1 = 0; j1 = 1; }
                    
                    const x1 = x0 - i1 + G2;
                    const y1 = y0 - j1 + G2;
                    const x2 = x0 - 1 + 2 * G2;
                    const y2 = y0 - 1 + 2 * G2;
                    
                    const ii = i & 255;
                    const jj = j & 255;
                    
                    const grad = (hash, x, y) => {
                        const h = hash & 7;
                        const u = h < 4 ? x : y;
                        const v = h < 4 ? y : x;
                        return ((h & 1) ? -u : u) + ((h & 2) ? -2 * v : 2 * v);
                    };
                    
                    let n0 = 0, n1 = 0, n2 = 0;
                    
                    let t0 = 0.5 - x0 * x0 - y0 * y0;
                    if (t0 >= 0) {
                        t0 *= t0;
                        n0 = t0 * t0 * grad(this.perm[ii + this.perm[jj]], x0, y0);
                    }
                    
                    let t1 = 0.5 - x1 * x1 - y1 * y1;
                    if (t1 >= 0) {
                        t1 *= t1;
                        n1 = t1 * t1 * grad(this.perm[ii + i1 + this.perm[jj + j1]], x1, y1);
                    }
                    
                    let t2 = 0.5 - x2 * x2 - y2 * y2;
                    if (t2 >= 0) {
                        t2 *= t2;
                        n2 = t2 * t2 * grad(this.perm[ii + 1 + this.perm[jj + 1]], x2, y2);
                    }
                    
                    return 70 * (n0 + n1 + n2);
                }
            }
            
            const noise = new SimplexNoise(12345);
            
            // Osogovo-specific height generation
            // Main ridge running NE-SW with several peaks
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    
                    // Normalized coordinates
                    const nx = x / width;
                    const ny = y / height;
                    
                    // Center the mountain range
                    const cx = nx - 0.5;
                    const cy = ny - 0.5;
                    
                    // Main ridge shape (Osogovo runs diagonally)
                    const ridgeDist = Math.abs(cy - cx * 0.7) * 2;
                    const ridgeHeight = Math.max(0, 1 - ridgeDist * 1.5);
                    
                    // Multi-octave noise for detail
                    let elevation = 0;
                    elevation += noise.noise2D(nx * 4, ny * 4) * 0.5;
                    elevation += noise.noise2D(nx * 8, ny * 8) * 0.25;
                    elevation += noise.noise2D(nx * 16, ny * 16) * 0.125;
                    elevation += noise.noise2D(nx * 32, ny * 32) * 0.0625;
                    
                    // Combine ridge with noise
                    elevation = (elevation + 1) * 0.5;
                    elevation = elevation * 0.6 + ridgeHeight * 0.4;
                    
                    // Create three distinct peaks
                    // Peak 1: Ruen (highest, center-north)
                    const peak1X = 0.45, peak1Y = 0.35;
                    const dist1 = Math.sqrt(Math.pow(nx - peak1X, 2) + Math.pow(ny - peak1Y, 2));
                    const peak1 = Math.exp(-dist1 * dist1 * 50) * 0.35;
                    
                    // Peak 2: Ezeyn (southeast)
                    const peak2X = 0.6, peak2Y = 0.55;
                    const dist2 = Math.sqrt(Math.pow(nx - peak2X, 2) + Math.pow(ny - peak2Y, 2));
                    const peak2 = Math.exp(-dist2 * dist2 * 40) * 0.28;
                    
                    // Peak 3: Choveka (southwest)
                    const peak3X = 0.35, peak3Y = 0.6;
                    const dist3 = Math.sqrt(Math.pow(nx - peak3X, 2) + Math.pow(ny - peak3Y, 2));
                    const peak3 = Math.exp(-dist3 * dist3 * 35) * 0.25;
                    
                    elevation += peak1 + peak2 + peak3;
                    
                    // Edge falloff for diorama effect
                    const edgeX = Math.min(nx, 1 - nx) * 2;
                    const edgeY = Math.min(ny, 1 - ny) * 2;
                    const edgeFactor = Math.min(edgeX, edgeY);
                    const edgeFalloff = Math.pow(Math.min(1, edgeFactor * 1.5), 0.5);
                    
                    elevation *= edgeFalloff;
                    
                    // Store height
                    data[idx] = Math.max(0, Math.min(1, elevation));
                }
            }
            
            return data;
        }

        /* ============================================
           PROCEDURAL DIFFUSE TEXTURE GENERATION
           Creates realistic terrain coloring
           ============================================ */
        function generateDiffuseTexture(width, height, heightMap) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imageData = ctx.createImageData(width, height);
            
            // Color palette for terrain
            const colors = {
                water: [70, 130, 180],      // Steel blue for low areas
                sand: [194, 178, 128],       // Sandy brown
                grass: [86, 125, 70],        // Forest green
                rock: [128, 128, 128],       // Gray
                snow: [250, 250, 255],       // White
                darkRock: [80, 75, 70]       // Dark rock
            };
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = y * width + x;
                    const h = heightMap[idx];
                    const pixelIdx = idx * 4;
                    
                    // Color based on elevation
                    let r, g, b;
                    
                    if (h < 0.15) {
                        // Low valleys - dark earth/vegetation
                        const t = h / 0.15;
                        r = colors.water[0] * (1 - t) + colors.sand[0] * t;
                        g = colors.water[1] * (1 - t) + colors.sand[1] * t;
                        b = colors.water[2] * (1 - t) + colors.sand[2] * t;
                    } else if (h < 0.35) {
                        // Lower slopes - grass
                        const t = (h - 0.15) / 0.2;
                        r = colors.sand[0] * (1 - t) + colors.grass[0] * t;
                        g = colors.sand[1] * (1 - t) + colors.grass[1] * t;
                        b = colors.sand[2] * (1 - t) + colors.grass[2] * t;
                    } else if (h < 0.55) {
                        // Mid slopes - forest to rock transition
                        const t = (h - 0.35) / 0.2;
                        r = colors.grass[0] * (1 - t) + colors.rock[0] * t;
                        g = colors.grass[1] * (1 - t) + colors.rock[1] * t;
                        b = colors.grass[2] * (1 - t) + colors.rock[2] * t;
                    } else if (h < 0.75) {
                        // Upper slopes - rocky
                        const t = (h - 0.55) / 0.2;
                        r = colors.rock[0] * (1 - t) + colors.darkRock[0] * t;
                        g = colors.rock[1] * (1 - t) + colors.darkRock[1] * t;
                        b = colors.rock[2] * (1 - t) + colors.darkRock[2] * t;
                    } else {
                        // Peaks - snow
                        const t = (h - 0.75) / 0.25;
                        r = colors.darkRock[0] * (1 - t) + colors.snow[0] * t;
                        g = colors.darkRock[1] * (1 - t) + colors.snow[1] * t;
                        b = colors.darkRock[2] * (1 - t) + colors.snow[2] * t;
                    }
                    
                    // Add some noise variation
                    const noise = (Math.random() - 0.5) * 20;
                    r = Math.max(0, Math.min(255, r + noise));
                    g = Math.max(0, Math.min(255, g + noise));
                    b = Math.max(0, Math.min(255, b + noise));
                    
                    imageData.data[pixelIdx] = r;
                    imageData.data[pixelIdx + 1] = g;
                    imageData.data[pixelIdx + 2] = b;
                    imageData.data[pixelIdx + 3] = 255;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
            return canvas;
        }

        /* ============================================
           FIND PEAK POSITIONS
           ============================================ */
        function findPeakPositions(heightMap, width, height) {
            const peaks = [];
            
            // Define approximate peak locations based on our generation
            const peakLocations = [
                { x: 0.45, y: 0.35, name: "Ruen Peak", height: 2252, color: new BABYLON.Color3(1, 0.27, 0.27) },
                { x: 0.6, y: 0.55, name: "Ezeyn Peak", height: 2068, color: new BABYLON.Color3(0.27, 1, 0.27) },
                { x: 0.35, y: 0.6, name: "Choveka Peak", height: 2047, color: new BABYLON.Color3(1, 0.67, 0) }
            ];
            
            // Find exact highest point near each location
            peakLocations.forEach(peak => {
                const searchRadius = 0.08;
                let maxHeight = 0;
                let bestX = peak.x;
                let bestY = peak.y;
                
                for (let dy = -searchRadius; dy <= searchRadius; dy += 0.005) {
                    for (let dx = -searchRadius; dx <= searchRadius; dx += 0.005) {
                        const px = peak.x + dx;
                        const py = peak.y + dy;
                        
                        if (px >= 0 && px < 1 && py >= 0 && py < 1) {
                            const ix = Math.floor(px * width);
                            const iy = Math.floor(py * height);
                            const h = heightMap[iy * width + ix];
                            
                            if (h > maxHeight) {
                                maxHeight = h;
                                bestX = px;
                                bestY = py;
                            }
                        }
                    }
                }
                
                peaks.push({
                    x: bestX,
                    y: bestY,
                    height: maxHeight,
                    name: peak.name,
                    realHeight: peak.height,
                    color: peak.color
                });
            });
            
            return peaks;
        }

        /* ============================================
           MAIN SCENE CREATION
           ============================================ */
        async function createScene() {
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true, { 
                preserveDrawingBuffer: true, 
                stencil: true 
            });

            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.15, 0.2, 0.3, 1);

            // Update progress
            updateProgress(10);

            // Generate height map
            const mapSize = 512;
            const heightMap = generateHeightMap(mapSize, mapSize);
            updateProgress(30);

            // Generate diffuse texture
            const diffuseCanvas = generateDiffuseTexture(mapSize, mapSize, heightMap);
            updateProgress(50);

            // Find peak positions
            const peaks = findPeakPositions(heightMap, mapSize, mapSize);
            updateProgress(60);

            // Camera - orbit around the diorama
            const camera = new BABYLON.ArcRotateCamera(
                "camera",
                Math.PI / 4,
                Math.PI / 3,
                120,
                new BABYLON.Vector3(0, 10, 0),
                scene
            );
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 200;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.1;
            camera.wheelPrecision = 5;
            camera.panningSensibility = 100;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight(
                "hemiLight",
                new BABYLON.Vector3(0, 1, 0),
                scene
            );
            hemiLight.intensity = 0.7;
            hemiLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
            hemiLight.groundColor = new BABYLON.Color3(0.4, 0.4, 0.45);

            const sunLight = new BABYLON.DirectionalLight(
                "sunLight",
                new BABYLON.Vector3(-1, -2, -0.5),
                scene
            );
            sunLight.intensity = 0.8;
            sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.85);
            sunLight.position = new BABYLON.Vector3(50, 100, 50);

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            updateProgress(70);

            // Create terrain mesh from height map
            const terrain = new BABYLON.Mesh("terrain", scene);
            const positions = [];
            const indices = [];
            const uvs = [];
            const normals = [];
            
            const subdivisions = CONFIG.subdivisions;
            const size = CONFIG.terrainSize;
            const heightScale = CONFIG.terrainHeight;
            
            // Generate vertices
            for (let z = 0; z <= subdivisions; z++) {
                for (let x = 0; x <= subdivisions; x++) {
                    const u = x / subdivisions;
                    const v = z / subdivisions;
                    
                    const px = (u - 0.5) * size;
                    const pz = (v - 0.5) * size;
                    
                    // Sample height map
                    const hx = Math.floor(u * (mapSize - 1));
                    const hz = Math.floor(v * (mapSize - 1));
                    const height = heightMap[hz * mapSize + hx] * heightScale;
                    
                    positions.push(px, height, pz);
                    uvs.push(u, 1 - v);
                }
            }
            
            // Generate indices
            for (let z = 0; z < subdivisions; z++) {
                for (let x = 0; x < subdivisions; x++) {
                    const topLeft = z * (subdivisions + 1) + x;
                    const topRight = topLeft + 1;
                    const bottomLeft = (z + 1) * (subdivisions + 1) + x;
                    const bottomRight = bottomLeft + 1;
                    
                    indices.push(topLeft, bottomLeft, topRight);
                    indices.push(topRight, bottomLeft, bottomRight);
                }
            }
            
            // Calculate normals
            BABYLON.VertexData.ComputeNormals(positions, indices, normals);
            
            // Apply to mesh
            const vertexData = new BABYLON.VertexData();
            vertexData.positions = positions;
            vertexData.indices = indices;
            vertexData.uvs = uvs;
            vertexData.normals = normals;
            vertexData.applyToMesh(terrain);
            
            updateProgress(80);

            // Create terrain material
            const terrainMaterial = new BABYLON.StandardMaterial("terrainMat", scene);
            const diffuseTexture = new BABYLON.DynamicTexture("diffuseTexture", { width: mapSize, height: mapSize }, scene);
            const diffCtx = diffuseTexture.getContext();
            
            // Draw the generated texture
            diffCtx.drawImage(diffuseCanvas, 0, 0);
            diffuseTexture.update();
            
            terrainMaterial.diffuseTexture = diffuseTexture;
            terrainMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            terrainMaterial.specularPower = 64;
            terrain.material = terrainMaterial;
            terrain.receiveShadows = true;

            // Create diorama box (walls and bottom)
            const boxDepth = CONFIG.boxDepth;
            const halfSize = size / 2;
            
            // Wall material
            const wallMaterial = new BABYLON.StandardMaterial("wallMat", scene);
            wallMaterial.diffuseColor = new BABYLON.Color3(0.25, 0.22, 0.2);
            wallMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            // Bottom material
            const bottomMaterial = new BABYLON.StandardMaterial("bottomMat", scene);
            bottomMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.13, 0.12);
            bottomMaterial.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            
            // Helper to get height at position
            function getHeightAt(x, z) {
                const u = (x + halfSize) / size;
                const v = (z + halfSize) / size;
                const hx = Math.floor(u * (mapSize - 1));
                const hz = Math.floor(v * (mapSize - 1));
                return heightMap[hz * mapSize + hx] * heightScale;
            }
            
            // Create walls
            const wallSegments = 50;
            
            // Front wall (Z+)
            const frontWall = new BABYLON.Mesh("frontWall", scene);
            const frontPositions = [];
            const frontIndices = [];
            const frontUVs = [];
            const frontNormals = [];
            
            for (let i = 0; i <= wallSegments; i++) {
                const t = i / wallSegments;
                const x = (t - 0.5) * size;
                const y = getHeightAt(x, halfSize);
                
                frontPositions.push(x, y, halfSize);
                frontPositions.push(x, -boxDepth, halfSize);
                frontUVs.push(t, 0, t, 1);
            }
            
            for (let i = 0; i < wallSegments; i++) {
                const base = i * 2;
                frontIndices.push(base, base + 1, base + 2);
                frontIndices.push(base + 2, base + 1, base + 3);
            }
            
            BABYLON.VertexData.ComputeNormals(frontPositions, frontIndices, frontNormals);
            const frontVertexData = new BABYLON.VertexData();
            frontVertexData.positions = frontPositions;
            frontVertexData.indices = frontIndices;
            frontVertexData.uvs = frontUVs;
            frontVertexData.normals = frontNormals;
            frontVertexData.applyToMesh(frontWall);
            frontWall.material = wallMaterial;
            frontWall.receiveShadows = true;
            
            // Back wall (Z-)
            const backWall = new BABYLON.Mesh("backWall", scene);
            const backPositions = [];
            const backIndices = [];
            const backUVs = [];
            const backNormals = [];
            
            for (let i = 0; i <= wallSegments; i++) {
                const t = i / wallSegments;
                const x = (t - 0.5) * size;
                const y = getHeightAt(x, -halfSize);
                
                backPositions.push(x, -boxDepth, -halfSize);
                backPositions.push(x, y, -halfSize);
                backUVs.push(t, 1, t, 0);
            }
            
            for (let i = 0; i < wallSegments; i++) {
                const base = i * 2;
                backIndices.push(base, base + 1, base + 2);
                backIndices.push(base + 2, base + 1, base + 3);
            }
            
            BABYLON.VertexData.ComputeNormals(backPositions, backIndices, backNormals);
            const backVertexData = new BABYLON.VertexData();
            backVertexData.positions = backPositions;
            backVertexData.indices = backIndices;
            backVertexData.uvs = backUVs;
            backVertexData.normals = backNormals;
            backVertexData.applyToMesh(backWall);
            backWall.material = wallMaterial;
            backWall.receiveShadows = true;
            
            // Left wall (X-)
            const leftWall = new BABYLON.Mesh("leftWall", scene);
            const leftPositions = [];
            const leftIndices = [];
            const leftUVs = [];
            const leftNormals = [];
            
            for (let i = 0; i <= wallSegments; i++) {
                const t = i / wallSegments;
                const z = (t - 0.5) * size;
                const y = getHeightAt(-halfSize, z);
                
                leftPositions.push(-halfSize, -boxDepth, z);
                leftPositions.push(-halfSize, y, z);
                leftUVs.push(t, 1, t, 0);
            }
            
            for (let i = 0; i < wallSegments; i++) {
                const base = i * 2;
                leftIndices.push(base, base + 1, base + 2);
                leftIndices.push(base + 2, base + 1, base + 3);
            }
            
            BABYLON.VertexData.ComputeNormals(leftPositions, leftIndices, leftNormals);
            const leftVertexData = new BABYLON.VertexData();
            leftVertexData.positions = leftPositions;
            leftVertexData.indices = leftIndices;
            leftVertexData.uvs = leftUVs;
            leftVertexData.normals = leftNormals;
            leftVertexData.applyToMesh(leftWall);
            leftWall.material = wallMaterial;
            leftWall.receiveShadows = true;
            
            // Right wall (X+)
            const rightWall = new BABYLON.Mesh("rightWall", scene);
            const rightPositions = [];
            const rightIndices = [];
            const rightUVs = [];
            const rightNormals = [];
            
            for (let i = 0; i <= wallSegments; i++) {
                const t = i / wallSegments;
                const z = (t - 0.5) * size;
                const y = getHeightAt(halfSize, z);
                
                rightPositions.push(halfSize, y, z);
                rightPositions.push(halfSize, -boxDepth, z);
                rightUVs.push(t, 0, t, 1);
            }
            
            for (let i = 0; i < wallSegments; i++) {
                const base = i * 2;
                rightIndices.push(base, base + 1, base + 2);
                rightIndices.push(base + 2, base + 1, base + 3);
            }
            
            BABYLON.VertexData.ComputeNormals(rightPositions, rightIndices, rightNormals);
            const rightVertexData = new BABYLON.VertexData();
            rightVertexData.positions = rightPositions;
            rightVertexData.indices = rightIndices;
            rightVertexData.uvs = rightUVs;
            rightVertexData.normals = rightNormals;
            rightVertexData.applyToMesh(rightWall);
            rightWall.material = wallMaterial;
            rightWall.receiveShadows = true;
            
            // Bottom
            const bottom = BABYLON.MeshBuilder.CreateGround("bottom", {
                width: size,
                height: size
            }, scene);
            bottom.position.y = -boxDepth;
            bottom.material = bottomMaterial;
            bottom.receiveShadows = true;

            updateProgress(90);

            // Create peak markers
            peaks.forEach((peak, index) => {
                const worldX = (peak.x - 0.5) * size;
                const worldZ = (peak.y - 0.5) * size;
                const worldY = peak.height * heightScale;
                
                // Marker sphere
                const marker = BABYLON.MeshBuilder.CreateSphere("marker" + index, {
                    diameter: 2,
                    segments: 16
                }, scene);
                marker.position = new BABYLON.Vector3(worldX, worldY + 1.5, worldZ);
                
                const markerMat = new BABYLON.StandardMaterial("markerMat" + index, scene);
                markerMat.diffuseColor = peak.color;
                markerMat.emissiveColor = peak.color.scale(0.5);
                markerMat.specularColor = new BABYLON.Color3(1, 1, 1);
                marker.material = markerMat;
                
                // Vertical line
                const linePoints = [
                    new BABYLON.Vector3(worldX, worldY, worldZ),
                    new BABYLON.Vector3(worldX, worldY + 3, worldZ)
                ];
                const line = BABYLON.MeshBuilder.CreateLines("line" + index, {
                    points: linePoints
                }, scene);
                line.color = peak.color;
                
                // Billboard text label
                const labelPlane = BABYLON.MeshBuilder.CreatePlane("label" + index, {
                    width: 15,
                    height: 5
                }, scene);
                labelPlane.position = new BABYLON.Vector3(worldX, worldY + 6, worldZ);
                labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                
                const labelTexture = new BABYLON.DynamicTexture("labelTex" + index, {
                    width: 512,
                    height: 170
                }, scene);
                const labelCtx = labelTexture.getContext();
                
                // Draw label background
                labelCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                labelCtx.roundRect(0, 0, 512, 170, 20);
                labelCtx.fill();
                
                // Draw border
                labelCtx.strokeStyle = `rgb(${Math.floor(peak.color.r * 255)}, ${Math.floor(peak.color.g * 255)}, ${Math.floor(peak.color.b * 255)})`;
                labelCtx.lineWidth = 4;
                labelCtx.roundRect(0, 0, 512, 170, 20);
                labelCtx.stroke();
                
                // Draw text
                labelCtx.fillStyle = 'white';
                labelCtx.font = 'bold 48px Arial';
                labelCtx.textAlign = 'center';
                labelCtx.fillText(peak.name, 256, 70);
                
                labelCtx.fillStyle = `rgb(${Math.floor(peak.color.r * 255)}, ${Math.floor(peak.color.g * 255)}, ${Math.floor(peak.color.b * 255)})`;
                labelCtx.font = 'bold 36px Arial';
                labelCtx.fillText(`${peak.realHeight}m`, 256, 130);
                
                labelTexture.update();
                
                const labelMat = new BABYLON.StandardMaterial("labelMat" + index, scene);
                labelMat.diffuseTexture = labelTexture;
                labelMat.emissiveTexture = labelTexture;
                labelMat.backFaceCulling = false;
                labelMat.useAlphaFromDiffuseTexture = true;
                labelPlane.material = labelMat;
                
                // Add to shadow caster
                shadowGenerator.addShadowCaster(marker);
            });

            updateProgress(100);

            // Add ground plane for shadows
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {
                width: 200,
                height: 200
            }, scene);
            ground.position.y = -boxDepth - 0.1;
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseColor = new BABYLON.Color3(0.12, 0.12, 0.15);
            groundMat.specularColor = new BABYLON.Color3(0, 0, 0);
            ground.material = groundMat;
            ground.receiveShadows = true;

            // Fog for atmosphere
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.003;
            scene.fogColor = new BABYLON.Color3(0.2, 0.25, 0.35);

            // Keyboard controls
            scene.onKeyboardObservable.add((kbInfo) => {
                const moveSpeed = 1;
                if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
                    switch (kbInfo.event.code) {
                        case 'KeyW':
                            camera.target.z -= moveSpeed;
                            break;
                        case 'KeyS':
                            camera.target.z += moveSpeed;
                            break;
                        case 'KeyA':
                            camera.target.x -= moveSpeed;
                            break;
                        case 'KeyD':
                            camera.target.x += moveSpeed;
                            break;
                    }
                }
            });

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hidden');
            }, 500);

            // Render loop
            engine.runRenderLoop(() => {
                scene.render();
            });

            window.addEventListener('resize', () => {
                engine.resize();
            });

            return scene;
        }

        function updateProgress(percent) {
            document.getElementById('progressFill').style.width = percent + '%';
        }

        // Polyfill for roundRect if not available
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // Start
        createScene();
    </script>
</body>
</html>
