<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo 3D Diorama Map</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js GUI for Billboard Text -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <!-- Babylon.js Materials (Optional, but good for realism) -->
    <script src="https://cdn.babylonjs.com/materialsLibrary/babylonjs.materials.min.js"></script>
</head>
<body>

    <canvas id="renderCanvas"></canvas>
    <div id="loading">Loading Diorama...<br><small>(Ensure local server is running for textures)</small></div>
    <div id="instructions">Left Click: Rotate | Right Click: Pan | Scroll: Zoom</div>

    <script>
        // --- Configuration ---
        const TERRAIN_WIDTH = 150;
        const TERRAIN_DEPTH = 150;
        const MIN_HEIGHT = 0;
        const MAX_HEIGHT = 35;
        const PEDESTAL_DEPTH = 18; // How far down the box goes
        const SUBDIVISIONS = 256;  // Terrain mesh resolution

        // Image paths (Must be served from a local web server due to CORS)
        const HEIGHTMAP_URL = "Osogovo Height Map (Merged).png";
        const TEXTURE_URL = "Osogovo_map.jpg";

        // --- Babylon.js Setup ---
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
        
        const createScene = function() {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.8, 0.9, 1.0, 1.0); // Sky blue
            
            // Camera (Orbit Control)
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 2, Math.PI / 3, 120, new BABYLON.Vector3(0, 10, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 30;
            camera.upperRadiusLimit = 300;
            camera.wheelPrecision = 5;
            camera.panningSensibility = 50;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.3, 0.3, 0.4);

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -2, 1), scene);
            dirLight.position = new BABYLON.Vector3(50, 100, -50);
            dirLight.intensity = 1.2;

            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;

            // --- Terrain Material ---
            const terrainMat = new BABYLON.StandardMaterial("terrainMat", scene);
            terrainMat.diffuseTexture = new BABYLON.Texture(TEXTURE_URL, scene);
            terrainMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1); // Slightly matte

            // --- Terrain Mesh ---
            const ground = BABYLON.MeshBuilder.CreateGroundFromHeightMap("terrain", HEIGHTMAP_URL, {
                width: TERRAIN_WIDTH,
                height: TERRAIN_DEPTH,
                subdivisions: SUBDIVISIONS,
                minHeight: MIN_HEIGHT,
                maxHeight: MAX_HEIGHT
            }, scene);
            
            ground.material = terrainMat;
            ground.receiveShadows = true;
            ground.position.y = 0; // Ensure it sits at y=0

            shadowGenerator.addShadowCaster(ground); // Terrain casts shadows on itself/pedestal

            // --- Diorama Pedestal Box ---
            // Create a box that represents the earth beneath the terrain
            const pedestal = BABYLON.MeshBuilder.CreateBox("pedestal", {
                width: TERRAIN_WIDTH + 0.5, // Slightly larger to hide seams
                depth: TERRAIN_DEPTH + 0.5,
                height: PEDESTAL_DEPTH
            }, scene);
            
            // Position it so its top face aligns with the bottom of the terrain (y=0)
            pedestal.position.y = -PEDESTAL_DEPTH / 2;

            // Create a layered "geological" material for the pedestal
            const pedestalMat = new BABYLON.StandardMaterial("pedestalMat", scene);
            const texSize = 512;
            const dynTex = new BABYLON.DynamicTexture("pedestalTex", texSize, scene);
            const ctx = dynTex.getContext();
            
            // Draw earth layers
            const layers = [
                { color: "#6b4423", width: 50 },  // Top soil
                { color: "#8b5a2b", width: 80 },  // Clay
                { color: "#a0522d", width: 100 }, // Rock
                { color: "#5c4033", width: 140 }, // Deep rock
                { color: "#4a3c2a", width: 142 }  // Bedrock
            ];
            
            let currentY = 0;
            layers.forEach(layer => {
                ctx.fillStyle = layer.color;
                ctx.fillRect(0, currentY, texSize, layer.width);
                currentY += layer.width;
            });
            
            dynTex.draw();
            pedestalMat.diffuseTexture = dynTex;
            pedestalMat.specularColor = BABYLON.Color3.Black(); // Matte earth
            pedestal.material = pedestalMat;
            pedestal.receiveShadows = true;

            // --- Find Peaks & Place Markers ---
            // We must parse the heightmap image to find the highest points dynamically
            const img = new Image();
            img.crossOrigin = "Anonymous"; // Needed if running from some servers
            img.onload = function() {
                const offCanvas = document.createElement('canvas');
                offCanvas.width = img.width;
                offCanvas.height = img.height;
                const offCtx = offCanvas.getContext('2d');
                offCtx.drawImage(img, 0, 0);
                const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
                
                let points = [];
                // Sample image (don't check every pixel for performance on large images)
                const step = 2; 
                for (let y = 0; y < offCanvas.height; y += step) {
                    for (let x = 0; x < offCanvas.width; x += step) {
                        const i = (y * offCanvas.width + x) * 4;
                        // Calculate height based on RGB average (standard for generic heightmaps)
                        const h = (imageData.data[i] + imageData.data[i+1] + imageData.data[i+2]) / 3;
                        points.push({ x, y, h });
                    }
                }

                // Sort by height descending
                points.sort((a, b) => b.h - a.h);

                // Find top 3 peaks ensuring they are spread out
                const peaks = [];
                const minDistance = offCanvas.width / 5; // Minimum distance between markers
                
                for (let p of points) {
                    if (peaks.length >= 3) break;
                    
                    let isFarEnough = true;
                    for (let peak of peaks) {
                        const dx = p.x - peak.x;
                        const dy = p.y - peak.y;
                        if (Math.sqrt(dx*dx + dy*dy) < minDistance) {
                            isFarEnough = false;
                            break;
                        }
                    }

                    if (isFarEnough) {
                        peaks.push(p);
                    }
                }

                // Create Markers and Labels
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                const peakNames = ["Peak 1", "Peak 2", "Peak 3"];

                peaks.forEach((p, index) => {
                    // Map 2D image coords to 3D World coords
                    const xNorm = p.x / offCanvas.width;
                    const zNorm = p.y / offCanvas.height;

                    const worldX = (xNorm - 0.5) * TERRAIN_WIDTH;
                    const worldZ = (zNorm - 0.5) * TERRAIN_DEPTH;
                    const worldY = MIN_HEIGHT + (p.h / 255) * (MAX_HEIGHT - MIN_HEIGHT);

                    // Marker Sphere
                    const sphere = BABYLON.MeshBuilder.CreateSphere("marker" + index, {diameter: 2, segments: 16}, scene);
                    sphere.position = new BABYLON.Vector3(worldX, worldY + 1.5, worldZ); // Slightly above terrain
                    
                    const sphereMat = new BABYLON.StandardMaterial("markerMat" + index, scene);
                    sphereMat.diffuseColor = new BABYLON.Color3(1, 0.2, 0.2); // Red marker
                    sphereMat.emissiveColor = new BABYLON.Color3(0.5, 0.1, 0.1);
                    sphereMat.specularColor = new BABYLON.Color3(1, 1, 1);
                    sphere.material = sphereMat;
                    shadowGenerator.addShadowCaster(sphere);

                    // Billboard Label
                    const rect = new BABYLON.GUI.Rectangle("label" + index);
                    rect.width = "120px";
                    rect.height = "40px";
                    rect.cornerRadius = 8;
                    rect.color = "White";
                    rect.thickness = 2;
                    rect.background = "rgba(0, 0, 0, 0.6)";
                    advancedTexture.addControl(rect);
                    
                    // Link UI to mesh with an offset so it floats above
                    rect.linkWithMesh(sphere); 
                    rect.linkOffsetY = -40; // Move label up above the sphere

                    const text = new BABYLON.GUI.TextBlock();
                    text.text = `${peakNames[index]}\nAlt: ${Math.round(worldY)}m`;
                    text.color = "White";
                    text.fontSize = 14;
                    text.textVerticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_CENTER;
                    rect.addControl(text);
                });

                // Hide loading text
                document.getElementById("loading").style.display = "none";
            };
            
            img.onerror = function() {
                document.getElementById("loading").innerText = "Error loading heightmap image.\nPlease ensure the file exists and you are running a local web server.";
            };
            
            img.src = HEIGHTMAP_URL;

            return scene;
        };

        const scene = createScene();

        engine.runRenderLoop(function () {
            scene.render();
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
