<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Osogovo Terrain Diorama — Babylon.js (Single‑File)</title>
<style>
  html,body{height:100%}
  body{margin:0;background:#0a1022;color:#e8f0ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  #game{position:fixed;inset:0}
  .hud{position:fixed;left:12px;top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:10}
  .panel{background:rgba(10,18,40,.68);border:1px solid #21335d;border-radius:12px;padding:8px 10px;backdrop-filter:blur(3px)}
  .muted{color:#9fb3d9;font-size:12px}
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud panel">
    <div><b>Osogovo 3D Terrain (Diorama)</b></div>
    <div class="muted">Orbit: mouse drag • Zoom: wheel • Pan: Shift+drag</div>
  </div>

  <!-- Babylon.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@6.39.0/babylon.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@6.39.0/babylonjs.loaders.min.js"></script>

  <script>
  (()=>{
    // -------------------------------------------------------
    // Files (put these images next to this HTML file)
    // -------------------------------------------------------
    const HEIGHTMAP_FILE = "Osogovo Height Map (Merged).png"; // grayscale height map
    const DIFFUSE_FILE   = "Osogovo_map.jpg";                  // color texture
    const HM_URL = encodeURI(HEIGHTMAP_FILE);
    const DIFF_URL = encodeURI(DIFFUSE_FILE);

    // -------------------------------------------------------
    // Engine & Scene
    // -------------------------------------------------------
    const canvas = document.getElementById('game');
    const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer:true, stencil:true, antialias:true });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.04,0.07,0.15,1);

    // Subtle post FX
    const pipeline = new BABYLON.DefaultRenderingPipeline('pipe', true, scene, null);
    pipeline.fxaaEnabled = true; pipeline.samples = 2; pipeline.bloomEnabled = true; pipeline.bloomThreshold=0.8; pipeline.bloomWeight=0.15; pipeline.bloomKernel=24;

    // Camera
    const cam = new BABYLON.ArcRotateCamera('cam', -Math.PI/2, Math.PI/3, 300, new BABYLON.Vector3(0,40,0), scene);
    cam.lowerRadiusLimit = 120; cam.upperRadiusLimit = 600; cam.panningSensibility = 600; cam.attachControl(canvas, true);

    // Lighting
    const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.7,-1,-0.6), scene); sun.position = new BABYLON.Vector3(300,400,200); sun.intensity=1.2;
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0,1,0), scene); hemi.intensity=0.55;
    const shadows = new BABYLON.ShadowGenerator(2048, sun); shadows.usePercentageCloserFiltering = true;

    // Fog for depth
    scene.fogMode = BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity = 0.0026; scene.fogColor = new BABYLON.Color3(0.05,0.09,0.18);

    // -------------------------------------------------------
    // Create Terrain from height map
    // -------------------------------------------------------
    const WIDTH = 400;     // world units (x extent)
    const DEPTH = 400;     // world units (z extent)
    const SUBDIV = 256;    // mesh subdivisions (higher = more detail)
    const MIN_Y = 0;       // min elevation
    const MAX_Y = 120;     // max elevation (scale to taste)

    // Material using the provided diffuse texture
    const terrainMat = new BABYLON.StandardMaterial('terrainMat', scene);
    terrainMat.diffuseTexture = new BABYLON.Texture(DIFF_URL, scene);
    terrainMat.diffuseTexture.wrapU = terrainMat.diffuseTexture.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
    terrainMat.specularColor = new BABYLON.Color3(0.05,0.05,0.05);

    // Pedestal material
    const pedestalMat = new BABYLON.StandardMaterial('pedestalMat', scene);
    pedestalMat.diffuseColor = new BABYLON.Color3(0.16,0.2,0.28);
    pedestalMat.specularColor = new BABYLON.Color3(0.05,0.05,0.05);

    // Build height-mapped ground (async ready)
    const ground = BABYLON.Mesh.CreateGroundFromHeightMap('terrain', HM_URL, WIDTH, DEPTH, SUBDIV, MIN_Y, MAX_Y, scene, false, () => {
      ground.material = terrainMat;
      ground.receiveShadows = true;

      // Once vertices are ready, add pedestal walls and bottom
      addPedestalFor(ground);

      // Place three peak markers with labels
      placePeakMarkers(ground, 3);

      // Focus camera
      cam.setTarget(new BABYLON.Vector3(0, (MIN_Y+MAX_Y)*0.35, 0));
    });

    // -------------------------------------------------------
    // Pedestal (walls + bottom) using terrain edges
    // -------------------------------------------------------
    function addPedestalFor(ground){
      const pos = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const n = Math.sqrt(pos.length/3); // vertex grid is (SUBDIV+1)^2
      const N = (SUBDIV+1);
      if(n !== N){ /* fallback if layout differs */ }

      // Helper to get Vector3 at (row, col)
      const P = (r,c)=>{ const idx = (r*N + c)*3; return new BABYLON.Vector3(pos[idx], pos[idx+1], pos[idx+2]); };

      // Build ordered edge loops (top row, right col, bottom row, left col)
      const topEdge=[], rightEdge=[], bottomEdge=[], leftEdge=[];
      for(let c=0;c<N;c++) topEdge.push(P(0,c));
      for(let r=0;r<N;r++) rightEdge.push(P(r,N-1));
      for(let c=N-1;c>=0;c--) bottomEdge.push(P(N-1,c));
      for(let r=N-1;r>=0;r--) leftEdge.push(P(r,0));

      // Determine pedestal depth and bottom Y
      const edgeYs = [...topEdge,rightEdge,bottomEdge,leftEdge].map(v=>v.y);
      const minEdgeY = Math.min.apply(null, edgeYs);
      const bottomY = minEdgeY - 40; // 40 units below lowest edge

      // Create wall ribbons (upper edge loop → lowered copy at bottomY)
      const makeWall = (edge)=>{
        const upper = edge; const lower = edge.map(v=> new BABYLON.Vector3(v.x, bottomY, v.z));
        const wall = BABYLON.MeshBuilder.CreateRibbon('wall', { pathArray:[upper,lower], closeArray:false, closePath:false, sideOrientation:BABYLON.Mesh.DOUBLESIDE }, scene);
        wall.material = pedestalMat; wall.receiveShadows = true; shadows.addShadowCaster(wall);
        return wall;
      };
      [topEdge,rightEdge,bottomEdge,leftEdge].forEach(makeWall);

      // Bottom lid (flat rectangle)
      const bottom = BABYLON.MeshBuilder.CreateGround('bottom', {width:WIDTH, height:DEPTH, subdivisions:1}, scene);
      bottom.position.y = bottomY - 0.02; bottom.material = pedestalMat; bottom.receiveShadows = true;
    }

    // -------------------------------------------------------
    // Peak markers with billboard labels
    // -------------------------------------------------------
    function placePeakMarkers(ground, count){
      const pos = ground.getVerticesData(BABYLON.VertexBuffer.PositionKind);
      const verts = [];
      for(let i=0;i<pos.length;i+=3){ verts.push({ x:pos[i], y:pos[i+1], z:pos[i+2] }); }
      verts.sort((a,b)=> b.y - a.y); // highest first

      const chosen=[]; const minDist=24; // keep markers apart
      for(const v of verts){
        let ok=true; for(const c of chosen){ const dx=v.x-c.x, dz=v.z-c.z; if(dx*dx+dz*dz < minDist*minDist){ ok=false; break; } }
        if(ok){ chosen.push(v); if(chosen.length>=count) break; }
      }

      chosen.forEach((p,i)=> createMarker(`Peak ${i+1}\nH: ${p.y.toFixed(0)} u`, new BABYLON.Vector3(p.x, p.y, p.z)));
    }

    function createMarker(text, position){
      // Pin
      const pin = BABYLON.MeshBuilder.CreateCylinder('pin',{diameterTop:0, diameterBottom:1.2, height:4, tessellation:6}, scene);
      pin.position = position.add(new BABYLON.Vector3(0,2.2,0));
      const pm = new BABYLON.StandardMaterial('pinm', scene); pm.diffuseColor = new BABYLON.Color3(1,0.75,0.2); pm.emissiveColor = new BABYLON.Color3(0.15,0.1,0); pin.material = pm; shadows.addShadowCaster(pin);

      // Billboard label using DynamicTexture
      const plane = BABYLON.MeshBuilder.CreatePlane('label', {size:14}, scene); // square plane
      plane.position = pin.position.add(new BABYLON.Vector3(0,5,0));
      plane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
      const dt = new BABYLON.DynamicTexture('dt', {width:512, height:256}, scene, false);
      const ctx = dt.getContext();
      ctx.fillStyle = 'rgba(10,18,40,0.7)'; ctx.fillRect(0,0,512,256);
      ctx.strokeStyle = 'rgba(160,190,255,0.6)'; ctx.lineWidth = 6; ctx.strokeRect(6,6,500,244);
      ctx.fillStyle = '#e8f0ff'; ctx.font = 'bold 44px system-ui, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const lines = text.split('\n');
      lines.forEach((ln,idx)=> ctx.fillText(ln, 256, 110 + idx*66));
      dt.update();
      const tm = new BABYLON.StandardMaterial('tm', scene); tm.diffuseTexture = dt; tm.emissiveColor = new BABYLON.Color3(0.6,0.7,0.9).scale(0.1); tm.opacityTexture = dt; tm.backFaceCulling = false; plane.material = tm;
    }

    // -------------------------------------------------------
    // Render
    // -------------------------------------------------------
    engine.runRenderLoop(()=> scene.render());
    window.addEventListener('resize', ()=> engine.resize());
  })();
  </script>
</body>
</html>
