<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo 3D Terrain Diorama</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 8px;
        }
        #ui-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 300px;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #4db8ff; }
        p { margin: 5px 0; font-size: 0.9rem; line-height: 1.4; }
        .highlight { color: #ffeb3b; font-weight: bold; }
    </style>
    <!-- Babylon.js Core -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <!-- Babylon.js GUI -->
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="loading">Loading Terrain Data...</div>

    <div id="ui-info">
        <h1>Osogovo Mountain Range</h1>
        <p>Interactive 3D Diorama</p>
        <p>• <strong>Left Click:</strong> Rotate</p>
        <p>• <strong>Right Click:</strong> Pan</p>
        <p>• <strong>Scroll:</strong> Zoom</p>
        <p style="margin-top:10px; font-size: 0.8rem; color: #aaa;">
            Note: This demo uses placeholder textures. To use your local files, edit the <span class="highlight">CONFIG</span> object in the script.
        </p>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        // --- CONFIGURATION ---
        // To use your local files, replace the URLs below with your file paths 
        // (e.g., "./Osogovo_map.jpg" and "./Osogovo Height Map (Merged).png")
        const CONFIG = {
            // Using Babylon.js playground assets as placeholders for immediate visualization
            diffuseTexture: "https://www.babylonjs-playground.com/textures/mountain.png", 
            heightMap: "https://www.babylonjs-playground.com/textures/mountain.png",
            
            terrainWidth: 100,
            terrainDepth: 100,
            maxHeight: 25,
            subdivisions: 128, // Higher = more detail but slower
            wallHeight: 15,    // How deep the diorama box goes
            wallColor: new BABYLON.Color3(0.2, 0.2, 0.25)
        };

        // Peak locations (Normalized -1 to 1 range roughly, will be snapped to terrain)
        // These are estimates for a generic mountain map. 
        const PEAKS = [
            { name: "Carev Vrv", x: -20, z: -20 },
            { name: "Ruen Peak", x: 25, z: 15 },
            { name: "Ilijin Vrv", x: -10, z: 25 }
        ];

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.15, 1.0);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
            scene.fogDensity = 0.005;
            scene.fogColor = new BABYLON.Color3(0.1, 0.1, 0.15);

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3, 120, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 40;
            camera.upperRadiusLimit = 200;
            camera.wheelPrecision = 50;

            // Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.4;
            hemiLight.groundColor = new BABYLON.Color3(0.1, 0.1, 0.1);

            const dirLight = new BABYLON.DirectionalLight("dir", new BABYLON.Vector3(-1, -2, -1), scene);
            dirLight.intensity = 0.8;
            dirLight.position = new BABYLON.Vector3(50, 100, 50);
            
            // Shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(1024, dirLight);
            shadowGenerator.useBlurExponentialShadowMap = true;

            // --- 1. Create Terrain ---
            const terrain = BABYLON.MeshBuilder.CreateGroundFromHeightMap("terrain", CONFIG.heightMap, {
                width: CONFIG.terrainWidth,
                depth: CONFIG.terrainDepth,
                height: CONFIG.maxHeight,
                subdivisions: CONFIG.subdivisions,
                minHeight: 0
            }, scene);

            // Apply Diffuse Texture
            const terrainMat = new BABYLON.StandardMaterial("terrainMat", scene);
            terrainMat.diffuseTexture = new BABYLON.Texture(CONFIG.diffuseTexture, scene);
            terrainMat.diffuseTexture.uScale = 4;
            terrainMat.diffuseTexture.vScale = 4;
            terrainMat.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            terrain.material = terrainMat;
            terrain.receiveShadows = true;

            // --- 2. Create Diorama Box (Walls + Floor) ---
            // We create a box slightly larger than the terrain and push it down
            const boxSize = CONFIG.terrainWidth + 2; // Slight overhang
            const dioramaBox = BABYLON.MeshBuilder.CreateBox("dioramaBox", {
                width: boxSize,
                height: CONFIG.wallHeight,
                depth: boxSize
            }, scene);
            
            // Position it so the top face is just below the terrain (y=0)
            dioramaBox.position.y = -CONFIG.wallHeight / 2;

            const boxMat = new BABYLON.StandardMaterial("boxMat", scene);
            boxMat.diffuseColor = CONFIG.wallColor;
            boxMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);
            // Make it look like stone/concrete
            boxMat.backFaceCulling = false; // See inside if camera goes in
            dioramaBox.material = boxMat;

            // --- 3. Add Markers & Labels ---
            const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

            PEAKS.forEach(peak => {
                // 1. Calculate Height at this coordinate
                // getHeightAtCoordinates takes world X and Z
                const yHeight = terrain.getHeightAtCoordinates(peak.x, peak.z);
                
                // 2. Create Marker Pin
                const pin = BABYLON.MeshBuilder.CreateSphere("pin", {diameter: 1.5}, scene);
                pin.position.set(peak.x, yHeight + 1, peak.z); // Float slightly above ground
                
                const pinMat = new BABYLON.StandardMaterial("pinMat", scene);
                pinMat.emissiveColor = new BABYLON.Color3(1, 0.2, 0.2); // Bright Red
                pinMat.disableLighting = true;
                pin.material = pinMat;

                // Add a little stick
                const stick = BABYLON.MeshBuilder.CreateCylinder("stick", {height: 2, diameter: 0.1}, scene);
                stick.position.set(0, -1, 0);
                stick.parent = pin;
                stick.material = pinMat;

                // 3. Create Label (GUI)
                const rect = new BABYLON.GUI.Rectangle();
                rect.width = "140px";
                rect.height = "40px";
                rect.cornerRadius = 5;
                rect.color = "#4db8ff";
                rect.thickness = 2;
                rect.background = "rgba(0, 0, 0, 0.7)";
                rect.alpha = 0.9;
                
                // Important: Make label ignore pointer events so we can rotate camera behind it
                rect.isHitTestVisible = false; 

                const text = new BABYLON.GUI.TextBlock();
                text.text = peak.name;
                text.color = "white";
                text.fontSize = 16;
                text.fontWeight = "bold";
                rect.addControl(text);

                advancedTexture.addControl(rect);
                
                // Link label to the pin mesh so it follows it (Billboard effect)
                rect.linkWithMesh(pin);
                rect.top = "-40px"; // Offset above pin

                // Add pin to shadow generator
                shadowGenerator.addShadowCaster(pin);
            });

            // Hide loading screen
            document.getElementById('loading').style.display = 'none';

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
