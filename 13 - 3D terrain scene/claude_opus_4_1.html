<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo Mountain - 3D Terrain Map</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }

        #renderCanvas {
            width: 100%;
            height: 100vh;
            touch-action: none;
        }

        .info-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            max-width: 320px;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .info-panel h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-panel h2::before {
            content: "🏔️";
            font-size: 28px;
        }

        .info-item {
            margin: 12px 0;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            align-items: center;
        }

        .control-key {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-screen h1 {
            color: white;
            font-size: 32px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
        }

        .loading-bar {
            width: 300px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 15px;
            font-size: 14px;
        }

        .peak-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            display: none;
            backdrop-filter: blur(10px);
        }

        .peak-info.show {
            display: block;
        }

        .peak-name {
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }

        .peak-elevation {
            color: #667eea;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div class="info-panel">
        <h2>Osogovo Mountain</h2>
        <div class="info-item">
            <strong>Location:</strong> Border between North Macedonia and Bulgaria
        </div>
        <div class="info-item">
            <strong>Highest Peak:</strong> Ruen (2,251 m)
        </div>
        <div class="info-item">
            Interactive 3D terrain model with marked peaks
        </div>
        <div class="controls">
            <div class="control-item">
                <span>Rotate View</span>
                <span class="control-key">Left Mouse</span>
            </div>
            <div class="control-item">
                <span>Zoom</span>
                <span class="control-key">Scroll</span>
            </div>
            <div class="control-item">
                <span>Pan</span>
                <span class="control-key">Right Mouse</span>
            </div>
        </div>
    </div>

    <div class="loading-screen" id="loadingScreen">
        <h1>Loading Terrain Data</h1>
        <div class="loading-bar">
            <div class="loading-progress" id="loadingProgress"></div>
        </div>
        <div class="loading-text" id="loadingText">Initializing...</div>
    </div>

    <div class="peak-info" id="peakInfo">
        <div class="peak-name" id="peakName"></div>
        <div class="peak-elevation" id="peakElevation"></div>
    </div>

    <script>
        let scene, engine, camera;
        let terrain, terrainMaterial;
        let peakMarkers = [];
        let boxWalls = [];

        // Configuration
        const TERRAIN_SIZE = 100;
        const TERRAIN_MAX_HEIGHT = 20;
        const TERRAIN_SUBDIVISION = 200;
        const BOX_DEPTH = 10;

        // Peak data (these would be actual coordinates on the Osogovo mountain)
        const PEAKS = [
            { name: "Ruen Peak", elevation: "2,251 m", relativeX: 0.7, relativeZ: 0.3 },
            { name: "Carev Vrv", elevation: "2,085 m", relativeX: 0.4, relativeZ: 0.6 },
            { name: "Kitka", elevation: "1,978 m", relativeX: 0.25, relativeZ: 0.35 }
        ];

        // Initialize Babylon.js
        async function initBabylon() {
            const canvas = document.getElementById('renderCanvas');
            engine = new BABYLON.Engine(canvas, true, {
                preserveDrawingBuffer: true,
                stencil: true,
                antialias: true
            });
            
            scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0.12, 0.24, 0.45);
            
            // Enable fog for atmospheric effect
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.005;
            scene.fogColor = new BABYLON.Color3(0.7, 0.8, 0.9);
            
            createCamera();
            createLighting();
            
            // Load and create terrain
            await createTerrainFromHeightMap();
            
            // Create box/pedestal effect
            createBoxWalls();
            
            // Add peak markers
            createPeakMarkers();
            
            // Hide loading screen
            hideLoadingScreen();
            
            // Optimize scene
            scene.registerBeforeRender(() => {
                // Update billboard text to face camera
                peakMarkers.forEach(marker => {
                    if (marker.label) {
                        marker.label.lookAt(camera.position);
                    }
                });
            });
            
            // Start render loop
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // Handle resize
            window.addEventListener('resize', () => {
                engine.resize();
            });
        }

        // Create camera
        function createCamera() {
            camera = new BABYLON.ArcRotateCamera('camera', 
                -Math.PI / 2, Math.PI / 3, 150, 
                new BABYLON.Vector3(0, 0, 0), scene);
            
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 50;
            camera.upperRadiusLimit = 300;
            camera.lowerBetaLimit = 0.1;
            camera.upperBetaLimit = Math.PI / 2.2;
            camera.wheelPrecision = 50;
            
            // Smooth camera movement
            camera.inertia = 0.7;
            camera.speed = 0.5;
            camera.angularSensibilityX = 1000;
            camera.angularSensibilityY = 1000;
            camera.panningSensibility = 100;
            camera.useNaturalPinchZoom = true;
        }

        // Create lighting
        function createLighting() {
            // Main hemispheric light
            const hemiLight = new BABYLON.HemisphericLight('hemiLight',
                new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.7;
            hemiLight.diffuse = new BABYLON.Color3(1, 0.98, 0.95);
            hemiLight.specular = new BABYLON.Color3(0.5, 0.5, 0.5);
            hemiLight.groundColor = new BABYLON.Color3(0.3, 0.3, 0.4);
            
            // Directional light (sun)
            const sunLight = new BABYLON.DirectionalLight('sunLight',
                new BABYLON.Vector3(-0.5, -1, -0.5), scene);
            sunLight.intensity = 0.8;
            sunLight.diffuse = new BABYLON.Color3(1, 0.95, 0.8);
            sunLight.specular = new BABYLON.Color3(0.7, 0.7, 0.6);
            
            // Create shadows
            const shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);
            shadowGenerator.useBlurExponentialShadowMap = true;
            shadowGenerator.blurKernel = 32;
            shadowGenerator.setDarkness(0.3);
            
            return shadowGenerator;
        }

        // Create terrain from height map
        async function createTerrainFromHeightMap() {
            updateLoadingText("Loading height map...");
            updateLoadingProgress(20);
            
            // Create terrain mesh
            terrain = BABYLON.MeshBuilder.CreateGroundFromHeightMap('terrain',
                'Osogovo Height Map (Merged).png', {
                    width: TERRAIN_SIZE,
                    height: TERRAIN_SIZE,
                    subdivisions: TERRAIN_SUBDIVISION,
                    maxHeight: TERRAIN_MAX_HEIGHT,
                    onReady: function() {
                        updateLoadingText("Terrain mesh created");
                        updateLoadingProgress(60);
                    }
                }, scene);
            
            // Create material
            terrainMaterial = new BABYLON.StandardMaterial('terrainMaterial', scene);
            
            // Load diffuse texture
            updateLoadingText("Loading terrain texture...");
            const diffuseTexture = new BABYLON.Texture('Osogovo_map.jpg', scene);
            diffuseTexture.onLoadObservable.add(() => {
                updateLoadingText("Texture loaded");
                updateLoadingProgress(80);
            });
            
            terrainMaterial.diffuseTexture = diffuseTexture;
            terrainMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            terrainMaterial.specularPower = 32;
            
            // Add detail normal map for better surface detail (procedural)
            const normalTexture = new BABYLON.DynamicTexture('normalTexture', 512, scene);
            const context = normalTexture.getContext();
            
            // Create a simple normal map pattern
            const imageData = context.createImageData(512, 512);
            for (let i = 0; i < imageData.data.length; i += 4) {
                imageData.data[i] = 128 + Math.random() * 20;     // R
                imageData.data[i + 1] = 128 + Math.random() * 20; // G
                imageData.data[i + 2] = 255;                       // B
                imageData.data[i + 3] = 255;                       // A
            }
            context.putImageData(imageData, 0, 0);
            normalTexture.update();
            
            terrainMaterial.bumpTexture = normalTexture;
            terrainMaterial.bumpTexture.level = 0.5;
            
            terrain.material = terrainMaterial;
            terrain.receiveShadows = true;
            
            // Position terrain at the top of the box
            terrain.position.y = BOX_DEPTH / 2;
            
            updateLoadingText("Terrain ready");
            updateLoadingProgress(100);
        }

        // Create box walls and bottom
        function createBoxWalls() {
            const boxMaterial = new BABYLON.StandardMaterial('boxMaterial', scene);
            boxMaterial.diffuseColor = new BABYLON.Color3(0.15, 0.12, 0.1);
            boxMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
            
            // Create walls
            const wallThickness = 2;
            
            // Front wall
            const frontWall = BABYLON.MeshBuilder.CreateBox('frontWall', {
                width: TERRAIN_SIZE + wallThickness * 2,
                height: BOX_DEPTH,
                depth: wallThickness
            }, scene);
            frontWall.position.z = TERRAIN_SIZE / 2 + wallThickness / 2;
            frontWall.position.y = 0;
            frontWall.material = boxMaterial;
            boxWalls.push(frontWall);
            
            // Back wall
            const backWall = BABYLON.MeshBuilder.CreateBox('backWall', {
                width: TERRAIN_SIZE + wallThickness * 2,
                height: BOX_DEPTH,
                depth: wallThickness
            }, scene);
            backWall.position.z = -TERRAIN_SIZE / 2 - wallThickness / 2;
            backWall.position.y = 0;
            backWall.material = boxMaterial;
            boxWalls.push(backWall);
            
            // Left wall
            const leftWall = BABYLON.MeshBuilder.CreateBox('leftWall', {
                width: wallThickness,
                height: BOX_DEPTH,
                depth: TERRAIN_SIZE
            }, scene);
            leftWall.position.x = -TERRAIN_SIZE / 2 - wallThickness / 2;
            leftWall.position.y = 0;
            leftWall.material = boxMaterial;
            boxWalls.push(leftWall);
            
            // Right wall
            const rightWall = BABYLON.MeshBuilder.CreateBox('rightWall', {
                width: wallThickness,
                height: BOX_DEPTH,
                depth: TERRAIN_SIZE
            }, scene);
            rightWall.position.x = TERRAIN_SIZE / 2 + wallThickness / 2;
            rightWall.position.y = 0;
            rightWall.material = boxMaterial;
            boxWalls.push(rightWall);
            
            // Bottom
            const bottom = BABYLON.MeshBuilder.CreateBox('bottom', {
                width: TERRAIN_SIZE + wallThickness * 2,
                height: wallThickness,
                depth: TERRAIN_SIZE + wallThickness * 2
            }, scene);
            bottom.position.y = -BOX_DEPTH / 2 - wallThickness / 2;
            bottom.material = boxMaterial;
            boxWalls.push(bottom);
            
            // Add decorative corner posts
            const postMaterial = new BABYLON.StandardMaterial('postMaterial', scene);
            postMaterial.diffuseColor = new BABYLON.Color3(0.2, 0.15, 0.1);
            postMaterial.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);
            postMaterial.specularPower = 64;
            
            const cornerPositions = [
                { x: TERRAIN_SIZE / 2, z: TERRAIN_SIZE / 2 },
                { x: -TERRAIN_SIZE / 2, z: TERRAIN_SIZE / 2 },
                { x: TERRAIN_SIZE / 2, z: -TERRAIN_SIZE / 2 },
                { x: -TERRAIN_SIZE / 2, z: -TERRAIN_SIZE / 2 }
            ];
            
            cornerPositions.forEach((pos, i) => {
                const post = BABYLON.MeshBuilder.CreateCylinder('post' + i, {
                    diameter: 3,
                    height: BOX_DEPTH + 2,
                    tessellation: 12
                }, scene);
                post.position.x = pos.x;
                post.position.z = pos.z;
                post.position.y = 0;
                post.material = postMaterial;
            });
        }

        // Create peak markers with labels
        function createPeakMarkers() {
            PEAKS.forEach((peak, index) => {
                // Create marker sphere
                const marker = BABYLON.MeshBuilder.CreateSphere('marker' + index, {
                    diameter: 2,
                    segments: 16
                }, scene);
                
                // Position on terrain (approximate - would need actual height data)
                const x = (peak.relativeX - 0.5) * TERRAIN_SIZE;
                const z = (peak.relativeZ - 0.5) * TERRAIN_SIZE;
                const y = BOX_DEPTH / 2 + TERRAIN_MAX_HEIGHT * 0.7 + index * 2; // Vary heights
                
                marker.position.set(x, y, z);
                
                // Create glowing material for marker
                const markerMaterial = new BABYLON.StandardMaterial('markerMat' + index, scene);
                markerMaterial.emissiveColor = new BABYLON.Color3(1, 0.3, 0.2);
                markerMaterial.diffuseColor = new BABYLON.Color3(1, 0, 0);
                markerMaterial.specularColor = new BABYLON.Color3(1, 1, 1);
                markerMaterial.specularPower = 64;
                marker.material = markerMaterial;
                
                // Create pole connecting marker to terrain
                const pole = BABYLON.MeshBuilder.CreateCylinder('pole' + index, {
                    diameter: 0.3,
                    height: y - BOX_DEPTH / 2,
                    tessellation: 8
                }, scene);
                pole.position.set(x, BOX_DEPTH / 2, z);
                
                const poleMaterial = new BABYLON.StandardMaterial('poleMat' + index, scene);
                poleMaterial.diffuseColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                poleMaterial.specularColor = new BABYLON.Color3(0.1, 0.1, 0.1);
                pole.material = poleMaterial;
                
                // Create billboard text label
                const labelPlane = BABYLON.MeshBuilder.CreatePlane('label' + index, {
                    width: 15,
                    height: 3
                }, scene);
                labelPlane.position.set(x, y + 3, z);
                labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                
                // Create text texture for label
                const labelTexture = new BABYLON.DynamicTexture('labelTexture' + index, 
                    {width: 512, height: 128}, scene);
                const labelContext = labelTexture.getContext();
                
                // Draw background
                labelContext.fillStyle = 'rgba(255, 255, 255, 0.9)';
                labelContext.fillRect(0, 0, 512, 128);
                
                // Draw border
                labelContext.strokeStyle = '#333';
                labelContext.lineWidth = 4;
                labelContext.strokeRect(2, 2, 508, 124);
                
                // Draw text
                labelContext.font = 'bold 48px Arial';
                labelContext.fillStyle = '#2c3e50';
                labelContext.textAlign = 'center';
                labelContext.textBaseline = 'middle';
                labelContext.fillText(peak.name, 256, 45);
                
                labelContext.font = '32px Arial';
                labelContext.fillStyle = '#667eea';
                labelContext.fillText(peak.elevation, 256, 85);
                
                labelTexture.update();
                
                const labelMaterial = new BABYLON.StandardMaterial('labelMat' + index, scene);
                labelMaterial.diffuseTexture = labelTexture;
                labelMaterial.emissiveTexture = labelTexture;
                labelMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
                labelMaterial.opacityTexture = labelTexture;
                labelMaterial.backFaceCulling = false;
                labelPlane.material = labelMaterial;
                
                // Store references
                peakMarkers.push({
                    marker: marker,
                    pole: pole,
                    label: labelPlane,
                    data: peak
                });
                
                // Add hover interaction
                marker.actionManager = new BABYLON.ActionManager(scene);
                marker.actionManager.registerAction(
                    new BABYLON.ExecuteCodeAction(
                        BABYLON.ActionManager.OnPointerOverTrigger,
                        () => {
                            showPeakInfo(peak);
                            markerMaterial.emissiveColor = new BABYLON.Color3(1, 0.6, 0);
                        }
                    )
                );
                marker.actionManager.registerAction(
                    new BABYLON.ExecuteCodeAction(
                        BABYLON.ActionManager.OnPointerOutTrigger,
                        () => {
                            hidePeakInfo();
                            markerMaterial.emissiveColor = new BABYLON.Color3(1, 0.3, 0.2);
                        }
                    )
                );
                
                // Animate marker
                scene.registerBeforeRender(() => {
                    marker.position.y = y + Math.sin(Date.now() * 0.001 + index) * 0.2;
                    marker.rotation.y += 0.01;
                });
            });
        }

        // Show peak information
        function showPeakInfo(peak) {
            const peakInfo = document.getElementById('peakInfo');
            document.getElementById('peakName').textContent = peak.name;
            document.getElementById('peakElevation').textContent = `Elevation: ${peak.elevation}`;
            peakInfo.classList.add('show');
        }

        // Hide peak information
        function hidePeakInfo() {
            document.getElementById('peakInfo').classList.remove('show');
        }

        // Loading screen functions
        function updateLoadingProgress(percent) {
            document.getElementById('loadingProgress').style.width = percent + '%';
        }

        function updateLoadingText(text) {
            document.getElementById('loadingText').textContent = text;
        }

        function hideLoadingScreen() {
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        // Error handling
        window.addEventListener('error', (e) => {
            console.error('Error loading resources:', e);
            updateLoadingText('Error: Please ensure Osogovo Height Map (Merged).png and Osogovo_map.jpg are in the same folder as this HTML file');
        });

        // Start the application
        window.addEventListener('DOMContentLoaded', () => {
            initBabylon().catch(error => {
                console.error('Initialization error:', error);
                updateLoadingText('Error: ' + error.message);
            });
        });
    </script>
</body>
</html>
