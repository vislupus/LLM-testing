<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Osogovo 3D Terrain Diorama</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1e1e24; /* Dark slate background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        #loadingScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e1e24;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.2);
            border-top-color: #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
    <!-- Load Babylon.js core and GUI from CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>
<body>

    <div id="loadingScreen">
        <div class="spinner"></div>
        <h2>Generating 3D Terrain...</h2>
        <p style="color: #aaa; margin-top: 5px;">(Ensure you are running this via a local web server)</p>
    </div>

    <canvas id="renderCanvas"></canvas>
    
    <div class="instructions">Left Click + Drag to Rotate | Right Click + Drag to Pan | Scroll to Zoom</div>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        // Configuration
        const mapWidth = 100;
        const mapDepth = 100;
        const subdivisions = 200; // High detail
        const minHeight = 0;
        const maxHeight = 18; // Vertical exaggeration
        const baseHeight = -8; // How far down the diorama box goes

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.12, 0.12, 0.14, 1);

            // 1. Camera setup
            const camera = new BABYLON.ArcRotateCamera("camera", -Math.PI / 4, Math.PI / 3, 140, new BABYLON.Vector3(0, 5, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 20;
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 300;
            camera.minZ = 0.5;

            // 2. Lighting
            const hemiLight = new BABYLON.HemisphericLight("hemiLight", new BABYLON.Vector3(0, 1, 0), scene);
            hemiLight.intensity = 0.6;
            hemiLight.groundColor = new BABYLON.Color3(0.2, 0.2, 0.2);

            const dirLight = new BABYLON.DirectionalLight("dirLight", new BABYLON.Vector3(-1, -1, -0.5), scene);
            dirLight.position = new BABYLON.Vector3(50, 50, 50);
            dirLight.intensity = 0.8;

            // 3. Terrain Material
            const groundMat = new BABYLON.StandardMaterial("groundMat", scene);
            groundMat.diffuseTexture = new BABYLON.Texture("Osogovo_map.jpg", scene);
            groundMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05); // Reduce plastic shine

            // 4. Generate Heightmap
            const ground = BABYLON.MeshBuilder.CreateGroundFromHeightMap("terrain", "Osogovo Height Map (Merged).png", {
                width: mapWidth, 
                height: mapDepth, 
                subdivisions: subdivisions, 
                minHeight: minHeight, 
                maxHeight: maxHeight,
                onReady: (groundMesh) => {
                    groundMesh.material = groundMat;
                    
                    // Once terrain is generated, build the rest of the diorama
                    buildDioramaBox(groundMesh);
                    placePeakMarkers(groundMesh);

                    // Hide loading screen
                    const loader = document.getElementById("loadingScreen");
                    loader.style.opacity = "0";
                    setTimeout(() => loader.style.display = "none", 500);
                }
            }, scene);

            // ----- HELPER FUNCTIONS -----

            // Builds the solid walls and bottom of the diorama
            function buildDioramaBox(groundMesh) {
                const positions = groundMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                const widthPts = subdivisions + 1;
                let edgeIndices = [];

                // Extract indices along the exact perimeter of the generated ground
                // Top edge
                for(let i = 0; i <= subdivisions; i++) edgeIndices.push(i);
                // Right edge
                for(let i = 1; i <= subdivisions; i++) edgeIndices.push(i * widthPts + subdivisions);
                // Bottom edge
                for(let i = subdivisions - 1; i >= 0; i--) edgeIndices.push(subdivisions * widthPts + i);
                // Left edge
                for(let i = subdivisions - 1; i >= 1; i--) edgeIndices.push(i * widthPts);

                let pathTop = [];
                let pathBottom = [];

                // Create the top and bottom paths for the walls
                for(let idx of edgeIndices) {
                    let x = positions[idx * 3];
                    let y = positions[idx * 3 + 1];
                    let z = positions[idx * 3 + 2];
                    pathTop.push(new BABYLON.Vector3(x, y, z));
                    pathBottom.push(new BABYLON.Vector3(x, baseHeight, z));
                }

                // Create the vertical walls using a Ribbon
                const walls = BABYLON.MeshBuilder.CreateRibbon("walls", {
                    pathArray: [pathTop, pathBottom],
                    closePath: true, // Closes the box loop
                    sideOrientation: BABYLON.Mesh.DOUBLESIDE
                }, scene);

                // Create the flat bottom cap
                const bottom = BABYLON.MeshBuilder.CreateGround("bottom", {width: mapWidth, height: mapDepth}, scene);
                bottom.position.y = baseHeight;
                bottom.rotation.x = Math.PI; // Face downwards

                // Diorama Base Material (Dark soil / matte pedestal look)
                const baseMat = new BABYLON.StandardMaterial("baseMat", scene);
                baseMat.diffuseColor = new BABYLON.Color3(0.15, 0.13, 0.12);
                baseMat.specularColor = new BABYLON.Color3(0, 0, 0);
                walls.material = baseMat;
                bottom.material = baseMat;
            }

            // Finds the highest peaks and places markers
            function placePeakMarkers(groundMesh) {
                const positions = groundMesh.getVerticesData(BABYLON.VertexBuffer.PositionKind);
                let vertices = [];

                // Extract all vertex positions
                for(let i = 0; i < positions.length; i += 3) {
                    vertices.push(new BABYLON.Vector3(positions[i], positions[i+1], positions[i+2]));
                }

                // Sort vertices by height (Y) descending
                vertices.sort((a, b) => b.y - a.y);

                let peaks = [];
                // Find 3 highest distinct peaks (spaced apart)
                for (let v of vertices) {
                    let isDistant = true;
                    for (let p of peaks) {
                        // Ensure peaks are at least 15 units apart so they don't cluster on one ridge
                        if (BABYLON.Vector3.Distance(v, p) < 15) { 
                            isDistant = false; 
                            break; 
                        }
                    }
                    if (isDistant) {
                        peaks.push(v);
                        if (peaks.length === 3) break;
                    }
                }

                // Create GUI for labels
                const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

                // Place markers
                peaks.forEach((peak, index) => {
                    // 1. The Pin (Cylinder)
                    const pin = BABYLON.MeshBuilder.CreateCylinder("pin" + index, {diameterTop: 0.4, diameterBottom: 0, height: 3}, scene);
                    pin.position = peak.clone();
                    pin.position.y += 1.5; // Lift up so tip touches the ground
                    
                    const pinMat = new BABYLON.StandardMaterial("pinMat", scene);
                    pinMat.diffuseColor = new BABYLON.Color3(0.9, 0.2, 0.2); // Red
                    pinMat.emissiveColor = new BABYLON.Color3(0.4, 0.1, 0.1);
                    pin.material = pinMat;

                    // 2. The Bulb (Sphere)
                    const sphere = BABYLON.MeshBuilder.CreateSphere("sphere" + index, {diameter: 1}, scene);
                    sphere.position = peak.clone();
                    sphere.position.y += 3;
                    sphere.material = pinMat;

                    // 3. The Billboard Label (GUI)
                    const label = new BABYLON.GUI.Rectangle("label" + index);
                    label.background = "rgba(20, 20, 30, 0.85)";
                    label.color = "#4facfe"; // Border color
                    label.cornerRadius = 4;
                    label.thickness = 2;
                    label.width = "100px";
                    label.height = "45px";
                    
                    // Link label to the sphere in 3D space
                    advancedTexture.addControl(label);
                    label.linkWithMesh(sphere);
                    label.linkOffsetY = -40; // Push label up above the marker

                    // Add text to label
                    const text = new BABYLON.GUI.TextBlock();
                    text.text = `PEAK ${index + 1}\nAlt: ${(peak.y * 100).toFixed(0)}`; // Mock altitude
                    text.color = "white";
                    text.fontSize = 12;
                    text.fontWeight = "bold";
                    label.addControl(text);

                    // Add a connecting line between label and sphere
                    const line = new BABYLON.GUI.Line();
                    line.lineWidth = 2;
                    line.color = "#4facfe";
                    line.alpha = 0.5;
                    advancedTexture.addControl(line);
                    line.linkWithMesh(sphere);
                    line.connectedControl = label;
                });
            }

            return scene;
        };

        const scene = createScene();

        // Render loop
        engine.runRenderLoop(function () {
            scene.render();
        });

        // Resize event
        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
