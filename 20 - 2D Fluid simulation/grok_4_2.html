<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIQUID LAB • Real-time Fluid</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1f;
            font-family: 'Inter', system-ui;
            color: #ddd;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15,15,35,0.92);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            user-select: none;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 21px;
            text-align: center;
            color: #6cf;
        }
        .control {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #88ffdd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #6cf;
        }
        .val {
            float: right;
            font-family: monospace;
            color: #6cf;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6cf;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        #info {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>LIQUID LAB</h1>
        
        <div class="control">
            <label>VISCOSITY <span id="viscVal" class="val">0.0001</span></label>
            <input type="range" id="viscSlider" min="0" max="100" value="1">
        </div>
        
        <div class="control">
            <label>DIFFUSION <span id="diffVal" class="val">0.12</span></label>
            <input type="range" id="diffSlider" min="0" max="100" value="12">
        </div>
        
        <div class="control">
            <label>FADE RATE <span id="fadeVal" class="val">0.96</span></label>
            <input type="range" id="fadeSlider" min="80" max="100" value="96">
        </div>
        
        <button onclick="resetFluid()">RESET FLUID</button>
        <button onclick="clearDensity()">CLEAR INK</button>
    </div>
    
    <div id="info">
        DRAG MOUSE = inject force + color<br>
        1 2 3 4 = change ink color<br>
        R = reset
    </div>

    <script>
        // ================================================
        // LIQUID LAB — Real-time 2D Fluid Simulation
        // Jos Stam Stable Fluids (Navier-Stokes)
        // RGB color mixing • Mouse force + dye injection
        // Smooth rendering • Adjustable parameters
        // Single standalone HTML file
        // ================================================

        let N = 128;                    // grid resolution
        let size = 800;                 // canvas size
        let scale = size / N;
        
        let u = new Array(N * N).fill(0);   // velocity x
        let v = new Array(N * N).fill(0);   // velocity y
        let densR = new Array(N * N).fill(0);
        let densG = new Array(N * N).fill(0);
        let densB = new Array(N * N).fill(0);
        
        let uPrev = new Array(N * N).fill(0);
        let vPrev = new Array(N * N).fill(0);
        let densRPrev = new Array(N * N).fill(0);
        let densGPrev = new Array(N * N).fill(0);
        let densBPrev = new Array(N * N).fill(0);
        
        let visc = 0.0001;
        let diff = 0.12;
        let fade = 0.96;
        
        let currentColor = 0; // 0=red, 1=green, 2=blue, 3=yellow
        
        let fluidImage;
        
        function setup() {
            createCanvas(size, size);
            fluidImage = createImage(N, N);
            resetFluid();
        }
        
        function resetFluid() {
            u.fill(0);
            v.fill(0);
            densR.fill(0);
            densG.fill(0);
            densB.fill(0);
        }
        
        function clearDensity() {
            densR.fill(0);
            densG.fill(0);
            densB.fill(0);
        }
        
        function IX(x, y) {
            return x + y * N;
        }
        
        function setBnd(b, x) {
            for (let i = 1; i < N-1; i++) {
                x[IX(i, 0)]    = b == 2 ? -x[IX(i, 1)]    : x[IX(i, 1)];
                x[IX(i, N-1)]  = b == 2 ? -x[IX(i, N-2)]  : x[IX(i, N-2)];
            }
            for (let j = 1; j < N-1; j++) {
                x[IX(0, j)]    = b == 1 ? -x[IX(1, j)]    : x[IX(1, j)];
                x[IX(N-1, j)]  = b == 1 ? -x[IX(N-2, j)]  : x[IX(N-2, j)];
            }
            x[IX(0,0)] = 0.5 * (x[IX(1,0)] + x[IX(0,1)]);
            x[IX(0,N-1)] = 0.5 * (x[IX(1,N-1)] + x[IX(0,N-2)]);
            x[IX(N-1,0)] = 0.5 * (x[IX(N-2,0)] + x[IX(N-1,1)]);
            x[IX(N-1,N-1)] = 0.5 * (x[IX(N-2,N-1)] + x[IX(N-1,N-2)]);
        }
        
        function addSource(x, s, dt) {
            for (let i = 0; i < N*N; i++) x[i] += dt * s[i];
        }
        
        function diffuse(b, x, x0, diff, dt) {
            let a = dt * diff * N * N;
            for (let k = 0; k < 18; k++) {
                for (let j = 1; j < N-1; j++) {
                    for (let i = 1; i < N-1; i++) {
                        let idx = IX(i,j);
                        x[idx] = (x0[idx] + a * (
                            x[IX(i-1,j)] + x[IX(i+1,j)] +
                            x[IX(i,j-1)] + x[IX(i,j+1)]
                        )) / (1 + 4 * a);
                    }
                }
                setBnd(b, x);
            }
        }
        
        function advect(b, d, d0, u, v, dt) {
            let dt0 = dt * N;
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    let x = i - dt0 * u[idx];
                    let y = j - dt0 * v[idx];
                    
                    if (x < 0.5) x = 0.5;
                    if (x > N - 1.5) x = N - 1.5;
                    let i0 = Math.floor(x);
                    let i1 = i0 + 1;
                    
                    if (y < 0.5) y = 0.5;
                    if (y > N - 1.5) y = N - 1.5;
                    let j0 = Math.floor(y);
                    let j1 = j0 + 1;
                    
                    let s1 = x - i0;
                    let s0 = 1 - s1;
                    let t1 = y - j0;
                    let t0 = 1 - t1;
                    
                    d[idx] = s0 * (t0 * d0[IX(i0,j0)] + t1 * d0[IX(i0,j1)]) +
                             s1 * (t0 * d0[IX(i1,j0)] + t1 * d0[IX(i1,j1)]);
                }
            }
            setBnd(b, d);
        }
        
        function project(u, v, p, div) {
            let h = 1.0 / N;
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    div[idx] = -0.5 * h * (u[IX(i+1,j)] - u[IX(i-1,j)] + v[IX(i,j+1)] - v[IX(i,j-1)]);
                    p[idx] = 0;
                }
            }
            setBnd(0, div);
            setBnd(0, p);
            
            for (let k = 0; k < 20; k++) {
                for (let j = 1; j < N-1; j++) {
                    for (let i = 1; i < N-1; i++) {
                        let idx = IX(i,j);
                        p[idx] = (div[idx] + p[IX(i-1,j)] + p[IX(i+1,j)] + p[IX(i,j-1)] + p[IX(i,j+1)]) / 4;
                    }
                }
                setBnd(0, p);
            }
            
            for (let j = 1; j < N-1; j++) {
                for (let i = 1; i < N-1; i++) {
                    let idx = IX(i,j);
                    u[idx] -= 0.5 * (p[IX(i+1,j)] - p[IX(i-1,j)]) / h;
                    v[idx] -= 0.5 * (p[IX(i,j+1)] - p[IX(i,j-1)]) / h;
                }
            }
            setBnd(1, u);
            setBnd(2, v);
        }
        
        function fluidStep(dt) {
            // Velocity step
            addSource(u, uPrev, dt);
            addSource(v, vPrev, dt);
            
            diffuse(1, uPrev, u, visc, dt);
            diffuse(2, vPrev, v, visc, dt);
            
            project(u, v, uPrev, vPrev);
            
            advect(1, u, uPrev, uPrev, vPrev, dt);
            advect(2, v, vPrev, uPrev, vPrev, dt);
            
            project(u, v, uPrev, vPrev);
            
            // Density step (RGB)
            addSource(densR, densR, dt * 0.8);
            addSource(densG, densG, dt * 0.8);
            addSource(densB, densB, dt * 0.8);
            
            diffuse(0, densR, densR, diff, dt);
            diffuse(0, densG, densG, diff, dt);
            diffuse(0, densB, densB, diff, dt);
            
            advect(0, densR, densR, u, v, dt);
            advect(0, densG, densG, u, v, dt);
            advect(0, densB, densB, u, v, dt);
            
            // Fade density slowly
            for (let i = 0; i < N*N; i++) {
                densR[i] *= fade;
                densG[i] *= fade;
                densB[i] *= fade;
            }
        }
        
        function drawFluid() {
            fluidImage.loadPixels();
            for (let j = 0; j < N; j++) {
                for (let i = 0; i < N; i++) {
                    let idx = IX(i, j);
                    let r = Math.min(255, densR[idx]);
                    let g = Math.min(255, densG[idx]);
                    let b = Math.min(255, densB[idx]);
                    let px = (i + j * N) * 4;
                    fluidImage.pixels[px]     = r;
                    fluidImage.pixels[px + 1] = g;
                    fluidImage.pixels[px + 2] = b;
                    fluidImage.pixels[px + 3] = 255;
                }
            }
            fluidImage.updatePixels();
            image(fluidImage, 0, 0, width, height);
        }
        
        function mouseDragged() {
            let i = Math.floor(mouseX / scale);
            let j = Math.floor(mouseY / scale);
            if (i < 1 || i > N-2 || j < 1 || j > N-2) return;
            
            let idx = IX(i, j);
            
            // Add velocity from mouse movement
            let force = 35;
            u[idx] = (mouseX - pmouseX) * force;
            v[idx] = (mouseY - pmouseY) * force;
            
            // Add density to current color
            let amount = 180;
            if (currentColor === 0) densR[idx] = amount;
            else if (currentColor === 1) densG[idx] = amount;
            else if (currentColor === 2) densB[idx] = amount;
            else {
                densR[idx] = amount;
                densG[idx] = amount * 0.6;
                densB[idx] = amount * 0.2;
            }
        }
        
        function keyPressed() {
            if (key === 'r' || key === 'R') resetFluid();
            if (key === 'c' || key === 'C') clearDensity();
            if (key === '1') currentColor = 0; // red
            if (key === '2') currentColor = 1; // green
            if (key === '3') currentColor = 2; // blue
            if (key === '4') currentColor = 3; // yellow
        }
        
        function draw() {
            let dt = 0.12;
            fluidStep(dt);
            drawFluid();
        }
        
        function setupUI() {
            const viscSlider = document.getElementById('viscSlider');
            const diffSlider = document.getElementById('diffSlider');
            const fadeSlider = document.getElementById('fadeSlider');
            
            viscSlider.oninput = () => {
                visc = parseFloat(viscSlider.value) / 100000;
                document.getElementById('viscVal').textContent = visc.toFixed(5);
            };
            
            diffSlider.oninput = () => {
                diff = parseFloat(diffSlider.value) / 100;
                document.getElementById('diffVal').textContent = diff.toFixed(2);
            };
            
            fadeSlider.oninput = () => {
                fade = parseFloat(fadeSlider.value) / 100;
                document.getElementById('fadeVal').textContent = fade.toFixed(2);
            };
        }
        
        window.onload = () => {
            setupUI();
        };
    </script>
</body>
</html>
