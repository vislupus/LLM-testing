<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Fluid Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,200,255,0.2);
            z-index: 100;
            max-width: 280px;
            line-height: 1.6;
        }
        #info h2 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #88ccff;
            font-weight: 600;
        }
        #info .key {
            display: inline-block;
            background: rgba(100,200,255,0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            margin: 0 2px;
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100,200,255,0.2);
            z-index: 100;
        }
        #controls h3 {
            font-size: 13px;
            color: #88ccff;
            margin-bottom: 10px;
        }
        .slider-group {
            margin: 10px 0;
        }
        .slider-group label {
            display: block;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.7);
        }
        input[type="range"] {
            width: 150px;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(100,200,255,0.2);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #88ccff;
            border-radius: 50%;
            cursor: pointer;
        }
        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 11px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Fluid Simulation</h2>
        <p><span class="key">Mouse</span> Drag to inject fluid & velocity</p>
        <p><span class="key">1-4</span> Change fluid colors</p>
        <p><span class="key">Space</span> Add density burst</p>
        <p><span class="key">V</span> Toggle vortex mode</p>
        <p><span class="key">O</span> Toggle obstacles</p>
        <p><span class="key">R</span> Reset simulation</p>
        <p><span class="key">S</span> Toggle shader glow</p>
    </div>

    <div id="controls">
        <h3>Parameters</h3>
        <div class="slider-group">
            <label>Viscosity</label>
            <input type="range" id="viscositySlider" min="0" max="0.01" step="0.001" value="0.001">
        </div>
        <div class="slider-group">
            <label>Diffusion</label>
            <input type="range" id="diffusionSlider" min="0" max="1" step="0.01" value="0.1">
        </div>
        <div class="slider-group">
            <label>Vortex Strength</label>
            <input type="range" id="vortexSlider" min="0" max="0.5" step="0.01" value="0.1">
        </div>
    </div>

    <div id="stats">
        <span id="fps">FPS: 60</span> | <span id="particles">Cells: 0</span>
    </div>

    <script>
        // ============================================
        // NAVIER-STOKES FLUID SIMULATION
        // Grid-based implementation
        // ============================================

        const N = 128;  // Grid size
        const ITERATIONS = 16;  // Solver iterations
        const dt = 0.1;

        // Fluid arrays
        let dens = [];
        let dens_prev = [];
        let u = [];      // Velocity x
        let u_prev = []; // Velocity x previous
        let v = [];      // Velocity y
        let v_prev = []; // Velocity y previous

        // Color arrays for each fluid type
        let colors = [
            { r: 255, g: 100, b: 100 },   // Red
            { r: 100, g: 255, b: 100 },   // Green
            { r: 100, g: 150, b: 255 },   // Blue
            { r: 255, g: 200, b: 50 }    // Yellow
        ];
        let colorDens = [];  // Color density arrays
        let colorDens_prev = [];

        let currentColor = 0;
        let vortexMode = true;
        let showObstacles = true;
        let shaderGlow = true;
        let obstacles = [];

        let canvas;
        let resolution;
        let cellSize;

        // ============================================
        // SETUP
        // ============================================
        function setup() {
            canvas = createCanvas(windowWidth, windowHeight);
            pixelDensity(1);

            resolution = min(width, height) * 0.85;
            cellSize = resolution / N;

            initializeArrays();
            createObstacles();
            frameRate(60);

            // UI Event Listeners
            document.getElementById('viscositySlider').addEventListener('input', (e) => {
                // Viscosity is handled in simulation
            });

            document.getElementById('diffusionSlider').addEventListener('input', (e) => {
                // Diffusion is handled in simulation
            });

            document.getElementById('vortexSlider').addEventListener('input', (e) => {
                // Vortex strength is handled in simulation
            });
        }

        function initializeArrays() {
            dens = new Array(N * N).fill(0);
            dens_prev = new Array(N * N).fill(0);
            u = new Array(N * N).fill(0);
            u_prev = new Array(N * N).fill(0);
            v = new Array(N * N).fill(0);
            v_prev = new Array(N * N).fill(0);

            colorDens = [];
            colorDens_prev = [];
            for (let i = 0; i < 4; i++) {
                colorDens.push(new Array(N * N).fill(0));
                colorDens_prev.push(new Array(N * N).fill(0));
            }
        }

        function createObstacles() {
            obstacles = new Array(N * N).fill(false);

            // Add circular obstacles
            addCircleObstacle(N * 0.3, N * 0.5, N * 0.08);
            addCircleObstacle(N * 0.7, N * 0.5, N * 0.08);
            addRectObstacle(N * 0.5, N * 0.3, N * 0.15, N * 0.02);
        }

        function addCircleObstacle(cx, cy, radius) {
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    let dist = sqrt((i - cx) * (i - cx) + (j - cy) * (j - cy));
                    if (dist < radius) {
                        obstacles[i + j * N] = true;
                    }
                }
            }
        }

        function addRectObstacle(cx, cy, w, h) {
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    if (abs(i - cx) < w / 2 && abs(j - cy) < h / 2) {
                        obstacles[i + j * N] = true;
                    }
                }
            }
        }

        // ============================================
        // FLUID SIMULATION FUNCTIONS
        // ============================================

        function IX(x, y) {
            x = constrain(x, 0, N - 1);
            y = constrain(y, 0, N - 1);
            return x + y * N;
        }

        function addSource(x, b) {
            for (let i = 0; i < N * N; i++) {
                x[i] += dt * b[i];
            }
        }

        function setBnd(b, x) {
            for (let i = 1; i < N - 1; i++) {
                // Boundary conditions
                x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N - 1)] = b === 2 ? -x[IX(i, N - 2)] : x[IX(i, N - 2)];
                x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N - 1, i)] = b === 1 ? -x[IX(N - 2, i)] : x[IX(N - 2, i)];
            }

            // Corners
            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N - 1)] = 0.5 * (x[IX(1, N - 1)] + x[IX(0, N - 2)]);
            x[IX(N - 1, 0)] = 0.5 * (x[IX(N - 2, 0)] + x[IX(N - 1, 1)]);
            x[IX(N - 1, N - 1)] = 0.5 * (x[IX(N - 2, N - 1)] + x[IX(N - 1, N - 2)]);

            // Obstacles
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    if (obstacles[IX(i, j)]) {
                        x[IX(i, j)] = 0;
                    }
                }
            }
        }

        function linSolve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;
            for (let k = 0; k < ITERATIONS; k++) {
                for (let j = 1; j < N - 1; j++) {
                    for (let i = 1; i < N - 1; i++) {
                        if (!obstacles[IX(i, j)]) {
                            x[IX(i, j)] = (x0[IX(i, j)] + a * (
                                x[IX(i + 1, j)] +
                                x[IX(i - 1, j)] +
                                x[IX(i, j + 1)] +
                                x[IX(i, j - 1)]
                            )) * cRecip;
                        }
                    }
                }
                setBnd(b, x);
            }
        }

        function diffuse(b, x, x0, diff) {
            let a = dt * diff * (N - 2) * (N - 2);
            linSolve(b, x, x0, a, 1 + 4 * a);
        }

        function advect(b, d, d0, u, v) {
            let dt0 = dt * (N - 2);
            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    if (!obstacles[IX(i, j)]) {
                        let x = i - dt0 * u[IX(i, j)];
                        let y = j - dt0 * v[IX(i, j)];

                        // Clamp to grid
                        x = constrain(x, 0.5, N - 1.5);
                        y = constrain(y, 0.5, N - 1.5);

                        let i0 = floor(x);
                        let i1 = i0 + 1;
                        let j0 = floor(y);
                        let j1 = j0 + 1;

                        let s1 = x - i0;
                        let s0 = 1 - s1;
                        let t1 = y - j0;
                        let t0 = 1 - t1;

                        d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                                     s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                    }
                }
            }
            setBnd(b, d);
        }

        function project(u, v, p, div) {
            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    if (!obstacles[IX(i, j)]) {
                        div[IX(i, j)] = -0.5 * (
                            u[IX(i + 1, j)] - u[IX(i - 1, j)] +
                            v[IX(i, j + 1)] - v[IX(i, j - 1)]
                        ) / N;
                        p[IX(i, j)] = 0;
                    }
                }
            }
            setBnd(0, div);
            setBnd(0, p);
            linSolve(0, p, div, 1, 4);

            for (let j = 1; j < N - 1; j++) {
                for (let i = 1; i < N - 1; i++) {
                    if (!obstacles[IX(i, j)]) {
                        u[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) * N;
                        v[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) * N;
                    }
                }
            }
            setBnd(1, u);
            setBnd(2, v);
        }

        function step() {
            let viscSlider = parseFloat(document.getElementById('viscositySlider').value);
            let diffSlider = parseFloat(document.getElementById('diffusionSlider').value);
            let vortexStrength = parseFloat(document.getElementById('vortexSlider').value);

            // Velocity step
            // Add vortex force if enabled
            if (vortexMode) {
                for (let j = 1; j < N - 1; j++) {
                    for (let i = 1; i < N - 1; i++) {
                        let cx = N / 2;
                        let cy = N / 2;
                        let dx = i - cx;
                        let dy = j - cy;
                        let dist = sqrt(dx * dx + dy * dy);
                        if (dist > 5) {
                            // Tangential force
                            u_prev[IX(i, j)] += -dy / dist * vortexStrength * dens[IX(i, j)] * 0.1;
                            v_prev[IX(i, j)] += dx / dist * vortexStrength * dens[IX(i, j)] * 0.1;
                        }
                    }
                }
            }

            addSource(u, u_prev);
            addSource(v, v_prev);

            // Swap velocity arrays
            let temp = u; u = u_prev; u_prev = temp;
            let temp2 = v; v = v_prev; v_prev = temp2;

            diffuse(1, u, u_prev, viscSlider);
            diffuse(2, v, v_prev, viscSlider);

            project(u, v, u_prev, v_prev);

            // Swap velocity arrays
            temp = u; u = u_prev; u_prev = temp;
            temp2 = v; v = v_prev; v_prev = temp2;

            advect(1, u, u_prev, u_prev, v_prev);
            advect(2, v, v_prev, u_prev, v_prev);

            project(u, v, u_prev, v_prev);

            // Density step for each color
            for (let c = 0; c < 4; c++) {
                addSource(colorDens[c], colorDens_prev[c]);

                temp = colorDens[c]; colorDens[c] = colorDens_prev[c]; colorDens_prev[c] = temp;

                diffuse(0, colorDens[c], colorDens_prev[c], diffSlider);

                temp = colorDens[c]; colorDens[c] = colorDens_prev[c]; colorDens_prev[c] = temp;

                advect(0, colorDens[c], colorDens_prev[c], u, v);
            }

            // Total density
            for (let i = 0; i < N * N; i++) {
                dens[i] = 0;
                for (let c = 0; c < 4; c++) {
                    dens[i] += colorDens[c][i];
                }
                dens[i] = constrain(dens[i], 0, 1);
            }

            // Clear sources
            for (let i = 0; i < N * N; i++) {
                u_prev[i] = 0;
                v_prev[i] = 0;
                for (let c = 0; c < 4; c++) {
                    colorDens_prev[c][i] = 0;
                }
            }
        }

        // ============================================
        // INTERACTION
        // ============================================

        function addDensity(x, y, amount) {
            let i = floor(x);
            let j = floor(y);
            if (i >= 1 && i < N - 1 && j >= 1 && j < N - 1) {
                // Add to current color
                for (let di = -2; di <= 2; di++) {
                    for (let dj = -2; dj <= 2; dj++) {
                        let ni = i + di;
                        let nj = j + dj;
                        if (ni >= 0 && ni < N && nj >= 0 && nj < N) {
                            let dist = sqrt(di * di + dj * dj);
                            let falloff = exp(-dist * 0.5);
                            colorDens[currentColor][IX(ni, nj)] += amount * falloff;
                        }
                    }
                }
            }
        }

        function addVelocity(x, y, px, py, amount) {
            let i = floor(x);
            let j = floor(y);
            if (i >= 1 && i < N - 1 && j >= 1 && j < N - 1) {
                let dx = px - x;
                let dy = py - y;
                for (let di = -2; di <= 2; di++) {
                    for (let dj = -2; dj <= 2; dj++) {
                        let ni = i + di;
                        let nj = j + dj;
                        if (ni >= 0 && ni < N && nj >= 0 && nj < N) {
                            let dist = sqrt(di * di + dj * dj);
                            let falloff = exp(-dist * 0.5);
                            u_prev[IX(ni, nj)] += dx * amount * falloff;
                            v_prev[IX(ni, nj)] += dy * amount * falloff;
                        }
                    }
                }
            }
        }

        function mousePressed() {
            handleMouse();
        }

        function mouseDragged() {
            handleMouse();
        }

        function handleMouse() {
            let canvasX = (width - resolution) / 2;
            let canvasY = (height - resolution) / 2;

            let mx = (mouseX - canvasX) / cellSize;
            let my = (mouseY - canvasY) / cellSize;

            let pmx = (pmouseX - canvasX) / cellSize;
            let pmy = (pmouseY - canvasY) / cellSize;

            addDensity(mx, my, 5);
            addVelocity(mx, my, pmx, pmy, 2);
        }

        function keyPressed() {
            if (key === '1') currentColor = 0;
            if (key === '2') currentColor = 1;
            if (key === '3') currentColor = 2;
            if (key === '4') currentColor = 3;

            if (key === ' ') {
                // Add burst of density
                for (let c = 0; c < 4; c++) {
                    colorDens_prev[IX(N / 2, N / 2)] = 50;
                    colorDens_prev[IX(N / 2 + 1, N / 2)] = 50;
                    colorDens_prev[IX(N / 2, N / 2 + 1)] = 50;
                    colorDens_prev[IX(N / 2 - 1, N / 2)] = 50;
                    colorDens_prev[IX(N / 2, N / 2 - 1)] = 50;
                }
            }

            if (key === 'v' || key === 'V') {
                vortexMode = !vortexMode;
            }

            if (key === 'o' || key === 'O') {
                showObstacles = !showObstacles;
                // Clear or restore obstacles
                obstacles.fill(false);
                if (showObstacles) {
                    createObstacles();
                }
            }

            if (key === 'r' || key === 'R') {
                initializeArrays();
                if (showObstacles) createObstacles();
            }

            if (key === 's' || key === 'S') {
                shaderGlow = !shaderGlow;
            }
        }

        // ============================================
        // RENDERING
        // ============================================

        function draw() {
            // Step simulation
            for (let i = 0; i < 2; i++) {
                step();
            }

            // Clear with trail effect
            background(10, 10, 15, 40);

            let canvasX = (width - resolution) / 2;
            let canvasY = (height - resolution) / 2;

            push();
            translate(canvasX, canvasY);

            // Draw obstacles
            if (showObstacles) {
                noStroke();
                fill(30, 30, 40);
                for (let j = 0; j < N; j++) {
                    for (let i = 0; i < N; i++) {
                        if (obstacles[IX(i, j)]) {
                            rect(i * cellSize, j * cellSize, cellSize + 1, cellSize + 1);
                        }
                    }
                }
            }

            // Draw fluid with color mixing
            noStroke();

            if (shaderGlow) {
                // Glow effect layer
                for (let j = 0; j < N; j++) {
                    for (let i = 0; i < N; i++) {
                        let d = dens[IX(i, j)];
                        if (d > 0.01) {
                            // Calculate mixed color
                            let r = 0, g = 0, b = 0;
                            for (let c = 0; c < 4; c++) {
                                let cd = colorDens[c][IX(i, j)];
                                if (cd > 0) {
                                    r += colors[c].r * cd;
                                    g += colors[c].g * cd;
                                    b += colors[c].b * cd;
                                }
                            }

                            let total = r + g + b;
                            if (total > 0) {
                                r /= total;
                                g /= total;
                                b /= total;
                            }

                            // Glow
                            let glowSize = cellSize * (1 + d * 2);
                            fill(r, g, b, d * 50);
                            rect(i * cellSize - glowSize / 2, j * cellSize - glowSize / 2, glowSize, glowSize);
                        }
                    }
                }
            }

            // Main fluid layer
            loadPixels();
            for (let j = 0; j < N; j++) {
                for (let i = 0; i < N; i++) {
                    let d = dens[IX(i, j)];
                    if (d > 0.01) {
                        // Calculate mixed color
                        let r = 0, g = 0, b = 0;
                        for (let c = 0; c < 4; c++) {
                            let cd = colorDens[c][IX(i, j)];
                            if (cd > 0) {
                                r += colors[c].r * cd;
                                g += colors[c].g * cd;
                                b += colors[c].b * cd;
                            }
                        }

                        let total = r + g + b;
                        if (total > 0) {
                            r /= total;
                            g /= total;
                            b /= total;
                        }

                        // Draw pixel
                        let px = floor(i * cellSize);
                        let py = floor(j * cellSize);
                        let size = ceil(cellSize);

                        fill(r, g, b, min(d * 255, 255));
                        rect(px, py, size, size);
                    }
                }
            }

            // Draw velocity field (optional visualization)
            if (keyIsDown(86)) { // V key held
                stroke(255, 255, 255, 50);
                for (let j = 0; j < N; j += 4) {
                    for (let i = 0; i < N; i += 4) {
                        let x = i * cellSize + cellSize / 2;
                        let y = j * cellSize + cellSize / 2;
                        let vx = u[IX(i, j)] * 10;
                        let vy = v[IX(i, j)] * 10;
                        line(x, y, x + vx, y + vy);
                    }
                }
            }

            pop();

            // Update stats
            document.getElementById('fps').textContent = `FPS: ${floor(frameRate())}`;
            document.getElementById('particles').textContent = `Density: ${floor(dens.reduce((a, b) => a + b, 0))}`;

            // Auto-inject small amounts of fluid
            if (frameCount % 120 === 0) {
                addDensity(N / 2 + sin(frameCount * 0.02) * N * 0.2, N / 2 + cos(frameCount * 0.015) * N * 0.2, 3);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            resolution = min(width, height) * 0.85;
            cellSize = resolution / N;
        }
    </script>

<script>
/**
 * Iframe 元素高亮注入脚本
 * 需要在目标网站中引入此脚本来支持跨域 iframe 高亮功能
 *
 * 使用方法：
 * 1. 将此脚本添加到目标网站的 HTML 中
 * 2. 或通过浏览器扩展、用户脚本等方式注入
 */

(function () {
  "use strict";

  // 检查是否在 iframe 中
  if (window.self === window.top) {
    return; // 不在 iframe 中，不执行
  }

  // 检查是否已经初始化过
  if (window.__iframeHighlightInitialized) {
    return;
  }
  window.__iframeHighlightInitialized = true;
  console.log("Iframe 高亮脚本已加载");

  // 创建高亮覆盖层
  var overlay = document.createElement("div");
  overlay.id = "iframe-highlight-overlay";
  overlay.style.cssText = "\n    position: fixed;\n    top: 0;\n    left: 0;\n    width: 100vw;\n    height: 100vh;\n    pointer-events: none;\n    z-index: 999999;\n    overflow: hidden;\n  ";

  // 创建悬停高亮框（虚线边框）
  var highlightBox = document.createElement("div");
  highlightBox.id = "iframe-highlight-box";
  highlightBox.style.cssText = "\n    position: absolute;\n    border: 2px dashed #007AFF;\n    background: rgba(0, 122, 255, 0.08);\n    pointer-events: none;\n    display: none;\n    transition: all 0.1s ease;\n    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);\n    border-radius: 2px;\n  ";

  // 创建选中节点的常驻高亮框（实线边框）
