<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Fluid Simulation — Navier-Stokes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #99a;
    overflow: hidden;
  }
  h1 {
    font-size: 16px; font-weight: 600; padding: 10px 0 2px;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7, #ff6ac1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #sub { font-size: 10px; color: #556; margin-bottom: 6px; }
  canvas { border-radius: 8px; cursor: crosshair;
    box-shadow: 0 0 50px rgba(0,210,255,.06), 0 0 100px rgba(123,47,247,.04); }
  #hud {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 16px; font: 10px/1.4 monospace; color: #445;
    background: rgba(0,0,0,.5); padding: 6px 14px; border-radius: 6px;
    backdrop-filter: blur(4px);
  }
  #hud b { color: #0cf; }
  #keys {
    position: fixed; top: 10px; right: 12px;
    font: 10px/1.7 monospace; color: #445;
    background: rgba(0,0,0,.55); padding: 8px 12px; border-radius: 8px;
    backdrop-filter: blur(4px); max-width: 200px;
  }
  #keys kbd {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
    border-radius: 3px; padding: 0 4px; color: #7af;
  }
</style>
</head>
<body>

<h1>2D Fluid Dynamics — Stable Fluids (Navier–Stokes)</h1>
<div id="sub">Click &amp; drag to inject fluid · Keys change color / viscosity / obstacles</div>
<canvas id="c"></canvas>
<div id="hud">
  FPS: <b id="hFps">0</b> &nbsp;|&nbsp;
  Grid: <b id="hGrid">0</b> &nbsp;|&nbsp;
  Viscosity: <b id="hVisc">0</b> &nbsp;|&nbsp;
  Vortex: <b id="hVort">OFF</b> &nbsp;|&nbsp;
  Obstacles: <b id="hObs">0</b>
</div>
<div id="keys">
  <kbd>1</kbd>-<kbd>5</kbd> dye colors<br>
  <kbd>↑</kbd><kbd>↓</kbd> viscosity<br>
  <kbd>V</kbd> vortex confinement<br>
  <kbd>O</kbd> toggle obstacles<br>
  <kbd>R</kbd> reset scene<br>
  <kbd>Space</kbd> pause
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════
   2D FLUID SIMULATION — Jos Stam's Stable Fluids
   Grid-based Navier-Stokes with RGB dye advection.
   ═══════════════════════════════════════════════════════ */

/* ── Grid resolution ── */
const N = 160;              // grid cells per axis
const SIZE = (N + 2) * (N + 2);  // total cells including boundary

/* ── Simulation parameters ── */
let dt = 0.1;               // timestep
let visc = 0.0001;          // viscosity (kinematic)
let diff = 0.00001;         // dye diffusion rate
let forceStrength = 300;    // mouse force magnitude
let dyeStrength = 80;       // dye injection amount
let vortexConfine = false;  // vortex confinement toggle
let paused = false;
let showObstacles = false;

/* ── Fluid fields (flat arrays, index = i + j*(N+2)) ── */
let u, v, u_prev, v_prev;           // velocity (x, y)
let densR, densG, densB;            // current dye density (RGB)
let densR_prev, densG_prev, densB_prev; // previous dye density
let obstacle;                        // boolean obstacle grid

/* ── Dye color palette ── */
const COLORS = [
  [0, 210, 255],    // 1: cyan
  [255, 100, 200],  // 2: pink
  [120, 255, 80],   // 3: green
  [255, 200, 50],   // 4: gold
  [180, 100, 255],  // 5: purple
];
let currentColorIdx = 0;

/* ── Mouse state ── */
let mouseDown = false;
let pmouseX = 0, pmouseY = 0;

/* ── Canvas sizing ── */
let canvasSize;

/* ═══════════════════════════════════════════════════════
   INDEX HELPER
   ═══════════════════════════════════════════════════════ */
function IX(i, j) { return i + (N + 2) * j; }

/* ═══════════════════════════════════════════════════════
   SETUP
   ═══════════════════════════════════════════════════════ */
function setup() {
  canvasSize = Math.min(windowWidth - 20, windowHeight - 120, 700);
  const cnv = createCanvas(canvasSize, canvasSize);
  cnv.parent('c') || cnv.canvas.id = 'c';
  colorMode(RGB, 255);
  pixelDensity(1);
  noSmooth();
  initFluid();
}

function initFluid() {
  u = new Float32Array(SIZE);
  v = new Float32Array(SIZE);
  u_prev = new Float32Array(SIZE);
  v_prev = new Float32Array(SIZE);
  densR = new Float32Array(SIZE);
  densG = new Float32Array(SIZE);
  densB = new Float32Array(SIZE);
  densR_prev = new Float32Array(SIZE);
  densG_prev = new Float32Array(SIZE);
  densB_prev = new Float32Array(SIZE);
  obstacle = new Uint8Array(SIZE);
  placeObstacles();
}

/* ── Place some interesting obstacles ── */
function placeObstacles() {
  obstacle.fill(0);
  if (!showObstacles) return;

  const cx = N / 2, cy = N / 2;

  /* Circular obstacle in center */
  const r = N * 0.08;
  for (let j = 0; j <= N + 1; j++) {
    for (let i = 0; i <= N + 1; i++) {
      const dx = i - cx, dy = j - cy;
      if (dx * dx + dy * dy < r * r) obstacle[IX(i, j)] = 1;
    }
  }

  /* Two small rectangles */
  for (let j = Math.floor(cy - r - 8); j <= Math.floor(cy - r - 2); j++) {
    for (let i = Math.floor(cx - 12); i <= Math.floor(cx + 12); i++) {
      if (j >= 0 && j <= N + 1 && i >= 0 && i <= N + 1) obstacle[IX(i, j)] = 1;
    }
  }
  for (let j = Math.floor(cy + r + 2); j <= Math.floor(cy + r + 8); j++) {
    for (let i = Math.floor(cx - 12); i <= Math.floor(cx + 12); i++) {
      if (j >= 0 && j <= N + 1 && i >= 0 && i <= N + 1) obstacle[IX(i, j)] = 1;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   SOLVER — Stable Fluids (Jos Stam 1999)
   Each step: add forces → diffuse → project → advect → project
   ═══════════════════════════════════════════════════════ */

/* ── Add source terms (forces / dye) ── */
function add_source(x, s, dt) {
  for (let i = 0; i < SIZE; i++) x[i] += dt * s[i];
}

/* ── Set boundary conditions ── */
function set_bnd(b, x) {
  /* Walls: reflect velocity component normal to wall */
  for (let i = 1; i <= N; i++) {
    x[IX(0, i)]     = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
    x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
    x[IX(i, 0)]     = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
    x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
  }
  x[IX(0, 0)]         = 0.5 * (x[IX(1, 0)]     + x[IX(0, 1)]);
  x[IX(0, N + 1)]     = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
  x[IX(N + 1, 0)]     = 0.5 * (x[IX(N, 0)]     + x[IX(N + 1, 1)]);
  x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);

  /* Obstacle boundaries */
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i, j)]) {
        x[IX(i, j)] = 0;
      }
    }
  }
}

/* ── Linear solver (Gauss-Seidel relaxation) for diffusion ── */
function lin_solve(b, x, x0, a, c) {
  const cRecip = 1.0 / c;
  for (let k = 0; k < 4; k++) {   // 4 relaxation iterations
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) { x[IX(i, j)] = 0; continue; }
        x[IX(i, j)] = (x0[IX(i, j)] + a * (
          x[IX(i + 1, j)] + x[IX(i - 1, j)] +
          x[IX(i, j + 1)] + x[IX(i, j - 1)]
        )) * cRecip;
      }
    }
    set_bnd(b, x);
  }
}

/* ── Diffusion step ── */
function diffuse(b, x, x0, diff, dt) {
  const a = dt * diff * N * N;
  lin_solve(b, x, x0, a, 1 + 4 * a);
}

/* ── Advection step (backtrace + bilinear interpolation) ── */
function advect(b, d, d0, velocX, velocY, dt) {
  const dt0 = dt * N;
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i, j)]) { d[IX(i, j)] = 0; continue; }

      /* Backtrace: where did this cell's fluid come from? */
      let x = i - dt0 * velocX[IX(i, j)];
      let y = j - dt0 * velocY[IX(i, j)];

      /* Clamp to grid */
      if (x < 0.5) x = 0.5;
      if (x > N + 0.5) x = N + 0.5;
      const i0 = Math.floor(x);
      const i1 = i0 + 1;

      if (y < 0.5) y = 0.5;
      if (y > N + 0.5) y = N + 0.5;
      const j0 = Math.floor(y);
      const j1 = j0 + 1;

      /* Bilinear interpolation weights */
      const s1 = x - i0;
      const s0 = 1 - s1;
      const t1 = y - j0;
      const t0 = 1 - t1;

      d[IX(i, j)] =
        s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
        s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
    }
  }
  set_bnd(b, d);
}

/* ── Projection step (Hodge decomposition → divergence-free field) ── */
function project(velocX, velocY, p, div) {
  const h = 1.0 / N;

  /* Compute divergence */
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i, j)]) {
        div[IX(i, j)] = 0;
        p[IX(i, j)] = 0;
        continue;
      }
      div[IX(i, j)] = -0.5 * h * (
        velocX[IX(i + 1, j)] - velocX[IX(i - 1, j)] +
        velocY[IX(i, j + 1)] - velocY[IX(i, j - 1)]
      );
      p[IX(i, j)] = 0;
    }
  }
  set_bnd(0, div);
  set_bnd(0, p);

  /* Solve for pressure via Gauss-Seidel */
  for (let k = 0; k < 4; k++) {
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacle[IX(i, j)]) { p[IX(i, j)] = 0; continue; }
        p[IX(i, j)] = (div[IX(i, j)] +
          p[IX(i + 1, j)] + p[IX(i - 1, j)] +
          p[IX(i, j + 1)] + p[IX(i, j - 1)]
        ) * 0.25;
      }
    }
    set_bnd(0, p);
  }

  /* Subtract pressure gradient from velocity */
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacle[IX(i, j)]) {
        velocX[IX(i, j)] = 0;
        velocY[IX(i, j)] = 0;
        continue;
      }
      velocX[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) * N;
      velocY[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) * N;
    }
  }
  set_bnd(1, velocX);
  set_bnd(2, velocY);
}

/* ── Vortex confinement: adds energy to maintain swirling motion ── */
function applyVortexConfinement() {
  if (!vortexConfine) return;
  const eps = 0.6;  // confinement strength

  for (let j = 2; j < N; j++) {
    for (let i = 2; i < N; i++) {
      if (obstacle[IX(i, j)]) continue;

      /* Compute vorticity (curl of velocity) */
      const w = 0.5 * (
        v[IX(i + 1, j)] - v[IX(i - 1, j)] -
        u[IX(i, j + 1)] + u[IX(i, j - 1)]
      );

      /* Gradient of |vorticity| */
      const absW_L = Math.abs(0.5 * (v[IX(i, j)] - v[IX(i - 2, j)] - u[IX(i - 1, j + 1)] + u[IX(i - 1, j - 1)]));
      const absW_R = Math.abs(0.5 * (v[IX(i + 2, j)] - v[IX(i, j)] - u[IX(i + 1, j + 1)] + u[IX(i + 1, j - 1)]));
      const absW_D = Math.abs(0.5 * (v[IX(i + 1, j - 1)] - v[IX(i - 1, j - 1)] - u[IX(i, j)] + u[IX(i, j - 2)]));
      const absW_U = Math.abs(0.5 * (v[IX(i + 1, j + 1)] - v[IX(i - 1, j + 1)] - u[IX(i, j + 2)] + u[IX(i, j)]));

      let gradX = (absW_R - absW_L) * 0.5;
      let gradY = (absW_U - absW_D) * 0.5;
      const len = Math.sqrt(gradX * gradX + gradY * gradY) + 1e-5;
      gradX /= len;
      gradY /= len;

      /* Confinement force: perpendicular to gradient, proportional to vorticity */
      u[IX(i, j)] += eps * (-gradY * w) * dt;
      v[IX(i, j)] += eps * (gradX * w) * dt;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   SIMULATION STEP
   ═══════════════════════════════════════════════════════ */
function velocity_step() {
  /* Add user forces */
  add_source(u, u_prev, dt);
  add_source(v, v_prev, dt);

  /* Swap: u_prev now holds the forced velocity */
  [u, u_prev] = [u_prev, u];
  diffuse(1, u, u_prev, visc, dt);

  [v, v_prev] = [v_prev, v];
  diffuse(2, v, v_prev, visc, dt);

  project(u, v, u_prev, v_prev);

  [u, u_prev] = [u_prev, u];
  [v, v_prev] = [v_prev, v];

  advect(1, u, u_prev, u_prev, v_prev, dt);
  advect(2, v, v_prev, u_prev, v_prev, dt);

  project(u, v, u_prev, v_prev);

  /* Vortex confinement */
  applyVortexConfinement();
}

function density_step(dens, dens_prev) {
  add_source(dens, dens_prev, dt);
  [dens, dens_prev] = [dens_prev, dens];
  diffuse(0, dens, dens_prev, diff, dt);
  [dens, dens_prev] = [dens_prev, dens];
  advect(0, dens, dens_prev, u, v, dt);
}

/* ═══════════════════════════════════════════════════════
   MOUSE INPUT — inject velocity and dye
   ═══════════════════════════════════════════════════════ */
function injectMouse() {
  if (!mouseIsPressed) return;

  /* Map mouse to grid coordinates */
  const mx = Math.floor(map(mouseX, 0, canvasSize, 1, N + 1));
  const my = Math.floor(map(mouseY, 0, canvasSize, 1, N + 1));
  const pmx = Math.floor(map(pmouseX, 0, canvasSize, 1, N + 1));
  const pmy = Math.floor(map(pmouseY, 0, canvasSize, 1, N + 1));

  /* Velocity from mouse movement */
  const dvx = (mouseX - pmouseX) * forceStrength / canvasSize;
  const dvy = (mouseY - pmouseY) * forceStrength / canvasSize;

  const col = COLORS[currentColorIdx];
  const radius = 3;  // injection radius in grid cells

  for (let j = -radius; j <= radius; j++) {
    for (let i = -radius; i <= radius; i++) {
      const gi = mx + i;
      const gj = my + j;
      if (gi < 1 || gi > N || gj < 1 || gj > N) continue;
      if (obstacle[IX(gi, gj)]) continue;

      const dist = Math.sqrt(i * i + j * j);
      if (dist > radius) continue;
      const falloff = 1 - dist / (radius + 1);

      const idx = IX(gi, gj);
      u_prev[idx] += dvx * falloff;
      v_prev[idx] += dvy * falloff;

      /* Inject dye */
      densR_prev[idx] += col[0] / 255 * dyeStrength * falloff * dt;
      densG_prev[idx] += col[1] / 255 * dyeStrength * falloff * dt;
      densB_prev[idx] += col[2] / 255 * dyeStrength * falloff * dt;
    }
  }
}

/* ═══════════════════════════════════════════════════════
   RENDERING — map dye density to canvas pixels
   ═══════════════════════════════════════════════════════ */
function renderFluid() {
  loadPixels();
  const pw = pixelWidth();
  const ph = pixelHeight();
  const scale = N / canvasSize;

  for (let py = 0; py < canvasSize; py++) {
    const gj = Math.floor(py * scale) + 1;
    if (gj < 1 || gj > N) continue;

    for (let px = 0; px < canvasSize; px++) {
      const gi = Math.floor(px * scale) + 1;
      if (gi < 1 || gi > N) continue;

      const idx = IX(gi, gj);
      const pi = (py * canvasSize + px) * 4;

      if (obstacle[idx]) {
        pixels[pi]     = 40;
        pixels[pi + 1] = 40;
        pixels[pi + 2] = 50;
        pixels[pi + 3] = 255;
        continue;
      }

      /* Read dye densities */
      let r = densR[idx];
      let g = densG[idx];
      let b = densB[idx];

      /* Tone mapping: enhance contrast and brightness */
      const brightness = 1.8;
      r = Math.pow(Math.min(r * brightness, 1), 0.7) * 255;
      g = Math.pow(Math.min(g * brightness, 1), 0.7) * 255;
      b = Math.pow(Math.min(b * brightness, 1), 0.7) * 255;

      /* Subtle background glow */
      const bg = 6;
      pixels[pi]     = Math.min(r + bg, 255);
      pixels[pi + 1] = Math.min(g + bg, 255);
      pixels[pi + 2] = Math.min(b + bg, 255);
      pixels[pi + 3] = 255;
    }
  }
  updatePixels();
}

function pixelWidth() { return canvasSize; }
function pixelHeight() { return canvasSize; }

/* ═══════════════════════════════════════════════════════
   MAIN LOOP
   ═══════════════════════════════════════════════════════ */
function draw() {
  if (paused) {
    renderFluid();
    updateHUD();
    return;
  }

  /* Clear source arrays each frame */
  u_prev.fill(0);
  v_prev.fill(0);
  densR_prev.fill(0);
  densG_prev.fill(0);
  densB_prev.fill(0);

  /* Inject mouse forces */
  injectMouse();

  /* Simulation step */
  velocity_step();
  density_step(densR, densR_prev);
  density_step(densG, densG_prev);
  density_step(densB, densB_prev);

  /* Slowly decay dye so old colors fade */
  for (let i = 0; i < SIZE; i++) {
    densR[i] *= 0.9985;
    densG[i] *= 0.9985;
    densB[i] *= 0.9985;
  }

  /* Render */
  renderFluid();
  updateHUD();
}

/* ═══════════════════════════════════════════════════════
   HUD UPDATE
   ═══════════════════════════════════════════════════════ */
function updateHUD() {
  document.getElementById('hFps').textContent = nf(frameRate(), 2, 0);
  document.getElementById('hGrid').textContent = N + '×' + N;
  document.getElementById('hVisc').textContent = visc.toFixed(6);
  document.getElementById('hVort').textContent = vortexConfine ? 'ON' : 'OFF';
  document.getElementById('hObs').textContent = showObstacles ? 'YES' : 'NO';
}

/* ═══════════════════════════════════════════════════════
   KEYBOARD CONTROLS
   ═══════════════════════════════════════════════════════ */
function keyPressed() {
  if (key === '1') currentColorIdx = 0;
  if (key === '2') currentColorIdx = 1;
  if (key === '3') currentColorIdx = 2;
  if (key === '4') currentColorIdx = 3;
  if (key === '5') currentColorIdx = 4;

  if (keyCode === UP_ARROW) {
    visc = Math.min(visc * 2, 0.01);
  }
  if (keyCode === DOWN_ARROW) {
    visc = Math.max(visc / 2, 0.000001);
  }

  if (key === 'v' || key === 'V') {
    vortexConfine = !vortexConfine;
  }

  if (key === 'o' || key === 'O') {
    showObstacles = !showObstacles;
    placeObstacles();
  }

  if (key === 'r' || key === 'R') {
    initFluid();
  }

  if (key === ' ') {
    paused = !paused;
  }

  return false;  // prevent default
}

/* ═══════════════════════════════════════════════════════
   MOUSE TRACKING
   ═══════════════════════════════════════════════════════ */
function mousePressed() { mouseDown = true; }
function mouseReleased() { mouseDown = false; }

/* Auto-inject some initial dye for visual appeal */
function injectInitialDye() {
  const cx = N / 2, cy = N / 2;
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      const dx = i - cx, dy = j - cy;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 8 && d > 2) {
        const a = Math.atan2(dy, dx);
        const idx = IX(i, j);
        u[idx] = -Math.sin(a) * 2;
        v[idx] = Math.cos(a) * 2;
        densR[idx] = 0.5 + 0.5 * Math.sin(a);
        densG[idx] = 0.5 + 0.5 * Math.cos(a);
        densB[idx] = 0.5 + 0.5 * Math.sin(a * 2);
      }
    }
  }
}

/* Inject initial dye after a short delay */
setTimeout(injectInitialDye, 100);

</script>
</body>
