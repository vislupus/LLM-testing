<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Fluid Simulation</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    height: 100vh;
  }
  #sidebar {
    width: 280px;
    background: #111;
    border-right: 1px solid #222;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    flex-shrink: 0;
  }
  #sidebar h1 {
    font-size: 16px;
    color: #4fc3f7;
    margin-bottom: 4px;
  }
  #sidebar .subtitle {
    font-size: 11px;
    color: #666;
    margin-bottom: 10px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .control-group label {
    font-size: 11px;
    color: #888;
    display: flex;
    justify-content: space-between;
  }
  .control-group label span.val {
    color: #4fc3f7;
    font-weight: 600;
    font-family: 'Consolas', monospace;
  }
  .control-group input[type="range"] {
    width: 100%;
    accent-color: #4fc3f7;
    cursor: pointer;
  }
  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }
  .btn-row button {
    flex: 1;
    padding: 8px 10px;
    border: none;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary {
    background: #238636;
    color: #fff;
  }
  .btn-primary:hover { background: #2ea043; }
  .btn-secondary {
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
  }
  .btn-secondary:hover { background: #30363d; }
  .hint {
    font-size: 10px;
    color: #555;
    line-height: 1.5;
    margin-top: 8px;
  }
  .hint kbd {
    background: #222;
    padding: 1px 5px;
    border-radius: 3px;
    border: 1px solid #333;
    font-family: 'Consolas', monospace;
    color: #888;
  }
  #canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  canvas {
    border-radius: 4px;
    box-shadow: 0 0 30px rgba(79, 195, 247, 0.05);
  }
</style>
</head>
<body>
<div id="sidebar">
  <div>
    <h1>🌊 Fluid Simulation</h1>
    <div class="subtitle">Navier-Stokes solver on GPU</div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" id="btn-pause" onclick="togglePause()">Pause</button>
    <button class="btn-secondary" onclick="resetFluid()">Reset</button>
  </div>

  <div class="control-group">
    <label>Viscosity <span class="val" id="val-viscosity">0.0001</span></label>
    <input type="range" id="viscosity" min="0" max="0.001" step="0.00001" value="0.0001" oninput="updateParam('viscosity')">
  </div>

  <div class="control-group">
    <label>Diffusion <span class="val" id="val-diffusion">0.0001</span></label>
    <input type="range" id="diffusion" min="0" max="0.001" step="0.00001" value="0.0001" oninput="updateParam('diffusion')">
  </div>

  <div class="control-group">
    <label>Density Fade <span class="val" id="val-fade">0.995</span></label>
    <input type="range" id="fade" min="0.9" max="1" step="0.001" value="0.995" oninput="updateParam('fade')">
  </div>

  <div class="control-group">
    <label>Velocity Scale <span class="val" id="val-velocity">0.2</span></label>
    <input type="range" id="velocity" min="0.05" max="1" step="0.05" value="0.2" oninput="updateParam('velocity')">
  </div>

  <div class="control-group">
    <label>Vortex Strength <span class="val" id="val-vortex">0.5</span></label>
    <input type="range" id="vortex" min="0" max="2" step="0.1" value="0.5" oninput="updateParam('vortex')">
  </div>

  <div class="control-group">
    <label>Grid Resolution <span class="val" id="val-res">128</span></label>
    <input type="range" id="res" min="64" max="256" step="64" value="128" oninput="updateResolution()">
  </div>

  <div class="control-group">
    <label>Solver Iterations <span class="val" id="val-iter">20</span></label>
    <input type="range" id="iter" min="5" max="50" step="5" value="20" oninput="updateParam('iter')">
  </div>

  <div class="hint">
    <strong>Controls:</strong><br>
    <kbd>Mouse drag</kbd> — inject velocity & dye<br>
    <kbd>1-5</kbd> — switch dye color<br>
    <kbd>Space</kbd> — toggle vortex mode<br>
    <kbd>R</kbd> — reset<br>
    <kbd>+/-</kbd> — viscosity up/down<br>
    <kbd>O</kbd> — toggle obstacles<br>
    <kbd>C</kbd> — clear dye only
  </div>
</div>

<div id="canvas-container"></div>

<script>
/* ===================== FLUID SOLVER =====================
   Navier-Stokes solver using Jos Stam's stable fluids method.
   Grid-based with Gauss-Seidel projection for incompressibility.
*/

let N = 128;
let size;
let dt = 0.1;
let diff = 0.0001;
let visc = 0.0001;
let fade = 0.995;
let velScale = 0.2;
let vortexStrength = 0.5;
let solverIter = 20;

// Arrays: index = i + (N+2)*j for padded grid
let u, v, u_prev, v_prev;      // velocity
let dens, dens_prev;           // density (dye)
let r, g, b, r_prev, g_prev, b_prev;  // RGB color channels

// Obstacles
let obstacles;
let showObstacles = false;

// UI state
let paused = false;
let currentColor = 0; // 0=cyan, 1=magenta, 2=yellow, 3=green, 4=orange
const colors = [
  { r: 0, g: 200, b: 255 },
  { r: 255, g: 0, b: 200 },
  { r: 255, g: 220, b: 0 },
  { r: 0, g: 255, b: 100 },
  { r: 255, g: 120, b: 0 }
];

let vortexMode = false;

function IX(i, j) {
  return i + (N + 2) * j;
}

function setup() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth - 20;
  const h = container.clientHeight - 20;
  const s = Math.min(w, h);
  createCanvas(s, s);
  pixelDensity(1);
  initFluid();
}

function initFluid() {
  size = (N + 2) * (N + 2);
  u = new Float32Array(size); v = new Float32Array(size);
  u_prev = new Float32Array(size); v_prev = new Float32Array(size);
  dens = new Float32Array(size); dens_prev = new Float32Array(size);
  r = new Float32Array(size); r_prev = new Float32Array(size);
  g = new Float32Array(size); g_prev = new Float32Array(size);
  b = new Float32Array(size); b_prev = new Float32Array(size);
  obstacles = new Uint8Array(size);

  // Create some obstacles
  createObstacles();
}

function createObstacles() {
  obstacles.fill(0);
  const cx = (N + 2) / 2;
  const cy = (N + 2) / 2;

  // Central cylinder
  for (let i = 1; i <= N; i++) {
    for (let j = 1; j <= N; j++) {
      const dx = i - cx;
      const dy = j - cy;
      if (dx*dx + dy*dy < 25) {
        obstacles[IX(i, j)] = 1;
      }
    }
  }

  // Side barriers
  for (let j = N/3; j < 2*N/3; j++) {
    obstacles[IX(Math.floor(N/4), j)] = 1;
    obstacles[IX(Math.floor(3*N/4), j)] = 1;
  }
}

function addDensity(x, y, amount, cr, cg, cb) {
  const idx = IX(x, y);
  dens[idx] += amount;
  r[idx] += cr * amount;
  g[idx] += cg * amount;
  b[idx] += cb * amount;
}

function addVelocity(x, y, amountX, amountY) {
  const idx = IX(x, y);
  u[idx] += amountX;
  v[idx] += amountY;
}

/* ===================== SOLVER STEPS ===================== */
function diffuse(b, x, x0, diff0, dt0) {
  const a = dt0 * diff0 * N * N;
  for (let k = 0; k < solverIter; k++) {
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacles[IX(i, j)]) continue;
        x[IX(i, j)] = (x0[IX(i, j)] + a * (
          x[IX(i-1, j)] + x[IX(i+1, j)] +
          x[IX(i, j-1)] + x[IX(i, j+1)]
        )) / (1 + 4 * a);
      }
    }
    set_bnd(b, x);
  }
}

function advect(b, d, d0, u0, v0, dt0) {
  let i0, j0, i1, j1;
  let x, y, s0, t0, s1, t1;
  const dt1 = dt0 * N;

  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacles[IX(i, j)]) { d[IX(i, j)] = 0; continue; }

      x = i - dt1 * u0[IX(i, j)];
      y = j - dt1 * v0[IX(i, j)];

      if (x < 0.5) x = 0.5;
      if (x > N + 0.5) x = N + 0.5;
      i0 = Math.floor(x); i1 = i0 + 1;

      if (y < 0.5) y = 0.5;
      if (y > N + 0.5) y = N + 0.5;
      j0 = Math.floor(y); j1 = j0 + 1;

      s1 = x - i0; s0 = 1 - s1;
      t1 = y - j0; t0 = 1 - t1;

      d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                      s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
    }
  }
  set_bnd(b, d);
}

function project(u0, v0, p, div) {
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacles[IX(i, j)]) { div[IX(i, j)] = 0; p[IX(i, j)] = 0; continue; }
      div[IX(i, j)] = -0.5 * (
        u0[IX(i+1, j)] - u0[IX(i-1, j)] +
        v0[IX(i, j+1)] - v0[IX(i, j-1)]
      ) / N;
      p[IX(i, j)] = 0;
    }
  }
  set_bnd(0, div);
  set_bnd(0, p);

  for (let k = 0; k < solverIter; k++) {
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacles[IX(i, j)]) continue;
        p[IX(i, j)] = (div[IX(i, j)] + p[IX(i-1, j)] + p[IX(i+1, j)] +
                        p[IX(i, j-1)] + p[IX(i, j+1)]) / 4;
      }
    }
    set_bnd(0, p);
  }

  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacles[IX(i, j)]) continue;
      u0[IX(i, j)] -= 0.5 * N * (p[IX(i+1, j)] - p[IX(i-1, j)]);
      v0[IX(i, j)] -= 0.5 * N * (p[IX(i, j+1)] - p[IX(i, j-1)]);
    }
  }
  set_bnd(1, u0);
  set_bnd(2, v0);
}

function set_bnd(b, x) {
  for (let i = 1; i <= N; i++) {
    x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
    x[IX(N+1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
    x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
    x[IX(i, N+1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
  }
  x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
  x[IX(0, N+1)] = 0.5 * (x[IX(1, N+1)] + x[IX(0, N)]);
  x[IX(N+1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N+1, 1)]);
  x[IX(N+1, N+1)] = 0.5 * (x[IX(N, N+1)] + x[IX(N+1, N)]);
}

function dens_step(x, x0, u0, v0, diff0, dt0) {
  diffuse(0, x0, x, diff0, dt0);
  advect(0, x, x0, u0, v0, dt0);
}

function vel_step(u0, v0, u_prev0, v_prev0, visc0, dt0) {
  diffuse(1, u_prev0, u0, visc0, dt0);
  diffuse(2, v_prev0, v0, visc0, dt0);

  project(u_prev0, v_prev0, u0, v0);

  advect(1, u0, u_prev0, u_prev0, v_prev0, dt0);
  advect(2, v0, v_prev0, u_prev0, v_prev0, dt0);

  project(u0, v0, u_prev0, v_prev0);
}

/* ===================== MAIN LOOP ===================== */
function draw() {
  if (!paused) {
    // Handle mouse input
    handleMouseInput();

    // Vortex mode
    if (vortexMode) {
      applyVortex();
    }

    // Step velocity
    vel_step(u, v, u_prev, v_prev, visc, dt);

    // Step density (combined)
    dens_step(dens, dens_prev, u, v, diff, dt);
    dens_step(r, r_prev, u, v, diff, dt);
    dens_step(g, g_prev, u, v, diff, dt);
    dens_step(b, b_prev, u, v, diff, dt);

    // Fade
    for (let i = 0; i < size; i++) {
      dens[i] *= fade;
      r[i] *= fade;
      g[i] *= fade;
      b[i] *= fade;
    }
  }

  renderFluid();
}

function handleMouseInput() {
  if (!mouseIsPressed) return;

  const gridX = Math.floor(map(mouseX, 0, width, 1, N));
  const gridY = Math.floor(map(mouseY, 0, height, 1, N));

  if (gridX < 1 || gridX > N || gridY < 1 || gridY > N) return;

  const amt = 2;
  const col = colors[currentColor];

  // Add dye
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      const gx = gridX + dx;
      const gy = gridY + dy;
      if (gx >= 1 && gx <= N && gy >= 1 && gy <= N && !obstacles[IX(gx, gy)]) {
        const falloff = Math.exp(-(dx*dx + dy*dy) / 2);
        addDensity(gx, gy, amt * falloff, col.r / 255, col.g / 255, col.b / 255);
      }
    }
  }

  // Add velocity from mouse movement
  const vx = (mouseX - pmouseX) * velScale;
  const vy = (mouseY - pmouseY) * velScale;
  addVelocity(gridX, gridY, vx, vy);
}

function applyVortex() {
  const cx = (N + 2) / 2;
  const cy = (N + 2) / 2;
  for (let j = 1; j <= N; j++) {
    for (let i = 1; i <= N; i++) {
      if (obstacles[IX(i, j)]) continue;
      const dx = i - cx;
      const dy = j - cy;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 3 || dist > N/2) continue;
      const strength = vortexStrength * 0.01 * (1 - dist / (N/2));
      u[IX(i, j)] += -dy / dist * strength;
      v[IX(i, j)] += dx / dist * strength;
    }
  }
}

/* ===================== RENDERING ===================== */
function renderFluid() {
  loadPixels();
  const d = pixelDensity();
  const pw = width * d;

  for (let j = 0; j < height; j++) {
    for (let i = 0; i < width; i++) {
      const gi = Math.floor(map(i, 0, width, 1, N));
      const gj = Math.floor(map(j, 0, height, 1, N));
      const idx = IX(gi, gj);

      let rv = r[idx] * 255;
      let gv = g[idx] * 255;
      let bv = b[idx] * 255;

      // Add subtle background tint
      rv += 5;
      gv += 8;
      bv += 12;

      // Clamp
      rv = constrain(rv, 0, 255);
      gv = constrain(gv, 0, 255);
      bv = constrain(bv, 0, 255);

      const pixIdx = 4 * (j * pw * d + i * d);
      pixels[pixIdx] = rv;
      pixels[pixIdx + 1] = gv;
      pixels[pixIdx + 2] = bv;
      pixels[pixIdx + 3] = 255;
    }
  }
  updatePixels();

  // Draw obstacles
  if (showObstacles) {
    fill(100, 100, 100, 150);
    noStroke();
    for (let j = 1; j <= N; j++) {
      for (let i = 1; i <= N; i++) {
        if (obstacles[IX(i, j)]) {
          const sx = map(i, 1, N, 0, width);
          const sy = map(j, 1, N, 0, height);
          const sw = width / N;
          rect(sx - sw/2, sy - sw/2, sw, sw);
        }
      }
    }
  }
}

/* ===================== UI & CONTROLS ===================== */
function updateParam(id) {
  const el = document.getElementById(id);
  const val = parseFloat(el.value);
  document.getElementById('val-' + id).textContent = val;

  switch (id) {
    case 'viscosity': visc = val; break;
    case 'diffusion': diff = val; break;
    case 'fade': fade = val; break;
    case 'velocity': velScale = val; break;
    case 'vortex': vortexStrength = val; break;
    case 'iter': solverIter = Math.floor(val); break;
  }
}

function updateResolution() {
  const val = parseInt(document.getElementById('res').value);
  document.getElementById('val-res').textContent = val;
  N = val;
  initFluid();
}

function togglePause() {
  paused = !paused;
  document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
}

function resetFluid() {
  u.fill(0); v.fill(0); u_prev.fill(0); v_prev.fill(0);
  dens.fill(0); dens_prev.fill(0);
  r.fill(0); r_prev.fill(0); g.fill(0); g_prev.fill(0); b.fill(0); b_prev.fill(0);
  createObstacles();
}

function keyPressed() {
  if (key === ' ') {
    vortexMode = !vortexMode;
    showStatus(vortexMode ? 'Vortex mode ON' : 'Vortex mode OFF');
  }
  if (key === 'r' || key === 'R') resetFluid();
  if (key === 'c' || key === 'C') {
    dens.fill(0); r.fill(0); g.fill(0); b.fill(0);
    showStatus('Dye cleared');
  }
  if (key === 'o' || key === 'O') {
    showObstacles = !showObstacles;
    showStatus(showObstacles ? 'Obstacles visible' : 'Obstacles hidden');
  }
  if (key === '=' || key === '+') {
    visc = Math.min(0.001, visc + 0.00005);
    document.getElementById('viscosity').value = visc;
    document.getElementById('val-viscosity').textContent = visc.toFixed(5);
  }
  if (key === '-' || key === '_') {
    visc = Math.max(0, visc - 0.00005);
    document.getElementById('viscosity').value = visc;
    document.getElementById('val-viscosity').textContent = visc.toFixed(5);
  }
  if (key >= '1' && key <= '5') {
    currentColor = parseInt(key) - 1;
    showStatus('Color: ' + ['Cyan', 'Magenta', 'Yellow', 'Green', 'Orange'][currentColor]);
  }
}

function showStatus(msg) {
  // Simple console status - could add on-screen overlay
  console.log(msg);
}

function windowResized() {
  const container = document.getElementById('canvas-container');
  const w = container.clientWidth - 20;
  const h = container.clientHeight - 20;
  const s = Math.min(w, h);
  resizeCanvas(s, s);
}
</script>
</body>
</html>
