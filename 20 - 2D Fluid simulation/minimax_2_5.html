<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Fluid Dynamics Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }

        canvas {
            display: block;
        }

        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 180, 255, 0.15);
            border-radius: 12px;
            padding: 20px;
            color: #c0d0e0;
            font-size: 12px;
            line-height: 1.8;
            z-index: 100;
            max-width: 260px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        #controls h1 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #64b5f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #controls .section {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        #controls .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        #controls .key {
            display: inline-block;
            background: rgba(100, 180, 255, 0.15);
            border: 1px solid rgba(100, 180, 255, 0.25);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            color: #64b5f6;
            margin-right: 4px;
        }

        #controls .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        #controls .stat-label {
            color: #708090;
        }

        #controls .stat-value {
            color: #64ffda;
            font-weight: 600;
        }

        .color-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #currentColor {
            transition: background-color 0.3s ease;
        }

        #status {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 10px;
            text-align: center;
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.2);
        }

        #status.paused {
            background: rgba(251, 191, 36, 0.1);
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.2);
        }
    </style>
</head>
<body>
    <div id="controls">
        <h1>FLUID DYNAMICS</h1>

        <div class="section">
            <div><span class="key">MOUSE</span> Drag to add fluid</div>
            <div><span class="key">1-5</span> Select color</div>
            <div><span class="key">R</span> Reset simulation</div>
            <div><span class="key">SPACE</span> Pause/Resume</div>
            <div><span class="key">V</span> Toggle viscosity</div>
            <div><span class="key">X</span> Toggle vortex</div>
        </div>

        <div class="section">
            <div class="stat">
                <span class="stat-label">Active Color:</span>
                <span><span class="color-indicator" id="currentColor"></span><span id="colorName">Cyan</span></span>
            </div>
            <div class="stat">
                <span class="stat-label">Viscosity:</span>
                <span class="stat-value" id="viscosityVal">Low</span>
            </div>
            <div class="stat">
                <span class="stat-label">Vortex:</span>
                <span class="stat-value" id="vortexVal">OFF</span>
            </div>
        </div>

        <div class="stat">
            <span class="stat-label">FPS:</span>
            <span class="stat-value" id="fps">60</span>
        </div>

        <div id="status">Running</div>
    </div>

    <script>
        // ============================================
        // FLUID SIMULATION - NAVIER-STOKES SOLVER
        // ============================================

        // Simulation parameters
        const N = 128;           // Grid resolution
        const SCALE = 4;         // Visual scale factor
        const ITER = 8;           // Solver iterations (Gauss-Seidel)

        // Fluid arrays (1D arrays representing 2D grid)
        let size = (N + 2) * (N + 2);
        let u, v, u0, v0;        // Velocity fields
        let densR, densG, densB; // RGB density fields
        let densR0, densG0, densB0;

        // Simulation state
        let dt = 0.1;
        let diffusion = 0.0001;
        let viscosity = 0.0001;
        let isPaused = false;
        let vortexEnabled = false;
        let vortexTime = 0;

        // Color palette
        const colors = [
            { name: 'Cyan',    r: 0,   g: 255, b: 255 },
            { name: 'Magenta', r: 255, g: 0,   b: 255 },
            { name: 'Yellow',  r: 255, g: 255, b: 0 },
            { name: 'Red',     r: 255, g: 50,  b: 50 },
            { name: 'Green',   r: 50,  g: 255, b: 100 }
        ];
        let currentColor = 0;
        let viscosityLevel = 0; // 0: Low, 1: Medium, 2: High

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);

            // Initialize arrays
            initArrays();

            // Set initial color
            updateColorIndicator();
        }

        function initArrays() {
            size = (N + 2) * (N + 2);
            u = new Float32Array(size);
            v = new Float32Array(size);
            u0 = new Float32Array(size);
            v0 = new Float32Array(size);
            densR = new Float32Array(size);
            densG = new Float32Array(size);
            densB = new Float32Array(size);
            densR0 = new Float32Array(size);
            densG0 = new Float32Array(size);
            densB0 = new Float32Array(size);
        }

        function resetSimulation() {
            for (let i = 0; i < size; i++) {
                u[i] = v[i] = u0[i] = v0[i] = 0;
                densR[i] = densG[i] = densB[i] = 0;
                densR0[i] = densG0[i] = densB0[i] = 0;
            }
        }

        // Convert screen coordinates to grid coordinates
        function IX(x, y) {
            return x + (N + 2) * y;
        }

        // Add source to density field
        function addDensity(x, y, amountR, amountG, amountB) {
            let gridX = Math.floor(x / SCALE);
            let gridY = Math.floor(y / SCALE);
            gridX = constrain(gridX, 1, N);
            gridY = constrain(gridY, 1, N);

            let index = IX(gridX, gridY);
            densR[index] += amountR;
            densG[index] += amountG;
            densB[index] += amountB;
        }

        // Add source to velocity field
        function addVelocity(x, y, amountX, amountY) {
            let gridX = Math.floor(x / SCALE);
            let gridY = Math.floor(y / SCALE);
            gridX = constrain(gridX, 1, N);
            gridY = constrain(gridY, 1, N);

            let index = IX(gridX, gridY);
            u[index] += amountX;
            v[index] += amountY;
        }

        // Set boundary conditions
        function set_bnd(b, x) {
            for (let i = 1; i <= N; i++) {
                x[IX(0, i)] = b === 1 ? -x[IX(1, i)] : x[IX(1, i)];
                x[IX(N + 1, i)] = b === 1 ? -x[IX(N, i)] : x[IX(N, i)];
                x[IX(i, 0)] = b === 2 ? -x[IX(i, 1)] : x[IX(i, 1)];
                x[IX(i, N + 1)] = b === 2 ? -x[IX(i, N)] : x[IX(i, N)];
            }

            x[IX(0, 0)] = 0.5 * (x[IX(1, 0)] + x[IX(0, 1)]);
            x[IX(0, N + 1)] = 0.5 * (x[IX(1, N + 1)] + x[IX(0, N)]);
            x[IX(N + 1, 0)] = 0.5 * (x[IX(N, 0)] + x[IX(N + 1, 1)]);
            x[IX(N + 1, N + 1)] = 0.5 * (x[IX(N, N + 1)] + x[IX(N + 1, N)]);
        }

        // Linear solver (Gauss-Seidel relaxation)
        function lin_solve(b, x, x0, a, c) {
            let cRecip = 1.0 / c;

            for (let k = 0; k < ITER; k++) {
                for (let j = 1; j <= N; j++) {
                    for (let i = 1; i <= N; i++) {
                        x[IX(i, j)] = (x0[IX(i, j)] + a * (
                            x[IX(i + 1, j)] + x[IX(i - 1, j)] +
                            x[IX(i, j + 1)] + x[IX(i, j - 1)]
                        )) * cRecip;
                    }
                }
                set_bnd(b, x);
            }
        }

        // Diffusion step
        function diffuse(b, x, x0, diff) {
            let a = dt * diff * N * N;
            lin_solve(b, x, x0, a, 1 + 4 * a);
        }

        // Advection step (back-tracing)
        function advect(b, d, d0, velocX, velocY) {
            let i0, j0, i1, j1;
            let x, y, s0, t0, s1, t1;
            let dt0 = dt * N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    x = i - dt0 * velocX[IX(i, j)];
                    y = j - dt0 * velocY[IX(i, j)];

                    if (x < 0.5) x = 0.5;
                    if (x > N + 0.5) x = N + 0.5;
                    i0 = Math.floor(x);
                    i1 = i0 + 1;

                    if (y < 0.5) y = 0.5;
                    if (y > N + 0.5) y = N + 0.5;
                    j0 = Math.floor(y);
                    j1 = j0 + 1;

                    s1 = x - i0;
                    s0 = 1 - s1;
                    t1 = y - j0;
                    t0 = 1 - t1;

                    d[IX(i, j)] = s0 * (t0 * d0[IX(i0, j0)] + t1 * d0[IX(i0, j1)]) +
                                  s1 * (t0 * d0[IX(i1, j0)] + t1 * d0[IX(i1, j1)]);
                }
            }
            set_bnd(b, d);
        }

        // Projection step (enforce incompressibility)
        function project(velocX, velocY, p, div) {
            let h = 1.0 / N;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    div[IX(i, j)] = -0.5 * h * (
                        velocX[IX(i + 1, j)] - velocX[IX(i - 1, j)] +
                        velocY[IX(i, j + 1)] - velocY[IX(i, j - 1)]
                    );
                    p[IX(i, j)] = 0;
                }
            }

            set_bnd(0, div);
            set_bnd(0, p);
            lin_solve(0, p, div, 1, 4);

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    velocX[IX(i, j)] -= 0.5 * (p[IX(i + 1, j)] - p[IX(i - 1, j)]) / h;
                    velocY[IX(i, j)] -= 0.5 * (p[IX(i, j + 1)] - p[IX(i, j - 1)]) / h;
                }
            }

            set_bnd(1, velocX);
            set_bnd(2, velocY);
        }

        // Velocity step
        function velocityStep() {
            // Add vortex force if enabled
            if (vortexEnabled) {
                addVortexForce();
            }

            // Diffuse velocity
            diffuse(1, u0, u, viscosity);
            diffuse(2, v0, v, viscosity);

            // Project to enforce incompressibility
            project(u0, v0, u, v);

            // Advect velocity
            advect(1, u, u0, u0, v0);
            advect(2, v, v0, u0, v0);

            // Project again
            project(u, v, u0, v0);
        }

        // Density step
        function densityStep() {
            // Diffuse density
            diffuse(0, densR0, densR, diffusion);
            diffuse(0, densG0, densG, diffusion);
            diffuse(0, densB0, densB, diffusion);

            // Advect density
            advect(0, densR, densR0, u, v);
            advect(0, densG, densG0, u, v);
            advect(0, densB, densB0, u, v);

            // Apply slight decay
            for (let i = 0; i < size; i++) {
                densR[i] *= 0.998;
                densG[i] *= 0.998;
                densB[i] *= 0.998;
            }
        }

        // Add vortex force for swirling behavior
        function addVortexForce() {
            vortexTime += dt * 0.5;

            let cx = (N + 2) / 2;
            let cy = (N + 2) / 2;
            let radius = N * 0.35;
            let strength = 2.0;

            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let dx = i - cx;
                    let dy = j - cy;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > 5 && dist < radius) {
                        let angle = Math.atan2(dy, dx) + Math.PI / 2;
                        let falloff = 1 - (dist / radius);
                        falloff = falloff * falloff;

                        u[IX(i, j)] += Math.cos(angle) * strength * falloff * 0.1;
                        v[IX(i, j)] += Math.sin(angle) * strength * falloff * 0.1;
                    }
                }
            }
        }

        function draw() {
            background(0);

            if (!isPaused) {
                // Handle mouse input
                if (mouseIsPressed) {
                    let prevMouseX = pmouseX;
                    let prevMouseY = pmouseY;

                    let dx = (mouseX - prevMouseX) * 0.5;
                    let dy = (mouseY - prevMouseY) * 0.5;

                    // Add velocity based on mouse movement
                    for (let i = -2; i <= 2; i++) {
                        for (let j = -2; j <= 2; j++) {
                            addVelocity(mouseX + i * SCALE, mouseY + j * SCALE, dx, dy);
                        }
                    }

                    // Add density with current color
                    let col = colors[currentColor];
                    for (let i = -2; i <= 2; i++) {
                        for (let j = -2; j <= 2; j++) {
                            addDensity(mouseX + i * SCALE, mouseY + j * SCALE, col.r * 0.3, col.g * 0.3, col.b * 0.3);
                        }
                    }
                }

                // Run fluid simulation steps
                velocityStep();
                densityStep();
            }

            // Render fluid
            renderFluid();

            // Update FPS display
            if (frameCount % 10 === 0) {
                document.getElementById('fps').textContent = Math.round(frameRate());
            }
        }

        function renderFluid() {
            noStroke();

            // Render each grid cell as a rectangle
            for (let j = 1; j <= N; j++) {
                for (let i = 1; i <= N; i++) {
                    let d = densR[IX(i, j)] + densG[IX(i, j)] + densB[IX(i, j)];

                    if (d > 1) {
                        let r = densR[IX(i, j)];
                        let g = densG[IX(i, j)];
                        let b = densB[IX(i, j)];

                        // Normalize and apply brightness
                        let maxVal = Math.max(r, g, b);
                        if (maxVal > 255) {
                            r = (r / maxVal) * 255;
                            g = (g / maxVal) * 255;
                            b = (b / maxVal) * 255;
                        }

                        // Alpha based on density
                        let alpha = Math.min(255, d * 0.8);

                        fill(r, g, b, alpha);
                        rect(i * SCALE, j * SCALE, SCALE, SCALE);
                    }
                }
            }
        }

        function keyPressed() {
            // Reset
            if (key === 'r' || key === 'R') {
                resetSimulation();
            }

            // Pause
            if (key === ' ') {
                isPaused = !isPaused;
                let status = document.getElementById('status');
                status.textContent = isPaused ? 'Paused' : 'Running';
                status.classList.toggle('paused', isPaused);
            }

            // Toggle viscosity
            if (key === 'v' || key === 'V') {
                viscosityLevel = (viscosityLevel + 1) % 3;
                let levels = [0.00001, 0.0002, 0.001];
                viscosity = levels[viscosityLevel];
                let names = ['None', 'Low', 'High'];
                document.getElementById('viscosityVal').textContent = names[viscosityLevel];
            }

            // Toggle vortex
            if (key === 'x' || key === 'X') {
                vortexEnabled = !vortexEnabled;
                document.getElementById('vortexVal').textContent = vortexEnabled ? 'ON' : 'OFF';
            }

            // Color selection
            if (key >= '1' && key <= '5') {
                currentColor = parseInt(key) - 1;
                updateColorIndicator();
            }
        }

        function updateColorIndicator() {
            let col = colors[currentColor];
            let indicator = document.getElementById('currentColor');
            indicator.style.backgroundColor = `rgb(${col.r}, ${col.g}, ${col.b})`;
            document.getElementById('colorName').textContent = col.name;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
