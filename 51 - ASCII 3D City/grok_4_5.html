<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEONGLYPH // Living ASCII City</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --neon-cyan: #00f0ff;
    --neon-magenta: #ff00aa;
    --neon-lime: #b8ff00;
    --neon-amber: #ffaa00;
    --neon-violet: #aa66ff;
    --terminal-bg: #05080a;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--terminal-bg);
    font-family: 'IBM Plex Mono', monospace;
    color: var(--neon-cyan);
    cursor: none;
  }

  #game-canvas {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
    image-rendering: pixelated;
  }

  #ascii-overlay {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
    opacity: 0.14;
    mix-blend-mode: screen;
    font-size: 11px;
    line-height: 11px;
    white-space: pre;
    overflow: hidden;
    color: var(--neon-cyan);
    letter-spacing: 0px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
  }

  /* BOOT */
  #boot-screen {
    position: fixed; inset: 0; z-index: 1000;
    background: #020405;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  #boot-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .boot-logo {
    font-size: clamp(18px, 4vw, 42px);
    font-weight: 700;
    letter-spacing: 0.35em;
    color: var(--neon-cyan);
    text-shadow: 0 0 20px var(--neon-cyan), 0 0 60px rgba(0,240,255,0.4);
    margin-bottom: 8px;
    animation: pulse-glow 2s ease-in-out infinite;
  }
  .boot-sub {
    font-size: 11px; letter-spacing: 0.5em; color: var(--neon-magenta);
    margin-bottom: 40px; opacity: 0.8;
  }
  .boot-log {
    width: min(520px, 90vw); height: 160px; overflow: hidden;
    font-size: 11px; line-height: 1.7; color: #3a8a7a;
    border-left: 2px solid #0a3a35; padding-left: 16px;
    margin-bottom: 36px;
  }
  .boot-log div { opacity: 0; animation: boot-line 0.3s forwards; }
  @keyframes boot-line { to { opacity: 1; } }
  @keyframes pulse-glow {
    0%,100% { text-shadow: 0 0 20px var(--neon-cyan), 0 0 60px rgba(0,240,255,0.3); }
    50% { text-shadow: 0 0 30px var(--neon-cyan), 0 0 80px rgba(0,240,255,0.6), 0 0 120px rgba(255,0,170,0.2); }
  }

  .boot-prompt {
    font-size: 13px; letter-spacing: 0.2em;
    border: 1px solid var(--neon-cyan);
    padding: 14px 36px;
    cursor: pointer;
    background: rgba(0,240,255,0.05);
    transition: all 0.25s;
    pointer-events: auto;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan);
  }
  .boot-prompt:hover, .boot-prompt:focus {
    background: rgba(0,240,255,0.15);
    box-shadow: 0 0 30px rgba(0,240,255,0.3), inset 0 0 20px rgba(0,240,255,0.05);
    transform: scale(1.03);
  }
  .boot-hint { margin-top: 20px; font-size: 10px; color: #2a5550; letter-spacing: 0.15em; }

  /* HUD */
  #hud {
    position: fixed; inset: 0; z-index: 20; pointer-events: none;
    opacity: 0; transition: opacity 1s;
  }
  #hud.show { opacity: 1; }

  .hud-corner {
    position: absolute; font-size: 10px; letter-spacing: 0.15em;
    color: rgba(0,240,255,0.55); line-height: 1.6;
  }
  .hud-tl { top: 16px; left: 18px; }
  .hud-tr { top: 16px; right: 18px; text-align: right; }
  .hud-bl { bottom: 18px; left: 18px; }
  .hud-br { bottom: 18px; right: 18px; text-align: right; }

  .hud-val { color: var(--neon-cyan); text-shadow: 0 0 8px rgba(0,240,255,0.5); }
  .hud-mag { color: var(--neon-magenta); text-shadow: 0 0 8px rgba(255,0,170,0.5); }
  .hud-lime { color: var(--neon-lime); }
  .hud-amber { color: var(--neon-amber); }

  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 20px; height: 20px;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,240,255,0.7);
    box-shadow: 0 0 6px var(--neon-cyan);
  }
  #crosshair::before { width: 10px; height: 1px; top: 50%; left: 5px; }
  #crosshair::after { width: 1px; height: 10px; left: 50%; top: 5px; }

  #interact-prompt {
    position: absolute; top: 58%; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; letter-spacing: 0.25em;
    color: var(--neon-lime);
    text-shadow: 0 0 12px rgba(184,255,0,0.6);
    opacity: 0; transition: opacity 0.2s;
    white-space: nowrap;
    background: rgba(0,0,0,0.5); padding: 6px 14px;
    border: 1px solid rgba(184,255,0,0.3);
  }
  #interact-prompt.show { opacity: 1; }

  #message-log {
    position: absolute; bottom: 70px; left: 18px;
    width: min(420px, 70vw); max-height: 140px;
    overflow: hidden; font-size: 11px; line-height: 1.7;
  }
  #message-log .msg {
    opacity: 0; animation: msg-in 0.4s forwards;
    color: rgba(0,240,255,0.75); margin-bottom: 2px;
  }
  #message-log .msg.story { color: var(--neon-amber); }
  #message-log .msg.secret { color: var(--neon-violet); }
  #message-log .msg.system { color: var(--neon-lime); }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #minimap {
    position: absolute; top: 16px; right: 18px;
    width: 120px; height: 120px;
    border: 1px solid rgba(0,240,255,0.3);
    background: rgba(0,10,14,0.75);
    box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,240,255,0.03);
    image-rendering: pixelated;
  }

  #district-banner {
    position: absolute; top: 40%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(20px, 5vw, 48px);
    font-weight: 700; letter-spacing: 0.4em;
    color: transparent;
    -webkit-text-stroke: 1px var(--neon-magenta);
    text-shadow: 0 0 40px rgba(255,0,170,0.4);
    opacity: 0; pointer-events: none;
    transition: opacity 0.8s;
    white-space: nowrap;
  }
  #district-banner.show { opacity: 1; }

  /* TERMINAL PANEL */
  #terminal-panel {
    position: fixed; z-index: 50;
    top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
    width: min(560px, 92vw); max-height: 70vh;
    background: rgba(2,8,10,0.95);
    border: 1px solid var(--neon-cyan);
    box-shadow: 0 0 60px rgba(0,240,255,0.2), 0 0 120px rgba(0,0,0,0.8);
    opacity: 0; visibility: hidden;
    transition: all 0.3s;
    pointer-events: auto;
    display: flex; flex-direction: column;
  }
  #terminal-panel.open {
    opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1);
  }
  .term-header {
    padding: 10px 14px; border-bottom: 1px solid rgba(0,240,255,0.25);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; letter-spacing: 0.2em;
  }
  .term-close {
    cursor: pointer; color: var(--neon-magenta); font-size: 14px;
    pointer-events: auto; padding: 2px 8px;
    border: 1px solid transparent;
  }
  .term-close:hover { border-color: var(--neon-magenta); }
  .term-body {
    padding: 16px; font-size: 12px; line-height: 1.8;
    overflow-y: auto; color: #7ec8b8; flex: 1;
  }
  .term-body h3 { color: var(--neon-cyan); letter-spacing: 0.15em; margin-bottom: 8px; font-size: 13px; }
  .term-body .hl { color: var(--neon-lime); }
  .term-body .sec { color: var(--neon-violet); }
  .term-body .warn { color: var(--neon-amber); }

  /* SCANLINES + VIGNETTE */
  #fx-layer {
    position: fixed; inset: 0; z-index: 15; pointer-events: none;
  }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.12) 2px,
      rgba(0,0,0,0.12) 4px
    );
    opacity: 0.4;
  }
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.65) 100%);
  }
  .chromatic {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,0,100,0.015), transparent 30%, transparent 70%, rgba(0,200,255,0.02));
  }
  .rain-glass {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity 2s;
    background-image:
      radial-gradient(1px 8px at 10% 20%, rgba(200,230,255,0.15), transparent),
      radial-gradient(1px 12px at 30% 60%, rgba(200,230,255,0.1), transparent),
      radial-gradient(1px 6px at 50% 10%, rgba(200,230,255,0.12), transparent),
      radial-gradient(1px 10px at 70% 40%, rgba(200,230,255,0.1), transparent),
      radial-gradient(1px 8px at 90% 80%, rgba(200,230,255,0.12), transparent);
    background-size: 200px 200px;
    animation: rain-shift 0.4s linear infinite;
  }
  .rain-glass.active { opacity: 1; }
  @keyframes rain-shift {
    0% { background-position: 0 0, 40px 20px, 80px 0, 120px 40px, 160px 10px; }
    100% { background-position: 0 200px, 40px 220px, 80px 200px, 120px 240px, 160px 210px; }
  }

  #compass {
    position: absolute; bottom: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: 10px; letter-spacing: 0.3em;
    color: rgba(0,240,255,0.45);
  }

  #speed-lines {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity 0.2s;
    background: repeating-linear-gradient(
      90deg,
      transparent 0, transparent 48%,
      rgba(0,240,255,0.03) 49%,
      transparent 51%, transparent 100%
    );
    background-size: 8px 100%;
  }
  #speed-lines.on { opacity: 1; }

  .glitch-text {
    animation: glitch 3s infinite;
  }
  @keyframes glitch {
    0%,90%,100% { transform: none; opacity: 1; }
    92% { transform: translate(-2px,1px); opacity: 0.8; }
    94% { transform: translate(2px,-1px); }
    96% { transform: translate(-1px,0); opacity: 0.9; }
  }
</style>
</head>
<body>

<div id="boot-screen">
  <div class="boot-logo">NEONGLYPH</div>
  <div class="boot-sub">LIVING ASCII METROPOLIS v0.9</div>
  <div class="boot-log" id="boot-log"></div>
  <button class="boot-prompt" id="enter-btn" style="display:none">[ ENTER THE GRID ]</button>
  <div class="boot-hint" id="boot-hint" style="display:none">CLICK · WASD MOVE · SHIFT SPRINT · E INTERACT · F FLASHLIGHT · M MAP</div>
</div>

<div id="fx-layer">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="chromatic"></div>
  <div class="rain-glass" id="rain-glass"></div>
  <div id="speed-lines"></div>
</div>

<canvas id="game-canvas"></canvas>
<div id="ascii-overlay" aria-hidden="true"></div>

<div id="hud">
  <div class="hud-corner hud-tl">
    <div>NODE <span class="hud-val" id="hud-node">00-A</span></div>
    <div>DISTRICT <span class="hud-mag" id="hud-district">BOOTSTRAPS</span></div>
    <div>CYCLE <span class="hud-val" id="hud-time">00:00</span></div>
    <div>WX <span class="hud-lime" id="hud-weather">CLEAR</span></div>
  </div>
  <div class="hud-corner hud-bl">
    <div>POS <span class="hud-val" id="hud-pos">0,0</span></div>
    <div>VEL <span class="hud-val" id="hud-vel">0.0</span></div>
    <div>DISC <span class="hud-amber" id="hud-discoveries">0</span>/12</div>
  </div>
  <div class="hud-corner hud-br">
    <div id="hud-hint">E · INTERACT</div>
    <div style="margin-top:4px;opacity:0.5">F · LIGHT · H · HELP</div>
  </div>
  <canvas id="minimap" width="120" height="120"></canvas>
  <div id="crosshair"></div>
  <div id="interact-prompt"></div>
  <div id="message-log"></div>
  <div id="district-banner"></div>
  <div id="compass">N</div>
</div>

<div id="terminal-panel">
  <div class="term-header">
    <span id="term-title">// TERMINAL</span>
    <span class="term-close" id="term-close">[X]</span>
  </div>
  <div class="term-body" id="term-body"></div>
</div>

<script>
/**
 * NEONGLYPH — Living ASCII 3D City
 * Original cyber-fantasy metropolis rendered through glyph light.
 */
(function () {
  'use strict';

  // ═══════════════════════════════════════════
  // CONFIG
  // ═══════════════════════════════════════════
  const CFG = {
    CITY_SIZE: 180,
    BLOCK: 18,
    ROAD_W: 6,
    MAX_BUILDING_H: 55,
    FOV: 72,
    MOVE_SPEED: 12,
    SPRINT_MULT: 2.1,
    MOUSE_SENS: 0.0022,
    GRAVITY: 30,
    PLAYER_H: 1.7,
    RENDER_SCALE: 0.45,
    ASCII_COLS: 140,
    ASCII_ROWS: 48,
    FOG_NEAR: 8,
    FOG_FAR: 95,
    RAIN_COUNT: 1200,
    NPC_COUNT: 48,
    CAR_COUNT: 22,
    SIGN_FLICKER: 0.02,
  };

  const CHARSETS = {
    dense: '█▓▒░$@%#*+=~-:·. ',
    building: '█▓▒#HPMW&%8@*',
    window: '▪▫■□▪·:·',
    neon: '◆◇◈◉●○▲△▼▽★☆✦✧',
    rain: '|!¦│ㅣ',
    road: '═─━ rec·.',
    far: '·.· ',
    motion: '≈~⁓-_',
  };

  // ═══════════════════════════════════════════
  // STATE
  // ═══════════════════════════════════════════
  const state = {
    ready: false,
    playing: false,
    time: 0,
    dayPhase: 0.72, // start night-ish
    weather: 'clear', // clear | rain | storm | fog
    weatherTimer: 0,
    discoveries: new Set(),
    currentDistrict: null,
    flashlight: false,
    terminalOpen: false,
    keys: {},
    velocity: new THREE.Vector3(),
    canJump: true,
    yaw: 0,
    pitch: -0.05,
    pointerLocked: false,
    interactTarget: null,
    messages: [],
    lastDistrictBanner: '',
    ambientEventTimer: 40,
    trainT: 0,
    secretsFound: 0,
    helpSeen: false,
  };

  // ═══════════════════════════════════════════
  // AUDIO (procedural, no assets)
  // ═══════════════════════════════════════════
  const AudioSys = {
    ctx: null,
    master: null,
    rainNode: null,
    droneNodes: [],
    init() {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.18;
        this.master.connect(this.ctx.destination);
        this._drone();
        this._cityHum();
      } catch (e) { /* silent */ }
    },
    resume() {
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    _drone() {
      if (!this.ctx) return;
      const freqs = [55, 82.5, 110, 165];
      freqs.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const lfo = this.ctx.createOscillator();
        const lfoG = this.ctx.createGain();
        osc.type = i % 2 ? 'sine' : 'triangle';
        osc.frequency.value = f;
        lfo.frequency.value = 0.05 + i * 0.03;
        lfoG.gain.value = 8 + i * 2;
        lfo.connect(lfoG);
        lfoG.connect(osc.frequency);
        g.gain.value = 0.04 - i * 0.006;
        osc.connect(g);
        g.connect(this.master);
        osc.start();
        lfo.start();
        this.droneNodes.push({ osc, g });
      });
    },
    _cityHum() {
      if (!this.ctx) return;
      const bufferSize = 2 * this.ctx.sampleRate;
      const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      const noise = this.ctx.createBufferSource();
      noise.buffer = noiseBuffer;
      noise.loop = true;
      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 400;
      const g = this.ctx.createGain();
      g.gain.value = 0.025;
      noise.connect(filter);
      filter.connect(g);
      g.connect(this.master);
      noise.start();
    },
    setRain(on) {
      if (!this.ctx) return;
      if (on && !this.rainNode) {
        const bs = 2 * this.ctx.sampleRate;
        const buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < bs; i++) d[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass'; hp.frequency.value = 1200;
        const g = this.ctx.createGain();
        g.gain.value = 0.0;
        g.gain.linearRampToValueAtTime(0.06, this.ctx.currentTime + 2);
        src.connect(hp); hp.connect(g); g.connect(this.master);
        src.start();
        this.rainNode = { src, g };
      } else if (!on && this.rainNode) {
        const g = this.rainNode.g;
        g.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 2);
        const node = this.rainNode;
        this.rainNode = null;
        setTimeout(() => { try { node.src.stop(); } catch(_){} }, 2500);
      }
    },
    blip(freq = 880, dur = 0.08, type = 'square', vol = 0.06) {
      if (!this.ctx) return;
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
      o.connect(g); g.connect(this.master);
      o.start(); o.stop(this.ctx.currentTime + dur);
    },
    discover() {
      this.blip(660, 0.1, 'sine', 0.08);
      setTimeout(() => this.blip(990, 0.15, 'sine', 0.06), 100);
      setTimeout(() => this.blip(1320, 0.2, 'triangle', 0.05), 220);
    },
  };

  // ═══════════════════════════════════════════
  // UTIL
  // ═══════════════════════════════════════════
  function hash(x, z) {
    let h = (x * 374761393 + z * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function noise2(x, z) {
    const ix = Math.floor(x), iz = Math.floor(z);
    const fx = x - ix, fz = z - iz;
    const a = hash(ix, iz), b = hash(ix + 1, iz);
    const c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
    const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
    return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

  // ═══════════════════════════════════════════
  // DISTRICTS
  // ═══════════════════════════════════════════
  const DISTRICTS = [
    {
      id: 'bootstrap', name: 'BOOTSTRAP WARD',
      color: 0x00f0ff, neon: 0x00f0ff,
      cx: 0, cz: 0, radius: 40,
      style: 'corporate',
      blurb: 'Where the first daemons compiled the skyline.',
    },
    {
      id: 'glyphmarket', name: 'GLYPH MARKET',
      color: 0xff00aa, neon: 0xff66cc,
      cx: 55, cz: 20, radius: 35,
      style: 'market',
      blurb: 'Vendors trade luminous characters by the kilo.',
    },
    {
      id: 'nullwharf', name: 'NULL WHARF',
      color: 0x4488ff, neon: 0x66aaff,
      cx: -50, cz: 40, radius: 38,
      style: 'industrial',
      blurb: 'Cargo glyphs drift on black-water canals.',
    },
    {
      id: 'echoheights', name: 'ECHO HEIGHTS',
      color: 0xaa66ff, neon: 0xcc88ff,
      cx: 30, cz: -55, radius: 36,
      style: 'residential',
      blurb: 'Tower stacks whisper unfinished poems.',
    },
    {
      id: 'rustliturgy', name: 'RUST LITURGY',
      color: 0xffaa00, neon: 0xffcc44,
      cx: -40, cz: -45, radius: 34,
      style: 'temple',
      blurb: 'Old machines kneel to newer gods.',
    },
    {
      id: 'underindex', name: 'UNDER-INDEX',
      color: 0xb8ff00, neon: 0xccff44,
      cx: 0, cz: 70, radius: 30,
      style: 'underground',
      blurb: 'The subway dreams in monospaced tongues.',
    },
  ];

  function getDistrict(x, z) {
    let best = DISTRICTS[0], bestD = Infinity;
    for (const d of DISTRICTS) {
      const dx = x - d.cx, dz = z - d.cz;
      const dist = Math.sqrt(dx * dx + dz * dz) / d.radius;
      if (dist < bestD) { bestD = dist; best = d; }
    }
    return best;
  }

  // ═══════════════════════════════════════════
  // THREE.JS SETUP
  // ═══════════════════════════════════════════
  const canvas = document.getElementById('game-canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(window.innerWidth * CFG.RENDER_SCALE, window.innerHeight * CFG.RENDER_SCALE, false);
  canvas.style.width = '100%';
  canvas.style.height = '100%';
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.autoClear = true;
  renderer.setClearColor(0x03060a);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050a12, 0.018);

  const camera = new THREE.PerspectiveCamera(CFG.FOV, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(3, CFG.PLAYER_H, 14);
  state.yaw = 0.4;

  // Low-res ASCII target
  const asciiRT = new THREE.WebGLRenderTarget(CFG.ASCII_COLS * 2, Math.floor(CFG.ASCII_COLS * 2 * (window.innerHeight / window.innerWidth)));
  asciiRT.texture.minFilter = THREE.NearestFilter;
  asciiRT.texture.magFilter = THREE.NearestFilter;

  // Final orthographic composite
  const compCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const compScene = new THREE.Scene();

  // ═══════════════════════════════════════════
  // ASCII SHADER COMPOSITE
  // ═══════════════════════════════════════════
  const asciiMaterial = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: null },
      resolution: { value: new THREE.Vector2(CFG.ASCII_COLS, 50) },
      time: { value: 0 },
      rain: { value: 0 },
      flash: { value: 0 },
      dayPhase: { value: 0.7 },
      glitch: { value: 0 },
      motion: { value: 0 },
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 resolution;
      uniform float time;
      uniform float rain;
      uniform float flash;
      uniform float dayPhase;
      uniform float glitch;
      uniform float motion;
      varying vec2 vUv;

      float lum(vec3 c){ return dot(c, vec3(0.299,0.587,0.114)); }

      float hash21(vec2 p){
        p = fract(p*vec2(123.34,456.21));
        p += dot(p,p+45.32);
        return fract(p.x*p.y);
      }

      // Procedural mini-glyphs inside each cell (no texture atlas needed)
      float glyphShape(vec2 uv, float level) {
        // uv in 0..1 inside cell
        float s = 0.0;
        // block body
        if (level > 0.85) {
          s = step(0.08, uv.x) * step(uv.x, 0.92) * step(0.08, uv.y) * step(uv.y, 0.92);
        } else if (level > 0.72) {
          // @ -like
          float cx = length(uv - vec2(0.5));
          s = smoothstep(0.38, 0.32, cx) - smoothstep(0.24, 0.18, cx);
          s += step(0.55, uv.x) * step(uv.x, 0.78) * step(0.35, uv.y) * step(uv.y, 0.55);
        } else if (level > 0.60) {
          // # 
          s = step(0.28, uv.x)*step(uv.x,0.40)*step(0.12,uv.y)*step(uv.y,0.88);
          s = max(s, step(0.60, uv.x)*step(uv.x,0.72)*step(0.12,uv.y)*step(uv.y,0.88));
          s = max(s, step(0.12, uv.x)*step(uv.x,0.88)*step(0.30,uv.y)*step(uv.y,0.40));
          s = max(s, step(0.12, uv.x)*step(uv.x,0.88)*step(0.60,uv.y)*step(uv.y,0.70));
        } else if (level > 0.48) {
          // H
          s = step(0.18, uv.x)*step(uv.x,0.32)*step(0.1,uv.y)*step(uv.y,0.9);
          s = max(s, step(0.68, uv.x)*step(uv.x,0.82)*step(0.1,uv.y)*step(uv.y,0.9));
          s = max(s, step(0.18, uv.x)*step(uv.x,0.82)*step(0.42,uv.y)*step(uv.y,0.58));
        } else if (level > 0.38) {
          // *
          float d1 = abs((uv.x-0.5)+(uv.y-0.5));
          float d2 = abs((uv.x-0.5)-(uv.y-0.5));
          float d3 = abs(uv.x-0.5);
          float d4 = abs(uv.y-0.5);
          s = step(d1, 0.08) + step(d2, 0.08) + step(d3, 0.06)*step(abs(uv.y-0.5),0.28) + step(d4,0.06)*step(abs(uv.x-0.5),0.28);
          s = clamp(s, 0.0, 1.0);
        } else if (level > 0.28) {
          // +
          s = step(abs(uv.x-0.5), 0.08)*step(abs(uv.y-0.5), 0.32);
          s = max(s, step(abs(uv.y-0.5), 0.08)*step(abs(uv.x-0.5), 0.32));
        } else if (level > 0.20) {
          // =
          s = step(0.15,uv.x)*step(uv.x,0.85)*step(0.32,uv.y)*step(uv.y,0.42);
          s = max(s, step(0.15,uv.x)*step(uv.x,0.85)*step(0.58,uv.y)*step(uv.y,0.68));
        } else if (level > 0.14) {
          // :
          s = step(length(uv-vec2(0.5,0.32)), 0.08) + step(length(uv-vec2(0.5,0.68)), 0.08);
        } else if (level > 0.08) {
          // -
          s = step(0.2,uv.x)*step(uv.x,0.8)*step(0.42,uv.y)*step(uv.y,0.58);
        } else if (level > 0.04) {
          // .
          s = step(length(uv-vec2(0.5,0.35)), 0.07);
        } else {
          s = 0.0;
        }
        // motion smear variants
        if (motion > 0.5 && level > 0.1) {
          float wave = sin(uv.y * 18.0 + time * 20.0) * 0.5 + 0.5;
          s = max(s * 0.7, wave * step(0.2, uv.x) * step(uv.x, 0.8) * level);
        }
        return clamp(s, 0.0, 1.0);
      }

      void main() {
        vec2 uv = vUv;

        // Mild glitch offset
        if (glitch > 0.01) {
          float g = hash21(vec2(floor(uv.y*40.0), floor(time*12.0)));
          if (g > 1.0 - glitch) uv.x += (g - 0.5) * 0.05 * glitch;
        }

        // Cell snap for chunky ASCII feel
        vec2 cellRes = resolution;
        vec2 cell = floor(uv * cellRes);
        vec2 cellUv = (cell + 0.5) / cellRes;
        vec2 sub = fract(uv * cellRes);

        // Sample neighborhood for slight edge awareness
        vec4 texel = texture2D(tDiffuse, cellUv);
        float L = lum(texel.rgb);

        // Quantize luminance into glyph tiers; jitter by cell for organic feel
        float jitter = (hash21(cell + floor(time * 0.5)) - 0.5) * 0.06;
        float level = clamp(L + jitter, 0.0, 1.0);

        float shape = glyphShape(sub, level);

        // Neon boost from saturated scene color
        float neon = smoothstep(0.25, 0.85, max(texel.r, max(texel.g, texel.b)));
        vec3 base = texel.rgb;

        // Night / day palette lean
        float night = 0.0;
        if (dayPhase < 0.25 || dayPhase > 0.75) night = 1.0;
        else if (dayPhase < 0.35) night = 1.0 - (dayPhase-0.25)/0.1;
        else if (dayPhase > 0.65) night = (dayPhase-0.65)/0.1;

        vec3 nightTint = vec3(0.55, 0.9, 1.15);
        vec3 dayTint = vec3(1.05, 0.95, 0.85);
        base *= mix(dayTint, nightTint, night);

        // Glyph body
        vec3 col = base * (0.12 + shape * (1.3 + neon * 1.6));
        // empty cell gets faint grid so city never goes pure black
        col += vec3(0.02, 0.04, 0.05) * (1.0 - shape) * (0.3 + L);

        // Bright bloom on lit glyphs
        float bright = max(0.0, L - 0.5);
        col += base * bright * bright * 2.2 * shape;

        // Horizontal scan inside glyph
        col *= 0.82 + 0.18 * step(0.5, fract(sub.y * 3.0 + time * 0.0));

        // Rain streaks as falling pipes
        if (rain > 0.01) {
          float ry = cell.y + time * (22.0 + rain * 12.0);
          float rx = hash21(vec2(cell.x, floor(ry)));
          if (rx > 0.96 - rain * 0.04) {
            float streak = step(0.35, sub.x) * step(sub.x, 0.55);
            col += vec3(0.35, 0.5, 0.65) * rain * streak * (0.4 + 0.6 * fract(ry));
          }
          // wet ground shimmer near bottom of view
          if (uv.y < 0.35) {
            float shimmer = sin(uv.x * 80.0 + time * 6.0 + L * 10.0) * 0.5 + 0.5;
            col += base * shimmer * 0.12 * rain * (1.0 - uv.y / 0.35);
          }
        }

        // Fog wash
        float depthApprox = 1.0 - L; // dark often = far fog in our palette
        col = mix(col, vec3(0.04, 0.07, 0.1), depthApprox * 0.08);

        // Lightning flash
        col += vec3(flash * 0.4);

        // Chromatic micro-offset on neon edges
        if (neon > 0.5 && shape > 0.5) {
          col.r += 0.05 * neon;
          col.b += 0.04 * neon;
        }

        // Vignette
        vec2 vc = vUv - 0.5;
        float vig = 1.0 - dot(vc, vc) * 1.15;
        col *= vig;

        // Terminal cast
        col = mix(col, vec3(col.g*0.15 + col.b*0.1, col.g*0.95 + col.r*0.05, col.b*0.95 + col.g*0.1), 0.22);

        // Subtle CRT curvature darkening at corners already via vignette
        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });

  const compQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), asciiMaterial);
  compScene.add(compQuad);

  // ═══════════════════════════════════════════
  // LIGHTING
  // ═══════════════════════════════════════════
  const ambientLight = new THREE.AmbientLight(0x1a2030, 0.35);
  scene.add(ambientLight);

  const hemiLight = new THREE.HemisphereLight(0x0a1a30, 0x050208, 0.5);
  scene.add(hemiLight);

  const moonLight = new THREE.DirectionalLight(0x6688aa, 0.35);
  moonLight.position.set(-30, 80, 20);
  scene.add(moonLight);

  // Player flashlight
  const flashlight = new THREE.SpotLight(0xaaccff, 0, 28, Math.PI / 7, 0.4, 1.2);
  flashlight.position.set(0, 0, 0);
  camera.add(flashlight);
  const flashTarget = new THREE.Object3D();
  flashTarget.position.set(0, 0, -10);
  camera.add(flashTarget);
  flashlight.target = flashTarget;
  scene.add(camera);

  // Dynamic neon point lights pool
  const neonLights = [];
  for (let i = 0; i < 24; i++) {
    const c = [0x00f0ff, 0xff00aa, 0xb8ff00, 0xffaa00, 0xaa66ff, 0xff4488][i % 6];
    const pl = new THREE.PointLight(c, 1.2, 22, 1.5);
    pl.userData.baseIntensity = 1.0 + Math.random() * 0.8;
    pl.userData.phase = Math.random() * Math.PI * 2;
    pl.userData.flicker = Math.random() > 0.7;
    scene.add(pl);
    neonLights.push(pl);
  }

  // ═══════════════════════════════════════════
  // MATERIALS
  // ═══════════════════════════════════════════
  function makeMat(color, emissive = 0x000000, emInt = 0, opacity = 1) {
    return new THREE.MeshStandardMaterial({
      color, emissive, emissiveIntensity: emInt,
      roughness: 0.75, metalness: 0.25,
      transparent: opacity < 1, opacity,
      flatShading: true,
    });
  }

  const mats = {
    asphalt: makeMat(0x0c0e12),
    sidewalk: makeMat(0x161a22),
    building: makeMat(0x0e1218, 0x111820, 0.15),
    buildingDark: makeMat(0x080a0e),
    glass: makeMat(0x1a3040, 0x226688, 0.4, 0.85),
    neonCyan: makeMat(0x003344, 0x00f0ff, 2.5),
    neonMag: makeMat(0x330022, 0xff00aa, 2.5),
    neonLime: makeMat(0x223300, 0xb8ff00, 2.2),
    neonAmber: makeMat(0x332200, 0xffaa00, 2.2),
    neonViolet: makeMat(0x1a0033, 0xaa66ff, 2.2),
    carBody: makeMat(0x111318, 0x224466, 0.3),
    windowLit: makeMat(0x1a1810, 0xffcc66, 1.2),
    windowDark: makeMat(0x0a0c10),
    water: makeMat(0x0a1520, 0x113344, 0.5, 0.75),
    rail: makeMat(0x222428, 0x445566, 0.2),
    signBoard: makeMat(0x0a0a0c),
  };

  const neonMatList = [mats.neonCyan, mats.neonMag, mats.neonLime, mats.neonAmber, mats.neonViolet];

  // Shared geometries
  const geo = {
    box: new THREE.BoxGeometry(1, 1, 1),
    plane: new THREE.PlaneGeometry(1, 1),
    cyl: new THREE.CylinderGeometry(0.5, 0.5, 1, 6),
    sphere: new THREE.SphereGeometry(0.5, 6, 6),
    cone: new THREE.ConeGeometry(0.5, 1, 5),
  };

  // ═══════════════════════════════════════════
  // CITY GENERATION
  // ═══════════════════════════════════════════
  const cityGroup = new THREE.Group();
  scene.add(cityGroup);

  const colliders = []; // {minx,maxx,minz,maxz,miny,maxy}
  const interactables = [];
  const animatedSigns = [];
  const windowMeshes = [];
  const buildings = [];

  function addCollider(x, z, w, d, h = 50, y = 0) {
    colliders.push({
      minx: x - w / 2, maxx: x + w / 2,
      minz: z - d / 2, maxz: z + d / 2,
      miny: y, maxy: y + h,
    });
  }

  function createBuilding(x, z, w, d, h, district) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);

    const style = district.style;
    const baseMat = style === 'industrial' ? mats.buildingDark : mats.building;
    const body = new THREE.Mesh(geo.box, baseMat.clone());
    body.material.color.offsetHSL(0, 0, (hash(x|0,z|0) - 0.5) * 0.05);
    body.scale.set(w, h, d);
    body.position.y = h / 2;
    g.add(body);

    // Setbacks / terraces
    if (h > 20 && hash(x|0, z|0 + 3) > 0.4) {
      const sh = h * (0.15 + hash(x|0,z|0+1) * 0.25);
      const top = new THREE.Mesh(geo.box, baseMat);
      top.scale.set(w * 0.7, sh, d * 0.7);
      top.position.y = h + sh / 2;
      g.add(top);
      h += sh;
    }

    // Roof antenna / glyph spire
    if (h > 15 && hash(x|0, z|0 + 7) > 0.5) {
      const spire = new THREE.Mesh(geo.cyl, pick(neonMatList));
      spire.scale.set(0.15, 2 + hash(x|0,z|0) * 4, 0.15);
      spire.position.y = h + spire.scale.y / 2;
      g.add(spire);
      const tip = new THREE.Mesh(geo.sphere, pick(neonMatList));
      tip.scale.setScalar(0.35);
      tip.position.y = h + spire.scale.y + 0.2;
      g.add(tip);
    }

    // Windows grid — denser on street faces, culled for performance
    const floors = Math.max(2, Math.floor(h / 2.8));
    const winW = Math.max(2, Math.floor(w / 2.0));
    const winD = Math.max(2, Math.floor(d / 2.0));

    for (let face = 0; face < 4; face++) {
      const isZ = face < 2;
      const sign = face % 2 === 0 ? 1 : -1;
      const count = isZ ? winW : winD;
      const faceW = isZ ? w : d;
      // Skip some rear faces on short buildings
      if (h < 12 && face > 1 && hash(x|0, z|0 + face) > 0.5) continue;
      for (let fl = 1; fl < floors; fl++) {
        for (let wi = 0; wi < count; wi++) {
          const litChance = style === 'residential' ? 0.4 : style === 'corporate' ? 0.55 : 0.3;
          const isLit = hash((x*10+wi)|0, (z*10+fl*3+face)|0) < litChance;
          if (!isLit && hash(wi, fl + face) > 0.55) continue;
          const wm = isLit ? mats.windowLit.clone() : mats.windowDark;
          if (isLit) {
            const hue = hash(x + wi, z + fl);
            if (hue > 0.7) wm.emissive = new THREE.Color(0x66ccff);
            else if (hue > 0.4) wm.emissive = new THREE.Color(0xffcc66);
            else wm.emissive = new THREE.Color(0xff88aa);
            wm.emissiveIntensity = 0.6 + hash(fl, wi) * 1.2;
          }
          const win = new THREE.Mesh(geo.box, wm);
          const spacing = faceW / (count + 1);
          const offset = -faceW / 2 + spacing * (wi + 1);
          win.scale.set(isZ ? 0.7 : 0.08, 1.0, isZ ? 0.08 : 0.7);
          const py = fl * (h / floors) + 0.5;
          if (isZ) win.position.set(offset, py, sign * (d / 2 + 0.05));
          else win.position.set(sign * (w / 2 + 0.05), py, offset);
          g.add(win);
          if (isLit && windowMeshes.length < 800) windowMeshes.push({ mesh: win, phase: hash(x+wi,z+fl) * 100, fl });
        }
      }
    }

    // Neon vertical strip
    if (hash(x|0, z|0 + 11) > 0.55) {
      const strip = new THREE.Mesh(geo.box, pick(neonMatList));
      const side = hash(x|0,z|0) > 0.5;
      strip.scale.set(side ? 0.12 : w * 0.9, h * 0.7, side ? d * 0.9 : 0.12);
      strip.position.set(side ? w/2+0.08 : 0, h * 0.45, side ? 0 : d/2+0.08);
      g.add(strip);
    }

    // Street-level storefront
    if (h > 8) {
      const store = new THREE.Mesh(geo.box, pick(neonMatList));
      store.scale.set(w * 0.6, 1.4, 0.1);
      store.position.set(0, 1.5, d / 2 + 0.1);
      g.add(store);
      animatedSigns.push({ mesh: store, base: store.material.emissiveIntensity || 2, phase: Math.random() * 10, type: 'store' });
    }

    // Billboard on tall buildings
    if (h > 25 && hash(x|0, z|0 + 13) > 0.6) {
      const board = new THREE.Mesh(geo.box, mats.signBoard);
      board.scale.set(w * 0.8, 3, 0.2);
      board.position.set(0, h * 0.6, d / 2 + 0.3);
      g.add(board);
      const neonFace = new THREE.Mesh(geo.box, pick(neonMatList));
      neonFace.scale.set(w * 0.7, 2.4, 0.08);
      neonFace.position.set(0, h * 0.6, d / 2 + 0.42);
      g.add(neonFace);
      animatedSigns.push({
        mesh: neonFace, base: 2.5, phase: Math.random() * 20,
        type: 'billboard',
        texts: pick([
          ['NEONGLYPH', 'BUY CHAR', 'LIVE /\\'],
          ['ECHO.NET', 'DREAM_OS', 'v∞.0'],
          ['NULL/SAFE', 'WHARF 7', 'DOCK//'],
          ['RUST SONG', 'PRAY_CPU', 'AMEN'],
          ['INDEX>GO', 'SUBWAY', '↓↓↓'],
          ['GLYPH¥88', 'FRESH', '*****'],
        ]),
      });
    }

    cityGroup.add(g);
    addCollider(x, z, w * 0.95, d * 0.95, h + 5);
    buildings.push({ x, z, w, d, h, district: district.id });
    return g;
  }

  function createSignpost(x, z, text, colorMat) {
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    const pole = new THREE.Mesh(geo.cyl, mats.rail);
    pole.scale.set(0.1, 3.5, 0.1);
    pole.position.y = 1.75;
    g.add(pole);
    const board = new THREE.Mesh(geo.box, colorMat || pick(neonMatList));
    board.scale.set(2.5, 0.8, 0.12);
    board.position.y = 3.6;
    g.add(board);
    cityGroup.add(g);
    animatedSigns.push({ mesh: board, base: 2.2, phase: Math.random() * 15, type: 'post', label: text });
    return g;
  }

  function buildRoadsAndBlocks() {
    const half = CFG.CITY_SIZE / 2;
    const step = CFG.BLOCK;

    // Ground plane
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(CFG.CITY_SIZE * 1.4, CFG.CITY_SIZE * 1.4),
      mats.asphalt
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    cityGroup.add(ground);

    // Sidewalk grid patches and buildings
    for (let gx = -half; gx < half; gx += step) {
      for (let gz = -half; gz < half; gz += step) {
        const cx = gx + step / 2;
        const cz = gz + step / 2;
        const district = getDistrict(cx, cz);
        const hNoise = noise2(cx * 0.03, cz * 0.03);
        const edgeDist = Math.min(half - Math.abs(cx), half - Math.abs(cz)) / half;

        // Road cross — leave center of each block edge open
        // Building footprint inset from roads
        const margin = CFG.ROAD_W / 2 + 1;
        const bw = step - CFG.ROAD_W - 2 - hash(gx|0, gz|0) * 3;
        const bd = step - CFG.ROAD_W - 2 - hash(gx|0+1, gz|0) * 3;

        if (bw < 4 || bd < 4) continue;

        // Plaza / park voids
        const isPlaza = hash(gx|0, gz|0 + 99) > 0.88;
        const isCanal = district.id === 'nullwharf' && hash(gx|0, gz|0 + 50) > 0.7;

        if (isCanal) {
          const water = new THREE.Mesh(geo.box, mats.water);
          water.scale.set(bw, 0.3, bd);
          water.position.set(cx, -0.1, cz);
          cityGroup.add(water);
          // Dock posts
          for (let i = 0; i < 3; i++) {
            const post = new THREE.Mesh(geo.cyl, mats.rail);
            post.scale.set(0.2, 2, 0.2);
            post.position.set(cx + (i - 1) * 2, 1, cz + bd / 2 - 0.5);
            cityGroup.add(post);
          }
          continue;
        }

        if (isPlaza) {
          const plaza = new THREE.Mesh(geo.box, mats.sidewalk);
          plaza.scale.set(bw, 0.15, bd);
          plaza.position.set(cx, 0.08, cz);
          cityGroup.add(plaza);
          // Monument
          const mon = new THREE.Mesh(geo.cone, pick(neonMatList));
          mon.scale.set(1.5, 4 + hash(gx|0,gz|0) * 4, 1.5);
          mon.position.set(cx, mon.scale.y / 2, cz);
          cityGroup.add(mon);
          createSignpost(cx + bw/3, cz + bd/3, 'PLAZA', mats.neonCyan);
          continue;
        }

        // Multi-building per block sometimes
        const split = hash(gx|0, gz|0 + 20) > 0.7 && bw > 8;
        const heights = {
          corporate: 18 + hNoise * 40,
          market: 8 + hNoise * 18,
          industrial: 12 + hNoise * 22,
          residential: 14 + hNoise * 28,
          temple: 10 + hNoise * 20,
          underground: 6 + hNoise * 12,
        };
        let bh = (heights[district.style] || 15) * (0.5 + edgeDist * 0.5);
        bh = clamp(bh, 5, CFG.MAX_BUILDING_H);

        // Temple special: stepped pyramid
        if (district.style === 'temple' && hash(gx|0, gz|0 + 33) > 0.75) {
          const tiers = 4;
          for (let t = 0; t < tiers; t++) {
            const tw = bw * (1 - t * 0.18);
            const td = bd * (1 - t * 0.18);
            const th = 3 + t * 0.5;
            const tier = new THREE.Mesh(geo.box, t === tiers - 1 ? mats.neonAmber : mats.buildingDark);
            tier.scale.set(tw, th, td);
            tier.position.set(cx, t * 3 + th / 2 + 0.1, cz);
            cityGroup.add(tier);
          }
          addCollider(cx, cz, bw * 0.9, bd * 0.9, 16);
          continue;
        }

        if (split) {
          const gap = 1.5;
          const w1 = bw * 0.45;
          createBuilding(cx - w1 / 2 - gap / 2, cz, w1, bd * 0.85, bh * (0.6 + hash(gx|0,gz|0)*0.5), district);
          createBuilding(cx + w1 / 2 + gap / 2, cz, w1, bd * 0.9, bh * (0.5 + hash(gx|0+2,gz|0)*0.6), district);
        } else {
          createBuilding(cx, cz, bw * 0.85, bd * 0.85, bh, district);
        }

        // Alley props
        if (hash(gx|0, gz|0 + 44) > 0.6) {
          const dump = new THREE.Mesh(geo.box, mats.buildingDark);
          dump.scale.set(1.2, 1.0, 0.8);
          dump.position.set(cx + bw / 2 - 1, 0.5, cz + bd / 2 + CFG.ROAD_W / 4);
          cityGroup.add(dump);
        }
      }
    }

    // Road center lines (emissive strips)
    for (let i = -half; i <= half; i += step) {
      const lineZ = new THREE.Mesh(geo.box, mats.neonCyan);
      lineZ.material = mats.neonCyan.clone();
      lineZ.material.emissiveIntensity = 0.35;
      lineZ.scale.set(0.15, 0.02, CFG.CITY_SIZE);
      lineZ.position.set(i + step / 2, 0.03, 0);
      // only along road centers roughly
    }

    // Main avenues glowing rails
    const avenuePositions = [-step, 0, step * 2];
    avenuePositions.forEach((pos, idx) => {
      const mat = neonMatList[idx % neonMatList.length].clone();
      mat.emissiveIntensity = 0.4;
      const roadGlow = new THREE.Mesh(geo.box, mat);
      roadGlow.scale.set(0.4, 0.04, CFG.CITY_SIZE * 0.9);
      roadGlow.position.set(pos, 0.04, 0);
      cityGroup.add(roadGlow);
      const roadGlow2 = new THREE.Mesh(geo.box, mat);
      roadGlow2.scale.set(CFG.CITY_SIZE * 0.9, 0.04, 0.4);
      roadGlow2.position.set(0, 0.04, pos);
      cityGroup.add(roadGlow2);
    });

    // Street lamps
    for (let lx = -half + 4; lx < half; lx += step) {
      for (let lz = -half + 4; lz < half; lz += step) {
        if (hash(lx|0, lz|0 + 60) < 0.35) continue;
        // Place near road edges
        const offsets = [
          [CFG.ROAD_W / 2 + 0.5, 0],
          [0, CFG.ROAD_W / 2 + 0.5],
        ];
        const [ox, oz] = offsets[(hash(lx|0,lz|0)*2)|0];
        const lamp = new THREE.Group();
        const pole = new THREE.Mesh(geo.cyl, mats.rail);
        pole.scale.set(0.08, 4.5, 0.08);
        pole.position.y = 2.25;
        lamp.add(pole);
        const lightMat = pick(neonMatList);
        const bulb = new THREE.Mesh(geo.sphere, lightMat);
        bulb.scale.setScalar(0.3);
        bulb.position.y = 4.6;
        lamp.add(bulb);
        lamp.position.set(lx + ox, 0, lz + oz);
        cityGroup.add(lamp);
      }
    }

    // Elevated train track ring
    const trackR = 48;
    const trackSegs = 48;
    for (let i = 0; i < trackSegs; i++) {
      const a0 = (i / trackSegs) * Math.PI * 2;
      const a1 = ((i + 1) / trackSegs) * Math.PI * 2;
      const x0 = Math.cos(a0) * trackR, z0 = Math.sin(a0) * trackR;
      const x1 = Math.cos(a1) * trackR, z1 = Math.sin(a1) * trackR;
      const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
      const len = Math.hypot(x1 - x0, z1 - z0);
      const beam = new THREE.Mesh(geo.box, mats.rail);
      beam.scale.set(len, 0.3, 1.2);
      beam.position.set(mx, 12, mz);
      beam.rotation.y = -a0 - Math.PI / 2;
      cityGroup.add(beam);
      // Pillar every few
      if (i % 4 === 0) {
        const pillar = new THREE.Mesh(geo.box, mats.buildingDark);
        pillar.scale.set(0.8, 12, 0.8);
        pillar.position.set(x0, 6, z0);
        cityGroup.add(pillar);
        addCollider(x0, z0, 1.2, 1.2, 12);
      }
    }

    // District gate arches
    DISTRICTS.forEach((d) => {
      if (d.id === 'bootstrap') return;
      const ang = Math.atan2(d.cz, d.cx);
      const gx = Math.cos(ang) * (d.radius * 0.7);
      const gz = Math.sin(ang) * (d.radius * 0.7);
      const arch = new THREE.Group();
      const colL = new THREE.Mesh(geo.box, mats.building);
      colL.scale.set(0.8, 8, 0.8);
      colL.position.set(-4, 4, 0);
      const colR = colL.clone();
      colR.position.set(4, 4, 0);
      const top = new THREE.Mesh(geo.box, pick(neonMatList));
      top.scale.set(9, 1.2, 0.6);
      top.position.set(0, 8.5, 0);
      arch.add(colL, colR, top);
      arch.position.set(gx, 0, gz);
      arch.rotation.y = -ang + Math.PI / 2;
      cityGroup.add(arch);
      createSignpost(gx, gz + 3, d.name, neonMatList[DISTRICTS.indexOf(d) % neonMatList.length]);
    });

    // Place neon lights near buildings
    neonLights.forEach((pl, i) => {
      if (buildings.length === 0) return;
      const b = buildings[i % buildings.length];
      pl.position.set(
        b.x + (hash(i, 1) - 0.5) * b.w,
        3 + hash(i, 2) * Math.min(b.h, 20),
        b.z + b.d / 2 + 1
      );
    });

    // Floating holographic ASCII billboards (sprite-like planes with canvas textures)
    createHoloSigns();
    createSkylineBackdrop();
    createReflectivePuddles();
  }

  // ── Holographic text signs ──
  const holoSigns = [];
  function makeTextTexture(lines, color, w = 256, h = 128) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, w, h);
    ctx.font = 'bold 28px "IBM Plex Mono", monospace';
    ctx.textAlign = 'center';
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    ctx.fillStyle = color;
    lines.forEach((ln, i) => {
      ctx.fillText(ln, w / 2, 40 + i * 32);
    });
    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    for (let y = 0; y < h; y += 3) ctx.fillRect(0, y, w, 1);
    const tex = new THREE.CanvasTexture(c);
    tex.magFilter = THREE.NearestFilter;
    tex.minFilter = THREE.NearestFilter;
    return { tex, canvas: c, ctx, color, lines, w, h };
  }

  function createHoloSigns() {
    const signData = [
      { pos: [12, 6, 8], lines: ['NEONGLYPH', 'LIVE FEED'], color: '#00f0ff' },
      { pos: [50, 5, 22], lines: ['GLYPH ¥', 'MARKET'], color: '#ff00aa' },
      { pos: [-48, 5, 38], lines: ['NULL WHARF', 'DOCK 07'], color: '#66aaff' },
      { pos: [28, 7, -50], lines: ['ECHO', 'HEIGHTS'], color: '#cc88ff' },
      { pos: [-38, 6, -42], lines: ['RUST', 'LITURGY'], color: '#ffaa00' },
      { pos: [4, 4, 65], lines: ['UNDER-INDEX', '↓ LINE ∞'], color: '#b8ff00' },
      { pos: [-10, 8, 15], lines: ['EAT / SLEEP', '/ RENDER'], color: '#ff4488' },
      { pos: [35, 9, 5], lines: ['DREAM_OS', 'v∞.0'], color: '#00ffcc' },
      { pos: [-25, 5, -20], lines: ['NO CURSORS', 'BEYOND'], color: '#ffaa00' },
      { pos: [60, 6, -15], lines: ['FRESH', 'SERIFS'], color: '#ff00aa' },
      { pos: [-55, 4, -5], lines: ['DO NOT', 'RENDER'], color: '#ff2244' },
      { pos: [15, 10, -25], lines: ['THE SETTER', 'WAS HERE'], color: '#aa66ff' },
    ];
    signData.forEach((sd, i) => {
      const { tex, canvas, ctx, color, lines, w, h } = makeTextTexture(sd.lines, sd.color);
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0.9,
        side: THREE.DoubleSide, depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), mat);
      mesh.position.set(sd.pos[0], sd.pos[1], sd.pos[2]);
      scene.add(mesh);
      // glow backing
      const back = new THREE.Mesh(geo.box, pick(neonMatList).clone());
      back.scale.set(6.2, 3.2, 0.1);
      back.position.copy(mesh.position);
      back.position.z -= 0.15;
      back.material.emissiveIntensity = 0.6;
      scene.add(back);
      holoSigns.push({ mesh, back, canvas, ctx, color, lines, w, h, tex, phase: i * 1.7, frame: 0 });
    });
  }

  function updateHoloSigns(dt) {
    holoSigns.forEach((s) => {
      s.mesh.lookAt(camera.position.x, s.mesh.position.y, camera.position.z);
      s.back.lookAt(camera.position.x, s.back.position.y, camera.position.z);
      s.frame += dt;
      // Flicker / cycle text occasionally
      if (s.frame > 2.5 + (s.phase % 3)) {
        s.frame = 0;
        const glitchChars = '█▓▒░ ent@#*+';
        s.ctx.fillStyle = '#000';
        s.ctx.fillRect(0, 0, s.w, s.h);
        s.ctx.font = 'bold 28px "IBM Plex Mono", monospace';
        s.ctx.textAlign = 'center';
        s.ctx.shadowColor = s.color;
        s.ctx.shadowBlur = 14;
        s.ctx.fillStyle = s.color;
        const glitching = Math.random() < 0.25;
        s.lines.forEach((ln, i) => {
          let t = ln;
          if (glitching) {
            t = ln.split('').map(ch => Math.random() < 0.3 ? glitchChars[(Math.random() * glitchChars.length) | 0] : ch).join('');
          }
          s.ctx.fillText(t, s.w / 2, 40 + i * 32);
        });
        s.ctx.fillStyle = 'rgba(0,0,0,0.25)';
        for (let y = 0; y < s.h; y += 3) s.ctx.fillRect(0, y, s.w, 1);
        s.tex.needsUpdate = true;
      }
      s.mesh.material.opacity = 0.75 + 0.2 * Math.sin(state.time * 2 + s.phase);
    });
  }

  // ── Distant skyline silhouette ──
  function createSkylineBackdrop() {
    const g = new THREE.Group();
    for (let i = 0; i < 60; i++) {
      const ang = (i / 60) * Math.PI * 2;
      const r = CFG.CITY_SIZE * 0.72 + hash(i, 0) * 15;
      const h = 8 + hash(i, 1) * 35;
      const w = 2 + hash(i, 2) * 5;
      const mesh = new THREE.Mesh(geo.box, mats.buildingDark);
      mesh.scale.set(w, h, w);
      mesh.position.set(Math.cos(ang) * r, h / 2, Math.sin(ang) * r);
      g.add(mesh);
      if (hash(i, 3) > 0.5) {
        const light = new THREE.Mesh(geo.box, pick(neonMatList));
        light.scale.set(w * 0.9, 0.4, 0.2);
        light.position.set(Math.cos(ang) * r, h * (0.5 + hash(i,4)*0.4), Math.sin(ang) * r);
        g.add(light);
      }
    }
    scene.add(g);
  }

  // ── Ground puddle reflections (emissive planes) ──
  function createReflectivePuddles() {
    for (let i = 0; i < 30; i++) {
      const x = (hash(i, 90) - 0.5) * CFG.CITY_SIZE * 0.85;
      const z = (hash(i, 91) - 0.5) * CFG.CITY_SIZE * 0.85;
      if (solidAt(x, z, 2)) continue;
      const puddle = new THREE.Mesh(
        geo.plane,
        new THREE.MeshStandardMaterial({
          color: 0x0a1520,
          emissive: new THREE.Color().setHSL(hash(i, 92) * 0.2 + 0.5, 0.6, 0.25),
          emissiveIntensity: 0.35,
          roughness: 0.25,
          metalness: 0.9,
          transparent: true,
          opacity: 0.55,
        })
      );
      puddle.rotation.x = -Math.PI / 2;
      puddle.scale.set(2 + hash(i, 93) * 4, 1 + hash(i, 94) * 3, 1);
      puddle.position.set(x, 0.05, z);
      puddle.userData.baseEm = 0.35;
      cityGroup.add(puddle);
      animatedSigns.push({ mesh: puddle, base: 0.35, phase: i, type: 'puddle' });
    }
  }

  const train = new THREE.Group();

    for (let c = 0; c < 4; c++) {

    state.trainT += dt * 0.08;

  function updateDrones(dt) {
    drones.forEach((d) => {
      d.angle += d.speed * dt;
      d.mesh.position.x = Math.cos(d.angle) * d.radius;
      d.mesh.position.z = Math.sin(d.angle) * d.radius * 0.85;
      d.mesh.position.y = d.height + Math.sin(state.time * 2 + d.bob) * 0.8;
      d.mesh.rotation.y = -d.angle + Math.PI / 2;
      d.mesh.rotation.z = Math.sin(state.time * 3 + d.bob) * 0.1;
    });
  }

  // ═══════════════════════════════════════════
  // VEHICLES
  // ═══════════════════════════════════════════
  const cars = [];

  function spawnCars() {
    const half = CFG.CITY_SIZE / 2 - 10;
    const lanes = [];
    for (let i = -half; i <= half; i += CFG.BLOCK) {
      lanes.push({ axis: 'x', z: i + CFG.BLOCK / 2, dir: 1 });
      lanes.push({ axis: 'x', z: i + CFG.BLOCK / 2, dir: -1 });
      lanes.push({ axis: 'z', x: i + CFG.BLOCK / 2, dir: 1 });
      lanes.push({ axis: 'z', x: i + CFG.BLOCK / 2, dir: -1 });
    }
    for (let i = 0; i < CFG.CAR_COUNT; i++) {
      const lane = lanes[i % lanes.length];
      const g = new THREE.Group();
      const body = new THREE.Mesh(geo.box, mats.carBody.clone());
      body.material.color = new THREE.Color().setHSL(hash(i, 0), 0.3, 0.12);
      body.scale.set(2.2, 0.7, 1.1);
      body.position.y = 0.55;
      g.add(body);
      const cabin = new THREE.Mesh(geo.box, mats.glass);
      cabin.scale.set(1.2, 0.55, 1.0);
      cabin.position.set(-0.2, 1.1, 0);
      g.add(cabin);
      // Headlights
      const hl = new THREE.Mesh(geo.box, mats.neonAmber);
      hl.scale.set(0.15, 0.15, 0.8);
      hl.position.set(1.1, 0.5, 0);
      g.add(hl);
      const tl = new THREE.Mesh(geo.box, mats.neonMag);
      tl.scale.set(0.1, 0.12, 0.7);
      tl.position.set(-1.1, 0.5, 0);
      g.add(tl);

      const speed = 6 + Math.random() * 10;
      let x, z;
      if (lane.axis === 'x') {
        x = (Math.random() - 0.5) * CFG.CITY_SIZE * 0.8;
        z = lane.z + lane.dir * 1.2;
      } else {
        z = (Math.random() - 0.5) * CFG.CITY_SIZE * 0.8;
        x = lane.x + lane.dir * 1.2;
      }
      g.position.set(x, 0, z);
      scene.add(g);
      cars.push({ mesh: g, lane, speed, offset: Math.random() * 100 });
    }
  }

  function updateCars(dt) {
    const half = CFG.CITY_SIZE / 2 - 5;
    cars.forEach((c) => {
      if (c.lane.axis === 'x') {
        c.mesh.position.x += c.lane.dir * c.speed * dt;
        c.mesh.rotation.y = c.lane.dir > 0 ? 0 : Math.PI;
        if (c.mesh.position.x > half) c.mesh.position.x = -half;
        if (c.mesh.position.x < -half) c.mesh.position.x = half;
      } else {
        c.mesh.position.z += c.lane.dir * c.speed * dt;
        c.mesh.rotation.y = c.lane.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
        if (c.mesh.position.z > half) c.mesh.position.z = -half;
        if (c.mesh.position.z < -half) c.mesh.position.z = half;
      }
      // Bobble
      c.mesh.position.y = Math.sin(state.time * 8 + c.offset) * 0.02;
    });
  }

  const npcs = [];
  const NPC_NAMES = [

    'Railbone', 'Moth.exe', 'Sen', 'Quill', 'Ion', 'Parchment',

  function spawnNPCs() {
    for (let i = 0; i < CFG.NPC_COUNT; i++) {
      const g = new THREE.Group();
      const mat = pick(neonMatList).clone();
      mat.emissiveIntensity = 0.8 + Math.random() * 0.8;
      // Body as stacked ASCII-ish blocks
      const torso = new THREE.Mesh(geo.box, mat);
      torso.scale.set(0.4, 0.7, 0.25);
      torso.position.y = 1.0;
      g.add(torso);
      const head = new THREE.Mesh(geo.box, mat);
      head.scale.set(0.28, 0.28, 0.28);
      head.position.y = 1.55;
      g.add(head);
      const legL = new THREE.Mesh(geo.box, mats.buildingDark);
      legL.scale.set(0.12, 0.55, 0.12);
      legL.position.set(-0.1, 0.3, 0);
      g.add(legL);
      const legR = legL.clone();
      legR.position.x = 0.1;
      g.add(legR);

      const x = (Math.random() - 0.5) * CFG.CITY_SIZE * 0.7;
      const z = (Math.random() - 0.5) * CFG.CITY_SIZE * 0.7;

      scene.add(g);

      npcs.push({
        mesh: g,
        legL, legR, head,
        name: NPC_NAMES[i % NPC_NAMES.length],
        line: NPC_LINES[i % NPC_LINES.length],
        tx: x + (Math.random() - 0.5) * 20,
        tz: z + (Math.random() - 0.5) * 20,
        speed: 1.2 + Math.random() * 1.8,
        phase: Math.random() * 20,
        pause: 0,
        district: null,
      });
    }
  }

  function updateNPCs(dt) {
    npcs.forEach((n) => {
      if (n.pause > 0) {
        n.pause -= dt;
        n.legL.rotation.x = 0;
        n.legR.rotation.x = 0;
        return;
      }
      const dx = n.tx - n.mesh.position.x;
      const dz = n.tz - n.mesh.position.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.5) {
        n.pause = 1 + Math.random() * 4;
        n.tx = n.mesh.position.x + (Math.random() - 0.5) * 30;
        n.tz = n.mesh.position.z + (Math.random() - 0.5) * 30;
        n.tx = clamp(n.tx, -CFG.CITY_SIZE/2+5, CFG.CITY_SIZE/2-5);
        n.tz = clamp(n.tz, -CFG.CITY_SIZE/2+5, CFG.CITY_SIZE/2-5);
        // Avoid buildings roughly
        return;
      }
      const sp = n.speed * dt;
      const nx = n.mesh.position.x + (dx / dist) * sp;
      const nz = n.mesh.position.z + (dz / dist) * sp;
      // Simple collision slide
      if (!solidAt(nx, n.mesh.position.z, 0.3)) n.mesh.position.x = nx;
      else n.tx = n.mesh.position.x + (Math.random() - 0.5) * 20;
      if (!solidAt(n.mesh.position.x, nz, 0.3)) n.mesh.position.z = nz;
      else n.tz = n.mesh.position.z + (Math.random() - 0.5) * 20;

      n.mesh.rotation.y = Math.atan2(dx, dz);
      const walk = state.time * 8 + n.phase;
      n.legL.rotation.x = Math.sin(walk) * 0.6;
      n.legR.rotation.x = Math.sin(walk + Math.PI) * 0.6;
      n.head.position.y = 1.55 + Math.sin(walk * 0.5) * 0.02;
    });
  }

  // ═══════════════════════════════════════════
  // RAIN
  // ═══════════════════════════════════════════
  let rainSystem = null;
  function createRain() {
    const count = CFG.RAIN_COUNT;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 100;
      positions[i * 3 + 1] = Math.random() * 50;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({
      color: 0x88aacc,
      size: 0.15,
      transparent: true,
      opacity: 0.55,
      depthWrite: false,
    });
    rainSystem = new THREE.Points(geom, mat);
    rainSystem.visible = false;
    scene.add(rainSystem);
  }

  function updateRain(dt) {
    if (!rainSystem) return;
    const raining = state.weather === 'rain' || state.weather === 'storm';
    rainSystem.visible = raining;
    document.getElementById('rain-glass').classList.toggle('active', raining);
    AudioSys.setRain(raining);
    if (!raining) return;
    const pos = rainSystem.geometry.attributes.position.array;
    const speed = state.weather === 'storm' ? 45 : 28;
    const px = camera.position.x, pz = camera.position.z;
    for (let i = 0; i < pos.length; i += 3) {
      pos[i + 1] -= speed * dt * (0.7 + (i % 5) * 0.1);
      pos[i] -= dt * 3;
      if (pos[i + 1] < 0) {
        pos[i + 1] = 30 + Math.random() * 20;
        pos[i] = px + (Math.random() - 0.5) * 60;
        pos[i + 2] = pz + (Math.random() - 0.5) * 60;
      }
    }
    rainSystem.geometry.attributes.position.needsUpdate = true;
    rainSystem.position.set(0, 0, 0);
  }

  // FOG PARTICLES / FLOATING GLYPHS
  // ═══════════════════════════════════════════
  let glyphField = null;
  function createGlyphField() {
    const count = 400;
    const pos = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
      pos[i*3] = (Math.random()-0.5) * CFG.CITY_SIZE;
      pos[i*3+1] = 2 + Math.random() * 40;
      pos[i*3+2] = (Math.random()-0.5) * CFG.CITY_SIZE;
    }
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.PointsMaterial({
      color: 0x00f0ff, size: 0.25, transparent: true, opacity: 0.35,
      depthWrite: false, blending: THREE.AdditiveBlending,
    });
    glyphField = new THREE.Points(geom, mat);
    scene.add(glyphField);
  }

  function updateGlyphField(dt) {
    if (!glyphField) return;
    glyphField.rotation.y += dt * 0.01;
    const op = state.weather === 'fog' ? 0.55 : 0.25;
    glyphField.material.opacity = op + Math.sin(state.time * 0.5) * 0.08;
  }

    scene.add(marker);
    const obj = { x, y, z, radius, id, title, content, kind, mesh: marker, found: false };
    interactables.push(obj);
    return obj;

  // ═══════════════════════════════════════════
  // COLLISION
  // ═══════════════════════════════════════════
  function solidAt(x, z, r = 0.4) {
    for (let i = 0; i < colliders.length; i++) {
      const c = colliders[i];
      if (x + r > c.minx && x - r < c.maxx && z + r > c.minz && z - r < c.maxz) return true;
    }
    return false;
  }

  function moveWithCollision(pos, dx, dz) {
    const r = 0.45;
    const nx = pos.x + dx;
    const nz = pos.z + dz;
    if (!solidAt(nx, pos.z, r)) pos.x = nx;
    if (!solidAt(pos.x, nz, r)) pos.z = nz;
    // Bounds
    const b = CFG.CITY_SIZE / 2 - 2;
    pos.x = clamp(pos.x, -b, b);
    pos.z = clamp(pos.z, -b, b);
  }

  // ═══════════════════════════════════════════
  // WEATHER & DAY CYCLE
  // ═══════════════════════════════════════════
  function updateDayNight(dt) {
    state.dayPhase = (state.dayPhase + dt * 0.008) % 1; // full cycle ~2 min
    const p = state.dayPhase;
    // 0 = midnight, 0.25 = dawn, 0.5 = noon, 0.75 = dusk
    const night = p < 0.2 || p > 0.8 ? 1 : p < 0.3 ? 1 - (p - 0.2) / 0.1 : p > 0.7 ? (p - 0.7) / 0.1 : 0;
    const day = 1 - night;

    const fogCol = new THREE.Color().setHSL(0.6, 0.3, lerp(0.03, 0.12, day));
    if (state.weather === 'fog') fogCol.setHSL(0.55, 0.15, 0.06);
    if (state.weather === 'storm') fogCol.setHSL(0.65, 0.2, 0.025);
    scene.fog.color.copy(fogCol);
    scene.fog.density = state.weather === 'fog' ? 0.035 : state.weather === 'storm' ? 0.025 : lerp(0.016, 0.008, day);
    renderer.setClearColor(fogCol);

    ambientLight.intensity = lerp(0.25, 0.7, day);
    hemiLight.intensity = lerp(0.4, 0.9, day);
    moonLight.intensity = lerp(0.4, 0.05, day);
    moonLight.color.setHSL(0.6, 0.2, lerp(0.6, 0.9, day));

    // Window lights stronger at night
    const winBoost = lerp(0.3, 1.2, night);
    windowMeshes.forEach((w) => {
      if (w.mesh.material.emissiveIntensity !== undefined) {
        const flicker = w.fl && Math.sin(state.time * 0.7 + w.phase) > 0.95 ? 0.3 : 1;
        w.mesh.material.emissiveIntensity = (0.5 + Math.sin(state.time * 0.3 + w.phase) * 0.2) * winBoost * flicker;
      }
    });

    asciiMaterial.uniforms.dayPhase.value = p;
  }

  function updateWeather(dt) {
    state.weatherTimer -= dt;
    if (state.weatherTimer <= 0) {
      const roll = Math.random();
      const prev = state.weather;
      if (roll < 0.45) state.weather = 'clear';
      else if (roll < 0.7) state.weather = 'rain';
      else if (roll < 0.85) state.weather = 'fog';
      else state.weather = 'storm';
      state.weatherTimer = 40 + Math.random() * 50;
      if (prev !== state.weather) {
        logMsg('Weather shift: ' + state.weather.toUpperCase(), 'system');
        if (state.weather === 'storm') {
          asciiMaterial.uniforms.glitch.value = 0.3;
        }
      }
    }
    // Decay glitch
    if (asciiMaterial.uniforms.glitch.value > 0) {
      asciiMaterial.uniforms.glitch.value = Math.max(0, asciiMaterial.uniforms.glitch.value - dt * 0.15);
      // Lightning
      if (state.weather === 'storm' && Math.random() < 0.008) {
        asciiMaterial.uniforms.flash.value = 0.8;
        AudioSys.blip(80, 0.3, 'sawtooth', 0.04);
      }
    }
    if (asciiMaterial.uniforms.flash.value > 0) {
      asciiMaterial.uniforms.flash.value *= 0.9;
    }
    asciiMaterial.uniforms.rain.value = (state.weather === 'rain' || state.weather === 'storm') ? (state.weather === 'storm' ? 1 : 0.6) : 0;
  }
