  // ═══════════════════════════════════════════
  // UI HELPERS
  // ═══════════════════════════════════════════
  function logMsg(text, type = '') {
    const log = document.getElementById('message-log');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    div.textContent = '> ' + text;
    log.appendChild(div);
    while (log.children.length > 6) log.removeChild(log.firstChild);
    setTimeout(() => { if (div.parentNode) div.style.opacity = '0'; }, 8000);
  }

  function showDistrictBanner(name) {
    if (name === state.lastDistrictBanner) return;
    state.lastDistrictBanner = name;
    const el = document.getElementById('district-banner');
    el.textContent = name;
    el.classList.add('show');
    AudioSys.blip(440, 0.1, 'triangle', 0.04);
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function openTerminal(title, body) {
    state.terminalOpen = true;
    document.getElementById('term-title').textContent = title;
    document.getElementById('term-body').innerHTML = body;
    document.getElementById('terminal-panel').classList.add('open');
    document.exitPointerLock();
    AudioSys.blip(720, 0.06, 'square', 0.05);
  }

  function closeTerminal() {
    state.terminalOpen = false;
    document.getElementById('terminal-panel').classList.remove('open');
    if (state.playing) canvas.requestPointerLock();
  }

  function tryInteract() {
    if (state.terminalOpen) { closeTerminal(); return; }
    const t = state.interactTarget;
    if (!t) return;
    openTerminal(t.title, t.content);
    if (t.kind === 'secret' && !state.discoveries.has(t.id)) {
      state.discoveries.add(t.id);
      state.secretsFound = state.discoveries.size;
      document.getElementById('hud-discoveries').textContent = state.secretsFound;
      logMsg('Discovery unlocked: ' + t.title, 'secret');
      AudioSys.discover();
      if (t.mesh) t.mesh.material.emissive = new THREE.Color(0xaa66ff);
      if (state.secretsFound >= 12) {
        logMsg('ALL TWELVE TRUTHS FOUND. The Setter smiles somewhere.', 'story');
        // Victory sky pulse
        asciiMaterial.uniforms.flash.value = 1.0;
        asciiMaterial.uniforms.glitch.value = 0.5;
      }
    }
    // Side effects
    if (t.id === 'alley_club') {
      state.dayPhase = (state.dayPhase + 0.12) % 1;
      logMsg('Time slips. Dawn is closer.', 'story');
    }
    if (t.id === 'shop_noodles') {
      logMsg('Warmth spreads. The rain looks friendlier.', 'story');
    }
  }

  // ═══════════════════════════════════════════
  // MINIMAP
  // ═══════════════════════════════════════════
  const minimap = document.getElementById('minimap');
  const mmCtx = minimap.getContext('2d');

  function drawMinimap() {
    const W = 120, H = 120;
    mmCtx.fillStyle = 'rgba(0,8,12,0.9)';
    mmCtx.fillRect(0, 0, W, H);

    const scale = W / (CFG.CITY_SIZE * 1.1);
    const ox = W / 2, oy = H / 2;

    // Districts
    DISTRICTS.forEach((d) => {
      const c = '#' + d.color.toString(16).padStart(6, '0');
      mmCtx.strokeStyle = c;
      mmCtx.globalAlpha = 0.35;
      mmCtx.beginPath();
      mmCtx.arc(ox + d.cx * scale, oy + d.cz * scale, d.radius * scale, 0, Math.PI * 2);
      mmCtx.stroke();
      mmCtx.globalAlpha = 1;
    });

    // Buildings dots
    mmCtx.fillStyle = 'rgba(0,200,220,0.25)';
    buildings.forEach((b) => {
      mmCtx.fillRect(ox + b.x * scale - 1, oy + b.z * scale - 1, 2, 2);
    });

    // Secrets
    mmCtx.fillStyle = '#b8ff00';
    interactables.forEach((it) => {
      if (it.kind !== 'secret') return;
      mmCtx.globalAlpha = state.discoveries.has(it.id) ? 0.3 : 0.9;
      mmCtx.fillRect(ox + it.x * scale - 1.5, oy + it.z * scale - 1.5, 3, 3);
    });
    mmCtx.globalAlpha = 1;

    // Train
    mmCtx.fillStyle = '#ff00aa';
    mmCtx.beginPath();
    mmCtx.arc(ox + train.position.x * scale, oy + train.position.z * scale, 2, 0, Math.PI * 2);
    mmCtx.fill();

    // Player
    const px = ox + camera.position.x * scale;
    const pz = oy + camera.position.z * scale;
    mmCtx.save();
    mmCtx.translate(px, pz);
    mmCtx.rotate(-state.yaw);
    mmCtx.fillStyle = '#00f0ff';
    mmCtx.beginPath();
    mmCtx.moveTo(0, -5);
    mmCtx.lineTo(3, 4);
    mmCtx.lineTo(-3, 4);
    mmCtx.closePath();
    mmCtx.fill();
    mmCtx.restore();

    // Border
    mmCtx.strokeStyle = 'rgba(0,240,255,0.3)';
    mmCtx.strokeRect(0.5, 0.5, W - 1, H - 1);
  }

  // ═══════════════════════════════════════════
  // ASCII OVERLAY (DOM decorative layer)
  // ═══════════════════════════════════════════
  const asciiOverlay = document.getElementById('ascii-overlay');
  let overlayTick = 0;
  function updateAsciiOverlay() {
    overlayTick++;
    if (overlayTick % 5 !== 0) return;
    const cols = Math.min(120, Math.floor(window.innerWidth / 10));
    const rows = Math.min(40, Math.floor(window.innerHeight / 14));
    const dens = CHARSETS.dense;
    const raining = state.weather === 'rain' || state.weather === 'storm';
    let s = '';
    const t = state.time;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        // Sparse decorative field — denser at edges (vignette glyphs)
        const u = c / cols - 0.5, v = r / rows - 0.5;
        const edge = Math.abs(u) * 1.4 + Math.abs(v) * 1.1;
        const n = noise2(c * 0.12 + t * 0.15, r * 0.18 + t * 0.08);
        if (raining && n > 0.82 && c % 3 === (t * 10 | 0) % 3) {
          s += CHARSETS.rain[(r + (t * 15 | 0)) % CHARSETS.rain.length];
        } else if (edge > 0.55 && n > 0.55) {
          const idx = Math.floor((1 - edge + n) * 0.5 * (dens.length - 1));
          s += dens[clamp(idx, 0, dens.length - 1)];
        } else if (n > 0.88) {
          s += '·';
        } else {
          s += ' ';
        }
      }
      s += '\n';
    }
    asciiOverlay.textContent = s;
    asciiOverlay.style.opacity = raining ? '0.2' : (state.weather === 'fog' ? '0.18' : '0.1');
  }

  // ═══════════════════════════════════════════
  // PLAYER CONTROLS
  // ═══════════════════════════════════════════
  function updatePlayer(dt) {
    if (state.terminalOpen) return;

    const sprint = state.keys['ShiftLeft'] || state.keys['ShiftRight'];
    const speed = CFG.MOVE_SPEED * (sprint ? CFG.SPRINT_MULT : 1);
    const isMoving = state.keys['KeyW'] || state.keys['KeyA'] || state.keys['KeyS'] || state.keys['KeyD'];
    document.getElementById('speed-lines').classList.toggle('on', sprint && isMoving);
    asciiMaterial.uniforms.motion.value = lerp(asciiMaterial.uniforms.motion.value, (isMoving ? (sprint ? 1.0 : 0.4) : 0.0), clamp(dt * 6, 0, 1));

    const forward = new THREE.Vector3(-Math.sin(state.yaw), 0, -Math.cos(state.yaw));
    const right = new THREE.Vector3(Math.cos(state.yaw), 0, -Math.sin(state.yaw));

    let mx = 0, mz = 0;
    if (state.keys['KeyW'] || state.keys['ArrowUp']) { mx += forward.x; mz += forward.z; }
    if (state.keys['KeyS'] || state.keys['ArrowDown']) { mx -= forward.x; mz -= forward.z; }
    if (state.keys['KeyD'] || state.keys['ArrowRight']) { mx += right.x; mz += right.z; }
    if (state.keys['KeyA'] || state.keys['ArrowLeft']) { mx -= right.x; mz -= right.z; }

    const len = Math.hypot(mx, mz);
    if (len > 0) {
      mx = (mx / len) * speed * dt;
      mz = (mz / len) * speed * dt;
      moveWithCollision(camera.position, mx, mz);
    }

    // Gravity / ground
    state.velocity.y -= CFG.GRAVITY * dt;
    camera.position.y += state.velocity.y * dt;
    if (camera.position.y < CFG.PLAYER_H) {
      camera.position.y = CFG.PLAYER_H;
      state.velocity.y = 0;
      state.canJump = true;
    }
    if ((state.keys['Space']) && state.canJump) {
      state.velocity.y = 9;
      state.canJump = false;
      AudioSys.blip(200, 0.05, 'sine', 0.03);
    }

    // Apply look
    camera.rotation.order = 'YXZ';
    camera.rotation.y = state.yaw;
    camera.rotation.x = state.pitch;

    // Flashlight
    flashlight.intensity = state.flashlight ? 2.8 : 0;

    // Interact check
    let nearest = null, nearestD = 3.5;
    const px = camera.position.x, pz = camera.position.z;
    for (const it of interactables) {
      const d = Math.hypot(it.x - px, it.z - pz);
      if (d < it.radius && d < nearestD) { nearest = it; nearestD = d; }
    }
    // NPC talk
    for (const n of npcs) {
      const d = Math.hypot(n.mesh.position.x - px, n.mesh.position.z - pz);
      if (d < 2.2 && d < nearestD) {
        nearest = {
          title: '// CITIZEN: ' + n.name,
          content: `<h3>${n.name}</h3><p>"${n.line}"</p><p class="hl">They flicker, mid-stride, as if between frames.</p>`,
          kind: 'npc', id: 'npc_' + n.name, radius: 2, x: n.mesh.position.x, z: n.mesh.position.z,
        };
        nearestD = d;
      }
    }
    state.interactTarget = nearest;
    const prompt = document.getElementById('interact-prompt');
    if (nearest) {
      prompt.textContent = '[E] ' + (nearest.title || 'INTERACT');
      prompt.classList.add('show');
    } else prompt.classList.remove('show');

    // District
    const dist = getDistrict(px, pz);
    if (!state.currentDistrict || state.currentDistrict.id !== dist.id) {
      state.currentDistrict = dist;
      document.getElementById('hud-district').textContent = dist.name;
      showDistrictBanner(dist.name);
    }

    // Compass
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    let ang = ((-state.yaw + Math.PI * 2) % (Math.PI * 2));
    const di = Math.round(ang / (Math.PI / 4)) % 8;
    document.getElementById('compass').textContent = '· ' + dirs[di] + ' ·';
  }

  function updateHUD() {
    const p = state.dayPhase;
    const hours = Math.floor(p * 24);
    const mins = Math.floor((p * 24 - hours) * 60);
    document.getElementById('hud-time').textContent =
      String(hours).padStart(2, '0') + ':' + String(mins).padStart(2, '0');
    document.getElementById('hud-weather').textContent = state.weather.toUpperCase();
    document.getElementById('hud-pos').textContent =
      camera.position.x.toFixed(0) + ',' + camera.position.z.toFixed(0);
    const spd = Math.hypot(
      (state.keys['KeyW']||state.keys['KeyA']||state.keys['KeyS']||state.keys['KeyD']) ? 1 : 0
    );
    const sprint = state.keys['ShiftLeft'] || state.keys['ShiftRight'];
    document.getElementById('hud-vel').textContent = (spd ? (sprint ? CFG.MOVE_SPEED * CFG.SPRINT_MULT : CFG.MOVE_SPEED) : 0).toFixed(1);
    document.getElementById('hud-node').textContent =
      Math.abs(camera.position.x/20|0).toString(16).toUpperCase() +
      Math.abs(camera.position.z/20|0).toString(16).toUpperCase() + '-G';
  }

  // ═══════════════════════════════════════════
  // SIGNS ANIMATION
  // ═══════════════════════════════════════════
  function updateSigns(dt) {
    animatedSigns.forEach((s) => {
      const flicker = s.mesh.material;
      if (!flicker || flicker.emissiveIntensity === undefined) return;
      let inten = s.base;
      if (s.type === 'puddle') {
        const wet = (state.weather === 'rain' || state.weather === 'storm') ? 1.4 : 0.6;
        flicker.emissiveIntensity = inten * wet * (0.8 + 0.2 * Math.sin(state.time * 4 + s.phase));
        flicker.opacity = (state.weather === 'rain' || state.weather === 'storm') ? 0.7 : 0.35;
        return;
      }
      if (Math.random() < CFG.SIGN_FLICKER) inten *= 0.2 + Math.random() * 0.5;
      inten *= 0.85 + 0.15 * Math.sin(state.time * 3 + s.phase);
      if (s.type === 'billboard') {
        inten *= 0.9 + 0.2 * Math.sin(state.time * 1.5 + s.phase);
      }
      flicker.emissiveIntensity = inten;
    });

    // Neon lights pulse
    neonLights.forEach((pl) => {
      let i = pl.userData.baseIntensity * (0.75 + 0.25 * Math.sin(state.time * 2 + pl.userData.phase));
      if (pl.userData.flicker && Math.random() < 0.02) i *= 0.3;
      pl.intensity = i;
    });
  }

  // ═══════════════════════════════════════════
  // INPUT
  // ═══════════════════════════════════════════
  function setupInput() {
    document.addEventListener('keydown', (e) => {
      state.keys[e.code] = true;
      if (e.code === 'KeyE') tryInteract();
      if (e.code === 'KeyF') {
        state.flashlight = !state.flashlight;
        logMsg('Flashlight ' + (state.flashlight ? 'ON' : 'OFF'), 'system');
        AudioSys.blip(state.flashlight ? 600 : 300, 0.05, 'square', 0.04);
      }
      if (e.code === 'KeyH') {
        openTerminal('// HELP',
          `<h3>NEONGLYPH FIELD MANUAL</h3>
          <p><span class="hl">WASD</span> move · <span class="hl">SHIFT</span> sprint · <span class="hl">SPACE</span> jump</p>
          <p><span class="hl">MOUSE</span> look · <span class="hl">E</span> interact · <span class="hl">F</span> flashlight</p>
          <p><span class="hl">ESC</span> free cursor</p>
          <p>Six districts. Twelve discoveries. Living traffic, citizens, trains, weather.</p>
          <p class="sec">Find The Setter's traces. Sit in the monospaced garden.</p>
          <p class="warn">This city types itself. You are a cursor with legs.</p>`);
      }
      if (e.code === 'Escape' && state.terminalOpen) closeTerminal();
      if (e.code === 'KeyM') {
        // pulse minimap attention
        logMsg('Map: lime dots = secrets · magenta = train · cyan = you', 'system');
      }
    });
    document.addEventListener('keyup', (e) => { state.keys[e.code] = false; });

    canvas.addEventListener('click', () => {
      if (!state.playing) return;
      if (state.terminalOpen) return;
      canvas.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
      state.pointerLocked = document.pointerLockElement === canvas;
    });

    document.addEventListener('mousemove', (e) => {
      if (!state.pointerLocked || state.terminalOpen) return;
      state.yaw -= e.movementX * CFG.MOUSE_SENS;
      state.pitch -= e.movementY * CFG.MOUSE_SENS;
      state.pitch = clamp(state.pitch, -1.4, 1.4);
    });

    document.getElementById('term-close').addEventListener('click', closeTerminal);

    window.addEventListener('resize', onResize);
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth * CFG.RENDER_SCALE, window.innerHeight * CFG.RENDER_SCALE, false);
    const aspect = window.innerHeight / window.innerWidth;
    asciiRT.setSize(CFG.ASCII_COLS * 2, Math.floor(CFG.ASCII_COLS * 2 * aspect));
    asciiMaterial.uniforms.resolution.value.set(CFG.ASCII_COLS, Math.floor(CFG.ASCII_COLS * aspect * 0.55));
  }

  // ═══════════════════════════════════════════
  // BOOT SEQUENCE
  // ═══════════════════════════════════════════
  function boot() {
    const log = document.getElementById('boot-log');
    const lines = [
      '> mount /dev/neonglyph',
      '> compile skyline.shader … ok',
      '> seed districts [6] … ok',
      '> spawn traffic daemons … ok',
      '> index pedestrians … ok',
      '> schedule weather automata … ok',
      '> elevate train loop @ r=48 … ok',
      '> scatter truths [12] … ok',
      '> ascii lumen online',
      '> waiting for operator…',
    ];
    let i = 0;
    function next() {
      if (i < lines.length) {
        const d = document.createElement('div');
        d.textContent = lines[i];
        d.style.animationDelay = '0s';
        log.appendChild(d);
        i++;
        setTimeout(next, 120 + Math.random() * 100);
      } else {
        document.getElementById('enter-btn').style.display = 'block';
        document.getElementById('boot-hint').style.display = 'block';
      }
    }
    next();

    document.getElementById('enter-btn').addEventListener('click', startGame);
  }

  function startGame() {
    AudioSys.init();
    AudioSys.resume();
    document.getElementById('boot-screen').classList.add('hide');
    document.getElementById('hud').classList.add('show');
    state.playing = true;
    state.ready = true;
    // Ensure spawn not inside geometry
    camera.position.set(3, CFG.PLAYER_H, 14);
    if (solidAt(camera.position.x, camera.position.z, 0.6)) {
      camera.position.set(0, CFG.PLAYER_H, CFG.BLOCK / 2);
    }
    canvas.requestPointerLock();
    logMsg('Welcome to NEONGLYPH. You are a cursor with legs.', 'story');
    logMsg('Find twelve discoveries. Explore six districts.', 'system');
    setTimeout(() => logMsg('Press H for help. F for flashlight.', 'system'), 2000);
    setTimeout(() => logMsg('Lime markers hide truths. Follow the neon.', 'secret'), 5000);
  }

  // ═══════════════════════════════════════════
  // MAIN LOOP
  // ═══════════════════════════════════════════
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.08);
    state.time += dt;

    if (state.ready && state.playing) {
      updatePlayer(dt);
      updateCars(dt);
      updateNPCs(dt);
      updateTrain(dt);
      updateDrones(dt);
      updateRain(dt);
      updateGlyphField(dt);
      updateSigns(dt);
      updateHoloSigns(dt);
      updateDayNight(dt);
      updateWeather(dt);
      updateAmbientEvents(dt);
      updateHUD();
      drawMinimap();
      updateAsciiOverlay();

      // Bob while walking
      const walking = state.keys['KeyW'] || state.keys['KeyA'] || state.keys['KeyS'] || state.keys['KeyD'];
      if (walking && camera.position.y <= CFG.PLAYER_H + 0.05) {
        camera.position.y = CFG.PLAYER_H + Math.abs(Math.sin(state.time * 10)) * 0.06;
      }
    }

    asciiMaterial.uniforms.time.value = state.time;

    // Render scene to RT then composite with ASCII shader
    renderer.setRenderTarget(asciiRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);

    asciiMaterial.uniforms.tDiffuse.value = asciiRT.texture;
    // Fullscreen composite at display resolution
    renderer.setSize(window.innerWidth * CFG.RENDER_SCALE, window.innerHeight * CFG.RENDER_SCALE, false);
    renderer.render(compScene, compCamera);

    // Upscale via CSS already on canvas
  }

  // ═══════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════
  function init() {
    buildRoadsAndBlocks();
    spawnCars();
    spawnNPCs();
    spawnDrones();
    createRain();
    createGlyphField();
    placeSecrets();
    setupInput();
    onResize();
    boot();
    animate();
  }

  init();
})();
</script>
