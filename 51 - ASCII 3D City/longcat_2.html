<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NEON CITY // ASCII 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:none}
#ui{position:fixed;top:10px;left:10px;color:#0ff;font-size:12px;pointer-events:none;text-shadow:0 0 5px #0ff;z-index:10;line-height:1.6}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;font-size:20px;pointer-events:none;text-shadow:0 0 10px #0ff;z-index:10}
#interaction{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);color:#f0f;font-size:14px;display:none;pointer-events:none;text-shadow:0 0 8px #f0f;z-index:10;background:rgba(0,0,0,0.8);padding:8px 16px;border:1px solid #f0f}
#start{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#0ff;z-index:100;cursor:pointer}
#start h1{font-size:48px;text-shadow:0 0 20px #0ff;margin-bottom:20px;letter-spacing:4px}
#start p{font-size:16px;color:#888}
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="ui"></div>
<div id="crosshair">+</div>
<div id="interaction"></div>
<div id="start"><h1>NEON CITY</h1><p>Click to enter the grid</p></div>
<script>
const cvs=document.getElementById('screen'),ctx=cvs.getContext('2d');
const uiEl=document.getElementById('ui'),crosshair=document.getElementById('crosshair'),interactionEl=document.getElementById('interaction'),startEl=document.getElementById('start');
const W=160,H=60;
cvs.width=W;cvs.height=H;
const off=ctx.canvas,offCtx=off.getContext('2d');
off.width=W;off.height=H;
const imgData=offCtx.createImageData(W,H);
const buf=imgData.data;
const zbuf=new Float32Array(W*H);
const chars=' .,-~:;=!*#$@';
const keys={};
let mouseX=0,mouseY=0,locked=false;
let player={x:0,y:1.7,z:0,yaw:0,pitch:0,sprint:false};
let lastTime=0,deltaTime=0;
let timeOfDay=0.3;
let weather={rain:0,fog:0.3};
let city=null;
let entities=[];
let particles=[];
let interactables=[];
let secretsFound=0;
const SEED=42;
function rng(s){return function(){s=(s*9301+49297)%233280;return s/233280}}
let rand=rng(SEED);
class Vec3{constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z}add(v){return new Vec3(this.x+v.x,this.y+v.y,this.z+v.z)}sub(v){return new Vec3(this.x-v.x,this.y-v.y,this.z-v.z)}scale(s){return new Vec3(this.x*s,this.y*s,this.z*s)}dot(v){return this.x*v.x+this.y*v.y+this.z*v.z}cross(v){return new Vec3(this.y*v.z-this.z*v.y,this.z*v.x-this.x*v.z,this.x*v.y-this.y*v.x)}len(){return Math.sqrt(this.x*this.x+this.y*this.y+this.z*this.z)}norm(){const l=this.len();return l>0?new Vec3(this.x/l,this.y/l,this.z/l):new Vec3()}}
function project(p){const dx=p.x-player.x,dy=p.y-player.y,dz=p.z-player.z;const cy=Math.cos(-player.yaw),sy=Math.sin(-player.yaw);const x1=dx*cy-dz*sy;const z1=dx*sy+dz*cy;const cp=Math.cos(-player.pitch),sp=Math.sin(-player.pitch);const y1=dy*cp-z1*sp;const z2=dy*sp+z1*cp;if(z2<0.1)return null;const fov=1.5;const sx=(x1*fov/z2+1)*W/2;const sy=(-y1*fov/z2+1)*H/2;return{x:sx,y:sy,z:z2}}
function drawQuad(v0,v1,v2,v3,color,emissive=0){const p0=project(v0),p1=project(v1),p2=project(v2),p3=project(v3);if(!p0||!p1||!p2||!p3)return;const minX=Math.max(0,Math.min(p0.x,p1.x,p2.x,p3.x));const maxX=Math.min(W-1,Math.max(p0.x,p1.x,p2.x,p3.x));const minY=Math.max(0,Math.min(p0.y,p1.y,p2.y,p3.y));const maxY=Math.min(H-1,Math.max(p0.y,p1.y,p2.y,p3.y));const area=(p1.x-p0.x)*(p2.y-p0.y)-(p1.y-p0.y)*(p2.x-p0.x);if(Math.abs(area)<0.01)return;for(let y=minY;y<=maxY;y++){for(let x=minX;x<=maxX;x++){const px=x+0.5,py=y+0.5;const w0=((p1.x-px)*(p2.y-py)-(p1.y-py)*(p2.x-px))/area;const w1=((p2.x-px)*(p3.y-py)-(p2.y-py)*(p3.x-px))/area;const w2=((p3.x-px)*(p0.y-py)-(p3.y-py)*(p0.x-px))/area;const w3=1-w0-w1-w2;if(w0>=0&&w1>=0&&w2>=0&&w3>=0){const idx=y*W+x;const z=1/(w0/p0.z+w1/p1.z+w2/p2.z+w3/p3.z);if(z<zbuf[idx]){zbuf[idx]=z;const brightness=Math.min(1,0.2+emissive*0.8);const r=Math.floor(color[0]*brightness);const g=Math.floor(color[1]*brightness);const b=Math.floor(color[2]*brightness);const bidx=idx*4;buf[bidx]=r;buf[bidx+1]=g;buf[bidx+2]=b;buf[bidx+3]=255}}}}}
function generateCity(){const buildings=[];const roads=[];const signs=[];const blockSize=8;const citySize=12;for(let bx=-citySize;bx<citySize;bx++){for(let bz=-citySize;bz<citySize;bz++){const cx=bx*blockSize+blockSize/2;const cz=bz*blockSize+blockSize/2;const dist=Math.sqrt(bx*bx+bz*bz);let district='residential';if(dist<4)district='downtown';else if(dist<7)district='commercial';else if(bx>6&&bz<-6)district='industrial';else if(bx<-6&&bz>6)district='market';if(rand()<0.15)continue;const height=district==='downtown'?15+rand()*25:district==='commercial'?5+rand()*10:2+rand()*5;const width=3+rand()*3;const depth=3+rand()*3;const x=cx-width/2;const z=cz-depth/2;const colors={downtown:[[30,40,60],[40,50,70]],commercial:[[50,30,40],[60,40,50]],residential:[[30,35,45],[40,45,55]],industrial:[[40,35,30],[50,45,40]],market:[[45,30,50],[55,40,60]]};const col=colors[district];const ci=Math.floor(rand()*col.length);buildings.push({x,y:0,z,w:width,h:height,d:depth,color:col[ci],district,hasSign:rand()<0.3&&district!=='residential',signColor:[Math.floor(rand()*255),Math.floor(rand()*255),Math.floor(rand()*255)]})}if(bx>-citySize)roads.push({x1:(bx-1)*blockSize+blockSize/2,z1:bz*blockSize,x2:bx*blockSize+blockSize/2,z2:bz*blockSize,w:2});if(bz>-citySize)roads.push({x1:bx*blockSize,z1:(bz-1)*blockSize+blockSize/2,x2:bx*blockSize,z2:bz*blockSize+blockSize/2,w:2})}return{buildings,roads}}
function generateEntities(){const cars=[];const peds=[];for(let i=0;i<30;i++){const road=city.roads[Math.floor(rand()*city.roads.length)];cars.push({x:road.x1,z:road.z1,dir:rand()<0.5?1:-1,speed:3+rand()*3,color:[Math.floor(rand()*200)+55,Math.floor(rand()*100),Math.floor(rand()*100)]})}for(let i=0;i<50;i++){peds.push({x:(rand()-0.5)*150,z:(rand()-0.5)*150,speed:0.5+rand()*1,phase:rand()*Math.PI*2,color:[Math.floor(rand()*150)+100,Math.floor(rand()*150)+100,Math.floor(rand()*150)+100]})}return{cars,peds}}
function generateInteractables(){const ints=[];for(let i=0;i<15;i++){const b=city.buildings[Math.floor(rand()*city.buildings.length)];if(b.district!=='residential'){ints.push({x:b.x+b.w/2,z:b.z-0.5,type:rand()<0.5?'shop':'terminal',name:'SHOP-'+Math.floor(rand()*999),message:['Welcome, traveler','Neural interface available','Data fragment acquired','System access granted'][Math.floor(rand()*4)])}}}return ints}
function initGame(){city=generateCity();const ents=generateEntities();entities=ents.cars.concat(ents.peds);interactables=generateInteractables();player.x=0;player.z=0;player.yaw=0;player.pitch=0;secretsFound=0}
function update(dt){timeOfDay=(timeOfDay+dt*0.01)%1;if(timeOfDay<0.2||timeOfDay>0.8)weather.fog=0.5;else weather.fog=0.2;weather.rain=Math.sin(timeOfDay*Math.PI*2)*0.5+0.5;if(weather.rain<0.3)weather.rain=0;const speed=player.sprint?8:4;const cy=Math.cos(player.yaw),sy=Math.sin(player.yaw);let mx=0,mz=0;if(keys['w']){mx-=sy;mz-=cy}if(keys['s']){mx+=sy;mz+=cy}if(keys['a']){mx-=cy;mz+=sy}if(keys['d']){mx+=cy;mz-=sy}if(mx||mz){const l=Math.sqrt(mx*mx+mz*mz);mx/=l;mz/=l;const nx=player.x+mx*speed*dt;const nz=player.z+mz*speed*dt;let collision=false;for(const b of city.buildings){if(nx>b.x-0.5&&nx<b.x+b.w+0.5&&nz>b.z-0.5&&nz<b.z+b.d+0.5){collision=true;break}}if(!collision){player.x=nx;player.z=nz}}player.x=Math.max(-60,Math.min(60,player.x));player.z=Math.max(-60,Math.min(60,player.z));for(const e of entities){if(e.dir!==undefined){e.x+=e.dir*e.speed*dt;if(Math.abs(e.x)>60)e.dir*=-1;if(Math.abs(e.z)>60)e.dir*=-1}else{e.x+=Math.cos(e.phase)*e.speed*dt;e.z+=Math.sin(e.phase*0.7)*e.speed*dt;e.phase+=dt;if(Math.abs(e.x)>60)e.phase+=Math.PI;if(Math.abs(e.z)>60)e.phase+=Math.PI}}if(weather.rain>0){for(let i=0;i<5;i++){particles.push({x:player.x+(rand()-0.5)*20,y:player.y+5,z:player.z+(rand()-0.5)*20,vy:-15-rand()*10,life:1})}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.y+=p.vy*dt;p.life-=dt;if(p.life<=0||p.y<0)particles.splice(i,1)}}let closest=null;let closestDist=3;for(const it of interactables){const dx=it.x-player.x,dz=it.z-player.z;const dist=Math.sqrt(dx*dx+dz*dz);if(dist<closestDist){closestDist=dist;closest=it}}if(closest){interactionEl.style.display='block';interactionEl.textContent='[E] '+closest.name;if(keys['e']){keys['e']=false;secretsFound++;interactionEl.textContent=closest.message;setTimeout(()=>{interactionEl.style.display='none'},2000)}}else{interactionEl.style.display='none'}}
function render(){zbuf.fill(1e9);buf.fill(0);const ambient=timeOfDay>0.2&&timeOfDay<0.8?0.3:0.1;const skyColor=timeOfDay>0.2&&timeOfDay<0.8?[20,30,50]:[5,5,15];for(let i=0;i<W*H;i++){const idx=i*4;buf[idx]=skyColor[0];buf[idx+1]=skyColor[1];buf[idx+2]=skyColor[2];buf[idx+3]=255}for(const b of city.buildings){const dx=b.x+b.w/2-player.x;const dz=b.z+b.d/2-player.z;if(dx*dx+dz*dz>2500)continue;const v0=new Vec3(b.x,0,b.z),v1=new Vec3(b.x+b.w,0,b.z),v2=new Vec3(b.x+b.w,b.h,b.z),v3=new Vec3(b.x,b.h,b.z);const v4=new Vec3(b.x,0,b.z+b.d),v5=new Vec3(b.x+b.w,0,b.z+b.d),v6=new Vec3(b.x+b.w,b.h,b.z+b.d),v7=new Vec3(b.x,b.h,b.z+b.d);const fog=weather.fog;const fc=[10,15,25];const blend=(c)=>[c[0]*(1-fog)+fc[0]*fog,c[1]*(1-fog)+fc[1]*fog,c[2]*(1-fog)+fc[2]*fog];drawQuad(v0,v1,v2,v3,blend(b.color));drawQuad(v5,v4,v7,v6,blend(b.color));drawQuad(v4,v0,v3,v7,blend(b.color));drawQuad(v1,v5,v6,v2,blend(b.color));drawQuad(v3,v2,v6,v7,blend(b.color));if(b.hasSign){const signY=b.h-2;const signColor=[b.signColor[0],b.signColor[1],b.signColor[2]];drawQuad(new Vec3(b.x+0.1,signY,b.z-0.1),new Vec3(b.x+b.w-0.1,signY,b.z-0.1),new Vec3(b.x+b.w-0.1,signY+1,b.z-0.1),new Vec3(b.x+0.1,signY+1,b.z-0.1),signColor,1)}for(let wy=1;wy<b.h-1;wy+=2){for(let wx=0.5;wx<b.w-0.5;wx+=1.5){if(rand()<0.3){const wx2=b.x+wx;const wy2=wy+rand()*0.5;const wc=[255,200,100];drawQuad(new Vec3(wx2,wy2,b.z-0.05),new Vec3(wx2+0.8,wy2,b.z-0.05),new Vec3(wx2+0.8,wy2+0.6,b.z-0.05),new Vec3(wx2,wy2+0.6,b.z-0.05),wc,0.8)}}}}for(const e of entities){const dx=e.x-player.x;const dz=e.z-player.z;if(dx*dx+dz*dz>900)continue;if(e.dir!==undefined){const v0=new Vec3(e.x-0.4,0,e.z-0.2),v1=new Vec3(e.x+0.4,0,e.z-0.2),v2=new Vec3(e.x+0.4,0.8,e.z-0.2),v3=new Vec3(e.x-0.4,0.8,e.z-0.2);drawQuad(v0,v1,v2,v3,e.color);drawQuad(v1,v0,v3,v2,e.color)}else{drawQuad(new Vec3(e.x-0.2,0,e.z-0.2),new Vec3(e.x+0.2,0,e.z-0.2),new Vec3(e.x+0.2,1.2,e.z-0.2),new Vec3(e.x-0.2,1.2,e.z-0.2),e.color)}}for(const p of particles){const pp=project(new Vec3(p.x,p.y,p.z));if(pp&&pp.x>=0&&pp.x<W&&pp.y>=0&&pp.y<H){const idx=Math.floor(pp.y)*W+Math.floor(pp.x);if(pp.z<zbuf[idx]){zbuf[idx]=pp.z;const bidx=idx*4;buf[bidx]=150;buf[bidx+1]=200;buf[bidx+2]=255;buf[bidx+3]=200}}}offCtx.putImageData(imgData,0,0);ctx.font='12px Courier New';ctx.textBaseline='top';for(let y=0;y<H;y++){for(let x=0;x<W;x++){const idx=(y*W+x)*4;const r=buf[idx],g=buf[idx+1],b=buf[idx+2];const brightness=(r*0.299+g*0.587+b*0.114)/255;const ci=Math.min(chars.length-1,Math.floor(brightness*chars.length));const ch=chars[ci];ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillText(ch,x*8,y*12)}}const timeStr=`TIME: ${Math.floor(timeOfDay*24).toString().padStart(2,'0')}:${Math.floor((timeOfDay*24%1)*60).toString().padStart(2,'0')}`;const weatherStr=`WEATHER: ${weather.rain>0.5?'HEAVY RAIN':weather.rain>0?'LIGHT RAIN':'CLEAR'} | FOG: ${Math.floor(weather.fog*100)}%`;const posStr=`POS: ${player.x.toFixed(1)}, ${player.z.toFixed(1)}`;const secStr=`SECRETS: ${secretsFound}/${interactables.length}`;uiEl.innerHTML=`${timeStr}<br>${weatherStr}<br>${posStr}<br>${secStr}<br>FPS: ${Math.floor(1/deltaTime)}`}
function gameLoop(timestamp){deltaTime=Math.min(0.1,(timestamp-lastTime)/1000);lastTime=timestamp;update(deltaTime);render();requestAnimationFrame(gameLoop)}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Shift')player.sprint=true});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key==='Shift')player.sprint=false});
document.addEventListener('mousemove',e=>{if(locked){player.yaw+=e.movementX*0.002;player.pitch-=e.movementY*0.002;player.pitch=Math.max(-1.5,Math.min(1.5,player.pitch))}});
cvs.addEventListener('click',()=>{if(!locked)cvs.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===cvs});
startEl.addEventListener('click',()=>{startEl.style.display='none';initGame();requestAnimationFrame(gameLoop);cvs.requestPointerLock()});
</script>
</body>
</html>
