<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Living ASCII 3D City</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            color: #0f0; 
            font-family: 'Courier New', Courier, monospace; 
            user-select: none; 
        }
        #blocker { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.9); 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            cursor: pointer; 
        }
        #instructions { 
            text-align: center; 
            font-size: 18px; 
            text-shadow: 0 0 10px #0f0; 
            line-height: 1.6;
        }
        .blink { animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        #crosshair { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            color: rgba(0, 255, 0, 0.5); 
            pointer-events: none; 
            z-index: 5; 
            font-size: 24px; 
        }
        #hud { 
            position: absolute; 
            bottom: 30px; 
            left: 30px; 
            z-index: 5; 
            pointer-events: none; 
            text-shadow: 0 0 5px #0f0; 
            line-height: 1.5; 
            font-size: 16px; 
        }
        .hud-line { margin: 5px 0; }
        #terminal { 
            position: absolute; 
            top: 30px; 
            left: 30px; 
            width: 400px; 
            z-index: 5; 
            pointer-events: none; 
            opacity: 0.9; 
            font-size: 14px; 
            text-shadow: 0 0 5px #0f0; 
        }
        .highlight { color: #fff; text-shadow: 0 0 10px #fff; }
    </style>
    <!-- Three.js and plugins from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <div id="blocker">
        <div id="instructions">
            <span style="font-size:42px; font-weight:bold; letter-spacing: 2px;" class="highlight">N U L L _ C I T Y</span><br><br>
            INITIALIZING NEURAL LINK...<br>
            SYNCING SENSORY PROTOCOLS...<br><br>
            <span class="blink highlight" style="font-size: 24px;">[ CLICK TO UPLINK ]</span><br><br>
            [W A S D] Move | [MOUSE] Look<br>
            [SHIFT] Sprint | [SPACE] Jump<br>
            Explore the procedural terminal reality.
        </div>
    </div>
    <div id="crosshair">+</div>
    <div id="hud">
        <div class="hud-line" id="hud-district">DISTRICT: UNKNOWN</div>
        <div class="hud-line" id="hud-coords">LOC: 0.00, 0.00</div>
        <div class="hud-line" id="hud-status">SYS: NOMINAL</div>
    </div>
    <div id="terminal"></div>

    <script>
    // --- Globals & Setup ---
    let camera, scene, renderer, controls, composer, asciiPass;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isSprinting = false;

    let buildingMesh, carsMesh, rain, coreMesh;
    const carsData = [];
    const numCars = 1500;
    const rainCount = 25000;
    let audioCtx;

    const terminalLines = [];
    function printTerminal(msg) {
        const timeStr = new Date().toLocaleTimeString('en-US', { hour12: false });
        terminalLines.push(`[${timeStr}] > ${msg}`);
        if(terminalLines.length > 12) terminalLines.shift();
        document.getElementById('terminal').innerHTML = terminalLines.join('<br>');
    }

    init();
    animate();

    function init() {
        // Basic setup
        scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.012);
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2;
        
        renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.body.appendChild(renderer.domElement);
        
        // Controls
        controls = new THREE.PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        blocker.addEventListener('click', function() {
            controls.lock();
        });
        controls.addEventListener('lock', function() {
            blocker.style.display = 'none';
            if(!audioCtx) startAudio();
            printTerminal("UPLINK ESTABLISHED.");
            printTerminal("WELCOME TO SECTOR 0.");
        });
        controls.addEventListener('unlock', function() {
            blocker.style.display = 'flex';
        });
        
        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
        
        // Post-Processing
        setupPostProcessing();
        
        // City Generation
        buildCity();
        buildLife();
        buildCore();
        
        window.addEventListener('resize', onWindowResize);
        
        printTerminal("BOOT SEQUENCE COMPLETE.");
    }

    function createAsciiTexture() {
        const canvas = document.createElement('canvas');
        const cols = 8;
        const rows = 8;
        const charSize = 64;
        canvas.width = cols * charSize;
        canvas.height = rows * charSize;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = 'white';
        ctx.font = 'bold 50px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const charDensities = " `.-':_,^=;><+!rc*/z?sLTv)J7(|Fi{C}fI31tlu[neoZ5Yxjya]2ESwqkP6h9d4VpOGbUAKXHm8RD#$Bg0MNWQ%&@";
        let chars64 = "";
        for(let i=0; i<64; i++) {
            chars64 += charDensities[Math.floor(i * charDensities.length / 64)];
        }
        
        for (let i = 0; i < 64; i++) {
            const x = (i % cols) * charSize + charSize / 2;
            const y = Math.floor(i / cols) * charSize + charSize / 2;
            ctx.fillText(chars64[i], x, y);
        }
        
        const tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        return tex;
    }

    function setupPostProcessing() {
        composer = new THREE.EffectComposer(renderer);
        composer.addPass(new THREE.RenderPass(scene, camera));
        
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.1;
        bloomPass.strength = 1.8;
        bloomPass.radius = 0.5;
        composer.addPass(bloomPass);
        
        const pixelRatio = renderer.getPixelRatio();
        
        const ASCIIShader = {
            uniforms: {
                'tDiffuse': { value: null },
                'tAscii': { value: createAsciiTexture() },
                'resolution': { value: new THREE.Vector2(window.innerWidth * pixelRatio, window.innerHeight * pixelRatio) },
                'charSize': { value: Math.max(8.0, 10.0 * pixelRatio) },
                'time': { value: 0.0 }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform sampler2D tAscii;
                uniform vec2 resolution;
                uniform float charSize;
                uniform float time;
                varying vec2 vUv;
                
                void main() {
                    vec2 cell = floor(gl_FragCoord.xy / charSize);
                    vec2 centerUv = (cell + 0.5) * charSize / resolution;
                    centerUv = clamp(centerUv, 0.0, 1.0);
                    
                    vec4 color = texture2D(tDiffuse, centerUv);
                    
                    // Color quantization for terminal feel
                    color.rgb = floor(color.rgb * 8.0) / 8.0;
                    
                    float lum = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                    
                    // Glitch effect in bright areas occasionally
                    if (lum > 0.5 && fract(sin(dot(cell, vec2(12.9898, 78.233)) + time) * 43758.5453) > 0.995) {
                        lum = fract(lum + time);
                        color.rgb = vec3(1.0) - color.rgb;
                    }
                    
                    float charIndex = floor(clamp(lum, 0.0, 0.999) * 64.0);
                    float cx = mod(charIndex, 8.0);
                    float cy = floor(charIndex / 8.0);
                    vec2 charUv = fract(gl_FragCoord.xy / charSize);
                    vec2 atlasUv = vec2(
                        (cx + charUv.x) / 8.0,
                        1.0 - (cy + 1.0 - charUv.y) / 8.0
                    );
                    
                    vec4 asciiColor = texture2D(tAscii, atlasUv);
                    
                    // Blend original neon color with ascii mask
                    vec3 finalColor = color.rgb * asciiColor.r * 2.5;
                    finalColor = smoothstep(0.0, 1.0, finalColor);
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `
        };
        asciiPass = new THREE.ShaderPass(ASCIIShader);
        composer.addPass(asciiPass);
    }

    function createWindowTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, 512, 512);
        
        const rows = 32, cols = 32;
        const w = 512 / cols;
        const h = 512 / rows;
        const colors = ['#00ffff', '#ff0055', '#ffff00', '#ffffff', '#aa00ff', '#00ffaa'];
        
        for(let r=0; r<rows; r++) {
            for(let c=0; c<cols; c++) {
                if(Math.random() < 0.25) {
                    ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
                    ctx.fillRect(c*w + 2, r*h + 2, w - 4, h - 4);
                }
            }
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.magFilter = THREE.NearestFilter;
        return tex;
    }

    function buildCity() {
        // Ground Grid
        const groundMat = new THREE.ShaderMaterial({
            uniforms: {
                fogColor: { value: scene.fog.color },
                fogDensity: { value: scene.fog.density },
                time: { value: 0 }
            },
            vertexShader: `
                varying vec3 vWorldPos;
                void main() {
                    vec4 worldPos = modelMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform vec3 fogColor;
                uniform float fogDensity;
                uniform float time;
                varying vec3 vWorldPos;
                void main() {
                    vec2 uv = vWorldPos.xz * 0.05;
                    vec2 grid = abs(fract(uv - 0.5) - 0.5) / fwidth(uv);
                    float line = min(grid.x, grid.y);
                    float intensity = 1.0 - min(line, 1.0);
                    
                    vec3 color = mix(vec3(0.01, 0.01, 0.02), vec3(0.0, 0.4, 0.8), intensity * 0.2);
                    
                    float mx = abs(mod(vWorldPos.x, 20.0));
                    float mz = abs(mod(vWorldPos.z, 20.0));
                    if (mx < 2.0 || mx > 18.0 || mz < 2.0 || mz > 18.0) {
                        float stream = sin(vWorldPos.x * 2.0 + time * 5.0) * sin(vWorldPos.z * 2.0 + time * 5.0);
                        color += vec3(0.0, 1.0, 0.5) * max(0.0, stream) * 0.4;
                    }
                    
                    gl_FragColor = vec4(color, 1.0);
                    float depth = gl_FragCoord.z / gl_FragCoord.w;
                    float fogFactor = exp2( - fogDensity * fogDensity * depth * depth * 1.442695 );
                    gl_FragColor.rgb = mix( fogColor, gl_FragColor.rgb, clamp( fogFactor, 0.0, 1.0 ) );
                }
            `
        });
        
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);
        
        // Buildings
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const buildingMat = new THREE.ShaderMaterial({
            uniforms: {
                tWindows: { value: createWindowTexture() },
                fogColor: { value: scene.fog.color },
                fogDensity: { value: scene.fog.density }
            },
            vertexShader: `
                varying vec3 vWorldPos;
                varying vec3 vNormal;
                void main() {
                    vec4 worldPos = instanceMatrix * vec4(position, 1.0);
                    vWorldPos = worldPos.xyz;
                    vNormal = (instanceMatrix * vec4(normal, 0.0)).xyz;
                    gl_Position = projectionMatrix * viewMatrix * worldPos;
                }
            `,
            fragmentShader: `
                uniform sampler2D tWindows;
                uniform vec3 fogColor;
                uniform float fogDensity;
                varying vec3 vWorldPos;
                varying vec3 vNormal;
                void main() {
                    vec2 uv = vec2(0.0);
                    if (abs(vNormal.y) > 0.5) {
                        gl_FragColor = vec4(0.02, 0.02, 0.02, 1.0);
                    } else {
                        if (abs(vNormal.x) > 0.5) uv = vWorldPos.zy;
                        else uv = vWorldPos.xy;
                        uv *= 0.1;
                        vec4 texColor = texture2D(tWindows, uv);
                        vec3 baseColor = vec3(0.02, 0.02, 0.03);
                        vec3 emissive = texColor.rgb * 1.5;
                        gl_FragColor = vec4(baseColor + emissive, 1.0);
                    }
                    float depth = gl_FragCoord.z / gl_FragCoord.w;
                    float fogFactor = exp2( - fogDensity * fogDensity * depth * depth * 1.442695 );
                    gl_FragColor.rgb = mix( fogColor, gl_FragColor.rgb, clamp( fogFactor, 0.0, 1.0 ) );
                }
            `
        });
        
        buildingMesh = new THREE.InstancedMesh(geometry, buildingMat, 20000);
        const dummy = new THREE.Object3D();
        let idx = 0;
        
        for(let x = -40; x <= 40; x++) {
            for(let z = -40; z <= 40; z++) {
                if (Math.abs(x) <= 2 && Math.abs(z) <= 2) continue; // Large empty center core
                
                const px = x * 20 + 10;
                const pz = z * 20 + 10;
                
                if (Math.random() < 0.12) continue; // Parks / empty plots
                
                const numB = Math.floor(Math.random() * 4) + 1;
                for(let b=0; b<numB; b++) {
                    if(idx >= 20000) break;
                    const bx = px + (Math.random() - 0.5) * 12;
                    const bz = pz + (Math.random() - 0.5) * 12;
                    const bw = 2 + Math.random() * 6;
                    const bd = 2 + Math.random() * 6;
                    
                    const dist = Math.sqrt(px*px + pz*pz);
                    const maxH = Math.max(10, 250 - dist * 0.25);
                    const bh = 10 + Math.pow(Math.random(), 2.5) * maxH; // More variance in height
                    
                    dummy.position.set(bx, bh/2, bz);
                    dummy.scale.set(bw, bh, bd);
                    dummy.updateMatrix();
                    buildingMesh.setMatrixAt(idx++, dummy.matrix);
                    
                    // Signs
                    if(Math.random() < 0.04 && bh > 50) placeSign(bx, bh - 15, bz, bw, bd);
                }
            }
        }
        buildingMesh.count = idx;
        scene.add(buildingMesh);
    }

    const texts = ["SYS.OP", "NEON_DREAM", "WAKE UP", "ACCESS_GRANTED", "NULL_POINTER", "VOID_CITY", "DISTRICT:0", "UPLINK", "ERROR 404", "GHOST_IN_SHELL"];
    const signColors = ['#0ff', '#f0f', '#ff0', '#f00', '#0f0', '#fff'];

    function placeSign(x, y, z, w, d) {
        const text = texts[Math.floor(Math.random() * texts.length)];
        const color = signColors[Math.floor(Math.random() * signColors.length)];
        
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,512,128);
        ctx.fillStyle = color; ctx.font = 'bold 80px monospace';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(text, 256, 64);
        
        const tex = new THREE.CanvasTexture(canvas);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, color: color });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(12, 3), mat);
        
        const face = Math.floor(Math.random() * 4);
        if(face === 0) { mesh.position.set(x, y, z + d/2 + 0.2); }
        else if(face === 1) { mesh.position.set(x, y, z - d/2 - 0.2); mesh.rotation.y = Math.PI; }
        else if(face === 2) { mesh.position.set(x + w/2 + 0.2, y, z); mesh.rotation.y = Math.PI/2; }
        else { mesh.position.set(x - w/2 - 0.2, y, z); mesh.rotation.y = -Math.PI/2; }
        
        scene.add(mesh);
    }

    function buildLife() {
        // Traffic / Flying Cars
        const carGeo = new THREE.BoxGeometry(1.0, 0.4, 2.5);
        const carMat = new THREE.MeshStandardMaterial({ emissive: 0xffffff, emissiveIntensity: 2.5, color: 0x000000 });
        carsMesh = new THREE.InstancedMesh(carGeo, carMat, numCars);
        const colorObj = new THREE.Color();
        const cColors = [0xff0055, 0x00ffff, 0xffff00, 0x00ffaa, 0xffaa00, 0xffffff];
        
        for(let i=0; i<numCars; i++) {
            const isXRoad = Math.random() > 0.5;
            const roadOffset = Math.floor(Math.random() * 80) - 40; 
            const roadCoord = roadOffset * 20; 
            
            let cx, cz, vx, vz;
            if (isXRoad) {
                cz = roadCoord + (Math.random()>0.5?1:-1) * 1.5; 
                cx = (Math.random() - 0.5) * 1600;
                vx = cz > roadCoord ? 1 : -1;
                vz = 0;
            } else {
                cx = roadCoord + (Math.random()>0.5?1:-1) * 1.5;
                cz = (Math.random() - 0.5) * 1600;
                vx = 0;
                vz = cx > roadCoord ? -1 : 1;
            }
            
            const cy = 0.5 + Math.pow(Math.random(), 2) * 50; // Ground to high sky traffic
            const speed = 20 + Math.random() * 60;
            
            carsData.push({x: cx, y: cy, z: cz, vx: vx, vz: vz, speed: speed});
            colorObj.setHex(cColors[Math.floor(Math.random()*cColors.length)]);
            carsMesh.setColorAt(i, colorObj);
        }
        scene.add(carsMesh);
        
        // Rain particles
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount*3; i+=3) {
            rainPos[i] = (Math.random() - 0.5) * 600;
            rainPos[i+1] = Math.random() * 300;
            rainPos[i+2] = (Math.random() - 0.5) * 600;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rMat = new THREE.PointsMaterial({ color: 0x55aaaa, size: 0.15, transparent: true, opacity: 0.6 });
        rain = new THREE.Points(rainGeo, rMat);
        scene.add(rain);
    }

    function buildCore() {
        // Massive central structure
        const coreGroup = new THREE.Group();
        
        const coreGeo = new THREE.OctahedronGeometry(25, 2);
        const coreMat = new THREE.MeshStandardMaterial({
            color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2.0, wireframe: true
        });
        coreMesh = new THREE.Mesh(coreGeo, coreMat);
        coreMesh.position.set(0, 60, 0);
        coreGroup.add(coreMesh);
        
        // Inner core
        const innerGeo = new THREE.OctahedronGeometry(15, 0);
        const innerMat = new THREE.MeshStandardMaterial({
            color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1.0, wireframe: false
        });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        innerMesh.position.set(0, 60, 0);
        coreGroup.add(innerMesh);
        
        // Pillar
        const pillarGeo = new THREE.CylinderGeometry(5, 10, 60, 8);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(0, 30, 0);
        coreGroup.add(pillar);

        scene.add(coreGroup);
        
        const light = new THREE.PointLight(0x00ffff, 10, 300);
        light.position.set(0, 60, 0);
        scene.add(light);
        
        const light2 = new THREE.PointLight(0xff0055, 10, 200);
        light2.position.set(0, 20, 0);
        scene.add(light2);
        
        scene.add(new THREE.AmbientLight(0x111111));
    }

    function modPos(n, m) { return ((n % m) + m) % m; }

    function animate() {
        requestAnimationFrame(animate);
        
        const time = performance.now();
        const delta = Math.min(( time - prevTime ) / 1000, 0.1);
        prevTime = time;
        
        if (controls.isLocked === true) {
            // Physics / Movement
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 100.0 * delta; 
            
            direction.z = Number( moveForward ) - Number( moveBackward );
            direction.x = Number( moveRight ) - Number( moveLeft );
            direction.normalize(); 
            
            const speedMult = isSprinting ? 3.0 : 1.0;
            const baseSpeed = 250.0;
            
            if ( moveForward || moveBackward ) velocity.z -= direction.z * baseSpeed * speedMult * delta;
            if ( moveLeft || moveRight ) velocity.x -= direction.x * baseSpeed * speedMult * delta;
            
            controls.moveRight( - velocity.x * delta );
            controls.moveForward( - velocity.z * delta );
            controls.getObject().position.y += ( velocity.y * delta );
            
            if ( controls.getObject().position.y < 2 ) {
                velocity.y = 0;
                controls.getObject().position.y = 2;
                canJump = true;
            }
            
            // Collision Logic
            const px = controls.getObject().position.x;
            const pz = controls.getObject().position.z;
            const mx = modPos(px, 20);
            const mz = modPos(pz, 20);
            
            // Core plaza safety zone
            if(Math.abs(px) < 30 && Math.abs(pz) < 30) {
                // Inside central plaza, no buildings
            } else if (mx > 2.5 && mx < 17.5 && mz > 2.5 && mz < 17.5) {
                // Sliding collision resolution
                const distToX = Math.min(mx - 2.5, 17.5 - mx);
                const distToZ = Math.min(mz - 2.5, 17.5 - mz);
                if (distToX < distToZ) {
                    controls.getObject().position.x += (mx < 10 ? -distToX - 0.2 : distToX + 0.2) * (px >= 0 ? 1 : -1);
                } else {
                    controls.getObject().position.z += (mz < 10 ? -distToZ - 0.2 : distToZ + 0.2) * (pz >= 0 ? 1 : -1);
                }
            }
            
            // Update HUD
            const dist = Math.sqrt(px*px + pz*pz);
            let district = "OUTSKIRTS // SECTOR 3";
            if(dist < 50) district = "NULL CORE // SECTOR 0";
            else if(dist < 300) district = "COMMERCIAL // SECTOR 1";
            else if(dist < 600) district = "RESIDENTIAL // SECTOR 2";
            
            document.getElementById('hud-district').innerText = `DISTRICT: ${district}`;
            document.getElementById('hud-coords').innerText = `LOC: ${px.toFixed(1)}, ${pz.toFixed(1)}`;
            
            // Occasional terminal messages based on location/time
            if(Math.random() < 0.003) {
                const msgs = [
                    "SCANNING LOCAL AREA...", 
                    "DETECTED ANOMALY IN SECTOR " + Math.floor(Math.random()*4), 
                    "REROUTING POWER TO GRID.", 
                    "SYNCING NEURAL DATA...", 
                    "NO THREAT DETECTED.",
                    "BACKGROUND PROCESS TERMINATED.",
                    "DOWNLOADING ATMOSPHERIC UPDATES..."
                ];
                printTerminal(msgs[Math.floor(Math.random()*msgs.length)]);
            }
        }
        
        // Update Cars
        const dummy = new THREE.Object3D();
        for(let i=0; i<numCars; i++) {
            let car = carsData[i];
            car.x += car.vx * car.speed * delta;
            car.z += car.vz * car.speed * delta;
            
            // Loop map
            if(car.x > 800) car.x -= 1600;
            if(car.x < -800) car.x += 1600;
            if(car.z > 800) car.z -= 1600;
            if(car.z < -800) car.z += 1600;
            
            dummy.position.set(car.x, car.y, car.z);
            if(car.vx !== 0) dummy.rotation.y = car.vx > 0 ? Math.PI/2 : -Math.PI/2;
            else dummy.rotation.y = car.vz > 0 ? 0 : Math.PI;
            
            dummy.updateMatrix();
            carsMesh.setMatrixAt(i, dummy.matrix);
        }
        carsMesh.instanceMatrix.needsUpdate = true;
        
        // Update Rain
        const positions = rain.geometry.attributes.position.array;
        const playerX = controls.getObject().position.x;
        const playerZ = controls.getObject().position.z;
        for(let i=0; i<rainCount*3; i+=3) {
            positions[i+1] -= 60 * delta; // rain speed
            if (positions[i+1] < 0) {
                positions[i+1] = 200 + Math.random() * 100;
                // Reposition near player
                positions[i] = playerX + (Math.random() - 0.5) * 300;
                positions[i+2] = playerZ + (Math.random() - 0.5) * 300;
            }
        }
        rain.geometry.attributes.position.needsUpdate = true;
        
        // Update Core & Shaders
        if(coreMesh) {
            coreMesh.rotation.y += 0.4 * delta;
            coreMesh.rotation.x += 0.2 * delta;
        }
        
        if(asciiPass) asciiPass.uniforms['time'].value = time * 0.001;
        
        scene.traverse((child) => {
            if(child.material && child.material.uniforms && child.material.uniforms.time) {
                child.material.uniforms.time.value = time * 0.001;
            }
        });
        
        composer.render();
    }

    function startAudio() {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Deep drone
            const osc1 = audioCtx.createOscillator();
            osc1.type = 'sawtooth';
            osc1.frequency.value = 55;
            
            const osc2 = audioCtx.createOscillator();
            osc2.type = 'square';
            osc2.frequency.value = 54;
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 150;
            filter.Q.value = 2;
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.05;
            
            osc1.connect(filter);
            osc2.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc1.start();
            osc2.start();
            
            setInterval(() => {
                if(audioCtx && audioCtx.state === 'running') {
                    filter.frequency.setTargetAtTime(100 + Math.random()*150, audioCtx.currentTime, 2);
                }
            }, 4000);
        } catch(e) { console.log('Audio init failed'); }
    }

    function onKeyDown( event ) {
        switch ( event.code ) {
            case 'ArrowUp': case 'KeyW': moveForward = true; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = true; break;
            case 'ArrowDown': case 'KeyS': moveBackward = true; break;
            case 'ArrowRight': case 'KeyD': moveRight = true; break;
            case 'Space': if ( canJump === true ) velocity.y += 300; canJump = false; break;
            case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
        }
    }
    function onKeyUp( event ) {
        switch ( event.code ) {
            case 'ArrowUp': case 'KeyW': moveForward = false; break;
            case 'ArrowLeft': case 'KeyA': moveLeft = false; break;
            case 'ArrowDown': case 'KeyS': moveBackward = false; break;
            case 'ArrowRight': case 'KeyD': moveRight = false; break;
            case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
        }
    }
    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
        const pixelRatio = renderer.getPixelRatio();
        asciiPass.uniforms['resolution'].value.set(window.innerWidth * pixelRatio, window.innerHeight * pixelRatio);
    }
    </script>
</body>
