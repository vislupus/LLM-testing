<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon ASCII City — A Living Cyber-Fantasy Metropolis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
  
  #ascii-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    image-rendering: pixelated;
    z-index: 1;
  }
  
  /* Scanline overlay */
  #scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: overlay;
  }
  
  /* Vignette */
  #vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 3;
  }
  
  /* Blocker / start screen */
  #blocker {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
  }
  #blocker.hidden { display: none; }
  
  #instructions {
    text-align: center;
    color: #0ff;
    font-size: 18px;
    line-height: 1.8;
    text-shadow: 0 0 10px #0ff, 0 0 20px #08f;
    padding: 40px;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,20,30,0.8);
  }
  #instructions h1 {
    font-size: 32px;
    margin-bottom: 20px;
    color: #f0f;
    text-shadow: 0 0 15px #f0f, 0 0 30px #a0a;
  }
  #instructions .key {
    display: inline-block;
    border: 1px solid rgba(0,255,255,0.5);
    padding: 2px 8px;
    margin: 0 3px;
    background: rgba(0,255,255,0.1);
    font-size: 14px;
  }
  
  /* HUD */
  #hud {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: rgba(0,255,255,0.6);
    font-size: 13px;
    text-align: center;
    text-shadow: 0 0 5px rgba(0,255,255,0.3);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  #hud.visible { opacity: 1; }
  
  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    width: 20px; height: 20px;
    pointer-events: none;
    opacity: 0.5;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(0,255,255,0.6);
  }
  #crosshair::before {
    width: 2px; height: 100%;
    left: 50%; transform: translateX(-50%);
  }
  #crosshair::after {
    width: 100%; height: 2px;
    top: 50%; transform: translateY(-50%);
  }
  
  /* Interact hint */
  #interact-hint {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #ff0;
    font-size: 14px;
    text-shadow: 0 0 10px #ff0, 0 0 20px #f80;
    padding: 8px 20px;
    border: 1px solid rgba(255,255,0,0.3);
    background: rgba(20,15,0,0.7);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    text-align: center;
  }
  #interact-hint.visible { opacity: 1; }
  
  /* Discovery notification */
  #discovery {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    color: #0ff;
    font-size: 16px;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s, transform 0.5s;
    padding: 15px 30px;
    border: 1px solid rgba(0,255,255,0.4);
    background: rgba(0,20,30,0.85);
    max-width: 600px;
    text-shadow: 0 0 10px #0ff;
  }
  #discovery.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #discovery .title {
    color: #f0f;
    font-size: 18px;
    margin-bottom: 8px;
    text-shadow: 0 0 10px #f0f;
  }
  
  /* Minimap */
  #minimap-container {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 10;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,10,15,0.85);
    padding: 8px;
    pointer-events: none;
  }
  #minimap {
    display: block;
    image-rendering: pixelated;
  }
  #minimap-label {
    color: rgba(0,255,255,0.5);
    font-size: 10px;
    text-align: center;
    padding-top: 4px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  /* District label (dynamic) */
  #district-label {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    color: #0ff;
    font-size: 28px;
    text-shadow: 0 0 20px #0ff, 0 0 40px #08f;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s;
    text-align: center;
    letter-spacing: 4px;
    text-transform: uppercase;
  }
  #district-label.visible { opacity: 1; }
  #district-label .sub {
    font-size: 14px;
    color: rgba(0,255,255,0.5);
    letter-spacing: 2px;
    margin-top: 5px;
  }
  
  /* Speed indicator */
  #speed-indicator {
    position: fixed;
    bottom: 30px; right: 30px;
    z-index: 10;
    color: rgba(0,255,255,0.4);
    font-size: 11px;
    pointer-events: none;
    text-align: right;
    line-height: 1.6;
  }
  #speed-indicator .sprint {
    color: rgba(255,100,0,0.6);
  }
</style>
</head>
<body>

<canvas id="ascii-canvas"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="crosshair"></div>

<div id="blocker">
  <div id="instructions">
    <h1>⬡ NEON ASCII CITY ⬡</h1>
    <div style="color:#88a; margin-bottom:15px; font-size:13px;">A Living Cyber-Fantasy Metropolis</div>
    <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move</div>
    <div style="margin-top:8px;"><span class="key">Shift</span> Sprint &nbsp; <span class="key">Mouse</span> Look</div>
    <div style="margin-top:8px;"><span class="key">E</span> Interact &nbsp; <span class="key">Space</span> Jump</div>
    <div style="margin-top:20px; color:#0ff; font-size:14px;">— Click to Enter the City —</div>
    <div style="margin-top:15px; color:#667; font-size:11px;">Explore districts, discover secrets, witness the living ASCII metropolis</div>
  </div>
</div>

<div id="hud"></div>
<div id="interact-hint"></div>
<div id="discovery"></div>
<div id="district-label"></div>

<div id="minimap-container">
  <canvas id="minimap" width="160" height="160"></canvas>
  <div id="minimap-label">⌈ CITY MAP ⌋</div>
</div>

<div id="speed-indicator">
  <div id="fps-display">-- FPS</div>
  <div class="sprint" id="sprint-indicator" style="display:none;">▲ SPRINT</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ====================================================================
// NEON ASCII CITY — Complete Implementation
// ====================================================================

// ─── Configuration ───
const CONFIG = {
 asciiWidth: 180,
  asciiHeight: 100,
  charRamp: ' .:-=+*#%@Ω█',
  walkSpeed: 8,
  sprintSpeed: 16,
  sprintStamina: 100,
  jumpSpeed: 6,
  gravity: -15,
  mouseSensitivity: 0.002,
  fogNear: 30,
  fogFar: 90,
  playerHeight: 1.7,
  playerRadius: 0.5,
 colors: {
    cyan: [0, 255, 255],
    magenta: [255, 0, 255],
    yellow: [255, 255, 0],
    green: [0, 255, 128],
    orange: [255, 128, 0],
    blue: [50, 100, 255],
    purple: [128, 0, 255],
    gold: [255, 200, 50],
    red: [255, 50, 50],
    white: [255, 255, 255],
    dim: [20, 30, 40],
  },
 districts: {
    downtown: { name: 'THE SPIRE', color: 'cyan', buildingColor: [40,50,60], heightRange: [25,55], signChance: 0.4, windowLitChance: 0.6 },
    entertainment: { name: 'PRISM QUARTER', color: 'magenta', buildingColor: [60,30,50], heightRange: [15,35], signChance: 0.6, windowLitChance: 0.7 },
    industrial: { name: 'THE FOUNDRY', color: 'orange', buildingColor: [50,45,40], heightRange: [12,28], signChance: 0.2, windowLitChance: 0.3 },
    residential: { name: 'EMBER BLOCKS', color: 'gold', buildingColor: [45,40,35], heightRange: [8,20], signChance: 0.15, windowLitChance: 0.8 },
    hollows: { name: 'THE UNDERCITY', color: 'purple', buildingColor: [25,20,30], heightRange: [10,25], signChance: 0.35, windowLitChance: 0.4 },
  },
};

// ─── State ───
const state = {
  isLocked: false,
  moveForward: false,
  moveBackward: false,
  moveLeft: false,
  moveRight: false,
  sprint: false,
  jump: false,
  velocity: new THREE.Vector3(),
  direction: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  canJump: false,
  sprintStamina: CONFIG.sprintStamina,
  sprinting: false,
  nearInteractable: null,
  discoveries: [],
  district: null,
  districtTimer: 0,
  fps: 60,
  frameCount: 0,
  lastFpsTime: 0,
  time: 0,
  playerPos: new THREE.Vector3(0, CONFIG.playerHeight, 0),
};

// ─── DOM refs ───
const asciiCanvas = document.getElementById('ascii-canvas');
const ctx = asciiCanvas.getContext('2d');
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
const blocker = document.getElementById('blocker');
const instructions = document.getElementById('instructions');
const hud = document.getElementById('hud');
const interactHint = document.getElementById('interact-hint');
const discovery = document.getElementById('discovery');
const districtLabel = document.getElementById('district-label');
const fpsDisplay = document.getElementById('fps-display');
const sprintIndicator = document.getElementById('sprint-indicator');

// ─── Three.js Setup ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080f);
scene.fog = new THREE.FogExp2(0x05080f, 0.012);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.copy(state.playerPos);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: 'high-performance',
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

// Render targets for ASCII capture
const colorRT = new THREE.WebGLRenderTarget(CONFIG.asciiWidth, CONFIG.asciiHeight, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
});
const depthRT = new THREE.WebGLRenderTarget(CONFIG.asciiWidth, CONFIG.asciiHeight, {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
});

// Depth material for depth capture
const depthMaterial = new THREE.MeshDepthMaterial();

// Canvas texture for window patterns
function createWindowTexture(width, height, litChance, variation) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const c = canvas.getContext('2d');
  
  // Base building color (dark)
  c.fillStyle = '#1a1a20';
  c.fillRect(0, 0, width, height);
  
  // Window grid
  const cols = Math.floor(width / 6);
  const rows = Math.floor(height / 8);
  const marginX = (width - cols * 5) / 2;
  const marginY = (height - rows * 7) / 2;
  
  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      const seed = r * cols + col;
      const isLit = Math.random() < litChance;
      const flicker = isLit ? 0.7 + Math.random() * 0.3 : 0;
      
      const x = marginX + col * 5;
      const y = marginY + r * 7;
      
      if (isLit) {
        // Warm window glow
        const warmth = 0.8 + Math.random() * 0.2;
        const bright = Math.floor(180 + Math.random() * 75);
        c.fillStyle = `rgb(${Math.floor(bright * warmth)}, ${Math.floor(bright * 0.7)}, ${Math.floor(bright * 0.3)})`;
        c.fillRect(x, y, 4, 6);
        
        // Glow effect
        if (Math.random() < 0.3) {
          c.fillStyle = `rgba(255, 200, 100, ${Math.random() * 0.15})`;
          c.fillRect(x - 1, y - 1, 6, 8);
        }
      } else {
        // Dark window (slight reflection)
        c.fillStyle = `rgb(25, 28, 35)`;
        c.fillRect(x, y, 4, 6);
        // Slight reflection on some
        if (Math.random() < 0.1) {
          c.fillStyle = 'rgba(100, 120, 150, 0.1)';
          c.fillRect(x, y, 4, 2);
        }
      }
    }
  }
  
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1, 1);
  return texture;
}

// ─── City Generation ───
const buildings = [];
const interactables = [];
const districtBounds = {};

function getDistrict(x, z) {
  // Define district regions
  if (z > 30 && x > -20 && x < 20) return 'entertainment';
  if (z < -30 && x > -20 && x < 20) return 'industrial';
  if (x > 30 && z > -20 && z < 20) return 'residential';
  if (x < -30 && z > -20 && z < 20) return 'hollows';
  if (Math.abs(x) < 20 && Math.abs(z) < 20) return 'downtown';
  // Edges - determine by proximity
  const dx = Math.abs(x), dz = Math.abs(z);
  if (dx > 30 && dz > 30) return Math.random() < 0.5 ? 'hollows' : 'residential';
  if (dx > dz) return x > 0 ? 'residential' : 'hollows';
  return z > 0 ? 'entertainment' : 'industrial';
}

function generateCity() {
  const blockSize = 28;
  const roadWidth = 7;
  const gridSize = 9; // 9x9 blocks
  const halfGrid = (gridSize - 1) / 2;
  
  // Ground
  const groundGeo = new THREE.PlaneGeometry(900, 900);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x0a0a12,
    roughness: 0.9,
    metalness: 0.1,
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.05;
  scene.add(ground);
  
  // Road markings (grid)
  const roadMat = new THREE.MeshStandardMaterial({
    color: 0x111118,
    roughness: 0.8,
    metalness: 0.2,
  });
  
  for (let i = 0; i < gridSize; i++) {
    const pos = (i - halfGrid) * (blockSize + roadWidth);
    
    // Horizontal road
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(900, roadWidth), roadMat);
    roadH.rotation.x = -Math.PI / 2;
    roadH.position.set(0, 0.01, pos);
    scene.add(roadH);
    
    // Vertical road
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, 900), roadMat);
    roadV.rotation.x = -Math.PI / 2;
    roadV.position.set(pos, 0.01, 0);
    scene.add(roadV);
  }
  
  // Main roads (wider)
  const mainRoadMat = new THREE.MeshStandardMaterial({
    color: 0x151520,
    roughness: 0.7,
    metalness: 0.3,
  });
  for (let i = -1; i <= 1; i += 2) {
    const pos = i * 45;
    const mr1 = new THREE.Mesh(new THREE.PlaneGeometry(900, 10), mainRoadMat);
    mr1.rotation.x = -Math.PI / 2;
    mr1.position.set(0, 0.02, pos);
    scene.add(mr1);
    const mr2 = new THREE.Mesh(new THREE.PlaneGeometry(10, 900), mainRoadMat);
    mr2.rotation.x = -Math.PI / 2;
    mr2.position.set(pos, 0.02, 0);
    scene.add(mr2);
  }
  
  // Road lane markings (center lines)
  const laneMat = new THREE.MeshStandardMaterial({
    color: 0x222230,
    emissive: 0x111120,
    emissiveIntensity: 0.1,
  });
  for (let i = 0; i < gridSize; i++) {
    const pos = (i - halfGrid) * (blockSize + roadWidth);
    for (let j = 0; j < 20; j++) {
      const t = (j / 20) * 900 - 450;
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.5), laneMat);
      dash.rotation.x = -Math.PI / 2;
      dash.position.set(t, 0.03, pos);
      scene.add(dash);
      const dash2 = new THREE.Mesh(new THREE.PlaneGeometry(2, 1.5), laneMat);
      dash2.rotation.x = -Math.PI / 2;
      dash2.position.set(pos, 0.03, t);
      scene.add(dash2);
    }
  }
  
  // Buildings
  for (let bx = 0; bx < gridSize; bx++) {
    for (let bz = 0; bz < gridSize; bz++) {
      // Skip some blocks for variety
      if (Math.random() < 0.08) continue;
      
      const blockX = (bx - halfGrid) * (blockSize + roadWidth);
      const blockZ = (bz - halfGrid) * (blockSize + roadWidth);
      
      const district = getDistrict(blockX, blockZ);
      const distConfig = CONFIG.districts[district];
      districtBounds[district] = districtBounds[district] || { min: [Infinity,Infinity], max: [-Infinity,-Infinity] };
      districtBounds[district].min[0] = Math.min(districtBounds[district].min[0], blockX);
      districtBounds[district].min[1] = Math.min(districtBounds[district].min[1], blockZ);
      districtBounds[district].max[0] = Math.max(districtBounds[district].max[0], blockX);
      districtBounds[district].max[1] = Math.max(districtBounds[district].max[1], blockZ);
      
      // Number of buildings in this block
      const numBuildings = 1 + Math.floor(Math.random() * 2.5);
      for (let b = 0; b < numBuildings; b++) {
        const bWidth = 6 + Math.random() * (blockSize * 0.5);
        const bDepth = 6 + Math.random() * (blockSize * 0.5);
        const heightRange = distConfig.heightRange;
        const bHeight = heightRange[0] + Math.random() * (heightRange[1] - heightRange[0]);
        
        // Position within block with margin
        const maxMargin = blockSize - bWidth - 2;
        const maxMarginZ = blockSize - bDepth - 2;
        if (maxMargin <= 0 || maxMarginZ <= 0) continue;
        
        const bX = blockX + 2 + Math.random() * maxMargin;
        const bZ = blockZ + 2 + Math.random() * maxMarginZ;
        
        // Special tall buildings in downtown
        let special = false;
        if (district === 'downtown' && Math.random() < 0.06) {
          bHeight = 50 + Math.random() * 30;
          special = true;
        }
        // Some unique shapes in entertainment
        if (district === 'entertainment' && Math.random() < 0.1) {
          special = true;
        }
        
        const windowTex = createWindowTexture(
          Math.max(64, Math.floor(bWidth * 4)),
          Math.max(64, Math.floor(bHeight * 4)),
          distConfig.windowLitChance,
          Math.random()
        );
        
        const buildingMat = new THREE.MeshStandardMaterial({
          map: windowTex,
          color: new THREE.Color(distConfig.buildingColor[0]/255, distConfig.buildingColor[1]/255, distConfig.buildingColor[2]/255),
          roughness: 0.7,
          metalness: 0.3,
          emissive: new THREE.Color(distConfig.buildingColor[0]/255, distConfig.buildingColor[1]/255, distConfig.buildingColor[2]/255),
          emissiveIntensity: 0.05,
        });
        
        const geo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
        const mesh = new THREE.Mesh(geo, buildingMat);
        mesh.position.set(bX, bHeight / 2, bZ);
        mesh.castShadow = false;
        mesh.receiveShadow = false;
        scene.add(mesh);
        
        buildings.push({
          mesh,
          x: bX, z: bZ,
          width: bWidth, depth: bDepth, height: bHeight,
          district,
          windowTex,
          special,
          baseColor: distConfig.buildingColor,
          windowLitChance: distConfig.windowLitChance,
        });
        
        // Neon sign on some buildings
        if (Math.random() < distConfig.signChance) {
          createNeonSign(mesh, district, bWidth, bHeight);
        }
        
        // Special structures
        if (special && district === 'downtown') {
          createSpecialTower(bX, bZ, bHeight);
        }
        if (special && district === 'entertainment') {
          createNeonStructure(bX, bZ, bHeight);
        }
      }
    }
  }
  
  // Central landmark - massive tower
  createCentralLandmark();
  
  // Street lamps
  createStreetLamps();
  
  // Add some ambient point lights for neon atmosphere
  addAmbientNeon();
}

function createNeonSign(parentMesh, district, width, height) {
  const signTexts = {
    downtown: [' ╦NIGHT LIFE╦ ', '◈ DATA ◈', '⟡ NEON ⟡', '✦ SPIRE ✦', '𝐶𝑂𝐶𝐴 Mina', '∞ LOOP ∞'],
    entertainment: ['✪ PRISM ✪', '🎵 NIGHTWAVE 🎵', '✧ CLUB ✧', '☽ RAVE ☾', '✦ PULSE ✦', '⟡ VIBE ⟡', '⌬ DANCE ⌬'],
    industrial: ['⊗ FACTORY ⊗', '⚠ SECTOR ⚠', '↻ OPERATE ↻', '⚙ MACHINERY ⚙'],
    residential: ['⌂ HOME ⌂', '◈ APARTMENTS ◈', '☯ quiet ☯', '⍟ dwelling ⍟'],
    hollows: ['◉ GRAFFITI ◉', '⚡ ALLEY ⚡', '⟐ MYSTIC ⟐', '◈ SHADOW ◈', 'ϟ UNDER ϟ', '⎔ HIDDEN ⎔'],
  };
  
  const texts = signTexts[district] || signTexts.downtown;
  const text = texts[Math.floor(Math.random() * texts.length)];
  
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 256;
  signCanvas.height = 64;
  const sctx = signCanvas.getContext('2d');
  
  const distColor = CONFIG.districts[district].color;
  const colorMap = {
    cyan: '#0ff',
    magenta: '#f0f',
    yellow: '#ff0',
    orange: '#f80',
    purple: '#a0f',
    gold: '#fc0',
  };
  const baseColor = colorMap[distColor] || '#0ff';
  
  sctx.fillStyle = 'rgba(0,0,0,0.7)';
  sctx.fillRect(0, 0, 256, 64);
  
  // Glow effect
  sctx.shadowColor = baseColor;
  sctx.shadowBlur = 20;
  sctx.font = 'bold 32px "Courier New", monospace';
  sctx.textAlign = 'center';
  sctx.textBaseline = 'middle';
  sctx.fillStyle = baseColor;
  sctx.fillText(text, 128, 32);
  
  sctx.shadowBlur = 0;

    map: texture,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

function createStreetLamps() {
  const lampPositions = [];

      const blockX = (bx - halfGrid) * (blockSize + roadWidth);
      const blockZ = (bz - halfGrid) * (blockSize + roadWidth);
      
      // Lamps along roads
      for (let side = -1; side <= 1; side += 2) {
        const lx = blockX + blockSize / 2;
        const lz = blockZ + side * (blockSize / 2 + roadWidth / 2);

      }

  // Limit lamps for performance
  const selected = lampPositions.sort(() => Math.random() - 0.5).slice(0, 120);

      roughness: 0.2,
    });

    lampHead.position.y = 3.5;

    // Glow sprite

    grad.addColorStop(0.3, 'rgba(255, 200, 100, 0.2)');

// Traffic system
const vehicles = [];
const roadPaths = [];

function generateRoadPaths() {
  const blockSize = 28;
  const roadWidth = 7;
  const gridSize = 9;
  const halfGrid = (gridSize - 1) / 2;
  
  // Horizontal roads
  for (let i = 0; i < gridSize; i++) {
    const z = (i - halfGrid) * (blockSize + roadWidth);
    const path = {
      points: [],
      type: 'horizontal',
      z,
    };
    for (let x = -400; x <= 400; x += 8) {
      path.points.push(new THREE.Vector3(x, 0.5, z));
    }
    roadPaths.push(path);
  }
  
  // Vertical roads
  for (let i = 0; i < gridSize; i++) {
    const x = (i - halfGrid) * (blockSize + roadWidth);
    const path = {
      points: [],
      type: 'vertical',
      x,
    };
    for (let z = -400; z <= 400; z += 8) {
      path.points.push(new THREE.Vector3(x, 0.5, z));
    }
    roadPaths.push(path);
  }
}

function createVehicle(path) {
  const colorChoices = [0xff0044, 0x00ff88, 0x4488ff, 0xffcc00, 0xffffff, 0x88ff00, 0x00ffcc];
  const color = colorChoices[Math.floor(Math.random() * colorChoices.length)];
  
  const group = new THREE.Group();
  
  // Body
  const bodyMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.7,
    emissive: color,
    emissiveIntensity: 0.05,
  });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 0.8), bodyMat);
  body.position.y = 0.3;
  group.add(body);
  
  // Cabin
  const cabinMat = new THREE.MeshStandardMaterial({
    color: 0x111122,
    roughness: 0.1,
    metalness: 0.9,
    transparent: true,
    opacity: 0.6,
  });
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 0.7), cabinMat);
  cabin.position.set(0, 0.55, -0.1);
  group.add(cabin);
  
  // Headlights
  const headlightMat = new THREE.MeshStandardMaterial({
    color: 0xffffaa,
    emissive: 0xffffaa,
    emissiveIntensity: 2.0,
  });
  const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), headlightMat);
  hl1.position.set(0.3, 0.2, 0.45);
  group.add(hl1);
  const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), headlightMat);
  hl2.position.set(-0.3, 0.2, 0.45);
  group.add(hl2);
  
  // Taillights
  const taillightMat = new THREE.MeshStandardMaterial({
    color: 0xff0000,
    emissive: 0xff0000,
    emissiveIntensity: 1.5,
  });
  const tl1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), taillightMat);
  tl1.position.set(0.3, 0.2, -0.45);
  group.add(tl1);
  const tl2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), taillightMat);
  tl2.position.set(-0.3, 0.2, -0.45);
  group.add(tl2);
  
  // Light glow sprites
  const glowCanvas = document.createElement('canvas');
  glowCanvas.width = 32;
  glowCanvas.height = 32;
  const gctx = glowCanvas.getContext('2d');
  const grad = gctx.createRadialGradient(16, 16, 0, 16, 16, 16);
  grad.addColorStop(0, 'rgba(255, 255, 200, 0.8)');
  grad.addColorStop(0.4, 'rgba(255, 255, 100, 0.3)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  gctx.fillStyle = grad;
  gctx.fillRect(0, 0, 32, 32);
  
  const glowTex = new THREE.CanvasTexture(glowCanvas);
  const glowMat = new THREE.SpriteMaterial({
    map: glowTex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const glowSprite = new THREE.Sprite(glowMat);
  glowSprite.scale.set(1.5, 1.5, 1);
  glowSprite.position.set(0, 0.3, 0.5);
  group.add(glowSprite);
  
  // Start at random position on path
  const startIdx = Math.floor(Math.random() * (path.points.length - 4));
  const startPoint = path.points[startIdx];
  group.position.copy(startPoint);
  
  // Direction
  const dir = path.type === 'horizontal' ? 1 : 1;
  if (Math.random() < 0.5) {
    // Reverse direction
    group.userData = {
      path,
      pathIndex: startIdx,
      speed: 3 + Math.random() * 4,
      direction: path.type === 'horizontal' ? (Math.random() < 0.5 ? 1 : -1) : (Math.random() < 0.5 ? 1 : -1),
      reverse: Math.random() < 0.3,
    };
  } else {
    group.userData = {
      path,
      pathIndex: startIdx,
      speed: 3 + Math.random() * 4,
      direction: path.type === 'horizontal' ? (Math.random() < 0.5 ? 1 : -1) : (Math.random() < 0.5 ? 1 : -1),
      reverse: false,
    };
  }
  
  scene.add(group);
  vehicles.push(group);
}

  const maxZ = blockSize - margin * 2;

  const startZ = blockZ + margin + Math.random() * maxZ;

    bobPhase: Math.random() * Math.PI * 2,
  };
  
  scene.add(group);
  pedestrians.push(group);
}

// Rain system
let rainParticles;

function createRain() {
  const count = 3000;
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count);
  
  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 500;
    positions[i * 3 + 1] = Math.random() * 100;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 500;
    velocities[i] = 15 + Math.random() * 10;
  }
  
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  
  const rainMat = new THREE.PointsMaterial({
    color: 0x88aaff,
    size: 0.08,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true,
  });
  
  const rain = new THREE.Points(geo, rainMat);
  rain.userData.velocities = velocities;
  rain.userData.count = count;
  scene.add(rain);
  return rain;
}

// ─── Interaction System ───

const interactZones = [];

function createInteractZone(x, z, text, title, requirements) {
  const zone = {
    x, z,
    radius: 3,
    text,
    title,
    discovered: false,
    requirements: requirements || {},
    sprite: null,
  };
  
  // Visual indicator (subtle)
  const ringMat = new THREE.MeshStandardMaterial({
    color: 0x00ffff,
    emissive: 0x00ffff,
    emissiveIntensity: 0.3,
    transparent: true,
    opacity: 0.15,
    roughness: 0.0,
    metalness: 0.0,
    side: THREE.DoubleSide,
  });
  const ring = new THREE.Mesh(new THREE.RingGeometry(2.5, 3, 32), ringMat);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.1, z);
  scene.add(ring);
  zone.sprite = ring;
  
  // Floating text indicator
  const textCanvas = document.createElement('canvas');
  textCanvas.width = 512;
  textCanvas.height = 64;
  const tctx = textCanvas.getContext('2d');
  tctx.fillStyle = 'rgba(0,0,0,0)';
  tctx.fillRect(0, 0, 512, 64);
  tctx.shadowColor = '#0ff';
  tctx.shadowBlur = 20;
  tctx.font = 'bold 28px "Courier New", monospace';
  tctx.textAlign = 'center';
  tctx.textBaseline = 'middle';
  tctx.fillStyle = '#0ff';
  tctx.fillText('▸ INTERACT ◂', 256, 32);
  
  const textTex = new THREE.CanvasTexture(textCanvas);
  const textMat = new THREE.SpriteMaterial({
    map: textTex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const textSprite = new THREE.Sprite(textMat);
  textSprite.scale.set(2, 0.25, 1);
  textSprite.position.set(x, 2.5, z);
  scene.add(textSprite);
  zone.textSprite = textSprite;
  
  interactZones.push(zone);
  return zone;
}

// ─── ASCII Rendering Pipeline ───

function resizeCanvas() {
  asciiCanvas.width = window.innerWidth;
  asciiCanvas.height = window.innerHeight;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Character ramp lookup
const charRamp = CONFIG.charRamp;
const rampLength = charRamp.length;

function luminance(r, g, b) {
  return 0.299 * r + 0.587 * g + 0.114 * b;
}

function getCharIndex(lum) {
  // Map luminance (0-255) to character index
  const normalized = lum / 255;
  return Math.min(rampLength - 1, Math.max(0, Math.floor(normalized * rampLength)));
}

function renderASCII() {
  const w = CONFIG.asciiWidth;
  const h = CONFIG.asciiHeight;
  const screenW = asciiCanvas.width;
  const screenH = asciiCanvas.height;
  
  // Read pixels from color RT
  const pixelBuffer = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(colorRT, 0, 0, w, h, pixelBuffer);
  
  // Read depth from depth RT
  const depthBuffer = new Float32Array(w * h);
  // For depth, we read from the depth RT's color buffer (MeshDepthMaterial outputs depth as grayscale)
  const depthPixelBuffer = new Uint8Array(w * h * 4);
  renderer.readRenderTargetPixels(depthRT, 0, 0, w, h, depthPixelBuffer);
  
  for (let i = 0; i < w * h; i++) {
    const r = depthPixelBuffer[i * 4];
    const g = depthPixelBuffer[i * 4 + 1];
    const b = depthPixelBuffer[i * 4 + 2];
    depthBuffer[i] = (r + g + b) / 3 / 255;
  }
  
  // Clear canvas
  ctx.fillStyle = '#05080f';
  ctx.fillRect(0, 0, screenW, screenH);
  
  // Character cell size
  const cellW = screenW / w;
  const cellH = screenH / h;
  
  // Draw characters
  // Group by size for efficiency
  const sizeGroups = {};
  
  for (let j = 0; j < h; j++) {
    for (let i = 0; i < w; i++) {
      const idx = (j * w + i) * 4;
      const r = pixelBuffer[idx];
      const g = pixelBuffer[idx + 1];
      const b = pixelBuffer[idx + 2];
      const depth = depthBuffer[j * w + i];
      
      // Skip very dark pixels (optimization)
      const lum = luminance(r, g, b);
      if (lum < 8) continue;
      
      const charIdx = getCharIndex(lum);
      const ch = charRamp[charIdx];
      
      // Depth-based character size
      let charSize;
      if (depth < 0.15) charSize = Math.max(10, cellW * 1.2);
      else if (depth < 0.3) charSize = cellW * 1.0;
      else if (depth < 0.5) charSize = cellW * 0.8;
      else if (depth < 0.7) charSize = cellW * 0.6;
      else charSize = cellW * 0.4;
      
      // Color with neon enhancement
      let cr = r, cg = g, cb = b;
      
      // Boost neon colors
      const maxComp = Math.max(r, g, b);
      if (maxComp > 150) {
        const boost = 1.0 + (maxComp - 150) / 150 * 0.5;
        cr = Math.min(255, r * boost);
        cg = Math.min(255, g * boost);
        cb = Math.min(255, b * boost);
      }
      
      // Convert to CSS color
      const color = `rgb(${Math.floor(cr)}, ${Math.floor(cg)}, ${Math.floor(cb)})`;
      
      // Position
      const x = i * cellW + cellW / 2;
      const y = j * cellH + cellH / 2;
      
      // Store for batched rendering
      const sizeBucket = Math.round(charSize);
      if (!sizeGroups[sizeBucket]) {
        sizeGroups[sizeBucket] = [];
      }
      sizeGroups[sizeBucket].push({ x, y, ch, color, lum });
    }
  }
  
  // Render by size groups (sorted large to small for correct overlap)
  const sortedSizes = Object.keys(sizeGroups).map(Number).sort((a, b) => b - a);
  
  for (const size of sortedSizes) {
    const chars = sizeGroups[size];
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (const c of chars) {
      ctx.fillStyle = c.color;
      ctx.fillText(c.ch, c.x, c.y);
    }
  }
  
  // Subtle CRT glow effect for bright areas
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.03;
  for (const size of sortedSizes) {
    const chars = sizeGroups[size];
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    for (const c of chars) {
      if (c.lum > 200) {
        ctx.fillStyle = c.color;
        ctx.fillText(c.ch, c.x, c.y);
      }
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1.0;
}

// ─── Minimap Rendering ───

function renderMinimap() {
  const mw = minimapCanvas.width;
  const mh = minimapCanvas.height;
  const scale = mw / 600; // 300 units each way
  
  minimapCtx.fillStyle = '#05080f';
  minimapCtx.fillRect(0, 0, mw, mh);
  
  // Draw roads
  const blockSize = 28;
  const roadWidth = 7;
  const gridSize = 9;
  const halfGrid = (gridSize - 1) / 2;
  
  minimapCtx.strokeStyle = 'rgba(20, 30, 40, 0.5)';
  minimapCtx.lineWidth = 1;
  
  for (let i = 0; i <= gridSize; i++) {
    const pos = (i - halfGrid) * (blockSize + roadWidth);
    const sx = mw/2 + pos * scale;
    const sy = mw/2 + pos * scale;
    
    // Horizontal road
    minimapCtx.beginPath();
    minimapCtx.moveTo(0, sy);
    minimapCtx.lineTo(mw, sy);
    minimapCtx.stroke();
    
    // Vertical road
    minimapCtx.beginPath();
    minimapCtx.moveTo(sx, 0);
    minimapCtx.lineTo(sx, mh);
    minimapCtx.stroke();
  }
  
  // Draw buildings as ASCII blocks
  for (const building of buildings) {
    const sx = mw/2 + building.x * scale;
    const sy = mw/2 + building.z * scale;
    const sw = building.width * scale;
    const sd = building.depth * scale;
    
    if (sx < 0 || sx + sw > mw || sy < 0 || sy + sd > mh) continue;
    
    const distConfig = CONFIG.districts[building.district];
    const colorName = distConfig.color;
    const colorMap = {
      cyan: 'rgba(0, 255, 255, 0.4)',
      magenta: 'rgba(255, 0, 255, 0.4)',
      orange: 'rgba(255, 128, 0, 0.4)',
      gold: 'rgba(255, 200, 50, 0.4)',
      purple: 'rgba(128, 0, 255, 0.4)',
    };
    
    minimapCtx.fillStyle = colorMap[colorName] || 'rgba(50, 50, 60, 0.4)';
    minimapCtx.fillRect(sx, sy, sw, sd);
    
    // Building height indicator (ASCII char)
    const heightChar = building.height > 30 ? '█' : building.height > 18 ? '#' : building.height > 10 ? '+' : ':';
    minimapCtx.fillStyle = colorMap[colorName] || 'rgba(200, 200, 200, 0.6)';
    minimapCtx.font = '8px "Courier New", monospace';
    minimapCtx.fillText(heightChar, sx + sw/2 - 2, sy + sd/2 + 3);
  }
  
  // Central landmark
  const lx = mw/2;
  const ly = mw/2;
  minimapCtx.fillStyle = '#0ff';
  minimapCtx.shadowColor = '#0ff';
  minimapCtx.shadowBlur = 8;
  minimapCtx.font = '12px "Courier New", monospace';
  minimapCtx.textAlign = 'center';
  minimapCtx.textBaseline = 'middle';
  minimapCtx.fillText('♢', lx, ly);
  minimapCtx.shadowBlur = 0;
  
  // Interactable zones
  for (const zone of interactZones) {
    const zx = mw/2 + zone.x * scale;
    const zy = mw/2 + zone.z * scale;
    
    if (zone.discovered) {
      minimapCtx.fillStyle = '#ff0';
      minimapCtx.font = '10px "Courier New", monospace';
      minimapCtx.textAlign = 'center';
      minimapCtx.textBaseline = 'middle';
      minimapCtx.fillText('◇', zx, zy);
    } else {
      minimapCtx.fillStyle = 'rgba(0, 255, 255, 0.3)';
      minimapCtx.beginPath();
      minimapCtx.arc(zx, zy, 4, 0, Math.PI * 2);
      minimapCtx.stroke();
    }
  }
  
  // Player position
  const px = mw/2 + state.playerPos.x * scale;
  const py = mw/2 + state.playerPos.z * scale;
  
  minimapCtx.shadowColor = '#0ff';
  minimapCtx.shadowBlur = 10;
  minimapCtx.fillStyle = '#0ff';
  minimapCtx.font = '10px "Courier New", monospace';
  minimapCtx.textAlign = 'center';
  minimapCtx.textBaseline = 'middle';
  minimapCtx.fillText('⬡', px, py);
  minimapCtx.shadowBlur = 0;
  
  // Direction indicator
  const dirX = px + Math.sin(state.yaw) * 8;
  const dirY = py + Math.cos(state.yaw) * 8;
  minimapCtx.strokeStyle = '#0ff';
  minimapCtx.lineWidth = 1.5;
  minimapCtx.beginPath();
  minimapCtx.moveTo(px, py);
  minimapCtx.lineTo(dirX, dirY);
  minimapCtx.stroke();
}

// ─── Controls ───

const keys = {};

document.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  
  if (e.code === 'KeyW') state.moveForward = true;
  if (e.code === 'KeyS') state.moveBackward = true;
  if (e.code === 'KeyA') state.moveLeft = true;
  if (e.code === 'KeyD') state.moveRight = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    state.sprint = true;
  }
  if (e.code === 'Space') {
    if (state.canJump) {
      state.velocity.y = CONFIG.jumpSpeed;
      state.canJump = false;
    }
    state.jump = true;
  }
  if (e.code === 'KeyE') {
    if (state.nearInteractable) {
      interact(state.nearInteractable);
    }
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.code] = false;
  
  if (e.code === 'KeyW') state.moveForward = false;
  if (e.code === 'KeyS') state.moveBackward = false;
  if (e.code === 'KeyA') state.moveLeft = false;
  if (e.code === 'KeyD') state.moveRight = false;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
    state.sprint = false;
  }
  if (e.code === 'Space') {
    state.jump = false;
  }
});

// Pointer lock
blocker.addEventListener('click', () => {
  renderer.domElement.requestPointerLock();
});

document.addEventListener('pointerlockchange', () => {
  state.isLocked = document.pointerLockElement === renderer.domElement;
  
  if (state.isLocked) {
    blocker.classList.add('hidden');
    hud.classList.add('visible');
  } else {
    blocker.classList.remove('hidden');
    hud.classList.remove('visible');
    state.nearInteractable = null;
    interactHint.classList.remove('visible');
  }
});

document.addEventListener('mousemove', (e) => {
  if (!state.isLocked) return;
  
  state.yaw -= e.movementX * CONFIG.mouseSensitivity;
  state.pitch -= e.movementY * CONFIG.mouseSensitivity;
  state.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, state.pitch));
});

// Touch controls for mobile (basic)
let touchStartX = 0, touchStartY = 0;
let touchActive = false;

document.addEventListener('touchstart', (e) => {
  if (!state.isLocked && e.touches.length === 1) {
    renderer.domElement.requestPointerLock();
  }
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchActive = true;
  }
});

document.addEventListener('touchmove', (e) => {
  if (!touchActive || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - touchStartX;
  const dy = e.touches[0].clientY - touchStartY;
  
  state.yaw -= dx * 0.003;
  state.pitch -= dy * 0.003;
  state.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, state.pitch));
  
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: true });

// ─── Movement & Physics ───

function updateMovement(delta) {
  if (!state.isLocked) return;
  
  // Direction vectors
  const forward = new THREE.Vector3(Math.sin(state.yaw), 0, Math.cos(state.yaw));
  const right = new THREE.Vector3(Math.sin(state.yaw + Math.PI / 2), 0, Math.cos(state.yaw + Math.PI / 2));
  
  // Movement input
  state.direction.set(0, 0, 0);
  
  if (state.moveForward) state.direction.add(forward);
  if (state.moveBackward) state.direction.sub(forward);
  if (state.moveLeft) state.direction.sub(right);
  if (state.moveRight) state.direction.add(right);
  
  if (state.direction.length() > 0) {
    state.direction.normalize();
  }
  
  // Speed
  let speed = CONFIG.walkSpeed;
  state.sprinting = false;
  
  if (state.sprint && state.sprintStamina > 0) {
    speed = CONFIG.sprintSpeed;
    state.sprintStamina -= delta * 15;
    state.sprinting = true;
  } else {
    state.sprintStamina = Math.min(CONFIG.sprintStamina, state.sprintStamina + delta * 8);
  }
  
  if (state.sprintStamina <= 0) {
    state.sprint = false;
  }
  
  // Apply velocity
  const targetVel = state.direction.clone().multiplyScalar(speed);
  state.velocity.x += (targetVel.x - state.velocity.x) * Math.min(1, delta * 10);
  state.velocity.z += (targetVel.z - state.velocity.z) * Math.min(1, delta * 10);
  
  // Gravity
  state.velocity.y += CONFIG.gravity * delta;
  
  // Jump (ground check)
  if (state.velocity.y < 0 && state.playerPos.y <= CONFIG.playerHeight) {
    state.velocity.y = 0;
    state.canJump = true;
    state.playerPos.y = CONFIG.playerHeight;
  }
  
  // Calculate new position
  const newPos = state.playerPos.clone();
  newPos.x += state.velocity.x * delta;
  newPos.y += state.velocity.y * delta;
  newPos.z += state.velocity.z * delta;
  
  // Collision detection with buildings
  for (const building of buildings) {
    const halfW = building.width / 2 + CONFIG.playerRadius;
    const halfD = building.depth / 2 + CONFIG.playerRadius;
    const halfH = building.height;
    
    // AABB collision
    const dx = newPos.x - building.x;
    const dz = newPos.z - building.z;
    
    const overlapX = halfW - Math.abs(dx);
    const overlapZ = halfD - Math.abs(dz);
    
    if (overlapX > 0 && overlapZ > 0) {
      // Collision - push out
      if (overlapX < overlapZ) {
        newPos.x = building.x + Math.sign(dx) * halfW;
        state.velocity.x = 0;
      } else {
        newPos.z = building.z + Math.sign(dz) * halfD;
        state.velocity.z = 0;
      }
    }
    
    // Ceiling check (if inside building vertically)
    if (Math.abs(dx) < building.width / 2 && Math.abs(dz) < building.depth / 2) {
      if (newPos.y < building.height && newPos.y > 0) {
        // Inside building - shouldn't happen with proper collision
        // But just in case, clamp to floor
        if (newPos.y < building.height && state.velocity.y < 0) {
          newPos.y = building.height;
          state.velocity.y = 0;
        }
      }
    }
  }
  
  // Keep in city bounds
  const bound = 420;
  newPos.x = Math.max(-bound, Math.min(bound, newPos.x));
  newPos.z = Math.max(-bound, Math.min(bound, newPos.z));
  
  state.playerPos.copy(newPos);
  camera.position.copy(newPos);
  
  // Update camera rotation
  const euler = new THREE.Euler(state.pitch, state.yaw, 0, 'YXZ');
  camera.quaternion.setFromEuler(euler);
  
  // Update sprint indicator
  if (state.sprinting) {
    sprintIndicator.style.display = 'block';
  } else {
    sprintIndicator.style.display = 'none';
  }
  
  // Check district change
  const currentDistrict = getDistrict(state.playerPos.x, state.playerPos.z);
  if (currentDistrict !== state.district) {
    state.district = currentDistrict;
    state.districtTimer = 0;
    showDistrictLabel(currentDistrict);
  }
  
  // Check for nearby interactables
  let nearestZone = null;
  let nearestDist = Infinity;
  
  for (const zone of interactZones) {
    const dx = state.playerPos.x - zone.x;
    const dz = state.playerPos.z - zone.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    
    if (dist < zone.radius && dist < nearestDist) {
      nearestDist = dist;
      nearestZone = zone;
    }
  }
  
  state.nearInteractable = nearestZone;
  
  if (nearestZone) {
    interactHint.textContent = '▸ [E] Interact ◂';
    interactHint.classList.add('visible');
  } else {
    interactHint.classList.remove('visible');
  }
}

function showDistrictLabel(districtKey) {
  const distConfig = CONFIG.districts[districtKey];
  if (!distConfig) return;
  
  districtLabel.innerHTML = `${distConfig.name}<div class="sub">${getDistrictDescription(districtKey)}</div>`;
  districtLabel.classList.add('visible');
  
  setTimeout(() => {
    districtLabel.classList.remove('visible');
  }, 3000);
}

function getDistrictDescription(key) {
  const descriptions = {
    downtown: 'The neon heart of the metropolis',
    entertainment: 'Where light becomes music',
    industrial: 'The city\'s mechanical soul',
    residential: 'Sanctuary in the endless night',
    hollows: 'Where shadows keep their secrets',
  };
  return descriptions[key] || '';
}

// ─── Interaction ───

function interact(zone) {
  if (zone.discovered) return;
  
  zone.discovered = true;
  state.discoveries.push(zone);
  
  // Update visual
  if (zone.sprite) {
    zone.sprite.material.color.setHex(0xff00ff);
    zone.sprite.material.emissive.setHex(0xff00ff);
    zone.sprite.material.emissiveIntensity = 0.8;
    zone.sprite.material.opacity = 0.3;
  }
  
  // Show discovery
  const title = zone.title || 'Discovery';
  const text = zone.text || 'You found something interesting.';
  
  discovery.innerHTML = `<div class="title">◈ ${title} ◈</div>${text.replace(/\n/g, '<br>')}`;
  discovery.classList.add('visible');
  
  // Hide after delay
  clearTimeout(discovery._timeout);
  discovery._timeout = setTimeout(() => {
    discovery.classList.remove('visible');
  }, 8000);
}

// ─── Vehicle Update ───

function updateVehicles(delta) {
  for (const vehicle of vehicles) {
    const data = vehicle.userData;
    if (!data || !data.path) continue;
    
    // Move along path
    data.pathIndex += data.direction * data.speed * delta;
    
    // Wrap around
    if (data.pathIndex >= data.path.points.length - 1) {
      data.pathIndex = 0;
    } else if (data.pathIndex < 0) {
      data.pathIndex = data.path.points.length - 1;
    }
    
    const idx = Math.floor(data.pathIndex);
    const frac = data.pathIndex - idx;
    const nextIdx = Math.min(idx + 1, data.path.points.length - 1);
    
    const p1 = data.path.points[idx];
    const p2 = data.path.points[nextIdx];
    
    if (p1 && p2) {
      vehicle.position.lerpVectors(p1, p2, frac);
      
      // Face direction of travel
      if (data.path.type === 'horizontal') {
        vehicle.rotation.y = data.direction > 0 ? 0 : Math.PI;
      } else {
        vehicle.rotation.y = data.direction > 0 ? Math.PI / 2 : -Math.PI / 2;
      }
      
      // Bob slightly
      vehicle.position.y = 0.5 + Math.sin(state.time * 3 + vehicle.id) * 0.02;
    }
  }
}

// ─── Pedestrian Update ───

function updatePedestrians(delta) {
  for (const ped of pedestrians) {
    const data = ped.userData;
    if (!data) continue;
    
    data.bobPhase += delta * 4;
    
    // Walking behavior
    if (data.pauseTimer > 0) {
      data.pauseTimer -= delta;
      // Bobbing in place
      ped.position.y = Math.abs(Math.sin(data.bobPhase)) * 0.02;
      continue;
    }
    
    // Move toward target
    const dx = data.targetX - ped.position.x;
    const dz = data.targetZ - ped.position.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    
    if (dist < 0.3) {
      // Pick new target within block
      data.targetX = data.blockX + data.margin + Math.random() * data.maxX;
      data.targetZ = data.blockZ + data.margin + Math.random() * data.maxZ;
      data.pauseTimer = data.pauseDuration;
      continue;
    }
    
    // Move
    const speed = data.walkSpeed * delta;
    const moveX = (dx / dist) * speed;
    const moveZ = (dz / dist) * speed;
    ped.position.x += moveX;
    ped.position.z += moveZ;
    
    // Rotate to face movement direction
    ped.rotation.y = Math.atan2(moveX, moveZ);
    
    // Bobbing
    ped.position.y = Math.abs(Math.sin(data.bobPhase)) * 0.02;
  }
}

// ─── Rain Update ───

function updateRain(delta) {
  const positions = rainParticles.geometry.attributes.position.array;
  const velocities = rainParticles.userData.velocities;
  const count = rainParticles.userData.count;
  
  for (let i = 0; i < count; i++) {
    positions[i * 3 + 1] -= velocities[i] * delta;
    
    if (positions[i * 3 + 1] < -2) {
      positions[i * 3] = (Math.random() - 0.5) * 500;
      positions[i * 3 + 1] = 80 + Math.random() * 20;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 500;
    }
  }
  
  rainParticles.geometry.attributes.position.needsUpdate = true;
}

// ─── Dynamic Building Animation ───

function animateBuildings(time) {
  // Animate window textures (flickering)
  for (const building of buildings) {
    if (Math.random() < 0.001) {
      // Occasionally recreate window texture for flickering effect
      const newTex = createWindowTexture(
        Math.max(64, Math.floor(building.width * 4)),
        Math.max(64, Math.floor(building.height * 4)),
        building.windowLitChance,
        Math.random()
      );
      building.mesh.material.map = newTex;
      building.mesh.material.needsUpdate = true;
    }
  }
  
  // Animate neon signs
  scene.traverse((obj) => {
    if (obj.userData && obj.userData.type === 'neonSign') {
      const flicker = Math.sin(time * 3 + obj.userData.flickerOffset) * 0.15 + 0.85;
      const flicker2 = Math.sin(time * 7 + obj.userData.flickerOffset * 2) * 0.1;
      const scale = obj.userData.baseScale.x * (flicker + flicker2);
      obj.scale.set(scale, obj.userData.baseScale.y * (flicker), 1);
      
      // Occasionally change opacity (flicker)
      if (Math.random() < 0.002) {
        obj.material.opacity = 0.3 + Math.random() * 0.7;
      } else {
        obj.material.opacity = 0.8 + Math.sin(time + obj.userData.flickerOffset) * 0.2;
      }
    }
  });
  
  // Animate central landmark
  scene.traverse((obj) => {
    if (obj.userData && obj.userData.type === 'centralLandmark') {
      const data = obj.userData;
      
      // Spire pulse
      const pulse = 1 + Math.sin(time * 1.5) * 0.1;
      data.spire.scale.set(pulse, pulse, pulse);
      data.spire.material.emissiveIntensity = 1.5 + Math.sin(time * 2) * 0.5;
      
      // Halo pulse
      const haloPulse = 1 + Math.sin(time * 0.8) * 0.05;
      data.halo.scale.set(30 * haloPulse, 30 * haloPulse, 1);
      
      // Rotating rings
      if (data.rings) {
        data.rings.forEach((ring, i) => {
          ring.rotation.z = time * (0.3 + i * 0.1) + i * 0.5;
          ring.material.emissiveIntensity = 1.5 + Math.sin(time * 2 + i) * 0.5;
        });
      }
      
      // Holographic ring
      if (data.holoRing) {
        data.holoRing.rotation.y = time * 0.5;
        data.holoRing.rotation.x = Math.PI / 3 + Math.sin(time * 0.3) * 0.2;
        data.holoRing.material.opacity = 0.3 + Math.sin(time * 1.2) * 0.15;
      }
    }
    
    if (obj.userData && obj.userData.type === 'crystalTower') {
      const pulse = 1 + Math.sin(time * 1.2 + obj.userData.crystal.position.x) * 0.15;
      obj.userData.crystal.scale.set(pulse, pulse, pulse);
      obj.userData.crystal.material.emissiveIntensity = 0.8 + Math.sin(time * 2.5) * 0.4;
      obj.userData.halo.scale.set(6 + Math.sin(time * 0.7) * 1, 6 + Math.sin(time * 0.7) * 1, 1);
    }
  });
}

// ─── Game Loop ───

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  
  const delta = Math.min(clock.getDelta(), 0.05);
  state.time += delta;
  state.frameCount++;
  
  // FPS calculation
  if (state.time - state.lastFpsTime >= 1) {
    state.fps = state.frameCount;
    state.frameCount = 0;
    state.lastFpsTime = state.time;
    fpsDisplay.textContent = `${state.fps} FPS`;
  }
  
  // Update
  updateMovement(delta);
  updateVehicles(delta);
  updatePedestrians(delta);
  updateRain(delta);
  animateBuildings(state.time);
  
  // District timer
  state.districtTimer += delta;
  
  // Render scene to targets
  renderer.setRenderTarget(colorRT);
  renderer.render(scene, camera);
  
  // Render depth to depth RT
  // Save original materials
  const originalMaterials = [];
  scene.traverse((obj) => {
    if (obj.isMesh && obj.material) {
      originalMaterials.push({ obj, material: obj.material });
      obj.material = depthMaterial;
    }
  });
  
  renderer.setRenderTarget(depthRT);
  renderer.render(scene, camera);
  
  // Restore materials
  for (const { obj, material } of originalMaterials) {
    obj.material = material;
  }
  
  renderer.setRenderTarget(null);
  
  // ASCII rendering
  renderASCII();
  
  // Minimap (every 3 frames for performance)
  if (state.frameCount % 3 === 0) {
    renderMinimap();
  }
  
  // HUD
  const speed = Math.sqrt(state.velocity.x ** 2 + state.velocity.z ** 2);
  hud.textContent = `${Math.round(speed * 3.6)} km/h · ${Math.round(state.sprintStamina)} stamina`;
}

// ─── Start ───
generateCity();
animate();

console.log(`${vehicles.length} vehicles on the roads`);
console.log(`${pedestrians.length} pedestrians wandering`);
