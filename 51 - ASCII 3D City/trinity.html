<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON-ASCII CITY // EXPLORER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #0ff;
            cursor: crosshair;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud {
            position: absolute;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #0ff;
            padding: 10px;
            font-size: 14px;
            text-shadow: 0 0 5px #0ff;
            pointer-events: auto;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 50%;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 255, 0.5);
        }
        
        #crosshair::before {
            top: 9px;
            left: 9px;
            width: 2px;
            height: 2px;
        }
        
        #crosshair::after {
            top: 50%;
            left: 50%;
            width: 20px;
            height: 1px;
            transform: translate(-50%, -50%);
        }
        
        #messageLog {
            bottom: 20px;
            left: 20px;
            max-width: 300px;
            max-height: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
 opacity: 0.8;
        }
        
        #controls {
            top: 20px;
            right: 20px;
            text-align: right;
        }
        
        #locationName {
            top: 20px;
            left: 20px;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 0 0 10px #f0f;
        }
        
        #fpsCounter {
            bottom: 20px;
            right: 20px;
        }
        
        .glitch {
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(0); }
        }
        
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(0, 255, 255, 0.1);
            animation: scan 4s linear infinite;
            pointer-events: none;
        }
        
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
        }
    </style>
</head>

const asciiMaterial = new THREE.ShaderMaterial({
    uniforms: {
 tDiffuse: { value: null },
        resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
        time: { value: 0 },
        charSize: { value: 12.0 },
        charGrid: { value: new THREE.Vector2(80, 45) } // 80x45 grid of characters },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D tDiffuse;
        uniform vec2 resolution;
        uniform float time;
        uniform vec2 charSize;
        uniform vec2 charGrid;
        varying vec2 vUv;

        // ASCII character set (80 characters)
        const char count = 80;
        uniform float charSet[count];
        
        // Convert RGB to brightness
        float brightness(vec3 color) {
            return 0.299*color.r + 0.587*color.g + 0.114*color.b;
        }

        // Hash function for random character selection
        float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
        }

        void main() {
            // Calculate character grid coordinates
            vec2 gridUv = floor(vUv * charGrid) / charGrid;
            vec2 charUv = (floor(vUv * charGrid * (resolution / charSize)) / (resolution / charSize)) * charSize;
            
            // Sample the scene texture
            vec3 sceneColor = texture2D(tDiffuse, vUv).rgb;
            float brightnessVal = brightness(sceneColor);
            
            // Create animated character based on time and position
            float charIndex = floor(brightnessVal * 79.0);
            float charNoise = hash(gridUv + time * 0.1);
            float flicker = smoothstep(0.8, 1.2, sin(time + gridUv.x * 10.0));
            
            // Select character with some randomness
            float finalIndex = mod(charIndex + charNoise * 5.0, 80.0);
            
            // Create character pattern (simplified - would need a texture atlas)
            // For now, we'll use a procedural pattern based on brightness
            vec3 charColor = vec3(0.0);
            if (finalIndex > 0.0) {
                // Create a simple pattern based on coordinates float pattern = sin(charUv.x * 5.0 + time) * cos(charUv.y * 5.0 + time * 0.5);
                charColor = vec3(pattern * 0.5 + 0.5) * sceneColor;
            }
            
            // Add neon glow effect
            float glow = 0.02 / abs(dFdx(vUv.x) + dFdy(vUv.y) + 0.001);
            vec3 finalColor = sceneColor + charColor * 0.5 + glow * vec3(0.0, 1.0, 1.0);
            
            // Add scanline effect
            float scanline = sin(vUv.y * resolution.y * 0.5 + time * 2.0) * 0.04;
            finalColor += scanline * vec3(0.0, 1.0, 1.0);
            
            gl_FragColor = vec4(finalColor, 1.0);
        }
 `

// City generation system
class CityGenerator {
    constructor() {
        this.buildings = [];
        this.streets = [];
        this.lights = [];
    }

    generateCity() {
        // Clear existing
        this.buildings.forEach(b => scene.remove(b));
        this.buildings = [];
        this.streets.forEach(s => scene.remove(s));
        this.streets = [];
        this.lights.forEach(l => scene.remove(l));
        this.lights = [];

        // Generate city grid (100x100 blocks)
        const blockSize = 10;
        const gridSize = 100;
        const maxHeight = 150;
        // Create building base mesh
        const buildingGeometry = new THREE.BoxGeometry(1, 1, 1);
        buildingGeometry.translate(0, 0.5, 0); // Pivot at bottom        // Generate buildings        for (let x = -gridSize/2; x < gridSize/2; x++) {
 for (let z = -gridSize/2; z < gridSize/2; z++) {
                // Skip streets (every other row/column)
                if (x %2 === 0 || z % 2 === 0) continue;
                
                // Random height based on position (taller in downtown)
                const distToCenter = Math.sqrt(x*x + z*z);
                const maxH = Math.max(5, maxHeight - distToCenter * 0.8);
                const height = Math.random() * maxH + 10;
                
                // Create building                const building = new THREE.Mesh(
                    buildingGeometry,
                    new THREE.MeshPhongMaterial({
 color: new THREE.Color().setHSL(0.5 + Math.random()*0.2, 1, 0.2),
                        emissive: new THREE.Color().setHSL(0.5 + Math.random()*0.2, 1, 0.1),
                        emissiveIntensity: 0.2,
                        shininess: 100
                    })
 );
                
                building.position.set(
                    x * blockSize,
0,
                    z * blockSize
 );
                building.scale.set(
                    blockSize * 0.8,
                    height,
                    blockSize * 0.8
                );
                
                scene.add(building);
                this.buildings.push(building);
                
 // Add windows (small emissive boxes)
                if (height > 20) {
                    this.addWindows(building, blockSize);
                }
            }
        }
        
        // Generate streets
        this.generateStreets(gridSize, blockSize);
        
        // Add neon signs
        this.addNeonSigns(gridSize, blockSize);
        
        // Add traffic lights
        this.addTrafficLights(gridSize, blockSize);
 }

    generateStreets(gridSize, blockSize) {
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const sidewalkMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
        
        for (let x = -gridSize/2; x <= gridSize/2; x +=2) {
            for (let z = -gridSize/2; z <= gridSize/2; z += 2) {
                // Create road segments
                const road = new THREE.Mesh(
                    new THREE.PlaneGeometry(blockSize *2, blockSize * 2),
                    roadMat
 );
                road.rotation.x = -Math.PI / 2;
                road.position.set(x * blockSize,0.1, z * blockSize);
                scene.add(road);
                this.streets.push(road);
                
                // Create sidewalk edges
                const sidewalk = new THREE.Mesh(
                    new THREE.PlaneGeometry(blockSize * 2.2, blockSize * 2.2),
                    sidewalkMat
                );
                sidewalk.rotation.x = -Math.PI / 2;
                sidewalk.position.set(x * blockSize, 0.2, z * blockSize);
                scene.add(sidewalk);
                this.streets.push(sidewalk);
            }
        }
    }

    addWindows(building, blockSize) {
        const windowGeo = new THREE.BoxGeometry(0.5, 0.5, 0.1);
        const windowMat = new THREE.MeshBasicMaterial({ 
 color: 0x00ffff,
 emissive: 0x00ffff,
            emissiveIntensity: 0.5
        });
        
        const rows = Math.floor(building.scale.y /4);
        const cols = Math.floor(building.scale.x / 4);
        
        for (let i = 0; i < rows; i++) {
            for (let j = 0; j < cols; j++) {
                if (Math.random() > 0.3) continue; // Some windows off                const window = new THREE.Mesh(windowGeo, windowMat);
                
                // Position on building face
                const x = (j / (cols - 1) - 0.5) * (building.scale.x - 1);
                const y = i * 4 + 2;
                const z = building.scale.z / 2 + 0.06;
                
                window.position.set(x, y, z);
                window.rotation.y = Math.PI / 2;
                
                building.add(window);
                this.lights.push(window);
            }
        }
    }

    addNeonSigns(gridSize, blockSize) {
        const signTexts = [
 "CYBER_CAFE", "DATA_BAR", "NEON_ARCADE", "CHROMA_LOUNGE",
            "VOID_SHOPPE", "NET_CAFE", "SYNTHWAVE_HALL", "GLITCH_CLUB"
        ];
        
        for (let i = 0; i < 20; i++) {
            const x = (Math.random() * gridSize - gridSize/2) * blockSize;
            const z = (Math.random() * gridSize - gridSize/2) * blockSize;
            
            // Place sign on building side
            const signText = signTexts[Math.floor(Math.random() * signTexts.length)];
            this.createNeonSign(signText, x, z, Math.random() * Math.PI * 2);
        }
    }

    createNeonSign(text, x, z, rotation) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 512;
        canvas.height = 128;
        
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, 512, 128);
        ctx.fillStyle = '#ff00ff';
        ctx.font = 'bold 60px "Courier New"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 256, 64);
        
        const texture = new THREE.CanvasTexture(canvas);
        const material = new THREE.SpriteMaterial({ map: texture,
            color: 0xff00ff,
            transparent: true,
            opacity: 0.8
 });
        
        const sprite = new THREE.Sprite(material);
        sprite.position.set(x, 10, z);
        sprite.scale.set(10, 2.5, 1);
        sprite.rotation.y = rotation;
        
        scene.add(sprite);
        this.lights.push(sprite);
    }

    addTrafficLights(gridSize, blockSize) {
        const poleMat = new THREE.MeshPhongMaterial({ color: 0x333333 });
        const lightMat = new THREE.MeshBasicMaterial({ 
 color: 0xff0000,
            emissive: 0xff0000,
            emissiveIntensity: 2
        });
        
        for (let x = -gridSize/2; x <= gridSize/2; x += 4) {
            for (let z = -gridSize/2; z <= gridSize/2; z += 4) {
                if (x % 2 === 0 && z % 2 === 0) {
 // Create traffic light pole
                    const pole = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.2, 0.2, 4),
                        poleMat
                    );
                    pole.position.set(x * blockSize, 2, z * blockSize);
                    scene.add(pole);
                    // Create light box
                    const box = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.8, 0.8),
                        lightMat
                    );
                    box.position.set(0, 4.5, 0);
                    pole.add(box);
                    
                    // Add to lights array for animation
                    this.lights.push(box);
                }
            }
        }
    }
}

// Vehicle and pedestrian system
class EntitySystem {
    constructor() {
        this.vehicles = [];
        this.pedestrians = [];
        this.initVehicles();
        this.initPedestrians();
    }

    initVehicles() {
        // Create moving vehicles
        for (let i = 0; i < 50; i++) {
            const vehicle = new THREE.Mesh(
                new THREE.BoxGeometry(2, 1, 4),
                new THREE.MeshStandardMaterial({ 
 color: Math.random() > 0.5 ? 0xff00ff : 0x00ffff,
                    emissive: 0x440044,
                    emissiveIntensity: 0.5
 })
 );
            
            // Random position on a road
            const roadX = (Math.floor(Math.random() * 50) - 25) * 20;
            const roadZ = (Math.floor(Math.random() * 50) - 25) * 20;
            const direction = Math.random() > 0.5 ? 1 : -1;
            
            vehicle.position.set(roadX, 0.5, roadZ);
            vehicle.rotation.y = direction === 1 ?0 : Math.PI;
            
            scene.add(vehicle);
            this.vehicles.push({
                mesh: vehicle,
                speed: 20 + Math.random() * 20,
                direction: direction,
                lane: Math.floor(Math.random() * 2) * 2 // Offset for multiple lanes
            });
        }
    }

    initPedestrians() {
        // Create walking pedestrians
        for (let i = 0; i < 30; i++) {
            const height = 2 + Math.random();
            const ped = new THREE.Mesh(
                new THREE.CapsuleGeometry(0.5, height, 4, 8),
                new THREE.MeshPhongMaterial({ 
                    color: 0x222222,
                    emissive: 0x00ffff,
                    emissiveIntensity: 0.2 })
            );
            
            // Random position on sidewalk
            const x = (Math.random() * 2000 - 1000);
            const z = (Math.random() * 2000 - 1000);
            ped.position.set(x, height/2, z);
            
            scene.add(ped);
            this.pedestrians.push({
                mesh: ped,
                speed: 2 + Math.random() * 3,
                direction: new THREE.Vector3(
 Math.random() - 0.5,
                    0,
                    Math.random() - 0.5
                ).normalize(),
 waitTime: Math.random() * 5 });
        }
    }

    update(delta) {
        // Update vehicles
        this.vehicles.forEach(v => {
            v.mesh.position.x += v.direction * v.speed * delta;
            
            // Turn around at boundaries
            if (Math.abs(v.mesh.position.x) > 1000) {
 v.direction *= -1;
                v.mesh.rotation.y += Math.PI;
            }
            
            // Add hover effect
            v.mesh.position.y = 0.5 + Math.sin(time * 5 + v.mesh.position.x) * 0.1;
        });
        
        // Update pedestrians
        this.pedestrians.forEach(p => {
            if (p.waitTime > 0) {
                p.waitTime -= delta;
            } else {
                p.mesh.position.add(p.direction.clone().multiplyScalar(p.speed * delta));
                // Random turn                if (Math.random() < 0.01) {
                    p.direction.set(
                        Math.random() - 0.5,
                        0,
                        Math.random() - 0.5
                    ).normalize();
                }
                
                // Add bobbing motion
                p.mesh.position.y = Math.abs(Math.sin(time * 10 + p.mesh.position.x)) + 1.5;
            }
        });
    }
}

// Weather system
class WeatherSystem {
    constructor() {
        this.rainDrops = [];
        this.rainIntensity = 0;
        this.fogDensity = 0.02;
        this.isRaining = false;
        this.initRain();
    }

 initRain() {
        // Create rain particles
        for (let i = 0; i < 2000; i++) {
            const rainDrop = new THREE.Mesh(
                new THREE.PlaneGeometry(0.1, 2),
                new THREE.MeshBasicMaterial({
 color: 0x00ffff,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide })
            );
            rainDrop.rotation.x = Math.PI / 2;
            rainDrop.position.set(
 (Math.random() - 0.5) * 2000,
                Math.random() * 100,
                (Math.random() - 0.5) * 2000
            );
            scene.add(rainDrop);
            this.rainDrops.push(rainDrop);
        }
    }

    update(delta, weather) {
        // Update fog based on weather
        if (weather === 'rain') {
            this.isRaining = true;
            this.rainIntensity = Math.min(this.rainIntensity + delta * 0.5, 1);
            scene.fog.density = 0.05 + this.rainIntensity * 0.05;
        } else {
            this.isRaining = false;
            this.rainIntensity = Math.max(this.rainIntensity - delta * 0.5, 0);
            scene.fog.density = 0.02;
        }
        
        // Update rain particles
        this.rainDrops.forEach(drop => {
            if (this.isRaining) {
                drop.position.y -= 100 * delta;
                drop.material.opacity = 0.6 * this.rainIntensity;
                
                // Reset if below ground
                if (drop.position.y < 0) {
 drop.position.y = 100;
                    drop.position.x = (Math.random() - 0.5) * 2000;
                    drop.position.z = (Math.random() - 0.5) * 2000;
                }
            } else {
                drop.material.opacity = 0;
            }
        });
    }
}

// Game loop
let lastTime = 0;
function animate(time) {
    time = time * 0.001; // Convert to seconds
    const delta = time - lastTime;
    lastTime = time;
    state.time = time;

    // Update weather    weatherSystem.update(delta, state.weather);

    // Player movement
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    // Get movement input
    if (keys['w']) velocity.z -=1;
    if (keys['s']) velocity.z += 1;
    if (keys['a']) velocity.x -= 1;
    if (keys['d']) velocity.x += 1;
    // Normalize and apply speed
    if (velocity.length() > 0) {
        velocity.normalize();
        const currentSpeed = keys['shift'] ? state.player.sprintSpeed : state.player.speed;
        velocity.multiplyScalar(currentSpeed * delta);
 // Apply movement relative to camera rotation
        direction.z = velocity.z;
        direction.x = velocity.x;
        direction.applyEuler(new THREE.Euler(0, state.player.rotation.y, 0, 'YXZ'));
        state.player.velocity.add(direction);
 }
    
    // Apply gravity
    state.player.velocity.y -= state.player.gravity * delta;
    
    // Jump    if (keys[' '] && state.player.onGround) {
        state.player.velocity.y = state.player.jumpForce;
        state.player.onGround = false;
    }
    
    // Update position
    state.player.position.add(state.player.velocity.clone().multiplyScalar(delta));
    
    // Simple ground collision
    if (state.player.position.y < 2) {
        state.player.position.y = 2;
        state.player.velocity.y = 0;
        state.player.onGround = true;
    }
    
    // Update camera
    camera.position.copy(state.player.position);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = state.player.rotation.y;
    camera.rotation.x = state.player.rotation.x;
    
    // Update city entities
    entitySystem.update(delta);
    
    // Render scene to texture
    renderer.render(scene, camera, renderTarget);
    
    // Apply ASCII post-processing
    asciiMaterial.uniforms.tDiffuse.value = renderTarget.texture;
    asciiMaterial.uniforms.time.value = time;
    renderer.render(asciiScene, asciiCamera);
    
    // Update FPS counter
    document.getElementById('fpsCounter').textContent = `FPS: ${Math.round(1/delta)}`;
    
    // Update location name based on position
    const location = getLocationName(state.player.position);
    document.getElementById('locationName').textContent = location;
    
    requestAnimationFrame(animate);
}

// Helper function to get location name based on position
function getLocationName(position) {
    const dist = Math.sqrt(position.x*position.x + position.z*position.z);
    if (dist < 200) return "DOWNTOWN CORE";
    if (dist < 500) return "INNER DISTRICT";
    if (dist < 1000) return "SUBURBS";
    if (dist < 1500) return "OUTER RANGES";
    return "THE SPRAWL";
}
