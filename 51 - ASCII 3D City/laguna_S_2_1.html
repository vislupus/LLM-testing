// seeded deterministic artifact locations (no external RNG lib)
const SECRETS = [];
{
  const rng = (s)=>{ let h=(s*2654435761)|0; h=((h^h<<13)^h)*0x7e53a564|0; return Math.abs(h%10000)/10000; };
  for(let i=0;i<26;i++){
    SECRETS.push({ x:(rng(i*7+1)-0.5)*78, z:(rng(i*7+2)-0.5)*78,
      name:ARTIFACTS[i%ARTIFACTS.length], collected:false });
  }
}

const WORLD = {weather:0, dayProg:0.22, mem:0, district:0};

// ============================================================================

const VS = `#version 300 es
precision highp float;
const vec2[4] P=vec2[4](vec2(-1,-1),vec2(1,-1),vec2(-1,1),vec2(1,1));
const vec2[4] T=vec2[4](vec2(0,0),vec2(1,0),vec2(0,1),vec2(1,1));
out vec2 v_uv;
void main(){gl_Position=vec4(P[gl_VertexID],0,1);v_uv=T[gl_VertexID];}`;

const PS = `#version 300 es
precision highp float;
precision highp int;
out vec4 outColor;
uniform vec2 u_res;
uniform float u_time;
uniform vec3 u_camPos;
uniform vec2 u_camRot;
uniform float u_weather,u_dayProg;
uniform int u_mem;

#define INF 150.0
#define MAXSTEPS 115

float hash21(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float hash31(vec3 p){return fract(sin(dot(p,vec3(12.98,78.23,45.63)))*43758.5453);}
vec3 modc(vec3 p,vec3 c){return p-c*floor(p/c);}
vec3 modcr(vec3 p,vec3 c){return c/2.0-abs(modc(p+c/2.0,c)-c/2.0);}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdSphere(vec3 p,float r){return length(p)-r;}

struct SC{float d;float em;float spec;float rough;vec3 al;int district;};

SC map(vec3 p){
  SC s;s.d=INF;s.em=0.0;s.spec=0.5;s.rough=0.5;s.al=vec3(0.4);s.district=0;

  float ground=p.y;
  if(ground<s.d){s.d=ground;s.al=vec3(0.04,0.09,0.13);s.spec=0.0;s.rough=0.95;s.district=0;}

  const float BLOCK=8.0,ROAD=2.2;
  vec2 bid=floor(p.xz/BLOCK);
  float h0=hash31(vec3(bid,99.0)),h1=hash31(vec3(bid,199.0)),h2=hash31(vec3(bid,299.0));
  int di=int(mod(floor(length(bid)*0.3)+h0*7.0,5.0)); if(di<0)di=0;

  float bh,bs1,bs2;vec3 colb;
  if(di==0){bh=15.0+h1*28.0;bs1=2.0+h2*0.7;bs2=2.0+h2*0.7;colb=vec3(0.10,0.26,1.0);}
  else if(di==1){bh=9.5+h1*14.0;bs1=2.8+h2*0.6;bs2=2.8+h2*0.6;colb=vec3(1.0,0.18,0.70);}
  else if(di==2){bh=7.5+h1*9.0;bs1=3.4+h2*1.2;bs2=3.4+h2*1.2;colb=vec3(0.9,0.55,0.18);}
  else if(di==3){bh=12.0+h1*16.0;bs1=2.2+h2*1.6;bs2=2.2+h2*1.6;colb=vec3(0.10,0.82,0.48);}
  else{bh=4.5+h1*7.0;bs1=2.0+h2*0.8;bs2=2.0+h2*0.8;colb=vec3(0.44,0.40,0.38);}
  bh*=0.88+sin(u_time*0.23+bid.x*1.7+bid.y*2.9)*0.04+h2*0.13;
  if(di==4&&h2>0.6)bh*=0.45;

  vec3 bp=p-vec3(bid.x*BLOCK+BLOCK/2.0,bh/2.0,bid.y*BLOCK+BLOCK/2.0);
  float bd=sdBox(bp,vec3(bs1,bh,bs2));
  if(bd<s.d){
    s.d=bd;s.district=di;s.al=colb;s.spec=0.22;s.rough=0.58;
    if(di==0){s.em=0.18+0.2*sin(u_time*1.7+bp.x*4.0+bp.z*3.0);s.al=mix(s.al,vec3(0.3,0.6,1.0),0.5);}
    if(di==1){s.em=0.35*sin(u_time*2.3+bp.x*5.0+bp.z*4.0)*0.5+0.35;s.al=mix(s.al,vec3(1.0,0.4,0.7),0.4);}
    if(di==2){s.em=0.15+0.1*sin(u_time*0.9+bp.x*2.0);s.al=mix(s.al,vec3(0.6,0.35,0.1),0.4);}
    if(di==3){s.em=0.2+0.25*sin(u_time*2.0+bp.x*4.5);s.al=mix(s.al,vec3(0.2,0.85,0.4),0.5);}
    if(di==4){s.em=0.05*(0.5+sin(u_time*0.7+bp.x*2.0)*0.5);s.al=mix(s.al,vec3(0.22,0.20,0.19),0.3);}
  }

  // central spiral monolith
  if(length(p.xz)<4.8){
    vec3 rp=modc(p.xz,vec3(8.0));
    float ang=atan(rp.z-4.0,rp.x-4.0);float rad=length(rp.xz-vec2(4.0));
    float sp=abs(rad-2.5)-0.15;
    if(sp<s.d){s.d=sp;s.al=vec3(0.05,0.9,0.75);s.em=0.6+0.3*sin(u_time*3.0);s.spec=0.05;s.rough=0.22;s.district=0;}
  }

  // sky bridges
  float sb_y=9.8+sin(u_time*0.8)*0.15;
  for(int k=-2;k<=2;k++){
    float xpos=float(k)*8.0;
    float br=sdBox(p-vec3(xpos,sb_y,0),vec3(0.75,0.18,17.0));
    if(br<s.d-0.01){s.d=br;s.al=vec3(0.27);s.em=0.1;s.spec=0.1;s.rough=0.8;s.district=0;}
  }

  // roads + dashed center line
  vec2 bc=modc(p.xz,vec3(BLOCK,0,BLOCK));
  float rcx=abs(bc.x-BLOCK/2.0),rcz=abs(bc.z-BLOCK/2.0);
  float road=min(rcx,rcz)-ROAD/2.0+0.05;
  if(road<s.d&&p.y>-0.01){
    s.d=road;s.al=vec3(0.04,0.08,0.11);s.spec=0.0;s.rough=0.92;s.district=0;
    float dash=step(0.07,abs(fract(rcx/1.6)-0.5));
    s.em=dash*0.22;
  }

  // moving vehicles (axis-aligned flows on roads)
  float vh=1.5,vw=3.2,vv=1.8;
  for(int ax=0;ax<2;ax++){
    float to=u_time*3.7+float(ax)*13.0+h0*6.0;
    vec3 cp;
    if(ax==0){cp=vec3(mod(to+p.z*0.08,BLOCK)-BLOCK/2.0,p.y,p.z);}
    else{cp=vec3(p.x,p.y,mod(to+p.x*0.08,BLOCK)-BLOCK/2.0);}
    float car=sdBox(p-cp,vec3(vw,vh,vv));
    if(car<s.d+0.01){s.d=car;s.al=vec3(0.95,0.18,0.15);s.em=0.6;s.spec=0.08;s.rough=0.3;s.district=0;}
  }

  // pedestrians
  for(int i=0;i<15;i++){
    float ps=u_time*0.72+float(i)*11.0+h0*5.0;
    vec3 pp=vec3(sin(ps*0.6)*6.4+cos(float(i)*2.1)*2.3,
                 1.78+sin(ps*0.4)*0.07,
                 cos(ps*0.6)*6.4+sin(float(i)*2.5)*2.3);
    float walk=sdSphere(p-pp,0.28);
    if(walk<s.d){s.d=walk;s.al=vec3(0.99);s.em=0.0;s.spec=0.75;s.rough=0.2;s.district=0;}
  }

  // magnetic lev trains (z = ±12)
  float tr_y=13.4+sin(u_time*0.5)*0.4;
  float tpos=mod(u_time*5.2,BLOCK*5.0)-BLOCK*2.5;
  for(int sg=-1;sg<=1;sg+=2){
    vec3 tp=p-vec3(tpos,tr_y,float(sg)*12.0);
    float tr=sdBox(tp,vec3(5.8,1.8,1.2));
    if(tr<s.d){
      s.d=tr;s.al=vec3(0.85,0.88,0.95)*0.6;s.em=0.35+0.25*sin(u_time*4.0);
      s.spec=0.45;s.rough=0.3;s.district=0;
      float wn=modc(tp.y,vec3(0.8));
      if(abs(wn)<0.09)s.em+=0.7;
    }
  }

  // neon signage strips on building corners
  if(s.d<INF*0.5){
    vec2 bc2=modc(p.xz,vec3(BLOCK,0,BLOCK));
    float corner=min(min(abs(bc2.x-BLOCK/2.0),abs(bc2.z-BLOCK/2.0)),min(abs(bc2.x),abs(bc2.z)));
    if(corner<0.43&&abs(p.y-4.5)<2.4){
      float pulse=sin(u_time*3.3+float(s.district)*1.7+h1*9.0)*0.5+0.5;
      s.em+=pulse*0.8;
      vec3 nc=vec3(0.0,0.98,0.95);
      if(s.district==1)nc=vec3(1.0,0.25,0.65);
      else if(s.district==2)nc=vec3(0.92,0.55,0.2);
      else if(s.district==3)nc=vec3(0.1,0.85,0.5);
      else if(s.district==4)nc=vec3(0.6,0.55,0.5);
      s.al=mix(s.al,nc,0.5);
    }
  }
  return s;
}

vec3 calcN(vec3 p){
  vec2 e=vec2(1e-2,-1e-2);float d=map(p).d;
  return normalize(e.xyy*map(p+e.xyy).d+e.yyx*map(p+e.yyx).d+e.yxy*map(p+e.yxy).d+e.xxx*map(p+e.xxx).d);
}
float softShadow(vec3 ro,vec3 rd,float k){
  float res=1.0,t=0.01;
  for(int i=0;i<16;i++){float h=map(ro+rd*t).d;if(h<1e-3)return 0.0;res=min(res,k*h/t);t+=h;if(t>30.0)break;}
  return res;
}

void main(){
  vec2 uv=(v_uv-0.5);uv.x*=u_res.x/u_res.y;
  float yaw=u_camRot.x,pitch=clamp(u_camRot.y,-1.5,1.5);
  vec3 ro=u_camPos;
  vec3 rd=normalize(vec3(cos(pitch)*sin(yaw),sin(pitch),cos(pitch)*cos(yaw)));

  // sky gradient + stars
  float dp=u_dayProg;
  vec3 skyHi=mix(vec3(0.006,0.045,0.20),vec3(0.20,0.40,0.68),dp);
  vec3 skyLo=mix(vec3(0.0,0.014,0.06),vec3(0.07,0.13,0.24),dp);
  vec3 skyCol=mix(skyLo,skyHi,pow(clamp(rd.y+0.2,0.0,1.0),3.0));
  vec2 suv=rd.xz*vec2(1.0,0.55);
  float stars=step(0.996,hash21(floor(suv*72.0)));
  skyCol+=stars*vec3(0.6,0.8,1.0)*0.22*(1.0-dp*0.6);

  // raymarch
  float t=0.0;SC s;s.d=INF;s.district=0;vec3 pos=ro;bool sky=true;
  for(int i=0;i<MAXSTEPS;i++){
    pos=ro+rd*t;SC h=map(pos);
    if(h.d<1e-3){s=h;sky=false;break;}
    if(t>INF)break;
    t+=max(h.d,6e-3);
  }
  vec3 col=skyCol;
  float depthNorm=min(t/INF,1.0);

  if(!sky){
    vec3 n=calcN(pos);
    float ndotl=max(dot(n,normalize(vec3(0.5,1.0,0.3))),0.0);
    float sh=mix(0.22,1.0,softShadow(pos,normalize(vec3(0.5,1.0,0.3)),8.0));
    vec3 dcol=vec3(0.0);
    if(s.district==0)dcol=vec3(0.08,0.30,1.0);else if(s.district==1)dcol=vec3(1.0,0.22,0.65);
    else if(s.district==2)dcol=vec3(0.85,0.50,0.15);else if(s.district==3)dcol=vec3(0.10,0.82,0.45);
    else dcol=vec3(0.42,0.38,0.35);
    col=s.al*(0.10+ndotl*0.55)*sh;
    col+=s.al*dcol*0.07;
    vec3 emC=vec3(0.0,0.9,0.85);
    if(s.district==1)emC=vec3(1.0,0.25,0.65);else if(s.district==2)emC=vec3(0.92,0.55,0.2);
    else if(s.district==0)emC=vec3(0.35,0.6,1.0);else if(s.district==3)emC=vec3(0.1,0.85,0.5);
    else emC=vec3(0.55,0.55,0.55);
    col+=emC*s.em;
    float fd=min(1.0,t*0.022+depthNorm*0.25);
    col=mix(mix(vec3(0,0.03,0.08),skyCol*0.4),col,exp(-fd*1.1));
  }else{
    float fd=min(1.0,t*0.045);
    col=mix(vec3(0.0,0.012,0.04)*0.5,col,exp(-fd*0.9));
  }

  // rain overlay (screen-space streaks)
  if(u_weather>0.2){
    vec2 ruv=v_uv*u_res*vec2(0.85,0.5);float rain=0.0;
    for(int i=0;i<7;i++){
      float sp=float(i)/7.0;
      vec2 rp=vec2(fract(ruv.x+sp*0.137+u_time*1.9),
                   fract(ruv.y+sp*0.29+u_time*6.1+sp*3.0));
      float dd=length(rp-vec2(0.5,0.5));rain+=0.011/(dd*70.0+0.01);
    }
    rain*=u_weather*0.55;
    vec3 rcol=vec3(0.35,0.45,0.62);
    if(u_weather>0.8)rcol=vec3(0.5,0.5,0.7);
    col+=rain*rcol;
  }
  float vig=pow(16.0*uv.x*uv.x*uv.y*uv.y*(0.6-abs(uv.x))*(0.6-abs(uv.y)),0.25);
  col*=vig*1.1;
  outColor=vec4(col,depthNorm);
}
`;

// ============================================================================
// WebGL initialization
// ============================================================================
function makeShader(src, type){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error("Shader error:", gl.getShaderInfoLog(sh));
    throw new Error("shader compile");
  }
  return sh;
}
function setupGL(){
  gl = canvas.getContext('webgl2', {antialias:false, preserveDrawingBuffer:false});
  if(!gl) throw new Error("WebGL2 required.");
  gl.getExtension('OES_texture_float_linear');
  gl.getExtension('WEBGL_color_buffer_float');
  const vs = makeShader(VS, gl.VERTEX_SHADER);
  const ps = makeShader(PS, gl.FRAGMENT_SHADER);
  rProgram = gl.createProgram();
  gl.attachShader(rProgram, vs); gl.attachShader(rProgram, ps);
  gl.linkProgram(rProgram);
  if(!gl.getProgramParameter(rProgram, gl.LINK_STATUS)){
    console.error("Link:", gl.getProgramInfoLog(rProgram));
    throw new Error("link");
  }
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);

  fbColor = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, fbColor);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, RES_W, RES_H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  fbDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, fbDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, RES_W, RES_H);
  fbo = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fbColor, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, fbDepth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  canvas.width = RES_W; canvas.height = RES_H;
}

// ── Glyph atlas (pre-rendered) ───────────────────────────────────────────────
const GLYPH_ATLAS = {};
{
  const off = new OffscreenCanvas(GW, GH);
  const ox = off.getContext('2d');
  ox.textBaseline='middle'; ox.textAlign='center';
  ox.font = 'bold 13px "Courier New",monospace';
  for(const c of GLYPHS){
    ox.clearRect(0,0,GW,GH);
    ox.fillStyle='#000'; ox.fillRect(0,0,GW,GH);
    ox.fillStyle='#fff'; ox.fillText(c, GW/2, GH/2 + 1);
    GLYPH_ATLAS[c] = ox.getImageData(0,0,GW,GH).data;
  }
}

// ── ASCII rasterization pass ─────────────────────────────────────────────────
function drawASCII(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.readPixels(0,0,RES_W,RES_H,gl.RGBA,gl.UNSIGNED_BYTE, pixelBuf);

  aCtx.fillStyle='#050b12';
  aCtx.fillRect(0,0,asciiCanvas.width,asciiCanvas.height);

  const imgW = RES_W*GW, imgH = RES_H*GH;
  const imageData = aCtx.createImageData(imgW, imgH);
  const px = imageData.data;

  for(let y=0;y<RES_H;y++){
    const sy = RES_H-1-y; // flip (GL origin bottom-left)
    for(let x=0;x<RES_W;x++){
      const si = (sy*RES_W + x)*4;
      const r = pixelBuf[si], g = pixelBuf[si+1], b = pixelBuf[si+2];
      const a = pixelBuf[si+3];   // depth 0..255
      const luma = r*0.299+g*0.587+b*0.114;
      let gi = Math.floor(luma/255 * GLYPHS.length);
      if(gi>=GLYPHS.length) gi=GLYPHS.length-1;
      if(gi<0) gi=0;
      const depth = a/255;
      if(depth>0.5) gi = Math.max(gi-2, 0);   // distant → sparser glyphs

      const c = GLYPHS[gi];
      const glyph = GLYPH_ATLAS[c];
      const cr=r, cg=g, cb=b;
      const base=(y*GW*imgW + x*GW)*4;
      for(let yy=0;yy<GH;yy++){
        const row = (yy*imgW*GW) + base;
        for(let xx=0;xx<GW;xx++){
          if(glyph[(yy*GW+xx)*4] > 130){
            const di = row + xx*4;
            px[di]=cr; px[di+1]=cg; px[di+2]=cb; px[di+3]=255;
          }
        }
      }
    }
  }
  aCtx.putImageData(imageData, 0, 0);
}

// ── Camera physics ───────────────────────────────────────────────────────────
function updateCamera(dt){
  const speed = cam.sprint ? 7.2 : 3.3;
  const f = [-Math.sin(cam.yaw), 0, -Math.cos(cam.yaw)];
  const r = [ Math.cos(cam.yaw), 0, -Math.sin(cam.yaw)];
  let mv=[0,0,0];
  if(KEYS['KeyW']){ mv[0]+=f[0]; mv[2]+=f[2]; }
  if(KEYS['KeyS']){ mv[0]-=f[0]; mv[2]-=f[2]; }
  if(KEYS['KeyA']){ mv[0]-=r[0]; mv[2]-=r[2]; }
  if(KEYS['KeyD']){ mv[0]+=r[0]; mv[2]+=r[2]; }
  const len = Math.hypot(mv[0],mv[2])||1;
  mv[0]/=len; mv[2]/=len;

  if(cam.fly){
    if(KEYS['Space']) cam.vel[1]=6;
    if(KEYS['ShiftLeft']||KEYS['ShiftRight']) cam.vel[1]=-6;
  } else {
    cam.vel[1] += -18*dt;
  }
  if(mv[0]||mv[2]){ cam.vel[0]=mv[0]*speed; cam.vel[2]=mv[2]*speed; }
  else { cam.vel[0]*=0.84-cam.fly*0.48; cam.vel[2]*=0.84-cam.fly*0.48; }
  cam.pos[0]+=cam.vel[0]*dt; cam.pos[1]+=cam.vel[1]*dt; cam.pos[2]+=cam.vel[2]*dt;

  if(!cam.fly){
    if(cam.pos[1]<1.65){ cam.pos[1]=1.65; cam.vel[1]=0; cam.onGround=true; }
    else cam.onGround=false;
  }
  // sprint stamina
  if(cam.sprint && (mv[0]||mv[2]) && !cam.fly && cam.onGround){
    cam.stamina = Math.max(0, cam.stamina - dt*0.45);
    if(cam.stamina<=0){ cam.sprint=false; }
  } else {
    cam.stamina = Math.min(1, cam.stamina + dt*0.32);
  }
}

// ── Weather cycles ───────────────────────────────────────────────────────────
function updateWeather(){
  const w = 0.5+0.5*Math.sin(NOW.t*0.05 - 1.0);
  if(w<0.12) WORLD.weather=0;
  else if(w<0.55) WORLD.weather=1;
  else if(w<0.8) WORLD.weather=2;
  else WORLD.weather=3;
  // district underfoot
  const BLOCK=8.0;
  const bid=[Math.floor((cam.pos[0]+BLOCK/2)/BLOCK), Math.floor((cam.pos[2]+BLOCK/2)/BLOCK)];
  let h = Math.abs(bid[0]*7+bid[1]*3 + Math.round(cam.pos[0]+cam.pos[2])) % 5;
  WORLD.district = Math.max(0,Math.min(4,h));
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function updateHUD(){
  const secs = (NOW.t*0.05) % 86400;
  const h = Math.floor(secs/3600);
  const m = Math.floor((secs%3600)/60);
  const s=`${String(h%24).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  document.getElementById('s-pos').textContent =
    `Pos: ${cam.pos[0].toFixed(1)}, ${cam.pos[1].toFixed(1)}, ${cam.pos[2].toFixed(1)}`;
  document.getElementById('s-dat').textContent = `District: ${DISTRICTS[WORLD.district].name}`;
  document.getElementById('s-mode').textContent = `Mode: ${cam.fly?'NOIR':'EXPLORATION'}`;
  const bar='■'.repeat(Math.floor(cam.stamina*5))+'□'.repeat(5-Math.floor(cam.stamina*5));
  document.getElementById('s-stam').textContent = `Stamina: ${bar}`;
  document.getElementById('s-weather').textContent = `Weather: ${WEATHER_NAMES[WORLD.weather]}`;
  document.getElementById('s-time').textContent = `Time: ${s}`;
  document.getElementById('s-mem').textContent = `Memory: ${WORLD.mem}`;
}

// ── Interaction ──────────────────────────────────────────────────────────────
function tryInteract(){
  let best=null, bestD=4.0;
  for(const s of SECRETS){
    if(s.collected) continue;
    const d=Math.hypot(cam.pos[0]-s.x, cam.pos[2]-s.z);
    if(d<bestD){ best=s; bestD=d; }
  }
  if(best){
    best.collected=true;
    WORLD.mem++;
    showMessage(
      "⚡ <b>"+best.name+"</b> RECOVERED<br>"
      +"Fragment indexed into neural buffer. ("+WORLD.mem+"/"+SECRETS.length+")<br><br>"
      +"The district's whisper grows clearer...");
    return;
  }
  const dCenter = Math.hypot(cam.pos[0], cam.pos[2]);
  if(dCenter < 5){
    showMessage(
      "The SPIRAL MONOLITH hums.<br>"
      +"Its geometry does not obey Euclidean law. Something watches from inside the prime block.<br><br>"
      +"Memories drift like ash in vacuum.");
    return;
  }
  showMessage("Static. Nothing here but the endless glow of the grid.");
}

function showMessage(html){
  const el=document.getElementById('msg');
  el.innerHTML = '<div id="msg-inner">'+html+'</div>'+'<div class="ps">E = interact • F = flight • T = day/night • R = reset • M = scan • ? = help • Esc = release mouse</div>';
  el.classList.add('show');
  clearTimeout(el._to);
  el._to=setTimeout(()=>el.classList.remove('show'), 5500);
}

// ── Event handlers ───────────────────────────────────────────────────────────
function onKeyDown(e){
  KEYS[e.code]=true;
  if(e.code==='KeyE') tryInteract();
  if(e.code==='KeyF') cam.fly=!cam.fly;
  if(e.code==='KeyT') WORLD.dayProg = (WORLD.dayProg+0.17)%1;
  if(e.code==='KeyR'){ cam.pos=[0,1.65,0]; cam.vel=[0,0,0]; cam.yaw=0.6; cam.pitch=0; }
  if(e.code==='KeyM'){ WORLD.mem = Math.min(WORLD.mem+2, SECRETS.length); }
  if(e.code==='Period' || e.code==='KeyI') showHelp();
  if(e.code==='Escape') releasePointer();
}
function onKeyUp(e){
  if(e.code==='ShiftLeft'||e.code==='ShiftRight') cam.sprint=false;
  KEYS[e.code]=false;
}
function onMouseMove(e){
  if(!mouseLocked) return;
  cam.yaw += e.movementX*0.0018;
  cam.pitch = Math.max(-1.48, Math.min(1.48, cam.pitch + e.movementY*0.0018));
  cam.sprint = cam.stamina>0.1 && (KEYS['ShiftLeft']||KEYS['ShiftRight']);
}
function lockPointer(){ canvas.requestPointerLock(); }
function releasePointer(){
  if(document.pointerLockElement) document.exitPointerLock();
}
function showHelp(){
  showMessage(
    "<b>NEXUS PRIME — FIELD MANUAL</b><br><br>"
    +"<b>W/A/S/D</b> — move &nbsp;|&nbsp; <b>Mouse</b> — look (locks on click)<br>"
    +"<b>Shift</b> — sprint (drains stamina)<br>"
    +"<b>F</b> — toggle NOIR flight mode<br>"
    +"<b>E</b> — interact / collect artifacts<br>"
    +"<b>T</b> — cycle day/night &nbsp;|&nbsp; <b>M</b> — memory scan<br>"
    +"<b>R</b> — recall (reset) &nbsp;|&nbsp; <b>Esc</b> — release mouse<br><br>"
    +"Five districts generate on an infinite block grid:<br>"
    +"THE HOLLOW (towers), NEON BAZAAR (commerce), FACTORY DISTRICT,<br>"
    +"SKYLINE GARDENS, ABANDONED SECTOR (ruins).<br>"
    +"Trains ride magnetic rails. Rain cycles with storm. <br><br>"
    +"Find all 26 artifacts to complete the archive.");
}

// ============================================================================
// Main loop
// ============================================================================
let then = 0;
function frame(time){
  NOW.t = time*0.001;
  NOW.dt = (time - then)/1000; then = time;
  const dt = Math.min(NOW.dt, 0.05);

  updateCamera(dt);
  updateWeather();
  updateHUD();

  // raymarched render
  gl.viewport(0,0,RES_W,RES_H);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(rProgram);
  const L=(n)=>gl.getUniformLocation(rProgram,n);
  gl.uniform2f(L('u_res'), RES_W, RES_H);
  gl.uniform1f(L('u_time'), NOW.t);
  gl.uniform3fv(L('u_camPos'), cam.pos);
  gl.uniform2f(L('u_camRot'), cam.yaw, cam.pitch);
  gl.uniform1f(L('u_weather'), WORLD.weather);
  gl.uniform1f(L('u_dayProg'), WORLD.dayProg);
  gl.uniform1i(L('u_mem'), WORLD.mem);
  gl.bindVertexArray(vao);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  drawASCII();
  requestAnimationFrame(frame);
}

// ── Init ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('click', lockPointer);
canvas.addEventListener('mousemove', onMouseMove);
document.addEventListener('keydown', onKeyDown);
document.addEventListener('keyup', onKeyUp);
document.addEventListener('pointerlockchange',()=>{ mouseLocked = !!document.pointerLockElement; });
document.getElementById('enterbtn').addEventListener('click',()=>{
  canvas.requestPointerLock();
  document.getElementById('enterbtn').style.display='none';
});
document.getElementById('helpbtn').addEventListener('click', showHelp);

setupGL();
requestAnimationFrame(frame);
</script>
