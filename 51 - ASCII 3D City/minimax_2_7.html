// Narrative fragments
const NARRATIVES = [
'The city remembers what its people forget...\n\nIn the early days, we thought consciousness could be uploaded, preserved forever in silicon. But memory isn\'t data. It decays, distorts, becomes something new. The city is our collective memory now—flickering, fragmenting, beautiful.',

// Noise functions
function noise2D(x, y) {
const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
return n - Math.floor(n);
}

function smoothNoise(x, y) {
const corners = (noise2D(x-1,y-1) + noise2D(x+1,y-1) + noise2D(x-1,y+1) + noise2D(x+1,y+1)) / 16;
const sides = (noise2D(x-1,y) + noise2D(x+1,y) + noise2D(x,y-1) + noise2D(x,y+1)) / 8;
const center = noise2D(x,y) / 4;
return corners + sides + center;
}

function interpolatedNoise(x, y) {
const intX = Math.floor(x);
const fracX = x - intX;
const intY = Math.floor(y);
const fracY = y - intY;
const v1 = smoothNoise(intX, intY);
const v2 = smoothNoise(intX + 1, intY);
const v3 = smoothNoise(intX, intY + 1);
const v4 = smoothNoise(intX + 1, intY + 1);
const i1 = v1 * (1 - fracX) + v2 * fracX;
const i2 = v3 * (1 - fracX) + v4 * fracX;
return i1 * (1 - fracY) + i2 * fracY;
}

function perlin(x, y, octaves = 4) {
let total = 0;
let frequency = 1;
let amplitude = 1;
let maxValue = 0;
for (let i = 0; i < octaves; i++) {
total += interpolatedNoise(x * frequency, y * frequency) * amplitude;
maxValue += amplitude;
amplitude *= 0.5;
frequency *= 2;
}
return total / maxValue;
}

// World generation
function generateWorld() {
world = {blocks: {}, signs: {}, decorations: {}, lights: {}, reflections: {}};

// Generate base terrain
for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x += 1) {
for (let y = -WORLD_SIZE/2; y < WORLD_SIZE/2; y += 1) {
const bx = Math.floor(x / 2) * 2;
const by = Math.floor(y / 2) * 2;

if (bx % 2 !== 0 || by % 2 !== 0) continue;

// Street detection with variety
const isMainStreet = (bx % 32 === 0 && bx !== 0) || (by % 32 === 0 && by !== 0);
const isSecondary = (bx % 16 === 0 || by % 16 === 0) && !isMainStreet;
const isAlley = (bx % 8 === 0 || by % 8 === 0) && !isMainStreet && !isSecondary;

// Crossroads
const isIntersection = (bx % 32 === 0 && by % 32 === 0);
const isPlaza = isIntersection && Math.random() < 0.2;

if (isPlaza) {
world.blocks[`${bx},${by}`] = {
height: 0,
type: 'plaza',
color: '#1a1a2e',
decoration: generatePlaza()
};
} else if (isMainStreet || isSecondary || isAlley) {
// Streets - different types
const streetType = isMainStreet ? 'main' : (isSecondary ? 'secondary' : 'alley');
const lighting = isMainStreet ? 0.6 : (isSecondary ? 0.3 : 0.1);
world.blocks[`${bx},${by}`] = {
height: 0,
type: 'street',
streetType: streetType,
lighting: lighting
};

// Add street lights on main streets
if (isMainStreet && bx % 16 === 0 && by % 16 === 0) {
world.lights[`${bx},${by}`] = {
type: 'streetlight',
color: Math.random() < 0.5 ? NEON_PALETTE.amber : NEON_PALETTE.cyan,
intensity: 0.5 + Math.random() * 0.5,
flicker: Math.random() < 0.1
};
}
} else {
// Buildings
const height = getBuildingHeight(bx, by);
if (height > 0.2) {
const district = getDistrict(bx, by);
const blockType = getBlockType(bx, by, district);
world.blocks[`${bx},${by}`] = {
height: height,
district: district.name,
color: district.color,
color2: shiftColor(district.color, Math.random() * 0.3),
windows: generateWindows(height, district),
sign: Math.random() < 0.25 ? generateSign(district) : null,
antenna: Math.random() < 0.15,
type: blockType,
floors: Math.ceil(height * 8),
litFloors: Math.floor(Math.random() * Math.ceil(height * 8) * 0.6)
};
}
}
}
}

// Add hidden secrets
placeSecrets();
}

function getBlockType(x, y, district) {
const hash = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453);
// Varied building types
if (district.name === 'THE CORE') {
return hash > 0.7 ? 'corporate' : (hash > 0.4 ? 'office' : 'mixed');
} else if (district.name === '霓虹通り') {
return hash > 0.5 ? 'shop' : 'residential';
} else if (district.name === 'GARDEN DISTRICT') {
return hash > 0.6 ? 'temple' : 'house';
} else if (district.name === 'THE UNDERBELLY') {
return hash > 0.4 ? 'industrial' : 'warehouse';
}
return 'generic';
}

function shiftColor(hex, amount) {
const r = Math.min(255, parseInt(hex.slice(1,3), 16) + amount * 50);
const g = Math.min(255, parseInt(hex.slice(3,5), 16) + amount * 50);
const b = Math.min(255, parseInt(hex.slice(5,7), 16) + amount * 50);
return `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
}

function generatePlaza() {
const elements = ['fountain', 'statue', 'garden', 'clock', 'monument'];
return elements[Math.floor(Math.random() * elements.length)];
}

'電脳 Café', 'CYBER Sushi', 'NEON 88', '再起動 RESTART',

'▲ SYNC ▲', '量子 Cafe', 'NULLptr', '◆ ACCESS ◆', '茶室 TEA',
'神 NOS', '0xFF', '∞ LOOP', '記憶 MEMORY', 'ΔT∀', '█ BEYOND █',
'ネオン', 'CYBERPUNK', 'HACK', 'MATRIX', '01001', '◆◆◆',
'雨 RAIN', '夢 DREAM', '東京', 'NIGHT', 'CITY', '////',
'━━━', '════', '▓▓▓▓', '████████', '░░░░', '▒▒▒▒'
];

text: phrases[Math.floor(Math.random() * phrases.length)],

for (let i = 0; i < 8; i++) {

world.decorations[`cat_${i}`] = {

// Generate building windows pattern
function generateWindows(height, district) {
const windows = [];
const rows = Math.floor(height * 6) + 2;
const cols = 6 + Math.floor(Math.random() * 4);
const color = district ? district.color : NEON_PALETTE.cyan;

// Time-based window patterns
const patterns = [
() => Math.random() < 0.3, // Random
() => Math.sin(frameCount * 0.01 + Math.random() * 10) > 0.3, // Flickering
() => Math.random() < 0.5, // Half
() => frameCount % 100 < 50 ? Math.random() < 0.4 : Math.random() < 0.2 // Patterns
];
const pattern = patterns[Math.floor(Math.random() * patterns.length)];

for (let r = 0; r < rows; r++) {
let row = '';
for (let c = 0; c < cols; c++) {
const isLit = pattern();
const windowType = Math.random();
let char;
if (isLit) {
char = windowType > 0.6 ? '◐' : (windowType > 0.3 ? '●' : '▪');
} else {
char = windowType > 0.5 ? '▫' : '□';
}
row += char;
}
windows.push({
row: row,
color: isLit ? color : NEON_PALETTE.dim
});
}
return windows;
}

// Generate neon sign text
function generateSign() {
const phrases = [
'電脳 Café', 'CYBER Sushi', 'NEON 88', '再起動 RESTART',
'夜 CITY', 'Binary Soul', 'RAMEN', 'GHOST DATA', '1999',
'▲ SYNC ▲', '量子 Cafe', 'NULLptr', '◆ ACCESS ◆', '茶室 TEA',
'神 NOS', '0xFF', '∞ LOOP', '記憶 MEMORY', 'ΔT∀', '█ BEYOND █'
];
return phrases[Math.floor(Math.random() * phrases.length)];
}

function getBuildingHeight(x, y) {
const district = getDistrict(x, y);
const baseNoise = perlin(x * 0.05, y * 0.05, 4);
const detailNoise = perlin(x * 0.2, y * 0.2, 2) * 0.3;

// Distance from center reduces height
const distFromCenter = Math.sqrt(x*x + y*y) / 60;
const centerMult = Math.max(0.3, 1 - distFromCenter * 0.3);

let height = (baseNoise * 0.7 + detailNoise) * district.heightMult * centerMult;

// Streets
if (x % 24 === 0 || y % 24 === 0) height = 0;
if ((x + 4) % 24 === 0 || (y + 4) % 24 === 0) height *= 0.5;

return Math.max(0, Math.min(1, height));
}

function getDistrict(x, y) {
let closest = DISTRICTS[0];
let minDist = Infinity;
for (const d of DISTRICTS) {
const dist = Math.sqrt((x - d.center.x) ** 2 + (y - d.center.y) ** 2);
if (dist < minDist) {
minDist = dist;
closest = d;
}
}
return closest;
}

// Initialize NPCs with variety
function initNPCs() {
npcs = [];
const npcCount = 60;

// Spawn different NPC types
for (let i = 0; i < npcCount; i++) {
spawnNPC();
}

// Add drones
for (let i = 0; i < 8; i++) {
spawnDrone();
}
}

function spawnNPC() {
const angle = Math.random() * Math.PI * 2;
const dist = 15 + Math.random() * 80;
const district = getDistrict(Math.cos(angle) * dist, Math.sin(angle) * dist);

const types = [
{type: 'pedestrian', chars: ['♪', '♦', '●', '○'], colors: [NEON_PALETTE.mint, NEON_PALETTE.pink, NEON_PALETTE.cyan, NEON_PALETTE.amber], speed: 1.5},
{type: 'worker', chars: ['■', '□', '▪', '▫'], colors: [NEON_PALETTE.amber, NEON_PALETTE.orange, NEON_PALETTE.yellow], speed: 1.2},
{type: 'punk', chars: ['▲', '△', '▼', '▽'], colors: [NEON_PALETTE.pink, NEON_PALETTE.purple, NEON_PALETTE.red], speed: 2},
{type: 'couple', chars: ['♥', '❤', '♦', '♠'], colors: [NEON_PALETTE.pink], speed: 0.8},
{type: 'homeless', chars: ['~', '≈', '≋', '≡'], colors: [NEON_PALETTE.dim, NEON_PALETTE.white], speed: 0.3},
{type: 'exec', chars: ['★', '☆', '✦', '✧'], colors: [NEON_PALETTE.cyan, NEON_PALETTE.mint], speed: 2.5}
];

const typeData = types[Math.floor(Math.random() * types.length)];
const npc = {
x: Math.cos(angle) * dist,
y: Math.sin(angle) * dist,
z: 0,
rot: Math.random() * Math.PI * 2,
char: typeData.chars[Math.floor(Math.random() * typeData.chars.length)],
color: typeData.colors[Math.floor(Math.random() * typeData.colors.length)],
frame: 0,
frameTimer: 0,
behavior: Math.random() < 0.6 ? 'wander' : (Math.random() < 0.5 ? 'idle' : 'patrol'),
targetX: 0,
targetY: 0,
speed: typeData.speed * (0.8 + Math.random() * 0.4),
moveTimer: 0,
pauseTimer: 0,
district: district.name,
glow: Math.random() < 0.3
};
npcs.push(npc);
}

function spawnDrone() {
const angle = Math.random() * Math.PI * 2;
const dist = 30 + Math.random() * 50;
drones.push({
x: Math.cos(angle) * dist,
y: Math.sin(angle) * dist,
z: 5 + Math.random() * 10,
targetZ: 5 + Math.random() * 10,
rot: Math.random() * Math.PI * 2,
frame: 0,
type: Math.random() < 0.5 ? 'surveillance' : 'delivery',
speed: 3 + Math.random() * 2
});
}

let drones = [];

function updateDrones(dt) {
for (const drone of drones) {
// Hover motion
drone.z += Math.sin(frameCount * 0.05 + drone.x) * 0.02;
drone.x += Math.cos(frameCount * 0.02 + drone.y) * dt * 0.5;
drone.y += Math.sin(frameCount * 0.02 + drone.x) * dt * 0.5;

// Keep in bounds
const bound = WORLD_SIZE / 2 - 20;
drone.x = Math.max(-bound, Math.min(bound, drone.x));
drone.y = Math.max(-bound, Math.min(bound, drone.y));

drone.frame = (drone.frame + dt * 5) % 4;
}
}

function updateNPCs(dt) {
for (const npc of npcs) {
npc.frameTimer += dt;
if (npc.frameTimer > 0.15) {
npc.frameTimer = 0;
npc.frame = (npc.frame + 1) % 4;
}

npc.moveTimer -= dt;

// State machine for behaviors
if (npc.pauseTimer > 0) {
npc.pauseTimer -= dt;
} else {
npc.moveTimer -= dt;
if (npc.moveTimer <= 0) {
switch(npc.behavior) {
case 'wander':
npc.targetX = npc.x + (Math.random() - 0.5) * 30;
npc.targetY = npc.y + (Math.random() - 0.5) * 30;
npc.moveTimer = 3 + Math.random() * 4;
break;
case 'idle':
npc.pauseTimer = 2 + Math.random() * 4;
npc.moveTimer = 1;
break;
case 'patrol':
const patrolDir = Math.random() < 0.5 ? 1 : -1;
npc.targetX = npc.x + Math.cos(npc.rot + Math.PI/2 * patrolDir) * 15;
npc.targetY = npc.y + Math.sin(npc.rot + Math.PI/2 * patrolDir) * 15;
npc.moveTimer = 2;
npc.rot += patrolDir * 0.1;
break;
}
}
}

if (npc.pauseTimer <= 0) {
const dx = npc.targetX - npc.x;
const dy = npc.targetY - npc.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist > 0.5) {
const speed = npc.speed * dt;
npc.x += (dx / dist) * speed;
npc.y += (dy / dist) * speed;
npc.rot = Math.atan2(dy, dx);
}
}

// Keep in bounds
const bound = WORLD_SIZE / 2 - 5;
npc.x = Math.max(-bound, Math.min(bound, npc.x));
npc.y = Math.max(-bound, Math.min(bound, npc.y));
}
}

// Raycasting
function castRay(rayAngle, maxDist) {
const sin = Math.sin(rayAngle);
const cos = Math.cos(rayAngle);

let x = player.x;
let y = player.y;
const step = 0.1;
let dist = 0;

while (dist < maxDist) {
x += cos * step;
y += sin * step;
dist += step;

// Check world collision
const bx = Math.floor(x / 2) * 2;
const by = Math.floor(y / 2) * 2;
const block = world.blocks[`${bx},${by}`];

if (block && block.height > 0.3) {
return {dist: dist, block: block, hit: true, x: x, y: y};
}

// Check boundary
if (Math.abs(x) > WORLD_SIZE/2 - 2 || Math.abs(y) > WORLD_SIZE/2 - 2) {
return {dist: maxDist, hit: false};
}
}

return {dist: maxDist, hit: false};
}

function getLighting(x, y, z, block) {
let light = 0.5;
const district = getDistrict(x, y);

// Neon glow from district color
light += Math.sin(frameCount * 0.02 + x * 0.1) * 0.1;

// Height-based lighting (higher = more light from sky)
light += z * 0.2;

// Window lighting
const windowRow = Math.floor(z * 3);
if (block && block.windows && windowRow < block.windows.length) {
light += 0.2;
}

// Time of day
light *= 0.5 + timeOfDay * 0.5;

return Math.min(1, Math.max(0.1, light));
}

function getBuildingChar(height, dist, lighting) {
const normalized = height / 2;
const distFactor = Math.max(0, 1 - dist / VIEW_DIST);
const combined = normalized * 0.6 + distFactor * 0.4 + lighting * 0.2;

if (combined < 0.2) return '░';
if (combined < 0.4) return '▒';
if (combined < 0.6) return '▓';
if (combined < 0.8) return '█';
return '▓';
}

function getWindowChar(block, relHeight, relX) {
if (!block || !block.windows) return '▫';
const row = Math.floor(relHeight * block.windows.length);
if (row < 0 || row >= block.windows.length) return '▫';
const col = Math.floor(relX * block.windows[row].length) % block.windows[row].length;
const char = block.windows[row][col];
return char === '▪' ? '▪' : '▫';
}

// Main render with enhanced ASCII visuals
function render() {
ctx.fillStyle = getSkyColor();
ctx.fillRect(0, 0, W, H);

octx.clearRect(0, 0, W, H);

// Render atmospheric layers
renderAtmosphere();

// Render ground with reflections
renderGround();

// Render 3D scene with ASCII buildings
const fov = Math.PI / 3;
const numRays = Math.floor(W / SCALE);
const zBuffer = [];

for (let i = 0; i < numRays; i++) {
const rayAngle = player.rot - fov/2 + (i / numRays) * fov;
const rayResult = castRay(rayAngle, VIEW_DIST);
zBuffer[i] = rayResult.dist;

if (rayResult.hit) {
const dist = rayResult.dist * Math.cos(rayAngle - player.rot);
const screenX = i * SCALE;
const block = rayResult.block;
const wallHeight = block ? block.height * H * 1.8 : H * 0.5;
const wallTop = H/2 - wallHeight/2 + player.pitch * H;
const lighting = getLighting(rayResult.x, rayResult.y, 0, block);
const fog = Math.min(1, dist / VIEW_DIST);

// Determine render mode
if (block && block.type === 'street') {
renderStreet(screenX, wallTop + wallHeight, wallHeight, rayResult, dist, fog);
} else {
renderBuilding(screenX, wallTop, wallHeight, rayResult, dist, fog, i, numRays);
}
}

// Render sky elements
if (!rayResult.hit) {
renderSkyColumn(i, screenX);
}
}

// Draw sprites
renderSprites(zBuffer, numRays);

// Draw neon signs in world
renderWorldSigns();

// Weather effects
renderWeather();
renderFog();

// Post-processing
renderPostProcess();

// Update minimap
renderMinimap();
}

function renderAtmosphere() {
// Gradient sky
const skyGradient = ctx.createLinearGradient(0, 0, 0, H/2);
const t = timeOfDay;
if (t < 0.2) {
skyGradient.addColorStop(0, '#020208');
skyGradient.addColorStop(1, '#0a0a15');
} else if (t < 0.4) {
skyGradient.addColorStop(0, '#0a0a20');
skyGradient.addColorStop(1, '#151530');
} else if (t < 0.6) {
skyGradient.addColorStop(0, '#151540');
skyGradient.addColorStop(1, '#202050');
} else if (t < 0.8) {
skyGradient.addColorStop(0, '#0a0a20');
skyGradient.addColorStop(1, '#151530');
} else {
skyGradient.addColorStop(0, '#020208');
skyGradient.addColorStop(1, '#0a0a15');
}
ctx.fillStyle = skyGradient;
ctx.fillRect(0, 0, W, H/2);

// Stars
ctx.fillStyle = NEON_PALETTE.white;
for (let i = 0; i < 50; i++) {
const x = (Math.sin(i * 123.456) * 0.5 + 0.5) * W;
const y = (Math.sin(i * 789.012) * 0.5 + 0.5) * H * 0.4;
const brightness = (Math.sin(frameCount * 0.02 + i) + 1) * 0.5;
ctx.globalAlpha = brightness * 0.5;
ctx.fillText('·', x, y);
}
ctx.globalAlpha = 1;

// Moon
const moonX = W * 0.8;
const moonY = H * 0.15;
const moonGlow = (Math.sin(frameCount * 0.01) + 1) * 0.2 + 0.3;
ctx.fillStyle = `rgba(200, 220, 255, ${moonGlow})`;
ctx.beginPath();
ctx.arc(moonX, moonY, 30, 0, Math.PI * 2);
ctx.fill();
ctx.fillStyle = NEON_PALETTE.white;
ctx.font = '40px JetBrains Mono';
ctx.fillText('○', moonX - 20, moonY + 15);
}

function renderSkyColumn(i, screenX) {
const dist = VIEW_DIST;
const fog = Math.min(1, dist / VIEW_DIST);
// Render distant city silhouette
const skyline = Math.sin(i * 0.1) * 30 + Math.sin(i * 0.05) * 50;
ctx.fillStyle = `rgba(30, 30, 50, ${1 - fog})`;
const baseY = H/2 - 50 + player.pitch * H;
ctx.fillRect(screenX, baseY - skyline, SCALE + 1, skyline + 50);
}

function renderStreet(screenX, bottomY, height, rayResult, dist, fog) {
const streetType = rayResult.block.streetType;
const lighting = rayResult.block.lighting || 0.3;

// Street surface
const groundY = H/2 + player.pitch * H;
ctx.fillStyle = `rgba(15, 15, 25, ${1 - fog})`;
ctx.fillRect(screenX, groundY, SCALE + 1, H - groundY);

// Street markings
if (streetType === 'main' && Math.floor(rayResult.x + rayResult.y) % 4 === 0) {
ctx.fillStyle = `rgba(255, 190, 11, ${0.3 * (1 - fog)})`;
ctx.fillRect(screenX, groundY + 10, SCALE, 2);
}

// Lane dividers
if (streetType === 'main') {
const laneOffset = Math.floor(rayResult.y / 8) % 2;
if (laneOffset === 0) {
ctx.fillStyle = `rgba(255, 255, 255, ${0.1 * (1 - fog)})`;
ctx.fillRect(screenX, groundY + 20, SCALE, 1);
}
}

// Puddle reflections
if (rainIntensity > 0.3) {
const puddlePattern = Math.sin(rayResult.x * 0.5) * Math.cos(rayResult.y * 0.5);
if (puddlePattern > 0.7) {
ctx.fillStyle = `rgba(0, 200, 255, ${0.1 * rainIntensity * (1 - fog)})`;
ctx.fillRect(screenX, groundY, SCALE + 1, 5);
}
}
}

function renderBuilding(screenX, wallTop, wallHeight, rayResult, dist, fog, rayIndex, totalRays) {
const block = rayResult.block;
const relX = (rayIndex % 20) / 20;

for (let y = Math.max(0, Math.floor(wallTop)); y < Math.min(H, Math.floor(wallTop + wallHeight)); y++) {
const relHeight = (y - wallTop) / wallHeight;
let char, color;

// Determine building section
if (relHeight < 0.05) {
// Roof
char = '▀';
color = block.color2 || block.color;
} else if (relHeight > 0.95) {
// Base
char = '▄';
color = NEON_PALETTE.dim;
} else if (relHeight > 0.08 && relHeight < 0.92 && relX > 0.15 && relX < 0.85) {
// Window zone
const windowRow = Math.floor((relHeight - 0.08) / 0.84 * (block.windows ? block.windows.length : 5));
if (block.windows && windowRow >= 0 && windowRow < block.windows.length) {
const windowData = block.windows[windowRow];
const windowCol = Math.floor(relX / 0.7 * windowData.row.length) % windowData.row.length;
const windowChar = windowData.row[windowCol];
char = windowChar;
color = windowChar === '▪' || windowChar === '◐' || windowChar === '●' ? 
(lightningFlash > 0.3 ? '#ffffff' : windowData.color) : NEON_PALETTE.dim;
} else {
char = '░';
color = NEON_PALETTE.dim;
}
} else {
// Building facade
const edgeDist = Math.min(relX, 1 - relX);
if (edgeDist < 0.1) {
char = relHeight > 0.5 ? '│' : '╯';
} else if (Math.floor(relHeight * 10) % 4 === 0) {
char = '█';
} else if (Math.floor(relHeight * 10) % 4 === 2) {
char = '▓';
} else {
char = '▒';
}
color = block.color;
}

// Building type variations
if (block.type === 'temple') {
char = relHeight % 0.2 < 0.1 ? '檐' : '▓';
} else if (block.type === 'industrial') {
char = relHeight % 0.3 < 0.1 ? '▬' : char;
} else if (block.type === 'shop') {
if (relHeight > 0.8 && relX > 0.3 && relX < 0.7) {
char = '▣';
color = NEON_PALETTE.pink;
}
}

// Apply distance fog and lighting
const finalColor = lerpColor(color, COLORS.void, fog);
const brightness = Math.max(0.15, (1 - fog * 0.8) * (0.6 + lightningFlash * 0.4));

ctx.fillStyle = adjustBrightness(finalColor, brightness);
ctx.font = `${SCALE * 2}px 'JetBrains Mono'`;

// Add glow effect for neon
if (char === '▪' || char === '◐' || char === '●') {
ctx.shadowColor = color;
ctx.shadowBlur = 5 * (1 - fog);
}
ctx.fillText(char, screenX, y);
ctx.shadowBlur = 0;
}
}

function renderWorldSigns() {
// Render neon signs floating in world space
for (const key in world.blocks) {
const block = world.blocks[key];
if (block.sign) {
const bx = parseInt(key.split(',')[0]);
const by = parseInt(key.split(',')[1]);
const dx = bx - player.x;
const dy = by - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < 20 && dist > 2) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
if (Math.abs(relAngle) < Math.PI / 3) {
const screenX = W/2 + (relAngle / (Math.PI/3)) * (W/2);
const size = Math.min(200, 300 / dist);
const baseY = H/2 - block.height * H * 0.5 + player.pitch * H;
const signY = baseY + (block.height > 0.5 ? size : 0);

const flash = block.sign.flash && Math.sin(frameCount * 0.1) > 0.5;
ctx.fillStyle = flash ? NEON_PALETTE.white : block.sign.color;
ctx.font = `${Math.max(8, size/4)}px 'JetBrains Mono'`;
ctx.shadowColor = block.sign.color;
ctx.shadowBlur = 10;
const text = block.sign.text;
const textX = block.sign.vertical ? screenX - size/4 : screenX - text.length * size/8;
ctx.fillText(text, textX, signY);
ctx.shadowBlur = 0;
}
}
}
}

// Enhanced reflections
function renderReflections() {
const reflectionY = H/2 + player.pitch * H + 20;
const reflectionHeight = H - reflectionY;

// Wet ground reflection
const reflectionGradient = ctx.createLinearGradient(0, reflectionY, 0, H);
reflectionGradient.addColorStop(0, 'rgba(0, 30, 50, 0.3)');
reflectionGradient.addColorStop(1, 'rgba(0, 10, 20, 0.1)');
ctx.fillStyle = reflectionGradient;
ctx.fillRect(0, reflectionY, W, reflectionHeight);

// Neon puddles
for (let x = 0; x < W; x += 30) {
const noise = Math.sin(x * 0.1 + frameCount * 0.02);
if (noise > 0.8) {
const puddleColor = Math.sin(x * 0.05) > 0 ? NEON_PALETTE.pink : NEON_PALETTE.cyan;
ctx.fillStyle = puddleColor;
ctx.globalAlpha = 0.1;
ctx.fillText('≈≈≈', x, reflectionY + 20 + Math.sin(frameCount * 0.05 + x) * 5);

}
}
}

function renderGround() {
const groundTop = H/2 + player.pitch * H;
if (groundTop < H) {
const groundGradient = ctx.createLinearGradient(0, groundTop, 0, H);
groundGradient.addColorStop(0, COLORS.void);
groundGradient.addColorStop(1, '#0f0f1a');
ctx.fillStyle = groundGradient;
ctx.fillRect(0, groundTop, W, H - groundTop);

// Ground ASCII pattern
ctx.fillStyle = '#1a1a2e';
ctx.font = '8px JetBrains Mono';
for (let y = groundTop; y < H; y += 10) {
for (let x = 0; x < W; x += 15) {
const depth = (y - groundTop) / (H - groundTop);
const char = depth > 0.7 ? '·' : '・';
ctx.fillText(char, x + (Math.sin(y * 0.1) * 5), y);
}
}
}
}

function renderSprites(zBuffer, numRays) {
const sprites = [];
const fov = Math.PI / 3;

// Add NPCs
for (const npc of npcs) {
const dx = npc.x - player.x;
const dy = npc.y - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < VIEW_DIST && dist > 0.3) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'npc', data: npc, dist: dist, angle: relAngle});
}
}

// Add drones
for (const drone of drones) {
const dx = drone.x - player.x;
const dy = drone.y - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < VIEW_DIST) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'drone', data: drone, dist: dist, angle: relAngle});
}
}

// Add vehicles
for (const v of vehicles) {
const vx = v.axis === 'x' ? v.pos : v.lanePos;
const vy = v.axis === 'y' ? v.pos : v.lanePos;
const dx = vx - player.x;
const dy = vy - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < VIEW_DIST) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'vehicle', data: v, dist: dist, angle: relAngle});
}
}

// Add train
if (trainActive) {
const trainX = 0;
const trainY = -80 + trainPos;
const dx = trainX - player.x;
const dy = trainY - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < VIEW_DIST) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'train', data: {x: trainX, y: trainY}, dist: dist, angle: relAngle});
}
}

// Add decorations
for (const key in world.decorations) {
const dec = world.decorations[key];
const dx = dec.x - player.x;
const dy = dec.y - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < 10) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'decoration', data: dec, dist: dist, angle: relAngle});
}
}

// Add terminals
for (const t of terminals) {
if (t.found) continue;
const dx = t.x - player.x;
const dy = t.y - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < 4) {
const angle = Math.atan2(dy, dx);
let relAngle = angle - player.rot;
while (relAngle < -Math.PI) relAngle += Math.PI * 2;
while (relAngle > Math.PI) relAngle -= Math.PI * 2;
sprites.push({type: 'terminal', data: t, dist: dist, angle: relAngle});
}
}

// Sort by distance
sprites.sort((a, b) => b.dist - a.dist);

for (const sprite of sprites) {
if (Math.abs(sprite.angle) > fov/2 + 0.3) continue;

const screenX = W/2 + (sprite.angle / (fov/2)) * (W/2);
const size = Math.min(H * 0.5, H / sprite.dist * 0.6);

const fog = Math.min(1, sprite.dist / VIEW_DIST);

switch(sprite.type) {
case 'npc':
renderNPC(sprite.data, screenX, size, fog);
break;
case 'drone':
renderDrone(sprite.data, screenX, size, fog);
break;
case 'vehicle':
renderVehicle(sprite.data, screenX, size, fog);
break;
case 'train':
renderTrain(sprite.data, screenX, size, fog);
break;
case 'terminal':
renderTerminal(sprite.data, screenX, size, fog);
break;
case 'decoration':
renderDecoration(sprite.data, screenX, size, fog);
break;
}
}
}

function renderNPC(npc, screenX, size, fog) {
const bob = Math.sin(frameCount * 0.1 + npc.x) * size * 0.05;
const screenY = H/2 - size/2 + player.pitch * H + bob;

// NPC character with glow
const char = npc.char;
const baseColor = lerpColor(npc.color, COLORS.void, fog * 0.7);

ctx.shadowColor = npc.color;
ctx.shadowBlur = npc.glow ? 10 : 5;
ctx.fillStyle = baseColor;
ctx.font = `${Math.max(10, size/2)}px 'JetBrains Mono'`;
ctx.fillText(char, screenX - size/4, screenY);

// Shadow below
ctx.shadowBlur = 0;
ctx.fillStyle = `rgba(0, 0, 0, ${0.3 * (1 - fog)})`;
ctx.beginPath();
ctx.ellipse(screenX, H/2 + size/3 + player.pitch * H, size/3, size/8, 0, 0, Math.PI * 2);
ctx.fill();
}

function renderDrone(drone, screenX, size, fog) {
const hover = Math.sin(frameCount * 0.1 + drone.x) * 3;
const screenY = H/2 - size/2 + player.pitch * H + hover - size * 0.3;

const droneChars = ['◇', '◈', '◆', '◈'];
const char = droneChars[Math.floor(drone.frame) % 4];

ctx.shadowColor = drone.type === 'surveillance' ? NEON_PALETTE.red : NEON_PALETTE.cyan;
ctx.shadowBlur = 8;
ctx.fillStyle = drone.type === 'surveillance' ? NEON_PALETTE.red : NEON_PALETTE.cyan;
ctx.font = `${Math.max(12, size/2)}px 'JetBrains Mono'`;
ctx.fillText(char, screenX - size/4, screenY);

// Propeller blur
ctx.fillStyle = `rgba(200, 200, 200, ${0.3 * (1 - fog)})`;
ctx.fillText('- - -', screenX - size/2, screenY - size/3);
ctx.shadowBlur = 0;
}

function renderVehicle(v, screenX, size, fog) {
const screenY = H/2 - size/3 + player.pitch * H + size * 0.2;

// Vehicle body
const bodyChar = v.type === 'car' ? '▄▀▄' : '▄▀▀▄';
const baseColor = lerpColor(v.color, COLORS.void, fog * 0.5);

ctx.fillStyle = baseColor;
ctx.font = `${Math.max(14, size/2)}px 'JetBrains Mono'`;
ctx.fillText(bodyChar, screenX - size/2, screenY);

// Headlights
const lightGlow = v.lightGlow;
ctx.shadowColor = NEON_PALETTE.amber;
ctx.shadowBlur = 10 * lightGlow;
ctx.fillStyle = `rgba(255, 255, 200, ${lightGlow})`;
ctx.fillText('◐', screenX - size/2 - size/4, screenY - size/8);
ctx.fillText('◐', screenX + size/2, screenY - size/8);
ctx.shadowBlur = 0;

// Reflection on wet ground
if (rainIntensity > 0.3) {
ctx.fillStyle = `rgba(${v.color === NEON_PALETTE.pink ? '255,0,110' : '0,212,255'}, ${0.1 * rainIntensity * (1 - fog)})`;
ctx.fillText(bodyChar, screenX - size/2, screenY + size/2);
}
}

function renderTrain(train, screenX, size, fog) {
const screenY = H/2 - size/2 + player.pitch * H + size * 0.3;
const trainLen = size * 3;

// Train cars
for (let i = 0; i < 4; i++) {
const carX = screenX - trainLen/2 + i * size * 0.7;
const carChar = i === 0 ? '╔═╗' : (i === 3 ? '╚═╝' : '╠═╣');
const color = lerpColor(NEON_PALETTE.amber, COLORS.void, fog * 0.5);

ctx.shadowColor = NEON_PALETTE.amber;
ctx.shadowBlur = 5;
ctx.fillStyle = color;
ctx.font = `${Math.max(10, size/3)}px 'JetBrains Mono'`;

// Train body
ctx.fillText('█'.repeat(8), carX - size/2, screenY);
ctx.fillText('█'.repeat(8), carX - size/2, screenY + size/4);
ctx.fillText('▀'.repeat(8), carX - size/2, screenY + size/2);

// Windows
ctx.fillStyle = lerpColor(NEON_PALETTE.cyan, COLORS.void, fog * 0.3);
ctx.fillText('▪▪▪▪▪▪▪▪', carX - size/2 + 4, screenY + size/4);
}

// Headlight
ctx.shadowColor = NEON_PALETTE.white;
ctx.shadowBlur = 15;
ctx.fillStyle = `rgba(255, 255, 255, ${0.8 * (1 - fog)})`;
ctx.fillText('●', screenX - trainLen/2 - size/4, screenY + size/4);
ctx.shadowBlur = 0;
}

function renderTerminal(t, screenX, size, fog) {
const pulse = (Math.sin(frameCount * 0.15) + 1) * 0.5;
const screenY = H/2 + player.pitch * H;

// Terminal marker
ctx.shadowColor = NEON_PALETTE.mint;
ctx.shadowBlur = 10 + pulse * 10;
ctx.fillStyle = `rgba(0, 255, 159, ${0.6 + pulse * 0.4})`;
ctx.font = `${18 + pulse * 6}px 'JetBrains Mono'`;
ctx.fillText('◆', screenX - 12, screenY);

// Ring effect
ctx.strokeStyle = `rgba(0, 255, 159, ${0.3 * pulse})`;
ctx.lineWidth = 2;
ctx.beginPath();
ctx.arc(screenX, screenY, size/2 + pulse * 10, 0, Math.PI * 2);
ctx.stroke();

// Interaction prompt
octx.fillStyle = NEON_PALETTE.mint;
octx.font = '12px JetBrains Mono';
octx.fillText('[ SPACE ] ACCESS TERMINAL', screenX - 60, screenY + size + 20);
ctx.shadowBlur = 0;
}

function renderDecoration(dec, screenX, size, fog) {
const screenY = H/2 + player.pitch * H;
const color = lerpColor(NEON_PALETTE.green, COLORS.void, fog);

switch(dec.type) {
case 'cat':
const catFrames = ['=^.^=', '=^o^=', '=^ω^=', '=^~^='];
const frame = Math.floor(frameCount / 10) % catFrames.length;
ctx.fillStyle = color;
ctx.font = '14px JetBrains Mono';
ctx.fillText(catFrames[frame], screenX - 20, screenY);
break;
case 'steam':
const steam = ['°', '°°', '°°°'];
for (let i = 0; i < 3; i++) {
const offset = (frameCount * 2 + i * 20) % 60;
ctx.fillStyle = `rgba(200, 200, 200, ${0.3 * (1 - offset/60)})`;
ctx.fillText('°', screenX + Math.sin(offset * 0.1) * 5, screenY - offset);
}
break;
case 'mural':
ctx.fillStyle = `rgba(100, 100, 255, ${0.2 * (1 - fog)})`;
ctx.font = '10px JetBrains Mono';
ctx.fillText(dec.content, screenX - 30, screenY);
break;
}
}

// Sort by distance
sprites.sort((a, b) => b.dist - a.dist);

const fov = Math.PI / 3;

for (const sprite of sprites) {
if (Math.abs(sprite.angle) > fov/2 + 0.2) continue;

const screenX = W/2 + (sprite.angle / (fov/2)) * (W/2);
const size = Math.min(H * 0.4, H / sprite.dist * 0.5);

let char, color;
if (sprite.type === 'npc') {
const chars = ['♪', '♦', '●', '○'];
char = chars[sprite.data.type];
const colors = [COLORS.mint, COLORS.pink, COLORS.cyan, COLORS.amber];
color = colors[sprite.data.type];
const bob = Math.sin(frameCount * 0.1 + sprite.data.x) * 3;
const screenY = H/2 - size/2 + player.pitch * H + bob;

ctx.fillStyle = color;
ctx.font = `${Math.max(8, size/2)}px 'JetBrains Mono'`;
ctx.fillText(char, screenX - size/4, screenY);

} else if (sprite.type === 'vehicle') {
char = sprite.data.type === 'car' ? '▄▀▄' : '▄▀▀▄';
const screenY = H/2 - size/2 + player.pitch * H + size * 0.3;
ctx.fillStyle = sprite.data.color;
ctx.font = `${Math.max(10, size/3)}px 'JetBrains Mono'`;
ctx.fillText(char, screenX - size/2, screenY);

// Headlights
const lightGlow = sprite.data.lightGlow;
ctx.fillStyle = `rgba(255, 255, 200, ${lightGlow * 0.5})`;
ctx.fillText('◐', screenX - size/2 - size/3, screenY);

} else if (sprite.type === 'terminal') {
const pulse = (Math.sin(frameCount * 0.1) + 1) * 0.5;
char = '◆';
const screenY = H/2 + player.pitch * H;
ctx.fillStyle = `rgba(0, 255, 159, ${0.5 + pulse * 0.5})`;
ctx.font = `${16 + pulse * 8}px 'JetBrains Mono'`;
ctx.fillText(char, screenX - 12, screenY);

// Interaction prompt
octx.fillStyle = COLORS.mint;
octx.font = '12px JetBrains Mono';
octx.fillText('[ SPACE ] ACCESS', screenX - 40, screenY + 30);
}
}
}

function renderFog() {
const fogGradient = ctx.createLinearGradient(0, 0, W, 0);
const fogIntensity = 0.3 + (1 - timeOfDay) * 0.3;
fogGradient.addColorStop(0, `rgba(10, 10, 15, ${fogIntensity * 0.3})`);
fogGradient.addColorStop(0.5, `rgba(10, 10, 15, 0)`);
fogGradient.addColorStop(1, `rgba(10, 10, 15, ${fogIntensity * 0.3})`);
ctx.fillStyle = fogGradient;
ctx.fillRect(0, 0, W, H);
}

function renderWeather() {
// Enhanced rain with depth
for (const drop of rainDrops) {
const intensity = rainIntensity * (0.3 + lightningFlash * 0.5);
const depth = drop.y / H;
const alpha = intensity * (0.3 + depth * 0.7);
ctx.globalAlpha = alpha;

// Motion blur effect for rain
const speed = drop.speed > 10 ? 2 : 1;
const char = drop.speed > 10 ? '/' : '|';

ctx.fillStyle = `rgba(150, 180, 220, ${alpha})`;
ctx.fillText(char, drop.x, drop.y);
ctx.fillText(char, drop.x - 1, drop.y - 3 * speed);
if (drop.speed > 12) {
ctx.fillText(char, drop.x - 2, drop.y - 6 * speed);
}
}

// Splash effects on ground
if (rainIntensity > 0.4) {
ctx.fillStyle = 'rgba(100, 150, 200, 0.2)';
for (let i = 0; i < 10; i++) {
const x = Math.random() * W;
const y = H - 20 + Math.random() * 20;
const splashFrame = (frameCount + i * 10) % 30;
if (splashFrame < 10) {
ctx.fillText('゜', x, y - splashFrame);
}
}
}

// Lightning with thunder effect
if (lightningFlash > 0) {
const flashColor = lightningFlash > 0.7 ? 'rgba(255, 255, 255, 1)' : 
(lightningFlash > 0.4 ? 'rgba(200, 200, 255, 0.8)' : 'rgba(100, 100, 200, 0.5)');
ctx.fillStyle = flashColor;
ctx.fillRect(0, 0, W, H);

// Lightning bolt in sky
if (lightningFlash > 0.6) {
ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
ctx.lineWidth = 2;
ctx.beginPath();
const startX = W * 0.3 + Math.random() * W * 0.4;
ctx.moveTo(startX, 0);
for (let i = 0; i < 5; i++) {
ctx.lineTo(startX + (Math.random() - 0.5) * 50, H * 0.1 * (i + 1));
}
ctx.stroke();
}
lightningFlash -= 0.15;
}

// Ambient event effects
for (const event of events) {
const dx = event.x - player.x;
const dy = event.y - player.y;
const dist = Math.sqrt(dx*dx + dy*dy);
if (dist < 40) {
const intensity = 1 - dist / 40;
switch(event.type) {
case 'siren':
const pulse = Math.sin(frameCount * 0.3) > 0;
const sirenColor = pulse ? '255,0,110' : '0,212,255';
ctx.fillStyle = `rgba(${sirenColor}, ${0.15 * intensity})`;
ctx.fillRect(0, 0, W, H);
break;
case 'helicopter':
// Spotlight effect
const searchlight = ctx.createRadialGradient(W/2, H/4, 0, W/2, H/4, 200);
searchlight.addColorStop(0, 'rgba(255, 255, 200, 0.1)');
searchlight.addColorStop(1, 'rgba(255, 255, 200, 0)');
ctx.fillStyle = searchlight;
ctx.fillRect(0, 0, W, H/2);
break;
case 'chatter':
// Radio static effect (subtle)
if (Math.random() < 0.1) {
ctx.fillStyle = `rgba(255, 255, 255, ${0.02 * intensity})`;
for (let i = 0; i < 5; i++) {
ctx.fillRect(Math.random() * W, Math.random() * H, 3, 3);
}
}
break;
case 'static':
// TV static effect
ctx.fillStyle = `rgba(255, 255, 255, ${0.03 * intensity})`;
for (let i = 0; i < 20; i++) {
const x = Math.random() * W;
const y = Math.random() * H;
ctx.fillRect(x, y, Math.random() * 50, 1);
}
break;
}
}
}

// Fog layers
renderFogLayers();
}

function renderFogLayers() {
// Distance fog
const fogGradient = ctx.createLinearGradient(0, H/3, 0, H);
fogGradient.addColorStop(0, 'rgba(10, 10, 20, 0)');
fogGradient.addColorStop(0.5, `rgba(20, 20, 40, ${0.2 + (1 - rainIntensity) * 0.2})`);
fogGradient.addColorStop(1, `rgba(10, 10, 20, ${0.5 + rainIntensity * 0.3})`);
ctx.fillStyle = fogGradient;
ctx.fillRect(0, 0, W, H);

// Horizontal fog bands
for (let i = 0; i < 3; i++) {
const y = H * (0.3 + i * 0.2) + Math.sin(frameCount * 0.01 + i) * 10;
const fogBand = ctx.createLinearGradient(0, y, 0, y + 30);
fogBand.addColorStop(0, 'rgba(30, 30, 50, 0)');
fogBand.addColorStop(0.5, `rgba(30, 30, 60, ${0.1 + rainIntensity * 0.1})`);
fogBand.addColorStop(1, 'rgba(30, 30, 50, 0)');
ctx.fillStyle = fogBand;
ctx.fillRect(0, y, W, 30);
}
}

function renderPostProcess() {
// CRT monitor curvature simulation
const gradient = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.7);
gradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
gradient.addColorStop(0.7, 'rgba(0, 0, 0, 0)');
gradient.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, W, H);

// Chromatic aberration on edges
ctx.globalCompositeOperation = 'screen';
ctx.globalAlpha = 0.02;
ctx.fillStyle = NEON_PALETTE.pink;
ctx.fillRect(2, 0, W, H);
ctx.fillStyle = NEON_PALETTE.cyan;
ctx.fillRect(-2, 0, W, H);
ctx.globalCompositeOperation = 'source-over';
ctx.globalAlpha = 1;

// Scanline effect (subtle)
ctx.fillStyle = 'rgba(0, 0, 0, 0.02)';
for (let y = 0; y < H; y += 2) {
ctx.fillRect(0, y, W, 1);
}

// Moving scanline
const scanY = (frameCount * 2) % H;
ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
ctx.fillRect(0, scanY, W, 2);

// Noise grain
if (Math.random() < 0.5) {
for (let i = 0; i < 15; i++) {
const x = Math.random() * W;
const y = Math.random() * H;
const size = 1 + Math.random() * 2;
ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.03})`;
ctx.fillRect(x, y, size, size);
}
}

// Occasional glitch effect
if (Math.random() < 0.005) {
const glitchY = Math.random() * H;
const glitchH = 5 + Math.random() * 20;
ctx.drawImage(ctx.canvas, 0, glitchY, W, glitchH, Math.random() * 10 - 5, glitchY, W, glitchH);
}

// Vignette
const vignette = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, W * 0.8);
vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
vignette.addColorStop(1, 'rgba(0, 0, 0, 0.5)');
ctx.fillStyle = vignette;
ctx.fillRect(0, 0, W, H);
}

function renderMinimap() {
mctx.fillStyle = 'rgba(10, 10, 20, 0.95)';
mctx.fillRect(0, 0, 120, 120);

// Draw grid
mctx.strokeStyle = 'rgba(50, 50, 80, 0.3)';
mctx.lineWidth = 0.5;
for (let i = 0; i < 120; i += 12) {
mctx.beginPath();
mctx.moveTo(i, 0);
mctx.lineTo(i, 120);
mctx.moveTo(0, i);
mctx.lineTo(120, i);
mctx.stroke();
}

const scale = 0.6;
const cx = 60, cy = 60;

// Draw buildings
for (let x = -30; x < 30; x += 2) {
for (let y = -30; y < 30; y += 2) {
const bx = Math.floor((player.x + x) / 2) * 2;
const by = Math.floor((player.y + y) / 2) * 2;
const block = world.blocks[`${bx},${by}`];
if (block && block.height > 0.3) {
const dist = Math.sqrt(x*x + y*y);
const alpha = Math.max(0.1, 1 - dist / 30);
mctx.fillStyle = block.color + Math.floor(alpha * 100).toString(16).padStart(2, '0');
mctx.fillRect(cx + x * scale, cy + y * scale, 2, 2);
}
}
}

// Draw NPCs
mctx.fillStyle = NEON_PALETTE.mint;
for (const npc of npcs) {
const dx = npc.x - player.x;
const dy = npc.y - player.y;
if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
mctx.fillRect(cx + dx * scale, cy + dy * scale, 2, 2);
}
}

// Draw drones
mctx.fillStyle = NEON_PALETTE.red;
for (const drone of drones) {
const dx = drone.x - player.x;
const dy = drone.y - player.y;
if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
mctx.fillRect(cx + dx * scale, cy + dy * scale, 1, 1);
}
}

// Draw terminals
mctx.fillStyle = NEON_PALETTE.amber;
for (const t of terminals) {
if (t.found) continue;
const dx = t.x - player.x;
const dy = t.y - player.y;
if (Math.abs(dx) < 30 && Math.abs(dy) < 30) {
mctx.fillStyle = NEON_PALETTE.mint;
mctx.fillRect(cx + dx * scale - 2, cy + dy * scale - 2, 4, 4);
}
}

// Draw player
mctx.fillStyle = NEON_PALETTE.white;
mctx.beginPath();
mctx.arc(cx, cy, 3, 0, Math.PI * 2);
mctx.fill();

// Player direction indicator
mctx.strokeStyle = NEON_PALETTE.cyan;
mctx.lineWidth = 2;
mctx.beginPath();
mctx.moveTo(cx, cy);
mctx.lineTo(cx + Math.cos(player.rot) * 10, cy + Math.sin(player.rot) * 10);
mctx.stroke();

// View cone
mctx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
mctx.beginPath();
mctx.moveTo(cx, cy);
mctx.lineTo(cx + Math.cos(player.rot - 0.5) * 20, cy + Math.sin(player.rot - 0.5) * 20);
mctx.moveTo(cx, cy);
mctx.lineTo(cx + Math.cos(player.rot + 0.5) * 20, cy + Math.sin(player.rot + 0.5) * 20);
mctx.stroke();

// Border
mctx.strokeStyle = NEON_PALETTE.cyan;
mctx.lineWidth = 1;
mctx.strokeRect(0, 0, 120, 120);

// Compass
const compass = ['N', 'E', 'S', 'W'];
const angles = [0, Math.PI/2, Math.PI, -Math.PI/2];
mctx.fillStyle = NEON_PALETTE.dim;
mctx.font = '8px JetBrains Mono';
for (let i = 0; i < 4; i++) {
const worldAngle = angles[i] - player.rot + Math.PI/2;
if (Math.abs(worldAngle) < Math.PI/2) {
const compassX = 60 + Math.sin(worldAngle) * 45;
const compassY = 60 - Math.cos(worldAngle) * 45;
mctx.fillText(compass[i], compassX - 3, compassY + 3);
}
}
}

mctx.fillStyle = 'rgba(10, 10, 20, 0.9)';

const scale = 0.5;
const cx = 60, cy = 60;

function getSkyColor() {
const t = timeOfDay;
if (t < 0.2) return '#050510';
if (t < 0.4) return '#0a0a20';
if (t < 0.6) return '#101030';
if (t < 0.8) return '#0a0a20';
return '#050510';
}

function lerpColor(c1, c2, t) {
const r1 = parseInt(c1.slice(1,3), 16);
const g1 = parseInt(c1.slice(3,5), 16);
const b1 = parseInt(c1.slice(5,7), 16);
const r2 = parseInt(c2.slice(1,3), 16);
const g2 = parseInt(c2.slice(3,5), 16);
const b2 = parseInt(c2.slice(5,7), 16);
const r = Math.round(r1 + (r2 - r1) * t);
const g = Math.round(g1 + (g2 - g1) * t);
const b = Math.round(b1 + (b2 - b1) * t);
return `rgb(${r},${g},${b})`;
}

function adjustBrightness(color, factor) {
let r, g, b;
if (color.startsWith('#')) {
r = parseInt(color.slice(1,3), 16);
g = parseInt(color.slice(3,5), 16);
b = parseInt(color.slice(5,7), 16);
} else {
const match = color.match(/\d+/g);
if (match) {
r = parseInt(match[0]);
g = parseInt(match[1]);
b = parseInt(match[2]);
} else return color;
}
r = Math.min(255, Math.floor(r * factor));
g = Math.min(255, Math.floor(g * factor));
b = Math.min(255, Math.floor(b * factor));
return `rgb(${r},${g},${b})`;
}

// Player movement
function updatePlayer(dt) {
const moveSpeed = player.sprint ? 8 : 4;
const rotSpeed = 2;

let moveX = 0, moveY = 0;

if (keys['w'] || keys['arrowup']) { moveX += Math.cos(player.rot); moveY += Math.sin(player.rot); }
if (keys['s'] || keys['arrowdown']) { moveX -= Math.cos(player.rot); moveY -= Math.sin(player.rot); }
if (keys['a'] || keys['arrowleft']) { moveX += Math.cos(player.rot - Math.PI/2); moveY += Math.sin(player.rot - Math.PI/2); }
if (keys['d'] || keys['arrowright']) { moveX += Math.cos(player.rot + Math.PI/2); moveY += Math.sin(player.rot + Math.PI/2); }

const len = Math.sqrt(moveX*moveX + moveY*moveY);
if (len > 0) {
moveX = (moveX / len) * moveSpeed * dt;
moveY = (moveY / len) * moveSpeed * dt;
}

// Collision detection
const newX = player.x + moveX;
const newY = player.y + moveY;
const checkX = Math.floor(newX / 2) * 2;
const checkY = Math.floor(newY / 2) * 2;
const block = world.blocks[`${checkX},${checkY}`];

if (!block || block.height < 0.5) {
player.x = newX;
player.y = newY;
} else {
// Slide along wall
const blockX = Math.floor(player.x / 2) * 2;
if (!world.blocks[`${blockX},${checkY}`]) {
player.y = newY;
}
const blockY = Math.floor(player.y / 2) * 2;
if (!world.blocks[`${checkX},${blockY}`]) {
player.x = newX;
}
}

// Bounds
const bound = WORLD_SIZE / 2 - 3;
player.x = Math.max(-bound, Math.min(bound, player.x));
player.y = Math.max(-bound, Math.min(bound, player.y));

// Update district display
const district = getDistrict(player.x, player.y);
const districtEl = document.getElementById('district');
if (districtEl.dataset.current !== district.name) {
districtEl.textContent = district.name;
districtEl.style.color = district.color;
districtEl.style.textShadow = `0 0 20px ${district.color}`;
districtEl.style.opacity = 1;
districtEl.dataset.current = district.name;
setTimeout(() => { districtEl.style.opacity = 0; }, 2000);
}

// Check terminal proximity
let nearTerminal = false;
for (const t of terminals) {
if (t.found) continue;
const dx = t.x - player.x;
const dy = t.y - player.y;
if (Math.sqrt(dx*dx + dy*dy) < 2.5) {
nearTerminal = true;
break;
}
}
document.getElementById('interact').style.opacity = nearTerminal ? 1 : 0;
}

function interact() {
for (const t of terminals) {
if (t.found) continue;
const dx = t.x - player.x;
const dy = t.y - player.y;
if (Math.sqrt(dx*dx + dy*dy) < 2.5) {
t.found = true;
discoveredTerminals++;
showTerminal(t.message);
break;
}
}
}

function showTerminal(message) {
const terminal = document.getElementById('terminal');
terminal.querySelector('.text').textContent = message;
terminal.style.display = 'block';
terminal.style.animation = 'none';
terminal.offsetHeight;
terminal.style.animation = 'fadeIn 0.3s';
}

function closeTerminal() {
document.getElementById('terminal').style.display = 'none';
}

// Update HUD
function updateHUD() {
const district = getDistrict(player.x, player.y);
const heading = getHeading(player.rot);
const sprintText = player.sprint ? ' [SPRINT]' : '';

document.getElementById('hud').innerHTML = `
<div style="color:${district.color};font-size:10px;">${district.name}</div>
<div style="color:${NEON_PALETTE.dim};font-size:9px;">
${Math.floor(player.x).toString().padStart(4, ' ')}, ${Math.floor(player.y).toString().padStart(4, ' ')}, ${Math.floor(player.z * 10)}
</div>
<div style="color:${NEON_PALETTE.cyan};font-size:10px;">
${heading}${sprintText}
</div>
<div style="color:${NEON_PALETTE.amber};font-size:9px;">
${getTimeString()} ${getWeatherString()}
</div>
${discoveredTerminals > 0 ? `<div style="color:${NEON_PALETTE.mint};font-size:10px;">◆ ${discoveredTerminals}/8 DATA NODES</div>` : ''}
`;
}

function getHeading(rot) {
const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
const angle = ((rot * 180 / Math.PI) % 360 + 360) % 360;
const index = Math.round(angle / 45) % 8;
return directions[index];
}

function getTimeString() {
const hours = Math.floor(timeOfDay * 24);
const minutes = Math.floor((timeOfDay * 24 - hours) * 60);
const period = hours >= 12 ? 'PM' : 'AM';
const displayHours = hours % 12 || 12;
return `${displayHours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')} ${period}`;
}

function getWeatherString() {
if (rainIntensity > 0.6) return ' Heavy Rain';
if (rainIntensity > 0.4) return ' Rain';
if (rainIntensity > 0.2) return ' Drizzle';
return '';
}

// Train system
function updateTrain(dt) {
trainPos += dt * 15;
if (trainPos > 100) {
trainPos = -100;
trainActive = Math.random() < 0.3;
}
}

// Lightning
function updateLightning(dt) {
lightningTimer -= dt;
if (lightningTimer <= 0) {
if (Math.random() < rainIntensity * 0.1) {
lightningFlash = 0.5 + Math.random() * 0.5;
lightningTimer = 0.1;
} else {
lightningTimer = 5 + Math.random() * 15;
}
}
}

// Main loop
let lastTime = 0;
function gameLoop(time) {
const dt = Math.min(0.1, (time - lastTime) / 1000);
lastTime = time;

if (gameStarted) {
frameCount++;

// Update time of day
updateDayNight(dt);

// Random event trigger
if (Math.random() < 0.001) {
triggerRandomEvent();
}

// Weather cycles
rainIntensity = 0.3 + Math.sin(timeOfDay * Math.PI * 2) * 0.2 + Math.sin(frameCount * 0.001) * 0.1;
rainIntensity = Math.max(0.1, Math.min(0.8, rainIntensity));

updatePlayer(dt);
updateNPCs(dt);
updateDrones(dt);
updateVehicles(dt);
updateRain(dt);
updateEvents(dt);
updateLightning(dt);
updateTrain(dt);
updateHUD();

// Check special areas
checkSpecialAreas();

// Check victory
checkVictory();

render();
}

requestAnimationFrame(gameLoop);
}

// Input handling
document.addEventListener('keydown', (e) => {
keys[e.key.toLowerCase()] = true;
if (e.key === ' ' && gameStarted) {
e.preventDefault();
interact();
}
if (e.key === 'Escape') {
closeTerminal();
}
if (e.key === 'Shift') {
player.sprint = true;
}
});

document.addEventListener('keyup', (e) => {
keys[e.key.toLowerCase()] = false;
if (e.key === 'Shift') {
player.sprint = false;
}
});

document.addEventListener('mousemove', (e) => {
if (mouse.locked && gameStarted) {
player.rot += e.movementX * 0.002;
player.pitch = Math.max(-0.3, Math.min(0.3, player.pitch - e.movementY * 0.002));
}
});

document.addEventListener('pointerlockchange', () => {
mouse.locked = document.pointerLockElement === canvas;
});

canvas.addEventListener('click', () => {
if (gameStarted) {
canvas.requestPointerLock();
}
});

// Resize handling
function resize() {
W = window.innerWidth;
H = window.innerHeight;
canvas.width = W;
canvas.height = H;
overlay.width = W;
overlay.height = H;
minimap.width = 120;
minimap.height = 120;
SCALE = Math.max(2, Math.floor(W / 256));
ctx.font = `${SCALE}px 'JetBrains Mono'`;
}

window.addEventListener('resize', resize);

// Start game
function startGame() {
document.getElementById('start').style.opacity = '0';
setTimeout(() => {
document.getElementById('start').style.display = 'none';
canvas.requestPointerLock();
}, 1000);

// Seed the world
Math.seedrandom = function(seed) {
return function() {
seed = (seed * 9301 + 49297) % 233280;
return seed / 233280;
};
};

generateWorld();
initNPCs();
initVehicles();
initTerminals();
initRainDrops();
drones = [];
resize();
gameStarted = true;

// Show welcome message
setTimeout(() => {
showMessage('SYSTEM ONLINE — 8 DATA TERMINALS SCATTERED THROUGHOUT THE CITY', NEON_PALETTE.cyan);
}, 2000);
}

// Show message to player
function showMessage(text, color) {
const msg = document.createElement('div');
msg.style.cssText = `
position: fixed;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
color: ${color};
font-family: 'JetBrains Mono', monospace;
font-size: 14px;
text-align: center;
text-shadow: 0 0 20px ${color};
padding: 20px 40px;
background: rgba(10, 10, 20, 0.9);
border: 1px solid ${color};
z-index: 1000;
opacity: 0;
transition: opacity 0.5s;
pointer-events: none;
`;
msg.textContent = text;
document.body.appendChild(msg);
setTimeout(() => msg.style.opacity = 1, 50);
setTimeout(() => {
msg.style.opacity = 0;
setTimeout(() => msg.remove(), 500);
}, 4000);
}

// Initialize
resize();

// Add CSS animations
const style = document.createElement('style');
style.textContent = `
@keyframes fadeIn { 
from { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } 
to { opacity: 1; transform: translate(-50%, -50%) scale(1); } 
}
@keyframes glitch {
0% { transform: translate(0); }
20% { transform: translate(-2px, 2px); }
40% { transform: translate(2px, -2px); }
60% { transform: translate(-2px, -2px); }
80% { transform: translate(2px, 2px); }
100% { transform: translate(0); }
}
@keyframes pulse {
0%, 100% { opacity: 1; }
50% { opacity: 0.5; }
}
`;
document.head.appendChild(style);

// Start loop
requestAnimationFrame(gameLoop);

// Console welcome
console.log('%c NEON GHOST: NEO KYOTO ', 'background: #0a0a0f; color: #00ff9f; font-size: 20px; padding: 10px;');
console.log('%c ▓▒▓▒▓ ASCII CITY GENERATED ▓▒▓▒▓ ', 'background: #00ff9f; color: #0a0a0f; font-size: 12px;');
console.log('%c Explore the city. Find all 8 terminals. ', 'color: #00d4ff; font-size: 10px;');
</script>
