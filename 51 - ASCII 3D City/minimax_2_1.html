<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DRIFTER - ASCII City</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'VT323', monospace;
            cursor: crosshair;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        /* CRT Scanlines effect */
        #ui-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
        }
        
        /* CRT vignette effect */
        #ui-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(
                ellipse at center,
                transparent 0%,
                transparent 60%,
                rgba(0, 0, 0, 0.4) 100%
            );
            pointer-events: none;
            z-index: 999;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            opacity: 0.7;
        }
        
        #hud {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #0ff;
            font-size: 18px;
            text-shadow: 0 0 5px #0ff;
            line-height: 1.6;
        }
        
        #location-display {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #f0f;
            font-size: 28px;
            text-shadow: 0 0 10px #f0f, 0 0 30px #f0f;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        #time-display {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #ff0;
            font-size: 20px;
            text-shadow: 0 0 8px #ff0;
        }
        
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            text-shadow: 0 0 15px #0f0;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            max-width: 80%;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        #start-screen h1 {
            color: #0ff;
            font-size: 72px;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff;
            letter-spacing: 12px;
            margin-bottom: 20px;
            animation: flicker 3s infinite;
        }
        
        #start-screen h2 {
            color: #f0f;
            font-size: 24px;
            text-shadow: 0 0 10px #f0f;
            letter-spacing: 8px;
            margin-bottom: 60px;
        }
        
        #start-screen p {
            color: #888;
            font-size: 20px;
            animation: pulse 2s infinite;
        }
        
        #start-screen .controls {
            margin-top: 40px;
            color: #666;
            font-size: 16px;
            text-align: center;
            line-height: 2;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            97% { opacity: 0.9; }
            98% { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
        
        #minimap {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 150px;
            height: 150px;
            border: 2px solid #0ff;
            background: rgba(0, 20, 40, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        #minimap-canvas {
            width: 100%;
            height: 100%;
        }
        
        .district-legend {
            position: absolute;
            bottom: 190px;
            right: 30px;
            color: #666;
            font-size: 12px;
            text-align: right;
        }
        
        .district-legend span {
            display: block;
            margin: 2px 0;
        }
        
        #weather-indicator {
            position: absolute;
            top: 70px;
            right: 30px;
            color: #aaa;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>NEON DRIFTER</h1>
        <h2>// ASCII CITY SIMULATION //</h2>
        <p>[ CLICK TO ENTER THE CITY ]</p>
        <div class="controls">
            WASD - Move | MOUSE - Look | SHIFT - Sprint<br>
            E - Interact | F - Flashlight | SPACE - Jump
        </div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <div id="crosshair">+</div>
        <div id="location-display">DOWNTOWN</div>
        <div id="time-display">21:47</div>
        <div id="weather-indicator">🌧 RAIN</div>
        <div id="hud">
            <div id="coords">X: 0 | Y: 0 | Z: 0</div>
            <div id="speed">SPEED: 0</div>
            <div id="secrets">SECRETS: 0/12</div>
        </div>
        <div id="minimap">
            <canvas id="minimap-canvas"></canvas>
        </div>
        <div class="district-legend">
            <span style="color:#0ff">■ Downtown</span>
            <span style="color:#f0f">■ Neon Plaza</span>
            <span style="color:#ff0">■ Industrial</span>
            <span style="color:#0f0">■ The Underbelly</span>
            <span style="color:#f00">■ Red Light</span>
        </div>
        <div id="notification"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // NEON DRIFTER - Living ASCII 3D City
        // A cyberpunk ASCII city simulation
        // ============================================

        // Game State
        const state = {
            started: false,
            time: 21.78,
            daySpeed: 0.01,
            weather: 'rain',
            secretsFound: 0,
            totalSecrets: 12,
            playerSpeed: 0,
            isSprinting: false,
            isFlashlightOn: false,
            currentDistrict: 'Downtown',
            currentLocation: '',
            notifications: [],
            vehicles: [],
            pedestrians: [],
            trains: [],
            signs: [],
            raindrops: [],
            windows: []
        };

        // Constants
        const CITY_SIZE = 800;
        const BLOCK_SIZE = 40;
        const STREET_WIDTH = 12;
        const BUILDING_SPACING = 2;

        // Three.js Setup
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();

        // ASCII Characters for different distances
        const asciiClose = '█▓▒░▀▄▌▐■□▪▫●○◆◇★☆♠♣♥♦◊▪▪';
        const asciiMid = '█▓▒░~`^\"\'.,:;i1tfjrx';
        const asciiFar = ' .:;i1tfjrxnuvozSO8@';

        // District definitions
        const districts = {
            'Downtown': { center: { x: 0, z: 0 }, color: 0x00ffff, radius: 150 },
            'Neon Plaza': { center: { x: 200, z: 100 }, color: 0xff00ff, radius: 100 },
            'Industrial': { center: { x: -200, z: -150 }, color: 0xffff00, radius: 120 },
            'The Underbelly': { center: { x: -100, z: 200 }, color: 0x00ff00, radius: 80 },
            'Red Light': { center: { x: 150, z: -180 }, color: 0xff0000, radius: 70 }
        };

        // Secret locations with lore
        const secretLocations = [
            { x: 45, z: 45, name: 'Hidden Alley', desc: 'A forgotten passage between buildings...', found: false },
            { x: -78, z: 123, name: 'Forgotten Temple', desc: 'Ancient symbols glow in the darkness', found: false },
            { x: 234, z: -67, name: 'Rooftop Observatory', desc: 'A telescope points at the stars', found: false },
            { x: -156, z: -89, name: 'Underground Bunker', desc: 'Someone lived here once...', found: false },
            { x: 89, z: -234, name: 'Neon Shrine', desc: 'Devotees gather in secret', found: false },
            { x: -234, z: 56, name: 'Lost Datapad', desc: 'Contains encrypted memories', found: false },
            { x: 167, z: 189, name: 'Ghost Signal', desc: 'A transmission from nowhere...', found: false },
            { x: -89, z: -167, name: 'Ancient Terminal', desc: 'Still running after all these years', found: false },
            { x: 289, z: 234, name: 'Sky Bridge', desc: 'Connects two tower blocks', found: false },
            { x: -289, z: -234, name: 'The Crypt', desc: 'Where the old code sleeps', found: false },
            { x: 0, z: 300, name: 'Train Graveyard', desc: 'Abandoned carriages rust in the rain', found: false },
            { x: 300, z: 0, name: 'The Spire', desc: 'The city stretches up forever', found: false }
        ];

        // Ambient events
        const ambientEvents = [
            { time: 22, triggered: false, action: () => showNotification('🎵 Music echoes from Neon Plaza') },
            { time: 23, triggered: false, action: () => showNotification('⚠️ Warning: Security alert in Red Light district') },
            { time: 0, triggered: false, action: () => showNotification('🌙 Midnight in the city') },
            { time: 2, triggered: false, action: () => showNotification('🚂 The night train departs...') },
            { time: 4, triggered: false, action: () => showNotification('🌅 Almost dawn...') },
            { time: 6, triggered: false, action: () => showNotification('☀️ The sun rises') }
        ];

        // Interactive objects
        const interactiveObjects = [];

        // Initialize
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000510);
            scene.fog = new THREE.FogExp2(0x000520, 0.008);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x111122, 0.3);
            scene.add(ambientLight);

            // Create city
            createGround();
            createCity();
            createRain();
            createVehicles();
            createPedestrians();
            createTrains();
            createNeonSigns();
            populateWindows();
            createDataParticles();
            createOrbs();
            createInteractiveObjects();

            // Controls setup
            setupControls();

            // Minimap
            setupMinimap();

            // Events
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);

            // Start screen
            document.getElementById('start-screen').addEventListener('click', startGame);

            // Start render loop
            animate();
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            state.started = true;
            renderer.domElement.requestPointerLock();
        }

        // ============================================
        // CITY GENERATION
        // ============================================

        function createGround() {
            // Main ground with grid pattern
            const groundGeo = new THREE.PlaneGeometry(CITY_SIZE * 2, CITY_SIZE * 2, 100, 100);
            const groundMat = new THREE.MeshBasicMaterial({ 
                color: 0x050510,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.1;
            scene.add(ground);

            // Solid ground
            const solidGround = new THREE.Mesh(
                new THREE.PlaneGeometry(CITY_SIZE * 2, CITY_SIZE * 2),
                new THREE.MeshBasicMaterial({ color: 0x020208 })
            );
            solidGround.rotation.x = -Math.PI / 2;
            solidGround.position.y = -0.2;
            scene.add(solidGround);

            // Street grid
            for (let x = -CITY_SIZE; x <= CITY_SIZE; x += BLOCK_SIZE) {
                createStreetLine(x, true);
            }
            for (let z = -CITY_SIZE; z <= CITY_SIZE; z += BLOCK_SIZE) {
                createStreetLine(z, false);
            }
            
            // Add street lights
            for (let x = -CITY_SIZE/2; x <= CITY_SIZE/2; x += BLOCK_SIZE) {
                for (let z = -CITY_SIZE/2; z <= CITY_SIZE/2; z += BLOCK_SIZE) {
                    // Check if this is near a street intersection
                    if (Math.abs(x % BLOCK_SIZE) < 3 && Math.abs(z % BLOCK_SIZE) < 3) {
                        // Street light at intersection
                        const lightPole = new THREE.Mesh(
                            new THREE.CylinderGeometry(0.1, 0.1, 6, 4),
                            new THREE.MeshBasicMaterial({ color: 0x333333 })
                        );
                        lightPole.position.set(x + 3, 3, z + 3);
                        scene.add(lightPole);
                        
                        // Light fixture
                        const lightFixture = new THREE.PointLight(0xffaa00, 0.8, 20);
                        lightFixture.position.set(x + 3, 6.5, z + 3);
                        scene.add(lightFixture);
                        
                        // Light glow sprite
                        const glowCanvas = document.createElement('canvas');
                        glowCanvas.width = 32;
                        glowCanvas.height = 32;
                        const gctx = glowCanvas.getContext('2d');
                        const gradient = gctx.createRadialGradient(16, 16, 0, 16, 16, 16);
                        gradient.addColorStop(0, 'rgba(255, 170, 50, 1)');
                        gradient.addColorStop(0.5, 'rgba(255, 170, 50, 0.3)');
                        gradient.addColorStop(1, 'rgba(255, 170, 50, 0)');
                        gctx.fillStyle = gradient;
                        gctx.fillRect(0, 0, 32, 32);
                        
                        const glowTex = new THREE.CanvasTexture(glowCanvas);
                        const glowMat = new THREE.SpriteMaterial({ 
                            map: glowTex, 
                            transparent: true,
                            blending: THREE.AdditiveBlending
                        });
                        const glowSprite = new THREE.Sprite(glowMat);
                        glowSprite.scale.set(3, 3, 1);
                        glowSprite.position.set(x + 3, 6.5, z + 3);
                        scene.add(glowSprite);
                    }
                }
            }
            
            // Add puddle reflections (subtle)
            for (let i = 0; i < 100; i++) {
                const px = (Math.random() - 0.5) * CITY_SIZE * 0.9;
                const pz = (Math.random() - 0.5) * CITY_SIZE * 0.9;
                
                const puddle = new THREE.Mesh(
                    new THREE.CircleGeometry(1 + Math.random() * 2, 16),
                    new THREE.MeshBasicMaterial({ 
                        color: 0x111122,
                        transparent: true,
                        opacity: 0.5
                    })
                );
                puddle.rotation.x = -Math.PI / 2;
                puddle.position.set(px, 0.02, pz);
                scene.add(puddle);
            }
        }

        function createStreetLine(pos, isX) {
            const points = [];
            const start = -CITY_SIZE;
            const end = CITY_SIZE;
            
            for (let i = start; i <= end; i += 5) {
                const x = isX ? pos : i;
                const z = isX ? i : pos;
                points.push(new THREE.Vector3(x, 0.01, z));
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0x003344, opacity: 0.5, transparent: true });
            const line = new THREE.Line(geometry, material);
            scene.add(line);
        }

        function createCity() {
            const buildings = [];
            
            // Generate building positions
            for (let x = -CITY_SIZE/2 + 20; x < CITY_SIZE/2 - 20; x += BLOCK_SIZE) {
                for (let z = -CITY_SIZE/2 + 20; z < CITY_SIZE/2 - 20; z += BLOCK_SIZE) {
                    // Skip street areas
                    const streetX = Math.abs(x % BLOCK_SIZE) < STREET_WIDTH;
                    const streetZ = Math.abs(z % BLOCK_SIZE) < STREET_WIDTH;
                    
                    if (!streetX && !streetZ) {
                        // Check which district
                        let district = 'Downtown';
                        let minDist = Infinity;
                        
                        for (const [name, d] of Object.entries(districts)) {
                            const dist = Math.sqrt((x - d.center.x) ** 2 + (z - d.center.z) ** 2);
                            if (dist < d.radius && dist < minDist) {
                                minDist = dist;
                                district = name;
                            }
                        }

                        // Multiple buildings per block
                        const numBuildings = Math.floor(Math.random() * 3) + 1;
                        for (let b = 0; b < numBuildings; b++) {
                            const bx = x + (Math.random() - 0.5) * (BLOCK_SIZE - 8);
                            const bz = z + (Math.random() - 0.5) * (BLOCK_SIZE - 8);
                            
                            // Building properties based on district
                            let height, width, depth, style;
                            
                            switch(district) {
                                case 'Downtown':
                                    height = 30 + Math.random() * 80;
                                    width = 5 + Math.random() * 10;
                                    depth = 5 + Math.random() * 10;
                                    style = 'corporate';
                                    break;
                                case 'Neon Plaza':
                                    height = 15 + Math.random() * 40;
                                    width = 6 + Math.random() * 12;
                                    depth = 6 + Math.random() * 12;
                                    style = 'entertainment';
                                    break;
                                case 'Industrial':
                                    height = 10 + Math.random() * 25;
                                    width = 8 + Math.random() * 15;
                                    depth = 8 + Math.random() * 15;
                                    style = 'warehouse';
                                    break;
                                case 'The Underbelly':
                                    height = 8 + Math.random() * 20;
                                    width = 4 + Math.random() * 8;
                                    depth = 4 + Math.random() * 8;
                                    style = 'slum';
                                    break;
                                case 'Red Light':
                                    height = 12 + Math.random() * 30;
                                    width = 5 + Math.random() * 10;
                                    depth = 5 + Math.random() * 10;
                                    style = 'adult';
                                    break;
                                default:
                                    height = 20 + Math.random() * 50;
                                    width = 6 + Math.random() * 12;
                                    depth = 6 + Math.random() * 12;
                            }
                            
                            buildings.push({ x: bx, z: bz, height, width, depth, district, style });
                        }
                    }
                }
            }

            // Create building meshes with ASCII textures
            buildings.forEach((b, i) => {
                createBuilding(b.x, b.z, b.height, b.width, b.depth, b.district, b.style, i);
            });
        }

        function createBuilding(x, z, height, width, depth, district, style, index) {
            const districtData = districts[district];
            const color = districtData ? districtData.color : 0x00ffff;
            
            // Create building as ASCII text planes
            const charsPerRow = Math.ceil(width * 2);
            const charSpacing = 0.5;
            
            // Front face
            for (let row = 0; row < Math.floor(height); row += 1.5) {
                const y = row + 0.75;
                const rowChars = [];
                
                for (let col = 0; col < width; col += charSpacing) {
                    const charIndex = Math.floor(Math.random() * asciiMid.length);
                    const char = asciiMid[charIndex];
                    const brightness = 0.3 + (row / height) * 0.7;
                    
                    rowChars.push({ char, x: col - width/2, brightness });
                }
                
                // Create text sprite for this row
                const textCanvas = document.createElement('canvas');
                textCanvas.width = 256;
                textCanvas.height = 32;
                const ctx = textCanvas.getContext('2d');
                
                ctx.fillStyle = `rgba(0,0,0,0)`;
                ctx.fillRect(0, 0, 256, 32);
                
                ctx.font = 'bold 24px monospace';
                ctx.textAlign = 'center';
                
                rowChars.forEach((c, i) => {
                    const xPos = (i / rowChars.length) * 256;
                    const col = new THREE.Color(color);
                    col.multiplyScalar(c.brightness);
                    ctx.fillStyle = `rgb(${Math.floor(col.r*255)},${Math.floor(col.g*255)},${Math.floor(col.b*255)})`;
                    ctx.fillText(c.char, xPos, 24);
                });
                
                const texture = new THREE.CanvasTexture(textCanvas);
                const material = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true,
                    side: THREE.DoubleSide
                });
                
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(width, 1.5), material);
                plane.position.set(x, y, z + depth/2 + 0.1);
                scene.add(plane);
            }

            // Add windows
            const windowCount = Math.floor(height / 3) * Math.floor(width / 2);
            for (let w = 0; w < windowCount; w++) {
                if (Math.random() > 0.6) {
                    const wy = 1.5 + Math.random() * (height - 3);
                    const wx = x + (Math.random() - 0.5) * (width - 1);
                    const wz = z + depth/2 + 0.15;
                    
                    const windowLight = new THREE.PointLight(
                        Math.random() > 0.5 ? color : 0xffff00,
                        0.3,
                        5
                    );
                    windowLight.position.set(wx, wy, wz);
                    scene.add(windowLight);
                    
                    state.windows.push({
                        light: windowLight,
                        baseIntensity: 0.3,
                        flickerSpeed: Math.random() * 0.05,
                        phase: Math.random() * Math.PI * 2
                    });
                }
            }

            // Add rooftop details - more variety
            if (height > 30 && Math.random() > 0.5) {
                // Antenna or spire
                const antennaGeo = new THREE.CylinderGeometry(0.1, 0.1, 5, 4);
                const antennaMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const antenna = new THREE.Mesh(antennaGeo, antennaMat);
                antenna.position.set(x, height + 2.5, z);
                scene.add(antenna);
                
                // Blinking light
                const blinkLight = new THREE.PointLight(0xff0000, 1, 20);
                blinkLight.position.set(x, height + 5, z);
                scene.add(blinkLight);
                
                // Animate blink
                const blink = {
                    light: blinkLight,
                    phase: 0,
                    speed: 0.05 + Math.random() * 0.05
                };
            }
            
            // Add horizontal bands/floors on tall buildings
            if (height > 20 && Math.random() > 0.3) {
                for (let floor = 5; floor < height; floor += 8 + Math.random() * 5) {
                    const bandCanvas = document.createElement('canvas');
                    bandCanvas.width = 128;
                    bandCanvas.height = 16;
                    const bctx = bandCanvas.getContext('2d');
                    
                    bctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
                    bctx.fillRect(0, 0, 128, 4);
                    
                    const bandTex = new THREE.CanvasTexture(bandCanvas);
                    const bandMat = new THREE.MeshBasicMaterial({ 
                        map: bandTex, 
                        transparent: true,
                        opacity: 0.5
                    });
                    const band = new THREE.Mesh(new THREE.PlaneGeometry(width + 1, 0.3), bandMat);
                    band.position.set(x, floor, z + depth/2 + 0.05);
                    scene.add(band);
                }
            }
            
            // Add rooftop structures on medium buildings
            if (height > 15 && height < 40 && Math.random() > 0.6) {
                const roofSize = 2 + Math.random() * 2;
                const roofBox = new THREE.Mesh(
                    new THREE.BoxGeometry(roofSize, roofSize/2, roofSize),
                    new THREE.MeshBasicMaterial({ color: 0x222233, wireframe: true, opacity: 0.5, transparent: true })
                );
                roofBox.position.set(x, height + roofSize/4, z);
                scene.add(roofBox);
            }
            
            // Add hanging signs on lower buildings
            if (height < 20 && Math.random() > 0.7) {
                const signChars = ['●', '◆', '★', '◈', '◇'];

        // ============================================
        // ATMOSPHERIC EFFECTS
        // ============================================

        function createRain() {
            const rainCount = 5000;
            const rainGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(rainCount * 3);
            
            for (let i = 0; i < rainCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * CITY_SIZE;
                positions[i * 3 + 1] = Math.random() * 100;
                positions[i * 3 + 2] = (Math.random() - 0.5) * CITY_SIZE;
            }
            
            rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const rainMat = new THREE.PointsMaterial({
                color: 0x4488aa,
                size: 0.15,
                transparent: true,
                opacity: 0.6
            });
            
            const rain = new THREE.Points(rainGeo, rainMat);
            scene.add(rain);
            
            state.rain = rain;
            state.rainPositions = positions;
        }

        function updateRain() {
            if (!state.rain) return;
            
            const positions = state.rainPositions;
            for (let i = 0; i < positions.length / 3; i++) {
                positions[i * 3 + 1] -= 0.8;
                positions[i * 3 + 2] -= 0.1; // wind
                
                if (positions[i * 3 + 1] < 0) {
                    positions[i * 3 + 1] = 100;
                    positions[i * 3] = camera.position.x + (Math.random() - 0.5) * 100;
                    positions[i * 3 + 2] = camera.position.z + (Math.random() - 0.5) * 100;
                }
            }
            state.rain.geometry.attributes.position.needsUpdate = true;
        }

        // VEHICLES
        // ============================================

        function createVehicles() {
            const vehicleColors = [0x00ffff, 0xff00ff, 0xffff00, 0xff6600];
            
            for (let i = 0; i < 30; i++) {
                const vehicle = {
                    x: (Math.random() - 0.5) * CITY_SIZE * 0.8,
                    z: (Math.random() - 0.5) * CITY_SIZE * 0.8,
                    vx: (Math.random() - 0.5) * 0.3,
                    vz: (Math.random() - 0.5) * 0.3,
                    color: vehicleColors[Math.floor(Math.random() * vehicleColors.length)],
                    type: Math.random() > 0.7 ? 'truck' : 'car',
                    mesh: null
                };
                
                // Create ASCII vehicle
                const canvas = document.createElement('canvas');
                canvas.width = 64;
                canvas.height = 32;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 64, 32);
                
                const colorHex = '#' + vehicle.color.toString(16).padStart(6, '0');
                ctx.fillStyle = colorHex;
                
                if (vehicle.type === 'car') {
                    ctx.fillRect(10, 12, 44, 12);
                    ctx.fillRect(14, 8, 20, 8);
                } else {
                    ctx.fillRect(8, 8, 48, 20);
                }
                
                // Headlights
                ctx.fillStyle = '#ffffaa';
                ctx.fillRect(50, 14, 4, 4);
                
                // Taillights
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(10, 14, 4, 4);

                const material = new THREE.SpriteMaterial({ map: texture });

                sprite.scale.set(3, 1.5, 1);
                sprite.position.set(vehicle.x, 0.5, vehicle.z);
                scene.add(sprite);
                
                vehicle.mesh = sprite;
                state.vehicles.push(vehicle);
            }
        }

        function updateVehicles() {
            state.vehicles.forEach(v => {
                v.x += v.vx;
                v.z += v.vz;
                
                // Street following
                const blockX = Math.round(v.x / BLOCK_SIZE) * BLOCK_SIZE;
                const blockZ = Math.round(v.z / BLOCK_SIZE) * BLOCK_SIZE;
                
                if (Math.abs(v.x - blockX) > STREET_WIDTH) v.vx *= -1;
                if (Math.abs(v.z - blockZ) > STREET_WIDTH) v.vz *= -1;
                
                // Bounds
                if (Math.abs(v.x) > CITY_SIZE/2) v.vx *= -1;
                if (Math.abs(v.z) > CITY_SIZE/2) v.vz *= -1;
                
                v.mesh.position.set(v.x, 0.5, v.z);
                
                // Headlight glow
                if (!v.headlight) {
                    v.headlight = new THREE.PointLight(v.color, 0.5, 10);
                    scene.add(v.headlight);
                }
                v.headlight.position.set(v.x + v.vx * 5, 1, v.z + v.vz * 5);
            });
        }

                };

                canvas.height = 32;

        function updatePedestrians() {
            state.pedestrians.forEach(p => {
                p.x += p.vx;
                p.z += p.vz;
                p.phase += 0.1;
                
                // Walking animation
                p.mesh.position.y = 1.2 + Math.sin(p.phase) * 0.1;
                
                // Random direction change
                if (Math.random() < 0.01) {
                    p.vx = (Math.random() - 0.5) * 0.1;
                    p.vz = (Math.random() - 0.5) * 0.1;
                }
                
                // Bounds
                if (Math.abs(p.x) > CITY_SIZE/2 - 20) p.vx *= -1;
                if (Math.abs(p.z) > CITY_SIZE/2 - 20) p.vz *= -1;
                
                p.mesh.position.x = p.x;
                p.mesh.position.z = p.z;
            });
        }

        // ============================================
        // TRAINS
        // ============================================

        function createTrains() {
            // Train tracks (two perpendicular lines)
            const track1 = createTrainTrack(0, true);
            const track2 = createTrainTrack(0, false);
            
            // Train cars
            for (let t = 0; t < 2; t++) {
                const train = {
                    x: t === 0 ? -CITY_SIZE/2 : 0,
                    z: t === 0 ? 0 : -CITY_SIZE/2,
                    direction: t === 0 ? 1 : 1,
                    axis: t, // 0 = x, 1 = z
                    cars: [],
                    speed: 0.5 + Math.random() * 0.3
                };
                
                for (let c = 0; c < 5; c++) {
                    const car = createTrainCar(t, c);
                    train.cars.push(car);
                    scene.add(car);
                }
                
                state.trains.push(train);
            }
        }

        function createTrainTrack(offset, isX) {
            const points = [];
            const start = -CITY_SIZE/2;
            const end = CITY_SIZE/2;
            
            for (let i = start; i <= end; i += 5) {
                points.push(new THREE.Vector3(
                    isX ? i : offset,
                    0.5,
                    isX ? offset : i
                ));
            }
            
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: 0x444444 });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            
            return line;
        }

        function createTrainCar(trainIdx, carIdx) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            // Train body
            ctx.fillStyle = '#333355';
            ctx.fillRect(4, 8, 120, 20);
            
            // Windows
            ctx.fillStyle = '#88aacc';
            for (let w = 0; w < 5; w++) {
                ctx.fillRect(15 + w * 22, 12, 14, 12);
            }
            
            // Lights
            ctx.fillStyle = trainIdx === 0 ? '#ffff00' : '#ffffff';
            ctx.fillRect(118, 14, 6, 4);
            
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(8, 2, 1);
            
            return sprite;
        }

        function updateTrains() {
            state.trains.forEach((train, tIdx) => {
                const offset = tIdx === 0 ? 200 : 200;
                
                train.cars.forEach((car, cIdx) => {
                    const carOffset = cIdx * 10;
                    
                    if (train.axis === 0) {
                        car.position.x = train.x + carOffset;
                        car.position.z = offset;
                    } else {
                        car.position.x = offset;
                        car.position.z = train.z + carOffset;
                    }
                    car.position.y = 2;
                });
                
                train.x += train.speed * train.direction;
                train.z += train.speed * train.direction;
                
                if (train.x > CITY_SIZE/2) {
                    train.x = -CITY_SIZE/2;
                }
                if (train.z > CITY_SIZE/2) {
                    train.z = -CITY_SIZE/2;
                }
            });
        }

        // ============================================
        // NEON SIGNS
        // ============================================

        function createNeonSigns() {
            const signTexts = [
                'CYBERCAFE', 'DATAHUB', 'NEON', 'SYNTH', 'GRID',
                'MATRIX', 'PULSE', 'ZONE', 'NODE', 'CORE',
                'VAPOR', 'BYTE', 'HACK', 'ZERO', 'ECHO',
                'VOID', 'FLUX', 'NEXUS', 'PRISM', 'HYPER'
            ];
            
            for (let i = 0; i < 40; i++) {
                const x = (Math.random() - 0.5) * CITY_SIZE * 0.7;
                const z = (Math.random() - 0.5) * CITY_SIZE * 0.7;
                
                // Snap to buildings
                const blockX = Math.round(x / BLOCK_SIZE) * BLOCK_SIZE;
                const blockZ = Math.round(z / BLOCK_SIZE) * BLOCK_SIZE;
                
                // Find edge of block
                const edgeX = x > blockX ? blockX + BLOCK_SIZE/2 - 2 : blockX - BLOCK_SIZE/2 + 2;
                const edgeZ = z > blockZ ? blockZ + BLOCK_SIZE/2 - 2 : blockZ - BLOCK_SIZE/2 + 2;
                
                const signX = Math.abs(x - blockX) > Math.abs(z - blockZ) ? edgeX : x;
                const signZ = Math.abs(x - blockX) > Math.abs(z - blockZ) ? z : edgeZ;
                
                const text = signTexts[Math.floor(Math.random() * signTexts.length)];
                const color = [0x00ffff, 0xff00ff, 0xffff00, 0x00ff00, 0xff6600][Math.floor(Math.random() * 5)];
                
                const sign = createNeonSign(text, color, signX, 5 + Math.random() * 15, signZ);
                
                state.signs.push({
                    mesh: sign,
                    text: text,
                    color: color,
                    phase: Math.random() * Math.PI * 2,
                    flickerSpeed: 0.01 + Math.random() * 0.03
                });
            }
        }

        function createNeonSign(text, color, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.font = 'bold 36px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const colorHex = '#' + color.toString(16).padStart(6, '0');
            ctx.shadowColor = colorHex;
            ctx.shadowBlur = 20;
            ctx.fillStyle = colorHex;
            ctx.fillText(text, 128, 32);
            
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(text.length * 0.8, 2, 1);
            sprite.position.set(x, y, z);
            scene.add(sprite);
            
            // Add glow light
            const light = new THREE.PointLight(color, 1, 15);
            light.position.set(x, y, z);
            scene.add(light);
            
            return { sprite, light };
        }

        function updateSigns(time) {
            state.signs.forEach(sign => {
                sign.phase += sign.flickerSpeed;
                const flicker = Math.sin(sign.phase * 10) > 0.8 ? 0.5 : 1;
                const pulse = 0.8 + Math.sin(sign.phase) * 0.2;
                
                if (sign.mesh.light) {
                    sign.mesh.light.intensity = flicker * pulse;
                }
            });
        }

        // ============================================
        // CONTROLS
        // ============================================

        function setupControls() {
            controls = {
                pitch: 0,
                yaw: 0,
                euler: new THREE.Euler(0, 0, 0, 'YXZ')
            };
        }

        function onKeyDown(event) {
            if (!state.started) return;
            
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ShiftLeft': 
                case 'ShiftRight': state.isSprinting = true; break;
                case 'KeyF': 
                    state.isFlashlightOn = !state.isFlashlightOn;
                    toggleFlashlight();
                    break;
                case 'KeyE':
                    checkInteraction();
                    break;
                case 'Space':
                    if (camera.position.y < 5) {
                        velocity.y = 8;
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': 
                case 'ShiftRight': state.isSprinting = false; break;
            }
        }

        function onMouseMove(event) {
            if (!state.started || document.pointerLockElement !== renderer.domElement) return;
            
            const sensitivity = 0.002;
            controls.yaw -= event.movementX * sensitivity;
            controls.pitch -= event.movementY * sensitivity;
            
            // Clamp pitch
            controls.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, controls.pitch));
            
            controls.euler.set(controls.pitch, controls.yaw, 0);
            camera.quaternion.setFromEuler(controls.euler);
        }

        function toggleFlashlight() {
            if (state.isFlashlightOn) {
                if (!state.flashlight) {
                    state.flashlight = new THREE.SpotLight(0xffffff, 2, 50, Math.PI / 6, 0.5);
                    state.flashlight.target = new THREE.Object3D();
                    scene.add(state.flashlight);
                    scene.add(state.flashlight.target);
                }
                state.flashlight.position.copy(camera.position);
                state.flashlight.target.position.set(
                    camera.position.x - Math.sin(controls.yaw) * 10,
                    camera.position.y - Math.sin(controls.pitch) * 10,
                    camera.position.z - Math.cos(controls.yaw) * 10
                );
            }
        }

        function checkInteraction() {
            const checkDist = 5;
            
            // Check secrets
            secretLocations.forEach(secret => {
                if (!secret.found) {
                    const dist = Math.sqrt(
                        (camera.position.x - secret.x) ** 2 + 
                        (camera.position.z - secret.z) ** 2
                    );
                    
                    if (dist < checkDist) {
                        secret.found = true;
                        state.secretsFound++;
                        showNotification(`★ DISCOVERED: ${secret.name}`);
                        updateSecretsDisplay();
                    }
                }
            });
            
            // Check signs
            state.signs.forEach(sign => {
                const dist = Math.sqrt(
                    (camera.position.x - sign.mesh.sprite.position.x) ** 2 + 
                    (camera.position.z - sign.mesh.sprite.position.z) ** 2
                );
                
                if (dist < checkDist * 2) {
                    showNotification(sign.text);
                }
            });
        }

        function updateMovement(delta) {
            if (!state.started) return;
            
            const speed = state.isSprinting ? 40 : 20;
            
            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();
            
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 20 * delta; // gravity
            
            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;
            
            // Apply movement relative to camera direction
            const moveX = velocity.x * delta;
            const moveZ = velocity.z * delta;
            
            camera.position.x += moveX * Math.cos(controls.yaw) - moveZ * Math.sin(controls.yaw);
            camera.position.z += moveX * Math.sin(controls.yaw) + moveZ * Math.cos(controls.yaw);
            camera.position.y += velocity.y * delta;
            
            // Floor collision
            if (camera.position.y < 2) {
                velocity.y = 0;
                camera.position.y = 2;
            }
            
            // Building collision (simple)
            const collisionRadius = 1;
            const blockX = Math.round(camera.position.x / BLOCK_SIZE) * BLOCK_SIZE;
            const blockZ = Math.round(camera.position.z / BLOCK_SIZE) * BLOCK_SIZE;
            
            // Keep in bounds
            camera.position.x = Math.max(-CITY_SIZE/2 + 5, Math.min(CITY_SIZE/2 - 5, camera.position.x));
            camera.position.z = Math.max(-CITY_SIZE/2 + 5, Math.min(CITY_SIZE/2 - 5, camera.position.z));
            
            // Update flashlight position
            if (state.flashlight && state.isFlashlightOn) {
                state.flashlight.position.copy(camera.position);
            }
            
            // Update speed display
            state.playerSpeed = Math.sqrt(moveX * moveX + moveZ * moveZ) / delta;
        }

        // ============================================
        // UI UPDATES
        // ============================================

        function updateUI() {
            // Coords
            document.getElementById('coords').textContent = 
                `X: ${Math.round(camera.position.x)} | Y: ${Math.round(camera.position.y)} | Z: ${Math.round(camera.position.z)}`;
            
            // Speed
            document.getElementById('speed').textContent = 
                `SPEED: ${Math.round(state.playerSpeed)}`;
            
            // Time
            const hours = Math.floor(state.time);
            const minutes = Math.floor((state.time - hours) * 60);
            document.getElementById('time-display').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            // District
            updateDistrict();
            
            // Weather
            updateWeather();
        }

        function updateDistrict() {
            let currentDistrict = 'Downtown';
            let minDist = Infinity;
            
            for (const [name, d] of Object.entries(districts)) {
                const dist = Math.sqrt(
                    (camera.position.x - d.center.x) ** 2 + 
                    (camera.position.z - d.center.z) ** 2
                );
                if (dist < minDist) {
                    minDist = dist;
                    currentDistrict = name;
                }
            }
            
            if (currentDistrict !== state.currentDistrict) {
                state.currentDistrict = currentDistrict;
                document.getElementById('location-display').textContent = currentDistrict.toUpperCase();
                
                // Color based on district
                const color = districts[currentDistrict].color;
                document.getElementById('location-display').style.color = '#' + color.toString(16).padStart(6, '0');
            }
        }

        function updateWeather() {
            state.time += state.daySpeed * 0.01;
            if (state.time >= 24) state.time = 0;
            
            // Time-based atmosphere changes
            const isNight = state.time > 20 || state.time < 5;
            const isDawn = state.time > 5 && state.time < 8;
            const isDusk = state.time > 18 && state.time < 20;
            
            // Weather changes based on time
            if (isDawn) {
                state.weather = 'fog';
                // Dawn colors
                scene.fog.color.setHex(0x110820);
                scene.background.setHex(0x050510);
            } else if (isNight) {
                state.weather = 'rain';
                // Night colors
                scene.fog.color.setHex(0x000520);
                scene.background.setHex(0x000510);
            } else if (isDusk) {
                state.weather = 'clear';
                // Dusk colors
                scene.fog.color.setHex(0x201030);
                scene.background.setHex(0x100820);
            } else {
                state.weather = 'clear';
                // Day colors
                scene.fog.color.setHex(0x102040);
                scene.background.setHex(0x051530);
            }
            
            const weatherIcons = {
                'rain': '🌧 RAIN',
                'fog': '🌫 FOG',
                'clear': '☁️ CLEAR'
            };
            document.getElementById('weather-indicator').textContent = weatherIcons[state.weather];
        }

        function updateAmbientEvents() {
            const currentHour = state.time;
            
            ambientEvents.forEach(event => {
                if (!event.triggered && Math.abs(currentHour - event.time) < 0.5) {
                    event.triggered = true;
                    event.action();
                }
                
                // Reset events at new day
                if (currentHour < 0.5 && !event.triggered) {
                    event.triggered = false;
                }
            });
        }

        function updateSecretsDisplay() {
            document.getElementById('secrets').textContent = 
                `SECRETS: ${state.secretsFound}/${state.totalSecrets}`;
            
            if (state.secretsFound === state.totalSecrets) {
                showNotification('🏆 ALL SECRETS DISCOVERED!');
            }
        }

        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.opacity = 1;
            
            setTimeout(() => {
                notif.style.opacity = 0;
            }, 3000);
        }

                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 10px monospace';
                ctx.fillText('>_', 10, 20);
                ctx.fillText('READY', 10, 40);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ map: texture });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(2, 2, 1);
                sprite.position.set(pos.x, 1.5, pos.z);
                scene.add(sprite);
                
                const light = new THREE.PointLight(0x00ff88, 0.5, 8);
                light.position.set(pos.x, 2, pos.z);
                scene.add(light);
                
                interactiveObjects.push({
                    type: 'terminal',
                    x: pos.x,
                    z: pos.z,
                    sprite,
                    light,
                    activated: false
                });
            });
            
            // Glowing statues/monuments
            const statuePositions = [
                { x: 200, z: 100, text: 'NEON', color: 0xff00ff },
                { x: -200, z: -150, text: 'CORE', color: 0xffff00 },
                { x: 0, z: 0, text: 'CITY', color: 0x00ffff }
            ];
            
            statuePositions.forEach(stat => {
                const canvas = document.createElement('canvas');
                canvas.width = 128;
                canvas.height = 128;
                const ctx = canvas.getContext('2d');
                
                ctx.font = 'bold 48px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#' + stat.color.toString(16).padStart(6, '0');
                ctx.shadowColor = '#' + stat.color.toString(16).padStart(6, '0');
                ctx.shadowBlur = 30;
                ctx.fillText(stat.text, 64, 64);
                
                const texture = new THREE.CanvasTexture(canvas);
                const material = new THREE.SpriteMaterial({ 
                    map: texture, 
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                const sprite = new THREE.Sprite(material);
                sprite.scale.set(8, 8, 1);
                sprite.position.set(stat.x, 15, stat.z);
                scene.add(sprite);
                
                const light = new THREE.PointLight(stat.color, 2, 40);
                light.position.set(stat.x, 15, stat.z);
                scene.add(light);
            });
        }

        function updateInteractiveObjects() {
            interactiveObjects.forEach(obj => {
                if (obj.type === 'terminal') {
                    const dist = Math.sqrt(
                        (camera.position.x - obj.x) ** 2 + 
                        (camera.position.z - obj.z) ** 2
                    );
                    
                    if (dist < 5 && !obj.activated) {
                        obj.activated = true;
                        showNotification('💻 Terminal accessed - Data stream connected');
                        obj.light.intensity = 1.5;
                    }
                }
            });
        }
        
        function setupMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            canvas.width = 150;
            canvas.height = 150;
            minimapCtx = canvas.getContext('2d');
        }

        function updateMinimap() {
            if (!minimapCtx) return;
            
            const ctx = minimapCtx;
            const scale = 150 / CITY_SIZE;
            const cx = 75;
            const cy = 75;
            
            // Clear
            ctx.fillStyle = 'rgba(0, 20, 40, 0.9)';
            ctx.fillRect(0, 0, 150, 150);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(0, 100, 100, 0.3)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 150; i += 15) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 150);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(150, i);
                ctx.stroke();
            }
            
            // Draw buildings
            ctx.fillStyle = 'rgba(50, 50, 70, 0.5)';
            for (let x = -CITY_SIZE/2; x < CITY_SIZE/2; x += BLOCK_SIZE) {
                for (let z = -CITY_SIZE/2; z < CITY_SIZE/2; z += BLOCK_SIZE) {
                    const streetX = Math.abs(x % BLOCK_SIZE) < STREET_WIDTH;
                    const streetZ = Math.abs(z % BLOCK_SIZE) < STREET_WIDTH;
                    
                    if (!streetX && !streetZ) {
                        const mx = cx + x * scale;
                        const mz = cy + z * scale;
                        const ms = BLOCK_SIZE * scale - 2;
                        ctx.fillRect(mx - ms/2, mz - ms/2, ms, ms);
                    }
                }
            }
            
            // Draw player
            const px = cx + camera.position.x * scale;
            const pz = cy + camera.position.z * scale;
            
            ctx.fillStyle = '#0ff';
            ctx.beginPath();
            ctx.arc(px, pz, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw direction
            ctx.strokeStyle = '#0ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px, pz);
            ctx.lineTo(
                px + Math.sin(controls.yaw) * 10,
                pz - Math.cos(controls.yaw) * 10
            );
            ctx.stroke();
            
            // Draw secrets
            secretLocations.forEach(secret => {
                if (!secret.found) {
                    const sx = cx + secret.x * scale;
                    const sz = cy + secret.z * scale;
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
                    ctx.fillRect(sx - 2, sz - 2, 4, 4);
                }
            });
        }

        // ============================================
        // ANIMATION LOOP
        // ============================================

        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;
            
            if (state.started) {
                updateMovement(delta);
                updateRain();
                updateVehicles();
                updatePedestrians();
                updateTrains();
                updateSigns(time * 0.001);
                updateWindows(time * 0.001);
                updateDataParticles();
                updateOrbs(time * 0.001);
                updateInteractiveObjects();
                updateAmbientEvents();
                updateMinimap();
                updateUI();
                
                // Fog color based on time
                const fogIntensity = 0.008 + Math.sin(time * 0.0001) * 0.002;
                scene.fog.density = fogIntensity;
            }
            
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start the experience
        init();
    </script>
</body>
</html>
