<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living ASCII 3D City</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: #fff;
            padding: 5px;
            background: rgba(0, 0, 0, 0.5);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="info">
        Living ASCII 3D City<br/>
        WASD to move, MOUSE to look, SHIFT to sprint
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { EffectComposer, RenderPass, EffectPass } from 'https://cdn.jsdelivr.net/npm/postprocessing@6.34.1/build/postprocessing.min.js';
        import { ASCIIEffect } from 'https://cdn.jsdelivr.net/npm/@isladjan/ascii@1.0.4/build/asciiEffect.min.js';

        let camera, scene, renderer, controls;
        let moveForward = false;
        let moveBackward = false;
        let moveLeft = false;
        let moveRight = false;
        let canJump = false;
        let isSprinting = false;

        let composer;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        init();
        animate();

        function init() {
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.y = 10;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 0, 750);

            const ambientLight = new THREE.AmbientLight(0x0000ff, 0.2);
            scene.add(ambientLight);

            controls = new PointerLockControls(camera, document.body);

            const blocker = document.getElementById('info');
            
            blocker.addEventListener('click', function () {
                controls.lock();
            });

            controls.addEventListener('lock', function () {
                blocker.style.display = 'none';
            });

            controls.addEventListener('unlock', function () {
                blocker.style.display = 'block';
            });

            scene.add(controls.getObject());

            const onKeyDown = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = true;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = true;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = true;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = true;
                        break;
                    case 'Space':
                        if (canJump === true) velocity.y += 350;
                        canJump = false;
                        break;
                    case 'ShiftLeft':
                    case 'ShiftRight':
                        isSprinting = true;
                        break;
                }
            };

            const onKeyUp = function (event) {
                switch (event.code) {
                    case 'ArrowUp':
                    case 'KeyW':
                        moveForward = false;
                        break;
                    case 'ArrowLeft':
                    case 'KeyA':
                        moveLeft = false;
                        break;
                    case 'ArrowDown':
                    case 'KeyS':
                        moveBackward = false;
                        break;
                    case 'ArrowRight':
                    case 'KeyD':
                        moveRight = false;
                        break;
                     case 'ShiftLeft':
                    case 'ShiftRight':
                        isSprinting = false;
                        break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            const floorGeometry = new THREE.PlaneGeometry(2000, 2000, 100, 100);
            floorGeometry.rotateX(- Math.PI / 2);
            const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x000033, wireframe: true });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            scene.add(floor);

            generateCity();
            scene.add(floor);

            
            composer.addPass(new RenderPass(scene, camera));

            const asciiEffect = new ASCIIEffect({
                fontSize: 24,
                cellSize: 8,
                color: '#FFFFFF',
                characters: ' .:-=+*#%@'
            });

            composer.addPass(new EffectPass(camera, asciiEffect));

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));

            const asciiEffect = new ASCIIEffect({
                fontSize: 24,
                cellSize: 8,
                color: '#FFFFFF',
                characters: ' .:-=+*#%@'
            });

            composer.addPass(new EffectPass(camera, asciiEffect));

            

        

        function generateCity() {
            const citySize = 50;
            const streetWidth = 20;
            const buildingHeight = 100;
            const buildingMaterial = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0x111111, roughness: 0.8, metalness: 0.2 });

            for (let i = -citySize; i < citySize; i++) {
                for (let j = -citySize; j < citySize; j++) {
                    if (i % 2 === 0 && j % 2 === 0) continue;
                    if (Math.random() > 0.6) {
                        const width = Math.random() * 15 + 5;
                        const depth = Math.random() * 15 + 5;
                        const height = Math.random() * buildingHeight + 20;

                        const buildingGeometry = new THREE.BoxGeometry(width, height, depth);
                        const building = new THREE.Mesh(buildingGeometry, buildingMaterial);

                        building.position.x = i * streetWidth + Math.random() * 10 - 5;
                        building.position.z = j * streetWidth + Math.random() * 10 - 5;
                        building.position.y = height / 2;

                        if (Math.random() > 0.8) {
                            const light = new THREE.PointLight(Math.random() * 0xffffff, 0.5, 50);
                            light.position.set(building.position.x, height, building.position.z);
                            scene.add(light);

                            // Add a sprite to represent the light source
                            const spriteMaterial = new THREE.SpriteMaterial({
                                map: new THREE.CanvasTexture(generateSprite()),
                                blending: THREE.AdditiveBlending
                            });
                            const sprite = new THREE.Sprite(spriteMaterial);
                            sprite.scale.set(10, 10, 10);
                            sprite.position.copy(light.position);
                            scene.add(sprite);
                        }

                        scene.add(building);
                    }
                }
            }
        }

        function generateSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width / 2);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.4, 'rgba(200,200,200,1)');
            gradient.addColorStop(1, 'rgba(0,0,0,1)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            return canvas;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true) {
                const delta = (time - (window.prevTime || time)) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 100.0 * delta; 

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const sprintMultiplier = isSprinting ? 2.5 : 1;

                if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta * sprintMultiplier;
                if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta * sprintMultiplier;
                
                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
                
                controls.getObject().position.y += (velocity.y * delta);

                if (controls.getObject().position.y < 10) {
                    velocity.y = 0;
                    controls.getObject().position.y = 10;
                    canJump = true;
                }
            }

            window.prevTime = time;

            composer.render();
        }
    </script>
</body>
</html>
