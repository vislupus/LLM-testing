<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DRIFT: ASCII City</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'VT323', monospace;
            cursor: none;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #ascii-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 24px;
            text-shadow: 0 0 10px #0ff;
            opacity: 0.7;
        }
        
        #compass {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0;
            font-size: 18px;
            text-shadow: 0 0 8px #ff0;
        }
        
        #location {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #0f0;
            font-size: 20px;
            text-shadow: 0 0 10px #0f0;
        }
        
        #time-display {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #f0f;
            font-size: 20px;
            text-shadow: 0 0 10px #f0f;
        }
        
        #interaction-prompt {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 22px;
            text-shadow: 0 0 15px #fff;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #speed-lines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 70%, rgba(0,255,255,0.03) 100%);
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
        }
        
        #start-screen h1 {
            color: #0ff;
            font-size: 72px;
            text-shadow: 0 0 30px #0ff, 0 0 60px #0ff;
            margin-bottom: 20px;
            animation: flicker 3s infinite;
        }
        
        #start-screen p {
            color: #f0f;
            font-size: 24px;
            text-shadow: 0 0 15px #f0f;
            animation: pulse 2s infinite;
        }
        
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            97% { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        
        #debug-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #666;
            font-size: 14px;
        }
        
        .district-indicator {
            position: absolute;
            top: 60px;
            left: 30px;
            color: #ff0;
            font-size: 16px;
            text-shadow: 0 0 8px #ff0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0ff;
            font-size: 28px;
            text-shadow: 0 0 20px #0ff;
            opacity: 0;
            transition: opacity 0.5s;
            text-align: center;
            white-space: nowrap;
        }
        
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h1>NEON DRIFT</h1>
        <p>[ CLICK TO ENTER THE CITY ]</p>
    </div>
    
    <div id="canvas-container"></div>
    <canvas id="ascii-canvas"></canvas>
    
    <div id="ui-overlay">
        <div id="crosshair">+</div>
        <div id="compass">N</div>
        <div id="location">SECTOR 7-G</div>
        <div id="time-display">22:47:33</div>
        <div class="district-indicator" id="district-name">NEON DISTRICT</div>
        <div id="interaction-prompt">[E] INTERACT</div>
        <div id="debug-info"></div>
        <div id="notification"></div>
    </div>
    
    <div id="speed-lines"></div>
    <div class="scanline"></div>

    <script>
        // ═══════════════════════════════════════════════════════════════
        // NEON DRIFT - ASCII 3D CITY EXPERIENCE
        // ═══════════════════════════════════════════════════════════════
        
        const CONFIG = {
            CHARSET: ' .:-=+*#%@█▓▒░╔╗╚╝║╠═╣╬╬┌┐└┘││▄▀█',
            COLOR_PALETTE: {
                cyan: '#0ff',
                magenta: '#f0f',
                yellow: '#ff0',
                green: '#0f0',
                red: '#f00',
                white: '#fff',
                blue: '#00f',
                orange: '#fa0'
            },
            CITY_SIZE: 800,
            BLOCK_SIZE: 40,
            STREET_WIDTH: 12,
            BUILDING_MIN_HEIGHT: 20,
            BUILDING_MAX_HEIGHT: 120,
            FOG_DENSITY: 0.015,
            RAIN_INTENSITY: 0.3,
            DAY_DURATION: 600 // seconds for full cycle
        };
        
        // ═══════════════════════════════════════════════════════════════
        // GLOBAL STATE
        // ═══════════════════════════════════════════════════════════════
        
        let scene, camera, renderer, clock;
        let player = {
            position: new THREE.Vector3(0, 8, 0),
            velocity: new THREE.Vector3(),
            rotation: { x: 0, y: 0 },
            isSprinting: false,
            isMoving: false,
            speed: 40,
            sprintMultiplier: 1.8
        };
        
        let buildings = [];
        let vehicles = [];
        let pedestrians = [];
        let signs = [];
        let rainParticles = [];
        let cityLights = [];
        let reflectiveSurfaces = [];
        let interactiveObjects = [];
        
        let asciiCanvas, asciiCtx;
        let asciiWidth = 160;
        let asciiHeight = 60;
        
        let keys = {};
        let isPointerLocked = false;
        let gameStarted = false;
        let timeOfDay = 0.7; // 0-1, 0.7 = night
        let weatherIntensity = 0.3;
        let currentDistrict = 'DOWNTOWN';
        
        const districts = [
            { name: 'DOWNTOWN', color: '#0ff', bounds: { minX: -200, maxX: 200, minZ: -200, maxZ: 200 } },
            { name: 'INDUSTRIAL', color: '#fa0', bounds: { minX: 200, maxX: 400, minZ: -200, maxZ: 200 } },
            { name: 'SLUMS', color: '#f00', bounds: { minX: -400, maxX: -200, minZ: -200, maxZ: 200 } },
            { name: 'CYBER DISTRICT', color: '#f0f', bounds: { minX: -200, maxX: 200, minZ: 200, maxZ: 400 } },
            { name: 'HARBOR', color: '#00f', bounds: { minX: -400, maxX: -200, minZ: 200, maxZ: 400 } },
            { name: 'UPPER LEVELS', color: '#0f0', bounds: { minX: 200, maxX: 400, minZ: 200, maxX: 400 } }
        ];
        
        // ═══════════════════════════════════════════════════════════════
        // INITIALIZATION
        // ═══════════════════════════════════════════════════════════════
        
        function init() {
            // Three.js setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000510, CONFIG.FOG_DENSITY);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(0.5);
            renderer.setClearColor(0x000510);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // ASCII canvas
            asciiCanvas = document.getElementById('ascii-canvas');
            asciiCtx = asciiCanvas.getContext('2d');
            asciiCanvas.width = asciiWidth;
            asciiCanvas.height = asciiHeight;
            asciiCanvas.style.width = '100%';
            asciiCanvas.style.height = '100%';
            
            clock = new THREE.Clock();
            
            // Generate city
            generateCity();
            createRain();
            createAmbientLights();
            
            // Event listeners
            setupControls();
            
            // Start screen
            document.getElementById('start-screen').addEventListener('click', startGame);
        }
        
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameStarted = true;
            asciiCanvas.requestPointerLock();
        }
        
        // ═══════════════════════════════════════════════════════════════
        // CITY GENERATION
        // ═══════════════════════════════════════════════════════════════
        
        function generateCity() {
            // Ground plane
            const groundGeo = new THREE.PlaneGeometry(CONFIG.CITY_SIZE * 2, CONFIG.CITY_SIZE * 2);
            const groundMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = 0;
            scene.add(ground);
            
            // Street grid
            generateStreets();
            
            // Buildings in each district
            districts.forEach(district => {
                generateDistrictBuildings(district);
            });
            
            // Generate vehicles
            for (let i = 0; i < 30; i++) {
                createVehicle();
            }
            
            // Generate pedestrians
            for (let i = 0; i < 50; i++) {
                createPedestrian();
            }
            
            // Generate signs
            for (let i = 0; i < 40; i++) {
                createSign();
            }
            
            // Create special locations
            createSpecialLocations();
        }
        
        function generateStreets() {
            const streetMat = new THREE.MeshBasicMaterial({ color: 0x111118 });
            
            // Main streets
            for (let i = -CONFIG.CITY_SIZE / 2; i < CONFIG.CITY_SIZE / 2; i += CONFIG.BLOCK_SIZE) {
                // Horizontal streets
                const hStreet = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.CITY_SIZE, CONFIG.STREET_WIDTH),
                    streetMat
                );
                hStreet.rotation.x = -Math.PI / 2;
                hStreet.position.set(0, 0.01, i);
                scene.add(hStreet);
                
                // Vertical streets
                const vStreet = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.STREET_WIDTH, CONFIG.CITY_SIZE),
                    streetMat
                );
                vStreet.rotation.x = -Math.PI / 2;
                vStreet.position.set(i, 0.01, 0);
                scene.add(vStreet);
            }
            
            // Street lights
            for (let x = -CONFIG.CITY_SIZE / 2; x < CONFIG.CITY_SIZE / 2; x += CONFIG.BLOCK_SIZE / 2) {
                for (let z = -CONFIG.CITY_SIZE / 2; z < CONFIG.CITY_SIZE / 2; z += CONFIG.BLOCK_SIZE / 2) {
                    if (Math.random() > 0.5) {
                        createStreetLight(x + 5, z + 5);
                    }
                }
            }
        }
        
        function generateDistrictBuildings(district) {
            const { minX, maxX, minZ, maxZ, name } = district;
            const blockSize = CONFIG.BLOCK_SIZE;
            const streetW = CONFIG.STREET_WIDTH;
            
            for (let bx = minX; bx < maxX - blockSize; bx += blockSize) {
                for (let bz = minZ; bz < maxZ - blockSize; bz += blockSize) {
                    // Skip some blocks for variety
                    if (Math.random() > 0.85) continue;
                    
                    const numBuildings = Math.floor(Math.random() * 3) + 1;
                    
                    for (let i = 0; i < numBuildings; i++) {
                        const width = 8 + Math.random() * 15;
                        const depth = 8 + Math.random() * 15;
                        const height = CONFIG.BUILDING_MIN_HEIGHT + 
                            Math.random() * (CONFIG.BUILDING_MAX_HEIGHT - CONFIG.BUILDING_MIN_HEIGHT);
                        
                        const offsetX = Math.random() * (blockSize - width - streetW);
                        const offsetZ = Math.random() * (blockSize - depth - streetW);
                        
                        createBuilding(
                            bx + offsetX + streetW / 2,
                            bz + offsetZ + streetW / 2,
                            width, height, depth,
                            district
                        );
                    }
                }
            }
        }
        
        function createBuilding(x, z, width, height, depth, district) {
            // Create building as a group of ASCII planes
            const building = {
                position: new THREE.Vector3(x, height / 2, z),
                width, height, depth,
                district: district.name,
                windows: [],
                color: district.color
            };
            
            // Main structure (represented as ASCII boxes)
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshBasicMaterial({ 
                color: new THREE.Color(district.color).multiplyScalar(0.3),
                transparent: true,
                opacity: 0.1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height / 2, z);
            scene.add(mesh);
            
            // Add windows (as separate planes with ASCII patterns)
            const windowRows = Math.floor(height / 4);
            const windowCols = Math.floor(width / 3);
            
            for (let row = 0; row < windowRows; row++) {
                for (let col = 0; col < windowCols; col++) {
                    if (Math.random() > 0.4) {
                        const wy = row * 4 + 2;
                        const wx = x - width / 2 + col * 3 + 2;
                        const wz = z + depth / 2 + 0.1;
                        
                        const windowData = {
                            position: new THREE.Vector3(wx, wy, wz),
                            lit: Math.random() > 0.3,
                            color: Math.random() > 0.5 ? '#0ff' : '#f0f',
                            flicker: Math.random() > 0.8,
                            lastFlicker: 0
                        };
                        building.windows.push(windowData);
                        
                        // Add visible light point
                        const lightGeo = new THREE.PlaneGeometry(1, 1.5);
                        const lightMat = new THREE.MeshBasicMaterial({
                            color: windowData.color,
                            transparent: true,
                            opacity: windowData.lit ? 0.8 : 0.1
                        });
                        const lightMesh = new THREE.Mesh(lightGeo, lightMat);
                        lightMesh.position.copy(windowData.position);
                        scene.add(lightMesh);
                        windowData.mesh = lightMesh;
                    }
                }
            }
            
            // Add rooftop details
            if (Math.random() > 0.5) {
                const roofHeight = 3 + Math.random() * 5;
                const roofGeo = new THREE.BoxGeometry(width * 0.5, roofHeight, depth * 0.5);
                const roofMat = new THREE.MeshBasicMaterial({ 
                    color: 0x333344,
                    transparent: true,
                    opacity: 0.5
                });
                const roof = new THREE.Mesh(roofGeo, roofMat);
                roof.position.set(x, height + roofHeight / 2, z);
                scene.add(roof);
                
                // Antenna or spire
                if (Math.random() > 0.7) {
                    const antennaGeo = new THREE.CylinderGeometry(0.1, 0.1, 10, 4);
                    const antennaMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                    const antenna = new THREE.Mesh(antennaGeo, antennaMat);
                    antenna.position.set(x, height + roofHeight + 5, z);
                    scene.add(antenna);
                    
                    // Blinking light
                    const blinkGeo = new THREE.SphereGeometry(0.3);
                    const blinkMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                    const blink = new THREE.Mesh(blinkGeo, blinkMat);
                    blink.position.set(x, height + roofHeight + 10, z);
                    scene.add(blink);
                    building.blink = blink;
                }
            }
            
            buildings.push(building);
            
            // Add interactive points on some buildings
            if (Math.random() > 0.9) {
                interactiveObjects.push({
                    type: 'building_entrance',
                    position: new THREE.Vector3(x, 2, z + depth / 2 + 2),
                    name: `Building ${buildings.length}`,
                    district: district.name
                });
            }
        }
        
        function createStreetLight(x, z) {
            // Pole
            const poleGeo = new THREE.CylinderGeometry(0.2, 0.2, 12);
            const poleMat = new THREE.MeshBasicMaterial({ color: 0x444444 });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(x, 6, z);
            scene.add(pole);
            
            // Light fixture
            const lightColor = Math.random() > 0.5 ? '#0ff' : '#ff0';
            const lightGeo = new THREE.SphereGeometry(1);
            const lightMat = new THREE.MeshBasicMaterial({ color: lightColor });
            const light = new THREE.Mesh(lightGeo, lightMat);
            light.position.set(x, 12, z);
            scene.add(light);
            
            // Point light
            const pointLight = new THREE.PointLight(lightColor, 0.5, 30);
            pointLight.position.set(x, 11, z);
            scene.add(pointLight);
            
            cityLights.push({ mesh: light, pointLight, baseColor: lightColor });
        }
        
        function createVehicle() {
            const lane = Math.random() > 0.5 ? 'horizontal' : 'vertical';
            const direction = Math.random() > 0.5 ? 1 : -1;
            
            let x, z, rotation;
            const lanePos = (Math.floor(Math.random() * 20) - 10) * CONFIG.BLOCK_SIZE;
            
            if (lane === 'horizontal') {
                x = -CONFIG.CITY_SIZE / 2 + Math.random() * CONFIG.CITY_SIZE;
                z = lanePos + (Math.random() > 0.5 ? 3 : -3);
                rotation = direction > 0 ? 0 : Math.PI;
            } else {
                x = lanePos + (Math.random() > 0.5 ? 3 : -3);
                z = -CONFIG.CITY_SIZE / 2 + Math.random() * CONFIG.CITY_SIZE;
                rotation = direction > 0 ? Math.PI / 2 : -Math.PI / 2;
            }
            
            const vehicle = {
                position: new THREE.Vector3(x, 1, z),
                velocity: new THREE.Vector3(0, 0, 0),
                direction,
                lane,
                speed: 15 + Math.random() * 20,
                type: Math.random() > 0.7 ? 'truck' : 'car',
                color: ['#f00', '#0ff', '#ff0', '#fff', '#333'][Math.floor(Math.random() * 5)],
                tailLights: true,
                headlights: true
            };
            
            // Visual representation
            const bodyGeo = new THREE.BoxGeometry(
                vehicle.type === 'truck' ? 8 : 4,
                2,
                vehicle.type === 'truck' ? 3 : 2
            );
            const bodyMat = new THREE.MeshBasicMaterial({ color: vehicle.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.copy(vehicle.position);
            body.rotation.y = rotation;
            scene.add(body);
            vehicle.mesh = body;
            
            vehicles.push(vehicle);
        }
        
        function createPedestrian() {
            const x = (Math.random() - 0.5) * CONFIG.CITY_SIZE;
            const z = (Math.random() - 0.5) * CONFIG.CITY_SIZE;
            
            const pedestrian = {
                position: new THREE.Vector3(x, 0, z),
                target: new THREE.Vector3(x + (Math.random() - 0.5) * 50, 0, z + (Math.random() - 0.5) * 50),
                speed: 2 + Math.random() * 3,
                type: Math.random() > 0.5 ? 'walker' : 'stander',
                direction: Math.random() * Math.PI * 2,
                color: Math.random() > 0.5 ? '#0ff' : '#f0f',
                waiting: false,
                waitTime: 0
            };
            
            // Simple visual
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 3);
            const bodyMat = new THREE.MeshBasicMaterial({ color: pedestrian.color });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.copy(pedestrian.position);
            body.position.y = 1.5;
            scene.add(body);
            pedestrian.mesh = body;
            
            pedestrians.push(pedestrian);
        }
        
        function createSign() {
            const x = (Math.random() - 0.5) * CONFIG.CITY_SIZE * 0.8;
            const z = (Math.random() - 0.5) * CONFIG.CITY_SIZE * 0.8;
            const height = 5 + Math.random() * 10;
            
            const signTexts = [
                'CYBER CAFE', 'NEON BAR', 'DATA SHOP', 'BIO-MED',
                'SYNTHETIC', 'NEXUS NET', 'HOLO-MALL', 'DRIVE-THRU',
                '24/7', 'OPEN', 'CLOSED', 'ENTER', 'EXIT',
                '⚠ CAUTION', '↓ DOWN', '↑ UP', '◆ SPECIAL',
                '【★】', '『VAR』', '『NET』', '◈ JOIN'
            ];
            
            const sign = {
                position: new THREE.Vector3(x, height, z),
                text: signTexts[Math.floor(Math.random() * signTexts.length)],
                color: ['#0ff', '#f0f', '#ff0', '#0f0'][Math.floor(Math.random() * 4)],
                flicker: Math.random() > 0.7,
                lastFlicker: 0,
                rotation: (Math.random() - 0.5) * 0.5
            };
            
            signs.push(sign);
            
            // Add to interactive
            if (Math.random() > 0.7) {
                interactiveObjects.push({
                    type: 'sign',
                    position: new THREE.Vector3(x, height, z),
                    name: sign.text,
                    district: getDistrict(x, z)
                });
            }
        }
        
        function createSpecialLocations() {
            // Hidden alley
            interactiveObjects.push({
                type: 'hidden_area',
                position: new THREE.Vector3(-150, 0, -150),
                name: 'Hidden Alley',
                district: 'SLUMS',
                secret: true
            });
            
            // Rooftop access
            interactiveObjects.push({
                type: 'rooftop',
                position: new THREE.Vector3(50, 40, 50),
                name: 'Rooftop Access',
                district: 'DOWNTOWN'
            });
            
            // Mystery location
            interactiveObjects.push({
                type: 'mystery',
                position: new THREE.Vector3(300, 0, 300),
                name: 'Abandoned Warehouse',
                district: 'INDUSTRIAL',
                secret: true
            });
            
            // Subway entrance
            interactiveObjects.push({
                type: 'subway',
                position: new THREE.Vector3(0, 0, 100),
                name: 'Subway Station',
                district: 'DOWNTOWN'
            });
        }
        
        function createRain() {
            for (let i = 0; i < 2000; i++) {
                rainParticles.push({
                    position: new THREE.Vector3(
                        (Math.random() - 0.5) * CONFIG.CITY_SIZE,
                        Math.random() * 100,
                        (Math.random() - 0.5) * CONFIG.CITY_SIZE
                    ),
                    velocity: new THREE.Vector3(0, -50 - Math.random() * 30, 0)
                });
            }
        }
        
        function createAmbientLights() {
            // Ambient
            const ambient = new THREE.AmbientLight(0x111122, 0.3);
            scene.add(ambient);
            
            // Distant city glow
            const cityGlow = new THREE.PointLight(0x0ff, 0.5, 500);
            cityGlow.position.set(0, 100, 0);
            scene.add(cityGlow);
        }
        
        // ═══════════════════════════════════════════════════════════════
        // CONTROLS
        // ═══════════════════════════════════════════════════════════════
        
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                    player.isSprinting = true;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
                if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
                    player.isSprinting = false;
                }
                if (e.code === 'KeyE') {
                    checkInteraction();
                }
            });
            
            document.addEventListener('mousemove', (e) => {
                if (isPointerLocked) {
                    player.rotation.y -= e.movementX * 0.002;
                    player.rotation.x -= e.movementY * 0.002;
                    player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotation.x));
                }
            });
            
            document.addEventListener('pointerlockchange', () => {
                isPointerLocked = document.pointerLockElement === asciiCanvas;
            });
            
            asciiCanvas.addEventListener('click', () => {
                if (gameStarted) {
                    asciiCanvas.requestPointerLock();
                }
            });
            
            window.addEventListener('resize', onWindowResize);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // ═══════════════════════════════════════════════════════════════
        // GAME LOOP
        // ═══════════════════════════════════════════════════════════════
        
        function update(delta) {
            if (!gameStarted) return;
            
            updatePlayer(delta);
            updateVehicles(delta);
            updatePedestrians(delta);
            updateRain(delta);
            updateLights(delta);
            updateTime(delta);
            checkDistrict();
            checkInteractions();
            renderASCII();
            updateUI();
        }
        
        function updatePlayer(delta) {
            const speed = player.speed * (player.isSprinting ? player.sprintMultiplier : 1);
            
            // Calculate movement direction
            const forward = new THREE.Vector3(0, 0, -1);
            const right = new THREE.Vector3(1, 0, 0);
            
            forward.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            right.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            
            player.velocity.set(0, 0, 0);
            player.isMoving = false;
            
            if (keys['KeyW']) {
                player.velocity.add(forward.multiplyScalar(speed));
                player.isMoving = true;
            }
            if (keys['KeyS']) {
                player.velocity.add(forward.multiplyScalar(-speed));
                player.isMoving = true;
            }
            if (keys['KeyA']) {
                player.velocity.add(right.multiplyScalar(-speed));
                player.isMoving = true;
            }
            if (keys['KeyD']) {
                player.velocity.add(right.multiplyScalar(speed));
                player.isMoving = true;
            }
            
            // Apply movement
            player.position.add(player.velocity.clone().multiplyScalar(delta));
            
            // Keep player in bounds
            const bound = CONFIG.CITY_SIZE / 2 - 10;
            player.position.x = Math.max(-bound, Math.min(bound, player.position.x));
            player.position.z = Math.max(-bound, Math.min(bound, player.position.z));
            player.position.y = 8; // Fixed height
            
            // Update camera
            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotation.y;
            camera.rotation.x = player.rotation.x;
            
            // Speed lines effect
            const speedLines = document.getElementById('speed-lines');
            if (player.isSprinting && player.isMoving) {
                speedLines.style.opacity = '1';
            } else {
                speedLines.style.opacity = '0';
            }
        }
        
        function updateVehicles(delta) {
            vehicles.forEach(vehicle => {
                if (vehicle.lane === 'horizontal') {
                    vehicle.position.x += vehicle.speed * vehicle.direction * delta;
                    if (vehicle.position.x > CONFIG.CITY_SIZE / 2) {
                        vehicle.position.x = -CONFIG.CITY_SIZE / 2;
                    } else if (vehicle.position.x < -CONFIG.CITY_SIZE / 2) {
                        vehicle.position.x = CONFIG.CITY_SIZE / 2;
                    }
                } else {
                    vehicle.position.z += vehicle.speed * vehicle.direction * delta;
                    if (vehicle.position.z > CONFIG.CITY_SIZE / 2) {
                        vehicle.position.z = -CONFIG.CITY_SIZE / 2;
                    } else if (vehicle.position.z < -CONFIG.CITY_SIZE / 2) {
                        vehicle.position.z = CONFIG.CITY_SIZE / 2;
                    }
                }
                
                vehicle.mesh.position.copy(vehicle.position);
            });
        }
        
        function updatePedestrians(delta) {
            pedestrians.forEach(ped => {
                if (ped.type === 'walker' && !ped.waiting) {
                    const dir = ped.target.clone().sub(ped.position);
                    dir.y = 0;
                    
                    if (dir.length() < 2) {
                        // New target
                        ped.target.set(
                            ped.position.x + (Math.random() - 0.5) * 100,
                            0,
                            ped.position.z + (Math.random() - 0.5) * 100
                        );
                    } else {
                        dir.normalize();
                        ped.position.add(dir.multiplyScalar(ped.speed * delta));
                    }
                } else if (ped.waiting) {
                    ped.waitTime -= delta;
                    if (ped.waitTime <= 0) {
                        ped.waiting = false;
                    }
                }
                
                ped.mesh.position.x = ped.position.x;
                ped.mesh.position.z = ped.position.z;
            });
        }
        
        function updateRain(delta) {
            rainParticles.forEach(particle => {
                particle.position.add(particle.velocity.clone().multiplyScalar(delta));
                
                if (particle.position.y < 0) {
                    particle.position.y = 100;
                    particle.position.x = player.position.x + (Math.random() - 0.5) * 100;
                    particle.position.z = player.position.z + (Math.random() - 0.5) * 100;
                }
            });
        }
        
        function updateLights(delta) {
            const time = clock.getElapsedTime();
            
            // Flicker building windows
            buildings.forEach(building => {
                building.windows.forEach(win => {
                    if (win.flicker && Math.random() > 0.98) {
                        win.lit = !win.lit;
                        win.mesh.material.opacity = win.lit ? 0.8 : 0.1;
                    }
                });
                
                if (building.blink) {
                    building.blink.material.opacity = Math.sin(time * 3) > 0 ? 1 : 0.2;
                }
            });
            
            // Flicker signs
            signs.forEach(sign => {
                if (sign.flicker && Math.random() > 0.99) {
                    sign.mesh && (sign.mesh.material.opacity = Math.random() > 0.5 ? 1 : 0.2);
                }
            });
        }
        
        function updateTime(delta) {
            timeOfDay += delta / CONFIG.DAY_DURATION;
            if (timeOfDay > 1) timeOfDay = 0;
        }
        
        function getDistrict(x, z) {
            for (const district of districts) {
                if (x >= district.bounds.minX && x < district.bounds.maxX &&
                    z >= district.bounds.minZ && z < district.bounds.maxZ) {
                    return district.name;
                }
            }
            return 'UNKNOWN';
        }
        
        function checkDistrict() {
            const newDistrict = getDistrict(player.position.x, player.position.z);
            if (newDistrict !== currentDistrict) {
                currentDistrict = newDistrict;
                showNotification(`ENTERING: ${currentDistrict}`);
            }
        }
        
        let nearbyInteractable = null;
        
        function checkInteractions() {
            let closest = null;
            let closestDist = 8;
            
            interactiveObjects.forEach(obj => {
                const dist = player.position.distanceTo(obj.position);
                if (dist < closestDist) {
                    closestDist = dist;
                    closest = obj;
                }
            });
            
            nearbyInteractable = closest;
            const prompt = document.getElementById('interaction-prompt');
            prompt.style.opacity = closest ? '1' : '0';
        }
        
        function checkInteraction() {
            if (nearbyInteractable) {
                const { name, type, secret } = nearbyInteractable;
                
                if (type === 'hidden_area') {
                    showNotification('You found a SECRET ALLEY!');
                    showNotification('A neon cat watches you from the shadows...');
                } else if (type === 'mystery') {
                    showNotification('The warehouse door creaks open...');
                    showNotification('Inside: old holographic advertisements');
                } else if (type === 'subway') {
                    showNotification('Subway train passes beneath your feet');
                    showNotification('The city breathes beneath you');
                } else if (type === 'rooftop') {
                    showNotification('A vantage point! The city stretches infinitely...');
                } else {
                    showNotification(`You approach: ${name}`);
                }
                
                if (secret) {
                    playSecretSound();
                }
            }
        }
        
        function showNotification(text) {
            const notif = document.getElementById('notification');
            notif.textContent = text;
            notif.style.opacity = '1';
            setTimeout(() => {
                notif.style.opacity = '0';
            }, 3000);
        }
        
        function playSecretSound() {
            // Simple audio feedback
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            oscillator.connect(gain);
            gain.connect(audioCtx.destination);
            oscillator.frequency.value = 880;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.5);
        }
        
        // ═══════════════════════════════════════════════════════════════
        // ASCII RENDERING
        // ═══════════════════════════════════════════════════════════════
        
        function renderASCII() {
            // Clear with dark background
            const gradient = asciiCtx.createRadialGradient(
                asciiWidth / 2, asciiHeight / 2, 0,
                asciiWidth / 2, asciiHeight / 2, asciiWidth
            );
            gradient.addColorStop(0, '#0a0a15');
            gradient.addColorStop(1, '#000005');
            asciiCtx.fillStyle = gradient;
            asciiCtx.fillRect(0, 0, asciiWidth, asciiHeight);
            
            const time = clock.getElapsedTime();
            
            // Get scene objects for ASCII rendering
            const renderObjects = [];
            
            // Add buildings
            buildings.forEach(building => {
                const dist = camera.position.distanceTo(building.position);
                if (dist < 150) {
                    renderObjects.push({
                        type: 'building',
                        position: building.position,
                        distance: dist,
                        color: building.color,
                        height: building.height,
                        windows: building.windows
                    });
                }
            });
            
            // Add vehicles
            vehicles.forEach(vehicle => {
                const dist = camera.position.distanceTo(vehicle.position);
                if (dist < 80) {
                    renderObjects.push({
                        type: 'vehicle',
                        position: vehicle.position.clone(),
                        distance: dist,
                        color: vehicle.color,
                        direction: vehicle.direction,
                        lane: vehicle.lane
                    });
                }
            });
            
            // Add pedestrians
            pedestrians.forEach(ped => {
                const dist = camera.position.distanceTo(ped.position);
                if (dist < 40) {
                    renderObjects.push({
                        type: 'pedestrian',
                        position: ped.position.clone(),
                        distance: dist,
                        color: ped.color
                    });
                }
            });
            
            // Add signs
            signs.forEach(sign => {
                const dist = camera.position.distanceTo(sign.position);
                if (dist < 60) {
                    renderObjects.push({
                        type: 'sign',
                        position: sign.position,
                        distance: dist,
                        color: sign.color,
                        text: sign.text
                    });
                }
            });
            
            // Add rain
            rainParticles.forEach(particle => {
                const dist = camera.position.distanceTo(particle.position);
                if (dist < 60) {
                    renderObjects.push({
                        type: 'rain',
                        position: particle.position.clone(),
                        distance: dist
                    });
                }
            });
            
            // Add city lights
            cityLights.forEach(light => {
                const dist = camera.position.distanceTo(light.mesh.position);
                if (dist < 80) {
                    renderObjects.push({
                        type: 'light',
                        position: light.mesh.position.clone(),
                        distance: dist,
                        color: light.baseColor
                    });
                }
            });
            
            // Sort by distance (far to near)
            renderObjects.sort((a, b) => b.distance - a.distance);
            
            // Project and render
            renderObjects.forEach(obj => {
                projectAndRender(obj, time);
            });
            
            // Add atmosphere effects
            renderAtmosphere(time);
        }
        
        function projectAndRender(obj, time) {
            // Transform position relative to camera
            const relPos = obj.position.clone().sub(camera.position);
            
            // Apply camera rotation
            const cosY = Math.cos(-player.rotation.y);
            const sinY = Math.sin(-player.rotation.y);
            const cosX = Math.cos(-player.rotation.x);
            const sinX = Math.sin(-player.rotation.x);
            
            const x = relPos.x * cosY - relPos.z * sinY;
            const z = relPos.x * sinY + relPos.z * cosY;
            const y = relPos.y * cosX - z * sinX;
            const z2 = relPos.y * sinX + z * cosX;
            
            if (z2 <= 0.5) return; // Behind camera
            
            // Project to screen
            const fov = 75 * Math.PI / 180;
            const screenX = (x / z2) * (asciiWidth / 2) / Math.tan(fov / 2) + asciiWidth / 2;
            const screenY = (-y / z2) * (asciiHeight / 2) / Math.tan(fov / 2) + asciiHeight / 2;
            
            // Size based on distance
            const baseSize = Math.max(1, 8 - obj.distance / 20);
            const size = Math.min(baseSize, 4);
            
            // Render based on type
            switch (obj.type) {
                case 'building':
                    renderBuildingASCII(screenX, screenY, obj, size);
                    break;
                case 'vehicle':
                    renderVehicleASCII(screenX, screenY, obj, size);
                    break;
                case 'pedestrian':
                    renderPedestrianASCII(screenX, screenY, obj, size);
                    break;
                case 'sign':
                    renderSignASCII(screenX, screenY, obj, size);
                    break;
                case 'rain':
                    renderRainASCII(screenX, screenY, obj, size);
                    break;
                case 'light':
                    renderLightASCII(screenX, screenY, obj, size, time);
                    break;
            }
        }
        
        function renderBuildingASCII(x, y, obj, size) {
            const intensity = Math.max(0, 1 - obj.distance / 150);
            const charIndex = Math.floor(intensity * (CONFIG.CHARSET.length - 1));
            const char = CONFIG.CHARSET[charIndex];
            
            // Building outline
            const heightChars = Math.floor(obj.height / 10 * size);
            const widthChars = Math.floor(20 / obj.distance * 20 + 2);
            
            asciiCtx.fillStyle = obj.color;
            asciiCtx.globalAlpha = intensity * 0.8;
            
            // Draw vertical lines
            for (let i = 0; i < heightChars; i++) {
                const charY = y - i * size;
                if (charY < 0 || charY > asciiHeight) continue;
                
                // Left edge
                asciiCtx.fillText(char, x - widthChars * size / 2, charY);
                // Right edge
                asciiCtx.fillText(char, x + widthChars * size / 2, charY);
            }
            
            // Windows
            if (obj.windows && obj.distance < 60) {
                obj.windows.forEach(win => {
                    const winRelPos = win.position.clone().sub(camera.position);
                    const cosY = Math.cos(-player.rotation.y);
                    const sinY = Math.sin(-player.rotation.y);
                    const wx = winRelPos.x * cosY - winRelPos.z * sinY;
                    const wz = winRelPos.x * sinY + winRelPos.z * cosY;
                    
                    if (wz > 0) {
                        const winScreenX = (wx / wz) * (asciiWidth / 2) / Math.tan(75 * Math.PI / 180 / 2) + asciiWidth / 2;
                        const winScreenY = ((-winRelPos.y / wz) * (asciiHeight / 2) / Math.tan(75 * Math.PI / 180 / 2) + asciiHeight / 2);
                        
                        if (win.lit) {
                            asciiCtx.fillStyle = win.color;
                            asciiCtx.fillText('▀', winScreenX, winScreenY);
                            asciiCtx.fillText('▄', winScreenX, winScreenY + size);
                        }
                    }
                });
            }
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderVehicleASCII(x, y, obj, size) {
            const intensity = Math.max(0, 1 - obj.distance / 80);
            
            asciiCtx.fillStyle = obj.color;
            asciiCtx.globalAlpha = intensity;
            
            if (obj.lane === 'horizontal') {
                // Car shape
                const dir = obj.direction > 0 ? '→' : '←';
                asciiCtx.fillText('┌─┐', x - size, y);
                asciiCtx.fillText(`│${dir}│`, x - size, y + size);
                asciiCtx.fillText('└─┘', x - size, y + size * 2);
                
                // Lights
                if (obj.direction > 0) {
                    asciiCtx.fillStyle = '#ff0';
                    asciiCtx.fillText('●', x + size * 2, y + size);
                } else {
                    asciiCtx.fillStyle = '#f00';
                    asciiCtx.fillText('●', x - size * 3, y + size);
                }
            } else {
                const dir = obj.direction > 0 ? '↓' : '↑';
                asciiCtx.fillText(`┌${dir}┐`, x - size, y);
                asciiCtx.fillText('│ │', x - size, y + size);
                asciiCtx.fillText('└─┘', x - size, y + size * 2);
            }
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderPedestrianASCII(x, y, obj, size) {
            const intensity = Math.max(0, 1 - obj.distance / 40);
            
            asciiCtx.fillStyle = obj.color;
            asciiCtx.globalAlpha = intensity;
            
            // Human figure
            asciiCtx.fillText(' ○ ', x - size, y);
            asciiCtx.fillText('/|\\', x - size, y + size);
            asciiCtx.fillText('/ \\', x - size, y + size * 2);
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderSignASCII(x, y, obj, size) {
            const intensity = Math.max(0, 1 - obj.distance / 60);
            
            asciiCtx.fillStyle = obj.color;
            asciiCtx.globalAlpha = intensity;
            
            // Sign border
            const text = obj.text || 'SIGN';
            const len = Math.min(text.length, 10);
            const border = '─'.repeat(len + 2);
            
            asciiCtx.fillText('┌' + border + '┐', x - size * (len + 2) / 2, y);
            asciiCtx.fillText('│' + text.substring(0, len) + '│', x - size * len / 2, y + size);
            asciiCtx.fillText('└' + border + '┘', x - size * (len + 2) / 2, y + size * 2);
            
            // Glow effect
            asciiCtx.shadowColor = obj.color;
            asciiCtx.shadowBlur = 10;
            asciiCtx.fillText('♦', x, y - size);
            asciiCtx.shadowBlur = 0;
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderRainASCII(x, y, obj, size) {
            const intensity = Math.max(0, 1 - obj.distance / 60) * 0.5;
            
            asciiCtx.fillStyle = '#88aaff';
            asciiCtx.globalAlpha = intensity;
            
            // Rain streak
            asciiCtx.fillText('│', x, y);
            asciiCtx.fillText('│', x, y + size);
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderLightASCII(x, y, obj, size, time) {
            const intensity = Math.max(0, 1 - obj.distance / 80);
            const flicker = 0.7 + Math.sin(time * 10 + x) * 0.3;
            
            asciiCtx.fillStyle = obj.color;
            asciiCtx.globalAlpha = intensity * flicker;
            
            // Light glow
            asciiCtx.shadowColor = obj.color;
            asciiCtx.shadowBlur = 15;
            asciiCtx.fillText('●', x, y);
            asciiCtx.fillText('○', x - size, y);
            asciiCtx.fillText('○', x + size, y);
            asciiCtx.shadowBlur = 0;
            
            asciiCtx.globalAlpha = 1;
        }
        
        function renderAtmosphere(time) {
            // Fog effect at edges
            const fogGradient = asciiCtx.createRadialGradient(
                asciiWidth / 2, asciiHeight / 2, asciiHeight * 0.3,
                asciiWidth / 2, asciiHeight / 2, asciiHeight
            );
            fogGradient.addColorStop(0, 'transparent');
            fogGradient.addColorStop(1, 'rgba(0, 10, 20, 0.5)');
            asciiCtx.fillStyle = fogGradient;
            asciiCtx.fillRect(0, 0, asciiWidth, asciiHeight);
            
            // Scanlines
            asciiCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            for (let y = 0; y < asciiHeight; y += 2) {
                asciiCtx.fillRect(0, y, asciiWidth, 1);
            }
            
            // Vignette
            const vignetteGradient = asciiCtx.createRadialGradient(
                asciiWidth / 2, asciiHeight / 2, asciiHeight * 0.2,
                asciiWidth / 2, asciiHeight / 2, asciiHeight * 0.8
            );
            vignetteGradient.addColorStop(0, 'transparent');
            vignetteGradient.addColorStop(1, 'rgba(0, 0, 0, 0.6)');
            asciiCtx.fillStyle = vignetteGradient;
            asciiCtx.fillRect(0, 0, asciiWidth, asciiHeight);
            
            // Random atmospheric particles
            if (Math.random() > 0.95) {
                asciiCtx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.3})`;
                const px = Math.random() * asciiWidth;
                const py = Math.random() * asciiHeight;
                asciiCtx.fillText('.', px, py);
            }
        }
        
        // ═══════════════════════════════════════════════════════════════
        // UI UPDATES
        // ═══════════════════════════════════════════════════════════════
        
        function updateUI() {
            // Location
            const sectorX = Math.floor(player.position.x / 50);
            const sectorZ = Math.floor(player.position.z / 50);
            document.getElementById('location').textContent = 
                `SECTOR ${Math.abs(sectorX)}-${sectorX >= 0 ? 'E' : 'W'},${Math.abs(sectorZ)}-${sectorZ >= 0 ? 'N' : 'S'}`;
            
            // Compass
            let compassDir = 'N';
            const angle = ((player.rotation.y * 180 / Math.PI) % 360 + 360) % 360;
            if (angle >= 315 || angle < 45) compassDir = 'N';
            else if (angle >= 45 && angle < 135) compassDir = 'E';
            else if (angle >= 135 && angle < 225) compassDir = 'S';
            else compassDir = 'W';
            document.getElementById('compass').textContent = compassDir;
            
            // Time
            const totalSeconds = timeOfDay * 86400;
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);
            document.getElementById('time-display').textContent = 
                `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            // District indicator
            const districtEl = document.getElementById('district-name');
            if (currentDistrict) {
                districtEl.textContent = currentDistrict;
                districtEl.style.color = districts.find(d => d.name === currentDistrict)?.color || '#ff0';
                districtEl.style.opacity = '1';
            }
            
            // Debug info (optional)
            const debugEl = document.getElementById('debug-info');
            debugEl.textContent = `POS: ${player.position.x.toFixed(1)}, ${player.position.z.toFixed(1)}`;
        }
        
        // ═══════════════════════════════════════════════════════════════
        // MAIN LOOP
        // ═══════════════════════════════════════════════════════════════
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            update(delta);
            
            renderer.render(scene, camera);
        }
        
        // Start
        init();
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            asciiCanvas.style.width = window.innerWidth + 'px';
            asciiCanvas.style.height = window.innerHeight + 'px';
        });
    </script>
