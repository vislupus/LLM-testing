<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon-Hollow: Living ASCII City</title>
<style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #0f0; user-select: none; }
    #main { display: block; width: 100vw; height: 100vh; }
    #scanlines {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: 100% 4px, 3px 100%;
        pointer-events: none; z-index: 100;
    }
    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(0,255,255,0.5); font-size: 24px; font-weight: bold; }
    #lore { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); text-align: center; font-size: 18px; color: #0ff; text-shadow: 0 0 5px #0ff; opacity: 0; transition: opacity 0.3s; background: rgba(0,20,20,0.85); padding: 15px 30px; border: 1px solid #0ff; box-shadow: 0 0 10px #0ff; max-width: 80%; }
    #start { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; background: rgba(0,5,5,0.95); padding: 40px; border: 2px solid #0f0; box-shadow: 0 0 30px #0f0; pointer-events: auto; z-index: 20; }
    #start h1 { margin-top: 0; color: #0ff; text-shadow: 0 0 10px #0ff; letter-spacing: 5px; }
    #start p { font-size: 16px; line-height: 1.5; color: #aaa; }
    button { background: #000; color: #0f0; border: 1px solid #0f0; padding: 12px 24px; font-family: monospace; font-size: 18px; cursor: pointer; margin-top: 20px; text-transform: uppercase; transition: 0.2s; }
    button:hover { background: #0f0; color: #000; box-shadow: 0 0 15px #0f0; }
    #stats { position: absolute; top: 10px; left: 10px; font-size: 14px; color: #0f0; text-shadow: 0 0 3px #0f0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="main"></canvas>
<div id="scanlines"></div>
<div id="ui">
    <div id="stats">SYS.ON | SEC: <span id="sec">0</span> | DIST: <span id="dist">0</span>m</div>
    <div id="crosshair">+</div>
    <div id="lore">SYSTEM ONLINE</div>
</div>
<div id="start">
    <h1>NEON-HOLLOW</h1>
    <p>A Living ASCII Metropolis built on the back of a sleeping Leviathan.</p>
    <p><b>WASD:</b> Move | <b>MOUSE:</b> Look | <b>SHIFT:</b> Sprint</p>
    <p>Find the hidden terminals. Discover the truth of the city.</p>
    <button id="startBtn">ENTER CITY</button>
</div>

<script>
// --- CONFIG & STATE ---
const RES_X = 160, RES_Y = 90;
const chars = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$";
let locked = false, time = 0, lastTime = performance.now();
let pos = new THREE.Vector3(25, 5, 25); // Start on a street intersection
let yaw = 0, pitch = 0;
let keys = { w:false, a:false, s:false, d:false, shift:false };

// --- THREE.JS SETUP ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);
scene.fog = new THREE.FogExp2(0x050510, 0.012);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);

const offCanvas = document.createElement('canvas');
offCanvas.width = RES_X; offCanvas.height = RES_Y;
const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
const renderer = new THREE.WebGLRenderer({ canvas: offCanvas, antialias: false });
renderer.setSize(RES_X, RES_Y, false);
renderer.setClearColor(0x050510);

const ambient = new THREE.AmbientLight(0x111122, 0.4);
scene.add(ambient);
const moonLight = new THREE.DirectionalLight(0x445588, 0.6);
moonLight.position.set(100, 200, -100);
scene.add(moonLight);

// --- WORLD GENERATION ---
const buildingGroup = new THREE.Group();
scene.add(buildingGroup);

function createBuildingTexture() {
    const cvs = document.createElement('canvas');
    cvs.width = 128; cvs.height = 256;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#020205'; ctx.fillRect(0,0,128,256);
    for(let y=10; y<256; y+=12) {
        for(let x=10; x<128; x+=12) {
            if(Math.random() > 0.4) {
                let colors = ['#00ffff', '#ff00ff', '#ffffaa', '#00ffaa', '#222255'];
                ctx.fillStyle = colors[Math.floor(Math.random()*colors.length)];
                ctx.fillRect(x, y, 6, 8);
            }
        }
    }
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}
const bTex = createBuildingTexture();
const bMat = new THREE.MeshLambertMaterial({ color: 0x111122, emissive: 0xffffff, emissiveMap: bTex, emissiveIntensity: 1.0 });

// Ground
const groundCvs = document.createElement('canvas');
groundCvs.width = 512; groundCvs.height = 512;
const gCtx = groundCvs.getContext('2d');
gCtx.fillStyle = '#020205'; gCtx.fillRect(0,0,512,512);
gCtx.strokeStyle = '#0a0a1a'; gCtx.lineWidth = 4;
for(let i=0; i<=512; i+=64) {
    gCtx.beginPath(); gCtx.moveTo(i,0); gCtx.lineTo(i,512); gCtx.stroke();
    gCtx.beginPath(); gCtx.moveTo(0,i); gCtx.lineTo(512,i); gCtx.stroke();
}
const groundTex = new THREE.CanvasTexture(groundCvs);
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
groundTex.repeat.set(40, 40);
const groundMat = new THREE.MeshLambertMaterial({ map: groundTex, color: 0x222233, transparent: true, opacity: 0.85 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), groundMat);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Buildings
for(let x = -12; x <= 12; x++) {
    for(let z = -12; z <= 12; z++) {
        if(Math.random() < 0.15) continue; // empty lots/alleys
        let w = 20 + Math.random()*15;
        let d = 20 + Math.random()*15;
        let h = 20 + Math.random() * 120;
        if(x===0 && z===0) { w=40; d=40; h=250; } // Central tower
        let b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat);
        b.position.set(x * 50 + (Math.random()-0.5)*10, h/2, z * 50 + (Math.random()-0.5)*10);
        buildingGroup.add(b);
        
        // Neon Signs
        if(Math.random() < 0.3) {
            let sign = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), new THREE.MeshBasicMaterial({color: Math.random()>0.5?0xff00ff:0x00ffff, side: THREE.DoubleSide, transparent: true}));
            sign.position.set(x*50 + (Math.random()>0.5?w/2+0.1:-w/2-0.1), h/2 + (Math.random()-0.5)*h/2, z*50);
            sign.rotation.y = Math.random()>0.5 ? Math.PI/2 : 0;
            sign.isSign = true;
            buildingGroup.add(sign);
        }
    }
}

// Reflections (clone buildings upside down)
const reflection = buildingGroup.clone();
reflection.scale.y = -1;
reflection.position.y = -0.2;
scene.add(reflection);

// Moving Entities
const cars = [], peds = [], drones = [], terminals = [];
for(let i=0; i<60; i++) {
    let isHoriz = Math.random() > 0.5;
    let lane = (Math.floor(Math.random()*24) * 50) + 25 + (Math.random()>0.5?4:-4);
    let mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 8), new THREE.MeshBasicMaterial({color: Math.random()>0.5?0xff0000:0xffffff}));
    if(isHoriz) { mesh.rotation.y = Math.PI/2; mesh.position.set(Math.random()*1200-600, 1, lane); }
    else { mesh.position.set(lane, 1, Math.random()*1200-600); }
    scene.add(mesh);
    cars.push({mesh, horiz: isHoriz, speed: 20 + Math.random()*30, dir: Math.random()>0.5?1:-1});
}
for(let i=0; i<120; i++) {
    let isHoriz = Math.random() > 0.5;
    let lane = (Math.floor(Math.random()*24) * 50) + 25 + (Math.random()>0.5?10:-10);
    let mesh = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 4), new THREE.MeshBasicMaterial({color: Math.random()>0.5?0x00ff00:0x0000ff}));
    mesh.position.set(isHoriz?Math.random()*1200-600:lane, 2, isHoriz?lane:Math.random()*1200-600);
    scene.add(mesh);
    peds.push({mesh, horiz: isHoriz, speed: 2 + Math.random()*4, dir: Math.random()>0.5?1:-1});
}
for(let i=0; i<25; i++) {
    let d = new THREE.Mesh(new THREE.SphereGeometry(1.5), new THREE.MeshBasicMaterial({color: 0xff3333}));
    d.position.set((Math.random()-0.5)*1000, 40 + Math.random()*60, (Math.random()-0.5)*1000);
    scene.add(d);
    drones.push({mesh: d, vx: (Math.random()-0.5)*30, vz: (Math.random()-0.5)*30});
}

// Train
const train = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 200), new THREE.MeshBasicMaterial({color: 0xffaa00}));
train.position.set(25, 4, 0);
scene.add(train);

// Hidden Terminals
const loreTexts = [
    "> ACCESSING ARCHIVE... LEVIATHAN DREAMS OF ELECTRIC SHEEP.",
    "> WARNING: CORPORATE NEURAL OVERRIDE IMMINENT IN SECTOR 4.",
    "> THE SKY IS FAKE. THE STARS ARE DEAD PIXELS.",
    "> QUARANTINE BREACH. THE HOLLOW GROWS.",
    "> YOU ARE A GLITCH IN THE SIMULATION. RUN.",
    "> DREAM-HARVEST DOWN 14%. CITIZENS ASLEEP."
];
for(let i=0; i<12; i++) {
    let term = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshBasicMaterial({color: 0x00ffaa}));
    let tx = Math.round((Math.random()-0.5)*20) * 50 + 25;
    let tz = Math.round((Math.random()-0.5)*20) * 50 + 25;
    term.position.set(tx, 2, tz);
    scene.add(term);
    terminals.push({mesh: term, text: loreTexts[i % loreTexts.length]});
}

// Atmosphere (Rain & Dust)
const rainGeo = new THREE.BufferGeometry();
const rainCount = 2500;
const rainPos = new Float32Array(rainCount * 3);
for(let i=0; i<rainCount; i++) {
    rainPos[i*3] = (Math.random()-0.5)*800;
    rainPos[i*3+1] = Math.random()*200;
    rainPos[i*3+2] = (Math.random()-0.5)*800;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rainMat = new THREE.PointsMaterial({color: 0x88ccff, size: 0.8, transparent: true, opacity: 0.6});
const rain = new THREE.Points(rainGeo, rainMat);
scene.add(rain);

const dustGeo = new THREE.BufferGeometry();
const dustCount = 800;
const dustPos = new Float32Array(dustCount * 3);
for(let i=0; i<dustCount; i++) {
    dustPos[i*3] = (Math.random()-0.5)*600;
    dustPos[i*3+1] = Math.random()*100;
    dustPos[i*3+2] = (Math.random()-0.5)*600;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({color: 0x00ffff, size: 0.5, transparent: true, opacity: 0.4});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// Sky Elements
const moon = new THREE.Mesh(new THREE.SphereGeometry(30), new THREE.MeshBasicMaterial({color: 0xaaaaaa}));
moon.position.set(300, 400, -600);
scene.add(moon);

const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(600 * 3);
for(let i=0; i<600; i++) {
    starPos[i*3] = (Math.random()-0.5)*1500;
    starPos[i*3+1] = Math.random()*500 + 100;
    starPos[i*3+2] = (Math.random()-0.5)*1500;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xffffff, size: 1.5}));
scene.add(stars);

let flashLight = new THREE.PointLight(0xff0000, 0, 300);
scene.add(flashLight);

// --- INPUT & UI ---
document.getElementById('startBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    document.body.requestPointerLock();
});
document.getElementById('start').addEventListener('click', () => document.body.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === document.body;
    if(locked) document.getElementById('start').style.display = 'none';
});
document.addEventListener('mousemove', (e) => {
    if(locked) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
    }
});
document.addEventListener('keydown', e => {
    if(e.key.toLowerCase()==='w') keys.w = true;
    if(e.key.toLowerCase()==='a') keys.a = true;
    if(e.key.toLowerCase()==='s') keys.s = true;
    if(e.key.toLowerCase()==='d') keys.d = true;
    if(e.key==='Shift') keys.shift = true;
});
document.addEventListener('keyup', e => {
    if(e.key.toLowerCase()==='w') keys.w = false;
    if(e.key.toLowerCase()==='a') keys.a = false;
    if(e.key.toLowerCase()==='s') keys.s = false;
    if(e.key.toLowerCase()==='d') keys.d = false;
    if(e.key==='Shift') keys.shift = false;
});

const mainCanvas = document.getElementById('main');
const ctx = mainCanvas.getContext('2d');
let cw, ch, offsetX, offsetY;
function resize() {
    mainCanvas.width = window.innerWidth;
    mainCanvas.height = window.innerHeight;
    ch = mainCanvas.height / RES_Y;
    cw = ch * 0.6; // monospace aspect ratio
    offsetX = (mainCanvas.width - (cw * RES_X)) / 2;
    offsetY = (mainCanvas.height - (ch * RES_Y)) / 2;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

const raycaster = new THREE.Raycaster();
const loreDiv = document.getElementById('lore');
const crosshair = document.getElementById('crosshair');
let sirenTimer = 10;

// --- MAIN LOOP ---
function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;
    time += dt;

    // Player Movement
    let dir = new THREE.Vector3();
    if(keys.w) dir.z -= 1;
    if(keys.s) dir.z += 1;
    if(keys.a) dir.x -= 1;
    if(keys.d) dir.x += 1;
    if(dir.lengthSq() > 0) dir.normalize();
    dir.applyEuler(new THREE.Euler(0, yaw, 0));
    let speed = keys.shift ? 45 : 15;
    pos.addScaledVector(dir, speed * dt);

    // Collision with buildings (grid based)
    let cx = Math.round(pos.x / 50) * 50;
    let cz = Math.round(pos.z / 50) * 50;
    let dx = pos.x - cx, dz = pos.z - cz;
    if(Math.abs(dx) < 18 && Math.abs(dz) < 18) {
        if(Math.abs(dx) > Math.abs(dz)) pos.x = cx + Math.sign(dx) * 18;
        else pos.z = cz + Math.sign(dz) * 18;
    }
    camera.position.copy(pos);
    camera.rotation.set(pitch, yaw, 0, 'YXZ');

    // Environment Dynamics
    let distFromCenter = Math.hypot(pos.x, pos.z);
    document.getElementById('dist').innerText = Math.floor(distFromCenter);
    document.getElementById('sec').innerText = Math.floor(time);
    
    let targetFog = distFromCenter < 200 ? new THREE.Color(0x050510) : new THREE.Color(0x021015);
    scene.fog.color.lerp(targetFog, 0.02);
    scene.background.lerp(targetFog, 0.02);
    
    let rainIntensity = 0.4 + Math.sin(time * 0.2) * 0.4;
    rainMat.opacity = rainIntensity;
    ambient.intensity = 0.3 + rainIntensity * 0.2;

    bTex.offset.y -= dt * 0.05;
    bTex.offset.x += dt * 0.02;

    sirenTimer -= dt;
    if(sirenTimer <= 0) {
        sirenTimer = 15 + Math.random()*20;
        flashLight.position.set((Math.random()-0.5)*400, 50, (Math.random()-0.5)*400);
        flashLight.intensity = 15;
    }
    if(flashLight.intensity > 0) flashLight.intensity -= dt * 8;

    // Update Entities
    cars.forEach(c => {
        c.mesh.position[c.horiz?'x':'z'] += c.speed * c.dir * dt;
        if(c.mesh.position.x > 600) c.mesh.position.x = -600;
        if(c.mesh.position.x < -600) c.mesh.position.x = 600;
        if(c.mesh.position.z > 600) c.mesh.position.z = -600;
        if(c.mesh.position.z < -600) c.mesh.position.z = 600;
    });
    peds.forEach(p => {
        p.mesh.position[p.horiz?'x':'z'] += p.speed * p.dir * dt;
        if(p.mesh.position.x > 600) p.mesh.position.x = -600;
        if(p.mesh.position.x < -600) p.mesh.position.x = 600;
        if(p.mesh.position.z > 600) p.mesh.position.z = -600;
        if(p.mesh.position.z < -600) p.mesh.position.z = 600;
    });
    drones.forEach(d => {
        d.mesh.position.x += d.vx * dt; d.mesh.position.z += d.vz * dt;
        if(Math.abs(d.mesh.position.x)>500) d.vx*=-1;
        if(Math.abs(d.mesh.position.z)>500) d.vz*=-1;
    });
    train.position.z += 180 * dt;
    if(train.position.z > 1000) train.position.z = -1000;

    const rPos = rainGeo.attributes.position;
    for(let i=0; i<rainCount; i++) {
        let y = rPos.getY(i) - 80 * dt;
        if(y < 0) y = 200;
        rPos.setY(i, y);
    }
    rPos.needsUpdate = true;

    const dPos = dustGeo.attributes.position;
    for(let i=0; i<dustCount; i++) {
        dPos.setX(i, dPos.getX(i) + Math.sin(time + i)*0.2);
        dPos.setY(i, dPos.getY(i) + Math.cos(time + i)*0.2);
    }
    dPos.needsUpdate = true;

    scene.children.forEach(c => {
        if(c.isSign) c.material.opacity = 0.4 + Math.sin(time * 4 + c.position.x) * 0.6;
    });

    // Interaction Raycast
    raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
    const intersects = raycaster.intersectObjects(terminals.map(t=>t.mesh));
    if(intersects.length > 0 && intersects[0].distance < 40) {
        let term = terminals.find(t => t.mesh === intersects[0].object);
        loreDiv.innerText = term.text;
        loreDiv.style.opacity = 1;
        crosshair.innerText = '█'; crosshair.style.color = '#00ffaa';
    } else {
        loreDiv.style.opacity = 0;
        crosshair.innerText = '+'; crosshair.style.color = 'rgba(0,255,255,0.5)';
    }

    // Render 3D to Offscreen
    renderer.render(scene, camera);
    const imgData = offCtx.getImageData(0, 0, RES_X, RES_Y).data;

    // Draw ASCII
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
    ctx.textBaseline = 'top';
    ctx.font = `${Math.floor(ch)}px monospace`;
    
    for(let y=0; y<RES_Y; y++) {
        for(let x=0; x<RES_X; x++) {
            let idx = (y*RES_X + x)*4;
            let r = imgData[idx], g = imgData[idx+1], b = imgData[idx+2];
            let lum = (0.299*r + 0.587*g + 0.114*b) / 255;
            if(lum < 0.04) continue; // Skip very dark pixels
            let c = chars[Math.floor(lum * (chars.length - 1))];
            if(c === ' ') continue;
            ctx.fillStyle = `rgb(${r},${g},${b})`;
            ctx.fillText(c, offsetX + x * cw, offsetY + y * ch);
        }
    }
}
animate();
</script>
</body>
</html>
