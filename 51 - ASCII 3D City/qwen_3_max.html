<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living ASCII 3D City</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        #canvasContainer {
            flex: 1;
            position: relative;
        }
        
        #asciiCanvas {
            width: 100%;
            height: 100%;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud-element {
            position: absolute;
            color: #0ff;
            font-size: 14px;
            text-shadow: 0 0 5px #0ff;
            font-weight: bold;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #0f0;
            font-size: 24px;
            pointer-events: none;
            text-shadow: 0 0 10px #0f0;
        }
        
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1s ease-out;
        }
        
        #loadingText {
            color: #0ff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        #loadingBar {
            width: 300px;
            height: 20px;
            border: 2px solid #0ff;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        
        #loadingProgress {
            height: 100%;
            background: #0ff;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        #controlsInfo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #0a0;
            font-size: 12px;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #0a0;
        }
        
        #districtInfo {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f0f;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #f0f;
        }
        
        #timeWeather {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ff0;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 1px solid #ff0;
        }
        
        #notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #ff0;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            border: 2px solid #0ff;
            background: rgba(0, 0, 0, 0.7);
        }
        
        #minimapCanvas {
            width: 100%;
            height: 100%;
        }
        
        /* Hide cursor when locked */
        body.pointer-locked {
            cursor: none;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="canvasContainer">
            <canvas id="asciiCanvas"></canvas>
            <div id="uiOverlay">
                <div id="crosshair">+</div>
                <div id="districtInfo">NEON DISTRICT</div>
                <div id="timeWeather">23:47 • RAINING</div>
                <div id="controlsInfo">
                    WASD: Move | Mouse: Look | SHIFT: Sprint | SPACE: Jump<br>
                    E: Interact | TAB: Toggle HUD | ESC: Pause
                </div>
                <div id="minimap">
                    <canvas id="minimapCanvas"></canvas>
                </div>
                <div id="notification"></div>
            </div>
            <div id="loadingScreen">
                <div id="loadingText">INITIALIZING NEURAL NETWORKS...</div>
                <div id="loadingBar">
                    <div id="loadingProgress"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Main game constants and configuration
        const CONFIG = {
            // Rendering
            CHAR_WIDTH: 8,
            CHAR_HEIGHT: 16,
            FOV: Math.PI / 3,
            MAX_RENDER_DISTANCE: 100,
            FOG_DENSITY: 0.02,
            
            // Movement
            MOVE_SPEED: 0.05,
            SPRINT_MULTIPLIER: 2.5,
            JUMP_FORCE: 0.1,
            GRAVITY: 0.02,
            
            // World
            WORLD_SIZE: 128,
            BUILDING_MIN_HEIGHT: 3,
            BUILDING_MAX_HEIGHT: 25,
            STREET_WIDTH: 4,
            
            // Time and weather
            DAY_LENGTH: 120000, // 2 minutes for full day/night cycle
            WEATHER_TYPES: ['CLEAR', 'RAIN', 'FOG', 'STORM'],
            WEATHER_DURATION: 30000, // 30 seconds per weather
            
            // ASCII character sets for different purposes
            SHADE_CHARS: ' ░▒▓█',
            BUILDING_CHARS: '█▓▒░',
            WINDOW_CHARS: '□■▪▫',
            TRAFFIC_CHARS: '●○◆◇',
            PEDESTRIAN_CHARS: '☻☺♀♂',
            SIGN_CHARS: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()',
            RAIN_CHARS: '│║┊┋'
        };

        // Game state
        const gameState = {
            player: {
                x: 64,
                y: 64,
                z: 1.8,
                dirX: 1,
                dirY: 0,
                planeX: 0,
                planeY: 0.66,
                health: 100,
                stamina: 100,
                isSprinting: false,
                isJumping: false,
                velocityY: 0
            },
            camera: {
                pitch: 0,
                yaw: 0
            },
            world: {
                buildings: [],
                streets: [],
                vehicles: [],
                pedestrians: [],
                signs: [],
                raindrops: []
            },
            time: {
                currentTime: 0,
                currentHour: 23,
                currentMinute: 47,
                isDay: false
            },
            weather: {
                current: 'RAIN',
                intensity: 0.8,
                nextChange: 0
            },
            districts: [
                { name: 'NEON DISTRICT', x: 0, y: 0, size: 64, color: '#0ff' },
                { name: 'CORPORATE ZONE', x: 64, y: 0, size: 64, color: '#f0f' },
                { name: 'INDUSTRIAL SECTOR', x: 0, y: 64, size: 64, color: '#ff0' },
                { name: 'RESIDENTIAL BLOCKS', x: 64, y: 64, size: 64, color: '#0f0' }
            ],
            currentDistrict: 'NEON DISTRICT',
            notifications: [],
            hudVisible: true,
            paused: false,
            loadingProgress: 0
        };

        // DOM elements
        let canvas, ctx, minimapCanvas, minimapCtx, loadingScreen, loadingProgress, notificationEl;
        let keys = {};
        let mouseLocked = false;

        // Initialize the game
        function init() {
            // Get DOM elements
            canvas = document.getElementById('asciiCanvas');
            ctx = canvas.getContext('2d');
            minimapCanvas = document.getElementById('minimapCanvas');
            minimapCtx = minimapCanvas.getContext('2d');
            loadingScreen = document.getElementById('loadingScreen');
            loadingProgress = document.getElementById('loadingProgress');
            notificationEl = document.getElementById('notification');
            
            // Set canvas size
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // Set up event listeners
            setupEventListeners();
            
            // Start loading process
            startLoading();
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            minimapCanvas.width = 150;
            minimapCanvas.height = 150;
            
            // Recalculate raycasting parameters
            gameState.rayCount = Math.floor(canvas.width / CONFIG.CHAR_WIDTH);
            gameState.screenHeight = Math.floor(canvas.height / CONFIG.CHAR_HEIGHT);
        }

        function setupEventListeners() {
            // Keyboard events
            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                
                if (e.code === 'KeyE') {
                    handleInteraction();
                }
                if (e.code === 'Tab') {
                    toggleHUD();
                }
                if (e.code === 'Escape') {
                    togglePause();
                }
            });
            
            document.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });
            
            // Mouse events for pointer lock
            canvas.addEventListener('click', () => {
                if (!mouseLocked) {
                    canvas.requestPointerLock();
                }
            });
            
            document.addEventListener('pointerlockchange', () => {
                mouseLocked = document.pointerLockElement === canvas;
                document.body.classList.toggle('pointer-locked', mouseLocked);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (mouseLocked) {
                    const sensitivity = 0.002;
                    gameState.camera.yaw -= e.movementX * sensitivity;
                    gameState.camera.pitch -= e.movementY * sensitivity;
                    
                    // Clamp pitch to avoid flipping
                    gameState.camera.pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, gameState.camera.pitch));
                    
                    // Update direction vectors
                    updateCameraDirection();
                }
            });
        }

        function updateCameraDirection() {
            const cosYaw = Math.cos(gameState.camera.yaw);
            const sinYaw = Math.sin(gameState.camera.yaw);
            const cosPitch = Math.cos(gameState.camera.pitch);
            const sinPitch = Math.sin(gameState.camera.pitch);
            
            gameState.player.dirX = cosYaw * cosPitch;
            gameState.player.dirY = sinYaw * cosPitch;
            gameState.player.dirZ = sinPitch;
            
            // Calculate plane vectors for raycasting
            gameState.player.planeX = -sinYaw * cosPitch * Math.tan(CONFIG.FOV / 2);
            gameState.player.planeY = cosYaw * cosPitch * Math.tan(CONFIG.FOV / 2);
        }

        function startLoading() {
            // Simulate loading phases
            const phases = [
                { name: 'INITIALIZING NEURAL NETWORKS...', duration: 1000 },
                { name: 'GENERATING CITY GEOMETRY...', duration: 1500 },
                { name: 'SPAWNING CITIZENS...', duration: 1000 },
                { name: 'CALIBRATING ATMOSPHERIC SYSTEMS...', duration: 1200 },
                { name: 'ESTABLISHING QUANTUM LINKS...', duration: 800 }
            ];
            
            let currentPhase = 0;
            const totalDuration = phases.reduce((sum, phase) => sum + phase.duration, 0);
            
            function loadPhase() {
                if (currentPhase >= phases.length) {
                    finishLoading();
                    return;
                }
                
                const phase = phases[currentPhase];
                document.getElementById('loadingText').textContent = phase.name;
                
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 2;
                    gameState.loadingProgress = (currentPhase * 100 / phases.length) + (progress / phases.length);
                    loadingProgress.style.width = `${gameState.loadingProgress}%`;
                    
                    if (progress >= 100) {
                        clearInterval(interval);
                        currentPhase++;
                        setTimeout(loadPhase, 100);
                    }
                }, phase.duration / 50);
            }
            
            loadPhase();
        }

        function finishLoading() {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                generateWorld();
                gameLoop();
            }, 1000);
        }

        function generateWorld() {
            // Generate procedural city layout
            const gridSize = CONFIG.WORLD_SIZE / CONFIG.STREET_WIDTH;
            
            // Create street grid
            for (let x = 0; x <= CONFIG.WORLD_SIZE; x += CONFIG.STREET_WIDTH) {
                gameState.world.streets.push({ x1: x, y1: 0, x2: x, y2: CONFIG.WORLD_SIZE, type: 'vertical' });
            }
            for (let y = 0; y <= CONFIG.WORLD_SIZE; y += CONFIG.STREET_WIDTH) {
                gameState.world.streets.push({ x1: 0, y1: y, x2: CONFIG.WORLD_SIZE, y2: y, type: 'horizontal' });
            }
            
            // Generate buildings in blocks between streets
            for (let blockX = 0; blockX < gridSize - 1; blockX++) {
                for (let blockY = 0; blockY < gridSize - 1; blockY++) {
                    const startX = blockX * CONFIG.STREET_WIDTH + 1;
                    const startY = blockY * CONFIG.STREET_WIDTH + 1;
                    const endX = (blockX + 1) * CONFIG.STREET_WIDTH - 1;
                    const endY = (blockY + 1) * CONFIG.STREET_WIDTH - 1;
                    
                    // Skip some blocks for variety (parks, plazas, etc.)
                    if (Math.random() > 0.8) continue;
                    
                    const buildingWidth = endX - startX;
                    const buildingDepth = endY - startY;
                    
                    if (buildingWidth > 0 && buildingDepth > 0) {
                        const height = Math.floor(CONFIG.BUILDING_MIN_HEIGHT + 
                            Math.random() * (CONFIG.BUILDING_MAX_HEIGHT - CONFIG.BUILDING_MIN_HEIGHT));
                        
                        // Determine district based on position
                        const district = getDistrictAt(startX + buildingWidth/2, startY + buildingDepth/2);
                        
                        gameState.world.buildings.push({
                            x: startX,
                            y: startY,
                            width: buildingWidth,
                            depth: buildingDepth,
                            height: height,
                            district: district,
                            windows: generateWindows(buildingWidth, buildingDepth, height),
                            signs: generateSigns(startX, startY, buildingWidth, buildingDepth, height, district)
                        });
                    }
                }
            }
            
            // Generate vehicles on streets
            for (let i = 0; i < 50; i++) {
                const street = gameState.world.streets[Math.floor(Math.random() * gameState.world.streets.length)];
                if (street.type === 'vertical') {
                    gameState.world.vehicles.push({
                        x: street.x1 + Math.random() * 2 - 1,
                        y: Math.random() * CONFIG.WORLD_SIZE,
                        z: 0.5,
                        direction: Math.random() > 0.5 ? 1 : -1,
                        speed: 0.02 + Math.random() * 0.03,
                        type: Math.random() > 0.7 ? 'truck' : 'car'
                    });
                } else {
                    gameState.world.vehicles.push({
                        x: Math.random() * CONFIG.WORLD_SIZE,
                        y: street.y1 + Math.random() * 2 - 1,
                        z: 0.5,
                        direction: Math.random() > 0.5 ? 1 : -1,
                        speed: 0.02 + Math.random() * 0.03,
                        type: Math.random() > 0.7 ? 'truck' : 'car'
                    });
                }
            }
            
            // Generate pedestrians on sidewalks
            for (let i = 0; i < 100; i++) {
                const building = gameState.world.buildings[Math.floor(Math.random() * gameState.world.buildings.length)];
                if (!building) continue;
                
                const sidewalkOffset = 0.5;
                const side = Math.floor(Math.random() * 4);
                let x, y;
                
                switch (side) {
                    case 0: // North
                        x = building.x + Math.random() * building.width;
                        y = building.y - sidewalkOffset;
                        break;
                    case 1: // East
                        x = building.x + building.width + sidewalkOffset;
                        y = building.y + Math.random() * building.depth;
                        break;
                    case 2: // South
                        x = building.x + Math.random() * building.width;
                        y = building.y + building.depth + sidewalkOffset;
                        break;
                    case 3: // West
                        x = building.x - sidewalkOffset;
                        y = building.y + Math.random() * building.depth;
                        break;
                }
                
                gameState.world.pedestrians.push({
                    x: x,
                    y: y,
                    z: 1.7,
                    direction: Math.random() * Math.PI * 2,
                    speed: 0.01 + Math.random() * 0.02,
                    targetX: x + (Math.random() - 0.5) * 20,
                    targetY: y + (Math.random() - 0.5) * 20
                });
            }
        }

        function getDistrictAt(x, y) {
            for (const district of gameState.districts) {
                if (x >= district.x && x < district.x + district.size &&
                    y >= district.y && y < district.y + district.size) {
                    return district.name;
                }
            }
            return 'UNKNOWN';
        }

        function generateWindows(width, depth, height) {
            const windows = [];
            const windowSpacing = 2;
            
            for (let floor = 1; floor <= height; floor++) {
                for (let wx = 1; wx < width - 1; wx += windowSpacing) {
                    for (let wy = 1; wy < depth - 1; wy += windowSpacing) {
                        // Only create windows on building faces that are visible from streets
                        if (wx === 1 || wx === width - 2 || wy === 1 || wy === depth - 2) {
                            windows.push({
                                x: wx,
                                y: wy,
                                floor: floor,
                                lit: Math.random() > 0.3, // 70% chance window is lit
                                blinkTimer: Math.random() * 1000
                            });
                        }
                    }
                }
            }
            
            return windows;
        }

        function generateSigns(buildingX, buildingY, width, depth, height, district) {
            const signs = [];
            
            // Add signs to taller buildings
            if (height > 8) {
                const signCount = Math.floor(Math.random() * 3) + 1;
                for (let i = 0; i < signCount; i++) {
                    const face = Math.floor(Math.random() * 4);
                    let x, y, text;
                    
                    switch (face) {
                        case 0: // North face
                            x = buildingX + width/2;
                            y = buildingY;
                            break;
                        case 1: // East face
                            x = buildingX + width;
                            y = buildingY + depth/2;
                            break;
                        case 2: // South face
                            x = buildingX + width/2;
                            y = buildingY + depth;
                            break;
                        case 3: // West face
                            x = buildingX;
                            y = buildingY + depth/2;
                            break;
                    }
                    
                    // Generate random sign text based on district
                    text = generateSignText(district);
                    
                    signs.push({
                        x: x,
                        y: y,
                        z: height - 2 + Math.random() * 2,
                        text: text,
                        face: face,
                        color: getDistrictColor(district),
                        blink: Math.random() > 0.5
                    });
                }
            }
            
            return signs;
        }

        function generateSignText(district) {
            const prefixes = {
                'NEON DISTRICT': ['NEON', 'CYBER', 'DIGITAL', 'MATRIX', 'VIRTUAL'],
                'CORPORATE ZONE': ['CORP', 'TECH', 'GLOBAL', 'UNI', 'MEGA'],
                'INDUSTRIAL SECTOR': ['FACTORY', 'WORKS', 'INDUSTRIES', 'MACHINES', 'STEEL'],
                'RESIDENTIAL BLOCKS': ['HOME', 'LIFE', 'FAMILY', 'COMFORT', 'PEACE']
            };
            
            const suffixes = ['SYSTEMS', 'CORP', 'INC', 'LTD', 'CO', 'TECH', 'NET'];
            const prefix = prefixes[district]?.[Math.floor(Math.random() * prefixes[district].length)] || 'GENERIC';
            const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
            
            return prefix + ' ' + suffix;
        }

        function getDistrictColor(district) {
            const colors = {
                'NEON DISTRICT': '#0ff',
                'CORPORATE ZONE': '#f0f',
                'INDUSTRIAL SECTOR': '#ff0',
                'RESIDENTIAL BLOCKS': '#0f0'
            };
            return colors[district] || '#fff';
        }

        function updateGame(deltaTime) {
            if (gameState.paused) return;
            
            // Update time
            gameState.time.currentTime += deltaTime;
            const dayProgress = (gameState.time.currentTime % CONFIG.DAY_LENGTH) / CONFIG.DAY_LENGTH;
            gameState.time.currentHour = Math.floor(dayProgress * 24);
            gameState.time.currentMinute = Math.floor((dayProgress * 24 - gameState.time.currentHour) * 60);
            gameState.time.isDay = dayProgress < 0.5;
            
            // Update weather
            if (gameState.time.currentTime > gameState.weather.nextChange) {
                const newWeather = CONFIG.WEATHER_TYPES[Math.floor(Math.random() * CONFIG.WEATHER_TYPES.length)];
                gameState.weather.current = newWeather;
                gameState.weather.intensity = 0.3 + Math.random() * 0.7;
                gameState.weather.nextChange = gameState.time.currentTime + CONFIG.WEATHER_DURATION;
                
                updateWeatherDisplay();
            }
            
            // Update player position
            updatePlayer(deltaTime);
            
            // Update vehicles
            updateVehicles(deltaTime);
            
            // Update pedestrians
            updatePedestrians(deltaTime);
            
            // Update rain
            updateRain(deltaTime);
            
            // Update current district
            updateCurrentDistrict();
            
            // Update notifications
            updateNotifications();
        }

        function updatePlayer(deltaTime) {
            const moveSpeed = CONFIG.MOVE_SPEED * (keys['ShiftLeft'] || keys['ShiftRight'] ? CONFIG.SPRINT_MULTIPLIER : 1);
            const forward = { x: gameState.player.dirX, y: gameState.player.dirY };
            const right = { x: -gameState.player.dirY, y: gameState.player.dirX };
            
            // Handle movement
            if (keys['KeyW']) {
                gameState.player.x += forward.x * moveSpeed;
                gameState.player.y += forward.y * moveSpeed;
            }
            if (keys['KeyS']) {
                gameState.player.x -= forward.x * moveSpeed;
                gameState.player.y -= forward.y * moveSpeed;
            }
            if (keys['KeyA']) {
                gameState.player.x -= right.x * moveSpeed;
                gameState.player.y -= right.y * moveSpeed;
            }
            if (keys['KeyD']) {
                gameState.player.x += right.x * moveSpeed;
                gameState.player.y += right.y * moveSpeed;
            }
            
            // Handle jumping
            if (keys['Space'] && !gameState.player.isJumping) {
                gameState.player.isJumping = true;
                gameState.player.velocityY = CONFIG.JUMP_FORCE;
            }
            
            // Apply gravity
            if (gameState.player.isJumping) {
                gameState.player.z += gameState.player.velocityY;
                gameState.player.velocityY -= CONFIG.GRAVITY;
                
                if (gameState.player.z <= 1.8) {
                    gameState.player.z = 1.8;
                    gameState.player.isJumping = false;
                    gameState.player.velocityY = 0;
                }
            }
            
            // Keep player within bounds
            gameState.player.x = Math.max(2, Math.min(CONFIG.WORLD_SIZE - 2, gameState.player.x));
            gameState.player.y = Math.max(2, Math.min(CONFIG.WORLD_SIZE - 2, gameState.player.y));
        }

        function updateVehicles(deltaTime) {
            for (const vehicle of gameState.world.vehicles) {
                if (vehicle.direction === 1) {
                    if (gameState.world.streets.find(s => s.x1 === Math.round(vehicle.x) && s.type === 'vertical')) {
                        vehicle.y += vehicle.speed;
                        if (vehicle.y > CONFIG.WORLD_SIZE) vehicle.y = 0;
                    } else {
                        vehicle.x += vehicle.speed;
                        if (vehicle.x > CONFIG.WORLD_SIZE) vehicle.x = 0;
                    }
                } else {
                    if (gameState.world.streets.find(s => s.x1 === Math.round(vehicle.x) && s.type === 'vertical')) {
                        vehicle.y -= vehicle.speed;
                        if (vehicle.y < 0) vehicle.y = CONFIG.WORLD_SIZE;
                    } else {
                        vehicle.x -= vehicle.speed;
                        if (vehicle.x < 0) vehicle.x = CONFIG.WORLD_SIZE;
                    }
                }
            }
        }

        function updatePedestrians(deltaTime) {
            for (const ped of gameState.world.pedestrians) {
                const dx = ped.targetX - ped.x;
                const dy = ped.targetY - ped.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 0.5) {
                    // Choose new target
                    ped.targetX = ped.x + (Math.random() - 0.5) * 20;
                    ped.targetY = ped.y + (Math.random() - 0.5) * 20;
                } else {
                    // Move towards target
                    ped.x += (dx / distance) * ped.speed;
                    ped.y += (dy / distance) * ped.speed;
                    ped.direction = Math.atan2(dy, dx);
                }
                
                // Keep within reasonable bounds
                ped.x = Math.max(1, Math.min(CONFIG.WORLD_SIZE - 1, ped.x));
                ped.y = Math.max(1, Math.min(CONFIG.WORLD_SIZE - 1, ped.y));
            }
        }

        function updateRain(deltaTime) {
            if (gameState.weather.current !== 'RAIN' && gameState.weather.current !== 'STORM') {
                gameState.world.raindrops = [];
                return;
            }
            
            // Add new raindrops
            const rainIntensity = gameState.weather.intensity * (gameState.weather.current === 'STORM' ? 2 : 1);
            const newDrops = Math.floor(rainIntensity * 10);
            
            for (let i = 0; i < newDrops; i++) {
                gameState.world.raindrops.push({
                    x: Math.random() * CONFIG.WORLD_SIZE,
                    y: Math.random() * CONFIG.WORLD_SIZE,
                    z: CONFIG.MAX_RENDER_DISTANCE,
                    speed: 0.2 + Math.random() * 0.3
                });
            }
            
            // Update existing raindrops
            for (let i = gameState.world.raindrops.length - 1; i >= 0; i--) {
                const drop = gameState.world.raindrops[i];
                drop.z -= drop.speed;
                
                if (drop.z < 0) {
                    gameState.world.raindrops.splice(i, 1);
                }
            }
        }

        function updateCurrentDistrict() {
            const district = getDistrictAt(gameState.player.x, gameState.player.y);
            if (district !== gameState.currentDistrict) {
                gameState.currentDistrict = district;
                showNotification(`ENTERED: ${district}`);
                updateDistrictDisplay();
            }
        }

        function updateNotifications() {
            for (let i = gameState.notifications.length - 1; i >= 0; i--) {
                const notif = gameState.notifications[i];
                notif.timeLeft -= 16; // Assuming 60fps
                
                if (notif.timeLeft <= 0) {
                    gameState.notifications.splice(i, 1);
                    updateNotificationDisplay();
                }
            }
        }

        function showNotification(text) {
            gameState.notifications.push({
                text: text,
                timeLeft: 3000 // 3 seconds
            });
            updateNotificationDisplay();
        }

        function updateNotificationDisplay() {
            if (gameState.notifications.length > 0) {
                notificationEl.textContent = gameState.notifications[gameState.notifications.length - 1].text;
                notificationEl.style.opacity = '1';
            } else {
                notificationEl.style.opacity = '0';
            }
        }

        function updateDistrictDisplay() {
            document.getElementById('districtInfo').textContent = gameState.currentDistrict;
            document.getElementById('districtInfo').style.color = getDistrictColor(gameState.currentDistrict);
        }

        function updateWeatherDisplay() {
            const weatherText = {
                'CLEAR': 'CLEAR',
                'RAIN': 'RAINING',
                'FOG': 'FOGGY',
                'STORM': 'STORMING'
            };
            
            const timeString = `${String(gameState.time.currentHour).padStart(2, '0')}:${String(gameState.time.currentMinute).padStart(2, '0')}`;
            document.getElementById('timeWeather').textContent = `${timeString} • ${weatherText[gameState.weather.current]}`;
        }

        function handleInteraction() {
            // Find nearest interactable object
            let nearestObject = null;
            let nearestDistance = 5; // Max interaction distance
            
            // Check buildings
            for (const building of gameState.world.buildings) {
                const dx = (building.x + building.width/2) - gameState.player.x;
                const dy = (building.y + building.depth/2) - gameState.player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < nearestDistance) {
                    nearestDistance = distance;
                    nearestObject = { type: 'building', data: building };
                }
            }
            
            if (nearestObject) {
                showNotification(`ACCESSING ${nearestObject.data.district} DATABASE...`);
            }
        }

        function toggleHUD() {
            gameState.hudVisible = !gameState.hudVisible;
            document.getElementById('uiOverlay').style.display = gameState.hudVisible ? 'block' : 'none';
        }

        function togglePause() {
            gameState.paused = !gameState.paused;
            if (gameState.paused) {
                showNotification('GAME PAUSED - PRESS ESC TO RESUME');
            } else {
                // Remove pause notification
                gameState.notifications = gameState.notifications.filter(n => !n.text.includes('GAME PAUSED'));
                updateNotificationDisplay();
            }
        }

        function render() {
            if (!ctx) return;
            
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Render sky
            renderSky();
            
            // Raycast and render scene
            raycastScene();
            
            // Render ground/floor
            renderGround();
            
            // Render UI overlay (already handled by CSS)
        }

        function renderSky() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height / 2);
            
            if (gameState.time.isDay) {
                gradient.addColorStop(0, '#1a1a40'); // Dark blue
                gradient.addColorStop(1, '#4a4a80'); // Lighter blue
            } else {
                gradient.addColorStop(0, '#000020'); // Very dark blue
                gradient.addColorStop(1, '#101030'); // Dark purple-blue
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            
            // Add stars at night
            if (!gameState.time.isDay) {
                ctx.fillStyle = '#fff';
                for (let i = 0; i < 100; i++) {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * (canvas.height / 2);
                    const brightness = Math.random() * 0.7 + 0.3;
                    ctx.globalAlpha = brightness;
                    ctx.fillRect(x, y, 1, 1);
                }
                ctx.globalAlpha = 1;
            }
        }

        function raycastScene() {
            const rayCount = gameState.rayCount || Math.floor(canvas.width / CONFIG.CHAR_WIDTH);
            const screenWidth = canvas.width;
            const screenHeight = canvas.height;
            
            for (let x = 0; x < rayCount; x++) {
                // Calculate ray position and direction
                const cameraX = 2 * x / rayCount - 1; // x-coordinate in camera space
                const rayDirX = gameState.player.dirX + gameState.player.planeX * cameraX;
                const rayDirY = gameState.player.dirY + gameState.player.planeY * cameraX;
                
                // Which box of the map we're in
                let mapX = Math.floor(gameState.player.x);
                let mapY = Math.floor(gameState.player.y);
                
                // Length of ray from current position to next x or y-side
                let deltaDistX = Math.abs(1 / rayDirX);
                let deltaDistY = Math.abs(1 / rayDirY);
                
                let sideDistX, sideDistY;
                let stepX, stepY;
                let hit = 0; // was there a wall hit?
                let side; // was a NS or a EW wall hit?
                
                // Calculate step and initial sideDist
                if (rayDirX < 0) {
                    stepX = -1;
                    sideDistX = (gameState.player.x - mapX) * deltaDistX;
                } else {
                    stepX = 1;
                    sideDistX = (mapX + 1.0 - gameState.player.x) * deltaDistX;
                }
                if (rayDirY < 0) {
                    stepY = -1;
                    sideDistY = (gameState.player.y - mapY) * deltaDistY;
                } else {
                    stepY = 1;
                    sideDistY = (mapY + 1.0 - gameState.player.y) * deltaDistY;
                }
                
                // Perform DDA
                while (hit === 0) {
                    // Jump to next map square, either in x-direction, or in y-direction
                    if (sideDistX < sideDistY) {
                        sideDistX += deltaDistX;
                        mapX += stepX;
                        side = 0;
                    } else {
                        sideDistY += deltaDistY;
                        mapY += stepY;
                        side = 1;
                    }
                    
                    // Check if ray has hit a wall
                    if (mapX < 0 || mapX >= CONFIG.WORLD_SIZE || mapY < 0 || mapY >= CONFIG.WORLD_SIZE) {
                        hit = 1; // Hit boundary
                    } else {
                        // Check if this position contains a building
                        const building = findBuildingAt(mapX, mapY);
                        if (building) {
                            hit = 1;
                        }
                    }
                }
                
                // Calculate distance projected on camera direction
                let perpWallDist;
                if (side === 0) {
                    perpWallDist = (mapX - gameState.player.x + (1 - stepX) / 2) / rayDirX;
                } else {
                    perpWallDist = (mapY - gameState.player.y + (1 - stepY) / 2) / rayDirY;
                }
                
                // Calculate height of line to draw on screen
                const lineHeight = Math.floor(screenHeight / perpWallDist);
                
                // Calculate lowest and highest pixel to fill in current stripe
                const drawStart = Math.max(0, -lineHeight / 2 + screenHeight / 2);
                const drawEnd = Math.min(screenHeight - 1, lineHeight / 2 + screenHeight / 2);
                
                // Apply fog based on distance
                const fogFactor = Math.exp(-perpWallDist * CONFIG.FOG_DENSITY);
                let wallColor = '#fff';
                
                if (hit === 1 && mapX >= 0 && mapX < CONFIG.WORLD_SIZE && mapY >= 0 && mapY < CONFIG.WORLD_SIZE) {
                    const building = findBuildingAt(mapX, mapY);
                    if (building) {
                        wallColor = getDistrictColor(building.district);
                    }
                }
                
                // Render the wall stripe using ASCII characters
                renderWallStripe(x, drawStart, drawEnd, perpWallDist, fogFactor, wallColor, side);
            }
            
            // Render dynamic objects (vehicles, pedestrians, rain)
            renderDynamicObjects();
        }

        function findBuildingAt(x, y) {
            for (const building of gameState.world.buildings) {
                if (x >= building.x && x < building.x + building.width &&
                    y >= building.y && y < building.y + building.depth) {
                    return building;
                }
            }
            return null;
        }

        function renderWallStripe(rayX, drawStart, drawEnd, distance, fogFactor, color, side) {
            const charX = rayX * CONFIG.CHAR_WIDTH;
            const charYStart = Math.floor(drawStart / CONFIG.CHAR_HEIGHT);
            const charYEnd = Math.floor(drawEnd / CONFIG.CHAR_HEIGHT);
            
            // Determine character based on distance and lighting
            const shadeIndex = Math.min(
                Math.floor(distance / 10),
                CONFIG.SHADE_CHARS.length - 1
            );
            const char = CONFIG.SHADE_CHARS[shadeIndex];
            
            // Apply fog
            const r = parseInt(color.substr(1, 2), 16);
            const g = parseInt(color.substr(3, 2), 16);
            const b = parseInt(color.substr(5, 2), 16);
            
            const foggedR = Math.floor(r * fogFactor + (1 - fogFactor) * 0);
            const foggedG = Math.floor(g * fogFactor + (1 - fogFactor) * 0);
            const foggedB = Math.floor(b * fogFactor + (1 - fogFactor) * 0);
            
            const finalColor = `rgb(${foggedR}, ${foggedG}, ${foggedB})`;
            
            // Draw each character row
            for (let charY = charYStart; charY <= charYEnd; charY++) {
                ctx.fillStyle = finalColor;
                ctx.font = `${CONFIG.CHAR_HEIGHT}px 'Courier New', monospace`;
                ctx.fillText(char, charX, charY * CONFIG.CHAR_HEIGHT + CONFIG.CHAR_HEIGHT);
            }
        }

        function renderDynamicObjects() {
            // Render vehicles
            for (const vehicle of gameState.world.vehicles) {
                renderObject(vehicle, CONFIG.TRAFFIC_CHARS[Math.floor(Math.random() * CONFIG.TRAFFIC_CHARS.length)], '#ff0');
            }
            
            // Render pedestrians
            for (const ped of gameState.world.pedestrians) {
                renderObject(ped, CONFIG.PEDESTRIAN_CHARS[Math.floor(Math.random() * CONFIG.PEDESTRIAN_CHARS.length)], '#0f0');
            }
            
            // Render rain
            if (gameState.weather.current === 'RAIN' || gameState.weather.current === 'STORM') {
                for (const drop of gameState.world.raindrops) {
                    renderObject(drop, CONFIG.RAIN_CHARS[Math.floor(Math.random() * CONFIG.RAIN_CHARS.length)], '#0ff');
                }
            }
        }

        function renderObject(obj, char, color) {
            // Simple projection (this is simplified for performance)
            const dx = obj.x - gameState.player.x;
            const dy = obj.y - gameState.player.y;
            const dz = (obj.z || 1) - gameState.player.z;
            
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > CONFIG.MAX_RENDER_DISTANCE) return;
            
            // Calculate angle relative to player direction
            const angle = Math.atan2(dy, dx) - Math.atan2(gameState.player.dirY, gameState.player.dirX);
            if (angle < -Math.PI) angle += 2 * Math.PI;
            if (angle > Math.PI) angle -= 2 * Math.PI;
            
            // Check if object is in field of view
            if (Math.abs(angle) > CONFIG.FOV / 2) return;
            
            // Project to screen coordinates
            const screenX = canvas.width / 2 + (angle / CONFIG.FOV) * canvas.width;
            const screenY = canvas.height / 2 - (dz / distance) * (canvas.height / 2);
            
            // Apply fog
            const fogFactor = Math.exp(-distance * CONFIG.FOG_DENSITY);
            const alpha = fogFactor * 0.8;
            
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            ctx.font = `${CONFIG.CHAR_HEIGHT}px 'Courier New', monospace`;
            ctx.fillText(char, screenX, screenY);
            ctx.globalAlpha = 1;
        }

        function renderGround() {
            // Simple ground rendering
            const gradient = ctx.createLinearGradient(0, canvas.height / 2, 0, canvas.height);
            gradient.addColorStop(0, '#222');
            gradient.addColorStop(1, '#111');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
            
            // Add street markings
            ctx.fillStyle = '#444';
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.fillRect(i, canvas.height / 2 + 10, 20, 2);
            }
        }

        function renderMinimap() {
            if (!minimapCtx) return;
            
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            
            const scale = minimapCanvas.width / CONFIG.WORLD_SIZE;
            
            // Draw streets
            minimapCtx.strokeStyle = '#444';
            minimapCtx.lineWidth = 1;
            for (const street of gameState.world.streets) {
                minimapCtx.beginPath();
                minimapCtx.moveTo(street.x1 * scale, street.y1 * scale);
                minimapCtx.lineTo(street.x2 * scale, street.y2 * scale);
                minimapCtx.stroke();
            }
            
            // Draw buildings
            for (const building of gameState.world.buildings) {
                minimapCtx.fillStyle = getDistrictColor(building.district);
                minimapCtx.globalAlpha = 0.3;
                minimapCtx.fillRect(
                    building.x * scale,
                    building.y * scale,
                    building.width * scale,
                    building.depth * scale
                );
                minimapCtx.globalAlpha = 1;
            }
            
            // Draw player
            minimapCtx.fillStyle = '#0f0';
            minimapCtx.beginPath();
            minimapCtx.arc(
                gameState.player.x * scale,
                gameState.player.y * scale,
                3,
                0,
                Math.PI * 2
            );
            minimapCtx.fill();
            
            // Draw player direction
            minimapCtx.strokeStyle = '#0f0';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(
                gameState.player.x * scale,
                gameState.player.y * scale
            );
            minimapCtx.lineTo(
                (gameState.player.x + gameState.player.dirX * 5) * scale,
                (gameState.player.y + gameState.player.dirY * 5) * scale
            );
            minimapCtx.stroke();
        }

        function gameLoop() {
            const startTime = performance.now();
            
            updateGame(16); // Assume 60fps
            render();
            renderMinimap();
            
            const endTime = performance.now();
            const frameTime = endTime - startTime;
            
            requestAnimationFrame(gameLoop);
        }

        // Start the game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
