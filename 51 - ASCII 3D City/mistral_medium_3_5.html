<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEON TERMINAL CITY - Living ASCII 3D World</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: 'Courier New', monospace;
            color: #0f0;
        }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0,0,0,0.7);
            padding: 12px 15px;
            font-size: 11px;
            border: 1px solid #0f0;
            pointer-events: none;
            z-index: 100;
            font-weight: bold;
            text-shadow: 0 0 5px #0f0;
            line-height: 1.4;
        }
        #info span { color: #ff0; }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: #0f0;
        }
        #crosshair::before { 
            width: 1px; 
            height: 16px; 
            left: 7px; 
            top: 0;
        }
        #crosshair::after { 
            width: 16px; 
            height: 1px; 
            left: 0; 
            top: 7px;
        }
        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #0f0;
            font-size: 16px;
            z-index: 1000;
            text-align: center;
        }
        #loading div { margin: 5px; }
        #loading #progress { font-size: 12px; color: #888; }
        #message {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff0;
            background: rgba(0,0,0,0.9);
            padding: 8px 16px;
            border: 1px solid #ff0;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-align: center;
            max-width: 80%;
        }
        #hint {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #080;
            font-size: 10px;
            opacity: 0.7;
            pointer-events: none;
        }
        #radar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 100px;
            height: 100px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #0f0;
            pointer-events: none;
            z-index: 100;
        }
        #radarCanvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div>NEON TERMINAL CITY</div>
        <div style="font-size:10px;">Building ASCII world...</div>
        <div id="progress">0%</div>
    </div>
    <div id="info">
        <div>NEON TERMINAL CITY</div>
        <div>WASD: Move | Mouse: Look | Shift: Sprint | E: Interact | R: Reset</div>
        <div>District: <span id="district">CENTRAL CORE</span></div>
        <div>Time: <span id="time">00:00</span> | Weather: <span id="weather">CLEAR</span></div>
        <div>Secrets: <span id="secrets">0/8</span> | FPS: <span id="fps">0</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="hint">Press any key to begin</div>
    <div id="radar">
        <canvas id="radarCanvas" width="100" height="100"></canvas>
    </div>

    <script>
        // ============================================
        // CONFIGURATION
        // ============================================
        const CITY_SIZE = 40;
        const CELL_SIZE = 15;
        const MAX_BUILDING_HEIGHT = 60;
        const MIN_BUILDING_HEIGHT = 3;
        const RENDER_WIDTH = 120;
        const RENDER_HEIGHT = 60;
        const NEON_COLORS = [0x00ffff, 0xff00ff, 0x00ff00, 0xff0040, 0x0040ff, 0xffff00, 0x4000ff, 0xff8000, 0x00ff80, 0xff0080];
        const ASCII_CHARS = ' .,:;i1tfLCG08@#W$%&*+xX?<>^';
        
        // ============================================
        // GLOBALS
        // ============================================
        let scene, camera, renderer, controls;
        let cityGroup, dynamicGroup, effectsGroup;
        let asciiScene, asciiCamera, asciiQuad, asciiMaterial;
        let asciiTextureAtlas;
        let depthRenderTarget, asciiRenderTarget;
        let clock = new THREE.Clock();
        let player = { position: new THREE.Vector3(), velocity: new THREE.Vector3() };
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, sprint = false, jump = false, crouch = false;
        let radarCanvas, radarCtx;
        let pointerLocked = false;
        let cityData = [];
        let dynamicObjects = [];
        let secrets = [];
        let discoveredSecrets = 0;
        let timeOfDay = 12; // Start at noon
        let weatherType = 'CLEAR';
        let weatherIntensity = 0;
        let currentDistrict = 'CENTRAL CORE';
        let lastInteractTime = 0;
        let stats = { fps: 0, lastTime: performance.now(), frameCount: 0 };
        let mouseX = 0, mouseY = 0;
        let initProgress = 0;
        
        // ============================================
        // INITIALIZATION
        // ============================================
        function init() {
            // Set initial secrets count
            document.getElementById('secrets').textContent = `0/${secrets.length}`;
            updateProgress(10);
            
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            updateProgress(15);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 15, 0);
            updateProgress(20);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // Use 1 for retro look
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);
            updateProgress(25);
            
            // Controls
            controls = new THREE.PointerLockControls(camera, document.body);
            updateProgress(30);
            
            // Create groups
            cityGroup = new THREE.Group();
            dynamicGroup = new THREE.Group();
            effectsGroup = new THREE.Group();
            scene.add(cityGroup);
            scene.add(dynamicGroup);
            scene.add(effectsGroup);
            updateProgress(35);
            
            // Lighting
            setupLighting();
            updateProgress(40);
            
            // Generate ASCII texture atlas
            asciiTextureAtlas = createAsciiTextureAtlas();
            updateProgress(45);
            
            // Create render targets
            createRenderTargets();
            updateProgress(50);
            
            // Generate city
            generateCity();
            updateProgress(70);
            
            // Create dynamic elements
            createDynamicElements();
            updateProgress(80);
            
            // Create effects
            createEffects();
            updateProgress(85);
            
            // Create secrets
            createSecrets();
            updateProgress(90);
            
            // Setup event listeners
            setupEventListeners();
            updateProgress(95);
            
            // Start animation
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                animate();
            }, 500);
            
            updateProgress(100);
        }
        
        function updateProgress(pct) {
            initProgress = pct;
            const progressEl = document.getElementById('progress');
            if (progressEl) {
                progressEl.textContent = `${pct}%`;
            }
        }
        
        // ============================================
        // ASCII TEXTURE ATLAS
        // ============================================
        function createAsciiTextureAtlas() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const charSize = 32;
            const charsPerRow = 16;
            const chars = ASCII_CHARS;
            
            canvas.width = charSize * charsPerRow;
            canvas.height = charSize * Math.ceil(chars.length / charsPerRow);
            
            // Fill background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw characters with neon effect
            ctx.font = `${charSize}px Courier New`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < chars.length; i++) {
                const row = Math.floor(i / charsPerRow);
                const col = i % charsPerRow;
                const x = col * charSize + charSize / 2;
                const y = row * charSize + charSize / 2;
                
                // Neon color based on character density
                const hue = 0.1 + (i / chars.length) * 0.3;
                ctx.fillStyle = `hsl(${hue * 360}, 100%, 80%)`;
                ctx.fillText(chars[i], x, y);
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }
        
        // ============================================
        // RENDER TARGETS
        // ============================================
        function createRenderTargets() {
            // Depth render target
            depthRenderTarget = new THREE.WebGLRenderTarget(
                window.innerWidth, 
                window.innerHeight,
                { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, format: THREE.DepthFormat }
            );
            
            // ASCII render target (low res for better ASCII effect)
            asciiRenderTarget = new THREE.WebGLRenderTarget(
                RENDER_WIDTH * 4, 
                RENDER_HEIGHT * 4,
                { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter }
            );
            
            // Create scanline texture for terminal effect
            const scanlineCanvas = document.createElement('canvas');
            scanlineCanvas.width = 2;
            scanlineCanvas.height = 2;
            const scanlineCtx = scanlineCanvas.getContext('2d');
            scanlineCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            scanlineCtx.fillRect(0, 0, 2, 2);
            scanlineCtx.clearRect(0, 0, 2, 1);
            const scanlineTexture = new THREE.CanvasTexture(scanlineCanvas);
            scanlineTexture.magFilter = THREE.NearestFilter;
            scanlineTexture.minFilter = THREE.NearestFilter;
            
            // ASCII material
            asciiMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDepth: { value: depthRenderTarget.depthTexture },
                    tDiffuse: { value: asciiRenderTarget.texture },
                    tAscii: { value: asciiTextureAtlas },
                    tScanlines: { value: scanlineTexture },
                    cameraNear: { value: camera.near },
                    cameraFar: { value: camera.far },
                    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    charGridSize: { value: new THREE.Vector2(RENDER_WIDTH, RENDER_HEIGHT) },
                    charSize: { value: new THREE.Vector2(32, 32) },
                    charsPerRow: { value: 16 },
                    time: { value: 0 },
                    screenSize: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    fogDensity: { value: 0.005 },
                    fogColor: { value: new THREE.Color(0x000011) },
                    charCount: { value: ASCII_CHARS.length }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D tDepth;
                    uniform sampler2D tDiffuse;
                    uniform sampler2D tAscii;
                    uniform sampler2D tScanlines;
                    uniform float cameraNear;
                    uniform float cameraFar;
                    uniform vec2 resolution;
                    uniform vec2 charGridSize;
                    uniform vec2 charSize;
                    uniform float charsPerRow;
                    uniform float time;
                    uniform vec2 screenSize;
                    uniform float fogDensity;
                    uniform vec3 fogColor;
                    uniform float charCount;
                    varying vec2 vUv;
                    
                    float linearDepth(float depth) {
                        return (2.0 * cameraNear) / (cameraFar + cameraNear - depth * (cameraFar - cameraNear));
                    }
                    
                    float hash(float n) { return fract(sin(n) * 43758.5453); }
                    
                    // Improved brightness to character mapping
                    float mapBrightnessToChar(float brightness, float depth) {
                        // Darker areas (far away) use darker characters
                        if (depth > 0.95) return 0.0;
                        if (depth > 0.8) return 1.0;
                        if (depth > 0.6) return 3.0;
                        if (depth > 0.4) return 6.0;
                        
                        // Brighter areas use brighter characters
                        if (brightness > 0.9) return charCount - 1.0;
                        if (brightness > 0.8) return charCount - 3.0;
                        if (brightness > 0.7) return charCount - 6.0;
                        if (brightness > 0.6) return charCount - 10.0;
                        if (brightness > 0.5) return charCount - 14.0;
                        if (brightness > 0.4) return charCount - 18.0;
                        if (brightness > 0.3) return charCount - 22.0;
                        return charCount * 0.2;
                    }
                    
                    void main() {
                        // Calculate character grid position
                        vec2 gridPos = vUv * screenSize / vec2(4.0, 8.0);
                        vec2 gridCell = floor(gridPos);
                        vec2 cellUv = fract(gridPos);
                        
                        // Sample depth
                        float depth = texture2D(tDepth, vUv).r;
                        float linearDep = linearDepth(depth);
                        float normDepth = 1.0 - smoothstep(cameraNear, cameraFar, linearDep);
                        
                        // Sample color from diffuse
                        vec4 color = texture2D(tDiffuse, vUv);
                        
                        // Calculate brightness with gamma correction
                        float brightness = dot(color.rgb, vec3(0.299, 0.587, 0.114));
                        brightness = pow(brightness, 0.45);
                        
                        // Combine brightness with depth
                        float finalBrightness = mix(brightness, normDepth, 0.3);
                        
                        // Add temporal noise for animation
                        float noise = hash(time * 0.3 + gridCell.x * 100.0 + gridCell.y * 1000.0 + normDepth * 5.0);
                        finalBrightness = clamp(finalBrightness + (noise - 0.5) * 0.15, 0.0, 1.0);
                        
                        // Map to character index using improved function
                        float charIndex = mapBrightnessToChar(finalBrightness, normDepth);
                        
                        // Calculate atlas UV
                        float charX = mod(charIndex, charsPerRow);
                        float charY = floor(charIndex / charsPerRow);
                        vec2 atlasUv = (vec2(charX, charY) + cellUv) / vec2(charsPerRow, charsPerRow);
                        
                        // Sample from ASCII texture
                        vec4 asciiChar = texture2D(tAscii, atlasUv);
                        
                        // Apply fog
                        float fogFactor = exp(-fogDensity * linearDep * linearDep);
                        vec3 foggedColor = mix(fogColor, color.rgb, fogFactor);
                        
                        // Neon glow effect based on brightness and position
                        float glow = smoothstep(0.5, 0.9, finalBrightness);
                        
                        // Color shift based on position and time
                        float hueShift = (vUv.x + vUv.y * 0.5 + time * 0.1) * 0.1;
                        vec3 neonBase = vec3(0.0, 0.8, 1.0);
                        vec3 warmColor = vec3(1.0, 0.5, 0.0);
                        vec3 coolColor = vec3(0.0, 1.0, 1.0);
                        
                        // Mix colors based on position
                        float colorMix = sin(hueShift * 3.14159 * 2.0) * 0.5 + 0.5;
                        vec3 positionColor = mix(coolColor, warmColor, colorMix);
                        
                        vec3 neonColor = mix(foggedColor, positionColor, glow * 0.6);
                        neonColor = mix(neonColor, vec3(0.8, 0.2, 1.0), glow * 0.2);
                        
                        // Apply scanlines
                        vec2 scanUv = vUv * screenSize * 2.0;
                        vec4 scanlines = texture2D(tScanlines, scanUv);
                        
                        // Final color with scanline effect
                        vec3 finalColor = neonColor * asciiChar.rgb;
                        float alpha = asciiChar.a * color.a * (0.7 + 0.3 * glow);
                        
                        gl_FragColor = vec4(finalColor * scanlines.rgb, alpha);
                    }
                `,
                transparent: true
            });
            
            // ASCII quad
            asciiQuad = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 2),
                asciiMaterial
            );
            
            // ASCII scene
            asciiScene = new THREE.Scene();
            asciiCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            asciiScene.add(asciiQuad);
            
            // Create terminal overlay with scanlines and vignette
            createTerminalOverlay();
        }
        
        // ============================================
        // TERMINAL OVERLAY
        // ============================================
        function createTerminalOverlay() {
            // Create a fullscreen quad for terminal effects
            const overlayScene = new THREE.Scene();
            const overlayCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            
            // Terminal shader material
            const overlayMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform vec2 resolution;
                    varying vec2 vUv;
                    
                    float hash(float n) { return fract(sin(n) * 43758.5453); }
                    float noise(vec2 p) { 
                        return hash(p.x * 100.0 + p.y * 1000.0 + time); 
                    }
                    
                    void main() {
                        // Vignette effect
                        vec2 center = vUv - vec2(0.5);
                        float vignette = 1.0 - dot(center, center) * 0.5;
                        vignette = pow(vignette, 0.5);
                        
                        // Scanlines
                        float scanlines = sin(vUv.y * resolution.y * 1.5 + time * 2.0) * 0.1 + 0.9;
                        scanlines = clamp(scanlines, 0.8, 1.0);
                        
                        // Grid
                        float grid = 0.0;
                        vec2 gridPos = vUv * resolution * 0.05;
                        grid += sin(gridPos.x) * 0.01;
                        grid += sin(gridPos.y) * 0.01;
                        
                        // Noise
                        float n = noise(vUv * 10.0);
                        
                        // CRT flicker effect
                        float flicker = 0.98 + sin(time * 100.0) * 0.02;
                        
                        // Combine effects
                        float intensity = vignette * scanlines * flicker + grid + n * 0.02;
                        
                        // Green tint with subtle variation
                        float greenTint = 0.08 + sin(time * 0.5 + vUv.x * 10.0) * 0.02;
                        gl_FragColor = vec4(0.0, intensity * greenTint, 0.0, 1.0);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending
            });
            
            const overlayQuad = new THREE.Mesh(
                new THREE.PlaneGeometry(2, 2),
                overlayMaterial
            );
            overlayScene.add(overlayQuad);
            
            // Store for animation
            asciiMaterial.userData.overlayScene = overlayScene;
            asciiMaterial.userData.overlayCamera = overlayCamera;
            asciiMaterial.userData.overlayMaterial = overlayMaterial;
        }
        
        // ============================================
        // LIGHTING
        // ============================================
        function setupLighting() {
            // Ambient light (neon glow)
            const ambient = new THREE.AmbientLight(0x224466, 0.4);
            scene.add(ambient);
            
            // Hemisphere light
            const hemiLight = new THREE.HemisphereLight(0x004488, 0x001122, 0.3);
            scene.add(hemiLight);
            
            // Directional light (moon/sun)
            const moonLight = new THREE.DirectionalLight(0x4488ff, 0.3);
            moonLight.position.set(100, 200, 100);
            scene.add(moonLight);
            
            // Point lights for street lamps
            for (let i = 0; i < 80; i++) {
                const light = new THREE.PointLight(
                    NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
                    0.3 + Math.random() * 0.2,
                    30 + Math.random() * 20
                );
                light.position.set(
                    (Math.random() - 0.5) * CITY_SIZE * CELL_SIZE * 1.8,
                    3 + Math.random() * 2,
                    (Math.random() - 0.5) * CITY_SIZE * CELL_SIZE * 1.8
                );
                scene.add(light);
            }
        }
        
        // ============================================
        // CITY GENERATION
        // ============================================
        function generateCity() {
            // Create ground
            const groundGeometry = new THREE.PlaneGeometry(
                CITY_SIZE * CELL_SIZE * 2.2, 
                CITY_SIZE * CELL_SIZE * 2.2
            );
            const groundMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x0a0a1a,
                transparent: true,
                opacity: 0.3
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            cityGroup.add(ground);
            
            // Generate city grid
            for (let x = -CITY_SIZE/2; x < CITY_SIZE/2; x++) {
                for (let z = -CITY_SIZE/2; z < CITY_SIZE/2; z++) {
                    const isStreetX = Math.abs(x) % 3 === 0 && Math.abs(x) < CITY_SIZE/2 - 1;
                    const isStreetZ = Math.abs(z) % 3 === 0 && Math.abs(z) < CITY_SIZE/2 - 1;
                    const isIntersection = isStreetX && isStreetZ;
                    
                    const district = getDistrict(x, z);
                    
                    if (isStreetX || isStreetZ) {
                        createStreet(x, z, isIntersection, district);
                    } else if (!isIntersection) {
                        createBuilding(x, z, district);
                    }
                }
            }
            
            // Create special landmarks
            createLandmarks();
            
            // Position player
            controls.lock();
            camera.position.set(0, 15, 0);
            player.position.copy(camera.position);
        }
        
        function getDistrict(x, z) {
            const distFromCenter = Math.sqrt(x*x + z*z);
            const distNorm = distFromCenter / (CITY_SIZE/2);
            
            if (distNorm < 0.15) return 'CENTRAL CORE';
            if (distNorm < 0.35) return 'DOWNTOWN';
            if (x < -CITY_SIZE/3 && z < -CITY_SIZE/3) return 'OLD TOWN';
            if (x > CITY_SIZE/3 && z > CITY_SIZE/3) return 'FINANCIAL';
            if (x > CITY_SIZE/3 && z < -CITY_SIZE/3) return 'INDUSTRIAL';
            if (x < -CITY_SIZE/3 && z > CITY_SIZE/3) return 'RESIDENTIAL';
            return 'MIDTOWN';
        }
        
        function createStreet(x, z, isIntersection, district) {
            const width = isStreetX ? CELL_SIZE * (isIntersection ? 2.5 : 1.8) : CELL_SIZE * 0.8;
            const depth = isStreetZ ? CELL_SIZE * (isIntersection ? 2.5 : 1.8) : CELL_SIZE * 0.8;
            
            // Street base
            const streetGeometry = new THREE.BoxGeometry(width, 0.1, depth);
            const streetMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x1a1a2a,
                roughness: 0.9,
                metalness: 0.1
            });
            const street = new THREE.Mesh(streetGeometry, streetMaterial);
            street.position.set(x * CELL_SIZE, -0.05, z * CELL_SIZE);
            cityGroup.add(street);
            
            // Street lines (subtle)
            if (!isIntersection) {
                const lineGeometry = new THREE.BoxGeometry(width * 0.95, 0.02, 0.1);
                const lineMaterial = new THREE.MeshBasicMaterial({ color: 0x444466 });
                for (let i = 0; i < 5; i++) {
                    const line = new THREE.Mesh(lineGeometry, lineMaterial);
                    line.position.set(
                        x * CELL_SIZE,
                        0.06,
                        z * CELL_SIZE + (i - 2) * depth * 0.25
                    );
                    cityGroup.add(line);
                }
            }
            
            // Sidewalks
            const sidewalkGeometry = new THREE.BoxGeometry(
                width + 0.8, 
                0.05, 
                depth + 0.8
            );
            const sidewalkMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a3a,
                roughness: 0.8
            });
            const sidewalk = new THREE.Mesh(sidewalkGeometry, sidewalkMaterial);
            sidewalk.position.set(x * CELL_SIZE, 0.075, z * CELL_SIZE);
            cityGroup.add(sidewalk);
            
            // Store data
            cityData.push({
                type: 'street',
                x: x * CELL_SIZE,
                z: z * CELL_SIZE,
                width: width,
                depth: depth,
                district: district
            });
        }
        
        function createBuilding(x, z, district) {
            // District properties
            let minHeight, maxHeight, baseColor, windowColor, windowDensity, hasSigns;
            
            switch(district) {
                case 'CENTRAL CORE':
                    minHeight = 25; maxHeight = MAX_BUILDING_HEIGHT;
                    baseColor = 0x335577; windowColor = 0x00ffff; windowDensity = 0.85; hasSigns = true;
                    break;
                case 'DOWNTOWN':
                    minHeight = 12; maxHeight = 40;
                    baseColor = 0x2a4a6a; windowColor = 0xff00ff; windowDensity = 0.7; hasSigns = true;
                    break;
                case 'FINANCIAL':
                    minHeight = 18; maxHeight = 50;
                    baseColor = 0x4a5a7a; windowColor = 0xffff00; windowDensity = 0.75; hasSigns = true;
                    break;
                case 'INDUSTRIAL':
                    minHeight = 5; maxHeight = 15;
                    baseColor = 0x1a2a3a; windowColor = 0xff8000; windowDensity = 0.3; hasSigns = false;
                    break;
                case 'RESIDENTIAL':
                    minHeight = 4; maxHeight = 12;
                    baseColor = 0x2a3a4a; windowColor = 0x00ff00; windowDensity = 0.4; hasSigns = false;
                    break;
                case 'OLD TOWN':
                    minHeight = 3; maxHeight = 10;
                    baseColor = 0x1a1a2a; windowColor = 0xff0040; windowDensity = 0.2; hasSigns = false;
                    break;
                default:
                    minHeight = MIN_BUILDING_HEIGHT; maxHeight = MAX_BUILDING_HEIGHT * 0.7;
                    baseColor = 0x2a3a5a; windowColor = 0x00ffff; windowDensity = 0.5; hasSigns = false;
            }
            
            const height = minHeight + Math.random() * (maxHeight - minHeight);
            const baseWidth = CELL_SIZE * (0.7 + Math.random() * 0.5);
            const baseDepth = CELL_SIZE * (0.7 + Math.random() * 0.5);
            
            // Building base
            const buildingGeometry = new THREE.BoxGeometry(baseWidth, height, baseDepth);
            const buildingMaterial = new THREE.MeshStandardMaterial({ 
                color: baseColor,
                roughness: 0.7,
                metalness: 0.2
            });
            const building = new THREE.Mesh(buildingGeometry, buildingMaterial);
            building.position.set(x * CELL_SIZE, height/2, z * CELL_SIZE);
            building.userData = { type: 'building', district: district, height: height };
            cityGroup.add(building);
            
            // Windows
            if (height > 4) {
                addWindows(building, height, baseWidth, baseDepth, windowDensity, windowColor, district);
            }
            
            // Roof
            const roofGeometry = new THREE.BoxGeometry(baseWidth * 1.05, 0.3, baseDepth * 1.05);
            const roofMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x111122,
                roughness: 0.9
            });
            const roof = new THREE.Mesh(roofGeometry, roofMaterial);
            roof.position.set(x * CELL_SIZE, height + 0.15, z * CELL_SIZE);
            cityGroup.add(roof);
            
            // Signs
            if (hasSigns && Math.random() > 0.6 && height > 10) {
                addBuildingSign(x * CELL_SIZE, height + 2, z * CELL_SIZE, district);
            }
            
            // Store data
            cityData.push({
                type: 'building',
                x: x * CELL_SIZE,
                z: z * CELL_SIZE,
                width: baseWidth,
                depth: baseDepth,
                height: height,
                district: district,
                mesh: building
            });
        }
        
        function addWindows(building, height, width, depth, density, color, district) {
            const windowSize = 0.4;
            const spacing = 0.9;
            const offset = 0.15;
            
            const numWindowsX = Math.floor((width - offset * 2) / spacing);
            const numWindowsY = Math.floor((height - offset) / spacing);
            
            for (let i = 0; i < numWindowsX; i++) {
                for (let j = 0; j < numWindowsY; j++) {
                    if (Math.random() > (1 - density)) {
                        const windowGeometry = new THREE.BoxGeometry(windowSize, windowSize, 0.05);
                        const windowMaterial = new THREE.MeshBasicMaterial({ 
                            color: color,
                            transparent: true,
                            opacity: 0.8
                        });
                        const window = new THREE.Mesh(windowGeometry, windowMaterial);
                        
                        const x = -width/2 + offset + i * spacing + windowSize/2;
                        const y = -height/2 + offset + j * spacing + windowSize/2;
                        const z = depth/2 + 0.02;
                        
                        window.position.set(x, y, z);
                        building.add(window);
                        
                        // Add flicker
                        window.userData.flicker = Math.random() * Math.PI * 2;
                        window.userData.speed = 0.5 + Math.random() * 3;
                    }
                }
            }
        }

        function createTraffic() {
            const streets = cityData.filter(d => d.type === 'street');
            
            for (let i = 0; i < 40; i++) {
                const street = streets[Math.floor(Math.random() * streets.length)];
                if (!street) continue;
                
                const car = createCar();
                car.position.set(
                    street.x + (Math.random() - 0.5) * street.width,
                    0.4,
                    street.z + (Math.random() - 0.5) * street.depth
                );
                car.userData = {
                    type: 'car',
                    speed: 0.03 + Math.random() * 0.07,
                    direction: Math.random() > 0.5 ? 1 : -1,
                    street: street,
                    pathOffset: Math.random() * 100
                };
                dynamicGroup.add(car);
                dynamicObjects.push(car);
            }
        }
        
        function createCar() {
            const carGroup = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.BoxGeometry(1.2, 0.7, 2.5);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)],
                roughness: 0.5,
                metalness: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            carGroup.add(body);
            
            // Windows
            const windowGeometry = new THREE.BoxGeometry(0.9, 0.4, 0.6);
            const windowMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffff,
                transparent: true,
                opacity: 0.4
            });
            const window1 = new THREE.Mesh(windowGeometry, windowMaterial);
            window1.position.set(0, 0.2, 0.6);
            carGroup.add(window1);
            const window2 = new THREE.Mesh(windowGeometry, windowMaterial);
            window2.position.set(0, 0.2, -0.6);
            carGroup.add(window2);
            
            // Wheels
            for (let i = 0; i < 4; i++) {
                const wheelGeometry = new THREE.CylinderGeometry(0.2, 0.2, 0.15, 6);
                const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111122 });
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(
                    (i < 2 ? -0.4 : 0.4) * 1.2,
                    -0.35,

        // ============================================
        // EVENT LISTENERS
        // ============================================
        function setupEventListeners() {
            // Pointer lock
            document.addEventListener('click', () => {
                if (!pointerLocked) {
                    controls.lock();
                    pointerLocked = true;
                    document.getElementById('hint').style.display = 'none';
                }
            });
            
            controls.addEventListener('lock', () => {
                pointerLocked = true;
            });
            
            controls.addEventListener('unlock', () => {
                pointerLocked = false;
            });
            
            // Keyboard
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            
            // Window resize
            window.addEventListener('resize', onWindowResize);
            
            // Hide loading on any key
            document.addEventListener('keydown', () => {
                document.getElementById('loading').style.display = 'none';
            }, { once: true });
        }
        
        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ShiftLeft':
                case 'ShiftRight': sprint = true; break;
                case 'Space': jump = true; break;
                case 'KeyC': crouch = true; break;
                case 'KeyE':
                    if (performance.now() - lastInteractTime > 1000) {
                        attemptInteract();
                        lastInteractTime = performance.now();
                    }
                    break;
                case 'KeyR':
                    camera.position.set(0, 15, 0);
                    controls.lock();
                    break;
            }
        }
        
        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': sprint = false; break;
                case 'Space': jump = false; break;
                case 'KeyC': crouch = false; break;
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Update render targets
            depthRenderTarget.setSize(window.innerWidth, window.innerHeight);
            asciiRenderTarget.setSize(RENDER_WIDTH * 4, RENDER_HEIGHT * 4);
            asciiMaterial.uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
            asciiMaterial.uniforms.screenSize.value.set(window.innerWidth, window.innerHeight);
        }
        
        function attemptInteract() {
            if (!pointerLocked) return;
            
            // Check for ladder to exit underground
            if (camera.position.y < -10) {
                // Check if near ladder
                const ladderPos = new THREE.Vector3(8 * CELL_SIZE, -10, 5 * CELL_SIZE + 2);
                const distToLadder = camera.position.distanceTo(ladderPos);
                if (distToLadder < CELL_SIZE * 2) {
                    showMessage('Climbing ladder...');
                    camera.position.set(8 * CELL_SIZE, 5, 5 * CELL_SIZE + 2);
                    return;
                }
            }
            
            // Check for nearby secrets
            for (const secret of secrets) {
                if (!secret.discovered) {
                    const dist = camera.position.distanceTo(secret.position);
                    if (dist < secret.radius) {
                        secret.discovered = true;
                        discoveredSecrets++;
                        document.getElementById('secrets').textContent = `${discoveredSecrets}/${secrets.length}`;
                        showMessage(secret.message);
                        
                        // Update district
                        if (secret.name.includes('District')) {
                            currentDistrict = secret.name.replace('District: ', '');
                            document.getElementById('district').textContent = currentDistrict;
                        }
                        
                        // Execute action if present
                        if (secret.action) {
                            secret.action();
                        }
                        
                        return;
                    }
                }
            }
            
            // Check for building interaction
            for (const data of cityData) {
                if (data.type === 'building' && data.mesh) {
                    const dist = camera.position.distanceTo(new THREE.Vector3(data.x, data.height/2, data.z));
                    if (dist < CELL_SIZE * 2) {
                        showMessage(`${data.district} Building. Height: ${Math.round(data.height)}m`);
                        return;
                    }
                }
            }
            
            // Check for underground exit
            if (camera.position.y < -10) {
                showMessage('You are in the underground tunnels. Find the ladder to exit.');
                return;
            }
            
            // Generic message
            showMessage('Nothing to interact with here.');
        }
        
        function showMessage(msg) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = msg;
            messageEl.style.opacity = '1';
            setTimeout(() => {
                messageEl.style.opacity = '0';
            }, 4000);
        }
        
        // ============================================
        // ANIMATION
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            
            // Update stats
            updateStats();
            
            // Update time
            updateTimeOfDay();
            
            // Update weather
            updateWeather();
            
            // Update player
            updatePlayer();
            
            // Update dynamics
            updateDynamicObjects();
            
            // Update effects
            updateEffects();
            
            // Update ASCII material
            asciiMaterial.uniforms.time.value = clock.getElapsedTime();
            asciiMaterial.uniforms.cameraNear.value = camera.near;
            asciiMaterial.uniforms.cameraFar.value = camera.far;
            
            // Render to depth target
            renderer.setRenderTarget(depthRenderTarget);
            renderer.clear();
            renderer.render(scene, camera);
            
            // Render to ASCII target
            renderer.setRenderTarget(asciiRenderTarget);
            renderer.clear();
            renderer.render(scene, camera);
            
            // Render ASCII quad
            renderer.setRenderTarget(null);
            renderer.clear();
            renderer.render(asciiScene, asciiCamera);
            
            // Render terminal overlay
            if (asciiMaterial.userData.overlayScene) {
                asciiMaterial.userData.overlayMaterial.uniforms.time.value = clock.getElapsedTime();
                renderer.render(asciiMaterial.userData.overlayScene, asciiMaterial.userData.overlayCamera);
            }
            
            // Update district
            updateDistrict();
        }
        
        function updateStats() {
            stats.frameCount++;
            const now = performance.now();
            if (now - stats.lastTime >= 1000) {
                stats.fps = Math.round(stats.frameCount * 1000 / (now - stats.lastTime));
                stats.frameCount = 0;
                stats.lastTime = now;
                document.getElementById('fps').textContent = stats.fps;
            }
        }
        
        function updateTimeOfDay() {
            timeOfDay += 0.00005;
            if (timeOfDay >= 24) timeOfDay = 0;
            
            // Update time display
            const hours = Math.floor(timeOfDay);
            const minutes = Math.floor((timeOfDay % 1) * 60);
            document.getElementById('time').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
            
            // Update lighting
            const dayProgress = Math.sin((timeOfDay - 6) * Math.PI / 12);
            const isDay = dayProgress > 0;
            
            scene.children.forEach(child => {
                if (child instanceof THREE.AmbientLight) {
                    child.intensity = 0.2 + 0.2 * Math.max(0, dayProgress);
                }
                if (child instanceof THREE.DirectionalLight) {
                    child.intensity = 0.2 + 0.3 * Math.max(0, dayProgress);
                }
                if (child instanceof THREE.HemisphereLight) {
                    child.intensity = 0.2 + 0.1 * Math.max(0, dayProgress);
                }
            });
        }
        
        function updateWeather() {
            // Random weather changes
            if (Math.random() < 0.0005) {
                const weatherTypes = ['CLEAR', 'RAIN', 'FOG', 'STORM'];
                weatherType = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
                weatherIntensity = 0.6 + Math.random() * 0.4;
                document.getElementById('weather').textContent = weatherType;
            }
            
            // Update effects visibility
            effectsGroup.children.forEach(child => {
                if (child.userData.type === 'rain') {
                    child.visible = weatherType === 'RAIN' || weatherType === 'STORM';
                    child.material.opacity = (weatherType === 'RAIN' ? 0.3 : 0.6) * weatherIntensity;
                }
                if (child.userData.type === 'fog') {
                    child.visible = weatherType === 'FOG' || weatherType === 'STORM';
                    child.material.opacity = (weatherType === 'FOG' ? 0.1 : 0.18) * weatherIntensity;
                }
            });
        }
        
        function updatePlayer() {
            if (!pointerLocked) return;
            
            const speed = sprint ? 0.18 : 0.1;
            const delta = clock.getDelta();
            const time = clock.getElapsedTime();
            
            player.velocity.set(0, 0, 0);
            
            if (moveForward) player.velocity.z -= speed;
            if (moveBackward) player.velocity.z += speed;
            if (moveLeft) player.velocity.x -= speed;
            if (moveRight) player.velocity.x += speed;
            
            // Apply movement relative to camera
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            direction.y = 0;
            direction.normalize();
            
            const right = new THREE.Vector3();
            right.crossVectors(new THREE.Vector3(0, 1, 0), direction);
            
            player.velocity.applyMatrix3(new THREE.Matrix3().set(
                right.x, right.y, right.z,
                0, 1, 0,
                direction.x, direction.y, direction.z
            ));
            
            // Handle jump
            if (jump && player.position.y <= 1.2) {
                player.velocity.y = 0.15;
            }
            
            // Handle crouch
            const heightOffset = crouch ? -0.5 : 0;
            
            // Apply gravity
            player.velocity.y -= 0.03 * delta * 10;
            
            // Apply movement
            camera.position.add(player.velocity.clone().multiplyScalar(delta * 10));
            
            // Camera bob effect when walking
            if (moveForward || moveBackward || moveLeft || moveRight) {
                const bobAmount = sprint ? 0.04 : 0.02;
                camera.position.y += Math.sin(time * 10) * bobAmount * (1 - crouch ? 1 : 0.3);
            }
            
            // Update player position
            player.position.copy(camera.position);
            player.position.y += heightOffset;
            
            // Keep player above ground (but allow going underground)
            if (camera.position.y < -29) {
                camera.position.y = -29;
                player.velocity.y = 0;
            }
            
            // Clamp to city bounds (but allow underground exploration)
            const halfSize = CITY_SIZE * CELL_SIZE / 2 * 1.1;
            camera.position.x = Math.max(-halfSize, Math.min(halfSize, camera.position.x));
            camera.position.z = Math.max(-halfSize, Math.min(halfSize, camera.position.z));
            
            // If in underground, adjust movement
            if (camera.position.y < -10) {
                // Dim the lighting underground
                scene.children.forEach(child => {
                    if (child instanceof THREE.AmbientLight) {
                        child.intensity = 0.1;
                    }
                });
            } else {
                // Restore lighting above ground
                scene.children.forEach(child => {
                    if (child instanceof THREE.AmbientLight) {
                        child.intensity = 0.2 + 0.2 * Math.sin((timeOfDay - 6) * Math.PI / 12);
                    }
                });
            }
        }
        
        function updateDynamicObjects() {
            const time = clock.getElapsedTime();
            
            for (const obj of dynamicObjects) {
                if (obj.userData.type === 'car') {
                    updateCar(obj, time);
                } else if (obj.userData.type === 'pedestrian') {
                    updatePedestrian(obj, time);
                } else if (obj.userData.type === 'train') {
                    updateTrain(obj, time);
                }
            }
        }
        
        function updateCar(car, time) {
            const data = car.userData;
            data.pathOffset += data.speed * (sprint ? 1.5 : 1);
            const street = data.street;
            
            const range = Math.max(street.width, street.depth);
            const pos = (Math.sin(data.pathOffset * 0.1) * range * 0.8) * data.direction;
            
            if (street.width > street.depth) {
                car.position.z = street.z + pos;
            } else {
                car.position.x = street.x + pos;
            }
            
            car.position.y = 0.4 + Math.sin(data.pathOffset * 0.5) * 0.03;
            
            // Rotate wheels
            car.children.forEach(child => {
                if (child.geometry && child.geometry.type === 'CylinderGeometry') {
                    child.rotation.z += 0.15;
                }
            });
            
            // Flicker headlights
            car.children.forEach(child => {
                if (child.userData && child.userData.flicker !== undefined) {
                    child.visible = Math.sin(time * 8 + child.userData.flicker) > 0.6;
                }
            });
        }
        
        function updatePedestrian(ped, time) {
            const data = ped.userData;
            
            data.wander += data.wanderSpeed;
            data.direction.x += Math.sin(data.wander) * 0.015;
            data.direction.z += Math.cos(data.wander * 0.7) * 0.015;
            data.direction.normalize();
            
            ped.position.add(data.direction.clone().multiplyScalar(data.speed));
            ped.position.y = 1.2 + Math.sin(time * 2 + ped.position.x * 0.1 + ped.position.z * 0.1) * 0.03;
            
            const halfSize = CITY_SIZE * CELL_SIZE / 2 * 0.9;
            if (Math.abs(ped.position.x) > halfSize || Math.abs(ped.position.z) > halfSize) {
                data.direction.multiplyScalar(-1);
            }
            
            ped.children.forEach(child => {
                if (child.userData && child.userData.flicker !== undefined) {
                    child.visible = Math.sin(time * 4 + child.userData.flicker) > 0.4;
                }
            });
        }
        
        function updateTrain(train, time) {
            const data = train.userData;
            data.pathOffset += data.speed * data.direction;
            
            train.position.x = -12 * CELL_SIZE + Math.sin(data.pathOffset * 0.008) * 30 * CELL_SIZE;
            train.position.z = Math.cos(data.pathOffset * 0.008) * 15 * CELL_SIZE;
            
            // Flicker lights
            train.children.forEach(child => {
                if (child.userData && child.userData.flicker !== undefined) {
                    child.visible = Math.sin(time * 6 + child.userData.flicker) > 0.5;
                }
            });
        }
        
        function updateEffects() {
            const time = clock.getElapsedTime();
            
            effectsGroup.children.forEach(effect => {
                const data = effect.userData;
                
                if (data.type === 'rain') {
                    effect.position.y -= data.speed;
                    effect.position.x += Math.sin(time * 2 + effect.position.y * 0.1) * data.sway;
                    
                    if (effect.position.y < 0) {
                        effect.position.y = 50 + Math.random() * 60;
                        effect.position.x = (Math.random() - 0.5) * CITY_SIZE * CELL_SIZE * 2.2;
                        effect.position.z = (Math.random() - 0.5) * CITY_SIZE * CELL_SIZE * 2.2;
                    }
                }
                
                if (data.type === 'fog') {
                    effect.position.add(data.drift);
                    const halfSize = CITY_SIZE * CELL_SIZE / 2 * 1.2;
                    if (Math.abs(effect.position.x) > halfSize) effect.position.x *= -0.8;
                    if (Math.abs(effect.position.z) > halfSize) effect.position.z *= -0.8;
                    if (effect.position.y < 0 || effect.position.y > 30) effect.position.y = 2 + Math.random() * 25;
                }
                
                if (data.type === 'beacon') {
                    effect.rotation.y += data.speed;
                }
                
                if (data.type === 'neon_tree' || data.type === 'neon_sign' || data.type === 'water') {
                    const flicker = data.flicker || 0;
                    effect.visible = Math.sin(time * 2 + flicker) > 0.2;
                    if (data.type === 'water') {
                        effect.rotation.y += 0.005;
                    }
                }
            });
            
            // Update building windows
            cityGroup.traverse(child => {
                if (child.userData && child.userData.flicker !== undefined) {
                    const flicker = child.userData.flicker;
                    const speed = child.userData.speed || 1;
                    child.visible = Math.sin(time * speed + flicker) > 0.3;
                }
            });
        }
        
        function updateDistrict() {
            const playerX = Math.floor(camera.position.x / CELL_SIZE);
            const playerZ = Math.floor(camera.position.z / CELL_SIZE);
            const newDistrict = getDistrict(playerX / CELL_SIZE, playerZ / CELL_SIZE);
            
            if (newDistrict !== currentDistrict) {
                currentDistrict = newDistrict;
                document.getElementById('district').textContent = currentDistrict;
                showMessage(`Entering ${currentDistrict} district`);
            }
        }
        
        // ============================================
        // START
        // ============================================
        init();
    </script>
</body>
</html>
