<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Veil: Echoes of the Grid</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body { background: #000; font-family: 'Courier New', monospace; }
        canvas { display: block; image-rendering: pixelated; }
        #hud {
            position: absolute; top: 10px; left: 10px; color: #0f0; font-size: 14px; text-shadow: 0 0 5px #0f0;
            pointer-events: none; z-index: 10;
        }
        #prompt {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: #ff0; font-size: 16px;
            text-shadow: 0 0 5px #ff0; max-width: 80%; text-align: center; display: none;
        }
        #instructions {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #0ff; font-size: 18px;
            text-align: center; background: rgba(0,0,0,0.8); padding: 40px; border: 2px solid #0ff; display: block;
        }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; font-family: inherit; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <canvas id="screen"></canvas>
    <div id="hud">
        <div>NEON VEIL: ECHOES OF THE GRID</div>
        <div>SPEED: <span id="speed">0</span></div>
        <div>SHARDS: <span id="shards">0</span>/12</div>
        <div>DISTRICT: <span id="district">-</span></div>
        <div>WASD: MOVE | SHIFT: SPRINT | MOUSE: LOOK | E: INTERACT</div>
    </div>
    <div id="prompt"></div>
    <div id="instructions">
        <div>WELCOME TO NEON VEIL</div>
        <div>A cyber-fantasy city where the Grid spirits roam torn veils.</div>
        <div>Explore districts, collect Veil Shards, uncover the collapse.</div>
        <button onclick="startGame()">ENTER THE GRID</button>
    </div>

    <script>
        const canvas = document.getElementById('screen');
        const ctx = canvas.getContext('2d');
        const COLS = 140;
        const ROWS = 40;
        const CHAR_W = 10;
        const CHAR_H = 18;
        canvas.width = COLS * CHAR_W;
        canvas.height = ROWS * CHAR_H;
        ctx.font = `${CHAR_H}px 'Courier New', monospace`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.imageSmoothingEnabled = false;

        // World
        const SIZE = 256;
        let map = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
        let time = 0;
        let rainIntensity = 0;
        let fogDensity = 0.3;
        let nightCycle = 0;

        // Player
        let px = 64, py = 64, pa = 0;
        let vx = 0, vy = 0;
        const MOVE_SPEED = 0.08;
        const SPRINT_SPEED = 0.16;
        const TURN_SPEED = 0.004;
        let keys = {};
        let mouseLocked = false;
        let shards = 0;

        // Entities
        let entities = []; // cars, peds, trains
        let secrets = [
            {x:32,y:32, msg:'SHARD 1: The Veil thinned first here, spirits leaked into the wires.', found:false},
            {x:96,y:48, msg:'SHARD 2: Arcane hackers tore the fabric for power.', found:false},
            // ... more procedural positions
        ];
        for(let i=3; i<13; i++) {
            secrets.push({
                x: 20+Math.random()*200|0,
                y: 20+Math.random()*200|0,
                msg: `SHARD ${i}: Echo from the collapse: "${['Grid ghosts hunger','Veil menders fail','Eternal neon rain','Spirit net overload','Fantasy cyber breach'][Math.random()*5|0]}"`,
                found: false
            });
        }

        // Chars & Colors
        const DENSITY = ' .\'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$'.split('');
        const NEON_HUES = [ // cyber-fantasy neon
            '#00ffff', '#ff00ff', '#ffff00', '#00ff00', '#ff8000', '#ff1493', '#00bfff', '#dda0dd'
        ];
        const TYPES = {
            empty: {chars:' .~;,`\'"! ', color:'#001133'},
            street: {chars:' ░▒▓█▓▒░ ', color:'#112244'},
            shop: {chars:'█▓▒░▒▓█ ▄▀▌▐ ', color:'#ff00ff'},
            skyscraper: {chars:'█▓▒░▀▄▌▐▓▒░ ', color:'#00ffff'},
            arcane: {chars:'☥✦✧⚡⚛ ⛤⟐⟡✶ ', color:'#ffff00'},
            industrial: {chars:'█▓▒▓█▌▄▀═║ ', color:'#ff8000'}
        };

        function getType(x, y) {
            const dist = Math.hypot(x-128, y-128);
            const edge = Math.min(x, y, SIZE-x, SIZE-y);
            if(edge < 8) return 'industrial';
            if(dist < 40) return 'arcane';
            if(Math.random() < 0.4) return 'skyscraper';
            if(Math.random() < 0.6) return 'shop';
            return 'empty';
        }

        function generateCity() {
            for(let x=0; x<SIZE; x++) {
                for(let y=0; y<SIZE; y++) {
                    const tp = getType(x,y);
                    const cell = {
                        type: tp,
                        height: tp === 'empty' ? 0 : (tp === 'shop' ? 3+Math.random()*4 : 8+Math.random()*12)|0,
                        windows: [], // animated
                        sign: tp !== 'empty' ? Math.random() < 0.3 : false
                    };
                    if(cell.sign) cell.signText = ['ARCANE','NEON','VEIL','GRID','ECHO','SHARD'][Math.floor(Math.random()*6)];
                    for(let l=0; l<cell.height; l++) {
                        cell.windows.push(Math.random()<0.3 ? 1 : 0);
                    }
                    map[y][x] = cell;
                }
            }
            // Carve streets
            for(let gx=0; gx<SIZE; gx+=12) for(let gy=0; gy<SIZE; gy+=12) {
                for(let dx=0; dx<8; dx++) for(let dy=0; dy<8; dy++) {
                    const sx = (gx + dx)%SIZE, sy = (gy + dy)%SIZE;
                    map[sy][sx].type = 'street';
                    map[sy][sx].height = 0;
                }
            }
        }

        function spawnEntities() {
            if(Math.random() < 0.02) {
                entities.push({
                    x: Math.random()*SIZE, y: Math.random()*SIZE,
                    vx: (Math.random()-0.5)*0.1, vy: (Math.random()-0.5)*0.1,
                    type: 'ped', char: ['☻','★','⚆','⚇','♠'][Math.random()*5|0], color: '#00ff00'
                });
            }
            if(Math.random() < 0.01) {
                const sx = Math.random()<0.5 ? 0 : SIZE-1;
                const sy = Math.random()*SIZE;
                entities.push({
                    x: sx, y: sy, vx: 0.15 * (sx===0?1:-1), vy:0,
                    type: 'car', char: '═▌▐▀▄', color: NEON_HUES[Math.random()*8|0], size: 3
                });
            }
        }

        function updateEntities(dt) {
            entities = entities.filter(e => {
                e.x = (e.x + e.vx * dt * 60 + SIZE) % SIZE;
                e.y = (e.y + e.vy * dt * 60 + SIZE) % SIZE;
                if(e.type === 'ped' && Math.random()<0.01) {
                    e.vx = (Math.random()-0.5)*0.05;
                    e.vy = (Math.random()-0.5)*0.05;
                }
                if(map[Math.floor(e.y)]?.[Math.floor(e.x)]?.height > 0) return false;
                return Math.hypot(e.x - px, e.y - py) < 200;
            });
        }

        function raycast() {
            const rays = [];
            const fov = Math.PI / 3;
            for(let i=0; i<COLS; i++) {
                const rayA = pa - fov/2 + (i/COLS) * fov;
                const sinA = Math.sin(rayA), cosA = Math.cos(rayA);
                let dist = 0.01;
                let hitDist = Infinity, hitCell = null, hitSide = 0;
                while(dist < 40) {
                    const mx = Math.floor(px + cosA * dist);
                    const my = Math.floor(py + sinA * dist);
                    if(mx < 0 || mx >= SIZE || my < 0 || my >= SIZE) break;
                    const cell = map[my][mx];
                    if(cell.height > 0) {
                        hitDist = dist;
                        hitCell = cell;
                        hitSide = (cosA > 0 ? 0 : 1);
                        break;
                    }
                    dist += 0.02;
                }
                rays.push({dist: hitDist, cell: hitCell, angle: rayA - pa, side: hitSide});
            }
            return rays;
        }

        function render() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const rays = raycast();
            const pulse = Math.sin(time * 3) * 0.5 + 0.5;
            nightCycle = (Math.sin(time * 0.1) + 1) * 0.5;

            // Animate windows/signs
            map.forEach(row => row.forEach(cell => {
                if(cell.windows) cell.windows.forEach((w, l) => {
                    cell.windows[l] = Math.sin(time * 2 + l * 0.5) > 0 ? 1 : 0;
                });
                if(cell.sign) cell.signFrame = (cell.signFrame || 0) + 0.1;
            }));

            for(let col=0; col<COLS; col++) {
                const ray = rays[col];
                const screenDist = ray.dist * Math.cos(ray.angle);
                const projH = Math.floor(ROWS * 200 / (screenDist + 0.1));
                const top = Math.floor((ROWS - projH) / 2);
                const bot = top + projH;

                for(let row=0; row<ROWS; row++) {
                    let ch = ' ', fg = '#111', bg = 'transparent';

                    // Sky
                    if(row < top) {
                        const skyGrad = Math.floor(row / top * 8);
                        ch = DENSITY[16 - skyGrad];
                        fg = `hsl(200, 50%, ${20 + nightCycle*30}%)`;
                    }
                    // Wall
                    else if(row < bot && ray.cell) {
                        const wfrac = (row - top) / projH;
                        const cell = ray.cell;
                        let density = Math.floor(15 * (1 - screenDist / 40) * (0.7 + pulse * 0.3));
                        density = Math.max(0, density);

                        if(wfrac < 0.05) ch = '▄'; // roof
                        else if(wfrac > 0.95) ch = '▀'; // ground
                        else {
                            const level = Math.floor(wfrac * cell.height);
                            if(cell.windows[level]) {
                                ch = cell.type === 'arcane' ? '✦' : '░';
                                fg = NEON_HUES[Math.floor(Math.sin(time + col)*4 + 4)|0];
                            } else if(cell.sign && wfrac > 0.4 && wfrac < 0.6) {
                                const txt = cell.signText;
                                const charIdx = Math.floor((time * 2 + col * 0.1) % txt.length);
                                ch = txt[charIdx] || '█';
                                fg = NEON_HUES[cell.type === 'arcane' ? 2 : Math.floor(Math.random()*6)];
                            } else {
                                ch = DENSITY[density];
                                fg = TYPES[cell.type]?.color || '#444';
                            }
                        }
                    }
                    // Floor with reflections
                    else {
                        const fdist = (row - bot) / (ROWS - bot) * screenDist;
                        let fden = Math.floor(15 * (1 - fdist/10) * 0.5);
                        ch = [' ','~','`',',',';','░','▒'][Math.min(fden,6)];
                        fg = `hsl(220, 30%, ${10 + nightCycle*10}%)`;
                        // Reflection
                        if(ray.cell && Math.random() < (1 - rainIntensity)*0.3) {
                            ch = DENSITY[Math.floor(10 * (1 - fdist/5))];
                            fg = TYPES[ray.cell.type]?.color || fg;
                        }
                    }

                    // Fog overlay
                    const fogAlpha = Math.min(1, screenDist * fogDensity);
                    fg = `rgba(0,10,20,${fogAlpha})`;

                    // Draw
                    ctx.fillStyle = bg;
                    ctx.fillText(' ', (col + 0.5) * CHAR_W, (row + 0.5) * CHAR_H);
                    ctx.fillStyle = fg;
                    ctx.fillText(ch, (col + 0.5) * CHAR_W, (row + 0.5) * CHAR_H);
                }
            }

            // Rain
            if(rainIntensity > 0.3) {
                for(let i=0; i<COLS * rainIntensity * 2; i++) {
                    const rx = Math.random() * canvas.width;
                    const ry = Math.random() * canvas.height * 0.7 + canvas.height * 0.3;
                    const rainCh = ['|','/','\\','`'][Math.floor(Math.random()*4)];
                    ctx.fillStyle = `rgba(0,200,255,${0.8 - rainIntensity})`;
                    ctx.fillText(rainCh, rx, ry);
                }
            }

            // Entities projection
            entities.forEach(e => {
                const ex = e.x - px, ey = e.y - py;
                const dist = Math.hypot(ex, ey);
                if(dist < 15) {
                    const eangle = Math.atan2(ey, ex) - pa;
                    if(Math.abs(eangle) < fov/2) {
                        const screenX = COLS / 2 + (eangle / fov) * COLS;
                        const projSize = Math.floor(ROWS * 1.5 / dist);
                        const ecenter = ROWS / 2;
                        const echar = typeof e.char === 'string' ? e.char[Math.floor(time*5)%e.char.length] : e.char;
                        for(let er=-projSize/2; er<projSize/2; er++) {
                            const erow = ecenter + er;
                            if(erow > 0 && erow < ROWS) {
                                ctx.fillStyle = e.color + Math.floor(255*(1-dist/15)/255).toString(16).padStart(2,'0');
                                ctx.fillText(echar, screenX * CHAR_W, erow * CHAR_H);
                            }
                        }
                    }
                }
            });

            // Crosshair
            ctx.fillStyle = '#0ff';
            ctx.fillText('+', canvas.width/2, canvas.height/2);
        }

        function update(dt) {
            time += dt;
            rainIntensity = 0.4 + 0.3 * Math.sin(time * 0.5);
            fogDensity = 0.15 + 0.2 * rainIntensity;

            // Movement
            const speed = (keys['shift'] ? SPRINT_SPEED : MOVE_SPEED) * dt * 60;
            vx = 0; vy = 0;
            if(keys['w']) { vx += Math.cos(pa) * speed; vy += Math.sin(pa) * speed; }
            if(keys['s']) { vx -= Math.cos(pa) * speed; vy -= Math.sin(pa) * speed; }
            if(keys['a']) { vx += Math.cos(pa - Math.PI/2) * speed; vy += Math.sin(pa - Math.PI/2) * speed; }
            if(keys['d']) { vx -= Math.cos(pa - Math.PI/2) * speed; vy -= Math.sin(pa - Math.PI/2) * speed; }

            // Collision
            const nx = px + vx, ny = py + vy;
            const mx = Math.floor(nx), my = Math.floor(ny);
            if(!map[my]?.[mx] || map[my][mx].height === 0) {
                px = nx; py = ny;
            }
            px = (px % SIZE + SIZE) % SIZE;
            py = (py % SIZE + SIZE) % SIZE;

            updateEntities(dt);
            spawnEntities();

            // Interact
            if(keys['e']) {
                const aheadDist = 2;
                const ix = px + Math.cos(pa) * aheadDist;
                const iy = py + Math.sin(pa) * aheadDist;
                const imx = Math.floor(ix), imy = Math.floor(iy);
                secrets.forEach(s => {
                    if(!s.found && Math.hypot(imx - s.x, imy - s.y) < 2) {
                        s.found = true;
                        shards++;
                        showPrompt(s.msg + '\n[SHARD COLLECTED]');
                        keys['e'] = false;
                    }
                });
            }

            // District
            const distCenter = Math.hypot(px-128, py-128);
            document.getElementById('district').textContent = distCenter < 40 ? 'ARCANE CORE' : 'NEON FRINGE';
            document.getElementById('speed').textContent = Math.floor(Math.hypot(vx,vy)*100);
            document.getElementById('shards').textContent = shards;
        }

        function showPrompt(text) {
            const prompt = document.getElementById('prompt');
            prompt.innerHTML = text.replace(/\n/g,'<br>');
            prompt.style.display = 'block';
            setTimeout(() => prompt.style.display = 'none', 4000);
        }

        // Events
        window.addEventListener('keydown', e => {
            keys[e.key.toLowerCase()] = true;
            if(e.key.toLowerCase() === 'e') e.preventDefault();
        });
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        canvas.addEventListener('click', () => {
            canvas.requestPointerLock();
            document.getElementById('instructions').style.display = 'none';
        });
        document.addEventListener('pointerlockchange', () => {
            mouseLocked = !!document.pointerLockElement;
        });
        document.addEventListener('mousemove', e => {
            if(mouseLocked) {
                pa += e.movementX * TURN_SPEED;
                pa %= Math.PI * 2;
            }
        });

        function startGame() {
            generateCity();
            document.getElementById('instructions').style.display = 'none';
            canvas.requestPointerLock();
        }

        function loop() {
            const now = performance.now() * 0.001;
            const dt = Math.min(now - (window.lastTime || now), 0.05);
            window.lastTime = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
