<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living ASCII 3D City</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
        }
        #canvas {
            display: block;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border: 1px solid #0f0;
            text-align: center;
            pointer-events: auto;
        }
        #menu button {
            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            padding: 0.5rem 1rem;
            margin: 0.5rem;
            cursor: pointer;
            pointer-events: auto;
        }
        #menu button:hover {
            background: #0f0;
            color: #000;
        }
        #stats {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="menu">
            <h1 class="text-2xl mb-4">LIVING ASCII 3D CITY</h1>
            <p class="mb-4">Explore a neon terminal metropolis</p>
            <button id="start">START</button>
            <button id="info">INFO</button>
        </div>
        <div id="stats"></div>
        <div id="crosshair">+</div>
    </div>

    <script>
        // Game state
        const state = {
            started: false,
            menu: true,
            info: false,
            clock: new THREE.Clock(),
            asciiChars: " .,:;+*?%S#@",
            asciiResolution: 0.15,
            fog: true,
            rain: true,
            dayNightCycle: true,
            timeOfDay: 0,
            vehicles: [],
            pedestrians: [],
            districts: [
                { name: "Downtown", center: new THREE.Vector3(0, 0, 0), radius: 50 },
                { name: "Industrial", center: new THREE.Vector3(-50, 0, -50), radius: 30 },
                { name: "Residential", center: new THREE.Vector3(50, 0, -50), radius: 30 },
                { name: "Cyberpunk Alley", center: new THREE.Vector3(0, 0, 50), radius: 20 },
            ],
            rainDrops: [],
            rainGeometry: new THREE.BufferGeometry(),
            rainMaterial: new THREE.PointsMaterial({
                color: 0xaaaaff,
                size: 0.1,
                transparent: true,
                opacity: 0.6,
            }),
            rainSystem: null,
            secrets: [
                {
                    name: "Hidden Bunker",
                    position: new THREE.Vector3(-45, 0, -45),
                    found: false,
                    message: "You found a hidden bunker! Inside, you see flickering screens and a single chair.",
                },
                {
                    name: "Neon Graffiti",
                    position: new THREE.Vector3(0, 0, 55),
                    found: false,
                    message: "The wall reads: 'THE CITY NEVER SLEEPS, BUT YOU SHOULD.'",
                },
                {
                    name: "Abandoned Shop",
                    position: new THREE.Vector3(45, 0, -45),
                    found: false,
                    message: "The shop's sign flickers: 'CLOSED FOR BUSINESS... OR SO IT SEEMS.'",
                },
            ],
            currentDistrict: null,
        };

        // Initialize THREE.js scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.Fog(0x000000, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 20);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Pointer lock controls
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.getElementById('start').addEventListener('click', () => {
            controls.lock();
        });

        controls.addEventListener('lock', () => {
            state.menu = false;
            document.getElementById('menu').style.display = 'none';
            state.started = true;
        });

        controls.addEventListener('unlock', () => {
            state.menu = true;
            document.getElementById('menu').style.display = 'block';
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Movement controls
        const move = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            sprint: false,
        };

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': move.forward = true; break;
                case 'KeyA': move.left = true; break;
                case 'KeyS': move.backward = true; break;
                case 'KeyD': move.right = true; break;
                case 'ShiftLeft': move.sprint = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': move.forward = false; break;
                case 'KeyA': move.left = false; break;
                case 'KeyS': move.backward = false; break;
                case 'KeyD': move.right = false; break;
                case 'ShiftLeft': move.sprint = false; break;
            }
        });

        // ASCII rendering
        const asciiRender = () => {
            // Render THREE.js scene to a texture
            renderer.render(scene, camera);
            const renderedImage = renderer.domElement;
            const renderedCtx = renderedImage.getContext('2d');
            const imageData = renderedCtx.getImageData(0, 0, renderedImage.width, renderedImage.height);
            const data = imageData.data;

            // Create ASCII canvas
            const asciiCanvas = document.createElement('canvas');
            const asciiCtx = asciiCanvas.getContext('2d');
            asciiCanvas.width = window.innerWidth * state.asciiResolution;
            asciiCanvas.height = window.innerHeight * state.asciiResolution;
            asciiCtx.fillStyle = '#000';
            asciiCtx.fillRect(0, 0, asciiCanvas.width, asciiCanvas.height);
            asciiCtx.font = `${Math.floor(1 / state.asciiResolution)}px Courier New`;
            asciiCtx.textAlign = 'center';
            asciiCtx.textBaseline = 'middle';

            // Map brightness to ASCII characters
            const charWidth = Math.floor(1 / state.asciiResolution);
            const charHeight = Math.floor(1 / state.asciiResolution);
            const playerPos = camera.position;
            const time = state.clock.getElapsedTime();

            for (let y = 0; y < asciiCanvas.height; y += charHeight) {
                for (let x = 0; x < asciiCanvas.width; x += charWidth) {
                    // Sample the center pixel of the character's area
                    const imageX = Math.floor((x / asciiCanvas.width) * renderedImage.width);
                    const imageY = Math.floor((y / asciiCanvas.height) * renderedImage.height);
                    const index = (imageY * renderedImage.width + imageX) * 4;
                    const r = data[index];
                    const g = data[index + 1];
                    const b = data[index + 2];
                    let brightness = (r + g + b) / 3;

                    // Distance-based ASCII density
                    const screenX = (x / asciiCanvas.width) * 2 - 1;
                    const screenY = -(y / asciiCanvas.height) * 2 + 1;
                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(new THREE.Vector2(screenX, screenY), camera);
                    const intersects = raycaster.intersectObjects(scene.children);
                    const distance = intersects.length > 0 ? intersects[0].distance : 1000;

                    // Adjust brightness based on distance and motion
                    brightness = brightness * (1 - distance / 1000);
                    brightness = Math.max(0, brightness - Math.sin(time * 2 + x * 0.1 + y * 0.1) * 10);

                    // Map brightness to ASCII character
                    const charIndex = Math.floor((brightness / 255) * (state.asciiChars.length - 1));
                    const char = state.asciiChars[charIndex];

                    // Color based on brightness and district
                    let color = '#0f0';
                    if (brightness > 200) color = '#fff';
                    else if (brightness > 150) color = '#aaf';
                    else if (brightness > 100) color = '#5f5';
                    if (state.currentDistrict === "Cyberpunk Alley") color = '#f0f';
                    else if (state.currentDistrict === "Industrial") color = '#888';

                    // Draw the character
                    asciiCtx.fillStyle = color;
                    asciiCtx.fillText(char, x, y);
                }
            }

            // Draw ASCII canvas to the main canvas
            const ctx = document.getElementById('canvas').getContext('2d');
            ctx.drawImage(asciiCanvas, 0, 0, window.innerWidth, window.innerHeight);
        };

        // Procedural city generation
        const generateCity = () => {
            // City grid parameters
            const gridSize = 100;
            const blockSize = 10;
            const streetWidth = 2;
            const buildingDensity = 0.7;

            // Materials
            const buildingMaterials = [
                new THREE.MeshPhongMaterial({ color: 0x333344, shininess: 10 }), // Dark blue
                new THREE.MeshPhongMaterial({ color: 0x443344, shininess: 10 }), // Purple
                new THREE.MeshPhongMaterial({ color: 0x334433, shininess: 10 }), // Dark green
                new THREE.MeshPhongMaterial({ color: 0x444433, shininess: 10 }), // Olive
                new THREE.MeshPhongMaterial({ color: 0x555555, shininess: 30 }), // Gray
            ];

            const windowMaterial = new THREE.MeshPhongMaterial({
                color: 0xffff00,
                emissive: 0x333300,
                shininess: 50,
            });

            const streetMaterial = new THREE.MeshPhongMaterial({
                color: 0x222222,
                shininess: 5,
            });

            const signMaterial = new THREE.MeshPhongMaterial({
                color: 0xff00ff,
                emissive: 0x330033,
                shininess: 50,
            });

            // Generate streets
            for (let x = -gridSize; x <= gridSize; x += blockSize) {
                for (let z = -gridSize; z <= gridSize; z += blockSize) {
                    // Streets along X
                    const streetX = new THREE.Mesh(
                        new THREE.BoxGeometry(streetWidth, 0.1, blockSize),
                        streetMaterial
                    );
                    streetX.position.set(x, 0, z - blockSize / 2);
                    scene.add(streetX);

                    // Streets along Z
                    const streetZ = new THREE.Mesh(
                        new THREE.BoxGeometry(blockSize, 0.1, streetWidth),
                        streetMaterial
                    );
                    streetZ.position.set(x - blockSize / 2, 0, z);
                    scene.add(streetZ);
                }
            }

            // Generate buildings
            for (let x = -gridSize; x <= gridSize; x += blockSize) {
                for (let z = -gridSize; z <= gridSize; z += blockSize) {
                    if (Math.random() > buildingDensity) continue;

                    // Determine district
                    let district = null;
                    for (const d of state.districts) {
                        const distance = Math.sqrt(
                            Math.pow(x - d.center.x, 2) + 
                            Math.pow(z - d.center.z, 2)
                        );
                        if (distance <= d.radius) {
                            district = d;
                            break;
                        }
                    }

                    // District-specific properties
                    let height, width, depth, material, windowChance, signChance;
                    if (district) {
                        switch (district.name) {
                            case "Downtown":
                                height = 20 + Math.random() * 50;
                                width = 4 + Math.random() * 8;
                                depth = 4 + Math.random() * 8;
                                material = buildingMaterials[0];
                                windowChance = 0.5;
                                signChance = 0.8;
                                break;
                            case "Industrial":
                                height = 10 + Math.random() * 30;
                                width = 6 + Math.random() * 10;
                                depth = 6 + Math.random() * 10;
                                material = buildingMaterials[1];
                                windowChance = 0.3;
                                signChance = 0.2;
                                break;
                            case "Residential":
                                height = 5 + Math.random() * 20;
                                width = 3 + Math.random() * 6;
                                depth = 3 + Math.random() * 6;
                                material = buildingMaterials[2];
                                windowChance = 0.6;
                                signChance = 0.1;
                                break;
                            case "Cyberpunk Alley":
                                height = 15 + Math.random() * 40;
                                width = 2 + Math.random() * 5;
                                depth = 2 + Math.random() * 5;
                                material = buildingMaterials[3];
                                windowChance = 0.7;
                                signChance = 0.9;
                                break;
                            default:
                                height = 5 + Math.random() * 50;
                                width = 2 + Math.random() * 10;
                                depth = 2 + Math.random() * 10;
                                material = buildingMaterials[4];
                                windowChance = 0.5;
                                signChance = 0.5;
                        }
                    } else {
                        height = 5 + Math.random() * 50;
                        width = 2 + Math.random() * 10;
                        depth = 2 + Math.random() * 10;
                        material = buildingMaterials[4];
                        windowChance = 0.5;
                        signChance = 0.5;
                    }

                    const posX = x - blockSize / 2 + width / 2 + Math.random() * streetWidth;
                    const posZ = z - blockSize / 2 + depth / 2 + Math.random() * streetWidth;

                    // Building base
                    const building = new THREE.Mesh(
                        new THREE.BoxGeometry(width, height, depth),
                        material
                    );
                    building.position.set(posX, height / 2, posZ);
                    scene.add(building);

                    // Windows
                    const windowRows = Math.floor(height / 2);
                    const windowCols = Math.floor(width / 2);
                    for (let wy = 0; wy < windowRows; wy++) {
                        for (let wx = 0; wx < windowCols; wx++) {
                            if (Math.random() > windowChance) continue;
                            const window = new THREE.Mesh(
                                new THREE.BoxGeometry(0.5, 0.5, 0.1),
                                windowMaterial
                            );
                            window.position.set(
                                posX - width / 2 + wx * 1.5 + 0.75,
                                1 + wy * 2,
                                posZ + depth / 2 + 0.1
                            );
                            scene.add(window);
                        }
                    }

                    // Signs
                    if (height > 20 && Math.random() > (1 - signChance)) {
                        const sign = new THREE.Mesh(
                            new THREE.BoxGeometry(3, 1, 0.1),
                            signMaterial
                        );
                        sign.position.set(posX, height + 0.5, posZ);
                        scene.add(sign);
                    }
                }
            }

            // Add ambient light
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);

            // Add directional light (moonlight)
            const directionalLight = new THREE.DirectionalLight(0x88aaff, 0.5);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            // Add fog
            scene.fog = new THREE.Fog(0x000022, 50, 200);
        };

        // Animation loop
        const animate = () => {
            requestAnimationFrame(animate);

            if (state.started) {
                const delta = state.clock.getDelta();
                const speed = move.sprint ? 0.5 : 0.2;

                if (move.forward) controls.moveForward(speed);
                if (move.backward) controls.moveForward(-speed);
                if (move.left) controls.moveRight(-speed);
                if (move.right) controls.moveRight(speed);

                // Update time of day
                if (state.dayNightCycle) {
                    state.timeOfDay += delta * 0.01;
                    const lightIntensity = 0.5 + 0.5 * Math.sin(state.timeOfDay);
                    scene.fog.color.setHSL(0.6, 0.5, 0.1 * lightIntensity);
                }

                // Check for secrets
                checkSecrets();
                updateDistrict();

                asciiRender();
            }
        };

        // Generate vehicles (instanced)
        const generateVehicles = () => {
            const vehicleGeometry = new THREE.BoxGeometry(1, 0.5, 2);
            const vehicleMaterial = new THREE.MeshPhongMaterial({
                color: 0xff0000,
                emissive: 0x330000,
                shininess: 50,
            });

            state.vehicles = [];
            const matrix = new THREE.Matrix4();
            const instancedVehicles = new THREE.InstancedMesh(vehicleGeometry, vehicleMaterial, 20);

            for (let i = 0; i < 20; i++) {
                const position = new THREE.Vector3(
                    -50 + Math.random() * 100,
                    0.5,
                    -50 + Math.random() * 100
                );
                const direction = new THREE.Vector3(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                const speed = 0.1 + Math.random() * 0.2;

                matrix.setPosition(position);
                instancedVehicles.setMatrixAt(i, matrix);
                state.vehicles.push({ position, direction, speed });
            }

            scene.add(instancedVehicles);
            state.vehicleMesh = instancedVehicles;
        };

        // Generate pedestrians (instanced)
        const generatePedestrians = () => {
            const pedestrianGeometry = new THREE.BoxGeometry(0.5, 1.5, 0.5);
            const pedestrianMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ffff,
                emissive: 0x003333,
                shininess: 50,
            });

            state.pedestrians = [];
            const matrix = new THREE.Matrix4();
            const instancedPedestrians = new THREE.InstancedMesh(pedestrianGeometry, pedestrianMaterial, 30);

            for (let i = 0; i < 30; i++) {
                const position = new THREE.Vector3(
                    -50 + Math.random() * 100,
                    1,
                    -50 + Math.random() * 100
                );
                const direction = new THREE.Vector3(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                const speed = 0.05 + Math.random() * 0.1;

                matrix.setPosition(position);
                instancedPedestrians.setMatrixAt(i, matrix);
                state.pedestrians.push({ position, direction, speed, waitTime: 0 });
            }

            scene.add(instancedPedestrians);
            state.pedestrianMesh = instancedPedestrians;
        };

        // Update vehicles and pedestrians (instanced)
        const updateEntities = (delta) => {
            const matrix = new THREE.Matrix4();

            // Update vehicles
            for (let i = 0; i < state.vehicles.length; i++) {
                const vehicle = state.vehicles[i];
                vehicle.position.add(vehicle.direction.clone().multiplyScalar(vehicle.speed));

                // Bounce off edges
                if (vehicle.position.x < -50 || vehicle.position.x > 50) {
                    vehicle.direction.x *= -1;
                }
                if (vehicle.position.z < -50 || vehicle.position.z > 50) {
                    vehicle.direction.z *= -1;
                }

                matrix.setPosition(vehicle.position);
                state.vehicleMesh.setMatrixAt(i, matrix);
            }
            state.vehicleMesh.instanceMatrix.needsUpdate = true;

            // Update pedestrians
            for (let i = 0; i < state.pedestrians.length; i++) {
                const pedestrian = state.pedestrians[i];
                if (pedestrian.waitTime > 0) {
                    pedestrian.waitTime -= delta;
                    continue;
                }

                pedestrian.position.add(pedestrian.direction.clone().multiplyScalar(pedestrian.speed));

                // Randomly change direction or wait
                if (Math.random() < 0.01) {
                    if (Math.random() > 0.5) {
                        pedestrian.direction = new THREE.Vector3(Math.random() * 2 - 1, 0, Math.random() * 2 - 1).normalize();
                    } else {
                        pedestrian.waitTime = 1 + Math.random() * 3;
                    }
                }

                // Bounce off edges
                if (pedestrian.position.x < -50 || pedestrian.position.x > 50) {
                    pedestrian.direction.x *= -1;
                }
                if (pedestrian.position.z < -50 || pedestrian.position.z > 50) {
                    pedestrian.direction.z *= -1;
                }

                matrix.setPosition(pedestrian.position);
                state.pedestrianMesh.setMatrixAt(i, matrix);
            }
            state.pedestrianMesh.instanceMatrix.needsUpdate = true;
        };

        // Generate rain
        const generateRain = () => {
            const rainCount = 1000;
            const positions = new Float32Array(rainCount * 3);

            for (let i = 0; i < rainCount; i++) {
                positions[i * 3] = -50 + Math.random() * 100;
                positions[i * 3 + 1] = 30 + Math.random() * 20;
                positions[i * 3 + 2] = -50 + Math.random() * 100;
                state.rainDrops.push({
                    x: positions[i * 3],
                    y: positions[i * 3 + 1],
                    z: positions[i * 3 + 2],
                    speed: 0.5 + Math.random() * 0.5,
                });
            }

            state.rainGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            state.rainSystem = new THREE.Points(state.rainGeometry, state.rainMaterial);
            scene.add(state.rainSystem);
        };

        // Update rain
        const updateRain = (delta) => {
            if (!state.rain) return;

            const positions = state.rainGeometry.attributes.position.array;
            for (let i = 0; i < state.rainDrops.length; i++) {
                state.rainDrops[i].y -= state.rainDrops[i].speed;
                if (state.rainDrops[i].y < 0) {
                    state.rainDrops[i].y = 30 + Math.random() * 20;
                }
                positions[i * 3] = state.rainDrops[i].x;
                positions[i * 3 + 1] = state.rainDrops[i].y;
                positions[i * 3 + 2] = state.rainDrops[i].z;
            }
            state.rainGeometry.attributes.position.needsUpdate = true;
        };

        // Update fog
        const updateFog = () => {
            if (state.fog) {
                scene.fog.near = 20;
                scene.fog.far = 100;
            } else {
                scene.fog.near = 1000;
                scene.fog.far = 2000;
            }
        };

        // Animation loop
        const animate = () => {
            requestAnimationFrame(animate);

            if (state.started) {
                const delta = state.clock.getDelta();
                const speed = move.sprint ? 0.5 : 0.2;

                if (move.forward) controls.moveForward(speed);
                if (move.backward) controls.moveForward(-speed);
                if (move.left) controls.moveRight(-speed);
                if (move.right) controls.moveRight(speed);

                // Update time of day
                if (state.dayNightCycle) {
                    state.timeOfDay += delta * 0.01;
                    const lightIntensity = 0.5 + 0.5 * Math.sin(state.timeOfDay);
                    scene.fog.color.setHSL(0.6, 0.5, 0.1 * lightIntensity);
                }

                updateEntities(delta);
                updateRain(delta);
                updateFog();
                asciiRender();
            }
        };

        // Check for secrets
        const checkSecrets = () => {
            if (!state.started) return;

            const playerPos = camera.position;
            for (const secret of state.secrets) {
                if (secret.found) continue;
                const distance = playerPos.distanceTo(secret.position);
                if (distance < 5) {
                    secret.found = true;
                    alert(secret.message);
                }
            }
        };

        // Update current district
        const updateDistrict = () => {
            if (!state.started) return;

            const playerPos = camera.position;
            let currentDistrict = "Wilderness";
            for (const district of state.districts) {
                const distance = playerPos.distanceTo(district.center);
                if (distance <= district.radius) {
                    currentDistrict = district.name;
                    break;
                }
            }
            state.currentDistrict = currentDistrict;
            document.getElementById('stats').innerHTML = `
                <div>District: ${currentDistrict}</div>
                <div>Time: ${new Date(state.timeOfDay * 10000).toLocaleTimeString()}</div>
            `;
        };

        // Initialize
        generateCity();
        generateVehicles();
        generatePedestrians();
        generateRain();
        animate();
    </script>
</body>
</html>
