<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Nexus - 3D Fantasy Roguelite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .hud {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .stat-bar {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #4a5568;
            border-radius: 8px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .health-bar, .mana-bar {
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8844);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .mana-fill {
            height: 100%;
            background: linear-gradient(90deg, #4488ff, #8844ff);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .spell-hud {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        
        .spell-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #666;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s ease;
        }
        
        .spell-slot:hover {
            border-color: #fff;
            transform: scale(1.1);
        }
        
        .spell-slot.active {
            border-color: #ffdd44;
            box-shadow: 0 0 20px rgba(255, 221, 68, 0.5);
        }
        
        .screen-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }
        
        .damage-text {
            position: absolute;
            color: #ff4444;
            font-weight: bold;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .loading-text {
            font-size: 32px;
            margin-bottom: 20px;
            color: #4a5568;
        }
        
        .progress-bar {
            width: 400px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4488ff, #8844ff);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .upgrade-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 30, 0.95);
            border: 2px solid #666;
            border-radius: 16px;
            padding: 30px;
            width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            display: none;
            pointer-events: auto;
            z-index: 50;
        }
        
        .upgrade-title {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            color: #ffdd44;
        }
        
        .upgrade-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .upgrade-option {
            background: rgba(30, 30, 60, 0.8);
            border: 2px solid #4a5568;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .upgrade-option:hover {
            border-color: #ffdd44;
            transform: translateY(-2px);
            background: rgba(50, 50, 100, 0.9);
        }
        
        .upgrade-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #ffdd44;
        }
        
        .upgrade-desc {
            font-size: 14px;
            color: #cbd5e0;
        }
        
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.7);
        }
        
        .crosshair::before {
            width: 20px;
            height: 2px;
            top: 9px;
            left: 0;
        }
        
        .crosshair::after {
            width: 2px;
            height: 20px;
            top: 0;
            left: 9px;
        }
        
        .particle {
            position: absolute;
            pointer-events: none;
            opacity: 0;
        }
        
        .screen-shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 0); }
            20%, 40%, 60%, 80% { transform: translate(5px, 0); }
        }
        
        .pulse-effect {
            animation: pulse 1s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div class="ui-overlay">
            <div class="hud">
                <div class="stat-bar">
                    <span>❤️</span>
                    <div class="health-bar">
                        <div class="health-fill" id="healthFill" style="width: 100%;"></div>
                    </div>
                    <span id="healthText">100/100</span>
                </div>
                <div class="stat-bar">
                    <span>⚡</span>
                    <div class="mana-bar">
                        <div class="mana-fill" id="manaFill" style="width: 100%;"></div>
                    </div>
                    <span id="manaText">100/100</span>
                </div>
            </div>
            
            <div class="spell-hud">
                <div class="spell-slot active" data-spell="fireball">🔥</div>
                <div class="spell-slot" data-spell="icebolt">❄️</div>
                <div class="spell-slot" data-spell="lightning">⚡</div>
                <div class="spell-slot" data-spell="teleport">🌀</div>
            </div>
            
            <div class="crosshair"></div>
            
            <div class="screen-message" id="screenMessage">Ready!</div>
            
            <div class="upgrade-menu" id="upgradeMenu">
                <div class="upgrade-title">Choose Your Upgrade</div>
                <div class="upgrade-options" id="upgradeOptions">
                    <!-- Upgrades will be populated here -->
                </div>
            </div>
        </div>
        
        <div class="loading-screen" id="loadingScreen">
            <div class="loading-text">Summoning Arcane Nexus...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import Three.js from CDN
        import * as THREE from 'https://cdn.skypack.dev/three@0.158.0';
        import { OrbitControls } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/controls/OrbitControls.js';
        import { EffectComposer } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'https://cdn.skypack.dev/three@0.158.0/examples/jsm/postprocessing/UnrealBloomPass.js';

        // Game state
        const gameState = {
            player: {
                health: 100,
                maxHealth: 100,
                mana: 100,
                maxMana: 100,
                manaRegen: 2,
                position: new THREE.Vector3(0, 1.6, 0),
                velocity: new THREE.Vector3(),
                onGround: false,
                canJump: true,
                dashCooldown: 0,
                invulnerable: 0
            },
            camera: null,
            scene: null,
            renderer: null,
            composer: null,
            controls: null,
            clock: new THREE.Clock(),
            keys: {},
            mouse: { x: 0, y: 0, down: false },
            activeSpell: 'fireball',
            enemies: [],
            particles: [],
            projectiles: [],
            spells: {
                fireball: {
                    name: 'Fireball',
                    icon: '🔥',
                    manaCost: 20,
                    castTime: 0.3,
                    damage: 30,
                    speed: 20,
                    radius: 1,
                    color: 0xff6600,
                    chargeable: true,
                    chargeMultiplier: 2
                },
                icebolt: {
                    name: 'Ice Bolt',
                    icon: '❄️',
                    manaCost: 15,
                    castTime: 0.2,
                    damage: 25,
                    speed: 25,
                    radius: 0.8,
                    color: 0x44ccff,
                    chargeable: true,
                    slowDuration: 2,
                    slowAmount: 0.5
                },
                lightning: {
                    name: 'Lightning Strike',
                    icon: '⚡',
                    manaCost: 25,
                    castTime: 0.4,
                    damage: 40,
                    speed: 30,
                    radius: 0.5,
                    color: 0xffff44,
                    chainTargets: 3,
                    chainDamage: 0.7
                },
                teleport: {
                    name: 'Arcane Teleport',
                    icon: '🌀',
                    manaCost: 30,
                    castTime: 0.1,
                    damage: 0,
                    speed: 0,
                    radius: 2,
                    color: 0x8844ff,
                    range: 15,
                    cooldown: 2
                }
            },
            wave: 1,
            kills: 0,
            upgrades: [],
            availableUpgrades: [
                { name: 'Arcane Mastery', desc: '+20 Max Mana', effect: () => { gameState.player.maxMana += 20; gameState.player.mana = Math.min(gameState.player.mana + 20, gameState.player.maxMana); updateUI(); } },
                { name: 'Vital Essence', desc: '+30 Max Health', effect: () => { gameState.player.maxHealth += 30; gameState.player.health = Math.min(gameState.player.health + 30, gameState.player.maxHealth); updateUI(); } },
                { name: 'Rapid Casting', desc: '-20% Spell Cast Time', effect: () => { Object.values(gameState.spells).forEach(spell => spell.castTime *= 0.8); } },
                { name: 'Elemental Fury', desc: '+25% Spell Damage', effect: () => { Object.values(gameState.spells).forEach(spell => spell.damage *= 1.25); } },
                { name: 'Mana Flow', desc: '+3 Mana Regeneration', effect: () => { gameState.player.manaRegen += 3; } },
                { name: 'Quick Step', desc: '+30% Movement Speed', effect: () => { /* Implement movement speed boost */ } },
                { name: 'Chain Lightning', desc: 'Lightning chains to +2 targets', effect: () => { gameState.spells.lightning.chainTargets += 2; } },
                { name: 'Explosive Fire', desc: 'Fireballs explode in area', effect: () => { gameState.spells.fireball.explosive = true; } }
            ],
            gameOver: false
        };

        // Initialize game
        async function init() {
            // Setup renderer
            const container = document.getElementById('canvas');
            gameState.renderer = new THREE.WebGLRenderer({ 
                canvas: container,
                antialias: true,
                alpha: true
            });
            gameState.renderer.setSize(window.innerWidth, window.innerHeight);
            gameState.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            gameState.renderer.shadowMap.enabled = true;
            gameState.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // Setup scene
            gameState.scene = new THREE.Scene();
            gameState.scene.background = new THREE.Color(0x0a0a2a);
            gameState.scene.fog = new THREE.Fog(0x0a0a2a, 20, 50);

            // Setup camera
            gameState.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            gameState.camera.position.copy(gameState.player.position);

            // Post-processing
            gameState.composer = new EffectComposer(gameState.renderer);
            const renderPass = new RenderPass(gameState.scene, gameState.camera);
            gameState.composer.addPass(renderPass);
            
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,    // strength
                0.4,    // radius
                0.85    // threshold
            );
            gameState.composer.addPass(bloomPass);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
            gameState.scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 15);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            gameState.scene.add(directionalLight);

            // Create arena
            createArena();

            // Create player hands
            createPlayerHands();

            // Create initial enemies
            spawnEnemies();

            // Event listeners
            setupEventListeners();

            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                showMessage('Wave ' + gameState.wave);
            }, 1000);

            // Start game loop
            animate();
        }

        function createArena() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2a2a4a,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            gameState.scene.add(floor);

            // Arena walls
            const wallHeight = 5;
            const wallThickness = 1;
            const wallColor = 0x3a3a5a;

            // North wall
            const northWall = new THREE.Mesh(
                new THREE.BoxGeometry(50, wallHeight, wallThickness),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            northWall.position.set(0, wallHeight/2, -25);
            northWall.castShadow = true;
            northWall.receiveShadow = true;
            gameState.scene.add(northWall);

            // South wall
            const southWall = new THREE.Mesh(
                new THREE.BoxGeometry(50, wallHeight, wallThickness),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            southWall.position.set(0, wallHeight/2, 25);
            southWall.castShadow = true;
            southWall.receiveShadow = true;
            gameState.scene.add(southWall);

            // East wall
            const eastWall = new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, wallHeight, 50),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            eastWall.position.set(25, wallHeight/2, 0);
            eastWall.castShadow = true;
            eastWall.receiveShadow = true;
            gameState.scene.add(eastWall);

            // West wall
            const westWall = new THREE.Mesh(
                new THREE.BoxGeometry(wallThickness, wallHeight, 50),
                new THREE.MeshStandardMaterial({ color: wallColor })
            );
            westWall.position.set(-25, wallHeight/2, 0);
            westWall.castShadow = true;
            westWall.receiveShadow = true;
            gameState.scene.add(westWall);

            // Decorative pillars
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const radius = 20;
                const pillar = new THREE.Mesh(
                    new THREE.CylinderGeometry(1, 1, 6, 16),
                    new THREE.MeshStandardMaterial({ color: 0x4a4a6a })
                );
                pillar.position.set(Math.cos(angle) * radius, 3, Math.sin(angle) * radius);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                gameState.scene.add(pillar);
            }
        }

        function createPlayerHands() {
            // Simple stylized hands using basic geometry
            const handGroup = new THREE.Group();
            handGroup.position.set(0, -0.2, -0.5);
            
            // Left hand
            const leftHand = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.8, 0.2),
                new THREE.MeshStandardMaterial({ color: 0xddbb99 })
            );
            leftHand.position.set(-0.4, -0.3, 0);
            leftHand.castShadow = true;
            handGroup.add(leftHand);

            // Right hand
            const rightHand = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.8, 0.2),
                new THREE.MeshStandardMaterial({ color: 0xddbb99 })
            );
            rightHand.position.set(0.4, -0.3, 0);
            rightHand.castShadow = true;
            handGroup.add(rightHand);

            // Fingers
            for (let i = 0; i < 4; i++) {
                const fingerOffset = (i - 1.5) * 0.15;
                const leftFinger = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.3, 0.15),
                    new THREE.MeshStandardMaterial({ color: 0xddbb99 })
                );
                leftFinger.position.set(-0.4 + fingerOffset, -0.6, 0.1);
                leftFinger.castShadow = true;
                handGroup.add(leftFinger);

                const rightFinger = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.3, 0.15),
                    new THREE.MeshStandardMaterial({ color: 0xddbb99 })
                );
                rightFinger.position.set(0.4 + fingerOffset, -0.6, 0.1);
                rightFinger.castShadow = true;
                handGroup.add(rightFinger);
            }

            gameState.camera.add(handGroup);
            gameState.scene.add(gameState.camera);
        }

        function spawnEnemies() {
            const enemyCount = Math.min(3 + gameState.wave, 10);
            gameState.enemies = [];

            for (let i = 0; i < enemyCount; i++) {
                const angle = (i / enemyCount) * Math.PI * 2;
                const radius = 15 + Math.random() * 5;
                const enemyType = gameState.wave > 3 ? 'elite' : 'normal';
                
                const enemy = {
                    mesh: createEnemyMesh(enemyType),
                    health: enemyType === 'elite' ? 80 : 40,
                    maxHealth: enemyType === 'elite' ? 80 : 40,
                    position: new THREE.Vector3(
                        Math.cos(angle) * radius,
                        1,
                        Math.sin(angle) * radius
                    ),
                    velocity: new THREE.Vector3(),
                    lastAttack: 0,
                    type: enemyType
                };
                
                enemy.mesh.position.copy(enemy.position);
                gameState.scene.add(enemy.mesh);
                gameState.enemies.push(enemy);
            }
        }

        function createEnemyMesh(type) {
            const group = new THREE.Group();
            
            // Body
            const bodyGeometry = new THREE.SphereGeometry(type === 'elite' ? 1.2 : 0.8, 16, 16);
            const bodyMaterial = new THREE.MeshStandardMaterial({ 
                color: type === 'elite' ? 0xff4444 : 0xaa4444,
                emissive: type === 'elite' ? 0x220000 : 0x110000,
                emissiveIntensity: 0.3
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            group.add(body);

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.15, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.3, 0.2, 0.6);
            group.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.3, 0.2, 0.6);
            group.add(rightEye);

            return group;
        }

        function setupEventListeners() {
            // Keyboard input
            document.addEventListener('keydown', (event) => {
                gameState.keys[event.code] = true;
                
                // Spell selection
                if (event.code === 'Digit1') selectSpell('fireball');
                if (event.code === 'Digit2') selectSpell('icebolt');
                if (event.code === 'Digit3') selectSpell('lightning');
                if (event.code === 'Digit4') selectSpell('teleport');
                
                // Dash
                if (event.code === 'Space' && gameState.player.dashCooldown <= 0) {
                    dash();
                }
            });

            document.addEventListener('keyup', (event) => {
                gameState.keys[event.code] = false;
            });

            // Mouse input
            document.addEventListener('mousedown', (event) => {
                if (event.button === 0) {
                    gameState.mouse.down = true;
                    castSpell();
                }
            });

            document.addEventListener('mouseup', (event) => {
                if (event.button === 0) {
                    gameState.mouse.down = false;
                }
            });

            document.addEventListener('mousemove', (event) => {
                gameState.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                gameState.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            // Window resize
            window.addEventListener('resize', () => {
                gameState.camera.aspect = window.innerWidth / window.innerHeight;
                gameState.camera.updateProjectionMatrix();
                gameState.renderer.setSize(window.innerWidth, window.innerHeight);
                gameState.composer.setSize(window.innerWidth, window.innerHeight);
            });

            // Spell slot clicks
            document.querySelectorAll('.spell-slot').forEach(slot => {
                slot.addEventListener('click', () => {
                    const spell = slot.dataset.spell;
                    selectSpell(spell);
                });
            });
        }

        function selectSpell(spellName) {
            gameState.activeSpell = spellName;
            document.querySelectorAll('.spell-slot').forEach(slot => {
                slot.classList.remove('active');
                if (slot.dataset.spell === spellName) {
                    slot.classList.add('active');
                }
            });
        }

        function castSpell() {
            const spell = gameState.spells[gameState.activeSpell];
            if (!spell || gameState.player.mana < spell.manaCost) return;

            gameState.player.mana -= spell.manaCost;
            updateUI();

            if (gameState.activeSpell === 'teleport') {
                teleport();
                return;
            }

            // Create projectile
            const direction = new THREE.Vector3();
            gameState.camera.getWorldDirection(direction);
            
            const projectile = {
                position: gameState.player.position.clone().add(new THREE.Vector3(0, -0.2, 0)),
                velocity: direction.multiplyScalar(spell.speed),
                damage: spell.damage,
                radius: spell.radius,
                color: spell.color,
                type: gameState.activeSpell,
                life: 5,
                hitTargets: []
            };

            gameState.projectiles.push(projectile);

            // Visual effect
            createSpellVFX(gameState.player.position.clone(), spell.color, spell.type);

            // Hand animation
            animateHands(spell.type);
        }

        function teleport() {
            const direction = new THREE.Vector3();
            gameState.camera.getWorldDirection(direction);
            const targetPos = gameState.player.position.clone().add(direction.multiplyScalar(gameState.spells.teleport.range));
            
            // Check bounds
            targetPos.x = Math.max(-22, Math.min(22, targetPos.x));
            targetPos.z = Math.max(-22, Math.min(22, targetPos.z));
            
            gameState.player.position.copy(targetPos);
            gameState.camera.position.copy(targetPos);
            
            createTeleportVFX(targetPos);
        }

        function createSpellVFX(position, color, type) {
            // Create particle system for spell effect
            const particleCount = type === 'fireball' ? 20 : type === 'lightning' ? 10 : 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.backgroundColor = `#${color.toString(16).padStart(6, '0')}`;
                particle.style.borderRadius = '50%';
                particle.style.left = (position.x * 10 + window.innerWidth / 2) + 'px';
                particle.style.top = (-position.y * 10 + window.innerHeight / 2) + 'px';
                document.querySelector('.ui-overlay').appendChild(particle);
                
                // Animate particle
                setTimeout(() => {
                    particle.style.opacity = '1';
                    particle.style.transform = `translate(${Math.random() * 100 - 50}px, ${Math.random() * 100 - 50}px)`;
                    setTimeout(() => {
                        particle.style.opacity = '0';
                        setTimeout(() => particle.remove(), 500);
                    }, 300);
                }, 10);
            }
        }

        function createTeleportVFX(position) {
            const vfx = document.createElement('div');
            vfx.className = 'particle pulse-effect';
            vfx.style.width = '100px';
            vfx.style.height = '100px';
            vfx.style.backgroundColor = 'rgba(136, 68, 255, 0.3)';
            vfx.style.borderRadius = '50%';
            vfx.style.left = (position.x * 10 + window.innerWidth / 2 - 50) + 'px';
            vfx.style.top = (-position.y * 10 + window.innerHeight / 2 - 50) + 'px';
            document.querySelector('.ui-overlay').appendChild(vfx);
            
            setTimeout(() => vfx.remove(), 1000);
        }

        function animateHands(spellType) {
            // Simple hand animation by temporarily moving hands
            const handGroup = gameState.camera.children[0];
            if (!handGroup) return;
            
            const originalPosition = handGroup.position.clone();
            handGroup.position.y -= 0.2;
            
            setTimeout(() => {
                handGroup.position.copy(originalPosition);
            }, 200);
        }

        function dash() {
            const direction = new THREE.Vector3();
            gameState.camera.getWorldDirection(direction);
            direction.y = 0; // Keep dash horizontal
            
            gameState.player.velocity.add(direction.multiplyScalar(15));
            gameState.player.dashCooldown = 1;
            
            // Dash VFX
            createDashVFX();
        }

        function createDashVFX() {
            const vfx = document.createElement('div');
            vfx.className = 'particle';
            vfx.style.width = '20px';
            vfx.style.height = '20px';
            vfx.style.backgroundColor = 'rgba(100, 200, 255, 0.6)';
            vfx.style.borderRadius = '50%';
            vfx.style.left = (window.innerWidth / 2 - 10) + 'px';
            vfx.style.top = (window.innerHeight / 2 - 10) + 'px';
            document.querySelector('.ui-overlay').appendChild(vfx);
            
            vfx.style.opacity = '1';
            vfx.style.transform = 'scale(2)';
            setTimeout(() => {
                vfx.style.opacity = '0';
                setTimeout(() => vfx.remove(), 500);
            }, 300);
        }

        function updatePhysics(deltaTime) {
            const speed = 8;
            const gravity = 20;
            const friction = 0.9;

            // Movement input
            const moveX = (gameState.keys['KeyD'] ? 1 : 0) + (gameState.keys['KeyA'] ? -1 : 0);
            const moveZ = (gameState.keys['KeyS'] ? 1 : 0) + (gameState.keys['KeyW'] ? -1 : 0);

            if (moveX !== 0 || moveZ !== 0) {
                const direction = new THREE.Vector3(moveX, 0, moveZ);
                direction.normalize();
                
                // Convert to world space based on camera rotation
                const cameraDirection = new THREE.Vector3();
                gameState.camera.getWorldDirection(cameraDirection);
                cameraDirection.y = 0;
                cameraDirection.normalize();
                
                const right = new THREE.Vector3();
                right.crossVectors(cameraDirection, new THREE.Vector3(0, 1, 0));
                
                const forward = cameraDirection.clone();
                const strafe = right.clone();
                
                const velocityChange = new THREE.Vector3();
                velocityChange.add(forward.multiplyScalar(moveZ * speed));
                velocityChange.add(strafe.multiplyScalar(moveX * speed));
                
                gameState.player.velocity.add(velocityChange.multiplyScalar(deltaTime));
            }

            // Apply gravity
            gameState.player.velocity.y -= gravity * deltaTime;

            // Update position
            gameState.player.position.add(gameState.player.velocity.clone().multiplyScalar(deltaTime));

            // Ground collision
            if (gameState.player.position.y < 1.6) {
                gameState.player.position.y = 1.6;
                gameState.player.velocity.y = 0;
                gameState.player.onGround = true;
                gameState.player.canJump = true;
            } else {
                gameState.player.onGround = false;
            }

            // Wall collision
            const bounds = 22;
            if (Math.abs(gameState.player.position.x) > bounds) {
                gameState.player.position.x = Math.sign(gameState.player.position.x) * bounds;
                gameState.player.velocity.x = 0;
            }
            if (Math.abs(gameState.player.position.z) > bounds) {
                gameState.player.position.z = Math.sign(gameState.player.position.z) * bounds;
                gameState.player.velocity.z = 0;
            }

            // Apply friction
            gameState.player.velocity.x *= friction;
            gameState.player.velocity.z *= friction;

            // Update camera position
            gameState.camera.position.copy(gameState.player.position);

            // Update cooldowns
            if (gameState.player.dashCooldown > 0) {
                gameState.player.dashCooldown -= deltaTime;
            }
            
            if (gameState.player.invulnerable > 0) {
                gameState.player.invulnerable -= deltaTime;
            }

            // Mana regeneration
            if (gameState.player.mana < gameState.player.maxMana) {
                gameState.player.mana = Math.min(gameState.player.maxMana, gameState.player.mana + gameState.player.manaRegen * deltaTime);
                updateUI();
            }
        }

        function updateProjectiles(deltaTime) {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const proj = gameState.projectiles[i];
                proj.position.add(proj.velocity.clone().multiplyScalar(deltaTime));
                proj.life -= deltaTime;

                // Check collision with enemies
                for (const enemy of gameState.enemies) {
                    if (proj.hitTargets.includes(enemy)) continue;
                    
                    const distance = proj.position.distanceTo(enemy.position);
                    if (distance < proj.radius + 0.8) {
                        // Hit enemy
                        enemy.health -= proj.damage;
                        proj.hitTargets.push(enemy);
                        
                        // Damage text
                        showDamageText(proj.damage, enemy.position);
                        
                        // Apply effects
                        if (proj.type === 'icebolt') {
                            enemy.slowed = true;
                            enemy.slowDuration = 2;
                        }
                        
                        // Chain lightning
                        if (proj.type === 'lightning' && proj.hitTargets.length < proj.chainTargets) {
                            createChainLightning(proj, enemy);
                        }
                        
                        // Remove projectile if it's a hit-scan or has limited bounces
                        if (proj.type !== 'fireball') {
                            gameState.projectiles.splice(i, 1);
                            break;
                        }
                    }
                }

                // Remove expired projectiles
                if (proj.life <= 0 || proj.position.y < 0) {
                    gameState.projectiles.splice(i, 1);
                }
            }
        }

        function createChainLightning(sourceProj, sourceEnemy) {
            // Find next closest enemy
            let closestEnemy = null;
            let closestDistance = Infinity;
            
            for (const enemy of gameState.enemies) {
                if (sourceProj.hitTargets.includes(enemy)) continue;
                const distance = sourceEnemy.position.distanceTo(enemy.position);
                if (distance < closestDistance && distance < 15) {
                    closestDistance = distance;
                    closestEnemy = enemy;
                }
            }
            
            if (closestEnemy) {
                const chainProj = {
                    position: sourceEnemy.position.clone(),
                    velocity: new THREE.Vector3(),
                    damage: sourceProj.damage * sourceProj.chainDamage,
                    radius: sourceProj.radius,
                    color: sourceProj.color,
                    type: 'lightning',
                    life: 1,
                    hitTargets: [...sourceProj.hitTargets]
                };
                
                gameState.projectiles.push(chainProj);
                sourceProj.hitTargets.push(closestEnemy);
            }
        }

        function updateEnemies(deltaTime) {
            for (const enemy of gameState.enemies) {
                // Move towards player
                const direction = gameState.player.position.clone().sub(enemy.position);
                direction.y = 0;
                direction.normalize();
                
                const speed = enemy.type === 'elite' ? 2 : 3;
                if (enemy.slowed) {
                    speed *= 0.5;
                    enemy.slowDuration -= deltaTime;
                    if (enemy.slowDuration <= 0) {
                        enemy.slowed = false;
                    }
                }
                
                enemy.velocity.lerp(direction.multiplyScalar(speed), 0.1);
                enemy.position.add(enemy.velocity.clone().multiplyScalar(deltaTime));
                enemy.mesh.position.copy(enemy.position);

                // Attack player
                const distanceToPlayer = enemy.position.distanceTo(gameState.player.position);
                if (distanceToPlayer < 2 && Date.now() - enemy.lastAttack > 1000) {
                    enemy.lastAttack = Date.now();
                    takeDamage(enemy.type === 'elite' ? 25 : 15);
                }

                // Remove dead enemies
                if (enemy.health <= 0) {
                    enemy.mesh.parent.remove(enemy.mesh);
                    gameState.enemies.splice(gameState.enemies.indexOf(enemy), 1);
                    gameState.kills++;
                    
                    // Check wave completion
                    if (gameState.enemies.length === 0) {
                        completeWave();
                    }
                }
            }
        }

        function takeDamage(amount) {
            if (gameState.player.invulnerable > 0) return;
            
            gameState.player.health -= amount;
            gameState.player.invulnerable = 1;
            updateUI();
            
            // Screen shake
            document.getElementById('gameContainer').classList.add('screen-shake');
            setTimeout(() => {
                document.getElementById('gameContainer').classList.remove('screen-shake');
            }, 500);
            
            // Damage flash
            const flash = document.createElement('div');
            flash.style.position = 'fixed';
            flash.style.top = '0';
            flash.style.left = '0';
            flash.style.width = '100%';
            flash.style.height = '100%';
            flash.style.backgroundColor = 'rgba(255, 0, 0, 0.3)';
            flash.style.pointerEvents = 'none';
            flash.style.zIndex = '20';
            document.body.appendChild(flash);
            setTimeout(() => flash.remove(), 200);
            
            if (gameState.player.health <= 0) {
                gameOver();
            }
        }

        function showDamageText(amount, position) {
            const damageText = document.createElement('div');
            damageText.className = 'damage-text';
            damageText.textContent = amount;
            damageText.style.left = (position.x * 10 + window.innerWidth / 2 - 20) + 'px';
            damageText.style.top = (-position.y * 10 + window.innerHeight / 2 - 20) + 'px';
            document.querySelector('.ui-overlay').appendChild(damageText);
            
            damageText.style.opacity = '1';
            damageText.style.transform = 'translateY(-30px)';
            setTimeout(() => {
                damageText.style.opacity = '0';
                setTimeout(() => damageText.remove(), 500);
            }, 1000);
        }

        function completeWave() {
            gameState.wave++;
            showMessage('Wave ' + gameState.wave + ' Complete!');
            
            // Show upgrade menu
            showUpgradeMenu();
        }

        function showUpgradeMenu() {
            const menu = document.getElementById('upgradeMenu');
            const optionsContainer = document.getElementById('upgradeOptions');
            optionsContainer.innerHTML = '';
            
            // Select 3 random upgrades
            const available = [...gameState.availableUpgrades];
            const selected = [];
            for (let i = 0; i < 3 && available.length > 0; i++) {
                const index = Math.floor(Math.random() * available.length);
                selected.push(available[index]);
                available.splice(index, 1);
            }
            
            selected.forEach(upgrade => {
                const option = document.createElement('div');
                option.className = 'upgrade-option';
                option.innerHTML = `
                    <div class="upgrade-name">${upgrade.name}</div>
                    <div class="upgrade-desc">${upgrade.desc}</div>
                `;
                option.addEventListener('click', () => {
                    upgrade.effect();
                    menu.style.display = 'none';
                    spawnEnemies();
                });
                optionsContainer.appendChild(option);
            });
            
            menu.style.display = 'block';
        }

        function gameOver() {
            gameState.gameOver = true;
            showMessage('Game Over! Final Wave: ' + gameState.wave, 3000);
            
            // Restart after delay
            setTimeout(() => {
                resetGame();
            }, 4000);
        }

        function resetGame() {
            gameState.player.health = 100;
            gameState.player.maxHealth = 100;
            gameState.player.mana = 100;
            gameState.player.maxMana = 100;
            gameState.player.manaRegen = 2;
            gameState.player.position.set(0, 1.6, 0);
            gameState.player.velocity.set(0, 0, 0);
            gameState.player.onGround = false;
            gameState.player.canJump = true;
            gameState.player.dashCooldown = 0;
            gameState.player.invulnerable = 0;
            
            gameState.activeSpell = 'fireball';
            gameState.wave = 1;
            gameState.kills = 0;
            gameState.upgrades = [];
            gameState.enemies = [];
            gameState.projectiles = [];
            gameState.gameOver = false;
            
            // Clear scene
            while(gameState.scene.children.length > 0) { 
                gameState.scene.remove(gameState.scene.children[0]); 
            }
            
            // Recreate arena and setup
            createArena();
            createPlayerHands();
            spawnEnemies();
            updateUI();
            
            showMessage('New Run Started!');
        }

        function updateUI() {
            const healthPercent = (gameState.player.health / gameState.player.maxHealth) * 100;
            const manaPercent = (gameState.player.mana / gameState.player.maxMana) * 100;
            
            document.getElementById('healthFill').style.width = healthPercent + '%';
            document.getElementById('manaFill').style.width = manaPercent + '%';
            document.getElementById('healthText').textContent = Math.ceil(gameState.player.health) + '/' + gameState.player.maxHealth;
            document.getElementById('manaText').textContent = Math.ceil(gameState.player.mana) + '/' + gameState.player.maxMana;
        }

        function showMessage(text, duration = 2000) {
            const message = document.getElementById('screenMessage');
            message.textContent = text;
            message.style.opacity = '1';
            setTimeout(() => {
                message.style.opacity = '0';
            }, duration);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            if (gameState.gameOver) return;
            
            const deltaTime = Math.min(gameState.clock.getDelta(), 0.1);
            
            updatePhysics(deltaTime);
            updateProjectiles(deltaTime);
            updateEnemies(deltaTime);
            
            gameState.composer.render();
        }

        // Start the game when loaded
        window.addEventListener('load', init);
    </script>
</body>
</html>
