<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER VOID - Spellfront Roguelite</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020205; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; }
        canvas { display: block; }
        .hud-overlay { pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; }
        .crosshair::before { content: ''; position: absolute; top: -5px; left: 50%; width: 1px; height: 10px; background: rgba(255,255,255,0.5); }
        .crosshair::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 4px; height: 4px; background: #60a5fa; border-radius: 50%; box-shadow: 0 0 10px #60a5fa; }
        
        .mana-bar-inner { transition: width 0.1s ease-out; box-shadow: 0 0 20px rgba(96, 165, 250, 0.8); }
        .health-bar-inner { transition: width 0.3s ease-in-out; box-shadow: 0 0 20px rgba(239, 68, 68, 0.8); }
        .damage-flash { position: absolute; inset: 0; background: rgba(255,0,0,0); pointer-events: none; z-index: 50; transition: background 0.1s; }
        .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 150px rgba(0,0,0,1); pointer-events: none; }
        
        .spell-icon { 
            width: 60px; height: 60px; 
            border: 2px solid rgba(255,255,255,0.1); 
            background: rgba(10, 10, 30, 0.8); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-size: 10px; font-weight: 800; 
            border-radius: 12px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spell-active { 
            border-color: #60a5fa; 
            box-shadow: 0 0 25px rgba(96, 165, 250, 0.6); 
            transform: translateY(-10px) scale(1.1);
            background: rgba(30, 60, 120, 0.9);
        }
        .essence-glow { text-shadow: 0 0 15px rgba(168, 85, 247, 0.8); }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <!-- UI Overlays -->
    <div id="ui-root" class="hud-overlay">
        <!-- Main Menu -->
        <div id="menu-screen" class="flex flex-col items-center justify-center h-full bg-black/80 pointer-events-auto">
            <h1 class="text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 mb-4 tracking-tighter">AETHER VOID</h1>
            <p class="text-blue-300 mb-8 tracking-widest uppercase text-sm">Stylized Arcane Combat</p>
            <button id="start-btn" class="px-12 py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-full transition-all transform hover:scale-110 shadow-lg shadow-blue-500/50 cursor-pointer">BEGIN THE RITUAL</button>
            <div class="mt-12 grid grid-cols-3 gap-8 text-center text-xs text-gray-400">
                <div><span class="block text-white font-bold mb-1">WASD</span>Movement</div>
                <div><span class="block text-white font-bold mb-1">MOUSE1</span>Primary Cast</div>
                <div><span class="block text-white font-bold mb-1">SHIFT</span>Aether Dash</div>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden h-full flex flex-col justify-between p-8">
            <div class="flex justify-between items-start">
                <div class="flex flex-col gap-2">
                    <div class="w-64 h-4 bg-gray-900 border border-white/20 rounded-full overflow-hidden">
                        <div id="health-bar" class="health-bar-inner h-full bg-gradient-to-r from-red-600 to-pink-500" style="width: 100%"></div>
                    </div>
                    <div class="w-48 h-2 bg-gray-900 border border-white/10 rounded-full overflow-hidden">
                        <div id="mana-bar" class="mana-bar-inner h-full bg-gradient-to-r from-blue-500 to-cyan-400" style="width: 100%"></div>
                    </div>
                </div>
                <div class="text-right">
                    <div id="score" class="text-3xl font-black text-white essence-glow">ESSENCE: 0</div>
                    <div id="level-text" class="text-blue-400 text-sm font-mono uppercase tracking-widest mt-1">Adept Level 1</div>
                </div>
            </div>

            <div class="crosshair"></div>
            
            <div class="flex justify-center items-end gap-4 pb-4">
                <div id="spell-1" class="spell-icon spell-active">1<br>BOLT</div>
                <div id="spell-2" class="spell-icon">2<br>NOVA</div>
                <div id="spell-3" class="spell-icon">3<br>SURGE</div>
            </div>
        </div>

        <!-- Upgrade Screen -->
        <div id="upgrade-screen" class="hidden flex flex-col items-center justify-center h-full bg-black/60 pointer-events-auto backdrop-blur-sm">
            <h2 class="text-4xl font-bold mb-8 text-blue-300">EVOLVE YOUR MAGIC</h2>
            <div id="upgrade-options" class="flex gap-6">
                <!-- Perks generated here -->
            </div>
        </div>

        <!-- Death Screen -->
        <div id="death-screen" class="hidden flex flex-col items-center justify-center h-full bg-red-900/40 pointer-events-auto backdrop-blur-md">
            <h2 class="text-6xl font-black mb-4">DEFEATED</h2>
            <p id="death-stat" class="mb-8 text-xl">You collected 0 essence before returning to the void.</p>
            <button onclick="location.reload()" class="px-8 py-3 bg-white text-black font-bold rounded-full hover:bg-gray-200 transition-transform hover:scale-105">REAWAKEN</button>
        </div>
    </div>

    <div id="damage-flash" class="damage-flash"></div>
    <div class="vignette"></div>

    <script>
        // --- GAME CONFIG & STATE ---
        const CONFIG = {
            movementSpeed: 0.12,
            jumpForce: 0.18,
            gravity: 0.007,
            dashForce: 0.7,
            dashCooldown: 800,
            enemySpawnRate: 2500,
            maxHealth: 100,
            maxMana: 100,
            manaRegen: 0.3
        };

        let state = {
            playing: false,
            score: 0,
            level: 1,
            health: 100,
            mana: 100,
            spells: [
                { name: 'Arcane Bolt', cost: 5, damage: 25, cd: 150, lastUsed: 0 },
                { name: 'Aura Blast', cost: 40, damage: 80, cd: 3000, lastUsed: 0 },
                { name: 'Glacier Spike', cost: 20, damage: 45, cd: 1000, lastUsed: 0 }
            ],
            currentSpellIdx: 0,
            upgrades: [],
            enemiesKilled: 0
        };

        // --- CORE THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050508);
        scene.fog = new THREE.FogExp2(0x050508, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('game-container').appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x4040ff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        // --- PLAYER / MOVEMENT ---
        const player = {
            pos: new THREE.Vector3(0, 0, 0),
            vel: new THREE.Vector3(),
            dir: new THREE.Vector3(),
            pitch: 0,
            yaw: 0,
            onGround: false,
            canDash: true,
            hands: null
        };

        const playerGroup = new THREE.Group();
        playerGroup.position.copy(player.pos);
        scene.add(playerGroup);
        playerGroup.add(camera);

        function createHands() {
            const handsGroup = new THREE.Group();
            const mat = new THREE.MeshToonMaterial({ color: 0x5588ff });
            
            // Stylized segmented hands
            const createHand = (side) => {
                const g = new THREE.Group();
                const palm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.05, 0.2), mat);
                g.add(palm);
                // Fingers
                for(let i=0; i<3; i++) {
                    const f = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.15), mat);
                    f.position.set(-0.05 + i*0.05, 0, -0.15);
                    g.add(f);
                }
                g.position.set(side * 0.4, -0.3, -0.6);
                return g;
            };

            const left = createHand(-1);
            const right = createHand(1);
            handsGroup.add(left, right);
            camera.add(handsGroup);
            player.hands = { group: handsGroup, left, right };
        }
        createHands();

        // --- ENVIRONMENT ---
        function createWorld() {
            // Floor
            const floorGeo = new THREE.PlaneGeometry(300, 300);
            const floorMat = new THREE.MeshPhongMaterial({ 
                color: 0x050510,
                shininess: 20,
                specular: 0x5500ff
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const grid = new THREE.GridHelper(300, 60, 0x6600ff, 0x110022);
            grid.position.y = 0.05;
            scene.add(grid);

            // Walls
            const wallMat = new THREE.MeshToonMaterial({ color: 0x080815 });
            const createWall = (x, z, w, h, rot) => {
                const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, 2), wallMat);
                wall.position.set(x, h/2, z);
                wall.rotation.y = rot;
                wall.receiveShadow = true;
                scene.add(wall);
            };
            createWall(0, 150, 300, 60, 0);
            createWall(0, -150, 300, 60, 0);
            createWall(150, 0, 300, 60, Math.PI/2);
            createWall(-150, 0, 300, 60, Math.PI/2);

            // Floating "Aether" Stars
            const starsGeo = new THREE.BufferGeometry();
            const starPoints = [];
            for(let i=0; i<2000; i++) {
                starPoints.push((Math.random()-0.5)*400, Math.random()*100, (Math.random()-0.5)*400);
            }
            starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPoints, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xaaaaff, size: 0.2 });
            const stars = new THREE.Points(starsGeo, starsMat);
            scene.add(stars);

            // Pillars and obstacles
            for(let i=0; i<25; i++) {
                const size = 2 + Math.random() * 4;
                const p = new THREE.Mesh(new THREE.BoxGeometry(size, 20 + Math.random()*20, size), wallMat);
                p.position.set((Math.random()-0.5)*200, 10, (Math.random()-0.5)*200);
                p.castShadow = true;
                p.receiveShadow = true;
                scene.add(p);
            }
        }
        createWorld();

        // --- SPELLS & VFX ---
        const projectiles = [];
        const particles = [];

        class Projectile {
            constructor(pos, dir, type) {
                this.pos = pos.clone();
                this.dir = dir.clone().normalize();
                this.type = type; 
                this.life = 120;
                
                const spell = state.spells[type];
                this.speed = type === 0 ? 1.2 : (type === 1 ? 0.4 : 0.8);
                
                const colors = [0x4488ff, 0xff00ff, 0x00ffcc];
                const sizes = [0.2, 0.8, 0.4];
                
                const geo = type === 2 ? new THREE.ConeGeometry(0.2, 0.6, 4) : new THREE.SphereGeometry(sizes[type], 8, 8);
                const mat = new THREE.MeshBasicMaterial({ 
                    color: colors[type],
                    transparent: true,
                    opacity: 0.9
                });
                
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(this.pos);
                if (type === 2) this.mesh.rotation.x = Math.PI/2;
                scene.add(this.mesh);

                this.light = new THREE.PointLight(colors[type], 2, 8);
                this.mesh.add(this.light);
            }

            update() {
                this.pos.add(this.dir.clone().multiplyScalar(this.speed));
                this.mesh.position.copy(this.pos);
                this.life--;

                // Ground Impact
                if (this.pos.y < 0.1) {
                    if (this.type === 1) { // Aura Blast does AOE on impact
                        enemies.forEach(e => {
                            if (this.pos.distanceTo(e.group.position) < 8) e.damage(state.spells[1].damage);
                        });
                    }
                    this.life = 0;
                }
                
                // Enemy Collision
                enemies.forEach(enemy => {
                    const dist = this.pos.distanceTo(enemy.group.position);
                    if (dist < 2) {
                        if (this.type === 1) { // AOE Blast
                            enemies.forEach(e => {
                                if (this.pos.distanceTo(e.group.position) < 6) e.damage(state.spells[1].damage);
                            });
                        } else {
                            enemy.damage(state.spells[this.type].damage);
                        }
                        this.life = 0;
                        createExplosion(this.pos, state.spells[this.type].name);
                    }
                });

                if (this.life <= 0) {
                    createExplosion(this.pos, state.spells[this.type].name);
                    scene.remove(this.mesh);
                    return false;
                }
                return true;
            }
        }

        function createExplosion(pos, type) {
            const count = 10;
            for(let i=0; i<count; i++) {
                particles.push(new Particle(pos, type));
            }
        }

        class Particle {
            constructor(pos, type) {
                const colors = { 'Arcane Bolt': 0x00ffff, 'Aura Blast': 0xff00ff, 'Glacier Spike': 0x00ffaa };
                const color = colors[type] || 0xffffff;
                
                // Use different shapes based on spell
                const geo = type === 'Glacier Spike' ? new THREE.TetrahedronGeometry(0.15) : new THREE.BoxGeometry(0.1, 0.1, 0.1);
                const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
                this.mesh = new THREE.Mesh(geo, mat);
                this.mesh.position.copy(pos);
                scene.add(this.mesh);
                
                const speed = type === 'Aura Blast' ? 0.6 : 0.4;
                this.vel = new THREE.Vector3(
                    (Math.random()-0.5) * speed,
                    (Math.random()-0.5) * speed,
                    (Math.random()-0.5) * speed
                );
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
            }
            update() {
                this.mesh.position.add(this.vel);
                this.vel.y -= 0.005; // Gravity on particles
                this.life -= this.decay;
                this.mesh.scale.setScalar(Math.max(0.01, this.life));
                this.mesh.rotation.x += 0.1;
                this.mesh.rotation.y += 0.1;
                
                if (this.life <= 0) {
                    scene.remove(this.mesh);
                    return false;
                }
                return true;
            }
        }

        // --- ENEMIES ---
        const enemies = [];
        class Enemy {
            constructor(pos) {
                this.health = 50 + (state.level * 15);
                this.group = new THREE.Group();
                this.group.position.copy(pos);
                scene.add(this.group);
                
                // Core
                const coreGeo = new THREE.IcosahedronGeometry(0.8, 0);
                const coreMat = new THREE.MeshToonMaterial({ color: 0xff0066, emissive: 0xff0066, emissiveIntensity: 0.5 });
                this.mesh = new THREE.Mesh(coreGeo, coreMat);
                this.group.add(this.mesh);

                // Orbiting shards
                this.shards = [];
                for(let i=0; i<4; i++) {
                    const sGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
                    const sMat = new THREE.MeshToonMaterial({ color: 0x440044 });
                    const s = new THREE.Mesh(sGeo, sMat);
                    this.group.add(s);
                    this.shards.push(s);
                }
                
                this.bob = Math.random() * Math.PI * 2;
            }

            damage(amount) {
                this.health -= amount;
                gsap.to(this.mesh.scale, { x: 1.4, y: 1.4, z: 1.4, duration: 0.1, yoyo: true, repeat: 1 });
                if (this.health <= 0) this.die();
            }

            die() {
                state.score += 15;
                state.enemiesKilled++;
                updateHUD();
                createExplosion(this.group.position, 'Aura Blast');
                scene.remove(this.group);
                enemies.splice(enemies.indexOf(this), 1);
                
                if (state.enemiesKilled % 5 === 0) showUpgrade();
            }

            update() {
                const distToPlayer = this.group.position.distanceTo(playerGroup.position);
                const dir = new THREE.Vector3().subVectors(playerGroup.position, this.group.position);
                dir.y = 0;
                
                if (distToPlayer > 3) {
                    dir.normalize().multiplyScalar(0.06 + (state.level * 0.005));
                    this.group.position.add(dir);
                } else {
                    if (Math.random() < 0.02) takeDamage(8);
                }

                this.bob += 0.05;
                this.group.position.y = 1.5 + Math.sin(this.bob) * 0.3;
                this.mesh.rotation.y += 0.05;
                this.mesh.rotation.x += 0.03;

                this.shards.forEach((s, i) => {
                    const t = this.bob + (i * Math.PI/2);
                    s.position.set(Math.cos(t)*1.5, Math.sin(t*0.5)*1.5, Math.sin(t)*1.5);
                    s.rotation.set(t, t, t);
                });
            }
        }

        function spawnEnemy() {
            if (!state.playing) return;
            if (enemies.length < 15 + (state.level * 2)) {
                const angle = Math.random() * Math.PI * 2;
                const dist = 30 + Math.random() * 30;
                const pos = new THREE.Vector3(
                    Math.cos(angle) * dist,
                    2,
                    Math.sin(angle) * dist
                );
                enemies.push(new Enemy(pos));
            }
            setTimeout(spawnEnemy, Math.max(800, CONFIG.enemySpawnRate - (state.level * 250)));
        }

        // --- INPUTS ---
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Digit1') switchSpell(0);
            if (e.code === 'Digit2') switchSpell(1);
            if (e.code === 'Digit3') switchSpell(2);
            if (e.code === 'KeyQ') switchSpell((state.currentSpellIdx + 2) % 3);
            if (e.code === 'KeyE') switchSpell((state.currentSpellIdx + 1) % 3);
            if (e.code === 'ShiftLeft' && player.canDash) dash();
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);
        window.addEventListener('mousemove', (e) => {
            if (!state.playing) return;
            player.yaw -= e.movementX * 0.002;
            player.pitch -= e.movementY * 0.002;
            player.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, player.pitch));
        });
        window.addEventListener('mousedown', () => {
            if (state.playing) castSpell();
        });

        function switchSpell(idx) {
            state.currentSpellIdx = idx;
            document.querySelectorAll('.spell-icon').forEach((el, i) => {
                el.classList.toggle('spell-active', i === idx);
            });
        }

        function dash() {
            player.canDash = false;
            const dashDir = new THREE.Vector3(0, 0, -1).applyQuaternion(playerGroup.quaternion);
            player.vel.add(dashDir.multiplyScalar(CONFIG.dashForce));
            
            // UI feedback
            gsap.to(camera, { fov: 90, duration: 0.2, yoyo: true, repeat: 1, onUpdate: () => camera.updateProjectionMatrix() });
            
            setTimeout(() => player.canDash = true, CONFIG.dashCooldown);
        }

        function castSpell() {
            const spell = state.spells[state.currentSpellIdx];
            const now = Date.now();
            if (now - spell.lastUsed < spell.cd || state.mana < spell.cost) return;

            state.mana -= spell.cost;
            spell.lastUsed = now;
            updateHUD();

            // Projectile direction
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
            projectiles.push(new Projectile(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)), dir, state.currentSpellIdx));

            // Animation
            const hand = state.currentSpellIdx % 2 === 0 ? player.hands.right : player.hands.left;
            gsap.to(hand.position, { z: -0.8, duration: 0.1, yoyo: true, repeat: 1 });
            
            // Screen shake
            gsap.to(camera.position, { x: (Math.random()-0.5)*0.1, y: (Math.random()-0.5)*0.1, duration: 0.05, yoyo: true, repeat: 3, onComplete: () => camera.position.set(0,0,0) });
        }

        function takeDamage(amt) {
            state.health -= amt;
            updateHUD();
            document.getElementById('damage-flash').style.background = 'rgba(255,0,0,0.3)';
            setTimeout(() => document.getElementById('damage-flash').style.background = 'rgba(255,0,0,0)', 100);
            
            if (state.health <= 0) die();
        }

        function updateHUD() {
            document.getElementById('health-bar').style.width = (state.health / CONFIG.maxHealth * 100) + '%';
            document.getElementById('mana-bar').style.width = (state.mana / CONFIG.maxMana * 100) + '%';
            document.getElementById('score').innerText = `ESSENCE: ${state.score}`;
            document.getElementById('level-text').innerText = `Adept Level ${state.level}`;
        }

        function showUpgrade() {
            state.playing = false;
            document.exitPointerLock();
            document.getElementById('upgrade-screen').classList.remove('hidden');
            
            const options = [
                { title: 'Arcane Reach', desc: '+20% Projectile Speed', effect: () => {} },
                { title: 'Essence Siphon', desc: 'Mana regen +50%', effect: () => CONFIG.manaRegen *= 1.5 },
                { title: 'Aether Flow', desc: 'Dash cooldown -30%', effect: () => CONFIG.dashCooldown *= 0.7 }
            ];
            
            const container = document.getElementById('upgrade-options');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'w-48 p-6 bg-blue-900/40 border border-blue-400/30 rounded-xl hover:bg-blue-600/50 cursor-pointer transition-all hover:scale-105';
                btn.innerHTML = `<h3 class="font-bold mb-2">${opt.title}</h3><p class="text-xs text-blue-200">${opt.desc}</p>`;
                btn.onclick = () => {
                    opt.effect();
                    state.level++;
                    document.getElementById('upgrade-screen').classList.add('hidden');
                    resumeGame();
                };
                container.appendChild(btn);
            });
        }

        function resumeGame() {
            state.playing = true;
            document.getElementById('game-container').requestPointerLock();
        }

        function die() {
            state.playing = false;
            document.exitPointerLock();
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('death-screen').classList.remove('hidden');
            document.getElementById('death-stat').innerText = `You collected ${state.score} essence before returning to the void.`;
        }

        // --- MAIN LOOP ---
        function update() {
            if (!state.playing) {
                renderer.render(scene, camera);
                requestAnimationFrame(update);
                return;
            }

            // Movement Logic
            const moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;
            
            moveDir.normalize().applyQuaternion(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), player.yaw));
            player.vel.x += moveDir.x * CONFIG.movementSpeed;
            player.vel.z += moveDir.z * CONFIG.movementSpeed;

            // Jumping
            if (keys['Space'] && player.onGround) {
                player.vel.y = CONFIG.jumpForce;
                player.onGround = false;
            }

            // Gravity
            player.vel.y -= CONFIG.gravity;
            player.pos.add(player.vel);

            // Ground collision
            if (player.pos.y < 0) {
                player.pos.y = 0;
                player.vel.y = 0;
                player.onGround = true;
            }

            // Friction
            player.vel.x *= 0.85;
            player.vel.z *= 0.85;
            
            playerGroup.position.copy(player.pos);
            playerGroup.position.y += 1.8; // Camera height
            playerGroup.rotation.y = player.yaw;
            camera.rotation.x = player.pitch;

            // Mana Regen
            if (state.mana < CONFIG.maxMana) state.mana = Math.min(CONFIG.maxMana, state.mana + CONFIG.manaRegen);
            updateHUD();

            // Hands Sway & Bobbing
            const time = Date.now() * 0.005;
            const isMoving = Math.abs(player.vel.x) > 0.01 || Math.abs(player.vel.z) > 0.01;
            const bob = isMoving ? Math.sin(time * 2) * 0.02 : Math.sin(time * 0.5) * 0.005;
            const sway = isMoving ? Math.cos(time) * 0.02 : 0;
            
            player.hands.group.position.set(sway, bob - 0.1, 0.1);
            player.hands.left.rotation.x = Math.sin(time) * 0.1;
            player.hands.right.rotation.x = Math.cos(time) * 0.1;

            // Update entities
            for (let i = projectiles.length - 1; i >= 0; i--) {
                if (!projectiles[i].update()) projectiles.splice(i, 1);
            }
            for (let i = particles.length - 1; i >= 0; i--) {
                if (!particles[i].update()) particles.splice(i, 1);
            }
            enemies.forEach(e => e.update());

            renderer.render(scene, camera);
            requestAnimationFrame(update);
        }

        // --- START GAME ---
        document.getElementById('start-btn').onclick = () => {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            resumeGame();
            spawnEnemy();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        update();
    </script>
</body>
</html>
