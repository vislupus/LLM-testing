<!DOCTYPE html>
<html lang="en">
<head>

<title>AETHERBOUND — Trials of the Hollow Spire</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060d; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  #game { position:absolute; inset:0; display:block; }
  #hud { position:absolute; inset:0; pointer-events:none; z-index:10; }
  .panel { position:absolute; pointer-events:none; }
  .glass {
    background: linear-gradient(160deg, rgba(20,24,48,0.72), rgba(10,12,26,0.55));
    border:1px solid rgba(150,190,255,0.22);
    backdrop-filter: blur(8px);
    border-radius:14px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:64px; height:64px; }
  #chargeRing { position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px; border-radius:50%;
    border:3px solid #6de3ff; opacity:0; box-shadow:0 0 26px currentColor, inset 0 0 22px currentColor;
    transition:opacity .1s; pointer-events:none; }
  #chargeTxt { position:absolute; left:50%; top:calc(50% + 66px); transform:translateX(-50%); font-size:12px; font-weight:900;
    letter-spacing:.2em; color:#dff6ff; text-shadow:0 0 12px #00d0ff; opacity:0; }
  .handAura { position:absolute; width:180px; height:180px; border-radius:50%; filter:blur(28px); opacity:0; }

  .ch-dot { position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%; background:#dff3ff; box-shadow:0 0 10px #6fd8ff, 0 0 20px rgba(111,216,255,0.6); }
  .ch-arm { position:absolute; left:50%; top:50%; width:2px; height:11px; margin-left:-1px; background:linear-gradient(#cdefff,#7fd9ff); border-radius:2px; opacity:.85; }

  #vitals { left:22px; bottom:22px; width:340px; padding:12px 14px; }
  .barwrap { position:relative; height:17px; border-radius:9px; background:rgba(0,0,0,0.5); overflow:hidden; border:1px solid rgba(255,255,255,0.14); }
  .barfill { position:absolute; inset:0; transform-origin:left center; transition: transform .12s linear; }
  .barlbl { position:absolute; inset:0; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; display:flex; align-items:center; justify-content:center; color:#fff; text-shadow:0 1px 3px #000; }
  #hpFill { background: linear-gradient(90deg,#ff4d6d,#ff8f5e,#ffd166); }
  #manaFill { background: linear-gradient(90deg,#4a7bff,#67e8f9,#a78bfa); }
  #xpFill { background: linear-gradient(90deg,#a78bfa,#f0abfc); }
  #handPanel { right:22px; bottom:22px; width:290px; padding:12px; pointer-events:none; }
  .spellSlot { display:flex; gap:10px; align-items:center; padding:7px 9px; border-radius:11px; margin-bottom:7px; border:1px solid rgba(255,255,255,0.10); background:rgba(255,255,255,0.04); position:relative; overflow:hidden; }
  .spellSlot.active { border-color:rgba(255,255,255,0.55); background:rgba(255,255,255,0.11); box-shadow:0 0 18px rgba(120,200,255,0.35) inset; }
  .spellIcon { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:20px; flex:0 0 auto; box-shadow:0 0 14px rgba(0,0,0,.5) inset, 0 0 10px currentColor; }
  .spellName { font-size:12px; font-weight:800; letter-spacing:.06em; color:#eaf4ff; }
  .spellMeta { font-size:9.5px; color:#93a6c9; letter-spacing:.09em; text-transform:uppercase; }
  .cdOverlay { position:absolute; left:0; bottom:0; width:100%; background:rgba(5,8,20,0.72); transition:height .05s linear; }
  #topbar { left:50%; top:14px; transform:translateX(-50%); display:flex; gap:10px; align-items:center; }
  .chip { padding:7px 13px; border-radius:11px; font-size:12px; font-weight:800; letter-spacing:.1em; color:#dceaff; }
  #spireInfo { left:22px; top:22px; width:280px; padding:11px 13px; }
  #miniMap { right:22px; top:22px; width:150px; height:150px; border-radius:12px; }
  #abilityRow { left:50%; bottom:22px; transform:translateX(-50%); display:flex; gap:9px; }
  .ability { width:56px; height:56px; border-radius:13px; display:grid; place-items:center; font-size:10px; font-weight:800; color:#cfe6ff; letter-spacing:.06em; position:relative; overflow:hidden; text-align:center }
  .ability .k { position:absolute; top:3px; left:5px; font-size:9px; color:#8ea6cc; }
  #comboText { position:absolute; left:50%; top:60%; transform:translateX(-50%); font-size:26px; font-weight:900; letter-spacing:.1em; color:#ffe9a8; text-shadow:0 0 22px #ff9d00; opacity:0; }
  #bigMsg { position:absolute; left:50%; top:32%; transform:translate(-50%,-50%); text-align:center; opacity:0; }
  #bigMsg h1 { font-size:44px; font-weight:900; letter-spacing:.2em; color:#fff; text-shadow:0 0 30px #62d8ff, 0 0 60px rgba(120,80,255,.8); }
  #bigMsg p { font-size:13px; letter-spacing:.3em; color:#a8c6ee; margin-top:6px; text-transform:uppercase; }
  #dmgFlash { position:absolute; inset:0; opacity:0; background:radial-gradient(circle at center, transparent 35%, rgba(255,40,60,0.62) 100%); }
  #healFlash { position:absolute; inset:0; opacity:0; background:radial-gradient(circle at center, transparent 40%, rgba(90,255,170,0.42) 100%); }
  #pickupToast { position:absolute; left:50%; bottom:170px; transform:translateX(-50%); display:flex; flex-direction:column; gap:6px; align-items:center;}

  #overlay { position:absolute; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, rgba(24,20,58,0.86), rgba(3,4,12,0.96)); }
  #overlay.hide { display:none; }
  .card { width:min(1080px, 94vw); max-height:92vh; overflow-y:auto; padding:26px 30px; }
  h2.title { font-size:34px; font-weight:900; letter-spacing:.16em; color:#fff; text-shadow:0 0 30px #6ad6ff; }
  .sub { color:#9fb6da; font-size:13px; letter-spacing:.16em; text-transform:uppercase; }
  .upgradeGrid { display:grid; grid-template-columns: repeat(auto-fill,minmax(230px,1fr)); gap:13px; margin-top:16px; }
  .upCard { cursor:pointer; padding:14px; border-radius:14px; border:1px solid rgba(150,190,255,0.24); background:linear-gradient(155deg,rgba(30,34,70,.85),rgba(12,14,32,.9)); pointer-events:auto; transition:.16s; position:relative; overflow:hidden;}
  .upCard:hover { transform:translateY(-4px); border-color:rgba(255,255,255,.65); box-shadow:0 12px 34px rgba(90,150,255,.35); }
  .upCard .rar { position:absolute; top:0; left:0; height:3px; width:100%; }
  .upCard h3 { font-size:15px; font-weight:800; color:#eef6ff; margin:7px 0 5px; }
  .upCard p { font-size:12px; color:#a9bcdd; line-height:1.5; }
  .upCard .tagrow { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap }
  .tag { font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:3px 7px; border-radius:6px; background:rgba(255,255,255,.09); color:#bcd3f2; }
  .btn { pointer-events:auto; cursor:pointer; padding:12px 26px; border-radius:12px; border:1px solid rgba(160,220,255,.5); background:linear-gradient(120deg,#2b3fa8,#6d3bd6); color:#fff; font-weight:800; letter-spacing:.14em; font-size:13px; transition:.16s; text-transform:uppercase;}
  .btn:hover { filter:brightness(1.25); transform:translateY(-2px); box-shadow:0 10px 26px rgba(110,80,255,.5); }
  .btn.ghost { background:rgba(255,255,255,.07); }
  kbd { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22); border-radius:5px; padding:1px 6px; font-size:11px; font-family:inherit; font-weight:700; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; }
  .syn { font-size:11.5px; color:#8fd8ff; }
  .list li { font-size:12.5px; color:#b6c8e6; margin:4px 0 4px 16px; line-height:1.5 }
  #dmgNumbers { position:absolute; inset:0; }
  .dnum { position:absolute; font-weight:900; font-size:17px; text-shadow:0 2px 6px #000, 0 0 14px currentColor; pointer-events:none; }
  .scroll::-webkit-scrollbar{width:8px} .scroll::-webkit-scrollbar-thumb{background:rgba(150,190,255,.3);border-radius:8px}
  .statgrid { display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px }
  .statbox { padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1) }
  .statbox b { display:block;font-size:16px;color:#fff }
  .statbox span { font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#93a6c9 }
  .fadeUi { transition:opacity .35s; }
</style>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/" } }

<script type="module">
import * as THREE from 'three';

/* ============================================================
   AETHERBOUND — original stylized FPS magic roguelite
   All art generated procedurally. No external assets.
   ============================================================ */

const CFG = {
  gravity: 26, moveSpeed: 15.2, airControl: 0.42, accel: 62, friction: 11,
  jumpVel: 9.6, dashSpeed: 34, dashTime: 0.19, dashCd: 0.62, dashCost: 12,
  maxAirDashes: 1, playerHeight: 1.75, radius: 0.42, maxHp: 100, maxMana: 100,
  manaRegen: 15, manaDelay: 0.55, critMult: 2.1,
};

const rnd=(a,b)=>a+Math.random()*(b-a);
const rndi=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

/* ---------------- Renderer / Scene ---------------- */
const canvas=document.getElementById('game');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.85));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.02;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x140f2e, 0.017);
const camera=new THREE.PerspectiveCamera(79, innerWidth/innerHeight, 0.06, 400);

/* ---- Sky dome (custom shader) ---- */
const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false,
  uniforms:{ uTop:{value:new THREE.Color(0x3a2a86)}, uMid:{value:new THREE.Color(0x7c4bd4)}, uBot:{value:new THREE.Color(0x140d2c)}, uTime:{value:0}, uTint:{value:new THREE.Color(0xffffff)} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vP; uniform vec3 uTop,uMid,uBot,uTint; uniform float uTime;
    float h(vec2 p){return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
    void main(){
      vec3 d=normalize(vP); float t=clamp(d.y*0.5+0.5,0.,1.);
      vec3 c=mix(uBot,uMid,smoothstep(0.0,0.52,t)); c=mix(c,uTop,smoothstep(0.5,1.0,t));
      vec2 sv=normalize(vec2(d.x,d.z)+1e-5)*(1.5-max(d.y,0.0)*0.8);
      float cl=n(sv*1.3*uTime*0.0+sv*2.4); cl=cl*0.6+n(sv*5.1)*0.4;
      c+=vec3(0.30,0.16,0.42)*cl*smoothstep(0.15,0.9,t)*0.55;
      float glow=pow(max(0.,cl),3.0)*1.2*smoothstep(0.45,0.9,d.y);
      c+=vec3(0.85,0.92,1.0)*glow*0.35;
      gl_FragColor=vec4(c*uTint,1.0);
    }`
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(300,32,20), skyMat);
scene.add(sky);

/* ---------------- Lighting ---------------- */
const hemi=new THREE.HemisphereLight(0x9fb8ff, 0x2a1c46, 0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe0bf, 1.35);
sun.position.set(28,44,18); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera; sc.left=-46; sc.right=46; sc.top=46; sc.bottom=-46; sc.near=1; sc.far=170;
sun.shadow.bias=-0.0009; sun.shadow.normalBias=0.03;
scene.add(sun); scene.add(sun.target);
const fill=new THREE.DirectionalLight(0x6f8cff, 0.5); fill.position.set(-25,18,-20); scene.add(fill);

/* ---------------- Arena generation ---------------- */
const worldGroup=new THREE.Group(); scene.add(worldGroup);
const colliders=[]; // {x,z,rx,rz,h,top} AABB boxes
let arenaData={w:70,d:70,h:0};

function disposeGroup(g){ g.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); worldGroup.remove(g); }

const PALETTES=[
  {name:'HOLLOW ENTRANCE',  a:0x8b5cf6, b:0x22d3ee, floor:0x2b2550, wall:0x3d3170, accent:0xf472b6},
  {name:'AETHER GARDENS',   a:0x22c55e, b:0xfde047, floor:0x21402f, wall:0x2f5b45, accent:0x86efac},
  {name:'CRYSTAL CANTICLES',a:0x38bdf8, b:0xe0f2fe, floor:0x24344f, wall:0x33507a, accent:0x93c5fd},
  {name:'EMBER MERCATOR',   a:0xf97316, b:0xfbbf24, floor:0x4a2418, wall:0x6b3319, accent:0xff9f6b},
  {name:'SPIRE APEX',       a:0xa855f7, b:0xf0abfc, floor:0x2c1c4a, wall:0x452a6e, accent:0xfda4af},
];

function buildArena(floorIdx){
  disposeGroup(worldGroup);
  colliders.length=0;
  const pal=PALETTES[(floorIdx-1)%PALETTES.length];
  const g=new THREE.Group();
  const W=64+floorIdx*2, D=64+floorIdx*2;
  arenaData={w:W,d:D,floor:floorIdx,pal};
  scene.fog.color.setHex(pal.floor).lerp(new THREE.Color(0x140f2e),0.55);
  skyMat.uniforms.uMid.value.setHex(pal.a).lerp(new THREE.Color(0xffffff),0.15);
  skyMat.uniforms.uBot.value.setHex(pal.floor).lerp(new THREE.Color(0x000000),0.5);
  skyMat.uniforms.uTop.value.setHex(pal.b).lerp(new THREE.Color(0x1b1140),0.55);
  hemi.color.setHex(pal.a); hemi.groundColor.setHex(pal.floor);
  sun.color.setHex(pal.b).lerp(new THREE.Color(0xffffff),0.5);

  // ---- main floor: hand-tiled stylized tiles with vertex-colored variation
  const tile=4, nx=Math.floor(W/tile), nz=Math.floor(D/tile);
  const fgeo=new THREE.PlaneGeometry(W,D,nx,nz); fgeo.rotateX(-Math.PI/2);
  const cols=new Float32Array(fgeo.attributes.position.count*3);
  const base=new THREE.Color(pal.floor), alt=new THREE.Color(pal.wall);
  const c=new THREE.Color();
  for(let i=0;i<fgeo.attributes.position.count;i++){
    const x=fgeo.attributes.position.getX(i), z=fgeo.attributes.position.getZ(i);
    const v=0.5+0.5*Math.sin(x*0.55)*Math.cos(z*0.47);
    c.copy(base).lerp(alt, v*0.55);
    if(((Math.floor((x+tile/2)/tile)+Math.floor((z+tile/2)/tile))&1)===0) c.multiplyScalar(1.06);
    cols[i*3]=c.r; cols[i*3+1]=c.g; cols[i*3+2]=c.b;
  }
  fgeo.setAttribute('color', new THREE.BufferAttribute(cols,3));
  const floorMesh=new THREE.Mesh(fgeo, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.86, metalness:0.06, flatShading:false}));
  floorMesh.receiveShadow=true; g.add(floorMesh);

  const glowMat=new THREE.MeshStandardMaterial({color:pal.a, emissive:pal.a, emissiveIntensity:1.5, roughness:0.3, metalness:0.5});
  // ---- arena boundary walls (opaque ring of chunky pillars)
  const wallN=Math.floor((W+D)/5.2);
  for(let i=0;i<wallN;i++){
    const t=i/wallN*4;
    let x,z;
    if(t<1){x=-W/2+(t)*W; z=-D/2;} else if(t<2){x=W/2; z=-D/2+(t-1)*D;}
    else if(t<3){x=W/2-(t-2)*W; z=D/2;} else {x=-W/2; z=D/2-(t-3)*D;}
    const h=rnd(6.5,13), rr=rnd(1.5,2.4);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rr*0.8, rr*1.15, h, 6, 1, false),
      new THREE.MeshStandardMaterial({color:pal.wall, roughness:0.72, metalness:0.16, flatShading:true}));
    m.position.set(x+rnd(-0.4,0.4), h/2, z+rnd(-0.4,0.4));
    m.rotation.y=rnd(0,TAU); m.castShadow=true; m.receiveShadow=true; g.add(m);
    // glowing seams on pillars
    const seam=new THREE.Mesh(new THREE.CylinderGeometry(rr*0.42, rr*0.42, h*0.55, 4), glowMat);
    seam.position.copy(m.position); seam.rotation.y=m.rotation.y; g.add(seam);
  }
  // ---- floating rock islands around the arena for silhouette depth
  for(let i=0;i<26;i++){
    const ang=rnd(0,TAU), dist=rnd(Math.max(W,D)*0.68, Math.max(W,D)*1.5);
    const s=rnd(3,12);
    const m=new THREE.Mesh(new THREE.IcosahedronGeometry(s,1),
      new THREE.MeshStandardMaterial({color:pal.wall, roughness:0.9, metalness:0.1, flatShading:true}));
    m.position.set(Math.cos(ang)*dist, rnd(2,26), Math.sin(ang)*dist);
    m.rotation.set(rnd(0,TAU),rnd(0,TAU),rnd(0,TAU)); m.castShadow=false; g.add(m);
    if(Math.random()<0.5){
      const cr=new THREE.Mesh(new THREE.OctahedronGeometry(s*rnd(0.15,0.3),0), glowMat);
      cr.position.copy(m.position).add(new THREE.Vector3(0,s*rnd(0.6,0.9),0)); g.add(cr);
    }
  }
  // ---- interior obstacles / platform rings (randomized, floor-scaled)
  const obsCount=7+floorIdx*1.5|0;
  for(let i=0;i<obsCount;i++){
    const ang=rnd(0,TAU), rr=rnd(6, Math.min(W,D)/2-7);
    const x=Math.cos(ang)*rr, z=Math.sin(ang)*rr;
    const type=rndi(0,2);
    if(type===0){ // crystal spire cluster
      for(let k=0;k<rndi(2,4);k++){
        const h=rnd(3.5,9), r=rnd(0.6,1.5);
        const m=new THREE.Mesh(new THREE.ConeGeometry(r, h, rndi(4,6), 1),
          new THREE.MeshStandardMaterial({color:pal.wall, emissive:pal.b, emissiveIntensity:0.35, roughness:0.25, metalness:0.35, flatShading:true}));
        m.position.set(x+rnd(-2,2), h/2, z+rnd(-2,2));
        m.rotation.set(rnd(-0.12,0.12), rnd(0,TAU), rnd(-0.12,0.12)); m.castShadow=true; m.receiveShadow=true; g.add(m);
      }
    } else if(type===1){ // raised platform block w/ glow trim
      const w=rnd(5,10), h=rnd(1.6,4.2), d2=rnd(5,10);
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d2),
        new THREE.MeshStandardMaterial({color:pal.floor, roughness:0.8, metalness:0.12, flatShading:true}));
      m.position.set(x, h/2, z); m.castShadow=true; m.receiveShadow=true; g.add(m);
      const trim=new THREE.Mesh(new THREE.BoxGeometry(w*1.02, 0.16, d2*1.02), glowMat);
      trim.position.set(x, h+0.02, z); g.add(trim);
      colliders.push({x, z, rx:w/2, rz:d2/2, top:h});
    } else { // hovering ring arch
      const m=new THREE.Mesh(new THREE.TorusGeometry(rnd(2.5,4.5), rnd(0.28,0.5), 8, 20),
        new THREE.MeshStandardMaterial({color:pal.accent, emissive:pal.accent, emissiveIntensity:0.7, roughness:0.3, metalness:0.6, flatShading:true}));
      m.position.set(x, rnd(4,8), z); m.rotation.set(rnd(0,1), rnd(0,TAU), rnd(0,1)); g.add(m);
      const core=new THREE.Mesh(new THREE.IcosahedronGeometry(0.7,0), glowMat);
      core.position.copy(m.position); g.add(core);
    }
  }
  // ---- floor rune circles (visual)
  for(let i=0;i<10;i++){
    const r=new THREE.Mesh(new THREE.RingGeometry(rnd(2.2,4.6), rnd(2.5,5.0), 24, 1),
      new THREE.MeshBasicMaterial({color:pal.a, transparent:true, opacity:0.16, side:THREE.DoubleSide}));
    r.rotation.x=-Math.PI/2; r.position.set(rnd(-W/2+6,W/2-6), 0.03, rnd(-D/2+6,D/2-6)); g.add(r);
  }
  worldGroup.add(g);

  // bounds for player
  arenaData.halfW=W/2-3; arenaData.halfD=D/2-3;
  return pal;
}

function makeHand(side){

  // forearm sleeve
  const sleeve=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.115,0.46,10), robe);
  sleeve.position.set(0,-0.24,0); sleeve.castShadow=false; g.add(sleeve);
  const cuff=new THREE.Mesh(new THREE.TorusGeometry(0.105,0.022,6,14), trimMat);
  cuff.rotation.x=Math.PI/2; cuff.position.set(0,-0.03,0); g.add(cuff);
  // palm
  const palm=new THREE.Mesh(new THREE.BoxGeometry(0.155,0.055,0.185), skin);
  palm.position.set(0,0.012,0.045); g.add(palm);
  // fingers (3 segments each)
  const fingers=[];
  const fPos=[[-0.052,-0.012],[0.0,-0.02],[0.052,-0.012]];
  const lens=[[0.062,0.05,0.04],[0.068,0.055,0.045],[0.064,0.05,0.04]];
  for(let i=0;i<3;i++){
    const segs=[]; let parent=g; let off=new THREE.Vector3(fPos[i][0], 0.014, 0.138);
    for(let s=0;s<3;s++){
      const pivot=new THREE.Group(); pivot.position.copy(off); parent.add(pivot);
      const len=lens[i][s];
      const geo=new THREE.BoxGeometry(0.042-s*0.007, 0.032-s*0.005, len);
      const m=new THREE.Mesh(geo, skin); m.position.set(0,0,len/2*0.94); pivot.add(m);
      const kn=new THREE.Mesh(new THREE.SphereGeometry(0.021-s*0.003, 8,6), skin); kn.position.set(0,0,len*0.94); pivot.add(kn);
      segs.push(pivot);
      parent=pivot; off=new THREE.Vector3(0,0,len*0.94);
    }
    fingers.push(segs);
  }
  // thumb
  const tSegs=[]; {
    let parent=g; let off=new THREE.Vector3(side*-0.075, -0.005, 0.055);
    for(let s=0;s<2;s++){
      const pivot=new THREE.Group(); pivot.position.copy(off); pivot.rotation.z=side*0.55*0; parent.add(pivot);
      const len=0.052-s*0.008;
      const m=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.03,len), skin); m.position.set(0,0,len/2*0.94); pivot.add(m);
      const kn=new THREE.Mesh(new THREE.SphereGeometry(0.02,8,6), skin); kn.position.set(0,0,len*0.94); pivot.add(kn);
      tSegs.push(pivot); parent=pivot; off=new THREE.Vector3(0,0,len*0.94);
    }
  }
  // fingertip emitters (glow)
  const tips=[];
  fingers.forEach(f=>{ const t=new THREE.Mesh(new THREE.SphereGeometry(0.018,8,6), trimMat); f[2].add(t); t.position.set(0,0,0.045); tips.push(t); });

  return {group:g, fingers, thumb:tSegs, tipMat:trimMat, palm, sleeve, skin, robe, side, tips};
}

/* ---------------- Procedural particles (single pooled system) ---------------- */
const MAXP=3400;
const pGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(MAXP*3), pCol=new Float32Array(MAXP*3), pSize=new Float32Array(MAXP);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
pGeo.setAttribute('psize', new THREE.BufferAttribute(pSize,1));
const particles=[];
for(let i=0;i<MAXP;i++) particles.push({alive:false,vx:0,vy:0,vz:0,life:0,maxlife:1,size:1,drag:1.6,grav:0,col:new THREE.Color(),fade:1});
let pCursor=0;
const pMat=new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uScale:{value: innerHeight*0.5} },
  vertexShader:`attribute float psize; varying vec3 vC; uniform float uScale;
    void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.0);
      gl_PointSize = psize * uScale / max(-mv.z, 0.001); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying vec3 vC;
    void main(){ vec2 d=gl_PointCoord-0.5; float r=length(d);
      if(r>0.5) discard; float a=smoothstep(0.5,0.05,r);
      gl_FragColor=vec4(vC*a*1.7, a); }`,
  vertexColors:true
});
const pPoints=new THREE.Points(pGeo,pMat); pPoints.frustumCulled=false; scene.add(pPoints);

function spawnParticle(x,y,z,vx,vy,vz,col,size,life,drag,grav){
  let p=null;
  for(let k=0;k<MAXP;k++){ const idx=(pCursor+k)%MAXP; if(!particles[idx].alive){ p=particles[idx]; pCursor=(idx+1)%MAXP; break; } }
  if(!p){ p=particles[pCursor]; pCursor=(pCursor+1)%MAXP; }
  p.alive=true; p.x=x;p.y=y;p.z=z; p.vx=vx;p.vy=vy;p.vz=vz; p.life=life;p.maxlife=life;
  p.size=size; p.drag=drag; p.grav=grav; p.col.set(col); p.fade=1;
  return p;
}
function burst(pos, count, color, speed, size, life, grav=6, spread=1){
  for(let i=0;i<count;i++){
    const d=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(speed*0.35,speed));
    d.y+=spread;
    spawnParticle(pos.x,pos.y,pos.z, d.x,d.y,d.z, color, rnd(size*0.6,size*1.5), rnd(life*0.6,life*1.3), rnd(1.0,2.6), grav);
  }
}
function emit(pos, count, color, speed, size, life, grav=6, dir=null, spreadMul=1){
  for(let i=0;i<count;i++){
    let d;
    if(dir){ d=dir.clone().add(new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(spreadMul*0.55)).normalize(); }
    else d=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize();
    d.multiplyScalar(rnd(speed*0.35,speed));
    spawnParticle(pos.x,pos.y,pos.z, d.x,d.y,d.z, color, rnd(size*0.55,size*1.5), rnd(life*0.6,life*1.35), rnd(1.0,2.4), grav);
  }
}
function updateParticles(dt){
  for(let i=0;i<MAXP;i++){
    const p=particles[i]; if(!p.alive) continue;
    p.life-=dt; if(p.life<=0){ p.alive=false; pSize[i]=0; pPos[i*3+1]=-9999; continue; }
    p.vy-=p.grav*dt;
    const d=Math.exp(-p.drag*dt); p.vx*=d; p.vy*=d; p.vz*=d;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(p.y<0.06 && p.vy<0){ p.y=0.06; p.vy*=-0.32; p.vx*=0.7; p.vz*=0.7; }
    const t=p.life/p.maxlife;
    pPos[i*3]=p.x; pPos[i*3+1]=p.y; pPos[i*3+2]=p.z;
    const bright=0.55+0.9*t;
    pCol[i*3]=p.col.r*bright; pCol[i*3+1]=p.col.g*bright; pCol[i*3+2]=p.col.b*bright;
    pSize[i]=p.size*(0.35+0.75*t);
  }
  pGeo.attributes.position.needsUpdate=true; pGeo.attributes.color.needsUpdate=true; pGeo.attributes.psize.needsUpdate=true;
}

  addFlashLight(lightPos, s.color, (isAlt?4.2:2.4)*power, 0.24);

const activeBeams=[];
function fireBeam(dmg, spell, fromAlt){
  const s=spell||SPELLS.stormlash;

}
function hitScanChain(from, dir, dmg, s, chains){
  let cur=from.clone(), d=dir.clone();
  const hitOnce=new Set();
  for(let i=0;i<chains;i++){
    const hits=raycastEnemies(cur.clone(), d, 34, hitOnce);
    const hit=hits[0];
    const endP=hit?hit.point:cur.clone().add(d.clone().multiplyScalar(34));
    drawLightning(cur, endP, s.color);
    if(hit){ hitOnce.add(hit.enemy); damageEnemy(hit.enemy, dmg*(1-i*0.22), s, endP); cur=hit.enemy.pos.clone(); 
      const ne=nearestEnemy(cur, 14, hitOnce); if(ne){ d=ne.pos.clone().sub(cur).normalize(); } else break;
    } else break;
  }
}

function drawLightning(a,b,col){
  const seg=6; const pts=[];
  for(let i=0;i<=seg;i++){
    const t=i/seg; const p=a.clone().lerp(b,t);
    if(i>0&&i<seg) p.add(new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).multiplyScalar(t*(1-t)*1.6));
    pts.push(p);
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.Line(geo, new THREE.LineBasicMaterial({color:col, transparent:true, opacity:1}));
  scene.add(m); lightningBolts.push({m, life:0.17});
}

/* ---- Raycast against enemies ---- */
const _ray=new THREE.Ray();
function raycastEnemies(origin, dir, maxDist, ignoreSet){
  _ray.set(origin, dir);
  const out=[];
  const sph=new THREE.Sphere(new THREE.Vector3(),1.5);
  for(const e of enemies){
    if(!e.alive||e.spawnT>0) continue;
    if(ignoreSet&&ignoreSet.has(e)) continue;
    sph.center.copy(e.pos); sph.center.y+=0.7*e.mesh.scale.x; sph.radius=e.radius*1.15;
    const p=new THREE.Vector3();
    if(_ray.intersectSphere(sph,p)){ const dist=origin.distanceTo(p); if(dist<=maxDist) out.push({enemy:e, point:p, dist}); }
  }
  out.sort((a,b)=>a.dist-b.dist); return out;
}
function nearestEnemy(pos, maxR, ignore){
  let best=null,bd=maxR;
  for(const e of enemies){ if(!e.alive||(ignore&&ignore.has(e))) continue; const d=e.pos.distanceTo(pos); if(d<bd){bd=d;best=e;} }
  return best;
}

/* ---- Damage application ---- */
const store={ eclipse:1, dmgStack:0, lastElement:null };
function applyStatus(e, s, dmg, point){
  const tags=s.tags;
  if(tags.includes('fire')){ e.burn=Math.max(e.burn, dmg*0.22); e.burnT=Math.max(e.burnT,3.0*(synActive('PYROCLASM')&&e.doom>0?2:1)); }
  if(tags.includes('ice')){ e.slow=Math.max(e.slow,1.2); }
  if(tags.includes('toxic')){ e.doom=Math.max(e.doom, dmg*0.3); e.doomT=Math.max(e.doomT||0,3.2); }
  if(tags.includes('hex')){ e.marked=Math.max(e.marked, 5.5); }
  if(tags.includes('storm') && synActive('SINGULAR STATIC')){ e.pull.add(point.clone().sub(e.pos).normalize().multiplyScalar(-3)); }
  if(tags.includes('gravity')){ e.pull.copy(point.clone().sub(e.pos)); }
  if(tags.includes('storm') && e.slow>0) dmg*=1.7;
  if(tags.includes('void') && e.marked>0 && synActive('HOLLOW BRAND')) dmg*=1.25;
  return dmg;
}
function damageEnemy(e, dmgIn, s, point, isDoT=false){
  if(!e.alive) return;
  if(e.spawnT>0) e.spawnT=Math.max(0,e.spawnT*0.5);
  let dmg=dmgIn;
  if(e.marked>0) dmg*=1.16;
  if(e.debuffHaunt) dmg*=1.12;
  const crit=(!isDoT) && Math.random()<stats.critChance;
  if(crit) dmg*=stats.critMult;
  if(isDoT) dmg*=0.55;
  const hasFire=s.tags.includes('fire'), hasIce=s.tags.includes('ice');
  // STEAM BURST
  if(hasFire && e.slow>0 && synActive('STEAM BURST')){ steamBurst(point||e.pos, s.dmg*0.7); }
  if(hasIce && e.burnT>0 && synActive('STEAM BURST')){ steamBurst(point||e.pos, s.dmg*0.7); }
  dmg=applyStatus(e, s, dmg, point||e.pos);
  // Eclipse stacking
  const el=s.tags.includes('void')?'void':(s.tags.includes('light')?'light':null);
  if(synActive('ECLIPSE')&&el){
    if(store.lastElement && store.lastElement!==el){ store.dmgStack=Math.min(0.6,(store.dmgStack||0)+0.12); }
    store.lastElement=el; store.eclipse=1+(store.dmgStack||0);
  }
  e.hp-=dmg; e.hurtT=0.16;
  player.dmgDealt+=dmg;
  if(s.tags.includes('light')&&stats.lifesteal>0){ player.hp=Math.min(player.maxHp, player.hp+stats.lifesteal*1.2); }
  if(s.tags.includes('toxic')&&synActive('CYRO-SHOCK')){}
  if(e.hp<=0){ killEnemy(e, s, point); }
  else {
    if(crit) { comboCount++; comboTimer=2.2; }
    dmgNumber(point||e.pos.clone().setY(e.pos.y+1.4), dmg, crit, crit?'#ffd166':'#'+new THREE.Color(s.color).getHexString());
    emit(point||e.pos, crit?14:7, new THREE.Color(s.color), crit?8:5, crit?0.34:0.22, 0.4, 2);
    addFlashLight(point||e.pos, s.color, crit?3.4:1.5, 0.16);
    screenShake(crit?0.34:0.14);
  }
}

function killEnemy(e, s, point){
  if(e.dead) return;

  const pts=ELEMENTS[s.tags[0]]? s : {tags:['chaos'], color:s.color};

    const e=enemies[i];

      e.mesh.rotation.y+=dt*6; e.mesh.position.y+= -dt*1.2;
      if(e.deathT<=0){ removeEnemy(e); enemies.splice(i,1); } continue; }
    if(!e.alive){ removeEnemy(e); enemies.splice(i,1); continue; }
    if(e.spawnT>0){
      e.spawnT-=dt;
      const t=1-clamp(e.spawnT/0.55,0,1);
      e.mesh.scale.setScalar((e.isBoss?2.3:(e.elite?1.42:1))*(0.15+t*0.85));
      e.mesh.position.copy(e.pos); e.mesh.position.y-= (1-t)*3;
      continue;
    }
    e.hurtT=Math.max(0,e.hurtT-dt);
    if(e.burnT>0){ e.burnT-=dt; if(e.burnT<=0) e.burn=0; }
    if(e.burnT>0 && e.burn>0){ e.hp-=e.burn*dt; if(e.hp<=0&&!e.dead) killEnemy(e,{tags:['fire'],color:0xff6b35,color2:0xffd166}); }
    if(e.doomT&&e.doomT>0){ e.doomT-=dt; e.hp-=e.doom*0.7*dt; if(e.hp<=0&&!e.dead) killEnemy(e,{tags:['toxic'],color:0x84cc16,color2:0xd9f99d}); }
    if(e.marked>0) e.marked-=dt;
    if(e.slow>0) e.slow-=dt;
    if(e.stun>0) e.stun-=dt;
    if(e.blightT>0){ e.blightT-=dt; }
    // physics / movement
    let speed=e.def.speed*(e.elite?1.16:1)*(1-(e.slow>0?0.42:0));
    if(e.hp/e.maxHp<0.35) speed*=1.18;
    if(e.hp/e.maxHp<0.001){}
    tmpV.copy(pp).sub(e.pos); tmpV.y=0;
    const dist=tmpV.length(); tmpV.normalize();
    const keep = e.isBoss? 13 : (e.def.ranged? e.def.range*0.62 : e.def.range*0.6);
    let moveDir=new THREE.Vector3();
    if(e.stun>0){ moveDir.set(0,0,0); }
    else if(e.def.ranged){ if(dist>keep) moveDir.copy(tmpV); else if(dist<keep*0.6) moveDir.copy(tmpV).multiplyScalar(-1); else { moveDir.set(-tmpV.z,0,tmpV.x).multiplyScalar(e.elev?1:1); } }
    else moveDir.copy(tmpV);
    // pull from gravity
    if(e.pull.lengthSq()>0.01){ moveDir.add(e.pull.clone().normalize().multiplyScalar(0.8)); e.pull.multiplyScalar(0.9); if(e.pull.lengthSq()<0.02) e.pull.set(0,0,0); }
    // separation from other enemies
    for(const o of enemies){ if(o===e||!o.alive) continue; const d=e.pos.distanceTo(o.pos); if(d<e.radius+o.radius+0.4&&d>0.01){ const push=e.pos.clone().sub(o.pos).setY(0).normalize().multiplyScalar((e.radius+o.radius+0.4-d)*2.2); moveDir.add(push); } }
    moveDir.y=0; if(moveDir.lengthSq()>0.0001) moveDir.normalize();
    const desired=moveDir.multiplyScalar(speed);
    e.vel.x=lerp(e.vel.x, desired.x, 1-Math.exp(-6*dt));
    e.vel.z=lerp(e.vel.z, desired.z, 1-Math.exp(-6*dt));
    e.vel.y-=CFG.gravity*dt;
    e.pos.addScaledVector(e.vel,dt);
    const groundY=e.type==='wisp'||e.type==='sentinel'? (1.2+Math.sin(performance.now()*0.0016+i)*0.35) : 1.0;
    if(e.pos.y<groundY){ e.pos.y=groundY; e.vel.y=0; }
    // bounds
    e.pos.x=clamp(e.pos.x, -arenaData.halfW-2, arenaData.halfW+2);
    e.pos.z=clamp(e.pos.z, -arenaData.halfD-2, arenaData.halfD+2);
    // obstacle collision (simple)
    for(const c of colliders){
      if(e.pos.x>c.x-c.rx-1&&e.pos.x<c.x+c.rx+1&&e.pos.z>c.z-c.rz-1&&e.pos.z<c.z+c.rz+1&&e.pos.y<c.top+1){
        const dx=e.pos.x-c.x, dz=e.pos.z-c.z;
        if(Math.abs(dx)/c.rx > Math.abs(dz)/c.rz){ e.pos.x=c.x+Math.sign(dx||1)*(c.rx+1.05); } else { e.pos.z=c.z+Math.sign(dz||1)*(c.rz+1.05); }
      }
    }
    e.mesh.position.copy(e.pos);
    // facing player
    if(e.hp/e.maxHp>0){
      const want=Math.atan2(pp.x-e.pos.x, pp.z-e.pos.z);
      e.mesh.rotation.y=lerpAngle(e.mesh.rotation.y, want, 1-Math.exp(-7*dt));
    }
    // hurt flash (whitened emissive pulse)
    e.mesh.traverse(o=>{ if(o.isMesh&&o.material&&o.material.emissive!==undefined){
      const b=(o.material.userData&&o.material.userData.baseEm)||0;
      o.material.emissiveIntensity = e.hurtT>0 ? b + 2.6*(e.hurtT/0.16) : b;
    } });
    if(e.burnT>0) emit(e.pos.clone().setY(e.pos.y+0.6), 1, new THREE.Color(0xff6b35), 2, 0.25,0.5,-1);
    if(e.doomT>0) emit(e.pos.clone().setY(e.pos.y+0.6), 1, new THREE.Color(0x84cc16), 2, 0.25,0.5,-1);
    // attack
    e.atkT-=dt;
    if(e.stun<=0){
      if(!e.def.ranged){
        if(dist<e.radius+1.1 && e.atkT<=0){ meleeHit(e); e.atkT=e.def.cd*(e.isBoss?0.6:1); }
      } else {
        if(dist<e.def.range && e.atkT<=0){ enemyShoot(e, dist); e.atkT=e.def.cd*(e.isBoss?0.65:1); }
      }
    }
    e.bob+=dt;
  }
}
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI; return a+d*t; }

function meleeHit(e){
  const d=player.pos.distanceTo(e.pos);

function enemyShoot(e, dist){
  const from=e.pos.clone().setY(e.pos.y+1.5*e.mesh.scale.x/e.mesh.scale.x*0.9);
  const dir=player.pos.clone().setY(player.pos.y-0.4).sub(from).normalize();

  for(let i=0;i<count;i++){
    const d=dir.clone();

    else d.add(new THREE.Vector3(rnd(-0.04,0.04),rnd(-0.04,0.04),rnd(-0.04,0.04)));

      dmg:e.def.dmg*0.7*runMods.difficulty*(e.elite?1.3:1), speed:e.isBoss?26:20, size:e.isBoss?0.42:0.26,
      life:3.4, kind:'enemy', owner:'enemy', trail:0.25, colorName:'fire' });

function hurtPlayer(dmg, silent){

function animateHands(dt, t){
  const speed=Math.hypot(player.vel.x,player.vel.z);
  const moving=clamp(speed/CFG.moveSpeed,0,1.6);
  const air=!player.grounded;
  handRoot.position.set(0, 0, 0);
  const swayX = clamp(-player.vel.x*0.0035, -0.05, 0.05);
  const swayY = clamp(player.vel.y*0.004, -0.05, 0.05);
  for(let i=0;i<2;i++){
    const h=hands[i], st=handState[i];
    const side=i===0?-1:1;
    st.recoil=Math.max(0, st.recoil-dt*5.2);
    st.blink=Math.max(0, st.blink-dt*3.6);
    const chTarget = chargeState.active ? (0.3+chargeState.amt*0.7) : 0;
    st.charge=lerp(st.charge, chTarget, 1-Math.exp(-9*dt));
    const ch=st.charge;
    const bobX = Math.sin(t*10.5*(0.7+moving*0.5))*0.011*moving*(air?0.2:1);
    const bobY = Math.abs(Math.cos(t*10.5*(0.7+moving*0.5)))*0.014*moving*(air?0.2:1);
    const baseX = side*0.155*(1-ch*0.3) + bobX + swayX;
    const baseY = -0.165 + bobY + swayY - (air?0.02:0) + ch*0.055;
    const baseZ = -0.255 - ch*0.045;
    const rec = st.recoil;
    h.group.position.x = lerp(h.group.position.x, baseX - side*0.03*rec + (altMode? side*0.035:0), 1-Math.exp(-16*dt));
    h.group.position.y = lerp(h.group.position.y, baseY + 0.05*rec, 1-Math.exp(-16*dt));
    h.group.position.z = lerp(h.group.position.z, baseZ + 0.115*rec, 1-Math.exp(-16*dt));
    const rotZ = side*0.32 - side*0.5*rec + (altMode? -side*0.15:0);
    h.group.rotation.z = lerp(h.group.rotation.z, rotZ, 1-Math.exp(-10*dt));
    h.group.rotation.x = lerp(h.group.rotation.x, -0.48 - 0.34*rec + (altMode? -0.2:0), 1-Math.exp(-10*dt));
    h.group.rotation.y = lerp(h.group.rotation.y, side*0.34 + side*0.18*rec + (altMode? side*0.2:0), 1-Math.exp(-10*dt));
    // finger curl — gestures
    const castPose = clamp(st.recoil*1.4,0,1);
    const chargePose = st.charge;
    const idle = clamp(0.14 + Math.sin(t*2.1+i*1.7)*0.05, 0, 1);
    for(let f=0;f<h.fingers.length;f++){
      const seg=h.fingers[f];
      const fw = 1 - Math.abs(f-1)*0.18;
      for(let s2=0;s2<3;s2++){
        let curl = seg[s2];
        const base = (idle*0.35 + castPose*1.25 + chargePose*0.45);
        const targetY = base*(fw)*(s2===0?1:1.05) + (s2===1?0.1:0.16);
        const targetX = (f===0?-0.12:0) + Math.sin(t*1.3+f)*0.02 + (f===2?0.1:0);
        // pulsating during charge
        const pulse = chargePose*Math.sin(t*13+f*0.8)*0.14;
        if(s2===0){ curl.rotation.x = lerp(curl.rotation.x, -1.02 + targetX*0.4, 1-Math.exp(-14*dt)); }
        else { curl.rotation.x = lerp(curl.rotation.x, targetY + pulse - 0.35, 1-Math.exp(-18*dt)); }
        curl.rotation.y = lerp(curl.rotation.y||0, (f===0?-0.16:0)+ (f===2?0.2:0), 1-Math.exp(-8*dt));
      }
    }
    for(let s3=0;s3<h.thumb.length;s3++){
      const c=h.thumb[s3];
      c.rotation.x = lerp(c.rotation.x || 0, (idle*0.3+castPose*1.0) + s3*0.3, 1-Math.exp(-14*dt));
      c.rotation.z = lerp(c.rotation.z||0, side*(0.5 - chargePose*0.25), 1-Math.exp(-9*dt));
    }
    // tip glow
    const glowI= 1.2 + st.blink*4.5 + (altMode?2.2:0) + Math.sin(t*7+i)*0.25;
    h.tipMat.emissiveIntensity=glowI;
    h.tipMat.color.setHex(altMode? (loadout[slotIndex]?SPELLS[loadout[slotIndex]].color:0x9ef7ff) : (loadout[slotIndex]?SPELLS[loadout[slotIndex]].color2:0x9ef7ff));
    h.tipMat.emissive.copy(h.tipMat.color);
    // hand aura light
    if(st.blink>0.02||altMode){ }
  }
  // Aether step blade trail
  for(let i=blades.length-1;i>=0;i--){ const b=blades[i]; b.t+=dt; if(b.t>b.life){blades.splice(i,1);continue;}
    emit(player.pos.clone().add(b.dir.clone().multiplyScalar(-1.2)), 10, new THREE.Color(0x6ad6ff), 6, 0.3, 0.35, 0); }
}

/* ---------------- Camera & movement ---------------- */
function updatePlayer(dt){
  player.invuln=Math.max(0,player.invuln-dt);
  player.hurtT=Math.max(0,player.hurtT-dt);
  player.dashCd=Math.max(0,player.dashCd-dt);
  comboCount=Math.max(0,comboCount); comboTimer-=dt; if(comboTimer<=0) comboCount=0;
  if(player.manaTimer>0) player.manaTimer-=dt;
  if(player.manaTimer<=0){ player.mana=(player.mana)+((CFG.manaRegen+stats.regen))*dt; player.mana=Math.min(player.maxMana,player.mana); }
  player.mana=Math.min(player.maxMana, player.mana);
  if(player.hp<player.maxHp && stats.regen>0){ player.hp=Math.min(player.maxHp, player.hp+stats.regen*0.12*dt); }

  // desired movement in camera-yaw space
  const fwd=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  const right=new THREE.Vector3(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  let wish=new THREE.Vector3();
  if(keys['KeyW']||keys['ArrowUp']) wish.add(fwd);
  if(keys['KeyS']||keys['ArrowDown']) wish.sub(fwd);
  if(keys['KeyD']||keys['ArrowRight']) wish.add(right);
  if(keys['KeyA']||keys['ArrowLeft']) wish.sub(right);
  const wishLen=wish.length();
  if(wishLen>0) wish.normalize();
  const sprint=(keys['ShiftLeft']||keys['ShiftRight'])?1.24:1;
  const spd=CFG.moveSpeed*stats.moveSpeed*sprint*(player.comboSpeedBoost||1);

  // dash
  if((keys['ControlLeft']||keys['ControlRight']) && player.dashT<=0){
    if(player.airDashes<stats.dashCharges && player.dashCd<=0){
      if(player.mana>=CFG.dashCost){
        player.mana-=CFG.dashCost; player.dashT=CFG.dashTime; player.dashCd=CFG.dashCd*stats.dashCdMult;
        player.airDashes++; if(player.grounded) player.airDashes=1;
        const d= wishLen>0? wish.clone(): fwd.clone();
        player.vel.x=d.x*CFG.dashSpeed; player.vel.z=d.z*CFG.dashSpeed;
        player.invuln=Math.max(player.invuln, CFG.dashTime+0.07);
        emit(player.pos.clone().setY(0.4), 34, new THREE.Color(0x9ef7ff), 9, 0.42, 0.5, 0, d.clone().multiplyScalar(-1));
        addFlashLight(player.pos.clone(),0x9ef7ff,2.2,0.2);
      } else toast('INSUFFICIENT AETHER','#ff9aa5');
    }
  }
  // jump
  if(keys['Space']){ player.jumpBuffer=0.14; } else player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);
  if(player.jumpBuffer>0 && (player.grounded||player.coyote>0)){
    player.vel.y=CFG.jumpVel; player.grounded=false; player.coyote=0; player.jumpBuffer=0;
    emit(player.pos.clone().setY(0.3), 22, new THREE.Color(0xc084fc), 6, 0.36, 0.45, 3);
    if(player.airDashes>0) player.airDashes--; player.airDashes=0;
  }
  // ground move accel
  if(player.dashT>0){ player.dashT-=dt; }
  else {
    const accel=(player.grounded?CFG.accel:CFG.accel*CFG.airControl);
    player.vel.x+= wish.x*accel*dt; player.vel.z+= wish.z*accel*dt;
    const hv=Math.hypot(player.vel.x,player.vel.z);
    const maxH=spd;
    if(hv>maxH && wishLen>0){ // soft cap -> friction based
      const f=1-Math.exp(-9*dt); player.vel.x=lerp(player.vel.x, player.vel.x/hv*maxH, f); player.vel.z=lerp(player.vel.z, player.vel.z/hv*maxH, f);
    }
    if(wishLen===0 && player.grounded){ const fr=1-Math.exp(-CFG.friction*dt); player.vel.x*=fr; player.vel.z*=fr; }
  }
  player.vel.y-=CFG.gravity*dt;
  // integrate with collision
  const nx=player.pos.x+player.vel.x*dt, nz=player.pos.z+player.vel.z*dt;
  let px=nx, pz=nz, py=player.pos.y+player.vel.y*dt;
  // arena bounds
  px=clamp(px,-arenaData.halfW,arenaData.halfW);
  pz=clamp(pz,-arenaData.halfD,arenaData.halfD);
  // obstacles
  let onTop=false; let bestTop=-1;
  for(const c of colliders){
    if(px>c.x-c.rx-CFG.radius&&px<c.x+c.rx+CFG.radius&&pz>c.z-c.rz-CFG.radius&&pz<c.z+c.rz+CFG.radius){
      if(py-0.2>=c.top){ onTop=true; bestTop=Math.max(bestTop,c.top); }
      else {
        const dx=px-c.x, dz=pz-c.z;
        const ox=(c.rx+CFG.radius)-Math.abs(dx), oz=(c.rz+CFG.radius)-Math.abs(dz);
        if(ox<oz) px=c.x+Math.sign(dx||1)*(c.rx+CFG.radius+0.001);
        else pz=c.z+Math.sign(dz||1)*(c.rz+CFG.radius+0.001);
      }
    }
  }
  const floorY = onTop? bestTop+CFG.playerHeight : CFG.playerHeight;
  if(py<=floorY){ py=floorY; if(player.vel.y<0) player.fallVel=-player.vel.y; player.vel.y=0; player.grounded=true; player.coyote=0.12; player.airDashes=0; }
  else { player.coyote=Math.max(0,player.coyote-dt); player.grounded=false; if(py>4 && player.vel.y<-14) {} }
  if(player.grounded && Math.hypot(player.vel.x,player.vel.z)>0.5){
    player.stepT-=dt*Math.hypot(player.vel.x,player.vel.z);
    if(player.stepT<=0){ player.stepT=2.2; emit(new THREE.Vector3(player.pos.x,0.2,player.pos.z), 3, new THREE.Color(currentPal?currentPal.a:0x888888), 2, 0.22, 0.35, 2); }
  }
  player.pos.set(px,py,pz);
  // camera
  player.bobT+=dt*Math.hypot(player.vel.x,player.vel.z)*0.9;
  const bob=player.grounded? Math.sin(player.bobT*1.6)*0.035*Math.min(1,Math.hypot(player.vel.x,player.vel.z)/CFG.moveSpeed) : 0;
  const roll=clamp(-player.vel.x*0.0016*Math.cos(player.yaw)-player.vel.z*0.0016*Math.sin(player.yaw),-0.05,0.05)*3;
  camera.position.set(player.pos.x, player.pos.y+bob+ shake*0.0, player.pos.z);
  camera.rotation.set(0,0,0);
  camera.rotation.order='YXZ';
  camera.rotation.y=player.yaw; camera.rotation.x=player.pitch;
  camera.rotation.z=roll*0.4 + (shake>0.01? Math.sin(performance.now()*0.05)*shake*0.02 : 0);
  // FOV kick
  const targetFov=79 + Math.min(12, Math.hypot(player.vel.x,player.vel.z)*(player.dashT>0?0.75:0.34));
  camera.fov=lerp(camera.fov, targetFov, 1-Math.exp(-6*dt)); camera.updateProjectionMatrix();
  shake=Math.max(0, shake-dt*2.6);
  // step audio-visual: nothing
  ultCharge=Math.min(100, ultCharge + dt*2.0 + player.dmgDealt*0.0002);
  novaCd=Math.max(0,novaCd-dt);
  if(player.onHitShieldAcc){}
  // gate proximity
  if(gateActive && player.pos.distanceTo(gate.pos)<2.2){
    gateActive=false; gate.g.visible=false;
    essence+=6+floorIdx;
    pendingFloor=floorIdx+1;
    emit(gate.pos.clone().setY(1),80,new THREE.Color(0x9ef7ff),10,0.6,1.4,-1);
    openUpgrades(3, true);
  }
}

/* ---------------- Projectile update ---------------- */
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3();
function updateProjectiles(dt){
  for(let i=enemyProjectiles.length-1;i>=0;i--){
    const p=enemyProjectiles[i];
    if(!p.alive){ projGroup.remove(p.mesh); p.mesh.traverse(o=>{if(o.geometry)o.geometry.dispose();}); enemyProjectiles.splice(i,1); continue; }
    p.age+=dt; p.life-=dt;
    if(p.gravity){ p.vel.y-=p.gravity*dt; }
    if(p.homing>0){
      const target=nearestEnemy(p.pos, 16);
      if(target){ const d=target.pos.clone().setY(target.pos.y+0.8).sub(p.pos).normalize(); p.vel.addScaledVector(d.sub(p.vel.clone().normalize()), p.homing*dt*3); p.vel.setLength(p.speed); }
    }
    // well pull
    if(p.kind==='well'||p.kind==='singularity'){
      p.wellT+=dt;
      for(const e of enemies){ if(!e.alive) continue; const d=p.pos.distanceTo(e.pos);
        if(d<p.pullRadius*1.3){ const f=(1-d/(p.pullRadius*1.3)); e.vel.addScaledVector(e.pos.clone().sub(p.pos).normalize().multiplyScalar(-1), -60*f*dt*3); }
      }
      emit(p.pos, 2, new THREE.Color(p.color), 2, 0.4, 0.4, 0);
      if(p.age> (p.kind==='singularity'?2.0:1.5)) implode(p);
    }
    p.pos.addScaledVector(p.vel, dt);
    if(p.kind==='wave'){
      // ground wave: damages each enemy once per 0.3s
      p.mesh.position.copy(p.pos);
      p.mesh.rotation.y+=dt*4;
      for(const e of enemies){ if(!e.alive) continue;
        const d2=p.pos.distanceTo(e.pos);
        if(d2<p.aoe+e.radius*0.8){ const last=p.waveDmgCd.get(e)||0; if(p.age-last>0.4){ p.waveDmgCd.set(e,p.age); damageEnemy(e, p.dmg, {tags:['earth'],color:p.color}, e.pos.clone().setY(e.pos.y+0.8)); } } }
      p.mesh.scale.setScalar(1+p.age*0.9);
      emit(p.pos.clone().setY(0.4), 3, new THREE.Color(p.color), 3, 0.4, 0.5, -1);
    } else {
      p.mesh.position.copy(p.pos);
      p.mesh.rotation.x+=dt*p.mesh.userData.spin; p.mesh.rotation.y+=dt*p.mesh.userData.spin*0.7;
      if(p.age< ((p.trailT||0)+0.02)) {} 
      if(p.kind!=='enemy') emit(p.pos, 1, new THREE.Color(p.color), 1.2, 0.22, 0.35, 0);
      else emit(p.pos, 1, new THREE.Color(0xff7a4d), 1.0, 0.2, 0.3, 0);
    }
    // ground bounce
    if(p.gravity && p.pos.y<0.3 && p.vel.y<0){ p.pos.y=0.3; p.vel.y*=-0.4; p.vel.x*=0.6; p.vel.z*=0.6; }
    // collisions
    if(p.owner==='player'){
      for(const e of enemies){
        if(!e.alive||e.spawnT>0) continue;
        if(p.hitSet.has(e)) continue;
        const d=p.pos.distanceTo(e.pos.clone().setY(e.pos.y+0.7*e.mesh.scale.x));
        if(d< p.mesh.children[0].geometry.parameters.radius+ e.radius*1.1){
          p.hitSet.add(e);
          const s=getSpellByColor(p.colorName);
          damageEnemy(e, p.dmg, s, p.pos.clone());
          if(p.mark) e.marked=Math.max(e.marked,5);
          if(p.chain>0){ const ne=nearestEnemy(e.pos, 13, new Set([e])); if(ne){ drawLightning(e.pos.clone().setY(e.pos.y+1), ne.pos.clone().setY(ne.pos.y+1), p.color); damageEnemy(ne, p.dmg*0.6, s, ne.pos.clone().setY(ne.pos.y+0.9)); } }
          if(p.splash>0){ aoeDamage(p.pos, p.splash*1.4*stats.aoeMult, p.dmg*0.6, s); emit(p.pos, 22, new THREE.Color(p.color), 7, 0.4, 0.5, 2); }
          if(stats.burn>0){ e.burn=Math.max(e.burn,p.dmg*0.22); e.burnT=Math.max(e.burnT,3); }
          if(stats.slow>0){ e.slow=Math.max(e.slow,2); }
          if(stats.chainChance>0 && Math.random()<stats.chainChance){ const ne=nearestEnemy(e.pos,12,new Set([e])); if(ne){ drawLightning(e.pos.clone().setY(e.pos.y+1), ne.pos.clone().setY(ne.pos.y+1), 0xffe066); damageEnemy(ne, p.dmg*0.5, {tags:['storm'],color:0xffe066}, ne.pos.clone().setY(ne.pos.y+0.9)); } }
          emit(p.pos, 14, new THREE.Color(p.color2), 6, 0.3, 0.4, 2);
          addFlashLight(p.pos, p.color, 2, 0.16);
          if(stats.manaLeech>0){ player.mana=Math.min(player.maxMana, player.mana+stats.manaLeech); }
          if(stats.onHitShield>0) player.shield=Math.min(60, player.shield+stats.onHitShield);
          if(loadout[0]==='luminar'||loadout[1]==='luminar'){}
          p.pierce--; if(p.pierce<0){ p.alive=false; }
          if(stats.homing>0 && p.pierce>0){ const ne=nearestEnemy(p.pos,25,new Set([e])); if(ne) p.vel.copy(ne.pos.clone().setY(ne.pos.y+0.8).sub(p.pos).normalize().multiplyScalar(p.speed)); }
          break;
        }
      }
      // world collision
      if(p.alive){
        if(p.pos.y<=0.25||p.pos.y>60){ impact(p); }
        if(Math.abs(p.pos.x)>arenaData.halfW+1||Math.abs(p.pos.z)>arenaData.halfD+1){ p.alive=false; }
        for(const c of colliders){ if(p.pos.x>c.x-c.rx&&p.pos.x<c.x+c.rx&&p.pos.z>c.z-c.rz&&p.pos.z<c.z+c.rz&&p.pos.y<c.top){ impact(p); break; } }
      }
    } else {
      // enemy projectile hits player
      const d=p.pos.distanceTo(player.pos.clone().setY(player.pos.y-0.5));
      if(d<1.0){ hurtPlayer(p.dmg); emit(p.pos,18,new THREE.Color(0xff7a4d),7,0.35,0.4,2); p.alive=false; }
      if(p.pos.y<=0.25){ emit(p.pos,10,new THREE.Color(0xff7a4d),5,0.3,0.4,2); p.alive=false; }
    }
    if(p.life<=0||p.age>6) p.alive=false;
  }
}
function impact(p){
  if(!p.alive) return;
  p.alive=false;
  const s=getSpellByColor(p.colorName);
  emit(p.pos, 26, new THREE.Color(p.color), 8, 0.4, 0.5, 3);
  emit(p.pos, 12, new THREE.Color(p.color2||p.color), 6, 0.3, 0.6, -1);
  if(p.splash>0){ aoeDamage(p.pos, p.splash*1.5*stats.aoeMult, p.dmg*0.7, s); }
  addFlashLight(p.pos, p.color, 2.2, 0.2);
}
function implode(p){
  p.alive=false;
  emit(p.pos, 80, new THREE.Color(p.color2), 14, 0.7, 1.1, 0);
  emit(p.pos, 50, new THREE.Color(p.color), 10, 0.5, 1.2, -2);
  aoeDamage(p.pos, p.aoe*stats.aoeMult, p.dmg*2.4, getSpellByColor('gravity'));
  for(const e of enemies) if(e.alive && e.pos.distanceTo(p.pos)<p.aoe){ e.pull.copy(p.pos.clone().sub(e.pos).multiplyScalar(0.6)); e.stun=0.5; }
  addFlashLight(p.pos, p.color, 7, 0.4); screenShake(0.5);
}
const byColor={};
function getSpellByColor(name){
  const base=SPELLS.emberlance;
  for(const k in SPELLS){
    const s=SPELLS[k];
    if(s.tags.includes(name)) return s;
  }
  return {tags:[name], color: ELEMENTS[name]?ELEMENTS[name].col : 0xffffff, color2:0xffffff, name:name};
}

/* ---------------- Gem / orb pickup ---------------- */
function updatePickups(dt){
  for(let i=gems.length-1;i>=0;i--){
    const g=gems[i]; g.life-=dt;
    g.vel.y-=CFG.gravity*dt*0.5;
    g.mesh.position.addScaledVector(g.vel,dt);
    if(g.mesh.position.y<0.3){ g.mesh.position.y=0.3; g.vel.y*=-0.35; g.vel.x*=0.7; g.vel.z*=0.7; }
    g.mesh.rotation.y+=dt*3; g.mesh.rotation.x+=dt*2;
    const d=g.mesh.position.distanceTo(player.pos.clone().setY(player.pos.y-0.6));
    if(d<9){ g.mesh.position.lerp(player.pos.clone().setY(player.pos.y-0.7), 1-Math.exp(-   (9-d)*0.9*dt)); }
    if(d<1.5||g.life<=0){
      if(d<1.5){ essence+=g.value; emit(g.mesh.position,10,new THREE.Color(0xb9f7ff),4,0.28,0.35,-1); healFlash(0.12); }
      scene.remove(g.mesh); g.mesh.geometry.dispose(); gems.splice(i,1);
    }
  }
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i]; o.life-=dt; o.vel.y-=CFG.gravity*dt*0.5;
    o.mesh.position.addScaledVector(o.vel,dt);
    if(o.mesh.position.y<0.4){ o.mesh.position.y=0.4; o.vel.y*=-0.4; }
    o.mesh.rotation.y+=dt*2;
    const d=o.mesh.position.distanceTo(player.pos.clone().setY(player.pos.y-0.7));
    if(d<1.6 || (o.life<=0)){
      if(d<1.6){ const heal=Math.round(player.maxHp*0.22); player.hp=Math.min(player.maxHp, player.hp+heal); setHeal(0.55);
        dmgNumber(player.pos.clone().add(new THREE.Vector3(0,0.4,0)), heal, false, '#7ef7b1');
        emit(o.mesh.position,30,new THREE.Color(0x7ef7b1),6,0.4,0.6,-1); }
      scene.remove(o.mesh); o.mesh.geometry.dispose(); orbs.splice(i,1);
    }
  }
}
function healFlash(a){ setHeal(a); }

/* ---------------- Minimap ---------------- */
const mmCtx=$('mmCanvas').getContext('2d');
function drawMinimap(){
  const w=150,h=150,c=mmCtx;
  c.clearRect(0,0,w,h);
  c.fillStyle='rgba(8,10,24,0.65)'; c.fillRect(0,0,w,h);
  const scale=Math.min(w/(arenaData.w||70), h/(arenaData.d||70))*0.86;
  const cx=w/2, cy=h/2;
  const rot=-player.yaw;
  c.save(); c.translate(cx,cy); 
  const toMap=(x,z)=>{ const dx=x-player.pos.x, dz=z-player.pos.z;
    const rx=dx*Math.cos(rot)-dz*Math.sin(rot), rz=dx*Math.sin(rot)+dz*Math.cos(rot);
    return [rx*scale, rz*scale]; };
  // arena outline
  c.strokeStyle='rgba(140,190,255,0.35)'; c.lineWidth=2;
  c.beginPath();
  const corners=[[-arenaData.halfW,-arenaData.halfD],[arenaData.halfW,-arenaData.halfD],[arenaData.halfW,arenaData.halfD],[-arenaData.halfW,arenaData.halfD]];
  corners.forEach((p,i)=>{ const m=toMap(p[0],p[1]); i?c.lineTo(m[0],m[1]):c.moveTo(m[0],m[1]); });
  c.closePath(); c.stroke();
  // obstacles
  c.fillStyle='rgba(120,140,200,0.4)';
  for(const o of colliders){ const m=toMap(o.x,o.z); c.beginPath(); c.arc(m[0],m[1],o.rx*scale,0,TAU); c.fill(); }
  // gate
  if(gateActive){ const m=toMap(gate.pos.x,gate.pos.z); c.fillStyle='#9ef7ff';
    c.beginPath(); c.arc(m[0],m[1],5,0,TAU); c.fill();
    c.strokeStyle='rgba(158,247,255,0.6)'; c.beginPath(); c.arc(m[0],m[1],8+Math.sin(performance.now()*0.006)*3,0,TAU); c.stroke(); }
  // enemies
  for(const e of enemies){ if(!e.alive) continue; const m=toMap(e.pos.x,e.pos.z);
    c.fillStyle=e.isBoss?'#ffd166':(e.elite?'#c084fc':(e.def.ranged?'#ff9a6b':'#ff6b6b'));
    c.beginPath(); c.arc(m[0],m[1], e.isBoss?6:(e.elite?4:3),0,TAU); c.fill(); }
  // player
  c.fillStyle='#ffffff'; c.beginPath(); c.moveTo(0,-6); c.lineTo(4,5); c.lineTo(0,2.5); c.lineTo(-4,5); c.closePath(); c.fill();
  c.restore();
}

/* ---------------- HUD render ---------------- */
let hudT=0;
function updateHUD(dt){
  hudT+=dt;
  const hpFrac=player.hp/player.maxHp, mFrac=player.mana/player.maxMana, xFrac=player.xp/player.xpNeed;
  $('hpFill').style.transform='scaleX('+hpFrac+')';
  $('manaFill').style.transform='scaleX('+mFrac+')';
  $('xpFill').style.transform='scaleX('+xFrac+')';
  $('hpLbl').textContent=Math.ceil(player.hp)+' / '+player.maxHp + (player.shield>0? '  🛡'+Math.round(player.shield):'');
  $('manaLblS').textContent=Math.round(player.mana)+' / '+player.maxMana;
  $('lvTxt').textContent='LV '+player.lvl;
  $('hpTxt').textContent=(player.shield>0?'WARD ACTIVE':'');
  // cd overlays
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const k=el.dataset.cd; const v=cd[k]||0; const s=SPELLS[k];
    el.style.height=(s? clamp(v/(s.cd*stats.cdMult),0,1)*100 : 0)+'%';
  });
  // wave bar
  const tot=waveKillTarget;
  const done=clamp(tot - enemies.filter(e=>e.alive).length, 0, tot);
  $('waveFill').style.transform='scaleX('+(done/tot)+')';
  $('waveTxt').textContent=Math.floor(done)+' / '+tot;
  // active spell highlight
  document.querySelectorAll('#spellList .spellSlot').forEach((el,i)=>{ el.classList.toggle('active', i===slotIndex); });
  // topbar
  topbarT+=dt;
  const chips=$('topbar').children;
  if(chips.length){
    chips[0].textContent='⛰ SECTOR '+floorIdx;
    chips[1].textContent='✦ '+essence;
    chips[2].textContent='🗲 '+comboCount+(comboCount>1?' COMBO':'');
    chips[3].textContent='🛡 '+Math.round(player.shield);
    chips[3].style.opacity=player.shield>0?1:0.45;
  }
  // ability charges
  const ab=abilityRowEl.children;
  if(ab.length===4){
    ab[2].style.opacity=novaCd>0?0.35:1;
    ab[2].querySelector('div:nth-child(3)').textContent=novaCd>0?Math.ceil(novaCd)+'s':'BLOOM NOVA';
    ab[3].style.opacity=ultCharge>=100?1:0.4;
    ab[3].querySelector('div:nth-child(3)').textContent=ultCharge>=100?'OVERNOVA READY':Math.round(ultCharge)+'%';
  }
  // objective refresh
  if(Math.floor(hudT*0.5)%2===0) {}
  // flashes
  flashA=Math.max(0,flashA-dt*3.4); healA=Math.max(0,healA-dt*2.2);
  dmgFlashEl.style.opacity=flashA*0.85;
  healFlashEl.style.opacity=healA*0.6;
  // vignette pulse when low hp
  if(hpFrac<0.3){ const p=(0.3-hpFrac)*2*(0.5+0.5*Math.sin(hudT*7)); dmgFlashEl.style.opacity=Math.max(flashA*0.85, p*0.35); }
  // combo text
  const ct=$('comboText');
  if(comboCount>=2){ ct.style.opacity=1; ct.textContent='✦ '+comboCount+' CHAIN'; ct.style.transform='translateX(-50%) scale('+(1+Math.min(0.5,comboCount*0.03))+')'; }
  else ct.style.opacity=0;
  // big msg
  if(bigMsgT>0){ bigMsgT-=dt; const el=$('bigMsg');
    const a=bigMsgT>1.6? (2.4-bigMsgT)/0.8 : clamp(bigMsgT/1.4,0,1);
    el.style.opacity=a; el.style.transform='translate(-50%,-50%) scale('+(1+(1-clamp(bigMsgT/2.4,0,1))*0.1)+')';
  } else $('bigMsg').style.opacity=0;
  // toasts
  for(let i=toasts.length-1;i>=0;i--){ const t=toasts[i]; t.life-=dt;
    if(!t.el){ t.el=document.createElement('div'); t.el.className='toast glass'; t.el.style.color=t.col; $('pickupToast').appendChild(t.el); }
    t.el.textContent=t.txt; t.el.style.opacity=clamp(t.life*1.6,0,1);
    if(t.life<=0){ t.el.remove(); toasts.splice(i,1); }
  }
  // crosshair spread
  const sp=clamp(10+Math.hypot(player.vel.x,player.vel.z)*1.2, 10, 30);
  document.querySelectorAll('.ch-arm').forEach((el,i)=>{ el.style.transform=`translate(-50%,${i? sp: -sp-11}px)`; });
  // charge gesture feedback
  const cr=$('chargeRing'), ct=$('chargeTxt'), alm=$('auraL'), arm=$('auraR');
  const k=loadout[slotIndex]; const spk=k?SPELLS[k]:null;
  const col=spk?('#'+new THREE.Color(chargeState.alt?spk.color:spk.color2).getHexString()):'#6de3ff';
  if(chargeState.active && chargeState.amt>0.02 && spk){
    const a=chargeState.amt;
    cr.style.opacity=0.35+a*0.65;
    cr.style.color=col; cr.style.borderColor=col;
    const pulse=1+Math.sin(hudT*(8+a*14))*(0.03+a*0.05);
    cr.style.transform=`translate(-50%,-50%) scale(${(0.62+a*0.62)*pulse})`;
    ct.style.opacity=0.5+a*0.5;
    ct.textContent=a>=0.995?'CHARGED':('CHARGING '+Math.round(a*100)+'%')+(chargeState.alt?' · ALT':'');
    ct.style.color=col;
    const au=0.18+a*0.55;
    alm.style.opacity=au; arm.style.opacity=au;
    alm.style.background=arm.style.background=`radial-gradient(circle, ${col}aa, transparent 70%)`;
  } else {
    cr.style.opacity=0; ct.style.opacity=0; alm.style.opacity=0; arm.style.opacity=0;
  }
}

/* ---------------- Main loop ---------------- */
let last=performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  let dt=Math.min(0.05,(now-last)/1000); last=now;
  const t=now*0.001;
  if(!uiOpen){
    updatePlayer(dt);
    updateCharge(dt, t);
    updateEnemies(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    tickCooldowns(dt);
    // spawn queue
    const aliveN=enemies.filter(e=>e.alive).length;
    const maxConc=9+Math.floor(floorIdx*1.4);
    for(let i=spawnQueue.length-1;i>=0;i--){
      const q=spawnQueue[i]; q.t-=dt;
      if(q.t<=0){
        if(q.boss){ if(aliveN>0){ q.t=0.7; } else { spawnQueue.splice(i,1); spawnBoss(currentPal); } continue; }
        if(aliveN>=maxConc){ q.t=0.45; continue; }
        spawnQueue.splice(i,1);
        const p=spawnPointAwayFormation(i+enemies.length*3); spawnEnemy(q.type, p.x, p.z, q.elite, currentPal);
      }
    }
  }
  animateHands(dt, t);
  updateParticles(dt);
  updateDnums(dt);
  // novae rings
  for(let i=novae.length-1;i>=0;i--){ const n=novae[i]; n.t+=dt; if(n.t>0.7){novae.splice(i,1);continue;}
    emit(new THREE.Vector3(n.pos.x+Math.cos(n.t*20)*n.max*0.6, 0.4, n.pos.z+Math.sin(n.t*20)*n.max*0.6), 4, new THREE.Color(n.color||0xc084fc), 5,0.5,0.4,-1); }
  // beams
  for(let i=activeBeams.length-1;i>=0;i--){ const b=activeBeams[i]; b.life-=dt; b.mesh.material.opacity=b.life*11;
    if(b.life<=0){ scene.remove(b.mesh); b.mesh.geometry.dispose(); b.mesh.material.dispose(); activeBeams.splice(i,1); } }
  for(let i=lightningBolts.length-1;i>=0;i--){ const l=lightningBolts[i]; l.life-=dt; l.m.material.opacity=clamp(l.life*6,0,1);
    if(l.life<=0){ scene.remove(l.m); l.m.geometry.dispose(); l.m.material.dispose(); lightningBolts.splice(i,1); } }
  // flash lights
  for(const f of flashLights){ if(f.life>0){ f.life-=dt; f.l.intensity = (f.life/f.max)*f.l.intensity*0.86; if(f.life<=0) f.l.visible=false; } }
  // gate anim
  if(gateActive){ gate.g.rotation.y+=dt*1.4; gate.g.children.forEach((c,i)=>{ c.position.y = (i<2?0.4:0.9)+Math.sin(t*2.2+i)*0.16; }); emit(gate.pos.clone().setY(1.1+Math.sin(t*2)*0.2), 1, new THREE.Color(0x9ef7ff), 2, 0.3,0.5,-1); }
  // sun follow
  sun.position.set(player.pos.x+30, 46, player.pos.z+20); sun.target.position.copy(player.pos); sun.target.updateMatrixWorld();
  sky.position.copy(player.pos);
  // slow-mo on dash
  const tScale = player.dashT>0? 0.86:1;
  updateHUD(dt);
  renderer.render(scene,camera);
}

/* ---------------- Charge / gesture update ---------------- */
function updateCharge(dt, t){
  const key=loadout[slotIndex]; const s=SPELLS[key];
  // buffered cast
  if(castBuffer){ castBuffer.t-=dt; if(castBuffer.t<=0){ const b=castBuffer; castBuffer=null; castBuffered(b.isAlt,b.handIdx,b.key,b.power,0.5); } }
  // keys held as modifiers
  if(chargeState.active && (keys['AltLeft']||keys['AltRight'])) chargeState.alt=true;
  altMode = chargeState.active && chargeState.alt;
  if(chargeState.active && s){
    const cap=(s.type==='beam'&&!chargeState.alt)?0.7:2.15; // beams reach full charge a bit differently
    chargeState.amt=Math.min(1, chargeState.amt + dt/( s.type==='beam'?1.1:0.72 ));
    if(chargeState.amt>=1){ chargeState.overflow+=dt; }
    // gather particles converging into the palms
    const cam=camera.getWorldPosition(new THREE.Vector3());
    const fwd=new THREE.Vector3(); camera.getWorldDirection(fwd);
    const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
    const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
    const palm=cam.clone().add(fwd.clone().multiplyScalar(0.5)).add(right.clone().multiplyScalar(0.14)).add(up.clone().multiplyScalar(-0.16));
    const altP=cam.clone().add(fwd.clone().multiplyScalar(0.5)).add(right.clone().multiplyScalar(-0.14)).add(up.clone().multiplyScalar(-0.16));
    const target = (Math.sin(t*3)>0)? palm:altP;
    const c = new THREE.Color(chargeState.alt? (SPELLS[key].color) : SPELLS[key].color2);
    const n=(chargeState.amt>0.9)?3:2;
    for(let i=0;i<n;i++){
      const d=new THREE.Vector3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize().multiplyScalar(rnd(1.4,3.2));
      const from=target.clone().add(d);
      spawnParticle(from.x,from.y,from.z, -d.x*3.2, -d.y*3.2, -d.z*3.2, c, rnd(0.13,0.28), rnd(0.25,0.45), 0.6, 0);
    }
    if(chargeState.amt>0.99){
      emit(target, 2, new THREE.Color(0xffffff), 3, 0.3, 0.4, -1);
    }
    if(Math.random()<dt*14) addFlashLight(target, c.getHex(), 1.2+chargeState.amt*3.4, 0.13);
    // beam channel
    if(s.type==='beam' && !chargeState.alt){
      const dmg=s.dmg*stats.dmgMult*(0.42+0.5*chargeState.amt);
      cd[key]=cd[key]||0;
      if(cd[key]<=0){ fireBeam(dmg, s); cd[key]=0.13*stats.cdMult; }
    }
  } else if(!chargeState.active){
    chargeState.amt=Math.max(0, chargeState.amt-dt*3.2);
  }
}

animate();
