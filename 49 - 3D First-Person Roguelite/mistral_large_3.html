<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Ascension: Roguelite Mage</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }
        #game-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }
        .spell-slot {
            position: absolute;
            bottom: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
        #spell-slot-1 {
            left: 50%;
            transform: translateX(-100px);
        }
        #spell-slot-2 {
            left: 50%;
            transform: translateX(40px);
        }
        #health-bar, #mana-bar {
            position: absolute;
            top: 20px;
            height: 20px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        #health-bar {
            left: 20px;
            width: 200px;
        }
        #health-bar-inner {
            height: 100%;
            background: #ff4444;
            border-radius: 10px;
            width: 100%;
        }
        #mana-bar {
            left: 240px;
            width: 200px;
        }
        #mana-bar-inner {
            height: 100%;
            background: #4444ff;
            border-radius: 10px;
            width: 100%;
        }
        #damage-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <h1 class="text-4xl font-bold mb-4">Arcane Ascension: Roguelite Mage</h1>
        <p class="text-xl">Click to Start</p>
    </div>
    
    <div id="game-ui">
        <div id="crosshair"></div>
        <div id="health-bar"><div id="health-bar-inner"></div></div>
        <div id="mana-bar"><div id="mana-bar-inner"></div></div>
        <div id="spell-slot-1" class="spell-slot">1</div>
        <div id="spell-slot-2" class="spell-slot">2</div>
        <div id="damage-effect"></div>
        <div id="wave-counter" class="absolute top-20 left-20 text-white text-2xl">Wave: 1</div>
    </div>

    <!-- Upgrade Screen -->
    <div id="upgrade-screen" class="fixed inset-0 bg-black bg-opacity-80 flex flex-col justify-center items-center text-white z-50 hidden">
        <h1 class="text-4xl font-bold mb-8">Choose Your Upgrade</h1>
        <div class="flex space-x-4">
            <div class="bg-gray-800 p-6 rounded-lg cursor-pointer hover:bg-gray-700" onclick="selectUpgrade(0)">
                <h2 class="text-2xl font-bold" id="upgrade-0-name">Upgrade 1</h2>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg cursor-pointer hover:bg-gray-700" onclick="selectUpgrade(1)">
                <h2 class="text-2xl font-bold" id="upgrade-1-name">Upgrade 2</h2>
            </div>
            <div class="bg-gray-800 p-6 rounded-lg cursor-pointer hover:bg-gray-700" onclick="selectUpgrade(2)">
                <h2 class="text-2xl font-bold" id="upgrade-2-name">Upgrade 3</h2>
            </div>
        </div>
    </div>

    <script>
        // Game state
        const gameState = {
            health: 100,
            maxHealth: 100,
            mana: 100,
            maxMana: 100,
            spells: [
                { name: "Ember Bolt", cooldown: 0, maxCooldown: 1, manaCost: 10, level: 1 },
                { name: "Void Pulse", cooldown: 0, maxCooldown: 3, manaCost: 25, level: 1 }
            ],
            selectedSpell: 0,
            enemies: [],
            lastTime: 0,
            arenaSize: 50,
            player: {
                speed: 0.1,
                dashSpeed: 0.5,
                dashDuration: 0.2,
                dashCooldown: 1,
                dashTime: 0,
                dashCooldownTime: 0,
                velocity: new THREE.Vector3(),
                isDashing: false
            },
            upgrades: [],
            upgradeChoices: [],
            score: 0,
            wave: 1,
            gameOver: false,
            showUpgradeScreen: false
        };

        // Upgrade system
        function generateUpgradeChoices() {
            const choices = [];
            const spellUpgrades = [
                { name: "Faster Cast", spell: 0, effect: () => gameState.spells[0].maxCooldown *= 0.8 },
                { name: "More Damage", spell: 0, effect: () => gameState.spells[0].damage = (gameState.spells[0].damage || 10) + 5 },
                { name: "Larger AoE", spell: 1, effect: () => gameState.spells[1].aoe = (gameState.spells[1].aoe || 1) + 0.5 },
                { name: "Mana Efficiency", spell: 1, effect: () => gameState.spells[1].manaCost *= 0.9 }
            ];
            
            for (let i = 0; i < 3; i++) {
                const randomUpgrade = spellUpgrades[Math.floor(Math.random() * spellUpgrades.length)];
                choices.push({
                    name: randomUpgrade.name + " (" + gameState.spells[randomUpgrade.spell].name + ")",
                    effect: randomUpgrade.effect
                });
            }
            
            // Add global upgrades
            choices.push({
                name: "Max Health +20",
                effect: () => {
                    gameState.maxHealth += 20;
                    gameState.health = gameState.maxHealth;
                }
            });
            choices.push({
                name: "Max Mana +20",
                effect: () => {
                    gameState.maxMana += 20;
                    gameState.mana = gameState.maxMana;
                }
            });
            
            // Shuffle and pick 3
            gameState.upgradeChoices = choices.sort(() => Math.random() - 0.5).slice(0, 3);
        }

        function showUpgradeScreen() {
            gameState.showUpgradeScreen = true;
            document.getElementById('upgrade-screen').style.display = 'flex';
            generateUpgradeChoices();
        }

        function hideUpgradeScreen() {
            gameState.showUpgradeScreen = false;
            document.getElementById('upgrade-screen').style.display = 'none';
        }

        function selectUpgrade(index) {
            gameState.upgradeChoices[index].effect();
            gameState.wave++;
            hideUpgradeScreen();
            spawnEnemies();
        }

        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 20, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 1.6;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        scene.add(directionalLight);

        // Post-processing (bloom effect)
        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.5, // strength
            0.4, // radius
            0.8  // threshold
        );
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Controls
        const controls = new THREE.PointerLockControls(camera, document.body);
        document.getElementById('loading-screen').addEventListener('click', () => {
            controls.lock();
        });

        // Movement
        const moveState = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            jump: false,
            dash: false
        };

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = true; break;
                case 'KeyA': moveState.left = true; break;
                case 'KeyS': moveState.backward = true; break;
                case 'KeyD': moveState.right = true; break;
                case 'Space': moveState.jump = true; break;
                case 'ShiftLeft': moveState.dash = true; break;
                case 'Digit1': gameState.selectedSpell = 0; break;
                case 'Digit2': gameState.selectedSpell = 1; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveState.forward = false; break;
                case 'KeyA': moveState.left = false; break;
                case 'KeyS': moveState.backward = false; break;
                case 'KeyD': moveState.right = false; break;
                case 'Space': moveState.jump = false; break;
                case 'ShiftLeft': moveState.dash = false; break;
            }
        });

        // Mouse controls
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) { // Left click
                castSpell();
            }
        });

        // Procedural arena
        function createArena() {
            const floorGeometry = new THREE.PlaneGeometry(gameState.arenaSize * 2, gameState.arenaSize * 2);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0x333344,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Arena walls
            const wallGeometry = new THREE.BoxGeometry(gameState.arenaSize * 2, 3, 0.5);
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0x222233,
                roughness: 0.7
            });
            const wall1 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall1.position.set(0, 1.5, -gameState.arenaSize);
            wall1.receiveShadow = true;
            wall1.castShadow = true;
            scene.add(wall1);

            const wall2 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall2.position.set(0, 1.5, gameState.arenaSize);
            wall2.receiveShadow = true;
            wall2.castShadow = true;
            scene.add(wall2);

            const wall3 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall3.rotation.y = Math.PI / 2;
            wall3.position.set(-gameState.arenaSize, 1.5, 0);
            wall3.receiveShadow = true;
            wall3.castShadow = true;
            scene.add(wall3);

            const wall4 = new THREE.Mesh(wallGeometry, wallMaterial);
            wall4.rotation.y = Math.PI / 2;
            wall4.position.set(gameState.arenaSize, 1.5, 0);
            wall4.receiveShadow = true;
            wall4.castShadow = true;
            scene.add(wall4);
        }

        // Procedural hands with animation
        function createHands() {
            const handGroup = new THREE.Group();
            handGroup.position.set(0.3, -0.5, -0.5);
            camera.add(handGroup);

            // Hand material
            const handMaterial = new THREE.MeshStandardMaterial({
                color: 0xffccaa,
                roughness: 0.3,
                metalness: 0.1
            });

            // Left hand
            const leftHand = new THREE.Group();
            leftHand.position.set(-0.1, 0, 0);
            leftHand.castShadow = true;
            handGroup.add(leftHand);

            // Left palm
            const leftPalm = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.08, 0.12),
                handMaterial
            );
            leftPalm.position.set(0, -0.02, 0.05);
            leftPalm.castShadow = true;
            leftHand.add(leftPalm);

            // Left fingers
            for (let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(
                    new THREE.BoxGeometry(0.02, 0.02, 0.06),
                    handMaterial
                );
                finger.position.set(-0.03 + i * 0.02, -0.02, 0.12);
                finger.castShadow = true;
                leftHand.add(finger);
            }

            // Left thumb
            const leftThumb = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, 0.03, 0.04),
                handMaterial
            );
            leftThumb.position.set(-0.05, 0, 0.08);
            leftThumb.rotation.z = Math.PI / 4;
            leftThumb.castShadow = true;
            leftHand.add(leftThumb);

            // Right hand
            const rightHand = new THREE.Group();
            rightHand.position.set(0.1, 0, 0);
            rightHand.castShadow = true;
            handGroup.add(rightHand);

            // Right palm
            const rightPalm = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.08, 0.12),
                handMaterial
            );
            rightPalm.position.set(0, -0.02, 0.05);
            rightPalm.castShadow = true;
            rightHand.add(rightPalm);

            // Right fingers
            for (let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(
                    new THREE.BoxGeometry(0.02, 0.02, 0.06),
                    handMaterial
                );
                finger.position.set(0.03 - i * 0.02, -0.02, 0.12);
                finger.castShadow = true;
                rightHand.add(finger);
            }

            // Right thumb
            const rightThumb = new THREE.Mesh(
                new THREE.BoxGeometry(0.02, 0.03, 0.04),
                handMaterial
            );
            rightThumb.position.set(0.05, 0, 0.08);
            rightThumb.rotation.z = -Math.PI / 4;
            rightThumb.castShadow = true;
            rightHand.add(rightThumb);

            // Animation state
            handGroup.userData = {
                castTime: 0,
                isCasting: false,
                update: function(dt) {
                    if (this.isCasting) {
                        this.castTime += dt * 5;
                        if (this.castTime >= 1) {
                            this.isCasting = false;
                            this.castTime = 0;
                        }
                        // Animate hands
                        leftHand.rotation.x = Math.sin(this.castTime * Math.PI) * 0.5;
                        rightHand.rotation.x = Math.sin(this.castTime * Math.PI) * 0.5;
                        leftHand.position.y = -0.5 + Math.sin(this.castTime * Math.PI) * 0.1;
                        rightHand.position.y = -0.5 + Math.sin(this.castTime * Math.PI) * 0.1;
                    } else {
                        leftHand.rotation.x = 0;
                        rightHand.rotation.x = 0;
                        leftHand.position.y = -0.5;
                        rightHand.position.y = -0.5;
                    }
                }
            };

            return handGroup;
        }

        const hands = createHands();

        // Spell casting with VFX and hand animation
        function castSpell() {
            const spell = gameState.spells[gameState.selectedSpell];
            if (spell.cooldown > 0 || gameState.mana < spell.manaCost) return;

            gameState.mana -= spell.manaCost;
            spell.cooldown = spell.maxCooldown;
            hands.userData.isCasting = true;

            if (gameState.selectedSpell === 0) {
                // Ember Bolt (projectile)
                const bolt = new THREE.Mesh(
                    new THREE.SphereGeometry(0.2, 16, 16),
                    new THREE.MeshStandardMaterial({
                        color: 0xff4400,
                        emissive: 0xff4400,
                        emissiveIntensity: 2,
                        transparent: true,
                        opacity: 0.9
                    })
                );
                bolt.position.copy(camera.position);
                bolt.castShadow = true;
                scene.add(bolt);

                const direction = new THREE.Vector3();
                camera.getWorldDirection(direction);
                direction.multiplyScalar(0.8);

                const particles = [];
                for (let i = 0; i < 10; i++) {
                    const particle = new THREE.Mesh(
                        new THREE.SphereGeometry(0.05, 8, 8),
                        new THREE.MeshStandardMaterial({
                            color: 0xff8800,
                            emissive: 0xff8800,
                            emissiveIntensity: 2
                        })
                    );
                    particle.position.copy(camera.position);
                    particle.userData = {
                        velocity: new THREE.Vector3(
                            direction.x + (Math.random() - 0.5) * 0.2,
                            direction.y + (Math.random() - 0.5) * 0.2,
                            direction.z + (Math.random() - 0.5) * 0.2
                        ),
                        lifespan: 0.5 + Math.random() * 0.5
                    };
                    scene.add(particle);
                    particles.push(particle);
                }

                const boltObj = {
                    mesh: bolt,
                    particles: particles,
                    velocity: direction,
                    lifespan: 2,
                    update: function(dt) {
                        this.mesh.position.add(this.velocity);
                        this.lifespan -= dt;
                        
                        // Update particles
                        for (let i = this.particles.length - 1; i >= 0; i--) {
                            const particle = this.particles[i];
                            particle.position.add(particle.userData.velocity);
                            particle.userData.lifespan -= dt;
                            if (particle.userData.lifespan <= 0) {
                                scene.remove(particle);
                                this.particles.splice(i, 1);
                            }
                        }
                        
                        // Check for collision with enemies
                        for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                            const enemy = gameState.enemies[i];
                            if (enemy.userData && enemy.userData.health) {
                                const distance = this.mesh.position.distanceTo(enemy.position);
                                if (distance < 1) {
                                    enemy.userData.health -= 10;
                                    triggerShake(0.1, 0.2);
                                    if (enemy.userData.health <= 0) {
                                        scene.remove(enemy);
                                        gameState.enemies.splice(i, 1);
                                    }
                                    scene.remove(this.mesh);
                                    return true;
                                }
                            }
                        }
                        
                        if (this.lifespan <= 0) {
                            scene.remove(this.mesh);
                            return true;
                        }
                        return false;
                    }
                };
                gameState.enemies.push(boltObj);
            }
            else if (gameState.selectedSpell === 1) {
                // Void Pulse (AoE)
                const pulse = new THREE.Mesh(
                    new THREE.SphereGeometry(1, 32, 32),
                    new THREE.MeshStandardMaterial({
                        color: 0x4400ff,
                        emissive: 0x4400ff,
                        emissiveIntensity: 3,
                        transparent: true,
                        opacity: 0.8
                    })
                );
                pulse.position.copy(camera.position);
                pulse.castShadow = true;
                scene.add(pulse);

                const particles = [];
                for (let i = 0; i < 20; i++) {
                    const particle = new THREE.Mesh(
                        new THREE.SphereGeometry(0.1, 8, 8),
                        new THREE.MeshStandardMaterial({
                            color: 0x8800ff,
                            emissive: 0x8800ff,
                            emissiveIntensity: 2
                        })
                    );
                    particle.position.copy(camera.position);
                    particle.userData = {
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 2,
                            (Math.random() - 0.5) * 2,
                            (Math.random() - 0.5) * 2
                        ),
                        lifespan: 0.5 + Math.random() * 0.5
                    };
                    scene.add(particle);
                    particles.push(particle);
                }

                const pulseObj = {
                    mesh: pulse,
                    particles: particles,
                    scale: 1,
                    lifespan: 0.5,
                    update: function(dt) {
                        this.scale += dt * 5;
                        this.mesh.scale.set(this.scale, this.scale, this.scale);
                        this.mesh.material.opacity = 0.8 - (this.scale / 10);
                        
                        // Update particles
                        for (let i = this.particles.length - 1; i >= 0; i--) {
                            const particle = this.particles[i];
                            particle.position.add(particle.userData.velocity);
                            particle.userData.lifespan -= dt;
                            if (particle.userData.lifespan <= 0) {
                                scene.remove(particle);
                                this.particles.splice(i, 1);
                            }
                        }
                        
                        // Check for collision with enemies
                        for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                            const enemy = gameState.enemies[i];
                            if (enemy.userData && enemy.userData.health) {
                                const distance = this.mesh.position.distanceTo(enemy.position);
                                if (distance < this.scale) {
                                    enemy.userData.health -= 20;
                                    triggerShake(0.2, 0.3);
                                    if (enemy.userData.health <= 0) {
                                        scene.remove(enemy);
                                        gameState.enemies.splice(i, 1);
                                    }
                                }
                            }
                        }
                        
                        this.lifespan -= dt;
                        if (this.lifespan <= 0) {
                            scene.remove(this.mesh);
                            return true;
                        }
                        return false;
                    }
                };
                gameState.enemies.push(pulseObj);
            }
        }

        // Update UI
        function updateUI() {
            document.getElementById('health-bar-inner').style.width = `${(gameState.health / gameState.maxHealth) * 100}%`;
            document.getElementById('mana-bar-inner').style.width = `${(gameState.mana / gameState.maxMana) * 100}%`;
        }

        // Screen shake effect
        let shakeTime = 0;
        let shakeIntensity = 0;
        
        function triggerShake(intensity, duration) {
            shakeIntensity = intensity;
            shakeTime = duration;
        }

        // Animation loop
        function animate(time) {
            const dt = (time - gameState.lastTime) / 1000;
            gameState.lastTime = time;

            if (gameState.gameOver) {
                document.getElementById('damage-effect').style.background = 'rgba(0, 0, 0, 0.8)';
                return;
            }

            // Screen shake
            if (shakeTime > 0) {
                shakeTime -= dt;
                camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                camera.position.y += (Math.random() - 0.5) * shakeIntensity;
                camera.position.z += (Math.random() - 0.5) * shakeIntensity;
            }

            if (controls.isLocked && !gameState.showUpgradeScreen) {
                // Movement
                const direction = new THREE.Vector3();
                if (moveState.forward) direction.z -= 1;
                if (moveState.backward) direction.z += 1;
                if (moveState.left) direction.x -= 1;
                if (moveState.right) direction.x += 1;
                direction.normalize();

                if (moveState.dash && gameState.player.dashCooldownTime <= 0 && !gameState.player.isDashing) {
                    gameState.player.isDashing = true;
                    gameState.player.dashTime = gameState.player.dashDuration;
                    gameState.player.dashCooldownTime = gameState.player.dashCooldown;
                }

                if (gameState.player.isDashing) {
                    gameState.player.dashTime -= dt;
                    if (gameState.player.dashTime <= 0) {
                        gameState.player.isDashing = false;
                    }
                }
                else if (gameState.player.dashCooldownTime > 0) {
                    gameState.player.dashCooldownTime -= dt;
                }

                const speed = gameState.player.isDashing ? gameState.player.dashSpeed : gameState.player.speed;
                direction.multiplyScalar(speed);
                controls.moveRight(direction.x);
                controls.moveForward(direction.z);

                // Spell cooldowns
                gameState.spells.forEach(spell => {
                    if (spell.cooldown > 0) {
                        spell.cooldown -= dt;
                        if (spell.cooldown < 0) spell.cooldown = 0;
                    }
                });

                // Mana regeneration
                gameState.mana = Math.min(gameState.maxMana, gameState.mana + dt * 5);
            }

            // Update hands
            hands.userData.update(dt);

            // Update enemies and spells
            for (let i = gameState.enemies.length - 1; i >= 0; i--) {
                const enemy = gameState.enemies[i];
                if (enemy.update) {
                    if (enemy.update(dt)) {
                        gameState.enemies.splice(i, 1);
                        gameState.score += 10;
                    }
                } else if (enemy.userData && enemy.userData.update) {
                    enemy.userData.update(dt, controls.getObject().position);
                    if (gameState.health <= 0) {
                        gameState.gameOver = true;
                        document.getElementById('loading-screen').style.display = 'flex';
                        document.getElementById('loading-screen').innerHTML = `
                            <h1 class="text-4xl font-bold mb-4">Game Over</h1>
                            <p class="text-xl">Wave: ${gameState.wave}</p>
                            <p class="text-xl mb-4">Score: ${gameState.score}</p>
                            <p class="text-xl cursor-pointer" onclick="window.location.reload()">Click to Restart</p>
                        `;
                    }
                }
            }

            // Check for win condition
            if (gameState.enemies.length === 0 && !gameState.showUpgradeScreen && controls.isLocked) {
                showUpgradeScreen();
            }

            // Update upgrade screen
            if (gameState.showUpgradeScreen) {
                document.getElementById('upgrade-0-name').textContent = gameState.upgradeChoices[0].name;
                document.getElementById('upgrade-1-name').textContent = gameState.upgradeChoices[1].name;
                document.getElementById('upgrade-2-name').textContent = gameState.upgradeChoices[2].name;
            }

            document.getElementById('wave-counter').textContent = `Wave: ${gameState.wave}`;

            updateUI();
            composer.render();
            requestAnimationFrame(animate);
        }

        // Procedural enemy
        function createEnemy(elite = false, boss = false) {
            const enemyGroup = new THREE.Group();
            enemyGroup.position.set(
                (Math.random() - 0.5) * gameState.arenaSize * 1.5,
                0.5,
                (Math.random() - 0.5) * gameState.arenaSize * 1.5
            );

            let size = 0.5;
            let health = 30;
            let speed = 0.05 + Math.random() * 0.05;
            let color = 0x884488;
            let eyeColor = 0xff0000;
            
            if (elite) {
                size = 0.7;
                health = 60;
                speed = 0.08 + Math.random() * 0.05;
                color = 0x448844;
                eyeColor = 0xffff00;
            }
            else if (boss) {
                size = 1.5;
                health = 200;
                speed = 0.03 + Math.random() * 0.02;
                color = 0x444488;
                eyeColor = 0xff00ff;
            }

            // Body
            const body = new THREE.Mesh(
                new THREE.SphereGeometry(size, 16, 16),
                new THREE.MeshStandardMaterial({
                    color: color,
                    roughness: 0.7,
                    metalness: 0.1
                })
            );
            body.castShadow = true;
            enemyGroup.add(body);

            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(size * 0.2, 8, 8);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: eyeColor, emissive: eyeColor, emissiveIntensity: 2 });
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-size * 0.4, size * 0.2, size * 0.8);
            enemyGroup.add(leftEye);
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(size * 0.4, size * 0.2, size * 0.8);
            enemyGroup.add(rightEye);

            // Health
            enemyGroup.userData = {
                health: health,
                maxHealth: health,
                speed: speed,
                elite: elite,
                boss: boss,
                update: function(dt, playerPos) {
                    // Move toward player
                    const direction = new THREE.Vector3();
                    direction.subVectors(playerPos, this.position).normalize();
                    this.position.add(direction.multiplyScalar(this.speed));
                    this.lookAt(playerPos);
                    
                    // Check for collision with player
                    const distance = this.position.distanceTo(playerPos);
                    if (distance < 1.5 + size) {
                        gameState.health -= dt * (this.boss ? 15 : this.elite ? 10 : 5);
                        document.getElementById('damage-effect').style.background = `rgba(255, 0, 0, ${0.2 - distance / 10})`;
                    }
                }
            };

            scene.add(enemyGroup);
            return enemyGroup;
        }

        // Spawn enemies
        function spawnEnemies() {
            const enemyCount = 5 + gameState.wave * 2;
            for (let i = 0; i < enemyCount; i++) {
                gameState.enemies.push(createEnemy());
            }
            
            // Elite enemies
            if (gameState.wave % 3 === 0) {
                gameState.enemies.push(createEnemy(true));
            }
            
            // Boss
            if (gameState.wave % 5 === 0) {
                gameState.enemies.push(createEnemy(false, true));
            }
        }

        // Spawn enemies
        function spawnEnemies() {
            for (let i = 0; i < 5; i++) {
                gameState.enemies.push(createEnemy());
            }
        }

        // Start
        createArena();
        spawnEnemies();
        requestAnimationFrame(animate);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
