<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Dominion - Roguelite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            overflow: hidden;
            background: #0a0a12;
            font-family: 'Rajdhani', sans-serif;
            cursor: none;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(100,200,255,0.5);
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255,255,255,0.8);
        }
        
        #crosshair::before {
            width: 8px;
            height: 2px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #crosshair::after {
            width: 2px;
            height: 8px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .hud-bar {
            position: absolute;
            height: 28px;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 2px 4px rgba(0,0,0,0.3);
        }
        
        #healthBar {
            bottom: 40px;
            left: 30px;
            width: 300px;
            background: linear-gradient(180deg, #1a0a0a 0%, #0d0505 100%);
        }
        
        #healthBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ff2d2d, #ff6b6b, #ff2d2d);
            box-shadow: 0 0 20px #ff4444, inset 0 -2px 4px rgba(0,0,0,0.3);
            transition: width 0.2s;
            border-radius: 12px;
        }
        
        #manaBar {
            bottom: 80px;
            left: 30px;
            width: 300px;
            background: linear-gradient(180deg, #0a1a2a 0%, #051525 100%);
        }
        
        #manaBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #2d7dff, #6bb5ff, #2d7dff);
            box-shadow: 0 0 20px #4488ff, inset 0 -2px 4px rgba(0,0,0,0.3);
            transition: width 0.2s;
            border-radius: 12px;
        }
        
        .bar-label {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            font-weight: 700;
            color: white;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            z-index: 1;
        }
        
        #spellBar {
            bottom: 40px;
            right: 30px;
            display: flex;
            gap: 10px;
        }
        
        .spell-slot {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(30,30,40,0.9) 0%, rgba(15,15,20,0.9) 100%);
            border: 2px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        
        .spell-slot.active {
            border-color: #ffdd44;
            box-shadow: 0 0 20px rgba(255,220,68,0.5);
        }
        
        .spell-slot .key {
            position: absolute;
            top: 3px;
            left: 5px;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            font-weight: 600;
        }
        
        .spell-slot .icon {
            font-size: 24px;
        }
        
        .spell-slot .name {
            font-size: 9px;
            color: rgba(255,255,255,0.7);
            margin-top: 2px;
        }
        
        .spell-slot .cooldown {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            border-radius: 0 0 10px 10px;
            transition: height 0.1s;
        }
        
        #score {
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cinzel', serif;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255,215,0,0.6), 0 2px 4px rgba(0,0,0,0.8);
        }
        
        #levelInfo {
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: rgba(255,255,255,0.7);
        }
        
        #messageArea {
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            color: #fff;
            text-shadow: 0 0 30px currentColor;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            white-space: nowrap;
        }
        
        #damageNumbers {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .damage-number {
            position: absolute;
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 0 10px currentColor;
            animation: damageFloat 1s ease-out forwards;
            pointer-events: none;
        }
        
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(0.7); }
        }
        
        #startScreen, #upgradeScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(20,10,40,0.95) 0%, rgba(5,5,15,0.98) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        
        #startScreen h1 {
            font-family: 'Cinzel', serif;
            font-size: 64px;
            color: #a855f7;
            text-shadow: 0 0 40px #a855f7, 0 0 80px #7c3aed;
            margin-bottom: 10px;
            animation: titlePulse 3s ease-in-out infinite;
        }
        
        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 40px #a855f7, 0 0 80px #7c3aed; }
            50% { text-shadow: 0 0 60px #c084fc, 0 0 100px #a855f7; }
        }
        
        #startScreen h2 {
            font-size: 24px;
            color: #6366f1;
            margin-bottom: 50px;
            letter-spacing: 8px;
        }
        
        .menu-btn {
            padding: 18px 50px;
            font-size: 20px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            color: white;
            background: linear-gradient(180deg, #7c3aed 0%, #5b21b6 100%);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 4px 20px rgba(124,58,237,0.4);
        }
        
        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(124,58,237,0.7);
        }
        
        #upgradeScreen {
            display: none;
            background: radial-gradient(ellipse at center, rgba(15,25,45,0.97) 0%, rgba(5,10,20,0.98) 100%);
        }
        
        #upgradeScreen h2 {
            font-family: 'Cinzel', serif;
            font-size: 42px;
            color: #fbbf24;
            text-shadow: 0 0 30px rgba(251,191,36,0.6);
            margin-bottom: 30px;
        }
        
        .upgrade-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .upgrade-card {
            width: 200px;
            padding: 20px;
            background: linear-gradient(180deg, rgba(40,40,60,0.9) 0%, rgba(20,20,35,0.9) 100%);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .upgrade-card:hover {
            transform: translateY(-10px);
            border-color: #a855f7;
            box-shadow: 0 10px 40px rgba(168,85,247,0.4);
        }
        
        .upgrade-card .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .upgrade-card .name {
            font-size: 18px;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 8px;
        }
        
        .upgrade-card .desc {
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.4;
        }
        
        .upgrade-card .rarity {
            margin-top: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .rarity-common { background: #6b7280; color: white; }
        .rarity-rare { background: #3b82f6; color: white; }
        .rarity-epic { background: #a855f7; color: white; }
        .rarity-legendary { background: linear-gradient(90deg, #f59e0b, #ef4444); color: white; }
        
        #gameOverScreen {
            display: none;
        }
        
        #gameOverScreen h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            color: #ef4444;
            text-shadow: 0 0 40px rgba(239,68,68,0.6);
            margin-bottom: 20px;
        }
        
        #gameOverScreen .stats {
            font-size: 22px;
            color: #e2e8f0;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.8;
        }
        
        #gameOverScreen .stats span {
            color: #fbbf24;
        }
        
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            text-align: center;
        }
        
        #chargeIndicator {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        #chargeIndicator .charge-fill {
            height: 100%;
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            width: 0%;
            transition: width 0.1s;
            box-shadow: 0 0 15px #fbbf24;
        }
        
        .screen-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            z-index: 50;
        }
        
        #killCount {
            top: 30px;
            right: 30px;
            font-size: 16px;
            color: rgba(255,255,255,0.6);
        }
        
        #comboDisplay {
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: 700;
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251,191,36,0.6);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        #enemyHealthBar {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: rgba(0,0,0,0.6);
            border-radius: 5px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        #enemyHealthBar .fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f87171);
            transition: width 0.2s;
        }
        
        #enemyName {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div id="crosshair"></div>
        
        <div id="healthBar" class="hud-bar">
            <div class="fill" style="width: 100%"></div>
            <span class="bar-label">♥</span>
        </div>
        
        <div id="manaBar" class="hud-bar">
            <div class="fill" style="width: 100%"></div>
            <span class="bar-label">♦</span>
        </div>
        
        <div id="spellBar"></div>
        
        <div id="score">0</div>
        <div id="levelInfo">Wave 1 - The Arcane Sanctum</div>
        <div id="killCount">Kills: 0</div>
        <div id="comboDisplay">COMBO x1</div>
        
        <div id="enemyName">Enemy</div>
        <div id="enemyHealthBar"><div class="fill" style="width: 100%"></div></div>
        
        <div id="chargeIndicator"><div class="charge-fill"></div></div>
        
        <div id="messageArea"></div>
        
        <div id="damageNumbers"></div>
        
        <div id="controls">
            WASD - Move | SPACE - Jump | SHIFT - Dash | MOUSE - Look | 1-4 - Cast Spells | LEFT CLICK - Primary | RIGHT CLICK - Alternate
        </div>
        
        <div id="startScreen">
            <h1>ARCANE DOMINION</h1>
            <h2>A Roguelite Experience</h2>
            <button class="menu-btn" onclick="startGame()">Enter the Realm</button>
            <button class="menu-btn" onclick="showHowToPlay()">How to Play</button>
        </div>
        
        <div id="upgradeScreen">
            <h2>⚡ Choose Your Power ⚡</h2>
            <div class="upgrade-container" id="upgradeCards"></div>
            <button class="menu-btn" onclick="skipUpgrade()">Skip</button>
        </div>
        
        <div id="gameOverScreen">
            <h1>DEFEATED</h1>
            <div class="stats" id="finalStats"></div>
            <button class="menu-btn" onclick="restartGame()">Rise Again</button>
        </div>
    </div>
    
    <div class="screen-flash" id="screenFlash"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ============================================
        // ARCANE DOMINION - Roguelite Game Engine
        // ============================================
        
        // Game State
        const GameState = {
            MENU: 'menu',
            PLAYING: 'playing',
            UPGRADE: 'upgrade',
            GAMEOVER: 'gameover'
        };
        
        let gameState = GameState.MENU;
        let scene, camera, renderer, clock;
        let player, playerHealth = 100, playerMana = 100;
        let maxHealth = 100, maxMana = 100;
        let score = 0, kills = 0, wave = 1;
        let enemies = [], projectiles = [], particles = [];
        let arena;
        let isJumping = false, canJump = true;
        let isDashing = false, dashCooldown = 0;
        let isCharging = false, chargeTime = 0;
        let currentSpell = 0;
        let combo = 1, comboTimer = 0;
        let enemyTarget = null;
        let upgradePoints = 0;
        
        // Movement
        const keys = {};
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        let moveSpeed = 12;
        let jumpForce = 15;
        let gravity = 40;
        
        // Spells Configuration
        const SPELLS = [
            { name: 'Arcane Bolt', icon: '✦', key: '1', color: '#a855f7', manaCost: 8, cooldown: 0, damage: 25, type: 'projectile' },
            { name: 'Flame Burst', icon: '🔥', key: '2', color: '#f97316', manaCost: 15, cooldown: 0.5, damage: 40, type: 'explosion' },
            { name: 'Frost Nova', icon: '❄', key: '3', color: '#06b6d4', manaCost: 20, cooldown: 1, damage: 30, type: 'aoe' },
            { name: 'Lightning Strike', icon: '⚡', key: '4', color: '#eab308', manaCost: 25, cooldown: 1.5, damage: 60, type: 'chain' }
        ];
        
        // Player spells (can be upgraded)
        let playerSpells = [
            { ...SPELLS[0], level: 1 },
            { ...SPELLS[1], level: 1 },
            { ...SPELLS[2], level: 1 },
            { ...SPELLS[3], level: 1 }
        ];
        
        let spellCooldowns = [0, 0, 0, 0];
        
        // Enemy Types
        const ENEMY_TYPES = {
            Wisp: { health: 30, speed: 8, damage: 5, color: 0x88ccff, scale: 0.5, xp: 10 },
            Shade: { health: 50, speed: 5, damage: 10, color: 0x6644aa, scale: 0.8, xp: 20 },
            Golem: { health: 100, speed: 3, damage: 15, color: 0x886644, scale: 1.2, xp: 35 },
            VoidBeast: { health: 80, speed: 7, damage: 12, color: 0x22ff44, scale: 0.9, xp: 30 },
            NetherLord: { health: 200, speed: 4, damage: 20, color: 0xff2266, scale: 1.5, xp: 100 }
        };
        
        // Arena Themes
        const ARENAS = [
            { name: 'The Arcane Sanctum', floorColor: 0x1a1a2e, wallColor: 0x2d2d44, accentColor: 0x6366f1 },
            { name: 'Crimson Cathedral', floorColor: 0x2a1a1a, wallColor: 0x3d2020, accentColor: 0xef4444 },
            { name: 'Frostbitten Crypt', floorColor: 0x1a2a2e, wallColor: 0x203538, accentColor: 0x06b6d4 },
            { name: 'Verdant Ruins', floorColor: 0x1a2a1a, wallColor: 0x253525, accentColor: 0x22c55e }
        ];
        
        // Hand models
        let leftHand, rightHand;
        let handMixer, handActions = {};
        
        // Upgrades
        const UPGRADES = [
            { id: 'health_boost', name: 'Vital Essence', icon: '❤', desc: '+30 Max Health', rarity: 'common', apply: () => { maxHealth += 30; playerHealth = Math.min(playerHealth + 30, maxHealth); } },
            { id: 'mana_boost', name: 'Mana Stream', icon: '💎', desc: '+25 Max Mana', rarity: 'common', apply: () => { maxMana += 25; playerMana = Math.min(playerMana + 25, maxMana); } },
            { id: 'spell_power', name: 'Arcane Amplification', icon: '✦', desc: '+20% Spell Damage', rarity: 'rare', apply: () => { playerSpells.forEach(s => s.damage *= 1.2); } },
            { id: 'cast_speed', name: 'Haste', icon: '⏩', desc: '-15% Cooldowns', rarity: 'rare', apply: () => { playerSpells.forEach(s => s.cooldown *= 0.85); } },
            { id: 'mana_regen', name: 'Mana Flow', icon: '🔮', desc: '+30% Mana Regen', rarity: 'rare', apply: () => { /* handled in update */ } },
            { id: 'multicast', name: 'Multicast', icon: '🎭', desc: '10% Chance to Cast Twice', rarity: 'epic', apply: () => { /* handled in cast */ } },
            { id: 'vampiric', name: 'Life Leech', icon: '🩸', desc: 'Heal 5% on Kill', rarity: 'epic', apply: () => { /* handled in kill */ } },
            { id: 'Phoenix', name: 'Phoenix Blessing', icon: '🔥', desc: 'Revive Once with 50% HP', rarity: 'legendary', apply: () => { player.revive = true; } },
            { id: 'ChainMastery', name: 'Chain Mastery', icon: '⚡', desc: '+1 Chain Target', rarity: 'epic', apply: () => { /* handled in lightning */ } },
            { id: 'nova_boost', name: 'Expanded Nova', icon: '🌟', desc: '+50% Frost Nova Radius', rarity: 'rare', apply: () => { if(playerSpells[2].level) playerSpells[2].explosionRadius *= 1.5; } }
        ];
        
        // ==================
        // INITIALIZATION
        // ==================
        
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0a15, 0.015);
            
            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            
            // Clock
            clock = new THREE.Clock();
            
            // Lights
            const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
            mainLight.position.set(10, 20, 10);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.camera.near = 0.5;
            mainLight.shadow.camera.far = 100;
            mainLight.shadow.camera.left = -30;
            mainLight.shadow.camera.right = 30;
            mainLight.shadow.camera.top = 30;
            mainLight.shadow.camera.bottom = -30;
            scene.add(mainLight);
            
            // Player light
            const playerLight = new THREE.PointLight(0xa855f7, 1, 15);
            playerLight.position.copy(camera.position);
            scene.add(playerLight);
            player = { light: playerLight, revive: false };
            
            // Create arena
            createArena();
            
            // Create hands
            createHands();
            
            // Create UI
            createSpellBar();
            
            // Events
            window.addEventListener('resize', onResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('contextmenu', e => e.preventDefault());
            
            // Start render loop
            animate();
        }
        
        // ==================
        // ARENA CREATION
        // ==================
        
        function createArena() {
            const theme = ARENAS[Math.floor(Math.random() * ARENAS.length)];
            
            // Clear old arena
            if (arena) {
                scene.remove(arena);
            }
            
            arena = new THREE.Group();
            
            // Floor
            const floorGeo = new THREE.PlaneGeometry(80, 80, 20, 20);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: theme.floorColor,
                roughness: 0.8,
                metalness: 0.2
            });
            
            // Add floor pattern
            const positions = floorGeo.attributes.position;
            for (let i = 0; i < positions.count; i++) {
                positions.setZ(i, (Math.random() - 0.5) * 0.1);
            }
            floorGeo.computeVertexNormals();
            
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            arena.add(floor);
            
            // Floor grid lines
            const gridHelper = new THREE.GridHelper(80, 40, theme.accentColor, theme.wallColor);
            gridHelper.position.y = 0.01;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            arena.add(gridHelper);
            
            // Pillars
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 25 + Math.random() * 10;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                
                const pillarGeo = new THREE.CylinderGeometry(1.5, 2, 8 + Math.random() * 4, 8);
                const pillarMat = new THREE.MeshStandardMaterial({
                    color: theme.wallColor,
                    roughness: 0.6,
                    metalness: 0.4
                });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(x, 4, z);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                arena.add(pillar);
                
                // Pillar glow
                const glowGeo = new THREE.SphereGeometry(0.5, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({ color: theme.accentColor });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.set(x, 7, z);
                arena.add(glow);
                
                // Point light on some pillars
                if (i % 3 === 0) {
                    const light = new THREE.PointLight(theme.accentColor, 0.5, 15);
                    light.position.set(x, 6, z);
                    arena.add(light);
                }
            }
            
            // Random obstacles
            for (let i = 0; i < 8; i++) {
                const x = (Math.random() - 0.5) * 50;
                const z = (Math.random() - 0.5) * 50;
                
                if (Math.abs(x) < 8 && Math.abs(z) < 8) continue;
                
                const obsGeo = new THREE.BoxGeometry(2 + Math.random() * 2, 1 + Math.random() * 3, 2 + Math.random() * 2);
                const obsMat = new THREE.MeshStandardMaterial({
                    color: theme.wallColor,
                    roughness: 0.7,
                    metalness: 0.3
                });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(x, obsGeo.parameters.height / 2, z);
                obs.castShadow = true;
                obs.receiveShadow = true;
                arena.add(obs);
            }
            
            scene.add(arena);
            
            // Update UI
            document.getElementById('levelInfo').textContent = `Wave ${wave} - ${theme.name}`;
        }

        // ==================
        // UI CREATION
        // ==================
        
        function createSpellBar() {
            const bar = document.getElementById('spellBar');
            bar.innerHTML = '';
            
            playerSpells.forEach((spell, i) => {
                const slot = document.createElement('div');
                slot.className = 'spell-slot';
                slot.innerHTML = `
                    <span class="key">${spell.key}</span>
                    <span class="icon">${spell.icon}</span>
                    <span class="name">${spell.name}</span>
                `;
                if (i === currentSpell) slot.classList.add('active');
                bar.appendChild(slot);
            });
        }
        
        function updateSpellBar() {
            const slots = document.querySelectorAll('.spell-slot');
            slots.forEach((slot, i) => {
                slot.classList.toggle('active', i === currentSpell);
                
                const cooldown = spellCooldowns[i];
                const maxCd = playerSpells[i].cooldown;
                
                let cooldownEl = slot.querySelector('.cooldown');
                if (!cooldownEl) {
                    cooldownEl = document.createElement('div');
                    cooldownEl.className = 'cooldown';
                    slot.appendChild(cooldownEl);
                }
                
                if (cooldown > 0) {
                    cooldownEl.style.height = `${(cooldown / maxCd) * 100}%`;
                } else {
                    cooldownEl.style.height = '0%';
                }
            });
        }
        
        // ==================
        // INPUT HANDLING
        // ==================
        
        function onKeyDown(e) {
            keys[e.code] = true;
            
            // Spell selection
            if (e.code >= 'Digit1' && e.code <= 'Digit4') {
                currentSpell = parseInt(e.code.replace('Digit', '')) - 1;
                createSpellBar();
                updateSpellBar();
            }
            
            // Jump
            if (e.code === 'Space' && canJump && !isJumping && gameState === GameState.PLAYING) {
                velocity.y = jumpForce;
                isJumping = true;
                canJump = false;
            }
            
            // Dash
            if (e.code === 'ShiftLeft' && dashCooldown <= 0 && gameState === GameState.PLAYING) {
                isDashing = true;
                dashCooldown = 1.5;
                
                const dashDir = new THREE.Vector3();
                camera.getWorldDirection(dashDir);
                dashDir.y = 0;
                dashDir.normalize();
                velocity.add(dashDir.multiplyScalar(30));
                
                // Dash particles
                for (let i = 0; i < 10; i++) {
                    createParticle(
                        camera.position.clone().add(new THREE.Vector3((Math.random()-0.5), 0, (Math.random()-0.5))),
                        0xa855f7, 0.5, 2
                    );
                }
            }
        }
        
        function onKeyUp(e) {
            keys[e.code] = false;
        }
        
        function onMouseDown(e) {
            if (gameState !== GameState.PLAYING) return;
            
            if (e.button === 0) {
                isCharging = true;
                chargeTime = 0;
            }
        }
        
        function onMouseUp(e) {
            if (gameState !== GameState.PLAYING) return;
            
            if (e.button === 0 && isCharging) {
                castSpell(currentSpell, chargeTime);
                isCharging = false;
                chargeTime = 0;
                document.getElementById('chargeIndicator').style.opacity = '0';
            }
        }
        
        function onMouseMove(e) {
            if (gameState !== GameState.PLAYING) return;
            
            const sensitivity = 0.002;
            camera.rotation.y -= e.movementX * sensitivity;
            camera.rotation.x -= e.movementY * sensitivity;
            camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
        }
        
        // ==================
        // SPELL CASTING
        // ==================
        
        function castSpell(spellIndex, charge) {
            const spell = playerSpells[spellIndex];
            
            if (spellCooldowns[spellIndex] > 0 || playerMana < spell.manaCost) {
                return;
            }
            
            playerMana -= spell.manaCost;
            spellCooldowns[spellIndex] = spell.cooldown || 0.1;
            
            // Multicast chance
            const multicast = Math.random() < 0.1;
            
            // Cast the spell
            castSpellType(spell, charge);
            
            if (multicast) {
                setTimeout(() => castSpellType(spell, charge), 100);
                showMessage('MULTICAST!', '#fbbf24');
            }
            
            // Hand animation
            animateCast(spell.color);
            
            // Screen shake
            screenShake(0.1);
        }
        
        function castSpellType(spell, charge) {
            const chargeMultiplier = 1 + Math.min(charge, 2) * 0.5;
            const damage = spell.damage * chargeMultiplier;
            
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            const startPos = camera.position.clone().add(dir.clone().multiplyScalar(1));
            
            switch(spell.type) {
                case 'projectile':
                    createProjectile(startPos, dir, spell, damage);
                    break;
                case 'explosion':
                    createExplosion(startPos, spell, damage);
                    break;
                case 'aoe':
                    createFrostNova(spell, damage);
                    break;
                case 'chain':
                    createLightning(startPos, dir, spell, damage);
                    break;
            }
        }
        
        function createProjectile(position, direction, spell, damage) {
            const geo = new THREE.SphereGeometry(0.2, 16, 16);
            const mat = new THREE.MeshBasicMaterial({
                color: spell.color,
                transparent: true,
                opacity: 0.9
            });
            const proj = new THREE.Mesh(geo, mat);
            proj.position.copy(position);
            
            // Glow
            const glowGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: spell.color,
                transparent: true,
                opacity: 0.3
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            proj.add(glow);
            
            // Trail
            const trail = createTrail(spell.color);
            proj.add(trail);
            
            proj.userData = {
                velocity: direction.multiplyScalar(40),
                damage: damage,
                spell: spell,
                life: 3,
                radius: 0.5
            };
            
            scene.add(proj);
            projectiles.push(proj);
            
            // Cast sound effect particles
            for (let i = 0; i < 5; i++) {
                createParticle(position.clone(), spell.color, 0.3, 1);
            }
        }
        
        function createExplosion(position, spell, damage) {
            // Create expanding ring
            const ringGeo = new THREE.RingGeometry(0.1, 0.3, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: spell.color,
                transparent: true,
                opacity: 1,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(position);
            ring.lookAt(camera.position);
            
            ring.userData = {
                type: 'explosion',
                scale: 0,
                maxScale: 8,
                damage: damage,
                spell: spell,
                life: 0.5
            };
            
            scene.add(ring);
            projectiles.push(ring);
            
            // Explosion particles
            for (let i = 0; i < 30; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 10 + Math.random() * 20;
                const vel = new THREE.Vector3(
                    Math.cos(angle) * speed,
                    (Math.random() - 0.5) * 10,
                    Math.sin(angle) * speed
                );
                createParticle(position.clone(), spell.color, 0.5, 1, vel);
            }
            
            // Check enemies in range
            enemies.forEach(enemy => {
                const dist = enemy.mesh.position.distanceTo(position);
                if (dist < 8) {
                    const dmg = damage * (1 - dist / 8);
                    damageEnemy(enemy, dmg);
                }
            });
            
            // Flash
            flashScreen(spell.color, 0.3);
        }
        
        function createFrostNova(spell, damage) {
            const radius = 12;
            
            // Multiple rings
            for (let i = 0; i < 3; i++) {
                const ringGeo = new THREE.RingGeometry(0.5, 1, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: spell.color,
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(camera.position);
                ring.position.y = 0.5;
                
                ring.userData = {
                    type: 'nova',
                    radius: 0,
                    maxRadius: radius,
                    delay: i * 0.1,
                    damage: damage,
                    spell: spell,
                    life: 1
                };
                
                scene.add(ring);
                projectiles.push(ring);
            }
            
            // Nova particles
            for (let i = 0; i < 50; i++) {
                const angle = (i / 50) * Math.PI * 2;
                const pos = camera.position.clone();
                pos.x += Math.cos(angle) * 2;
                pos.z += Math.sin(angle) * 2;
                createParticle(pos, spell.color, 0.4, 1.5);
            }
            
            // Damage all enemies
            enemies.forEach(enemy => {
                const dist = enemy.mesh.position.distanceTo(camera.position);
                if (dist < radius) {
                    damageEnemy(enemy, damage);
                    enemy.slowed = 3;
                }
            });
            
            flashScreen(spell.color, 0.2);
        }
        
        function createLightning(startPos, direction, spell, damage) {
            // Main bolt
            createLightningBolt(startPos, direction.multiplyScalar(30), damage, spell.color, 3);
            
            // Chain to nearby enemies
            let targets = enemies
                .filter(e => e.mesh.position.distanceTo(startPos) < 20)
                .sort((a, b) => a.mesh.position.distanceTo(startPos) - b.mesh.position.distanceTo(startPos))
                .slice(0, 3);
            
            targets.forEach((enemy, i) => {
                setTimeout(() => {
                    if (enemy.mesh) {
                        createLightningBolt(
                            startPos.clone(),
                            enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)),
                            damage * (1 - i * 0.3),
                            spell.color,
                            2
                        );
                        damageEnemy(enemy, damage * (1 - i * 0.3));
                    }
                }, 100 + i * 50);
            });
        }
        
        function createLightningBolt(start, end, damage, color, life) {
            const points = [];
            const segments = 10;
            
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const pos = new THREE.Vector3().lerpVectors(start, end, t);
                pos.x += (Math.random() - 0.5) * 2 * t;
                pos.y += (Math.random() - 0.5) * 2;
                pos.z += (Math.random() - 0.5) * 2 * t;
                points.push(pos);
            }
            
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: color,
                linewidth: 3
            });
            const line = new THREE.Line(geo, mat);
            
            line.userData = {
                type: 'lightning',
                damage: damage,
                life: life,
                maxLife: life
            };
            
            scene.add(line);
            projectiles.push(line);
            
            // Impact particles
            for (let i = 0; i < 15; i++) {
                createParticle(end.clone(), color, 0.3, 0.8);
            }
        }
        
        function createTrail(color) {
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(30 * 3);
            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const mat = new THREE.LineBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.5
            });
            
            return new THREE.Line(geo, mat);
        }
        
        // ==================
        // ENEMIES
        // ==================
        
        function spawnEnemy(type, elite = false) {
            const template = ENEMY_TYPES[type];
            const angle = Math.random() * Math.PI * 2;
            const dist = 20 + Math.random() * 10;
            
            const x = Math.cos(angle) * dist;
            const z = Math.sin(angle) * dist;
            
            // Create enemy mesh
            let geo, mat;
            
            if (type === 'Wisp') {
                geo = new THREE.IcosahedronGeometry(template.scale, 1);
                mat = new THREE.MeshBasicMaterial({ color: template.color, transparent: true, opacity: 0.8 });
            } else if (type === 'Shade') {
                geo = new THREE.ConeGeometry(template.scale * 0.5, template.scale * 1.5, 6);
                mat = new THREE.MeshStandardMaterial({ color: template.color, roughness: 0.3, metalness: 0.7 });
            } else if (type === 'Golem') {
                geo = new THREE.BoxGeometry(template.scale, template.scale * 1.5, template.scale);
                mat = new THREE.MeshStandardMaterial({ color: template.color, roughness: 0.8 });
            } else if (type === 'VoidBeast') {
                geo = new THREE.OctahedronGeometry(template.scale, 0);
                mat = new THREE.MeshStandardMaterial({ color: template.color, roughness: 0.4, metalness: 0.6 });
            } else {
                geo = new THREE.DodecahedronGeometry(template.scale, 0);
                mat = new THREE.MeshStandardMaterial({ color: template.color, roughness: 0.5 });
            }
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, template.scale, z);
            mesh.castShadow = true;
            
            if (elite) {
                mesh.scale.multiplyScalar(1.5);
                mat.emissive = new THREE.Color(0x441100);
            }
            
            scene.add(mesh);
            
            const enemy = {
                mesh: mesh,
                type: type,
                health: template.health * (elite ? 2 : 1),
                maxHealth: template.health * (elite ? 2 : 1),
                speed: template.speed * (elite ? 1.2 : 1),
                damage: template.damage * (elite ? 1.5 : 1),
                xp: template.xp * (elite ? 2 : 1),
                slowed: 0,
                elite: elite,
                name: elite ? `Elite ${type}` : type
            };
            
            // Add glow for elite
            if (elite) {
                const glowGeo = new THREE.SphereGeometry(template.scale * 2, 16, 16);
                const glowMat = new THREE.MeshBasicMaterial({
                    color: 0xff4400,
                    transparent: true,
                    opacity: 0.2
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                mesh.add(glow);
            }
            
            enemies.push(enemy);
            
            // Spawn particles
            for (let i = 0; i < 10; i++) {
                createParticle(
                    new THREE.Vector3(x, template.scale, z),
                    elite ? 0xff4400 : template.color,
                    0.3, 1
                );
            }
        }
        
        function spawnWave() {
            const enemyCount = 3 + Math.floor(wave * 1.5);
            const types = Object.keys(ENEMY_TYPES);
            
            for (let i = 0; i < enemyCount; i++) {
                setTimeout(() => {
                    if (gameState !== GameState.PLAYING) return;
                    
                    const type = types[Math.floor(Math.random() * Math.min(types.length, 2 + Math.floor(wave / 2)))];
                    const elite = Math.random() < 0.1 + wave * 0.05;
                    spawnEnemy(type, elite);
                }, i * 500);
            }
            
            // Boss wave every 5 waves
            if (wave % 5 === 0) {
                setTimeout(() => spawnEnemy('NetherLord', true), enemyCount * 500);
            }
        }
        
        function updateEnemies(delta) {
            const playerPos = camera.position.clone();
            playerPos.y = 0;
            
            enemies.forEach((enemy, index) => {
                if (!enemy.mesh) return;
                
                // Movement
                const dir = playerPos.clone().sub(enemy.mesh.position.clone());
                dir.y = 0;
                const dist = dir.length();
                
                if (dist > 1.5) {
                    dir.normalize();
                    let speed = enemy.speed;
                    if (enemy.slowed > 0) {
                        speed *= 0.3;
                        enemy.slowed -= delta;
                    }
                    enemy.mesh.position.add(dir.multiplyScalar(speed * delta));
                }
                
                // Look at player
                enemy.mesh.lookAt(camera.position);
                
                // Float animation
                if (enemy.type === 'Wisp') {
                    enemy.mesh.position.y = 1 + Math.sin(Date.now() * 0.003) * 0.5;
                }
                
                // Attack player
                if (dist < 2 && !isDashing) {
                    playerHealth -= enemy.damage * delta;
                    screenShake(0.05);
                    flashScreen(0xff0000, 0.1);
                }
                
                // Death check
                if (enemy.health <= 0) {
                    killEnemy(enemy, index);
                }
            });
        }
        
        function killEnemy(enemy, index) {
            // Death particles
            for (let i = 0; i < 20; i++) {
                createParticle(
                    enemy.mesh.position.clone(),
                    enemy.elite ? 0xff4400 : 0xff6666,
                    0.5, 1.5
                );
            }
            
            // Score and XP
            score += enemy.xp;
            kills++;
            
            // Combo
            comboTimer = 2;
            combo = Math.min(combo + 1, 10);
            
            // Heal on kill (vampiric upgrade)
            if (player.revive && Math.random() < 0.05) {
                playerHealth = Math.min(maxHealth, playerHealth + 5);
            }
            
            showMessage(`+${enemy.xp}`, '#fbbf24');
            
            // Remove
            scene.remove(enemy.mesh);
            enemies.splice(index, 1);
            
            // Update UI
            updateHUD();
            
            // Check wave complete
            if (enemies.length === 0) {
                setTimeout(() => {
                    if (gameState === GameState.PLAYING) {
                        wave++;
                        upgradePoints++;
                        showUpgradeScreen();
                    }
                }, 2000);
            }
        }
        
        function damageEnemy(enemy, damage) {
            enemy.health -= damage;
            
            // Damage number
            createDamageNumber(enemy.mesh.position, Math.floor(damage), '#ff6666');
            
            // Hit particles
            for (let i = 0; i < 5; i++) {
                createParticle(enemy.mesh.position.clone(), 0xff4444, 0.3, 0.5);
            }
            
            // Set as target for UI
            enemyTarget = enemy;
        }
        
        // ==================
        // PARTICLES
        // ==================
        
        function createParticle(position, color, size, life, velocity = null) {
            const geo = new THREE.SphereGeometry(size, 8, 8);
            const mat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 1
            });
            const particle = new THREE.Mesh(geo, mat);
            particle.position.copy(position);
            
            particle.userData = {
                velocity: velocity || new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    Math.random() * 5,
                    (Math.random() - 0.5) * 5
                ),
                life: life,
                maxLife: life
            };
            
            scene.add(particle);
            particles.push(particle);
        }
        
        function updateParticles(delta) {
            particles.forEach((p, i) => {
                p.userData.life -= delta;
                
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                    return;
                }
                
                p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
                p.userData.velocity.y -= 10 * delta; // Gravity
                p.material.opacity = p.userData.life / p.userData.maxLife;
                p.scale.setScalar(p.userData.life / p.userData.maxLife);
            });
        }
        
        // ==================
        // PROJECTILES
        // ==================
        
        function updateProjectiles(delta) {
            projectiles.forEach((p, i) => {
                if (p.userData.life !== undefined) {
                    p.userData.life -= delta;
                    
                    if (p.userData.life <= 0) {
                        scene.remove(p);
                        projectiles.splice(i, 1);
                        return;
                    }
                }
                
                // Projectile movement
                if (p.userData.velocity) {
                    p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
                    
                    // Trail update
                    if (p.children[1] && p.children[1].isLine) {
                        // Update trail positions
                    }
                }
                
                // Explosion expansion
                if (p.userData.type === 'explosion') {
                    const scale = p.userData.scale + delta * p.userData.maxScale * 2;
                    p.userData.scale = scale;
                    p.scale.setScalar(scale);
                    p.material.opacity = 1 - (scale / p.userData.maxScale);
                }
                
                // Nova expansion
                if (p.userData.type === 'nova') {
                    if (p.userData.delay > 0) {
                        p.userData.delay -= delta;
                    } else {
                        const expand = delta * p.userData.maxRadius * 3;
                        p.userData.radius += expand;
                        p.scale.setScalar(p.userData.radius);
                        p.material.opacity = 1 - (p.userData.radius / p.userData.maxRadius);
                    }
                }
                
                // Lightning fade
                if (p.userData.type === 'lightning') {
                    p.material.opacity = p.userData.life / p.userData.maxLife;
                    
                    // Jitter
                    const positions = p.geometry.attributes.position;
                    for (let j = 0; j < positions.count; j++) {
                        positions.setX(j, positions.getX(j) + (Math.random() - 0.5) * 0.2);
                    }
                    positions.needsUpdate = true;
                }
                
                // Collision with enemies
                if (p.userData.damage && p.userData.radius) {
                    enemies.forEach(enemy => {
                        if (enemy.mesh) {
                            const dist = p.position.distanceTo(enemy.mesh.position);
                            if (dist < p.userData.radius + 1) {
                                damageEnemy(enemy, p.userData.damage * delta * 5);
                            }
                        }
                    });
                }
            });
        }
        
        // ==================
        // PLAYER MOVEMENT
        // ==================
        
        function updateMovement(delta) {
            if (gameState !== GameState.PLAYING) return;
            
            // Direction
            direction.set(0, 0, 0);
            
            const forward = new THREE.Vector3();
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            
            const right = new THREE.Vector3();
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0));
            
            if (keys['KeyW']) direction.add(forward);
            if (keys['KeyS']) direction.sub(forward);
            if (keys['KeyA']) direction.sub(right);
            if (keys['KeyD']) direction.add(right);
            
            if (direction.length() > 0) {
                direction.normalize();
            }
            
            // Apply movement
            const speed = isDashing ? moveSpeed * 3 : moveSpeed;
            velocity.x = direction.x * speed;
            velocity.z = direction.z * speed;
            
            // Gravity
            velocity.y -= gravity * delta;
            
            // Update position
            camera.position.add(velocity.clone().multiplyScalar(delta));
            
            // Floor collision
            if (camera.position.y < 2) {
                camera.position.y = 2;
                velocity.y = 0;
                isJumping = false;
                canJump = true;
            }
            
            // Arena bounds
            const bound = 38;
            camera.position.x = Math.max(-bound, Math.min(bound, camera.position.x));
            camera.position.z = Math.max(-bound, Math.min(bound, camera.position.z));
            
            // Update player light
            player.light.position.copy(camera.position);
            
            // Dash cooldown
            if (dashCooldown > 0) {
                dashCooldown -= delta;
            }
            
            // Stop dashing after brief time
            if (isDashing && dashCooldown < 1.3) {
                isDashing = false;
            }
            
            // Charging
            if (isCharging) {
                chargeTime += delta;
                const chargePercent = Math.min(chargeTime, 2) / 2 * 100;
                document.getElementById('chargeIndicator').style.opacity = '1';
                document.querySelector('#chargeIndicator .charge-fill').style.width = chargePercent + '%';
                
                // Hand shake
                rightHand.position.x = 0.4 + Math.sin(chargeTime * 30) * 0.02;
            }
        }
        
        // ==================
        // UI UPDATES
        // ==================
        
        function updateHUD() {
            // Health
            const healthPercent = (playerHealth / maxHealth) * 100;
            document.querySelector('#healthBar .fill').style.width = healthPercent + '%';
            
            // Mana
            const manaPercent = (playerMana / maxMana) * 100;
            document.querySelector('#manaBar .fill').style.width = manaPercent + '%';
            
            // Score
            document.getElementById('score').textContent = score;
            document.getElementById('killCount').textContent = `Kills: ${kills}`;
            
            // Combo
            const comboEl = document.getElementById('comboDisplay');
            if (combo > 1) {
                comboEl.textContent = `COMBO x${combo}`;
                comboEl.style.opacity = '1';
            } else {
                comboEl.style.opacity = '0';
            }
            
            // Enemy health bar
            const enemyHealthBar = document.getElementById('enemyHealthBar');
            const enemyNameEl = document.getElementById('enemyName');
            
            if (enemyTarget && enemyTarget.mesh) {
                const healthPercent = (enemyTarget.health / enemyTarget.maxHealth) * 100;
                enemyHealthBar.querySelector('.fill').style.width = healthPercent + '%';
                enemyHealthBar.style.opacity = '1';
                enemyNameEl.textContent = enemyTarget.name;
                enemyNameEl.style.opacity = '1';
                
                // Position above enemy
                const screenPos = enemyTarget.mesh.position.clone().project(camera);
                const x = (screenPos.x + 1) / 2 * window.innerWidth;
                const y = (-screenPos.y + 1) / 2 * window.innerHeight;
                
                enemyHealthBar.style.left = x + 'px';
                enemyHealthBar.style.top = y + 'px';
                enemyNameEl.style.left = x + 'px';
                enemyNameEl.style.top = (y - 25) + 'px';
                
                if (enemyTarget.health <= 0) {
                    enemyTarget = null;
                }
            } else {
                enemyHealthBar.style.opacity = '0';
                enemyNameEl.style.opacity = '0';
                enemyTarget = null;
            }
        }
        
        function createDamageNumber(position, damage, color) {
            const screenPos = position.clone().project(camera);
            const x = (screenPos.x + 1) / 2 * window.innerWidth;
            const y = (-screenPos.y + 1) / 2 * window.innerHeight;
            
            const el = document.createElement('div');
            el.className = 'damage-number';
            el.textContent = Math.floor(damage);
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.color = color;
            
            document.getElementById('damageNumbers').appendChild(el);
            
            setTimeout(() => el.remove(), 1000);
        }
        
        function showMessage(text, color) {
            const el = document.getElementById('messageArea');
            el.textContent = text;
            el.style.color = color;
            el.style.opacity = '1';
            
            setTimeout(() => {
                el.style.opacity = '0';
            }, 1500);
        }
        
        function flashScreen(color, intensity) {
            const flash = document.getElementById('screenFlash');
            flash.style.background = color;
            flash.style.opacity = intensity;
            
            setTimeout(() => {
                flash.style.opacity = '0';
            }, 100);
        }
        
        let shakeIntensity = 0;
        function screenShake(intensity) {
            shakeIntensity = Math.max(shakeIntensity, intensity);
        }
        
        // ==================
        // ANIMATIONS
        // ==================
        
        function animateCast(color) {
            // Hand thrust
            const startX = rightHand.position.x;
            const startZ = rightHand.position.z;
            
            // Quick thrust animation
            let thrustTime = 0;
            const thrust = () => {
                thrustTime += 0.05;
                if (thrustTime < 0.3) {
                    rightHand.position.z = startZ - Math.sin(thrustTime * 20) * 0.3;
                    requestAnimationFrame(thrust);
                } else {
                    rightHand.position.z = startZ;
                }
            };
            thrust();
            
            // Orb color change
            const orb = rightHand.getObjectByName('orb');
            if (orb) {
                orb.material.color.set(color);
            }
            
            // Hand rotation
            rightHand.rotation.x = -0.5;
            setTimeout(() => { rightHand.rotation.x = 0; }, 200);
        }
        
        function animateHands(delta) {
            // Idle breathing
            const breath = Math.sin(Date.now() * 0.002) * 0.01;
            leftHand.position.y = -0.35 + breath;
            rightHand.position.y = -0.35 + breath;
            
            // Look around influence
            rightHand.rotation.y = -camera.rotation.y * 0.3;
            leftHand.rotation.y = -camera.rotation.y * 0.3;
        }
        
        // ==================
        // UPGRADES
        // ==================
        
        function showUpgradeScreen() {
            gameState = GameState.UPGRADE;
            
            const container = document.getElementById('upgradeCards');
            container.innerHTML = '';
            
            // Pick 3 random upgrades
            const choices = [];
            const available = [...UPGRADES];
            
            for (let i = 0; i < 3 && available.length > 0; i++) {
                const idx = Math.floor(Math.random() * available.length);
                choices.push(available[idx]);
                available.splice(idx, 1);
            }
            
            choices.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="icon">${upgrade.icon}</div>
                    <div class="name">${upgrade.name}</div>
                    <div class="desc">${upgrade.desc}</div>
                    <div class="rarity rarity-${upgrade.rarity}">${upgrade.rarity}</div>
                `;
                card.onclick = () => selectUpgrade(upgrade);
                container.appendChild(card);
            });
            
            document.getElementById('upgradeScreen').style.display = 'flex';
        }
        
        function selectUpgrade(upgrade) {
            upgrade.apply();
            
            // Level up spell
            if (upgrade.id.includes('spell') || upgrade.id === 'cast_speed') {
                playerSpells.forEach(s => s.level++);
            }
            
            document.getElementById('upgradeScreen').style.display = 'none';
            gameState = GameState.PLAYING;
            
            showMessage(`Acquired: ${upgrade.name}`, '#a855f7');
            
            // Continue wave
            setTimeout(() => spawnWave(), 1000);
        }
        
        function skipUpgrade() {
            document.getElementById('upgradeScreen').style.display = 'none';
            gameState = GameState.PLAYING;
            setTimeout(() => spawnWave(), 1000);
        }
        
        // ==================
        // GAME FLOW
        // ==================
        
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            
            // Reset game state
            playerHealth = 100;
            maxHealth = 100;
            playerMana = 100;
            maxMana = 100;
            score = 0;
            kills = 0;
            wave = 1;
            combo = 1;
            
            playerSpells = [
                { ...SPELLS[0], level: 1 },
                { ...SPELLS[1], level: 1 },
                { ...SPELLS[2], level: 1 },
                { ...SPELLS[3], level: 1 }
            ];
            
            spellCooldowns = [0, 0, 0, 0];
            createSpellBar();
            
            // Clear existing
            enemies.forEach(e => { if(e.mesh) scene.remove(e.mesh); });
            enemies = [];
            projectiles.forEach(p => scene.remove(p));
            projectiles = [];
            particles.forEach(p => scene.remove(p));
            particles = [];
            
            // Create new arena
            createArena();
            
            // Reset position
            camera.position.set(0, 2, 0);
            camera.rotation.set(0, 0, 0);
            velocity.set(0, 0, 0);
            
            gameState = GameState.PLAYING;
            
            // Start first wave
            setTimeout(() => spawnWave(), 1000);
        }
        
        function restartGame() {
            document.getElementById('gameOverScreen').style.display = 'none';
            startGame();
        }
        
        function gameOver() {
            gameState = GameState.GAMEOVER;
            
            const stats = document.getElementById('finalStats');
            stats.innerHTML = `
                Waves Survived: <span>${wave}</span><br>
                Enemies Slain: <span>${kills}</span><br>
                Final Score: <span>${score}</span>
            `;
            
            document.getElementById('gameOverScreen').style.display = 'flex';
        }
        
        function showHowToPlay() {
            alert(`ARCANE DOMINATION - How to Play

MOVEMENT:
- WASD: Move
- SPACE: Jump  
- SHIFT: Dash

COMBAT:
- Mouse: Aim
- Left Click (Hold): Charge Spell
- Release: Cast Charged Spell
- 1-4: Select Spell

SPELLS:
1. Arcane Bolt - Fast projectile
2. Flame Burst - Area explosion
3. Frost Nova - Slowing ring
4. Lightning Strike - Chain damage

TIPS:
- Charge spells for more damage
- Dash through enemies to avoid damage
- Build combos for bonus points
- Pick upgrades after each wave`);
        }
        
        // ==================
        // MAIN LOOP
        // ==================
        
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (gameState === GameState.PLAYING) {
                // Update systems
                updateMovement(delta);
                updateEnemies(delta);
                updateProjectiles(delta);
                updateParticles(delta);
                animateHands(delta);
                
                // Mana regen
                playerMana = Math.min(maxMana, playerMana + 10 * delta);
                
                // Spell cooldowns
                for (let i = 0; i < 4; i++) {
                    if (spellCooldowns[i] > 0) {
                        spellCooldowns[i] = Math.max(0, spellCooldowns[i] - delta);
                    }
                }
                
                // Combo decay
                if (comboTimer > 0) {
                    comboTimer -= delta;
                    if (comboTimer <= 0) {
                        combo = 1;
                    }
                }
                
                // Screen shake
                if (shakeIntensity > 0) {
                    camera.position.x += (Math.random() - 0.5) * shakeIntensity;
                    camera.position.y += (Math.random() - 0.5) * shakeIntensity;
                    shakeIntensity *= 0.9;
                    if (shakeIntensity < 0.01) shakeIntensity = 0;
                }
                
                // Check death
                if (playerHealth <= 0) {
                    if (player.revive) {
                        player.revive = false;
                        playerHealth = maxHealth * 0.5;
                        showMessage('PHOENIX REVIVAL!', '#f97316');
                        flashScreen(0xf97316, 0.5);
                    } else {
                        gameOver();
                    }
                }
                
                updateHUD();
                updateSpellBar();
            }
            
            renderer.render(scene, camera);
        }
        
        function onResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Start
        init();
    </script>
</body>
