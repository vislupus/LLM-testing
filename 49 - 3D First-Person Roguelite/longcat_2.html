<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Surge - Fantasy Roguelite</title>
    <style>
        :root {
            --bg: #0a0612;
            --panel: rgba(15, 10, 25, 0.85);
            --border: rgba(160, 120, 255, 0.35);
            --accent: #c89aff;
            --accent2: #ff9ee0;
            --text: #e8e0f0;
            --text2: #a090c0;
            --danger: #ff4466;
            --health: #ff5577;
            --mana: #55aaff;
            --energy: #ffcc44;
            --glow: 0 0 15px rgba(200, 150, 255, 0.5);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            cursor: crosshair;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }
        #game-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        #ui-overlay.hidden { opacity: 0; pointer-events: none; }
        /* Crosshair */
        .crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 32px; height: 32px;
            z-index: 15;
            pointer-events: none;
            opacity: 0.7;
            filter: drop-shadow(0 0 4px rgba(200, 150, 255, 0.8));
            transition: transform 0.05s, opacity 0.05s;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(220, 200, 255, 0.9);
        }
        .crosshair::before {
            width: 2px; height: 100%;
            left: 50%; top: 0;
            transform: translateX(-50%);
            border-radius: 1px;
        }
        .crosshair::after {
            width: 100%; height: 2px;
            top: 50%; left: 0;
            transform: translateY(-50%);
            border-radius: 1px;
        }
        /* HUD Bars */
        .hud-container {
            position: fixed;
            bottom: 24px; left: 24px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .bar-wrapper {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 6px 14px 6px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--glow);
            min-width: 260px;
            backdrop-filter: blur(8px);
        }
        .bar-icon {
            width: 28px; height: 28px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }
        .bar-icon.health { color: var(--health); background: radial-gradient(circle, var(--health), #441020); }
        .bar-icon.mana { color: var(--mana); background: radial-gradient(circle, var(--mana), #102044); }
        .bar-icon.energy { color: var(--energy); background: radial-gradient(circle, var(--energy), #443010); }
        .bar-info { flex: 1; }
        .bar-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            margin-bottom: 2px;
        }
        .bar-track {
            height: 6px;
            background: rgba(0,0,0,0.5);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.15s ease-out;
            position: relative;
        }
        .bar-fill.health { background: linear-gradient(90deg, #ff3355, #ff7799); }
        .bar-fill.mana { background: linear-gradient(90deg, #3388ff, #77bbff); }
        .bar-fill.energy { background: linear-gradient(90deg, #ffaa22, #ffdd66); }
        .bar-text {
            font-size: 10px;
            color: var(--text);
            font-weight: 600;
            margin-top: 2px;
            text-align: right;
        }
        /* Spell Bar */
        .spell-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 8px;
            pointer-events: none;
        }
        .spell-slot {
            width: 52px; height: 52px;
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
            box-shadow: var(--glow);
            transition: all 0.15s;
            backdrop-filter: blur(4px);
        }
        .spell-slot.active {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(200, 150, 255, 0.7);
            transform: scale(1.1);
            border-width: 3px;
        }
        .spell-slot .key {
            position: absolute;
            top: -16px;
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
        }
        .spell-slot .cooldown-overlay {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            border-radius: 0 0 10px 10px;
            transition: height 0.05s linear;
        }
        .spell-slot .charge-indicator {
            position: absolute;
            top: -4px; right: -4px;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #ffcc00;
            border: 2px solid #fff;
            display: none;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%,100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
        }
        /* Wave Info */
        .wave-info {
            position: fixed;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }
        .wave-info .wave-num {
            font-size: 28px;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(200, 150, 255, 0.6);
        }
        .wave-info .enemy-count {
            font-size: 12px;
            color: var(--text2);
            letter-spacing: 2px;
        }
        /* Damage Numbers */
        .damage-number {
            position: fixed;
            z-index: 25;
            pointer-events: none;
            font-weight: 900;
            font-size: 22px;
            text-shadow: 0 0 8px currentColor, 0 2px 4px rgba(0,0,0,0.8);
            animation: damageFloat 0.9s ease-out forwards;
        }
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            60% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-55px) scale(1.5); }
        }
        /* Upgrade Panel */
        .upgrade-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            background: var(--panel);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 28px 24px;
            pointer-events: auto;
            box-shadow: 0 0 60px rgba(200, 150, 255, 0.4);
            min-width: 500px;
            backdrop-filter: blur(16px);
            display: none;
        }
        .upgrade-panel.active { display: block; }
        .upgrade-panel h2 {
            text-align: center;
            font-size: 22px;
            color: var(--accent);
            letter-spacing: 4px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .upgrade-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px;
        }
        .upgrade-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            pointer-events: auto;
        }
        .upgrade-card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 25px rgba(200, 150, 255, 0.3);
            transform: translateY(-3px);
            background: rgba(200, 150, 255, 0.05);
        }
        .upgrade-card .icon {
            font-size: 36px;
            display: block;
            margin-bottom: 8px;
        }
        .upgrade-card .name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: 1px;
        }
        .upgrade-card .desc {
            font-size: 10px;
            color: var(--text2);
            margin-top: 4px;
            line-height: 1.4;
        }
        /* Menu Screens */
        .screen-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 100;
            background: rgba(5, 2, 12, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            pointer-events: auto;
            backdrop-filter: blur(6px);
        }
        .screen-overlay.hidden { display: none; }
        .screen-overlay h1 {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: 6px;
            color: var(--accent);
            text-shadow: 0 0 40px rgba(200, 150, 255, 0.7);
            margin-bottom: 8px;
        }
        .screen-overlay .subtitle {
            font-size: 14px;
            color: var(--text2);
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        .btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            border: 2px solid var(--accent);
            background: transparent;
            color: var(--accent);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            pointer-events: auto;
            margin: 6px;
            text-transform: uppercase;
        }
        .btn:hover {
            background: var(--accent);
            color: #0a0612;
            box-shadow: 0 0 30px rgba(200, 150, 255, 0.6);
        }
        .btn.danger { border-color: var(--danger); color: var(--danger); }
        .btn.danger:hover { background: var(--danger); color: #fff; }
        /* Screen shake */
        .screen-shake {
            animation: shake 0.2s ease-out;
        }
        @keyframes shake {
            0%,100% { transform: translate(0,0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, -3px); }
            80% { transform: translate(2px, 3px); }
        }
        /* Responsive */
        @media (max-width: 700px) {
            .bar-wrapper { min-width: 180px; padding: 4px 10px 4px 6px; }
            .spell-slot { width: 40px; height: 40px; font-size: 18px; }
            .upgrade-panel { min-width: 90vw; padding: 16px 10px; }
            .upgrade-options { grid-template-columns: 1fr; }
            .hud-container { bottom: 12px; left: 12px; }
            .spell-bar { bottom: 12px; gap: 4px; }
        }
    </style>
</head>
<body>
    <canvas id="game-canvas"></canvas>
    <div class="crosshair" id="crosshair"></div>
    <div id="ui-overlay">
        <div class="hud-container" id="hud-container">
            <div class="bar-wrapper">
                <div class="bar-icon health"></div>

                    <div class="bar-label">Vitality</div>

                    <div class="bar-text" id="health-text">100 / 100</div>
                </div>
            </div>
            <div class="bar-wrapper">
                <div class="bar-icon mana"></div>
                <div class="bar-info">
                    <div class="bar-label">Mana</div>
                    <div class="bar-track"><div class="bar-fill mana" id="mana-fill" style="width:100%"></div></div>
                    <div class="bar-text" id="mana-text">100 / 100</div>
                </div>
            </div>
            <div class="bar-wrapper">
                <div class="bar-icon energy"></div>
                <div class="bar-info">
                    <div class="bar-label">Energy</div>
                    <div class="bar-track"><div class="bar-fill energy" id="energy-fill" style="width:100%"></div></div>

            </div>
        </div>
        <div class="spell-bar" id="spell-bar"></div>
        <div class="wave-info" id="wave-info">

        </div>
    </div>
    <div class="upgrade-panel" id="upgrade-panel">
        <h2>✦ Choose Your Boon ✦</h2>
        <div class="upgrade-options" id="upgrade-options"></div>
    </div>
    <div class="screen-overlay" id="start-screen">
        <h1>⚡ ARCANE SURGE ⚡</h1>
        <div class="subtitle">FIRST-PERSON FANTASY ROGUELITE</div>
        <button class="btn" id="btn-start">Begin Run</button>
        <div style="margin-top:18px;font-size:11px;color:var(--text2);letter-spacing:2px;text-align:center;">
            WASD Move • Mouse Look • SPACE Jump • SHIFT Dash<br>
            1-4 Spells • LMB Cast • RMB Charge • Q Combo
        </div>
    </div>
    <div class="screen-overlay hidden" id="death-screen">
        <h1 style="color:var(--danger);">✦ FALLEN ✦</h1>
        <div class="subtitle" id="death-stats">Wave 1 • 0 Enemies Slain</div>
        <button class="btn" id="btn-restart">Try Again</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        (function() {
            // ==================== CORE ENGINE ====================
            const canvas = document.getElementById('game-canvas');
            const uiOverlay = document.getElementById('ui-overlay');
            const crosshair = document.getElementById('crosshair');
            const hudContainer = document.getElementById('hud-container');
            const spellBarEl = document.getElementById('spell-bar');
            const waveNumEl = document.getElementById('wave-num');
            const enemyCountEl = document.getElementById('enemy-count');
            const healthFill = document.getElementById('health-fill');
            const manaFill = document.getElementById('mana-fill');
            const energyFill = document.getElementById('energy-fill');
            const healthText = document.getElementById('health-text');
            const manaText = document.getElementById('mana-text');
            const energyText = document.getElementById('energy-text');
            const upgradePanel = document.getElementById('upgrade-panel');
            const upgradeOptions = document.getElementById('upgrade-options');
            const startScreen = document.getElementById('start-screen');
            const deathScreen = document.getElementById('death-screen');
            const deathStats = document.getElementById('death-stats');

            // Three.js setup
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            renderer.outputEncoding = THREE.sRGBEncoding;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0612);
            scene.fog = new THREE.FogExp2(0x0a0612, 0.018);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 200);
            camera.position.set(0, 1.6, 0);

            // ==================== GAME STATE ====================
            const state = {
                running: false,
                paused: false,
                wave: 1,
                enemiesSlain: 0,
                totalEnemiesSlain: 0,
                waveActive: false,
                waveTimer: 0,
                betweenWaves: false,
                betweenWaveTimer: 0,
                player: {
                    health: 100,
                    maxHealth: 100,
                    mana: 100,
                    maxMana: 100,
                    energy: 100,
                    maxEnergy: 100,
                    manaRegen: 14,
                    energyRegen: 18,
                    healthRegen: 0.5,
                    speed: 7.5,
                    dashSpeed: 22,
                    dashDuration: 0.18,
                    dashCooldown: 0.7,
                    jumpForce: 8,
                    gravity: -18,
                    velocity: new THREE.Vector3(),
                    grounded: true,
                    dashing: false,
                    dashTimer: 0,
                    dashCooldownTimer: 0,
                    invulnerable: false,
                    invulnerableTimer: 0,
                    position: new THREE.Vector3(0, 1.6, 0),
                    comboCount: 0,
                    comboTimer: 0,
                    lastSpellCast: -1,
                    spellCooldowns: [0, 0, 0, 0],
                    chargeLevel: [0, 0, 0, 0],
                    charging: [false, false, false, false],
                    upgrades: [],
                },
                spells: [],
                enemies: [],
                projectiles: [],
                particles: [],
                damageNumbers: [],
                arenaSize: 28,
                arenaWalls: [],
                arenaFloor: null,
                arenaDecorations: [],
                lights: [],
                mouse: { x: 0, y: 0, dx: 0, dy: 0 },
                keys: {},
                pointerLocked: false,
                screenShake: 0,
                screenShakeIntensity: 0,
                time: 0,
                deltaTime: 0,
                lastTime: performance.now(),
            };

            // ==================== SPELL DEFINITIONS ====================
            const SPELL_TEMPLATES = [
                {
                    id: 'arcane_bolt',
                    name: 'Arcane Bolt',
                    icon: '✦',
                    color: 0xc89aff,
                    manaCost: 12,
                    cooldown: 0.4,
                    damage: 18,
                    speed: 30,
                    size: 0.15,
                    chargeMultiplier: 2.5,
                    chargeTime: 1.2,
                    type: 'projectile',
                    gesture: 'point',
                    description: 'Swift arcane projectile',
                    trailColor: 0xe0c0ff,
                    explosionColor: 0xc89aff,
                },
                {
                    id: 'fire_burst',
                    name: 'Fire Burst',
                    icon: '🔥',
                    color: 0xff6633,
                    manaCost: 22,
                    cooldown: 0.7,
                    damage: 35,
                    speed: 22,
                    size: 0.25,
                    chargeMultiplier: 3.0,
                    chargeTime: 1.5,
                    type: 'projectile',
                    gesture: 'fist',
                    description: 'Explosive fireball',
                    trailColor: 0xff9944,
                    explosionColor: 0xff4422,
                },
                {
                    id: 'frost_lance',
                    name: 'Frost Lance',
                    icon: '❄',
                    color: 0x66ddff,
                    manaCost: 18,
                    cooldown: 0.55,
                    damage: 24,
                    speed: 35,
                    size: 0.12,
                    chargeMultiplier: 2.8,
                    chargeTime: 1.3,
                    type: 'projectile',
                    gesture: 'open',
                    description: 'Piercing frost beam',
                    trailColor: 0xaaeeff,
                    explosionColor: 0x44bbff,
                },
                {
                    id: 'void_nova',
                    name: 'Void Nova',
                    icon: '◉',
                    color: 0xaa44ff,
                    manaCost: 35,
                    cooldown: 1.2,
                    damage: 55,
                    speed: 14,
                    size: 0.4,
                    chargeMultiplier: 3.5,
                    chargeTime: 2.0,
                    type: 'projectile',
                    gesture: 'spread',
                    description: 'Devastating void sphere',
                    trailColor: 0xcc66ff,
                    explosionColor: 0x8833ff,
                },
                {
                    id: 'lightning_arc',
                    name: 'Lightning Arc',
                    icon: '⚡',
                    color: 0xffee44,
                    manaCost: 16,
                    cooldown: 0.5,
                    damage: 20,
                    speed: 40,
                    size: 0.1,
                    chargeMultiplier: 2.2,
                    chargeTime: 1.0,
                    type: 'projectile',
                    gesture: 'point',
                    description: 'Chain lightning bolt',
                    trailColor: 0xffff88,
                    explosionColor: 0xffdd22,
                },
                {
                    id: 'solar_flare',
                    name: 'Solar Flare',
                    icon: '☀',
                    color: 0xffaa33,
                    manaCost: 28,
                    cooldown: 0.85,
                    damage: 42,
                    speed: 18,
                    size: 0.3,
                    chargeMultiplier: 3.2,
                    chargeTime: 1.6,
                    type: 'projectile',
                    gesture: 'fist',
                    description: 'Blazing solar eruption',
                    trailColor: 0xffcc66,
                    explosionColor: 0xff8822,
                },
            ];

            // ==================== UPGRADE DEFINITIONS ====================
            const UPGRADES = [
                { id: 'dmg_up', name: 'Power Surge', icon: '💥', desc: '+25% Spell Damage', stat: 'damageMult',
                    value: 1.25 },
                { id: 'speed_up', name: 'Swift Cast', icon: '⚡', desc: '+20% Cast Speed', stat: 'cooldownMult',
                    value: 0.8 },
                { id: 'mana_up', name: 'Mana Well', icon: '💧', desc: '+30 Max Mana', stat: 'maxMana', value: 30 },
                { id: 'health_up', name: 'Vitality', icon: '❤', desc: '+25 Max Health', stat: 'maxHealth', value: 25 },
                { id: 'regen_up', name: 'Renewal', icon: '🌿', desc: '+8 Mana Regen', stat: 'manaRegen', value: 8 },
                { id: 'crit_up', name: 'Precision', icon: '🎯', desc: '+15% Crit Chance', stat: 'critChance', value: 0.15 },
                { id: 'critdmg_up', name: 'Devastation', icon: '💢', desc: '+40% Crit Damage', stat: 'critDamage', value: 0.4 },
                { id: 'speed_move', name: 'Fleet Foot', icon: '👟', desc: '+15% Move Speed', stat: 'speedMult', value: 1.15 },
                { id: 'dash_up', name: 'Phase Shift', icon: '🌀', desc: '-30% Dash CD', stat: 'dashCDMult', value: 0.7 },
                { id: 'lifesteal', name: 'Siphon', icon: '🩸', desc: '+5% Spell Lifesteal', stat: 'lifesteal', value: 0.05 },
                { id: 'aoe_up', name: 'Expanded', icon: '◈', desc: '+30% AoE Radius', stat: 'aoeMult', value: 1.3 },
                { id: 'chain_up', name: 'Chain Reaction', icon: '⛓', desc: 'Spells chain +1', stat: 'chainCount', value: 1 },
            ];

            // ==================== PROCEDURAL ARENA ====================
            function generateArena() {
                // Clear old arena
                if (state.arenaFloor) scene.remove(state.arenaFloor);
                state.arenaWalls.forEach(w => scene.remove(w));
                state.arenaDecorations.forEach(d => scene.remove(d));
                state.arenaWalls = [];
                state.arenaDecorations = [];

                const size = state.arenaSize;
                const half = size / 2;

                // Floor
                const floorGeo = new THREE.PlaneGeometry(size, size, 16, 16);
                const floorMat = new THREE.MeshStandardMaterial({
                    color: 0x1a1025,
                    roughness: 0.7,
                    metalness: 0.2,
                });
                // Add some vertex displacement for stylized look
                const posAttr = floorGeo.attributes.position;
                for (let i = 0; i < posAttr.count; i++) {
                    const x = posAttr.getX(i);
                    const y = posAttr.getY(i);
                    const dist = Math.sqrt(x * x + y * y);
                    posAttr.setZ(i, Math.sin(dist * 0.3) * 0.08 + (Math.random() - 0.5) * 0.04);
                }
                floorGeo.computeVertexNormals();
                state.arenaFloor = new THREE.Mesh(floorGeo, floorMat);
                state.arenaFloor.rotation.x = -Math.PI / 2;
                state.arenaFloor.receiveShadow = true;
                scene.add(state.arenaFloor);

                // Walls
                const wallMat = new THREE.MeshStandardMaterial({
                    color: 0x2a1840,
                    roughness: 0.5,
                    metalness: 0.4,
                });

            // ==================== HANDS ====================
            let leftHand, rightHand;
            let handGroup;
            const handGestureState = { left: 'idle', right: 'idle', leftTimer: 0, rightTimer: 0 };

            function createHands() {
                handGroup = new THREE.Group();
                handGroup.position.set(0, -0.35, -0.55);
                camera.add(handGroup);
                scene.add(camera);

                // Hand material
                const handMat = new THREE.MeshStandardMaterial({
                    color: 0xd4b090,
                    roughness: 0.6,
                    metalness: 0.1,
                });
                const sleeveMat = new THREE.MeshStandardMaterial({
                    color: 0x3a2060,
                    roughness: 0.4,
                    metalness: 0.5,
                    emissive: 0x1a0830,
                    emissiveIntensity: 0.2,
                });

                function createHand(side) {
                    const hand = new THREE.Group();
                    // Palm
                    const palmGeo = new THREE.BoxGeometry(0.09, 0.04, 0.13);
                    const palm = new THREE.Mesh(palmGeo, handMat);
                    hand.add(palm);
                    // Fingers
                    for (let i = 0; i < 4; i++) {
                        const fingerGeo = new THREE.BoxGeometry(0.02, 0.025, 0.07);
                        const finger = new THREE.Mesh(fingerGeo, handMat);
                        finger.position.set(-0.035 + i * 0.023, 0.01, -0.07);
                        finger.name = 'finger_' + i;
                        hand.add(finger);
                    }
                    // Thumb
                    const thumbGeo = new THREE.BoxGeometry(0.025, 0.03, 0.05);
                    const thumb = new THREE.Mesh(thumbGeo, handMat);
                    thumb.position.set(side === 'left' ? 0.055 : -0.055, 0.005, -0.02);
                    thumb.rotation.z = side === 'left' ? -0.5 : 0.5;
                    thumb.name = 'thumb';
                    hand.add(thumb);
                    // Sleeve
                    const sleeveGeo = new THREE.CylinderGeometry(0.055, 0.065, 0.12, 8);
                    const sleeve = new THREE.Mesh(sleeveGeo, sleeveMat);
                    sleeve.position.set(0, -0.04, 0.04);
                    sleeve.rotation.x = 0.3;
                    hand.add(sleeve);
                    // Magic glow on palm
                    const glowGeo = new THREE.SphereGeometry(0.025, 8, 8);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: 0xc89aff,
                        transparent: true,
                        opacity: 0,
                    });
                    const glow = new THREE.Mesh(glowGeo, glowMat);
                    glow.position.set(0, 0.02, -0.05);
                    glow.name = 'glow';
                    hand.add(glow);
                    return hand;
                }

                leftHand = createHand('left');
                leftHand.position.set(-0.22, 0, 0.05);
                leftHand.rotation.y = 0.15;
                handGroup.add(leftHand);

                rightHand = createHand('right');
                rightHand.position.set(0.22, 0, 0.05);
                rightHand.rotation.y = -0.15;
                handGroup.add(rightHand);
            }

            function updateHandGesture(gesture, intensity = 1) {
                // Animate fingers based on gesture
                const hands = [leftHand, rightHand];
                hands.forEach((hand, idx) => {
                    const fingers = hand.children.filter(c => c.name && c.name.startsWith(
                        'finger_'));
                    const thumb = hand.children.find(c => c.name === 'thumb');
                    const glow = hand.children.find(c => c.name === 'glow');
                    if (glow) {
                        glow.material.opacity = intensity * 0.7;
                        glow.scale.setScalar(0.5 + intensity * 1.5);
                    }
                    fingers.forEach((f, i) => {
                        let targetRot = 0;
                        switch (gesture) {
                            case 'fist':
                                targetRot = -1.2 * intensity;
                                break;
                            case 'point':
                                targetRot = i === 0 ? 0.1 : -1.0 * intensity;
                                break;
                            case 'open':
                                targetRot = 0.1 * intensity;
                                break;
                            case 'spread':
                                targetRot = (i - 1.5) * 0.4 * intensity;
                                break;
                            default:
                                targetRot = 0;
                        }
                        f.rotation.x += (targetRot - f.rotation.x) * 0.3;
                    });
                    if (thumb) {
                        let thumbRot = gesture === 'fist' ? -0.8 * intensity : 0.2 * intensity;
                        thumb.rotation.x += (thumbRot - thumb.rotation.x) * 0.3;
                    }
                });
            }

            // ==================== SPELL PROJECTILES ====================
            function createSpellProjectile(spellIndex, position, direction, chargeLevel = 0) {
                const spell = state.spells[spellIndex];
                if (!spell) return;
                const template = SPELL_TEMPLATES.find(t => t.id === spell.templateId);
                if (!template) return;

                const effectiveDamage = template.damage * (1 + chargeLevel * (template.chargeMultiplier - 1));
                const effectiveSize = template.size * (1 + chargeLevel * 0.6);

                const geo = new THREE.SphereGeometry(effectiveSize, 10, 10);
                const mat = new THREE.MeshBasicMaterial({
                    color: template.color,
                    transparent: true,
                    opacity: 0.9,
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.copy(position);
                mesh.castShadow = true;
                scene.add(mesh);

                // Trail
                const trailGeo = new THREE.CylinderGeometry(effectiveSize * 0.5, effectiveSize * 1.2, effectiveSize *
                    3, 6);
                const trailMat = new THREE.MeshBasicMaterial({
                    color: template.trailColor,
                    transparent: true,
                    opacity: 0.5,
                });
                const trail = new THREE.Mesh(trailGeo, trailMat);
                trail.rotation.x = Math.PI / 2;
                trail.position.z = -effectiveSize * 1.5;
                mesh.add(trail);

                // Point light
                const light = new THREE.PointLight(template.color, 1.5, 5);
                mesh.add(light);

                const proj = {
                    mesh,
                    trail,
                    light,
                    velocity: direction.clone().normalize().multiplyScalar(template.speed * (1 + chargeLevel * 0.3)),
                    damage: effectiveDamage,
                    spellIndex,
                    chargeLevel,
                    template,
                    life: 3.5,
                    position: mesh.position,
                };
                state.projectiles.push(proj);
                return proj;
            }

            function updateProjectiles(dt) {
                for (let i = state.projectiles.length - 1; i >= 0; i--) {
                    const p = state.projectiles[i];
                    p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
                    p.life -= dt;
                    // Rotate for visual flair
                    p.mesh.rotation.x += dt * 3;
                    p.mesh.rotation.y += dt * 2;
                    // Fade trail
                    p.trail.material.opacity = Math.max(0, p.life / 3.5 * 0.5);

                    // Check collision with enemies
                    let hit = false;
                    for (let j = state.enemies.length - 1; j >= 0; j--) {
                        const e = state.enemies[j];
                        const dist = p.mesh.position.distanceTo(e.mesh.position);
                        const hitRadius = p.template.size + e.radius;
                        if (dist < hitRadius) {
                            // Hit!
                            damageEnemy(j, p.damage, p.mesh.position, p.template);
                            hit = true;
                            break;
                        }
                    }

                    // Check wall collision
                    const half = state.arenaSize / 2;
                    const pos = p.mesh.position;
                    if (Math.abs(pos.x) > half || Math.abs(pos.z) > half || pos.y < 0 || pos.y > 6) {
                        hit = true;
                    }

                    if (hit || p.life <= 0) {
                        // Explosion effect
                        createExplosion(p.mesh.position, p.template.explosionColor, p.template.size * (1 + p
                            .chargeLevel));
                        scene.remove(p.mesh);
                        p.mesh.geometry.dispose();
                        p.mesh.material.dispose();
                        p.trail.geometry.dispose();
                        p.trail.material.dispose();
                        state.projectiles.splice(i, 1);
                    }
                }
            }

            // ==================== EXPLOSIONS & PARTICLES ====================
            function createExplosion(position, color, size = 0.3) {
                const particleCount = Math.floor(12 + size * 20);
                for (let i = 0; i < particleCount; i++) {
                    const geo = new THREE.SphereGeometry(0.04 + Math.random() * 0.08, 4, 4);
                    const mat = new THREE.MeshBasicMaterial({
                        color: color,
                        transparent: true,
                        opacity: 1,
                    });
                    const particle = new THREE.Mesh(geo, mat);
                    particle.position.copy(position);
                    const vel = new THREE.Vector3(
                        (Math.random() - 0.5) * 8,
                        Math.random() * 6 + 1,
                        (Math.random() - 0.5) * 8
                    );
                    state.particles.push({
                        mesh: particle,
                        velocity: vel,
                        life: 0.4 + Math.random() * 0.5,
                        maxLife: 0.4 + Math.random() * 0.5,
                        gravity: -10,
                    });
                    scene.add(particle);
                }
                // Flash light
                const flash = new THREE.PointLight(color, 3, 8);
                flash.position.copy(position);
                scene.add(flash);
                setTimeout(() => {
                    scene.remove(flash);
                    flash.dispose();
                }, 120);
            }

            function updateParticles(dt) {
                for (let i = state.particles.length - 1; i >= 0; i--) {
                    const p = state.particles[i];
                    p.velocity.y += p.gravity * dt;
                    p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
                    p.life -= dt;
                    const alpha = Math.max(0, p.life / p.maxLife);
                    p.mesh.material.opacity = alpha;
                    p.mesh.scale.setScalar(alpha);
                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        p.mesh.geometry.dispose();
                        p.mesh.material.dispose();
                        state.particles.splice(i, 1);
                    }
                }
            }

            // ==================== ENEMIES ====================
            function createEnemy(type = 'normal', position = null) {
                const types = {
                    normal: { color: 0xff4466, health: 40, speed: 3.5, size: 0.45, damage: 8, score: 1 },
                    fast: { color: 0xff8844, health: 25, speed: 6, size: 0.35, damage: 6, score: 1 },
                    tank: { color: 0x8844ff, health: 90, speed: 2, size: 0.65, damage: 14, score: 2 },
                    elite: { color: 0xffcc22, health: 150, speed: 3, size: 0.7, damage: 18, score: 5 },
                    boss: { color: 0xff2288, health: 400, speed: 2.5, size: 1.0, damage: 25, score: 15 },
                };
                const t = types[type] || types.normal;
                const waveScale = 1 + (state.wave - 1) * 0.12;
                const health = t.health * waveScale;
                const damage = t.damage * (1 + (state.wave - 1) * 0.08);

                const geo = new THREE.IcosahedronGeometry(t.size, 1);
                const mat = new THREE.MeshStandardMaterial({
                    color: t.color,
                    roughness: 0.3,
                    metalness: 0.6,
                    emissive: t.color,
                    emissiveIntensity: 0.25,
                });
                const mesh = new THREE.Mesh(geo, mat);
                if (!position) {
                    const half = state.arenaSize / 2 - 3;
                    position = new THREE.Vector3(
                        (Math.random() - 0.5) * half * 1.6,
                        t.size,
                        (Math.random() - 0.5) * half * 1.6
                    );
                }
                mesh.position.copy(position);
                mesh.castShadow = true;
                scene.add(mesh);

                // Glow ring
                const ringGeo = new THREE.RingGeometry(t.size * 1.3, t.size * 1.6, 16);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: t.color,
                    transparent: true,
                    opacity: 0.4,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = -t.size + 0.05;
                mesh.add(ring);

                // Point light
                const light = new THREE.PointLight(t.color, 0.8, 4);
                light.position.y = t.size;
                mesh.add(light);

                return {
                    mesh,
                    ring,
                    light,
                    type,
                    health,
                    maxHealth: health,
                    speed: t.speed,
                    size: t.size,
                    radius: t.size,
                    damage,
                    score: t.score,
                    attackCooldown: 0,
                    stunTimer: 0,
                    knockback: new THREE.Vector3(),
                };
            }

            function spawnWave() {
                const wave = state.wave;
                const enemyCount = Math.min(4 + wave * 2, 20);
                const hasElite = wave >= 3 && Math.random() < 0.3 + wave * 0.05;
                const hasBoss = wave % 5 === 0;

                for (let i = 0; i < enemyCount; i++) {
                    let type = 'normal';
                    const r = Math.random();
                    if (r < 0.25) type = 'fast';
                    else if (r < 0.4) type = 'tank';
                    state.enemies.push(createEnemy(type));
                }
                if (hasElite) state.enemies.push(createEnemy('elite'));
                if (hasBoss) state.enemies.push(createEnemy('boss'));

                state.waveActive = true;
                state.betweenWaves = false;
                updateUI();
            }

            function updateEnemies(dt) {
                for (let i = state.enemies.length - 1; i >= 0; i--) {
                    const e = state.enemies[i];
                    if (e.stunTimer > 0) {
                        e.stunTimer -= dt;
                        e.mesh.material.emissiveIntensity = 0.8;
                        continue;
                    }
                    e.mesh.material.emissiveIntensity = 0.25;
                    e.attackCooldown = Math.max(0, e.attackCooldown - dt);

                    // Move toward player
                    const toPlayer = state.player.position.clone().sub(e.mesh.position);
                    const dist = toPlayer.length();
                    if (dist > 0.1) {
                        toPlayer.normalize();
                        const moveSpeed = e.speed * (1 + (state.wave - 1) * 0.03);
                        e.mesh.position.add(toPlayer.multiplyScalar(moveSpeed * dt));
                        // Face player
                        e.mesh.lookAt(state.player.position);
                    }

                    // Apply knockback
                    if (e.knockback.length() > 0.01) {
                        e.mesh.position.add(e.knockback.clone().multiplyScalar(dt));
                        e.knockback.multiplyScalar(0.85);
                    }

                    // Attack player
                    if (dist < e.size + 0.5 && e.attackCooldown <= 0) {
                        damagePlayer(e.damage);
                        e.attackCooldown = 1.2;
                        e.knockback.copy(toPlayer).multiplyScalar(-3);
                    }

                    // Animate
                    e.mesh.rotation.y += dt * 1.5;
                    e.ring.material.opacity = 0.3 + Math.sin(state.time * 3 + i) * 0.15;
                    e.mesh.position.y = e.size + Math.sin(state.time * 2 + i * 0.7) * 0.08;
                }
            }

            function damageEnemy(index, damage, hitPos, template) {
                if (index < 0 || index >= state.enemies.length) return;
                const e = state.enemies[index];
                // Crit check
                const critChance = 0.1 + (state.player.upgrades.find(u => u.stat === 'critChance')?.value || 0);
                const isCrit = Math.random() < critChance;
                const critDamage = 1.5 + (state.player.upgrades.find(u => u.stat === 'critDamage')?.value || 0);
                const finalDamage = isCrit ? damage * critDamage : damage;

                e.health -= finalDamage;
                e.stunTimer = 0.15;
                // Knockback
                const kb = e.mesh.position.clone().sub(hitPos).normalize().multiplyScalar(2.5);
                e.knockback.add(kb);

                // Damage number
                showDamageNumber(e.mesh.position.clone().add(new THREE.Vector3(0, e.size + 0.3, 0)), Math.round(
                    finalDamage), isCrit ? 0xffcc00 : 0xffffff);

                // Lifesteal
                const lifesteal = state.player.upgrades.find(u => u.stat === 'lifesteal')?.value || 0;
                if (lifesteal > 0) {
                    state.player.health = Math.min(state.player.maxHealth, state.player.health + finalDamage *
                        lifesteal);
                }

                if (e.health <= 0) {
                    // Death
                    createExplosion(e.mesh.position, e.type === 'boss' ? 0xff2288 : e.type === 'elite' ? 0xffcc22 :
                        0xff4466, e.size * 1.5);
                    scene.remove(e.mesh);
                    e.mesh.geometry.dispose();
                    e.mesh.material.dispose();
                    e.ring.geometry.dispose();
                    e.ring.material.dispose();
                    state.enemies.splice(index, 1);
                    state.enemiesSlain++;
                    state.totalEnemiesSlain++;
                    state.screenShake = 0.15;
                    state.screenShakeIntensity = e.type === 'boss' ? 0.4 : e.type === 'elite' ? 0.25 : 0.1;
                    updateUI();
                }
            }

            function damagePlayer(damage) {
                if (state.player.invulnerable || state.player.dashing) return;
                state.player.health -= damage;
                state.player.invulnerable = true;
                state.player.invulnerableTimer = 0.4;
                state.screenShake = 0.2;
                state.screenShakeIntensity = 0.3;
                showDamageNumber(state.player.position.clone().add(new THREE.Vector3(0, 1.2, 0)), Math.round(damage),
                    0xff4464);
                if (state.player.health <= 0) {
                    state.player.health = 0;
                    gameOver();
                }
                updateUI();
            }

            // ==================== DAMAGE NUMBERS ====================
            function showDamageNumber(position, amount, color = 0xffffff) {
                const div = document.createElement('div');
                div.className = 'damage-number';
                div.textContent = amount;
                div.style.color = '#' + color.toString(16).padStart(6, '0');
                div.style.left = '50%';
                div.style.top = '50%';
                // Project to screen
                const projected = position.clone().project(camera);
                const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-projected.y * 0.5 + 0.5) * window.innerHeight;
                div.style.left = x + 'px';
                div.style.top = y + 'px';
                div.style.transform = 'translate(-50%, -50%)';
                document.body.appendChild(div);
                setTimeout(() => div.remove(), 900);
            }

            // ==================== PLAYER CONTROLS ====================
            function setupControls() {
                document.addEventListener('keydown', (e) => {
                    state.keys[e.key.toLowerCase()] = true;
                    if (e.key === ' ') e.preventDefault();
                    // Number keys for spell selection
                    if (['1', '2', '3', '4'].includes(e.key)) {
                        const idx = parseInt(e.key) - 1;
                        if (idx < state.spells.length) {
                            selectSpell(idx);
                        }
                    }
                    if (e.key.toLowerCase() === 'q') {
                        triggerCombo();
                    }
                });
                document.addEventListener('keyup', (e) => {
                    state.keys[e.key.toLowerCase()] = false;
                });
                document.addEventListener('mousemove', (e) => {
                    if (!state.pointerLocked) return;
                    state.mouse.dx = e.movementX || 0;
                    state.mouse.dy = e.movementY || 0;
                });
                document.addEventListener('mousedown', (e) => {
                    if (!state.running || !state.pointerLocked) return;
                    if (e.button === 0) castSpell(getSelectedSpellIndex());
                    if (e.button === 2) startCharging(getSelectedSpellIndex());
                });
                document.addEventListener('mouseup', (e) => {
                    if (e.button === 2) releaseCharge(getSelectedSpellIndex());
                });
                document.addEventListener('contextmenu', (e) => e.preventDefault());
                document.addEventListener('pointerlockchange', () => {
                    state.pointerLocked = document.pointerLockElement === canvas;
                });
                canvas.addEventListener('click', () => {
                    if (state.running && !state.pointerLocked) {
                        canvas.requestPointerLock();
                    }
                });
            }

            function selectSpell(index) {
                document.querySelectorAll('.spell-slot').forEach((s, i) => {
                    s.classList.toggle('active', i === index);
                });
            }

            function getSelectedSpellIndex() {
                const active = document.querySelector('.spell-slot.active');
                if (!active) return 0;
                return parseInt(active.dataset.index) || 0;
            }

            function castSpell(index) {
                if (!state.running || state.betweenWaves) return;
                const spell = state.spells[index];
                if (!spell) return;
                const template = SPELL_TEMPLATES.find(t => t.id === spell.templateId);
                if (!template) return;
                if (state.player.spellCooldowns[index] > 0) return;
                if (state.player.mana < template.manaCost) return;

                state.player.mana -= template.manaCost;
                const cooldownMult = state.player.upgrades.find(u => u.stat === 'cooldownMult')?.value || 1;
                state.player.spellCooldowns[index] = template.cooldown * cooldownMult;

                // Get cast position (between hands)
                const castPos = state.player.position.clone().add(new THREE.Vector3(0, 0.3, 0));
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                createSpellProjectile(index, castPos, dir, 0);

                // Update combo
                if (state.player.lastSpellCast === index) {
                    state.player.comboCount++;
                    state.player.comboTimer = 1.5;
                } else {
                    state.player.comboCount = 1;
                    state.player.comboTimer = 1.5;
                }
                state.player.lastSpellCast = index;

                // Hand gesture
                updateHandGesture(template.gesture, 1);
                handGestureState.rightTimer = 0.3;
                handGestureState.leftTimer = 0.3;

                // Screen shake
                state.screenShake = 0.05;
                state.screenShakeIntensity = 0.08;
                updateUI();
            }

            function startCharging(index) {
                if (!state.running || state.betweenWaves) return;
                const spell = state.spells[index];
                if (!spell) return;
                const template = SPELL_TEMPLATES.find(t => t.id === spell.templateId);
                if (!template) return;
                if (state.player.spellCooldowns[index] > 0) return;
                if (state.player.mana < template.manaCost * 0.5) return;
                state.player.charging[index] = true;
                state.player.chargeLevel[index] = 0;
                // Show charge indicator
                const slot = document.querySelector(`.spell-slot[data-index="${index}"] .charge-indicator`);
                if (slot) slot.style.display = 'block';
            }

            function releaseCharge(index) {
                if (!state.player.charging[index]) return;
                state.player.charging[index] = false;
                const slot = document.querySelector(`.spell-slot[data-index="${index}"] .charge-indicator`);
                if (slot) slot.style.display = 'none';
                const chargeLvl = state.player.chargeLevel[index];
                state.player.chargeLevel[index] = 0;
                if (chargeLvl < 0.15) return; // Too little charge

                const spell = state.spells[index];
                if (!spell) return;
                const template = SPELL_TEMPLATES.find(t => t.id === spell.templateId);
                if (!template) return;
                if (state.player.mana < template.manaCost * (0.5 + chargeLvl)) return;

                state.player.mana -= template.manaCost * (0.5 + chargeLvl);
                const cooldownMult = state.player.upgrades.find(u => u.stat === 'cooldownMult')?.value || 1;
                state.player.spellCooldowns[index] = template.cooldown * cooldownMult * (1 + chargeLvl * 0.5);

                const castPos = state.player.position.clone().add(new THREE.Vector3(0, 0.3, 0));
                const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                createSpellProjectile(index, castPos, dir, chargeLvl);

                updateHandGesture(template.gesture, 1 + chargeLvl);
                handGestureState.rightTimer = 0.4;
                handGestureState.leftTimer = 0.4;
                state.screenShake = 0.08 + chargeLvl * 0.1;
                state.screenShakeIntensity = 0.12 + chargeLvl * 0.15;
                updateUI();
            }

            function triggerCombo() {
                if (state.player.comboCount >= 3 && state.player.comboTimer > 0) {
                    // Combo burst - AoE around player
                    const pos = state.player.position.clone();
                    createExplosion(pos, 0xc89aff, 1.2);
                    state.enemies.forEach((e, i) => {
                        const dist = e.mesh.position.distanceTo(pos);
                        if (dist < 4) {
                            const comboDmg = 30 * state.player.comboCount * (1 + (state.wave - 1) * 0.1);
                            damageEnemy(i, comboDmg, pos, { size: 0.5 });
                        }
                    });
                    state.player.comboCount = 0;
                    state.player.comboTimer = 0;
                    state.screenShake = 0.2;
                    state.screenShakeIntensity = 0.35;
                }
            }

            function updatePlayer(dt) {
                const p = state.player;
                // Mouse look
                if (state.pointerLocked) {
                    camera.rotation.y -= state.mouse.dx * 0.002;
                    camera.rotation.x -= state.mouse.dy * 0.002;
                    camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
                }
                state.mouse.dx = 0;
                state.mouse.dy = 0;

                // Movement
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
                    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
                );
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
                    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, camera.rotation.y, 0))
                );
                const moveDir = new THREE.Vector3();
                if (state.keys['w']) moveDir.add(forward);
                if (state.keys['s']) moveDir.sub(forward);
                if (state.keys['a']) moveDir.sub(right);
                if (state.keys['d']) moveDir.add(right);
                if (moveDir.length() > 0) moveDir.normalize();

                const speedMult = p.upgrades.find(u => u.stat === 'speedMult')?.value || 1;
                const speed = p.speed * speedMult;

                // Dash
                if (state.keys['shift'] && !p.dashing && p.dashCooldownTimer <= 0 && moveDir.length() > 0) {
                    p.dashing = true;
                    p.dashTimer = p.dashDuration;
                    const dashCDMult = p.upgrades.find(u => u.stat === 'dashCDMult')?.value || 1;
                    p.dashCooldownTimer = p.dashCooldown * dashCDMult;
                    p.velocity.copy(moveDir).multiplyScalar(p.dashSpeed);
                }

                if (p.dashing) {
                    p.dashTimer -= dt;
                    if (p.dashTimer <= 0) p.dashing = false;
                } else {
                    p.velocity.x = moveDir.x * speed;
                    p.velocity.z = moveDir.z * speed;
                }
                p.dashCooldownTimer = Math.max(0, p.dashCooldownTimer - dt);

                // Jump & gravity
                if (state.keys[' '] && p.grounded) {
                    p.velocity.y = p.jumpForce;
                    p.grounded = false;
                }
                p.velocity.y += p.gravity * dt;
                p.position.add(p.velocity.clone().multiplyScalar(dt));
                if (p.position.y <= 1.6) {
                    p.position.y = 1.6;
                    p.velocity.y = 0;
                    p.grounded = true;
                }

                // Arena bounds
                const half = state.arenaSize / 2 - 0.5;
                p.position.x = Math.max(-half, Math.min(half, p.position.x));
                p.position.z = Math.max(-half, Math.min(half, p.position.z));

                camera.position.copy(p.position);

                // Regen
                p.mana = Math.min(p.maxMana, p.mana + p.manaRegen * dt);
                p.energy = Math.min(p.maxEnergy, p.energy + p.energyRegen * dt);
                p.health = Math.min(p.maxHealth, p.health + p.healthRegen * dt);

                // Cooldowns
                for (let i = 0; i < p.spellCooldowns.length; i++) {
                    p.spellCooldowns[i] = Math.max(0, p.spellCooldowns[i] - dt);
                }

                // Charging
                for (let i = 0; i < p.charging.length; i++) {
                    if (p.charging[i]) {
                        const spell = state.spells[i];
                        const template = SPELL_TEMPLATES.find(t => t.id === spell?.templateId);
                        if (template) {
                            p.chargeLevel[i] = Math.min(1, p.chargeLevel[i] + dt / template.chargeTime);
                        }
                    }
                }

                // Combo timer
                if (p.comboTimer > 0) {
                    p.comboTimer -= dt;
                    if (p.comboTimer <= 0) p.comboCount = 0;
                }

                // Invulnerability
                if (p.invulnerable) {
                    p.invulnerableTimer -= dt;
                    if (p.invulnerableTimer <= 0) p.invulnerable = false;
                }

                // Hand animation decay
                handGestureState.rightTimer -= dt;
                handGestureState.leftTimer -= dt;
                if (handGestureState.rightTimer <= 0 && handGestureState.leftTimer <= 0) {
                    updateHandGesture('idle', 0.3);
                }

                // Update hand positions with subtle movement
                if (handGroup) {
                    handGroup.position.y = -0.35 + Math.sin(state.time * 1.5) * 0.01;
                    handGroup.position.x = Math.sin(state.time * 0.8) * 0.005;
                }
            }

            // ==================== UI ====================
            function updateUI() {
                const p = state.player;
                healthFill.style.width = (p.health / p.maxHealth * 100) + '%';
                manaFill.style.width = (p.mana / p.maxMana * 100) + '%';
                energyFill.style.width = (p.energy / p.maxEnergy * 100) + '%';
                healthText.textContent = Math.round(p.health) + ' / ' + p.maxHealth;
                manaText.textContent = Math.round(p.mana) + ' / ' + p.maxMana;
                energyText.textContent = Math.round(p.energy) + ' / ' + p.maxEnergy;
                waveNumEl.textContent = 'WAVE ' + state.wave;
                enemyCountEl.textContent = 'Enemies: ' + state.enemies.length + ' | Slain: ' + state.enemiesSlain;

                // Update spell cooldowns
                document.querySelectorAll('.spell-slot').forEach((slot, i) => {
                    const cd = state.player.spellCooldowns[i];
                    const overlay = slot.querySelector('.cooldown-overlay');
                    if (overlay && cd > 0) {
                        const spell = state.spells[i];
                        const template = SPELL_TEMPLATES.find(t => t.id === spell?.templateId);
                        const maxCD = template ? template.cooldown : 1;
                        overlay.style.height = (cd / maxCD * 100) + '%';
                    } else if (overlay) {
                        overlay.style.height = '0%';
                    }
                });
            }

            function buildSpellBar() {
                spellBarEl.innerHTML = '';
                state.spells.forEach((spell, i) => {
                    const template = SPELL_TEMPLATES.find(t => t.id === spell.templateId);
                    const slot = document.createElement('div');
                    slot.className = 'spell-slot' + (i === 0 ? ' active' : '');
                    slot.dataset.index = i;
                    slot.innerHTML = `
                        <span class="key">${i + 1}</span>
                        ${template ? template.icon : '?'}
                        <div class="cooldown-overlay"></div>
                        <div class="charge-indicator"></div>
                    `;
                    spellBarEl.appendChild(slot);
                });
            }

            // ==================== UPGRADES ====================
            function showUpgradePanel() {
                state.paused = true;
                upgradePanel.classList.add('active');
                upgradeOptions.innerHTML = '';
                const shuffled = [...UPGRADES].sort(() => Math.random() - 0.5).slice(0, 3);
                shuffled.forEach(upg => {
                    const card = document.createElement('div');
                    card.className = 'upgrade-card';
                    card.innerHTML = `
                        <span class="icon">${upg.icon}</span>
                        <div class="name">${upg.name}</div>
                        <div class="desc">${upg.desc}</div>
                    `;
                    card.onclick = () => applyUpgrade(upg);
                    upgradeOptions.appendChild(card);
                });
            }

            function applyUpgrade(upgrade) {
                state.player.upgrades.push({ stat: upgrade.stat, value: upgrade.value });
                // Apply immediate effects
                if (upgrade.stat === 'maxMana') state.player.maxMana += upgrade.value;
                if (upgrade.stat === 'maxHealth') state.player.maxHealth += upgrade.value;
                if (upgrade.stat === 'manaRegen') state.player.manaRegen += upgrade.value;
                if (upgrade.stat === 'damageMult') { /* applied in damage calc */ }
                upgradePanel.classList.remove('active');
                state.paused = false;
                state.player.health = state.player.maxHealth;
                state.player.mana = state.player.maxMana;
                updateUI();
            }

            // ==================== GAME FLOW ====================
            function startGame() {
                state.running = true;
                state.paused = false;
                state.wave = 1;
                state.enemiesSlain = 0;
                state.totalEnemiesSlain = 0;
                state.betweenWaves = false;
                state.waveActive = false;
                state.player.health = state.player.maxHealth = 100;
                state.player.mana = state.player.maxMana = 100;
                state.player.energy = state.player.maxEnergy = 100;
                state.player.upgrades = [];
                state.player.position.set(0, 1.6, 0);
                state.player.velocity.set(0, 0, 0);
                state.player.spellCooldowns = [0, 0, 0, 0];
                state.player.chargeLevel = [0, 0, 0, 0];
                state.player.charging = [false, false, false, false];
                state.player.comboCount = 0;
                state.player.comboTimer = 0;
                state.player.lastSpellCast = -1;
                state.enemies = [];
                state.projectiles = [];
                state.particles = [];
                // Assign random spells
                const shuffledSpells = [...SPELL_TEMPLATES].sort(() => Math.random() - 0.5).slice(0, 4);
                state.spells = shuffledSpells.map(t => ({ templateId: t.id }));
                buildSpellBar();
                generateArena();
                setupLighting();
                spawnWave();
                updateUI();
                startScreen.classList.add('hidden');
                deathScreen.classList.add('hidden');
                uiOverlay.classList.remove('hidden');
                canvas.requestPointerLock();
            }

            function gameOver() {
                state.running = false;
                document.exitPointerLock();
                deathStats.textContent = `Wave ${state.wave} • ${state.totalEnemiesSlain} Enemies Slain`;
                deathScreen.classList.remove('hidden');
                uiOverlay.classList.add('hidden');
            }

            function nextWave() {
                state.wave++;
                state.betweenWaves = true;
                state.betweenWaveTimer = 3;
                state.waveActive = false;
                state.enemies = [];
                showUpgradePanel();
                updateUI();
            }

            // ==================== MAIN LOOP ====================
            function animate(timestamp) {
                requestAnimationFrame(animate);
                if (!state.running) {
                    state.lastTime = timestamp;
                    return;
                }
                state.deltaTime = Math.min((timestamp - state.lastTime) / 1000, 0.15);
                state.lastTime = timestamp;
                state.time += state.deltaTime;

                if (state.paused) {
                    renderer.render(scene, camera);
                    return;
                }

                // Update systems
                updatePlayer(dt);
                updateProjectiles(dt);
                updateParticles(dt);
                updateEnemies(dt);

                // Wave management
                if (state.waveActive && state.enemies.length === 0) {
                    nextWave();
                }
                if (state.betweenWaves) {
                    state.betweenWaveTimer -= dt;
                    if (state.betweenWaveTimer <= 0 && !state.paused) {
                        spawnWave();
                    }
                }

                // Animate arena decorations
                state.arenaDecorations.forEach(d => {
                    if (d.userData.floatOffset !== undefined) {
                        d.position.y += Math.sin(state.time * d.userData.floatSpeed + d.userData.floatOffset) * dt *
                            0.3;
                        d.rotation.y += dt * 0.5;
                    }
                    if (d.userData.driftOffset !== undefined) {
                        d.position.y += Math.sin(state.time * d.userData.driftSpeed + d.userData.driftOffset) * dt *
                            0.1;
                    }
                });

                // Screen shake
                if (state.screenShake > 0) {
                    state.screenShake -= dt;
                    const intensity = state.screenShakeIntensity * (state.screenShake > 0 ? 1 : 0);
                    camera.position.x += (Math.random() - 0.5) * intensity;
                    camera.position.y += (Math.random() - 0.5) * intensity;
                }

                // Update UI
                updateUI();

                // Render
                renderer.render(scene, camera);
            }

            // ==================== INIT ====================
            function init() {
                createHands();
                setupControls();
                buildSpellBar();
                updateUI();
                document.getElementById('btn-start').addEventListener('click', startGame);
                document.getElementById('btn-restart').addEventListener('click', startGame);
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });
                // Start render loop
                requestAnimationFrame(animate);
            }

            init();
            console.log('⚡ ARCANE SURGE ready. Click "Begin Run" to start.');
        })();
    </script>
</body>
