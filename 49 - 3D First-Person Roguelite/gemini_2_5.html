<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Roguelite</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            color: white;
            font-family: sans-serif;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            border: 1px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #health, #mana {
            position: absolute;
            bottom: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        #health {
            left: 20px;
            background-color: rgba(255, 0, 0, 0.5);
        }
        #mana {
            right: 20px;
            background-color: rgba(0, 0, 255, 0.5);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div id="crosshair"></div>
        <div id="health">Health: 100</div>
        <div id="mana">Mana: 100</div>
    </div>
    <script>
        
        let scene, camera, renderer, player, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false, isSprinting = false;
        let velocity = new THREE.Vector3();
        let spells = [];
        let enemies = [];
        let health = 100;
        let mana = 100;
        let direction = new THREE.Vector3();
        const playerSpeed = 10.0;
        const playerSprintSpeed = 20.0;

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 0, 75);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.7;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7.5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Ground
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            generateArena();




            
            // Player
            const playerGeometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
            playerGeometry.translate(0, 0.5, 0);
            const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, visible: false });
            player = new THREE.Mesh(playerGeometry, playerMaterial);
            player.position.y = 1;
            player.add(camera);

            // Hands
            const handGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const handMaterial = new THREE.MeshStandardMaterial({ color: 0xffe4c4 });

            const leftHand = new THREE.Mesh(handGeometry, handMaterial);
            leftHand.position.set(-0.5, -0.4, -1);
            camera.add(leftHand);

            const rightHand = new THREE.Mesh(handGeometry, handMaterial);
            rightHand.position.set(0.5, -0.4, -1);
            camera.add(rightHand);
            scene.add(player);


            // Controls
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            document.body.addEventListener('click', () => {
                document.body.requestPointerLock();
            }, false);

            window.addEventListener('resize', onWindowResize, false);

            createEnemy();
            createEnemy();
            createEnemy();

            document.addEventListener('mousedown', onMouseDown, false);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= event.movementX * 0.002;
                camera.rotation.x -= event.movementY * 0.002;
                camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
            }
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = true;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = true;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = true;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = true;
                    break;
                case 'Space':
                    if (canJump) velocity.y += 10;
                    canJump = false;
                    break;
                case 'ShiftLeft':
                    isSprinting = true;
                    break;
            }
        }


        function updateUI() {
            document.getElementById('health').textContent = `Health: ${health}`;
            document.getElementById('mana').textContent = `Mana: ${mana}`;
        }

        function onMouseDown(event) {            
            if (document.pointerLockElement !== document.body) return;
            if (mana < 10) return;

            mana -= 10;
            updateUI();

            const spellGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const spellMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
            const spell = new THREE.Mesh(spellGeometry, spellMaterial);

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            spell.position.copy(player.position).add(new THREE.Vector3(0, 1.7, 0)).add(direction.multiplyScalar(1));
            spell.velocity = direction.multiplyScalar(50);
            spell.castTime = performance.now();

            spells.push(spell);
            scene.add(spell);
        }
            if (document.pointerLockElement !== document.body) return;

            const spellGeometry = new THREE.SphereGeometry(0.1, 8, 8);
            const spellMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
            const spell = new THREE.Mesh(spellGeometry, spellMaterial);

            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);

            spell.position.copy(player.position).add(new THREE.Vector3(0, 1.7, 0)).add(direction.multiplyScalar(1));
            spell.velocity = direction.multiplyScalar(50);
            spell.castTime = performance.now();

            spells.push(spell);
            scene.add(spell);
        }

        let walls = [];
        function generateArena() {
            const arenaSize = 20;
            const wallSize = 5;
            const maze = generateMaze(arenaSize, arenaSize);

            for (let i = 0; i < arenaSize; i++) {
                for (let j = 0; j < arenaSize; j++) {
                    if (maze[i][j] === 1) {
                        const wallGeometry = new THREE.BoxGeometry(wallSize, 5, wallSize);
                        const wallMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
                        const wall = new THREE.Mesh(wallGeometry, wallMaterial);
                        wall.position.x = (j - arenaSize / 2) * wallSize;
                        wall.position.z = (i - arenaSize / 2) * wallSize;
                        wall.position.y = 2.5;
                        scene.add(wall);
                        walls.push(wall);
                    }
                }
            }
        }

        function generateMaze(width, height) {
            const maze = Array.from({ length: height }, () => Array(width).fill(1));
            const stack = [];
            let currentX = 1;
            let currentY = 1;
            maze[currentY][currentX] = 0;
            stack.push([currentX, currentY]);

            while (stack.length > 0) {
                const [x, y] = stack[stack.length - 1];
                const neighbors = [];

                // Check neighbors
                if (x > 1 && maze[y][x - 2] === 1) neighbors.push([x - 2, y, x - 1, y]);
                if (x < width - 2 && maze[y][x + 2] === 1) neighbors.push([x + 2, y, x + 1, y]);
                if (y > 1 && maze[y - 2][x] === 1) neighbors.push([x, y - 2, x, y - 1]);
                if (y < height - 2 && maze[y + 2][x] === 1) neighbors.push([x, y + 2, x, y + 1]);

                if (neighbors.length > 0) {
                    const [nextX, nextY, wallX, wallY] = neighbors[Math.floor(Math.random() * neighbors.length)];
                    maze[nextY][nextX] = 0;
                    maze[wallY][wallX] = 0;
                    stack.push([nextX, nextY]);
                } else {
                    stack.pop();
                }
            }

            return maze;
        }


        }

        function createEnemy() {
            const enemyGeometry = new THREE.BoxGeometry(1, 2, 1);
            const enemyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const enemy = new THREE.Mesh(enemyGeometry, enemyMaterial);

            enemy.position.x = Math.random() * 80 - 40;
            enemy.position.z = Math.random() * 80 - 40;
            enemy.position.y = 1;

            enemies.push(enemy);
            scene.add(enemy);
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    moveForward = false;
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    moveLeft = false;
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    moveBackward = false;
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    moveRight = false;
                    break;
                 case 'ShiftLeft':
                    isSprinting = false;
                    break;
            }
        }
        
        let lastTime = performance.now();
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - lastTime) / 1000;

            // Player movement
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 10.0 * delta; // gravity

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            const speed = isSprinting ? playerSprintSpeed : playerSpeed;

            if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;
            
            player.translateX(-velocity.x * delta);
            player.translateZ(-velocity.z * delta);
            
            // camera-aligned movement
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);
            const right = new THREE.Vector3().crossVectors(camera.up, cameraDirection).normalize();

            if (moveForward) {
                player.position.addScaledVector(cameraDirection, speed * delta);
            }
            if (moveBackward) {
                player.position.addScaledVector(cameraDirection, -speed * delta);
            }
            if (moveLeft) {
                player.position.addScaledVector(right, -speed * delta);
            }
            const previousPosition = player.position.clone();

            if (moveRight) {
                player.position.addScaledVector(right, speed * delta);
            }

            const playerCollider = new THREE.Box3().setFromObject(player);

            for (const wall of walls) {
                const wallCollider = new THREE.Box3().setFromObject(wall);
                if (playerCollider.intersectsBox(wallCollider)) {
                    player.position.copy(previousPosition);
                    break;
                }
            }


            // Update spells
            for (let i = spells.length - 1; i >= 0; i--) {
                const spell = spells[i];
                spell.position.addScaledVector(spell.velocity, delta);

                if (performance.now() - spell.castTime > 2000) {
                    scene.remove(spell);
                    spells.splice(i, 1);
                }
                // very basic ground collision
                // enemy collision
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const enemy = enemies[j];
                    if (spell.position.distanceTo(enemy.position) < 1) {
                        scene.remove(spell);
                        spells.splice(i, 1);
                        scene.remove(enemy);
                        enemies.splice(j, 1);
                        break; // Move to next spell
                    }
                }

                if(spell.position.y < 0.1) {
                    scene.remove(spell);
                    spells.splice(i, 1);
                }
            }

            if (player.position.y < 1) {
                velocity.y = 0;
                player.position.y = 1;
                canJump = true;
            }


            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const direction = new THREE.Vector3().subVectors(player.position, enemy.position).normalize();
                const distance = player.position.distanceTo(enemy.position);
                if (distance > 2) { // don't get too close
                    enemy.position.addScaledVector(direction, 2 * delta);
                }
            }

            renderer.render(scene, camera);
            lastTime = time;
        }
    </script>
</body>
</html>
