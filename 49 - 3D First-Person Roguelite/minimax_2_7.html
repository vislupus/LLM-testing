<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Survivors</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #0a0a12; 
            font-family: 'Orbitron', sans-serif;
            cursor: default;
        }
        #game-container { width: 100vw; height: 100vh; position: relative; }
        canvas { display: block; }
        
        /* Title Screen */
        #title-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a12 100%);
            z-index: 100; transition: opacity 0.5s;
        }
        #title-screen h1 {
            font-size: 4rem; font-weight: 900; color: #00ffcc;
            text-shadow: 0 0 30px #00ffcc, 0 0 60px #00ffcc;
            margin-bottom: 1rem; animation: pulse 2s infinite;
        }
        #title-screen p { color: #888; font-size: 1rem; margin-bottom: 2rem; }
        #title-screen .start-btn {
            padding: 1rem 3rem; font-size: 1.2rem; font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #00ffcc, #00aa88);
            border: none; border-radius: 50px; color: #0a0a12; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        #title-screen .start-btn:hover {
            transform: scale(1.1); box-shadow: 0 0 30px #00ffcc;
        }
        .controls { margin-top: 2rem; color: #666; font-size: 0.8rem; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        /* HUD */
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }
        .hud-top { display: flex; justify-content: space-between; padding: 20px; }
        
        /* Health Bar */
        #health-container { width: 250px; }
        #health-label { color: #22c55e; font-size: 0.8rem; margin-bottom: 5px; }
        #health-bar {
            width: 100%; height: 25px; background: #1a1a2e; border-radius: 15px;
            border: 2px solid #22c55e; overflow: hidden; position: relative;
        }
        #health-fill {
            height: 100%; background: linear-gradient(90deg, #22c55e, #4ade80);
            transition: width 0.3s; border-radius: 15px;
        }
        #health-bar.low #health-fill { background: linear-gradient(90deg, #ef4444, #f87171); animation: flash 0.5s infinite; }
        @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        /* Wave Info */
        #wave-info { text-align: center; }
        #wave-number { color: #ff6b35; font-size: 1.5rem; font-weight: 700; }
        #timer { color: #888; font-size: 0.9rem; }
        #score-display { color: #ffd700; font-size: 1.2rem; }
        #kill-count { color: #888; font-size: 0.8rem; }
        
        /* XP Bar */
        #xp-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px;
        }
        #xp-label { color: #ffd700; font-size: 0.8rem; text-align: center; margin-bottom: 5px; }
        #xp-bar {
            width: 100%; height: 20px; background: #1a1a2e; border-radius: 10px;
            border: 2px solid #ffd700; overflow: hidden;
        }
        #xp-fill {
            height: 100%; width: 0%; background: linear-gradient(90deg, #ffd700, #ffed4a);
            transition: width 0.3s; border-radius: 10px;
        }
        
        /* Upgrade Screen */
        #upgrade-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.95); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 50;
        }
        #upgrade-screen h2 {
            color: #ffd700; font-size: 2rem; margin-bottom: 2rem;
            text-shadow: 0 0 20px #ffd700;
        }
        #upgrade-cards { display: flex; gap: 20px; pointer-events: auto; }
        .upgrade-card {
            width: 200px; padding: 20px; background: linear-gradient(135deg, #1a1a2e, #2a2a3e);
            border: 2px solid #00ffcc; border-radius: 15px; text-align: center;
            cursor: pointer; transition: all 0.3s;
        }
        .upgrade-card:hover {
            transform: scale(1.1) translateY(-10px);
            box-shadow: 0 10px 40px rgba(0, 255, 204, 0.3);
            border-color: #ffd700;
        }
        .upgrade-card .icon { font-size: 3rem; margin-bottom: 10px; }
        .upgrade-card .name { color: #00ffcc; font-size: 1rem; margin-bottom: 10px; }
        .upgrade-card .desc { color: #888; font-size: 0.7rem; }
        
        /* Game Over */
        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 10, 18, 0.95); display: none;
            flex-direction: column; justify-content: center; align-items: center;
            z-index: 60;
        }
        #game-over h2 { color: #ff0080; font-size: 3rem; margin-bottom: 1rem; }
        #game-over .stats { color: #888; margin-bottom: 2rem; text-align: center; line-height: 2; }
        #game-over .stats span { color: #ffd700; }
        #restart-btn {
            padding: 1rem 3rem; font-size: 1.2rem; font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #ff6b35, #ff8c5a);
            border: none; border-radius: 50px; color: #fff; font-weight: 700;
            cursor: pointer; transition: all 0.3s;
        }
        #restart-btn:hover { transform: scale(1.1); box-shadow: 0 0 30px #ff6b35; }
        
        /* Damage Numbers Container */
        #damage-numbers { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        
        /* Level Up Effect */
        #level-up-effect {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3rem; color: #ffd700; font-weight: 900;
            text-shadow: 0 0 30px #ffd700; opacity: 0; z-index: 30;
            pointer-events: none;
        }
        #level-up-effect.show { animation: levelUp 1s forwards; }
        @keyframes levelUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) translateY(-50px); }
        }
        
        /* Wave Announcement */
        #wave-announce {
            position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
            font-size: 2.5rem; color: #ff6b35; font-weight: 700;
            text-shadow: 0 0 20px #ff6b35; opacity: 0; z-index: 25;
            pointer-events: none;
        }
        #wave-announce.show { animation: waveAnnounce 2s forwards; }
        @keyframes waveAnnounce {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            20% { opacity: 1; transform: translateX(-50%) scale(1.1); }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Title Screen -->
        <div id="title-screen">
            <h1>VOID SURVIVORS</h1>
            <p>Survive the endless shadow horde</p>
            <button class="start-btn" onclick="startGame()">ENTER THE VOID</button>
            <div class="controls">
                WASD/Arrows: Move | SPACE: Dash | Auto-Attack enabled
            </div>
        </div>
        
        <!-- HUD -->
        <div id="hud" style="display: none;">
            <div class="hud-top">
                <div id="health-container">
                    <div id="health-label">SHIELD: <span id="health-text">100/100</span></div>
                    <div id="health-bar"><div id="health-fill"></div></div>
                </div>
                <div id="wave-info">
                    <div id="wave-number">WAVE 1</div>
                    <div id="timer">00:00</div>
                </div>
                <div style="text-align: right;">
                    <div id="score-display">0 PTS</div>
                    <div id="kill-count">0 KILLS</div>
                </div>
            </div>
            <div id="xp-container">
                <div id="xp-label">LEVEL <span id="level-text">1</span></div>
                <div id="xp-bar"><div id="xp-fill"></div></div>
            </div>
        </div>
        
        <!-- Level Up Effect -->
        <div id="level-up-effect">LEVEL UP!</div>
        
        <!-- Wave Announcement -->
        <div id="wave-announce">WAVE 1</div>
        
        <!-- Upgrade Screen -->
        <div id="upgrade-screen">
            <h2>CHOOSE YOUR POWER</h2>
            <div id="upgrade-cards"></div>
        </div>
        
        <!-- Game Over -->
        <div id="game-over">
            <h2>VOID CONSUMED</h2>
            <div class="stats">
                Survived: <span id="final-time">00:00</span><br>
                Wave Reached: <span id="final-wave">1</span><br>
                Enemies Slain: <span id="final-kills">0</span><br>
                Final Score: <span id="final-score">0</span>
            </div>
            <button id="restart-btn" onclick="restartGame()">RISE AGAIN</button>
        </div>
        
        <!-- Damage Numbers -->
        <div id="damage-numbers"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
    // ==================== GAME CONFIGURATION ====================
    const CONFIG = {
        ARENA_SIZE: 50,
        HERO_SPEED: 12,
        DASH_SPEED: 30,
        DASH_DURATION: 0.15,
        DASH_COOLDOWN: 2,
        ATTACK_RANGE: 15,
        BASE_DAMAGE: 10,
        XP_RADIUS: 8,
        WAVE_DURATION: 30,
        BOSS_WAVE_INTERVAL: 5
    };

    // ==================== GAME STATE ====================
    let gameState = 'title';
    let score = 0, kills = 0, wave = 1, waveTimer = 0, gameTime = 0;
    let heroHP = 100, maxHP = 100, level = 1, xp = 0, xpToLevel = 50;
    let isDashing = false, dashTimer = 0, dashCooldown = 0;
    let waveEnemiesRemaining = 0, bossActive = false;

    // Input
    const keys = { w: false, a: false, s: false, d: false, space: false };
    let mousePos = { x: 0, y: 0 };

    // Game Objects
    let hero, heroMesh, weapons = [], enemies = [], projectiles = [], particles = [], pickups = [];
    let damageNumbers = [];

    // Upgrades System
    const upgradeTypes = [
        { id: 'damage', name: 'Crystal Power', desc: '+25% Damage', icon: '💎', apply: () => hero.damage *= 1.25 },
        { id: 'fireRate', name: 'Rapid Fire', desc: '+20% Attack Speed', icon: '⚡', apply: () => hero.fireRate *= 0.8 },
        { id: 'speed', name: 'Swift Form', desc: '+15% Move Speed', icon: '💨', apply: () => hero.speed *= 1.15 },
        { id: 'health', name: 'Fortify', desc: '+25 Max HP & Heal', icon: '🛡️', apply: () => { maxHP += 25; heroHP = Math.min(heroHP + 25, maxHP); }},
        { id: 'range', name: 'Extended Reach', desc: '+30% Attack Range', icon: '🎯', apply: () => hero.range *= 1.3 },
        { id: 'shard', name: 'Crystal Shards+', desc: 'Upgrade Shards', icon: '🔷', apply: () => hero.weaponLevels[0]++, available: () => hero.weapons[0] },
        { id: 'orbital', name: 'Orbital Prism+', desc: 'Upgrade Orbitals', icon: '🔮', apply: () => hero.weaponLevels[1]++, available: () => hero.weapons[1] },
        { id: 'beam', name: 'Void Beam+', desc: 'Upgrade Beam', icon: '🌟', apply: () => hero.weaponLevels[2]++, available: () => hero.weapons[2] },
        { id: 'nova', name: 'Nova Burst+', desc: 'Upgrade Nova', icon: '💥', apply: () => hero.weaponLevels[3]++, available: () => hero.weapons[3] },
        { id: 'unlockOrbital', name: 'Orbital Prism', desc: 'Unlock rotating shields', icon: '🔮', apply: () => hero.weapons[1] = true, available: () => !hero.weapons[1] },
        { id: 'unlockBeam', name: 'Void Beam', desc: 'Unlock piercing laser', icon: '🌟', apply: () => hero.weapons[2] = true, available: () => !hero.weapons[2] },
        { id: 'unlockNova', name: 'Nova Burst', desc: 'Unlock AoE explosion', icon: '💥', apply: () => hero.weapons[3] = true, available: () => !hero.weapons[3] }
    ];

    // Hero State
    const heroState = {
        damage: CONFIG.BASE_DAMAGE,
        fireRate: 0.5,
        speed: CONFIG.HERO_SPEED,
        range: CONFIG.ATTACK_RANGE,
        attackTimer: 0,
        weapons: [true, false, false, false],
        weaponLevels: [1, 0, 0, 0]
    };

    // ==================== THREE.JS SETUP ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a12);
    scene.fog = new THREE.FogExp2(0x0a0a12, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 40, 30);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.getElementById('game-container').appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0x00ffcc, 1);
    mainLight.position.set(20, 40, 20);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 2048;
    mainLight.shadow.mapSize.height = 2048;
    mainLight.shadow.camera.near = 0.5;
    mainLight.shadow.camera.far = 100;
    mainLight.shadow.camera.left = -50;
    mainLight.shadow.camera.right = 50;
    mainLight.shadow.camera.top = 50;
    mainLight.shadow.camera.bottom = -50;
    scene.add(mainLight);

    const rimLight = new THREE.PointLight(0xff6b35, 0.5, 100);
    rimLight.position.set(-20, 10, -20);
    scene.add(rimLight);

    // ==================== CREATE ARENA ====================
    function createArena() {
        // Main floor
        const floorGeo = new THREE.CylinderGeometry(CONFIG.ARENA_SIZE, CONFIG.ARENA_SIZE, 2, 64);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x1a1a2e, 
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -1;
        floor.receiveShadow = true;
        scene.add(floor);

        // Grid lines
        const gridHelper = new THREE.GridHelper(CONFIG.ARENA_SIZE * 2, 40, 0x00ffcc, 0x00ffcc);
        gridHelper.material.opacity = 0.1;
        gridHelper.material.transparent = true;
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // Arena edge glow
        const ringGeo = new THREE.TorusGeometry(CONFIG.ARENA_SIZE, 0.3, 8, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.5 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.1;
        scene.add(ring);

        // Stars background
        const starsGeo = new THREE.BufferGeometry();
        const starsPositions = [];
        for (let i = 0; i < 2000; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 150 + Math.random() * 100;
            starsPositions.push(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);
    }

    // ==================== CREATE HERO ====================
    function createHero() {
        hero = new THREE.Group();
        
        // Body - Crystal core
        const bodyGeo = new THREE.OctahedronGeometry(1.2, 0);
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0x00ffcc, 
            emissive: 0x00ffcc,
            emissiveIntensity: 0.5,
            roughness: 0.2,
            metalness: 0.8
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.castShadow = true;
        hero.add(body);

        // Inner glow
        const innerGeo = new THREE.OctahedronGeometry(0.8, 0);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 });
        const inner = new THREE.Mesh(innerGeo, innerMat);
        hero.add(inner);

        // Floating crystals
        for (let i = 0; i < 4; i++) {
            const crystalGeo = new THREE.ConeGeometry(0.2, 0.6, 4);
            const crystalMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffcc, 
                emissive: 0x00ffcc,
                emissiveIntensity: 0.3
            });
            const crystal = new THREE.Mesh(crystalGeo, crystalMat);
            const angle = (i / 4) * Math.PI * 2;
            crystal.position.set(Math.cos(angle) * 1.5, 0.5, Math.sin(angle) * 1.5);
            crystal.rotation.z = Math.PI;
            hero.add(crystal);
        }

        // Point light on hero
        const heroLight = new THREE.PointLight(0x00ffcc, 1, 15);
        heroLight.position.y = 1;
        hero.add(heroLight);

        hero.position.y = 1.5;
        scene.add(hero);
        heroMesh = hero;
    }

    // ==================== ENEMY CREATION ====================
    const enemyTypes = {
        wisp: {
            hp: 15, speed: 6, damage: 5, size: 0.6, color: 0x8b5cf6, xp: 5, points: 10,
            create: () => {
                const geo = new THREE.IcosahedronGeometry(0.6, 0);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: 0x8b5cf6, emissive: 0xff0080, emissiveIntensity: 0.5,
                    transparent: true, opacity: 0.8
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.castShadow = true;
                return mesh;
            }
        },
        crawler: {
            hp: 40, speed: 4, damage: 12, size: 1, color: 0x6b21a8, xp: 15, points: 25,
            create: () => {
                const group = new THREE.Group();
                const bodyGeo = new THREE.BoxGeometry(1.2, 0.8, 1.2);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0x6b21a8, emissive: 0xff0080, emissiveIntensity: 0.3
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                group.add(body);
                
                // Eyes
                const eyeGeo = new THREE.SphereGeometry(0.15, 8, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0080 });
                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.3, 0.2, 0.6);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.3, 0.2, 0.6);
                group.add(leftEye, rightEye);
                
                return group;
            }
        },
        knight: {
            hp: 80, speed: 5, damage: 20, size: 1.3, color: 0x4c1d95, xp: 30, points: 50,
            create: () => {
                const group = new THREE.Group();
                const bodyGeo = new THREE.ConeGeometry(0.8, 2, 4);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0x4c1d95, emissive: 0xff0080, emissiveIntensity: 0.4
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = Math.PI;
                body.position.y = 1;
                body.castShadow = true;
                group.add(body);
                
                // Shield
                const shieldGeo = new THREE.BoxGeometry(0.3, 1.2, 0.1);
                const shieldMat = new THREE.MeshStandardMaterial({ 
                    color: 0x8b5cf6, emissive: 0xff0080, emissiveIntensity: 0.3,
                    transparent: true, opacity: 0.8
                });
                const shield = new THREE.Mesh(shieldGeo, shieldMat);
                shield.position.set(0.8, 0.8, 0);
                shield.rotation.z = -0.3;
                group.add(shield);
                
                return group;
            }
        },
        hunter: {
            hp: 30, speed: 3.5, damage: 8, size: 0.9, color: 0x9333ea, xp: 20, points: 35, ranged: true,
            create: () => {
                const group = new THREE.Group();
                const bodyGeo = new THREE.OctahedronGeometry(0.8, 0);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0x9333ea, emissive: 0xff0080, emissiveIntensity: 0.4
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                group.add(body);
                
                // Eye
                const eyeGeo = new THREE.SphereGeometry(0.2, 8, 8);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0080 });
                const eye = new THREE.Mesh(eyeGeo, eyeMat);
                eye.position.set(0, 0, 0.7);
                group.add(eye);
                
                return group;
            }
        },
        boss: {
            hp: 500, speed: 2.5, damage: 30, size: 3, color: 0x3b0764, xp: 200, points: 500,
            create: () => {
                const group = new THREE.Group();
                
                // Main body
                const bodyGeo = new THREE.OctahedronGeometry(2.5, 1);
                const bodyMat = new THREE.MeshStandardMaterial({ 
                    color: 0x3b0764, emissive: 0xff0080, emissiveIntensity: 0.6,
                    roughness: 0.3, metalness: 0.7
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.castShadow = true;
                group.add(body);
                
                // Crown spikes
                for (let i = 0; i < 6; i++) {
                    const spikeGeo = new THREE.ConeGeometry(0.3, 1.5, 4);
                    const spikeMat = new THREE.MeshStandardMaterial({ 
                        color: 0xff0080, emissive: 0xff0080, emissiveIntensity: 0.8
                    });
                    const spike = new THREE.Mesh(spikeGeo, spikeMat);
                    const angle = (i / 6) * Math.PI * 2;
                    spike.position.set(Math.cos(angle) * 1.8, 2, Math.sin(angle) * 1.8);
                    spike.rotation.z = Math.PI;
                    group.add(spike);
                }
                
                // Core
                const coreGeo = new THREE.SphereGeometry(0.8, 16, 16);
                const coreMat = new THREE.MeshBasicMaterial({ color: 0xff0080 });
                const core = new THREE.Mesh(coreGeo, coreMat);
                group.add(core);
                
                // Point light
                const light = new THREE.PointLight(0xff0080, 2, 20);
                light.position.y = 1;
                group.add(light);
                
                return group;
            }
        }
    };

    function spawnEnemy(type, isBoss = false) {
        const typeData = enemyTypes[type];
        const mesh = typeData.create();
        
        // Random position on arena edge
        const angle = Math.random() * Math.PI * 2;
        const spawnDist = CONFIG.ARENA_SIZE - 2;
        mesh.position.set(
            Math.cos(angle) * spawnDist,
            isBoss ? 3 : typeData.size,
            Math.sin(angle) * spawnDist
        );
        
        scene.add(mesh);
        
        const enemy = {
            mesh,
            type,
            hp: isBoss ? typeData.hp * (1 + wave * 0.3) : typeData.hp * (1 + wave * 0.1),
            maxHp: isBoss ? typeData.hp * (1 + wave * 0.3) : typeData.hp * (1 + wave * 0.1),
            speed: typeData.speed,
            damage: isBoss ? typeData.damage * (1 + wave * 0.2) : typeData.damage,
            size: isBoss ? typeData.size * 1.5 : typeData.size,
            xp: isBoss ? typeData.xp * 5 : typeData.xp,
            points: isBoss ? typeData.points * 10 : typeData.points,
            ranged: typeData.ranged || false,
            attackTimer: 0,
            isBoss,
            rotationOffset: Math.random() * Math.PI * 2
        };
        
        enemies.push(enemy);
        return enemy;
    }

    // ==================== PROJECTILES ====================
    function createProjectile(x, y, z, targetX, targetZ, isHero = true, damage = 10, color = 0x00ffcc) {
        const geo = new THREE.SphereGeometry(0.2, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        
        const dir = new THREE.Vector3(targetX - x, 0, targetZ - z).normalize();
        const speed = isHero ? 40 : 15;
        
        scene.add(mesh);
        projectiles.push({
            mesh,
            dir,
            speed,
            damage,
            isHero,
            lifetime: 2,
            trail: []
        });
    }

    // ==================== WEAPON SYSTEMS ====================
    function updateWeapons(dt) {
        heroState.attackTimer -= dt;
        
        if (heroState.attackTimer <= 0) {
            // Find nearest enemy
            let nearest = null;
            let nearestDist = heroState.range;
            
            enemies.forEach(enemy => {
                const dist = hero.position.distanceTo(enemy.mesh.position);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearest = enemy;
                }
            });
            
            if (nearest) {
                // Attack nearest enemy
                if (hero.weapons[0]) fireShards(nearest);
                if (hero.weapons[2] && level >= 3) fireBeam(nearest);
                
                heroState.attackTimer = heroState.fireRate * (0.8 + Math.random() * 0.4);
            }
        }
        
        // Orbital weapons
        if (hero.weapons[1]) updateOrbitals(dt);
        if (hero.weapons[3] && level >= 5) updateNova(dt);
    }

    function fireShards(target) {
        const levels = hero.weaponLevels[0];
        const count = 2 + levels;
        const damage = heroState.damage * (1 + levels * 0.3);
        
        for (let i = 0; i < count; i++) {
            const offset = (i - (count - 1) / 2) * 0.5;
            createProjectile(
                hero.position.x + offset,
                hero.position.y,
                hero.position.z,
                target.mesh.position.x + offset,
                target.mesh.position.z,
                true,
                damage,
                0x00ffcc
            );
        }
    }

    let orbitalAngle = 0;
    function updateOrbitals(dt) {
        orbitalAngle += dt * 3;
        const levels = hero.weaponLevels[1];
        const count = 2 + levels;
        const radius = 3 + levels * 0.5;
        const damage = heroState.damage * 0.5 * (1 + levels * 0.3);
        
        // Clear old orbital visuals
        hero.children.filter(c => c.userData.orbital).forEach(o => scene.remove(o));
        hero.children = hero.children.filter(c => !c.userData.orbital);
        
        for (let i = 0; i < count; i++) {
            const angle = orbitalAngle + (i / count) * Math.PI * 2;
            const x = hero.position.x + Math.cos(angle) * radius;
            const z = hero.position.z + Math.sin(angle) * radius;
            
            const geo = new THREE.OctahedronGeometry(0.4 + levels * 0.1, 0);
            const mat = new THREE.MeshStandardMaterial({ 
                color: 0x8b5cf6, emissive: 0x8b5cf6, emissiveIntensity: 0.5
            });
            const orbital = new THREE.Mesh(geo, mat);
            orbital.position.set(x, 1, z);
            orbital.userData.orbital = true;
            orbital.rotation.x += dt * 5;
            orbital.rotation.y += dt * 3;
            scene.add(orbital);
            
            // Check collision with enemies
            enemies.forEach(enemy => {
                if (orbital.position.distanceTo(enemy.mesh.position) < enemy.size + 0.5) {
                    enemy.hp -= damage * dt * 10;
                    spawnDamageNumber(enemy.mesh.position, damage * dt * 10, 0x8b5cf6);
                }
            });
        }
    }

    let novaTimer = 0;
    function updateNova(dt) {
        novaTimer -= dt;
        if (novaTimer <= 0) {
            novaTimer = 4 - hero.weaponLevels[3] * 0.5;
            
            const damage = heroState.damage * 3 * (1 + hero.weaponLevels[3] * 0.5);
            const radius = 8 + hero.weaponLevels[3] * 2;
            
            // Visual effect
            const novaGeo = new THREE.RingGeometry(0.1, radius, 32);
            const novaMat = new THREE.MeshBasicMaterial({ 
                color: 0xff6b35, transparent: true, opacity: 0.6, side: THREE.DoubleSide
            });
            const nova = new THREE.Mesh(novaGeo, novaMat);
            nova.rotation.x = -Math.PI / 2;
            nova.position.copy(hero.position);
            nova.position.y = 0.1;
            scene.add(nova);
            
            // Animate and damage
            let scale = 0.1;
            const expand = setInterval(() => {
                scale += 0.2;
                nova.scale.set(scale, scale, 1);
                nova.material.opacity -= 0.05;
                if (nova.material.opacity <= 0) {
                    clearInterval(expand);
                    scene.remove(nova);
                }
            }, 30);
            
            // Damage enemies in range
            enemies.forEach(enemy => {
                if (hero.position.distanceTo(enemy.mesh.position) < radius) {
                    enemy.hp -= damage;
                    spawnDamageNumber(enemy.mesh.position, damage, 0xff6b35);
                }
            });
        }
    }

    function fireBeam(target) {
        // Create beam visual
        const start = hero.position.clone();
        const end = target.mesh.position.clone();
        end.y = 1;
        
        const direction = end.clone().sub(start);
        const length = direction.length();
        
        const beamGeo = new THREE.CylinderGeometry(0.2, 0.2, length, 8);
        const beamMat = new THREE.MeshBasicMaterial({ 
            color: 0x00ffcc, transparent: true, opacity: 0.8 
        });
        const beam = new THREE.Mesh(beamGeo, beamMat);
        
        beam.position.copy(start.clone().add(end).multiplyScalar(0.5));
        beam.position.y = 1;
        beam.lookAt(end);
        beam.rotateX(Math.PI / 2);
        
        scene.add(beam);
        
        // Damage all enemies in line
        const damage = heroState.damage * 2 * (1 + hero.weaponLevels[2] * 0.3);
        enemies.forEach(enemy => {
            const enemyPos = enemy.mesh.position;
            const toEnemy = enemyPos.clone().sub(start);
            const dot = toEnemy.dot(direction.normalize());
            
            if (dot > 0 && dot < length) {
                const closest = start.clone().add(direction.normalize().multiplyScalar(dot));
                if (closest.distanceTo(enemyPos) < enemy.size + 1) {
                    enemy.hp -= damage;
                    spawnDamageNumber(enemyPos, damage, 0x00ffcc);
                }
            }
        });
        
        // Fade out beam
        setTimeout(() => {
            scene.remove(beam);
        }, 100);
    }

    // ==================== ENEMY AI ====================
    function updateEnemies(dt) {
        enemies.forEach((enemy, index) => {
            if (enemy.hp <= 0) {
                // Death
                score += enemy.points;
                kills++;
                spawnDeathParticles(enemy.mesh.position, enemy.isBoss ? 0xff0080 : 0x8b5cf6);
                spawnXPOrb(enemy.mesh.position, enemy.xp);
                scene.remove(enemy.mesh);
                enemies.splice(index, 1);
                return;
            }
            
            // Face hero
            enemy.mesh.lookAt(hero.position.x, enemy.mesh.position.y, hero.position.z);
            
            // Move towards hero
            const dir = new THREE.Vector3()
                .subVectors(hero.position, enemy.mesh.position)
                .normalize();
            
            const dist = hero.position.distanceTo(enemy.mesh.position);
            
            if (enemy.ranged && dist < 12) {
                // Ranged enemy - strafe
                enemy.mesh.position.x += dir.z * enemy.speed * dt * 0.5;
                enemy.mesh.position.z -= dir.x * enemy.speed * dt * 0.5;
                
                // Attack
                enemy.attackTimer -= dt;
                if (enemy.attackTimer <= 0) {
                    createProjectile(
                        enemy.mesh.position.x, enemy.mesh.position.y, enemy.mesh.position.z,
                        hero.position.x, hero.position.z,
                        false, enemy.damage, 0xff0080
                    );
                    enemy.attackTimer = 1.5;
                }
            } else if (dist > enemy.size + 1.5) {
                enemy.mesh.position.x += dir.x * enemy.speed * dt;
                enemy.mesh.position.z += dir.z * enemy.speed * dt;
            } else {
                // Attack hero
                enemy.attackTimer -= dt;
                if (enemy.attackTimer <= 0) {
                    heroHP -= enemy.damage;
                    spawnDamageNumber(hero.position.clone().add(new THREE.Vector3(0, 2, 0)), enemy.damage, 0xff0000);
                    enemy.attackTimer = 1;
                    
                    // Screen shake effect
                    camera.position.x += (Math.random() - 0.5) * 0.5;
                    camera.position.z += (Math.random() - 0.5) * 0.5;
                }
            }
            
            // Bobbing animation
            enemy.mesh.position.y = enemy.size + Math.sin(Date.now() * 0.005 + enemy.rotationOffset) * 0.3;
            enemy.mesh.rotation.y += dt * 2;
        });
    }

    // ==================== PARTICLES & EFFECTS ====================
    function spawnDeathParticles(position, color) {
        for (let i = 0; i < 15; i++) {
            const geo = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
            const particle = new THREE.Mesh(geo, mat);
            particle.position.copy(position);
            
            const velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 10,
                Math.random() * 8,
                (Math.random() - 0.5) * 10
            );
            
            scene.add(particle);
            particles.push({
                mesh: particle,
                velocity,
                life: 1,
                decay: 0.02 + Math.random() * 0.02
            });
        }
    }

    function spawnXPOrb(position, amount) {
        const geo = new THREE.OctahedronGeometry(0.3, 0);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.9 });
        const orb = new THREE.Mesh(geo, mat);
        orb.position.copy(position);
        orb.position.y = 1;
        scene.add(orb);
        
        pickups.push({
            mesh: orb,
            amount,
            lifetime: 10
        });
    }

    function updateParticles(dt) {
        particles.forEach((p, index) => {
            p.velocity.y -= 20 * dt;
            p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
            p.mesh.rotation.x += dt * 5;
            p.mesh.rotation.y += dt * 3;
            p.life -= p.decay;
            p.mesh.material.opacity = p.life;
            
            if (p.life <= 0) {
                scene.remove(p.mesh);
                particles.splice(index, 1);
            }
        });
        
        // XP orbs
        pickups.forEach((p, index) => {
            p.lifetime -= dt;
            p.mesh.rotation.y += dt * 3;
            p.mesh.position.y += Math.sin(Date.now() * 0.01 + index) * 0.02;
            
            // Attract to hero
            const dist = hero.position.distanceTo(p.mesh.position);
            if (dist < CONFIG.XP_RADIUS) {
                const dir = new THREE.Vector3()
                    .subVectors(hero.position, p.mesh.position)
                    .normalize();
                p.mesh.position.add(dir.multiplyScalar(dt * 20));
            }
            
            // Collect
            if (dist < 2) {
                xp += p.amount;
                scene.remove(p.mesh);
                pickups.splice(index, 1);
                checkLevelUp();
            } else if (p.lifetime <= 0) {
                scene.remove(p.mesh);
                pickups.splice(index, 1);
            }
        });
    }

    function updateProjectiles(dt) {
        projectiles.forEach((p, index) => {
            p.mesh.position.x += p.dir.x * p.speed * dt;
            p.mesh.position.z += p.dir.z * p.speed * dt;
            p.lifetime -= dt;
            
            // Trail
            if (p.isHero) {
                const trailGeo = new THREE.SphereGeometry(0.1, 4, 4);
                const trailMat = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffcc, transparent: true, opacity: 0.5 
                });
                const trail = new THREE.Mesh(trailGeo, trailMat);
                trail.position.copy(p.mesh.position);
                scene.add(trail);
                setTimeout(() => scene.remove(trail), 100);
            }
            
            // Check enemy collision for hero projectiles
            if (p.isHero) {
                enemies.forEach(enemy => {
                    if (p.mesh.position.distanceTo(enemy.mesh.position) < enemy.size) {
                        enemy.hp -= p.damage;
                        spawnDamageNumber(enemy.mesh.position.clone().add(new THREE.Vector3(0, 1, 0)), p.damage, 0xffffff);
                        p.lifetime = 0;
                    }
                });
            } else {
                // Check hero collision for enemy projectiles
                if (p.mesh.position.distanceTo(hero.position) < 2) {
                    heroHP -= p.damage;
                    spawnDamageNumber(hero.position.clone().add(new THREE.Vector3(0, 2, 0)), p.damage, 0xff0000);
                    p.lifetime = 0;
                }
            }
            
            // Remove if out of bounds or expired
            const dist = Math.abs(p.mesh.position.x) > CONFIG.ARENA_SIZE + 10 ||
                        Math.abs(p.mesh.position.z) > CONFIG.ARENA_SIZE + 10;
            if (p.lifetime <= 0 || dist) {
                scene.remove(p.mesh);
                projectiles.splice(index, 1);
            }
        });
    }

    // ==================== DAMAGE NUMBERS ====================
    function spawnDamageNumber(position, damage, color) {
        const div = document.createElement('div');
        div.style.cssText = `
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: ${Math.min(1.5 + damage * 0.02, 2.5)}rem;
            color: #${color.toString(16).padStart(6, '0')};
            text-shadow: 0 0 10px #${color.toString(16).padStart(6, '0')}, 2px 2px 0 #000;
            pointer-events: none;
            z-index: 20;
            transform: translate(-50%, -50%);
        `;
        div.textContent = Math.round(damage);
        
        // Project 3D position to screen
        const vector = position.clone().project(camera);
        const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
        
        div.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
        div.style.top = (y + (Math.random() - 0.5) * 20) + 'px';
        
        document.getElementById('damage-numbers').appendChild(div);
        
        // Animate
        let opacity = 1;
        let yOffset = 0;
        const animate = () => {
            yOffset += 1.5;
            opacity -= 0.025;
            div.style.top = (y + yOffset) + 'px';
            div.style.opacity = opacity;
            if (opacity > 0) requestAnimationFrame(animate);
            else div.remove();
        };
        setTimeout(animate, 50);
    }

    // ==================== WAVE SYSTEM ====================
    function updateWaves(dt) {
        waveTimer += dt;
        
        if (waveTimer >= CONFIG.WAVE_DURATION) {
            waveTimer = 0;
            wave++;
            
            // Check for boss wave
            if (wave % CONFIG.BOSS_WAVE_INTERVAL === 0) {
                bossActive = true;
                showWaveAnnouncement(`BOSS WAVE ${wave}`);
                spawnEnemy('boss', true);
            } else {
                showWaveAnnouncement(`WAVE ${wave}`);
            }
            
            // Scale enemy counts
            const baseEnemies = 5 + wave * 2;
            waveEnemiesRemaining = baseEnemies;
        }
        
        // Spawn enemies throughout the wave
        if (waveEnemiesRemaining > 0 && Math.random() < 0.03 * (1 + wave * 0.1)) {
            spawnWaveEnemy();
            waveEnemiesRemaining--;
        }
    }

    function spawnWaveEnemy() {
        const roll = Math.random();
        let type;
        
        if (wave < 3) {
            type = 'wisp';
        } else if (wave < 5) {
            type = roll < 0.7 ? 'wisp' : 'crawler';
        } else if (wave < 8) {
            type = roll < 0.4 ? 'wisp' : roll < 0.8 ? 'crawler' : 'hunter';
        } else {
            type = roll < 0.3 ? 'wisp' : roll < 0.55 ? 'crawler' : roll < 0.8 ? 'hunter' : 'knight';
        }
        
        spawnEnemy(type);
    }

    function showWaveAnnouncement(text) {
        const el = document.getElementById('wave-announce');
        el.textContent = text;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }

    // ==================== PROGRESSION ====================
    function checkLevelUp() {
        while (xp >= xpToLevel) {
            xp -= xpToLevel;
            level++;
            xpToLevel = Math.floor(xpToLevel * 1.5);
            
            showLevelUpEffect();
            showUpgradeScreen();
        }
    }

    function showLevelUpEffect() {
        const el = document.getElementById('level-up-effect');
        el.textContent = `LEVEL ${level}!`;
        el.classList.remove('show');
        void el.offsetWidth;
        el.classList.add('show');
    }

    function showUpgradeScreen() {
        gameState = 'upgrade';
        document.getElementById('upgrade-screen').style.display = 'flex';
        
        const container = document.getElementById('upgrade-cards');
        container.innerHTML = '';
        
        // Get 3 random upgrades
        const available = upgradeTypes.filter(u => !u.available || u.available());
        const selected = [];
        
        while (selected.length < 3 && available.length > 0) {
            const index = Math.floor(Math.random() * available.length);
            selected.push(available.splice(index, 1)[0]);
        }
        
        selected.forEach(upgrade => {
            const card = document.createElement('div');
            card.className = 'upgrade-card';
            card.innerHTML = `
                <div class="icon">${upgrade.icon}</div>
                <div class="name">${upgrade.name}</div>
                <div class="desc">${upgrade.desc}</div>
            `;
            card.onclick = () => {
                upgrade.apply();
                document.getElementById('upgrade-screen').style.display = 'none';
                gameState = 'playing';
            };
            container.appendChild(card);
        });
    }

    // ==================== UI UPDATE ====================
    function updateUI() {
        // Health
        const healthPercent = (heroHP / maxHP) * 100;
        document.getElementById('health-fill').style.width = healthPercent + '%';
        document.getElementById('health-text').textContent = `${Math.round(heroHP)}/${maxHP}`;
        document.getElementById('health-bar').classList.toggle('low', healthPercent < 30);
        
        // XP
        const xpPercent = (xp / xpToLevel) * 100;
        document.getElementById('xp-fill').style.width = xpPercent + '%';
        document.getElementById('level-text').textContent = level;
        
        // Wave info
        document.getElementById('wave-number').textContent = `WAVE ${wave}`;
        const minutes = Math.floor(gameTime / 60);
        const seconds = Math.floor(gameTime % 60);
        document.getElementById('timer').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Score
        document.getElementById('score-display').textContent = `${score.toLocaleString()} PTS`;
        document.getElementById('kill-count').textContent = `${kills} KILLS`;
    }

    // ==================== HERO MOVEMENT ====================
    function updateHeroMovement(dt) {
        if (gameState !== 'playing') return;
        
        let moveX = 0, moveZ = 0;
        if (keys.w || keys.arrowup) moveZ -= 1;
        if (keys.s || keys.arrowdown) moveZ += 1;
        if (keys.a || keys.arrowleft) moveX -= 1;
        if (keys.d || keys.arrowright) moveX += 1;
        
        const moveLength = Math.sqrt(moveX * moveX + moveZ * moveZ);
        if (moveLength > 0) {
            moveX /= moveLength;
            moveZ /= moveLength;
        }
        
        // Dashing
        if (isDashing) {
            dashTimer -= dt;
            hero.position.x += moveX * CONFIG.DASH_SPEED * dt;
            hero.position.z += moveZ * CONFIG.DASH_SPEED * dt;
            
            if (dashTimer <= 0) isDashing = false;
        } else {
            const speed = dashCooldown > 0 ? heroState.speed * 0.7 : heroState.speed;
            hero.position.x += moveX * speed * dt;
            hero.position.z += moveZ * speed * dt;
        }
        
        // Dash cooldown
        if (dashCooldown > 0) dashCooldown -= dt;
        
        // Arena bounds
        const bound = CONFIG.ARENA_SIZE - 2;
        hero.position.x = Math.max(-bound, Math.min(bound, hero.position.x));
        hero.position.z = Math.max(-bound, Math.min(bound, hero.position.z));
        
        // Rotation
        if (moveX !== 0 || moveZ !== 0) {
            const targetAngle = Math.atan2(moveX, moveZ);
            hero.rotation.y += (targetAngle - hero.rotation.y) * 0.1;
        }
        
        // Idle animation
        hero.position.y = 1.5 + Math.sin(Date.now() * 0.003) * 0.2;
        
        // Start dash
        if (keys.space && dashCooldown <= 0 && !isDashing) {
            isDashing = true;
            dashTimer = CONFIG.DASH_DURATION;
            dashCooldown = CONFIG.DASH_COOLDOWN;
        }
    }

    // ==================== GAME LOOP ====================
    let lastTime = 0;
    function gameLoop(currentTime) {
        requestAnimationFrame(gameLoop);
        
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;
        
        if (gameState === 'playing') {
            gameTime += dt;
            
            updateHeroMovement(dt);
            updateWeapons(dt);
            updateEnemies(dt);
            updateProjectiles(dt);
            updateParticles(dt);
            updateWaves(dt);
            updateUI();
            
            // Check death
            if (heroHP <= 0) {
                gameOver();
            }
        }
        
        // Smooth camera back to center
        camera.position.x += (0 - camera.position.x) * 0.1;
        camera.position.z += (30 - camera.position.z) * 0.1;
        
        renderer.render(scene, camera);
    }

    // ==================== GAME STATE MANAGEMENT ====================
    function startGame() {
        document.getElementById('title-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        gameState = 'playing';
        
        // Reset game state
        score = 0; kills = 0; wave = 1; waveTimer = 0; gameTime = 0;
        heroHP = 100; maxHP = 100; level = 1; xp = 0; xpToLevel = 50;
        isDashing = false; dashTimer = 0; dashCooldown = 0;
        bossActive = false;
        
        // Reset hero upgrades
        heroState.damage = CONFIG.BASE_DAMAGE;
        heroState.fireRate = 0.5;
        heroState.speed = CONFIG.HERO_SPEED;
        heroState.range = CONFIG.ATTACK_RANGE;
        heroState.attackTimer = 0;
        heroState.weapons = [true, false, false, false];
        heroState.weaponLevels = [1, 0, 0, 0];
        
        // Clear existing objects
        enemies.forEach(e => scene.remove(e.mesh));
        enemies = [];
        projectiles.forEach(p => scene.remove(p.mesh));
        projectiles = [];
        particles.forEach(p => scene.remove(p.mesh));
        particles = [];
        pickups.forEach(p => scene.remove(p.mesh));
        pickups = [];
        
        // Remove orbital meshes
        scene.children.filter(c => c.userData.orbital).forEach(o => scene.remove(o));
        
        showWaveAnnouncement('WAVE 1');
    }

    function gameOver() {
        gameState = 'gameover';
        document.getElementById('game-over').style.display = 'flex';
        
        const minutes = Math.floor(gameTime / 60);
        const seconds = Math.floor(gameTime % 60);
        document.getElementById('final-time').textContent = 
            `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        document.getElementById('final-wave').textContent = wave;
        document.getElementById('final-kills').textContent = kills;
        document.getElementById('final-score').textContent = score.toLocaleString();
    }

    function restartGame() {
        document.getElementById('game-over').style.display = 'none';
        startGame();
    }

    // ==================== INPUT HANDLING ====================
    document.addEventListener('keydown', e => {
        const key = e.key.toLowerCase();
        if (key in keys) keys[key] = true;
        if (key === ' ') keys.space = true;
        if (key === 'arrowup') keys.arrowup = true;
        if (key === 'arrowdown') keys.arrowdown = true;
        if (key === 'arrowleft') keys.arrowleft = true;
        if (key === 'arrowright') keys.arrowright = true;
    });

    document.addEventListener('keyup', e => {
        const key = e.key.toLowerCase();
        if (key in keys) keys[key] = false;
        if (key === ' ') keys.space = false;
        if (key === 'arrowup') keys.arrowup = false;
        if (key === 'arrowdown') keys.arrowdown = false;
        if (key === 'arrowleft') keys.arrowleft = false;
        if (key === 'arrowright') keys.arrowright = false;
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ==================== INITIALIZATION ====================
    createArena();
    createHero();
    gameLoop(0);
    </script>
</body>
</html>
