<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram • 20×20</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', system_ui, sans-serif;
            background: linear-gradient(135deg, #f0f9ff, #e0f2fe);
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 30px 60px -15px rgba(0,0,0,0.25);
            padding: 30px;
            max-width: 820px;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e2937;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 15px;
            margin-bottom: 20px;
        }
        #boardContainer {
            border: 12px solid #1e2937;
            border-radius: 16px;
            background: #f8fafc;
            padding: 10px;
        }
        #winModal {
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
            max-width: 380px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nonogram Puzzle</h1>
        <p class="subtitle">20 × 20 • Click to fill • Right-click to mark X</p>
        
        <div id="boardContainer">
            <svg id="board" width="740" height="740"></svg>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <button onclick="newGame()" 
                    style="background:#1e2937;color:white;padding:12px 32px;border:none;border-radius:9999px;font-weight:600;cursor:pointer;">
                <i class="fa-solid fa-rotate"></i> New Puzzle
            </button>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="winModal">
        <div class="modal-content">
            <div style="font-size:80px;margin-bottom:20px;">🎉</div>
            <h2 style="font-size:32px;margin:0 0 12px 0;color:#15803d;">Amazing!</h2>
            <p style="color:#334155;font-size:18px;">You solved the puzzle perfectly!</p>
            <button onclick="location.reload()" 
                    style="margin-top:30px;background:#15803d;color:white;padding:16px 48px;border:none;border-radius:9999px;font-size:18px;font-weight:600;cursor:pointer;">
                Play Again
            </button>
        </div>
    </div>

    <script>
        // ================================================
        // NONOGRAM (PICROSS) 20×20
        // Single HTML file using SVG.js
        // Educational, clean, kid-friendly colors
        // ================================================

        const ROWS = 20;
        const COLS = 20;
        const CELL = 28;
        const CLUE_LEFT = 138;
        const CLUE_TOP = 138;
        const TOTAL_W = CLUE_LEFT + COLS * CELL + 30;
        const TOTAL_H = CLUE_TOP + ROWS * CELL + 30;

        let svg;
        let playerGrid = Array.from({length: ROWS}, () => Array(COLS).fill(0)); // 0=empty, 1=filled, 2=X
        let cellGroups = [];
        let solution = [];
        let rowClues = [];
        let colClues = [];

        // Predefined 20×20 solution (a cute cat face - educational & fun)
        function createSolution() {
            solution = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            
            // Head outline + fill
            for (let r = 4; r <= 15; r++) {
                for (let c = 5; c <= 14; c++) {
                    solution[r][c] = 1;
                }
            }
            // Ears
            for (let c = 6; c <= 8; c++) solution[3][c] = 1;
            for (let c = 11; c <= 13; c++) solution[3][c] = 1;
            
            // Eyes
            solution[7][7] = 0; solution[7][8] = 0;
            solution[7][11] = 0; solution[7][12] = 0;
            solution[8][7] = 0; solution[8][8] = 0;
            solution[8][11] = 0; solution[8][12] = 0;
            
            // Nose
            solution[10][9] = 1; solution[10][10] = 1;
            
            // Mouth
            for (let c = 7; c <= 12; c++) solution[12][c] = 1;
            solution[13][8] = 1; solution[13][11] = 1;
            
            // Whiskers left
            solution[11][4] = 1; solution[11][3] = 1;
            solution[12][3] = 1;
            solution[13][4] = 1;
            
            // Whiskers right
            solution[11][15] = 1; solution[11][16] = 1;
            solution[12][16] = 1;
            solution[13][15] = 1;
        }

        function computeClues() {
            // Row clues
            rowClues = [];
            for (let r = 0; r < ROWS; r++) {
                let clues = [];
                let count = 0;
                for (let c = 0; c < COLS; c++) {
                    if (solution[r][c] === 1) count++;
                    else if (count > 0) {
                        clues.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clues.push(count);
                rowClues.push(clues);
            }
            
            // Column clues
            colClues = [];
            for (let c = 0; c < COLS; c++) {
                let clues = [];
                let count = 0;
                for (let r = 0; r < ROWS; r++) {
                    if (solution[r][c] === 1) count++;
                    else if (count > 0) {
                        clues.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clues.push(count);
                colClues.push(clues);
            }
        }

        function drawBoard() {
            svg = SVG().addTo('#board').size(TOTAL_W, TOTAL_H);
            
            // Background
            svg.rect(TOTAL_W, TOTAL_H).fill('#f8fafc');
            
            // Grid background area
            svg.rect(COLS * CELL, ROWS * CELL)
               .move(CLUE_LEFT, CLUE_TOP)
               .fill('#ffffff')
               .stroke({color: '#e2e8f0', width: 2});
            
            // Grid lines
            for (let i = 0; i <= ROWS; i++) {
                svg.line(CLUE_LEFT, CLUE_TOP + i * CELL, CLUE_LEFT + COLS * CELL, CLUE_TOP + i * CELL)
                   .stroke({color: '#64748b', width: i % 5 === 0 ? 3 : 1.5});
            }
            for (let i = 0; i <= COLS; i++) {
                svg.line(CLUE_LEFT + i * CELL, CLUE_TOP, CLUE_LEFT + i * CELL, CLUE_TOP + ROWS * CELL)
                   .stroke({color: '#64748b', width: i % 5 === 0 ? 3 : 1.5});
            }
            
            // Draw clues
            drawRowClues();
            drawColumnClues();
            
            // Create cell groups
            cellGroups = Array.from({length: ROWS}, () => Array(COLS));
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const group = svg.group();
                    group.move(CLUE_LEFT + c * CELL, CLUE_TOP + r * CELL);
                    
                    // Background cell
                    group.rect(CELL, CELL).fill('#f1f5f9').stroke({color: '#cbd5e1', width: 1});
                    
                    // Fill rect
                    const fillRect = group.rect(CELL - 6, CELL - 6)
                        .center(CELL/2, CELL/2)
                        .fill('#1e2937')
                        .hide();
                    
                    // X lines
                    const xLine1 = group.line(6, 6, CELL-6, CELL-6)
                        .stroke({color: '#ef4444', width: 4.5})
                        .hide();
                    const xLine2 = group.line(CELL-6, 6, 6, CELL-6)
                        .stroke({color: '#ef4444', width: 4.5})
                        .hide();
                    
                    cellGroups[r][c] = { group, fillRect, xLine1, xLine2 };
                    
                    // Interaction
                    group.click(() => toggleCell(r, c, 1));
                    group.on('contextmenu', (e) => {
                        e.preventDefault();
                        toggleCell(r, c, 2);
                    });
                }
            }
        }

        function drawRowClues() {
            for (let r = 0; r < ROWS; r++) {
                const clues = rowClues[r];
                if (clues.length === 0) continue;
                let x = CLUE_LEFT - 18;
                for (let i = clues.length - 1; i >= 0; i--) {
                    svg.text(clues[i].toString())
                       .move(x, CLUE_TOP + r * CELL + CELL/2 + 5)
                       .font({
                           size: 15,
                           family: 'Inter',
                           weight: 600,
                           anchor: 'end',
                           fill: '#334155'
                       });
                    x -= 24;
                }
            }
        }

        function drawColumnClues() {
            for (let c = 0; c < COLS; c++) {
                const clues = colClues[c];
                if (clues.length === 0) continue;
                let y = CLUE_TOP - 20;
                for (let i = clues.length - 1; i >= 0; i--) {
                    svg.text(clues[i].toString())
                       .center(CLUE_LEFT + c * CELL + CELL/2, y)
                       .font({
                           size: 15,
                           family: 'Inter',
                           weight: 600,
                           fill: '#334155'
                       });
                    y -= 22;
                }
            }
        }

        function updateCellVisual(r, c) {
            const cell = cellGroups[r][c];
            const state = playerGrid[r][c];
            
            cell.fillRect.hide();
            cell.xLine1.hide();
            cell.xLine2.hide();
            
            if (state === 1) {
                cell.fillRect.show();
            } else if (state === 2) {
                cell.xLine1.show();
                cell.xLine2.show();
            }
        }

        function toggleCell(r, c, mode) {
            if (mode === 1) {
                // Left click - fill toggle
                if (playerGrid[r][c] === 1) playerGrid[r][c] = 0;
                else playerGrid[r][c] = 1;
            } else if (mode === 2) {
                // Right click - X toggle
                if (playerGrid[r][c] === 2) playerGrid[r][c] = 0;
                else playerGrid[r][c] = 2;
            }
            updateCellVisual(r, c);
            checkWin();
        }

        function checkWin() {
            let solved = true;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const shouldBeFilled = solution[r][c] === 1;
                    const isFilled = playerGrid[r][c] === 1;
                    if (shouldBeFilled !== isFilled) {
                        solved = false;
                        break;
                    }
                }
                if (!solved) break;
            }
            if (solved) {
                document.getElementById('winModal').style.display = 'flex';
            }
        }

        function newGame() {
            playerGrid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            createSolution();
            computeClues();
            drawBoard();
            // Initial visual update
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    updateCellVisual(r, c);
                }
            }
            document.getElementById('winModal').style.display = 'none';
        }

        // Keyboard hint (optional)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') newGame();
        });

        // Start the game
        window.onload = () => {
            newGame();
        };
    </script>
</body>
</html>
