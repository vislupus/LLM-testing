<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram Puzzle - 20×20 Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #2d3748;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: #f7fafc;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
        }

        .info-label {
            color: #4a5568;
            font-weight: 600;
        }

        .info-value {
            color: #2d3748;
            font-size: 1.1em;
            font-weight: bold;
        }

        #puzzle-container {
            display: flex;
            justify-content: center;
            margin: 20px auto;
        }

        .instructions {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: #edf2f7;
            border-radius: 8px;
            color: #2d3748;
        }

        .instruction-item {
            display: inline-block;
            margin: 0 15px;
        }

        .key {
            display: inline-block;
            padding: 4px 8px;
            background: white;
            border: 2px solid #cbd5e0;
            border-radius: 4px;
            font-weight: 600;
            color: #4a5568;
            margin: 0 5px;
        }

        .success-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .success-message.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .success-title {
            font-size: 2.5em;
            color: #48bb78;
            margin-bottom: 15px;
        }

        .success-text {
            font-size: 1.2em;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .success-time {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎯 Nonogram Puzzle</h1>
            <div class="subtitle">Reveal the hidden picture by solving the number clues!</div>
        </div>

        <div class="controls">
            <button onclick="newPuzzle()">🎲 New Puzzle</button>
            <button onclick="clearGrid()">🔄 Clear Grid</button>
            <button onclick="checkSolution()">✓ Check Solution</button>
            <button onclick="showHint()">💡 Hint</button>
        </div>

        <div class="info-panel">
            <div class="info-item">
                <span class="info-label">Time:</span>
                <span class="info-value" id="timer">00:00</span>
            </div>
            <div class="info-item">
                <span class="info-label">Progress:</span>
                <span class="info-value" id="progress">0%</span>
            </div>
            <div class="info-item">
                <span class="info-label">Mistakes:</span>
                <span class="info-value" id="mistakes">0</span>
            </div>
        </div>

        <div id="puzzle-container"></div>

        <div class="instructions">
            <div class="instruction-item">
                <span class="key">Left Click</span> Fill cell
            </div>
            <div class="instruction-item">
                <span class="key">Right Click</span> Mark with X
            </div>
            <div class="instruction-item">
                <span class="key">Shift + Click</span> Toggle X mark
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    
    <div class="success-message" id="successMessage">
        <div class="success-title">🎉 Puzzle Solved!</div>
        <div class="success-text">Congratulations! You revealed the hidden picture!</div>
        <div class="success-time" id="finalTime">Time: 00:00</div>
        <button onclick="newPuzzle()" style="margin-top: 20px;">Play Again</button>
    </div>

    <script>
        // Game configuration
        const GRID_SIZE = 20;
        const CELL_SIZE = 25;
        const CLUE_AREA_WIDTH = 150;
        const CLUE_AREA_HEIGHT = 150;
        
        // Game state
        let solution = [];
        let userGrid = [];
        let rowClues = [];
        let columnClues = [];
        let draw = null;
        let cells = [];
        let mistakes = 0;
        let startTime = null;
        let timerInterval = null;
        let hintsUsed = 0;

        // Predefined patterns (20x20)
        const patterns = [
            // Pattern 1: Heart
            {
                name: "Heart",
                data: [
                    "00000111001110000000",
                    "00001111111111100000",
                    "00011111111111110000",
                    "00111111111111111000",
                    "01111111111111111100",
                    "11111111111111111110",
                    "11111111111111111110",
                    "11111111111111111110",
                    "11111111111111111110",
                    "11111111111111111110",
                    "11111111111111111110",
                    "01111111111111111100",
                    "00111111111111111000",
                    "00011111111111110000",
                    "00001111111111100000",
                    "00000111111110000000",
                    "00000011111100000000",
                    "00000001111000000000",
                    "00000000110000000000",
                    "00000000000000000000"
                ]
            },
            // Pattern 2: Smiley Face
            {
                name: "Smiley",
                data: [
                    "00000001111100000000",
                    "00000111111111000000",
                    "00001111111111100000",
                    "00011111111111110000",
                    "00111111111111111000",
                    "00111111111111111000",
                    "01111001111001111100",
                    "01111001111001111100",
                    "01111001111001111100",
                    "01111111111111111100",
                    "01111111111111111100",
                    "01111111111111111100",
                    "01111100000001111100",
                    "00111110000011111000",
                    "00111111111111111000",
                    "00011111111111110000",
                    "00001111111111100000",
                    "00000111111111000000",
                    "00000001111100000000",
                    "00000000000000000000"
                ]
            },
            // Pattern 3: Star
            {
                name: "Star",
                data: [
                    "00000000001000000000",
                    "00000000011100000000",
                    "00000000011100000000",
                    "00000000111110000000",
                    "00000001111111000000",
                    "00000001111111000000",
                    "00111111111111111100",
                    "00011111111111111000",
                    "00001111111111110000",
                    "00000111111111100000",
                    "00000111111111100000",
                    "00001111111111110000",
                    "00001111111111110000",
                    "00011111111111111000",
                    "00011111001001111000",
                    "00111110000000111100",
                    "00111100000000011100",
                    "01111000000000001110",
                    "01110000000000000110",
                    "00000000000000000000"
                ]
            }
        ];

        // Initialize the game
        function init() {
            initializeGrid();
            selectRandomPattern();
            calculateClues();
            drawPuzzle();
            startTimer();
        }

        // Initialize empty grids
        function initializeGrid() {
            userGrid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            cells = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(null));
        }

        // Select a random pattern
        function selectRandomPattern() {
            const pattern = patterns[Math.floor(Math.random() * patterns.length)];
            solution = pattern.data.map(row => 
                row.split('').map(cell => parseInt(cell))
            );
        }

        // Calculate row and column clues from solution
        function calculateClues() {
            // Calculate row clues
            rowClues = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                const clue = [];
                let count = 0;
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (solution[row][col] === 1) {
                        count++;
                    } else if (count > 0) {
                        clue.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clue.push(count);
                rowClues.push(clue.length > 0 ? clue : [0]);
            }

            // Calculate column clues
            columnClues = [];
            for (let col = 0; col < GRID_SIZE; col++) {
                const clue = [];
                let count = 0;
                for (let row = 0; row < GRID_SIZE; row++) {
                    if (solution[row][col] === 1) {
                        count++;
                    } else if (count > 0) {
                        clue.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clue.push(count);
                columnClues.push(clue.length > 0 ? clue : [0]);
            }
        }

        // Draw the puzzle using SVG.js
        function drawPuzzle() {
            const container = document.getElementById('puzzle-container');
            container.innerHTML = '';
            
            // Calculate total size
            const totalWidth = CLUE_AREA_WIDTH + GRID_SIZE * CELL_SIZE + 40;
            const totalHeight = CLUE_AREA_HEIGHT + GRID_SIZE * CELL_SIZE + 40;
            
            // Create SVG drawing area
            draw = SVG().addTo(container).size(totalWidth, totalHeight);
            
            // Draw background
            draw.rect(totalWidth, totalHeight).fill('#f7fafc');
            
            // Draw column clues
            for (let col = 0; col < GRID_SIZE; col++) {
                const x = CLUE_AREA_WIDTH + col * CELL_SIZE + CELL_SIZE / 2;
                let y = CLUE_AREA_HEIGHT - 10;
                
                for (let i = columnClues[col].length - 1; i >= 0; i--) {
                    const clue = columnClues[col][i];
                    if (clue !== 0) {
                        draw.text(clue.toString())
                            .font({ size: 14, family: 'Arial', weight: 'bold' })
                            .fill('#2d3748')
                            .center(x, y);
                        y -= 20;
                    }
                }
            }
            
            // Draw row clues
            for (let row = 0; row < GRID_SIZE; row++) {
                const y = CLUE_AREA_HEIGHT + row * CELL_SIZE + CELL_SIZE / 2;
                let x = CLUE_AREA_WIDTH - 10;
                
                for (let i = rowClues[row].length - 1; i >= 0; i--) {
                    const clue = rowClues[row][i];
                    if (clue !== 0) {
                        draw.text(clue.toString())
                            .font({ size: 14, family: 'Arial', weight: 'bold' })
                            .fill('#2d3748')
                            .center(x, y);
                        x -= 25;
                    }
                }
            }
            
            // Draw grid
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const x = CLUE_AREA_WIDTH + col * CELL_SIZE;
                    const y = CLUE_AREA_HEIGHT + row * CELL_SIZE;
                    
                    // Create cell group
                    const cellGroup = draw.group();
                    
                    // Draw cell background
                    const rect = cellGroup.rect(CELL_SIZE, CELL_SIZE)
                        .fill('white')
                        .stroke({ width: 1, color: '#cbd5e0' })
                        .move(x, y);
                    
                    // Add thicker borders every 5 cells
                    if (col % 5 === 0 && col !== 0) {
                        draw.line(x, CLUE_AREA_HEIGHT, x, CLUE_AREA_HEIGHT + GRID_SIZE * CELL_SIZE)
                            .stroke({ width: 2, color: '#718096' });
                    }
                    if (row % 5 === 0 && row !== 0) {
                        draw.line(CLUE_AREA_WIDTH, y, CLUE_AREA_WIDTH + GRID_SIZE * CELL_SIZE, y)
                            .stroke({ width: 2, color: '#718096' });
                    }
                    
                    // Store cell reference
                    cells[row][col] = {
                        rect: rect,
                        group: cellGroup,
                        filled: false,
                        marked: false,
                        x: x,
                        y: y
                    };
                    
                    // Add click handlers
                    rect.on('click', function(e) {
                        handleCellClick(row, col, e);
                    });
                    
                    rect.on('contextmenu', function(e) {
                        e.preventDefault();
                        handleRightClick(row, col);
                    });
                    
                    // Add hover effect
                    rect.on('mouseenter', function() {
                        if (!cells[row][col].filled && !cells[row][col].marked) {
                            this.fill('#edf2f7');
                        }
                    });
                    
                    rect.on('mouseleave', function() {
                        if (!cells[row][col].filled && !cells[row][col].marked) {
                            this.fill('white');
                        }
                    });
                }
            }
            
            // Draw outer border
            draw.rect(GRID_SIZE * CELL_SIZE, GRID_SIZE * CELL_SIZE)
                .fill('none')
                .stroke({ width: 3, color: '#4a5568' })
                .move(CLUE_AREA_WIDTH, CLUE_AREA_HEIGHT);
        }

        // Handle left click
        function handleCellClick(row, col, event) {
            if (event.shiftKey) {
                // Shift+Click toggles X mark
                handleRightClick(row, col);
                return;
            }
            
            const cell = cells[row][col];
            
            if (cell.marked) {
                // Remove X mark
                if (cell.xMark) {
                    cell.xMark.remove();
                    cell.xMark = null;
                }
                cell.marked = false;
                cell.rect.fill('white');
            } else if (!cell.filled) {
                // Fill the cell
                cell.filled = true;
                cell.rect.fill('#667eea');
                userGrid[row][col] = 1;
                
                // Animate fill
                cell.rect.animate(200).scale(0.9).animate(200).scale(1);
                
                // Check if this was a mistake
                if (solution[row][col] !== 1) {
                    mistakes++;
                    updateMistakes();
                    
                    // Flash red for mistake
                    cell.rect.animate(100).fill('#ef4444').animate(400).fill('#667eea');
                }
            } else {
                // Unfill the cell
                cell.filled = false;
                cell.rect.fill('white');
                userGrid[row][col] = 0;
            }
            
            updateProgress();
            checkWinCondition();
        }

        // Handle right click
        function handleRightClick(row, col) {
            const cell = cells[row][col];
            
            if (cell.filled) {
                // Unfill first
                cell.filled = false;
                cell.rect.fill('white');
                userGrid[row][col] = 0;
            }
            
            if (cell.marked) {
                // Remove X mark
                if (cell.xMark) {
                    cell.xMark.remove();
                    cell.xMark = null;
                }
                cell.marked = false;
                cell.rect.fill('white');
            } else {
                // Add X mark
                cell.marked = true;
                cell.rect.fill('#fed7d7');
                
                // Draw X
                const x = cell.x + CELL_SIZE / 2;
                const y = cell.y + CELL_SIZE / 2;
                const size = CELL_SIZE * 0.3;
                
                cell.xMark = cell.group.group();
                cell.xMark.line(x - size, y - size, x + size, y + size)
                    .stroke({ width: 3, color: '#ef4444', linecap: 'round' });
                cell.xMark.line(x - size, y + size, x + size, y - size)
                    .stroke({ width: 3, color: '#ef4444', linecap: 'round' });
            }
        }

        // Clear the grid
        function clearGrid() {
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const cell = cells[row][col];
                    
                    if (cell.filled || cell.marked) {
                        cell.filled = false;
                        cell.marked = false;
                        cell.rect.fill('white');
                        userGrid[row][col] = 0;
                        
                        if (cell.xMark) {
                            cell.xMark.remove();
                            cell.xMark = null;
                        }
                    }
                }
            }
            
            updateProgress();
        }

        // Check the solution
        function checkSolution() {
            let correct = true;
            let animationDelay = 0;
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    const cell = cells[row][col];
                    const shouldBeFilled = solution[row][col] === 1;
                    const isFilled = cell.filled;
                    
                    if (shouldBeFilled !== isFilled) {
                        correct = false;
                        
                        // Highlight incorrect cells
                        setTimeout(() => {
                            if (shouldBeFilled) {
                                // Should be filled but isn't
                                cell.rect.animate(200).fill('#fbbf24').animate(400).fill('white');
                            } else {
                                // Shouldn't be filled but is
                                cell.rect.animate(200).fill('#ef4444').animate(400).fill('#667eea');
                            }
                        }, animationDelay);
                        
                        animationDelay += 20;
                    }
                }
            }
            
            if (correct) {
                showSuccess();
            } else {
                // Show message
                setTimeout(() => {
                    alert('Not quite right! Keep trying! 💪');
                }, animationDelay + 500);
            }
        }

        // Check if puzzle is solved
        function checkWinCondition() {
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if ((solution[row][col] === 1) !== cells[row][col].filled) {
                        return false;
                    }
                }
            }
            
            showSuccess();
            return true;
        }

        // Show success message
        function showSuccess() {
            stopTimer();
            
            // Animate all filled cells
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (cells[row][col].filled) {
                        const delay = (row + col) * 20;
                        setTimeout(() => {
                            cells[row][col].rect
                                .animate(300)
                                .fill('#48bb78')
                                .scale(1.1)
                                .animate(300)
                                .scale(1);
                        }, delay);
                    }
                }
            }
            
            // Show success message
            setTimeout(() => {
                document.getElementById('overlay').classList.add('show');
                document.getElementById('successMessage').classList.add('show');
                document.getElementById('finalTime').textContent = `Time: ${document.getElementById('timer').textContent}`;
            }, 1000);
        }

        // Show a hint
        function showHint() {
            hintsUsed++;
            
            // Find an empty cell that should be filled
            const emptyCells = [];
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (solution[row][col] === 1 && !cells[row][col].filled) {
                        emptyCells.push({ row, col });
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const hint = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const cell = cells[hint.row][hint.col];
                
                // Animate hint
                cell.rect.animate(200).fill('#fbbf24')
                    .animate(200).fill('#667eea')
                    .animate(200).fill('#fbbf24')
                    .animate(200).fill('white');
            }
        }

        // Update progress
        function updateProgress() {
            let correctFilled = 0;
            let totalToFill = 0;
            
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    if (solution[row][col] === 1) {
                        totalToFill++;
                        if (cells[row][col].filled) {
                            correctFilled++;
                        }
                    }
                }
            }
            
            const progress = Math.round((correctFilled / totalToFill) * 100);
            document.getElementById('progress').textContent = progress + '%';
        }

        // Update mistakes counter
        function updateMistakes() {
            document.getElementById('mistakes').textContent = mistakes;
        }

        // Timer functions
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }

        // Start a new puzzle
        function newPuzzle() {
            stopTimer();
            mistakes = 0;
            hintsUsed = 0;
            updateMistakes();
            
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
            
            initializeGrid();
            selectRandomPattern();
            calculateClues();
            drawPuzzle();
            startTimer();
            updateProgress();
        }

        // Initialize the game when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
