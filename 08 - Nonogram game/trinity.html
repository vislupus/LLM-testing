<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nonogram Puzzle Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.0.4/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #game-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5rem;
        }

        .instructions {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        #svg-canvas {
            border: 2px solid #bdc3c7;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background: white;
            cursor: default;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        #check-btn {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
        }

        #check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(46, 204, 113, 0.3);
        }

        #solve-btn {
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
        }

        #solve-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }

        #new-game-btn {
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
        }

        #new-game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(243, 156, 18, 0.3);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: fadeIn 0.3s;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
        }

        .filled { background-color: #3498db; }
        .marked { background-color: #e74c3c; }
        .empty { background-color: #ecf0f1; border: 1px solid #bdc3c7; }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .instructions { font-size: 1rem; }
            button { padding: 10px 18px; font-size: 14px; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Nonogram Puzzle</h1>
        <p class="instructions">
            Fill cells (left-click) to reveal the hidden picture. Numbers on the sides show consecutive filled cells in that row/column.
            Mark empty cells (right-click or hold Space) with an X.
        </p>
        
        <svg id="svg-canvas" width="600" height="600"></svg>
        
        <div class="controls">
            <button id="check-btn">Check Solution</button>
            <button id="solve-btn">Show Solution</button>
            <button id="new-game-btn">New Puzzle</button>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="color-box filled"></div>
                <span>Filled cell</span>
            </div>
            <div class="legend-item">
                <div class="color-box marked"></div>
                <span>Marked empty</span>
            </div>
            <div class="legend-item">
                <div class="color-box empty"></div>
                <span>Empty/Unknown</span>
            </div>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <script>
        // ========== GAME CONFIGURATION ==========
        const GRID_SIZE = 20;
        const CELL_SIZE = 25;
        const PUZZLE_SEED = "nonogram"; // For reproducible random puzzles
        
        // ========== GAME STATE ==========
        let svg, width, height;
        let grid = [];           // Current player grid: 0=unknown, 1=filled, -1=marked
        let solution = [];       // Solution grid: 1=filled, 0=empty
        let rowClues = [];       // Array of arrays for row clues
        let colClues = [];       // Array of arrays for column clues
        let cellRects = [];      // 2D array of cell rectangle elements
        let isMouseDown = false;
        let isMarking = false;   // False for fill, true for mark
        
        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize SVG
            svg = SVG('svg-canvas');
            width = parseInt(svg.attr('width'));
            height = parseInt(svg.attr('height'));
            
            // Set up random number generator with seed
            randomSeed(PUZZLE_SEED);
            
            // Generate new puzzle
            generatePuzzle();
            
            // Draw everything
            drawGrid();
            drawClues();
            drawCells();
            
            // Set up event listeners
            setupEventListeners();
        });
        
        // ========== RANDOM NUMBER GENERATOR ==========
        let seed = 0;
        function randomSeed(str) {
            seed = 0;
            for (let i = 0; i < str.length; i++) {
                seed = seed * 31 + str.charCodeAt(i);
                seed = seed % 4294967296;
            }
        }
        
        function random() {
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }
        
        // ========== PUZZLE GENERATION ==========
        function generatePuzzle() {
            // Initialize grids
            grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            solution = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            
            // Generate random solution (simple pattern)
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Create a simple symmetric pattern
                    const val = Math.random() < 0.4 ? 1 : 0; // 40% chance of being filled
                    solution[y][x] = val;
                }
            }
            
            // Calculate row clues
            rowClues = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                const clues = [];
                let count = 0;
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (solution[y][x] === 1) {
                        count++;
                    } else if (count > 0) {
                        clues.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clues.push(count);
                if (clues.length === 0) clues.push(0);
                rowClues.push(clues);
            }
            
            // Calculate column clues
            colClues = [];
            for (let x = 0; x < GRID_SIZE; x++) {
                const clues = [];
                let count = 0;
                for (let y = 0; y < GRID_SIZE; y++) {
                    if (solution[y][x] === 1) {
                        count++;
                    } else if (count > 0) {
                        clues.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clues.push(count);
                if (clues.length === 0) clues.push(0);
                colClues.push(clues);
            }
        }
        
        // ========== DRAWING FUNCTIONS ==========
        function drawGrid() {
            // Clear existing grid
            svg.select('.grid-line').forEach(line => line.remove());
            svg.select('.cell').forEach(cell => cell.remove());
            
            // Draw vertical grid lines
            for (let x = 0; x <= GRID_SIZE; x++) {
                const line = svg.line(x * CELL_SIZE + 50, 50, x * CELL_SIZE + 50, GRID_SIZE * CELL_SIZE + 50)
                    .stroke({ width: 1, color: '#bdc3c7' })
                    .attr('class', 'grid-line');
            }
            
            // Draw horizontal grid lines
            for (let y = 0; y <= GRID_SIZE; y++) {
                const line = svg.line(50, y * CELL_SIZE + 50, GRID_SIZE * CELL_SIZE + 50, y * CELL_SIZE + 50)
                    .stroke({ width: 1, color: '#bdc3c7' })
                    .attr('class', 'grid-line');
            }
        }
        
        function drawClues() {
            // Clear existing clues
            svg.select('.clue').forEach(clue => clue.remove());
            
            const fontSize = 14;
            const fontFamily = 'Segoe UI, sans-serif';
            
            // Draw row clues (top)
            for (let y = 0; y < GRID_SIZE; y++) {
                const clues = rowClues[y];
                let x = 50 + GRID_SIZE * CELL_SIZE + 5;
                let yPos = 50 + y * CELL_SIZE + CELL_SIZE/2 + fontSize/2;
                
                clues.forEach((clue, index) => {
                    const text = svg.text(String(clue))
                        .attr({
                            class: 'clue',
                            fill: '#2c3e50',
                            'font-size': fontSize,
                            'font-family': fontFamily,
                            'text-anchor': 'start'
                        })
                        .move(x, yPos);
                    x += 15; // Space between clue numbers
                });
            }
            
            // Draw column clues (left)
            for (let x = 0; x < GRID_SIZE; x++) {
                const clues = colClues[x];
                let y = 50 + GRID_SIZE * CELL_SIZE + 5;
                let xPos = 50 + x * CELL_SIZE + CELL_SIZE/2 - 5;
                
                clues.forEach((clue, index) => {
                    const text = svg.text(String(clue))
                        .attr({
                            class: 'clue',
                            fill: '#2c3e50',
                            'font-size': fontSize,
                            'font-family': fontFamily,
                            'text-anchor': 'end'
                        })
                        .move(xPos, y);
                    y += 15; // Space between clue numbers
                });
            }
        }
        
        function drawCells() {
            // Clear existing cells
            cellRects = [];
            svg.select('.cell').forEach(cell => cell.remove());
            
            for (let y = 0; y < GRID_SIZE; y++) {
                cellRects[y] = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = svg.rect(CELL_SIZE - 1, CELL_SIZE - 1)
                        .move(50 + x * CELL_SIZE, 50 + y * CELL_SIZE)
                        .attr({
                            class: 'cell',
                            fill: '#ecf0f1',
                            stroke: '#bdc3c7',
                            'stroke-width': 1
                        });
                    
                    // Store reference
                    cellRects[y][x] = cell;
                    
                    // Add event listeners
                    cell.on('mousedown', () => handleCellClick(x, y));
                    cell.on('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(x, y);
                    });
                }
            }
        }
        
        // ========== CELL INTERACTION ==========
        function handleCellClick(x, y) {
            if (!isMouseDown) return;
            
            // Toggle between filled and unknown
            if (grid[y][x] === 1) {
                grid[y][x] = 0; // Back to unknown
                cellRects[y][x].attr('fill', '#ecf0f1');
            } else {
                grid[y][x] = 1; // Filled
                cellRects[y][x].attr('fill', '#3498db');
            }
            
            checkCompletion();
        }
        
        function handleCellRightClick(x, y) {
            // Toggle between marked and unknown
            if (grid[y][x] === -1) {
                grid[y][x] = 0; // Back to unknown
                cellRects[y][x].attr('fill', '#ecf0f1');
            } else {
                grid[y][x] = -1; // Marked
                cellRects[y][x].attr('fill', '#e74c3c');
            }
            
            checkCompletion();
        }
        
        function setupEventListeners() {
            // Mouse down/up for drag filling
            document.addEventListener('mousedown', () => isMouseDown = true);
            document.addEventListener('mouseup', () => isMouseDown = false);
            
            // Spacebar to toggle marking mode
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space') {
                    e.preventDefault();
                    isMarking = !isMarking;
                }
            });
            
            // Button events
            document.getElementById('check-btn').addEventListener('click', checkSolution);
            document.getElementById('solve-btn').addEventListener('click', showSolution);
            document.getElementById('new-game-btn').addEventListener('click', newGame);
        }
        
        // ========== GAME LOGIC ==========
        function checkSolution() {
            let correct = true;
            
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    // For a correct solution, filled cells must match
                    if (solution[y][x] === 1 && grid[y][x] !== 1) {
                        correct = false;
                        break;
                    }
                    // Marked cells must correspond to empty cells in solution
                    if (grid[y][x] === -1 && solution[y][x] !== 0) {
                        correct = false;
                        break;
                    }
                }
                if (!correct) break;
            }
            
            if (correct) {
                showMessage("Congratulations! You solved the puzzle!", "success");
                highlightCorrectCells();
            } else {
                showMessage("Not quite right. Keep trying!", "error");
            }
        }
        
        function checkCompletion() {
            // Optional: check if all cells are filled/marked
            let allFilledOrMarked = true;
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (grid[y][x] === 0) {
                        allFilledOrMarked = false;
                        break;
                    }
                }
                if (!allFilledOrMarked) break;
            }
            
            if (allFilledOrMarked) {
                setTimeout(checkSolution, 300);
            }
        }
        
        function showSolution() {
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (solution[y][x] === 1) {
                        grid[y][x] = 1;
                        cellRects[y][x].attr('fill', '#3498db');
                    } else {
                        grid[y][x] = -1;
                        cellRects[y][x].attr('fill', '#e74c3c');
                    }
                }
            }
            showMessage("Solution revealed. Try to solve it yourself next time!", "system");
        }
        
        function newGame() {
            // Clear messages
            document.getElementById('message').style.display = 'none';
            
            // Generate new puzzle with different seed
            randomSeed(PUZZLE_SEED + Date.now());
            generatePuzzle();
            
            // Reset grid
            grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
            
            // Redraw
            drawGrid();
            drawClues();
            drawCells();
        }
        
        function highlightCorrectCells() {
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (solution[y][x] === 1 && grid[y][x] === 1) {
                        cellRects[y][x].animate(500, '<>').attr('fill', '#2ecc71');
                    }
                }
            }
        }
        
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';
            
            // Auto-hide error messages after 3 seconds
            if (type === 'error') {
                setTimeout(() => {
                    messageEl.style.display = 'none';
                }, 3000);
            }
        }
    </script>
</body>
</html>
