<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Picross : Heart Shape Nonogram</title>
    <style>
        :root {
            --bg: #f3f0e8;
            --panel-bg: #ffffff;
            --text: #2c2416;
            --grid-line: #b0a89a;
            --clue-color: #4d4335;
            --fill-color: #222;
            --mark-color: #777;
            --accent: #c0553b;
            --success-bg: rgba(0, 0, 0, 0.7);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding: 10px;
        }
        #game-container {
            position: relative;
            display: inline-block;
            background: var(--panel-bg);
            border-radius: 18px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0,0,0,0.05);
            padding: 20px 20px 16px;
        }
        #reset-btn {
            display: block;
            margin: 12px auto 0;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.04em;
            border: 2px solid #aaa;
            border-radius: 30px;
            background: #fff;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        #reset-btn:hover {
            background: #f0f0f0;
            border-color: var(--accent);
            color: var(--accent);
        }
        #success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--success-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 10;
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        #success-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        #success-overlay p {
            margin-bottom: 14px;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        #success-overlay button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.04em;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: var(--accent);
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        #success-overlay button:hover {
            background: #f0d0c0;
            transform: scale(1.04);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="svg-container"></div>
        <button id="reset-btn">🔄 Reset Puzzle</button>
        <div id="success-overlay">
            <p>✨ Puzzle Solved! ✨</p>
            <button id="play-again-btn">Play Again</button>
        </div>
    </div>

    <!-- svg.js library -->
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.1.1/dist/svg.min.js"></script>
    <script>
        (function() {
            // ──────────────────────────────────────
            // CONSTANTS
            // ──────────────────────────────────────
            const COLS = 20;
            const ROWS = 20;
            const CELL_SIZE = 25;
            const CLUE_WIDTH = 110; // for row clues (left side)
            const CLUE_HEIGHT = 80; // for column clues (top)
            const PADDING = 12;
            const GRID_X = CLUE_WIDTH + PADDING;
            const GRID_Y = CLUE_HEIGHT + PADDING;
            const SVG_WIDTH = GRID_X + COLS * CELL_SIZE + PADDING;
            const SVG_HEIGHT = GRID_Y + ROWS * CELL_SIZE + PADDING;

            // ──────────────────────────────────────
            // HEART PATTERN GENERATOR
            // ──────────────────────────────────────
            function createHeartPattern() {
                const pattern = Array(ROWS).fill().map(() => Array(COLS).fill(0));
                // Heart equation: (x^2 + y^2 - 1)^3 - x^2 * y^3 <= 0
                // Center at (9.5, 14) and scale to fit 20x20 nicely.
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        // Map grid to coordinate system: x ∈ [-1.3, 1.3], y ∈ [-1.2, 1.2]
                        const x = (c - 9.5) / 7.2;
                        const y = (14.0 - r) / 7.2; // flip so heart points up (cleft at top)
                        const val = Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y;
                        // Small tolerance to make edges a bit smoother
                        if (val <= 0.08) {
                            pattern[r][c] = 1;
                        }
                    }
                }
                return pattern;
            }

            // ──────────────────────────────────────
            // COMPUTE CLUES FOR A LINE (ROW OR COL)
            // ──────────────────────────────────────
            function computeClue(lineArray) {
                const clue = [];
                let count = 0;
                for (let i = 0; i < lineArray.length; i++) {
                    if (lineArray[i] === 1) {
                        count++;
                    } else {
                        if (count > 0) clue.push(count);
                        count = 0;
                    }
                }
                if (count > 0) clue.push(count);
                if (clue.length === 0) clue.push(0); // empty line
                return clue;
            }

            // ──────────────────────────────────────
            // GLOBAL STATE
            // ──────────────────────────────────────
            const pattern = createHeartPattern();
            const rowClues = [];
            const colClues = [];
            for (let r = 0; r < ROWS; r++) rowClues.push(computeClue(pattern[r]));
            for (let c = 0; c < COLS; c++) {
                const colVals = [];
                for (let r = 0; r < ROWS; r++) colVals.push(pattern[r][c]);
                colClues.push(computeClue(colVals));
            }

            // Player solution state: 0 = empty, 1 = filled, 2 = marked (X)
            const state = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            let puzzleSolved = false;

            // ──────────────────────────────────────
            // SVG.JS DRAWING SETUP
            // ──────────────────────────────────────
            const draw = SVG().addTo('#svg-container').size(SVG_WIDTH, SVG_HEIGHT);
            // White background for entire SVG
            draw.rect(SVG_WIDTH, SVG_HEIGHT).fill('#fff');

            // ──────────────────────────────────────
            // GRID CELL ELEMENTS (fills & marks)
            // ──────────────────────────────────────
            const fills = [];
            const marks = [];
            for (let r = 0; r < ROWS; r++) {
                fills[r] = [];
                marks[r] = [];
                for (let c = 0; c < COLS; c++) {
                    const x = GRID_X + c * CELL_SIZE;
                    const y = GRID_Y + r * CELL_SIZE;

                    // Fill rectangle (black when visible)
                    const fillRect = draw.rect(CELL_SIZE - 1, CELL_SIZE - 1)
                        .move(x + 0.5, y + 0.5)
                        .fill('#222')
                        .hide();
                    fills[r][c] = fillRect;

                    // Mark group (X) – two diagonal lines
                    const markGroup = draw.group();
                    const line1 = draw.line(0, 0, CELL_SIZE - 2, CELL_SIZE - 2)
                        .stroke({ width: 2.5, color: '#777', linecap: 'round' })
                        .move(x + 1, y + 1);
                    const line2 = draw.line(CELL_SIZE - 2, 0, 0, CELL_SIZE - 2)
                        .stroke({ width: 2.5, color: '#777', linecap: 'round' })
                        .move(x + 1, y + 1);
                    markGroup.add(line1);
                    markGroup.add(line2);
                    markGroup.hide();
                    marks[r][c] = markGroup;
                }
            }

            // ──────────────────────────────────────
            // GRID LINES
            // ──────────────────────────────────────
            const gridGroup = draw.group();
            for (let r = 0; r <= ROWS; r++) {
                gridGroup.line(
                    GRID_X, GRID_Y + r * CELL_SIZE,
                    GRID_X + COLS * CELL_SIZE, GRID_Y + r * CELL_SIZE
                ).stroke({ width: 1, color: '#b0a89a' });
            }
            for (let c = 0; c <= COLS; c++) {
                gridGroup.line(
                    GRID_X + c * CELL_SIZE, GRID_Y,
                    GRID_X + c * CELL_SIZE, GRID_Y + ROWS * CELL_SIZE
                ).stroke({ width: 1, color: '#b0a89a' });
            }

            // ──────────────────────────────────────
            // ROW CLUES (left side)
            // ──────────────────────────────────────
            const rowClueGroup = draw.group();
            for (let r = 0; r < ROWS; r++) {
                const clue = rowClues[r];
                const baseY = GRID_Y + r * CELL_SIZE + CELL_SIZE / 2;
                // Draw numbers right-aligned, with gap of 18px per digit
                const rightEdge = GRID_X - 8;
                for (let i = clue.length - 1; i >= 0; i--) {
                    const digit = clue[i].toString();
                    const xPos = rightEdge - (clue.length - 1 - i) * 20;
                    rowClueGroup.text(digit)
                        .font({ family: 'monospace', size: 14, weight: 'bold', anchor: 'end' })
                        .fill('#4d4335')
                        .move(xPos, baseY - 7);
                }
            }

            // ──────────────────────────────────────
            // COLUMN CLUES (top)
            // ──────────────────────────────────────
            const colClueGroup = draw.group();
            // Find max number of clue lines per column
            let maxClueCount = 0;
            for (let c = 0; c < COLS; c++) {
                maxClueCount = Math.max(maxClueCount, colClues[c].length);
            }
            const clueLineHeight = 16;
            for (let c = 0; c < COLS; c++) {
                const clue = colClues[c];
                const baseX = GRID_X + c * CELL_SIZE + CELL_SIZE / 2;
                const bottomY = GRID_Y - 6;
                // Draw from bottom up
                for (let i = 0; i < clue.length; i++) {
                    const digit = clue[i].toString();
                    const yPos = bottomY - (clue.length - 1 - i) * clueLineHeight;
                    colClueGroup.text(digit)
                        .font({ family: 'monospace', size: 14, weight: 'bold', anchor: 'middle' })
                        .fill('#4d4335')
                        .move(baseX - 7, yPos - 7);
                }
            }

            // ──────────────────────────────────────
            // SOLUTION CHECKER
            // ──────────────────────────────────────
            function checkSolution() {
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const filled = state[r][c] === 1;
                        const shouldFill = pattern[r][c] === 1;
                        if (filled !== shouldFill) return false;
                    }
                }
                return true;
            }

            function showSuccess() {
                if (puzzleSolved) return;
                puzzleSolved = true;
                document.getElementById('success-overlay').classList.add('active');
            }

            function hideSuccess() {
                document.getElementById('success-overlay').classList.remove('active');
                puzzleSolved = false;
            }

            // ──────────────────────────────────────
            // CELL UPDATE
            // ──────────────────────────────────────
            function updateCellVisuals(r, c) {
                const fill = fills[r][c];
                const mark = marks[r][c];
                const s = state[r][c];
                if (s === 1) {
                    fill.show();
                    mark.hide();
                } else if (s === 2) {
                    fill.hide();
                    mark.show();
                } else { // 0
                    fill.hide();
                    mark.hide();
                }
            }

            // ──────────────────────────────────────
            // HANDLE CLICK ON GRID
            // ──────────────────────────────────────
            function onGridClick(e) {
                if (puzzleSolved) return;
                const rect = draw.node.getBoundingClientRect();
                const scaleX = SVG_WIDTH / rect.width;   // handle any scaling
                const scaleY = SVG_HEIGHT / rect.height;
                const mouseX = (e.clientX - rect.left) * scaleX;
                const mouseY = (e.clientY - rect.top) * scaleY;
                const col = Math.floor((mouseX - GRID_X) / CELL_SIZE);
                const row = Math.floor((mouseY - GRID_Y) / CELL_SIZE);
                if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

                e.preventDefault();
                // Left click (button 0) -> toggle fill
                if (e.button === 0) {
                    if (state[row][col] === 1) {
                        state[row][col] = 0;
                    } else {
                        state[row][col] = 1;
                    }
                }
                // Right click (button 2) -> toggle mark (X)
                else if (e.button === 2) {
                    if (state[row][col] === 2) {
                        state[row][col] = 0;
                    } else {
                        state[row][col] = 2;
                    }
                }
                updateCellVisuals(row, col);
                if (checkSolution()) showSuccess();
            }

            // Prevent context menu on right-click inside SVG
            draw.node.addEventListener('contextmenu', (e) => e.preventDefault());
            draw.node.addEventListener('mousedown', onGridClick);
            // For touch devices: treat long press as right-click? Not needed; but we can add an alternative: double-tap to mark, single tap to fill. Simpler: left-click fill, right-click mark works on desktop. For mobile we could add a mode toggle, but keep simple.
            // We'll also allow Ctrl+click as an alternative to right-click for accessibility.
            draw.node.addEventListener('click', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    // Simulate right-click
                    const fakeEvent = { button: 2, clientX: e.clientX, clientY: e.clientY, preventDefault: () => {} };
                    onGridClick(fakeEvent);
                }
            });

            // ──────────────────────────────────────
            // RESET BUTTON
            // ──────────────────────────────────────
            document.getElementById('reset-btn').addEventListener('click', () => {
                hideSuccess();
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        state[r][c] = 0;
                        updateCellVisuals(r, c);
                    }
                }
            });

            // ──────────────────────────────────────
            // PLAY AGAIN BUTTON (in overlay)
            // ──────────────────────────────────────
            document.getElementById('play-again-btn').addEventListener('click', () => {
                hideSuccess();
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        state[r][c] = 0;
                        updateCellVisuals(r, c);
                    }
                }
            });

            // ──────────────────────────────────────
            // INITIAL RENDER
            // ──────────────────────────────────────
            console.log('🧩 Picross ready! Solve the heart shape.');
            console.log('   Left click = fill cell  |  Right click = mark X');
            console.log('   Ctrl+click also marks on desktop.');
        })();
    </script>
</body>
</html>
