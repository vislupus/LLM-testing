<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 Nonogram Puzzle — Picross Game</title>
<style>
/* ── Global Reset & Page Styling ── */
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:linear-gradient(140deg,#e8eaf6 0%,#f3e5f5 40%,#fce4ec 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:16px;min-height:100vh;
}
h1{font-size:2em;color:#4a148c;margin-bottom:6px;text-shadow:1px 1px 3px rgba(0,0,0,.1)}
.sub{color:#7b1fa2;margin-bottom:10px;font-size:1.05em;text-align:center}
/* ── Toolbar ── */
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.toolbar button{
  padding:9px 18px;border:none;border-radius:10px;font-family:inherit;
  font-size:.95em;font-weight:600;cursor:pointer;transition:all .15s;
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.toolbar button:hover{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.2)}
.toolbar button:active{transform:translateY(0)}
.btn-check{background:linear-gradient(135deg,#26a69a,#00897b);color:#fff}
.btn-hint{background:linear-gradient(135deg,#ffa726,#ef6c00);color:#fff}
.btn-reset{background:linear-gradient(135deg,#ab47bc,#8e24aa);color:#fff}
/* ── Canvas ── */
#game-container{
  background:#fff;padding:10px;border-radius:14px;
  box-shadow:0 6px 24px rgba(0,0,0,.13);
  overflow-x:auto;max-width:95vw;
}
/* ── Success Overlay ── */
.success-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:100;opacity:0;pointer-events:none;transition:opacity .4s;
}
.success-overlay.show{opacity:1;pointer-events:auto}
.success-box{
  background:linear-gradient(145deg,#e8f5e9,#c8e6c9);
  padding:44px 56px;border-radius:24px;text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.35);animation:popIn .5s ease;
}
.success-box h2{color:#2e7d32;font-size:2em;margin-bottom:8px}
.success-box p{color:#388e3c;font-size:1.15em}
.success-box button{
  margin-top:18px;padding:10px 28px;background:#2e7d32;color:#fff;
  border:none;border-radius:10px;font-size:1em;font-weight:600;
  cursor:pointer;transition:background .2s;
}
.success-box button:hover{background:#1b5e20}
@keyframes popIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
/* ── Footer ── */
.hints{margin-top:10px;color:#7b1fa2;font-size:.9em;opacity:.7;text-align:center;line-height:1.6}
</style>
</head>
<body>

<h1>🧩 Nonogram Puzzle</h1>
<p class="sub">Fill the cells to reveal the hidden picture!</p>

<div class="toolbar">
  <button class="btn-check" onclick="checkSolution()">✅ Check Solution</button>
  <button class="btn-hint"  onclick="showHint()">💡 Show Hint</button>
  <button class="btn-reset" onclick="resetPuzzle()">🔄 New Puzzle</button>
</div>

<div id="game-container">
  <svg id="game-svg" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-box">
    <h2>🎉 Congratulations! 🎉</h2>
    <p>You solved the Nonogram puzzle!</p>
    <button onclick="resetPuzzle();document.getElementById('successOverlay').classList.remove('show')">Play Again</button>
  </div>
</div>

<p class="hints">🖱️ <b>Left-click</b> to fill a cell &nbsp;|&nbsp;
🖱️ <b>Right-click</b> to mark with ✕ &nbsp;|&nbsp;
Drag to paint multiple cells</p>

<!-- SVG.js 3.2 from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>

<!-- ══════════════════════════════════════════════════════════════
     🧩  NONOGRAM (PICROSS) PUZZLE GAME
     Complete single-file implementation with SVG.js
     ══════════════════════════════════════════════════════════════ -->

<script>
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CONSTANTS & CONFIGURATION
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const GRID  = 20;    // 20 × 20 cells
const CS    = 30;    // cell size in pixels
const CL    = 70;    // clue‑area width/height in pixels

// Derived positions: the grid rectangle starts after the clue margin
const GX = CL, GY = CL;                                   // grid top-left
const GW = GRID * CS, GH = GRID * CS;                     // grid pixel size
const SW = GX + GW + 14, SH = GY + GH + 14;               // total SVG size

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  COLOUR PALETTE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const C = {
  empty    : '#fafafa',    // empty cell interior
  filled   : '#5c6bc0',    // player‑filled cell
  marked   : '#eeeeee',    // cell marked with ✕
  markClr  : '#bbb',       // ✕ stroke colour
  hover    : 'rgba(92,107,192,0.13)', // hover highlight
  guide    : '#e8eaf6',    // 5×5 guide band
  border   : '#c5cae9',    // thin grid line
  thickBdr : '#7986cb',    // thick 5×5 border
  bg       : '#ffffff',    // paper background
  txt      : '#283593',    // clue number colour
  err      : '#ff5252',    // error outline
  ok       : '#00c853',    // success highlight
  hintF    : 'rgba(255,152,0,0.28)', // hint fill overlay
  hintB    : '#ff9800',    // hint border
};

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  PUZZLE PATTERN  (a heart shape, 20×20)
//  '1' = filled cell, '.' = empty cell
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

const PUZZLE_RAW = [
  '....1111....1111....',   // Row  0
  '...111111..111111...',   // Row  1
  '..1111111111111111..',   // Row  2
  '.111111111111111111.',   // Row  3
  '.111111111111111111.',   // Row  4
  '.111111111111111111.',   // Row  5
  '..1111111111111111..',   // Row  6
  '...11111111111111...',   // Row  7
  '....111111111111....',   // Row  8
  '.....1111111111.....',   // Row  9
  '......11111111......',   // Row 10
  '.......111111.......',   // Row 11
  '........1111........',   // Row 12
  '.........11.........',   // Row 13
  '..........11........',   // Row 14
  '.........1111.......',   // Row 15
  '........111111......',   // Row 16
  '.......11111111.....',   // Row 17
  '......1111111111....',   // Row 18
  '.....111111111111...',    // Row 19
];

// Convert string rows into 2-D boolean array
const PATTERN = PUZZLE_RAW.map(row => row.split('').map(c => c === '1'));

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CLUE COMPUTATION
//  Each clue = array of consecutive filled‑cell runs
//  Example: [4, 8] means four filled, gap, then eight filled
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function computeClues(pattern) {
  const rowClues = pattern.map(row => {
    const cl = []; let n = 0;
    for (const v of row) { if (v) n++; else { if (n) cl.push(n); n = 0; } }
    if (n) cl.push(n);
    return cl.length ? cl : [0];
  });

  const colClues = [];
  for (let c = 0; c < GRID; c++) {
    const col = []; for (let r = 0; r < GRID; r++) col.push(pattern[r][c]);
    const cl = []; let n = 0;
    for (const v of col) { if (v) n++; else { if (n) cl.push(n); n = 0; } }
    if (n) cl.push(n);
    colClues.push(cl.length ? cl : [0]);
  }
  return { rowClues, colClues };
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  GAME STATE
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

let draw;                       // SVG.js root drawing surface
let pattern, rowClues, colClues;
let cells        = [];          // 2-D cell state  0=empty 1=filled 2=marked
let svgCellRects = [];          // SVG.js rect refs for each cell
let hoverEl;                    // hover highlight rectangle
let rowClueEls   = [];         // SVG group refs for row clue highlight
let colClueEls   = [];         // SVG group refs for column clue highlight
let gameActive   = true;
let painting     = false;      // drag painting in progress?
let paintBtn     = -1;         // which mouse button started the drag
let paintAction  = '';         // 'fill' or 'mark' for current drag

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  BUILD THE ENTIRE SVG PUZZLE BOARD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function buildBoard() {
  const svgEl = document.getElementById('game-svg');
  svgEl.innerHTML = '';                          // clear any previous content

  draw = SVG().addTo('#game-svg').size(SW, SH);  // create SVG.js surface

  // ── Drop‑shadow filter (native SVG) ──
  const defs   = draw.node.querySelector('defs')
             || draw.node.insertBefore(
                  document.createElementNS('http://www.w3.org/2000/svg','defs'),
                  draw.node.firstChild);
  const filt   = document.createElementNS('http://www.w3.org/2000/svg','filter');
  filt.id = 'shadow';
  filt.innerHTML = '<feDropShadow dx="2" dy="3" stdDeviation="5" flood-opacity="0.1"/>';
  defs.appendChild(filt);

  // ── Paper background ──
  draw.rect(SW, SH).fill(C.bg).radius(10);
  draw.rect(GW + 6, GH + 6).move(GX - 3, GY - 3)
      .fill('none').stroke({ color: '#d1d9ff', width: 2 }).radius(8)
      .node.setAttribute('filter', 'url(#shadow)');

  // ── 5×5 guide bands ──
  for (let i = 0; i < GRID; i++) {
    for (let j = 0; j < GRID; j++) {
      if ((Math.floor(i / 5) + Math.floor(j / 5)) % 2 === 0)
        draw.rect(CS, CS).move(GX + j * CS, GY + i * CS).fill(C.guide);
    }
  }

  // ── Thin cell grid lines ──
  for (let r = 0; r <= GRID; r++)
    draw.line(GX, GY + r * CS, GX + GW, GY + r * CS)
        .stroke({ color: C.border, width: .5 });
  for (let c = 0; c <= GRID; c++)
    draw.line(GX + c * CS, GY, GX + c * CS, GY + GH)
        .stroke({ color: C.border, width: .5 });

  // ── Thick 5×5‑group borders ──
  for (let i = 0; i <= GRID; i += 5) {
    draw.line(GX, GY + i * CS, GX + GW, GY + i * CS)
        .stroke({ color: C.thickBdr, width: 2 });
    draw.line(GX + i * CS, GY, GX + i * CS, GY + GH)
        .stroke({ color: C.thickBdr, width: 2 });
  }

  // ── Outer border ──
  draw.rect(GW, GH).move(GX, GY)
      .fill('none').stroke({ color: '#3f51b5', width: 2.5 }).radius(2);

  // ── Row clues (left of grid) ──
  rowClueEls = [];
  for (let r = 0; r < GRID; r++) {
    const nums = rowClues[r];
    // Highlight background group
    const bgRect = draw.rect(CL - 6, CS).move(2, GY + r * CS + .5)
                        .fill(C.guide).opacity(0).radius(4);
    rowClueEls.push(bgRect);
    // Numbers, right‑aligned, spaced by 22 px
    const sx = CL - 10 - (nums.length - 1) * 22;
    nums.forEach((n, i) => {
      draw.text(String(n))
          .move(sx + i * 22, GY + r * CS + CS / 2)
          .font({ family: "'Segoe UI',system-ui,sans-serif",
                  size: n >= 10 ? 12 : 13, weight: 'bold', fill: C.txt,
                  anchor: 'start', 'dominant-baseline': 'central' });
    });
  }

  // ── Column clues (above grid) ──
  colClueEls = [];
  for (let c = 0; c < GRID; c++) {
    const nums = colClues[c];
    // Highlight background group
    const bgRect = draw.rect(CS, CL - 6).move(GX + c * CS + .5, 2)
                        .fill(C.guide).opacity(0).radius(4);
    colClueEls.push(bgRect);
    // Numbers, bottom‑aligned vertically, spaced by 16 px
    const totH = (nums.length - 1) * 16;
    const baseY = GY - 10 - totH - (CL - GY) / 2 + CL / 2;
    nums.forEach((n, i) => {
      draw.text(String(n))
          .move(GX + c * CS + CS / 2, baseY + i * 16)
          .font({ family: "'Segoe UI',system-ui,sans-serif",
                  size: n >= 10 ? 11 : 12, weight: 'bold', fill: C.txt,
                  anchor: 'middle', 'dominant-baseline': 'central' });
    });
  }

  // ── Cell rectangles (interactive layer) ──
  svgCellRects = [];
  for (let r = 0; r < GRID; r++) {
    svgCellRects[r] = [];
    for (let c = 0; c < GRID; c++) {
      const rect = draw.rect(CS - 1, CS - 1)
                        .move(GX + c * CS + .5, GY + r * CS + .5)
                        .fill(C.empty).radius(3);
      // Attach click handlers (button = 0 → left, 2 → right)
      const capturedR = r, capturedC = c;
      rect.node.addEventListener('mousedown', e => {
        e.preventDefault();
        if (!gameActive) return;
        painting = true; paintBtn = e.button;
        paintAction = applyCell(capturedR, capturedC, e.button);
      });
      rect.node.addEventListener('contextmenu', e => e.preventDefault());
      svgCellRects[r][c] = rect;
    }
  }

  // ── Hover indicator (follows mouse over grid) ──
  hoverEl = draw.rect(CS - 1, CS - 1).fill(C.hover)
                .radius(3).stroke({ color: C.filled, width: 1 })
                .opacity(0).front();

  // ── Global SVG event listeners ──
  const svgNode = draw.node;
  svgNode.addEventListener('mousemove', onMove);
  svgNode.addEventListener('mouseleave', () => hoverEl.opacity(0));
  svgNode.addEventListener('mouseup', () => { painting = false; paintBtn = -1; });
  svgNode.addEventListener('contextmenu', e => e.preventDefault());
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CELL INTERACTION LOGIC
//  Determines what action to apply & returns it
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function applyCell(r, c, btn) {
  const cur = cells[r][c];
  let action = '';

  if (btn === 0) {
    // Left click → fill (toggle: empty→fill, fill→empty)
    if (cur !== 1) { cells[r][c] = 1; action = 'fill'; }
    else           { cells[r][c] = 0; action = 'clear'; }
  } else {
    // Right click → mark with ✕ (toggle: empty→mark, mark→empty)
    if (cur !== 2) { cells[r][c] = 2; action = 'mark'; }
    else           { cells[r][c] = 0; action = 'clear'; }
  }

  renderCell(r, c);
  updateClueHighlights();
  return action;
}

// Apply the same drag action to a different cell
function applyDragAction(r, c) {
  if (paintAction === 'fill'  && cells[r][c] !== 1) { cells[r][c] = 1; renderCell(r, c); }
  if (paintAction === 'mark'  && cells[r][c] !== 2) { cells[r][c] = 2; renderCell(r, c); }
  if (paintAction === 'clear' && cells[r][c] !== 0) { cells[r][c] = 0; renderCell(r, c); }
  updateClueHighlights();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CELL RENDERING  (updates SVG fill colour)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function renderCell(r, c) {
  const el = svgCellRects[r][c];
  switch (cells[r][c]) {
    case 0:                            // empty
      el.fill(C.empty).stroke('none');
      break;
    case 1:                            // filled
      el.fill(C.filled).stroke({ color: '#3949ab', width: 1.5 });
      // Subtle entrance animation
      el.scale(.82).animate(120).scale(1);
      break;
    case 2:                            // marked with ✕
      el.fill(C.marked).stroke({ color: '#ccc', width: .5 });
      el.scale(.88).animate(100).scale(1);
      break;
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  CLUE HIGHLIGHTING
//  Row/column clues dim once all their cells are correctly filled
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function updateClueHighlights() {
  // Check each row
  for (let r = 0; r < GRID; r++) {
    const rowFilled = cells[r].map(v => v === 1);
    const clue = rowClues[r];
    const match = arraysEqual(countRuns(rowFilled), clue);
    rowClueEls[r].opacity(match ? .25 : 0);
  }
  // Check each column
  for (let c = 0; c < GRID; c++) {
    const colFilled = [];
    for (let r = 0; r < GRID; r++) colFilled.push(cells[r][c] === 1);
    const clue = colClues[c];
    const match = arraysEqual(countRuns(colFilled), clue);
    colClueEls[c].opacity(match ? .25 : 0);
  }
}

// Run-length encoding of a boolean array
function countRuns(arr) {
  const cl = []; let n = 0;
  for (const v of arr) { if (v) n++; else { if (n) cl.push(n); n = 0; } }
  if (n) cl.push(n);
  return cl.length ? cl : [0];
}

function arraysEqual(a, b) {
  if (a.length !== b.length) return false;
  return a.every((v, i) => v === b[i]);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  MOUSE / HOVER TRACKING
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function onMove(e) {
  const rect = draw.node.getBoundingClientRect();
  const mx   = (e.clientX - rect.left) * (SW / rect.width);
  const my   = (e.clientY - rect.top)  * (SH / rect.height);
  const col  = Math.floor((mx - GX) / CS);
  const row  = Math.floor((my - GY) / CS);

  if (row >= 0 && row < GRID && col >= 0 && col < GRID) {
    hoverEl.move(GX + col * CS + .5, GY + row * CS + .5).opacity(1);
    if (painting) applyDragAction(row, col);   // continue drag paint
  } else {
    hoverEl.opacity(0);
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  SOLUTION CHECK
//  Every cell must match the pattern exactly:
//    filled (1) where pattern = 1
//    empty  (0) or marked (2) where pattern = 0
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function checkSolution() {
  if (!gameActive) return;
  let errors    = 0;
  let emptyLeft = false;
  const errCells = [];

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      const s = cells[r][c];
      const need = pattern[r][c] ? 1 : 0;

      if (s === 0) {
        emptyLeft = true;
      } else if (s !== need) {
        errors++;
        errCells.push([r, c]);
      }
    }
  }

  if (errors === 0 && !emptyLeft) {
    // ── SOLVED! ──
    gameActive = false;
    winAnimation();
    setTimeout(() =>
      document.getElementById('successOverlay').classList.add('show'),
      1500
    );
  } else {
    // ── Show errors briefly in red ──
    errCells.forEach(([r, c]) => {
      const el = svgCellRects[r][c];
      el.stroke({ color: C.err, width: 3 });
      setTimeout(() => {
        if (cells[r][c] === 1) el.stroke({ color: '#3949ab', width: 1.5 });
        else                   el.stroke('none');
      }, 900);
    });
  }
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  HINT — Highlight cells that should be filled
//  but are currently empty (briefly shown)
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function showHint() {
  if (!gameActive) return;
  const hintRects = [];

  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      if (pattern[r][c] && cells[r][c] !== 1) {
        // Should be filled but isn't — show hint overlay
        const h = draw.rect(CS - 4, CS - 4)
                      .move(GX + c * CS + 2, GY + r * CS + 2)
                      .fill(C.hintF).radius(3)
                      .stroke({ color: C.hintB, width: 1.5, dasharray: '4,3' });
        hintRects.push(h);
      }
    }
  }

  // Remove hint overlays after 1.8 seconds
  setTimeout(() => hintRects.forEach(h => h.remove()), 1800);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  WIN CELEBRATION ANIMATION
//  Fill remaining cells then pulse green
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function winAnimation() {
  // Gradually fill all empty correct cells
  let delay = 0;
  for (let r = 0; r < GRID; r++) {
    for (let c = 0; c < GRID; c++) {
      if (cells[r][c] === 0 && pattern[r][c]) {
        const el = svgCellRects[r][c];
        setTimeout(() => {
          el.fill(C.ok).stroke({ color: C.ok, width: 1 }).animate(180).scale(1);
          cells[r][c] = 1;
        }, delay);
        delay += 8;
      }
    }
  }

  // After filling, pulse all correct cells green
  setTimeout(() => {
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        if (cells[r][c] === 1 && pattern[r][c]) {
          const el = svgCellRects[r][c];
          const baseColor = (r + c) % 3 === 0 ? '#00c853'
                          : (r + c) % 3 === 1 ? '#69f0ae' : '#b9f6ca';
          el.fill(baseColor).stroke({ color: '#00c853', width: 1 });
          el.animate(600, delay % 1200)
            .fill('#a5d6a7')
            .animate(600)
            .fill(baseColor)
            .loop(2, 0);
        }
      }
    }
  }, delay + 150);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RESET — Build a brand‑new puzzle
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function resetPuzzle() {
  document.getElementById('successOverlay').classList.remove('show');
  pattern  = PATTERN;
  const cl = computeClues(pattern);
  rowClues = cl.rowClues;
  colClues = cl.colClues;
  cells    = Array.from({ length: GRID }, () => Array(GRID).fill(0));
  gameActive = true;
  painting   = false;
  paintBtn   = -1;
  buildBoard();
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  LAUNCH THE GAME ON PAGE LOAD
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

window.addEventListener('load', resetPuzzle);
</script>
