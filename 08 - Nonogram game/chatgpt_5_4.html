<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idea Grid — SVG.js Nonogram</title>
  <style>
    :root {
      --bg: #f4f8ff;
      --panel: #ffffff;
      --ink: #24425c;
      --muted: #6c84a0;
      --accent: #4f8cff;
      --accent-2: #ffb84d;
      --grid: #bfd0e4;
      --grid-strong: #7e9abb;
      --fill: #355c7d;
      --mark: #d3546f;
      --success: #2f9e6d;
      --shadow: 0 12px 28px rgba(41, 72, 121, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #fefcff 0%, var(--bg) 55%, #e9f1ff 100%);
      color: var(--ink);
      min-height: 100vh;
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(125, 155, 190, 0.25);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .title {
      min-width: 260px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(1.25rem, 1.8vw, 1.7rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      appearance: none;
      border: 0;
      background: var(--panel);
      color: var(--ink);
      padding: 10px 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(54, 91, 140, 0.12);
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    button:hover { transform: translateY(-1px); box-shadow: 0 8px 16px rgba(54, 91, 140, 0.16); }
    button:active { transform: translateY(0); }
    button.active { background: var(--accent); color: white; }
    button.alt { background: #fff4dd; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #eef6ff;
      color: #30536e;
      font-weight: 700;
      min-height: 42px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(79,140,255,0.14);
    }

    .board-card {
      background: rgba(255,255,255,0.95);
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(125, 155, 190, 0.22);
      padding: 14px;
    }

    #svgHost {
      width: 100%;
      min-height: 760px;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(180deg, #fdfefe 0%, #f7fbff 100%);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0f6ff;
      border-radius: 999px;
      padding: 8px 12px;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
    }

    .swatch.fill { background: var(--fill); }
    .swatch.mark { background: var(--mark); }
    .swatch.clue { background: var(--accent-2); }

    @media (max-width: 900px) {
      #svgHost { min-height: 620px; }
      .controls { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">
        <h1>Idea Grid</h1>
        <p class="subtitle">A 20×20 nonogram drawn with SVG.js. Solve the clues to reveal a bright learning symbol.</p>
      </div>
      <div class="controls">
        <button id="fillBtn" class="active" type="button">Fill Mode</button>
        <button id="markBtn" type="button">Mark Mode</button>
        <button id="clearBtn" class="alt" type="button">Clear Board</button>
        <div class="status"><span class="status-dot"></span><span id="statusText">Left click fills. Right click makes an X.</span></div>
      </div>
    </div>

    <div class="board-card">
      <div id="svgHost"></div>
      <div class="legend">
        <div class="pill"><span class="swatch fill"></span>Filled cells are part of the picture</div>
        <div class="pill"><span class="swatch mark"></span>X marks help you remember empty cells</div>
        <div class="pill"><span class="swatch clue"></span>Numbers show blocks of consecutive filled cells</div>
      </div>
    </div>
  </div>

  <!-- Official browser build pattern from SVG.js docs -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
  <script>
    // Everything below is plain JavaScript plus SVG.js.
    (function () {
      'use strict';

      const GRID_SIZE = 20;
      const CELL = 28;
      const CLUE_FONT = 15;
      const SOLUTION = buildLightBulbPattern(GRID_SIZE);
      const ROW_CLUES = buildRowClues(SOLUTION);
      const COL_CLUES = buildColumnClues(SOLUTION);
      const MAX_ROW_CLUES = Math.max(...ROW_CLUES.map(arr => arr.length));
      const MAX_COL_CLUES = Math.max(...COL_CLUES.map(arr => arr.length));
      const LEFT_CLUE_W = 18 + MAX_ROW_CLUES * 20;
      const TOP_CLUE_H = 18 + MAX_COL_CLUES * 20;
      const GRID_X = LEFT_CLUE_W + 24;
      const GRID_Y = TOP_CLUE_H + 30;
      const GRID_PX = GRID_SIZE * CELL;
      const VIEW_W = GRID_X + GRID_PX + 36;
      const VIEW_H = GRID_Y + GRID_PX + 100;

      const COLORS = {
        bg: '#f8fbff',
        grid: '#bfd0e4',
        gridStrong: '#7e9abb',
        fill: '#355c7d',
        mark: '#d3546f',
        clue: '#24425c',
        clueMuted: '#6c84a0',
        accent: '#4f8cff',
        accent2: '#ffb84d',
        panel: '#ffffff',
        solved: '#2f9e6d'
      };

      const state = {
        tool: 'fill',
        solved: false,
        cells: Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(0)),
        visuals: Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null))
      };

      const statusText = document.getElementById('statusText');
      const fillBtn = document.getElementById('fillBtn');
      const markBtn = document.getElementById('markBtn');
      const clearBtn = document.getElementById('clearBtn');
      const host = document.getElementById('svgHost');

      const draw = SVG().addTo('#svgHost').size('100%', '100%').viewbox(0, 0, VIEW_W, VIEW_H);
      draw.css({ cursor: 'default', display: 'block' });
      host.style.aspectRatio = VIEW_W + ' / ' + VIEW_H;

      // Background panel behind the puzzle.
      draw.rect(VIEW_W, VIEW_H).fill(COLORS.bg);
      draw.rect(VIEW_W - 24, VIEW_H - 24).move(12, 12).radius(20).fill('#ffffff').stroke({ color: '#d8e3f2', width: 1.2 });

      // Header inside SVG.
      draw.text('20×20 Picross Puzzle').move(24, 20).font({ family: 'Inter, sans-serif', size: 28, weight: 800, fill: COLORS.clue });
      draw.text('Reveal the secret learning icon by matching the clue numbers.').move(24, 54).font({ family: 'Inter, sans-serif', size: 15, weight: 500, fill: COLORS.clueMuted });

      const clueBg = draw.rect(LEFT_CLUE_W + GRID_PX + 20, TOP_CLUE_H + GRID_PX + 20)
        .move(14, 86)
        .radius(18)
        .fill('#f6faff')
        .stroke({ color: '#d8e3f2', width: 1.2 });

      // Containers for clues and grid.
      const clueLayer = draw.group();
      const gridLayer = draw.group();
      const cellLayer = draw.group();
      const overlayLayer = draw.group();

      // Title labels for clue zones.
      draw.text('Column clues').move(GRID_X + 190, 102).font({ family: 'Inter, sans-serif', size: 14, weight: 700, fill: COLORS.clueMuted });
      draw.text('Row clues').move(30, GRID_Y + 12).font({ family: 'Inter, sans-serif', size: 14, weight: 700, fill: COLORS.clueMuted });

      drawClues();
      drawGrid();
      updateAllCellVisuals();

      // Success overlay is hidden until the puzzle is solved.
      const successOverlay = buildSuccessOverlay();
      successOverlay.hide();

      // Prevent the browser context menu so right-click can place an X.
      host.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      // Toolbar actions.
      fillBtn.addEventListener('click', () => setTool('fill'));
      markBtn.addEventListener('click', () => setTool('mark'));
      clearBtn.addEventListener('click', resetBoard);

      window.addEventListener('keydown', handleKeyboardModeShortcuts);

      function setTool(tool) {
        state.tool = tool;
        fillBtn.classList.toggle('active', tool === 'fill');
        markBtn.classList.toggle('active', tool === 'mark');
        statusText.textContent = tool === 'fill'
          ? 'Fill mode is on. Left click fills. Right click makes an X.'
          : 'Mark mode is on. Left click makes an X. Right click still makes an X.';
      }

      function handleKeyboardModeShortcuts(event) {
        if (event.key === 'f' || event.key === 'F') setTool('fill');
        if (event.key === 'x' || event.key === 'X' || event.key === 'm' || event.key === 'M') setTool('mark');
        if (event.key === 'r' || event.key === 'R') resetBoard();
      }

      // Draw row and column clues based on the hidden solution pattern.
      function drawClues() {
        for (let row = 0; row < GRID_SIZE; row++) {
          const clues = ROW_CLUES[row];
          clues.forEach((num, idx) => {
            const x = GRID_X - 12 - (clues.length - idx) * 20;
            const y = GRID_Y + row * CELL + CELL / 2 - 8;
            clueLayer.text(String(num))
              .move(x, y)
              .font({ family: 'Inter, sans-serif', size: CLUE_FONT, weight: 800, fill: COLORS.clue })
              .attr({ 'text-anchor': 'middle' });
          });
        }

        for (let col = 0; col < GRID_SIZE; col++) {
          const clues = COL_CLUES[col];
          clues.forEach((num, idx) => {
            const x = GRID_X + col * CELL + CELL / 2;
            const y = GRID_Y - 12 - (clues.length - idx) * 20;
            clueLayer.text(String(num))
              .move(x, y)
              .font({ family: 'Inter, sans-serif', size: CLUE_FONT, weight: 800, fill: COLORS.clue })
              .attr({ 'text-anchor': 'middle' });
          });
        }
      }

      // Create the board cells and interaction targets.
      function drawGrid() {
        // White puzzle background.
        gridLayer.rect(GRID_PX, GRID_PX)
          .move(GRID_X, GRID_Y)
          .radius(8)
          .fill('#ffffff')
          .stroke({ color: '#c9d9ec', width: 1.4 });

        // Individual cells are transparent groups with fill and mark visuals.
        for (let row = 0; row < GRID_SIZE; row++) {
          for (let col = 0; col < GRID_SIZE; col++) {
            const x = GRID_X + col * CELL;
            const y = GRID_Y + row * CELL;
            const g = cellLayer.group();

            const fillRect = g.rect(CELL - 2, CELL - 2)
              .move(x + 1, y + 1)
              .radius(6)
              .fill(COLORS.fill)
              .hide();

            const markA = g.line(x + 6, y + 6, x + CELL - 6, y + CELL - 6)
              .stroke({ color: COLORS.mark, width: 3, linecap: 'round' })
              .hide();

            const markB = g.line(x + CELL - 6, y + 6, x + 6, y + CELL - 6)
              .stroke({ color: COLORS.mark, width: 3, linecap: 'round' })
              .hide();

            const hit = g.rect(CELL, CELL)
              .move(x, y)
              .fill({ color: '#ffffff', opacity: 0.001 });

            // Each cell handles both left click and right click.
            hit.on('mousedown', function (event) {
              event.preventDefault();
              if (state.solved) return;
              if (event.button === 2) {
                setCellState(row, col, nextMarkState(state.cells[row][col]));
              } else if (event.shiftKey) {
                setCellState(row, col, nextMarkState(state.cells[row][col]));
              } else {
                setCellState(row, col, state.tool === 'fill' ? nextFillState(state.cells[row][col]) : nextMarkState(state.cells[row][col]));
              }
              checkSolved();
            });

            state.visuals[row][col] = { fillRect, markA, markB };
          }
        }

        // Grid lines are drawn over cells for a crisp puzzle look.
        for (let i = 0; i <= GRID_SIZE; i++) {
          const isMajor = i % 5 === 0;
          const stroke = { color: isMajor ? COLORS.gridStrong : COLORS.grid, width: isMajor ? 2.2 : 1 };
          gridLayer.line(GRID_X, GRID_Y + i * CELL, GRID_X + GRID_PX, GRID_Y + i * CELL).stroke(stroke);
          gridLayer.line(GRID_X + i * CELL, GRID_Y, GRID_X + i * CELL, GRID_Y + GRID_PX).stroke(stroke);
        }
      }

      function updateAllCellVisuals() {
        for (let row = 0; row < GRID_SIZE; row++) {
          for (let col = 0; col < GRID_SIZE; col++) {
            updateCellVisual(row, col);
          }
        }
      }

      function updateCellVisual(row, col) {
        const visual = state.visuals[row][col];
        const value = state.cells[row][col];
        if (!visual) return;
        if (value === 1) {
          visual.fillRect.show();
          visual.markA.hide();
          visual.markB.hide();
        } else if (value === 2) {
          visual.fillRect.hide();
          visual.markA.show();
          visual.markB.show();
        } else {
          visual.fillRect.hide();
          visual.markA.hide();
          visual.markB.hide();
        }
      }

      function setCellState(row, col, value) {
        state.cells[row][col] = value;
        updateCellVisual(row, col);
      }

      // Left-click behavior for fill mode or fill tool.
      function nextFillState(current) {
        return current === 1 ? 0 : 1;
      }

      // Right-click / mark mode behavior.
      function nextMarkState(current) {
        return current === 2 ? 0 : 2;
      }

      function resetBoard() {
        for (let row = 0; row < GRID_SIZE; row++) {
          for (let col = 0; col < GRID_SIZE; col++) {
            state.cells[row][col] = 0;
          }
        }
        state.solved = false;
        successOverlay.hide();
        updateAllCellVisuals();
        statusText.textContent = state.tool === 'fill'
          ? 'Board cleared. Left click fills. Right click makes an X.'
          : 'Board cleared. Mark mode is ready.';
      }

      // Check whether the player filled exactly the hidden solution.
      function checkSolved() {
        for (let row = 0; row < GRID_SIZE; row++) {
          for (let col = 0; col < GRID_SIZE; col++) {
            const expected = SOLUTION[row][col] ? 1 : 0;
            const actual = state.cells[row][col] === 1 ? 1 : 0;
            if (expected !== actual) {
              return false;
            }
          }
        }
        state.solved = true;
        statusText.textContent = 'Amazing! You solved the puzzle and revealed the idea bulb.';
        showSuccess();
        return true;
      }

      function buildSuccessOverlay() {
        const g = overlayLayer.group();
        g.rect(VIEW_W, VIEW_H).fill({ color: '#ffffff', opacity: 0.72 });
        const panel = g.group();
        panel.rect(420, 190)
          .move((VIEW_W - 420) / 2, (VIEW_H - 190) / 2)
          .radius(26)
          .fill('#ffffff')
          .stroke({ color: '#cfe1f3', width: 1.6 });

        // A little badge and text for the win screen.
        const cx = VIEW_W / 2;
        const top = VIEW_H / 2 - 56;
        panel.circle(72).center(cx, top).fill('#e8fff2').stroke({ color: '#9bd8b7', width: 2 });
        panel.path('M ' + (cx - 18) + ' ' + top + ' L ' + (cx - 4) + ' ' + (top + 16) + ' L ' + (cx + 22) + ' ' + (top - 16))
          .fill('none')
          .stroke({ color: COLORS.solved, width: 7, linecap: 'round', linejoin: 'round' });

        panel.text('You solved it!')
          .move(cx - 98, VIEW_H / 2 + 2)
          .font({ family: 'Inter, sans-serif', size: 28, weight: 800, fill: COLORS.clue });

        panel.text('The hidden picture is a light bulb — a symbol for ideas and learning.')
          .move(cx - 180, VIEW_H / 2 + 44)
          .font({ family: 'Inter, sans-serif', size: 16, weight: 500, fill: COLORS.clueMuted });

        panel.text('Press Clear Board to play again.')
          .move(cx - 110, VIEW_H / 2 + 78)
          .font({ family: 'Inter, sans-serif', size: 15, weight: 700, fill: COLORS.accent });

        return g;
      }

      function showSuccess() {
        successOverlay.show();
        successOverlay.opacity(0);
        successOverlay.animate(350).opacity(1);
      }

      // Deterministic 20x20 pattern shaped like a light bulb.
      function buildLightBulbPattern(size) {
        const grid = Array.from({ length: size }, () => Array(size).fill(false));
        for (let row = 0; row < size; row++) {
          for (let col = 0; col < size; col++) {
            const cx = col + 0.5;
            const cy = row + 0.5;
            const inBulb = ((cx - 10) * (cx - 10)) / (6 * 6) + ((cy - 7) * (cy - 7)) / (6.3 * 6.3) <= 1 && row <= 11;
            if (inBulb) grid[row][col] = true;
          }
        }

        // Neck and base of the bulb.
        for (let row = 12; row <= 13; row++) {
          for (let col = 8; col <= 11; col++) grid[row][col] = true;
        }
        for (let row = 14; row <= 15; row++) {
          for (let col = 7; col <= 12; col++) grid[row][col] = true;
        }
        for (let row = 16; row <= 17; row++) {
          for (let col = 8; col <= 11; col++) grid[row][col] = true;
        }

        return grid;
      }

      // Build row clues like [3,1,4]. Empty rows become [0].
      function buildRowClues(pattern) {
        return pattern.map(row => buildLineClues(row));
      }

      // Build column clues in the same way.
      function buildColumnClues(pattern) {
        const cols = [];
        for (let col = 0; col < GRID_SIZE; col++) {
          const values = [];
          for (let row = 0; row < GRID_SIZE; row++) values.push(pattern[row][col]);
          cols.push(buildLineClues(values));
        }
        return cols;
      }

      // Convert a true/false line into nonogram clue numbers.
      function buildLineClues(values) {
        const out = [];
        let run = 0;
        for (let i = 0; i < values.length; i++) {
          if (values[i]) run++;
          else if (run > 0) {
            out.push(run);
            run = 0;
          }
        }
        if (run > 0) out.push(run);
        return out.length ? out : [0];
      }
    })();
  </script>
</body>
</html>
