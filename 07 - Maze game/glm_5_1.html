<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindergarten Maze Adventure</title>
    <!-- Include SVG.js library -->
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
    <style>
        /* Child-friendly, colorful styles */
        body {
            margin: 0;
            padding: 20px;
            background-color: #fff3e0; /* Light orange background */
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            overflow: hidden; /* Prevent scrolling from arrow keys */
        }
        h1 {
            color: #d81b60; /* Bright pink title */
            margin: 10px 0 5px 0;
            text-shadow: 2px 2px 0px #fff;
        }
        .instructions {
            color: #0277bd;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px 24px;
            font-size: 20px;
            background-color: #4caf50; /* Green buttons */
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px #2e7d32;
            font-family: inherit;
            transition: transform 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px #2e7d32;
        }
        button.solve {
            background-color: #ff9800; /* Orange solve button */
            box-shadow: 0 6px #e65100;
        }
        button.solve:active {
            box-shadow: 0 2px #e65100;
        }
        #maze-container {
            border: 8px solid #0277bd;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-color: #e0f7fa;
        }
    </style>
</head>
<body>

    <h1>Cute Maze Adventure</h1>
    <div class="instructions">Use Arrow Keys to move. Reach the Star! Don't touch the monsters!</div>
    
    <div class="controls">
        <button onclick="init()">Restart Game</button>
        <button class="solve" onclick="toggleSolution()">Show Solution</button>
    </div>

    <div id="maze-container"></div>

    <script>
        // ==========================================
        // CONFIGURATION & GLOBAL VARIABLES
        // ==========================================
        const ROWS = 20;          // Maze rows
        const COLS = 20;          // Maze columns
        const CELL = 30;          // Pixel size of each cell
        const PAD = 25;           // Padding around the maze
        const CANVAS_SIZE = (COLS * CELL) + (PAD * 2);

        let draw;                 // SVG.js drawing instance
        let grid = [];            // 2D array holding maze cell data
        let mazeGroup;            // SVG group for maze walls
        let trailGroup;           // SVG group for hero's trail
        let solGroup;             // SVG group for the solution path
        let goalGroup;            // SVG group for the end star
        let hero;                 // Object holding hero state and SVG group
        let monsters = [];        // Array of monster objects
        
        let activeKeys = {};      // Track which arrow keys are currently pressed
        let isAnimating = false;  // Prevent moving before animation finishes
        let gameOver = false;     // Stop logic if game is over
        let solutionVisible = false; // Toggle state for solution path

        // ==========================================
        // MAZE GENERATION (Recursive Backtracker)
        // ==========================================
        function generateMaze() {
            grid = [];
            // Initialize grid with all walls intact
            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = {
                        visited: false,
                        walls: { top: true, right: true, bottom: true, left: true }
                    };
                }
            }

            let stack = [];
            let current = { r: 0, c: 0 };
            grid[0][0].visited = true;
            stack.push(current);

            // Loop until we backtrack to the start
            while (stack.length > 0) {
                let neighbors = [];
                let r = current.r, c = current.c;

                // Check top neighbor
                if (r > 0 && !grid[r-1][c].visited) neighbors.push({ r: r-1, c: c, dir: 'top', opp: 'bottom' });
                // Check bottom neighbor
                if (r < ROWS-1 && !grid[r+1][c].visited) neighbors.push({ r: r+1, c: c, dir: 'bottom', opp: 'top' });
                // Check left neighbor
                if (c > 0 && !grid[r][c-1].visited) neighbors.push({ r: r, c: c-1, dir: 'left', opp: 'right' });
                // Check right neighbor
                if (c < COLS-1 && !grid[r][c+1].visited) neighbors.push({ r: r, c: c+1, dir: 'right', opp: 'left' });

                if (neighbors.length > 0) {
                    // Choose a random valid neighbor
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    
                    // Remove walls between current and next cell
                    grid[r][c].walls[next.dir] = false;
                    grid[next.r][next.c].walls[next.opp] = false;

                    grid[next.r][next.c].visited = true;
                    stack.push(current);
                    current = { r: next.r, c: next.c };
                } else {
                    // Backtrack if no unvisited neighbors
                    current = stack.pop();
                }
            }
        }

        // ==========================================
        // MAZE SOLVER (Breadth-First Search)
        // ==========================================
        function solveMaze() {
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            // Queue holds objects with current position and the path taken to get there
            let queue = [{ r:0, c:0, path: [{r:0, c:0}] }];
            visited[0][0] = true;

            while (queue.length > 0) {
                let curr = queue.shift();
                
                // Reached the goal
                if (curr.r === ROWS-1 && curr.c === COLS-1) return curr.path;

                let moves = [
                    { dr: -1, dc: 0, wall: 'top' },
                    { dr: 1, dc: 0, wall: 'bottom' },
                    { dr: 0, dc: -1, wall: 'left' },
                    { dr: 0, dc: 1, wall: 'right' }
                ];

                for (let m of moves) {
                    let nr = curr.r + m.dr, nc = curr.c + m.dc;
                    // If valid cell, not visited, and no wall blocking
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !visited[nr][nc] && !grid[curr.r][curr.c].walls[m.wall]) {
                        visited[nr][nc] = true;
                        queue.push({ r: nr, c: nc, path: [...curr.path, {r: nr, c: nc}] });
                    }
                }
            }
            return []; // Fallback
        }

        // ==========================================
        // DRAWING FUNCTIONS
        // ==========================================
        function drawMaze() {
            mazeGroup = draw.group();
            let wallStyle = { color: '#0277bd', width: 4, linecap: 'round' };

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let x = c * CELL + PAD;
                    let y = r * CELL + PAD;

                    // Draw outer top and left borders only once
                    if (grid[r][c].walls.top && r === 0) {
                        mazeGroup.line(x, y, x + CELL, y).stroke(wallStyle);
                    }
                    if (grid[r][c].walls.left && c === 0) {
                        mazeGroup.line(x, y, x, y + CELL).stroke(wallStyle);
                    }
                    // Draw all right and bottom walls to cover internal and outer borders
                    if (grid[r][c].walls.right) {
                        mazeGroup.line(x + CELL, y, x + CELL, y + CELL).stroke(wallStyle);
                    }
                    if (grid[r][c].walls.bottom) {
                        mazeGroup.line(x, y + CELL, x + CELL, y + CELL).stroke(wallStyle);
                    }
                }
            }
        }

        function drawSolution(path) {
            solGroup = draw.group();
            path.forEach((p, i) => {
                let x = p.c * CELL + PAD + CELL/2;
                let y = p.r * CELL + PAD + CELL/2;
                // Draw a yellow dot for each step
                let c = solGroup.circle(8).center(x, y).fill('#ffeb3b').stroke({color:'#fff', width:1});
                // Pop-in animation staggered by index
                c.animate(300, '<', i * 20).scale(1.2).animate(150, '>').scale(1.0);
            });
            solGroup.front(); // Ensure it's above the maze walls
            solutionVisible = true;
        }

        // ==========================================
        // ENTITY CREATION (Hero & Monsters)
        // ==========================================
        function createHero() {
            let x = 0 * CELL + PAD + CELL/2;
            let y = 0 * CELL + PAD + CELL/2;
            
            let heroGroup = draw.group();
            // Body
            heroGroup.circle(22).fill('#ffeb3b').stroke({color:'#fbc02d', width:2});
            // Eyes
            heroGroup.circle(4).center(-4, -3).fill('#000');
            heroGroup.circle(4).center(4, -3).fill('#000');
            // Smile
            heroGroup.path('M -5 3 Q 0 8 5 3').fill('none').stroke({color:'#d81b60', width:1.5});
            
            heroGroup.center(x, y);
            hero = { group: heroGroup, r: 0, c: 0, x: x, y: y };
        }

        function createMonsters() {
            monsters = [];
            // Spread 4 friendly monsters around the maze
            let positions = [
                {r: 5, c: 5}, {r: 14, c: 14}, {r: 5, c: 14}, {r: 14, c: 5}
            ];
            let colors = ['#ab47bc', '#ef5350', '#66bb6a', '#ff7043']; // Purple, Red, Green, Orange
            
            positions.forEach((pos, i) => {
                let x = pos.c * CELL + PAD + CELL/2;
                let y = pos.r * CELL + PAD + CELL/2;
                
                let g = draw.group();
                // Body (slightly oval)
                g.ellipse(24, 20).fill(colors[i]).stroke({color:'#000', width:1});
                // Big white eyes
                g.circle(8).center(-4, -2).fill('#fff');
                g.circle(8).center(4, -2).fill('#fff');
                // Pupils
                g.circle(4).center(-4, -2).fill('#000');
                g.circle(4).center(4, -2).fill('#000');
                // Silly smile
                g.path('M -4 4 Q 0 8 4 4').fill('none').stroke({color:'#fff', width:1});
                
                g.center(x, y);
                // Idle bobbing animation
                g.animate(500, '<>').dy(2).animate(250, '>').dy(-2).loop(true, true);
                
                monsters.push({ group: g, r: pos.r, c: pos.c, x: x, y: y, color: colors[i] });
            });
        }

        function createGoal() {
            let x = (COLS-1) * CELL + PAD + CELL/2;
            let y = (ROWS-1) * CELL + PAD + CELL/2;
            
            goalGroup = draw.group();
            // Draw a star shape for the goal
            goalGroup.polygon('15,0 19,11 30,11 21,18 24,30 15,22 6,30 9,18 0,11 11,11')
                      .fill('#ff9800').stroke({color:'#fff', width:1});
            goalGroup.center(x, y);
            // Spinning animation to attract attention
            goalGroup.animate(2000, '<>', true).rotate(360).loop(true, true);
        }

        // ==========================================
        // GAME LOGIC & MOVEMENT
        // ==========================================
        function moveHero(dr, dc, wallDir) {
            let r = hero.r, c = hero.c;
            
            // Check if wall blocks the path
            if (grid[r][c].walls[wallDir]) return false;

            // Calculate new logical position and pixel center
            let nr = r + dr, nc = c + dc;
            let nx = nc * CELL + PAD + CELL/2;
            let ny = nr * CELL + PAD + CELL/2;
            
            hero.r = nr; hero.c = nc;
            hero.x = nx; hero.y = ny;

            isAnimating = true;
            // Animate movement with a little hop
            hero.group.animate(100, '<>').move(nx - 11, ny - 16) // hop up
                 .animate(30, '>').move(nx - 11, ny - 11)      // land
                 .after(() => {
                     isAnimating = false;
                     checkWin();
                 });
            return true;
        }

        function moveMonster(m) {
            // Find all valid directions the monster can move
            let dirs = [
                {dr: -1, dc: 0, wall: 'top'},
                {dr: 1, dc: 0, wall: 'bottom'},
                {dr: 0, dc: -1, wall: 'left'},
                {dr: 0, dc: 1, wall: 'right'}
            ].filter(d => !grid[m.r][m.c].walls[d.wall]);

            if (dirs.length === 0) return; // Stuck (shouldn't happen)

            // Pick a random valid direction
            let dir = dirs[Math.floor(Math.random() * dirs.length)];
            let nr = m.r + dir.dr, nc = m.c + dir.dc;
            let nx = nc * CELL + PAD + CELL/2;
            let ny = nr * CELL + PAD + CELL/2;

            m.r = nr; m.c = nc; m.x = nx; m.y = ny;

            // Smooth slide animation
            m.group.animate(400, '<>').move(nx - 12, ny - 10); // 12 and 10 approximate half of ellipse bounds
        }

        function checkWin() {
            if (hero.r === ROWS-1 && hero.c === COLS-1) {
                gameOver = true;
                // Victory message
                let txt = draw.text("YAY! YOU WIN!").font({size: 40, weight: 'bold'}).fill('#4caf50').center(draw.width()/2, draw.height()/2);
                txt.animate(500, '<>').scale(1.2).loop(true, true);
            }
        }

        function handleDefeat() {
            gameOver = true;
            let txt = draw.text("Oh no! Restarting...").font({size: 30, weight: 'bold'}).fill('#d81b60').center(draw.width()/2, draw.height()/2);
            // Auto restart after 2 seconds
            setTimeout(() => {
                init();
            }, 2000);
        }

        // ==========================================
        // UI INTERACTIONS & LOOPS
        // ==========================================
        function toggleSolution() {
            if (solutionVisible) {
                if(solGroup) solGroup.remove();
                solutionVisible = false;
            } else {
                let path = solveMaze();
                drawSolution(path);
            }
        }

        // Track pressed keys for continuous movement
        window.addEventListener('keydown', (e) => {
            if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault(); // Prevent window scrolling
                activeKeys[e.key] = true;
            }
        });
        window.addEventListener('keyup', (e) => {
            activeKeys[e.key] = false;
        });

        // Main game loop for Hero movement (checks active keys frequently)
        setInterval(() => {
            if (isAnimating || gameOver) return;
            
            if (activeKeys['ArrowUp']) moveHero(-1, 0, 'top');
            else if (activeKeys['ArrowDown']) moveHero(1, 0, 'bottom');
            else if (activeKeys['ArrowLeft']) moveHero(0, -1, 'left');
            else if (activeKeys['ArrowRight']) moveHero(0, 1, 'right');
        }, 120);

        // Monster movement loop
        setInterval(() => {
            if (gameOver) return;
            monsters.forEach(m => moveMonster(m));
        }, 800);

        // Collision detection loop (runs fast to catch overlaps)
        setInterval(() => {
            if (gameOver) return;
            monsters.forEach(m => {
                // Check if monster and hero centers are very close
                if (Math.abs(hero.x - m.x) < 18 && Math.abs(hero.y - m.y) < 18) {
                    handleDefeat();
                }
            });
        }, 50);

        // Trail drawing loop (at regular intervals while moving)
        setInterval(() => {
            if (gameOver) return;
            // If any arrow key is actively pressed, drop a trail dot
            if(Object.values(activeKeys).some(k=>k)) {
                let dot = trailGroup.circle(6).center(hero.x, hero.y).fill('#f48fb1').opacity(0.7);
                // Fade out and remove the dot after 5 seconds to keep the canvas clean
                dot.animate(5000).opacity(0).after(() => dot.remove());
            }
        }, 80);

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Clear previous SVG canvas if it exists
            if(draw) draw.clear();
            
            // Create new SVG canvas
            draw = SVG().addTo('#maze-container').size(CANVAS_SIZE, CANVAS_SIZE);
            draw.rect(CANVAS_SIZE, CANVAS_SIZE).fill('#e0f7fa'); // Background
            
            // Generate new maze data
            generateMaze();
            
            // Draw layers in order
            trailGroup = draw.group();
            drawMaze(); 
            
            // Reset solution state
            solutionVisible = false;
            if(solGroup) solGroup = null;

            // Draw goal, hero, and monsters
            createGoal();
            createHero();
            createMonsters();

            // Reset game state flags
            isAnimating = false;
            gameOver = false;
        }

        // Start the game when the page loads
        window.onload = init;

    </script>
</body>
</html>
