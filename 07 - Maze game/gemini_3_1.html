<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Monster Maze Adventure!</title>
    
    <!-- Include svg.js for drawing and animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>
    
    <style>
        /* Child-friendly, colorful styling */
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #e0f7fa; /* Light cyan background */
            font-family: 'Nunito', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden; /* Prevent scrolling when playing */
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            color: #ff5252;
            margin: 10px 0;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px #ffbaba;
            font-size: 2.5rem;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            z-index: 10;
        }

        button {
            font-family: 'Fredoka One', cursive;
            background-color: #ffeb3b;
            color: #ff5252;
            border: 4px solid #ff5252;
            padding: 10px 20px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #ff5252;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #ff5252;
        }

        button.solve-btn {
            background-color: #b2ebf2;
            color: #00838f;
            border-color: #00838f;
            box-shadow: 0 4px 0 #00838f;
        }
        
        button.solve-btn:active {
            box-shadow: 0 0px 0 #00838f;
        }

        #maze-container {
            background-color: #ffffff;
            border: 8px solid #a1887f;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            position: relative;
        }

        .instructions {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #5d4037;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>🌟 Cute Maze Adventure! 🌟</h1>
    
    <div class="controls">
        <button onclick="initGame()">🔄 New Maze</button>
        <button class="solve-btn" onclick="showSolution()">✨ Show Magic Path</button>
    </div>

    <!-- The SVG canvas will be injected here -->
    <div id="maze-container"></div>

    <div class="instructions">
        Use <b>Arrow Keys</b> to move the happy sun! ☀️<br>
        Reach the Star ⭐ and avoid the friendly blobs! 👾
    </div>

    <script>
        // Game Constants
        const COLS = 20;
        const ROWS = 20;
        const CELL_SIZE = 30; // 30 pixels per cell
        const WIDTH = COLS * CELL_SIZE;
        const HEIGHT = ROWS * CELL_SIZE;

        // Global Variables
        let draw;
        let grid = [];
        let hero = { i: 0, j: 0, el: null };
        let monsters = [];
        let trailInterval, monsterInterval;
        let isGameOver = false;
        let solutionPathGroup = null;
        let trailGroup = null;
        let lastTrailCell = { i: -1, j: -1 };

        // Cell Class for Maze Generation
        class Cell {
            constructor(i, j) {
                this.i = i;
                this.j = j;
                // Walls: [top, right, bottom, left]
                this.walls = [true, true, true, true]; 
                this.visited = false;
            }
        }

        // Helper function to get 1D array index from 2D coordinates
        function index(i, j) {
            if (i < 0 || j < 0 || i > COLS - 1 || j > ROWS - 1) {
                return -1;
            }
            return i + j * COLS;
        }

        // --- MAZE GENERATION (Recursive Backtracker) ---
        // This guarantees a perfect maze (always solvable, no loops)
        function generateMaze() {
            grid = [];
            for (let j = 0; j < ROWS; j++) {
                for (let i = 0; i < COLS; i++) {
                    grid.push(new Cell(i, j));
                }
            }

            let current = grid[0];
            current.visited = true;
            let stack = [];

            let unvisitedCount = grid.length - 1;

            while (unvisitedCount > 0) {
                let neighbors = [];
                let top    = grid[index(current.i, current.j - 1)];
                let right  = grid[index(current.i + 1, current.j)];
                let bottom = grid[index(current.i, current.j + 1)];
                let left   = grid[index(current.i - 1, current.j)];

                if (top && !top.visited) neighbors.push(top);
                if (right && !right.visited) neighbors.push(right);
                if (bottom && !bottom.visited) neighbors.push(bottom);
                if (left && !left.visited) neighbors.push(left);

                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    stack.push(current);
                    removeWalls(current, next);
                    current = next;
                    current.visited = true;
                    unvisitedCount--;
                } else if (stack.length > 0) {
                    current = stack.pop();
                }
            }
        }

        function removeWalls(a, b) {
            let x = a.i - b.i;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }
            
            let y = a.j - b.j;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        // --- DRAWING THE MAZE ---
        function drawMaze() {
            // Draw background grid
            draw.rect(WIDTH, HEIGHT).fill('#fafafa');

            // Draw Walls
            for (let i = 0; i < grid.length; i++) {
                let cell = grid[i];
                let x = cell.i * CELL_SIZE;
                let y = cell.j * CELL_SIZE;

                // Wall styling
                let strokeAttr = { width: 4, color: '#8d6e63', linecap: 'round' };

                if (cell.walls[0]) draw.line(x, y, x + CELL_SIZE, y).stroke(strokeAttr); // Top
                if (cell.walls[1]) draw.line(x + CELL_SIZE, y, x + CELL_SIZE, y + CELL_SIZE).stroke(strokeAttr); // Right
                if (cell.walls[2]) draw.line(x, y + CELL_SIZE, x + CELL_SIZE, y + CELL_SIZE).stroke(strokeAttr); // Bottom
                if (cell.walls[3]) draw.line(x, y, x, y + CELL_SIZE).stroke(strokeAttr); // Left
            }
        }

        // --- DRAWING CHARACTERS ---
        function createHero() {
            hero.i = 0;
            hero.j = 0;
            hero.el = draw.group();
            
            // Hero Body (A happy yellow sun/face)
            hero.el.circle(CELL_SIZE * 0.7)
                .fill('#ffca28')
                .cx(CELL_SIZE / 2)
                .cy(CELL_SIZE / 2);
                
            // Eyes
            hero.el.circle(4).fill('#3e2723').cx(CELL_SIZE * 0.35).cy(CELL_SIZE * 0.4);
            hero.el.circle(4).fill('#3e2723').cx(CELL_SIZE * 0.65).cy(CELL_SIZE * 0.4);
            
            // Cheeks
            hero.el.circle(3).fill('#ff8a80').cx(CELL_SIZE * 0.25).cy(CELL_SIZE * 0.55).opacity(0.8);
            hero.el.circle(3).fill('#ff8a80').cx(CELL_SIZE * 0.75).cy(CELL_SIZE * 0.55).opacity(0.8);

            // Smile
            hero.el.path(`M ${CELL_SIZE * 0.35} ${CELL_SIZE * 0.6} Q ${CELL_SIZE * 0.5} ${CELL_SIZE * 0.8} ${CELL_SIZE * 0.65} ${CELL_SIZE * 0.6}`)
                .fill('none')
                .stroke({ width: 2, color: '#3e2723', linecap: 'round' });

            // Animate idle breathing
            hero.el.animate(800, '-').ease('<>').transform({ scale: 1.05 }).loop(true, true);
        }

        function createGoal() {
            // Draw a shiny star at the end (bottom-right corner)
            let cx = (COLS - 1) * CELL_SIZE + CELL_SIZE / 2;
            let cy = (ROWS - 1) * CELL_SIZE + CELL_SIZE / 2;
            
            let spikes = 5, outerRadius = CELL_SIZE * 0.4, innerRadius = CELL_SIZE * 0.2;
            let points = [];
            for (let i = 0; i < spikes * 2; i++) {
                let r = (i % 2 === 0) ? outerRadius : innerRadius;
                let angle = (Math.PI / spikes) * i - Math.PI / 2;
                points.push(`${cx + Math.cos(angle) * r},${cy + Math.sin(angle) * r}`);
            }
            
            let star = draw.polygon(points.join(' ')).fill('#ffea00').stroke({width: 2, color: '#ff8f00'});
            star.animate(1000, '-').ease('<>').transform({ rotate: 20 }).loop(true, true);
        }

        function createMonsters(count) {
            monsters = [];
            const colors = ['#ff80ab', '#18ffff', '#b388ff', '#69f0ae'];

            for (let k = 0; k < count; k++) {
                // Find a random spot not too close to the start or finish
                let mi = 0, mj = 0;
                while ((mi < 4 && mj < 4) || (mi > COLS - 3 && mj > ROWS - 3)) {
                    mi = Math.floor(Math.random() * COLS);
                    mj = Math.floor(Math.random() * ROWS);
                }

                let mGroup = draw.group();
                
                // Cute blob body
                mGroup.path(`M 4 24 Q 4 6 15 6 Q 26 6 26 24 Q 21 20 15 24 Q 9 20 4 24`)
                    .fill(colors[k % colors.length])
                    .stroke({ width: 2, color: 'rgba(0,0,0,0.1)' });
                
                // Big cute eyes
                mGroup.circle(6).fill('#fff').cx(11).cy(13);
                mGroup.circle(6).fill('#fff').cx(19).cy(13);
                mGroup.circle(3).fill('#000').cx(11).cy(13);
                mGroup.circle(3).fill('#000').cx(19).cy(13);

                mGroup.move(mi * CELL_SIZE, mj * CELL_SIZE);
                
                // Idle bounce
                mGroup.animate(500 + Math.random()*200, '-').ease('<>').transform({ translateY: -3 }).loop(true, true);

                monsters.push({ i: mi, j: mj, el: mGroup });
            }
        }

        // --- GAME LOGIC ---
        function initGame() {
            isGameOver = false;
            lastTrailCell = { i: -1, j: -1 };

            // Clear existing SVG if it exists
            if (draw) {
                document.getElementById('maze-container').innerHTML = '';
            }

            // Setup SVG Canvas
            draw = SVG().addTo('#maze-container').size(WIDTH, HEIGHT);
            
            // Create layers to maintain drawing order
            trailGroup = draw.group();
            solutionPathGroup = draw.group();
            let mazeGroup = draw.group();
            let characterGroup = draw.group();

            // Set drawing context to specific groups temporarily
            let mainDraw = draw;
            draw = mazeGroup; 
            generateMaze();
            drawMaze();
            
            draw = characterGroup;
            createGoal();
            createHero();
            createMonsters(5); // 5 friendly monsters
            
            draw = mainDraw; // Restore main draw context

            // Start Logic Loops
            clearInterval(trailInterval);
            clearInterval(monsterInterval);

            // Trail Logic: Check frequently, drop trail if cell changed
            trailInterval = setInterval(() => {
                if (isGameOver) return;
                if (lastTrailCell.i !== hero.i || lastTrailCell.j !== hero.j) {
                    // Drop a small cute circle at the current cell center
                    trailGroup.circle(8)
                        .fill('#ffab40')
                        .center(hero.i * CELL_SIZE + CELL_SIZE / 2, hero.j * CELL_SIZE + CELL_SIZE / 2)
                        .opacity(0.5);
                    
                    lastTrailCell.i = hero.i;
                    lastTrailCell.j = hero.j;
                }
            }, 100);

            // Monster Movement Logic
            monsterInterval = setInterval(() => {
                if (isGameOver) return;
                
                monsters.forEach(m => {
                    let cell = grid[index(m.i, m.j)];
                    let validMoves = [];
                    
                    if (!cell.walls[0]) validMoves.push({i: m.i, j: m.j - 1}); // up
                    if (!cell.walls[1]) validMoves.push({i: m.i + 1, j: m.j}); // right
                    if (!cell.walls[2]) validMoves.push({i: m.i, j: m.j + 1}); // down
                    if (!cell.walls[3]) validMoves.push({i: m.i - 1, j: m.j}); // left
                    
                    if (validMoves.length > 0) {
                        let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                        m.i = move.i;
                        m.j = move.j;
                        // Animate monster movement smoothly
                        m.el.animate(300).move(m.i * CELL_SIZE, m.j * CELL_SIZE);
                    }
                });
                
                // Check if monster walked into hero
                checkCollisions();
            }, 600);
        }

        // Handle Player Keyboard Input
        window.addEventListener('keydown', (e) => {
            // Prevent default scrolling for arrow keys
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            if (isGameOver) return;

            let currentCell = grid[index(hero.i, hero.j)];
            let moved = false;
            
            // Check walls before moving
            if (e.key === 'ArrowUp' && !currentCell.walls[0]) { hero.j--; moved = true; }
            else if (e.key === 'ArrowRight' && !currentCell.walls[1]) { hero.i++; moved = true; }
            else if (e.key === 'ArrowDown' && !currentCell.walls[2]) { hero.j++; moved = true; }
            else if (e.key === 'ArrowLeft' && !currentCell.walls[3]) { hero.i--; moved = true; }
            
            if (moved) {
                // Move visually
                hero.el.animate(150, '-').move(hero.i * CELL_SIZE, hero.j * CELL_SIZE);
                checkCollisions();
            }
        });

        function checkCollisions() {
            // Did player reach the end?
            if (hero.i === COLS - 1 && hero.j === ROWS - 1) {
                isGameOver = true;
                setTimeout(() => {
                    alert("🌟 Yay! You found the magic star! 🌟");
                    initGame();
                }, 200);
                return;
            }

            // Did a monster touch the player?
            for (let m of monsters) {
                if (m.i === hero.i && m.j === hero.j) {
                    isGameOver = true;
                    // Cute spin and shrink animation for game over
                    hero.el.animate(500).transform({ rotate: 720, scale: 0 }).after(() => {
                        alert("Oops! A friendly blob gave you a big hug! Let's try again! 👾");
                        initGame();
                    });
                    break;
                }
            }
        }

        // --- PATHFINDING SOLUTION (BFS) ---
        function showSolution() {
            if (isGameOver) return;
            
            // Clear previous solution if drawn
            solutionPathGroup.clear();

            // Breadth-First Search to find shortest path
            let queue = [{ i: hero.i, j: hero.j, path: [] }];
            let visited = new Set();
            visited.add(`${hero.i},${hero.j}`);
            let finalPath = [];

            while (queue.length > 0) {
                let curr = queue.shift();
                let ci = curr.i, cj = curr.j;
                
                // Add current node to path
                let newPath = [...curr.path, { i: ci, j: cj }];
                
                // Goal reached
                if (ci === COLS - 1 && cj === ROWS - 1) {
                    finalPath = newPath;
                    break;
                }
                
                let cell = grid[index(ci, cj)];
                let neighbors = [];
                if (!cell.walls[0]) neighbors.push({ i: ci, j: cj - 1 });
                if (!cell.walls[1]) neighbors.push({ i: ci + 1, j: cj });
                if (!cell.walls[2]) neighbors.push({ i: ci, j: cj + 1 });
                if (!cell.walls[3]) neighbors.push({ i: ci - 1, j: cj });
                
                for (let n of neighbors) {
                    let key = `${n.i},${n.j}`;
                    if (!visited.has(key)) {
                        visited.add(key);
                        queue.push({ i: n.i, j: n.j, path: newPath });
                    }
                }
            }

            // Draw the discovered path
            if (finalPath.length > 0) {
                let points = finalPath.map(p => 
                    `${p.i * CELL_SIZE + CELL_SIZE / 2},${p.j * CELL_SIZE + CELL_SIZE / 2}`
                ).join(' ');
                
                // Draw a beautiful dashed magic line
                solutionPathGroup.polyline(points)
                    .fill('none')
                    .stroke({ width: 6, color: '#40c4ff', dasharray: '10,10', linecap: 'round' })
                    .opacity(0.8);
            }
        }

        // Start the game when the window loads
        window.onload = initGame;

    </script>
</body>
</html>
