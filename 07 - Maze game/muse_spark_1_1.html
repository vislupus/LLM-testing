<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Maze Adventure!</title>
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  /* --- Child-friendly colorful style --- */
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #FFF9C4 0%, #FFE0B2 25%, #C8E6C9 50%, #BBDEFB 75%, #E1BEE7 100%);
    font-family: 'Nunito', 'Comic Sans MS', cursive, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 {
    margin: 8px 0 4px;
    font-size: 2.2em;
    color: #4A148C;
    text-shadow: 2px 2px 0px #FFEB3B;
    letter-spacing: 1px;
  }
  .subtitle {
    margin: 0 0 12px;
    color: #5D4037;
    font-size: 1.1em;
    font-weight: 600;
  }
  #controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 12px 0;
  }
  .btn {
    padding: 12px 20px;
    border: none;
    border-radius: 999px;
    font-family: inherit;
    font-weight: 800;
    font-size: 1em;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 6px 12px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  #btnNew { background: #66BB6A; color: white; }
  #btnSolution { background: #FFCA28; color: #4E342E; }
  #btnNew:hover { background: #4CAF50; }
  #btnSolution:hover { background: #FFB300; }
  #btnSolution.active { background: #FF6F00; color: white; }
  
  #gameWrapper {
    background: white;
    border-radius: 24px;
    padding: 12px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.15), 0 0 0 6px #FFEB3B inset;
    position: relative;
  }
  #maze {
    border-radius: 12px;
    overflow: hidden;
    display: block;
    /* fixed size for 20x20 maze, responsive */
    width: min(92vw, 640px);
    height: min(92vw, 640px);
  }
  #status {
    margin-top: 12px;
    font-size: 1.25em;
    font-weight: 800;
    color: #4A148C;
    min-height: 1.5em;
    text-align: center;
    background: rgba(255,255,255,0.8);
    padding: 8px 16px;
    border-radius: 999px;
  }
  #dpad {
    display: none; /* shown on touch devices */
    margin-top: 16px;
    grid-template-columns: 60px 60px 60px;
    grid-template-rows: 60px 60px 60px;
    gap: 8px;
    justify-content: center;
  }
  #dpad button {
    border: none;
    border-radius: 16px;
    background: #90CAF9;
    font-size: 1.8em;
    box-shadow: 0 4px 0 #64B5F6;
    cursor: pointer;
  }
  #dpad button:active { transform: translateY(3px); box-shadow: 0 1px 0 #64B5F6; }
  @media (max-width: 700px) {
    #dpad { display: grid; }
  }
  .legend {
    margin-top: 12px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
    font-size: 0.9em;
    color: #5D4037;
    font-weight: 600;
  }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .dot-example { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
  <h1>🌈 Maze Adventure 🦊</h1>
  <p class="subtitle">Help Foxy find the magic star! Use arrow keys ⬆️⬇️⬅️➡️</p>
  
  <div id="controls">
    <button id="btnNew" class="btn">🎲 New Maze</button>
    <button id="btnSolution" class="btn">✨ Show Solution</button>
  </div>

  <div id="gameWrapper">
    <!-- SVG.js will inject SVG here -->
    <div id="maze"></div>
  </div>

  <div id="status">Let's go! Find the ⭐</div>

  <div id="dpad">
    <div></div><button data-dir="up">⬆️</button><div></div>
    <button data-dir="left">⬅️</button><button data-dir="down">⬇️</button><button data-dir="right">➡️</button>
  </div>

  <div class="legend">
    <span><span class="dot-example" style="background:#FF8A65"></span> Foxy (you)</span>
    <span><span class="dot-example" style="background:#4FC3F7"></span> Friendly monsters</span>
    <span><span class="dot-example" style="background:#CE93D8"></span> Your trail</span>
    <span><span class="dot-example" style="background:#FFEB3B"></span> Solution</span>
  </div>

<script>
// ============================================================
//  KINDERGARTEN MAZE GAME - Fully commented, single file
//  Uses svg.js (https://svgjs.dev) for all drawing & animation
// ============================================================

// --- Game Config (child-friendly sizes and speeds) ---
const COLS = 20;              // maze width in cells (required 20)
const ROWS = 20;              // maze height in cells (required 20)
const CELL = 32;              // pixel size of each cell (640px / 20)
const HERO_SPEED = 180;       // ms for hero to move one cell
const MONSTER_SPEED = 650;    // ms between monster moves (slower = easier)
const TRAIL_INTERVAL = 180;   // ms between trail dots while moving
const MONSTER_COUNT = 3;      // number of friendly monsters

// --- Global State ---
let grid = [];                // 2D array of cell objects
let draw;                     // svg.js drawing instance
let hero = { x:0, y:0, group:null, isMoving:false, lastMove:0 }; // player
let monsters = [];            // array of monster objects {x,y,group,color}
let trailDots = [];           // array of trail circles for cleanup
let solutionPath = [];        // array of {x,y} from start to end
let showSolution = false;
let solutionLine = null;      // svg.js polyline for solution
let gameOver = false;
let trailTimer = null;
let monsterTimer = null;

// --- MAZE GENERATION (Recursive Backtracker - always solvable) ---
// Each cell has 4 walls: top, right, bottom, left
function createGrid(cols, rows) {
  const g = [];
  for (let y=0; y<rows; y++) {
    const row = [];
    for (let x=0; x<cols; x++) {
      row.push({
        x, y,
        walls: { top:true, right:true, bottom:true, left:true },
        visited:false
      });
    }
    g.push(row);
  }
  return g;
}

// Get unvisited neighbors with direction info
function getUnvisitedNeighbors(cell, grid) {
  const dirs = [
    {dx:0, dy:-1, wall:'top', opp:'bottom'},
    {dx:1, dy:0, wall:'right', opp:'left'},
    {dx:0, dy:1, wall:'bottom', opp:'top'},
    {dx:-1, dy:0, wall:'left', opp:'right'}
  ];
  const neighbors = [];
  for (const d of dirs) {
    const nx = cell.x + d.dx;
    const ny = cell.y + d.dy;
    if (nx>=0 && nx<COLS && ny>=0 && ny<ROWS && !grid[ny][nx].visited) {
      neighbors.push({cell: grid[ny][nx], dir: d});
    }
  }
  return neighbors;
}

// Generate perfect maze (always has solution)
function generateMaze() {
  grid = createGrid(COLS, ROWS);
  const stack = [];
  let current = grid[0][0];
  current.visited = true;

  while (true) {
    const neighbors = getUnvisitedNeighbors(current, grid);
    if (neighbors.length > 0) {
      // pick random neighbor
      const {cell: next, dir} = neighbors[Math.floor(Math.random()*neighbors.length)];
      // knock down walls between
      current.walls[dir.wall] = false;
      next.walls[dir.opp] = false;
      stack.push(current);
      next.visited = true;
      current = next;
    } else if (stack.length > 0) {
      current = stack.pop();
    } else {
      break; // all visited
    }
  }
}

// --- MAZE SOLVER (BFS to find shortest path for solution button) ---
function solveMaze(startX, startY, endX, endY) {
  const queue = [{x:startX, y:startY}];
  const visited = Array.from({length:ROWS}, ()=>Array(COLS).fill(false));
  const parent = Array.from({length:ROWS}, ()=>Array(COLS).fill(null));
  visited[startY][startX] = true;

  const dirs = [
    {dx:0, dy:-1, wall:'top'},
    {dx:1, dy:0, wall:'right'},
    {dx:0, dy:1, wall:'bottom'},
    {dx:-1, dy:0, wall:'left'}
  ];

  while (queue.length>0) {
    const cur = queue.shift();
    if (cur.x===endX && cur.y===endY) break;
    for (const d of dirs) {
      if (!grid[cur.y][cur.x].walls[d.wall]) {
        const nx = cur.x + d.dx;
        const ny = cur.y + d.dy;
        if (nx>=0 && nx<COLS && ny>=0 && ny<ROWS && !visited[ny][nx]) {
          visited[ny][nx]=true;
          parent[ny][nx]=cur;
          queue.push({x:nx,y:ny});
        }
      }
    }
  }
  // reconstruct path
  const path = [];
  let cur = {x:endX, y:endY};
  while (cur) {
    path.unshift(cur);
    cur = parent[cur.y][cur.x];
  }
  return path;
}

// --- DRAWING WITH SVG.JS (all drawing must be via svg.js) ---
function initDraw() {
  const container = document.getElementById('maze');
  container.innerHTML = '';
  // create svg.js canvas
  draw = SVG().addTo('#maze').size(COLS*CELL, ROWS*CELL).viewbox(0,0,COLS*CELL, ROWS*CELL);
}

function drawMaze() {
  draw.clear();

  // background with cute pattern
  draw.rect(COLS*CELL, ROWS*CELL).fill('#FFFDE7').radius(8);

  // checker faint background for child-friendly look
  for (let y=0;y<ROWS;y++) {
    for (let x=0;x<COLS;x++) {
      if ((x+y)%2===0) {
        draw.rect(CELL, CELL).move(x*CELL, y*CELL).fill('#FFF9C4').opacity(0.5);
      }
    }
  }

  // draw walls as thick rounded lines
  for (let y=0;y<ROWS;y++) {
    for (let x=0;x<COLS;x++) {
      const cell = grid[y][x];
      const px = x*CELL;
      const py = y*CELL;
      const wallStyle = { width:4, color:'#6D4C41', linecap:'round' };
      if (cell.walls.top) {
        draw.line(px, py, px+CELL, py).stroke(wallStyle);
      }
      if (cell.walls.left) {
        draw.line(px, py, px, py+CELL).stroke(wallStyle);
      }
      // right and bottom edges for outer border + inner walls
      if (cell.walls.right) {
        draw.line(px+CELL, py, px+CELL, py+CELL).stroke(wallStyle);
      }
      if (cell.walls.bottom) {
        draw.line(px, py+CELL, px+CELL, py+CELL).stroke(wallStyle);
      }
    }
  }

  // start and end markers
  // start - green lily pad
  draw.circle(CELL*0.6).center(CELL*0.5, CELL*0.5).fill('#AED581').stroke({width:2, color:'#7CB342'});
  draw.text('🏠').font({size:CELL*0.5, anchor:'middle'}).center(CELL*0.5, CELL*0.55);

  // end - magic star
  const endCx = (COLS-0.5)*CELL;
  const endCy = (ROWS-0.5)*CELL;
  draw.circle(CELL*0.7).center(endCx, endCy).fill('#FFECB3').stroke({width:2, color:'#FFB300'});
  const star = draw.text('⭐').font({size:CELL*0.6, anchor:'middle'}).center(endCx, endCy+2);

  // if solution should be shown, draw it now (under hero/monsters)
  if (showSolution && solutionPath.length>0) {
    const points = solutionPath.map(p => `${p.x*CELL + CELL/2},${p.y*CELL + CELL/2}`).join(' ');
    if (solutionLine) solutionLine.remove();
    solutionLine = draw.polyline(points).fill('none').stroke({width:6, color:'#FFEB3B', linecap:'round', linejoin:'round', dasharray:'10 8'}).opacity(0.9);
    // animate dash
    solutionLine.animate(1000).ease('<>').loop().attr({'stroke-dashoffset':20});
  }
}

// --- HERO (cute fox) creation ---
function createHero(x,y) {
  const g = draw.group();
  const cx = x*CELL + CELL/2;
  const cy = y*CELL + CELL/2;

  // shadow
  g.ellipse(CELL*0.5, CELL*0.25).center(0, CELL*0.3).fill('#000').opacity(0.15);

  // body
  const body = g.circle(CELL*0.55).center(0,0).fill('#FF8A65').stroke({width:2, color:'#E64A19'});

  // ears
  g.polygon(`0,-${CELL*0.35} -${CELL*0.15},-${CELL*0.15} ${CELL*0.15},-${CELL*0.15}`).fill('#FF7043').stroke({width:1.5, color:'#BF360C'}).move(0, -CELL*0.1);

  // white face
  g.circle(CELL*0.35).center(0, CELL*0.05).fill('white');

  // eyes
  const leftEye = g.circle(CELL*0.12).center(-CELL*0.08, -CELL*0.02).fill('#212121');
  const rightEye = g.circle(CELL*0.12).center(CELL*0.08, -CELL*0.02).fill('#212121');
  // eye shine
  g.circle(CELL*0.05).center(-CELL*0.06, -CELL*0.04).fill('white');
  g.circle(CELL*0.05).center(CELL*0.10, -CELL*0.04).fill('white');

  // nose
  g.circle(CELL*0.06).center(0, CELL*0.08).fill('#212121');

  // smile
  g.path(`M -${CELL*0.08} ${CELL*0.12} Q 0 ${CELL*0.18} ${CELL*0.08} ${CELL*0.12}`).fill('none').stroke({width:2, color:'#4E342E', linecap:'round'});

  g.center(cx, cy);

  // cute bobbing animation
  g.animate(800).ease('>').loop(true, true).dY(-3);

  return g;
}

// --- MONSTER (friendly slime) creation ---
function createMonster(x,y,color) {
  const g = draw.group();
  const cx = x*CELL + CELL/2;
  const cy = y*CELL + CELL/2;

  // shadow
  g.ellipse(CELL*0.5, CELL*0.2).center(0, CELL*0.32).fill('#000').opacity(0.12);

  // body - rounded blob
  g.rect(CELL*0.6, CELL*0.5).center(0,0).radius(CELL*0.2).fill(color).stroke({width:2, color:'#424242'});

  // eyes - big friendly
  g.circle(CELL*0.16).center(-CELL*0.12, -CELL*0.05).fill('white').stroke({width:1.5, color:'#212121'});
  g.circle(CELL*0.16).center(CELL*0.12, -CELL*0.05).fill('white').stroke({width:1.5, color:'#212121'});
  g.circle(CELL*0.07).center(-CELL*0.12, -CELL*0.03).fill('#212121');
  g.circle(CELL*0.07).center(CELL*0.12, -CELL*0.03).fill('#212121');

  // smile
  g.path(`M -${CELL*0.12} ${CELL*0.12} Q 0 ${CELL*0.20} ${CELL*0.12} ${CELL*0.12}`).fill('none').stroke({width:2, color:'#212121', linecap:'round'});

  // little antenna
  g.line(0, -CELL*0.25, 0, -CELL*0.4).stroke({width:2, color:color});
  g.circle(CELL*0.1).center(0, -CELL*0.42).fill(color).stroke({width:1.5, color:'#212121'});

  g.center(cx, cy);

  // wobble animation
  g.animate(600).ease('>').loop(true, true).rotate(5).loop(true, true);

  return g;
}

// --- TRAIL (small circles) ---
function addTrailDot(x,y) {
  const dot = draw.circle(CELL*0.18).center(x*CELL + CELL/2 + (Math.random()-0.5)*6, y*CELL + CELL/2 + (Math.random()-0.5)*6)
    .fill('#CE93D8').stroke({width:1, color:'#8E24AA'}).opacity(0.9);
  trailDots.push(dot);
  // fade out after some time to avoid clutter
  dot.animate(4000).opacity(0.2).after(()=>{ /* keep faint */ });
}

// --- GAME LOGIC ---
function resetGame() {
  gameOver = false;
  hero.x = 0; hero.y = 0;
  hero.isMoving = false;
  // clear trail
  trailDots.forEach(d=>d.remove());
  trailDots = [];
  // clear timers
  if (trailTimer) clearInterval(trailTimer);
  if (monsterTimer) clearInterval(monsterTimer);

  // generate new maze
  generateMaze();
  solutionPath = solveMaze(0,0,COLS-1,ROWS-1);
  initDraw();
  drawMaze();

  // create hero
  if (hero.group) hero.group.remove();
  hero.group = createHero(0,0);
  hero.group.front(); // on top

  // create monsters at random far positions
  monsters.forEach(m=>{ if(m.group) m.group.remove(); });
  monsters = [];
  const monsterColors = ['#4FC3F7','#FF8A80','#AED581'];
  for (let i=0;i<MONSTER_COUNT;i++) {
    let mx, my;
    do {
      mx = Math.floor(Math.random()*COLS);
      my = Math.floor(Math.random()*ROWS);
      // keep away from start and end
    } while ((mx<4 && my<4) || (mx>COLS-5 && my>ROWS-5) || (mx===0 && my===0));
    const mg = createMonster(mx,my,monsterColors[i%monsterColors.length]);
    monsters.push({x:mx, y:my, group:mg, color:monsterColors[i]});
  }
  monsters.forEach(m=>m.group.front());
  hero.group.front();

  // start trail timer - drops dots at intervals while moving
  trailTimer = setInterval(()=>{
    if (hero.isMoving || Date.now() - hero.lastMove < 400) {
      addTrailDot(hero.x, hero.y);
    }
  }, TRAIL_INTERVAL);

  // start monster movement loop
  monsterTimer = setInterval(moveMonsters, MONSTER_SPEED);

  updateStatus("Let's go! Find the ⭐");
}

function canMove(x,y,dir) {
  if (x<0||x>=COLS||y<0||y>=ROWS) return false;
  return !grid[y][x].walls[dir];
}

function moveHero(dx, dy) {
  if (gameOver || hero.isMoving) return;
  const dirMap = {
    '0,-1':'top',
    '1,0':'right',
    '0,1':'bottom',
    '-1,0':'left'
  };
  const key = `${dx},${dy}`;
  const wall = dirMap[key];
  if (!canMove(hero.x, hero.y, wall)) {
    // bump animation
    hero.group.animate(100).dMove(dx*4, dy*4).loop(1,true).after(()=>{
      hero.group.move(hero.x*CELL + CELL/2 - hero.group.width()/2, hero.y*CELL + CELL/2 - hero.group.height()/2);
    });
    return;
  }
  const nx = hero.x + dx;
  const ny = hero.y + dy;
  if (nx<0||nx>=COLS||ny<0||ny>=ROWS) return;

  hero.isMoving = true;
  hero.lastMove = Date.now();
  hero.x = nx; hero.y = ny;

  // leave trail at previous pos immediately
  addTrailDot(hero.x - dx, hero.y - dy);

  // animate hero to new cell center
  const targetX = nx*CELL + CELL/2;
  const targetY = ny*CELL + CELL/2;
  hero.group.animate(HERO_SPEED).center(targetX, targetY).after(()=>{
    hero.isMoving = false;
    checkCollisions();
    checkWin();
  });

  // check monsters that might already be there (instant)
  checkCollisions();
}

function moveMonsters() {
  if (gameOver) return;
  monsters.forEach(mon => {
    // get valid moves (no wall)
    const possible = [];
    const checks = [
      {dx:0, dy:-1, wall:'top'},
      {dx:1, dy:0, wall:'right'},
      {dx:0, dy:1, wall:'bottom'},
      {dx:-1, dy:0, wall:'left'}
    ];
    for (const c of checks) {
      if (canMove(mon.x, mon.y, c.wall)) {
        possible.push(c);
      }
    }
    if (possible.length===0) return;
    // 30% chance to move towards hero for a bit of challenge, otherwise random
    let chosen;
    if (Math.random()<0.35) {
      // move that reduces Manhattan distance
      possible.sort((a,b)=>{
        const da = Math.abs(mon.x + a.dx - hero.x) + Math.abs(mon.y + a.dy - hero.y);
        const db = Math.abs(mon.x + b.dx - hero.x) + Math.abs(mon.y + b.dy - hero.y);
        return da-db;
      });
      chosen = possible[0];
    } else {
      chosen = possible[Math.floor(Math.random()*possible.length)];
    }
    mon.x += chosen.dx;
    mon.y += chosen.dy;
    mon.group.animate(MONSTER_SPEED*0.8).center(mon.x*CELL + CELL/2, mon.y*CELL + CELL/2);
  });
  // check after move
  setTimeout(checkCollisions, MONSTER_SPEED*0.8);
}

function checkCollisions() {
  for (const mon of monsters) {
    if (mon.x===hero.x && mon.y===hero.y) {
      gameOver = true;
      updateStatus("Oh no! A friendly monster hugged you! 🤗 Restarting...");
      // shake hero
      hero.group.animate(100).dMove(5,0).loop(4,true);
      setTimeout(()=>{ resetGame(); }, 1500);
      return true;
    }
  }
  return false;
}

function checkWin() {
  if (hero.x===COLS-1 && hero.y===ROWS-1) {
    gameOver = true;
    updateStatus("YAY! You found the star! 🌟🎉");
    // celebration animation
    for (let i=0;i<20;i++) {
      const conf = draw.circle(8).center((COLS-1)*CELL + CELL/2, (ROWS-1)*CELL + CELL/2)
        .fill(['#FFEB3B','#FF7043','#66BB6A','#42A5F5'][i%4]);
      conf.animate(800 + Math.random()*400).move(
        (COLS-1)*CELL + CELL/2 + (Math.random()-0.5)*200,
        (ROWS-1)*CELL + CELL/2 + (Math.random()-0.5)*200
      ).after(()=>conf.remove());
    }
    hero.group.animate(300).scale(1.3).loop(2,true);
    setTimeout(()=>{ resetGame(); }, 2500);
  }
}

function updateStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// --- Controls ---
document.addEventListener('keydown', (e)=>{
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    if (e.key==='ArrowUp') moveHero(0,-1);
    if (e.key==='ArrowDown') moveHero(0,1);
    if (e.key==='ArrowLeft') moveHero(-1,0);
    if (e.key==='ArrowRight') moveHero(1,0);
  }
});

// on-screen dpad for kids on tablets
document.getElementById('dpad').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if (!btn) return;
  const dir = btn.dataset.dir;
  if (dir==='up') moveHero(0,-1);
  if (dir==='down') moveHero(0,1);
  if (dir==='left') moveHero(-1,0);
  if (dir==='right') moveHero(1,0);
});

// buttons
document.getElementById('btnNew').addEventListener('click', resetGame);
document.getElementById('btnSolution').addEventListener('click', ()=>{
  showSolution = !showSolution;
  const btn = document.getElementById('btnSolution');
  btn.classList.toggle('active', showSolution);
  btn.textContent = showSolution ? '🙈 Hide Solution' : '✨ Show Solution';
  if (showSolution) {
    drawMaze();
    // redraw hero and monsters on top
    if (hero.group) { hero.group.remove(); hero.group = createHero(hero.x, hero.y); }
    monsters.forEach(m=>{ m.group.remove(); m.group = createMonster(m.x,m.y,m.color); });
    hero.group.front();
    // re-draw trail
    trailDots.forEach(d=>{ d.front(); });
  } else {
    if (solutionLine) { solutionLine.remove(); solutionLine=null; }
    drawMaze();
    // restore
    trailDots.forEach(d=>d.remove()); trailDots=[]; // clear for simplicity
    if (hero.group) { hero.group.remove(); hero.group = createHero(hero.x, hero.y); }
    monsters.forEach(m=>{ m.group.remove(); m.group = createMonster(m.x,m.y,m.color); });
    hero.group.front();
  }
});

// --- Start the game ---
resetGame();
</script>
