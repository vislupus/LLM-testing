<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kindergarten Maze Adventure</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#fef9e7;
    font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;
    display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:10px;
    overflow:hidden;
  }
  h1 {
    font-size:28px; color:#e74c3c;
    margin-bottom:4px; letter-spacing:1px;
    text-shadow:1px 1px 0 #fff;
  }
  .subtitle {
    font-size:14px; color:#7a6a5a;
    margin-bottom:8px;
  }
  #gameWrap {
    position:relative;
    background:#fff;
    border-radius:16px;
    padding:12px;
    box-shadow:0 8px 30px rgba(0,0,0,0.1);
    border:3px solid #f0e6d0;
  }
  #svgContainer { display:block; line-height:0; }

  #controls {
    display:flex; gap:10px; justify-content:center;
    margin-top:10px; flex-wrap:wrap;
  }
  .btn {
    padding:10px 22px; border-radius:12px;
    border:2px solid rgba(0,0,0,0.08);
    background:#a8e6cf; color:#2c5e4a;
    font-size:14px; font-weight:700;
    cursor:pointer; transition:all 0.15s;
    font-family:inherit;
  }
  .btn:hover { background:#8dd7b5; transform:translateY(-2px); }
  .btn.pink { background:#ffb7b2; color:#6a2c2a; }
  .btn.pink:hover { background:#ff9e99; }
  .btn.blue { background:#a0c4ff; color:#1a3a6a; }
  .btn.blue:hover { background:#85b3ff; }
  .btn.yellow { background:#fdffb6; color:#5a5a1a; }
  .btn.yellow:hover { background:#f0f2a0; }

  #hintBar {
    margin-top:8px; text-align:center;
    font-size:13px; color:#8a7a6a;
  }
  #hintBar span { color:#5a4a3a; font-weight:700; }

  /* Game Over overlay */
  #gameOverOverlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(255,250,240,0.92);
    border-radius:16px; z-index:10;
    backdrop-filter:blur(3px);
  }
  #gameOverOverlay.active { display:flex; }
  #gameOverOverlay h2 {
    font-size:32px; color:#e74c3c;
    margin-bottom:6px;
  }
  #gameOverOverlay p {
    color:#7a6a5a; font-size:14px;
    margin-bottom:14px;
  }
  #gameOverOverlay .monsterEmoji {
    font-size:48px; margin-bottom:10px;
    animation:bounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes bounce {
    from { transform:translateY(0); }
    to { transform:translateY(-10px); }
  }

  /* Win overlay */
  #winOverlay {
    position:absolute; inset:0;
    display:none; flex-direction:column;
    align-items:center; justify-content:center;
    background:rgba(255,250,240,0.92);
    border-radius:16px; z-index:10;
    backdrop-filter:blur(3px);
  }
  #winOverlay.active { display:flex; }
  #winOverlay h2 {
    font-size:32px; color:#27ae60;
    margin-bottom:6px;
  }
  #winOverlay p {
    color:#7a6a5a; font-size:14px;
    margin-bottom:14px;
  }
  #winOverlay .starEmoji {
    font-size:48px; margin-bottom:10px;
    animation:spin 1s ease-in-out infinite;
  }
  @keyframes spin {
    from { transform:rotate(0deg); }
    to { transform:rotate(360deg); }
  }

  .confetti {
    position:absolute; width:8px; height:8px;
    border-radius:50%; pointer-events:none;
    animation:confettiFall 2s ease-out forwards;
  }
  @keyframes confettiFall {
    0% { transform:translateY(0) rotate(0deg); opacity:1; }
    100% { transform:translateY(200px) rotate(720deg); opacity:0; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
</head>
<body>

<h1>🌈 Maze Adventure</h1>
<p class="subtitle">Help the hero find the treasure! Watch out for silly monsters!</p>

<div id="gameWrap">
  <div id="svgContainer"></div>

  <div id="gameOverOverlay">
    <div class="monsterEmoji">👾</div>
    <h2>Oh no!</h2>
    <p>A monster caught you! Try again!</p>
    <button class="btn pink" id="retryBtn">Try Again</button>
  </div>

  <div id="winOverlay">
    <div class="starEmoji">⭐</div>
    <h2>You did it!</h2>
    <p>You found the treasure!</p>
    <button class="btn yellow" id="nextMazeBtn">Next Maze</button>
  </div>
</div>

<div id="controls">
  <button class="btn blue" id="newMazeBtn">🎲 New Maze</button>
  <button class="btn yellow" id="showSolutionBtn">💡 Show Path</button>
</div>

<div id="hintBar">
  Use <span>Arrow Keys</span> to move &middot; Avoid the <span>monsters</span>!
</div>

<script>
// ============================================================
//  KINDERGARTEN MAZE ADVENTURE
//  A child-friendly maze game with random generation,
//  cute monsters, trail effects, and solution display.
// ============================================================

// --- Configuration ----------------------------------------------
const MAZE_SIZE = 20;           // 20x20 grid of cells
const CELL = 28;                // pixels per cell
const WALL_THICK = 3;           // wall line thickness
const HERO_SIZE = 16;           // hero circle diameter
const MONSTER_SIZE = 18;        // monster size
const TRAIL_INTERVAL = 0.25;    // seconds between trail dots
const MONSTER_SPEED = 1.8;      // cells per second
const MONSTER_COUNT = 3;        // number of monsters

// Colors (child-friendly pastel palette)
const COLORS = {
  wall: '#8b7355',
  wallBg: '#f5e6d3',
  hero: '#3498db',
  heroGlow: '#85c1e9',
  monster: '#e74c3c',
  monsterEye: '#fff',
  monsterPupil: '#2c3e50',
  trail: '#85c1e9',
  goal: '#f1c40f',
  goalGlow: '#f9e79f',
  path: '#a8e6cf',
  pathBorder: '#7dcea0'
};

// --- Maze Generation (Recursive Backtracker) --------------------
// Uses a standard depth-first search algorithm to carve passages
// through a grid, guaranteeing exactly one valid solution.
function generateMaze(size) {
  // Initialize grid: each cell tracks which walls exist
  // walls: [top, right, bottom, left] — true = wall exists
  const grid = [];
  for (let r = 0; r < size; r++) {
    grid[r] = [];
    for (let c = 0; c < size; c++) {
      grid[r][c] = { walls: [true, true, true, true], visited: false };
    }
  }

  const stack = [];
  let current = { r: 0, c: 0 };
  grid[0][0].visited = true;

  // Directions: [dr, dc, wallIndex, oppositeWallIndex]
  const dirs = [
    [-1, 0, 0, 2], // up
    [0, 1, 1, 3],  // right
    [1, 0, 2, 0],  // down
    [0, -1, 3, 1]  // left
  ];

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  do {
    const neighbors = [];
    for (const [dr, dc, wi, owi] of dirs) {
      const nr = current.r + dr;
      const nc = current.c + dc;
      if (nr >= 0 && nr < size && nc >= 0 && nc < size && !grid[nr][nc].visited) {
        neighbors.push({ r: nr, c: nc, wi, owi });
      }
    }

    if (neighbors.length > 0) {
      const next = shuffle(neighbors)[0];
      stack.push(current);
      // Remove walls between current and next
      grid[current.r][current.c].walls[next.wi] = false;
      grid[next.r][next.c].walls[next.owi] = false;
      current = { r: next.r, c: next.c };
      grid[current.r][current.c].visited = true;
    } else if (stack.length > 0) {
      current = stack.pop();
    }
  } while (stack.length > 0);

  return grid;
}

// --- BFS Pathfinding (for solution display) ----------------------
function findPath(grid, size, start, end) {
  const queue = [{ r: start.r, c: start.c, path: [start] }];
  const visited = new Set();
  visited.add(start.r + ',' + start.c);

  const dirs = [
    [-1, 0, 0], [0, 1, 1], [1, 0, 2], [0, -1, 3]
  ];

  while (queue.length > 0) {
    const curr = queue.shift();
    if (curr.r === end.r && curr.c === end.c) {
      return curr.path;
    }
    for (const [dr, dc, wi] of dirs) {
      if (grid[curr.r][curr.c].walls[wi]) continue; // wall blocks
      const nr = curr.r + dr;
      const nc = curr.c + dc;
      const key = nr + ',' + nc;
      if (!visited.has(key)) {
        visited.add(key);
        queue.push({
          r: nr, c: nc,
          path: [...curr.path, { r: nr, c: nc }]
        });
      }
    }
  }
  return [];
}

// --- Game State -------------------------------------------------
let mazeGrid = [];          // the maze wall data
let hero = { r: 0, c: 0 };  // hero position in grid coords
let monsters = [];          // monster positions and directions
let trailDots = [];         // trail circle elements
let trailTimer = 0;
let gameState = 'playing';    // 'playing', 'won', 'lost'
let draw;                   // svg.js drawing instance
let heroGroup;              // SVG group for hero
let monsterGroups = [];     // SVG groups for monsters
let goalGroup;              // SVG group for goal/treasure
let pathGroup;              // SVG group for solution path
let wallGroup;              // SVG group for walls
let trailGroup;             // SVG group for trail
let animFrame = 0;          // animation frame counter
let lastTime = 0;

// --- SVG Setup --------------------------------------------------
function initGame() {
  // Generate new maze
  mazeGrid = generateMaze(MAZE_SIZE);
  hero = { r: 0, c: 0 };
  gameState = 'playing';
  trailDots = [];
  trailTimer = 0;
  animFrame = 0;

  // Spawn monsters at random positions away from start
  monsters = [];
  const used = new Set(['0,0']);
  for (let i = 0; i < MONSTER_COUNT; i++) {
    let r, c, key;
    do {
      r = Math.floor(Math.random() * MAZE_SIZE);
      c = Math.floor(Math.random() * MAZE_SIZE);
      key = r + ',' + c;
    } while (used.has(key) || (r < 3 && c < 3));
    used.add(key);
    monsters.push({
      r: r, c: c,
      targetR: r, targetC: c,
      moveProgress: 0,
      moveDir: Math.floor(Math.random() * 4),
      animOffset: Math.random() * Math.PI * 2
    });
  }

  // Build SVG
  buildSVG();

  // Hide overlays
  document.getElementById('gameOverOverlay').classList.remove('active');
  document.getElementById('winOverlay').classList.remove('active');
}

function buildSVG() {
  const container = document.getElementById('svgContainer');
  container.innerHTML = '';
  const totalW = MAZE_SIZE * CELL + WALL_THICK;
  const totalH = MAZE_SIZE * CELL + WALL_THICK;
  draw = SVG().addTo(container).size(totalW, totalH);

  // Background
  draw.rect(totalW, totalH).fill(COLORS.wallBg).radius(8);

  // Groups (layer order matters)
  pathGroup = draw.group();
  trailGroup = draw.group();
  goalGroup = draw.group();
  monsterGroups = [];
  for (let i = 0; i < MONSTER_COUNT; i++) {
    monsterGroups.push(draw.group());
  }
  heroGroup = draw.group();
  wallGroup = draw.group();

  // Draw walls
  for (let r = 0; r < MAZE_SIZE; r++) {
    for (let c = 0; c < MAZE_SIZE; c++) {
      const cell = mazeGrid[r][c];
      const x = c * CELL + WALL_THICK / 2;
      const y = r * CELL + WALL_THICK / 2;

      // Top wall
      if (cell.walls[0]) {
        wallGroup.line(x, y, x + CELL, y)
          .stroke({ width: WALL_THICK, color: COLORS.wall, linecap: 'round' });
      }
      // Right wall
      if (cell.walls[1]) {
        wallGroup.line(x + CELL, y, x + CELL, y + CELL)
          .stroke({ width: WALL_THICK, color: COLORS.wall, linecap: 'round' });
      }
      // Bottom wall
      if (cell.walls[2]) {
        wallGroup.line(x, y + CELL, x + CELL, y + CELL)
          .stroke({ width: WALL_THICK, color: COLORS.wall, linecap: 'round' });
      }
      // Left wall
      if (cell.walls[3]) {
        wallGroup.line(x, y, x, y + CELL)
          .stroke({ width: WALL_THICK, color: COLORS.wall, linecap: 'round' });
      }
    }
  }

  // Draw outer border
  const borderX = WALL_THICK / 2;
  const borderY = WALL_THICK / 2;
  const borderW = MAZE_SIZE * CELL;
  const borderH = MAZE_SIZE * CELL;
  wallGroup.rect(borderW, borderH)
    .fill('none')
    .stroke({ width: WALL_THICK + 1, color: COLORS.wall })
    .move(borderX, borderY);

  // Draw goal (treasure at bottom-right)
  const goalX = (MAZE_SIZE - 1) * CELL + CELL / 2;
  const goalY = (MAZE_SIZE - 1) * CELL + CELL / 2;
  // Glow
  goalGroup.circle(24).fill(COLORS.goalGlow).center(goalX, goalY).opacity(0.5);
  // Treasure box
  goalGroup.rect(14, 12).fill(COLORS.goal).radius(2).center(goalX, goalY);
  goalGroup.rect(14, 4).fill('#d4ac0d').radius(1).center(goalX, goalY - 4);
  // Sparkle
  goalGroup.star(5, 4, 2).fill('#fff').center(goalX - 8, goalY - 8);

  // Draw hero (cute blue character with eyes)
  drawHero();

  // Draw monsters
  for (let i = 0; i < MONSTER_COUNT; i++) {
    drawMonster(i);
  }
}

function drawHero() {
  heroGroup.clear();
  const cx = hero.c * CELL + CELL / 2;
  const cy = hero.r * CELL + CELL / 2;

  // Body
  heroGroup.circle(HERO_SIZE).fill(COLORS.hero).center(cx, cy);
  // Glow ring
  heroGroup.circle(HERO_SIZE + 6).fill('none')
    .stroke({ width: 2, color: COLORS.heroGlow }).center(cx, cy).opacity(0.6);
  // Eyes
  const eyeOff = 3;
  const eyeY = cy - 2;
  heroGroup.circle(4).fill('#fff').center(cx - eyeOff, eyeY);
  heroGroup.circle(4).fill('#fff').center(cx + eyeOff, eyeY);
  heroGroup.circle(2).fill('#2c3e50').center(cx - eyeOff, eyeY);
  heroGroup.circle(2).fill('#2c3e50').center(cx + eyeOff, eyeY);
  // Smile
  heroGroup.path(`M ${cx-4} ${cy+3} Q ${cx} ${cy+6} ${cx+4} ${cy+3}`)
    .fill('none').stroke({ width: 1.5, color: '#fff', linecap: 'round' });
}

function drawMonster(idx) {
  const g = monsterGroups[idx];
  g.clear();
  const m = monsters[idx];
  const cx = m.c * CELL + CELL / 2;
  const cy = m.r * CELL + CELL / 2;

  // Body (round monster)
  g.circle(MONSTER_SIZE).fill(COLORS.monster).center(cx, cy);
  // Wiggle animation offset
  const wiggle = Math.sin(animFrame * 0.1 + m.animOffset) * 2;

  // Eyes (big and googly)
  const eyeOff = 4;
  const eyeY = cy - 3 + wiggle * 0.3;
  g.ellipse(6, 7).fill(COLORS.monsterEye).center(cx - eyeOff, eyeY);
  g.ellipse(6, 7).fill(COLORS.monsterEye).center(cx + eyeOff, eyeY);
  // Pupils (looking at hero)
  const dx = hero.c - m.c;
  const dy = hero.r - m.r;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const px = (dx / dist) * 1.5;
  const py = (dy / dist) * 1.5;
  g.circle(3).fill(COLORS.monsterPupil).center(cx - eyeOff + px, eyeY + py);
  g.circle(3).fill(COLORS.monsterPupil).center(cx + eyeOff + px, eyeY + py);

  // Mouth (silly grin)
  g.path(`M ${cx-5} ${cy+3} Q ${cx} ${cy+${7+wiggle*0.2}} ${cx+5} ${cy+3}`)
    .fill('none').stroke({ width: 1.5, color: '#fff', linecap: 'round' });
  // Little horns
  g.polygon(`${cx-6},${cy-8} ${cx-4},${cy-12} ${cx-2},${cy-8}`).fill('#c0392b');
  g.polygon(`${cx+2},${cy-8} ${cx+4},${cy-12} ${cx+6},${cy-8}`).fill('#c0392b');
}

// --- Trail Effect ------------------------------------------------
function addTrailDot(r, c) {
  const cx = c * CELL + CELL / 2;
  const cy = r * CELL + CELL / 2;
  const dot = trailGroup.circle(5).fill(COLORS.trail).center(cx, cy).opacity(0.7);
  trailDots.push({ el: dot, life: 1.0 });
}

function updateTrail(dt) {
  for (let i = trailDots.length - 1; i >= 0; i--) {
    const t = trailDots[i];
    t.life -= dt * 0.8;
    t.el.opacity(Math.max(0, t.life * 0.7));
    if (t.life <= 0) {
      t.el.remove();
      trailDots.splice(i, 1);
    }
  }
}

// --- Monster Movement -------------------------------------------
function updateMonsters(dt) {
  const dirs = [
    [-1, 0, 0], [0, 1, 1], [1, 0, 2], [0, -1, 3]
  ];

  for (let i = 0; i < monsters.length; i++) {
    const m = monsters[i];
    m.moveProgress += MONSTER_SPEED * dt;

    if (m.moveProgress >= 1) {
      // Arrived at target, pick new direction
      m.r = m.targetR;
      m.c = m.targetC;
      m.moveProgress = 0;

      // Find valid moves
      const valid = [];
      for (const [dr, dc, wi] of dirs) {
        if (!mazeGrid[m.r][m.c].walls[wi]) {
          const nr = m.r + dr;
          const nc = m.c + dc;
          if (nr >= 0 && nr < MAZE_SIZE && nc >= 0 && nc < MAZE_SIZE) {
            valid.push({ dr, dc, nr, nc, wi });
          }
        }
      }

      if (valid.length > 0) {
        // Prefer moving toward hero (simple chase AI)
        let best = valid[Math.floor(Math.random() * valid.length)];
        let bestDist = Infinity;
        for (const v of valid) {
          const dist = Math.abs(v.nr - hero.r) + Math.abs(v.nc - hero.c);
          if (dist < bestDist && Math.random() > 0.3) {
            bestDist = dist;
            best = v;
          }
        }
        m.targetR = best.nr;
        m.targetC = best.nc;
        m.moveDir = best.wi;
      }
    }

    // Interpolate position for smooth animation
    const t = m.moveProgress;
    const currX = m.c * CELL + CELL / 2;
    const currY = m.r * CELL + CELL / 2;
    const nextX = m.targetC * CELL + CELL / 2;
    const nextY = m.targetR * CELL + CELL / 2;
    const drawX = currX + (nextX - currX) * t;
    const drawY = currY + (nextY - currY) * t;

    // Update monster SVG position
    const g = monsterGroups[i];
    g.clear();

    // Body
    g.circle(MONSTER_SIZE).fill(COLORS.monster).center(drawX, drawY);
    const wiggle = Math.sin(animFrame * 0.15 + m.animOffset) * 2;

    // Eyes
    const eyeOff = 4;
    const eyeY = drawY - 3 + wiggle * 0.3;
    g.ellipse(6, 7).fill(COLORS.monsterEye).center(drawX - eyeOff, eyeY);
    g.ellipse(6, 7).fill(COLORS.monsterEye).center(drawX + eyeOff, eyeY);

    // Pupils tracking hero
    const dx = hero.c - m.c;
    const dy = hero.r - m.r;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const px = (dx / dist) * 1.5;
    const py = (dy / dist) * 1.5;
    g.circle(3).fill(COLORS.monsterPupil).center(drawX - eyeOff + px, eyeY + py);
    g.circle(3).fill(COLORS.monsterPupil).center(drawX + eyeOff + px, eyeY + py);

    // Mouth
    g.path(`M ${drawX-5} ${drawY+3} Q ${drawX} ${drawY+7+wiggle*0.2} ${drawX+5} ${drawY+3}`)
      .fill('none').stroke({ width: 1.5, color: '#fff', linecap: 'round' });
    // Horns
    g.polygon(`${drawX-6},${drawY-8} ${drawX-4},${drawY-12} ${drawX-2},${drawY-8}`).fill('#c0392b');
    g.polygon(`${drawX+2},${drawY-8} ${drawX+4},${drawY-12} ${drawX+6},${drawY-8}`).fill('#c0392b');

    // Check collision with hero
    const hcx = hero.c * CELL + CELL / 2;
    const hcy = hero.r * CELL + CELL / 2;
    const mDist = Math.sqrt((drawX - hcx) ** 2 + (drawY - hcy) ** 2);
    if (mDist < (HERO_SIZE + MONSTER_SIZE) / 2 - 2) {
      gameOver();
    }
  }
}

// --- Hero Movement ------------------------------------------------
function moveHero(dr, dc) {
  if (gameState !== 'playing') return;

  const wi = dr === -1 ? 0 : dr === 1 ? 2 : dc === 1 ? 1 : 3;
  if (mazeGrid[hero.r][hero.c].walls[wi]) return; // blocked by wall

  const nr = hero.r + dr;
  const nc = hero.c + dc;
  if (nr < 0 || nr >= MAZE_SIZE || nc < 0 || nc >= MAZE_SIZE) return;

  hero.r = nr;
  hero.c = nc;
  drawHero();

  // Add trail dot
  addTrailDot(hero.r, hero.c);

  // Check win
  if (hero.r === MAZE_SIZE - 1 && hero.c === MAZE_SIZE - 1) {
    winGame();
  }
}

// --- Game Over / Win ----------------------------------------------
function gameOver() {
  gameState = 'lost';
  document.getElementById('gameOverOverlay').classList.add('active');
}

function winGame() {
  gameState = 'won';
  document.getElementById('winOverlay').classList.add('active');

  // Confetti
  const wrap = document.getElementById('gameWrap');
  const colors = ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#e67e22', '#9b59b6', '#1abc9c'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = (10 + Math.random() * 80) + '%';
    el.style.top = (10 + Math.random() * 30) + '%';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = (Math.random() * 0.6) + 's';
    el.style.animationDuration = (1.5 + Math.random()) + 's';
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
}

// --- Show Solution -----------------------------------------------
function showSolution() {
  pathGroup.clear();
  const path = findPath(mazeGrid, MAZE_SIZE, { r: 0, c: 0 }, { r: MAZE_SIZE - 1, c: MAZE_SIZE - 1 });

  for (let i = 0; i < path.length; i++) {
    const p = path[i];
    const cx = p.c * CELL + CELL / 2;
    const cy = p.r * CELL + CELL / 2;
    pathGroup.circle(10).fill(COLORS.path).center(cx, cy).opacity(0.4);
  }

  // Draw connecting lines
  for (let i = 0; i < path.length - 1; i++) {
    const p1 = path[i];
    const p2 = path[i + 1];
    const x1 = p1.c * CELL + CELL / 2;
    const y1 = p1.r * CELL + CELL / 2;
    const x2 = p2.c * CELL + CELL / 2;
    const y2 = p2.r * CELL + CELL / 2;
    pathGroup.line(x1, y1, x2, y2)
      .stroke({ width: 6, color: COLORS.path, linecap: 'round', opacity: 0.3 });
  }

  // Auto-hide after 3 seconds
  setTimeout(() => pathGroup.clear(), 3000);
}

// --- Input Handling -----------------------------------------------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (gameState !== 'playing') return;
  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W': moveHero(-1, 0); break;
    case 'ArrowDown': case 's': case 'S': moveHero(1, 0); break;
    case 'ArrowLeft': case 'a': case 'A': moveHero(0, -1); break;
    case 'ArrowRight': case 'd': case 'D': moveHero(0, 1); break;
  }
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// Button handlers
document.getElementById('newMazeBtn').addEventListener('click', initGame);
document.getElementById('showSolutionBtn').addEventListener('click', showSolution);
document.getElementById('retryBtn').addEventListener('click', initGame);
document.getElementById('nextMazeBtn').addEventListener('click', initGame);

// --- Main Game Loop -----------------------------------------------
function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (gameState === 'playing') {
    animFrame++;

    // Trail timer
    trailTimer += dt;
    if (trailTimer >= TRAIL_INTERVAL) {
      trailTimer = 0;
      // Only add trail if hero moved recently (simplified: always add while "active")
      // In this version we add on move, so this is for continuous standing
    }

    updateTrail(dt);
    updateMonsters(dt);
  }

  requestAnimationFrame(gameLoop);
}

// --- Start Game ---------------------------------------------------
initGame();
requestAnimationFrame(gameLoop);
</script>
