<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 Bunny's Maze Adventure!</title>

<!-- SVG.js library for all drawing -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js"></script>

<!-- Playful rounded fonts for a kindergarten feel -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ═══════════════════════════════════════════════════
     GLOBAL THEME — Soft pastel candy-land aesthetic
     Rounded shapes, warm colors, child-safe & joyful
     ═══════════════════════════════════════════════════ */
  :root {
    --bg: #fef6e8;            /* warm cream background */
    --bg2: #fff8f0;
    --pink: #ff7eb3;
    --coral: #ff6b6b;
    --mint: #7edab9;
    --sky: #74c0fc;
    --lilac: #b197fc;
    --sunny: #ffd43b;
    --peach: #ffa07a;
    --wall: #a0d8c0;          /* soft green maze walls */
    --wall-stroke: #6bb89c;
    --floor: #fffdf5;         /* maze floor color */
    --text: #5a4e3c;
    --text2: #8a7e6c;
    --shadow: rgba(90, 78, 60, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    background: var(--bg);
    /* Subtle polka-dot pattern for playful texture */
    background-image:
      radial-gradient(circle, rgba(255,126,179,0.08) 1px, transparent 1px),
      radial-gradient(circle, rgba(126,218,185,0.08) 1px, transparent 1px);
    background-size: 30px 30px, 20px 20px;
    background-position: 0 0, 10px 10px;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
  }

  /* ═══════ Top Header Bar ═══════ */
  #header {
    width: 100%;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #fff0e6, #fce4ec, #e8f5e9, #e3f2fd);
    border-bottom: 3px solid rgba(255,126,179,0.2);
    flex-wrap: wrap;
  }

  .title {
    font-family: 'Baloo 2', cursive;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, var(--coral), var(--pink), var(--lilac), var(--sky));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 2px 4px rgba(255,107,107,0.15));
  }

  .btn {
    height: 42px;
    padding: 0 22px;
    border: none;
    border-radius: 21px;
    font-family: 'Baloo 2', cursive;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
    letter-spacing: 0.5px;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .btn-pink {
    background: linear-gradient(135deg, #ff7eb3, #ff6b9d);
    color: #fff;
    box-shadow: 0 4px 14px rgba(255,126,179,0.35);
  }
  .btn-pink:hover { box-shadow: 0 6px 20px rgba(255,126,179,0.45); }

  .btn-mint {
    background: linear-gradient(135deg, #7edab9, #5ec8a0);
    color: #fff;
    box-shadow: 0 4px 14px rgba(126,218,185,0.35);
  }

  .btn-sky {
    background: linear-gradient(135deg, #74c0fc, #5ba8e8);
    color: #fff;
    box-shadow: 0 4px 14px rgba(116,192,252,0.35);
  }

  .btn-sunny {
    background: linear-gradient(135deg, #ffd43b, #fcc419);
    color: #5a4e3c;
    box-shadow: 0 4px 14px rgba(255,212,59,0.35);
  }

  .stat-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: #fff;
    border-radius: 20px;
    font-family: 'Baloo 2', cursive;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 2px 8px var(--shadow);
    color: var(--text);
  }
  .stat-badge .emoji { font-size: 20px; }

  /* ═══════ Game Area ═══════ */
  #game-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    position: relative;
  }

  #maze-container {
    border-radius: 18px;
    box-shadow: 0 8px 40px rgba(90,78,60,0.12), 0 2px 10px rgba(90,78,60,0.08);
    overflow: hidden;
    position: relative;
    background: var(--floor);
  }

  /* ═══════ Overlays ═══════ */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    animation: fadeIn 0.3s ease;
  }
  .overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Caught overlay — friendly, not scary */
  #caught-overlay {
    background: rgba(255, 240, 230, 0.92);
    backdrop-filter: blur(6px);
  }
  .caught-emoji { font-size: 72px; animation: wobble 0.6s ease infinite alternate; }
  @keyframes wobble { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  .caught-title {
    font-family: 'Baloo 2', cursive;
    font-size: 32px;
    font-weight: 800;
    color: var(--coral);
  }
  .caught-sub {
    font-size: 16px;
    color: var(--text2);
    text-align: center;
  }

  /* Win overlay */
  #win-overlay {
    background: rgba(240, 255, 245, 0.92);
    backdrop-filter: blur(6px);
  }
  .win-emoji {
    font-size: 72px;
    animation: bounce 0.5s ease infinite alternate;
  }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  .win-title {
    font-family: 'Baloo 2', cursive;
    font-size: 36px;
    font-weight: 800;
    color: var(--mint);
  }
  .win-sub { font-size: 16px; color: var(--text2); }

  /* Mobile D-Pad */
  #dpad {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    z-index: 500;
  }
  @media (max-width: 800px), (pointer: coarse) {
    #dpad { display: grid; }
  }
  #dpad {
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 4px;
  }
  .dpad-btn {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    border: none;
    font-size: 24px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 3px 10px var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .dpad-btn:active { transform: scale(0.9); background: var(--pink); }
  .dpad-empty { visibility: hidden; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════
     HEADER — Title, controls, and stats
     ═══════════════════════════════════════════════ -->
<div id="header">
  <span class="title">🐰 Bunny's Maze Adventure</span>
  <button class="btn btn-pink" onclick="newGame()">🔄 New Maze</button>
  <button class="btn btn-sky" onclick="toggleSolution()">🗺️ Show Path</button>
  <div class="stat-badge"><span class="emoji">⭐</span><span id="score-display">0</span></div>
  <div class="stat-badge"><span class="emoji">👣</span><span id="steps-display">0</span></div>
</div>

<!-- ═══════════════════════════════════════════════
     GAME AREA — SVG maze is drawn here by SVG.js
     ═══════════════════════════════════════════════ -->
<div id="game-area">
  <div id="maze-container"></div>
</div>

<!-- ═══════════════════════════════════════════════
     CAUGHT OVERLAY — Shown when a monster gets you
     Friendly tone: "Oh no!" not "Game Over"
     ═══════════════════════════════════════════════ -->
<div class="overlay" id="caught-overlay">
  <div class="caught-emoji">🙀</div>
  <div class="caught-title">Oh No, Caught!</div>
  <div class="caught-sub">The silly monster found you!<br>Let's try again — you can do it!</div>
  <button class="btn btn-pink" onclick="restartAfterCaught()" style="margin-top:8px;">🔄 Try Again!</button>
</div>

<!-- ═══════════════════════════════════════════════
     WIN OVERLAY — Shown when the hero reaches the goal
     ═══════════════════════════════════════════════ -->
<div class="overlay" id="win-overlay">
  <div class="win-emoji">🎉</div>
  <div class="win-title">Yay, You Did It!</div>
  <div class="win-sub" id="win-msg">Amazing job, little explorer!</div>
  <button class="btn btn-mint" onclick="newGame()" style="margin-top:8px;">🌟 Play Again!</button>
</div>

<!-- ═══════════════════════════════════════════════
     MOBILE D-PAD — Touch controls for tablets/phones
     ═══════════════════════════════════════════════ -->
<div id="dpad">
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="moveHero(0,-1);event.preventDefault();" onclick="moveHero(0,-1)">⬆️</button>
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="moveHero(-1,0);event.preventDefault();" onclick="moveHero(-1,0)">⬅️</button>
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="moveHero(1,0);event.preventDefault();" onclick="moveHero(1,0)">➡️</button>
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="moveHero(0,1);event.preventDefault();" onclick="moveHero(0,1)">⬇️</button>
  <div class="dpad-empty"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     GAME ENGINE — All logic in one <script> block
     ═══════════════════════════════════════════════════════════ -->
<script>
// ┌──────────────────────────────────────────────────┐
// │  CONFIGURATION CONSTANTS                         │
// │  Easy to tweak for difficulty or appearance.      │
// └──────────────────────────────────────────────────┘
const COLS = 20;             // Maze width in cells
const ROWS = 20;             // Maze height in cells
const CELL = 30;             // Pixel size of each cell
const WALL_W = 3;            // Wall line thickness
const NUM_MONSTERS = 4;      // How many monsters roam the maze
const MONSTER_SPEED = 380;   // Milliseconds between monster moves (higher = slower)
const TRAIL_INTERVAL = 120;  // Milliseconds between trail dots while moving

// Computed board pixel dimensions
const BOARD_W = COLS * CELL;
const BOARD_H = ROWS * CELL;

// ┌──────────────────────────────────────────────────┐
// │  GAME STATE VARIABLES                            │
// └──────────────────────────────────────────────────┘
let draw;                 // SVG.js canvas instance
let maze = [];            // 2D array of cell objects (walls, visited flag)
let hero = { r: 0, c: 0 };  // Hero's current row and column
let heroGroup;            // SVG group for the hero character
let monsters = [];        // Array of monster objects { r, c, group, dir }
let solutionPath = [];    // BFS-computed shortest path from start to goal
let solutionShown = false;// Whether the solution is currently visible
let solutionGroup;        // SVG group holding solution path dots
let trailGroup;           // SVG group holding the hero's footprint trail
let wallGroup;            // SVG group holding all wall lines
let floorGroup;           // SVG group for floor decorations
let monsterTimer = null;  // setInterval ID for monster movement
let trailTimer = null;    // setInterval ID for hero trail dots
let isMoving = false;     // True while hero is between moves (prevents key spam)
let gameOver = false;     // True when caught or won
let steps = 0;            // Step counter
let score = 0;            // Running score across games
let heroFacing = 'right'; // Which direction the hero faces (for cute flip)

// ┌──────────────────────────────────────────────────┐
// │  PRETTY COLORS — used for trail, decorations     │
// └──────────────────────────────────────────────────┘
const RAINBOW = ['#ff7eb3','#ff6b6b','#ffa07a','#ffd43b','#7edab9','#74c0fc','#b197fc'];
let rainbowIdx = 0;  // Cycles through rainbow for trail dots

// ┌──────────────────────────────────────────────────────────┐
// │  MAZE GENERATION — Recursive Backtracker (DFS)           │
// │                                                          │
// │  This algorithm guarantees a perfect maze: exactly one   │
// │  path between any two cells, so a solution always exists.│
// │                                                          │
// │  Each cell starts with all 4 walls. We walk randomly,    │
// │  removing the wall between the current cell and the next │
// │  unvisited neighbor. If stuck, we backtrack.             │
// └──────────────────────────────────────────────────────────┘

/**
 * Create a fresh 2D grid of cells, each with 4 walls intact.
 * Cell format: { top: true, right: true, bottom: true, left: true, visited: false }
 */
function createGrid() {
  maze = [];
  for (let r = 0; r < ROWS; r++) {
    maze[r] = [];
    for (let c = 0; c < COLS; c++) {
      maze[r][c] = { top: true, right: true, bottom: true, left: true, visited: false };
    }
  }
}

/**
 * Generate a perfect maze using iterative DFS with an explicit stack.
 * Starts at (0,0) and carves passages randomly.
 */
function generateMaze() {
  createGrid();

  // Direction vectors: [row delta, col delta, wall-to-remove-on-current, wall-to-remove-on-neighbor]
  const dirs = [
    [-1, 0, 'top',    'bottom'],  // Up
    [ 1, 0, 'bottom', 'top'   ],  // Down
    [ 0,-1, 'left',   'right' ],  // Left
    [ 0, 1, 'right',  'left'  ],  // Right
  ];

  // Iterative DFS with explicit stack (avoids recursion stack overflow on large grids)
  const stack = [];
  let r = 0, c = 0;
  maze[r][c].visited = true;
  stack.push([r, c]);

  while (stack.length > 0) {
    // Find all unvisited neighbors of current cell
    const neighbors = [];
    for (const [dr, dc, wallCur, wallNb] of dirs) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !maze[nr][nc].visited) {
        neighbors.push({ nr, nc, wallCur, wallNb });
      }
    }

    if (neighbors.length > 0) {
      // Pick a random unvisited neighbor
      const pick = neighbors[Math.floor(Math.random() * neighbors.length)];
      // Remove the wall between current cell and chosen neighbor
      maze[r][c][pick.wallCur] = false;
      maze[pick.nr][pick.nc][pick.wallNb] = false;
      // Mark neighbor as visited, push current to stack, move to neighbor
      maze[pick.nr][pick.nc].visited = true;
      stack.push([r, c]);
      r = pick.nr;
      c = pick.nc;
    } else {
      // Dead end — backtrack by popping from stack
      const prev = stack.pop();
      r = prev[0];
      c = prev[1];
    }
  }
}

// ┌──────────────────────────────────────────────────────────┐
// │  BFS SOLUTION FINDER                                    │
// │                                                          │
// │  Breadth-first search from (0,0) to (ROWS-1, COLS-1).   │
// │  Respects maze walls — only traverses open passages.     │
// │  Guarantees the shortest path in an unweighted maze.     │
// └──────────────────────────────────────────────────────────┘
function solveMaze() {
  // parent[r][c] stores which cell we came from — used to reconstruct the path
  const parent = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const visited = Array.from({ length: ROWS }, () => Array(COLS).fill(false));

  const queue = [[0, 0]];
  visited[0][0] = true;
  parent[0][0] = [-1, -1]; // sentinel for start

  // Direction: [dr, dc, wall that must be open on current cell]
  const dirs = [
    [-1, 0, 'top'],
    [ 1, 0, 'bottom'],
    [ 0,-1, 'left'],
    [ 0, 1, 'right'],
  ];

  while (queue.length > 0) {
    const [r, c] = queue.shift();

    // Reached the goal?
    if (r === ROWS - 1 && c === COLS - 1) break;

    for (const [dr, dc, wall] of dirs) {
      const nr = r + dr, nc = c + dc;
      // Check bounds, not visited, and no wall blocking
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS
          && !visited[nr][nc] && !maze[r][c][wall]) {
        visited[nr][nc] = true;
        parent[nr][nc] = [r, c];
        queue.push([nr, nc]);
      }
    }
  }

  // Reconstruct path from goal back to start
  const path = [];
  let cr = ROWS - 1, cc = COLS - 1;
  while (cr !== -1 && cc !== -1) {
    path.unshift([cr, cc]);
    const p = parent[cr][cc];
    if (!p) break;
    cr = p[0];
    cc = p[1];
  }
  return path;
}

// ┌──────────────────────────────────────────────────────────┐
// │  SVG DRAWING — Renders the maze, hero, monsters, etc.   │
// │  All visuals use SVG.js (no canvas, no DOM hacks).       │
// └──────────────────────────────────────────────────────────┘

/**
 * Initialize or re-initialize the entire SVG canvas and game visuals.
 */
function initSVG() {
  // Clear any previous SVG
  const container = document.getElementById('maze-container');
  container.innerHTML = '';
  container.style.width = BOARD_W + 'px';
  container.style.height = BOARD_H + 'px';

  // Create SVG.js drawing surface
  draw = SVG().addTo('#maze-container').size(BOARD_W, BOARD_H);

  // ── Layer groups (back to front ordering) ──
  floorGroup    = draw.group();   // Floor tiles and decorations
  trailGroup    = draw.group();   // Hero's rainbow trail
  solutionGroup = draw.group();   // Solution path (hidden by default)
  wallGroup     = draw.group();   // Maze walls (drawn on top of floor)
  // Monsters and hero added later so they're on top
}

/**
 * Draw the maze floor as soft colored tiles.
 * Some tiles get small decorative stars/hearts for visual interest.
 */
function drawFloor() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL, y = r * CELL;
      // Alternate subtle checkerboard tint for depth
      const tint = (r + c) % 2 === 0 ? '#fffef8' : '#fff9ee';
      floorGroup.rect(CELL, CELL).move(x, y).fill(tint).stroke('none');

      // Scatter tiny decorative shapes on ~8% of floor tiles
      if (Math.random() < 0.08) {
        const cx = x + CELL / 2, cy = y + CELL / 2;
        const shapes = ['⭐', '💛', '🌸', '✿', '♡'];
        const pick = shapes[Math.floor(Math.random() * shapes.length)];
        floorGroup.text(pick)
          .font({ size: 8 + Math.random() * 4 })
          .center(cx + (Math.random() - 0.5) * 8, cy + (Math.random() - 0.5) * 8)
          .opacity(0.25);
      }
    }
  }

  // Start cell highlight — soft green glow
  floorGroup.rect(CELL - 4, CELL - 4)
    .move(2, 2).radius(6)
    .fill('#d4f5e9').stroke({ color: '#7edab9', width: 1.5 });
  floorGroup.text('🏠').font({ size: 12 }).center(CELL / 2, CELL / 2);

  // Goal cell highlight — golden glow
  const gx = (COLS - 1) * CELL, gy = (ROWS - 1) * CELL;
  floorGroup.rect(CELL - 4, CELL - 4)
    .move(gx + 2, gy + 2).radius(6)
    .fill('#fff3d4').stroke({ color: '#ffd43b', width: 1.5 });
  floorGroup.text('⭐').font({ size: 14 }).center(gx + CELL / 2, gy + CELL / 2);

  // Pulsing animation on the goal star
  const goalPulse = floorGroup.circle(CELL * 0.7)
    .center(gx + CELL / 2, gy + CELL / 2)
    .fill('none').stroke({ color: '#ffd43b', width: 1 }).opacity(0.5);
  goalPulse.animate({ duration: 1200, swing: true, times: Infinity })
    .attr({ r: CELL * 0.5 }).opacity(0.1);
}

/**
 * Draw all maze walls as SVG lines.
 * We draw each cell's top and left walls (plus the border edges)
 * to avoid duplicate lines.
 */
function drawWalls() {
  const sc = '#8dc5ae';  // Soft green wall color
  const sw = WALL_W;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * CELL, y = r * CELL;
      const cell = maze[r][c];

      // Top wall
      if (cell.top) {
        wallGroup.line(x, y, x + CELL, y)
          .stroke({ color: sc, width: sw, linecap: 'round' });
      }
      // Left wall
      if (cell.left) {
        wallGroup.line(x, y, x, y + CELL)
          .stroke({ color: sc, width: sw, linecap: 'round' });
      }
    }
  }
  // Draw the right border and bottom border of the entire maze
  for (let r = 0; r < ROWS; r++) {
    if (maze[r][COLS - 1].right) {
      wallGroup.line(BOARD_W, r * CELL, BOARD_W, r * CELL + CELL)
        .stroke({ color: sc, width: sw, linecap: 'round' });
    }
  }
  for (let c = 0; c < COLS; c++) {
    if (maze[ROWS - 1][c].bottom) {
      wallGroup.line(c * CELL, BOARD_H, c * CELL + CELL, BOARD_H)
        .stroke({ color: sc, width: sw, linecap: 'round' });
    }
  }
}

// ┌──────────────────────────────────────────────────┐
// │  HERO DRAWING — A cute bunny face made of shapes │
// └──────────────────────────────────────────────────┘
function drawHero() {
  if (heroGroup) heroGroup.remove();
  heroGroup = draw.group();

  const cx = hero.c * CELL + CELL / 2;
  const cy = hero.r * CELL + CELL / 2;
  const sz = CELL * 0.38; // Body radius

  // Body glow
  const glow = draw.gradient('radial', function(add) {
    add.stop(0, '#ffcce0').opacity(0.5);
    add.stop(1, '#ffcce0').opacity(0);
  });
  heroGroup.circle(sz * 4).center(cx, cy).fill(glow);

  // Left ear
  heroGroup.ellipse(sz * 0.55, sz * 1.3)
    .center(cx - sz * 0.45, cy - sz * 1.35)
    .fill('#ffb6d3').stroke({ color: '#ff8ab5', width: 1 });
  // Inner left ear
  heroGroup.ellipse(sz * 0.3, sz * 0.9)
    .center(cx - sz * 0.45, cy - sz * 1.25)
    .fill('#ffd4e8');

  // Right ear
  heroGroup.ellipse(sz * 0.55, sz * 1.3)
    .center(cx + sz * 0.45, cy - sz * 1.35)
    .fill('#ffb6d3').stroke({ color: '#ff8ab5', width: 1 });
  // Inner right ear
  heroGroup.ellipse(sz * 0.3, sz * 0.9)
    .center(cx + sz * 0.45, cy - sz * 1.25)
    .fill('#ffd4e8');

  // Main body circle (head)
  heroGroup.circle(sz * 2).center(cx, cy)
    .fill('#ffcce0').stroke({ color: '#ff8ab5', width: 1.5 });

  // Eyes — big cute eyes
  heroGroup.circle(sz * 0.45).center(cx - sz * 0.38, cy - sz * 0.15)
    .fill('#3d3530');
  heroGroup.circle(sz * 0.18).center(cx - sz * 0.3, cy - sz * 0.28)
    .fill('#fff'); // Eye shine

  heroGroup.circle(sz * 0.45).center(cx + sz * 0.38, cy - sz * 0.15)
    .fill('#3d3530');
  heroGroup.circle(sz * 0.18).center(cx + sz * 0.46, cy - sz * 0.28)
    .fill('#fff'); // Eye shine

  // Nose — tiny pink triangle
  heroGroup.circle(sz * 0.2).center(cx, cy + sz * 0.15).fill('#ff8ab5');

  // Mouth — small smile
  heroGroup.path(`M ${cx - sz * 0.2} ${cy + sz * 0.35} Q ${cx} ${cy + sz * 0.55} ${cx + sz * 0.2} ${cy + sz * 0.35}`)
    .fill('none').stroke({ color: '#ff8ab5', width: 1, linecap: 'round' });

  // Cheek blush — soft pink circles
  heroGroup.circle(sz * 0.3).center(cx - sz * 0.65, cy + sz * 0.15)
    .fill('#ffb0c8').opacity(0.4);
  heroGroup.circle(sz * 0.3).center(cx + sz * 0.65, cy + sz * 0.15)
    .fill('#ffb0c8').opacity(0.4);

  // Gentle idle bounce animation
  heroGroup.animate({ duration: 600, swing: true, times: Infinity })
    .dy(-2).animate({ duration: 600, swing: true }).dy(2);
}

// ┌──────────────────────────────────────────────────┐
// │  MONSTER DRAWING — Friendly blob creatures       │
// │  Each has its own color, googly eyes, and wiggle │
// └──────────────────────────────────────────────────┘
const MONSTER_COLORS = [
  { body: '#b197fc', eye: '#7c5cbf', name: 'Lilac' },
  { body: '#74c0fc', eye: '#4a9ad4', name: 'Sky'   },
  { body: '#ffd43b', eye: '#d4a017', name: 'Sunny' },
  { body: '#ff7eb3', eye: '#d4507a', name: 'Coral' },
  { body: '#7edab9', eye: '#4ab890', name: 'Mint'  },
  { body: '#ffa07a', eye: '#d4705a', name: 'Peach' },
];

/**
 * Place a given number of monsters at random positions far from the hero.
 * Each monster gets a unique color and cute face.
 */
function spawnMonsters() {
  // Clear old monsters
  monsters.forEach(m => { if (m.group) m.group.remove(); });
  monsters = [];

  for (let i = 0; i < NUM_MONSTERS; i++) {
    let mr, mc;
    // Place at least 8 cells away from the hero (Manhattan distance)
    do {
      mr = Math.floor(Math.random() * ROWS);
      mc = Math.floor(Math.random() * COLS);
    } while ((Math.abs(mr - hero.r) + Math.abs(mc - hero.c)) < 8);

    const color = MONSTER_COLORS[i % MONSTER_COLORS.length];
    const m = { r: mr, c: mc, group: null, color, dir: Math.floor(Math.random() * 4) };
    m.group = drawMonster(m);
    monsters.push(m);
  }
}

/**
 * Draw a single cute blob monster at its current position.
 * Returns the SVG group.
 */
function drawMonster(m) {
  const g = draw.group();
  const cx = m.c * CELL + CELL / 2;
  const cy = m.r * CELL + CELL / 2;
  const sz = CELL * 0.36;

  // Body — rounded blob shape using an ellipse
  g.ellipse(sz * 2.2, sz * 2)
    .center(cx, cy + sz * 0.1)
    .fill(m.color.body)
    .stroke({ color: m.color.eye, width: 1 });

  // Small feet / tentacles — two little bumps at bottom
  g.circle(sz * 0.4).center(cx - sz * 0.45, cy + sz * 0.7).fill(m.color.body);
  g.circle(sz * 0.4).center(cx + sz * 0.45, cy + sz * 0.7).fill(m.color.body);

  // Eyes — big googly eyes
  // Left eye white
  g.circle(sz * 0.6).center(cx - sz * 0.35, cy - sz * 0.15).fill('#fff');
  // Left pupil
  g.circle(sz * 0.32).center(cx - sz * 0.3, cy - sz * 0.1).fill(m.color.eye);
  g.circle(sz * 0.12).center(cx - sz * 0.22, cy - sz * 0.2).fill('#fff');

  // Right eye white
  g.circle(sz * 0.6).center(cx + sz * 0.35, cy - sz * 0.15).fill('#fff');
  // Right pupil
  g.circle(sz * 0.32).center(cx + sz * 0.4, cy - sz * 0.1).fill(m.color.eye);
  g.circle(sz * 0.12).center(cx + sz * 0.48, cy - sz * 0.2).fill('#fff');

  // Mouth — silly open mouth
  g.ellipse(sz * 0.5, sz * 0.3).center(cx, cy + sz * 0.45)
    .fill('#fff').stroke({ color: m.color.eye, width: 0.8 });

  // Wiggle animation — makes the monster feel alive and silly, not scary
  g.animate({ duration: 300 + Math.random() * 200, swing: true, times: Infinity })
    .rotate(4).animate({ duration: 300 + Math.random() * 200, swing: true }).rotate(-4);

  return g;
}

/**
 * Redraw a monster at its updated position (called after each move).
 */
function updateMonsterVisual(m) {
  if (m.group) m.group.remove();
  m.group = drawMonster(m);
}

// ┌──────────────────────────────────────────────────┐
// │  HERO MOVEMENT + COLLISION DETECTION             │
// │  Checks maze walls before allowing movement.      │
// └──────────────────────────────────────────────────┘

/**
 * Attempt to move the hero by (dc, dr).
 * dc = column delta (-1 left, +1 right), dr = row delta (-1 up, +1 down).
 * Only moves if no wall blocks the path.
 */
function moveHero(dc, dr) {
  if (gameOver || isMoving) return;

  const r = hero.r, c = hero.c;
  const nr = r + dr, nc = c + dc;

  // Bounds check
  if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;

  // Wall check — determine which wall direction to check
  let blocked = false;
  if (dr === -1) blocked = maze[r][c].top;       // Moving up → check top wall
  if (dr ===  1) blocked = maze[r][c].bottom;    // Moving down → check bottom wall
  if (dc === -1) blocked = maze[r][c].left;      // Moving left → check left wall
  if (dc ===  1) blocked = maze[r][c].right;     // Moving right → check right wall

  if (blocked) return; // Wall in the way — can't move

  // Update facing direction (for character flip if needed)
  if (dc === -1) heroFacing = 'left';
  if (dc ===  1) heroFacing = 'right';

  // Move the hero
  isMoving = true;
  hero.r = nr;
  hero.c = nc;
  steps++;
  document.getElementById('steps-display').textContent = steps;

  // Animate the hero sliding to the new cell smoothly
  const targetX = nc * CELL + CELL / 2;
  const targetY = nr * CELL + CELL / 2;

  // Stop any existing animation, then animate to new position
  heroGroup.animate({ duration: 100, ease: '<>' })
    .center(targetX, targetY)
    .after(() => {
      isMoving = false;
      // Check if hero reached the goal
      if (hero.r === ROWS - 1 && hero.c === COLS - 1) {
        winGame();
      }
      // Check monster collision after move
      checkMonsterCollision();
    });
}

// ┌──────────────────────────────────────────────────┐
// │  HERO TRAIL — Rainbow footprint circles          │
// │  Drops colorful dots at regular time intervals   │
// │  while the game is active.                       │
// └──────────────────────────────────────────────────┘
let lastTrailR = -1, lastTrailC = -1;

function startTrailTimer() {
  if (trailTimer) clearInterval(trailTimer);
  trailTimer = setInterval(() => {
    if (gameOver) return;
    // Only drop a dot if the hero has moved to a new cell
    if (hero.r !== lastTrailR || hero.c !== lastTrailC) {
      dropTrailDot(hero.r, hero.c);
      lastTrailR = hero.r;
      lastTrailC = hero.c;
    }
  }, TRAIL_INTERVAL);
}

/**
 * Drop a small rainbow circle at the given cell.
 * The dot fades in with a pop animation.
 */
function dropTrailDot(r, c) {
  const cx = c * CELL + CELL / 2;
  const cy = r * CELL + CELL / 2;
  const color = RAINBOW[rainbowIdx % RAINBOW.length];
  rainbowIdx++;

  const dot = trailGroup.circle(0)
    .center(cx, cy)
    .fill(color)
    .opacity(0.55);

  // Pop-in animation
  dot.animate({ duration: 200, ease: '>' })
    .size(CELL * 0.22, CELL * 0.22)
    .center(cx, cy);
}

// ┌──────────────────────────────────────────────────────────┐
// │  MONSTER AI — Simple random walk through open passages   │
// │                                                          │
// │  Each monster picks a random valid direction each turn.  │
// │  If it can't go that way (wall), it tries others.        │
// │  Friendly & unpredictable — not optimally chasing.       │
// └──────────────────────────────────────────────────────────┘
function startMonsterMovement() {
  if (monsterTimer) clearInterval(monsterTimer);
  monsterTimer = setInterval(() => {
    if (gameOver) return;
    monsters.forEach(m => moveMonster(m));
    checkMonsterCollision();
  }, MONSTER_SPEED);
}

/**
 * Move a single monster one step in a random valid direction.
 * Prefers to continue in its current direction for more natural movement,
 * but picks randomly if the current direction is blocked.
 */
function moveMonster(m) {
  const dirs = [
    { dr: -1, dc:  0, wall: 'top' },
    { dr:  1, dc:  0, wall: 'bottom' },
    { dr:  0, dc: -1, wall: 'left' },
    { dr:  0, dc:  1, wall: 'right' },
  ];

  // Shuffle directions but put current direction first (tendency to keep going)
  const shuffled = [...dirs];
  // Move preferred direction to front
  const prefIdx = shuffled.findIndex((d, i) => i === m.dir);
  if (prefIdx > 0) {
    const [pref] = shuffled.splice(prefIdx, 1);
    shuffled.unshift(pref);
  }
  // Randomly shuffle the rest so movement isn't too predictable
  for (let i = shuffled.length - 1; i > 1; i--) {
    const j = 1 + Math.floor(Math.random() * i);
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  // Try each direction until one works
  for (const d of shuffled) {
    const nr = m.r + d.dr, nc = m.c + d.dc;
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
    if (maze[m.r][m.c][d.wall]) continue; // Wall blocking

    m.r = nr;
    m.c = nc;
    m.dir = dirs.indexOf(d);
    updateMonsterVisual(m);
    return;
  }
  // If completely stuck (shouldn't happen in a perfect maze), stay put
}

/**
 * Check if any monster occupies the same cell as the hero.
 * If so, trigger the "caught" sequence.
 */
function checkMonsterCollision() {
  if (gameOver) return;
  for (const m of monsters) {
    if (m.r === hero.r && m.c === hero.c) {
      gameLost();
      return;
    }
  }
}

// ┌──────────────────────────────────────────────────┐
// │  SOLUTION PATH DISPLAY                           │
// └──────────────────────────────────────────────────┘

/**
 * Toggle the solution path visibility.
 * Draws small golden dots along the BFS shortest path.
 */
function toggleSolution() {
  solutionShown = !solutionShown;

  // Clear previous solution dots
  solutionGroup.clear();

  if (solutionShown) {
    solutionPath = solveMaze();
    solutionPath.forEach(([r, c], i) => {
      const cx = c * CELL + CELL / 2;
      const cy = r * CELL + CELL / 2;
      const dot = solutionGroup.circle(CELL * 0.28)
        .center(cx, cy)
        .fill('#ffd43b')
        .opacity(0)
        .stroke({ color: '#f0c020', width: 0.8 });

      // Staggered fade-in for a nice reveal effect
      dot.delay(i * 15).animate({ duration: 200 }).opacity(0.7);
    });

    // Draw a subtle connecting line through the path
    if (solutionPath.length > 1) {
      const points = solutionPath.map(([r, c]) =>
        [c * CELL + CELL / 2, r * CELL + CELL / 2]
      );
      let pathStr = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 1; i < points.length; i++) {
        pathStr += ` L ${points[i][0]} ${points[i][1]}`;
      }
      solutionGroup.path(pathStr)
        .fill('none')
        .stroke({ color: '#ffd43b', width: 2, dasharray: '4 3', linecap: 'round' })
        .opacity(0.45);
    }
  }
}

// ┌──────────────────────────────────────────────────┐
// │  GAME LIFECYCLE — Start, Win, Lose, Restart      │
// └──────────────────────────────────────────────────┘

/**
 * Start a brand new game: generate maze, reset state, draw everything.
 */
function newGame() {
  // Hide overlays
  document.getElementById('caught-overlay').classList.remove('show');
  document.getElementById('win-overlay').classList.remove('show');

  // Stop old timers
  if (monsterTimer) clearInterval(monsterTimer);
  if (trailTimer) clearInterval(trailTimer);

  // Reset state
  gameOver = false;
  hero.r = 0;
  hero.c = 0;
  steps = 0;
  solutionShown = false;
  rainbowIdx = 0;
  lastTrailR = -1;
  lastTrailC = -1;
  document.getElementById('steps-display').textContent = '0';

  // Generate new random maze (always solvable because it's a perfect maze)
  generateMaze();

  // Initialize SVG and draw all layers
  initSVG();
  drawFloor();
  drawWalls();

  // Draw the hero at start position
  drawHero();

  // Compute and cache the solution (for the Show Path button)
  solutionPath = solveMaze();

  // Spawn cute monsters
  spawnMonsters();

  // Start game loops
  startMonsterMovement();
  startTrailTimer();
}

/**
 * Handle the hero reaching the goal.
 */
function winGame() {
  gameOver = true;
  score++;
  document.getElementById('score-display').textContent = score;
  // Celebration burst on the hero
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const dist = 20 + Math.random() * 15;
    const sx = hero.c * CELL + CELL / 2;
    const sy = hero.r * CELL + CELL / 2;
    const tx = sx + Math.cos(angle) * dist;
    const ty = sy + Math.sin(angle) * dist;
    const emojis = ['⭐', '🌟', '✨', '🎉', '💛'];
    const pick = emojis[Math.floor(Math.random() * emojis.length)];
    const sparkle = draw.text(pick).font({ size: 10 }).center(sx, sy);
    sparkle.animate({ duration: 500, ease: '>' }).center(tx, ty).opacity(0).after(() => sparkle.remove());
  }
  // Show win overlay after a brief celebration
  document.getElementById('win-msg').textContent =
    `You did it in ${steps} steps! Amazing!`;
  setTimeout(() => {
    document.getElementById('win-overlay').classList.add('show');
  }, 600);
}

/**
 * Handle the hero being caught by a monster.
 */
function gameLost() {
  gameOver = true;
  document.getElementById('caught-overlay').classList.add('show');
}

/**
 * Restart the SAME maze after being caught (not a new maze).
 */
function restartAfterCaught() {
  document.getElementById('caught-overlay').classList.remove('show');
  gameOver = false;

  // Reset hero to start
  hero.r = 0;
  hero.c = 0;
  steps = 0;
  lastTrailR = -1;
  lastTrailC = -1;
  document.getElementById('steps-display').textContent = '0';

  // Clear trail
  trailGroup.clear();
  rainbowIdx = 0;

  // Redraw hero at start
  drawHero();

  // Re-spawn monsters at new random positions
  spawnMonsters();

  // Restart timers
  startMonsterMovement();
  startTrailTimer();
}

// ┌──────────────────────────────────────────────────┐
// │  KEYBOARD INPUT — Arrow keys move the hero       │
// └──────────────────────────────────────────────────┘
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':    e.preventDefault(); moveHero(0, -1); break;
    case 'ArrowDown':  e.preventDefault(); moveHero(0,  1); break;
    case 'ArrowLeft':  e.preventDefault(); moveHero(-1, 0); break;
    case 'ArrowRight': e.preventDefault(); moveHero(1,  0); break;
    // WASD support too (some kids use these)
    case 'w': case 'W': moveHero(0, -1); break;
    case 's': case 'S': moveHero(0,  1); break;
    case 'a': case 'A': moveHero(-1, 0); break;
    case 'd': case 'D': moveHero(1,  0); break;
  }
});

// ┌──────────────────────────────────────────────────┐
// │  LAUNCH — Start the first game!                  │
// └──────────────────────────────────────────────────┘
newGame();
</script>
