<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Rainbow Maze Adventure - Kids Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
        }

        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .instructions {
            color: #4ecdc4;
            font-size: 1.2em;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #maze-container {
            display: inline-block;
            border: 5px solid #ffd93d;
            border-radius: 20px;
            background: #f8f9fa;
            padding: 10px;
            position: relative;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
        }

        button {
            background: linear-gradient(45deg, #ff6b6b, #ffd93d);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(-1px);
        }

        .score-display {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .win-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 100;
            display: none;
        }

        .win-message.show {
            display: block;
            animation: popIn 0.5s ease-out;
        }

        @keyframes popIn {
            from {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .win-message h2 {
            color: #ff6b6b;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .emoji-decoration {
            font-size: 2em;
            margin: 0 10px;
            display: inline-block;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .keyboard-hint {
            color: #666;
            font-size: 1.1em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>
            <span class="emoji-decoration">🌟</span>
            Rainbow Maze Adventure
            <span class="emoji-decoration">🌈</span>
        </h1>
        
        <div class="instructions">
            Use arrow keys ⬆️⬇️⬅️➡️ to move the hero to the treasure! 💎
        </div>
        
        <div id="maze-container"></div>
        
        <div class="controls">
            <button onclick="generateNewMaze()">🎲 New Maze</button>
            <button onclick="showSolution()">💡 Show Path</button>
            <div class="score-display">
                Score: <span id="score">0</span> ⭐
            </div>
        </div>

        <div class="keyboard-hint">
            Watch out for the silly monsters! 👾 They love to play tag!
        </div>
        
        <div class="win-message" id="winMessage">
            <h2>🎉 You Won! 🎉</h2>
            <p style="font-size: 1.3em; color: #4ecdc4;">Great job finding the treasure!</p>
            <button onclick="generateNewMaze()" style="margin-top: 20px;">Play Again!</button>
        </div>
    </div>

    <script>
        // Game configuration constants
        const MAZE_SIZE = 20; // 20x20 maze
        const CELL_SIZE = 25; // Size of each cell in pixels
        const WALL_COLOR = '#2c3e50';
        const PATH_COLOR = '#ecf0f1';
        const HERO_COLOR = '#ff6b6b';
        const MONSTER_COLORS = ['#e74c3c', '#9b59b6', '#f39c12'];
        const GOAL_COLOR = '#f1c40f';
        const TRAIL_COLOR = '#3498db';
        const SOLUTION_COLOR = '#2ecc71';

        // Game state variables
        let maze = [];
        let draw = null;
        let hero = null;
        let heroPosition = { x: 0, y: 0 };
        let goalPosition = { x: MAZE_SIZE - 1, y: MAZE_SIZE - 1 };
        let monsters = [];
        let monsterElements = [];
        let trail = [];
        let solutionPath = [];
        let solutionElements = [];
        let score = 0;
        let gameActive = true;
        let lastTrailTime = 0;

        // Initialize the game when page loads
        window.addEventListener('load', () => {
            initGame();
            generateNewMaze();
        });

        // Initialize SVG drawing area and keyboard controls
        function initGame() {
            // Create SVG drawing area
            const container = document.getElementById('maze-container');
            draw = SVG().addTo(container).size(MAZE_SIZE * CELL_SIZE, MAZE_SIZE * CELL_SIZE);
            
            // Set up keyboard controls
            document.addEventListener('keydown', handleKeyPress);
            
            // Start monster movement
            setInterval(moveMonsters, 500); // Monsters move every 500ms
            
            // Start trail creation
            setInterval(createTrail, 200); // Create trail every 200ms
        }

        // Generate a new random maze using recursive backtracking
        function generateNewMaze() {
            // Reset game state
            gameActive = true;
            score = 0;
            updateScore();
            trail = [];
            solutionElements.forEach(el => el.remove());
            solutionElements = [];
            document.getElementById('winMessage').classList.remove('show');
            
            // Initialize maze grid (all walls initially)
            maze = Array(MAZE_SIZE).fill().map(() => 
                Array(MAZE_SIZE).fill().map(() => ({
                    visited: false,
                    walls: { top: true, right: true, bottom: true, left: true }
                }))
            );
            
            // Generate maze using recursive backtracking
            const stack = [];
            let current = { x: 0, y: 0 };
            maze[0][0].visited = true;
            
            while (true) {
                const neighbors = getUnvisitedNeighbors(current);
                
                if (neighbors.length > 0) {
                    // Choose random unvisited neighbor
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    
                    // Remove wall between current and next
                    removeWall(current, next);
                    
                    // Move to next cell
                    stack.push(current);
                    current = next;
                    maze[next.y][next.x].visited = true;
                } else if (stack.length > 0) {
                    // Backtrack
                    current = stack.pop();
                } else {
                    // Maze generation complete
                    break;
                }
            }
            
            // Find solution path using BFS
            findSolutionPath();
            
            // Draw the maze
            drawMaze();
            
            // Create hero at start position
            createHero();
            
            // Create monsters
            createMonsters();
        }

        // Get unvisited neighboring cells
        function getUnvisitedNeighbors(cell) {
            const neighbors = [];
            const directions = [
                { x: 0, y: -1 }, // top
                { x: 1, y: 0 },  // right
                { x: 0, y: 1 },  // bottom
                { x: -1, y: 0 }  // left
            ];
            
            for (const dir of directions) {
                const newX = cell.x + dir.x;
                const newY = cell.y + dir.y;
                
                if (newX >= 0 && newX < MAZE_SIZE && 
                    newY >= 0 && newY < MAZE_SIZE && 
                    !maze[newY][newX].visited) {
                    neighbors.push({ x: newX, y: newY });
                }
            }
            
            return neighbors;
        }

        // Remove wall between two cells
        function removeWall(current, next) {
            const dx = next.x - current.x;
            const dy = next.y - current.y;
            
            if (dx === 1) {
                maze[current.y][current.x].walls.right = false;
                maze[next.y][next.x].walls.left = false;
            } else if (dx === -1) {
                maze[current.y][current.x].walls.left = false;
                maze[next.y][next.x].walls.right = false;
            } else if (dy === 1) {
                maze[current.y][current.x].walls.bottom = false;
                maze[next.y][next.x].walls.top = false;
            } else if (dy === -1) {
                maze[current.y][current.x].walls.top = false;
                maze[next.y][next.x].walls.bottom = false;
            }
        }

        // Draw the maze on SVG canvas
        function drawMaze() {
            // Clear previous maze
            draw.clear();
            
            // Draw background
            draw.rect(MAZE_SIZE * CELL_SIZE, MAZE_SIZE * CELL_SIZE).fill('#ecf0f1');
            
            // Draw cells and walls
            for (let y = 0; y < MAZE_SIZE; y++) {
                for (let x = 0; x < MAZE_SIZE; x++) {
                    const cell = maze[y][x];
                    const px = x * CELL_SIZE;
                    const py = y * CELL_SIZE;
                    
                    // Draw walls
                    if (cell.walls.top) {
                        draw.line(px, py, px + CELL_SIZE, py)
                            .stroke({ width: 3, color: WALL_COLOR, linecap: 'round' });
                    }
                    if (cell.walls.right) {
                        draw.line(px + CELL_SIZE, py, px + CELL_SIZE, py + CELL_SIZE)
                            .stroke({ width: 3, color: WALL_COLOR, linecap: 'round' });
                    }
                    if (cell.walls.bottom) {
                        draw.line(px, py + CELL_SIZE, px + CELL_SIZE, py + CELL_SIZE)
                            .stroke({ width: 3, color: WALL_COLOR, linecap: 'round' });
                    }
                    if (cell.walls.left) {
                        draw.line(px, py, px, py + CELL_SIZE)
                            .stroke({ width: 3, color: WALL_COLOR, linecap: 'round' });
                    }
                }
            }
            
            // Draw goal (treasure)
            const goalX = goalPosition.x * CELL_SIZE + CELL_SIZE / 2;
            const goalY = goalPosition.y * CELL_SIZE + CELL_SIZE / 2;
            
            // Create treasure chest
            const treasureGroup = draw.group();
            
            // Treasure glow effect
            treasureGroup.circle(CELL_SIZE * 0.9)
                .center(goalX, goalY)
                .fill('#ffd700')
                .opacity(0.3)
                .animate(1000)
                .ease('-')
                .loop(true, true)
                .scale(1.2)
                .scale(1);
            
            // Treasure star
            const star = treasureGroup.polygon('12,2 15,9 22,9 16,14 19,21 12,16 5,21 8,14 2,9 9,9')
                .fill('#ffd700')
                .stroke({ width: 1, color: '#f39c12' })
                .center(goalX, goalY)
                .scale(0.8);
            
            // Add sparkle animation
            star.animate(2000)
                .ease('-')
                .loop(true, true)
                .rotate(360, goalX, goalY);
        }

        // Create the hero character
        function createHero() {
            heroPosition = { x: 0, y: 0 };
            
            const x = heroPosition.x * CELL_SIZE + CELL_SIZE / 2;
            const y = heroPosition.y * CELL_SIZE + CELL_SIZE / 2;
            
            // Remove old hero if exists
            if (hero) hero.remove();
            
            // Create hero group
            hero = draw.group();
            
            // Hero body (cute circle character)
            const body = hero.circle(CELL_SIZE * 0.6)
                .center(x, y)
                .fill(HERO_COLOR)
                .stroke({ width: 2, color: '#fff' });
            
            // Hero eyes
            hero.circle(4).center(x - 5, y - 2).fill('#fff');
            hero.circle(4).center(x + 5, y - 2).fill('#fff');
            hero.circle(2).center(x - 5, y - 2).fill('#000');
            hero.circle(2).center(x + 5, y - 2).fill('#000');
            
            // Hero smile
            hero.path(`M ${x - 5} ${y + 3} Q ${x} ${y + 8} ${x + 5} ${y + 3}`)
                .fill('none')
                .stroke({ width: 1.5, color: '#fff', linecap: 'round' });
            
            // Add bounce animation
            body.animate(500)
                .ease('-')
                .loop(true, true)
                .scale(1.1)
                .scale(1);
        }

        // Create monster characters
        function createMonsters() {
            // Remove old monsters
            monsterElements.forEach(m => m.remove());
            monsterElements = [];
            monsters = [];
            
            // Create 3 monsters at random positions
            for (let i = 0; i < 3; i++) {
                let monsterPos;
                
                // Find a random position not too close to hero or goal
                do {
                    monsterPos = {
                        x: Math.floor(Math.random() * MAZE_SIZE),
                        y: Math.floor(Math.random() * MAZE_SIZE)
                    };
                } while (
                    (monsterPos.x === 0 && monsterPos.y === 0) || // Not at start
                    (monsterPos.x === MAZE_SIZE - 1 && monsterPos.y === MAZE_SIZE - 1) || // Not at goal
                    (Math.abs(monsterPos.x - heroPosition.x) < 3 && Math.abs(monsterPos.y - heroPosition.y) < 3) // Not too close to hero
                );
                
                monsters.push(monsterPos);
                
                const x = monsterPos.x * CELL_SIZE + CELL_SIZE / 2;
                const y = monsterPos.y * CELL_SIZE + CELL_SIZE / 2;
                
                // Create monster group
                const monster = draw.group();
                
                // Monster body
                const monsterBody = monster.circle(CELL_SIZE * 0.5)
                    .center(x, y)
                    .fill(MONSTER_COLORS[i % MONSTER_COLORS.length])
                    .stroke({ width: 2, color: '#fff' });
                
                // Monster eyes (silly look)
                monster.circle(5).center(x - 4, y - 2).fill('#fff');
                monster.circle(5).center(x + 4, y - 2).fill('#fff');
                monster.circle(3).center(x - 3, y - 1).fill('#000');
                monster.circle(3).center(x + 5, y - 3).fill('#000');
                
                // Monster teeth
                monster.rect(3, 3).center(x - 3, y + 4).fill('#fff');
                monster.rect(3, 3).center(x + 3, y + 4).fill('#fff');
                
                // Add wiggle animation
                monster.animate(300 + i * 100)
                    .ease('-')
                    .loop(true, true)
                    .rotate(10, x, y)
                    .rotate(-10, x, y);
                
                monsterElements.push(monster);
            }
        }

        // Handle keyboard input
        function handleKeyPress(event) {
            if (!gameActive) return;
            
            let newX = heroPosition.x;
            let newY = heroPosition.y;
            let moved = false;
            
            // Determine new position based on key press
            switch(event.key) {
                case 'ArrowUp':
                    if (canMove(heroPosition.x, heroPosition.y, 'top')) {
                        newY--;
                        moved = true;
                    }
                    event.preventDefault();
                    break;
                case 'ArrowDown':
                    if (canMove(heroPosition.x, heroPosition.y, 'bottom')) {
                        newY++;
                        moved = true;
                    }
                    event.preventDefault();
                    break;
                case 'ArrowLeft':
                    if (canMove(heroPosition.x, heroPosition.y, 'left')) {
                        newX--;
                        moved = true;
                    }
                    event.preventDefault();
                    break;
                case 'ArrowRight':
                    if (canMove(heroPosition.x, heroPosition.y, 'right')) {
                        newX++;
                        moved = true;
                    }
                    event.preventDefault();
                    break;
            }
            
            // Move hero if valid move
            if (moved) {
                moveHero(newX, newY);
                
                // Check if reached goal
                if (newX === goalPosition.x && newY === goalPosition.y) {
                    winGame();
                }
                
                // Check collision with monsters
                checkMonsterCollision();
            }
        }

        // Check if hero can move in a direction (no wall blocking)
        function canMove(x, y, direction) {
            if (x < 0 || x >= MAZE_SIZE || y < 0 || y >= MAZE_SIZE) return false;
            return !maze[y][x].walls[direction];
        }

        // Move hero to new position
        function moveHero(x, y) {
            heroPosition.x = x;
            heroPosition.y = y;
            
            const pixelX = x * CELL_SIZE + CELL_SIZE / 2;
            const pixelY = y * CELL_SIZE + CELL_SIZE / 2;
            
            // Animate hero movement
            hero.animate(100).center(pixelX, pixelY);
        }

        // Create trail behind hero
        function createTrail() {
            if (!gameActive) return;
            
            const currentTime = Date.now();
            if (currentTime - lastTrailTime > 200) { // Create trail every 200ms
                lastTrailTime = currentTime;
                
                const x = heroPosition.x * CELL_SIZE + CELL_SIZE / 2;
                const y = heroPosition.y * CELL_SIZE + CELL_SIZE / 2;
                
                // Create trail circle
                const trailCircle = draw.circle(5)
                    .center(x, y)
                    .fill(TRAIL_COLOR)
                    .opacity(0.6);
                
                trail.push(trailCircle);
                
                // Fade out and remove old trail
                trailCircle.animate(3000)
                    .opacity(0)
                    .after(() => {
                        trailCircle.remove();
                        trail = trail.filter(t => t !== trailCircle);
                    });
            }
        }

        // Move monsters towards hero
        function moveMonsters() {
            if (!gameActive) return;
            
            for (let i = 0; i < monsters.length; i++) {
                const monster = monsters[i];
                const monsterElement = monsterElements[i];
                
                // Simple AI: move towards hero with some randomness
                const dx = heroPosition.x - monster.x;
                const dy = heroPosition.y - monster.y;
                
                let possibleMoves = [];
                
                // Check all valid moves
                if (dx > 0 && canMove(monster.x, monster.y, 'right')) {
                    possibleMoves.push({ x: monster.x + 1, y: monster.y });
                }
                if (dx < 0 && canMove(monster.x, monster.y, 'left')) {
                    possibleMoves.push({ x: monster.x - 1, y: monster.y });
                }
                if (dy > 0 && canMove(monster.x, monster.y, 'bottom')) {
                    possibleMoves.push({ x: monster.x, y: monster.y + 1 });
                }
                if (dy < 0 && canMove(monster.x, monster.y, 'top')) {
                    possibleMoves.push({ x: monster.x, y: monster.y - 1 });
                }
                
                // Add some randomness (30% chance of random move)
                if (Math.random() < 0.3) {
                    // Try random directions
                    if (canMove(monster.x, monster.y, 'top')) {
                        possibleMoves.push({ x: monster.x, y: monster.y - 1 });
                    }
                    if (canMove(monster.x, monster.y, 'bottom')) {
                        possibleMoves.push({ x: monster.x, y: monster.y + 1 });
                    }
                    if (canMove(monster.x, monster.y, 'left')) {
                        possibleMoves.push({ x: monster.x - 1, y: monster.y });
                    }
                    if (canMove(monster.x, monster.y, 'right')) {
                        possibleMoves.push({ x: monster.x + 1, y: monster.y });
                    }
                }
                
                // Make a move if possible
                if (possibleMoves.length > 0) {
                    const move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                    monster.x = move.x;
                    monster.y = move.y;
                    
                    const pixelX = monster.x * CELL_SIZE + CELL_SIZE / 2;
                    const pixelY = monster.y * CELL_SIZE + CELL_SIZE / 2;
                    
                    monsterElement.animate(400).center(pixelX, pixelY);
                }
            }
            
            // Check collision after monsters move
            checkMonsterCollision();
        }

        // Check if hero collided with any monster
        function checkMonsterCollision() {
            for (const monster of monsters) {
                if (monster.x === heroPosition.x && monster.y === heroPosition.y) {
                    gameOver();
                    break;
                }
            }
        }

        // Game over (caught by monster)
        function gameOver() {
            gameActive = false;
            
            // Show game over effect
            const overlay = draw.rect(MAZE_SIZE * CELL_SIZE, MAZE_SIZE * CELL_SIZE)
                .fill('#000')
                .opacity(0)
                .animate(500)
                .opacity(0.5);
            
            const text = draw.text('Oh no! Try again!')
                .font({ size: 30, family: 'Comic Sans MS', weight: 'bold' })
                .fill('#ff6b6b')
                .center(MAZE_SIZE * CELL_SIZE / 2, MAZE_SIZE * CELL_SIZE / 2);
            
            setTimeout(() => {
                overlay.remove();
                text.remove();
                generateNewMaze();
            }, 2000);
        }

        // Win the game
        function winGame() {
            gameActive = false;
            score += 10;
            updateScore();
            
            // Show win message
            document.getElementById('winMessage').classList.add('show');
            
            // Celebration animation
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const x = Math.random() * MAZE_SIZE * CELL_SIZE;
                    const y = Math.random() * MAZE_SIZE * CELL_SIZE;
                    
                    const star = draw.polygon('12,2 15,9 22,9 16,14 19,21 12,16 5,21 8,14 2,9 9,9')
                        .fill(['#ff6b6b', '#ffd93d', '#4ecdc4'][i % 3])
                        .center(x, y)
                        .scale(0)
                        .animate(1000)
                        .scale(1)
                        .rotate(360, x, y)
                        .after(function() {
                            this.animate(500).scale(0).after(function() {
                                this.remove();
                            });
                        });
                }, i * 100);
            }
        }

        // Update score display
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Find solution path using BFS
        function findSolutionPath() {
            const queue = [{ x: 0, y: 0, path: [] }];
            const visited = new Set();
            visited.add('0,0');
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                // Check if reached goal
                if (current.x === goalPosition.x && current.y === goalPosition.y) {
                    solutionPath = current.path;
                    solutionPath.push({ x: current.x, y: current.y });
                    return;
                }
                
                // Check all four directions
                const directions = [
                    { dir: 'top', dx: 0, dy: -1 },
                    { dir: 'right', dx: 1, dy: 0 },
                    { dir: 'bottom', dx: 0, dy: 1 },
                    { dir: 'left', dx: -1, dy: 0 }
                ];
                
                for (const { dir, dx, dy } of directions) {
                    if (canMove(current.x, current.y, dir)) {
                        const newX = current.x + dx;
                        const newY = current.y + dy;
                        const key = `${newX},${newY}`;
                        
                        if (!visited.has(key)) {
                            visited.add(key);
                            queue.push({
                                x: newX,
                                y: newY,
                                path: [...current.path, { x: current.x, y: current.y }]
                            });
                        }
                    }
                }
            }
        }

        // Show solution path
        function showSolution() {
            // Remove old solution elements
            solutionElements.forEach(el => el.remove());
            solutionElements = [];
            
            // Draw solution path
            for (let i = 0; i < solutionPath.length; i++) {
                const pos = solutionPath[i];
                const x = pos.x * CELL_SIZE + CELL_SIZE / 2;
                const y = pos.y * CELL_SIZE + CELL_SIZE / 2;
                
                const dot = draw.circle(8)
                    .center(x, y)
                    .fill(SOLUTION_COLOR)
                    .opacity(0)
                    .animate(100 * i)
                    .opacity(0.5);
                
                solutionElements.push(dot);
            }
            
            // Hide solution after 3 seconds
            setTimeout(() => {
                solutionElements.forEach(el => {
                    el.animate(500).opacity(0).after(function() {
                        this.remove();
                    });
                });
                solutionElements = [];
            }, 3000);
        }
    </script>
</body>
