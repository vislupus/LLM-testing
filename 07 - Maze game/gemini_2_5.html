<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Friends</title>
    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap');

        :root {
            --bg-color: #f0f8ff;
            --wall-color: #7d5a5a;
            --path-color: #e6e6fa;
            --hero-color: #ffcc00;
            --hero-eye-color: #333;
            --monster-color: #ff6b81;
            --goal-color: #48dbfb;
            --trail-color: #ffcc00;
            --solution-path-color: #32cd32;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Baloo 2', cursive;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 95vmin;
            height: 95vmin;
            max-width: 800px;
            max-height: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            overflow: hidden;
            background-color: var(--path-color);
        }

        #drawing {
            width: 100%;
            height: 100%;
        }

        #ui-controls {
            margin-top: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        #message-bar {
            font-size: 1.5rem;
            color: var(--wall-color);
            text-align: center;
        }

        .game-button {
            padding: 15px 30px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background-color: var(--monster-color);
            color: white;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 0 #c0392b;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c0392b;
        }
        
        .game-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c0392b;
        }

        #win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 100;
        }
        
        #win-box {
            background-color: white;
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 5px solid var(--hero-color);
        }

        #win-box h1 {
            font-size: 4rem;
            color: var(--goal-color);
            margin: 0;
            text-shadow: 2px 2px 0 var(--bg-color);
        }

    </style>
</head>
<body>

    <div id="ui-controls">
        <p id="message-bar">Use Arrow Keys to Move!</p>
        <button id="solution-button" class="game-button">Show Path</button>
    </div>
    
    <div id="game-container">
        <div id="drawing"></div>
        <div id="win-overlay">
            <div id="win-box">
                <h1>You Win!</h1>
                <button id="play-again-button" class="game-button">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Main Game Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- GAME CONFIGURATION ---
        const CONFIG = {
            MAZE_WIDTH: 20,
            MAZE_HEIGHT: 20,
            NUM_MONSTERS: 5,
            CELL_SIZE: 40, // Needs to be calculated based on container size
            PLAYER_SPEED: 100, // ms for move animation
            MONSTER_SPEED: 800, // ms between monster moves
        };

        // --- UI & SVG SETUP ---
        const ui = {
            container: document.getElementById('game-container'),
            messageBar: document.getElementById('message-bar'),
            solutionButton: document.getElementById('solution-button'),
            winOverlay: document.getElementById('win-overlay'),
            playAgainButton: document.getElementById('play-again-button'),
        };

        const draw = SVG().addTo('#drawing').size('100%', '100%');
        
        // Dynamically calculate cell size
        CONFIG.CELL_SIZE = Math.min(
            ui.container.clientWidth / CONFIG.MAZE_WIDTH,
            ui.container.clientHeight / CONFIG.MAZE_HEIGHT
        );
        
        // Adjust viewbox to center the maze if container is not perfectly square
        const totalWidth = CONFIG.CELL_SIZE * CONFIG.MAZE_WIDTH;
        const totalHeight = CONFIG.CELL_SIZE * CONFIG.MAZE_HEIGHT;
        draw.viewbox(0, 0, totalWidth, totalHeight);

        // --- GAME STATE ---
        let gameState = {};

        /**
         * Shuffles array in place.
         * @param {Array} a items An array containing the items.
         */
        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        
        // --- MAZE GENERATION (using recursive backtracking) ---
        function generateMaze(width, height) {
            // 1. Initialize grid with all walls up
            const grid = Array(height).fill(null).map(() => Array(width).fill(null).map(() => ({
                visited: false,
                walls: [true, true, true, true] // [top, right, bottom, left]
            })));

            const stack = [];
            let current = { x: 0, y: 0 };
            grid[current.y][current.x].visited = true;

            do {
                const neighbors = [];
                const { x, y } = current;

                // Check neighbors
                if (y > 0 && !grid[y - 1][x].visited) neighbors.push({ x, y: y - 1, dir: 0 }); // Top
                if (x < width - 1 && !grid[y][x + 1].visited) neighbors.push({ x: x + 1, y, dir: 1 }); // Right
                if (y < height - 1 && !grid[y + 1][x].visited) neighbors.push({ x, y: y + 1, dir: 2 }); // Bottom
                if (x > 0 && !grid[y][x - 1].visited) neighbors.push({ x: x - 1, y, dir: 3 }); // Left

                if (neighbors.length > 0) {
                    // 2. Pick a random unvisited neighbor
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    
                    // 3. Push current cell to stack
                    stack.push(current);

                    // 4. Remove walls between current and next cell
                    // Wall of current cell
                    grid[current.y][current.x].walls[next.dir] = false;
                    // Opposite wall of next cell
                    grid[next.y][next.x].walls[(next.dir + 2) % 4] = false;
                    
                    // 5. Move to the next cell
                    current = { x: next.x, y: next.y };
                    grid[current.y][current.x].visited = true;

                } else if (stack.length > 0) {
                    // 6. Backtrack if stuck
                    current = stack.pop();
                }

            } while (stack.length > 0);

            return grid;
        }
        
        // --- PATHFINDING (using Breadth-First Search for the shortest path) ---
        function findSolutionPath(grid) {
            const queue = [[{ x: 0, y: 0 }]]; // Queue of paths
            const visited = new Set(['0,0']);
            const goal = { x: CONFIG.MAZE_WIDTH - 1, y: CONFIG.MAZE_HEIGHT - 1 };

            while (queue.length > 0) {
                const path = queue.shift();
                const { x, y } = path[path.length - 1];

                if (x === goal.x && y === goal.y) {
                    return path; // Solution found
                }

                const cell = grid[y][x];
                
                // Explore neighbors
                // Top
                if (!cell.walls[0] && !visited.has(`${x},${y-1}`)) {
                    visited.add(`${x},${y-1}`);
                    const newPath = [...path, {x, y: y - 1}];
                    queue.push(newPath);
                }
                // Right
                if (!cell.walls[1] && !visited.has(`${x+1},${y}`)) {
                    visited.add(`${x+1},${y}`);
                    const newPath = [...path, {x: x+1, y}];
                    queue.push(newPath);
                }
                // Bottom
                if (!cell.walls[2] && !visited.has(`${x},${y+1}`)) {
                    visited.add(`${x},${y+1}`);
                    const newPath = [...path, {x, y: y + 1}];
                    queue.push(newPath);
                }
                // Left
                if (!cell.walls[3] && !visited.has(`${x-1},${y}`)) {
                    visited.add(`${x-1},${y}`);
                    const newPath = [...path, {x: x - 1, y}];
                    queue.push(newPath);
                }
            }
            return []; // Should never happen with this maze generator
        }


        // --- DRAWING FUNCTIONS ---

        function drawMaze() {
            const wallGroup = draw.group();
            const C = CONFIG.CELL_SIZE;

            for (let y = 0; y < CONFIG.MAZE_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.MAZE_WIDTH; x++) {
                    const cell = gameState.grid[y][x];
                    if (cell.walls[0]) { // Top wall
                        wallGroup.line(x * C, y * C, (x + 1) * C, y * C);
                    }
                    if (cell.walls[1]) { // Right wall
                        wallGroup.line((x + 1) * C, y * C, (x + 1) * C, (y + 1) * C);
                    }
                    if (cell.walls[2]) { // Bottom wall
                        wallGroup.line(x * C, (y + 1) * C, (x + 1) * C, (y + 1) * C);
                    }
                    if (cell.walls[3]) { // Left wall
                        wallGroup.line(x * C, y * C, x * C, (y + 1) * C);
                    }
                }
            }
            wallGroup.stroke({ width: C / 10, color: 'var(--wall-color)', linecap: 'round' });
        }

        function drawGoal() {
            const C = CONFIG.CELL_SIZE;
            const goalX = (CONFIG.MAZE_WIDTH - 0.5) * C;
            const goalY = (CONFIG.MAZE_HEIGHT - 0.5) * C;
            
            const star = draw.polygon()
                .plot(SVG.Point.star(5, C * 0.4, C * 0.2))
                .center(goalX, goalY)
                .fill('var(--goal-color)')
                .stroke({ width: 2, color: '#fff' });

            // Make it sparkle
            star.animate({ duration: 1000, ease: '<>' }).loop(true, true).rotate(45).scale(1.2);
        }

        function drawPlayer() {
            const C = CONFIG.CELL_SIZE;
            const playerSize = C * 0.6;
            const eyeSize = playerSize * 0.15;
            
            const hero = draw.group();
            // Body
            hero.circle(playerSize).fill('var(--hero-color)');
            // Eyes
            hero.circle(eyeSize).center(-playerSize * 0.2, -playerSize * 0.1).fill('var(--hero-eye-color)');
            hero.circle(eyeSize).center(playerSize * 0.2, -playerSize * 0.1).fill('var(--hero-eye-color)');
            
            // Initial position
            hero.center(C / 2, C / 2);
            
            // Bobbing animation
            hero.animate({ duration: 500, ease: '<>' }).loop(true, true).dy(C * -0.05);

            gameState.player = {
                x: 0,
                y: 0,
                isMoving: false,
                svg: hero,
            };
        }

        function drawMonsters() {
            const C = CONFIG.CELL_SIZE;
            const monsterSize = C * 0.5;

            gameState.monsters.forEach(monster => {
                const fuzzball = draw.group();
                // Body
                fuzzball.rect(monsterSize, monsterSize).radius(monsterSize / 2).fill('var(--monster-color)');
                // Eyes
                fuzzball.circle(monsterSize*0.1).center(monsterSize * 0.2, monsterSize*0.4).fill('#fff');
                fuzzball.circle(monsterSize*0.1).center(monsterSize * 0.8, monsterSize*0.4).fill('#fff');
                fuzzball.path('M 4 8 Q 8 10 12 8').scale(monsterSize/16).stroke({color: '#fff', width: monsterSize*0.05, linecap: 'round'}).fill('none');
                
                // Move to position
                fuzzball.center((monster.x + 0.5) * C, (monster.y + 0.5) * C);
                
                // Bouncy animation
                fuzzball.animate({ duration: 300, ease: 'bounce' }).loop(true, true).scale(1, 0.9).transform({ origin: 'center' });

                monster.svg = fuzzball;
            });
        }
        
        function drawSolutionPath() {
            const C = CONFIG.CELL_SIZE;
            const points = gameState.solutionPath.map(p => [(p.x + 0.5) * C, (p.y + 0.5) * C]);
            gameState.solutionLine = draw.polyline(points)
                .fill('none')
                .stroke({ width: C / 8, color: 'var(--solution-path-color)', linecap: 'round', linejoin: 'round', dasharray: `${C/4}, ${C/4}` })
                .hide(); // Initially hidden
        }
        
        function dropTrail() {
            const C = CONFIG.CELL_SIZE;
            const pos = gameState.player.svg.center();
            gameState.trailGroup.circle(C * 0.1)
                .center(pos.x, pos.y)
                .fill('var(--trail-color)')
                .opacity(0.5);
        }

        // --- GAME LOGIC ---

        function init() {
            // Clear previous game elements
            draw.clear();
            if (gameState.gameLoop) clearInterval(gameState.gameLoop);
            if (gameState.trailInterval) clearInterval(gameState.trailInterval);
            
            // Reset game state
            gameState = {
                grid: generateMaze(CONFIG.MAZE_WIDTH, CONFIG.MAZE_HEIGHT),
                player: null,
                monsters: [],
                solutionPath: null,
                solutionLine: null,
                isGameOver: false,
                gameLoop: null,
                trailInterval: null,
                trailGroup: draw.group(), // Group for trail circles
            };
            
            // Place monsters in random valid locations (not near start)
            const emptyCells = [];
            for (let y = 0; y < CONFIG.MAZE_HEIGHT; y++) {
                for (let x = 0; x < CONFIG.MAZE_WIDTH; x++) {
                    // Don't place in starting area
                    if (x > 3 || y > 3) {
                       emptyCells.push({ x, y });
                    }
                }
            }
            shuffle(emptyCells);
            for(let i = 0; i < CONFIG.NUM_MONSTERS; i++) {
                gameState.monsters.push({ ...emptyCells[i], lastPos: null, svg: null });
            }

            // Draw everything
            drawMaze();
            gameState.trailGroup.back(); // Move trail group behind everything else
            drawGoal();
            drawPlayer();
            drawMonsters();

            // Find and draw solution path (hidden)
            gameState.solutionPath = findSolutionPath(gameState.grid);
            drawSolutionPath();

            // Set up trail interval
            gameState.trailInterval = setInterval(dropTrail, CONFIG.PLAYER_SPEED * 2);

            // Start game loop
            gameState.gameLoop = setInterval(gameLoop, CONFIG.MONSTER_SPEED);
            
            // Reset UI
            ui.messageBar.textContent = 'Use Arrow Keys to Move!';
            ui.solutionButton.textContent = 'Show Path';
            ui.winOverlay.style.display = 'none';
        }

        function handleKeyPress(e) {
            if (gameState.isGameOver || gameState.player.isMoving) {
                return;
            }

            const { x, y } = gameState.player;
            const cell = gameState.grid[y][x];
            let dx = 0, dy = 0, wallIndex = -1;

            if (e.key === 'ArrowUp' || e.key === 'w') { dy = -1; wallIndex = 0; }
            if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1; wallIndex = 1; }
            if (e.key === 'ArrowDown' || e.key === 's') { dy = 1; wallIndex = 2; }
            if (e.key === 'ArrowLeft' || e.key === 'a') { dx = -1; wallIndex = 3; }

            if (wallIndex !== -1 && !cell.walls[wallIndex]) {
                gameState.player.isMoving = true;
                gameState.player.x += dx;
                gameState.player.y += dy;

                const C = CONFIG.CELL_SIZE;
                const newX = (gameState.player.x + 0.5) * C;
                const newY = (gameState.player.y + 0.5) * C;

                gameState.player.svg.animate(CONFIG.PLAYER_SPEED).center(newX, newY).after(() => {
                    gameState.player.isMoving = false;
                    checkWinCondition();
                });
            }
        }
        
        function moveMonsters() {
            if (gameState.isGameOver) return;

            const C = CONFIG.CELL_SIZE;
            gameState.monsters.forEach(monster => {
                const { x, y } = monster;
                const cell = gameState.grid[y][x];
                const validMoves = [];

                // Find valid moves (and prefer not to backtrack)
                if (!cell.walls[0] && (!monster.lastPos || monster.lastPos.y !== y - 1)) validMoves.push({ x: 0, y: -1 }); // Up
                if (!cell.walls[1] && (!monster.lastPos || monster.lastPos.x !== x + 1)) validMoves.push({ x: 1, y: 0 }); // Right
                if (!cell.walls[2] && (!monster.lastPos || monster.lastPos.y !== y + 1)) validMoves.push({ x: 0, y: 1 }); // Down
                if (!cell.walls[3] && (!monster.lastPos || monster.lastPos.x !== x - 1)) validMoves.push({ x: -1, y: 0 }); // Left

                if (validMoves.length > 0) {
                    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    monster.lastPos = { x, y }; // Store current pos as last pos
                    monster.x += move.x;
                    monster.y += move.y;
                    
                    const newX = (monster.x + 0.5) * C;
                    const newY = (monster.y + 0.5) * C;
                    monster.svg.animate(CONFIG.MONSTER_SPEED * 0.8).center(newX, newY);
                } else {
                    // If stuck, move back
                    const temp = monster.lastPos;
                    monster.lastPos = {x: monster.x, y: monster.y};
                    monster.x = temp.x;
                    monster.y = temp.y;
                    const newX = (monster.x + 0.5) * C;
                    const newY = (monster.y + 0.5) * C;
                    monster.svg.animate(CONFIG.MONSTER_SPEED * 0.8).center(newX, newY);
                }
            });
        }
        
        function gameLoop() {
            moveMonsters();
            checkLossCondition();
        }

        function checkWinCondition() {
            if (gameState.player.x === CONFIG.MAZE_WIDTH - 1 && gameState.player.y === CONFIG.MAZE_HEIGHT - 1) {
                gameOver(true);
            }
        }
        
        function checkLossCondition() {
            if (gameState.isGameOver) return;
            for (const monster of gameState.monsters) {
                if (monster.x === gameState.player.x && monster.y === gameState.player.y) {
                    gameOver(false);
                    return;
                }
            }
        }

        function gameOver(isWin) {
            if(gameState.isGameOver) return;
            gameState.isGameOver = true;
            clearInterval(gameState.gameLoop);
            clearInterval(gameState.trailInterval);

            if (isWin) {
                ui.messageBar.textContent = "You did it!";
                ui.winOverlay.style.display = 'flex';
            } else {
                ui.messageBar.textContent = "Oh no! The Fuzzball got you!";
                gameState.player.svg.animate(500).scale(0.1).rotate(360).after(() => {
                    setTimeout(init, 1500); // Restart after a short delay
                });
            }
        }
        
        function toggleSolution() {
            if (gameState.solutionLine.visible()) {
                gameState.solutionLine.hide();
                ui.solutionButton.textContent = 'Show Path';
            } else {
                gameState.solutionLine.front().show();
                ui.solutionButton.textContent = 'Hide Path';
            }
        }

        // --- EVENT LISTENERS ---
        window.addEventListener('keydown', handleKeyPress);
        ui.solutionButton.addEventListener('click', toggleSolution);
        ui.playAgainButton.addEventListener('click', init);

        // --- START GAME ---
        init();
    });
    </script>
