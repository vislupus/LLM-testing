<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny Maze Adventure</title>
  <style>
    :root {
      --bg1: #fff6d9;
      --bg2: #dff7ff;
      --panel: rgba(255,255,255,0.78);
      --stroke: #5c4f91;
      --accent: #ff8fb1;
      --accent2: #7bd389;
      --gold: #ffd45a;
      --shadow: rgba(77, 71, 115, 0.18);
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #a7e7ff 0%, #dff9ff 35%, #fff8da 100%);
    }

    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Official SVG.js browser build. -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.5/dist/svg.min.js"></script>
  <script>
    (() => {
      'use strict';

      if (!window.SVG) {
        document.getElementById('game').innerHTML = '<div style="padding:24px;font:16px/1.4 sans-serif">SVG.js failed to load.</div>';
        return;
      }

      // ------------------------------
      // Game configuration
      // ------------------------------
      const COLS = 20;
      const ROWS = 20;
      const CELL = 28;
      const BOARD_PAD = 22;
      const BOARD_W = COLS * CELL;
      const BOARD_H = ROWS * CELL;
      const TOP_UI = 126;
      const SIDE_UI = 280;
      const WIDTH = BOARD_W + BOARD_PAD * 2 + SIDE_UI;
      const HEIGHT = BOARD_H + BOARD_PAD * 2 + TOP_UI + 34;
      const MAZE_X = 28;
      const MAZE_Y = TOP_UI;
      const STEP_MS = 155;
      const MONSTER_STEP_MS = 430;
      const TRAIL_INTERVAL = 82;

      const DIRS = [
        { dx: 0, dy: -1, wall: 0, opposite: 2 }, // up
        { dx: 1, dy: 0, wall: 1, opposite: 3 },  // right
        { dx: 0, dy: 1, wall: 2, opposite: 0 },  // down
        { dx: -1, dy: 0, wall: 3, opposite: 1 }  // left
      ];

      const draw = SVG().addTo('#game').size('100%', '100%').viewbox(0, 0, WIDTH, HEIGHT);
      draw.node.setAttribute('preserveAspectRatio', 'xMidYMid meet');

      // Root layers
      const bgLayer = draw.group();
      const boardLayer = draw.group();
      const gridLayer = boardLayer.group();
      const solutionLayer = boardLayer.group();
      const trailLayer = boardLayer.group();
      const actorLayer = boardLayer.group();
      const fxLayer = draw.group();
      const uiLayer = draw.group();
      const overlayLayer = draw.group();

      // ------------------------------
      // Utility helpers
      // ------------------------------
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      const choice = arr => arr[Math.floor(Math.random() * arr.length)];
      const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
      const keyOf = (x, y) => `${x},${y}`;
      const now = () => performance.now();

      function cellCenter(x, y) {
        return {
          x: MAZE_X + BOARD_PAD + x * CELL + CELL / 2,
          y: MAZE_Y + BOARD_PAD + y * CELL + CELL / 2
        };
      }

      function drawRoundedPanel(group, x, y, w, h, fill, stroke, r = 22) {
        return group.rect(w, h).move(x, y).radius(r).fill(fill).stroke({ color: stroke, width: 3 });
      }

      function setText(textEl, value) {
        textEl.clear();
        textEl.tspan(value);
      }

      // ------------------------------
      // Background and static UI
      // ------------------------------
      function buildBackground() {
        bgLayer.clear();
        uiLayer.clear();

        bgLayer.rect(WIDTH, HEIGHT).fill({
          color: '#dff7ff'
        });

        // Sky blobs and hills
        bgLayer.circle(210).move(26, 18).fill('rgba(255,255,255,0.55)');
        bgLayer.circle(160).move(220, 30).fill('rgba(255,255,255,0.38)');
        bgLayer.circle(240).move(WIDTH - 280, 10).fill('rgba(255,255,255,0.42)');
        bgLayer.ellipse(900, 280).move(-40, HEIGHT - 170).fill('#bef0a8');
        bgLayer.ellipse(760, 240).move(280, HEIGHT - 140).fill('#8ddc7e');
        bgLayer.ellipse(780, 240).move(560, HEIGHT - 170).fill('#72c96d');
        bgLayer.circle(66).move(WIDTH - 140, 40).fill('#ffe16d').stroke({ color: '#ffcb3f', width: 4 });

        // Title panel
        drawRoundedPanel(uiLayer, 20, 16, WIDTH - 40, 86, 'rgba(255,255,255,0.75)', '#7f9dff');
        uiLayer.text('Sunny Maze Adventure').font({ family: 'Trebuchet MS, sans-serif', size: 30, weight: 700, fill: '#5c4f91' }).move(38, 28);
        uiLayer.text('Use the arrow keys to help Pip reach the star. Watch out for the giggly monsters!')
          .font({ family: 'Trebuchet MS, sans-serif', size: 15, weight: 600, fill: '#4d6d77' })
          .move(40, 66);

        // Board and side panel shells
        drawRoundedPanel(uiLayer, MAZE_X, MAZE_Y, BOARD_W + BOARD_PAD * 2, BOARD_H + BOARD_PAD * 2, 'rgba(255,255,255,0.72)', '#ffb1c9');
        drawRoundedPanel(uiLayer, MAZE_X + BOARD_W + BOARD_PAD * 2 + 18, MAZE_Y, SIDE_UI - 28, BOARD_H + BOARD_PAD * 2, 'rgba(255,255,255,0.72)', '#8fd4ff');
      }

      buildBackground();

      // ------------------------------
      // UI labels and buttons
      // ------------------------------
      const infoX = MAZE_X + BOARD_W + BOARD_PAD * 2 + 34;
      const infoY = MAZE_Y + 18;

      uiLayer.text('Mission').font({ size: 24, weight: 700, fill: '#5c4f91' }).move(infoX, infoY);
      const missionText = uiLayer.text('Find the shiny star\nand stay away\nfrom monsters!')
        .font({ size: 18, weight: 700, fill: '#56707c', leading: 1.45 })
        .move(infoX, infoY + 44);

      uiLayer.text('Status').font({ size: 22, weight: 700, fill: '#5c4f91' }).move(infoX, infoY + 150);
      const statusText = uiLayer.text('Ready to play!')
        .font({ size: 18, weight: 700, fill: '#2d7d5e' })
        .move(infoX, infoY + 188);

      const tipText = uiLayer.text('Tip: press the magic\npath button if you need help!')
        .font({ size: 17, weight: 700, fill: '#7c629d', leading: 1.35 })
        .move(infoX, infoY + 238);

      function createButton(x, y, w, h, label, fillA, fillB) {
        const g = uiLayer.group();
        g.rect(w, h).move(x, y + 6).radius(18).fill('rgba(93,84,132,0.15)');
        const button = g.rect(w, h).move(x, y).radius(18).fill(fillA).stroke({ color: fillB, width: 3 });
        const text = g.text(label).font({ size: 19, weight: 700, fill: '#ffffff', anchor: 'middle', family: 'Trebuchet MS, sans-serif' });
        text.center(x + w / 2, y + h / 2 + 1);
        g.css('cursor', 'pointer');
        g.on('mouseover', () => button.fill(fillB));
        g.on('mouseout', () => button.fill(fillA));
        return { group: g, button, text };
      }

      const pathButton = createButton(infoX, infoY + 348, 196, 58, 'Show Path', '#ff90bb', '#ff6fa8');
      const restartButton = createButton(infoX, infoY + 424, 196, 58, 'New Maze', '#7fd68d', '#5bbd6e');

      // ------------------------------
      // Game state
      // ------------------------------
      let maze = [];
      let solutionPath = [];
      let showingSolution = false;
      let gameBusy = false;
      let boardLines = [];
      let hero = null;
      let monsters = [];
      let heroMoving = false;
      let lastTrailAt = 0;
      let pressed = new Set();
      let monsterTick = null;
      let loopHandle = 0;
      let winSparkles = [];
      let mazeSeedText = null;

      // ------------------------------
      // Maze generation and solving
      // ------------------------------
      function makeGrid() {
        return Array.from({ length: ROWS }, (_, y) =>
          Array.from({ length: COLS }, (_, x) => ({ x, y, walls: [1, 1, 1, 1], visited: false }))
        );
      }

      function generateMaze() {
        maze = makeGrid();
        const stack = [];
        let current = maze[0][0];
        current.visited = true;
        let visitedCount = 1;

        while (visitedCount < COLS * ROWS) {
          const neighbors = [];
          for (const dir of DIRS) {
            const nx = current.x + dir.dx;
            const ny = current.y + dir.dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !maze[ny][nx].visited) {
              neighbors.push({ dir, cell: maze[ny][nx] });
            }
          }

          if (neighbors.length) {
            const next = choice(neighbors);
            current.walls[next.dir.wall] = 0;
            next.cell.walls[next.dir.opposite] = 0;
            stack.push(current);
            current = next.cell;
            current.visited = true;
            visitedCount += 1;
          } else {
            current = stack.pop();
          }
        }
      }

      function neighborsOpen(x, y) {
        const cell = maze[y][x];
        const out = [];
        DIRS.forEach((dir, i) => {
          if (!cell.walls[i]) {
            const nx = x + dir.dx;
            const ny = y + dir.dy;
            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
              out.push({ x: nx, y: ny });
            }
          }
        });
        return out;
      }

      function solveMaze() {
        const queue = [{ x: 0, y: 0 }];
        const came = new Map();
        const seen = new Set([keyOf(0, 0)]);
        while (queue.length) {
          const cur = queue.shift();
          if (cur.x === COLS - 1 && cur.y === ROWS - 1) {
            const path = [];
            let step = cur;
            while (step) {
              path.push(step);
              step = came.get(keyOf(step.x, step.y));
            }
            solutionPath = path.reverse();
            return;
          }
          neighborsOpen(cur.x, cur.y).forEach(n => {
            const k = keyOf(n.x, n.y);
            if (!seen.has(k)) {
              seen.add(k);
              came.set(k, cur);
              queue.push(n);
            }
          });
        }
      }

      // ------------------------------
      // Maze drawing
      // ------------------------------
      function drawBoard() {
        gridLayer.clear();
        solutionLayer.clear();
        trailLayer.clear();
        boardLines = [];

        // Soft maze floor
        gridLayer.rect(BOARD_W, BOARD_H).move(MAZE_X + BOARD_PAD, MAZE_Y + BOARD_PAD).radius(14).fill('#f8feff');

        // Decorative dots on the floor
        for (let i = 0; i < 36; i++) {
          const cx = rand(MAZE_X + BOARD_PAD + 10, MAZE_X + BOARD_PAD + BOARD_W - 10);
          const cy = rand(MAZE_Y + BOARD_PAD + 10, MAZE_Y + BOARD_PAD + BOARD_H - 10);
          gridLayer.circle(rand(3, 6)).center(cx, cy).fill('rgba(123,211,137,0.12)');
        }

        const wallColor = '#6174b8';
        const wallWidth = 4.5;
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const cell = maze[y][x];
            const left = MAZE_X + BOARD_PAD + x * CELL;
            const top = MAZE_Y + BOARD_PAD + y * CELL;
            const right = left + CELL;
            const bottom = top + CELL;

            if (cell.walls[0]) boardLines.push(gridLayer.line(left, top, right, top).stroke({ color: wallColor, width: wallWidth, linecap: 'round' }));
            if (cell.walls[1]) boardLines.push(gridLayer.line(right, top, right, bottom).stroke({ color: wallColor, width: wallWidth, linecap: 'round' }));
            if (cell.walls[2]) boardLines.push(gridLayer.line(left, bottom, right, bottom).stroke({ color: wallColor, width: wallWidth, linecap: 'round' }));
            if (cell.walls[3]) boardLines.push(gridLayer.line(left, top, left, bottom).stroke({ color: wallColor, width: wallWidth, linecap: 'round' }));
          }
        }

        // Start and finish markers
        const start = cellCenter(0, 0);
        const end = cellCenter(COLS - 1, ROWS - 1);
        gridLayer.rect(CELL - 10, CELL - 10).center(start.x, start.y).radius(10).fill('#d7f7b7');
        drawStar(gridLayer.group(), end.x, end.y, 13, '#ffd966', '#ffbe21');

        // Optional maze id text for children to feel each maze is special
        if (mazeSeedText) mazeSeedText.remove();
        mazeSeedText = uiLayer.text('Maze ' + String(rand(100, 999)))
          .font({ size: 16, weight: 700, fill: '#6e92c3' })
          .move(infoX, infoY + 520);

        drawSolutionPath();
      }

      function drawSolutionPath() {
        solutionLayer.clear();
        if (!solutionPath.length) return;
        const points = solutionPath.map(p => {
          const c = cellCenter(p.x, p.y);
          return [c.x, c.y];
        });

        const path = solutionLayer.polyline(points).fill('none').stroke({ color: '#ff8f52', width: 10, linecap: 'round', linejoin: 'round' });
        path.opacity(showingSolution ? 0.72 : 0);

        points.forEach((p, i) => {
          if (i % 3 === 0) {
            solutionLayer.circle(8).center(p[0], p[1]).fill('#ffd570').opacity(showingSolution ? 0.9 : 0);
          }
        });
      }

      function setSolutionVisible(flag) {
        showingSolution = flag;
        solutionLayer.children().forEach(el => el.animate(180).opacity(flag ? (el.type === 'polyline' ? 0.72 : 0.9) : 0));
        setText(pathButton.text, flag ? 'Hide Path' : 'Show Path');
      }

      // ------------------------------
      // Character drawing
      // ------------------------------
      function drawStar(group, cx, cy, r, fill, stroke) {
        const pts = [];
        for (let i = 0; i < 10; i++) {
          const ang = -Math.PI / 2 + i * Math.PI / 5;
          const rr = i % 2 === 0 ? r : r * 0.45;
          pts.push([cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr]);
        }
        group.polygon(pts).fill(fill).stroke({ color: stroke, width: 3, linejoin: 'round' });
      }

      function makeHero() {
        const g = actorLayer.group();
        const shadow = g.ellipse(24, 10).center(0, 12).fill('rgba(0,0,0,0.12)');
        const bodyWrap = g.group();
        bodyWrap.circle(28).center(0, 0).fill('#5ad4ff').stroke({ color: '#2ba7d8', width: 3 });
        bodyWrap.circle(10).center(-5, -4).fill('#ffffff');
        bodyWrap.circle(10).center(5, -4).fill('#ffffff');
        bodyWrap.circle(3.5).center(-5, -4).fill('#2b4360');
        bodyWrap.circle(3.5).center(5, -4).fill('#2b4360');
        bodyWrap.circle(4).center(-10, 3).fill('#ffb2c6');
        bodyWrap.circle(4).center(10, 3).fill('#ffb2c6');
        bodyWrap.path('M -6 8 Q 0 13 6 8').fill('none').stroke({ color: '#2b4360', width: 3, linecap: 'round' });
        bodyWrap.path('M -12 -12 L 0 -18 L 12 -12').fill('#ffd45a').stroke({ color: '#f4b81d', width: 3, linejoin: 'round' });
        return { group: g, shadow, bodyWrap, x: 0, y: 0, px: 0, py: 0, bob: 0 };
      }

      function makeMonster(colorA, colorB) {
        const g = actorLayer.group();
        const shadow = g.ellipse(24, 10).center(0, 12).fill('rgba(0,0,0,0.12)');
        const body = g.group();
        body.circle(28).center(0, 0).fill(colorA).stroke({ color: colorB, width: 3 });
        body.circle(7).center(-6, -4).fill('#fff');
        body.circle(7).center(6, -4).fill('#fff');
        body.circle(2.8).center(-6, -4).fill('#2b4360');
        body.circle(2.8).center(6, -4).fill('#2b4360');
        body.path('M -7 7 Q 0 2 7 7').fill('none').stroke({ color: '#2b4360', width: 3, linecap: 'round' });
        body.path('M -10 -10 q -5 -9 -10 -4').fill('none').stroke({ color: colorB, width: 3, linecap: 'round' });
        body.path('M 10 -10 q 5 -9 10 -4').fill('none').stroke({ color: colorB, width: 3, linecap: 'round' });
        return { group: g, shadow, body, x: 0, y: 0, px: 0, py: 0, wobble: Math.random() * Math.PI * 2 };
      }

      function positionActor(actor, x, y) {
        const c = cellCenter(x, y);
        actor.x = x;
        actor.y = y;
        actor.px = c.x;
        actor.py = c.y;
        actor.group.center(c.x, c.y);
      }

      // ------------------------------
      // Trail, sparkles, and overlays
      // ------------------------------
      function dropTrail(x, y) {
        const puff = trailLayer.circle(8).center(x, y).fill('#87d9ff').opacity(0.85);
        puff.animate(900, 0, 'now').size(2, 2).opacity(0).after(() => puff.remove());
      }

      function sparkleBurst(x, y, color) {
        for (let i = 0; i < 14; i++) {
          const ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.25;
          const dist = rand(24, 64);
          const px = x + Math.cos(ang) * dist;
          const py = y + Math.sin(ang) * dist;
          const star = fxLayer.circle(rand(6, 10)).center(x, y).fill(color).opacity(0.95);
          star.animate(540, 0, 'now').center(px, py).opacity(0).after(() => star.remove());
        }
      }

      function showMessage(title, subtitle, color) {
        overlayLayer.clear();
        const g = overlayLayer.group();
        g.rect(WIDTH, HEIGHT).fill('rgba(255,255,255,0.18)');
        drawRoundedPanel(g, WIDTH / 2 - 180, HEIGHT / 2 - 90, 360, 180, 'rgba(255,255,255,0.9)', color, 28);
        g.text(title).font({ size: 34, weight: 800, fill: color, anchor: 'middle' }).center(WIDTH / 2, HEIGHT / 2 - 24);
        g.text(subtitle).font({ size: 18, weight: 700, fill: '#5d6e7c', anchor: 'middle', leading: 1.4 }).center(WIDTH / 2, HEIGHT / 2 + 36);
        g.opacity(0).animate(180).opacity(1);
        return g;
      }

      // ------------------------------
      // Placement of monsters
      // ------------------------------
      function bfsDistanceMap(startX, startY) {
        const q = [{ x: startX, y: startY }];
        const dist = Array.from({ length: ROWS }, () => Array(COLS).fill(Infinity));
        dist[startY][startX] = 0;
        while (q.length) {
          const cur = q.shift();
          neighborsOpen(cur.x, cur.y).forEach(n => {
            if (dist[n.y][n.x] === Infinity) {
              dist[n.y][n.x] = dist[cur.y][cur.x] + 1;
              q.push(n);
            }
          });
        }
        return dist;
      }

      function placeMonsters() {
        monsters.forEach(m => m.group.remove());
        monsters = [];

        const dist = bfsDistanceMap(0, 0);
        const candidates = [];
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if ((x !== 0 || y !== 0) && (x !== COLS - 1 || y !== ROWS - 1) && dist[y][x] >= 12) {
              candidates.push({ x, y, d: dist[y][x] });
            }
          }
        }
        candidates.sort((a, b) => b.d - a.d);
        const colors = [
          ['#ff9fd1', '#ff70b8'],
          ['#9dffd1', '#69d9aa'],
          ['#ffc987', '#f8a643']
        ];

        for (let i = 0; i < 3; i++) {
          const pick = candidates.splice(rand(0, Math.min(8, candidates.length - 1)), 1)[0] || { x: COLS - 1 - i, y: ROWS - 2 - i };
          const m = makeMonster(colors[i][0], colors[i][1]);
          positionActor(m, pick.x, pick.y);
          monsters.push(m);
        }
      }

      // ------------------------------
      // Movement and animation
      // ------------------------------
      function canMove(x, y, dirIndex) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
        return maze[y][x].walls[dirIndex] === 0;
      }

      function animateMove(actor, fromX, fromY, toX, toY, ms, onDone, trailForHero = false) {
        const start = cellCenter(fromX, fromY);
        const end = cellCenter(toX, toY);
        const t0 = now();
        const startTrailMark = lastTrailAt;

        function tick() {
          const p = clamp((now() - t0) / ms, 0, 1);
          const eased = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
          actor.px = start.x + (end.x - start.x) * eased;
          actor.py = start.y + (end.y - start.y) * eased;

          if (trailForHero && now() - lastTrailAt > TRAIL_INTERVAL) {
            dropTrail(actor.px, actor.py + 6);
            lastTrailAt = now();
          }

          if (p < 1) {
            requestAnimationFrame(tick);
          } else {
            actor.x = toX;
            actor.y = toY;
            actor.px = end.x;
            actor.py = end.y;
            if (trailForHero && lastTrailAt === startTrailMark) {
              dropTrail(actor.px, actor.py + 6);
            }
            if (onDone) onDone();
          }
        }
        requestAnimationFrame(tick);
      }

      function tryHeroMove(dirIndex) {
        if (gameBusy || heroMoving) return;
        if (!canMove(hero.x, hero.y, dirIndex)) return;

        const dir = DIRS[dirIndex];
        const nx = hero.x + dir.dx;
        const ny = hero.y + dir.dy;
        heroMoving = true;
        animateMove(hero, hero.x, hero.y, nx, ny, STEP_MS, () => {
          heroMoving = false;
          checkHeroState();
          maybeContinueHeldMove();
        }, true);
      }

      function maybeContinueHeldMove() {
        if (gameBusy || heroMoving) return;
        const priority = [37, 38, 39, 40];
        for (const code of priority) {
          if (pressed.has(code)) {
            if (code === 37) return tryHeroMove(3);
            if (code === 38) return tryHeroMove(0);
            if (code === 39) return tryHeroMove(1);
            if (code === 40) return tryHeroMove(2);
          }
        }
      }

      function shortestStepToward(startX, startY, targetX, targetY) {
        const queue = [{ x: startX, y: startY }];
        const came = new Map();
        const seen = new Set([keyOf(startX, startY)]);
        while (queue.length) {
          const cur = queue.shift();
          if (cur.x === targetX && cur.y === targetY) {
            let step = cur;
            let prev = null;
            while (step && !(step.x === startX && step.y === startY)) {
              prev = step;
              step = came.get(keyOf(step.x, step.y));
            }
            return prev || { x: startX, y: startY };
          }
          neighborsOpen(cur.x, cur.y).forEach(n => {
            const k = keyOf(n.x, n.y);
            if (!seen.has(k)) {
              seen.add(k);
              came.set(k, cur);
              queue.push(n);
            }
          });
        }
        return { x: startX, y: startY };
      }

      function moveMonsters() {
        if (gameBusy) return;
        monsters.forEach((monster, idx) => {
          let next;
          const open = neighborsOpen(monster.x, monster.y);
          if (!open.length) return;

          // Monsters mostly chase the hero, but sometimes wiggle playfully.
          if (Math.random() < 0.76) {
            next = shortestStepToward(monster.x, monster.y, hero.x, hero.y);
          } else {
            next = choice(open);
          }

          animateMove(monster, monster.x, monster.y, next.x, next.y, STEP_MS + idx * 12, () => {
            if (!gameBusy && monster.x === hero.x && monster.y === hero.y) {
              loseRound();
            }
          }, false);
        });

        setTimeout(() => {
          if (!gameBusy) {
            monsters.forEach(monster => {
              if (monster.x === hero.x && monster.y === hero.y) loseRound();
            });
          }
        }, STEP_MS + 80);
      }

      function updateActorVisuals(t) {
        if (hero) {
          hero.bob += 0.16;
          const heroBounce = Math.sin(hero.bob) * (heroMoving ? 4.2 : 2.2);
          hero.group.center(hero.px, hero.py);
          hero.shadow.center(hero.px, hero.py + 13).width(24 - Math.abs(heroBounce) * 0.7);
          hero.bodyWrap.center(hero.px, hero.py + heroBounce - 2);
          const s = heroMoving ? 1.03 : 1;
          hero.bodyWrap.scale(s, s, hero.px, hero.py + heroBounce - 2);
        }

        monsters.forEach((m, i) => {
          m.wobble += 0.12 + i * 0.01;
          const wobble = Math.sin(m.wobble) * 2.8;
          m.group.center(m.px, m.py);
          m.shadow.center(m.px, m.py + 13).width(24 - Math.abs(wobble) * 0.5);
          m.body.center(m.px, m.py + wobble - 1.5);
          m.body.rotate(Math.sin(m.wobble * 0.85) * 4, m.px, m.py + wobble - 1.5);
        });
      }

      function gameLoop(t) {
        updateActorVisuals(t);
        loopHandle = requestAnimationFrame(gameLoop);
      }

      // ------------------------------
      // Game flow
      // ------------------------------
      function checkHeroState() {
        monsters.forEach(monster => {
          if (monster.x === hero.x && monster.y === hero.y) {
            loseRound();
          }
        });
        if (hero.x === COLS - 1 && hero.y === ROWS - 1) {
          winRound();
        }
      }

      function loseRound() {
        if (gameBusy) return;
        gameBusy = true;
        setText(statusText, 'Oh no! A monster\nfound Pip!');
        sparkleBurst(hero.px, hero.py, '#ff7db0');
        const card = showMessage('Oops!', 'A monster caught Pip.\nLet\'s try a brand new maze!', '#ff6ca7');
        setTimeout(() => {
          card.animate(180).opacity(0).after(() => card.remove());
          startNewGame();
        }, 1450);
      }

      function winRound() {
        if (gameBusy) return;
        gameBusy = true;
        setText(statusText, 'Hooray! Pip reached\nthe star!');
        sparkleBurst(hero.px, hero.py, '#ffd45a');
        for (let i = 0; i < 3; i++) sparkleBurst(hero.px + rand(-10, 10), hero.py + rand(-10, 10), ['#ffd45a', '#7bd389', '#88d8ff'][i]);
        const card = showMessage('You Did It!', 'Pip found the star.\nA fresh maze is coming!', '#59b76b');
        setTimeout(() => {
          card.animate(180).opacity(0).after(() => card.remove());
          startNewGame();
        }, 1550);
      }

      function startNewGame() {
        gameBusy = false;
        heroMoving = false;
        lastTrailAt = 0;
        showingSolution = false;
        setText(pathButton.text, 'Show Path');
        setText(statusText, 'Ready to play!');
        overlayLayer.clear();
        actorLayer.clear();
        solutionLayer.clear();
        trailLayer.clear();
        pressed.clear();

        generateMaze();
        solveMaze();
        drawBoard();

        hero = makeHero();
        positionActor(hero, 0, 0);
        placeMonsters();
        setSolutionVisible(false);

        if (monsterTick) clearInterval(monsterTick);
        monsterTick = setInterval(moveMonsters, MONSTER_STEP_MS);
      }

      // ------------------------------
      // Buttons and events
      // ------------------------------
      pathButton.group.on('click', () => {
        if (gameBusy) return;
        setSolutionVisible(!showingSolution);
      });

      restartButton.group.on('click', () => startNewGame());

      window.addEventListener('keydown', e => {
        if ([37, 38, 39, 40].includes(e.keyCode)) e.preventDefault();
        pressed.add(e.keyCode);
        if (e.key === 'ArrowUp') tryHeroMove(0);
        else if (e.key === 'ArrowRight') tryHeroMove(1);
        else if (e.key === 'ArrowDown') tryHeroMove(2);
        else if (e.key === 'ArrowLeft') tryHeroMove(3);
        else if (e.key.toLowerCase() === 'h') setSolutionVisible(!showingSolution);
        else if (e.key.toLowerCase() === 'r') startNewGame();
      });

      window.addEventListener('keyup', e => {
        pressed.delete(e.keyCode);
      });

      // Gentle pulsing on the path button.
      function pulseButton() {
        pathButton.group.animate(900).transform({ scale: 1.04 }, true).animate(900).transform({ scale: 1 }, true).after(pulseButton);
      }
      pulseButton();

      // Start the first maze and the animation loop.
      startNewGame();
      loopHandle = requestAnimationFrame(gameLoop);

      // Make the SVG responsive with a small viewbox tweak on resize.
      window.addEventListener('resize', () => {
        draw.viewbox(0, 0, WIDTH, HEIGHT);
      });
    })();
  </script>
</body>
</html>
