<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Maze Adventure</title>
    <!-- Load svg.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* AliceBlue - light and friendly */
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; /* Child-friendly font */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 {
            color: #ff6b6b;
            text-shadow: 2px 2px 0px #ffe66d;
            margin: 10px 0;
            font-size: 2.5rem;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
            background-color: #fff;
            border: 8px solid #4ecdc4;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to SVG if needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 4px solid #ff6b6b;
            display: none; /* Hidden by default */
            pointer-events: auto;
            margin: 0 auto;
            width: 300px;
            top: 30%;
            position: relative;
        }

        .message-box h2 {
            margin: 0 0 10px 0;
            color: #4ecdc4;
        }

        button {
            background-color: #ffe66d;
            border: none;
            padding: 10px 20px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: #ff6b6b;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #e5c343;
            transition: transform 0.1s;
            pointer-events: auto;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #e5c343;
        }

        button#show-solution-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #4ecdc4;
            color: white;
            box-shadow: 0 4px 0 #3dbbb3;
            z-index: 10;
        }
        
        button#show-solution-btn:active {
            box-shadow: 0 0 0 #3dbbb3;
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #888;
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Happy Maze Adventure!</h1>

    <div id="game-container">
        <!-- SVG will be injected here by svg.js -->
        
        <div id="ui-layer">
            <div class="controls-hint">Use Arrow Keys to Move</div>
            <button id="show-solution-btn" onclick="showSolution()">Show Path</button>
        </div>

        <div id="win-message" class="message-box">
            <h2>You Won! 🎉</h2>
            <p>Great job finding the exit!</p>
            <button onclick="initGame()">Play Again</button>
        </div>

        <div id="lose-message" class="message-box">
            <h2>Oh No! 👻</h2>
            <p>The friendly ghost caught you!</p>
            <button onclick="initGame()">Try Again</button>
        </div>
    </div>

    <script>
        // --- Configuration ---
        const COLS = 20;
        const ROWS = 20;
        const CELL_SIZE = 30; // Size of each grid cell in pixels
        const WALL_THICKNESS = 4;
        const SPEED = 0.15; // Player movement speed (cells per frame approx)
        
        // Colors
        const COLOR_WALL = '#556270';
        const COLOR_BG = '#ffffff';
        const COLOR_PLAYER = '#ff6b6b';
        const COLOR_ENEMY = '#a8d8ea';
        const COLOR_TRAIL = '#ffe66d';
        const COLOR_START = '#aaeea3';
        const COLOR_END = '#ffd93d';

        // --- Global Variables ---
        let draw; // The main SVG canvas
        let maze = []; // 2D array storing cell data
        let player = { x: 0, y: 0, vx: 0, vy: 0, group: null, trail: [] };
        let enemies = []; // Array of enemy objects
        let isGameActive = false;
        let solutionPath = []; // Stores coordinates of the solution

        // --- Initialization ---
        window.onload = function() {
            // Initialize SVG canvas
            const container = document.getElementById('game-container');
            const width = COLS * CELL_SIZE;
            const height = ROWS * CELL_SIZE;
            
            // Set container size explicitly
            container.style.width = width + 'px';
            container.style.height = height + 'px';

            draw = SVG().addTo('#game-container').size(width, height);
            
            // Start the game
            initGame();

            // Keyboard Input
            document.addEventListener('keydown', handleInput);
        };

        function initGame() {
            // Reset State
            isGameActive = true;
            document.getElementById('win-message').style.display = 'none';
            document.getElementById('lose-message').style.display = 'none';
            document.getElementById('show-solution-btn').style.display = 'block';
            
            // Clear SVG
            draw.clear();

            // 1. Generate Maze
            generateMaze();

            // 2. Draw Maze Walls
            drawMaze();

            // 3. Create Player
            createPlayer();

            // 4. Create Enemies
            createEnemies(3); // Spawn 3 enemies

            // 5. Draw Start and End Zones
            drawStartEnd();

            // 6. Calculate Solution (for the button)
            calculateSolution();
        }

        // --- Maze Generation (Recursive Backtracker) ---
        function generateMaze() {
            // Initialize grid: 1 = wall, 0 = path
            // We actually store objects: { top: true, right: true, bottom: true, left: true, visited: false }
            maze = [];
            for (let y = 0; y < ROWS; y++) {
                let row = [];
                for (let x = 0; x < COLS; x++) {
                    row.push({ 
                        x: x, y: y, 
                        visited: false, 
                        walls: { top: true, right: true, bottom: true, left: true } 
                    });
                }
                maze.push(row);
            }

            let stack = [];
            let current = maze[0][0];
            current.visited = true;

            while (true) {
                let next = getUnvisitedNeighbor(current);
                if (next) {
                    next.visited = true;
                    stack.push(current);
                    removeWalls(current, next);
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }
        }

        function getUnvisitedNeighbor(cell) {
            let neighbors = [];
            let { x, y } = cell;

            if (y > 0 && !maze[y-1][x].visited) neighbors.push(maze[y-1][x]); // Top
            if (x < COLS-1 && !maze[y][x+1].visited) neighbors.push(maze[y][x+1]); // Right
            if (y < ROWS-1 && !maze[y+1][x].visited) neighbors.push(maze[y+1][x]); // Bottom
            if (x > 0 && !maze[y][x-1].visited) neighbors.push(maze[y][x-1]); // Left

            if (neighbors.length > 0) {
                return neighbors[Math.floor(Math.random() * neighbors.length)];
            }
            return undefined;
        }

        function removeWalls(a, b) {
            let x = a.x - b.x;
            if (x === 1) { a.walls.left = false; b.walls.right = false; }
            else if (x === -1) { a.walls.right = false; b.walls.left = false; }

            let y = a.y - b.y;
            if (y === 1) { a.walls.top = false; b.walls.bottom = false; }
            else if (y === -1) { a.walls.bottom = false; b.walls.top = false; }
        }

        // --- Drawing Functions ---
        function drawMaze() {
            // Draw Background
            draw.rect(COLS * CELL_SIZE, ROWS * CELL_SIZE).fill(COLOR_BG);

            // Draw Walls
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let cell = maze[y][x];
                    let px = x * CELL_SIZE;
                    let py = y * CELL_SIZE;

                    // Draw individual walls based on cell data
                    if (cell.walls.top) {
                        draw.line(px, py, px + CELL_SIZE, py).stroke({ width: WALL_THICKNESS, color: COLOR_WALL, linecap: 'square' });
                    }
                    if (cell.walls.left) {
                        draw.line(px, py, px, py + CELL_SIZE).stroke({ width: WALL_THICKNESS, color: COLOR_WALL, linecap: 'square' });
                    }
                    // We only draw Top and Left to avoid double drawing, 
                    // but we must draw Bottom and Right for the last row/col
                    if (y === ROWS - 1 && cell.walls.bottom) {
                        draw.line(px, py + CELL_SIZE, px + CELL_SIZE, py + CELL_SIZE).stroke({ width: WALL_THICKNESS, color: COLOR_WALL, linecap: 'square' });
                    }
                    if (x === COLS - 1 && cell.walls.right) {
                        draw.line(px + CELL_SIZE, py, px + CELL_SIZE, py + CELL_SIZE).stroke({ width: WALL_THICKNESS, color: COLOR_WALL, linecap: 'square' });
                    }
                }
            }
        }

        function drawStartEnd() {
            // Start Zone (Top Left)
            draw.rect(CELL_SIZE, CELL_SIZE).fill(COLOR_START).opacity(0.5).move(0, 0);
            draw.text("START").font({ size: 10, anchor: 'middle' }).fill('#333').move(CELL_SIZE/2, CELL_SIZE/2 - 5);

            // End Zone (Bottom Right)
            let endX = (COLS - 1) * CELL_SIZE;
            let endY = (ROWS - 1) * CELL_SIZE;
            draw.rect(CELL_SIZE, CELL_SIZE).fill(COLOR_END).opacity(0.5).move(endX, endY);
            draw.text("GOAL").font({ size: 10, anchor: 'middle' }).fill('#333').move(endX + CELL_SIZE/2, endY + CELL_SIZE/2 - 5);
        }

        function createPlayer() {
            player.x = 0; // Grid coordinates (float for smooth movement)
            player.y = 0;
            player.vx = 0;
            player.vy = 0;
            player.trail = [];

            // Create SVG Group for the Hero
            player.group = draw.group();
            
            // Body
            let body = player.group.circle(CELL_SIZE * 0.7).fill(COLOR_PLAYER).stroke({width: 2, color: '#fff'});
            body.move(CELL_SIZE * 0.15, CELL_SIZE * 0.15);

            // Eyes (Cute factor)
            let eyeLeft = player.group.circle(CELL_SIZE * 0.15).fill('white');
            eyeLeft.move(CELL_SIZE * 0.3, CELL_SIZE * 0.35);
            let eyeRight = player.group.circle(CELL_SIZE * 0.15).fill('white');
            eyeRight.move(CELL_SIZE * 0.55, CELL_SIZE * 0.35);
            
            let pupilLeft = player.group.circle(CELL_SIZE * 0.07).fill('black');
            pupilLeft.move(CELL_SIZE * 0.33, CELL_SIZE * 0.38);
            let pupilRight = player.group.circle(CELL_SIZE * 0.07).fill('black');
            pupilRight.move(CELL_SIZE * 0.58, CELL_SIZE * 0.38);

            updatePlayerPosition();
            
            // Start Animation Loop
            requestAnimationFrame(gameLoop);
        }

        function createEnemies(count) {
            enemies = [];
            for (let i = 0; i < count; i++) {
                // Spawn enemies away from player (0,0)
                let ex = Math.floor(Math.random() * (COLS - 5)) + 5;
                let ey = Math.floor(Math.random() * (ROWS - 5)) + 5;
                
                let enemyGroup = draw.group();
                // Blob shape
                let body = enemyGroup.ellipse(CELL_SIZE * 0.8, CELL_SIZE * 0.7).fill(COLOR_ENEMY).stroke({width: 2, color: '#fff'});
                body.move(CELL_SIZE * 0.1, CELL_SIZE * 0.15);
                // Eyes
                let e1 = enemyGroup.circle(CELL_SIZE * 0.1).fill('black').move(CELL_SIZE * 0.25, CELL_SIZE * 0.3);
                let e2 = enemyGroup.circle(CELL_SIZE * 0.1).fill('black').move(CELL_SIZE * 0.45, CELL_SIZE * 0.3);

                enemies.push({
                    x: ex,
                    y: ey,
                    group: enemyGroup,
                    moveTimer: 0,
                    direction: { x: 0, y: 0 }
                });
                updateEnemyPosition(enemies[i]);
            }
        }

        // --- Game Logic ---

        function handleInput(e) {
            if (!isGameActive) return;

            // Prevent default scrolling
            if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }

            let nextX = player.x;
            let nextY = player.y;

            if (e.key === 'ArrowUp') nextY--;
            if (e.key === 'ArrowDown') nextY++;
            if (e.key === 'ArrowLeft') nextX--;
            if (e.key === 'ArrowRight') nextX++;

            // Check Collision with Walls before moving
            if (canMove(player.x, player.y, nextX, nextY)) {
                player.vx = nextX - player.x;
                player.vy = nextY - player.y;
            }
        }

        function canMove(currX, currY, nextX, nextY) {
            // Ensure we are roughly centered in a cell before allowing turn (simplifies logic)
            // For this simple version, we check grid coordinates directly.
            // We need to check the wall between current cell and next cell.
            
            let cx = Math.round(currX);
            let cy = Math.round(currY);
            let nx = Math.round(nextX);
            let ny = Math.round(nextY);

            // Bounds check
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return false;

            let currentCell = maze[cy][cx];
            
            if (nx > cx) return !currentCell.walls.right;
            if (nx < cx) return !currentCell.walls.left;
            if (ny > cy) return !currentCell.walls.bottom;
            if (ny < cy) return !currentCell.walls.top;

            return false;
        }

        function updatePlayerPosition() {
            if (player.group) {
                player.group.move(player.x * CELL_SIZE, player.y * CELL_SIZE);
            }
        }

        function updateEnemyPosition(enemy) {
            enemy.group.move(enemy.x * CELL_SIZE, enemy.y * CELL_SIZE);
        }

        function addTrail() {
            // Add a circle at player position
            let circle = draw.circle(CELL_SIZE * 0.3).fill(COLOR_TRAIL).opacity(0.6);
            circle.move(player.x * CELL_SIZE + CELL_SIZE*0.35, player.y * CELL_SIZE + CELL_SIZE*0.35);
            player.trail.push(circle);

            // Limit trail length
            if (player.trail.length > 20) {
                let old = player.trail.shift();
                old.remove();
            }
        }

        function moveEnemies() {
            enemies.forEach(enemy => {
                enemy.moveTimer++;
                // Move every 15 frames (slower than player)
                if (enemy.moveTimer > 15) {
                    enemy.moveTimer = 0;
                    
                    // Simple AI: Try to move towards player, otherwise random
                    let possibleMoves = [];
                    let dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];
                    
                    dirs.forEach(d => {
                        if (canMove(enemy.x, enemy.y, enemy.x + d.x, enemy.y + d.y)) {
                            possibleMoves.push(d);
                        }
                    });

                    if (possibleMoves.length > 0) {
                        // 30% chance to move towards player, 70% random
                        if (Math.random() < 0.3) {
                            // Sort moves by distance to player
                            possibleMoves.sort((a, b) => {
                                let distA = Math.hypot((enemy.x + a.x) - player.x, (enemy.y + a.y) - player.y);
                                let distB = Math.hypot((enemy.x + b.x) - player.x, (enemy.y + b.y) - player.y);
                                return distA - distB;
                            });
                            enemy.x += possibleMoves[0].x;
                            enemy.y += possibleMoves[0].y;
                        } else {
                            let move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                            enemy.x += move.x;
                            enemy.y += move.y;
                        }
                        updateEnemyPosition(enemy);
                    }
                }
            });
        }

        function checkCollisions() {
            // 1. Player vs Goal
            if (Math.round(player.x) === COLS - 1 && Math.round(player.y) === ROWS - 1) {
                gameWin();
            }

            // 2. Player vs Enemies
            let px = Math.round(player.x);
            let py = Math.round(player.y);
            
            for (let enemy of enemies) {
                let ex = Math.round(enemy.x);
                let ey = Math.round(enemy.y);
                
                if (px === ex && py === ey) {
                    gameLoss();
                }
            }
        }

        function gameLoop() {
            if (!isGameActive) return;

            // Smooth Player Movement
            if (player.vx !== 0 || player.vy !== 0) {
                player.x += player.vx * SPEED;
                player.y += player.vy * SPEED;

                // Snap to grid if close enough to stop sliding
                if (Math.abs(player.x - Math.round(player.x)) < 0.1 && 
                    Math.abs(player.y - Math.round(player.y)) < 0.1) {
                    player.x = Math.round(player.x);
                    player.y = Math.round(player.y);
                    player.vx = 0;
                    player.vy = 0;
                    addTrail(); // Add trail only when landing on a new cell
                }
                updatePlayerPosition();
            }

            moveEnemies();
            checkCollisions();

            requestAnimationFrame(gameLoop);
        }

        function gameWin() {
            isGameActive = false;
            document.getElementById('win-message').style.display = 'block';
            document.getElementById('show-solution-btn').style.display = 'none';
        }

        function gameLoss() {
            isGameActive = false;
            document.getElementById('lose-message').style.display = 'block';
            document.getElementById('show-solution-btn').style.display = 'none';
        }

        // --- Solution Path Logic (BFS) ---
        function calculateSolution() {
            // Breadth-First Search to find shortest path
            let queue = [{ x: 0, y: 0, path: [] }];
            let visited = new Set();
            visited.add("0,0");

            while (queue.length > 0) {
                let current = queue.shift();
                
                if (current.x === COLS - 1 && current.y === ROWS - 1) {
                    solutionPath = current.path;
                    return;
                }

                let dirs = [{x:0, y:-1}, {x:0, y:1}, {x:-1, y:0}, {x:1, y:0}];
                for (let d of dirs) {
                    let nx = current.x + d.x;
                    let ny = current.y + d.y;
                    let key = `${nx},${ny}`;

                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !visited.has(key)) {
                        if (canMove(current.x, current.y, nx, ny)) {
                            visited.add(key);
                            let newPath = [...current.path, {x: nx, y: ny}];
                            queue.push({ x: nx, y: ny, path: newPath });
                        }
                    }
                }
            }
        }

        function showSolution() {
            if (solutionPath.length === 0) return;
            
            // Draw a line through the solution path
            let points = solutionPath.map(p => {
                return `${(p.x * CELL_SIZE) + CELL_SIZE/2},${(p.y * CELL_SIZE) + CELL_SIZE/2}`;
            }).join(' ');

            // Add start point
            points = `${CELL_SIZE/2},${CELL_SIZE/2} ` + points;

            draw.polyline(points).fill('none').stroke({ width: 5, color: '#ff6b6b', opacity: 0.6, linecap: 'round', linejoin: 'round' });
            
            // Disable button after showing
            document.getElementById('show-solution-btn').style.display = 'none';
        }

    </script>
</body>
</html>
