<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maze Quest! — A kindergarten maze game</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" />
<!-- SVG.js : everything drawn on the page comes through it -->
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>
<style>
/* ============================================================
   MAZE QUEST — big, rounded, pastel, kindergarten-friendly
   ============================================================ */
:root {
  --bg:         #fef5e4;     /* warm cream */
  --bg-deep:    #fae8cb;
  --ink:        #3d2b56;     /* deep purple, not black */
  --wall:       #5a3e8c;     /* maze walls */
  --paper:      #fffef8;     /* maze floor */
  --accent:     #ff3e8b;     /* hot pink accent */
  --accent-2:   #4cc9f0;     /* sky blue */
  --sun:        #ffd166;     /* goldenrod */
  --green:      #06d6a0;
  --coral:      #ee6352;
  --rule:       #d9c9a8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  /* soft decorative dots — gentle background pattern */
  background-image:
    radial-gradient(circle at 8% 18%,  rgba(255, 209, 102, 0.4) 4px, transparent 5px),
    radial-gradient(circle at 92% 28%, rgba(76, 201, 240, 0.35) 5px, transparent 6px),
    radial-gradient(circle at 16% 85%, rgba(255, 62, 139, 0.3) 4px, transparent 5px),
    radial-gradient(circle at 88% 78%, rgba(6, 214, 160, 0.3) 4px, transparent 5px),
    radial-gradient(circle at 50% 10%, rgba(255, 62, 139, 0.2) 3px, transparent 4px);
  background-size: 340px 340px, 420px 420px, 300px 300px, 380px 380px, 260px 260px;
  color: var(--ink);
  font-family: 'Nunito', -apple-system, sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  overflow: auto;
}

#app {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ------- Top bar -------- */
.top {
  background: white;
  border-radius: 24px;
  padding: 18px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow:
    0 4px 0 rgba(90, 62, 140, 0.15),
    0 14px 36px rgba(61, 43, 86, 0.08);
  border: 3px solid white;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand .emoji {
  font-size: 34px;
  filter: drop-shadow(0 2px 0 rgba(61, 43, 86, 0.15));
}
.brand h1 {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 32px;
  color: var(--ink);
  line-height: 1;
  letter-spacing: -0.01em;
}
.brand h1 em {
  color: var(--accent);
  font-style: normal;
}

.buttons {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.btn {
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 17px;
  padding: 11px 20px 9px;
  background: white;
  color: var(--ink);
  border: 3px solid var(--ink);
  border-radius: 16px;
  cursor: pointer;
  transition: transform 120ms, box-shadow 120ms;
  box-shadow: 0 4px 0 var(--ink);
  line-height: 1;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--ink); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }

.btn.primary {
  background: var(--accent);
  color: white;
  border-color: var(--ink);
}
.btn.primary:hover { background: #ff5a9c; }

.btn.sun {
  background: var(--sun);
  color: var(--ink);
}

/* ------- Playfield -------- */
.playfield {
  position: relative;
  background: white;
  border-radius: 28px;
  padding: 16px;
  box-shadow:
    0 6px 0 rgba(90, 62, 140, 0.15),
    0 18px 40px rgba(61, 43, 86, 0.1);
  border: 3px solid white;
}

#maze {
  border-radius: 20px;
  overflow: hidden;
  background: var(--paper);
  /* very subtle inner shading */
  box-shadow: inset 0 0 0 2px var(--rule);
  aspect-ratio: 1 / 1;
}
#maze svg {
  display: block;
  width: 100%;
  height: 100%;
}

/* ------- Bottom bar -------- */
.bottom {
  background: white;
  border-radius: 20px;
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  box-shadow: 0 4px 0 rgba(90, 62, 140, 0.12);
  border: 3px solid white;
}

.instruction {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  font-weight: 600;
  color: var(--ink);
}
.instruction .key {
  display: inline-grid;
  place-items: center;
  width: 26px; height: 26px;
  background: var(--bg);
  border: 2px solid var(--ink);
  border-radius: 7px;
  font-family: 'Fredoka', sans-serif;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 2px 0 var(--ink);
  margin-right: 1px;
}

.counter {
  font-family: 'Fredoka', sans-serif;
  font-weight: 500;
  font-size: 16px;
  color: var(--ink);
  background: var(--bg);
  padding: 8px 14px;
  border-radius: 14px;
  border: 2px dashed var(--rule);
}
.counter strong {
  color: var(--accent);
  font-size: 19px;
  font-weight: 700;
}

/* ------- Game-over banner (briefly shown on capture) -------- */
.banner {
  position: absolute;
  inset: 16px;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(255, 245, 228, 0.82);
  border-radius: 20px;
  z-index: 50;
  pointer-events: none;
  animation: bannerIn 220ms cubic-bezier(.2, 1.4, .3, 1);
}
.banner.visible { display: flex; }
@keyframes bannerIn {
  from { opacity: 0; transform: scale(0.9); }
  to   { opacity: 1; transform: none; }
}
.banner .card {
  background: white;
  padding: 20px 28px;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 6px 0 var(--ink);
  border: 3px solid var(--ink);
}
.banner .card .line1 {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: 28px;
  color: var(--accent);
}
.banner .card .line2 {
  font-weight: 600;
  color: var(--ink);
  margin-top: 2px;
}

/* Media tweaks so mobile doesn't break */
@media (max-width: 520px) {
  .brand h1 { font-size: 24px; }
  .btn { font-size: 14px; padding: 9px 14px 7px; }
  .instruction { font-size: 14px; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ============ TOP BAR: title + buttons ============ -->
  <header class="top">
    <div class="brand">
      <span class="emoji">🗺️</span>
      <h1>Maze <em>Quest!</em></h1>
    </div>
    <div class="buttons">
      <button id="btn-solution" class="btn sun">💡 Show Path</button>
      <button id="btn-new" class="btn primary">✨ New Maze</button>
    </div>
  </header>

  <!-- ============ PLAYFIELD: the SVG.js maze lives here ============ -->
  <div class="playfield">
    <div id="maze"></div>

    <!-- Briefly shown when a monster catches the hero -->
    <div class="banner" id="banner">
      <div class="card">
        <div class="line1" id="banner-line1">Oh no!</div>
        <div class="line2" id="banner-line2">A monster caught you — starting over!</div>
      </div>
    </div>
  </div>

  <!-- ============ BOTTOM BAR: instructions + progress ============ -->
  <footer class="bottom">
    <div class="instruction">
      Use
      <span class="key">←</span><span class="key">↑</span><span class="key">↓</span><span class="key">→</span>
      to move &nbsp;•&nbsp; 🏠 reach the house &nbsp;•&nbsp; 👻 avoid monsters
    </div>
    <div class="counter">Mazes solved: <strong id="solved-count">0</strong></div>
  </footer>

</div>

<script>
'use strict';

/* ============================================================================
   MAZE QUEST — game code
   ============================================================================ */

/* ---- Grid and drawing constants ---- */
const ROWS = 20;           // maze height (cells)
const COLS = 20;           // maze width (cells)
const CELL = 30;           // pixel size of one cell
const PAD  = 20;           // pixel padding around the maze inside the SVG
const SVG_W = COLS * CELL + PAD * 2;   // 640
const SVG_H = ROWS * CELL + PAD * 2;   // 640

/* ---- Palette (matches CSS vars) ---- */
const COLORS = {
  floor:     '#fffef8',
  wall:      '#5a3e8c',
  wallShade: '#432a6e',
  // hero — a peach bunny
  heroBody:  '#ffb088',
  heroLine:  '#b76c53',
  heroCheek: '#ff7979',
  heroInner: '#ff9aa2',
  // goal — a cozy house
  houseBody:    '#ee6352',
  houseRoof:    '#a13d32',
  houseWindow:  '#ffd166',
  houseDoor:    '#5a3617',
  // breadcrumb trail
  trail:         '#ffb703',
  trailGlow:     '#ffd166',
  // solution path highlight
  solution:      '#ff3e8b',
  // three monster colors
  monsters:      ['#a084dc', '#6ec4a0', '#ffa07a'],
  // spawn point marker
  startMark:     '#4cc9f0',
};

/* Hero speed and monster cadence */
const HERO_MOVE_MS      = 140;   // duration of one hero step tween
const MONSTER_MOVE_MS   = 380;   // duration of one monster step tween
const MONSTER_TICK_MS   = 750;   // monsters try to move this often
const TRAIL_INTERVAL_MS = 250;   // trail circle cadence
const TRAIL_MAX         = 60;    // cap so memory doesn't grow unbounded

/* ============================================================================
   PART 1 — MAZE GENERATION via randomized iterative DFS
   ----------------------------------------------------------------------------
   Each cell starts with all 4 walls up. Starting at (0,0), we pick a random
   unvisited neighbour, knock down the wall between them, and recurse (via an
   explicit stack). The resulting graph is a spanning tree — every cell is
   reachable from every other cell through exactly one path, so any chosen
   start/goal pair is guaranteed solvable.
   ============================================================================ */

const OPP    = { n: 's', s: 'n', e: 'w', w: 'e' };
const DELTAS = { n: [-1, 0], s: [1, 0], w: [0, -1], e: [0, 1] };

function generateMaze() {
  // 1. Build empty grid with all walls up
  const grid = [];
  for (let r = 0; r < ROWS; r++) {
    const row = [];
    for (let c = 0; c < COLS; c++) {
      row.push({
        walls: { n: true, s: true, e: true, w: true },
        visited: false,
      });
    }
    grid.push(row);
  }

  // 2. Iterative DFS from the starting cell
  const stack = [[0, 0]];
  grid[0][0].visited = true;

  while (stack.length) {
    const [r, c] = stack[stack.length - 1];

    // Find unvisited neighbours of the current cell
    const candidates = [];
    for (const dir of ['n', 's', 'e', 'w']) {
      const [dr, dc] = DELTAS[dir];
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !grid[nr][nc].visited) {
        candidates.push([nr, nc, dir]);
      }
    }

    if (!candidates.length) {
      stack.pop();                       // dead end → backtrack
      continue;
    }

    const [nr, nc, dir] = candidates[Math.floor(Math.random() * candidates.length)];
    grid[r][c].walls[dir]        = false;  // knock wall between current and next
    grid[nr][nc].walls[OPP[dir]] = false;
    grid[nr][nc].visited = true;
    stack.push([nr, nc]);
  }

  return grid;
}

/* ============================================================================
   PART 2 — BFS PATHFINDING for the "Show Path" button
   ----------------------------------------------------------------------------
   Classic breadth-first search over the maze graph. Returns the list of
   [r, c] cells from start to goal, inclusive, or null if unreachable (never
   happens in a perfect maze, but the check is cheap and correct).
   ============================================================================ */
function findPath(grid, sr, sc, er, ec) {
  const prev = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  prev[sr][sc] = 'start';

  const queue = [[sr, sc]];
  while (queue.length) {
    const [r, c] = queue.shift();
    if (r === er && c === ec) {
      // Trace back from goal to start using the predecessor table
      const path = [];
      let cr = r, cc = c;
      while (!(cr === sr && cc === sc)) {
        path.unshift([cr, cc]);
        const p = prev[cr][cc];
        cr = p[0]; cc = p[1];
      }
      path.unshift([sr, sc]);
      return path;
    }

    const cell = grid[r][c];
    for (const dir of ['n', 's', 'e', 'w']) {
      if (cell.walls[dir]) continue;
      const [dr, dc] = DELTAS[dir];
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
      if (prev[nr][nc] !== null) continue;
      prev[nr][nc] = [r, c];
      queue.push([nr, nc]);
    }
  }
  return null;
}

/* ============================================================================
   PART 3 — COORDINATE HELPERS
   ============================================================================ */
function cellToPx(r, c) {
  // Pixel CENTRE of cell (r, c) in the SVG's coordinate system
  return {
    x: PAD + c * CELL + CELL / 2,
    y: PAD + r * CELL + CELL / 2,
  };
}

/* ============================================================================
   PART 4 — CUSTOM TWEEN
   ----------------------------------------------------------------------------
   A tiny requestAnimationFrame-driven tween that moves a group's `translate`
   smoothly between two pixel positions using a smoothstep easing curve.
   Used for hero and monster movement. Self-contained and dependable.
   ============================================================================ */
function tweenTranslate(group, tx, ty, duration, onDone) {
  const m = group.transform();
  const sx = m.translateX || 0;
  const sy = m.translateY || 0;
  const t0 = performance.now();

  function step(now) {
    const t = Math.min(1, (now - t0) / duration);
    const e = t * t * (3 - 2 * t);                      // smoothstep
    group.transform({ translate: [sx + (tx - sx) * e, sy + (ty - sy) * e] });
    if (t < 1) requestAnimationFrame(step);
    else if (onDone) onDone();
  }
  requestAnimationFrame(step);
}

/* ============================================================================
   PART 5 — DRAWING HELPERS (using SVG.js)
   ============================================================================ */

/* Draw a storybook house (the goal), centred at origin.
   Parent receives a group so the whole house moves together if needed. */
function drawHouse(parent) {
  const g = parent.group();
  // body
  g.rect(22, 16).radius(2).fill(COLORS.houseBody)
    .stroke({ color: COLORS.houseRoof, width: 1.5 }).center(0, 3);
  // roof — triangle with rounded joins
  g.polygon('-13,-5 13,-5 0,-16').fill(COLORS.houseRoof)
    .stroke({ color: '#6b2a20', width: 1.5, linejoin: 'round' });
  // window
  g.rect(5, 5).fill(COLORS.houseWindow)
    .stroke({ color: COLORS.houseRoof, width: 1 }).center(-6, 2);
  g.line(-6, -0.5, -6, 4.5).stroke({ color: COLORS.houseRoof, width: 0.8 });
  g.line(-8.5, 2, -3.5, 2).stroke({ color: COLORS.houseRoof, width: 0.8 });
  // door
  g.rect(5, 8).radius(2.5).fill(COLORS.houseDoor).center(2, 7);
  g.circle(0.9).fill(COLORS.houseWindow).center(3.5, 7.5);
  // chimney puff — a little cloud above the roof
  g.circle(3).fill('white').opacity(0.9).center(8, -16);
  g.circle(2.5).fill('white').opacity(0.9).center(10.5, -17);
  return g;
}

/* Draw the hero (peach bunny) centred at origin. */
function drawHero(parent) {
  const g = parent.group();
  // ears (behind the body)
  g.ellipse(6, 13).fill(COLORS.heroBody)
    .stroke({ color: COLORS.heroLine, width: 1.5 }).center(-6, -14);
  g.ellipse(6, 13).fill(COLORS.heroBody)
    .stroke({ color: COLORS.heroLine, width: 1.5 }).center(6, -14);
  // inner ears
  g.ellipse(2.5, 8).fill(COLORS.heroInner).center(-6, -14);
  g.ellipse(2.5, 8).fill(COLORS.heroInner).center(6, -14);

  // body
  g.circle(22).fill(COLORS.heroBody)
    .stroke({ color: COLORS.heroLine, width: 1.8 }).center(0, 0);

  // cheeks
  g.circle(4).fill(COLORS.heroCheek).opacity(0.55).center(-7, 3);
  g.circle(4).fill(COLORS.heroCheek).opacity(0.55).center(7, 3);

  // eyes: white + pupil + tiny highlight
  g.circle(5).fill('white').center(-4, -2);
  g.circle(5).fill('white').center(4, -2);
  g.circle(2.6).fill('#2d2d2d').center(-4, -1.5);
  g.circle(2.6).fill('#2d2d2d').center(4, -1.5);
  g.circle(0.9).fill('white').center(-3.2, -2.3);
  g.circle(0.9).fill('white').center(4.8, -2.3);

  // tiny pink nose
  g.ellipse(2, 1.4).fill(COLORS.heroCheek).center(0, 2);
  // smile
  g.path('M -3 5 Q 0 8 3 5').fill('none')
    .stroke({ color: '#2d2d2d', width: 1.4, linecap: 'round' });
  return g;
}

/* Draw a monster blob in one of three colors, centred at origin. */
function drawMonster(parent, colorIdx) {
  const g = parent.group();
  const color = COLORS.monsters[colorIdx];
  const dark  = shade(color, -35);

  // blob body — slightly irregular rounded shape
  g.path('M -11 0 Q -13 -10 -4 -12 Q 4 -14 11 -8 Q 14 0 11 7 Q 4 13 -4 12 Q -13 11 -11 0 Z')
    .fill(color)
    .stroke({ color: dark, width: 1.8, linejoin: 'round' });

  // wavy antenna
  g.path('M 0 -12 Q -2 -15 0 -17').fill('none')
    .stroke({ color: dark, width: 1.8, linecap: 'round' });
  g.circle(3).fill(dark).center(0, -17);

  // googly eyes — deliberately different sizes
  g.circle(7).fill('white').stroke({ color: dark, width: 1 }).center(-3, -2);
  g.circle(5.5).fill('white').stroke({ color: dark, width: 1 }).center(5, 1);
  g.circle(2.8).fill('#1e1e1e').center(-3, -1);
  g.circle(2.2).fill('#1e1e1e').center(5, 2);
  g.circle(0.8).fill('white').center(-2.2, -1.7);
  g.circle(0.6).fill('white').center(5.5, 1.3);

  // small O mouth
  g.ellipse(3, 2).fill('#1e1e1e').center(2, 7);

  // two small "feet" dots
  g.circle(2).fill(dark).opacity(0.7).center(-5, 12);
  g.circle(2).fill(dark).opacity(0.7).center(5, 12);
  return g;
}

/* Utility: lighten/darken a hex colour by `amt` on each RGB channel */
function shade(hex, amt) {
  const h = hex.replace('#', '');
  const r = clamp(parseInt(h.slice(0, 2), 16) + amt);
  const g = clamp(parseInt(h.slice(2, 4), 16) + amt);
  const b = clamp(parseInt(h.slice(4, 6), 16) + amt);
  return '#' + pad2(r) + pad2(g) + pad2(b);
}
function clamp(n) { return Math.max(0, Math.min(255, n)); }
function pad2(n)  { return n.toString(16).padStart(2, '0'); }

/* ============================================================================
   PART 6 — RENDERING THE STATIC MAZE (floor, walls, goal)
   ============================================================================ */

/* Draw every wall line. We draw the North and West walls of each cell, then
   the outer South and East borders. This avoids drawing any wall twice. */
function drawWalls(layer, grid) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = grid[r][c];
      const x = PAD + c * CELL;
      const y = PAD + r * CELL;
      // N wall
      if (cell.walls.n) {
        layer.line(x, y, x + CELL, y)
          .stroke({ color: COLORS.wall, width: 4, linecap: 'round' });
      }
      // W wall
      if (cell.walls.w) {
        layer.line(x, y, x, y + CELL)
          .stroke({ color: COLORS.wall, width: 4, linecap: 'round' });
      }
    }
  }
  // Outer South border
  const y2 = PAD + ROWS * CELL;
  layer.line(PAD, y2, PAD + COLS * CELL, y2)
    .stroke({ color: COLORS.wall, width: 4, linecap: 'round' });
  // Outer East border
  const x2 = PAD + COLS * CELL;
  layer.line(x2, PAD, x2, PAD + ROWS * CELL)
    .stroke({ color: COLORS.wall, width: 4, linecap: 'round' });
}

/* ============================================================================
   PART 7 — GAME STATE + ROOT SVG SETUP
   ============================================================================ */

const state = {
  grid:           null,
  hero:           null,
  monsters:       [],
  // layers (SVG groups) — set once, cleared/redrawn on new maze
  layers:         null,
  // trail management
  trailCircles:   [],
  lastTrailCell:  null,   // only drop a new trail circle if hero has moved
  movedSinceTrail: false,
  // solution visibility
  solutionShown:  false,
  solutionGroup:  null,
  // intervals/timers
  monsterTimer:   null,
  trailTimer:     null,
  // other
  queuedDir:      null,
  solvedCount:    0,
  gameRunning:    false,    // false briefly between reset and restart
};

/* Create the SVG once and keep its layer groups around */
const draw = SVG().addTo('#maze').size('100%', '100%').viewbox(0, 0, SVG_W, SVG_H);

/* Soft floor rectangle covering the whole maze area */
draw.rect(COLS * CELL, ROWS * CELL).fill(COLORS.floor).move(PAD, PAD).radius(6);

/* Subtle start-cell glow so kids know where they begin */
const startGlow = draw.circle(CELL * 0.8)
  .fill(COLORS.startMark).opacity(0.25)
  .center(cellToPx(0, 0).x, cellToPx(0, 0).y);

/* Layers are drawn in a fixed order — later ones sit on top */
state.layers = {
  trail:    draw.group(),
  solution: draw.group(),
  goal:     draw.group(),
  walls:    draw.group(),
  monsters: draw.group(),
  hero:     draw.group(),
};

/* ============================================================================
   PART 8 — (RE)BUILDING A MAZE
   ============================================================================ */

function newMaze() {
  stopTimers();
  state.grid = generateMaze();

  // Wipe every layer that depends on the maze layout
  state.layers.trail.clear();
  state.layers.solution.clear();
  state.layers.goal.clear();
  state.layers.walls.clear();
  state.layers.monsters.clear();
  state.layers.hero.clear();
  state.trailCircles  = [];
  state.lastTrailCell = null;
  state.movedSinceTrail = false;
  state.solutionShown = false;
  state.queuedDir = null;
  updateSolutionButtonLabel();

  // Walls
  drawWalls(state.layers.walls, state.grid);

  // Goal — the house at bottom-right
  const goalPx = cellToPx(ROWS - 1, COLS - 1);
  const goalGroup = state.layers.goal.group();
  drawHouse(goalGroup);
  goalGroup.transform({ translate: [goalPx.x, goalPx.y] });

  // Hero at top-left
  const heroGroup = state.layers.hero.group();
  drawHero(heroGroup);
  const heroPx = cellToPx(0, 0);
  heroGroup.transform({ translate: [heroPx.x, heroPx.y] });
  state.hero = {
    r: 0, c: 0,
    group: heroGroup,
    moving: false,
  };

  // Monsters — start them in 3 far corners, one of each colour
  state.monsters = [];
  const monsterStarts = [
    { r: ROWS - 1, c: 0 },             // bottom-left
    { r: 0,        c: COLS - 1 },       // top-right
    { r: Math.floor(ROWS / 2), c: Math.floor(COLS / 2) },  // middle
  ];
  monsterStarts.forEach((pos, i) => {
    const mg = state.layers.monsters.group();
    drawMonster(mg, i);
    const px = cellToPx(pos.r, pos.c);
    mg.transform({ translate: [px.x, px.y] });
    state.monsters.push({
      r: pos.r, c: pos.c,
      group: mg,
      lastDir: null,
      moving: false,
    });
  });

  // Timers
  startTimers();
  state.gameRunning = true;
}

/* ============================================================================
   PART 9 — HERO MOVEMENT (arrow keys)
   ============================================================================ */

/* Map a key code to a direction char */
function keyToDir(code) {
  switch (code) {
    case 'ArrowUp':    case 'KeyW': return 'n';
    case 'ArrowDown':  case 'KeyS': return 's';
    case 'ArrowLeft':  case 'KeyA': return 'w';
    case 'ArrowRight': case 'KeyD': return 'e';
  }
  return null;
}

/* Attempt to move the hero one cell in the given direction. Ignores if a
   wall blocks the move. If the hero is mid-tween, the request is queued. */
function tryMoveHero(dir) {
  if (!state.gameRunning || !state.hero) return;
  if (state.hero.moving) { state.queuedDir = dir; return; }

  const cell = state.grid[state.hero.r][state.hero.c];
  if (cell.walls[dir]) return;                 // wall → cannot move
  const [dr, dc] = DELTAS[dir];
  const nr = state.hero.r + dr;
  const nc = state.hero.c + dc;
  if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;

  state.hero.moving = true;
  state.hero.r = nr;
  state.hero.c = nc;
  const px = cellToPx(nr, nc);
  tweenTranslate(state.hero.group, px.x, px.y, HERO_MOVE_MS, () => {
    state.hero.moving = false;
    state.movedSinceTrail = true;
    checkCollisions();
    // Keep solution path live if visible
    if (state.solutionShown) drawSolution();
    // Win check
    if (state.hero.r === ROWS - 1 && state.hero.c === COLS - 1) {
      onHeroReachedHouse();
      return;
    }
    // Flush queued direction if any
    if (state.queuedDir) {
      const qd = state.queuedDir;
      state.queuedDir = null;
      tryMoveHero(qd);
    }
  });
}

/* ============================================================================
   PART 10 — MONSTER AI
   ----------------------------------------------------------------------------
   Every MONSTER_TICK_MS each monster picks a direction from its available
   (wall-free) neighbours, preferring not to reverse unless dead-ended, and
   tweens one cell in that direction. A collision with the hero ends the run.
   ============================================================================ */
function monsterStep(monster) {
  if (monster.moving) return;
  const cell = state.grid[monster.r][monster.c];
  const opts = [];
  for (const dir of ['n', 's', 'e', 'w']) {
    if (cell.walls[dir]) continue;
    const [dr, dc] = DELTAS[dir];
    const nr = monster.r + dr, nc = monster.c + dc;
    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
    opts.push({ dir, dr, dc });
  }
  if (!opts.length) return;

  // Prefer not to reverse unless there's no alternative
  let filtered = opts;
  if (monster.lastDir) {
    const notReverse = opts.filter(o => o.dir !== OPP[monster.lastDir]);
    if (notReverse.length > 0) filtered = notReverse;
  }

  const pick = filtered[Math.floor(Math.random() * filtered.length)];
  monster.r += pick.dr;
  monster.c += pick.dc;
  monster.lastDir = pick.dir;
  monster.moving = true;
  const px = cellToPx(monster.r, monster.c);
  tweenTranslate(monster.group, px.x, px.y, MONSTER_MOVE_MS, () => {
    monster.moving = false;
    checkCollisions();
  });
}

/* ============================================================================
   PART 11 — COLLISIONS + RESET
   ============================================================================ */
function checkCollisions() {
  if (!state.gameRunning) return;
  for (const m of state.monsters) {
    if (m.r === state.hero.r && m.c === state.hero.c) {
      onHeroCaught();
      return;
    }
  }
}

/* Hero is caught: flash a gentle banner and reset positions on the same maze */
function onHeroCaught() {
  state.gameRunning = false;
  stopTimers();

  // Visual: hero spins and shrinks
  const spinStart = performance.now();
  const heroStart = state.hero.group.transform();
  function spin(now) {
    const t = Math.min(1, (now - spinStart) / 500);
    const angle = t * 540;
    const scale = 1 - t * 0.6;
    state.hero.group.transform({
      translate: [heroStart.translateX || 0, heroStart.translateY || 0],
      rotate: angle,
      scale: scale,
    });
    if (t < 1) requestAnimationFrame(spin);
    else afterCaughtAnimation();
  }
  requestAnimationFrame(spin);

  showBanner('Oh no!', 'A monster caught you — starting over!');

  function afterCaughtAnimation() {
    hideBanner();
    resetRound();
  }
}

/* Put everything back to its starting place on the SAME maze.
   (Kinder to kids than regenerating the whole maze each miss.) */
function resetRound() {
  // Reset hero
  state.hero.r = 0; state.hero.c = 0;
  const heroPx = cellToPx(0, 0);
  state.hero.group.transform({ translate: [heroPx.x, heroPx.y], rotate: 0, scale: 1 });
  state.hero.moving = false;

  // Reset monsters to their starting corners
  const monsterStarts = [
    { r: ROWS - 1, c: 0 },
    { r: 0,        c: COLS - 1 },
    { r: Math.floor(ROWS / 2), c: Math.floor(COLS / 2) },
  ];
  state.monsters.forEach((m, i) => {
    m.r = monsterStarts[i].r;
    m.c = monsterStarts[i].c;
    m.lastDir = null;
    m.moving = false;
    const px = cellToPx(m.r, m.c);
    m.group.transform({ translate: [px.x, px.y] });
  });

  // Wipe the trail — fresh start
  state.layers.trail.clear();
  state.trailCircles = [];
  state.lastTrailCell = null;
  state.movedSinceTrail = false;
  state.queuedDir = null;

  // Hide solution if showing
  if (state.solutionShown) toggleSolution();

  state.gameRunning = true;
  startTimers();
}

/* ============================================================================
   PART 12 — REACHING THE HOUSE — celebrate, then new maze
   ============================================================================ */
function onHeroReachedHouse() {
  state.gameRunning = false;
  stopTimers();
  state.solvedCount++;
  document.getElementById('solved-count').textContent = state.solvedCount;

  // Confetti burst at hero's position
  const burst = draw.group();
  const palette = ['#ff3e8b', '#ffd166', '#06d6a0', '#4cc9f0', '#a084dc'];
  const px = cellToPx(state.hero.r, state.hero.c);
  const pieces = [];
  for (let i = 0; i < 26; i++) {
    const color = palette[i % palette.length];
    const piece = burst.circle(5 + Math.random() * 5).fill(color).center(px.x, px.y);
    const angle = Math.random() * Math.PI * 2;
    const dist  = 40 + Math.random() * 70;
    pieces.push({
      node: piece,
      sx: px.x, sy: px.y,
      ex: px.x + Math.cos(angle) * dist,
      ey: px.y + Math.sin(angle) * dist - 10,  // bias upward
    });
  }
  const t0 = performance.now();
  function confettiStep(now) {
    const t = Math.min(1, (now - t0) / 900);
    const e = 1 - Math.pow(1 - t, 3);            // ease-out cubic
    for (const p of pieces) {
      p.node.center(p.sx + (p.ex - p.sx) * e, p.sy + (p.ey - p.sy) * e);
      p.node.opacity(1 - t);
    }
    if (t < 1) requestAnimationFrame(confettiStep);
    else {
      burst.remove();
      showBanner('You made it! 🎉', 'Here comes a new maze!');
      setTimeout(() => { hideBanner(); newMaze(); }, 900);
    }
  }
  requestAnimationFrame(confettiStep);
}

/* ============================================================================
   PART 13 — TRAIL
   ----------------------------------------------------------------------------
   At regular intervals, if the hero has moved since the last tick, drop a
   golden circle at the current cell. The circle grows from 0 to full size
   (via a tiny tween) for a "pop" effect.
   ============================================================================ */
function tickTrail() {
  if (!state.gameRunning || !state.hero) return;
  if (!state.movedSinceTrail) return;
  state.movedSinceTrail = false;

  const px = cellToPx(state.hero.r, state.hero.c);
  // Outer soft glow
  const glow = state.layers.trail.circle(0).fill(COLORS.trailGlow).opacity(0.35)
    .center(px.x, px.y);
  // Inner brighter dot
  const dot  = state.layers.trail.circle(0).fill(COLORS.trail).opacity(0.9)
    .center(px.x, px.y);

  // Animate both from 0 → target size with a tiny custom tween
  const t0 = performance.now();
  const DUR = 220;
  function step(now) {
    const t = Math.min(1, (now - t0) / DUR);
    const e = 1 - Math.pow(1 - t, 3);
    const outer = 14 * e;
    const inner = 7  * e;
    glow.size(outer, outer).center(px.x, px.y);
    dot .size(inner, inner).center(px.x, px.y);
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);

  state.trailCircles.push({ glow, dot });

  // Cap the trail length so old mazes/long runs don't balloon
  while (state.trailCircles.length > TRAIL_MAX) {
    const oldest = state.trailCircles.shift();
    oldest.glow.remove();
    oldest.dot.remove();
  }
}

/* ============================================================================
   PART 14 — SHOW-PATH BUTTON
   ============================================================================ */
function drawSolution() {
  // Always remove any prior path before redrawing
  state.layers.solution.clear();
  const path = findPath(state.grid, state.hero.r, state.hero.c, ROWS - 1, COLS - 1);
  if (!path || path.length < 2) return;

  // Build an SVG path string from cell centres
  const d = path.map(([r, c], i) => {
    const p = cellToPx(r, c);
    return `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`;
  }).join(' ');

  // Subtle wider shadow underneath
  state.layers.solution.path(d).fill('none')
    .stroke({ color: COLORS.solution, width: 10, linecap: 'round', linejoin: 'round' })
    .opacity(0.18);

  // Main dashed line — animated dashes to make the path "flow"
  const main = state.layers.solution.path(d).fill('none')
    .stroke({
      color: COLORS.solution,
      width: 4,
      linecap: 'round',
      linejoin: 'round',
      dasharray: '8 6',
    });

  // Animate the dash offset on a loop for a gentle "marching ants" feel
  const anim = main.animate({ duration: 900, times: Infinity, ease: '-' });
  anim.attr({ 'stroke-dashoffset': -14 });

  // Small marker at the goal end
  const goalPx = cellToPx(ROWS - 1, COLS - 1);
  state.layers.solution.circle(8).fill(COLORS.solution).opacity(0.9)
    .center(goalPx.x, goalPx.y);
}

function toggleSolution() {
  state.solutionShown = !state.solutionShown;
  if (state.solutionShown) drawSolution();
  else state.layers.solution.clear();
  updateSolutionButtonLabel();
}
function updateSolutionButtonLabel() {
  const btn = document.getElementById('btn-solution');
  btn.textContent = state.solutionShown ? '🙈 Hide Path' : '💡 Show Path';
}

/* ============================================================================
   PART 15 — BANNER
   ============================================================================ */
function showBanner(line1, line2) {
  document.getElementById('banner-line1').textContent = line1;
  document.getElementById('banner-line2').textContent = line2;
  document.getElementById('banner').classList.add('visible');
}
function hideBanner() {
  document.getElementById('banner').classList.remove('visible');
}

/* ============================================================================
   PART 16 — TIMERS
   ============================================================================ */
function startTimers() {
  stopTimers();
  state.monsterTimer = setInterval(() => {
    if (!state.gameRunning) return;
    for (const m of state.monsters) monsterStep(m);
  }, MONSTER_TICK_MS);

  state.trailTimer = setInterval(tickTrail, TRAIL_INTERVAL_MS);
}
function stopTimers() {
  if (state.monsterTimer) clearInterval(state.monsterTimer);
  if (state.trailTimer)   clearInterval(state.trailTimer);
  state.monsterTimer = null;
  state.trailTimer = null;
}

/* ============================================================================
   PART 17 — INPUT BINDINGS
   ============================================================================ */
window.addEventListener('keydown', (e) => {
  const dir = keyToDir(e.code);
  if (dir) {
    e.preventDefault();
    tryMoveHero(dir);
  }
});

document.getElementById('btn-new').addEventListener('click', () => {
  hideBanner();
  newMaze();
});
document.getElementById('btn-solution').addEventListener('click', toggleSolution);

/* ============================================================================
   BOOT
   ============================================================================ */
newMaze();

</script>
</body>
</html>
