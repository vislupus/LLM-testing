<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindergarten Maze Adventure</title>
    <!-- Load svg.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.0.4/svg.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Marker Felt', cursive;
            background: linear-gradient(135deg, #87CEEB 0%, #98FB98 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            margin: 20px auto;
            border: 5px solid #FFD700;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            background: white;
        }

        #svg-canvas {
            display: block;
            background: #F0F8FF;
            cursor: crosshair;
        }

        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        .stat {
            display: inline-block;
            margin: 0 10px;
            font-size: 18px;
            font-weight: bold;
            color: #FF6347;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            z-index: 100;
        }

        button {
            background: linear-gradient(to bottom, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            font-family: 'Comic Sans MS', 'Marker Felt', cursive;
            transition: all 0.2s;
        }

        button:hover {
            background: linear-gradient(to bottom, #66BB6A, #4CAF50);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #solution-btn {
            background: linear-gradient(to bottom, #2196F3, #1976D2);
        }

        #restart-btn {
            background: linear-gradient(to bottom, #FF9800, #F57C00);
        }

        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            border: 3px solid #FF6347;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #FF6347;
            display: none;
            z-index: 200;
            box-shadow: 0 0 20px rgba(255, 100, 71, 0.5);
        }

        .monster {
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .hero {
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .trail {
            opacity: 0.7;
        }

        .solution-path {
            stroke: #FFD700;
            stroke-width: 3;
            stroke-dasharray: 5, 5;
            fill: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            #game-container {
                width: 95vw !important;
                height: 95vw !important;
                border-width: 3px;
            }
            
            button {
                padding: 8px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <svg id="svg-canvas" width="600" height="600"></svg>
        
        <div id="ui-overlay">
            <div class="stat">Moves: <span id="moves">0</span></div>
            <div class="stat">Monsters: <span id="monsters-left">3</span></div>
        </div>
        
        <div id="controls">
            <button id="solution-btn">Show Solution</button>
            <button id="restart-btn">New Maze</button>
        </div>
        
        <div id="message"></div>
    </div>

    <script>
        // ========== GAME CONFIGURATION ==========
        const CELL_SIZE = 30;  // Size of each cell in pixels
        const GRID_SIZE = 20;  // 20x20 maze
        const WALL_THICKNESS = 2;
        
        // Colors for a child-friendly theme
        const COLORS = {
            wall: '#8B4513',      // Brown for walls
            floor: '#F0F8FF',     // Light blue for floor
            hero: '#FF6347',      // Tomato red for hero
            monster: '#9400D3',   // Dark violet for monsters
            trail: '#FFB6C1',     // Light pink for trail
            solution: '#FFD700'   // Gold for solution path
        };
        
        // ========== GAME STATE ==========
        let svg, width, height;
        let maze = [];           // 2D array representing the maze
        let hero;                // Hero SVG group
        let heroPosition = { x: 1, y: 1 };  // Hero starts at (1,1)
        let monsters = [];       // Array of monster objects
        let trail = [];          // Array of trail circle elements
        let solutionPath = null; // Solution path line
        let moves = 0;
        let monstersLeft = 3;
        let gameActive = true;
        let trailInterval = null;
        
        // ========== INITIALIZATION ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize SVG drawing area
            svg = SVG('svg-canvas');
            width = parseInt(svg.attr('width'));
            height = parseInt(svg.attr('height'));
            
            // Create game board background
            drawBackground();
            
            // Generate a new random maze
            generateMaze();
            
            // Create hero
            createHero();
            
            // Create monsters
            createMonsters();
            
            // Draw the maze walls
            drawMaze();
            
            // Set up keyboard controls
            setupControls();
            
            // Set up button listeners
            document.getElementById('solution-btn').addEventListener('click', showSolution);
            document.getElementById('restart-btn').addEventListener('click', restartGame);
            
            // Start trail effect
            startTrailEffect();
            
            showMessage("Use arrow keys to guide the hero to the exit!");
        });
        
        // ========== BACKGROUND ==========
        function drawBackground() {
            // Draw sky background
            svg.rect(width, height).attr({
                fill: 'skyblue',
                stroke: 'none'
            });
            
            // Draw grass at bottom
            svg.rect(width, height/2).move(0, height/2).attr({
                fill: 'lightgreen',
                stroke: 'none'
            });
            
            // Draw some cute clouds
            drawCloud(100, 50);
            drawCloud(400, 100);
            drawCloud(300, 450);
        }
        
        function drawCloud(x, y) {
            const cloud = svg.group();
            cloud.circle(30).move(x, y).attr('fill', 'white');
            cloud.circle(40).move(x + 20, y).attr('fill', 'white');
            cloud.circle(30).move(x + 40, y).attr('fill', 'white');
            cloud.circle(25).move(x + 10, y + 20).attr('fill', 'white');
            cloud.circle(25).move(x + 30, y + 20).attr('fill', 'white');
            cloud.attr('class', 'cloud');
        }
        
        // ========== MAZE GENERATION ==========
        function generateMaze() {
            // Initialize maze with walls everywhere except start (1,1)
            maze = Array(GRID_SIZE + 2).fill().map(() => Array(GRID_SIZE + 2).fill(1));
            
            // Start at (1,1) - leave this cell empty
            maze[1][1] = 0;
            
            // Use depth-first search to carve passages
            const stack = [{x: 1, y: 1}];
            const directions = [
                {dx: 0, dy: -2},  // Up
                {dx: 0, dy: 2},   // Down
                {dx: -2, dx: 0},  // Left (typo fix)
                {dx: 2, dy: 0}    // Right
            ];
            
            while (stack.length > 0) {
                const current = stack[stack.length - 1];
                
                // Find unvisited neighbors
                const neighbors = [];
                for (const dir of directions) {
                    const nx = current.x + dir.dx;
                    const ny = current.y + dir.dy;
                    
                    if (nx > 0 && nx < GRID_SIZE + 1 && ny > 0 && ny < GRID_SIZE + 1 && maze[ny][nx] === 1) {
                        neighbors.push({x: nx, y: ny, dir: dir});
                    }
                }
                
                if (neighbors.length > 0) {
                    // Choose random neighbor
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    
                    // Remove wall between current and next
                    maze[current.y + next.dir.dy/2][current.x + next.dir.dx/2] = 0;
                    
                    // Mark neighbor as visited
                    maze[next.y][next.x] = 0;
                    
                    // Push to stack
                    stack.push({x: next.x, y: next.y});
                } else {
                    stack.pop();
                }
            }
            
            // Ensure exit at bottom-right (GRID_SIZE-1, GRID_SIZE-1)
            maze[GRID_SIZE - 1][GRID_SIZE - 1] = 0;
            
            // Clear any existing walls and redraw
            svg.select('.wall').forEach(wall => wall.remove());
            drawMaze();
        }
        
        function drawMaze() {
            for (let y = 0; y < GRID_SIZE + 2; y++) {
                for (let x = 0; x < GRID_SIZE + 2; x++) {
                    if (maze[y][x] === 1) {
                        // Draw wall
                        const wall = svg.rect(CELL_SIZE, CELL_SIZE)
                            .move(x * CELL_SIZE, y * CELL_SIZE)
                            .attr('fill', COLORS.wall)
                            .attr('stroke', '#5e2f0d')
                            .attr('stroke-width', 1)
                            .attr('class', 'wall');
                    }
                }
            }
        }
        
        // ========== HERO CREATION ==========
        function createHero() {
            // Remove existing hero if any
            if (hero) hero.remove();
            
            hero = svg.group().attr('class', 'hero');
            
            // Create cute hero face
            const face = hero.circle(CELL_SIZE/2 - 2)
                .attr('fill', COLORS.hero)
                .attr('stroke', '#ff8c80')
                .attr('stroke-width', 2);
            
            // Eyes
            const leftEye = hero.circle(4).move(CELL_SIZE/4, -2).attr('fill', 'white');
            const rightEye = hero.circle(4).move(-CELL_SIZE/4, -2).attr('fill', 'white');
            
            // Pupils
            const leftPupil = hero.circle(2).move(CELL_SIZE/4, -2).attr('fill', 'black');
            const rightPupil = hero.circle(2).move(-CELL_SIZE/4, -2).attr('fill', 'black');
            
            // Smile
            const smile = hero.ellipse(8, 5)
                .move(0, 8)
                .attr('fill', 'white')
                .rotate(45);
            
            // Position hero at start
            updateHeroPosition();
        }
        
        function updateHeroPosition() {
            const x = heroPosition.x * CELL_SIZE;
            const y = heroPosition.y * CELL_SIZE;
            hero.move(x, y);
        }
        
        // ========== MONSTER CREATION ==========
        function createMonsters() {
            // Remove existing monsters
            monsters.forEach(monster => monster.remove());
            monsters = [];
            
            // Create 3 cute monsters
            for (let i = 0; i < 3; i++) {
                const monster = svg.group().attr('class', 'monster');
                
                // Monster body
                monster.circle(CELL_SIZE/2 - 2)
                    .attr('fill', COLORS.monster)
                    .attr('stroke', '#9966cc')
                    .attr('stroke-width', 2);
                
                // Monster spots
                for (let j = 0; j < 3; j++) {
                    monster.circle(4)
                        .move((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10)
                        .attr('fill', '#ffcc00');
                }
                
                // Eyes
                monster.circle(4).move(CELL_SIZE/4, -5).attr('fill', 'white');
                monster.circle(4).move(-CELL_SIZE/4, -5).attr('fill', 'white');
                monster.circle(2).move(CELL_SIZE/4, -5).attr('fill', 'black');
                monster.circle(2).move(-CELL_SIZE/4, -5).attr('fill', 'black');
                
                // Legs
                monster.line(-5, CELL_SIZE/2 - 2, -10, CELL_SIZE/2 + 5)
                    .attr('stroke', '#9966cc')
                    .attr('stroke-width', 2);
                monster.line(5, CELL_SIZE/2 - 2, 10, CELL_SIZE/2 + 5)
                    .attr('stroke', '#9966cc')
                    .attr('stroke-width', 2);
                
                // Position randomly in maze
                let mx, my;
                do {
                    mx = Math.floor(Math.random() * GRID_SIZE) + 1;
                    my = Math.floor(Math.random() * GRID_SIZE) + 1;
                } while (maze[my][mx] === 1 || (mx === 1 && my === 1));
                
                monster.position = { x: mx, y: my };
                monster.move(mx * CELL_SIZE, my * CELL_SIZE);
                
                monsters.push(monster);
            }
            
            // Update monster count display
            monstersLeft = 3;
            document.getElementById('monsters-left').textContent = monstersLeft;
        }
        
        // ========== MONSTER MOVEMENT ==========
        function moveMonsters() {
            if (!gameActive) return;
            
            monsters.forEach(monster => {
                const directions = [
                    {dx: 0, dy: -1},  // Up
                    {dx: 0, dy: 1},   // Down
                    {dx: -1, dy: 0},  // Left
                    {dx: 1, dy: 0}    // Right
                ];
                
                // Filter valid moves (not walls)
                const validMoves = directions.filter(dir => {
                    const nx = monster.position.x + dir.dx;
                    const ny = monster.position.y + dir.dy;
                    return maze[ny][nx] === 0;
                });
                
                if (validMoves.length > 0) {
                    // Choose random valid move
                    const move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    monster.position.x += move.dx;
                    monster.position.y += move.dy;
                    
                    // Move SVG
                    monster.animate(300, '<>').move(
                        monster.position.x * CELL_SIZE,
                        monster.position.y * CELL_SIZE
                    );
                    
                    // Check if monster caught hero
                    if (monster.position.x === heroPosition.x && monster.position.y === heroPosition.y) {
                        gameOver();
                    }
                }
            });
        }
        
        // ========== TRAIL EFFECT ==========
        function startTrailEffect() {
            if (trailInterval) clearInterval(trailInterval);
            
            trailInterval = setInterval(() => {
                if (!gameActive) return;
                
                // Create a new trail circle
                const trailCircle = svg.circle(4)
                    .attr('fill', COLORS.trail)
                    .attr('class', 'trail')
                    .move(
                        heroPosition.x * CELL_SIZE + CELL_SIZE/2,
                        heroPosition.y * CELL_SIZE + CELL_SIZE/2
                    );
                
                trail.push(trailCircle);
                
                // Remove old trail circles after a while
                setTimeout(() => {
                    trailCircle.remove();
                    trail = trail.filter(c => c !== trailCircle);
                }, 2000);
            }, 300); // Create trail every 300ms
        }
        
        // ========== PLAYER MOVEMENT ==========
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                
                let moved = false;
                let newX = heroPosition.x;
                let newY = heroPosition.y;
                
                switch(e.key) {
                    case 'ArrowUp':
                        if (maze[heroPosition.y - 1][heroPosition.x] === 0) {
                            newY--;
                            moved = true;
                        }
                        break;
                    case 'ArrowDown':
                        if (maze[heroPosition.y + 1][heroPosition.x] === 0) {
                            newY++;
                            moved = true;
                        }
                        break;
                    case 'ArrowLeft':
                        if (maze[heroPosition.y][heroPosition.x - 1] === 0) {
                            newX--;
                            moved = true;
                        }
                        break;
                    case 'ArrowRight':
                        if (maze[heroPosition.y][heroPosition.x + 1] === 0) {
                            newX++;
                            moved = true;
                        }
                        break;
                }
                
                if (moved) {
                    heroPosition.x = newX;
                    heroPosition.y = newY;
                    updateHeroPosition();
                    moves++;
                    document.getElementById('moves').textContent = moves;
                    
                    // Check if hero reached exit
                    if (heroPosition.x === GRID_SIZE - 1 && heroPosition.y === GRID_SIZE - 1) {
                        gameOver(true);
                    }
                    
                    // Check if monster caught hero
                    for (const monster of monsters) {
                        if (monster.position.x === heroPosition.x && monster.position.y === heroPosition.y) {
                            gameOver();
                            return;
                        }
                    }
                }
            });
        }
        
        // ========== SOLUTION PATH ==========
        function showSolution() {
            if (solutionPath) {
                solutionPath.remove();
                solutionPath = null;
                return;
            }
            
            // Find solution path using BFS
            const solution = findPath();
            if (!solution) return;
            
            // Draw solution path
            const points = [];
            for (const pos of solution) {
                points.push(pos.x * CELL_SIZE + CELL_SIZE/2);
                points.push(pos.y * CELL_SIZE + CELL_SIZE/2);
            }
            
            solutionPath = svg.polyline(points)
                .attr('class', 'solution-path')
                .attr('stroke-width', 4);
        }
        
        function findPath() {
            // BFS to find shortest path from start to exit
            const queue = [{x: 1, y: 1, path: [{x: 1, y: 1}]}];
            const visited = new Set();
            visited.add(`${1},${1}`);
            
            while (queue.length > 0) {
                const current = queue.shift();
                
                if (current.x === GRID_SIZE - 1 && current.y === GRID_SIZE - 1) {
                    return current.path;
                }
                
                const directions = [
                    {dx: 0, dy: -1}, {dx: 0, dy: 1},
                    {dx: -1, dy: 0}, {dx: 1, dy: 0}
                ];
                
                for (const dir of directions) {
                    const nx = current.x + dir.dx;
                    const ny = current.y + dir.dy;
                    
                    if (maze[ny][nx] === 0 && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push({
                            x: nx,
                            y: ny,
                            path: [...current.path, {x: nx, y: ny}]
                        });
                    }
                }
            }
            
            return null; // Should never happen with our maze generation
        }
        
        // ========== GAME OVER ==========
        function gameOver(win) {
            gameActive = false;
            
            if (win) {
                showMessage("Yay! You escaped the maze! 🎉", "success");
            } else {
                showMessage("Oh no! A monster caught you! 😱", "challenge");
            }
            
            // Stop trail effect
            if (trailInterval) clearInterval(trailInterval);
            
            // Flash message
            setTimeout(() => {
                document.getElementById('message').style.display = 'none';
                if (!win) {
                    restartGame();
                }
            }, 2000);
        }
        
        function restartGame() {
            // Clear everything
            svg.clear();
            
            // Reset game state
            heroPosition = { x: 1, y: 1 };
            moves = 0;
            gameActive = true;
            trail = [];
            
            // Redraw everything
            drawBackground();
            generateMaze();
            createHero();
            createMonsters();
            startTrailEffect();
            
            // Update UI
            document.getElementById('moves').textContent = '0';
            document.getElementById('message').style.display = 'none';
            
            showMessage("New maze generated! Use arrow keys to move.");
        }
        
        function showMessage(text, type = "system") {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.style.display = 'block';
            
            // Set text color based on type
            if (type === "success") {
                messageEl.style.borderColor = "#4CAF50";
                messageEl.style.color = "#4CAF50";
            } else if (type === "challenge") {
                messageEl.style.borderColor = "#FF6347";
                messageEl.style.color = "#FF6347";
            } else {
                messageEl.style.borderColor = "#2196F3";
                messageEl.style.color = "#2196F3";
            }
        }
        
        // ========== CLEANUP ==========
        window.addEventListener('beforeunload', function() {
            if (trailInterval) clearInterval(trailInterval);
        });
    </script>
</body>
</html>
