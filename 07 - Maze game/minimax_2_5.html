<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KinderMaze Explorer - Fun Maze Game for Kids!</title>

    <!-- SVG.js library for graphics and animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.1.2/svg.min.js"></script>

    <style>
        /* ============================================
           CHILD-FRIENDLY STYLING
           Colorful and easy to see for young children
           ============================================ */

        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #E8F4FD 0%, #FEF6E4 50%, #F0FFF4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Decorative background bubbles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.3) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(173, 216, 230, 0.3) 0%, transparent 20%),
                radial-gradient(circle at 50% 50%, rgba(255, 218, 185, 0.2) 0%, transparent 30%);
            pointer-events: none;
            z-index: -1;
        }

        /* Main game title */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: #FF6B6B;
            text-shadow: 3px 3px 0px #FFE66D, 5px 5px 0px #4ECDC4;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        /* Subtitle with instructions */
        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Game container with shadow */
        .game-container {
            background: white;
            border-radius: 25px;
            padding: 20px;
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.15),
                0 0 0 5px #FFE66D,
                0 0 0 10px #FF6B6B;
        }

        /* The SVG game board */
        #game-board {
            border-radius: 15px;
            overflow: hidden;
            display: block;
        }

        /* Button container */
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Fun buttons for kids */
        .btn {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }

        /* New Maze button - bright green */
        .btn-new {
            background: linear-gradient(180deg, #4ECDC4 0%, #44A08D 100%);
            color: white;
        }

        .btn-new:hover {
            background: linear-gradient(180deg, #5FD9D0 0%, #55B09D 100%);
        }

        /* Show Solution button - bright orange */
        .btn-solution {
            background: linear-gradient(180deg, #FFB347 0%, #FF8C00 100%);
            color: white;
        }

        .btn-solution:hover {
            background: linear-gradient(180deg, #FFC35A 0%, #FF9D1A 100%);
        }

        /* Status message area */
        .status {
            font-size: 1rem;
            color: #888;
            margin-top: 15px;
            text-align: center;
            min-height: 30px;
        }

        /* Win/Lose overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .overlay.show {
            display: flex;
        }

        .overlay-box {
            background: white;
            padding: 40px 60px;
            border-radius: 30px;
            text-align: center;
            animation: popIn 0.4s ease;
            box-shadow: 0 0 0 8px #FFE66D, 0 0 0 16px #FF6B6B;
        }

        @keyframes popIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .overlay-box h2 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .overlay-box.win h2 {
            color: #4ECDC4;
        }

        .overlay-box.lose h2 {
            color: #FF6B6B;
        }

        .overlay-box p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 25px;
        }

        /* Decorative elements */
        .decorations {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Main game title -->
    <h1>🧩 KinderMaze Explorer 🧩</h1>
    <p class="subtitle">Use arrow keys to help the hero reach the star! ⭐</p>

    <!-- Game container -->
    <div class="game-container">
        <div id="game-board"></div>

        <!-- Control buttons -->
        <div class="button-container">
            <button class="btn btn-new" onclick="startNewGame()">🎮 New Maze</button>
            <button class="btn btn-solution" onclick="showSolution()">💡 Show Solution</button>
        </div>

        <!-- Status message -->
        <div class="status" id="status">Move with arrow keys! Good luck!</div>
    </div>

    <!-- Win overlay -->
    <div class="overlay" id="win-overlay">
        <div class="overlay-box win">
            <h2>🌟 YOU WIN! 🌟</h2>
            <p>Great job, maze explorer!</p>
            <button class="btn btn-new" onclick="startNewGame()">Play Again!</button>
        </div>
    </div>

    <!-- Lose overlay -->
    <div class="overlay" id="lose-overlay">
        <div class="overlay-box lose">
            <h2>😢 Oh No! 😢</h2>
            <p>The monster caught you! Try again!</p>
            <button class="btn btn-new" onclick="startNewGame()">Try Again!</button>
        </div>
    </div>

    <!-- Floating decorations -->
    <div class="decorations">
        <span class="star" style="top: 10%; left: 5%;">⭐</span>
        <span class="star" style="top: 20%; right: 10%; animation-delay: 0.5s;">🌟</span>
        <span class="star" style="bottom: 15%; left: 8%; animation-delay: 1s;">✨</span>
        <span class="star" style="bottom: 25%; right: 5%; animation-delay: 1.5s;">💫</span>
    </div>

    <script>
        /* ============================================
           KINDERMAZE EXPLORER
           A fun maze game for kindergarten children

           Features:
           - 20x20 randomly generated maze
           - Cute animated hero character
           - Friendly monsters
           - Trail effect
           - Solution path display
           ============================================ */

        // ==================== GAME CONFIGURATION ====================

        // Maze size (20x20 grid)
        const MAZE_SIZE = 20;

        // Size of each cell in pixels
        const CELL_SIZE = 30;

        // Calculate total board size
        const BOARD_SIZE = MAZE_SIZE * CELL_SIZE;

        // Number of monsters in the game
        const NUM_MONSTERS = 4;

        // Time interval for leaving trail (milliseconds)
        const TRAIL_INTERVAL = 300;

        // Monster movement speed (milliseconds)
        const MONSTER_SPEED = 600;

        // Animation duration for hero movement (milliseconds)
        const MOVE_DURATION = 120;

        // ==================== GAME STATE ====================

        // SVG drawing objects
        let draw;
        let mazeGroup, trailGroup, solutionGroup, characterGroup;

        // Game state variables
        let maze = [];           // 2D array storing cell data
        let hero = { x: 0, y: 0, element: null };
        let monsters = [];
        let exitPos = { x: MAZE_SIZE - 1, y: MAZE_SIZE - 1 };
        let isGameActive = false;
        let isMoving = false;
        let trailTimer = null;
        let monsterTimers = [];
        let lastTrailPos = null;

        // ==================== MAZE GENERATION ====================

        /**
         * Cell class to store maze cell data
         * Each cell has walls on 4 sides (top, right, bottom, left)
         */
        class Cell {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.walls = { top: true, right: true, bottom: true, left: true };
                this.visited = false;
            }
        }

        /**
         * Initialize empty maze grid
         */
        function initMaze() {
            maze = [];
            for (let x = 0; x < MAZE_SIZE; x++) {
                maze[x] = [];
                for (let y = 0; y < MAZE_SIZE; y++) {
                    maze[x][y] = new Cell(x, y);
                }
            }
        }

        /**
         * Recursive Backtracker algorithm for maze generation
         * This ensures a perfect maze (exactly one path between any two points)
         */
        function generateMaze() {
            // Initialize maze
            initMaze();

            // Start from top-left corner
            let current = maze[0][0];
            current.visited = true;

            // Stack for backtracking
            let stack = [];

            // Keep generating until all cells are visited
            while (true) {
                // Get unvisited neighbors
                let neighbors = getUnvisitedNeighbors(current);

                if (neighbors.length > 0) {
                    // Choose random neighbor
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];

                    // Push current to stack
                    stack.push(current);

                    // Remove wall between current and next
                    removeWall(current, next);

                    // Move to next cell
                    current = next;
                    current.visited = true;
                } else if (stack.length > 0) {
                    // Backtrack
                    current = stack.pop();
                } else {
                    // Maze complete!
                    break;
                }
            }

            // Ensure entrance and exit are open
            maze[0][0].walls.top = false;
            maze[MAZE_SIZE - 1][MAZE_SIZE - 1].walls.bottom = false;
        }

        /**
         * Get unvisited neighbor cells
         */
        function getUnvisitedNeighbors(cell) {
            let neighbors = [];
            const { x, y } = cell;

            // Check all 4 directions
            if (y > 0 && !maze[x][y - 1].visited) neighbors.push(maze[x][y - 1]); // Top
            if (x < MAZE_SIZE - 1 && !maze[x + 1][y].visited) neighbors.push(maze[x + 1][y]); // Right
            if (y < MAZE_SIZE - 1 && !maze[x][y + 1].visited) neighbors.push(maze[x][y + 1]); // Bottom
            if (x > 0 && !maze[x - 1][y].visited) neighbors.push(maze[x - 1][y]); // Left

            return neighbors;
        }

        /**
         * Remove wall between two adjacent cells
         */
        function removeWall(current, next) {
            const dx = next.x - current.x;
            const dy = next.y - current.y;

            if (dx === 1) {
                current.walls.right = false;
                next.walls.left = false;
            } else if (dx === -1) {
                current.walls.left = false;
                next.walls.right = false;
            } else if (dy === 1) {
                current.walls.bottom = false;
                next.walls.top = false;
            } else if (dy === -1) {
                current.walls.top = false;
                next.walls.bottom = false;
            }
        }

        // ==================== MAZE DRAWING ====================

        /**
         * Draw the complete maze using SVG.js
         */
        function drawMaze() {
            // Clear previous maze
            if (mazeGroup) mazeGroup.clear();

            // Create group for maze walls
            mazeGroup = draw.group();

            // Draw floor (light background)
            draw.rect(BOARD_SIZE, BOARD_SIZE)
                .fill('#F8F9FA')
                .radius(10);

            // Draw checkerboard pattern for visual interest
            for (let x = 0; x < MAZE_SIZE; x++) {
                for (let y = 0; y < MAZE_SIZE; y++) {
                    if ((x + y) % 2 === 0) {
                        draw.rect(CELL_SIZE, CELL_SIZE)
                            .fill('#FFFFFF')
                            .move(x * CELL_SIZE, y * CELL_SIZE);
                    }
                }
            }

            // Draw all walls
            const wallColor = '#4A90D9';
            const wallWidth = 3;

            for (let x = 0; x < MAZE_SIZE; x++) {
                for (let y = 0; y < MAZE_SIZE; y++) {
                    const cell = maze[x][y];
                    const cx = x * CELL_SIZE;
                    const cy = y * CELL_SIZE;

                    // Top wall
                    if (cell.walls.top) {
                        mazeGroup.line(cx, cy, cx + CELL_SIZE, cy)
                            .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
                    }

                    // Left wall
                    if (cell.walls.left) {
                        mazeGroup.line(cx, cy, cx, cy + CELL_SIZE)
                            .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
                    }

                    // Right wall (only for rightmost column)
                    if (x === MAZE_SIZE - 1 && cell.walls.right) {
                        mazeGroup.line(cx + CELL_SIZE, cy, cx + CELL_SIZE, cy + CELL_SIZE)
                            .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
                    }

                    // Bottom wall (only for bottom row)
                    if (y === MAZE_SIZE - 1 && cell.walls.bottom) {
                        mazeGroup.line(cx, cy + CELL_SIZE, cx + CELL_SIZE, cy + CELL_SIZE)
                            .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
                    }
                }
            }

            // Draw exit (star)
            drawExit();
        }

        /**
         * Draw the exit (goal) as a shining star
         */
        function drawExit() {
            const exitX = exitPos.x * CELL_SIZE + CELL_SIZE / 2;
            const exitY = exitPos.y * CELL_SIZE + CELL_SIZE / 2;

            // Glow effect
            const glow = draw.circle(40)
                .fill('#FFE66D')
                .center(exitX, exitY)
                .opacity(0.4);

            // Animate glow
            glow.animate(1000)
                .attr({ r: 25, opacity: 0.2 })
                .loop(true, true);

            // Star shape
            const star = draw.polygon('15,0 19,11 30,11 21,17 24,28 15,22 6,28 9,17 0,11 11,11')
                .fill('#FFD700')
                .center(exitX, exitY)
                .transform({ scale: 0.8 });

            // Animate star
            star.animate(800)
                .transform({ scale: 1, rotate: 15 })
                .loop(true, true);
        }

        // ==================== HERO (PLAYER) ====================

        /**
         * Create and draw the hero character
         * A cute yellow character with face
         */
        function createHero() {
            hero.x = 0;
            hero.y = 0;

            // Create group for hero
            characterGroup = draw.group();

            // Hero body (yellow circle)
            const body = characterGroup.circle(CELL_SIZE * 0.7)
                .fill('#FFD700')
                .center(CELL_SIZE / 2, CELL_SIZE / 2);

            // Hero face - eyes
            characterGroup.circle(6)
                .fill('#333')
                .center(CELL_SIZE / 2 - 6, CELL_SIZE / 2 - 3);
            characterGroup.circle(6)
                .fill('#333')
                .center(CELL_SIZE / 2 + 6, CELL_SIZE / 2 - 3);

            // Hero face - eye shine
            characterGroup.circle(2)
                .fill('white')
                .center(CELL_SIZE / 2 - 5, CELL_SIZE / 2 - 4);
            characterGroup.circle(2)
                .fill('white')
                .center(CELL_SIZE / 2 + 7, CELL_SIZE / 2 - 4);

            // Hero face - smile
            characterGroup.path(`M ${CELL_SIZE/2 - 8} ${CELL_SIZE/2 + 4} Q ${CELL_SIZE/2} ${CELL_SIZE/2 + 10} ${CELL_SIZE/2 + 8} ${CELL_SIZE/2 + 4}`)
                .fill('none')
                .stroke({ color: '#333', width: 2, linecap: 'round' });

            // Hero blush
            characterGroup.ellipse(5, 3)
                .fill('#FFB6C1')
                .center(CELL_SIZE / 2 - 10, CELL_SIZE / 2 + 3);
            characterGroup.ellipse(5, 3)
                .fill('#FFB6C1')
                .center(CELL_SIZE / 2 + 10, CELL_SIZE / 2 + 3);

            // Add breathing animation
            body.animate(1000)
                .transform({ scale: 1.05 })
                .loop(true, true);

            // Position hero at start
            characterGroup.move(hero.x * CELL_SIZE + CELL_SIZE * 0.15, hero.y * CELL_SIZE + CELL_SIZE * 0.15);

            hero.element = characterGroup;

            // Start trail timer
            startTrail();
        }

        /**
         * Move hero in a direction
         */
        function moveHero(direction) {
            if (!isGameActive || isMoving) return;

            let newX = hero.x;
            let newY = hero.y;
            const currentCell = maze[hero.x][hero.y];

            // Check if movement is possible
            switch (direction) {
                case 'up':
                    if (!currentCell.walls.top) newY--;
                    break;
                case 'down':
                    if (!currentCell.walls.bottom) newY++;
                    break;
                case 'left':
                    if (!currentCell.walls.left) newX--;
                    break;
                case 'right':
                    if (!currentCell.walls.right) newX++;
                    break;
            }

            // Don't move if wall blocks
            if (newX === hero.x && newY === hero.y) return;

            // Animate movement
            isMoving = true;
            hero.element.animate(MOVE_DURATION)
                .move(newX * CELL_SIZE + CELL_SIZE * 0.15, newY * CELL_SIZE + CELL_SIZE * 0.15)
                .after(() => {
                    hero.x = newX;
                    hero.y = newY;
                    isMoving = false;

                    // Check win condition
                    if (hero.x === exitPos.x && hero.y === exitPos.y) {
                        winGame();
                    }

                    // Check monster collision
                    checkMonsterCollision();
                });
        }

        /**
         * Trail effect - leave circles behind hero
         */
        function startTrail() {
            if (trailTimer) clearInterval(trailTimer);

            trailTimer = setInterval(() => {
                if (!isGameActive) return;

                // Create trail dot
                const trailX = hero.x * CELL_SIZE + CELL_SIZE / 2;
                const trailY = hero.y * CELL_SIZE + CELL_SIZE / 2;

                trailGroup.circle(5)
                    .fill('#FFB6C1')
                    .center(trailX, trailY)
                    .opacity(0.6);

            }, TRAIL_INTERVAL);
        }

        // ==================== MONSTERS ====================

        /**
         * Create monsters at random positions
         */
        function createMonsters() {
            monsters = [];

            // Monster colors
            const colors = ['#FF6B6B', '#4ECDC4', '#C44DFF', '#FF9F43'];

            for (let i = 0; i < NUM_MONSTERS; i++) {
                // Find valid position (not too close to start)
                let pos;
                do {
                    pos = {
                        x: Math.floor(Math.random() * MAZE_SIZE),
                        y: Math.floor(Math.random() * MAZE_SIZE)
                    };
                } while (pos.x < 5 && pos.y < 5); // Keep away from start area

                // Create monster visual
                const monsterGroup = draw.group();

                // Monster body (rounded square/blob)
                monsterGroup.rect(CELL_SIZE * 0.6, CELL_SIZE * 0.6)
                    .fill(colors[i % colors.length])
                    .radius(10)
                    .center(CELL_SIZE / 2, CELL_SIZE / 2);

                // Monster eyes
                monsterGroup.circle(5)
                    .fill('white')
                    .center(CELL_SIZE / 2 - 5, CELL_SIZE / 2 - 3);
                monsterGroup.circle(5)
                    .fill('white')
                    .center(CELL_SIZE / 2 + 5, CELL_SIZE / 2 - 3);

                // Monster pupils
                monsterGroup.circle(2)
                    .fill('#333')
                    .center(CELL_SIZE / 2 - 4, CELL_SIZE / 2 - 2);
                monsterGroup.circle(2)
                    .fill('#333')
                    .center(CELL_SIZE / 2 + 6, CELL_SIZE / 2 - 2);

                // Position monster
                monsterGroup.move(pos.x * CELL_SIZE + CELL_SIZE * 0.2, pos.y * CELL_SIZE + CELL_SIZE * 0.2);

                monsters.push({
                    x: pos.x,
                    y: pos.y,
                    element: monsterGroup
                });

                // Start monster movement
                startMonsterMovement(i);
            }
        }

        /**
         * Start automatic monster movement
         */
        function startMonsterMovement(index) {
            const timer = setInterval(() => {
                if (!isGameActive) {
                    clearInterval(timer);
                    return;
                }

                moveMonster(monsters[index]);
            }, MONSTER_SPEED + Math.random() * 400);

            monsterTimers.push(timer);
        }

        /**
         * Move a single monster randomly
         */
        function moveMonster(monster) {
            const currentCell = maze[monster.x][monster.y];
            const possibleMoves = [];

            // Check all directions for valid moves
            if (!currentCell.walls.top) possibleMoves.push({ x: monster.x, y: monster.y - 1 });
            if (!currentCell.walls.bottom) possibleMoves.push({ x: monster.x, y: monster.y + 1 });
            if (!currentCell.walls.left) possibleMoves.push({ x: monster.x - 1, y: monster.y });
            if (!currentCell.walls.right) possibleMoves.push({ x: monster.x + 1, y: monster.y });

            if (possibleMoves.length === 0) return;

            // Choose random valid move
            const nextPos = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];

            // Animate movement
            monster.element.animate(MOVE_DURATION)
                .move(nextPos.x * CELL_SIZE + CELL_SIZE * 0.2, nextPos.y * CELL_SIZE + CELL_SIZE * 0.2)
                .after(() => {
                    monster.x = nextPos.x;
                    monster.y = nextPos.y;

                    // Check collision after move
                    checkMonsterCollision();
                });
        }

        /**
         * Check if any monster caught the hero
         */
        function checkMonsterCollision() {
            for (let monster of monsters) {
                if (monster.x === hero.x && monster.y === hero.y) {
                    loseGame();
                    return;
                }
            }
        }

        // ==================== SOLUTION PATH ====================

        /**
         * Find solution path using BFS algorithm
         */
        function findSolutionPath() {
            // BFS to find shortest path
            const queue = [{ x: hero.x, y: hero.y, path: [] }];
            const visited = new Set();

            while (queue.length > 0) {
                const current = queue.shift();
                const key = `${current.x},${current.y}`;

                if (current.x === exitPos.x && current.y === exitPos.y) {
                    return current.path;
                }

                if (visited.has(key)) continue;
                visited.add(key);

                const cell = maze[current.x][current.y];

                // Check all directions
                if (!cell.walls.top && !visited.has(`${current.x},${current.y - 1}`)) {
                    queue.push({
                        x: current.x,
                        y: current.y - 1,
                        path: [...current.path, { x: current.x, y: current.y }]
                    });
                }
                if (!cell.walls.bottom && !visited.has(`${current.x},${current.y + 1}`)) {
                    queue.push({
                        x: current.x,
                        y: current.y + 1,
                        path: [...current.path, { x: current.x, y: current.y }]
                    });
                }
                if (!cell.walls.left && !visited.has(`${current.x - 1},${current.y}`)) {
                    queue.push({
                        x: current.x - 1,
                        y: current.y,
                        path: [...current.path, { x: current.x, y: current.y }]
                    });
                }
                if (!cell.walls.right && !visited.has(`${current.x + 1},${current.y}`)) {
                    queue.push({
                        x: current.x + 1,
                        y: current.y,
                        path: [...current.path, { x: current.x, y: current.y }]
                    });
                }
            }

            return [];
        }

        /**
         * Show solution path on the maze
         */
        function showSolution() {
            if (!isGameActive) return;

            // Clear previous solution
            if (solutionGroup) solutionGroup.clear();
            solutionGroup = draw.group();

            // Find path
            const path = findSolutionPath();

            if (path.length === 0) {
                updateStatus("No solution found!");
                return;
            }

            // Create path string for polyline
            let pathString = `${hero.x * CELL_SIZE + CELL_SIZE / 2},${hero.y * CELL_SIZE + CELL_SIZE / 2}`;

            for (let pos of path) {
