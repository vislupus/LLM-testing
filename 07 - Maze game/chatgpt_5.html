<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kindy Maze — SVG.js Single‑File Game</title>
<style>
  :root{
    --bg:#0b1220;--panel:#0f172a;--panel2:#101a31;--line:#1e2a49;--text:#e7eefc;--muted:#9fb3d9;--accent:#60a5fa;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444;
  }
  html,body{height:100%}
  body{margin:0;background:linear-gradient(180deg,#0a1224,#0b1220);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
  .wrap{max-width:1040px;margin:0 auto;padding:14px}
  header{display:flex;align-items:center;gap:10px;justify-content:space-between}
  h1{font-size:20px;margin:0;color:#cfe0ff}
  .controls{display:flex;gap:8px;flex-wrap:wrap}
  .btn{background:#173162;border:1px solid #254a93;color:#cfe0ff;border-radius:10px;padding:8px 12px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  #stage{width:100%;height:720px;border:1px solid var(--line);border-radius:14px;background:#0a162e;box-shadow:0 10px 40px rgba(0,0,0,.25) inset;margin-top:10px}
  .hint{font-size:12px;color:#aac1ef;margin-top:6px}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🐣 Kindy Maze — Learn to Navigate!</h1>
      <div class="controls">
        <button id="newBtn" class="btn">New Maze</button>
        <button id="solveBtn" class="btn">Show Solution</button>
      </div>
    </header>
    <div id="stage"></div>
    <div class="hint">Use the arrow keys to move the hero ⭐. Friendly monsters 😊 wander the maze — if they reach you, the maze restarts. Press <b>Show Solution</b> to reveal the correct path. The hero drops a dotted trail while moving.</div>
  </div>

  <!-- SVG.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2/dist/svg.min.js"></script>
  <script>
  ;(()=>{
    // ============================
    // CONFIGURATION & CONSTANTS
    // ============================
    const COLS = 20, ROWS = 20;            // Maze size (20x20)
    const CELL = 28;                        // Cell size in pixels
    const PADDING = 24;                     // Board padding
    const W = PADDING*2 + COLS*CELL;        // SVG width
    const H = PADDING*2 + ROWS*CELL;        // SVG height
    const WALL = 6;                         // Wall stroke width

    const HERO_SPEED = 160;                 // ms per tile for hero animation
    const MONSTER_SPEED = 260;              // ms per tile for monster animation
    const MONSTER_STEP_MS = 420;            // chase step frequency
    const TRAIL_MS = 120;                   // drop hero trail every N ms while moving

    // Directions (N,E,S,W)
    const DIRS = [ {dx:0,dy:-1,idx:0}, {dx:1,dy:0,idx:1}, {dx:0,dy:1,idx:2}, {dx:-1,dy:0,idx:3} ];

    // ============================
    // SVG LAYERS
    // ============================
    let draw, gGrid, gWalls, gSolution, gActors, gTrails, gFX, overlay;

    // ============================
    // MAZE DATA STRUCTURE
    // Each cell has walls [N,E,S,W] = true if wall exists
    // ============================
    let grid;               // 2D array of cells {walls:[..], visited}
    let start = {c:0,r:0};
    let goal = {c:COLS-1,r:ROWS-1};

    // Actors
    let hero, monsters=[];  // hero {c,r,view}, monsters array

    // Timers & flags
    let busy = false;       // true while hero animating
    let trailTimer = null;  // interval for trail dropping
    let chaseTimer = null;  // interval for monsters to step
    let showSolution = false;

    // ============================
    // INITIALIZE SVG SCENE
    // ============================
    function initSVG(){
      draw = SVG().addTo('#stage').size('100%','100%').viewbox(0,0,W,H);
      // Background stars / friendly colors
      draw.rect(W,H).fill('#0a162e');
      const bgGrad = draw.gradient('radial', add=>{ add.stop(0,'#0e1e3e'); add.stop(1,'#08122a'); });
      draw.rect(W,H).fill(bgGrad).opacity(0.45);

      // Main groups
      gGrid = draw.group();
      gWalls = draw.group();
      gSolution = draw.group();
      gTrails = draw.group();
      gActors = draw.group();
      gFX = draw.group();
      overlay = draw.group();

      // Soft decorative grid dots for kid-friendly look
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          gGrid.circle(3).fill('#17325e').center(centerX(c), centerY(r));
        }
      }
    }

    // ============================
    // MAZE GENERATION — Recursive backtracker (depth-first)
    // Generates a perfect maze (1 unique path between any two cells)
    // ============================
    function newMaze(){
      // Reset layers
      gWalls.clear(); gSolution.clear(); gActors.clear(); gTrails.clear(); gFX.clear(); monsters.length=0; busy=false; showSolution=false;
      clearInterval(trailTimer); clearInterval(chaseTimer);

      // Create grid with all walls present
      grid = Array.from({length:ROWS}, ()=> Array.from({length:COLS}, ()=>({ walls:[true,true,true,true], visited:false })));

      // Carve passages
      const stack = [{c:start.c, r:start.r}];
      grid[start.r][start.c].visited = true;
      while(stack.length){
        const cur = stack[stack.length-1];
        const neighbors = [];
        for(const d of DIRS){
          const nc = cur.c + d.dx, nr = cur.r + d.dy;
          if(inBounds(nc,nr) && !grid[nr][nc].visited) neighbors.push({...d, c:nc, r:nr});
        }
        if(neighbors.length){
          const nxt = neighbors[Math.floor(Math.random()*neighbors.length)];
          // Knock down walls between cur and nxt
          grid[cur.r][cur.c].walls[nxt.idx] = false;
          grid[nxt.r][nxt.c].walls[(nxt.idx+2)%4] = false; // opposite wall
          grid[nxt.r][nxt.c].visited = true;
          stack.push({c:nxt.c, r:nxt.r});
        } else {
          stack.pop();
        }
      }

      drawMaze();
      makeHero();
      makeMonsters(3); // 3 friendly monsters
      startChase();
    }

    // Draw maze walls (right & bottom walls per cell + outer border)
    function drawMaze(){
      const wallColor = '#5ec8f8';
      // Outer border
      gWalls.line(PADDING,PADDING, PADDING, PADDING+ROWS*CELL).stroke({width:WALL,color:wallColor,linecap:'round'});
      gWalls.line(PADDING,PADDING, PADDING+COLS*CELL, PADDING).stroke({width:WALL,color:wallColor,linecap:'round'});
      gWalls.line(PADDING+COLS*CELL,PADDING, PADDING+COLS*CELL, PADDING+ROWS*CELL).stroke({width:WALL,color:wallColor,linecap:'round'});
      gWalls.line(PADDING, PADDING+ROWS*CELL, PADDING+COLS*CELL, PADDING+ROWS*CELL).stroke({width:WALL,color:wallColor,linecap:'round'});
      // Internal walls
      for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
          const x0 = tlX(c), y0 = tlY(r), x1 = x0 + CELL, y1 = y0 + CELL;
          const cell = grid[r][c];
          // Draw east and south walls to avoid duplicates
          if(cell.walls[1]) gWalls.line(x1,y0, x1,y1).stroke({width:WALL,color:wallColor,linecap:'round'});
          if(cell.walls[2]) gWalls.line(x0,y1, x1,y1).stroke({width:WALL,color:wallColor,linecap:'round'});
        }
      }

      // Friendly start/goal flags
      banner(centerX(start.c), tlY(start.r)-10, 'START', '#22c55e');
      banner(centerX(goal.c), tlY(goal.r)-10 + CELL, 'GOAL', '#f59e0b');
    }

    function banner(cx, y, text, color){
      const g = gWalls.group();
      const w=72,h=24; const x=cx-w/2;
      g.rect(w,h).move(x,y-18).radius(10).fill(color).stroke({color:'#0a1a33',width:2});
      g.text(text).center(cx,y-6).font({size:12,weight:800,anchor:'middle'}).fill('#0a162e');
    }

    // ============================
    // HERO SETUP & MOVEMENT
    // ============================
    function makeHero(){
      hero = {c:start.c, r:start.r};
      hero.view = cuteStar(centerX(hero.c), centerY(hero.r), 14, '#ffd166');
      // idle bounce
      const loop = ()=> hero.view.animate(800).dy(-2).ease('<>').animate(800).dy(2).ease('<>').after(loop);
      loop();
      // Start trail timer
      trailTimer = setInterval(()=>{ if(!busy) return; dropTrail(centerX(hero.c), centerY(hero.r)); }, TRAIL_MS);
    }

    // Cute star hero with eyes
    function cuteStar(cx,cy,r,color){
      const g = gActors.group();
      const poly = g.polygon(starPoints(cx,cy,r)).fill(color).stroke({color:'#0a1a33',width:3}).filter(add=>{ add.gaussianBlur(0.4); });
      const eyeL = g.circle(4).fill('#083058').center(cx-5,cy-2);
      const eyeR = g.circle(4).fill('#083058').center(cx+5,cy-2);
      const smile = g.path(`M ${cx-6} ${cy+5} Q ${cx} ${cy+10} ${cx+6} ${cy+5}`).stroke({color:'#083058',width:2}).fill('none');
      return g;
    }

    function starPoints(cx,cy,r){
      const spikes=5; const step=Math.PI/spikes; let rot=Math.PI/2*3; let x=cx,y=cy; const pts=[];
      for(let i=0;i<spikes;i++){ x=cx+Math.cos(rot)*r; y=cy+Math.sin(rot)*r; pts.push([x,y]); rot+=step; x=cx+Math.cos(rot)*r/2; y=cy+Math.sin(rot)*r/2; pts.push([x,y]); rot+=step; }
      return pts;
    }

    // Trail circles
    function dropTrail(x,y){ gTrails.circle(4).fill('#9dd7ff').center(x,y).opacity(0.9).animate(1200).dy(8).opacity(0).after(function(){ this.remove(); }); }

    // Attempt move by direction index (0=N,1=E,2=S,3=W)
    function tryMove(dirIdx){
      if(busy) return;
      const d = DIRS[dirIdx];
      const c = hero.c, r = hero.r;
      const cell = grid[r][c];
      if(cell.walls[dirIdx]){ bump(); return; } // Wall blocks
      const nc = c + d.dx, nr = r + d.dy;
      if(!inBounds(nc,nr)){ bump(); return; }
      busy = true;
      // Animate hero to next cell center
      const tx = centerX(nc), ty = centerY(nr);
      hero.view.animate(HERO_SPEED, 0, '>').center(tx,ty).after(()=>{
        hero.c = nc; hero.r = nr; busy = false; // done
        // Win condition
        if(hero.c===goal.c && hero.r===goal.r){ youWin(); }
      });
    }

    function bump(){ // tiny shake to indicate wall
      hero.view.animate(60).scale(1.06).animate(80).scale(1);
    }

    // ============================
    // MONSTERS
    // ============================
    function makeMonsters(n){
      const colors = ['#a7f3d0','#c4b5fd','#fda4af','#fde68a'];
      for(let i=0;i<n;i++){
        // Place far from start
        let m; do{ m = {c:rand(0,COLS-1), r:rand(0,ROWS-1)}; } while(distance(m,start)<10 || (m.c===goal.c&&m.r===goal.r));
        const view = friendlyMonster(centerX(m.c), centerY(m.r), 16, colors[i%colors.length]);
        monsters.push({c:m.c, r:m.r, view});
      }
    }

    // Friendly monster (round buddy with eyes and blush)
    function friendlyMonster(cx,cy,r,color){
      const g = gActors.group();
      const body = g.circle(r*2).fill(color).stroke({color:'#0a1a33',width:3}).center(cx,cy);
      g.circle(5).fill('#0a1a33').center(cx-5,cy-2);
      g.circle(5).fill('#0a1a33').center(cx+5,cy-2);
      g.circle(4).fill('#ffb4c2').center(cx-9,cy+4);
      g.circle(4).fill('#ffb4c2').center(cx+9,cy+4);
      g.path(`M ${cx-6} ${cy+8} Q ${cx} ${cy+12} ${cx+6} ${cy+8}`).fill('none').stroke({color:'#0a1a33',width:2});
      return g;
    }

    function startChase(){
      chaseTimer = setInterval(()=>{
        monsters.forEach((m,idx)=>{
          // Compute shortest path step toward hero using BFS respecting walls
          const step = nextStepToward(m, hero);
          if(!step) return; // stuck
          const tx=centerX(step.c), ty=centerY(step.r);
          m.view.animate(MONSTER_SPEED,0,'>').center(tx,ty).after(()=>{
            m.c=step.c; m.r=step.r; // Update logical position
            // Check collision
            if(m.c===hero.c && m.r===hero.r){ youLose(); }
          });
        });
      }, MONSTER_STEP_MS);
    }

    // Compute next cell toward target via BFS
    function nextStepToward(from, to){
      const q=[]; const seen = Array.from({length:ROWS},()=>Array(COLS).fill(false));
      q.push({c:from.c, r:from.r, prev:null}); seen[from.r][from.c]=true;
      let end=null; while(q.length){ const cur=q.shift(); if(cur.c===to.c && cur.r===to.r){ end=cur; break; } const neigh = neighbors(cur); for(const nb of neigh){ if(!seen[nb.r][nb.c]){ seen[nb.r][nb.c]=true; q.push({c:nb.c,r:nb.r, prev:cur}); } } }
      if(!end) return null; // shouldn't happen in perfect maze
      // Reconstruct path back to from; take one step
      let cur=end; while(cur.prev && !(cur.prev.c===from.c && cur.prev.r===from.r)){ cur=cur.prev; }
      return {c:cur.c, r:cur.r};
    }

    // ============================
    // SOLUTION PATH
    // ============================
    function computeSolution(){
      // BFS from start to goal to get shortest path
      const q=[]; const seen=Array.from({length:ROWS},()=>Array(COLS).fill(false));
      q.push({c:start.c,r:start.r,prev:null}); seen[start.r][start.c]=true;
      let end=null; while(q.length){ const cur=q.shift(); if(cur.c===goal.c && cur.r===goal.r){ end=cur; break; } for(const nb of neighbors(cur)){ if(!seen[nb.r][nb.c]){ seen[nb.r][nb.c]=true; q.push({c:nb.c,r:nb.r,prev:cur}); } } }
      const path=[]; let cur=end; while(cur){ path.push({c:cur.c,r:cur.r}); cur=cur.prev; } path.reverse();
      return path;
    }

    function toggleSolution(){
      showSolution = !showSolution;
      gSolution.clear();
      if(!showSolution) return;
      const path = computeSolution();
      const pts = path.map(p=> [centerX(p.c), centerY(p.r)] ).flat();
      const poly = gSolution.polyline(pts).fill('none').stroke({color:'#ffd166',width:6,linecap:'round',linejoin:'round'});
      // fun dashes
      poly.attr({'stroke-dasharray':'8 10'});
    }

    // ============================
    // UTILITIES
    // ============================
    function neighbors(cell){ // passable neighbors using walls
      const out=[]; const c=cell.c, r=cell.r; const w=grid[r][c].walls;
      if(!w[0] && inBounds(c, r-1)) out.push({c:c, r:r-1});
      if(!w[1] && inBounds(c+1, r)) out.push({c:c+1, r:r});
      if(!w[2] && inBounds(c, r+1)) out.push({c:c, r:r+1});
      if(!w[3] && inBounds(c-1, r)) out.push({c:c-1, r:r});
      return out;
    }
    function inBounds(c,r){ return c>=0 && c<COLS && r>=0 && r<ROWS; }
    function tlX(c){ return PADDING + c*CELL; }
    function tlY(r){ return PADDING + r*CELL; }
    function centerX(c){ return PADDING + c*CELL + CELL/2; }
    function centerY(r){ return PADDING + r*CELL + CELL/2; }
    function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
    function distance(a,b){ return Math.abs(a.c-b.c)+Math.abs(a.r-b.r); }

    // ============================
    // OVERLAYS & GAME STATES
    // ============================
    function overlayMessage(title, msg, color){
      overlay.clear();
      const dim = overlay.rect(W,H).fill('rgba(0,0,0,.45)');
      const card = overlay.group();
      const cw=420,ch=180; const x=W/2-cw/2, y=H/2-ch/2;
      card.rect(cw,ch).move(x,y).radius(14).fill('#0f1a36').stroke({color:'#2b3f6e',width:1});
      card.text(title).move(x+20,y+16).font({size:22,weight:800,fill:'#cfe0ff'});
      card.text(msg).move(x+20,y+54).font({size:14,fill:'#aac1ef'});
      const btn = button(card, x+cw-120, y+ch-50, 96, 36, 'OK', color||'#22c55e');
      btn.on('click', ()=>{ overlay.clear(); newMaze(); });
      overlay.front();
    }

    function button(group,x,y,w,h,label,bg){
      const g = group.group();
      g.rect(w,h).move(x,y).radius(10).fill(bg).stroke({color:'#0a1a33',width:2});
      g.text(label).center(x+w/2,y+h/2).font({size:14,weight:800});
      g.attr({cursor:'pointer'}).on('mouseover',()=> g.animate(120).scale(1.04,1.04,x+w/2,y+h/2)).on('mouseout',()=> g.animate(120).scale(1,1,x+w/2,y+h/2));
      return g;
    }

    function youWin(){
      clearInterval(trailTimer); clearInterval(chaseTimer);
      confetti(centerX(goal.c), centerY(goal.r));
      overlayMessage('🎉 You reached the Goal!','Great job, little navigator!', '#22c55e');
    }

    function youLose(){
      clearInterval(trailTimer); clearInterval(chaseTimer);
      overlayMessage('Oh no! The buddy found you!','Try again with a new maze.', '#f59e0b');
    }

    // Simple confetti effect
    function confetti(cx,cy){
      for(let i=0;i<50;i++){
        const p = gFX.rect(6,8).radius(2).fill(['#60a5fa','#f472b6','#34d399','#fbbf24','#c084fc'][i%5]).center(cx,cy).rotate(rand(0,360));
        p.animate(800+rand(-200,200),0,'>').dx(rand(-80,80)).dy(rand(-80,80)).opacity(0).after(function(){ this.remove(); });
      }
    }

    // ============================
    // INPUT HANDLERS
    // ============================
    window.addEventListener('keydown', (e)=>{
      const k = e.key;
      if(k==='ArrowUp') tryMove(0);
      else if(k==='ArrowRight') tryMove(1);
      else if(k==='ArrowDown') tryMove(2);
      else if(k==='ArrowLeft') tryMove(3);
    });

    document.getElementById('newBtn').addEventListener('click', ()=> newMaze());
    document.getElementById('solveBtn').addEventListener('click', ()=> toggleSolution());

    // ============================
    // STARTUP
    // ============================
    initSVG();
    newMaze();
  })();
  </script>
</body>
</html>
