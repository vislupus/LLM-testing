<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌟 Magic Maze Adventure! 🌟</title>
<style>
  /* ===== GLOBAL STYLES ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    /* Fun gradient background for kids */
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Segoe UI', 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
    color: #fff;
  }

  /* ===== HEADER ===== */
  header {
    text-align: center;
    padding: 16px 10px 6px;
    width: 100%;
  }
  header h1 {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 2px;
    /* Rainbow gradient text */
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: none;
  }
  header p {
    color: #7f8fa6;
    font-size: 13px;
    margin-top: 2px;
  }

  /* ===== TOOLBAR BUTTONS ===== */
  #toolbar {
    display: flex;
    gap: 10px;
    margin: 10px 0 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #toolbar button {
    background: linear-gradient(135deg, rgba(255,107,107,.2), rgba(255,159,243,.2));
    border: 2px solid rgba(255,107,107,.4);
    color: #fff;
    padding: 8px 20px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: .5px;
    transition: all .2s;
  }
  #toolbar button:hover {
    transform: scale(1.06);
    box-shadow: 0 0 20px rgba(255,107,107,.3);
  }
  #toolbar button:active { transform: scale(.97); }

  /* ===== GAME STATUS ===== */
  #status {
    font-size: 14px;
    color: #feca57;
    margin: 4px 0 8px;
    min-height: 20px;
    text-align: center;
  }

  /* ===== SVG CONTAINER ===== */
  #mazeContainer {
    margin: 4px 0 20px;
    display: flex;
    justify-content: center;
  }
  #mazeContainer svg {
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(72,219,251,.15), 0 0 80px rgba(255,107,107,.08);
  }

  /* ===== WIN OVERLAY ===== */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(10,10,30,.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(8px);
  }
  #overlay.visible { display: flex; }
  #overlay h2 {
    font-size: 48px;
    background: linear-gradient(90deg, #feca57, #ff6b6b, #48dbfb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  #overlay p { color: #c8d6e5; font-size: 18px; margin-bottom: 20px; }
  #overlay button {
    background: linear-gradient(135deg, #ff6b6b, #feca57);
    border: none; color: #1a1a2e; padding: 14px 40px;
    border-radius: 30px; font-size: 18px; font-weight: 800;
    cursor: pointer; letter-spacing: 1px;
    box-shadow: 0 4px 24px rgba(255,107,107,.4);
    transition: transform .15s;
  }
  #overlay button:hover { transform: scale(1.07); }

  /* ===== INSTRUCTIONS ===== */
  #instructions {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    color: #4a5568; font-size: 11px; text-align: center;
  }
  #instructions kbd {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 4px; padding: 1px 6px; color: #7f8fa6;
  }
</style>
</head>
<body>

<header>
  <h1>🌟 Magic Maze Adventure 🌟</h1>
  <p>Use arrow keys to guide the hero to the star! Avoid the monsters! 👾</p>
</header>

<div id="toolbar">
  <button onclick="newGame()">🎲 New Maze</button>
  <button onclick="showSolution()">💡 Show Path</button>
</div>

<div id="status">Press arrow keys to start!</div>

<div id="mazeContainer"></div>

<div id="overlay">
  <h2>🎉 You Did It! 🎉</h2>
  <p id="winMsg">The hero reached the star!</p>
  <button onclick="newGame()">🌟 Play Again!</button>
</div>

<div id="instructions">
  <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> Move hero &nbsp;|&nbsp;
  Avoid monsters! &nbsp;|&nbsp; Reach the ⭐ star!
</div>

<!-- ===== SVG.JS LIBRARY ===== -->
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.0/dist/svg.min.js"></script>

<script>
(function(){
"use strict";

/* ═══════════════════════════════════════════════════════
   CONSTANTS
   ═══════════════════════════════════════════════════════ */

/** Size of the maze grid (20×20 cells) */
const ROWS = 20;
const COLS = 20;

/** Pixel size of each cell */
const CELL = 28;

/** Total pixel dimensions of the maze */
const MAZE_W = COLS * CELL;
const MAZE_H = ROWS * CELL;

/** Hero starting position (top-left corner) */
const START_ROW = 0;
const START_COL = 0;

/** Exit/goal position (bottom-right corner) */
const EXIT_ROW = ROWS - 1;
const EXIT_COL = COLS - 1;

/** Number of monsters in the maze */
const NUM_MONSTERS = 5;

/** Monster movement interval in milliseconds */
const MONSTER_INTERVAL = 600;

/** Trail drop interval in milliseconds */
const TRAIL_INTERVAL = 200;

/** Hero movement speed (ms per step for animation) */
const HERO_ANIM_SPEED = 100;

/* ═══════════════════════════════════════════════════════
   GAME STATE
   ═══════════════════════════════════════════════════════ */

/** The maze grid: each cell stores wall info {top, right, bottom, left} as booleans */
let maze = [];

/** Hero's current grid position */
let heroRow = START_ROW;
let heroCol = START_COL;

/** Array of monster objects {row, col, color, direction} */
let monsters = [];

/** Trail circles the hero leaves behind [{row, col, age}] */
let trail = [];

/** Whether the solution path is currently displayed */
let solutionVisible = false;

/** Whether the game has been won */
let gameWon = false;

/** Timer IDs for monster movement and trail dropping */
let monsterTimer = null;
let trailTimer = null;

/** Timestamp of last hero movement (for animation) */
let lastHeroMove = 0;

/* ═══════════════════════════════════════════════════════
   SVG.JS SETUP
   ═══════════════════════════════════════════════════════ */

/** Main SVG drawing instance */
let draw;

/** SVG groups (layers) for different elements */
let layerWalls, layerFloor, layerTrail, layerSolution, layerMonsters, layerHero, layerExit;

/** References to SVG elements we animate */
let heroGroup = null;
let monsterGroups = [];
let exitStar = null;

/* ═══════════════════════════════════════════════════════
   MAZE GENERATION — Recursive Backtracking (DFS)
   This algorithm always produces a solvable maze.
   ═══════════════════════════════════════════════════════ */

/**
 * Initialize the maze grid with all walls present.
 * Each cell has four walls: top, right, bottom, left.
 */
function initMazeGrid() {
  maze = [];
  for (let r = 0; r < ROWS; r++) {
    maze[r] = [];
    for (let c = 0; c < COLS; c++) {
      maze[r][c] = {
        top: true,
        right: true,
        bottom: true,
        left: true,
        visited: false   // Used during generation
      };
    }
  }
}

/**
 * Generate a random maze using recursive backtracking (DFS).
 * Starts from (0,0) and carves passages by removing walls
 * between adjacent cells. Always produces a perfect maze
 * (exactly one path between any two cells).
 */
function generateMaze() {
  initMazeGrid();

  /** Stack for the DFS traversal */
  const stack = [];
  /** Start from the top-left cell */
  const startR = 0, startC = 0;
  maze[startR][startC].visited = true;
  stack.push({ r: startR, c: startC });

  while (stack.length > 0) {
    const current = stack[stack.length - 1];
    /** Find all unvisited neighbors */
    const neighbors = getUnvisitedNeighbors(current.r, current.c);

    if (neighbors.length === 0) {
      /** Dead end — backtrack */
      stack.pop();
    } else {
      /** Randomly pick one neighbor */
      const next = neighbors[Math.floor(Math.random() * neighbors.length)];
      /** Remove the wall between current and next */
      removeWall(current.r, current.c, next.r, next.c);
      /** Mark next as visited and push to stack */
      maze[next.r][next.c].visited = true;
      stack.push({ r: next.r, c: next.c });
    }
  }

  /* Clean up the visited flag — no longer needed */
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      delete maze[r][c].visited;
}

/**
 * Get all unvisited neighbors of a cell (up, right, down, left).
 * @param {number} r - Row index
 * @param {number} c - Column index
 * @returns {Array} Array of {r, c} neighbor objects
 */
function getUnvisitedNeighbors(r, c) {
  const neighbors = [];
  /* Up */
  if (r > 0 && !maze[r-1][c].visited) neighbors.push({ r: r-1, c });
  /* Right */
  if (c < COLS-1 && !maze[r][c+1].visited) neighbors.push({ r, c: c+1 });
  /* Down */
  if (r < ROWS-1 && !maze[r+1][c].visited) neighbors.push({ r: r+1, c });
  /* Left */
  if (c > 0 && !maze[r][c-1].visited) neighbors.push({ r, c: c-1 });
  return neighbors;
}

/**
 * Remove the wall between two adjacent cells.
 * @param {number} r1 - Row of first cell
 * @param {number} c1 - Column of first cell
 * @param {number} r2 - Row of second cell
 * @param {number} c2 - Column of second cell
 */
function removeWall(r1, c1, r2, c2) {
  const dr = r2 - r1;
  const dc = c2 - c1;

  if (dr === -1) { /* Second cell is above */
    maze[r1][c1].top = false;
    maze[r2][c2].bottom = false;
  } else if (dr === 1) { /* Second cell is below */
    maze[r1][c1].bottom = false;
    maze[r2][c2].top = false;
  } else if (dc === -1) { /* Second cell is to the left */
    maze[r1][c1].left = false;
    maze[r2][c2].right = false;
  } else if (dc === 1) { /* Second cell is to the right */
    maze[r1][c1].right = false;
    maze[r2][c2].left = false;
  }
}

/* ═══════════════════════════════════════════════════════
   SOLUTION PATHFINDING — BFS
   ═══════════════════════════════════════════════════════ */

/**
 * Find the shortest path from start to exit using BFS.
 * @returns {Array} Array of {row, col} steps from start to exit
 */
function findSolution() {
  const visited = Array.from({ length: ROWS }, () => new Array(COLS).fill(false));
  const parent = Array.from({ length: ROWS }, () => new Array(COLS).fill(null));
  const queue = [{ r: START_ROW, c: START_COL }];
  visited[START_ROW][START_COL] = true;

  while (queue.length > 0) {
    const { r, c } = queue.shift();

    /* Check if we reached the exit */
    if (r === EXIT_ROW && c === EXIT_COL) {
      /* Reconstruct path by following parent pointers */
      const path = [];
      let cur = { r, c };
      while (cur) {
        path.unshift(cur);
        cur = parent[cur.r][cur.c];
      }
      return path;
    }

    /* Explore neighbors (only through open passages) */
    const cell = maze[r][c];
    /* Up */
    if (!cell.top && r > 0 && !visited[r-1][c]) {
      visited[r-1][c] = true;
      parent[r-1][c] = { r, c };
      queue.push({ r: r-1, c });
    }
    /* Right */
    if (!cell.right && c < COLS-1 && !visited[r][c+1]) {
      visited[r][c+1] = true;
      parent[r][c+1] = { r, c };
      queue.push({ r, c: c+1 });
    }
    /* Down */
    if (!cell.bottom && r < ROWS-1 && !visited[r+1][c]) {
      visited[r+1][c] = true;
      parent[r+1][c] = { r, c };
      queue.push({ r: r+1, c });
    }
    /* Left */
    if (!cell.left && c > 0 && !visited[r][c-1]) {
      visited[r][c-1] = true;
      parent[r][c-1] = { r, c };
      queue.push({ r, c: c-1 });
    }
  }

  return []; /* Should never happen — maze is always solvable */
}

/* ═══════════════════════════════════════════════════════
   DRAWING — SVG.JS
   ═══════════════════════════════════════════════════════ */

/**
 * Set up the SVG canvas and all drawing layers.
 */
function setupSVG() {
  /* Clear previous SVG if it exists */
  const container = document.getElementById('mazeContainer');
  container.innerHTML = '';

  /* Create SVG canvas */
  draw = SVG().addTo('#mazeContainer').size(MAZE_W + 4, MAZE_H + 4);

  /* Create layers (back to front) */
  layerFloor    = draw.group().id('layerFloor');
  layerTrail    = draw.group().id('layerTrail');
  layerSolution = draw.group().id('layerSolution');
  layerWalls    = draw.group().id('layerWalls');
  layerExit     = draw.group().id('layerExit');
  layerMonsters = draw.group().id('layerMonsters');
  layerHero     = draw.group().id('layerHero');
}

/**
 * Draw the maze floor (cell backgrounds) and walls.
 */
function drawMaze() {
  /* Draw floor tiles with alternating subtle colors */
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const isLight = (r + c) % 2 === 0;
      layerFloor.rect(CELL, CELL)
        .move(c * CELL + 2, r * CELL + 2)
        .fill(isLight ? '#1e2a3a' : '#1a2535')
        .stroke({ color: '#253545', width: 0.5 });
    }
  }

  /* Draw walls */
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = maze[r][c];
      const x = c * CELL + 2;
      const y = r * CELL + 2;

      /* Wall style: thick, rounded, colorful */
      const wallColor = '#4a6fa5';
      const wallWidth = 3;

      if (cell.top) {
        layerWalls.line(x, y, x + CELL, y)
          .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
      }
      if (cell.right) {
        layerWalls.line(x + CELL, y, x + CELL, y + CELL)
          .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
      }
      if (cell.bottom) {
        layerWalls.line(x, y + CELL, x + CELL, y + CELL)
          .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
      }
      if (cell.left) {
        layerWalls.line(x, y, x, y + CELL)
          .stroke({ color: wallColor, width: wallWidth, linecap: 'round' });
      }
    }
  }

  /* Draw outer border */
  layerWalls.rect(MAZE_W, MAZE_H)
    .move(2, 2)
    .fill('none')
    .stroke({ color: '#5a8fd5', width: 4, linecap: 'round' });
}

/**
 * Draw the exit star at the bottom-right corner.
 */
function drawExit() {
  layerExit.clear();
  const cx = EXIT_COL * CELL + CELL / 2 + 2;
  const cy = EXIT_ROW * CELL + CELL / 2 + 2;

  /* Glowing background circle */
  const glow = layerExit.circle(CELL * 0.9)
    .center(cx, cy)
    .fill('rgba(254,202,87,.15)');

  /* Animate the glow pulsing */
  glow.animate({ duration: 1500, loop: true })
    .attr({ r: CELL * 0.7 })
    .animate({ duration: 1500, loop: true })
    .attr({ r: CELL * 0.9 });

  /* Star shape */
  exitStar = drawStar(cx, cy, 5, CELL * 0.35, CELL * 0.18);
  exitStar.fill('#feca57')
    .stroke({ color: '#f6b93b', width: 1.5 })
    .addTo(layerExit);

  /* Star sparkle animation */
  exitStar.animate({ duration: 800, loop: true, ease: 'sinusoidal' })
    .transform({ scale: 1.1 })
    .animate({ duration: 800, loop: true, ease: 'sinusoidal' })
    .transform({ scale: 1.0 });
}

/**
 * Draw a star shape as an SVG polygon.
 * @param {number} cx - Center X
 * @param {number} cy - Center Y
 * @param {number} points - Number of star points
 * @param {number} outerR - Outer radius
 * @param {number} innerR - Inner radius
 * @returns {SVG.Polygon}
 */
function drawStar(cx, cy, points, outerR, innerR) {
  const coords = [];
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI / points) - Math.PI / 2;
    const r = i % 2 === 0 ? outerR : innerR;
    coords.push([
      cx + Math.cos(angle) * r,
      cy + Math.sin(angle) * r
    ]);
  }
  return draw.polygon(coords.map(p => p.join(',')).join(' '));
}

/**
 * Draw the cute hero character at the given position.
 * The hero is a smiling face with big eyes.
 * @param {number} r - Row position
 * @param {number} c - Column position
 */
function drawHero(r, c) {
  layerHero.clear();
  const cx = c * CELL + CELL / 2 + 2;
  const cy = r * CELL + CELL / 2 + 2;
  const radius = CELL * 0.38;

  heroGroup = draw.group().addTo(layerHero);

  /* Body — bright cyan circle */
  const body = heroGroup.circle(radius * 2)
    .center(cx, cy)
    .fill('#48dbfb')
    .stroke({ color: '#0abde3', width: 2 });

  /* Cheeks — pink circles */
  heroGroup.circle(radius * 0.35)
    .center(cx - radius * 0.5, cy + radius * 0.15)
    .fill('rgba(255,107,107,.35)');
  heroGroup.circle(radius * 0.35)
    .center(cx + radius * 0.5, cy + radius * 0.15)
    .fill('rgba(255,107,107,.35)');

  /* Left eye — white circle with black pupil */
  heroGroup.circle(radius * 0.32)
    .center(cx - radius * 0.35, cy - radius * 0.15)
    .fill('#fff');
  heroGroup.circle(radius * 0.18)
    .center(cx - radius * 0.3, cy - radius * 0.12)
    .fill('#2d3436');

  /* Right eye */
  heroGroup.circle(radius * 0.32)
    .center(cx + radius * 0.35, cy - radius * 0.15)
    .fill('#fff');
  heroGroup.circle(radius * 0.18)
    .center(cx + radius * 0.3, cy - radius * 0.12)
    .fill('#2d3436');

  /* Smile — curved path */
  heroGroup.path(`M ${cx - radius*0.35} ${cy + radius*0.2} Q ${cx} ${cy + radius*0.6} ${cx + radius*0.35} ${cy + radius*0.2}`)
    .fill('none')
    .stroke({ color: '#2d3436', width: 2, linecap: 'round' });

  /* Little hat on top */
  heroGroup.rect(radius * 0.8, radius * 0.25)
    .center(cx, cy - radius * 0.85)
    .fill('#ff6b6b')
    .radius(2);
  heroGroup.rect(radius * 1.1, radius * 0.12)
    .center(cx, cy - radius * 0.7)
    .fill('#ee5a24')
    .radius(1);

  /* Gentle bobbing animation */
  heroGroup.animate({ duration: 1000, loop: true, ease: 'sinusoidal' })
    .transform({ translateY: -2 })
    .animate({ duration: 1000, loop: true, ease: 'sinusoidal' })
    .transform({ translateY: 0 });
}

/**
 * Move the hero to a new position with smooth animation.
 * @param {number} newR - New row
 * @param {number} newC - New column
 */
function moveHero(newR, newC) {
  heroRow = newR;
  heroCol = newC;

  const targetX = newC * CELL + CELL / 2 + 2;
  const targetY = newR * CELL + CELL / 2 + 2;

  /* Animate hero to new position */
  if (heroGroup) {
    heroGroup.animate(HERO_ANIM_SPEED, '-', 'now')
      .move(targetX - CELL/2, targetY - CELL/2);
  }

  /* Check if hero reached the exit */
  if (heroRow === EXIT_ROW && heroCol === EXIT_COL) {
    winGame();
  }
}

/**
 * Draw all monsters in the maze.
 */
function drawMonsters() {
  layerMonsters.clear();
  monsterGroups = [];

  const monsterColors = [
    { body: '#ff6b6b', dark: '#ee5a24' },  /* Red */
    { body: '#a55eea', dark: '#8854d0' },  /* Purple */
    { body: '#2ed573', dark: '#20bf6b' },  /* Green */
    { body: '#ffa502', dark: '#e67e22' },  /* Orange */
    { body: '#ff9ff3', dark: '#f368e0' },  /* Pink */
  ];

  monsters.forEach((m, i) => {
    const cx = m.col * CELL + CELL / 2 + 2;
    const cy = m.row * CELL + CELL / 2 + 2;
    const radius = CELL * 0.35;
    const colors = monsterColors[i % monsterColors.length];
    m.color = colors.body;

    const group = draw.group().addTo(layerMonsters);
    monsterGroups.push(group);

    /* Body — squishy blob shape */
    group.circle(radius * 2)
      .center(cx, cy)
      .fill(colors.body)
      .stroke({ color: colors.dark, width: 2 });

    /* Wobbly top (like a little horn/hair) */
    group.path(`M ${cx - radius*0.2} ${cy - radius*0.8} Q ${cx} ${cy - radius*1.4} ${cx + radius*0.2} ${cy - radius*0.8}`)
      .fill('none')
      .stroke({ color: colors.dark, width: 2.5, linecap: 'round' });

    /* Eyes — big and friendly */
    group.circle(radius * 0.38)
      .center(cx - radius * 0.35, cy - radius * 0.1)
      .fill('#fff');
    group.circle(radius * 0.2)
      .center(cx - radius * 0.3, cy - radius * 0.08)
      .fill('#2d3436');

    group.circle(radius * 0.38)
      .center(cx + radius * 0.35, cy - radius * 0.1)
      .fill('#fff');
    group.circle(radius * 0.2)
      .center(cx + radius * 0.3, cy - radius * 0.08)
      .fill('#2d3436');

    /* Cute little frown (they're grumpy monsters!) */
    group.path(`M ${cx - radius*0.3} ${cy + radius*0.35} Q ${cx} ${cy + radius*0.15} ${cx + radius*0.3} ${cy + radius*0.35}`)
      .fill('none')
      .stroke({ color: '#2d3436', width: 1.8, linecap: 'round' });

    /* Tiny feet */
    group.ellipse(radius * 0.25, radius * 0.12)
      .center(cx - radius * 0.35, cy + radius * 0.9)
      .fill(colors.dark);
    group.ellipse(radius * 0.25, radius * 0.12)
      .center(cx + radius * 0.35, cy + radius * 0.9)
      .fill(colors.dark);

    /* Bobbing animation with offset per monster */
    const delay = i * 200;
    group.animate({ duration: 900, loop: true, ease: 'sinusoidal', delay })
      .transform({ translateY: -2 })
      .animate({ duration: 900, loop: true, ease: 'sinusoidal', delay })
      .transform({ translateY: 0 });
  });
}

/**
 * Move a specific monster to a new position.
 * @param {number} index - Monster index
 * @param {number} newR - New row
 * @param {number} newC - New column
 */
function moveMonster(index, newR, newC) {
  monsters[index].row = newR;
  monsters[index].col = newC;

  const targetX = newC * CELL + 2;
  const targetY = newR * CELL + 2;

  if (monsterGroups[index]) {
    monsterGroups[index].animate(300, '-', 'now')
      .move(targetX, targetY);
  }
}

/**
 * Draw a trail circle at the hero's current position.
 */
function dropTrail() {
  if (gameWon) return;

  const cx = heroCol * CELL + CELL / 2 + 2;
  const cy = heroRow * CELL + CELL / 2 + 2;

  /* Create a small glowing circle */
  const dot = layerTrail.circle(5)
    .center(cx, cy)
    .fill('rgba(72,219,251,.5)');

  /* Fade out over time */
  dot.animate({ duration: 4000 })
    .attr({ fill: 'rgba(72,219,251,.05)' });

  trail.push({ element: dot, time: Date.now() });

  /* Remove old trail dots (older than 8 seconds) */
  const cutoff = Date.now() - 8000;
  while (trail.length > 0 && trail[0].time < cutoff) {
    trail[0].element.remove();
    trail.shift();
  }
}

/**
 * Draw the solution path as a glowing line through the maze.
 */
function drawSolutionPath() {
  layerSolution.clear();
  const path = findSolution();

  if (path.length < 2) return;

  /* Build polyline points */
  const points = path.map(p => {
    const x = p.c * CELL + CELL / 2 + 2;
    const y = p.r * CELL + CELL / 2 + 2;
    return `${x},${y}`;
  }).join(' ');

  /* Glowing path line */
  const line = layerSolution.polyline(points)
    .fill('none')
    .stroke({ color: '#feca57', width: 4, linecap: 'round', linejoin: 'round' })
    .opacity(0.8);

  /* Glow effect — wider, transparent line behind */
  layerSolution.polyline(points)
    .fill('none')
    .stroke({ color: 'rgba(254,202,87,.2)', width: 10, linecap: 'round', linejoin: 'round' });

  /* Animate the path appearing */
  const totalLength = line.length();
  line.stroke({ dasharray: totalLength, dashoffset: totalLength });
  line.animate({ duration: 1500, ease: 'easeInOut' })
    .stroke({ dashoffset: 0 });

  solutionVisible = true;
}

/**
 * Hide the solution path.
 */
function hideSolution() {
  layerSolution.clear();
  solutionVisible = false;
}

/* ═══════════════════════════════════════════════════════
   MONSTER AI — Random Movement
   ═══════════════════════════════════════════════════════ */

/**
 * Initialize monsters at random positions in the maze,
 * making sure they don't start on the hero or the exit.
 */
function initMonsters() {
  monsters = [];
  const occupied = new Set();
  occupied.add(`${START_ROW},${START_COL}`);
  occupied.add(`${EXIT_ROW},${EXIT_COL}`);

  /* Place monsters at least 5 cells away from start */
  for (let i = 0; i < NUM_MONSTERS; i++) {
    let r, c;
    do {
      r = Math.floor(Math.random() * ROWS);
      c = Math.floor(Math.random() * COLS);
    } while (
      occupied.has(`${r},${c}`) ||
      (Math.abs(r - START_ROW) + Math.abs(c - START_COL) < 6)
    );
    occupied.add(`${r},${c}`);
    monsters.push({ row: r, col: c, color: '', direction: Math.floor(Math.random() * 4) });
  }
}

/**
 * Move all monsters one step. Monsters try to move in their
 * current direction; if blocked, they pick a random new direction.
 */
function moveMonsters() {
  if (gameWon) return;

  const directions = [
    { dr: -1, dc: 0, wall: 'top' },     /* Up */
    { dr: 0, dc: 1, wall: 'right' },    /* Right */
    { dr: 1, dc: 0, wall: 'bottom' },   /* Down */
    { dr: 0, dc: -1, wall: 'left' }     /* Left */
  ];

  monsters.forEach((m, i) => {
    const cell = maze[m.row][m.col];
    const dir = directions[m.direction];

    /* Try to move in current direction */
    let newR = m.row + dir.dr;
    let newC = m.col + dir.dc;

    /* Check if movement is valid (no wall, within bounds) */
    if (
      newR >= 0 && newR < ROWS && newC >= 0 && newC < COLS &&
      !cell[dir.wall]
    ) {
      /* 30% chance to randomly change direction at intersections */
      if (Math.random() < 0.3) {
        m.direction = Math.floor(Math.random() * 4);
      }
      moveMonster(i, newR, newC);
    } else {
      /* Blocked — pick a random valid direction */
      const validDirs = directions.filter((d, idx) => {
        const nr = m.row + d.dr;
        const nc = m.col + d.dc;
        return nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !cell[d.wall];
      });

      if (validDirs.length > 0) {
        const newDir = validDirs[Math.floor(Math.random() * validDirs.length)];
        m.direction = directions.indexOf(newDir);
        moveMonster(i, m.row + newDir.dr, m.col + newDir.dc);
      }
    }

    /* Check if monster caught the hero */
    if (monsters[i].row === heroRow && monsters[i].col === heroCol) {
      heroCaught();
    }
  });
}

/**
 * Handle the hero being caught by a monster.
 * Shows a message and restarts the game.
 */
function heroCaught() {
  if (gameWon) return;
  gameWon = true;
  stopTimers();

  /* Flash the hero red */
  if (heroGroup) {
    heroGroup.animate({ duration: 200, loop: 3 })
      .transform({ scale: 1.3 })
      .animate({ duration: 200, loop: 3 })
      .transform({ scale: 1.0 });
  }

  /* Show status message */
  document.getElementById('status').textContent = '😱 Oh no! A monster got you! Starting a new maze...';

  /* Restart after a short delay */
  setTimeout(() => {
    newGame();
  }, 2000);
}

/* ═══════════════════════════════════════════════════════
   GAME FLOW
   ═══════════════════════════════════════════════════════ */

/**
 * Start a brand new game: generate maze, draw everything,
 * place hero and monsters, start timers.
 */
function newGame() {
  /* Reset state */
  gameWon = false;
  solutionVisible = false;
  heroRow = START_ROW;
  heroCol = START_COL;
  trail = [];

  /* Hide overlay */
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('status').textContent = 'Press arrow keys to start!';

  /* Stop old timers */
  stopTimers();

  /* Generate new maze */
  generateMaze();

  /* Set up SVG canvas */
  setupSVG();

  /* Draw everything */
  drawMaze();
  drawExit();
  drawHero(heroRow, heroCol);
  initMonsters();
  drawMonsters();

  /* Start monster movement timer */
  monsterTimer = setInterval(moveMonsters, MONSTER_INTERVAL);

  /* Start trail timer */
  trailTimer = setInterval(dropTrail, TRAIL_INTERVAL);
}

/**
 * Player wins the game — show celebration overlay.
 */
function winGame() {
  if (gameWon) return;
  gameWon = true;
  stopTimers();

  /* Celebration animation — sparkles around exit */
  const cx = EXIT_COL * CELL + CELL / 2 + 2;
  const cy = EXIT_ROW * CELL + CELL / 2 + 2;
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2;
    const dist = CELL * 1.5;
    const sparkle = layerExit.circle(4)
      .center(cx, cy)
      .fill('#feca57');
    sparkle.animate({ duration: 600, delay: i * 50 })
      .center(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist)
      .opacity(0);
  }

  /* Show win overlay after a short delay */
  setTimeout(() => {
    document.getElementById('winMsg').textContent = '🌟 Amazing! You guided the hero to the star! 🌟';
    document.getElementById('overlay').classList.add('visible');
  }, 800);
}

/**
 * Stop all game timers.
 */
function stopTimers() {
  if (monsterTimer) { clearInterval(monsterTimer); monsterTimer = null; }
  if (trailTimer) { clearInterval(trailTimer); trailTimer = null; }
}

/* ═══════════════════════════════════════════════════════
   USER INTERFACE FUNCTIONS (called from HTML buttons)
   ═══════════════════════════════════════════════════════ */

/**
 * Toggle the solution path visibility.
 */
window.showSolution = function() {
  if (gameWon) return;
  if (solutionVisible) {
    hideSolution();
    document.getElementById('status').textContent = 'Path hidden. Keep exploring!';
  } else {
    drawSolutionPath();
    document.getElementById('status').textContent = '💡 The yellow line shows the way!';
  }
};

/**
 * Start a new game (called from button).
 */
window.newGame = function() {
  newGame();
};

/**
 * Close the win overlay and start new game.
 */
window.closeOverlay = function() {
  document.getElementById('overlay').classList.remove('visible');
  newGame();
};

/* ═══════════════════════════════════════════════════════
   KEYBOARD INPUT — Arrow Key Movement
   ═══════════════════════════════════════════════════════ */

document.addEventListener('keydown', function(e) {
  if (gameWon) return;

  let dr = 0, dc = 0;

  switch(e.key) {
    case 'ArrowUp':    dr = -1; break;
    case 'ArrowDown':  dr = 1;  break;
    case 'ArrowLeft':  dc = -1; break;
    case 'ArrowRight': dc = 1;  break;
    default: return; /* Ignore other keys */
  }

  e.preventDefault(); /* Prevent page scrolling */

  /* Rate-limit hero movement to prevent too-fast input */
  const now = Date.now();
  if (now - lastHeroMove < HERO_ANIM_SPEED) return;
  lastHeroMove = now;

  const newR = heroRow + dr;
  const newC = heroCol + dc;

  /* Check bounds */
  if (newR < 0 || newR >= ROWS || newC < 0 || newC >= COLS) return;

  /* Check walls — can only move if there's no wall in that direction */
  const cell = maze[heroRow][heroCol];
  if (dr === -1 && cell.top) return;    /* Wall above */
  if (dr === 1 && cell.bottom) return;  /* Wall below */
  if (dc === -1 && cell.left) return;   /* Wall to left */
  if (dc === 1 && cell.right) return;   /* Wall to right */

  /* Move is valid — move the hero */
  moveHero(newR, newC);

  /* Update status */
  document.getElementById('status').textContent =
    `Hero is at row ${newR + 1}, column ${newC + 1} — keep going!`;

  /* Check if a monster is on the new position */
  monsters.forEach((m, i) => {
    if (m.row === newR && m.col === newC) {
      heroCaught();
    }
  });
});

/* ═══════════════════════════════════════════════════════
   INITIALIZATION — Start the first game on page load
   ═══════════════════════════════════════════════════════ */
newGame();

})();
</script>
