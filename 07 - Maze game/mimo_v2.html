<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 Happy Maze Adventure!</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
    background: linear-gradient(160deg, #ffecd2 0%, #fcb69f 40%, #ff9a9e 100%);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px;
  }
  h1 {
    font-size: 2.2em; color: #e44d26;
    text-shadow: 2px 2px 0 #fff, 0 0 12px rgba(255,200,0,0.5);
    margin: 6px 0;
  }
  #info {
    font-size: 1.2em; color: #6b3fa0; margin: 6px 0;
    background: rgba(255,255,255,0.75); padding: 6px 18px;
    border-radius: 20px;
  }
  #controls { margin: 8px 0; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button {
    padding: 10px 22px; font-family: inherit; font-size: 1.05em;
    font-weight: bold; border: 3px solid #fff; border-radius: 25px;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
  }
  button:hover { transform: scale(1.07); }
  button:active { transform: scale(0.96); }
  #hintBtn  { background: linear-gradient(135deg,#81d4fa,#29b6f6); color: #01579b; }
  #resetBtn { background: linear-gradient(135deg,#ce93d8,#ab47bc); color: #fff; }
  #mazeWrap {
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.22);
    margin-top: 6px; background: #fff;
  }
  /* Win / lose overlay messages */
  #overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); z-index: 100;
  }
  #overlay.show { display: flex; }
  #overlayMsg {
    font-size: 2.8em; color: #fff;
    text-shadow: 3px 3px 8px rgba(0,0,0,0.5);
    animation: popIn 0.5s ease;
  }
  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    60%  { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<h1>🌈 Happy Maze Adventure 🌈</h1>
<div id="info">Use <b>Arrow Keys</b> to guide the hero to the ❤️ ! Watch out for monsters! 👾</div>
<div id="controls">
  <button id="hintBtn" onclick="toggleHint()">💡 Show Path</button>
  <button id="resetBtn" onclick="resetGame()">🔄 New Maze</button>
</div>
<div id="mazeWrap">
  <!-- SVG.js will create the SVG here -->
</div>
<div id="overlay"><div id="overlayMsg"></div></div>

<!-- ====== SVG.js library (CDN) ====== -->
<script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>

<!-- =====================================================
     🎮  HAPPY MAZE ADVENTURE  –  Complete Game Engine
     =====================================================
     FEATURES:
       • 20×20 perfect maze generated via recursive DFS
       • Cute hero character with trail of sparkles
       • Friendly monster enemies (2)
       • Keyboard arrow-key controls
       • "Show Solution" button (BFS shortest path)
       • All rendering via SVG.js
     ===================================================== -->


<script>
// ══════════════════════════════════════════════
//  CONSTANTS & GLOBALS
// ══════════════════════════════════════════════

const ROWS = 20, COLS = 20;          // maze grid size
const CELL = 28;                      // pixel size of one cell
const PAD  = 8;                       // padding around the maze
const WALLW = 3;                      // wall stroke width

// Total SVG canvas size
const SVG_W = PAD * 2 + COLS * CELL;
const SVG_H = PAD * 2 + ROWS * CELL;

// Direction helpers:  row-delta, col-delta, opposite-wall-index
const DIR = [
  { dr:-1, dc: 0, opp: 2 },  // 0 = up    (opposite is down)
  { dr: 0, dc: 1, opp: 3 },  // 1 = right (opposite is left)
  { dr: 1, dc: 0, opp: 0 },  // 2 = down  (opposite is up)
  { dr: 0, dc:-1, opp: 1 },  // 3 = left  (opposite is right)
];

// Key-code → direction mapping
const KEY_DIR = {
  ArrowUp: 0, w: 0, W: 0,
  ArrowRight: 1, d: 1, D: 1,
  ArrowDown: 2, s: 2, S: 2,
  ArrowLeft: 3, a: 3, A: 3,
};

// Monster colours (pink & green blobs)
const MCOLORS = ['#ff69b4','#69b4ff','#b469ff'];
const NUM_MONSTERS = 2;

// ══════════════════════════════════════════════
//  STATE VARIABLES
// ══════════════════════════════════════════════

let grid      = [];    // 2-D cell objects { walls:[t,r,b,l] }
let solution  = [];    // BFS shortest-path array of [r,c]
let heroR, heroC;      // hero's current row / col
let monsR, monsC;      // monsters' row / col arrays
let trail     = [];    // SVG trail-circle references
let draw;              // SVG.js drawing surface
let heroG, monsG;      // SVG.js groups for hero & monsters
let trailG, hintG, decoG; // SVG.js groups for trail, hint overlay, decorations
let monsterTimer;      // setInterval handle
let gameActive;        // true while the player can move
let hintVisible;       // is the solution path drawn?

// ══════════════════════════════════════════════
//  MAZE GENERATION  (recursive back-tracking)
// ══════════════════════════════════════════════

function createGrid () {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = { walls: [true, true, true, true], visited: false };
    }
  }
}

function inBounds (r, c) {
  return r >= 0 && r < ROWS && c >= 0 && c < COLS;
}

function generateMaze () {
  createGrid();
  const stack = [[0, 0]];
  grid[0][0].visited = true;

  while (stack.length) {
    const [r, c] = stack[stack.length - 1];

    // Collect unvisited neighbours
    const neighbours = [];
    for (const d of DIR) {
      const nr = r + d.dr, nc = c + d.dc;
      if (inBounds(nr, nc) && !grid[nr][nc].visited) {
        neighbours.push([nr, nc, d]);
      }
    }

    if (neighbours.length === 0) {
      stack.pop();                       // backtrack
    } else {
      // Pick a random neighbour and carve through the wall
      const [nr, nc, d] = neighbours[Math.floor(Math.random() * neighbours.length)];
      grid[r][c].walls[DIR.indexOf(d)] = false;   // remove wall toward neighbour
      grid[nr][nc].walls[d.opp] = false;           // remove opposite wall
      grid[nr][nc].visited = true;
      stack.push([nr, nc]);
    }
  }
}

// ══════════════════════════════════════════════
//  SHORTEST-PATH SOLVER  (BFS)
// ══════════════════════════════════════════════

function solveMaze () {
  const vis = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
  const par = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
  const q   = [[0, 0]];
  vis[0][0] = true;

  while (q.length) {
    const [r, c] = q.shift();
    if (r === ROWS - 1 && c === COLS - 1) break;   // reached goal

    for (let d = 0; d < 4; d++) {
      if (grid[r][c].walls[d]) continue;            // wall blocks passage
      const nr = r + DIR[d].dr, nc = c + DIR[d].dc;
      if (inBounds(nr, nc) && !vis[nr][nc]) {
        vis[nr][nc] = true;
        par[nr][nc] = [r, c];
        q.push([nr, nc]);
      }
    }
  }

  // Reconstruct path from goal back to start
  solution = [];
  let cur = [ROWS - 1, COLS - 1];
  while (cur) {
    solution.unshift(cur);
    cur = par[cur[0]][cur[1]];
  }
}

// ══════════════════════════════════════════════
//  COORDINATE HELPERS
// ══════════════════════════════════════════════

function cx (c) { return PAD + c * CELL + CELL / 2; }   // centre-x of cell
function cy (r) { return PAD + r * CELL + CELL / 2; }   // centre-y of cell

// ══════════════════════════════════════════════
//  SVG DRAWING — BUILD THE ENTIRE BOARD
// ══════════════════════════════════════════════

function buildBoard () {
  // Create (or recreate) the SVG canvas
  document.getElementById('mazeWrap').innerHTML = '';
  draw = SVG().addTo('#mazeWrap').size(SVG_W, SVG_H);

  // --- Background ---
  draw.rect(SVG_W, SVG_H).fill('#e8f5e9');

  // --- Draw individual floor tiles ---
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const light = (r + c) % 2 === 0;
      draw.rect(CELL, CELL)
        .move(PAD + c * CELL, PAD + r * CELL)
        .fill(light ? '#fffde7' : '#fff9c4')
        .radius(1);
    }
  }

  // --- Start & Goal markers ---
  // Start = yellow sun
  draw.circle(CELL * 0.7).center(cx(0), cy(0))
    .fill('#ffd54f').stroke('#ffb300', 2).opacity(0.85);
  draw.text('☀').center(cx(0), cy(0)).font({ size: 16 });

  // Goal = red heart
  draw.circle(CELL * 0.7).center(cx(COLS-1), cy(ROWS-1))
    .fill('#ef9a9a').stroke('#e53935', 2).opacity(0.85);
  draw.text('❤').center(cx(COLS-1), cy(ROWS-1)).font({ size: 16 });

  // --- Draw walls ---
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = PAD + c * CELL, y = PAD + r * CELL;
      const w = grid[r][c].walls;
      // Top wall
      if (w[0]) draw.line(x, y, x + CELL, y)
        .stroke({ color: '#5c6bc0', width: WALLW, linecap: 'round' });
      // Right wall
      if (w[1]) draw.line(x + CELL, y, x + CELL, y + CELL)
        .stroke({ color: '#5c6bc0', width: WALLW, linecap: 'round' });
      // Bottom wall
      if (w[2]) draw.line(x, y + CELL, x + CELL, y + CELL)
        .stroke({ color: '#5c6bc0', width: WALLW, linecap: 'round' });
      // Left wall
      if (w[3]) draw.line(x, y, x, y + CELL)
        .stroke({ color: '#5c6bc0', width: WALLW, linecap: 'round' });
    }
  }

  // --- Outer border (always visible) ---
  draw.rect(COLS * CELL, ROWS * CELL)
    .move(PAD, PAD)
    .fill('none')
    .stroke({ color: '#3949ab', width: WALLW + 1 })
    .radius(2);

  // --- Layer groups (draw order matters) ---
  trailG  = draw.group();   // trail sparkle circles
  hintG   = draw.group();   // solution path overlay
  decoG   = draw.group();   // decorations
  monsG   = draw.group();   // monsters
  heroG   = draw.group();   // hero (drawn last = on top)
}

// ══════════════════════════════════════════════
//  DRAW THE HERO  (cute round face)
// ══════════════════════════════════════════════

function createHero () {
  heroG.clear();
  const r = CELL * 0.36;

  // Body
  heroG.circle(r * 2).center(0, 0).fill('#42a5f5').stroke('#1e88e5', 2);

  // Highlight / shine
  heroG.circle(r * 0.4).center(-r * 0.3, -r * 0.35).fill('#bbdefb').opacity(0.7);

  // Eyes (white + black pupil)
  for (const side of [-1, 1]) {
    heroG.circle(r * 0.38).center(side * r * 0.3, -r * 0.12).fill('#fff');
    heroG.circle(r * 0.2).center(side * r * 0.3, -r * 0.12).fill('#1a237e');
    // Tiny white sparkle in the eye
    heroG.circle(r * 0.08)
      .center(side * r * 0.3 + r * 0.06, -r * 0.18)
      .fill('#fff').opacity(0.9);
  }

  // Rosy cheeks
  heroG.circle(r * 0.2).center(-r * 0.45, r * 0.18).fill('#f48fb1').opacity(0.45);
  heroG.circle(r * 0.2).center( r * 0.45, r * 0.18).fill('#f48fb1').opacity(0.45);

  // Smile
  heroG.path(`M ${-r*0.28} ${r*0.22} Q 0 ${r*0.58} ${r*0.28} ${r*0.22}`)
    .fill('none').stroke({ color: '#1a237e', width: 1.6, linecap: 'round' });

  // Position at start cell
  heroG.transform({ translateX: cx(0), translateY: cy(0) });

  // Gentle idle animation
  idleAnim(heroG);
}

// Small bobbing animation for a group
function idleAnim (g) {
  g.animate(800, 0, 'now').transform({ translateY: -2 })
   .animate(800).transform({ translateY: 2 })
   .loop();
}

// ══════════════════════════════════════════════
//  DRAW MONSTERS  (friendly blobs with silly faces)
// ══════════════════════════════════════════════

function createMonsters () {
  monsG.clear();
  monsR = [];
  monsC = [];

  for (let i = 0; i < NUM_MONSTERS; i++) {
    // Place monster away from start and goal
    let mr, mc;
    do {
      mr = Math.floor(Math.random() * ROWS);
      mc = Math.floor(Math.random() * COLS);
    } while (
      (mr < 2 && mc < 2) ||                                // too close to start
      (mr > ROWS - 3 && mc > COLS - 3) ||                  // too close to goal
      (i > 0 && mr === monsR[0] && mc === monsC[0])        // overlapping other monster
    );

    monsR.push(mr);
    monsC.push(mc);

    const r  = CELL * 0.36;
    const col = MCOLORS[i % MCOLORS.length];
    const g   = monsG.group();

    // Body (wobbly blob shape via an ellipse)
    g.ellipse(r * 2.1, r * 1.85).center(0, 0).fill(col)
      .stroke({ color: '#7b1fa2', width: 1.5 }).opacity(0.9);

    // Small "horn" bumps on top
    g.circle(r * 0.35).center(-r * 0.35, -r * 0.85).fill(col);
    g.circle(r * 0.35).center( r * 0.35, -r * 0.85).fill(col);

    // Eyes (googly)
    for (const side of [-1, 1]) {
      g.circle(r * 0.36).center(side * r * 0.28, -r * 0.1).fill('#fff');
      g.circle(r * 0.18).center(side * r * 0.28, -r * 0.06).fill('#212121');
    }

    // Silly tongue-out smile
    g.path(`M ${-r*0.22} ${r*0.25} Q 0 ${r*0.48} ${r*0.22} ${r*0.25}`)
      .fill('none').stroke({ color: '#4a148c', width: 1.5, linecap: 'round' });
    g.ellipse(r * 0.12, r * 0.2).center(0, r * 0.42).fill('#ef5350');

    // Position at monster cell
    g.transform({ translateX: cx(mc), translateY: cy(mr) });

    // Gentle bobbing animation (slightly offset for each monster)
    g.animate(700 + i * 150, 0, 'now').transform({ translateY: -2 })
     .animate(700 + i * 150).transform({ translateY: 2 })
     .loop();
  }
}

// ══════════════════════════════════════════════
//  TRAIL  — hero leaves little sparkle circles
// ══════════════════════════════════════════════

const MAX_TRAIL = 20;          // max trail dots visible

function addTrailDot (r, c) {
  const colours = ['#bbdefb','#90caf9','#64b5f6','#42a5f5','#e3f2fd','#b3e5fc'];
  const col = colours[Math.floor(Math.random() * colours.length)];
  const dot = trailG.circle(CELL * 0.16)
    .center(cx(c), cy(r))
    .fill(col)
    .opacity(0.7);

  trail.push(dot);

  // Remove oldest trail dots when we exceed the limit
  while (trail.length > MAX_TRAIL) {
    trail.shift().remove();
  }

  // Fade older dots
  trail.forEach((d, i) => {
    d.opacity(0.15 + (i / trail.length) * 0.55);
  });
}

// ══════════════════════════════════════════════
//  SOLUTION HINT  — draw / hide path overlay
// ══════════════════════════════════════════════

function drawHint () {
  hintG.clear();
  const pts = solution.map(([r, c]) => [cx(c), cy(r)]);

  // Thick line through the path
  if (pts.length > 1) {
    const d = pts.map((p, i) => (i === 0 ? 'M ' : 'L ') + p[0] + ' ' + p[1]).join(' ');
    hintG.path(d)
      .fill('none')
      .stroke({ color: '#ff6f00', width: CELL * 0.28, linecap: 'round', linejoin: 'round' })
      .opacity(0.35);

    // Dashed centre line for extra visibility
    hintG.path(d)
      .fill('none')
      .stroke({ color: '#ffc107', width: 2, dasharray: '4,4' })
      .opacity(0.65);
  }

  // Small arrows / dots at each path cell
  pts.forEach((p, i) => {
    if (i === 0 || i === pts.length - 1) return; // skip start & goal
    hintG.circle(CELL * 0.12).center(p[0], p[1]).fill('#ff8f00').opacity(0.5);
  });
}

function toggleHint () {
  hintVisible = !hintVisible;
  if (hintVisible) {
    drawHint();
    document.getElementById('hintBtn').textContent = '🙈 Hide Path';
  } else {
    hintG.clear();
    document.getElementById('hintBtn').textContent = '💡 Show Path';
  }
}

// ══════════════════════════════════════════════
//  HERO MOVEMENT  (arrow-key handler)
// ══════════════════════════════════════════════

function moveHero (dir) {
  if (!gameActive) return;
  const d = DIR[dir];

  // Check wall: if wall exists in that direction, block movement
  if (grid[heroR][heroC].walls[dir]) return;

  // Calculate new position
  const nr = heroR + d.dr;
  const nc = heroC + d.dc;
  if (!inBounds(nr, nc)) return;

  // Update state
  heroR = nr;
  heroC = nc;

  // Animate hero to new cell
  heroG.animate(120).transform({ translateX: cx(nc), translateY: cy(nr) });

  // Leave a trail sparkle
  addTrailDot(nr, nc);

  // Refresh solution hint if it's visible
  if (hintVisible) drawHint();

  // Check win condition (reached bottom-right)
  if (heroR === ROWS - 1 && heroC === COLS - 1) {
    gameActive = false;
    clearInterval(monsterTimer);
    celebrateWin();
  }
}

// ══════════════════════════════════════════════
//  MONSTER AI  (random walk through corridors)
// ══════════════════════════════════════════════

function moveMonsters () {
  for (let i = 0; i < NUM_MONSTERS; i++) {
    // Find open directions from monster's current cell
    const openDirs = [];
    for (let d = 0; d < 4; d++) {
      if (!grid[monsR[i]][monsC[i]].walls[d]) {
        const nr = monsR[i] + DIR[d].dr;
        const nc = monsC[i] + DIR[d].dc;
        if (inBounds(nr, nc)) openDirs.push(d);
      }
    }

    if (openDirs.length) {
      // Pick a random open direction
      const d = openDirs[Math.floor(Math.random() * openDirs.length)];
      monsR[i] += DIR[d].dr;
      monsC[i] += DIR[d].dc;

      // Animate monster movement
      const mg = monsG.children()[i];
      if (mg) mg.animate(250).transform({
        translateX: cx(monsC[i]),
        translateY: cy(monsR[i])
      });
    }
  }

  // After moving, check collision with hero
  checkMonsterCollision();
}

function checkMonsterCollision () {
  for (let i = 0; i < NUM_MONSTERS; i++) {
    if (monsR[i] === heroR && monsC[i] === heroC) {
      gameActive = false;
      clearInterval(monsterTimer);
      showCaught();
      return;
    }
  }
}

// ══════════════════════════════════════════════
//  WIN / LOSE SCREENS
// ══════════════════════════════════════════════

function celebrateWin () {
  // Sparkle burst from the hero
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const dist  = CELL * 2;
    const sx = cx(heroC), sy = cy(heroR);
    const colours = ['#ff5252','#ffab40','#69f0ae','#448aff','#e040fb','#ffd740'];
    const col = colours[i % colours.length];
    const sp = draw.circle(5).center(sx, sy).fill(col);
    sp.animate(600 + Math.random() * 300)
      .center(sx + Math.cos(angle) * dist, sy + Math.sin(angle) * dist)
      .opacity(0).size(1);
    setTimeout(() => { try { sp.remove(); } catch(e){} }, 1000);
  }

  // Show overlay message
  setTimeout(() => {
    const ov = document.getElementById('overlay');
    const ms = document.getElementById('overlayMsg');
    ms.textContent = '🎉 You Win! Great Job! 🎉';
    ov.classList.add('show');
    setTimeout(() => { ov.classList.remove('show'); }, 2500);
  }, 300);
}

function showCaught () {
  // Flash hero red
  heroG.children().forEach(ch => {
    try { ch.animate(150).fill('#ff1744'); } catch(e){}
  });

  setTimeout(() => {
    const ov = document.getElementById('overlay');
    const ms = document.getElementById('overlayMsg');
    ms.textContent = '👾 Oh no! The monster caught you! Try again!';
    ov.classList.add('show');
    // Auto-restart after a short pause
    setTimeout(() => {
      ov.classList.remove('show');
      resetGame();
    }, 2000);
  }, 400);
}

// ══════════════════════════════════════════════
//  GAME RESET / INIT
// ══════════════════════════════════════════════

function resetGame () {
  // Clean up old timer
  if (monsterTimer) clearInterval(monsterTimer);

  // Generate fresh maze & solve it
  generateMaze();
  solveMaze();

  // Reset state
  heroR = 0;
  heroC = 0;
  trail = [];
  gameActive = true;
  hintVisible = false;

  // Rebuild SVG
  buildBoard();
  createHero();
  createMonsters();

  // Clear any hint text
  document.getElementById('hintBtn').textContent = '💡 Show Path';
  hintG.clear();

  // Start monster movement timer (every 700 ms)
  monsterTimer = setInterval(moveMonsters, 700);
}

// ══════════════════════════════════════════════
//  KEYBOARD INPUT
// ══════════════════════════════════════════════

document.addEventListener('keydown', (e) => {
  const dir = KEY_DIR[e.key];
  if (dir !== undefined) {
    e.preventDefault();          // prevent page scrolling
    moveHero(dir);
  }
});

// ══════════════════════════════════════════════
//  START THE GAME ON LOAD
// ══════════════════════════════════════════════

window.addEventListener('load', resetGame);
</script>
</body>
</html>
