<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny Hop Maze 🌟</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.4/svg.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
        body { font-family: 'Fredoka', system_ui, sans-serif; }
        #game { filter: drop-shadow(0 30px 40px rgba(0,0,0,0.4)); }
        .title { font-family: 'Fredoka', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-pink-300 via-yellow-200 to-cyan-300 min-h-screen flex items-center justify-center overflow-hidden">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 px-4">
            <div class="flex items-center gap-4">
                <div class="text-6xl">🐰</div>
                <div>
                    <h1 class="title text-5xl font-bold text-purple-600 tracking-tighter">BUNNY HOP MAZE</h1>
                    <p class="text-purple-500 text-xl -mt-2">Find the golden carrot!</p>
                </div>
            </div>
            <div class="flex gap-6 text-2xl">
                <div onclick="newGame()" class="cursor-pointer bg-white hover:bg-yellow-100 px-8 py-3 rounded-3xl shadow flex items-center gap-3 font-bold text-purple-600">
                    <i class="fa-solid fa-rotate"></i> NEW MAZE
                </div>
                <div onclick="toggleSolution()" id="pathBtn"
                     class="cursor-pointer bg-white hover:bg-yellow-100 px-8 py-3 rounded-3xl shadow flex items-center gap-3 font-bold text-purple-600">
                    <span class="text-3xl">✨</span> MAGIC PATH
                </div>
            </div>
            <div class="text-right">
                <div class="text-purple-500 text-sm font-bold">SCORE</div>
                <div id="score" class="text-6xl font-bold text-purple-700 tabular-nums">0</div>
            </div>
        </div>

        <!-- Game Area -->
        <div class="flex gap-8">
            <!-- SVG Canvas -->
            <div id="gameContainer" class="bg-white rounded-3xl p-8 shadow-2xl">
                <svg id="game" width="620" height="620" class="rounded-2xl"></svg>
            </div>

            <!-- Side Panel -->
            <div class="w-72 bg-white rounded-3xl p-6 shadow-2xl flex flex-col">
                <div class="mb-8">
                    <div class="text-purple-500 font-bold text-sm mb-2">YOUR BUNNY 🐰</div>
                    <div class="flex items-center gap-4 bg-purple-100 rounded-2xl p-4">
                        <div class="text-6xl">🐰</div>
                        <div class="text-purple-600">
                            <div class="font-bold text-xl">Hop fast!</div>
                            <div class="text-sm">Use arrow keys</div>
                        </div>
                    </div>
                </div>

                <div class="flex-1">
                    <div class="text-purple-500 font-bold text-sm mb-3">SILLY BUGS 🐛</div>
                    <div id="monsterList" class="space-y-4"></div>
                </div>

                <div class="mt-auto pt-6 border-t">
                    <button onclick="newGame()" 
                            class="w-full py-5 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xl rounded-3xl shadow-lg hover:scale-105 transition">
                        NEW ADVENTURE
                    </button>
                    <div onclick="showHelp()" class="text-center text-purple-400 hover:text-purple-600 mt-6 cursor-pointer text-sm flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-question"></i> HOW TO PLAY
                    </div>
                </div>
            </div>
        </div>

        <!-- Win Screen -->
        <div id="winScreen" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
            <div class="bg-white rounded-3xl p-12 text-center max-w-md shadow-2xl">
                <div class="text-8xl mb-6">🎉</div>
                <div class="title text-5xl font-bold text-purple-600 mb-2">YOU FOUND IT!</div>
                <div class="text-2xl text-purple-500 mb-8">The golden carrot is yours!</div>
                <div id="finalScore" class="text-6xl font-bold text-yellow-500 mb-10"></div>
                <button onclick="newGame();document.getElementById('winScreen').classList.add('hidden')" 
                        class="px-16 py-6 bg-yellow-400 hover:bg-yellow-300 text-purple-700 font-bold text-2xl rounded-3xl">
                    PLAY AGAIN
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================================================
        // BUNNY HOP MAZE - Kindergarten Edition
        // Fully self-contained • Uses SVG.js • Random 20×20 maze
        // ================================================

        const ROWS = 20;
        const COLS = 20;
        const CELL = 28;                    // pixel size per cell
        const OFFSET = 30;                  // border padding

        let svg;
        let maze = [];
        let hero = { x: 0, y: 0, group: null };
        let monsters = [];
        let trail = [];
        let solutionPath = [];
        let solutionLine = null;
        let showingSolution = false;
        let score = 0;
        let gameRunning = true;
        let keysPressed = {};

        // Directions
        const DIRECTIONS = [
            { name: 'top',    dx: 0,  dy: -1 },
            { name: 'right',  dx: 1,  dy: 0  },
            { name: 'bottom', dx: 0,  dy: 1  },
            { name: 'left',   dx: -1, dy: 0  }
        ];

        // Tailwind script already loaded
        function initTailwind() { /* already done via CDN */ }

        // Generate perfect solvable maze using Recursive Backtracker
        function generateMaze() {
            maze = Array.from({ length: ROWS }, () => 
                Array.from({ length: COLS }, () => ({
                    walls: { top: true, right: true, bottom: true, left: true },
                    visited: false
                }))
            );

            let stack = [];
            let cx = 0, cy = 0;
            maze[cy][cx].visited = true;
            stack.push({x: cx, y: cy});

            while (stack.length > 0) {
                let current = stack[stack.length - 1];
                let neighbors = getUnvisitedNeighbors(current.x, current.y);

                if (neighbors.length > 0) {
                    let chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
                    removeWall(current.x, current.y, chosen.dir);
                    let nx = current.x + chosen.dx;
                    let ny = current.y + chosen.dy;
                    maze[ny][nx].visited = true;
                    stack.push({x: nx, y: ny});
                } else {
                    stack.pop();
                }
            }
        }

        function getUnvisitedNeighbors(x, y) {
            let n = [];
            for (let d of DIRECTIONS) {
                let nx = x + d.dx;
                let ny = y + d.dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS && !maze[ny][nx].visited) {
                    n.push({ dir: d, dx: d.dx, dy: d.dy });
                }
            }
            return n;
        }

        function removeWall(x, y, dir) {
            maze[y][x].walls[dir.name] = false;
            let opp = { top:'bottom', bottom:'top', left:'right', right:'left' }[dir.name];
            let nx = x + dir.dx;
            let ny = y + dir.dy;
            maze[ny][nx].walls[opp] = false;
        }

        // Find solution path with BFS
        function findSolutionPath() {
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            let queue = [{x:0, y:0, path: [{x:0,y:0}]}];
            visited[0][0] = true;

            while (queue.length > 0) {
                let cur = queue.shift();
                if (cur.x === COLS-1 && cur.y === ROWS-1) return cur.path;

                for (let d of DIRECTIONS) {
                    let nx = cur.x + d.dx;
                    let ny = cur.y + d.dy;
                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS || visited[ny][nx]) continue;

                    // Check wall
                    let wallName = d.name;
                    if (maze[cur.y][cur.x].walls[wallName]) continue;

                    visited[ny][nx] = true;
                    queue.push({
                        x: nx, y: ny,
                        path: [...cur.path, {x:nx, y:ny}]
                    });
                }
            }
            return [];
        }

        // Draw the entire maze and elements
        function drawEverything() {
            svg.clear();

            // Background grass
            svg.rect(COLS*CELL + OFFSET*2, ROWS*CELL + OFFSET*2)
               .move(0, 0)
               .fill('#86efac')
               .radius(30);

            // Walls
            const wallW = 9;
            const wallCol = '#166534';

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    const px = OFFSET + x * CELL;
                    const py = OFFSET + y * CELL;
                    const cell = maze[y][x];

                    // Top wall
                    if (cell.walls.top) {
                        svg.line(px, py, px + CELL, py).stroke({color: wallCol, width: wallW, linecap: 'round'});
                    }
                    // Left wall
                    if (cell.walls.left) {
                        svg.line(px, py, px, py + CELL).stroke({color: wallCol, width: wallW, linecap: 'round'});
                    }
                    // Bottom wall (only last row needs extra)
                    if (y === ROWS-1 && cell.walls.bottom) {
                        svg.line(px, py + CELL, px + CELL, py + CELL).stroke({color: wallCol, width: wallW, linecap: 'round'});
                    }
                    // Right wall
                    if (x === COLS-1 && cell.walls.right) {
                        svg.line(px + CELL, py, px + CELL, py + CELL).stroke({color: wallCol, width: wallW, linecap: 'round'});
                    }
                }
            }

            // Start and Goal decorations
            // Start
            svg.circle(22).center(OFFSET + CELL/2, OFFSET + CELL/2).fill('#eab308');
            svg.text('🏠').center(OFFSET + CELL/2, OFFSET + CELL/2).font({size: 22});

            // Goal
            svg.rect(32, 32).center(OFFSET + (COLS-1)*CELL + CELL/2, OFFSET + (ROWS-1)*CELL + CELL/2)
               .fill('#eab308').radius(8);
            svg.text('🥕').center(OFFSET + (COLS-1)*CELL + CELL/2, OFFSET + (ROWS-1)*CELL + CELL/2).font({size: 26});

            // Draw trail
            trail.forEach((t, i) => {
                let alpha = 0.9 - i * 0.05;
                svg.circle(9).center(t.px, t.py).fill(`rgba(251,191,36,${alpha})`);
            });

            // Draw solution path if active
            if (showingSolution && solutionPath.length > 0) {
                let points = solutionPath.map(p => {
                    return `${OFFSET + p.x*CELL + CELL/2},${OFFSET + p.y*CELL + CELL/2}`;
                }).join(' ');
                solutionLine = svg.polyline(points)
                    .fill('none')
                    .stroke({ color: '#a5f3fc', width: 14, linecap: 'round', linejoin: 'round' })
                    .attr('stroke-dasharray', '12 18');
                // Marching animation
                solutionLine.animate(1800).attr({ 'stroke-dashoffset': -60 }).loop();
            }

            // Spawn hero
            createHero();

            // Spawn monsters
            createMonsters();
        }

        function createHero() {
            if (hero.group) hero.group.remove();
            hero.group = svg.group();
            hero.group.text('🐰')
                .font({ size: 26, family: 'sans-serif' })
                .center(OFFSET + hero.x * CELL + CELL/2, OFFSET + hero.y * CELL + CELL/2);
            // Bob animation
            hero.group.animate(800).scale(1.15).loop().ease('<>');
        }

        function createMonsters() {
            monsters = [];
            const monsterListHTML = [];
            for (let i = 0; i < 4; i++) {
                let mx = Math.floor(Math.random() * (COLS - 4)) + 2;
                let my = Math.floor(Math.random() * (ROWS - 4)) + 2;
                // Avoid start and goal
                while ((mx < 3 && my < 3) || (mx > COLS-4 && my > ROWS-4)) {
                    mx = Math.floor(Math.random() * (COLS - 4)) + 2;
                    my = Math.floor(Math.random() * (ROWS - 4)) + 2;
                }

                let mGroup = svg.group();
                mGroup.text('🐛')
                    .font({ size: 24 })
                    .center(OFFSET + mx * CELL + CELL/2, OFFSET + my * CELL + CELL/2);
                monsters.push({ x: mx, y: my, group: mGroup });

                monsterListHTML.push(`
                    <div class="flex items-center gap-3 text-lg">
                        <span>🐛</span>
                        <span class="font-medium text-purple-600">Silly Bug #${i+1}</span>
                    </div>
                `);
            }
            document.getElementById('monsterList').innerHTML = monsterListHTML.join('');
        }

        function moveHero(dx, dy) {
            if (!gameRunning) return;
            let nx = hero.x + dx;
            let ny = hero.y + dy;
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) return;

            // Check wall
            let wallBlocked = false;
            if (dx === 1 && maze[hero.y][hero.x].walls.right) wallBlocked = true;
            if (dx === -1 && maze[hero.y][hero.x].walls.left) wallBlocked = true;
            if (dy === 1 && maze[hero.y][hero.x].walls.bottom) wallBlocked = true;
            if (dy === -1 && maze[hero.y][hero.x].walls.top) wallBlocked = true;

            if (wallBlocked) return;

            // Move
            hero.x = nx;
            hero.y = ny;

            // Add trail
            let centerX = OFFSET + hero.x * CELL + CELL/2;
            let centerY = OFFSET + hero.y * CELL + CELL/2;
            trail.push({ px: centerX, py: centerY });
            if (trail.length > 18) trail.shift();

            // Redraw trail + hero
            drawEverything();

            // Check win
            if (hero.x === COLS-1 && hero.y === ROWS-1) {
                winGame();
            }

            // Check monster collision
            checkCollisions();
        }

        function checkCollisions() {
            for (let m of monsters) {
                if (m.x === hero.x && m.y === hero.y) {
                    gameRunning = false;
                    setTimeout(() => {
                        alert("Oh no! A silly bug caught you! 🐛\n\nLet's try again!");
                        newGame();
                    }, 100);
                    return;
                }
            }
        }

        function moveMonsters() {
            if (!gameRunning) return;
            monsters.forEach(m => {
                let possible = [];
                for (let d of DIRECTIONS) {
                    let nx = m.x + d.dx;
                    let ny = m.y + d.dy;
                    if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;

                    let blocked = false;
                    if (d.dx === 1 && maze[m.y][m.x].walls.right) blocked = true;
                    if (d.dx === -1 && maze[m.y][m.x].walls.left) blocked = true;
                    if (d.dy === 1 && maze[m.y][m.x].walls.bottom) blocked = true;
                    if (d.dy === -1 && maze[m.y][m.x].walls.top) blocked = true;

                    if (!blocked) possible.push({nx, ny});
                }
                if (possible.length > 0) {
                    let chosen = possible[Math.floor(Math.random() * possible.length)];
                    m.x = chosen.nx;
                    m.y = chosen.ny;
                    m.group.center(OFFSET + m.x * CELL + CELL/2, OFFSET + m.y * CELL + CELL/2);
                }
            });
            checkCollisions();
        }

        function toggleSolution() {
            showingSolution = !showingSolution;
            drawEverything();
        }

        function winGame() {
            gameRunning = false;
            score += 100;
            document.getElementById('score').textContent = score;
            document.getElementById('winScreen').classList.remove('hidden');
            document.getElementById('finalScore').innerHTML = `Score: <span class="text-yellow-500">${score}</span>`;
        }

        function newGame() {
            gameRunning = true;
            score = 0;
            document.getElementById('score').textContent = score;
            trail = [];
            showingSolution = false;
            document.getElementById('winScreen').classList.add('hidden');

            generateMaze();
            solutionPath = findSolutionPath();
            hero.x = 0;
            hero.y = 0;
            drawEverything();
        }

        function showHelp() {
            alert("🐰 Bunny Hop Maze 🌟\n\n" +
                  "• Use arrow keys to hop\n" +
                  "• Avoid the silly bugs 🐛\n" +
                  "• Reach the golden carrot 🥕\n" +
                  "• Click MAGIC PATH to see the way\n" +
                  "• Every new game is different!\n\n" +
                  "Have fun and be kind to bugs! 💖");
        }

        // Keyboard controls
        function handleKey(e) {
            if (!gameRunning) return;
            switch(e.key) {
                case 'ArrowUp':    moveHero(0, -1); break;
                case 'ArrowDown':  moveHero(0,  1); break;
                case 'ArrowLeft':  moveHero(-1, 0); break;
                case 'ArrowRight': moveHero( 1, 0); break;
            }
        }

        // Game loop for monsters
        function gameLoop() {
            moveMonsters();
            setTimeout(gameLoop, 920); // slow friendly movement for kids
        }

        // Initialize everything
        function init() {
            svg = SVG().addTo('#game').size(620, 620);

            // Start the adventure
            newGame();

            // Keyboard
            window.addEventListener('keydown', handleKey);

            // Monster movement loop
            setTimeout(gameLoop, 1200);

            // Welcome message
            setTimeout(() => {
                alert("Welcome to Bunny Hop Maze! 🐰\n\nHelp the bunny reach the carrot!\nUse arrow keys to move.\nWatch out for silly bugs! 🐛");
            }, 800);
        }

        window.onload = init;
    </script>
</body>
</html>
