<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌈 Maze Adventure for Kids!</title>
  <!-- Include svg.js library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.2.4/dist/svg.min.js"></script>
  <style>
    /* ===== Page Styling ===== */
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', sans-serif;
      overflow: hidden;
    }

    /* ===== Game Container ===== */
    #game-container {
      background: #fff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      text-align: center;
      position: relative;
    }

    /* ===== Title ===== */
    h1 {
      color: #ff6b6b;
      font-size: 2.2rem;
      margin: 0 0 8px 0;
      text-shadow: 2px 2px 0 #ffd93d;
    }

    .subtitle {
      color: #4ecdc4;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* ===== SVG Canvas ===== */
    #maze-svg {
      border-radius: 12px;
      background: #f0f8ff;
      display: block;
      margin: 0 auto;
    }

    /* ===== Controls ===== */
    .controls {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.show-solution {
      background: linear-gradient(135deg, #4ecdc4, #44bd32);
    }

    .btn.new-maze {
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
    }

    /* ===== Message Overlay ===== */
    #message-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    #message-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #message-overlay h2 {
      font-size: 2.5rem;
      color: #ff6b6b;
      margin-bottom: 10px;
    }

    #message-overlay p {
      font-size: 1.2rem;
      color: #555;
      margin-bottom: 20px;
    }

    /* ===== Instructions ===== */
    .instructions {
      color: #666;
      font-size: 0.85rem;
      margin-top: 8px;
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      #game-container { padding: 12px; }
      h1 { font-size: 1.6rem; }
      .btn { padding: 8px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <!-- ===== Game Container ===== -->
  <div id="game-container">
    <h1>🌈 Maze Adventure! 🌈</h1>
    <div class="subtitle">Help the hero reach the star! ⭐</div>
    
    <!-- SVG canvas where the maze is drawn -->
    <svg id="maze-svg" width="560" height="560"></svg>
    
    <!-- Control buttons -->
    <div class="controls">
      <button class="btn new-maze" onclick="initGame()">🎲 New Maze</button>
      <button class="btn show-solution" onclick="showSolution()">✨ Show Solution</button>
    </div>
    
    <div class="instructions">
      Use ⬆️⬇️⬅️➡️ Arrow Keys to move • Avoid the monsters! 👾
    </div>
    
    <!-- Message overlay for win/lose -->
    <div id="message-overlay">
      <h2 id="msg-title"></h2>
      <p id="msg-text"></p>
      <button class="btn" onclick="closeMessage(); initGame();">🔄 Play Again</button>
    </div>
  </div>

  <script>
    /* ========================================================
     * 🌈 MAZE ADVENTURE FOR KIDS 🌈
     * 
     * A complete interactive maze game built with svg.js
     * Features:
     * - Random 20x20 maze generation (DFS algorithm)
     * - Cute animated hero with arrow key controls
     * - Friendly monsters that patrol the maze
     * - Trail of circles behind the hero
     * - Solution path finder
     * - Colorful, child-friendly design
     * ======================================================== */

    // ===== Configuration Constants =====
    const COLS = 20;           // Number of columns in the maze
    const ROWS = 20;           // Number of rows in the maze
    const CELL_SIZE = 28;      // Size of each cell in pixels
    const WALL_WIDTH = 2;      // Wall thickness
    const PADDING = 2;         // Padding around cells for visual spacing

    // Game state variables
    let maze = [];             // 2D array storing maze cell data
    let hero = { x: 0, y: 0 }; // Hero's current position
    let monsters = [];         // Array of monster objects
    let trail = [];            // Array of trail circle positions
    let solutionPath = [];     // Array of cells forming the solution path
    let isMoving = false;      // Prevents overlapping key presses
    let gameActive = false;    // Whether the game is currently running
    let heroGroup;             // SVG group for the hero
    let monsterGroups = [];    // SVG groups for monsters
    let trailGroup;            // SVG group for trail circles
    let solutionGroup;         // SVG group for solution path
    let finishStar;            // SVG group for the finish star

    // SVG canvas reference
    let svg;

    /**
     * Initialize the entire game
     * Called on page load and when "New Maze" is clicked
     */
    function initGame() {
      // Close any open message
      closeMessage();
      
      // Create or get SVG canvas
      svg = SVG().addTo('#maze-svg').viewbox(0, 0, COLS * CELL_SIZE + 4, ROWS * CELL_SIZE + 4);
      svg.clear();

      // Draw background
      svg.rect(COLS * CELL_SIZE + 4, ROWS * CELL_SIZE + 4)
        .fill('#e8f4f8')
        .rx(10);

      // Generate a new random maze
      generateMaze();

      // Draw the maze walls
      drawMaze();

      // Draw the finish star
      drawFinishStar();

      // Place and draw the hero
      hero = { x: 0, y: 0 };
      drawHero();

      // Create trail group
      trailGroup = svg.group().attr('class', 'trail');
      trail = [];

      // Create monsters
      monsters = [];
      monsterGroups = [];
      createMonsters(5); // 5 friendly monsters

      // Create solution group
      solutionGroup = svg.group().attr('class', 'solution');
      solutionPath = [];

      // Set game as active
      gameActive = true;
      isMoving = false;
    }

    /**
     * Generate a random perfect maze using Depth-First Search (DFS)
     * Algorithm:
     * 1. Start with all walls intact
     * 2. Use a stack-based DFS to carve passages
     * 3. Randomly shuffle neighbors for variety
     * 4. Every cell is reachable (perfect maze)
     */
    function generateMaze() {
      maze = [];
      
      // Initialize maze with all walls present
      for (let y = 0; y < ROWS; y++) {
        maze[y] = [];
        for (let x = 0; x < COLS; x++) {
          maze[y][x] = {
            x: x,
            y: y,
            walls: { top: true, right: true, bottom: true, left: true },
            visited: false
          };
        }
      }

      // DFS stack for maze generation
      const stack = [];
      let current = maze[0][0];
      current.visited = true;
      stack.push(current);

      while (stack.length > 0) {
        // Get unvisited neighbors
        const neighbors = getUnvisitedNeighbors(current);
        
        if (neighbors.length > 0) {
          // Choose a random unvisited neighbor
          const next = neighbors[Math.floor(Math.random() * neighbors.length)];
          
          // Remove walls between current and next
          removeWalls(current, next);
          
          // Mark next as visited and push to stack
          next.visited = true;
          stack.push(current);
          current = next;
        } else {
          // Backtrack
          current = stack.pop();
        }
      }

      // Mark all cells as unvisited for solution finding later
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          maze[y][x].visited = false;
        }
      }
    }

    /**
     * Get unvisited neighbors of a cell
     * @param {Object} cell - The cell to check
     * @returns {Array} Array of unvisited neighbor cells
     */
    function getUnvisitedNeighbors(cell) {
      const neighbors = [];
      const { x, y } = cell;

      // Check all four directions
      if (y > 0 && !maze[y - 1][x].visited) neighbors.push(maze[y - 1][x]); // Top
      if (x < COLS - 1 && !maze[y][x + 1].visited) neighbors.push(maze[y][x + 1]); // Right
      if (y < ROWS - 1 && !maze[y + 1][x].visited) neighbors.push(maze[y + 1][x]); // Bottom
      if (x > 0 && !maze[y][x - 1].visited) neighbors.push(maze[y][x - 1]); // Left

      return neighbors;
    }

    /**
     * Remove walls between two adjacent cells
     * @param {Object} cell1 - First cell
     * @param {Object} cell2 - Second cell
     */
    function removeWalls(cell1, cell2) {
      const dx = cell1.x - cell2.x;
      const dy = cell1.y - cell2.y;

      if (dx === 1) { // cell1 is to the right of cell2
        cell1.walls.left = false;
        cell2.walls.right = false;
      } else if (dx === -1) { // cell1 is to the left of cell2
        cell1.walls.right = false;
        cell2.walls.left = false;
      }
      
      if (dy === 1) { // cell1 is below cell2
        cell1.walls.top = false;
        cell2.walls.bottom = false;
      } else if (dy === -1) { // cell1 is above cell2
        cell1.walls.bottom = false;
        cell2.walls.top = false;
      }
    }

    /**
     * Draw the maze walls on the SVG canvas
     * Each wall segment is drawn as a colored rectangle
     */
    function drawMaze() {
      const wallColor = '#5d4037';
      const wallHighlight = '#8d6e63';

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = maze[y][x];
          const px = x * CELL_SIZE + PADDING + 2;
          const py = y * CELL_SIZE + PADDING + 2;

          // Draw floor (light colored background for each cell)
          svg.rect(CELL_SIZE - PADDING * 2, CELL_SIZE - PADDING * 2)
            .x(px).y(py)
            .fill('#f8fffe')
            .rx(3);

          // Draw walls based on which sides have walls
          if (cell.walls.top) {
            svg.rect(CELL_SIZE, WALL_WIDTH)
              .x(px).y(py)
              .fill(wallColor)
              .rx(1);
          }
          if (cell.walls.right) {
            svg.rect(WALL_WIDTH, CELL_SIZE)
              .x(px + CELL_SIZE - PADDING * 2).y(py)
              .fill(wallColor)
              .rx(1);
          }
          if (cell.walls.bottom) {
            svg.rect(CELL_SIZE, WALL_WIDTH)
              .x(px).y(py + CELL_SIZE - PADDING * 2)
              .fill(wallColor)
              .rx(1);
          }
          if (cell.walls.left) {
            svg.rect(WALL_WIDTH, CELL_SIZE)
              .x(px).y(py)
              .fill(wallColor)
              .rx(1);
          }
        }
      }

      // Draw outer border
      svg.rect(COLS * CELL_SIZE + 4, ROWS * CELL_SIZE + 4)
        .fill('none')
        .stroke({ color: wallColor, width: WALL_WIDTH * 2 })
        .rx(10);
    }

    /**
     * Draw the finish star at the bottom-right of the maze
     */
    function drawFinishStar() {
      const cx = (COLS - 1) * CELL_SIZE + CELL_SIZE / 2 + 2;
      const cy = (ROWS - 1) * CELL_SIZE + CELL_SIZE / 2 + 2;
      
      finishStar = svg.group();
      
      // Star shape
      const points = [];
      for (let i = 0; i < 10; i++) {
        const radius = i % 2 === 0 ? 10 : 5;
        const angle = (i * 36 - 90) * Math.PI / 180;
        points.push(`${cx + radius * Math.cos(angle)},${cy + radius * Math.sin(angle)}`);
      }
      
      finishStar.polygon(points.join(' '))
        .fill('#ffd93d')
        .stroke({ color: '#f39c12', width: 2 });
      
      // Add a subtle pulsing animation
      finishStar.animate(1000).attr({ transform: 'scale(1.1)' }).loop(true, true);
      
      finishStar.move(cx - 10, cy - 10);
    }

    /**
     * Draw the cute animated hero at the starting position
     * The hero is composed of SVG shapes: circle body, eyes, smile
     */
    function drawHero() {
      const cx = hero.x * CELL_SIZE + CELL_SIZE / 2 + 2;
      const cy = hero.y * CELL_SIZE + CELL_SIZE / 2 + 2;
      
      heroGroup = svg.group();
      
      // Hero body (blue circle)
      heroGroup.circle(18).cx(cx).cy(cy).fill('#3498db').stroke({ color: '#2980b9', width: 1.5 });
      
      // Hero eyes (white circles with black pupils)
      heroGroup.circle(4).cx(cx - 3.5).cy(cy - 2).fill('#fff');
      heroGroup.circle(4).cx(cx + 3.5).cy(cy - 2).fill('#fff');
      heroGroup.circle(2).cx(cx - 3).cy(cy - 2).fill('#2c3e50');
      heroGroup.circle(2).cx(cx + 4).cy(cy - 2).fill('#2c3e50');
      
      // Hero smile (curved path)
      heroGroup.path(`M ${cx - 4} ${cy + 3} Q ${cx} ${cy + 8} ${cx + 4} ${cy + 3}`)
        .fill('none')
        .stroke({ color: '#fff', width: 1.5, linecap: 'round' });
      
      // Add a gentle bounce animation to the hero
      animateHero();
    }

    /**
     * Add a gentle bounce animation to the hero
     */
    function animateHero() {
      if (!heroGroup) return;
      heroGroup.animate(800).attr({ transform: 'translate(0, -2)' }).loop(true, true);
    }

    /**
     * Create friendly-looking monsters at random positions in the maze
     * @param {number} count - Number of monsters to create
     */
    function createMonsters(count) {
      const colors = ['#e74c3c', '#9b59b6', '#e67e22', '#1abc9c', '#f39c12'];
      const positions = [];
      
      // Find valid positions for monsters (not at start or finish)
      for (let i = 0; i < count; i++) {
        let x, y;
        let attempts = 0;
        do {
          x = Math.floor(Math.random() * COLS);
          y = Math.floor(Math.random() * ROWS);
          attempts++;
        } while (
          (x === 0 && y === 0) || // Not at start
          (x === COLS - 1 && y === ROWS - 1) || // Not at finish
          positions.some(p => p.x === x && p.y === y) || // Not overlapping
          Math.abs(x - hero.x) + Math.abs(y - hero.y) < 5 && // Not too close to hero
          attempts < 100
        );
        
        positions.push({ x, y });
      }
      
      // Draw each monster
      positions.forEach((pos, i) => {
        const cx = pos.x * CELL_SIZE + CELL_SIZE / 2 + 2;
        const cy = pos.y * CELL_SIZE + CELL_SIZE / 2 + 2;
        const color = colors[i % colors.length];
        
        const group = svg.group();
        
        // Monster body (round, friendly shape)
        group.circle(16).cx(cx).cy(cy).fill(color).stroke({ color: 'rgba(0,0,0,0.1)', width: 1 });
        
        // Monster eyes (big, friendly)
        group.circle(4).cx(cx - 4).cy(cy - 2).fill('#fff');
        group.circle(4).cx(cx + 4).cy(cy - 2).fill('#fff');
        group.circle(2).cx(cx - 3.5).cy(cy - 2).fill('#2c3e50');
        group.circle(2).cx(cx + 4.5).cy(cy - 2).fill('#2c3e50');
        
        // Monster smile
        group.path(`M ${cx - 3} ${cy + 3} Q ${cx} ${cy + 6} ${cx + 3} ${cy + 3}`)
          .fill('none')
          .stroke({ color: '#fff', width: 1.5, linecap: 'round' });
        
        // Little horns (to make it look like a friendly monster)
        group.polygon(`${cx - 5},${cy - 7} ${cx - 2},${cy - 11} ${cx - 1},${cy - 7}`).fill(color);
        group.polygon(`${cx + 1},${cy - 7} ${cx + 2},${cy - 11} ${cx + 5},${cy - 7}`).fill(color);
        
        // Store monster data
        monsters.push({
          x: pos.x,
          y: pos.y,
          group: group,
          color: color,
          moveTimer: 0
        });
        
        monsterGroups.push(group);
        
        // Start monster movement
        moveMonster(i);
      });
    }

    /**
     * Move a single monster randomly through the maze
     * Monsters move slower than the hero for fairness
     * @param {number} index - Index of the monster in the monsters array
     */
    function moveMonster(index) {
      if (!gameActive) return;
      
      const monster = monsters[index];
      const delay = 1500 + Math.random() * 1000; // 1.5-2.5 seconds between moves
      
      setTimeout(() => {
        if (!gameActive) return;
        
        // Get valid moves (no walls)
        const validMoves = getValidMoves(monster.x, monster.y);
        
        if (validMoves.length > 0) {
          // Choose a random valid move
          const move = validMoves[Math.floor(Math.random() * validMoves.length)];
          
          // Animate monster movement
          const targetX = move.x * CELL_SIZE + CELL_SIZE / 2 + 2;
          const targetY = move.y * CELL_SIZE + CELL_SIZE / 2 + 2;
          
          monster.group.animate(400).attr({ x: targetX - monster.group.bbox().width / 2, y: targetY - monster.group.bbox().height / 2 });
          
          // Update position after animation
          setTimeout(() => {
            monster.x = move.x;
            monster.y = move.y;
            
            // Check if monster caught the hero
            if (monster.x === hero.x && monster.y === hero.y) {
              gameOver(false);
            }
            
            // Continue moving
            moveMonster(index);
          }, 400);
        } else {
          // No valid moves, try again
          moveMonster(index);
        }
      }, delay);
    }

    /**
     * Get all valid moves from a cell (cells without walls)
     * @param {number} x - Current X position
     * @param {number} y - Current Y position
     * @returns {Array} Array of {x, y} objects for valid moves
     */
    function getValidMoves(x, y) {
      const moves = [];
      const cell = maze[y][x];
      
      if (!cell.walls.top && y > 0) moves.push({ x, y: y - 1 });
      if (!cell.walls.right && x < COLS - 1) moves.push({ x: x + 1, y });
      if (!cell.walls.bottom && y < ROWS - 1) moves.push({ x, y: y + 1 });
      if (!cell.walls.left && x > 0) moves.push({ x: x - 1, y });
      
      return moves;
    }

    /**
     * Handle keyboard input for hero movement
     * Prevents movement through walls and handles win/lose conditions
     */
    document.addEventListener('keydown', (e) => {
      if (!gameActive || isMoving) return;
      
      let dx = 0, dy = 0;
      
      // Map arrow keys to directions
      switch (e.key) {
        case 'ArrowUp': dy = -1; break;
        case 'ArrowDown': dy = 1; break;
        case 'ArrowLeft': dx = -1; break;
        case 'ArrowRight': dx = 1; break;
        default: return; // Ignore other keys
      }
      
      e.preventDefault();
      
      const newX = hero.x + dx;
      const newY = hero.y + dy;
      
      // Check boundaries
      if (newX < 0 || newX >= COLS || newY < 0 || newY >= ROWS) return;
      
      // Check for walls
      const cell = maze[hero.y][hero.x];
      if (dx === 1 && cell.walls.right) return;
      if (dx === -1 && cell.walls.left) return;
      if (dy === 1 && cell.walls.bottom) return;
      if (dy === -1 && cell.walls.top) return;
      
      // Move the hero
      moveHero(newX, newY);
    });

    /**
     * Move the hero to a new position with animation
     * @param {number} newX - New X position
     * @param {number} newY - New Y position
     */
    function moveHero(newX, newY) {
      isMoving = true;
      
      // Add to trail
      addTrailPoint(hero.x, hero.y);
      
      // Update hero position
      hero.x = newX;
      hero.y = newY;
      
      // Calculate target pixel position
      const targetX = hero.x * CELL_SIZE + CELL_SIZE / 2 + 2;
      const targetY = hero.y * CELL_SIZE + CELL_SIZE / 2 + 2;
      
      // Animate hero movement
      heroGroup.animate(200).attr({ x: targetX - heroGroup.bbox().width / 2, y: targetY - heroGroup.bbox().height / 2 }).after(() => {
        isMoving = false;
        
        // Check for monster collision
        for (const monster of monsters) {
          if (monster.x === hero.x && monster.y === hero.y) {
            gameOver(false);
            return;
          }
        }
        
        // Check for win (reached finish)
        if (hero.x === COLS - 1 && hero.y === ROWS - 1) {
          gameOver(true);
        }
      });
    }

    /**
     * Add a trail point at the hero's current position
     * Trail points are small circles that fade slightly
     * @param {number} x - X position
     * @param {number} y - Y position
     */
    function addTrailPoint(x, y) {
      const cx = x * CELL_SIZE + CELL_SIZE / 2 + 2;
      const cy = y * CELL_SIZE + CELL_SIZE / 2 + 2;
      
      // Create trail circle
      const trailCircle = trailGroup.circle(6)
        .cx(cx).cy(cy)
        .fill('#3498db')
        .stroke({ color: '#2980b9', width: 1 })
        .opacity(0.7);
      
      // Animate trail circle appearance
      trailCircle.animate(200).attr({ r: 4 });
      
      trail.push({ x, y, element: trailCircle });
    }

    /**
     * Find the solution path using BFS (Breadth-First Search)
     * Guarantees finding the shortest path in an unweighted maze
     * @returns {Array} Array of {x, y} objects forming the path
     */
    function findSolution() {
      const start = { x: 0, y: 0 };
      const end = { x: COLS - 1, y: ROWS - 1 };
      
      // BFS queue and visited set
      const queue = [{ x: start.x, y: start.y, path: [start] }];
      const visited = new Set();
      visited.add(`${start.x},${start.y}`);
      
      while (queue.length > 0) {
        const current = queue.shift();
        
        // Check if we reached the end
        if (current.x === end.x && current.y === end.y) {
          return current.path;
        }
        
        // Get valid moves
        const moves = getValidMoves(current.x, current.y);
        
        for (const move of moves) {
          const key = `${move.x},${move.y}`;
          if (!visited.has(key)) {
            visited.add(key);
            queue.push({
              x: move.x,
              y: move.y,
              path: [...current.path, move]
            });
          }
        }
      }
      
      return []; // Should never reach here for a perfect maze
    }

    /**
     * Show the solution path on the maze
     * Highlights the path with glowing circles
     */
    function showSolution() {
      // Clear previous solution
      solutionGroup.clear();
      
      // Find solution path
      solutionPath = findSolution();
      
      // Draw path with colored circles
      solutionPath.forEach((point, i) => {
        const cx = point.x * CELL_SIZE + CELL_SIZE / 2 + 2;
        const cy = point.y * CELL_SIZE + CELL_SIZE / 2 + 2;
        
        // Create path circle
        const pathCircle = solutionGroup.circle(8)
          .cx(cx).cy(cy)
          .fill('#ff6b6b')
          .stroke({ color: '#ee5a24', width: 2 })
          .opacity(0)
          .attr('data-index', i);
        
        // Animate appearance with delay
        setTimeout(() => {
          pathCircle.animate(300).attr({ opacity: 0.9, r: 10 });
        }, i * 150);
      });
      
      // Draw connecting lines between path points
      for (let i = 0; i < solutionPath.length - 1; i++) {
        const p1 = solutionPath[i];
        const p2 = solutionPath[i + 1];
        
        const x1 = p1.x * CELL_SIZE + CELL_SIZE / 2 + 2;
        const y1 = p1.y * CELL_SIZE + CELL_SIZE / 2 + 2;
        const x2 = p2.x * CELL_SIZE + CELL_SIZE / 2 + 2;
        const y2 = p2.y * CELL_SIZE + CELL_SIZE / 2 + 2;
        
        const line = solutionGroup.line(x1, y1, x2, y2)
          .stroke({ color: '#ff6b6b', width: 4, opacity: 0, linecap: 'round' });
        
        setTimeout(() => {
          line.animate(300).attr({ opacity: 0.8 });
        }, i * 150);
      }
    }

    /**
     * Handle game over (win or lose)
     * @param {boolean} won - Whether the player won
     */
    function gameOver(won) {
      gameActive = false;
      
      if (won) {
        // Victory!
        showMessage('🎉 You Won! 🎉', 'Amazing! You reached the star! Try a new maze?');
        
        // Victory animation
        if (heroGroup) {
          heroGroup.animate(500).attr({ transform: 'scale(1.3)' }).loop(true, true);
        }
      } else {
        // Game over - caught by monster
        showMessage('👾 Oh no! 👾', 'A monster caught you! Try again?');
        
        // Reset after delay
        setTimeout(() => {
          initGame();
        }, 2000);
      }
    }

    /**
     * Show the message overlay
     * @param {string} title - Title text
     * @param {string} text - Message text
     */
    function showMessage(title, text) {
      document.getElementById('msg-title').textContent = title;
      document.getElementById('msg-text').textContent = text;
      document.getElementById('message-overlay').classList.add('visible');
    }

    /**
     * Close the message overlay
     */
    function closeMessage() {
      document.getElementById('message-overlay').classList.remove('visible');
    }

    // ===== Start the game when page loads =====
    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });
  </script>
</body>
</html>
