<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Heat Diffusion Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #222;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }
        #mainCanvas {
            border: 1px solid #555;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #uiContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(40, 40, 50, 0.85);
            padding: 15px 20px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }
        h3 {
            margin-top: 0;
            border-bottom: 1px solid #667;
            padding-bottom: 10px;
        }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; }
        input[type="range"] { width: 100%; }
        .value-display { float: right; font-weight: bold; color: #aaddff; }
        .button-group button {
            width: 48%;
            padding: 8px;
            border: 1px solid #778;
            background: #445;
            color: #eee;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .button-group button:hover { background: #556; }
        .button-group { display: flex; justify-content: space-between; }
        p { font-size: 13px; line-height: 1.5; color: #ccc; margin-top: 0; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
</head>
<body>
    <div id="uiContainer">
        <h3>Heat Diffusion Controls</h3>
        <div class="control-group">
            <p><b>Click/Drag:</b> Add Heat<br/><b>Hold 'C' + Drag:</b> Add Cold</p>
        </div>
        <div class="control-group">
            <label for="resolutionSlider">Resolution: <span class="value-display" id="resolutionValue">100</span></label>
            <input type="range" id="resolutionSlider" min="40" max="200" step="10" value="100">
        </div>
        <div class="control-group">
            <label for="dtSlider">Time Step: <span class="value-display" id="dtValue">1.0</span></label>
            <input type="range" id="dtSlider" min="0.1" max="1.5" step="0.05" value="1.0">
        </div>
        <div class="control-group">
            <label for="conductivitySlider">Conductivity (α): <span class="value-display" id="conductivityValue">0.2</span></label>
            <input type="range" id="conductivitySlider" min="0.05" max="0.5" step="0.01" value="0.2">
        </div>
        <div class="control-group button-group">
            <button id="boundaryToggle">Mode: Insulated</button>
            <button id="resetButton">Reset</button>
        </div>
        <div class="control-group">
             <label>Material Presets:</label>
             <div class="button-group">
                <button id="materialUniform">Uniform</button>
                <button id="materialWall">Insulator Wall</button>
            </div>
        </div>
    </div>

    <script>
    // --- Simulation Globals ---
    let grid, nextGrid, conductivityGrid;
    let resolution = 100;
    let dt = 1.0; // Time step
    let baseConductivity = 0.2; // Thermal conductivity (alpha)
    let brushSize = 3;
    let scl; // Scale factor for rendering

    // Boundary condition: true for insulated, false for constant temp
    let insulatedBoundaries = true;

    // --- p5.js Main Functions ---
    function setup() {
        let canvas = createCanvas(700, 700);
        canvas.id('mainCanvas');
        noStroke();
        
        initializeGrids();
        setupUI();
    }

    function draw() {
        // Run multiple simulation steps per frame for stability and speed
        for (let i = 0; i < 5; i++) {
            handleMouseInput();
            updateSimulation();
        }
        renderGrid();
    }

    // --- Core Simulation Logic ---
    function initializeGrids() {
        grid = Array(resolution).fill(null).map(() => Array(resolution).fill(0));
        nextGrid = Array(resolution).fill(null).map(() => Array(resolution).fill(0));
        conductivityGrid = Array(resolution).fill(null).map(() => Array(resolution).fill(baseConductivity));
        scl = width / resolution;
    }
    
    function updateSimulation() {
        // The core of the finite-difference method
        for (let i = 1; i < resolution - 1; i++) {
            for (let j = 1; j < resolution - 1; j++) {
                let temp = grid[i][j];
                let alpha = conductivityGrid[i][j];
                
                // Calculate the Laplacian (average of neighbors minus center)
                let laplacian = (
                    grid[i + 1][j] +
                    grid[i - 1][j] +
                    grid[i][j + 1] +
                    grid[i][j - 1] -
                    4 * temp
                );
                
                // The heat equation: ∂T/∂t = α∇²T
                // Discretized: T_next = T_current + dt * α * ∇²T
                let change = dt * alpha * laplacian;
                nextGrid[i][j] = constrain(temp + change, -1, 1);
            }
        }
        
        applyBoundaryConditions();

        // Swap the grids for the next iteration
        [grid, nextGrid] = [nextGrid, grid];
    }

    function applyBoundaryConditions() {
        for (let i = 0; i < resolution; i++) {
            if (insulatedBoundaries) {
                // Insulated (Neumann boundary condition: zero-flux)
                // The edge value is the same as its inner neighbor
                nextGrid[i][0] = nextGrid[i][1];
                nextGrid[i][resolution - 1] = nextGrid[i][resolution - 2];
                nextGrid[0][i] = nextGrid[1][i];
                nextGrid[resolution - 1][i] = nextGrid[resolution - 2][i];
            } else {
                // Constant Temperature (Dirichlet boundary condition)
                // Heat dissipates at the edges
                nextGrid[i][0] = 0;
                nextGrid[i][resolution - 1] = 0;
                nextGrid[0][i] = 0;
                nextGrid[resolution - 1][i] = 0;
            }
        }
    }
    
    function renderGrid() {
        background(0, 0, 50); // A dark blue for the coldest temperature
        for (let i = 0; i < resolution; i++) {
            for (let j = 0; j < resolution; j++) {
                let temp = grid[i][j];
                if (abs(temp) > 0.001) { // Optimization: don't draw zero-temp cells
                    fill(getColorForTemperature(temp));
                    rect(i * scl, j * scl, scl, scl);
                }
            }
        }
    }
    
    // --- User Interaction & UI ---
    function handleMouseInput() {
        if (mouseIsPressed && mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height) {
            let mx = floor(mouseX / scl);
            let my = floor(mouseY / scl);
            let tempValue = keyIsDown(67) ? -1.0 : 1.0; // 'C' key for cold
            
            // Apply heat/cold in a small radius (brush)
            for (let i = -brushSize; i <= brushSize; i++) {
                for (let j = -brushSize; j <= brushSize; j++) {
                    if (dist(i, j, 0, 0) <= brushSize) {
                        let x = mx + i;
                        let y = my + j;
                        if (x >= 0 && x < resolution && y >= 0 && y < resolution) {
                            grid[x][y] = tempValue;
                        }
                    }
                }
            }
        }
    }

    function setupUI() {
        const resolutionSlider = select('#resolutionSlider');
        const dtSlider = select('#dtSlider');
        const conductivitySlider = select('#conductivitySlider');
        const resolutionValue = select('#resolutionValue');
        const dtValue = select('#dtValue');
        const conductivityValue = select('#conductivityValue');
        const boundaryToggle = select('#boundaryToggle');
        const resetButton = select('#resetButton');
        const materialUniform = select('#materialUniform');
        const materialWall = select('#materialWall');

        resolutionSlider.input(() => {
            resolution = resolutionSlider.value();
            resolutionValue.html(resolution);
            initializeGrids();
        });

        dtSlider.input(() => {
            dt = dtSlider.value();
            dtValue.html(dt.toFixed(2));
        });

        conductivitySlider.input(() => {
            baseConductivity = conductivitySlider.value();
            conductivityValue.html(baseConductivity.toFixed(2));
            // When base conductivity changes, reset the material grid
            setMaterialUniform();
        });

        boundaryToggle.mousePressed(() => {
            insulatedBoundaries = !insulatedBoundaries;
            boundaryToggle.html(insulatedBoundaries ? "Mode: Insulated" : "Mode: Constant");
        });
        
        resetButton.mousePressed(initializeGrids);
        
        materialUniform.mousePressed(setMaterialUniform);
        
        materialWall.mousePressed(() => {
            setMaterialUniform(); // Start with a uniform base
            let wallWidth = 2;
            let wallConductivity = 0.001; // Very low conductivity
            let center = floor(resolution / 2);
            for (let j = 0; j < resolution; j++) {
                for (let i = center - wallWidth; i <= center + wallWidth; i++) {
                     if (j < resolution * 0.2 || j > resolution * 0.8) continue; // Leave gaps
                     conductivityGrid[i][j] = wallConductivity;
                }
            }
        });
    }

    function setMaterialUniform() {
        for (let i = 0; i < resolution; i++) {
            for (let j = 0; j < resolution; j++) {
                conductivityGrid[i][j] = baseConductivity;
            }
        }
    }

    // --- Helper Functions ---
    function getColorForTemperature(temp) {
        // A heatmap gradient from Blue -> Cyan -> Yellow -> Red
        let r, g, b;
        temp = constrain(temp, -1, 1);
        
        if (temp < 0) { // Cold: Blue -> Dark
            r = 0;
            g = map(temp, -1, 0, 0, 0);
            b = map(temp, -1, 0, 255, 50);
        } else { // Hot: Dark Blue -> Cyan -> Yellow -> Red
            if (temp < 0.5) { // -> Cyan -> Yellow
                r = map(temp, 0, 0.5, 0, 255);
                g = map(temp, 0, 0.5, 200, 255);
                b = map(temp, 0, 0.5, 255, 0);
            } else { // -> Red
                r = 255;
                g = map(temp, 0.5, 1, 255, 0);
                b = 0;
            }
        }
        return color(r, g, b);
    }
    
    function windowResized() {
        // Optional: you can resize canvas and re-init, but fixed size is simpler
    }
    </script>
</body>
</html>
