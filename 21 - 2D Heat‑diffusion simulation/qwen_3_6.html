<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D Heat Diffusion Simulation</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0c14; font-family: 'Segoe UI', system-ui, sans-serif; color: #e0e8ff; overflow: hidden; }
    #canvas-container { display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border-radius: 8px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    
    #ui {
      position: absolute; top: 15px; right: 15px;
      background: rgba(15, 18, 30, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100, 150, 255, 0.15);
      border-radius: 12px; padding: 16px; width: 280px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      max-height: calc(100vh - 30px); overflow-y: auto;
    }
    #ui::-webkit-scrollbar { width: 5px; }
    #ui::-webkit-scrollbar-track { background: transparent; }
    #ui::-webkit-scrollbar-thumb { background: rgba(100,150,255,0.3); border-radius: 3px; }
    
    h2 { font-size: 1.1rem; color: #88ccff; margin-bottom: 10px; letter-spacing: 0.5px; }
    h3 { font-size: 0.9rem; color: #a0b8d8; margin: 12px 0 6px 0; border-top: 1px solid rgba(100,150,255,0.15); padding-top: 8px; }
    
    .control { margin-bottom: 8px; }
    .control label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 3px; color: #b0c8e0; }
    input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(100,150,255,0.2); border-radius: 2px; outline: none; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #88ccff; border-radius: 50%; cursor: pointer; }
    input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; background: #88ccff; border-radius: 50%; cursor: pointer; border: none; }
    
    .btn-row { display: flex; gap: 5px; margin: 8px 0; }
    button { flex: 1; padding: 6px 8px; background: rgba(40, 50, 80, 0.8); border: 1px solid rgba(100,150,255,0.2); border-radius: 6px; color: #c0d0ff; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; }
    button:hover { background: rgba(60, 70, 110, 0.9); border-color: #88ccff; color: #fff; }
    button.active { background: rgba(80, 120, 200, 0.6); border-color: #88ccff; color: #fff; }
    
    .info { font-size: 0.75rem; color: #8899bb; margin: 6px 0; line-height: 1.4; }
    .stat { display: flex; justify-content: space-between; font-size: 0.8rem; margin: 3px 0; }
    .stat span { color: #88ccff; font-weight: bold; }
    
    .legend { display: flex; align-items: center; gap: 6px; margin: 8px 0; padding: 6px; background: rgba(0,0,0,0.3); border-radius: 6px; }
    .legend-bar { flex: 1; height: 12px; border-radius: 4px; background: linear-gradient(90deg, #0000ff, #0088ff, #00ff88, #ffff00, #ff8800, #ff0000); }
    .legend-labels { display: flex; justify-content: space-between; font-size: 0.65rem; color: #667799; }
  </style>
</head>
<body>
  <div id="ui">
    <h2>🔥 Heat Diffusion</h2>
    <div class="info">Click/drag to add heat • Hold <kbd>C</kbd> to cool • <kbd>R</kbd> to reset</div>
    
    <div class="control">
      <label><span>Thermal Conductivity</span><span id="val-alpha">0.20</span></label>
      <input type="range" id="slider-alpha" min="0.01" max="0.45" step="0.01" value="0.20">
    </div>
    <div class="control">
      <label><span>Time Step (Speed)</span><span id="val-dt">1.0</span>x</label>
      <input type="range" id="slider-dt" min="0.1" max="5.0" step="0.1" value="1.0">
    </div>
    <div class="control">
      <label><span>Resolution</span><span id="val-res">200</span></label>
      <input type="range" id="slider-res" min="50" max="400" step="50" value="200">
    </div>
    <div class="control">
      <label><span>Convection Strength</span><span id="val-conv">0.00</span></label>
      <input type="range" id="slider-conv" min="0" max="0.15" step="0.01" value="0.00">
    </div>
    <div class="control">
      <label><span>Heat Source Power</span><span id="val-power">1.0</span></label>
      <input type="range" id="slider-power" min="0.1" max="3.0" step="0.1" value="1.0">
    </div>

    <h3>Boundary Conditions</h3>
    <div class="btn-row">
      <button id="btn-insulated" class="active" onclick="setBoundary('insulated')">Insulated</button>
      <button id="btn-constant" onclick="setBoundary('constant')">Constant Temp</button>
      <button id="btn-periodic" onclick="setBoundary('periodic')">Periodic</button>
    </div>
    <div class="control">
      <label><span>Border Temperature</span><span id="val-border">0.0</span></label>
      <input type="range" id="slider-border" min="0" max="1" step="0.05" value="0.0">
    </div>

    <h3>Material Presets</h3>
    <div class="btn-row">
      <button onclick="setMaterial('uniform')">Uniform</button>
      <button onclick="setMaterial('checker')">Checkerboard</button>
      <button onclick="setMaterial('barrier')">Barrier</button>
      <button onclick="setMaterial('conductor')">Conductor</button>
    </div>
    <div class="control">
      <label><span>Material Conductivity</span><span id="val-mat">0.20</span></label>
      <input type="range" id="slider-mat" min="0.01" max="0.45" step="0.01" value="0.20">
    </div>

    <div class="stat">Temperature: <span id="stat-temp">0.00</span>°</div>
    <div class="stat">Energy: <span id="stat-energy">0.0</span>J</div>
    <div class="stat">FPS: <span id="stat-fps">60</span></div>
    
    <div class="legend">
      <div class="legend-bar"></div>
    </div>
    <div class="legend-labels"><span>Cold</span><span>Hot</span></div>
  </div>

  <script>
    // ===== CONFIGURATION =====
    let config = {
      gridSize: 200,
      alpha: 0.20,
      dt: 1.0,
      convection: 0.0,
      heatPower: 1.0,
      boundary: 'insulated',
      borderTemp: 0.0,
      material: 'uniform',
      materialAlpha: 0.20
    };

    // Simulation state
    let tempGrid, tempNext, materialGrid;
    let isCooling = false;
    let heatSource = null; // {x, y, power}
    let simTime = 0;

    function setup() {
      const maxDim = min(windowWidth, windowHeight) - 40;
      createCanvas(maxDim, maxDim);
      pixelDensity(1);
      frameRate(60);
      
      initializeSimulation();
      
      // UI bindings
      bindSlider('slider-alpha', 'val-alpha', v => config.alpha = parseFloat(v));
      bindSlider('slider-dt', 'val-dt', v => config.dt = parseFloat(v));
      bindSlider('slider-res', 'val-res', v => { config.gridSize = parseInt(v); initializeSimulation(); });
      bindSlider('slider-conv', 'val-conv', v => config.convection = parseFloat(v));
      bindSlider('slider-power', 'val-power', v => config.heatPower = parseFloat(v));
      bindSlider('slider-border', 'val-border', v => config.borderTemp = parseFloat(v));
      bindSlider('slider-mat', 'val-mat', v => config.materialAlpha = parseFloat(v); if(config.material !== 'uniform') setMaterial(config.material); });
    }

    function bindSlider(sliderId, valId, onChange) {
      const el = document.getElementById(sliderId);
      const valEl = document.getElementById(valId);
      el.addEventListener('input', () => { valEl.textContent = el.value; onChange(el.value); });
    }

    function initializeSimulation() {
      const N = config.gridSize;
      const size = N * N;
      
      // Initialize grids using TypedArrays for performance
      tempGrid = new Float32Array(size);
      tempNext = new Float32Array(size);
      materialGrid = new Float32Array(size).fill(config.materialAlpha);
      
      // Apply initial material pattern
      setMaterial(config.material, false);
      
      // Add some initial heat distribution
      addInitialHeat(N);
      
      simTime = 0;
    }

    function addInitialHeat(N) {
      // Create a few initial heat sources
      const sources = [
        {x: 0.3, y: 0.4}, {x: 0.7, y: 0.6}, {x: 0.5, y: 0.5}
      ];
      
      for (const src of sources) {
        const cx = Math.floor(src.x * N);
        const cy = Math.floor(src.y * N);
        const radius = Math.floor(N * 0.06);
        
        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            const nx = cx + dx, ny = cy + dy;
            if (nx >= 0 && nx < N && ny >= 0 && ny < N) {
              const dist = Math.sqrt(dx*dx + dy*dy);
              if (dist < radius) {
                tempGrid[ny * N + nx] = Math.max(tempGrid[ny * N + nx], 1.0 - (dist / radius));
              }
            }
          }
        }
      }
    }

    // ===== MATERIAL PRESETS =====
    function setMaterial(type, resetTemp = true) {
      config.material = type;
      const N = config.gridSize;
      const a = config.materialAlpha;
      
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          let val = a;
          if (type === 'checker') {
            const cx = Math.floor(x / 10), cy = Math.floor(y / 10);
            val = ((cx + cy) % 2 === 0) ? a : a * 0.2;
          } else if (type === 'barrier') {
            if (Math.abs(x - N/2) < 3 || Math.abs(y - N/2) < 3) val = a * 0.05;
            else val = a;
          } else if (type === 'conductor') {
            const cx = N/2, cy = N/2;
            const dist = Math.sqrt((x-cx)**2 + (y-cy)**2);
            if (dist < N*0.1) val = a * 1.5;
            else if (dist > N*0.4) val = a * 0.3;
            else val = a;
          }
          materialGrid[y * N + x] = val;
        }
      }
      
      if (resetTemp) initializeSimulation();
      updateMaterialButtons();
    }

    function updateMaterialButtons() {
      document.querySelectorAll('.btn-row button').forEach(b => {
        if (b.textContent.toLowerCase().includes(config.material)) b.classList.add('active');
        else if (!['Insulated','Constant','Periodic'].includes(b.textContent)) b.classList.remove('active');
      });
    }

    // ===== BOUNDARY CONDITIONS =====
    function setBoundary(type) {
      config.boundary = type;
      document.getElementById('btn-insulated').classList.toggle('active', type === 'insulated');
      document.getElementById('btn-constant').classList.toggle('active', type === 'constant');
      document.getElementById('btn-periodic').classList.toggle('active', type === 'periodic');
    }

    function applyBoundaries(N) {
      if (config.boundary === 'constant') {
        const temp = config.borderTemp;
        for (let i = 0; i < N; i++) {
          tempGrid[i] = temp;                     // top
          tempGrid[(N-1)*N + i] = temp;           // bottom
          tempGrid[i*N] = temp;                   // left
          tempGrid[i*N + (N-1)] = temp;           // right
        }
      } else if (config.boundary === 'insulated') {
        // Neumann: copy from adjacent cell
        for (let i = 1; i < N-1; i++) {
          tempGrid[i] = tempGrid[i + N];          // top
          tempGrid[(N-1)*N + i] = tempGrid[(N-2)*N + i]; // bottom
          tempGrid[i*N] = tempGrid[i*N + 1];      // left
          tempGrid[i*N + (N-1)] = tempGrid[i*N + (N-2)]; // right
        }
      }
      // Periodic: handled in stencil
    }

    // ===== HEAT EQUATION SOLVER =====
    function solveHeatEquation() {
      const N = config.gridSize;
      const dt = config.dt * 0.04; // Scale time step for stability
      const alphaBase = config.alpha;
      const conv = config.convection;
      
      // Safety check for stability (CFL-like condition)
      const maxAlpha = alphaBase * 1.5;
      if (dt * maxAlpha > 0.25) {
        // Reduce effective dt to maintain stability
        console.warn('Warning: Simulation may be unstable, adjusting dt');
      }
      
      // Convection velocity field (simple circular flow)
      const cx = N/2, cy = N/2;
      const omega = conv * 2;
      
      let totalEnergy = 0;
      let totalTemp = 0;
      let count = 0;
      
      for (let y = 1; y < N - 1; y++) {
        for (let x = 1; x < N - 1; x++) {
          const idx = y * N + x;
          const localAlpha = materialGrid[idx];
          
          // Laplacian: ∇²T = T(x+1,y) + T(x-1,y) + T(x,y+1) + T(x,y-1) - 4T(x,y)
          let laplacian = 0;
          if (config.boundary === 'periodic') {
            const xl = (x === 0) ? N - 2 : x - 1;
            const xr = (x === N - 1) ? 1 : x + 1;
            const yt = (y === 0) ? N - 2 : y - 1;
            const yb = (y === N - 1) ? 1 : y + 1;
            laplacian = tempGrid[y*N + xr] + tempGrid[y*N + xl] + tempGrid[yb*N + x] + tempGrid[yt*N + x] - 4*tempGrid[idx];
          } else {
            laplacian = tempGrid[y*N + (x+1)] + tempGrid[y*N + (x-1)] + tempGrid[(y+1)*N + x] + tempGrid[(y-1)*N + x] - 4*tempGrid[idx];
          }
          
          // Convection: -v·∇T (upwind scheme for stability)
          let convection = 0;
          if (conv > 0) {
            // Circular velocity field
            const dx = x - cx, dy = y - cy;
            const r = Math.sqrt(dx*dx + dy*dy) + 1;
            const vx = -omega * dy / r;
            const vy = omega * dx / r;
            
            // Upwind gradient
            const gradX = (vx > 0) ? tempGrid[idx] - tempGrid[y*N + (x-1)] : tempGrid[y*N + (x+1)] - tempGrid[idx];
            const gradY = (vy > 0) ? tempGrid[idx] - tempGrid[(y-1)*N + x] : tempGrid[(y+1)*N + x] - tempGrid[idx];
            convection = -(vx * gradX + vy * gradY);
          }
          
          // Update temperature: T_new = T + dt * (alpha * ∇²T + convection)
          tempNext[idx] = tempGrid[idx] + dt * (localAlpha * laplacian + convection);
          
          // Clamp temperature
          tempNext[idx] = Math.max(0, Math.min(1, tempNext[idx]));
          
          totalEnergy += tempNext[idx];
          totalTemp += tempNext[idx];
          count++;
        }
      }
      
      // Apply boundary conditions
      applyBoundaries(N);
      
      // Add heat source if active
      if (heatSource) {
        addHeatAt(heatSource.x, heatSource.y, heatSource.power * config.heatPower, N);
      }
      
      // Cooling mode
      if (isCooling && heatSource) {
        removeHeatAt(heatSource.x, heatSource.y, 0.05 * config.heatPower, N);
      }
      
      // Swap grids
      const swap = tempGrid;
      tempGrid = tempNext;
      tempNext = swap;
      
      simTime += dt;
      
      // Update stats
      if (frameCount % 10 === 0) {
        const avgTemp = count > 0 ? totalTemp / count : 0;
        document.getElementById('stat-temp').textContent = (avgTemp * 100).toFixed(1);
        document.getElementById('stat-energy').textContent = totalEnergy.toFixed(1);
        document.getElementById('stat-fps').textContent = frameRate().toFixed(0);
      }
    }

    function addHeatAt(nx, ny, power, N) {
      const radius = Math.floor(N * 0.03);
      const cx = Math.floor(nx * N);
      const cy = Math.floor(ny * N);
      
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && x < N && y >= 0 && y < N) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < radius) {
              const falloff = 1 - (dist / radius);
              tempGrid[y * N + x] = Math.min(1, tempGrid[y * N + x] + power * falloff * 0.15);
            }
          }
        }
      }
    }

    function removeHeatAt(nx, ny, power, N) {
      const radius = Math.floor(N * 0.04);
      const cx = Math.floor(nx * N);
      const cy = Math.floor(ny * N);
      
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && x < N && y >= 0 && y < N) {
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < radius) {
              const falloff = 1 - (dist / radius);
              tempGrid[y * N + x] = Math.max(0, tempGrid[y * N + x] - power * falloff * 0.05);
            }
          }
        }
      }
    }

    // ===== RENDERING =====
    function draw() {
      solveHeatEquation();
      renderHeatmap();
    }

    function renderHeatmap() {
      const N = config.gridSize;
      const scaleW = width / N;
      const scaleH = height / N;
      
      loadPixels();
      
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const temp = tempGrid[y * N + x];
          const col = temperatureToColor(temp);
          
          // Fill screen pixels
          const sx = Math.floor(x * scaleW);
          const sy = Math.floor(y * scaleH);
          const sw = Math.ceil(scaleW);
          const sh = Math.ceil(scaleH);
          
          for (let py = sy; py < Math.min(sy + sh, height); py++) {
            for (let px = sx; px < Math.min(sx + sw, width); px++) {
              const idx = (py * width + px) * 4;
              pixels[idx] = col[0];
              pixels[idx + 1] = col[1];
              pixels[idx + 2] = col[2];
              pixels[idx + 3] = 255;
            }
          }
        }
      }
      
      updatePixels();
    }

    function temperatureToColor(t) {
      t = constrain(t, 0, 1);
      let r, g, b;
      
      if (t < 0.2) {
        // Dark blue to blue
        const s = t / 0.2;
        r = 10 + s * 20;
        g = 10 + s * 30;
        b = 40 + s * 180;
      } else if (t < 0.4) {
        // Blue to cyan
        const s = (t - 0.2) / 0.2;
        r = 30;
        g = 40 + s * 140;
        b = 220 + s * 35;
      } else if (t < 0.6) {
        // Cyan to green/yellow
        const s = (t - 0.4) / 0.2;
        r = 30 + s * 200;
        g = 180 + s * 75;
        b = 255 - s * 255;
      } else if (t < 0.8) {
        // Yellow to orange/red
        const s = (t - 0.6) / 0.2;
        r = 230 + s * 25;
        g = 255 - s * 150;
        b = 0;
      } else {
        // Red to white hot
        const s = (t - 0.8) / 0.2;
        r = 255;
        g = 105 + s * 150;
        b = 0 + s * 150;
      }
      
      return [r, g, b];
    }

    // ===== INPUT HANDLING =====
    function mousePressed() {
      heatSource = { x: mouseX / width, y: mouseY / height, power: 1.0 };
    }

    function mouseDragged() {
      if (heatSource) {
        heatSource.x = mouseX / width;
        heatSource.y = mouseY / height;
      }
    }

    function mouseReleased() {
      heatSource = null;
    }

    function keyPressed() {
      if (key.toLowerCase() === 'c') isCooling = true;
      if (key.toLowerCase() === 'r') initializeSimulation();
    }

    function keyReleased() {
      if (key.toLowerCase() === 'c') isCooling = false;
    }

    function windowResized() {
      const maxDim = min(windowWidth, windowHeight) - 40;
      resizeCanvas(maxDim, maxDim);
    }
  </script>
</body>
</html>
