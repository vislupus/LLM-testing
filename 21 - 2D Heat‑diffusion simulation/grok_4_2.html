<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEATFLOW • 2D Diffusion</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        body {
            margin: 0;
            overflow: hidden;
            background: #0a0a1f;
            font-family: 'Inter', system-ui;
            color: #ddd;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15,15,35,0.92);
            padding: 20px;
            border-radius: 16px;
            width: 280px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            user-select: none;
        }
        h1 {
            margin: 0 0 20px 0;
            font-size: 21px;
            text-align: center;
            color: #6cf;
        }
        .control {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #88ffdd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #6cf;
        }
        .val {
            float: right;
            font-family: monospace;
            color: #6cf;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #6cf;
            color: #111;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        #info {
            position: absolute;
            bottom: 25px;
            left: 25px;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui">
        <h1>HEATFLOW</h1>
        
        <div class="control">
            <label>DIFFUSION RATE <span id="diffVal" class="val">0.18</span></label>
            <input type="range" id="diffSlider" min="0" max="100" value="18">
        </div>
        
        <div class="control">
            <label>HEAT LOSS <span id="lossVal" class="val">0.992</span></label>
            <input type="range" id="lossSlider" min="90" max="100" value="99.2" step="0.1">
        </div>
        
        <div class="control">
            <label>SOURCE STRENGTH <span id="sourceVal" class="val">85</span></label>
            <input type="range" id="sourceSlider" min="20" max="200" value="85">
        </div>
        
        <button onclick="resetSimulation()">RESET GRID</button>
        <button onclick="addRandomHotSpots()">ADD HOT SPOTS</button>
    </div>
    
    <div id="info">
        DRAG MOUSE = add heat<br>
        RIGHT CLICK = cool<br>
        1–4 = change brush color
    </div>

    <script>
        // ================================================
        // HEATFLOW — 2D Heat Diffusion Simulation
        // Explicit finite difference • Real-time • Interactive
        // Blue = cold → Red = hot • Material-like variation via brush
        // Single standalone HTML file
        // ================================================

        let grid;
        let nextGrid;
        let N = 140;                    // grid resolution
        let cellSize;
        let alpha = 0.18;               // diffusion coefficient
        let loss = 0.992;               // natural cooling
        let sourceStrength = 85;
        
        let currentBrushColor = 255;    // 0 = cold, 255 = hot (grayscale for simplicity)
        
        function setup() {
            createCanvas(800, 800);
            cellSize = width / N;
            
            grid = Array.from({length: N}, () => Array(N).fill(20)); // initial room temp
            nextGrid = Array.from({length: N}, () => Array(N).fill(20));
            
            // Initial hot spot
            addHeatSpot(N/2, N/2, 60, 180);
        }
        
        function resetSimulation() {
            grid = Array.from({length: N}, () => Array(N).fill(20));
            nextGrid = Array.from({length: N}, () => Array(N).fill(20));
        }
        
        function addRandomHotSpots() {
            for (let i = 0; i < 8; i++) {
                let x = Math.floor(random(N));
                let y = Math.floor(random(N));
                addHeatSpot(x, y, 25, 220);
            }
        }
        
        function addHeatSpot(gx, gy, radius, intensity) {
            for (let y = -radius; y <= radius; y++) {
                for (let x = -radius; x <= radius; x++) {
                    if (x*x + y*y > radius*radius) continue;
                    let px = gx + x;
                    let py = gy + y;
                    if (px < 0 || px >= N || py < 0 || py >= N) continue;
                    grid[py][px] = Math.max(grid[py][px], intensity);
                }
            }
        }
        
        function updateHeat() {
            let dt = 0.8; // stability factor
            
            for (let y = 1; y < N-1; y++) {
                for (let x = 1; x < N-1; x++) {
                    let laplacian = grid[y-1][x] + grid[y+1][x] + grid[y][x-1] + grid[y][x+1] - 4 * grid[y][x];
                    nextGrid[y][x] = grid[y][x] + alpha * dt * laplacian;
                    nextGrid[y][x] *= loss; // natural cooling
                }
            }
            
            // Insulated boundaries (Neumann)
            for (let i = 0; i < N; i++) {
                nextGrid[0][i] = nextGrid[1][i];
                nextGrid[N-1][i] = nextGrid[N-2][i];
                nextGrid[i][0] = nextGrid[i][1];
                nextGrid[i][N-1] = nextGrid[i][N-2];
            }
            
            // Swap arrays
            [grid, nextGrid] = [nextGrid, grid];
        }
        
        function draw() {
            updateHeat();
            
            loadPixels();
            let idx = 0;
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    let t = constrain(grid[y][x], 0, 255);
                    let col;
                    if (t < 80) {
                        col = lerpColor(color(30,30,120), color(80,180,255), t/80);
                    } else if (t < 160) {
                        col = lerpColor(color(80,180,255), color(255,255,100), (t-80)/80);
                    } else {
                        col = lerpColor(color(255,255,100), color(255,60,30), (t-160)/95);
                    }
                    pixels[idx]   = red(col);
                    pixels[idx+1] = green(col);
                    pixels[idx+2] = blue(col);
                    pixels[idx+3] = 255;
                    idx += 4;
                }
            }
            updatePixels();
            
            // Draw grid lines very lightly for clarity
            stroke(255, 20);
            strokeWeight(1);
            for (let i = 0; i <= N; i++) {
                let pos = i * cellSize;
                line(pos, 0, pos, height);
                line(0, pos, width, pos);
            }
        }
        
        function mouseDragged() {
            let gx = floor(mouseX / cellSize);
            let gy = floor(mouseY / cellSize);
            if (gx < 1 || gx > N-2 || gy < 1 || gy > N-2) return;
            
            let intensity = currentBrushColor;
            if (mouseButton === RIGHT) intensity = 10; // cool on right click
            
            grid[gy][gx] = intensity;
            // Spread a little
            grid[gy-1][gx] = (grid[gy-1][gx] + intensity) * 0.5;
            grid[gy+1][gx] = (grid[gy+1][gx] + intensity) * 0.5;
            grid[gy][gx-1] = (grid[gy][gx-1] + intensity) * 0.5;
            grid[gy][gx+1] = (grid[gy][gx+1] + intensity) * 0.5;
        }
        
        function keyPressed() {
            if (key === 'r' || key === 'R') resetSimulation();
            if (key === 'h' || key === 'H') addRandomHotSpots();
            if (key === '1') currentBrushColor = 255; // hot
            if (key === '2') currentBrushColor = 80;  // medium
            if (key === '3') currentBrushColor = 20;  // cold
        }
        
        function setupUI() {
            const diffSlider = document.getElementById('diffSlider');
            const lossSlider = document.getElementById('lossSlider');
            
            diffSlider.oninput = () => {
                alpha = parseFloat(diffSlider.value) / 100;
                document.getElementById('diffVal').textContent = alpha.toFixed(2);
            };
            
            lossSlider.oninput = () => {
                loss = parseFloat(lossSlider.value) / 100;
                document.getElementById('lossVal').textContent = loss.toFixed(3);
            };
        }
        
        window.onload = () => {
            setupUI();
        };
    </script>
</body>
</html>
