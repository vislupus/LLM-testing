<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Heat Diffusion Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #c0d0e0;
        }

        #container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #canvas-wrapper {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(255, 100, 50, 0.15),
                        0 0 120px rgba(50, 100, 255, 0.1);
        }

        canvas {
            display: block;
        }

        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 25, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 150, 100, 0.12);
            border-radius: 14px;
            padding: 22px;
            width: 260px;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        #controls::-webkit-scrollbar {
            width: 4px;
        }

        #controls::-webkit-scrollbar-thumb {
            background: rgba(255, 150, .3);
            border-radius: 100, 02px;
        }

        #controls h1 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ff6b6b, #ffd93d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
        }

        #controls .subtitle {
            font-size: 10px;
            color: #556;
            margin-bottom: 18px;
            font-family: 'JetBrains Mono', monospace;
        }

        .section {
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            font-size: 10px;
            color: #8899aa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .control-row {
            margin-bottom: 14px;
        }

        .control-row label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #8899aa;
            margin-bottom: 6px;
        }

        .control-row label span.value {
            color: #ffd93d;
            font-weight: 600;
            font-size: 10px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: linear-gradient(135deg, #ff6b6b, #ffa07a);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4);
            transition: transform 0.15s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .toggle-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .toggle-btn {
            flex: 1;
            min-width: 70px;
            padding: 8px 10px;
            border: 1px solid rgba(255, 150, 100, 0.2);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            color: #8899aa;
            font-size: 9px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-btn:hover {
            background: rgba(255, 150, 100, 0.1);
            border-color: rgba(255, 150, 100, 0.4);
        }

        .toggle-btn.active {
            background: rgba(255, 150, 100, 0.2);
            border-color: #ff9664;
            color: #ffd93d;
        }

        .btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .btn:last-child {
            margin-bottom: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ffa07a);
            color: #1a1a1a;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(255, 107, 107, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #aabbcc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .instructions {
            font-size: 9px;
            color: #667788;
            line-height: 1.7;
        }

        .instructions .key {
            display: inline-block;
            background: rgba(255, 200, 100, 0.15);
            border: 1px solid rgba(255, 200, 100, 0.25);
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 8px;
            color: #ffd93d;
            margin: 0 2px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .stat {
            text-align: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 6px;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: #ffd93d;
        }

        .stat-label {
            font-size: 8px;
            color: #667788;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        #status {
            margin-top: 14px;
            padding: 10px;
            border-radius: 6px;
            font-size: 10px;
            text-align: center;
            background: rgba(255, 200, 100, 0.1);
            color: #ffd93d;
            border: 1px solid rgba(255, 200, 100, 0.2);
        }

        #status.paused {
            background: rgba(100, 200, 255, 0.1);
            color: #64c8ff;
            border-color: rgba(100, 200, 255, 0.2);
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-wrapper">
            <canvas id="simulation"></canvas>
        </div>
    </div>

    <div id="controls">
        <h1>HEAT DIFFUSION</h1>
        <div class="subtitle">Finite-Difference Thermal Solver</div>

        <div class="section">
            <div class="section-title">Tools</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="modeHeat" onclick="setMode('heat')">Heat</button>
                <button class="toggle-btn" id="modeCool" onclick="setMode('cool')">Cool</button>
            </div>
            <div class="control-row" style="margin-top: 12px;">
                <label>Brush Size <span class="value" id="brushVal">25</span></label>
                <input type="range" id="brushSize" min="5" max="80" value="25">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Physics</div>
            <div class="control-row">
                <label>Diffusion Rate <span class="value" id="diffusionVal">0.20</span></label>
                <input type="range" id="diffusion" min="1" max="50" value="20">
            </div>
            <div class="control-row">
                <label>Iterations/Frame <span class="value" id="iterVal">4</span></label>
                <input type="range" id="iterations" min="1" max="16" value="4">
            </div>
            <div class="control-row">
                <label>Heat Strength <span class="value" id="strengthVal">1.0</span></label>
                <input type="range" id="strength" min="10" max="100" value="100">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Boundary</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="boundInsulated" onclick="setBoundary('insulated')">Insulated</button>
                <button class="toggle-btn" id="boundFixed" onclick="setBoundary('fixed')">Fixed 0°C</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Material Preset</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="matCopper" onclick="setMaterial('copper')">Copper</button>
                <button class="toggle-btn" id="matSteel" onclick="setMaterial('steel')">Steel</button>
                <button class="toggle-btn" id="matWood" onclick="setMaterial('wood')">Wood</button>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Actions</div>
            <button class="btn btn-secondary" onclick="togglePause()">Pause / Resume</button>
            <button class="btn btn-secondary" onclick="clearHeat()">Clear Heat</button>
            <button class="btn btn-primary" onclick="resetSimulation()">Reset All</button>
        </div>

        <div class="section">
            <div class="section-title">Info</div>
            <div class="instructions">
                <span class="key">Click</span> Add heat/cool<br>
                <span class="key">Drag</span> Paint continuously<br>
                <span class="key">Space</span> Pause/Resume<br>
                <span class="key">C</span> Toggle heat/cool<br>
                <span class="key">R</span> Reset simulation
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="fps">60</div>
                <div class="stat-label">FPS</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="maxTemp">0°</div>
                <div class="stat-label">Max Temp</div>
            </div>
        </div>

        <div id="status">Running</div>
    </div>

    <script>
        // ============================================
        // HEAT DIFFUSION SIMULATION
        // ============================================

        // Simulation parameters
        const GRID_SIZE = 200;
        let grid = [];
        let gridNext = [];
        let materialGrid = [];

        // Physics parameters
        let diffusionRate = 0.2;
        let iterations = 4;
        let brushSize = 25;
        let heatStrength = 1.0;
        let boundaryMode = 'insulated'; // 'insulated' or 'fixed'
        let currentMode = 'heat'; // 'heat' or 'cool'

        // Material presets (thermal diffusivity)
        const materials = {
            copper: { name: 'Copper', alpha: 0.45, color: [180, 120, 80] },
            steel: { name: 'Steel', alpha: 0.15, color: [150, 150, 160] },
            wood: { name: 'Wood', alpha: 0.03, color: [139, 90, 43] }
        };
        let currentMaterial = 'copper';

        // Display
        let canvasSize = 600;
        let cellSize;
        let isPaused = false;

        // p5.js instance mode
        let sim;

        function setup() {
            sim = createCanvas(canvasSize, canvasSize);
            sim.id('simulation');
            pixelDensity(1);

            cellSize = canvasSize / GRID_SIZE;

            // Initialize grids
            initGrids();

            // Set up UI event listeners
            setupUI();
        }

        function initGrids() {
            grid = new Float32Array(GRID_SIZE * GRID_SIZE);
            gridNext = new Float32Array(GRID_SIZE * GRID_SIZE);
            materialGrid = new Float32Array(GRID_SIZE * GRID_SIZE);

            // Initialize material grid
            let alpha = materials[currentMaterial].alpha;
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                materialGrid[i] = alpha;
            }

            // Initial heat in center
            addHeat(GRID_SIZE / 2, GRID_SIZE / 2, 1.0, 30);
        }

        function IX(x, y) {
            return x + y * GRID_SIZE;
        }

        // Add heat at position with radius
        function addHeat(gx, gy, value, radius) {
            let radius2 = radius * radius;

            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    let nx = gx + dx;
                    let ny = gy + dy;

                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                        let dist2 = dx * dx + dy * dy;
                        if (dist2 <= radius2) {
                            let falloff = 1 - Math.sqrt(dist2) / radius;
                            let idx = IX(nx, ny);

                            if (currentMode === 'heat') {
                                grid[idx] = Math.min(1.0, grid[idx] + value * falloff * heatStrength);
                            } else {
                                grid[idx] = Math.max(0, grid[idx] - value * falloff * heatStrength);
                            }
                        }
                    }
                }
            }
        }

        // Finite-difference heat equation solver
        function solveHeatEquation() {
            let alpha = materials[currentMaterial].alpha;
            let dt = 1.0;

            for (let iter = 0; iter < iterations; iter++) {
                // Swap grids
                let temp = grid;
                grid = gridNext;
                gridNext = temp;

                // Calculate Laplacian for each cell
                for (let y = 1; y < GRID_SIZE - 1; y++) {
                    for (let x = 1; x < GRID_SIZE - 1; x++) {
                        let idx = IX(x, y);
                        let matAlpha = materialGrid[idx];

                        // 5-point Laplacian stencil
                        let laplacian =
                            grid[IX(x + 1, y)] +
                            grid[IX(x - 1, y)] +
                            grid[IX(x, y + 1)] +
                            grid[IX(x, y - 1)] -
                            4 * grid[idx];

                        // Heat equation: T_new = T + alpha * dt * Laplacian
                        gridNext[idx] = grid[idx] + matAlpha * dt * diffusionRate * laplacian;

                        // Clamp to valid range
                        gridNext[idx] = Math.max(0, Math.min(1.0, gridNext[idx]));
                    }
                }

                // Apply boundary conditions
                applyBoundaryConditions();
            }
        }

        function applyBoundaryConditions() {
            if (boundaryMode === 'fixed') {
                // Fixed temperature (0°C) at edges
                for (let x = 0; x < GRID_SIZE; x++) {
                    gridNext[IX(x, 0)] = 0;
                    gridNext[IX(x, GRID_SIZE - 1)] = 0;
                }
                for (let y = 0; y < GRID_SIZE; y++) {
                    gridNext[IX(0, y)] = 0;
                    gridNext[IX(GRID_SIZE - 1, y)] = 0;
                }
            } else {
                // Insulated (Neumann) - copy from interior
                for (let x = 0; x < GRID_SIZE; x++) {
                    gridNext[IX(x, 0)] = gridNext[IX(x, 1)];
                    gridNext[IX(x, GRID_SIZE - 1)] = gridNext[IX(x, GRID_SIZE - 2)];
                }
                for (let y = 0; y < GRID_SIZE; y++) {
                    gridNext[IX(0, y)] = gridNext[IX(1, y)];
                    gridNext[IX(GRID_SIZE - 1, y)] = gridNext[IX(GRID_SIZE - 2, y)];
                }
            }
        }

        // Convert temperature to color (heatmap)
        function temperatureToColor(temp) {
            // Create smooth heatmap gradient
            let r, g, b;

            if (temp < 0.2) {
                // Deep blue to blue
                let t = temp / 0.2;
                r = 0;
                g = Math.floor(50 * t);
                b = Math.floor(80 + 175 * t);
            } else if (temp < 0.4) {
                // Blue to cyan to green
                let t = (temp - 0.2) / 0.2;
                r = 0;
                g = Math.floor(50 + 155 * t);
                b = Math.floor(255 - 100 * t);
            } else if (temp < 0.6) {
                // Green to yellow
                let t = (temp - 0.4) / 0.2;
                r = Math.floor(255 * t);
                g = 205;
                b = Math.floor(155 * (1 - t));
            } else if (temp < 0.8) {
                // Yellow to orange to red
                let t = (temp - 0.6) / 0.2;
                r = 255;
                g = Math.floor(205 - 155 * t);
                b = 0;
            } else {
                // Red to white
                let t = (temp - 0.8) / 0.2;
                r = 255;
                g = Math.floor(50 + 205 * t);
                b = Math.floor(255 * t);
            }

            return [r, g, b];
        }

        function draw() {
            if (!isPaused) {
                // Handle mouse input
                if (mouseIsPressed) {
                    let gx = Math.floor(mouseX / cellSize);
                    let gy = Math.floor(mouseY / cellSize);
                    let radius = Math.floor(brushSize / cellSize);

                    if (gx >= 0 && gx < GRID_SIZE && gy >= 0 && gy < GRID_SIZE) {
                        addHeat(gx, gy, 0.15, radius);
                    }
                }

                // Solve heat equation
                solveHeatEquation();
            }

            // Render
            renderGrid();

            // Update stats
            if (frameCount % 10 === 0) {
                updateStats();
            }
        }

        function renderGrid() {
            loadPixels();

            for (let y = 0; y < canvasSize; y++) {
                for (let x = 0; x < canvasSize; x++) {
                    let gx = Math.floor(x / cellSize);
                    let gy = Math.floor(y / cellSize);
                    let temp = grid[IX(gx, gy)];

                    let [r, g, b] = temperatureToColor(temp);

                    // Add material tint
                    let mat = materials[currentMaterial];
                    r = Math.floor(r * 0.7 + mat.color[0] * 0.3);
                    g = Math.floor(g * 0.7 + mat.color[1] * 0.3);
                    b = Math.floor(b * 0.7 + mat.color[2] * 0.3);

                    // Write to pixel buffer
                    let idx = (x + y * canvasSize) * 4;
                    pixels[idx] = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                }
            }

            updatePixels();

            // Draw grid lines for materials (subtle)
            if (currentMaterial !== 'copper') {
                stroke(255, 30);
                strokeWeight(0.5);
                noFill();

                // Draw some material texture hints
                for (let i = 0; i < 5; i++) {
                    let y = canvasSize * (0.2 + i * 0.15);
                    line(0, y, canvasSize, y);
                }
            }
        }

        function updateStats() {
            document.getElementById('fps').textContent = Math.round(frameRate());

            // Find max temperature
            let maxTemp = 0;
            for (let i = 0; i < grid.length; i++) {
                if (grid[i] > maxTemp) maxTemp = grid[i];
            }
            document.getElementById('maxTemp').textContent = Math.round(maxTemp * 100) + '°';
        }

        // ============================================
        // UI CONTROLS
        // ============================================

        function setupUI() {
            // Brush size
            document.getElementById('brushSize').addEventListener('input', (e) => {
                brushSize = parseInt(e.target.value);
                document.getElementById('brushVal').textContent = brushSize;
            });

            // Diffusion rate
            document.getElementById('diffusion').addEventListener('input', (e) => {
                diffusionRate = parseInt(e.target.value) / 100;
                document.getElementById('diffusionVal').textContent = diffusionRate.toFixed(2);
            });

            // Iterations
            document.getElementById('iterations').addEventListener('input', (e) => {
                iterations = parseInt(e.target.value);
                document.getElementById('iterVal').textContent = iterations;
            });

            // Heat strength
            document.getElementById('strength').addEventListener('input', (e) => {
                heatStrength = parseInt(e.target.value) / 100;
                document.getElementById('strengthVal').textContent = heatStrength.toFixed(1);
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeHeat').classList.toggle('active', mode === 'heat');
            document.getElementById('modeCool').classList.toggle('active', mode === 'cool');
        }

        function setBoundary(mode) {
            boundaryMode = mode;
            document.getElementById('boundInsulated').classList.toggle('active', mode === 'insulated');
            document.getElementById('boundFixed').classList.toggle('active', mode === 'fixed');
        }

        function setMaterial(mat) {
            currentMaterial = mat;
            let alpha = materials[mat].alpha;

            // Update material grid
            for (let i = 0; i < materialGrid.length; i++) {
                materialGrid[i] = alpha;
            }

            // Update UI
            document.getElementById('matCopper').classList.toggle('active', mat === 'copper');
            document.getElementById('matSteel').classList.toggle('active', mat === 'steel');
            document.getElementById('matWood').classList.toggle('active', mat === 'wood');
        }

        function togglePause() {
            isPaused = !isPaused;
            let status = document.getElementById('status');
            status.textContent = isPaused ? 'Paused' : 'Running';
            status.classList.toggle('paused', isPaused);
        }

        function clearHeat() {
            for (let i = 0; i < grid.length; i++) {
                grid[i] = 0;
                gridNext[i] = 0;
            }
        }

        function resetSimulation() {
            initGrids();
        }

        function keyPressed() {
            if (key === ' ') {
                togglePause();
            } else if (key === 'c' || key === 'C') {
                setMode(currentMode === 'heat' ? 'cool' : 'heat');
            } else if (key === 'r' || key === 'R') {
                resetSimulation();
            }
        }

        function windowResized() {
            // Keep canvas size fixed
        }
    </script>
</body>
</html>
