<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D Heat Diffusion Simulation</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <style>
    :root {
      --bg: #0b0f17;
      --panel: rgba(20, 28, 40, 0.95);
      --text: #e2e8f0;
      --accent: #f97316;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    #container {
      display: flex;
      height: 100vh;
    }
    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #141c28 0%, #0b0f17 100%);
    }
    #sidebar {
      width: 300px;
      background: var(--panel);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 18px;
      overflow-y: auto;
      box-shadow: -4px 0 24px rgba(0,0,0,0.35);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 6px 0;
      color: var(--accent);
    }
    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 18px;
      line-height: 1.4;
    }
    .control-group {
      margin-bottom: 14px;
    }
    label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    select, button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #1e293b;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }
    button {
      background: #334155;
      border: none;
      font-weight: 600;
      margin-top: 6px;
      transition: background 0.15s;
    }
    button:hover { background: #475569; }
    button.primary { background: #ea580c; }
    button.primary:hover { background: #f97316; }
    .button-row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .button-row button { margin-top: 0; }
    .legend {
      height: 16px;
      border-radius: 8px;
      margin: 8px 0;
      background: linear-gradient(90deg, #3b82f6, #06b6d4, #22c55e, #eab308, #ef4444, #7f1d1d);
      position: relative;
    }
    .legend-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #94a3b8;
    }
    .stats {
      background: rgba(11, 15, 23, 0.6);
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      font-size: 12px;
    }
    .stats h2 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: #94a3b8;
    }
    .stat-line {
      display: flex;
      justify-content: space-between;
      margin: 3px 0;
    }
    .keys {
      font-size: 11px;
      color: #64748b;
      margin-top: 14px;
      line-height: 1.6;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 12px;
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="canvas-wrap"></div>
    <div id="sidebar">
      <h1>🔥 Heat Diffusion Lab</h1>
      <div class="subtitle">
        Numerical solution of ∂T/∂t = α∇²T using finite differences. Click to add heat, hold Shift to cool.
      </div>

      <div class="button-row">
        <button id="btn-reset" class="primary">Reset</button>
        <button id="btn-pause">Pause</button>
      </div>

      <div class="control-group">
        <label>Resolution <span id="val-res">160×120</span></label>
        <input type="range" id="sl-res" min="40" max="320" step="20" value="160">
      </div>

      <div class="control-group">
        <label>Thermal Conductivity α <span id="val-alpha">0.25</span></label>
        <input type="range" id="sl-alpha" min="0.01" max="0.6" step="0.01" value="0.25">
      </div>

      <div class="control-group">
        <label>Diffusion Speed <span id="val-speed">1</span></label>
        <input type="range" id="sl-speed" min="1" max="20" step="1" value="1">
      </div>

      <div class="control-group">
        <label>Convection X <span id="val-convx">0</span></label>
        <input type="range" id="sl-convx" min="-0.8" max="0.8" step="0.05" value="0">
      </div>

      <div class="control-group">
        <label>Convection Y <span id="val-convy">0</span></label>
        <input type="range" id="sl-convy" min="-0.8" max="0.8" step="0.05" value="0">
      </div>

      <div class="control-group">
        <label>Boundary Condition</label>
        <select id="sel-boundary">
          <option value="insulated">Insulated edges (Neumann)</option>
          <option value="cold">Constant cold borders (Dirichlet)</option>
          <option value="hot">Constant hot borders</option>
        </select>
      </div>

      <div class="control-group">
        <label>Material Pattern</label>
        <select id="sel-material">
          <option value="uniform">Uniform conductor</option>
          <option value="insulator">Central insulator</option>
          <option value="stripes">Conductive stripes</option>
          <option value="checker">Checkerboard</option>
          <option value="noise">Random heterogeneous</option>
        </select>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="chk-sources" checked>
        <label for="chk-sources" style="margin:0">Persistent heat sources</label>
      </div>

      <div class="control-group">
        <label>Source Temperature <span id="val-source">1.0</span></label>
        <input type="range" id="sl-source" min="0.3" max="1.5" step="0.05" value="1.0">
      </div>

      <div class="legend"></div>
      <div class="legend-labels"><span>Cold</span><span>Hot</span></div>

      <div class="stats">
        <h2>Statistics</h2>
        <div class="stat-line"><span>Grid cells</span><b id="st-cells">-</b></div>
        <div class="stat-line"><span>Max temp</span><b id="st-max">-</b></div>
        <div class="stat-line"><span>Mean temp</span><b id="st-mean">-</b></div>
        <div class="stat-line"><span>FPS</span><b id="st-fps">-</b></div>
        <div class="stat-line"><span>Step</span><b id="st-step">-</b></div>
      </div>

      <div class="keys">
        <strong>Controls:</strong><br>
        Click/drag = add heat<br>
        Shift+click/drag = cool<br>
        Space = pause<br>
        C = clear heat<br>
        R = reset
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Parameters
    // ============================================================
    const params = {
      gridW: 160,
      gridH: 120,
      alpha: 0.25,
      speed: 1,
      convX: 0,
      convY: 0,
      boundary: 'insulated',
      material: 'uniform',
      persistentSources: true,
      sourceTemp: 1.0
    };

    // ============================================================
    // State
    // ============================================================
    let T;       // current temperature
    let Tnext;   // next temperature
    let alpha;   // thermal diffusivity field
    let sources = []; // persistent heat source locations
    let paused = false;
    let stepCount = 0;
    let canvas;

    // ============================================================
    // Color palette: blue → cyan → green → yellow → red → dark red
    // ============================================================
    const heatColors = [
      { t: 0.0, r: 30,  g: 64,  b: 175 },  // deep blue
      { t: 0.2, r: 6,   g: 182, b: 212 },  // cyan
      { t: 0.4, r: 34,  g: 197, b: 94  },  // green
      { t: 0.6, r: 234, g: 179, b: 8   },  // yellow
      { t: 0.8, r: 239, g: 68,  b: 68  },  // red
      { t: 1.0, r: 127, g: 29,  b: 29  }   // dark red
    ];

    function heatColor(temp) {
      temp = constrain(temp, 0, 1.5);
      for (let i = 0; i < heatColors.length - 1; i++) {
        const c1 = heatColors[i];
        const c2 = heatColors[i + 1];
        if (temp <= c2.t) {
          const amt = map(temp, c1.t, c2.t, 0, 1);
          return color(
            lerp(c1.r, c2.r, amt),
            lerp(c1.g, c2.g, amt),
            lerp(c1.b, c2.b, amt)
          );
        }
      }
      return color(heatColors[heatColors.length - 1].r, heatColors[heatColors.length - 1].g, heatColors[heatColors.length - 1].b);
    }

    // ============================================================
    // Setup
    // ============================================================
    function setup() {
      canvas = createCanvas(640, 480);
      canvas.parent('canvas-wrap');
      pixelDensity(1);
      frameRate(60);
      noSmooth();

      bindUI();
      initGrids();
      seedHeat();
    }

    function windowResized() {
      // Keep canvas fixed size for consistent simulation aspect
    }

    // ============================================================
    // Grid initialization
    // ============================================================
    function initGrids() {
      T = new Float32Array(params.gridW * params.gridH);
      Tnext = new Float32Array(params.gridW * params.gridH);
      alpha = new Float32Array(params.gridW * params.gridH);

      for (let y = 0; y < params.gridH; y++) {
        for (let x = 0; x < params.gridW; x++) {
          const idx = y * params.gridW + x;
          T[idx] = 0;
          Tnext[idx] = 0;
          alpha[idx] = getAlpha(x, y);
        }
      }
    }

    function getAlpha(x, y) {
      const nx = x / params.gridW;
      const ny = y / params.gridH;
      switch (params.material) {
        case 'insulator':
          const cx = 0.5, cy = 0.5;
          if ((nx - cx) ** 2 + (ny - cy) ** 2 < 0.08) return 0.02;
          return 1.0;
        case 'stripes':
          return (floor(nx * 8) % 2 === 0) ? 1.0 : 0.1;
        case 'checker':
          return ((floor(nx * 10) + floor(ny * 10)) % 2 === 0) ? 1.0 : 0.15;
        case 'noise':
          return 0.1 + 0.9 * noise(x * 0.08, y * 0.08);
        case 'uniform':
        default:
          return 1.0;
      }
    }

    function seedHeat() {
      // A few warm spots
      for (let i = 0; i < 5; i++) {
        const x = floor(random(10, params.gridW - 10));
        const y = floor(random(10, params.gridH - 10));
        addHeat(x, y, 0.6 + random(0.3));
      }
    }

    // ============================================================
    // Main loop
    // ============================================================
    function draw() {
      if (!paused) {
        for (let s = 0; s < params.speed; s++) {
          step();
        }
      }
      render();
      handleInput();
      updateStats();
    }

    function step() {
      const w = params.gridW;
      const h = params.gridH;
      const dt = 0.2; // stable for alpha up to ~0.6 with this dt

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          const c = T[idx];
          const l = T[idx - 1];
          const r = T[idx + 1];
          const u = T[idx - w];
          const d = T[idx + w];

          // Spatially varying conductivity: average alpha of neighbors
          const aC = alpha[idx];
          const aL = alpha[idx - 1];
          const aR = alpha[idx + 1];
          const aU = alpha[idx - w];
          const aD = alpha[idx + w];

          // Conservative diffusion with variable conductivity
          // ∂/∂x(α ∂T/∂x) + ∂/∂y(α ∂T/∂y)
          const d2x = 0.5 * ((aR + aC) * (r - c) - (aC + aL) * (c - l));
          const d2y = 0.5 * ((aD + aC) * (d - c) - (aC + aU) * (c - u));
          let laplacian = d2x + d2y;

          // Convection term: -v·∇T (upwind-ish)
          let conv = 0;
          if (params.convX !== 0) {
            conv -= params.convX * (params.convX > 0 ? (c - l) : (r - c));
          }
          if (params.convY !== 0) {
            conv -= params.convY * (params.convY > 0 ? (c - u) : (d - c));
          }

          Tnext[idx] = c + params.alpha * dt * laplacian + dt * conv;
        }
      }

      // Boundary conditions
      applyBoundaries();

      // Persistent sources
      if (params.persistentSources) {
        for (const src of sources) {
          const idx = src.y * w + src.x;
          Tnext[idx] = min(Tnext[idx] + params.sourceTemp * 0.05, params.sourceTemp);
        }
      }

      // Swap buffers
      const tmp = T;
      T = Tnext;
      Tnext = tmp;

      stepCount++;
    }

    function applyBoundaries() {
      const w = params.gridW;
      const h = params.gridH;

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (x === 0 || x === w - 1 || y === 0 || y === h - 1) {
            const idx = y * w + x;
            if (params.boundary === 'insulated') {
              // Copy nearest interior value
              const sx = x === 0 ? 1 : (x === w - 1 ? w - 2 : x);
              const sy = y === 0 ? 1 : (y === h - 1 ? h - 2 : y);
              Tnext[idx] = T[sy * w + sx];
            } else if (params.boundary === 'cold') {
              Tnext[idx] = 0;
            } else if (params.boundary === 'hot') {
              Tnext[idx] = 0.8;
            }
          }
        }
      }
    }

    // ============================================================
    // Rendering
    // ============================================================
    function render() {
      const cellW = width / params.gridW;
      const cellH = height / params.gridH;

      noStroke();
      for (let y = 0; y < params.gridH; y++) {
        for (let x = 0; x < params.gridW; x++) {
          const idx = y * params.gridW + x;
          fill(heatColor(T[idx]));
          rect(x * cellW, y * cellH, cellW + 0.5, cellH + 0.5);
        }
      }

      // Draw source markers
      if (params.persistentSources) {
        fill(255, 80);
        stroke(255, 150);
        strokeWeight(1);
        for (const src of sources) {
          circle((src.x + 0.5) * cellW, (src.y + 0.5) * cellH, 6);
        }
      }
    }

    // ============================================================
    // Interaction
    // ============================================================
    function handleInput() {
      if (mouseIsPressed && mouseX >= 0 && mouseX < width && mouseY >= 0 && mouseY < height) {
        const cx = floor(map(mouseX, 0, width, 0, params.gridW));
        const cy = floor(map(mouseY, 0, height, 0, params.gridH));
        const cooling = keyIsDown(SHIFT);
        const radius = 4;

        for (let dy = -radius; dy <= radius; dy++) {
          for (let dx = -radius; dx <= radius; dx++) {
            if (dx * dx + dy * dy > radius * radius) continue;
            const x = cx + dx;
            const y = cy + dy;
            if (x < 1 || x >= params.gridW - 1 || y < 1 || y >= params.gridH - 1) continue;
            const idx = y * params.gridW + x;
            if (cooling) {
              T[idx] *= 0.7;
              T[idx] -= 0.03;
              if (T[idx] < 0) T[idx] = 0;
            } else {
              addHeat(x, y, params.sourceTemp * 0.3);
            }
          }
        }
      }
    }

    function addHeat(x, y, amount) {
      if (x < 1 || x >= params.gridW - 1 || y < 1 || y >= params.gridH - 1) return;
      const idx = y * params.gridW + x;
      T[idx] = min(T[idx] + amount, 1.5);
    }

    function mousePressed() {
      if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;
      const cx = floor(map(mouseX, 0, width, 0, params.gridW));
      const cy = floor(map(mouseY, 0, height, 0, params.gridH));

      if (params.persistentSources) {
        // Toggle source at this location
        const existing = sources.findIndex(s => s.x === cx && s.y === cy);
        if (existing >= 0) {
          sources.splice(existing, 1);
        } else {
          sources.push({ x: cx, y: cy });
        }
      }
    }

    function keyPressed() {
      if (key === ' ') {
        paused = !paused;
        document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
      }
      if (key === 'c' || key === 'C') {
        for (let i = 0; i < T.length; i++) T[i] = 0;
        sources = [];
      }
      if (key === 'r' || key === 'R') {
        resetSimulation();
      }
    }

    // ============================================================
    // UI bindings
    // ============================================================
    function bindUI() {
      const bindSlider = (id, key, displayId, callback) => {
        const el = document.getElementById(id);
        el.addEventListener('input', () => {
          params[key] = parseFloat(el.value);
          if (displayId) document.getElementById(displayId).textContent = params[key];
          if (callback) callback();
        });
      };

      bindSlider('sl-alpha', 'alpha', 'val-alpha');
      bindSlider('sl-speed', 'speed', 'val-speed');
      bindSlider('sl-convx', 'convX', 'val-convx');
      bindSlider('sl-convy', 'convY', 'val-convy');
      bindSlider('sl-source', 'sourceTemp', 'val-source');

      document.getElementById('sl-res').addEventListener('input', (e) => {
        params.gridW = parseInt(e.target.value);
        params.gridH = floor(params.gridW * 0.75);
        document.getElementById('val-res').textContent = `${params.gridW}×${params.gridH}`;
        resetSimulation();
      });

      document.getElementById('sel-boundary').addEventListener('change', (e) => {
        params.boundary = e.target.value;
      });

      document.getElementById('sel-material').addEventListener('change', (e) => {
        params.material = e.target.value;
        rebuildAlpha();
      });

      document.getElementById('chk-sources').addEventListener('change', (e) => {
        params.persistentSources = e.target.checked;
        if (!params.persistentSources) sources = [];
      });

      document.getElementById('btn-reset').addEventListener('click', resetSimulation);
      document.getElementById('btn-pause').addEventListener('click', () => {
        paused = !paused;
        document.getElementById('btn-pause').textContent = paused ? 'Resume' : 'Pause';
      });
    }

    function rebuildAlpha() {
      for (let y = 0; y < params.gridH; y++) {
        for (let x = 0; x < params.gridW; x++) {
          alpha[y * params.gridW + x] = getAlpha(x, y);
        }
      }
    }

    function resetSimulation() {
      initGrids();
      sources = [];
      stepCount = 0;
      seedHeat();
    }

    // ============================================================
    // Statistics
    // ============================================================
    let lastFpsTime = 0;
    let frameCounter = 0;
    let fpsValue = 60;

    function updateStats() {
      let maxT = 0;
      let sumT = 0;
      for (let i = 0; i < T.length; i++) {
        if (T[i] > maxT) maxT = T[i];
        sumT += T[i];
      }

      document.getElementById('st-cells').textContent = `${params.gridW * params.gridH}`;
      document.getElementById('st-max').textContent = maxT.toFixed(3);
      document.getElementById('st-mean').textContent = (sumT / T.length).toFixed(3);
      document.getElementById('st-step').textContent = stepCount;

      frameCounter++;
      const now = millis();
      if (now - lastFpsTime > 500) {
        fpsValue = round(frameCounter * 1000 / (now - lastFpsTime));
        frameCounter = 0;
        lastFpsTime = now;
      }
      document.getElementById('st-fps').textContent = fpsValue;
    }
  </script>
</body>
</html>
