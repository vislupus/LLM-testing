<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Diffusion – Interactive Thermal Simulation</title>
    <style>
        :root {
            --bg: #0d0d16;
            --panel-bg: rgba(16, 16, 28, 0.92);
            --text: #ccc;
            --accent: #ff8866;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #main-container {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
        }
        canvas {
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(255, 100, 50, 0.12), 0 0 100px rgba(255, 60, 30, 0.06);
        }
        #ui-panel {
            background: var(--panel-bg);
            border-radius: 14px;
            padding: 16px 18px;
            color: var(--text);
            font-size: 11px;
            letter-spacing: 0.03em;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 185px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #ui-panel h3 {
            color: #fff;
            font-size: 13px;
            text-align: center;
            margin-bottom: 2px;
            letter-spacing: 0.05em;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .param-row .val {
            color: #ffaa77;
            font-weight: 700;
            min-width: 42px;
            text-align: right;
        }
        .key-hint {
            color: #777;
            font-size: 9px;
            line-height: 1.5;
        }
        .key-hint span {
            color: #ffb74d;
            font-weight: 700;
        }
        .mode-indicator {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.04em;
        }
        .mode-heat {
            background: rgba(255, 100, 50, 0.3);
            color: #ffaa77;
        }
        .mode-cool {
            background: rgba(50, 140, 255, 0.3);
            color: #88bbff;
        }
        .color-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            height: 14px;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 4px;
        }
        .color-legend div {
            flex: 1;
            height: 100%;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #888;
        }
        button {
            padding: 7px 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(35, 35, 55, 0.7);
            color: #ddd;
            border-radius: 16px;
            cursor: pointer;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all 0.2s;
        }
        button:hover {
            background: rgba(55, 55, 80, 0.85);
            border-color: #ff8866;
            color: #fff;
        }
        @media (max-width: 750px) {
            #main-container {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }
            #ui-panel {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
                font-size: 9px;
                padding: 8px 10px;
                min-width: auto;
                border-radius: 10px;
            }
            #ui-panel h3 {
                font-size: 11px;
                width: 100%;
                text-align: center;
            }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js">
    </script>
</head>
<body>
    <div id="main-container">
        <div id="canvas-container"></div>
        <div id="ui-panel">
            <h3>🔥 Heat Diffusion</h3>
            <div class="param-row">
                <span>Mode:</span>
                <span class="mode-indicator mode-heat" id="mode-indicator">HEAT</span>
            </div>
            <div class="param-row">
                <span>Material:</span>
                <span class="val" id="material-name">Copper</span>
            </div>
            <div class="param-row">
                <span>Conductivity:</span>
                <span class="val" id="conductivity-val">1.50</span>
            </div>
            <div class="param-row">
                <span>Speed:</span>
                <span class="val" id="speed-val">1.0×</span>
            </div>
            <div class="param-row">
                <span>Boundary:</span>
                <span class="val" id="boundary-val">Insulated</span>
            </div>
            <div class="color-legend" id="color-legend-bar">
                <div style="background:#0a0a3a;"></div><div style="background:#3a1a6a;"></div>
                <div style="background:#8a1a5a;"></div><div style="background:#cc3a2a;"></div>
                <div style="background:#ee8830;"></div><div style="background:#ffcc50;"></div>
                <div style="background:#fffbe0;"></div>
            </div>
            <div class="legend-labels"><span>Cold</span><span>Hot</span></div>
            <div class="key-hint">
                <span>🖱️ Drag</span> = heat · <span>Shift+Drag</span> = cool<br>
                <span>1-4</span> materials · <span>↑↓</span> speed · <span>B</span> boundary<br>
                <span>R</span> reset · <span>C</span> clear heat
            </div>
            <button id="reset-btn">🔄 Reset All</button>
        </div>
    </div>

    <script>
        new p5((p) => {
            // ────────────────────────────────────────
            // GRID CONFIGURATION
            // ────────────────────────────────────────
            const GRID_SIZE = 80;
            const CELL_PX = 8;
            const CANVAS_SIZE = GRID_SIZE * CELL_PX; // 640×640
            const AMBIENT_TEMP = 0.0;

            // ────────────────────────────────────────
            // MATERIAL PRESETS (conductivity α)
            // ────────────────────────────────────────
            const materialPresets = [
                { name: 'Copper', alpha: 1.50, color: [200, 120, 60] },
                { name: 'Iron', alpha: 0.70, color: [140, 130, 120] },
                { name: 'Wood', alpha: 0.12, color: [160, 130, 90] },
                { name: 'Insulator', alpha: 0.02, color: [200, 190, 170] },
            ];
            let selectedMaterial = 0;

            // ────────────────────────────────────────
            // SIMULATION STATE
            // ────────────────────────────────────────
            let temperature; // 2D array [GRID_SIZE][GRID_SIZE]
            let conductivity; // 2D array [GRID_SIZE][GRID_SIZE]
            let newTemperature;
            let heatMode = true; // true = heat, false = cool
            let speedMultiplier = 1.0;
            let insulatedBoundary = true;
            let colorLUT = []; // Precomputed color lookup table (256 entries)
            let maxTempDisplay = 1.0;
            let minTempDisplay = -0.05;

            // ────────────────────────────────────────
            // CREATE 2D FLOAT ARRAY
            // ────────────────────────────────────────
            function createGrid(val = 0) {
                const arr = new Array(GRID_SIZE);
                for (let i = 0; i < GRID_SIZE; i++) {
                    arr[i] = new Float32Array(GRID_SIZE);
                    if (val !== 0) arr[i].fill(val);
                }
                return arr;
            }

            // ────────────────────────────────────────
            // BUILD COLOR LOOKUP TABLE
            // ────────────────────────────────────────
            function buildColorLUT() {
                colorLUT = [];
                for (let i = 0; i < 256; i++) {
                    const t = i / 255;
                    let r, g, b;
                    if (t < 0.15) {
                        const s = t / 0.15;
                        r = p.lerp(10, 30, s);
                        g = p.lerp(10, 20, s);
                        b = p.lerp(50, 120, s);
                    } else if (t < 0.35) {
                        const s = (t - 0.15) / 0.2;
                        r = p.lerp(30, 150, s);
                        g = p.lerp(20, 25, s);
                        b = p.lerp(120, 100, s);
                    } else if (t < 0.55) {
                        const s = (t - 0.35) / 0.2;
                        r = p.lerp(150, 220, s);
                        g = p.lerp(25, 50, s);
                        b = p.lerp(100, 50, s);
                    } else if (t < 0.72) {
                        const s = (t - 0.55) / 0.17;
                        r = p.lerp(220, 245, s);
                        g = p.lerp(50, 140, s);
                        b = p.lerp(50, 30, s);
                    } else if (t < 0.88) {
                        const s = (t - 0.72) / 0.16;
                        r = p.lerp(245, 255, s);
                        g = p.lerp(140, 210, s);
                        b = p.lerp(30, 60, s);
                    } else {
                        const s = (t - 0.88) / 0.12;
                        r = p.lerp(255, 255, s);
                        g = p.lerp(210, 245, s);
                        b = p.lerp(60, 210, s);
                    }
                    colorLUT.push({ r: p.constrain(r, 0, 255), g: p.constrain(g, 0, 255), b: p.constrain(b, 0,
                            255) });
                }
            }

            // ────────────────────────────────────────
            // GET COLOR FOR TEMPERATURE
            // ────────────────────────────────────────
            function getColorForTemp(temp) {
                const range = maxTempDisplay - minTempDisplay;
                if (range < 0.001) return colorLUT[0];
                let idx = Math.floor(((temp - minTempDisplay) / range) * 255);
                idx = p.constrain(idx, 0, 255);
                return colorLUT[idx];
            }

            // ────────────────────────────────────────
            // APPLY HEAT SOURCE AT GRID POSITION
            // ────────────────────────────────────────
            function applyHeatAt(gx, gy, radius, targetTemp) {
                const r = Math.max(1, Math.floor(radius));
                for (let di = -r; di <= r; di++) {
                    for (let dj = -r; dj <= r; dj++) {
                        const ni = gx + di;
                        const nj = gy + dj;
                        if (ni < 0 || ni >= GRID_SIZE || nj < 0 || nj >= GRID_SIZE) continue;
                        const dist = Math.sqrt(di * di + dj * dj);
                        if (dist > r) continue;
                        const weight = Math.exp(-dist * dist / (r * r * 0.35));
                        temperature[ni][nj] = p.lerp(temperature[ni][nj], targetTemp, weight);
                        // Also update conductivity to selected material
                        conductivity[ni][nj] = p.lerp(conductivity[ni][nj],
                            materialPresets[selectedMaterial].alpha, weight * 0.8);
                    }
                }
            }

            // ────────────────────────────────────────
            // COMPUTE LAPLACIAN WITH VARIABLE α
            // ────────────────────────────────────────
            function computeLaplacian(i, j) {
                const T = temperature;
                const alpha = conductivity;
                const cx = alpha[i][j];

                // Harmonic mean of conductivities at interfaces
                const alphaE = (i < GRID_SIZE - 1) ?
                    2 * cx * alpha[i + 1][j] / (cx + alpha[i + 1][j] + 0.0001) : 0;
                const alphaW = (i > 0) ?
                    2 * cx * alpha[i - 1][j] / (cx + alpha[i - 1][j] + 0.0001) : 0;
                const alphaS = (j < GRID_SIZE - 1) ?
                    2 * cx * alpha[i][j + 1] / (cx + alpha[i][j + 1] + 0.0001) : 0;
                const alphaN = (j > 0) ?
                    2 * cx * alpha[i][j - 1] / (cx + alpha[i][j - 1] + 0.0001) : 0;

                // Flux differences
                const fluxE = (i < GRID_SIZE - 1) ? alphaE * (T[i + 1][j] - T[i][j]) : 0;
                const fluxW = (i > 0) ? alphaW * (T[i][j] - T[i - 1][j]) : 0;
                const fluxS = (j < GRID_SIZE - 1) ? alphaS * (T[i][j + 1] - T[i][j]) : 0;
                const fluxN = (j > 0) ? alphaN * (T[i][j] - T[i][j - 1]) : 0;

                return fluxE - fluxW + fluxS - fluxN;
            }

            // ────────────────────────────────────────
            // SINGLE DIFFUSION SUBSTEP
            // ────────────────────────────────────────
            function diffusionSubstep(dt) {
                // Compute max alpha for stability check
                let maxAlpha = 0;
                for (let i = 0; i < GRID_SIZE; i++)
                    for (let j = 0; j < GRID_SIZE; j++)
                        if (conductivity[i][j] > maxAlpha) maxAlpha = conductivity[i][j];

                const dtMax = 0.24 / (Math.max(maxAlpha, 0.001) * 4.0);
                const actualDt = Math.min(dt, dtMax);

                // Compute new temperatures
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const lap = computeLaplacian(i, j);
                        newTemperature[i][j] = temperature[i][j] + actualDt * lap;
                    }
                }

                // Swap buffers
                const temp = temperature;
                temperature = newTemperature;
                newTemperature = temp;

                // Apply boundary conditions
                applyBoundaryConditions();

                // Gentle cooling toward ambient (simulates radiative loss)
                const coolingRate = 0.003 * actualDt;
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        temperature[i][j] += (AMBIENT_TEMP - temperature[i][j]) * coolingRate;
                    }
                }
            }

            // ────────────────────────────────────────
            // BOUNDARY CONDITIONS
            // ────────────────────────────────────────
            function applyBoundaryConditions() {
                if (insulatedBoundary) {
                    // Neumann: zero gradient at edges (mirror)
                    for (let j = 0; j < GRID_SIZE; j++) {
                        temperature[0][j] = temperature[1][j];
                        temperature[GRID_SIZE - 1][j] = temperature[GRID_SIZE - 2][j];
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        temperature[i][0] = temperature[i][1];
                        temperature[i][GRID_SIZE - 1] = temperature[i][GRID_SIZE - 2];
                    }
                } else {
                    // Dirichlet: fixed ambient temperature at edges
                    for (let j = 0; j < GRID_SIZE; j++) {
                        temperature[0][j] = AMBIENT_TEMP;
                        temperature[GRID_SIZE - 1][j] = AMBIENT_TEMP;
                    }
                    for (let i = 0; i < GRID_SIZE; i++) {
                        temperature[i][0] = AMBIENT_TEMP;
                        temperature[i][GRID_SIZE - 1] = AMBIENT_TEMP;
                    }
                }
            }

            // ────────────────────────────────────────
            // UPDATE DISPLAY TEMPERATURE RANGE
            // ────────────────────────────────────────
            function updateDisplayRange() {
                let maxT = -Infinity;
                let minT = Infinity;
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        if (temperature[i][j] > maxT) maxT = temperature[i][j];
                        if (temperature[i][j] < minT) minT = temperature[i][j];
                    }
                }
                const targetMax = Math.max(0.5, maxT * 1.05);
                const targetMin = Math.min(-0.03, minT * 0.9);
                maxTempDisplay += (targetMax - maxTempDisplay) * 0.15;
                minTempDisplay += (targetMin - minTempDisplay) * 0.15;
                if (maxTempDisplay < 0.5) maxTempDisplay = 0.5;
                if (minTempDisplay > -0.02) minTempDisplay = -0.02;
            }

            // ────────────────────────────────────────
            // RENDER TO CANVAS VIA PIXEL ARRAY
            // ────────────────────────────────────────
            function renderGrid() {
                p.loadPixels();
                const pixels = p.pixels;
                for (let i = 0; i < GRID_SIZE; i++) {
                    for (let j = 0; j < GRID_SIZE; j++) {
                        const col = getColorForTemp(temperature[i][j]);
                        const startX = i * CELL_PX;
                        const startY = j * CELL_PX;
                        for (let px = 0; px < CELL_PX; px++) {
                            for (let py = 0; py < CELL_PX; py++) {
                                const idx = 4 * ((startY + py) * CANVAS_SIZE + (startX + px));
                                pixels[idx] = col.r;
                                pixels[idx + 1] = col.g;
                                pixels[idx + 2] = col.b;
                                pixels[idx + 3] = 255;
                            }
                        }
                    }
                }
                p.updatePixels();
            }

            // ────────────────────────────────────────
            // RENDER CONDUCTIVITY OVERLAY (subtle)
            // ────────────────────────────────────────
            function renderConductivityOverlay() {
                // Draw subtle dot pattern where conductivity differs from default
                const defaultAlpha = materialPresets[0].alpha;
                for (let i = 0; i < GRID_SIZE; i += 4) {
                    for (let j = 0; j < GRID_SIZE; j += 4) {
                        const alpha = conductivity[Math.min(i, GRID_SIZE - 1)][Math.min(j, GRID_SIZE - 1)];
                        if (Math.abs(alpha - defaultAlpha) > 0.05) {
                            const mat = materialPresets.find(m => Math.abs(m.alpha - alpha) < 0.03);
                            if (mat) {
                                p.fill(mat.color[0], mat.color[1], mat.color[2], 40);
                                p.noStroke();
                                p.ellipse(i * CELL_PX + CELL_PX / 2, j * CELL_PX + CELL_PX / 2, 3, 3);
                            }
                        }
                    }
                }
            }

            // ────────────────────────────────────────
            // P5.JS SETUP
            // ────────────────────────────────────────
            p.setup = function() {
                const canvas = p.createCanvas(CANVAS_SIZE, CANVAS_SIZE);
                canvas.parent('canvas-container');
                p.frameRate(60);
                p.noStroke();
                p.pixelDensity(1);

                buildColorLUT();
                resetSimulation();
                updateUI();
            };

            function resetSimulation() {
                temperature = createGrid(AMBIENT_TEMP);
                conductivity = createGrid(materialPresets[0].alpha);
                newTemperature = createGrid(0);
                maxTempDisplay = 1.0;
                minTempDisplay = -0.05;
                selectedMaterial = 0;
                heatMode = true;
                speedMultiplier = 1.0;
                insulatedBoundary = true;
                updateUI();
            }

            // ────────────────────────────────────────
            // P5.JS DRAW
            // ────────────────────────────────────────
            p.draw = function() {
                // ── Mouse interaction ────────────────
                if (p.mouseIsPressed && p.mouseX >= 0 && p.mouseX < CANVAS_SIZE && p.mouseY >= 0 && p.mouseY <
                    CANVAS_SIZE) {
                    const gx = Math.floor(p.mouseX / CELL_PX);
                    const gy = Math.floor(p.mouseY / CELL_PX);
                    const targetTemp = heatMode ? 1.2 : -0.4;
                    applyHeatAt(gx, gy, 3.5, targetTemp);
                }

                // ── Physics substeps ────────────────
                const numSubsteps = Math.max(1, Math.floor(speedMultiplier * 6));
                const dtPerSubstep = 0.04 * speedMultiplier / numSubsteps;
                for (let s = 0; s < numSubsteps; s++) {
                    diffusionSubstep(dtPerSubstep);
                }

                // ── Update display range ────────────
                if (p.frameCount % 15 === 0) {
                    updateDisplayRange();
                }

                // ── Render ──────────────────────────
                renderGrid();
                renderConductivityOverlay();

                // ── Crosshair cursor indicator ──────
                if (p.mouseX >= 0 && p.mouseX < CANVAS_SIZE && p.mouseY >= 0 && p.mouseY < CANVAS_SIZE) {
                    const gx = Math.floor(p.mouseX / CELL_PX) * CELL_PX + CELL_PX / 2;
                    const gy = Math.floor(p.mouseY / CELL_PX) * CELL_PX + CELL_PX / 2;
                    p.stroke(heatMode ? 255 : 150, heatMode ? 200 : 200, heatMode ? 120 : 255, 180);
                    p.strokeWeight(1.5);
                    p.noFill();
                    p.ellipse(gx, gy, CELL_PX * 6, CELL_PX * 6);
                    p.strokeWeight(0.8);
                    p.ellipse(gx, gy, CELL_PX * 3, CELL_PX * 3);
                    p.noStroke();
                }

                // ── FPS display ─────────────────────
                p.fill(255, 255, 255, 180);
                p.textSize(9);
                p.textAlign(p.LEFT);
                p.text(p.nf(p.frameRate(), 2, 0) + ' fps', 8, 16);
                p.text('max: ' + p.nf(maxTempDisplay, 1, 2), 8, 30);
            };

            // ────────────────────────────────────────
            // KEYBOARD HANDLING
            // ────────────────────────────────────────
            p.keyPressed = function() {
                const key = p.key.toLowerCase();
                if (key === '1') { selectedMaterial = 0;
                    updateUI(); }
                if (key === '2') { selectedMaterial = 1;
                    updateUI(); }
                if (key === '3') { selectedMaterial = 2;
                    updateUI(); }
                if (key === '4') { selectedMaterial = 3;
                    updateUI(); }
                if (key === 'shift') { heatMode = false;
                    updateUI(); }
                if (key === 'b') { insulatedBoundary = !insulatedBoundary;
                    updateUI(); }
                if (key === 'r') { resetSimulation(); }
                if (key === 'c') { clearHeat(); }
                if (key === 'arrowup') { speedMultiplier = Math.min(5.0, speedMultiplier + 0.25);
                    updateUI(); }
                if (key === 'arrowdown') { speedMultiplier = Math.max(0.25, speedMultiplier - 0.25);
                    updateUI(); }
                return false;
            };

            p.keyReleased = function() {
                if (p.key.toLowerCase() === 'shift') { heatMode = true;
                    updateUI(); }
                return false;
            };

            function clearHeat() {
                for (let i = 0; i < GRID_SIZE; i++)
                    for (let j = 0; j < GRID_SIZE; j++)
                        temperature[i][j] = AMBIENT_TEMP;
                maxTempDisplay = 1.0;
                minTempDisplay = -0.05;
            }

            // ────────────────────────────────────────
            // UI UPDATE
            // ────────────────────────────────────────
            function updateUI() {
                document.getElementById('mode-indicator').textContent = heatMode ? 'HEAT' : 'COOL';
                document.getElementById('mode-indicator').className = 'mode-indicator ' + (heatMode ?
                    'mode-heat' : 'mode-cool');
                document.getElementById('material-name').textContent = materialPresets[selectedMaterial].name;
                document.getElementById('conductivity-val').textContent = materialPresets[selectedMaterial].alpha
                    .toFixed(2);
                document.getElementById('speed-val').textContent = speedMultiplier.toFixed(2) + '×';
                document.getElementById('boundary-val').textContent = insulatedBoundary ? 'Insulated' :
                    'Fixed Temp';
            }

            // ────────────────────────────────────────
            // BUTTON HANDLERS
            // ────────────────────────────────────────
            document.getElementById('reset-btn').addEventListener('click', resetSimulation);

            // ────────────────────────────────────────
            // PREVENT DEFAULT SCROLL ON ARROW KEYS
            // ────────────────────────────────────────
            window.addEventListener('keydown', function(e) {
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                    e.preventDefault();
                }
            }, { passive: false });

            console.log('🔥 Heat Diffusion Simulation Ready!');
            console.log('   🖱️ Drag = heat · Shift+Drag = cool');
            console.log('   1-4 = materials · ↑↓ = speed · B = boundary · R = reset · C = clear');
        });
    </script>
</body>
</html>
