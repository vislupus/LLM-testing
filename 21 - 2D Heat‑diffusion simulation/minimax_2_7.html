<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Heat Diffusion Simulation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a12;
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.75);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,100,50,0.3);
            z-index: 100;
            max-width: 260px;
            line-height: 1.7;
        }
        #info h2 {
            font-size: 15px;
            margin-bottom: 10px;
            color: #ff8866;
            font-weight: 600;
        }
        #info .key {
            display: inline-block;
            background: rgba(255,136,102,0.2);
            padding: 2px 7px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            margin: 0 2px;
            border: 1px solid rgba(255,136,102,0.3);
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.85);
            font-size: 12px;
            background: rgba(0,0,0,0.75);
            padding: 15px 20px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,100,50,0.3);
            z-index: 100;
            width: 200px;
        }
        #controls h3 {
            font-size: 13px;
            color: #ff8866;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .slider-group {
            margin: 10px 0;
        }
        .slider-group label {
            display: block;
            margin-bottom: 5px;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
        }
        .slider-value {
            float: right;
            color: #ff8866;
            font-family: monospace;
        }
        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: rgba(255,136,102,0.2);
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #ff8866;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,136,102,0.5);
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .btn {
            background: rgba(255,136,102,0.2);
            border: 1px solid rgba(255,136,102,0.4);
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .btn:hover {
            background: rgba(255,136,102,0.4);
        }
        .btn.active {
            background: rgba(255,136,102,0.6);
            border-color: #ff8866;
        }
        #stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            font-family: monospace;
        }
        .preset-info {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,136,102,0.2);
            font-size: 10px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div id="info">
        <h2>Heat Diffusion Simulation</h2>
        <p><span class="key">Click</span> Add heat source</p>
        <p><span class="key">Shift+Click</span> Cool region</p>
        <p><span class="key">H</span> Toggle heat mode</p>
        <p><span class="key">C</span> Toggle cool mode</p>
        <p><span class="key">R</span> Reset temperature</p>
        <p><span class="key">M</span> Cycle materials</p>
        <p><span class="key">B</span> Toggle boundary</p>
        <p><span class="key">Space</span> Auto sources</p>
    </div>

    <div id="controls">
        <h3>Parameters</h3>
        <div class="slider-group">
            <label>Diffusion Rate (α)<span class="slider-value" id="diffVal">0.2</span></label>
            <input type="range" id="diffusionSlider" min="0.01" max="0.5" step="0.01" value="0.2">
        </div>
        <div class="slider-group">
            <label>Heat Strength<span class="slider-value" id="heatVal">80</span></label>
            <input type="range" id="heatSlider" min="10" max="100" step="1" value="80">
        </div>
        <div class="slider-group">
            <label>Cool Strength<span class="slider-value" id="coolVal">-60</span></label>
            <input type="range" id="coolSlider" min="-100" max="-10" step="1" value="-60">
        </div>
        <div class="slider-group">
            <label>Convection<span class="slider-value" id="convVal">0.0</span></label>
            <input type="range" id="convectionSlider" min="0" max="0.05" step="0.001" value="0">
        </div>
        <div class="slider-group">
            <label>Resolution<span class="slider-value" id="resVal">100</span></label>
            <input type="range" id="resolutionSlider" min="50" max="200" step="10" value="100">
        </div>

        <div class="preset-info">
            Current Material: <span id="materialName">Copper</span>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="resetSimulation()">Reset</button>
            <button class="btn" onclick="cycleMaterial()">Material</button>
            <button class="btn" onclick="toggleBoundary()">Boundary</button>
            <button class="btn" onclick="toggleAuto()">Auto</button>
        </div>
    </div>

    <div id="stats">
        <span id="fps">FPS: 60</span> | <span id="maxTemp">Max: 0°C</span> | <span id="minTemp">Min: 0°C</span>
    </div>

    <script>
        // ============================================
        // HEAT DIFFUSION SIMULATION
        // Finite Difference Method (Explicit)
        // Solves: ∂T/∂t = α∇²T + convection
        // ============================================

        // Simulation parameters
        let gridSize = 100;
        let temperature = [];
        let conductivity = [];
        let tempBuffer = [];
        let canvas;

        // Material properties (thermal conductivity)
        const materials = {
            'Copper': { k: 1.0, color: '#ff8844', heatCap: 0.9 },
            'Aluminum': { k: 0.8, color: '#88aaff', heatCap: 0.85 },
            'Steel': { k: 0.4, color: '#aaaaaa', heatCap: 0.7 },
            'Stone': { k: 0.2, color: '#aa8866', heatCap: 0.6 },
            'Wood': { k: 0.1, color: '#88ff88', heatCap: 0.5 },
            'Insulator': { k: 0.05, color: '#ffffff', heatCap: 0.3 }
        };
        let currentMaterial = 'Copper';

        // Physics parameters
        let diffusionRate = 0.2;
        let heatStrength = 80;
        let coolStrength = -60;
        let convection = 0;

        // Interaction modes
        let heatMode = true;
        let coolMode = false;
        let boundaryType = 'insulated'; // 'insulated' or 'fixed'
        let autoSources = false;

        // Heat sources
        let heatSources = [];

        // Heatmap colors
        let heatColors = [];

        // ============================================
        // SETUP
        // ============================================
        function setup() {
            canvas = createCanvas(windowWidth, windowHeight);
            pixelDensity(1);

            initializeSimulation();
            createHeatmapColors();
            setupEventListeners();

            frameRate(60);
        }

        function initializeSimulation() {
            temperature = [];
            tempBuffer = [];
            conductivity = [];

            const materialProps = materials[currentMaterial];

            for (let i = 0; i < gridSize; i++) {
                temperature[i] = [];
                tempBuffer[i] = [];
                conductivity[i] = [];

                for (let j = 0; j < gridSize; j++) {
                    // Initialize with room temperature (20°C)
                    temperature[i][j] = 20;
                    tempBuffer[i][j] = 20;

                    // Set conductivity based on material (with some variation)
                    conductivity[i][j] = materialProps.k * (0.9 + Math.random() * 0.2);
                }
            }

            // Add initial heat sources
            heatSources = [
                { x: gridSize * 0.3, y: gridSize * 0.5, temp: 100, radius: 5 },
                { x: gridSize * 0.7, y: gridSize * 0.5, temp: 100, radius: 5 }
            ];
        }

        function createHeatmapColors() {
            // Create color gradient: blue (cold) -> cyan -> green -> yellow -> orange -> red (hot)
            heatColors = [];
            const stops = [
                { pos: 0, r: 0, g: 0, b: 255 },      // Blue (cold)
                { pos: 0.2, r: 0, g: 255, b: 255 },   // Cyan
                { pos: 0.4, r: 0, g: 255, b: 0 },     // Green
                { pos: 0.6, r: 255, g: 255, b: 0 },   // Yellow
                { pos: 0.8, r: 255, g: 128, b: 0 },   // Orange
                { pos: 1.0, r: 255, g: 0, b: 0 }      // Red (hot)
            ];

            for (let i = 0; i <= 255; i++) {
                const t = i / 255;
                let c1, c2;

                for (let j = 0; j < stops.length - 1; j++) {
                    if (t >= stops[j].pos && t <= stops[j + 1].pos) {
                        c1 = stops[j];
                        c2 = stops[j + 1];
                        break;
                    }
                }

                const localT = (t - c1.pos) / (c2.pos - c1.pos);
                heatColors.push({
                    r: lerp(c1.r, c2.r, localT),
                    g: lerp(c1.g, c2.g, localT),
                    b: lerp(c1.b, c2.b, localT)
                });
            }
        }

        function setupEventListeners() {
            // Sliders
            document.getElementById('diffusionSlider').addEventListener('input', (e) => {
                diffusionRate = parseFloat(e.target.value);
                document.getElementById('diffVal').textContent = diffusionRate.toFixed(2);
            });

            document.getElementById('heatSlider').addEventListener('input', (e) => {
                heatStrength = parseFloat(e.target.value);
                document.getElementById('heatVal').textContent = heatStrength;
            });

            document.getElementById('coolSlider').addEventListener('input', (e) => {
                coolStrength = parseFloat(e.target.value);
                document.getElementById('coolVal').textContent = coolStrength;
            });

            document.getElementById('convectionSlider').addEventListener('input', (e) => {
                convection = parseFloat(e.target.value);
                document.getElementById('convVal').textContent = convection.toFixed(3);
            });

            document.getElementById('resolutionSlider').addEventListener('input', (e) => {
                gridSize = parseInt(e.target.value);
                document.getElementById('resVal').textContent = gridSize;
                initializeSimulation();
            });
        }

        // ============================================
        // SIMULATION STEP
        // ============================================
        function updateSimulation() {
            const dt = 0.5; // Time step
            const dx = 1;   // Grid spacing
            const dy = 1;

            // Copy current temperature to buffer
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    tempBuffer[i][j] = temperature[i][j];
                }
            }

            // Apply heat sources
            for (let src of heatSources) {
                applyHeatSource(src.x, src.y, src.temp, src.radius);
            }

            // Finite difference update
            for (let i = 1; i < gridSize - 1; i++) {
                for (let j = 1; j < gridSize - 1; j++) {
                    const k = conductivity[i][j];
                    const T = temperature[i][j];

                    // Laplacian (∇²T)
                    const laplacian = (
                        (temperature[i + 1][j] - 2 * T + temperature[i - 1][j]) / (dx * dx) +
                        (temperature[i][j + 1] - 2 * T + temperature[i][j - 1]) / (dy * dy)
                    );

                    // Heat equation: ∂T/∂t = α∇²T
                    // Add convection: upward flow for hot air
                    const convTerm = convection * (temperature[i][j] - temperature[i][j - 1]);

                    // Update temperature
                    const newTemp = T + diffusionRate * k * laplacian * dt + convTerm * dt;

                    // Store in buffer (to avoid affecting neighbors in same step)
                    tempBuffer[i][j] = newTemp;
                }
            }

            // Handle boundary conditions
            applyBoundaryConditions();

            // Copy buffer back to temperature
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    temperature[i][j] = tempBuffer[i][j];
                }
            }

            // Natural cooling (lose heat to environment)
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    temperature[i][j] *= 0.9995; // Slight cooling
                }
            }
        }

        function applyHeatSource(x, y, temp, radius) {
            for (let i = -radius; i <= radius; i++) {
                for (let j = -radius; j <= radius; j++) {
                    const xi = Math.floor(x + i);
                    const yj = Math.floor(y + j);

                    if (xi >= 0 && xi < gridSize && yj >= 0 && yj < gridSize) {
                        const dist = Math.sqrt(i * i + j * j);
                        if (dist <= radius) {
                            const factor = 1 - (dist / radius);
                            tempBuffer[xi][yj] = Math.max(tempBuffer[xi][yj], temp * factor);
                        }
                    }
                }
            }
        }

        function applyBoundaryConditions() {
            if (boundaryType === 'fixed') {
                // Fixed temperature boundaries (edges stay at 20°C)
                for (let i = 0; i < gridSize; i++) {
                    tempBuffer[i][0] = 20;
                    tempBuffer[i][gridSize - 1] = 20;
                    tempBuffer[0][i] = 20;
                    tempBuffer[gridSize - 1][i] = 20;
                }
            } else {
                // Insulated boundaries (zero flux)
                for (let i = 0; i < gridSize; i++) {
                    tempBuffer[i][0] = tempBuffer[i][1];
                    tempBuffer[i][gridSize - 1] = tempBuffer[i][gridSize - 2];
                    tempBuffer[0][i] = tempBuffer[1][i];
                    tempBuffer[gridSize - 1][i] = tempBuffer[gridSize - 2][i];
                }
            }
        }

        // ============================================
        // RENDERING
        // ============================================
        function draw() {
            // Update simulation multiple times for faster dynamics
            for (let i = 0; i < 3; i++) {
                updateSimulation();
            }

            // Auto add heat sources
            if (autoSources && frameCount % 60 === 0) {
                addRandomSource();
            }

            // Render
            background(10, 10, 18);

            const cellSize = min(width, height) * 0.75 / gridSize;
            const offsetX = (width - gridSize * cellSize) / 2;
            const offsetY = (height - gridSize * cellSize) / 2;

            noStroke();

            // Find temperature range for normalization
            let minT = Infinity, maxT = -Infinity;
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    minT = Math.min(minT, temperature[i][j]);
                    maxT = Math.max(maxT, temperature[i][j]);
                }
            }

            // Draw temperature grid
            loadPixels();
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    const temp = temperature[i][j];

                    // Normalize temperature to 0-255 range
                    const range = maxT - minT || 1;
                    const normalized = (temp - minT) / range;
                    const colorIndex = Math.floor(normalized * 255);
                    const c = heatColors[Math.max(0, Math.min(255, colorIndex))];

                    // Draw pixel
                    const px = floor(offsetX + i * cellSize);
                    const py = floor(offsetY + j * cellSize);

                    fill(c.r, c.g, c.b);
                    rect(px, py, ceil(cellSize), ceil(cellSize));
                }
            }

            // Draw material texture overlay (subtle)
            drawMaterialOverlay(offsetX, offsetY, cellSize);

            // Draw heat source indicators
            drawHeatSources(offsetX, offsetY, cellSize);

            // Draw boundary indicator
            if (boundaryType === 'fixed') {
                stroke(255, 255, 255, 100);
                strokeWeight(2);
                noFill();
                rect(offsetX, offsetY, gridSize * cellSize, gridSize * cellSize);
            }

            // Draw temperature scale
            drawTemperatureScale();

            // Update stats
            document.getElementById('fps').textContent = `FPS: ${floor(frameRate())}`;
            document.getElementById('maxTemp').textContent = `Max: ${maxT.toFixed(1)}°C`;
            document.getElementById('minTemp').textContent = `Min: ${minT.toFixed(1)}°C`;
        }

        function drawMaterialOverlay(offsetX, offsetY, cellSize) {
            const materialProps = materials[currentMaterial];
            const baseColor = color(materialProps.color);

            // Subtle material indicator at edges
            noStroke();
            for (let i = 0; i < gridSize; i += 5) {
                for (let j = 0; j < gridSize; j += 5) {
                    const c = conductivity[i][j];
                    const alpha = map(c, 0.05, 1.0, 5, 20);
                    fill(red(baseColor), green(baseColor), blue(baseColor), alpha);
                    rect(offsetX + i * cellSize, offsetY + j * cellSize, cellSize * 5, cellSize * 5);
                }
            }
        }

        function drawHeatSources(offsetX, offsetY, cellSize) {
            noStroke();

            for (let src of heatSources) {
                // Glow effect
                const x = offsetX + src.x * cellSize;
                const y = offsetY + src.y * cellSize;
                const glowSize = src.radius * cellSize * 3;

                for (let r = glowSize; r > 0; r -= cellSize) {
                    const alpha = map(r, 0, glowSize, 100, 0);
                    fill(255, 100, 50, alpha);
                    ellipse(x, y, r * 2);
                }

                // Core
                fill(255, 255, 200);
                ellipse(x, y, src.radius * cellSize * 0.5);
            }
        }

        function drawTemperatureScale() {
            const scaleWidth = 20;
            const scaleHeight = 200;
            const x = width - 60;
            const y = (height - scaleHeight) / 2;

            // Draw scale background
            noStroke();
            fill(0, 0, 0, 150);
            rect(x - 5, y - 5, scaleWidth + 40, scaleHeight + 10, 5);

            // Draw gradient
            for (let i = 0; i < scaleHeight; i++) {
                const t = 1 - i / scaleHeight;
                const colorIndex = Math.floor(t * 255);
                const c = heatColors[Math.max(0, Math.min(255, colorIndex))];
                fill(c.r, c.g, c.b);
                rect(x, y + i, scaleWidth, 1);
            }

            // Labels
            fill(255);
            textSize(10);
            textAlign(LEFT, CENTER);

            let minT = Infinity, maxT = -Infinity;
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    minT = Math.min(minT, temperature[i][j]);
                    maxT = Math.max(maxT, temperature[i][j]);
                }
            }

            text(`${maxT.toFixed(0)}°C`, x + scaleWidth + 5, y);
            text(`${minT.toFixed(0)}°C`, x + scaleWidth + 5, y + scaleHeight);
        }

        // ============================================
        // INTERACTION
        // ============================================
        function mousePressed() {
            handleMouse();
        }

        function mouseDragged() {
            handleMouse();
        }

        function handleMouse() {
            if (mouseX < 0 || mouseX > width || mouseY < 0 || mouseY > height) return;
            if (mouseX > width - 250) return; // Avoid control panel

            const cellSize = min(width, height) * 0.75 / gridSize;
            const offsetX = (width - gridSize * cellSize) / 2;
            const offsetY = (height - gridSize * cellSize) / 2;

            const gridX = (mouseX - offsetX) / cellSize;
            const gridY = (mouseY - offsetY) / cellSize;

            if (gridX >= 0 && gridX < gridSize && gridY >= 0 && gridY < gridSize) {
                const strength = mouseButton === LEFT ? heatStrength : coolStrength;

                if (keyIsDown(SHIFT) || coolMode) {
                    // Cool
                    applyHeatSource(gridX, gridY, coolStrength, 8);
                } else if (heatMode) {
                    // Heat
                    applyHeatSource(gridX, gridY, heatStrength, 8);
                }
            }
        }

        function keyPressed() {
            if (key === 'h' || key === 'H') {
                heatMode = !heatMode;
                if (heatMode) coolMode = false;
            }

            if (key === 'c' || key === 'C') {
                coolMode = !coolMode;
                if (coolMode) heatMode = false;
            }

            if (key === 'r' || key === 'R') {
                resetSimulation();
            }

            if (key === 'm' || key === 'M') {
                cycleMaterial();
            }

            if (key === 'b' || key === 'B') {
                toggleBoundary();
            }

            if (key === ' ') {
                toggleAuto();
            }
        }

        // ============================================
        // CONTROL FUNCTIONS
        // ============================================
        window.resetSimulation = function() {
            initializeSimulation();
        };

        window.cycleMaterial = function() {
            const materialKeys = Object.keys(materials);
            const currentIndex = materialKeys.indexOf(currentMaterial);
            currentMaterial = materialKeys[(currentIndex + 1) % materialKeys.length];

            // Update conductivity grid
            const materialProps = materials[currentMaterial];
            for (let i = 0; i < gridSize; i++) {
                for (let j = 0; j < gridSize; j++) {
                    conductivity[i][j] = materialProps.k * (0.9 + Math.random() * 0.2);
                }
            }

            document.getElementById('materialName').textContent = currentMaterial;
        };

        window.toggleBoundary = function() {
            boundaryType = boundaryType === 'insulated' ? 'fixed' : 'insulated';
        };

        window.toggleAuto = function() {
            autoSources = !autoSources;
        };

        function addRandomSource() {
            if (heatSources.length < 5) {
                heatSources.push({
                    x: Math.random() * gridSize,
                    y: Math.random() * gridSize,
                    temp: 80 + Math.random() * 40,
                    radius: 4 + Math.random() * 3
                });
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
        }
    </script>

<script>
/**
 * Iframe 元素高亮注入脚本
 * 需要在目标网站中引入此脚本来支持跨域 iframe 高亮功能
 *
 * 使用方法：
 * 1. 将此脚本添加到目标网站的 HTML 中
 * 2. 或通过浏览器扩展、用户脚本等方式注入
 */

(function () {
  "use strict";

  // 检查是否在 iframe 中
  if (window.self === window.top) {
    return; // 不在 iframe 中，不执行
  }

  // 检查是否已经初始化过
  if (window.__iframeHighlightInitialized) {
    return;
  }
  window.__iframeHighlightInitialized = true;
  console.log("Iframe 高亮脚本已加载");

  // 创建高亮覆盖层
  var overlay = document.createElement("div");
  overlay.id = "iframe-highlight-overlay";
  overlay.style.cssText = "\n    position: fixed;\n    top: 0;\n    left: 0;\n    width: 100vw;\n    height: 100vh;\n    pointer-events: none;\n    z-index: 999999;\n    overflow: hidden;\n  ";

  // 创建悬停高亮框（虚线边框）
  var highlightBox = document.createElement("div");
  highlightBox.id = "iframe-highlight-box";
  highlightBox.style.cssText = "\n    position: absolute;\n    border: 2px dashed #007AFF;\n    background: rgba(0, 122, 255, 0.08);\n    pointer-events: none;\n    display: none;\n    transition: all 0.1s ease;\n    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8);\n    border-radius: 2px;\n  ";

  // 创建选中节点的常驻高亮框（实线边框）
  var selectedBox = document.createElement("div");
  selectedBox.id = "iframe-selected-box";
  selectedBox.style.cssText = "\n    position: absolute;\n    border: 2px solid #007AFF;\n    pointer-events: none;\n    display: none;\n    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.9), 0 0 8px rgba(255, 107, 53, 0.4);\n    border-radius: 2px;\n    z-index: 1000000;\n  ";

  // 创建悬停标签显示
